# The zero-false-positive board gate: do the checks stay quiet on real hardware
# that is fine?
#
# Nightly rather than per-push because it fetches 47 upstream projects, some three
# hundred layouts, into half a gigabyte on disk. HAUKSBEE_REQUIRE_CORPUS=1 turns a
# missing board into a hard failure, so the job cannot degrade into a green run
# that checked nothing.

name: corpus-gate

on:
  schedule:
    # 04:00 UTC daily, after the day's pushes have settled.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: zero-false-positive gate
    runs-on: ubuntu-latest
    # Fetching and simulating three hundred layouts is not a five-minute job.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The corpus is pinned by commit in corpus.toml, so this cache key only
      # changes when the manifest does. A board changing upstream cannot
      # silently change our results.
      - name: Cache the board corpus
        id: corpus-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: board-corpus
          key: corpus-${{ hashFiles('corpus.toml') }}

      - name: Fetch the corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-corpus.sh

      # The fetch runs this itself, but a cache hit skips the fetch, and a cached
      # tree is exactly the one nobody re-examines. This is the check that catches
      # a manifest field nothing honours and an entry whose landed files stopped
      # matching its declaration, which is the class of bug that made this whole
      # job meaningless for as long as it went unnoticed.
      - name: Check the manifest still describes the corpus
        run: python3 scripts/check-corpus.py --dir board-corpus

      # Prove the corpus is there before running anything against it.
      #
      # This is not belt-and-braces. `fetch-corpus.sh` read its output directory
      # through `awk -F'\x1f'`, which the awk on a macOS box takes literally, so
      # the directory came back empty and every board landed loose in the
      # checkout while the fetch reported success. The tests then found no
      # corpus, skipped, and the job went green having examined nothing. Both
      # halves of that are fixed, and this step is what makes the fix
      # self-evident in the log: the board count is printed, and a corpus that
      # did not materialise stops the job here rather than turning into a green
      # run that checked nothing.
      - name: Check the corpus materialised
        run: |
          set -euo pipefail
          if [ ! -d board-corpus ]; then
            echo "board-corpus/ does not exist: the fetch did not land where it said it did" >&2
            exit 1
          fi
          boards=$(find board-corpus \
            \( -iname '*.kicad_pcb' -o -iname '*.kicad_sch' -o -iname '*.brd' \
               -o -iname '*.net' -o -iname '*.sch' -o -iname '*.PcbDoc' \) \
            | wc -l | tr -d ' ')
          # One .hauksbee-rev per fetched board, written by fetch-corpus.sh, at
          # whatever depth the board's `dest` puts it.
          dirs=$(find board-corpus -name .hauksbee-rev | wc -l | tr -d ' ')
          echo "corpus: $dirs fetched board(s), $boards design file(s)"
          # A full local fetch on 2026-08-04 gave 47 board directories and 850
          # design files (47 of the manifest's 50 entries; the two uConsole boards
          # and the SparkFun MicroMod nRF52840 are licence-unconfirmed and skipped
          # by default). The floors sit well under both, so a broken fetch is caught
          # without going red every time one upstream is briefly unreachable.
          if [ "$dirs" -lt 40 ] || [ "$boards" -lt 700 ]; then
            echo "the corpus is too small to gate on; refusing to report a pass" >&2
            find board-corpus -mindepth 1 -maxdepth 2 -type d >&2
            exit 1
          fi

      # Ordinary developer tests keep heavyweight external simulators optional.
      # This nightly evidence job does not: cache checksum-verified archives,
      # then prepare fresh trees and run three named firmware-through-hardware proofs. The runner rejects
      # both a non-zero command and the old false-green shape (exit 0 plus SKIP),
      # and requires the exact named test plus a one-test green summary.
      - name: Cache required simulator archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/hauksbee/simulator-archives
          key: required-sims-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-sims.sh', 'scripts/required-simulator-versions.env', 'scripts/renode-checksums.txt', 'scripts/espressif-qemu-checksums.txt') }}

      # The pinned Espressif QEMU binaries are dynamically linked against
      # pixman, SDL2 and libslirp, none of which a bare ubuntu-24.04 runner
      # carries; without them install-sims.sh cannot run `-machine help` to
      # verify the fork and reports a genuine archive as "not the fork".
      - name: Install simulator runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-0t64 libpixman-1-0 libsdl2-2.0-0 libslirp0

      - name: Run release-required firmware integrations
        run: python3 scripts/run_required_integrations.py

      # The gate below builds with --features avr, which links libsimavr;
      # provision it the same way ci.yml does or hauksbee-mcu's build script
      # fails closed before a single board is simulated.
      - name: cache the immutable simavr build prerequisite
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.hauksbee-simavr
          key: simavr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-sims.sh', 'scripts/setup-ci-simavr.sh', 'scripts/simavr-payload-provenance.sh') }}
      - name: install the immutable simavr build prerequisite
        run: scripts/setup-ci-simavr.sh

      # One test at a time, for the emulators only.
      #
      # The scratch-directory races that made this suite fail in a different
      # place on every run are fixed: every suite now names its temp directory
      # per process, and three consecutive parallel runs of the full workspace
      # are green. So this is no longer load-bearing for correctness.
      #
      # It stays because the corpus suites also drive Renode and QEMU as child
      # processes, and several of those running at once contend for real
      # resources in ways three green runs do not disprove. This job is nightly,
      # so the wall clock is cheap and a gate nobody trusts is not.
      #
      # `--nocapture` is deliberate. Every corpus gate prints a `SCANNED  <gate>:
      # N board(s)` line (hauksbee_testkit::scanned) and fails on zero, so the
      # log says what each gate covered instead of leaving a green tick to imply
      # it. Without --nocapture cargo swallows those lines on a passing test,
      # which is exactly the run you cannot audit.
      - name: Run the gate
        env:
          HAUKSBEE_CORPUS_DIR: ${{ github.workspace }}/board-corpus
          HAUKSBEE_REQUIRE_CORPUS: "1"
        run: |
          set -o pipefail
          cargo test --workspace --features avr -- --test-threads=1 --nocapture \
            2>&1 | tee corpus-gate.log

      # Lift the per-gate counts out of a 100k-line log into the run summary, so
      # "what did this gate actually look at" is the first thing on the page
      # rather than something you have to go and reconstruct.
      #
      # Not anchored to the start of the line, deliberately: with
      # `--test-threads=1` cargo writes `test <name> ... ` and leaves the line
      # open, so the first thing a test prints lands mid-line. An anchored `^SCANNED`
      # silently dropped about half the counts, which would have made this summary
      # its own small version of the problem it reports on.
      #
      # EXCEPTION, NOT RUN and NOT KNOWN-GOOD lines come along too. A gate that
      # excused a finding, did not run at all, or declined to grade itself on a
      # board is exactly what a reader of this summary needs to see next to the
      # counts rather than have to go looking for.
      - name: Per-gate board counts
        if: always()
        run: |
          {
            echo "## Boards scanned per gate"
            echo
            echo '```'
            grep -oE '(SCANNED|EXCEPTION|NOT RUN|NOT KNOWN-GOOD) .*' corpus-gate.log \
              || echo "no gate reported a count: treat this run as unaudited"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-gate-log
          path: corpus-gate.log
          retention-days: 14
