# Developer Certificate of Origin (https://developercertificate.org): every
# commit in a contributor's pull request carries a `Signed-off-by:` line for
# its author, certifying they may submit it under the repository licence
# (CONTRIBUTING.md, "Licensing of contributions"). This is the only
# contributor-assent check; there is no CLA.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    # Bots (dependabot and the like) cannot certify anything; the maintainer
    # publishes through the release mirror, not pull requests.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Every non-merge commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            name=$(git log -1 --format=%an "$sha")
            email=$(git log -1 --format=%ae "$sha")
            if ! git log -1 --format=%B "$sha" \
                | grep -iE '^Signed-off-by:' \
                | grep -qiF "<$email>"; then
              echo "::error::${sha:0:12} is missing 'Signed-off-by: $name <$email>'"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            cat <<MSG
          Every commit must be signed off by its author (the Developer
          Certificate of Origin, https://developercertificate.org).

            New commits:        git commit -s
            Fix your branch:    git rebase --signoff $BASE
                                git push --force-with-lease
            Only the last one:  git commit --amend --signoff --no-edit

          The sign-off email must match the commit author email
          (git config user.email). See CONTRIBUTING.md, "Licensing of
          contributions".
          MSG
            exit 1
          fi
