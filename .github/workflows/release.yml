# Build hauksbee release binaries and attach them to a GitHub Release on a tag.
#
# Trigger: push a tag like `v0.1.0`. The workflow builds the `hauksbee` and
# `hauksbee-ci` binaries on four native runners, packages each with
# scripts/bundle.sh into a versioned tarball (+ sha256), and uploads them as
# release assets. scripts/get-hauksbee.sh downloads, verifies the sha256, and
# installs the two binaries; the composite Action and the KiCad plugin also
# prefer these assets and fall back to building from source.
#
# ============================================================================
# LICENSING DECISION — READ THIS (W6 §6). Product- and user-facing.
# ============================================================================
# hauksbee is Apache-2.0. Its optional `avr` co-sim backend STATICALLY LINKS libsimavr,
# which is GPL-3.0. Statically linking GPL code makes the resulting BINARY a GPL
# derivative work — distributing it puts the whole download under GPL-3.0, even
# though the source stays Apache-2.0. That is a real, irreversible licensing
# consequence for anyone who `curl | bash`-installs a release.
#
# Decision: release binaries ship in the **GPL-free shape** — the renode+qemu
# backends only, no avr / no libsimavr:
#
#     cargo build --release --no-default-features --features renode,qemu
#
# AVR co-sim remains available to users who build from source and run
# `scripts/install-sims.sh --avr` (which builds GPL simavr on THEIR machine —
# their choice, their combined work, not something we distribute). The full
# GPL-encumbered shape (option A) is left below as a clearly-marked,
# commented-out variant; it is NOT the shipping default. Do not un-comment it
# without an explicit, documented decision to ship GPL binaries.
#
# ---------------------------------------------------------------------------
# GPL guard (regression check, expected GREEN): the GPL-free shape is
# genuinely avr-free. hauksbee-server's AvrMcu usage is gated on its `avr`
# feature, and every hauksbee-* path dependency in the workspace sets
# `default-features = false` with explicit per-feature forwarding (cargo cannot
# un-default a dependency from the command line, so one missing declaration
# silently re-links GPL simavr). Verified by nm: ZERO simavr / AvrMcu symbols
# in both release binaries. To keep it that way, the build step points simavr
# discovery at a nonexistent path: a clean shape never reads it, and any future
# regression that drags `avr` back into the graph panics in
# hauksbee-mcu/build.rs BEFORE any GPL code is linked. A red release on a tag
# means such a regression landed — fix the feature graph, never weaken the
# guard. Details: docs/about/release-and-licensing.md.
# ============================================================================
#
# aarch64-linux mechanism: we build NATIVELY on GitHub's `ubuntu-24.04-arm`
# runner (and Intel macOS on `macos-13`), matching the honest, tested,
# no-cross-compilation philosophy this workflow has always had. No `cross`, no
# QEMU userland emulation — every artifact is produced on its own architecture.
#
# Dependency note: the forge-* crates are vendored into this repo
# (vendor/kicad-forge; see vendor/kicad-forge/VENDORED.md), and the GPL-free
# shape links NO system libraries (no simavr, no libclang/bindgen — those are
# only reached by the avr path), so the build is self-contained with just Rust.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.1.0). Used as the bundle version."
        required: true

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  build:
    name: build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm     # native arm64 GitHub-hosted runner
            label: linux-aarch64
          - os: macos-latest         # Apple Silicon
            label: darwin-arm64
          - os: macos-13             # Intel
            label: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      # Checkout into a subdirectory; the build steps cd into it explicitly. The
      # forge-* crates are vendored inside this repo, so no sibling is needed.
      - name: Checkout hauksbee
        uses: actions/checkout@v4
        with:
          path: hauksbee

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # bundle.sh builds frontend/dist and embeds it into the binary (embed-web)
      # so `hauksbee serve` works from a bare install. That needs a JS toolchain;
      # bun covers all four matrix runners (linux x64/arm64, macOS x64/arm64).
      # Without this step bundle.sh would find no bun/npm, skip the frontend
      # build, and (absent a committed dist/) ship a binary with no web UI.
      - name: Install bun (for the embedded web UI)
        uses: oven-sh/setup-bun@v2

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            hauksbee/target
          key: release-${{ matrix.label }}-${{ hashFiles('hauksbee/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.label }}-

      # NOTE: the GPL-free shape deliberately installs NO system build deps.
      # It needs neither libsimavr (avr backend) nor libclang/bindgen. If you
      # switch to the GPL full-featured variant (option A) you must restore the
      # simavr + clang install steps — see the commented block at the bottom.

      - name: Resolve version
        id: ver
        shell: bash
        env:
          # Pass untrusted dispatch input via env (never interpolate it into the
          # script body); validate before use.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag push -> strip refs/tags/v ; manual dispatch -> the provided tag.
          raw="${INPUT_TAG:-$REF_NAME}"
          # Accept only a sane version slug; reject anything else.
          if ! printf '%s' "$raw" | grep -Eq '^v?[0-9A-Za-z._-]+$'; then
            echo "refusing suspicious version string: $raw" >&2
            exit 1
          fi
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Build GPL-free bundle (renode+qemu; refuses to link GPL simavr)
        shell: bash
        env:
          # The GPL guard (see header). If `avr` is genuinely excluded,
          # hauksbee-mcu/build.rs early-returns and ignores these paths. If it
          # leaks in, build.rs panics HERE, before any GPL code is linked —
          # so we can never accidentally build, let alone ship, a GPL binary
          # while calling it GPL-free.
          SIMAVR_INCLUDE_DIR: /nonexistent/simavr-must-not-be-linked
          SIMAVR_LIB_DIR: /nonexistent/simavr-must-not-be-linked
        run: |
          chmod +x hauksbee/scripts/*.sh
          cd hauksbee
          if ! scripts/bundle.sh \
               --no-default-features --features renode,qemu \
               --version "${{ steps.ver.outputs.version }}" \
               --target "${{ matrix.label }}" \
               --out dist; then
            echo "::error title=GPL guard tripped::The renode+qemu build pulled in the avr backend (libsimavr, GPL-3.0)."
            echo "Refusing to build a GPL-encumbered binary and label it GPL-free." >&2
            echo "A feature-graph regression re-enabled avr; see docs/about/release-and-licensing.md §2." >&2
            exit 1
          fi

      # The double-clickable macOS front door. Reuses the binaries bundle.sh
      # just built (--no-build), wraps them in Hauksbee.app with the compiled
      # Swift launcher, and zips it as `hauksbee-<version>-<label>-app.zip`
      # per the section-3 naming contract in docs/about/release-and-licensing.md.
      # The app is unsigned (see app/macos/SIGNING.md); the README states the
      # Gatekeeper caveat where the download is offered.
      - name: Build Hauksbee.app (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x hauksbee/app/macos/build-app.sh
          cd hauksbee
          app/macos/build-app.sh --no-build \
            --version "${{ steps.ver.outputs.version }}" \
            --target "${{ matrix.label }}" \
            --out dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hauksbee-${{ matrix.label }}
          path: |
            hauksbee/dist/*.tar.gz
            hauksbee/dist/*.zip
            hauksbee/dist/*.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    # Only publish a Release for an actual tag push; workflow_dispatch just
    # produces downloadable build artifacts (above).
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} dist/ \;
          ls -la dist

      - name: Verify every manifest before publishing
        shell: bash
        run: |
          # Belt-and-suspenders: re-check each sha256 the way get-hauksbee.sh
          # does (relative basename, from inside the dir) so a corrupted upload
          # never becomes a published release.
          cd dist
          for sum in *.sha256; do
            echo "checking $sum"
            sha256sum --check "$sum"
          done

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

# =============================================================================
