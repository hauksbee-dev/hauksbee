# Build hauksbee release binaries and attach them to a GitHub Release on a tag.
#
# Trigger: push a tag like `v0.1.0`. The workflow builds the `hauksbee` and
# `hauksbee-ci` binaries on macOS and Linux, packages each with scripts/bundle.sh
# into a versioned tarball (+ sha256), and uploads them as release assets, so
# users can download a prebuilt binary instead of compiling. The composite
# Action and the KiCad plugin both prefer these assets and fall back to building.
#
# Cross-compilation note: this builds natively on each runner (a macOS runner
# for the macOS artifact, a Linux runner for the Linux artifact), which is the
# honest, tested path. We deliberately do NOT cross-compile (e.g. linux->mac or
# building aarch64-linux on x86) because that is untested here and would ship
# binaries no one ran. The matrix can be extended with real runners (e.g. a
# macos-13 x86 runner, an arm64 linux runner) when they are available.
#
# Dependency note: the workspace Cargo.toml has path deps into the sibling
# kicad-forge repo (../kicad-forge/crates/forge-sexpr etc). Both repos must
# be checked out before cargo build runs. This mirrors docker.yml which also
# materialises both repos before invoking the Dockerfile build stages.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.1.0). Used as the bundle version."
        required: true

permissions:
  contents: write   # needed to create the release and upload assets

env:
  FORGE_REPO: ETM-Code/kicad-forge
  FORGE_REF: main

jobs:
  build:
    name: build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      # Checkout hauksbee into a sibling directory so the ../kicad-forge path dep
      # resolves correctly at build time. The working directory for subsequent
      # steps defaults to the repo root (GITHUB_WORKSPACE), so we cd there
      # explicitly in the build step.
      - name: Checkout hauksbee
        uses: actions/checkout@v4
        with:
          path: hauksbee

      # The workspace Cargo.toml references forge-sexpr, forge-model, and
      # forge-codegen via path = "../kicad-forge/crates/...". docker.yml handles
      # this by building inside a shared ctx/ tree; here we mirror that pattern
      # by checking out kicad-forge as a sibling of the hauksbee checkout.
      - name: Checkout kicad-forge sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORGE_REPO }}
          ref: ${{ env.FORGE_REF }}
          path: kicad-forge

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            hauksbee/target
          key: release-${{ matrix.os }}-${{ hashFiles('hauksbee/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.os }}-

      # -----------------------------------------------------------------------
      # Linux: replicate Dockerfile.slim Stage 1+2 build environment.
      # Stage 1: apt build-essential + git + libelf-dev + zlib1g-dev for simavr.
      # Stage 2: clang + libclang-dev for bindgen; build simavr from source;
      #          export the env vars the hauksbee build.rs expects.
      # -----------------------------------------------------------------------
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            libelf-dev \
            zlib1g-dev \
            clang \
            libclang-dev \
            pkg-config

      - name: Build simavr from source (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch v1.8 https://github.com/buserror/simavr.git /tmp/simavr-src
          make -C /tmp/simavr-src CC=gcc RELEASE=1 build-simavr
          sudo make -C /tmp/simavr-src CC=gcc RELEASE=1 DESTDIR=/usr/local PREFIX=/usr/local install-simavr
          sudo ldconfig

      # -----------------------------------------------------------------------
      # macOS: simavr and llvm (for libclang / bindgen) via Homebrew.
      # build.rs already sets /opt/homebrew/include/simavr in its include path;
      # LIBCLANG_PATH tells bindgen where to find libclang.dylib.
      # -----------------------------------------------------------------------
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install simavr llvm

      - name: Resolve version
        id: ver
        shell: bash
        env:
          # Pass untrusted dispatch input via env (never interpolate it into the
          # script body); validate before use.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag push -> strip refs/tags/v ; manual dispatch -> the provided tag.
          raw="${INPUT_TAG:-$REF_NAME}"
          # Accept only a sane version slug; reject anything else.
          if ! printf '%s' "$raw" | grep -Eq '^v?[0-9A-Za-z._-]+$'; then
            echo "refusing suspicious version string: $raw" >&2
            exit 1
          fi
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Build bundle (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBRARY_PATH: /usr/local/lib
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
          BINDGEN_EXTRA_CLANG_ARGS: "-I/usr/local/include -I/usr/local/include/simavr"
        run: |
          chmod +x hauksbee/scripts/*.sh
          cd hauksbee
          scripts/bundle.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --target "${{ matrix.label }}" \
            --out dist

      - name: Build bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          LIBCLANG_PATH: "/opt/homebrew/opt/llvm/lib"
        run: |
          chmod +x hauksbee/scripts/*.sh
          cd hauksbee
          scripts/bundle.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --target "${{ matrix.label }}" \
            --out dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hauksbee-${{ matrix.label }}
          path: |
            hauksbee/dist/*.tar.gz
            hauksbee/dist/*.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    # Only publish a Release for an actual tag push; workflow_dispatch just
    # produces downloadable build artifacts (above).
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} dist/ \;
          ls -la dist

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
