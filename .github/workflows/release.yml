# Build hauksbee release binaries and attach them to a GitHub Release on a tag.
#
# Trigger: push a tag like `v0.1.0`. The workflow builds the `hauksbee` and
# `hauksbee-ci` binaries on four native runners, packages each with
# scripts/bundle.sh into a versioned tarball (+ sha256), and uploads them as
# release assets. scripts/get-hauksbee.sh downloads, verifies the sha256, and
# installs the two binaries; the composite Action and the KiCad plugin also
# prefer these assets and fall back to building from source.
#
# ============================================================================
# LICENSING DECISION — READ THIS (W6 §6). Product- and user-facing.
# ============================================================================
# hauksbee is MIT. Its optional `avr` co-sim backend STATICALLY LINKS libsimavr,
# which is GPL-3.0. Statically linking GPL code makes the resulting BINARY a GPL
# derivative work — distributing it puts the whole download under GPL-3.0, even
# though the source stays MIT. That is a real, irreversible licensing
# consequence for anyone who `curl | bash`-installs a release.
#
# Decision: release binaries ship in the **MIT-clean shape** — the renode+qemu
# backends only, no avr / no libsimavr:
#
#     cargo build --release --no-default-features --features renode,qemu
#
# AVR co-sim remains available to users who build from source and run
# `scripts/install-sims.sh --avr` (which builds GPL simavr on THEIR machine —
# their choice, their combined work, not something we distribute). The full
# GPL-encumbered shape (option A) is left below as a clearly-marked,
# commented-out variant; it is NOT the shipping default. Do not un-comment it
# without an explicit, documented decision to ship GPL binaries.
#
# ---------------------------------------------------------------------------
# ⚠ KNOWN BLOCKER (as of this commit): the MIT-clean shape does NOT actually
# exclude avr in this workspace yet. `hauksbee-server` uses `hauksbee_mcu::AvrMcu`
# unconditionally and depends on hauksbee-mcu WITHOUT `default-features = false`,
# and every binary depends on hauksbee-server — so `--no-default-features
# --features renode,qemu` STILL activates `avr` and still links libsimavr
# (verified: build.rs panics for "the avr co-sim feature needs a system
# libsimavr" and nm finds 14 simavr symbols in hauksbee-ci). The fix is a
# source change (3 files) documented in docs/release-and-licensing.md and is
# OUT OF SCOPE for this release-automation change.
#
# Until that fix lands, the "Build MIT-clean bundle" step below is DESIGNED TO
# FAIL FAST rather than ship a mislabeled GPL binary: it points simavr discovery
# at a nonexistent path, so a clean shape ignores it and a leaky shape panics in
# build.rs. That is the guard. A red release on a tag today means "the GPL-free
# shape is not clean yet", not "the runner is misconfigured".
# ============================================================================
#
# aarch64-linux mechanism: we build NATIVELY on GitHub's `ubuntu-24.04-arm`
# runner (and Intel macOS on `macos-13`), matching the honest, tested,
# no-cross-compilation philosophy this workflow has always had. No `cross`, no
# QEMU userland emulation — every artifact is produced on its own architecture.
#
# Dependency note: the forge-* crates are vendored into this repo
# (vendor/kicad-forge; see vendor/kicad-forge/VENDORED.md), and the MIT-clean
# shape links NO system libraries (no simavr, no libclang/bindgen — those are
# only reached by the avr path), so the build is self-contained with just Rust.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.1.0). Used as the bundle version."
        required: true

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  build:
    name: build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm     # native arm64 GitHub-hosted runner
            label: linux-aarch64
          - os: macos-latest         # Apple Silicon
            label: darwin-arm64
          - os: macos-13             # Intel
            label: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      # Checkout into a subdirectory; the build steps cd into it explicitly. The
      # forge-* crates are vendored inside this repo, so no sibling is needed.
      - name: Checkout hauksbee
        uses: actions/checkout@v4
        with:
          path: hauksbee

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            hauksbee/target
          key: release-${{ matrix.label }}-${{ hashFiles('hauksbee/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.label }}-

      # NOTE: the MIT-clean shape deliberately installs NO system build deps.
      # It needs neither libsimavr (avr backend) nor libclang/bindgen. If you
      # switch to the GPL full-featured variant (option A) you must restore the
      # simavr + clang install steps — see the commented block at the bottom.

      - name: Resolve version
        id: ver
        shell: bash
        env:
          # Pass untrusted dispatch input via env (never interpolate it into the
          # script body); validate before use.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag push -> strip refs/tags/v ; manual dispatch -> the provided tag.
          raw="${INPUT_TAG:-$REF_NAME}"
          # Accept only a sane version slug; reject anything else.
          if ! printf '%s' "$raw" | grep -Eq '^v?[0-9A-Za-z._-]+$'; then
            echo "refusing suspicious version string: $raw" >&2
            exit 1
          fi
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Build MIT-clean bundle (renode+qemu; refuses to link GPL simavr)
        shell: bash
        env:
          # The GPL guard (see header). If `avr` is genuinely excluded,
          # hauksbee-mcu/build.rs early-returns and ignores these paths. If it
          # leaks in, build.rs panics HERE, before any GPL code is linked —
          # so we can never accidentally build, let alone ship, a GPL binary
          # while calling it MIT-clean.
          SIMAVR_INCLUDE_DIR: /nonexistent/simavr-must-not-be-linked
          SIMAVR_LIB_DIR: /nonexistent/simavr-must-not-be-linked
        run: |
          chmod +x hauksbee/scripts/*.sh
          cd hauksbee
          if ! scripts/bundle.sh \
               --no-default-features --features renode,qemu \
               --version "${{ steps.ver.outputs.version }}" \
               --target "${{ matrix.label }}" \
               --out dist; then
            echo "::error title=GPL guard tripped::The renode+qemu build still pulled in the avr backend (libsimavr, GPL-3.0)."
            echo "Refusing to build a GPL-encumbered binary and label it MIT-clean." >&2
            echo "This is the expected failure until the source fix in docs/release-and-licensing.md lands." >&2
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hauksbee-${{ matrix.label }}
          path: |
            hauksbee/dist/*.tar.gz
            hauksbee/dist/*.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    # Only publish a Release for an actual tag push; workflow_dispatch just
    # produces downloadable build artifacts (above).
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} dist/ \;
          ls -la dist

      - name: Verify every manifest before publishing
        shell: bash
        run: |
          # Belt-and-suspenders: re-check each sha256 the way get-hauksbee.sh
          # does (relative basename, from inside the dir) so a corrupted upload
          # never becomes a published release.
          cd dist
          for sum in *.sha256; do
            echo "checking $sum"
            sha256sum --check "$sum"
          done

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

# =============================================================================
