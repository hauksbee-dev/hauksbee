# Build hauksbee release binaries and attach them to a GitHub Release on a tag.
#
# Trigger: push a tag like `v0.1.0`. The workflow builds the `hauksbee`,
# `hauksbee-ci` and `hauksbee-mcp` binaries on four Unix runners plus native
# Windows x86_64. Unix legs use scripts/bundle.sh for the two licence shapes;
# Windows uses scripts/bundle-windows.ps1 for its honest permissive-only zip.
# Every asset has a sha256 sidecar. scripts/get-hauksbee.sh downloads, verifies it, and
# installs the binaries (hauksbee, hauksbee-ci, hauksbee-mcp); the composite
# Action and the KiCad plugin also
# prefer these assets and fall back to building from source.
#
# ============================================================================
# LICENSING DECISION, READ THIS. Product- and user-facing.
# ============================================================================
# hauksbee is Apache-2.0. Its optional `avr` co-sim backend STATICALLY LINKS
# libsimavr, which is GPL-3.0. Statically linking GPL code makes the resulting
# BINARY a combined work under GPL-3.0, even though the source stays
# Apache-2.0.
#
# Decision: every release ships BOTH shapes, each labelled honestly.
#
#   hauksbee-<ver>-<label>.tar.gz             DEFAULT DOWNLOAD
#     Default features: avr + renode + qemu. Genuinely links libsimavr, so the
#     binary is GPL-3.0. This is what the installer and the docs point at,
#     because AVR / ATmega is the largest slice of the audience and the
#     download they need has to exist. GPL-3.0 constrains redistribution, not
#     use, so for the person running the tool this costs nothing.
#
#   hauksbee-<ver>-<label>-permissive.tar.gz  GPL-FREE DOWNLOAD
#     --no-default-features --features renode,qemu. No avr, no libsimavr, no
#     GPL code. This is the one for redistributors, embedders and OEMs, who
#     are the people the GPL actually constrains.
#
# Each tarball carries a LICENSE-BINARY.txt written by scripts/bundle.sh
# stating which of the two it is, with the corresponding-source pointers
# GPL-3.0 section 6 requires. Neither download can be mistaken for the other.
#
# ---------------------------------------------------------------------------
# The GPL guard (permissive shape only, expected GREEN). The permissive shape
# is genuinely avr-free: hauksbee-server's AvrMcu usage is gated on its `avr`
# feature, and every hauksbee-* path dependency in the workspace sets
# `default-features = false` with explicit per-feature forwarding (cargo cannot
# un-default a dependency from the command line, so one missing declaration
# silently re-links GPL simavr). The permissive build step therefore points
# simavr discovery at a NONEXISTENT path: a clean shape never reads it, and any
# regression that drags `avr` back into the graph panics in
# hauksbee-mcu/build.rs BEFORE any GPL code is linked. Those env vars apply to
# the permissive steps ONLY; the default build must find a real libsimavr and
# link it.
#
# Both claims are proved rather than asserted, twice:
#   1. scripts/bundle.sh refuses to package a shape that is not what it says.
#      It asks the binary it just built, via `hauksbee doctor`: the avr line
#      must read `builtin` for the default shape and `disabled` for the
#      permissive one. (Note for anyone reaching for `nm` here: the workspace
#      sets `strip = true` in [profile.release], so rustc strips at link time
#      and a release binary of EITHER shape shows zero simavr symbols. Measured.
#      A symbol-table check would pass vacuously, which is worse than none.)
#   2. The "Verify the two shapes" step below re-runs that check independently
#      on the extracted tarball contents, and greps each LICENSE-BINARY.txt for
#      its licence string so the two labels cannot be swapped.
# A red release means fix the feature graph or the simavr install, never weaken
# the check. Details: docs/about/release-and-licensing.md.
# ============================================================================
#
# aarch64-linux mechanism: we build NATIVELY on GitHub's `ubuntu-24.04-arm`
# runner (and Intel macOS on `macos-15-intel`), matching the honest, tested,
# no-cross-compilation philosophy this workflow has always had. No `cross`, no
# QEMU userland emulation. Every artifact is produced on its own architecture.
#
# Dependency note: the forge-* crates are vendored into this repo
# (vendor/kicad-forge; see vendor/kicad-forge/VENDORED.md). The permissive
# shape links NO system libraries at all. The default shape needs libsimavr
# (built by scripts/install-sims.sh --avr into a writable prefix, no sudo),
# plus libelf, zlib and libclang for the bindgen step; the "Install AVR build
# dependencies" step below provides them per runner OS.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to check out and build exactly (e.g. v0.1.0)."
        required: true

permissions:
  # Build and test jobs execute third-party build scripts. They receive no
  # repository-write credential; only the final publication job can write.
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-source:
    name: capture exact release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading ci run/job conclusions for the same-SHA reuse check below.
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      ci_reuse: ${{ steps.reuse.outputs.ci_reuse }}
      ci_run_id: ${{ steps.reuse.outputs.ci_run_id }}
    steps:
      - name: Refuse tag publication from a non-canonical repository
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          [ "$GITHUB_REPOSITORY" = "hauksbee-dev/hauksbee" ] || {
            echo "release tags may publish only from hauksbee-dev/hauksbee, not $GITHUB_REPOSITORY" >&2
            exit 1
          }
      - name: Resolve the requested tag once
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Capture and validate source identity
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]] || {
            echo "refusing suspicious tag: $tag" >&2
            exit 1
          }
          source_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          [ "$source_sha" = "$tag_sha" ]
          if [ "$EVENT_NAME" != workflow_dispatch ]; then
            [ "$source_sha" = "$EVENT_SHA" ]
          fi
          version="${tag#v}"
          workspace_version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -1)"
          [ "$version" = "$workspace_version" ]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same-SHA deduplication: when a fully green candidate ci run has
      # already validated this exact commit, re-running the identical checks
      # in release-quality buys nothing. Reuse is claimed ONLY when a
      # successful ci run at source_sha has every job green (an incremental
      # run reports its scoped-out jobs as skipped, so it can never qualify)
      # and includes both native candidate gates by name. Anything less and
      # release-quality runs in full exactly as before; either way the
      # release-only contracts ci does not run still execute (in
      # release-quality-residue or release-quality). No check is lost on
      # either path.
      - name: Detect a fully green candidate ci run at the release source
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          reuse=""
          run_id=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&status=success&per_page=10" --jq '.workflow_runs[].id'); do
            jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100")"
            bad="$(printf '%s' "$jobs" | jq '[.jobs[] | select(.conclusion != "success")] | length')"
            mac="$(printf '%s' "$jobs" | jq '[.jobs[] | select(.name == "native macOS workspace candidate gate")] | length')"
            win="$(printf '%s' "$jobs" | jq '[.jobs[] | select(.name == "native Windows tests, release binary, and drag-and-drop front door")] | length')"
            if [ "$bad" = 0 ] && [ "$mac" = 1 ] && [ "$win" = 1 ]; then
              reuse=true
              run_id="$id"
              break
            fi
          done
          echo "ci_reuse=$reuse" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -n "$reuse" ]; then
            echo "release-quality is covered by fully green ci run $run_id at $SOURCE_SHA; only the release-only residue contracts will run"
          else
            echo "no fully green candidate ci run found at $SOURCE_SHA; release-quality runs in full"
          fi

  build:
    name: build ${{ matrix.label }}
    needs: resolve-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm     # native arm64 GitHub-hosted runner
            label: linux-aarch64
          - os: macos-latest         # Apple Silicon
            label: darwin-arm64
          - os: macos-15-intel       # Intel
            label: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      # Checkout into a subdirectory; the build steps cd into it explicitly. The
      # forge-* crates are vendored inside this repo, so no sibling is needed.
      - name: Checkout hauksbee
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Tag-push events are bound to the immutable event SHA. Only an
          # explicit manual dispatch resolves the requested existing tag.
          # Preserve the local tag ref: later checks bind that tag to the
          # immutable event SHA. Passing github.sha here fetches only a detached
          # depth-one commit, so refs/tags/<version> cannot be verified.
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          path: hauksbee
          persist-credentials: false

      # Release macOS assets must be signed with the real Developer ID
      # certificate. GitHub-hosted runners do not retain a maintainer's login
      # keychain, so import the PKCS#12 certificate into a throw-away keychain
      # before any build step. This is deliberately workflow-only: local
      # bundle.sh/build-app.sh invocations remain unsigned unless a developer
      # explicitly supplies HAUKSBEE_SIGN_IDENTITY.
      - name: Import macOS Developer ID credentials (release only)
        if: runner.os == 'macOS'
        shell: bash
        env:
          HAUKSBEE_SIGN_IDENTITY: ${{ secrets.HAUKSBEE_SIGN_IDENTITY }}
          HAUKSBEE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.HAUKSBEE_SIGNING_CERTIFICATE_BASE64 }}
          HAUKSBEE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.HAUKSBEE_SIGNING_CERTIFICATE_PASSWORD }}
          HAUKSBEE_NOTARY_APPLE_ID: ${{ secrets.HAUKSBEE_NOTARY_APPLE_ID }}
          HAUKSBEE_NOTARY_TEAM_ID: ${{ secrets.HAUKSBEE_NOTARY_TEAM_ID }}
          HAUKSBEE_NOTARY_PASSWORD: ${{ secrets.HAUKSBEE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            HAUKSBEE_SIGN_IDENTITY
            HAUKSBEE_SIGNING_CERTIFICATE_BASE64
            HAUKSBEE_SIGNING_CERTIFICATE_PASSWORD
            HAUKSBEE_NOTARY_APPLE_ID
            HAUKSBEE_NOTARY_TEAM_ID
            HAUKSBEE_NOTARY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing macOS release credential::$name must be configured as a protected repository or environment secret."
              exit 1
            fi
          done
          if [[ "$HAUKSBEE_SIGN_IDENTITY" == *$'\n'* ]]; then
            echo "::error title=Invalid signing identity::HAUKSBEE_SIGN_IDENTITY must be one certificate identity line."
            exit 1
          fi

          state_dir="$RUNNER_TEMP/hauksbee-signing"
          keychain="$state_dir/developer-id-signing.keychain-db"
          p12="$state_dir/developer-id-signing.p12"
          mkdir -p "$state_dir"
          chmod 700 "$state_dir"
          # The original search list is restored by the always-run cleanup
          # step. Do not print it: runner usernames and paths are unnecessary
          # release output.
          security list-keychains -d user > "$state_dir/original-keychains"
          chmod 600 "$state_dir/original-keychains"

          keychain_password="$(uuidgen | tr -d '\n')"
          [[ -n "$keychain_password" ]] || {
            echo "::error title=Keychain setup failed::uuidgen returned no temporary password."
            exit 1
          }
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          # macOS uses -D for base64 decoding (GNU runners use --decode; this
          # step intentionally runs only on macOS). The decoded file is never
          # added to GITHUB_ENV or an artifact and is removed in cleanup.
          printf '%s' "$HAUKSBEE_SIGNING_CERTIFICATE_BASE64" | base64 -D > "$p12"
          chmod 600 "$p12"
          [[ -s "$p12" ]] || {
            echo "::error title=Invalid signing certificate::the base64 P12 decoded to an empty file."
            exit 1
          }
          security import "$p12" \
            -k "$keychain" \
            -P "$HAUKSBEE_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"

          original_keychains=()
          while IFS= read -r line; do
            line="${line#\"}"
            line="${line%\"}"
            [[ -n "$line" ]] && original_keychains+=("$line")
          done < "$state_dir/original-keychains"
          security list-keychains -d user -s "$keychain" "${original_keychains[@]}"

          # Fail before the expensive build if the imported P12 does not carry
          # the exact identity requested by the release secrets.
          identities="$(security find-identity -v -p codesigning "$keychain")"
          if ! grep -F -- "$HAUKSBEE_SIGN_IDENTITY" <<< "$identities" >/dev/null; then
            echo "::error title=Signing identity not found::the imported P12 does not contain HAUKSBEE_SIGN_IDENTITY."
            exit 1
          fi

          # Only non-secret paths cross the step boundary. The signing scripts
          # discover the imported identity through the user's keychain search
          # list; the cleanup step uses this state directory to restore it.
          {
            printf 'HAUKSBEE_SIGNING_KEYCHAIN=%s\n' "$keychain"
            printf 'HAUKSBEE_SIGNING_STATE_DIR=%s\n' "$state_dir"
          } >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-03

      # bundle.sh builds frontend/dist and embeds it into the binary (embed-web)
      # so `hauksbee serve` works from a bare install. That needs a JS toolchain;
      # bun covers all four matrix runners (linux x64/arm64, macOS x64/arm64).
      # Without this step bundle.sh would find no bun/npm, skip the frontend
      # build, and (absent a committed dist/) ship a binary with no web UI.
      - name: Install bun (for the embedded web UI)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            hauksbee/target
          key: release-${{ matrix.label }}-${{ hashFiles('hauksbee/Cargo.lock', 'hauksbee/scripts/install-sims.sh', 'hauksbee/scripts/simavr-payload-provenance.sh', 'hauksbee/crates/hauksbee-mcu/build.rs') }}

      # ── system deps for the DEFAULT shape only ─────────────────────────────
      # The permissive shape needs nothing beyond Rust. The default shape links
      # libsimavr and runs bindgen over its headers, which needs libelf, zlib,
      # a C toolchain and libclang. The permissive build later in this job is
      # unaffected by anything installed here: it never looks for simavr.
      - name: Install AVR build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config libelf-dev libzstd-dev zlib1g-dev clang libclang-dev

      - name: Install AVR build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # install-sims.sh --avr brews libelf itself; pkg-config is what
          # hauksbee-mcu/build.rs probes with, and zlib.pc ships in the SDK.
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config

      # Build libsimavr into a WRITABLE prefix under $HOME (no sudo, identical
      # on every runner) and hand the build its exact location through
      # SIMAVR_INCLUDE_DIR / SIMAVR_LIB_DIR, which hauksbee-mcu/build.rs reads.
      # This is the same script users run: scripts/install-sims.sh --avr.
      - name: Build and install libsimavr (GPL-3.0, for the default shape)
        shell: bash
        run: |
          cd hauksbee
          simavr_commit="$(sed -nE 's/^SIMAVR_COMMIT="([0-9a-f]+)"$/\1/p' scripts/install-sims.sh | head -1)"
          test "${#simavr_commit}" -eq 40
          simavr_prefix="$HOME/.hauksbee-simavr/$simavr_commit"
          bash scripts/install-sims.sh --avr --prefix "$simavr_prefix"
          test -f "$simavr_prefix/include/simavr/sim_avr.h"
          test -f "$simavr_prefix/lib/libsimavr.a"
          test "$(cat "$simavr_prefix/.hauksbee-simavr-commit")" = "$simavr_commit"
          printf 'SIMAVR_INCLUDE_DIR=%s\nSIMAVR_LIB_DIR=%s\nSIMAVR_COMMIT=%s\n' \
            "$simavr_prefix/include" "$simavr_prefix/lib" "$simavr_commit" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        shell: bash
        env:
          # Pass untrusted dispatch input via env (never interpolate it into the
          # script body); validate before use.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          # Tag push -> strip refs/tags/v ; manual dispatch -> the provided tag.
          raw="${INPUT_TAG:-$REF_NAME}"
          # A release version is an existing v* tag, never a free-form label.
          if [[ ! "$raw" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "refusing suspicious version string: $raw" >&2
            exit 1
          fi
          source_sha="$(git -C hauksbee rev-parse HEAD)"
          [ "$source_sha" = "$EXPECTED_SHA" ] || {
            echo "checked-out source $source_sha does not match captured release source $EXPECTED_SHA" >&2
            exit 1
          }
          workspace_version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' hauksbee/Cargo.toml | head -1)"
          [ "${raw#v}" = "$workspace_version" ] || {
            echo "tag version ${raw#v} does not match workspace package $workspace_version" >&2
            exit 1
          }
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      # ── shape 1 of 2: the DEFAULT download (avr included, GPL-3.0 binary) ──
      # No GPL guard env here, deliberately: this build is SUPPOSED to link
      # libsimavr, and the nm step below fails the release if it did not.
      # Built first so target/release holds the default binaries when
      # build-app.sh (--no-build) picks them up for Hauksbee.app.
      - name: Build default bundle (avr+renode+qemu; GPL-3.0 binary)
        shell: bash
        env:
          # macOS legs only (bundle.sh signs on Darwin hosts and is a no-op
          # elsewhere): sign the tarball binaries and notarise them with the
          # same secrets the app step below uses. Bare Mach-Os take no staple;
          # Gatekeeper checks their notarisation ticket online. Notarisation is
          # required at launch, same as the app gate: from the launch release
          # onward these secrets must be present and the submission must pass.
          HAUKSBEE_SIGN_IDENTITY: ${{ secrets.HAUKSBEE_SIGN_IDENTITY }}
          HAUKSBEE_NOTARY_APPLE_ID: ${{ secrets.HAUKSBEE_NOTARY_APPLE_ID }}
          HAUKSBEE_NOTARY_TEAM_ID: ${{ secrets.HAUKSBEE_NOTARY_TEAM_ID }}
          HAUKSBEE_NOTARY_PASSWORD: ${{ secrets.HAUKSBEE_NOTARY_PASSWORD }}
          HAUKSBEE_REQUIRE_NOTARIZATION: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          cd hauksbee
          scripts/bundle.sh --shape default \
            --version "${{ steps.ver.outputs.version }}" \
            --target "${{ matrix.label }}" \
            --out dist

      # The double-clickable macOS front door. Reuses the DEFAULT-shape binaries
      # bundle.sh just built (--no-build), wraps them in Hauksbee.app with the
      # compiled Swift launcher, and zips it as
      # `hauksbee-<version>-<label>-app.zip` per the section-3 naming contract in
      # docs/about/release-and-licensing.md. The app therefore carries the same
      # GPL-3.0 binary as the default tarball, and can do AVR co-sim. Signing +
      # notarisation credentials come from the secrets below (see
      # app/macos/SIGNING.md); the gate step after this one refuses to let an
      # unsigned or un-notarised app zip reach the release, so a release that
      # publishes an app zip has, by construction, published a signed and
      # notarised app.
      - name: Build Hauksbee.app (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        env:
          HAUKSBEE_SIGN_IDENTITY: ${{ secrets.HAUKSBEE_SIGN_IDENTITY }}
          HAUKSBEE_NOTARY_APPLE_ID: ${{ secrets.HAUKSBEE_NOTARY_APPLE_ID }}
          HAUKSBEE_NOTARY_TEAM_ID: ${{ secrets.HAUKSBEE_NOTARY_TEAM_ID }}
          HAUKSBEE_NOTARY_PASSWORD: ${{ secrets.HAUKSBEE_NOTARY_PASSWORD }}
          HAUKSBEE_REQUIRE_NOTARIZATION: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          chmod +x hauksbee/app/macos/build-app.sh
          cd hauksbee
          app/macos/build-app.sh --no-build \
            --version "${{ steps.ver.outputs.version }}" \
            --target "${{ matrix.label }}" \
            --out dist

      # Gate: an app zip may only ship if the app inside it is signed AND
      # notarised. The public claim is "signed and notarised", and this step is
      # what makes that claim structural rather than aspirational: unsigned or
      # un-stapled builds fail the job here, before any upload step can see the
      # zip. If this fails, wire up the signing secrets per app/macos/SIGNING.md.
      - name: Gate the app zip on signing + notarisation (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd hauksbee/dist
          ZIP="hauksbee-${{ steps.ver.outputs.version }}-${{ matrix.label }}-app.zip"
          work="$(mktemp -d)"
          ditto -x -k "$ZIP" "$work"
          APP="$work/Hauksbee.app"
          fail=0
          if ! codesign --verify --deep --strict --verbose=2 "$APP"; then
            echo "::error title=Unsigned app::$ZIP contains an unsigned (or badly signed) Hauksbee.app. Set the signing secrets per app/macos/SIGNING.md; an unsigned app zip must not be released."
            fail=1
          fi
          if ! spctl -a -t exec -vv "$APP"; then
            echo "::error title=Gatekeeper rejects the app::spctl -a -t exec rejected Hauksbee.app (signed-but-unnotarised apps are rejected by policy). Complete notarisation per app/macos/SIGNING.md."
            fail=1
          fi
          if ! xcrun stapler validate "$APP"; then
            echo "::error title=No stapled ticket::Hauksbee.app has no stapled notarisation ticket. Run notarytool + stapler per app/macos/SIGNING.md."
            fail=1
          fi
          exit "$fail"

      # ── shape 2 of 2: the PERMISSIVE download (no avr, no GPL) ─────────────
      # Runs after the app step, because it overwrites target/release with
      # avr-free binaries.
      - name: Build permissive bundle (renode+qemu; refuses to link GPL simavr)
        shell: bash
        env:
          # The GPL guard (see header), permissive shape ONLY. If `avr` is
          # genuinely excluded, hauksbee-mcu/build.rs early-returns and ignores
          # these paths. If it leaks in, build.rs panics HERE, before any GPL
          # code is linked, so we can never build a GPL-encumbered binary and
          # then label it permissive.
          SIMAVR_INCLUDE_DIR: /nonexistent/simavr-must-not-be-linked
          SIMAVR_LIB_DIR: /nonexistent/simavr-must-not-be-linked
          # Same darwin signing + notarisation contract as the default bundle
          # step above; bundle.sh ignores these on non-macOS runners.
          HAUKSBEE_SIGN_IDENTITY: ${{ secrets.HAUKSBEE_SIGN_IDENTITY }}
          HAUKSBEE_NOTARY_APPLE_ID: ${{ secrets.HAUKSBEE_NOTARY_APPLE_ID }}
          HAUKSBEE_NOTARY_TEAM_ID: ${{ secrets.HAUKSBEE_NOTARY_TEAM_ID }}
          HAUKSBEE_NOTARY_PASSWORD: ${{ secrets.HAUKSBEE_NOTARY_PASSWORD }}
          HAUKSBEE_REQUIRE_NOTARIZATION: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          cd hauksbee
          if ! scripts/bundle.sh --shape permissive \
               --version "${{ steps.ver.outputs.version }}" \
               --target "${{ matrix.label }}" \
               --out dist; then
            echo "::error title=GPL guard tripped::The renode+qemu build pulled in the avr backend (libsimavr, GPL-3.0)."
            echo "Refusing to build a GPL-encumbered binary and label it permissive." >&2
            echo "A feature-graph regression re-enabled avr; see docs/about/release-and-licensing.md section 2." >&2
            exit 1
          fi

      # ── prove both labels, do not assert them ──────────────────────────────
      # scripts/bundle.sh already refused to package either shape unless it
      # matched its label, so both directions are enforced before a tarball
      # exists. This step is the independent second opinion, run on what is
      # actually about to be uploaded rather than on what was in target/release.
      #
      # It asks the binaries themselves, not their symbol tables: release
      # binaries are stripped at link time (`strip = true` in
      # [profile.release]), so `nm` finds zero simavr symbols in BOTH shapes and
      # would pass vacuously. `hauksbee doctor` reports which backends the build
      # can actually reach:
      #   default    avr <TAB> builtin  <TAB> simavr linked into this binary; source commit <sha>
      #   permissive avr <TAB> disabled <TAB> compiled out; ...
      # That line is compiled-in behaviour, not a claim in a text file, and it
      # cannot say "builtin" unless libsimavr really was linked.
      - name: Verify the two shapes (behaviour + labels)
        shell: bash
        run: |
          set -uo pipefail
          cd hauksbee/dist
          V="${{ steps.ver.outputs.version }}"
          L="${{ matrix.label }}"
          work="$(mktemp -d)"
          tar -xzf "hauksbee-$V-$L.tar.gz"            -C "$work"
          tar -xzf "hauksbee-$V-$L-permissive.tar.gz" -C "$work"
          def="$work/hauksbee-$V-$L"
          perm="$work/hauksbee-$V-$L-permissive"

          fail=0

          # `doctor` exits non-zero when an EXTERNAL backend (renode, qemu) is
          # missing, which it is on a bare runner. We only care about the avr
          # line, so capture the output and ignore the status.
          def_doctor="$("$def/bin/hauksbee" doctor 2>&1 || true)"
          perm_doctor="$("$perm/bin/hauksbee" doctor 2>&1 || true)"
          printf '%s\n' "--- default doctor ---"    "$def_doctor"
          printf '%s\n' "--- permissive doctor ---" "$perm_doctor"

          if ! printf '%s' "$def_doctor" | grep -qE '^avr[[:space:]]+builtin'; then
            echo "::error title=Default shape is not what it claims::the default binary does not report avr as builtin; libsimavr did not link, so the GPL-3.0/AVR-included label is wrong."
            fail=1
          fi
          if ! printf '%s' "$perm_doctor" | grep -qE '^avr[[:space:]]+disabled'; then
            echo "::error title=GPL leak::the permissive binary does not report avr as compiled out; it may be linking GPL libsimavr under an Apache-2.0 label."
            fail=1
          fi

          # The written labels must be present and must not have been swapped.
          grep -q 'UNDER GPL-3.0'    "$def/LICENSE-BINARY.txt" \
            || { echo "::error::default tarball LICENSE-BINARY.txt does not state GPL-3.0"; fail=1; }
          grep -q 'UNDER APACHE-2.0' "$perm/LICENSE-BINARY.txt" \
            || { echo "::error::permissive tarball LICENSE-BINARY.txt does not state Apache-2.0"; fail=1; }
          # GPL-3.0 section 4 wants the licence text travelling with the binary.
          test -s "$def/LICENSE-GPL-3.0.txt" \
            || { echo "::error::default tarball is missing LICENSE-GPL-3.0.txt"; fail=1; }
          for d in "$def" "$perm"; do
            test -s "$d/LICENSE" && test -s "$d/NOTICE" \
              || { echo "::error::$d is missing LICENSE or NOTICE"; fail=1; }
            # hauksbee-mcp ships in every bundle, both shapes.
            test -x "$d/bin/hauksbee-mcp" \
              || { echo "::error::$d is missing bin/hauksbee-mcp"; fail=1; }
          done

          # Run tracked firmware through the extracted default binary. Cargo's
          # emulator tests prove the source harness; this catches archive,
          # loader, dynamic-library, embedded-data and runtime-path defects in
          # the actual artifact about to be published.
          bash ../scripts/test-release-artifact-runtime.sh "$def/bin/hauksbee" \
            || fail=1
          bash ../scripts/test-release-artifact-runtime.sh "$perm/bin/hauksbee" permissive \
            || fail=1

          # Version parity: every binary in both shapes must attest this tag's
          # exact source commit. Publisher signatures cannot detect a stale
          # target directory assembled consistently into a signed archive.
          expected_version="${{ steps.ver.outputs.version }}"
          expected_sha="${{ steps.ver.outputs.source_sha }}"
          for d in "$def" "$perm"; do
            for b in hauksbee hauksbee-ci hauksbee-mcp; do
              actual="$("$d/bin/$b" --version)"
              expected="$b $expected_version (git $expected_sha)"
              printf '%s: %s\n' "$d/bin/$b" "$actual"
              if [ "$actual" != "$expected" ]; then
                echo "::error title=Version mismatch::$d/bin/$b reports '$actual', expected '$expected'."
                fail=1
              fi
            done
          done
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Every binary inside BOTH darwin tarballs must carry a valid
            # Developer ID signature; an unsigned darwin tarball must not be
            # released. Notarisation of these bare Mach-Os cannot be checked
            # by stapler (no bundle to staple); Gatekeeper verifies the ticket
            # online at first run. Notarisation is required at launch, same as
            # the app gate above: the bundle steps submit via notarytool and
            # fail on rejection when the notary secrets are present.
            for d in "$def" "$perm"; do
              for b in hauksbee hauksbee-ci hauksbee-mcp; do
                if ! codesign --verify --strict --verbose=2 "$d/bin/$b"; then
                  echo "::error title=Unsigned tarball binary::$d/bin/$b failed codesign --verify --strict. Set HAUKSBEE_SIGN_IDENTITY per app/macos/SIGNING.md; an unsigned darwin tarball must not be released."
                  fail=1
                fi
              done
            done
            appwork="$(mktemp -d)"
            ditto -x -k "hauksbee-$V-$L-app.zip" "$appwork"
            APPRES="$appwork/Hauksbee.app/Contents/Resources"
            for b in hauksbee hauksbee-ci hauksbee-mcp; do
              app_ver="$("$APPRES/bin/$b" --version)"
              expected="$b $expected_version (git $expected_sha)"
              echo "app $b: $app_ver"
              if [ "$app_ver" != "$expected" ]; then
                echo "::error title=Version mismatch::the app bundle's $b reports '$app_ver', expected '$expected'."
                fail=1
              fi
            done
            test -x "$APPRES/bin/hauksbee-mcp" \
              || { echo "::error::the app zip is missing Contents/Resources/bin/hauksbee-mcp"; fail=1; }
            # The licence set must travel inside the app too.
            for f in LICENSE NOTICE LICENSE-BINARY.txt LICENSE-GPL-3.0.txt; do
              test -s "$APPRES/$f" \
                || { echo "::error::the app zip is missing Contents/Resources/$f"; fail=1; }
            done
          fi

          exit "$fail"

      # The default shape links libelf STATICALLY (hauksbee-mcu/build.rs; the
      # archives come from libelf-dev/libzstd-dev/zlib1g-dev installed above). A NEEDED
      # libelf.so.1 entry means that static link silently regressed, and the
      # shipped binary exits 127 on any distro without libelf1
      # (debian:bookworm-slim, ubuntu:24.04 minimal). Ask the ELF headers of
      # the exact binaries about to be uploaded; a build-time claim is not
      # evidence. Linux only: readelf/ELF do not exist on the darwin legs.
      - name: Assert no dynamic libelf in the default binaries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd hauksbee/dist
          V="${{ steps.ver.outputs.version }}"
          L="${{ matrix.label }}"
          work="$(mktemp -d)"
          tar -xzf "hauksbee-$V-$L.tar.gz" -C "$work"
          fail=0
          for b in hauksbee hauksbee-ci hauksbee-mcp; do
            bin="$work/hauksbee-$V-$L/bin/$b"
            echo "--- $b NEEDED entries ---"
            readelf -d "$bin" | grep NEEDED || true
            if readelf -d "$bin" | grep -q 'NEEDED.*libelf'; then
              echo "::error title=Dynamic libelf::$b carries a NEEDED libelf entry; the static libelf link in hauksbee-mcu/build.rs regressed. This binary exits 127 on hosts without libelf1."
              fail=1
            fi
            if readelf -d "$bin" | grep -q 'NEEDED.*libz\.so'; then
              echo "::warning title=Dynamic zlib::$b links zlib dynamically; zlib1g-dev's libz.a was expected on this runner (build.rs prefers static=z)."
            fi
          done
          exit "$fail"

      # The documented KiCad install-from-file path is a release asset, not a
      # maintainer-only local recipe. Build it once (all matrix legs share the
      # same platform-independent Python sources), checksum it using the same
      # basename-relative format as every other release artifact, and stage it
      # beside the bundles for the existing verification and upload gates.
      - name: Build KiCad PCM archive
        if: matrix.label == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          cd hauksbee
          bash integrations/kicad-plugin/build-pcm.sh
          pcm="integrations/kicad-plugin/dist/hauksbee-ci-pcm-v${{ steps.ver.outputs.version }}.zip"
          test -s "$pcm"
          cp "$pcm" dist/
          cd dist
          sha256sum "$(basename "$pcm")" > "$(basename "$pcm").sha256"
          sha256sum --check "$(basename "$pcm").sha256"

      # Every checksum next to every artifact must verify before anything is
      # uploaded, so a stale or half-rewritten .sha256 can never ride along.
      - name: Verify every dist checksum
        shell: bash
        run: |
          set -euo pipefail
          cd hauksbee/dist
          for sum in *.sha256; do
            echo "checking $sum"
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 -c "$sum"
            else
              sha256sum --check "$sum"
            fi
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hauksbee-${{ matrix.label }}
          path: |
            hauksbee/dist/*.tar.gz
            hauksbee/dist/hauksbee-*-app.zip
            hauksbee/dist/hauksbee-ci-pcm-v*.zip
            hauksbee/dist/hauksbee-ci-pcm-v*.zip.sha256
            hauksbee/dist/*.sha256
          if-no-files-found: error

      # The runner is disposable, but still restore its keychain search list
      # and delete the imported certificate before this matrix leg exits. This
      # runs after success, failure, cancellation, and an early credential
      # preflight failure alike.
      - name: Clean up macOS signing keychain
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          state_dir="${HAUKSBEE_SIGNING_STATE_DIR:-$RUNNER_TEMP/hauksbee-signing}"
          keychain="${HAUKSBEE_SIGNING_KEYCHAIN:-$state_dir/developer-id-signing.keychain-db}"
          original_keychains=()
          if [[ -f "$state_dir/original-keychains" ]]; then
            while IFS= read -r line; do
              line="${line#\"}"
              line="${line%\"}"
              [[ -n "$line" ]] && original_keychains+=("$line")
            done < "$state_dir/original-keychains"
            if ((${#original_keychains[@]} > 0)); then
              security list-keychains -d user -s "${original_keychains[@]}"
            fi
          fi
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          for secret_file in \
            "$state_dir/developer-id-signing.p12" \
            "$state_dir/original-keychains"; do
            if [[ -e "$secret_file" ]]; then
              unlink "$secret_file"
            fi
          done
          rmdir "$state_dir" 2>/dev/null || true

  build-windows:
    name: build windows-x86_64 (permissive)
    needs: resolve-source
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
      SIMAVR_INCLUDE_DIR: C:\nonexistent\simavr-must-not-be-linked
      SIMAVR_LIB_DIR: C:\nonexistent\simavr-must-not-be-linked
    steps:
      - name: Checkout hauksbee
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          path: hauksbee
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-03
      - name: Install bun for the embedded web UI
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~\.cargo\registry\index
            ~\.cargo\registry\cache
            ~\.cargo\git\db
            hauksbee\target
          key: release-windows-x86_64-${{ hashFiles('hauksbee/Cargo.lock') }}
      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          $raw = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($raw -notmatch '^v[0-9A-Za-z._-]+$') { throw "refusing suspicious version: $raw" }
          $sourceSha = (git -C hauksbee rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "could not resolve checked-out source" }
          if ($sourceSha -ne $env:EXPECTED_SHA) {
            throw "checked-out source $sourceSha does not match captured release source $env:EXPECTED_SHA"
          }
          $version = $raw -replace '^v', ''
          $workspaceVersion = ((Select-String -Path hauksbee\Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value)
          if ($version -ne $workspaceVersion) {
            throw "tag version $version does not match workspace package $workspaceVersion"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
      - name: Prove installer contract against a stub bundle
        shell: pwsh
        working-directory: hauksbee
        env:
          STUB_VERSION: ${{ steps.ver.outputs.version }}
          STUB_COMMIT: ${{ steps.ver.outputs.source_sha }}
        run: |
          # The contract suite needs only binaries that answer --version with
          # the release identity, so it can prove the whole installer flow in
          # about a minute, before the expensive build spends hours. A real
          # regression in these scripts fails here, not after the build.
          $work = Join-Path $env:RUNNER_TEMP "stub-bundle"
          $base = "hauksbee-$env:STUB_VERSION-windows-x86_64-permissive"
          $bin = Join-Path (Join-Path $work $base) "bin"
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          $src = Join-Path $work "probe.rs"
          $probe = @(
            'use std::env;',
            'fn main() {',
            '    let path = env::current_exe().expect("current executable");',
            '    let name = path.file_stem().expect("stem").to_string_lossy().into_owned();',
            '    let args: Vec<_> = env::args_os().skip(1).collect();',
            '    if args != ["--version"] { std::process::exit(2); }',
            ('    println!("{} ' + $env:STUB_VERSION + ' (git ' + $env:STUB_COMMIT + ')", name);'),
            '}'
          )
          Set-Content -Path $src -Value ($probe -join "`n")
          & rustc -O $src -o (Join-Path $work "probe.exe")
          if ($LASTEXITCODE -ne 0) { throw "stub probe compile failed" }
          foreach ($b in @("hauksbee.exe", "hauksbee-ci.exe", "hauksbee-mcp.exe")) {
            Copy-Item (Join-Path $work "probe.exe") (Join-Path $bin $b)
          }
          $zip = Join-Path $work "$base.zip"
          Compress-Archive -LiteralPath (Join-Path $work $base) -DestinationPath $zip
          $sum = "$zip.sha256"
          $digest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($sum, "$digest  $base.zip`r`n")
          .\scripts\test-windows-installer.ps1 -Zip $zip -Checksum $sum -Version $env:STUB_VERSION -ExpectedCommit $env:STUB_COMMIT
      - name: Install checksum-pinned Windows simulator backends
        shell: pwsh
        working-directory: hauksbee
        run: .\scripts\install-sims-windows.ps1
      - name: Refuse modified installed simulator payloads
        shell: powershell
        working-directory: hauksbee
        run: .\scripts\test-windows-simulator-integrity.ps1
      - name: Verify offline Windows contracts
        shell: powershell
        working-directory: hauksbee
        run: python scripts/test-windows-port-contract.py
      - name: Verify native Windows Job Object timeout
        shell: powershell
        working-directory: hauksbee
        run: .\scripts\test-windows-process-tree.ps1
      - name: Verify native engine, CI, and emulator lifecycle
        shell: powershell
        working-directory: hauksbee
        run: cargo test --locked -p hauksbee-engine -p hauksbee-ci -p hauksbee-mcu --all-targets --no-default-features --features renode,qemu
      - name: Require and retain real Windows firmware integrations
        shell: pwsh
        working-directory: hauksbee
        run: |
          .\scripts\run-required-integrations-windows.ps1 `
            -ExpectedSha "${{ steps.ver.outputs.source_sha }}" `
            -EvidenceOut "required-integrations-windows-x86_64.json"
      - name: Build embedded web UI
        working-directory: hauksbee/frontend
        env:
          HAUKSBEE_RELEASE_COMMIT: ${{ steps.ver.outputs.source_sha }}
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Build permissive Windows release binaries
        working-directory: hauksbee
        env:
          HAUKSBEE_SOURCE_COMMIT: ${{ steps.ver.outputs.source_sha }}
          HAUKSBEE_RELEASE_TAG: v${{ steps.ver.outputs.version }}
        run: cargo build --locked --release -p hauksbee-engine -p hauksbee-ci -p hauksbee-mcp --no-default-features --features renode,qemu,serve,embed-web
      - name: Package and verify permissive Windows zip
        shell: pwsh
        working-directory: hauksbee
        env:
          # Windows release assets are never allowed to leave this job
          # unsigned. Store the PFX as base64 (one-line or whitespace-wrapped)
          # and keep its password in a separate repository/environment secret.
          # The packager consumes these only when the explicit requirement
          # switch below is present; ordinary local bundles stay unsigned.
          HAUKSBEE_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.HAUKSBEE_WINDOWS_SIGNING_PFX_BASE64 }}
          HAUKSBEE_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.HAUKSBEE_WINDOWS_SIGNING_PFX_PASSWORD }}
          # Optional override for the RFC 3161 timestamp service. When absent,
          # scripts/bundle-windows.ps1 uses timestamp.digicert.com.
          HAUKSBEE_WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.HAUKSBEE_WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          .\scripts\bundle-windows.ps1 -Version "${{ steps.ver.outputs.version }}" -ExpectedCommit "${{ steps.ver.outputs.source_sha }}" -Out dist -RequireAuthenticodeSignature
          $V = "${{ steps.ver.outputs.version }}"
          $zip = "dist\hauksbee-$V-windows-x86_64-permissive.zip"
          $sum = "$zip.sha256"
          if (-not (Test-Path $zip) -or -not (Test-Path $sum)) { throw "Windows bundle or checksum missing" }
          $expected = ((Get-Content $sum -First 1) -split '\s+')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw "Windows bundle checksum mismatch" }
          $extract = Join-Path $env:RUNNER_TEMP "hauksbee-windows-verify"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $root = Join-Path $extract "hauksbee-$V-windows-x86_64-permissive"
          foreach ($binary in @("hauksbee.exe", "hauksbee-ci.exe", "hauksbee-mcp.exe")) {
            if (-not (Test-Path (Join-Path $root "bin\$binary"))) { throw "$binary missing from Windows bundle" }
          }
          $signToolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
          $signToolPath = if ($null -ne $signToolCommand) {
            $signToolCommand.Path
          } else {
            $kitsRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
            Get-ChildItem -LiteralPath $kitsRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^10\.0\.[0-9.]+$' } |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($signToolPath)) { throw "signtool.exe is unavailable; refusing to publish an unverified Windows bundle" }
          foreach ($binary in @("hauksbee.exe", "hauksbee-ci.exe", "hauksbee-mcp.exe")) {
            $binaryPath = Join-Path $root "bin\$binary"
            & $signToolPath verify /q /pa /all $binaryPath | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for packaged $binary" }
          }
          if (-not (Test-Path (Join-Path $root "LICENSE-BINARY.txt"))) { throw "LICENSE-BINARY.txt missing" }
          $doctor = & (Join-Path $root "bin\hauksbee.exe") doctor | Out-String
          if ($doctor -notmatch '(?m)^avr\s+disabled\b') { throw "packaged Windows binary is not permissive" }
          # The packaged binary must carry both the `serve` command and the
          # compiled frontend. A release that passes static solver checks but
          # cannot start its front door is launch-dead for every bare install.
          $servePort = 8418
          $serveStdout = Join-Path $env:RUNNER_TEMP "hauksbee-windows-serve.stdout.log"
          $serveStderr = Join-Path $env:RUNNER_TEMP "hauksbee-windows-serve.stderr.log"
          $server = Start-Process -FilePath (Join-Path $root "bin\hauksbee.exe") `
            -ArgumentList @("serve", "--port", "$servePort", "--no-open") `
            -PassThru -RedirectStandardOutput $serveStdout -RedirectStandardError $serveStderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$servePort/"
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              if ($server.HasExited) { break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              $stderrText = if (Test-Path $serveStderr) { Get-Content $serveStderr -Raw } else { "" }
              throw "packaged Windows hauksbee serve never became ready: $stderrText"
            }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
            $server.WaitForExit()
          }
          $runOutput = & (Join-Path $root "bin\hauksbee.exe") run `
            (Join-Path $root "examples\ci-specs\boards\power_resistor.kicad_pcb") `
            --headless --plain 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $runOutput -notmatch 'simulated .* over 2 nets' -or $runOutput -notmatch 'numerical qualification') {
            throw "packaged Windows hauksbee did not complete the tracked static solver smoke"
          }
          $ciOutput = & (Join-Path $root "bin\hauksbee-ci.exe") run `
            (Join-Path $root "examples\ci-specs\power_resistor_cool.toml") 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $ciOutput -notmatch '2/2 assertions passed' -or $ciOutput -notmatch 'GREEN') {
            throw "packaged Windows hauksbee-ci did not complete the tracked static spec"
          }
          .\scripts\test-windows-installer.ps1 -Zip $zip -Checksum $sum -Version $V -ExpectedCommit "${{ steps.ver.outputs.source_sha }}"
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hauksbee-windows-x86_64
          path: |
            hauksbee/dist/*.zip
            hauksbee/dist/*.zip.sha256
            hauksbee/required-integrations-windows-x86_64.json
          if-no-files-found: error

  # A nightly run on another commit is useful feedback, not release evidence.
  # This job checks out the tag's exact SHA, verifies checksum-backed installed
  # emulator artifacts, and retains the three named real firmware-through-
  # hardware passes. The publish job both needs this job and re-checks the SHA
  # inside each platform's evidence artifact before creating the GitHub Release.
  required-integrations:
    name: required firmware integrations at release SHA (${{ matrix.label }})
    needs: resolve-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: macos-latest
            label: darwin-arm64
          - os: macos-15-intel
            label: darwin-x86_64
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          path: hauksbee
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-03

      # The pinned Espressif QEMU binaries are dynamically linked against
      # pixman, SDL2 and libslirp, none of which a bare ubuntu-24.04 runner
      # carries; without them install-sims.sh cannot even run `-machine help`
      # to verify the fork.
      - name: Install Linux simulator runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-0t64 libpixman-1-0 libsdl2-2.0-0 libslirp0

      - name: Install macOS simulator runtime dependencies
        if: runner.os == 'macOS'
        run: brew install glib pixman libslirp libgcrypt

      # Renode's pinned Intel DMG is the real 1.16.1 Mono build; unlike the
      # Apple-Silicon portable-dotnet asset it deliberately uses system Mono.
      - name: Install Mono for Intel Renode
        if: matrix.label == 'darwin-x86_64'
        run: brew install mono

      - name: Cache checksum-verified simulator archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/hauksbee/simulator-archives
          key: release-required-sims-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hauksbee/scripts/install-sims.sh', 'hauksbee/scripts/required-simulator-versions.env', 'hauksbee/scripts/renode-checksums.txt', 'hauksbee/scripts/espressif-qemu-checksums.txt') }}

      - name: Run and retain same-SHA required integration evidence
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          cd hauksbee
          expected_sha="$(git rev-parse HEAD)"
          [ "$expected_sha" = "$EXPECTED_SHA" ] || {
            echo "required-integration checkout $expected_sha does not match captured release source $EXPECTED_SHA" >&2
            exit 1
          }
          python3 scripts/run_required_integrations.py \
            --expected-sha "$expected_sha" \
            --evidence-out "required-integrations-${{ matrix.label }}.json"

      - name: Upload required integration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: required-integration-evidence-${{ matrix.label }}
          path: hauksbee/required-integrations-${{ matrix.label }}.json
          if-no-files-found: error

  release-quality:
    name: exact-SHA release quality gate
    needs: resolve-source
    # Skipped only when resolve-source proved a fully green candidate ci run
    # already executed these same checks at this exact commit;
    # release-quality-residue then runs the release-only contracts ci does
    # not cover. The publish job requires exactly one of the two paths.
    if: needs.resolve-source.outputs.ci_reuse != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false
      - name: Bind quality gate to the immutable release event
        id: quality-source
        env:
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          head="$(git rev-parse HEAD)"
          [ "$head" = "$EXPECTED_SHA" ]
          echo "source_sha=$head" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install release-quality prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libelf-dev libzstd-dev ngspice pkg-config zlib1g-dev shellcheck
          bash scripts/setup-ci-simavr.sh
      - name: Rust format, licence, lint, tests, docs, and both feature shapes
        run: |
          export HAUKSBEE_SOURCE_COMMIT="$(git rev-parse HEAD)"
          cargo fmt --all --check
          python3 scripts/test-runtime-dependency-licenses.py
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo test --locked --workspace --features avr
          cargo check --locked -p hauksbee-engine --no-default-features
          cargo clippy --locked -p hauksbee-engine --no-default-features --all-targets -- -D warnings
          cargo test --locked -p hauksbee-engine --no-default-features --all-targets
          SIMAVR_INCLUDE_DIR=/nonexistent/simavr-must-not-be-linked \
            SIMAVR_LIB_DIR=/nonexistent/simavr-must-not-be-linked \
            cargo check --locked --workspace --no-default-features --features renode,qemu
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          HAUKSBEE_REQUIRE_NGSPICE=1 cargo test --locked --release -p hauksbee-solve --test speed_gate -- --nocapture
      - name: Offline policy, evidence, integration, and documentation contracts
        run: |
          python3 scripts/test-private-release-policy.py
          python3 scripts/test-windows-port-contract.py
          python3 scripts/test_required_integrations.py
          python3 scripts/test-simavr-provenance.py
          python3 -m unittest qc.tests.test_unseen_boards
          python3 integrations/kicad-plugin/test_hauksbee_ci_core.py
          python3 integrations/pre-commit/test_hauksbee_ci_precommit.py
          python3 scripts/lint-diagrams.py
          python3 scripts/lint-docs-currency.py
          bash integrations/github-action/test_pick_release_tag.sh
          shellcheck integrations/github-action/*.sh scripts/setup-ci-simavr.sh scripts/simavr-payload-provenance.sh scripts/build-release-source.sh
          shellcheck --severity=warning scripts/make-public.sh scripts/build-public-mirror.sh
      - name: Product-app lint, unit, browser, build, and visual gates
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run lint
          bun run test:unit
          HAUKSBEE_RELEASE_COMMIT="$(git rev-parse HEAD)" bun run build
          HB_EXPECT_WORKFLOW_EXPORT=1 bun run test:e2e
          HB_LINT_SITE=0 bun run visual-lint
      - name: Scenario QC on release binaries
        env:
          HAUKSBEE_SOURCE_COMMIT: ${{ steps.quality-source.outputs.source_sha }}
        run: |
          cargo build --locked --release --bin hauksbee --bin hauksbee-ci
          expected="${{ steps.quality-source.outputs.source_sha }}"
          for binary in hauksbee hauksbee-ci; do
            "target/release/$binary" --version | grep -F "(git $expected)" >/dev/null
          done
          qc/run.sh --results-dir qc/release-results
      - name: Retain exact-SHA scenario QC evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-quality-qc-${{ steps.quality-source.outputs.source_sha }}
          path: qc/release-results/**/report.md
          if-no-files-found: error
          retention-days: 90

  release-quality-residue:
    name: release-only contracts not covered by the reused ci run
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.resolve-source.outputs.ci_reuse == 'true'
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          persist-credentials: false
      - name: Bind residue gate to the immutable release event
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          head="$(git rev-parse HEAD)"
          [ "$head" = "$EXPECTED_SHA" ]
      # Everything else in release-quality is executed, command for command,
      # by the fully green candidate ci run that resolve-source verified:
      # fmt, runtime-dependency licences, clippy, the sharded workspace tests
      # plus the native macOS workspace pass (the avr shape is in default
      # features, so both quality-gate test invocations resolve to the
      # default graph), engine no-default clippy+tests, the poisoned
      # GPL-free check, docs with -D warnings, the ngspice-required speed
      # gate, diagram lint, the integrations suites, the Windows port
      # contract, and the full frontend gate. What remains here is the
      # release-only residue ci does not run, plus a --locked resolution
      # proof the ci jobs (which build unlocked) cannot give.
      - name: Release-only contracts
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          python3 scripts/check-private-release-surfaces.py .
          python3 scripts/test_required_integrations.py
          python3 scripts/test-simavr-provenance.py
          shellcheck integrations/github-action/*.sh scripts/setup-ci-simavr.sh scripts/simavr-payload-provenance.sh scripts/get-hauksbee.sh

  release:
    name: publish release
    needs: [build, build-windows, required-integrations, release-quality, release-quality-residue]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only publish a Release for an actual tag push; workflow_dispatch just
    # produces downloadable build artifacts (above). always() is required so
    # the one deliberately skipped quality job cannot cascade a skip into
    # publication; every needed result is therefore checked explicitly, and
    # exactly one of the two quality paths must have succeeded (the full
    # gate, or the ci-reuse residue).
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      needs.build.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.required-integrations.result == 'success' &&
      ((needs.release-quality.result == 'success' && needs.release-quality-residue.result == 'skipped') ||
       (needs.release-quality.result == 'skipped' && needs.release-quality-residue.result == 'success'))
    steps:
      - name: Checkout (for the slug preflight)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          path: hauksbee
          persist-credentials: false

      - name: Bind publication checkout to the immutable release event
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          head="$(git -C hauksbee rev-parse HEAD)"
          tag_sha="$(git -C hauksbee rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          [ "$head" = "$EVENT_SHA" ] && [ "$tag_sha" = "$EVENT_SHA" ] || {
            echo "publication checkout/tag no longer matches immutable event $EVENT_SHA" >&2
            exit 1
          }

      # The bundles, installer and OCI labels all point at the private release
      # repository hauksbee-dev/hauksbee. This release is distributed only to
      # recipients authorised to access that repository, so the baked-in
      # corresponding-source URLs resolve for the same audience. A missing or
      # non-private repository would violate that contract; a missing one would
      # also ship dead URLs (a GPL-3.0 section 6 problem, not just a cosmetic
      # one). The preflight checks visibility plus every repository URL baked
      # into installers, licence notices, OCI labels and generated integrations.
      # Tag publication fails closed when the token or any surface is missing.
      - name: Preflight the private release slug
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash hauksbee/scripts/preflight-private-release.sh hauksbee

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} dist/ \;
          test "$(find dist -maxdepth 1 -name 'hauksbee-ci-pcm-v*.zip' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name 'hauksbee-ci-pcm-v*.zip.sha256' | wc -l)" -eq 1
          version="${GITHUB_REF_NAME#v}"
          bash hauksbee/scripts/build-release-source.sh "$version" dist "$GITHUB_SHA"
          qc_report="$(find artifacts -path '*release-quality-qc-*/*/report.md' -type f -print)"
          test "$(printf '%s\n' "$qc_report" | grep -c .)" -eq 1
          cp "$qc_report" "dist/release-quality-qc-$GITHUB_SHA.md"
          (cd dist && sha256sum "release-quality-qc-$GITHUB_SHA.md" > "release-quality-qc-$GITHUB_SHA.md.sha256")
          ls -la dist

      - name: Verify every manifest before publishing
        shell: bash
        run: |
          # Belt-and-suspenders: re-check each sha256 the way get-hauksbee.sh
          # does (relative basename, from inside the dir) so a corrupted upload
          # never becomes a published release.
          cd dist
          for sum in *.sha256; do
            echo "checking $sum"
            sha256sum --check "$sum"
          done

      - name: Verify same-SHA required integration evidence
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for label in linux-x86_64 linux-aarch64 darwin-arm64 darwin-x86_64; do
            evidence="artifacts/required-integration-evidence-$label/required-integrations-$label.json"
            python3 hauksbee/scripts/run_required_integrations.py \
              --verify-evidence "$evidence" \
              --expected-sha "$GITHUB_SHA"
            cp "$evidence" "dist/required-integrations-$label.json"
          done
          windows_evidence="$(find artifacts/hauksbee-windows-x86_64 -name required-integrations-windows-x86_64.json -print -quit)"
          test -n "$windows_evidence"
          python3 hauksbee/scripts/run_required_integrations.py \
            --verify-evidence "$windows_evidence" \
            --expected-sha "$GITHUB_SHA" \
            --expected-platform "windows-x86_64"
          cp "$windows_evidence" dist/required-integrations-windows-x86_64.json
          (cd dist && for evidence in required-integrations-*.json; do sha256sum "$evidence" > "$evidence.sha256"; done)
          test "$(find dist -maxdepth 1 -name 'required-integrations-*.json' | wc -l)" -eq 5

      - name: Verify evidence checksums added after semantic validation
        shell: bash
        run: |
          cd dist
          for sum in required-integrations-*.json.sha256; do sha256sum --check "$sum"; done

      - name: Reconcile exact release state
        id: release-state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          probe="$(mktemp)"
          trap 'find "$probe" -maxdepth 0 -type f -delete 2>/dev/null || true' EXIT
          status=0
          gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" >"$probe" 2>&1 || status=$?
          http="$(sed -nE '1s#^HTTP/[0-9.]+ ([0-9]{3}).*#\1#p' "$probe")"
          case "$http" in
            404)
              echo "already-published=false" >> "$GITHUB_OUTPUT"
              ;;
            200)
              draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .draft)"
              immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .immutable)"
              body="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .body)"
              case "$body" in
                *"Source commit: \`$GITHUB_SHA\`"*) ;;
                *) echo "existing release is not bound to source commit $GITHUB_SHA; refusing mutation" >&2; exit 1 ;;
              esac
              if [ "$draft" = true ]; then
                # An interrupted prior run may leave its exact-SHA draft. It is
                # still mutable, so discard the partial asset set and restage
                # all local verified bytes from scratch.
                gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
                echo "already-published=false" >> "$GITHUB_OUTPUT"
              elif [ "$immutable" = true ]; then
                # Publishing is one-way. A rerun after a transient attestation
                # failure performs verification only; it never mutates assets.
                echo "already-published=true" >> "$GITHUB_OUTPUT"
              else
                echo "existing release is published but mutable; refusing it" >&2
                exit 1
              fi
              ;;
            *) cat "$probe" >&2; echo "could not prove release absence (gh exit $status, HTTP ${http:-unknown})" >&2; exit 1 ;;
          esac

      - name: Stage immutable GitHub Release draft
        if: steps.release-state.outputs.already-published != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          # SemVer prerelease tags (for example v0.1.0-beta.1) must remain
          # visibly pre-release and must not replace the latest stable pointer.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          target_commitish: ${{ github.sha }}
          body: |
            Source commit: `${{ github.sha }}`

            Use this exact 40-character commit wherever the private installer or Action examples say `REPLACE_WITH_RELEASE_COMMIT_SHA`. Do not substitute `main` or a tag.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.json
            dist/*.md
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish and lock the staged release
        if: steps.release-state.outputs.already-published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"

      - name: Verify GitHub's immutable release attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in dist/*; do
            for attempt in $(seq 1 12); do
              if gh release verify-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"; then
                break
              fi
              [ "$attempt" -lt 12 ] || {
                echo "GitHub did not attest immutable release asset $asset" >&2
                exit 1
              }
              sleep 5
            done
          done
          gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

# =============================================================================
# Asset list a release produces:
#   hauksbee-<ver>-<label>.tar.gz              + .sha256   default, GPL-3.0
#   hauksbee-<ver>-<label>-permissive.tar.gz   + .sha256   permissive, Apache-2.0
#   hauksbee-<ver>-<label>-app.zip             + .sha256   macOS legs only,
#                                                          wraps the default shape
#   hauksbee-ci-pcm-v<ver>.zip                  + .sha256   one platform-neutral
#                                                          KiCad PCM archive
#   hauksbee-<ver>-windows-x86_64-permissive.zip + .sha256 Windows x64,
#                                                          Apache-2.0, no AVR
#
# The historical "OPTION A, not shipped" block that used to live here described
# the GPL shape as a hypothetical to be enabled by hand. It is now the default
# download, built by the steps above, so the block was removed rather than left
# to contradict them.
# =============================================================================
