# PR/push CI for hauksbee: format, lints, tests, and the GPL-free build shape.
#
# The board-corpus gate runs nightly instead (corpus-gate.yml): it fetches a
# hundred-odd boards from their upstream projects, which is too slow to put in
# front of every push.

name: ci

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A failing test should print its assertion, not spend a minute on backtraces.
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain pinned here on purpose: rust-toolchain.toml decides, so
      # CI and a laptop format with the same rustfmt and cannot disagree.
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The allow-list of known findings lives in Cargo.toml's
      # [workspace.lints.clippy]. Anything outside it fails here.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the CI workhorse; macOS is included because the project is
        # developed there and several paths (dynamic library discovery for the
        # emulator backends, Gatekeeper) differ enough to break in one place
        # while passing in the other.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # No corpus here: these are the tests that run from the fixtures bundled
      # in testdata/. Corpus-dependent tests report as ignored, and the nightly
      # gate runs them for real with HAUKSBEE_REQUIRE_CORPUS=1.
      - name: cargo test --workspace
        run: cargo test --workspace

  diagrams:
    name: diagram geometry lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # draw.io renders overlapping boxes, spilling labels, and dangling edges
      # without complaint, and the export is what readers see. The linter
      # checks the .drawio sources geometrically so those defects fail here
      # instead of shipping into the docs.
      - run: python3 scripts/lint-diagrams.py

  integrations:
    name: integrations (KiCad plugin, pre-commit hook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # These two ship to users and nothing here ran them, so a break in either
      # reached the person installing it before it reached us. Both suites are
      # pure Python with no pcbnew/wx import, so they run anywhere.
      - run: python3 integrations/kicad-plugin/test_hauksbee_ci_core.py
      - run: python3 integrations/pre-commit/test_hauksbee_ci_precommit.py
      # The action's one decision with a wrong answer available: which build of
      # hauksbee-ci a run actually used.
      - run: bash integrations/github-action/test_pick_release_tag.sh
      - run: shellcheck integrations/github-action/*.sh

  release-evidence-invariants:
    name: release evidence invariants (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pure stdlib tests: no corpus fetch, browser, server, or network. These
      # prove that a renamed board cannot become unseen again, ledger prefix
      # edits are detected, archives stay inside their declared source, and a
      # browser artifact cannot be attached to a different reservation.
      - run: python3 -m unittest qc.tests.test_unseen_boards
      # A repository with no release run is allowed on an ordinary PR. If the
      # canonical ledger exists, however, every reservation must terminate and
      # every retained artifact must still match its recorded digest.
      - run: python3 -m qc.unseen_boards audit-history

  docs:
    name: cargo doc (rendered module docs stay valid)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The //! module headers are rustdoc input, rendered by `cargo doc` and
      # published on docs.rs if the crates ever ship there. Broken intra-doc
      # links and malformed markdown rot silently unless something builds the
      # docs, so this builds them.
      - run: cargo doc --workspace --no-deps

  docs-currency:
    name: docs currency (no dead links, gravestones, or stale paths in shipped docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Shipped docs must describe the present tense of the tree: every relative
      # link resolves, no gravestone or review-process language, no references
      # into internal-only paths, no em-dashes, no stale backticked repo paths.
      - run: python3 scripts/lint-docs-currency.py

  frontend-visual-lint:
    name: frontend visual lint (overflow + fit, five viewports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # A layout defect is invisible to every other job here: tsc and eslint are
      # happy with a button hanging off its card, and cargo test never renders
      # anything. This measures the real thing in a real browser at five
      # viewports (360, 768, 1440, plus 320 and 1920x600 as the stress ratios):
      # page-level horizontal scroll, children escaping their container, clipped
      # single-line text, broken or stretched images, and sticky chrome sitting
      # on top of a control.
      - name: install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: chromium for playwright
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: build the frontend
        working-directory: frontend
        run: bun run build
      # The site is a separate build and is linted tolerantly: if this step
      # fails or is skipped the app's lint still runs, and the lint reports the
      # site as skipped rather than failing on it.
      - name: build the site (optional)
        continue-on-error: true
        working-directory: site
        run: bun install --frozen-lockfile && bun run build
      # No engine build in this job. The lint serves frontend/dist with
      # tests/visual-lint/fixture-server.ts, which replays real `hauksbee serve`
      # responses from tests/visual-lint/fixtures/ (re-record them with
      # capture-fixtures.ts). Building the Rust workspace for one report would
      # make a three-minute job a twenty-minute one.
      #
      # No 3D view anywhere in the lint: three.js on a GPU-less runner wedges
      # the page, so no surface opens the viewer's 3D tab.
      - name: visual lint
        working-directory: frontend
        run: bun run visual-lint
      - name: screenshots of the violating states
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-lint-screenshots
          path: frontend/test-results/visual-lint
          if-no-files-found: ignore

  scenario-qc:
    name: scenario QC (ten real-user sessions, end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # No build job exists to borrow artifacts from, and the suite has to
      # measure a release build: the flows it times are sub-second in release
      # and slow enough in debug to trip its own wall-clock ceilings.
      - name: build the binaries the suite drives
        run: cargo build --release --bin hauksbee --bin hauksbee-ci
      # Every other job here checks a unit, a report, or a rendered page. This
      # one checks the session: the verdict wording a person reads, the exit
      # code a pipeline branches on, whether a diagnosis names the number it
      # measured, whether a bad input lands somewhere the user can act from.
      # Those can each be correct while the whole flow is unusable, and nothing
      # else in this file would notice.
      - name: qc/run.sh
        run: qc/run.sh
      # The transcript is the point on a failure: it carries every command, exit
      # code and stream, so a red here is diagnosable without a local repro.
      - name: scenario transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-qc-report
          path: qc/results
          if-no-files-found: ignore

  gpl-free-check:
    name: cargo check (GPL-free renode+qemu shape)
    runs-on: ubuntu-latest
    env:
      # GPL-freeness guard: a clean shape ignores these; a leaky shape panics.
      SIMAVR_INCLUDE_DIR: /nonexistent/simavr-must-not-be-linked
      SIMAVR_LIB_DIR: /nonexistent/simavr-must-not-be-linked
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # This is a licensing ASSERTION, not a compile check. simavr discovery is
      # pointed at a nonexistent path: if the renode+qemu shape is truly
      # avr-free, hauksbee-mcu/build.rs early-returns and ignores it. If `avr`
      # leaks back into the graph, build.rs panics and this job fails, telling
      # us the "GPL-free" release would in fact be GPL-encumbered.
      #
      # A red here means a feature-graph regression re-enabled avr. Fix the
      # graph, never weaken this check.
      # See docs/about/release-and-licensing.md.
      - name: cargo check --workspace --no-default-features --features renode,qemu
        run: |
          if ! cargo check --workspace --no-default-features --features renode,qemu; then
            echo "::error title=GPL-free shape broken::--no-default-features --features renode,qemu failed."
            echo "Either it stopped compiling, or it pulled in the GPL avr/libsimavr backend." >&2
            echo "See docs/about/release-and-licensing.md." >&2
            exit 1
          fi

  speed-gate:
    name: speed gate (faster-than-ngspice claim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The oracle. Without it the gate SKIPS, and a skipped gate defends
      # nothing, so HAUKSBEE_REQUIRE_NGSPICE below turns a missing or broken
      # install into a red build rather than a quiet green.
      - name: install ngspice (the oracle the speed claim is measured against)
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          ngspice --version | head -2
      # README and docs/about/COMPARISON.md market a speed advantage over
      # ngspice. This job is what makes that claim defended on every push
      # instead of resting on #[ignore]d benches that print and assert nothing.
      # Release build: a debug-profile ratio is not a claim anyone ships.
      #
      # A red here means either the solver regressed or the marketed number no
      # longer holds. In the second case the DOCS change, never the floors.
      - name: cargo test --release --test speed_gate
        env:
          HAUKSBEE_REQUIRE_NGSPICE: "1"
        run: |
          if ! cargo test --release -p hauksbee-solve --test speed_gate -- --nocapture; then
            echo "::error title=Speed claim not defended::The faster-than-ngspice gate failed."
            echo "Either the solver regressed, or the marketed speed/accuracy numbers no" >&2
            echo "longer hold. If the latter, change the docs, not the recorded floors." >&2
            exit 1
          fi
      # The measured table the docs cite. Kept as an artifact so a reviewer can
      # read the actual numbers from the run that gated the commit.
      - name: upload the measured results table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-gate-results
          path: docs/about/speed-gate-results.md
          if-no-files-found: warn
