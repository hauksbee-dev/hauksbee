# PR/push CI for hauksbee.
#
# Every check the old sixteen-job layout ran still runs; they are grouped so
# the workspace is compiled as few times as possible. A job compiles the
# workspace at most once per feature shape, and the shapes are:
#   rust        default features (avr + renode + qemu), debug: fmt, clippy, tests, docs
#   no-default  the GPL-free renode+qemu shape and the bare engine
#   release-qc  a release build driving the scenario suite and the speed gate
#   frontend    lint, unit tests, browser flows, visual fit (no Rust)
#   lint        pure Python and shell checks (no Rust)
#
# The macOS and Windows legs run nightly (nightly.yml), as does the
# board-corpus gate (corpus-gate.yml).

name: ci

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental artifacts are dead weight in CI: nothing reuses them and they
  # bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: rust (fmt, clippy, tests, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cache the immutable simavr build prerequisite
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.hauksbee-simavr
          key: simavr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-sims.sh', 'scripts/setup-ci-simavr.sh', 'scripts/simavr-payload-provenance.sh') }}
      - name: install the immutable simavr build prerequisite
        run: scripts/setup-ci-simavr.sh
      - run: cargo fmt --all --check
      - name: enforce runtime dependency licence boundary
        run: python3 scripts/test-runtime-dependency-licenses.py
      # Publishability gate: a production include_str!/include_bytes! reaching
      # outside its crate compiles from a git checkout and from nowhere else.
      - name: enforce publish-set includes stay inside their crates
        run: python3 scripts/check-package-includes.py
      # The allow-list of known findings lives in Cargo.toml's
      # [workspace.lints.clippy]. Anything outside it fails here.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # No corpus here: these are the tests that run from the fixtures bundled
      # in testdata/. Corpus-dependent tests skip, and the nightly gate runs
      # them for real with HAUKSBEE_REQUIRE_CORPUS=1.
      - run: cargo test --workspace
      # The //! module headers are rustdoc input; broken intra-doc links rot
      # silently unless something builds the docs.
      - run: cargo doc --workspace --no-deps

  no-default:
    name: GPL-free shape, bare engine, VS Code loader, defect regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # GPL-freeness guard: a clean shape ignores these; a leaky shape panics
      # in hauksbee-mcu/build.rs. A red here means a feature-graph regression
      # re-enabled avr. Fix the graph, never weaken this check.
      SIMAVR_INCLUDE_DIR: /nonexistent/simavr-must-not-be-linked
      SIMAVR_LIB_DIR: /nonexistent/simavr-must-not-be-linked
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: cargo check --workspace --no-default-features --features renode,qemu
        run: |
          if ! cargo check --workspace --no-default-features --features renode,qemu; then
            echo "::error title=GPL-free shape broken::--no-default-features --features renode,qemu failed."
            echo "Either it stopped compiling, or it pulled in the GPL avr/libsimavr backend." >&2
            exit 1
          fi
      # The smallest supported feature shape of the engine: catches accidental
      # simulator-only dependencies and runs the behavioural tests there.
      - run: cargo check -p hauksbee-engine --no-default-features
      - run: cargo clippy -p hauksbee-engine --no-default-features --all-targets -- -D warnings
      - run: cargo test -p hauksbee-engine --no-default-features --all-targets
      # The permissive binaries the VS Code parity tests and the pinned defect
      # regressions drive.
      - run: cargo build --locked -p hauksbee-engine -p hauksbee-ci --no-default-features --features renode,qemu
      - name: VS Code extension build and tests
        working-directory: editors/vscode-hauksbee-board
        run: |
          bun install --frozen-lockfile
          bun run build
          bun test src/
      # The defect-regression harness is stdlib-only; its unit suite attacks
      # hash drift, path escape, symlinks, duplicate cases and vacuous coverage.
      - run: python3 -m unittest -v qc.defect_regressions.test_tool
      - run: python3 -m qc.defect_regressions.tool manifest qc/defect_regressions/manifest.json
      # Replay the exact before/fix pair with the binary built above.
      - name: replay pinned C64-Saver defect and fix
        run: python3 -m qc.defect_regressions.tool run qc/defect_regressions/c64_saver_i2c_pullups.json

  release-qc:
    name: release build, scenario QC, speed gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release
      - name: cache the immutable simavr build prerequisite
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.hauksbee-simavr
          key: simavr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-sims.sh', 'scripts/setup-ci-simavr.sh', 'scripts/simavr-payload-provenance.sh') }}
      - name: install the immutable simavr build prerequisite
        run: scripts/setup-ci-simavr.sh
      - name: install ngspice (the oracle the speed claim is measured against)
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          ngspice --version | head -2
      # The scenario suite measures a release build: its flows are sub-second
      # in release and trip their own wall-clock ceilings in debug.
      - name: build the binaries the suite drives
        run: cargo build --release --bin hauksbee --bin hauksbee-ci
      # Checks the session, not the unit: the verdict wording a person reads,
      # the exit code a pipeline branches on, whether a diagnosis names the
      # number it measured.
      - name: qc/run.sh
        run: qc/run.sh
      - name: scenario transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenario-qc-report
          path: qc/results
          if-no-files-found: ignore
      # README and docs/about/COMPARISON.md market a speed advantage over
      # ngspice; this is what defends that claim on every push. Release build:
      # a debug-profile ratio is not a claim anyone ships. A red here means the
      # solver regressed or the marketed number no longer holds; in the second
      # case the DOCS change, never the floors.
      - name: cargo test --release --test speed_gate
        env:
          HAUKSBEE_REQUIRE_NGSPICE: "1"
        run: |
          if ! cargo test --release -p hauksbee-solve --test speed_gate -- --nocapture; then
            echo "::error title=Speed claim not defended::The faster-than-ngspice gate failed."
            echo "Either the solver regressed, or the marketed speed/accuracy numbers no" >&2
            echo "longer hold. If the latter, change the docs, not the recorded floors." >&2
            exit 1
          fi
      - name: upload the measured results table
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: speed-gate-results
          path: docs/about/speed-gate-results.md
          if-no-files-found: warn

  frontend:
    name: frontend quality (lint, tests, browser flows, visual fit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: chromium for playwright
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: lint the frontend
        working-directory: frontend
        run: bun run lint
      - name: frontend unit tests
        working-directory: frontend
        run: bun run test:unit
      - name: build the frontend
        working-directory: frontend
        env:
          HAUKSBEE_RELEASE_COMMIT: ${{ github.sha }}
        run: bun run build
      - name: frontend end-to-end flows
        working-directory: frontend
        env:
          HB_EXPECT_WORKFLOW_EXPORT: "1"
        run: bun run test:e2e
      # No engine build here: the lint replays recorded `hauksbee serve`
      # responses from tests/visual-lint/fixtures/ through fixture-server.ts.
      - name: visual lint
        working-directory: frontend
        env:
          # The landing site is a separate repository with its own gate.
          HB_LINT_SITE: "0"
        run: bun run visual-lint
      - name: browser-test screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-browser-screenshots
          path: frontend/test-results
          if-no-files-found: ignore

  lint:
    name: diagrams, integrations, release invariants, docs currency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # draw.io renders overlapping boxes and dangling edges without complaint;
      # the linter checks the .drawio sources geometrically.
      - run: python3 scripts/lint-diagrams.py
      # The KiCad plugin and pre-commit hooks ship to users; both suites are
      # pure Python with no pcbnew/wx import.
      - run: python3 integrations/kicad-plugin/test_hauksbee_ci_core.py
      - run: python3 integrations/pre-commit/test_hauksbee_check_precommit.py
      - run: python3 integrations/pre-commit/test_hauksbee_ci_precommit.py
      # Repository privacy is a release invariant: the distribution mirror and
      # developer tree must never be made public by the launch automation.
      - run: python3 scripts/test-private-release-policy.py
      - run: bash integrations/github-action/test_pick_release_tag.sh
      - run: bash integrations/github-action/test_resolve_inputs.sh
      - run: shellcheck integrations/github-action/*.sh scripts/setup-ci-simavr.sh scripts/simavr-payload-provenance.sh
      - run: shellcheck --severity=warning scripts/make-public.sh scripts/build-public-mirror.sh
      # Release evidence invariants, offline: a renamed board cannot become
      # unseen again, a SKIP-printing integration is not evidence, and the
      # default bundle binds Cargo, simavr and the source notice to one
      # upstream revision.
      - run: python3 -m unittest qc.tests.test_unseen_boards
      - run: python3 scripts/test_required_integrations.py
      - run: python3 scripts/test-simavr-provenance.py
      - run: python3 -m qc.unseen_boards audit-history
      # Shipped docs must describe the present tense of the tree.
      - run: python3 scripts/lint-docs-currency.py
