# CLA gate: first-time contributors sign CLA.md by PR comment; the action
# records signatures on a branch of this repository and blocks merge until
# signed. Uses contributor-assistant, the maintained cla-assistant action.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v2.6.1 commit: this workflow runs on pull_request_target
      # with write permissions, so the action ref must not be movable.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/ETM-Code/hauksbee/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ETM-Code,dependabot[bot]