name: Bug report
description: hauksbee got something wrong, crashed, or refused a board it should accept.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Attach only material you are allowed to publish. A minimal board or
        redacted export is useful; `hauksbee to-code <board>` can produce a
        smaller editable reproduction. Do not post confidential design data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what it printed. Paste output rather than describing it.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `hauksbee --version` (it carries the git hash).
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Docker, Other]
    validations:
      required: true
  - type: textarea
    id: board
    attributes:
      label: Board file
      description: Optional. Attach a shareable minimal input or redacted `to-code` form; never attach confidential design data.
