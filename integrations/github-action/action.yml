name: "hauksbee-ci"
description: "CI for hardware: boot your firmware on the emulated PCB and assert rails, UART, and blink on every layout change."
author: "hauksbee"
branding:
  icon: "cpu"
  color: "green"

inputs:
  spec:
    description: "Path to a single hauksbee-ci TOML spec to run (relative to the repo root). Mutually exclusive with specs."
    required: false
    default: ""
  specs:
    description: "Newline- or space-separated list of spec paths and/or globs (e.g. ci/*.toml). All of them run in ONE hauksbee-ci invocation, producing one merged JUnit file (a <testsuite> per spec) and exiting with the worst severity. Mutually exclusive with spec."
    required: false
    default: ""
  board:
    description: "Path to a board file for mode: check (hauksbee run <board> --check --strict)."
    required: false
    default: ""
  mode:
    description: "What to run. 'spec' runs hauksbee-ci on spec/specs; 'check' runs hauksbee run <board> --check --strict; 'auto' (the default) infers from which inputs are set, and when neither is set detects: exactly one *.toml in ci/ runs as a spec, else exactly one *.kicad_pcb in the repo runs as a check, else the action fails listing what it found."
    required: false
    default: "auto"
  junit:
    description: "Path to write JUnit XML to. Empty to skip."
    required: false
    default: "hauksbee-ci-results.xml"
  publish-report:
    description: "Publish the JUnit XML to the Checks tab via mikepenz/action-junit-report. Set to false when the workflow lacks checks: write (fork PRs) and publish from a separate workflow_run workflow instead (see the README)."
    required: false
    default: "true"
  hauksbee-ref:
    description: "git ref of the hauksbee repo to build hauksbee-ci from (branch, tag, or SHA). Setting this to anything other than main is treated as a deliberate pin: the action builds that ref from source rather than downloading a release that would be a different build."
    required: false
    default: "main"
  hauksbee-repo:
    description: "owner/name of the hauksbee repo to download/build hauksbee-ci from."
    required: false
    default: "hauksbee-dev/hauksbee"
  hauksbee-token:
    description: "Credential authorized for the private hauksbee repository: a fine-grained PAT or GitHub App installation token with Contents: read. The calling repository's github.token is not sufficient across repositories."
    required: true
  registry-user:
    description: "GHCR login name for use-image. Empty derives x-access-token for a GitHub App installation token and otherwise uses github.actor. Set explicitly for a PAT owned by another user."
    required: false
    default: ""
  hauksbee-version:
    description: "Release version to download a prebuilt hauksbee-ci from (e.g. 0.1.0 or a vX.Y.Z tag). Required with use-image so the digest can be checked against that release's immutable Docker manifest. Otherwise empty uses the release named by hauksbee-ref if that is a tag, the newest release for the default ref, or builds the pinned ref."
    required: false
    default: ""
  prefer-prebuilt:
    description: "Download a prebuilt release binary when one exists, instead of compiling. Falls back to cargo build automatically."
    required: false
    default: "true"
  use-image:
    description: "Run hauksbee-ci from the published Docker image instead of downloading a binary or compiling. When true, the prebuilt-download and cargo-build paths are skipped."
    required: false
    default: "false"
  image:
    description: "Image selector for use-image: slim/full (or the canonical :slim/:full tag spelling) resolves through hauksbee-version's immutable Docker digest record; an explicit canonical sha256 digest must occur in the same record. The executed digest's OCI revision must match the release commit."
    required: false
    default: "ghcr.io/hauksbee-dev/hauksbee:slim"

outputs:
  passed:
    description: "true if every assertion passed (mode spec) or the check gate came up green (mode check), false otherwise."
    # When use-image is true the image step ran; otherwise the binary step did.
    value: ${{ inputs.use-image == 'true' && steps.run-image.outputs.passed != '' && steps.run-image.outputs.passed || steps.run.outputs.passed }}
  junit:
    description: "Path to the JUnit XML that was written."
    value: ${{ inputs.use-image == 'true' && steps.run-image.outputs.junit || steps.run.outputs.junit }}

runs:
  using: "composite"
  steps:
    # The hardware repo's own checkout is assumed to have already happened in
    # the calling workflow (so the spec + board + firmware are on disk).

    # When use-image is true, all the binary-acquisition steps below are
    # skipped: hauksbee-ci runs inside the published Docker image instead (see
    # the "Run the hardware check (image)" step). The image already carries the
    # binaries, the model db, and (in the full image) the co-sim backends.

    # 0. Establish the private-distribution boundary before an API lookup,
    # release download or fallback checkout can be mistaken for a missing asset.
    - name: Verify private hauksbee access
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.hauksbee-token }}
        REPO: ${{ inputs.hauksbee-repo }}
        RELEASE_TAG: ${{ steps.reltag.outputs.tag }}
      run: |
        set -euo pipefail
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::hauksbee-token is required for the private $REPO repository"
          exit 1
        fi
        visibility="$(gh api "repos/$REPO" --jq .visibility)" || {
          echo "::error::hauksbee-token cannot read the private $REPO repository"
          exit 1
        }
        if [ "$visibility" != private ]; then
          echo "::error::$REPO reports visibility '$visibility'; refusing the private-distribution path"
          exit 1
        fi

    # 1. Work out what this run actually runs: which mode (spec or check),
    #    which specs (globs expanded), or which board. The logic lives in
    #    resolve-inputs.sh so it can be tested.
    - name: Resolve what to run
      id: resolve
      shell: bash
      env:
        IN_MODE: ${{ inputs.mode }}
        IN_SPEC: ${{ inputs.spec }}
        IN_SPECS: ${{ inputs.specs }}
        IN_BOARD: ${{ inputs.board }}
      run: '"$GITHUB_ACTION_PATH/resolve-inputs.sh"'

    # 2. Decide which release, if any, the prebuilt path downloads (see
    #    pick-release-tag.sh for why a pinned ref must not silently resolve to
    #    the latest release). LATEST is pinned here to the concrete tag it
    #    means right now, so the download cache below can key on it. If no
    #    release exists yet (or the API hiccups) the tag stays empty: no
    #    cache, and the fetch step still tries a plain latest download before
    #    falling back to source.
    - name: Pick prebuilt release tag
      id: reltag
      if: ${{ inputs.use-image == 'true' || inputs.prefer-prebuilt == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.hauksbee-token }}
        REPO: ${{ inputs.hauksbee-repo }}
        REF: ${{ inputs.hauksbee-ref }}
        VERSION: ${{ inputs.hauksbee-version }}
      run: |
        set -euo pipefail
        choice="$("$GITHUB_ACTION_PATH/pick-release-tag.sh" "$VERSION" "$REF" main)"
        tag=""
        if [ "$choice" = "LATEST" ]; then
          tag="$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
        elif [ "$choice" != "SOURCE" ]; then
          tag="$choice"
        fi
        echo "choice=$choice" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        release_sha=""
        if [ -n "$tag" ]; then
          release_sha="$(gh api "repos/$REPO/commits/$tag" --jq .sha)"
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]] && [ "$release_sha" != "$REF" ]; then
            echo "::error::release tag $tag resolves to $release_sha, not pinned ref $REF"
            exit 1
          fi
        fi
        echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
        expected_sha="$release_sha"
        if [ -z "$expected_sha" ] && [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
          expected_sha="$REF"
        fi
        echo "expected-sha=$expected_sha" >> "$GITHUB_OUTPUT"
        # Source fallback must preserve an explicitly selected release. Without
        # this output, a missing platform asset for vX.Y.Z silently built the
        # default main input instead.
        source_ref="$REF"
        if [ -n "$release_sha" ]; then source_ref="$release_sha"; fi
        echo "source-ref=$source_ref" >> "$GITHUB_OUTPUT"

    # 3. Try to download a prebuilt bundle from a GitHub Release, so most
    #    users never compile. Sets steps.prebuilt.outputs.bin (hauksbee-ci)
    #    and engine-bin (hauksbee) on success, and leaves them empty (without
    #    failing) when no matching asset exists.
    - name: Fetch prebuilt hauksbee-ci
      id: prebuilt
      if: ${{ inputs.use-image != 'true' && inputs.prefer-prebuilt == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.hauksbee-token }}
        REPO: ${{ inputs.hauksbee-repo }}
        REF: ${{ inputs.hauksbee-ref }}
        CHOICE: ${{ steps.reltag.outputs.choice }}
        TAG: ${{ steps.reltag.outputs.tag }}
        RELEASE_SHA: ${{ steps.reltag.outputs.expected-sha }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        # Map the runner to the bundle's os-arch label (see scripts/bundle.sh).
        case "$RUNNER_OS" in
          Linux)  os=linux ;;
          macOS)  os=darwin ;;
          *) echo "no prebuilt for $RUNNER_OS; will build from source"; exit 0 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=x86_64 ;;
          ARM64) arch=arm64 ;;
          *) echo "no prebuilt for $RUNNER_ARCH; will build from source"; exit 0 ;;
        esac
        if [ "$CHOICE" = "SOURCE" ]; then
          echo "hauksbee-ref is pinned to '$REF', which is not a release tag."
          echo "Building that ref from source rather than downloading a different build."
          exit 0
        fi
        platform="${os}-${arch}"
        release_sha="$RELEASE_SHA"
        if [ -z "$TAG" ]; then
          echo "no private release is available; will build from source"
          exit 0
        fi
        [ "$(gh api "repos/$REPO/releases/tags/$TAG" --jq .immutable)" = true ] || {
          echo "release $TAG is not immutable; refusing replaceable private assets" >&2
          exit 1
        }
        [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || {
          echo "selected release has no exact commit identity" >&2
          exit 1
        }
        manifest_dir="$(mktemp -d "$RUNNER_TEMP/hauksbee-release-manifest.XXXXXX")"
        trap 'find "$manifest_dir" -depth -mindepth 1 -delete 2>/dev/null || true; rmdir "$manifest_dir" 2>/dev/null || true' EXIT
        asset_glob="hauksbee-*-${os}-${arch}.tar.gz"
        gh release download "$TAG" --repo "$REPO" --pattern "${asset_glob}.sha256" --dir "$manifest_dir" 2>/dev/null || true
        manifest="$(find "$manifest_dir" -maxdepth 1 -type f -name "${asset_glob}.sha256" -print)"
        if [ -z "$manifest" ]; then
          echo "no checksum sidecar for $asset_glob; will build from source"
          exit 0
        fi
        [ "$(printf '%s\n' "$manifest" | wc -l | tr -d ' ')" -eq 1 ] || {
          echo "asset manifest did not resolve to exactly one file for $asset_glob" >&2
          exit 1
        }
        expected_asset_sha256="$(awk 'NF == 2 && $1 ~ /^[0-9a-f]{64}$/ { print $1 }' "$manifest")"
        [ "$(printf '%s\n' "$expected_asset_sha256" | wc -l | tr -d ' ')" -eq 1 ] \
          && [[ "$expected_asset_sha256" =~ ^[0-9a-f]{64}$ ]] || {
          echo "asset manifest did not contain one sha256" >&2
          exit 1
        }
        # Private release archives must not enter the consumer repository's
        # Actions cache: fork workflows can restore base-branch caches.
        archive_cache="$RUNNER_TEMP/hauksbee-private-archives/$platform"
        mkdir -p "$archive_cache"
        tarball="$(find "$archive_cache" -maxdepth 1 -type f -name "$asset_glob" -print -quit)"
        if [ -n "$tarball" ]; then
          cached_sha256="$(if command -v shasum >/dev/null 2>&1; then shasum -a 256 "$tarball"; else sha256sum "$tarball"; fi | awk '{print $1}')"
          if [ "$cached_sha256" != "$expected_asset_sha256" ]; then
            echo "cached archive failed the publisher checksum; quarantining it"
            find "$archive_cache" -maxdepth 1 -type f -name "$asset_glob" -delete
            tarball=""
          fi
        fi
        if [ -z "$tarball" ]; then
          gh release download "$TAG" --repo "$REPO" --pattern "$asset_glob" --dir "$archive_cache" 2>/dev/null || true
          tarball="$(find "$archive_cache" -maxdepth 1 -type f -name "$asset_glob" -print -quit)"
        fi
        if [ -z "$tarball" ]; then
          echo "no prebuilt asset ($asset_glob) found; will build from source"
          exit 0
        fi
        actual_asset_sha256="$(if command -v shasum >/dev/null 2>&1; then shasum -a 256 "$tarball"; else sha256sum "$tarball"; fi | awk '{print $1}')"
        [ "$actual_asset_sha256" = "$expected_asset_sha256" ] || {
          echo "publisher checksum mismatch for $(basename "$tarball")" >&2
          exit 1
        }
        # The repository release policy is immutable. GitHub signs every asset
        # in that release, binding these exact bytes to the protected tag.
        gh release verify-asset "$TAG" "$tarball" --repo "$REPO" >/dev/null
        dl="$RUNNER_TEMP/hauksbee-prebuilt-$platform"
        mkdir -p "$dl"
        find "$dl" -depth -mindepth 1 -delete
        tar -xzf "$tarball" -C "$dl"
        ci_bin="$(find "$dl" -type f -path '*/bin/hauksbee-ci' -perm -111 -print -quit)"
        run_bin="$(find "$dl" -type f -path '*/bin/hauksbee' -perm -111 -print -quit)"
        if [ -z "$ci_bin" ] || [ ! -x "$ci_bin" ] || [ -z "$run_bin" ] || [ ! -x "$run_bin" ]; then
          echo "prebuilt bundle had no usable binaries; will build from source"
          exit 0
        fi
        ci_version="$(env -u GH_TOKEN -u GITHUB_TOKEN -u HAUKSBEE_GITHUB_TOKEN "$ci_bin" --version)"
        engine_version="$(env -u GH_TOKEN -u GITHUB_TOKEN -u HAUKSBEE_GITHUB_TOKEN "$run_bin" --version)"
        [[ "$ci_version" == *"(git $release_sha)"* ]] && [[ "$engine_version" == *"(git $release_sha)"* ]] || {
          echo "prebuilt binaries do not attest release commit $release_sha" >&2
          exit 1
        }
        echo "bin=$ci_bin" >> "$GITHUB_OUTPUT"
        echo "engine-bin=$run_bin" >> "$GITHUB_OUTPUT"
        echo "Using prebuilt binaries from $dl"

    # 4. Fallback: build from source only when no prebuilt bundle was obtained.
    - name: Checkout hauksbee (fallback build)
      if: ${{ inputs.use-image != 'true' && steps.prebuilt.outputs.bin == '' }}
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: ${{ inputs.hauksbee-repo }}
        ref: ${{ steps.reltag.outputs.source-ref || inputs.hauksbee-ref }}
        path: .hauksbee
        token: ${{ inputs.hauksbee-token }}
        persist-credentials: false

    - name: Install Rust toolchain (fallback build)
      if: ${{ inputs.use-image != 'true' && steps.prebuilt.outputs.bin == '' }}
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-08-03
      with:
        # The SHA pin no longer names the toolchain the way @stable did, so it
        # is named explicitly here.
        toolchain: 1.92.0

    # Cache public Cargo downloads only. Never cache `.hauksbee/target`: caches
    # belong to the consumer repository and fork workflows can restore them.
    - name: Cache cargo (fallback build)
      if: ${{ inputs.use-image != 'true' && steps.prebuilt.outputs.bin == '' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: hauksbee-ci-${{ inputs.hauksbee-repo }}-${{ runner.os }}-${{ steps.reltag.outputs.source-ref || inputs.hauksbee-ref }}-${{ hashFiles('.hauksbee/Cargo.lock') }}

    - name: Build hauksbee (fallback build)
      if: ${{ inputs.use-image != 'true' && steps.prebuilt.outputs.bin == '' }}
      shell: bash
      working-directory: .hauksbee
      env:
        MODE: ${{ steps.resolve.outputs.mode }}
      run: |
        set -euo pipefail
        source_sha="$(git rev-parse HEAD)"
        [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid checked-out source identity" >&2; exit 1; }
        # A stock runner has no system libsimavr. Build the honest GPL-free
        # Renode + QEMU feature set; those backends still fail explicitly at
        # runtime when a spec selects an emulator that is not installed.
        if [ "$MODE" = "check" ]; then
          HAUKSBEE_SOURCE_COMMIT="$source_sha" cargo build --release -p hauksbee-engine \
            --no-default-features --features renode,qemu
        else
          HAUKSBEE_SOURCE_COMMIT="$source_sha" cargo build --release -p hauksbee-ci \
            --no-default-features --features renode,qemu
        fi

    # 5. Run the check. Spec mode fans every resolved spec into ONE
    #    hauksbee-ci invocation, which writes one merged JUnit file (a
    #    <testsuite> per spec) and exits with the worst severity. Check mode
    #    runs the engine's --check gate; under GITHUB_ACTIONS with --strict it
    #    emits its own inline annotations.
    - name: Run the hardware check
      id: run
      if: ${{ inputs.use-image != 'true' }}
      shell: bash
      env:
        MODE: ${{ steps.resolve.outputs.mode }}
        BOARD: ${{ steps.resolve.outputs.board }}
        SPECS: ${{ steps.resolve.outputs.specs }}
        JUNIT: ${{ inputs.junit }}
        PREBUILT_CI: ${{ steps.prebuilt.outputs.bin }}
        PREBUILT_ENGINE: ${{ steps.prebuilt.outputs.engine-bin }}
      run: |
        set +e
        if [ "$MODE" = "check" ]; then
          BIN="${PREBUILT_ENGINE:-.hauksbee/target/release/hauksbee}"
          CMD=("$BIN" run "$BOARD" --check --strict)
        else
          BIN="${PREBUILT_CI:-.hauksbee/target/release/hauksbee-ci}"
          CMD=("$BIN" run)
          while IFS= read -r s; do
            [ -n "$s" ] && CMD+=("$s")
          done <<<"$SPECS"
        fi
        if [ -n "$JUNIT" ]; then
          CMD+=(--junit "$JUNIT")
        fi
        "${CMD[@]}"
        code=$?
        if [ "$code" -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi
        echo "junit=$JUNIT" >> "$GITHUB_OUTPUT"
        exit $code

    # 6. Image path: the same two modes, inside the published Docker image.
    #    The calling repo's checkout (spec + board + firmware) is the runner
    #    workspace, mounted read-write at /work so the JUnit XML lands back in
    #    the workspace for the publish step. Run as the host user so that file
    #    is writable by the runner (the image's default user is uid 1000).
    #    GITHUB_ACTIONS is passed through so the binary still emits inline
    #    annotations.
    - name: Authenticate to the private image registry
      id: registry-auth
      if: ${{ inputs.use-image == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.hauksbee-token }}
        REGISTRY_USER_INPUT: ${{ inputs.registry-user }}
      run: |
        set +x
        set -euo pipefail
        config="$(mktemp -d "$RUNNER_TEMP/hauksbee-docker-auth.XXXXXX")"
        chmod 700 "$config"
        echo "docker-config=$config" >> "$GITHUB_OUTPUT"
        registry_user="$("$GITHUB_ACTION_PATH/resolve-registry-user.sh" "$REGISTRY_USER_INPUT" "$GITHUB_ACTOR")"
        printf '%s' "$GH_TOKEN" \
          | docker --config "$config" login ghcr.io --username "$registry_user" --password-stdin

    - name: Run the hardware check (image)
      id: run-image
      if: ${{ inputs.use-image == 'true' }}
      shell: bash
      env:
        MODE: ${{ steps.resolve.outputs.mode }}
        BOARD: ${{ steps.resolve.outputs.board }}
        SPECS: ${{ steps.resolve.outputs.specs }}
        JUNIT: ${{ inputs.junit }}
        IMAGE: ${{ inputs.image }}
        REPO: ${{ inputs.hauksbee-repo }}
        RELEASE_SHA: ${{ steps.reltag.outputs.expected-sha }}
        RELEASE_TAG: ${{ steps.reltag.outputs.tag }}
        GH_TOKEN: ${{ inputs.hauksbee-token }}
        DOCKER_CONFIG: ${{ steps.registry-auth.outputs.docker-config }}
      run: |
        set -euo pipefail
        [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
          echo "::error::use-image requires a release version/ref with an exact commit"
          exit 1
        }
        release_tag="$RELEASE_TAG"
        [[ "$release_tag" =~ ^v[0-9A-Za-z._-]+$ ]] || {
          echo "::error::use-image requires a safe immutable v* release tag"
          exit 1
        }
        [ -n "$release_tag" ] || {
          echo "::error::use-image requires an immutable release tag/version, not only a source SHA"
          exit 1
        }
        digest_tag="container-digests-${release_tag}"
        manifest_dir="$(mktemp -d "$RUNNER_TEMP/hauksbee-image-manifest.XXXXXX")"
        trap 'find "$manifest_dir" -depth -mindepth 1 -delete 2>/dev/null || true; rmdir "$manifest_dir" 2>/dev/null || true' EXIT
        gh release download "$digest_tag" --repo "$REPO" \
          --pattern 'hauksbee-*-docker-digests.txt' --dir "$manifest_dir"
        manifest="$(find "$manifest_dir" -maxdepth 1 -type f -name 'hauksbee-*-docker-digests.txt' -print)"
        [ "$(printf '%s\n' "$manifest" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1 ] || {
          echo "::error::immutable container digest manifest did not resolve uniquely"
          exit 1
        }
        gh release verify "$digest_tag" --repo "$REPO" >/dev/null
        gh release verify-asset "$digest_tag" "$manifest" --repo "$REPO" >/dev/null
        case "$IMAGE" in
          ""|slim|"ghcr.io/${REPO}:slim") image_flavor=slim ;;
          full|"ghcr.io/${REPO}:full") image_flavor=full ;;
          "ghcr.io/${REPO}@"sha256:*) image_flavor= ;;
          *) echo "::error::image must select slim/full or be the canonical ghcr.io/$REPO package at an immutable digest"; exit 1 ;;
        esac
        if [ -n "$image_flavor" ]; then
          IMAGE="$(awk -v flavor="$image_flavor" '$1 == flavor { print $2 }' "$manifest")"
        fi
        [[ "$IMAGE" =~ ^ghcr\.io/${REPO}@sha256:[0-9a-f]{64}$ ]] || {
          echo "::error::immutable manifest did not resolve one canonical image digest"
          exit 1
        }
        awk '$1 == "slim" || $1 == "full" { print $2 }' "$manifest" \
          | grep -Fx "$IMAGE" >/dev/null || {
            echo "::error::image digest is not present in the immutable $digest_tag record"
            exit 1
          }
        docker pull "$IMAGE"
        image_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")"
        [ "$image_revision" = "$RELEASE_SHA" ] || {
          echo "::error::image revision $image_revision does not match release commit $RELEASE_SHA"
          exit 1
        }
        set +e
        if [ "$MODE" = "check" ]; then
          ARGS=(hauksbee run "$BOARD" --check --strict)
        else
          ARGS=(hauksbee-ci run)
          while IFS= read -r s; do
            [ -n "$s" ] && ARGS+=("$s")
          done <<<"$SPECS"
        fi
        if [ -n "$JUNIT" ]; then
          ARGS+=(--junit "$JUNIT")
        fi
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e GITHUB_ACTIONS \
          -v "$GITHUB_WORKSPACE:/work" \
          -w /work \
          "$IMAGE" "${ARGS[@]}"
        code=$?
        if [ "$code" -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi
        echo "junit=$JUNIT" >> "$GITHUB_OUTPUT"
        exit $code

    # Keep the private registry token out of the runner's persistent Docker
    # config. Cleanup is best-effort and always runs, so it cannot replace the
    # hardware check's primary exit status with a logout failure.
    - name: Cleanup private registry credential
      if: ${{ always() && inputs.use-image == 'true' && steps.registry-auth.outputs.docker-config != '' }}
      shell: bash
      env:
        DOCKER_CONFIG: ${{ steps.registry-auth.outputs.docker-config }}
      run: |
        docker logout ghcr.io >/dev/null 2>&1 || true
        find "$DOCKER_CONFIG" -depth -mindepth 1 -delete 2>/dev/null || true
        rmdir "$DOCKER_CONFIG" 2>/dev/null || true

    # Always publish the JUnit results, even when the hardware check failed,
    # so the assertions show up in the PR's Checks tab. Opt out with
    # publish-report: false (fork PRs lack the checks: write this needs; the
    # README documents the two-workflow pattern for that case).
    - name: Publish test report
      if: ${{ always() && inputs.junit != '' && inputs.publish-report == 'true' }}
      uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
      with:
        report_paths: ${{ inputs.junit }}
        check_name: "hauksbee-ci (hardware)"
