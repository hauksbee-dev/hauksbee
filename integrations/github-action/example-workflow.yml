# Copy this into your HARDWARE repo as .github/workflows/hauksbee-ci.yml
#
# It runs hauksbee-ci on every push and pull request that touches the board or
# firmware, so a layout change that would brown out the rail (or break the
# blink, or silence the UART) turns the build red before anyone touches a
# soldering iron.

name: hardware-ci

# contents: read checks out the repo; checks: write lets the action publish
# the JUnit results to the Checks tab. On a pull request from a FORK the token
# is read-only regardless, so pass publish-report: false there and publish
# from a separate workflow_run workflow (see the README).
permissions:
  contents: read
  checks: write

on:
  push:
    paths:
      - "hardware/**"
      - "firmware/**"
      - "ci/**.toml"
  pull_request:
    paths:
      - "hardware/**"
      - "firmware/**"
      - "ci/**.toml"

jobs:
  power-up:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out YOUR hardware repo (board + firmware + spec).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 2. Fetch the private Action code. HAUKSBEE_READ_TOKEN is a fine-grained
      # PAT or GitHub App installation token with Contents: read on the private
      # hauksbee repository; the consumer repo's github.token cannot do this.
      - name: Fetch the private hauksbee Action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: hauksbee-dev/hauksbee
          # Replace this with the 40-character commit printed by the v0.1.0
          # release. A tag is not an immutable credential boundary.
          ref: REPLACE_WITH_RELEASE_COMMIT_SHA
          path: .hauksbee-action
          token: ${{ secrets.HAUKSBEE_READ_TOKEN }}
          persist-credentials: false

      # 3. (Optional) build your firmware here, so the ELF the spec points at
      #    exists. For an AVR project that is usually a `make` in firmware/.
      # - name: Build firmware
      #   run: make -C firmware

      # 4. Run the hardware check. The action fetches hauksbee-ci, runs your
      #    spec, writes JUnit XML, and emits inline annotations. Pin the
      #    action to the exact release commit above. The separate version input
      #    names the release assets, and the Action verifies both identities.
      - name: hauksbee-ci power-up check
        uses: ./.hauksbee-action/integrations/github-action
        with:
          hauksbee-token: ${{ secrets.HAUKSBEE_READ_TOKEN }}
          hauksbee-ref: REPLACE_WITH_RELEASE_COMMIT_SHA
          hauksbee-version: v0.1.0
          spec: ci/power-up.toml
          junit: hauksbee-ci-results.xml

  # A matrix is the natural way to run several specs (power-up, blink,
  # brown-out across supplies) in parallel. To run them all in ONE job with
  # one merged JUnit file instead, pass `specs: ci/*.toml`.
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec:
          - ci/power-up.toml
          - ci/blink.toml
          - ci/brownout.toml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: hauksbee-dev/hauksbee
          ref: REPLACE_WITH_RELEASE_COMMIT_SHA
          path: .hauksbee-action
          token: ${{ secrets.HAUKSBEE_READ_TOKEN }}
          persist-credentials: false
      - uses: ./.hauksbee-action/integrations/github-action
        with:
          hauksbee-token: ${{ secrets.HAUKSBEE_READ_TOKEN }}
          hauksbee-ref: REPLACE_WITH_RELEASE_COMMIT_SHA
          hauksbee-version: v0.1.0
          spec: ${{ matrix.spec }}
          junit: results-${{ strategy.job-index }}.xml
