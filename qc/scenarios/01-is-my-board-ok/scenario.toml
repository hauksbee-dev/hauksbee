title = "Is my board OK?"
persona = "Someone who has never run the tool, holding a board they did not design."
goal = """
Point the tool at a real board, get an answer in plain language, and be able to
tell from the answer whether anything needs doing. Nothing in what comes back
should require knowing how the tool is built.
"""
success = """
The plain report names each check it ran, states a verdict for each one in
words a non-engineer can act on, says out loud where the analysis is
incomplete, and closes by naming the next command. No struct field, JSON key,
or Rust identifier appears anywhere in the text. Both verdict shapes are
exercised: Watchy's identity-only SR2 supervisor is honestly refused a clean
bill, while an existing fully executable board earns one.
"""

[[step]]
name = "Watchy's unsupported active IC is refused a clean bill"
do = "run"
cmd = ["{bin}/hauksbee", "run", "{repo}/crates/hauksbee-ci/examples/boards/watchy.kicad_pcb", "--check", "--plain"]
exit = 0
max_seconds = 30
# Every section a --check pass owes the reader, plus the honesty vocabulary on
# the real board whose SR2 supervisor has identity metadata but no executable
# behaviour. Static copper remains valid; model-dependent claims do not.
contains = [
  "== Copper spacing (DRC) ==",
  "== Connectivity / lint (incl. MCU resource conflicts, boot strap pins) ==",
  "== Signal integrity ==",
  "== What this pass did not check ==",
  "active IC(s) are unresolved/open",
  "INCOMPLETE",
  "Why it matters:",
  "What to do:",
  "Heads up (worth knowing, not a failure):",
  "hauksbee-ci init <board>",
]
matches = [
  "^Looks healthy: no copper spacing \\(drc\\) problems found\\.$",
  # The model-dependent sections must say INCONCLUSIVE and name U1, rather than
  # turning an identity-only SR2 card into a behavioural clean bill.
  "^INCONCLUSIVE: 1 current-carrying / active part\\(s\\) have no model \\(U1\\)",
  # Informational SI observations must remain visible under the inconclusive
  # verdict even though Watchy can no longer exercise the clean wording.
  "^INCONCLUSIVE: .* Plus 3 things worth a look \\(see below\\)\\.$",
  "^VERDICT: inconclusive: 0 serious, 3 worth a look; 1 key part has no usable model \\(U1\\), so the checks cannot vouch for this board; next: ",
  # U1 reaches every net through the circuit, so no electrical check is judged
  # and nothing reads as partly judged; the clean wiring checks are a line of
  # information on the same verdict, never a pass.
  "^VERDICT: inconclusive: .* For information only, not a pass: the wiring and value checks on the [0-9]+ of [0-9]+ net\\(s\\) U1 does not connect to found nothing that fails",
  "run --report for the (bind table|[0-9]+-part bind table)",
]
not_matches = [
  "critical_parts_bound",
  "active_path_unresolved",
  "serious_count",
  "actionable_count",
  "schema_version",
  "\\bBindSummary\\b",
  "\\bJsonReport\\b",
  "\\bSpecError\\b",
  "\\bOutputMode\\b",
  "unwrap\\(\\)",
  "panicked at",
  "RUST_BACKTRACE",
  "\\ba a\\b",
  "\\bthe the\\b",
]

[[step]]
name = "an executable existing board earns a clean bill"
do = "run"
cmd = ["{bin}/hauksbee", "run", "{repo}/crates/hauksbee-ci/examples/boards/blinky.kicad_pcb", "--check", "--plain"]
exit = 0
max_seconds = 30
contains = [
  "== Copper spacing (DRC; DEFAULT rules, not your rules) ==",
  "== Connectivity / lint (incl. MCU resource conflicts, boot strap pins) ==",
  "== Signal integrity ==",
  "== What this pass did not check ==",
  "hauksbee-ci init <board>",
]
matches = [
  "^Looks healthy: no copper spacing \\(drc\\) problems found\\.$",
  "^Looks healthy: no connectivity problems found\\.$",
  "^Looks healthy: no signal-integrity problems found\\.$",
  "^VERDICT: clean: 0 serious, 0 worth a look$",
]
not_matches = [
  "INCONCLUSIVE",
  "INCOMPLETE",
  "active IC\\(s\\) are unresolved/open",
  "critical_parts_bound",
  "active_path_unresolved",
  "serious_count",
  "actionable_count",
  "schema_version",
  "panicked at",
  "\\ba a\\b",
  "\\bthe the\\b",
]

[[step]]
name = "the same board, --report, agrees about the bind"
do = "run"
cmd = ["{bin}/hauksbee", "run", "{repo}/crates/hauksbee-ci/examples/boards/watchy.kicad_pcb", "--report"]
exit = 0
max_seconds = 30
contains = ["bind summary:", "Critical active devices discovered:"]
matches = [
  "^60 of 67 non-ignored components resolved",
  # The suggestion --check --plain makes about --report has to be true of the
  # table --report actually prints; pin both Watchy's whole bind and the
  # identity-only SR2 gap rather than accepting an arbitrary count.
  "^bind summary: extracted 67 non-ignored parts; 60 have executable/fallback models\\. Critical active devices discovered: 6; executable behavioural models: 5/6",
  "^.*U1.*SR2HARU.*sr2.*UNRESOLVED \\(identity matched mode",
  "^.*U1: U1 \\(SR2HARU\\): sr2 has no generic executable device behavior; only identity and sourced metadata are available; identity matched model 'sr2', but the part remains OPEN$",
]
