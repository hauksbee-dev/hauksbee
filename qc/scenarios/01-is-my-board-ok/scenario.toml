title = "Is my board OK?"
persona = "Someone who has never run the tool, holding a board they did not design."
goal = """
Point the tool at a real board, get an answer in plain language, and be able to
tell from the answer whether anything needs doing. Nothing in what comes back
should require knowing how the tool is built.
"""
success = """
The plain report names each check it ran, states a verdict for each one in
words a non-engineer can act on, says out loud where the analysis is
incomplete, and closes by naming the next command. No struct field, JSON key,
or Rust identifier appears anywhere in the text. Both verdict shapes are
exercised: a fully-modelled board earns its clean bill, and a board with an
unmodelled active IC is refused one in the INCONCLUSIVE vocabulary.
"""

[[step]]
name = "the whole static suite in plain language"
do = "run"
cmd = ["{bin}/hauksbee", "run", "{repo}/crates/hauksbee-ci/examples/boards/watchy.kicad_pcb", "--check", "--plain"]
exit = 0
max_seconds = 30
# Every section a --check pass owes the reader, each with its own verdict line.
contains = [
  "== Copper spacing (DRC) ==",
  "== Connectivity / lint (incl. MCU resource conflicts, boot strap pins) ==",
  "== Signal integrity ==",
  "== What this pass did not check ==",
  "Why it matters:",
  "What to do:",
  # The SI heads-up notes survive underneath the clean verdict: a clean bill
  # must not swallow the observations worth a look.
  "Heads up (worth knowing, not a failure):",
  # And it must hand the reader the next command rather than stopping at a verdict.
  "hauksbee-ci init <board>",
]
matches = [
  # Per-section verdicts, worded for a person. Watchy ships with its own
  # .kicad_pro (min clearance 0.15 mm), under which the copper is clean, so
  # the DRC section reads healthy rather than listing warnings.
  "^Looks healthy: no copper spacing \\(drc\\) problems found\\.$",
  # Every active IC on this board is modelled (the last two, the SR2 reset
  # supervisor and the BMA423, got curated entries), so the model-dependent
  # sections have EARNED their clean bills: no INCONCLUSIVE hedging where the
  # evidence is complete would be the opposite failure of a vacuous clean.
  "^Looks healthy: no connectivity problems found\\.$",
  "^No signal-integrity failures, but [0-9]+ things? worth a look \\(see below\\)\\.$",
  # The closing line owns the same claim.
  "^VERDICT: clean: 0 serious, [0-9]+ worth a look",
]
# The internals must not leak into the persona surface. These are the real
# identifiers the JSON/struct layer uses; in plain text they are noise a
# non-engineer cannot act on. A fully-bound board must also NOT carry the
# incomplete-analysis banner: hedging over nothing erodes the same trust a
# vacuous clean does.
not_matches = [
  "INCONCLUSIVE",
  "INCOMPLETE",
  "active IC\\(s\\) are unresolved/open",
  "critical_parts_bound",
  "active_path_unresolved",
  "serious_count",
  "actionable_count",
  "schema_version",
  "\\bBindSummary\\b",
  "\\bJsonReport\\b",
  "\\bSpecError\\b",
  "\\bOutputMode\\b",
  "unwrap\\(\\)",
  "panicked at",
  "RUST_BACKTRACE",
  # A doubled article is the classic template-assembly tell.
  "\\ba a\\b",
  "\\bthe the\\b",
]

[[step]]
name = "a board with an unmodelled active IC is refused a clean bill"
do = "run"
cmd = ["{bin}/hauksbee", "run", "{repo}/crates/hauksbee-engine/tests/fixtures/plain_check_open_active_ic.kicad_pcb", "--check", "--plain"]
exit = 0
max_seconds = 30
# The honesty vocabulary, on the board that has the condition. This board (the
# engine's own plain-check fixture) exists to hold one unbound active IC, so
# the INCONCLUSIVE surface stays under test now that the watchy sample earned
# a full bind. One composition this fixture cannot produce: INCONCLUSIVE with
# SI heads-up notes underneath ("Plus N things worth a look"), because the
# board is too bare to generate a heads-up. That never-bury rule is pinned at
# the unit layer instead: plain.rs, inconclusive_verdict_keeps_the_heads_up_pointer.
contains = [
  # The honesty banner: an active IC has no model, and the report says so up
  # front rather than reading healthy.
  "active IC(s) are unresolved/open",
  "INCOMPLETE",
]
matches = [
  # The copper check reads the layout and needs no device model, so it alone
  # may still claim health while an IC is unmodelled.
  "^Looks healthy: no copper spacing \\(drc\\) problems found\\.$",
  # The model-dependent sections must each say INCONCLUSIVE, count the
  # unmodelled parts, name them, and say what unlocks a conclusive verdict.
  "^INCONCLUSIVE: [0-9]+ current-carrying / active part\\(s\\) have no model \\(U[0-9]+",
  # And the report's closing line refuses the clean claim too.
  "^VERDICT: inconclusive: 0 serious, [0-9]+ worth a look; [0-9]+ current-carrying / active part\\(s\\) have no model",
  # The banner points at `--report` for the bind table; the pointer must not
  # invent a count the table cannot honour.
  "run --report for the (bind table|[0-9]+-part bind table)",
]
not_matches = [
  "critical_parts_bound",
  "active_path_unresolved",
  "serious_count",
  "schema_version",
  "panicked at",
  "\\ba a\\b",
  "\\bthe the\\b",
]

[[step]]
name = "the same board, --report, agrees about the bind"
do = "run"
cmd = ["{bin}/hauksbee", "run", "{repo}/crates/hauksbee-ci/examples/boards/watchy.kicad_pcb", "--report"]
exit = 0
max_seconds = 30
contains = ["bind summary:", "Critical parts modelled:"]
matches = [
  "^[0-9]+ of [0-9]+ non-ignored components resolved",
  # The suggestion --check --plain makes about --report has to be true of the
  # table --report actually prints; this pins the table's real size.
  "^bind summary: [0-9]+ of [0-9]+ non-ignored parts resolved",
]
