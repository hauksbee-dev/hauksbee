# Public datasheets whose reviewed cards already exist in crates/hauksbee-models/db.
# Every url is copied from the card itself: its [[models.source.references]] url, or,
# where the card carries none (url_from = "comment"), the datasheet URL its own
# source comment names. `part` is a real orderable number the card's match rule
# accepts. `kind` is the card's own kind (what `--kind` is given). Scoring reads the
# reference from db/<db> by `card` id; test_score.py checks all of this stays true.
schema_version = 1

[[cases]]
part = "AP2125K-3.3TRG1"
kind = "vreg"
db = "vreg.toml"
card = "ap2125k_3v3"
url = "https://www.diodes.com/assets/Datasheets/AP2125.pdf"
why = "LDO; tricky pins: the K suffix is SOT-25 and the N suffix is SOT-89, with different pin orders in one sheet"

[[cases]]
part = "TPS70918DBVR"
kind = "vreg"
db = "vreg.toml"
card = "tps70918_dbv"
url = "https://www.ti.com/lit/ds/symlink/tps709.pdf"
why = "fixed-output LDO family sheet; the DBV SOT-23-5 pin map and the fixed-voltage suffix must be picked out"

