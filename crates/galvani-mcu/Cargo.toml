[package]
name = "galvani-mcu"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "Generalized MCU emulation bridge (simavr-backed AVR)"

[features]
# `avr` links libsimavr (GPL-3.0) and builds the AvrMcu backend.
# `renode` builds the process-driven RenodeBackend (pure std, no native link).
# Both are on by default; either can be disabled for a lighter build.
default = ["avr", "renode"]
avr = []
renode = []

[dependencies]
anyhow = { workspace = true }
libc = "0.2"

[build-dependencies]
bindgen = "0.71"
pkg-config = "0.3"

[dev-dependencies]
