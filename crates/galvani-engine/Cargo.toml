[package]
name = "galvani-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Integration heart: binds an extracted board to models and co-simulates analog + MCU + digital"

[features]
# Propagate the MCU backend choices. All on by default so the engine runs AVR,
# Renode (STM32 / nRF52 / RISC-V), and Espressif-QEMU (ESP32 family) firmware
# out of the box. A `--no-default-features --features renode,qemu` build is
# GPL-free (no libsimavr link).
default = ["avr", "renode", "qemu"]
avr = ["galvani-mcu/avr"]
renode = ["galvani-mcu/renode"]
qemu = ["galvani-mcu/qemu"]

[[bin]]
name = "galvani"
path = "src/main.rs"

[lib]
name = "galvani_engine"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
galvani-extract = { version = "0.1.0", path = "../galvani-extract" }
galvani-models = { version = "0.1.0", path = "../galvani-models" }
galvani-ir = { version = "0.1.0", path = "../galvani-ir" }
galvani-solve = { version = "0.1.0", path = "../galvani-solve" }
galvani-mcu = { version = "0.1.0", path = "../galvani-mcu", default-features = false }
galvani-server = { version = "0.1.0", path = "../galvani-server" }
forge-model = { workspace = true }
forge-codegen = { workspace = true }
tokio = { version = "1.52.3", features = ["full"] }
toml = "0.8"
