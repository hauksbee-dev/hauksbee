[package]
name = "hauksbee-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Test-asset location for hauksbee's suites."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# A dev-only helper: it exists so every suite shares one answer about where the
# board corpus lives, and has no business on crates.io.
publish = false

[dependencies]
# `circuits`: shared MNA device-literal builders for every crate's tests, so
# a resistor/capacitor/etc. fixture is written once instead of copied into
# each suite as a raw `Device::X { .. }` struct literal.
hauksbee-ir = { version = "0.1.0-beta.6", path = "../hauksbee-ir" }

[lints]
workspace = true
