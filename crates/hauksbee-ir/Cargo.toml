[package]
autotests = false
name = "hauksbee-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Circuit intermediate representation and SPICE netlist front-end for hauksbee."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
strum = { version = "0.27", features = ["derive"] }
serde = { workspace = true }
# `float_roundtrip`: a run record's `record_id` is re-verified after the record
# is read back from disk, which needs every f64 to parse to the exact bits it
# was written from (the default parser may be one ULP off).
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.11"
# The evidence spine (`evidence.rs`) is the one vocabulary every producer and
# renderer reads, and it reaches the published `--json` contract, which has a
# schema drift test. Deriving the schema where the types live is what keeps that
# contract from being described twice; the version matches the engine's and ci's.
schemars = "1.2"
thiserror = { workspace = true }
# The `.param` / `{expr}` environment and subckt parameter substitution evaluate
# arithmetic expressions in the SPICE front-end. `evalexpr` is already the
# workspace's expression engine (hauksbee-engine's behavioral/logic/register-map
# code uses it); the SPICE loader consuming it here is a deliberate dependency
# edge, the same environment the future B-source
# (§2.5) will consume, built once. `default-features = false` matches engine.
# Keep this on the final MIT-licensed line. evalexpr 12+ is AGPL-3.0-only and
# must never enter the published Apache-2.0 permissive shape.
evalexpr = { version = "=11.3.1", default-features = false }

[dev-dependencies]
# The run-record drift test validates emitted records against the generated
# schema, the same validator and version hauksbee-ci's report drift test uses.
jsonschema = { version = "0.49", default-features = false }

[[test]]
name = "it"
path = "tests/main.rs"

[lints]
workspace = true

[package.metadata.ci]
# Which CI test shard runs this crate; scripts/workspace_crates.py builds the matrix from it.
test-shard = "foundations"
