# ===========================================================================
# Microchip SAM D5x / E5x, J variant, 64-pin TQFP (ATSAMD51J*).
#
# The conflict class for this part is the QSPI pin group. The QSPI peripheral on
# SAM D5x is NOT routable through the PORT mux to arbitrary pins: its six signals
# are fixed to PA08..PA11 (DATA0..3), PB10 (SCK), PB11 (CS) [SAM D5x/E5x Family
# Data Sheet, Table 6-1 "PORT Function Multiplexing", peripheral function "H"
# (QSPI), and section 36 "QSPI"]. Those same PA08..PA11 pads also carry SERCOM
# and other PORT functions in the mux, so a designer CAN wire an ordinary SPI
# device to them, but then the four pads are committed to whichever peripheral
# is selected: a device on PA08..PA11 driven over SERCOM (bit-banged / SPI host)
# blocks the QSPI controller, and vice-versa. The pads form ONE resource group
# ("qspi_data"); any non-QSPI use of a member pad conflicts with QSPI use of the
# group.
#
# Pad numbers are the TQFP64 datasheet pin numbers (= the Eagle package pad
# names on the SparkFun board). PA08=pin17, PA09=pin18, PA10=pin19, PA11=pin20,
# PB10=pin23, PB11=pin24 (SAM D5x/E5x Data Sheet, Table 5-1 "Pinout, 64-pin").
# ---------------------------------------------------------------------------
[[mcu]]
id = "samd51j_tqfp64"
description = "Microchip SAM D51 J-variant, 64-pin TQFP (ATSAMD51J20A etc)"
min_pins = 40

[mcu.match]
value_re = "(?i)^ATSAM(D|E)5(1|3|4)J.*"
lib_re   = "(?i)(SAMD51|ATSAMD5)"

# Each QSPI pad: its port name, the QSPI signal it carries, and the resource
# *group* it belongs to. The `qspi_data` rows (PA08..PA11) are the four QSPI
# DATA lines: these are the discriminator pads. A CORRECTLY-wired QSPI flash
# drives them as IO0..IO3 (quad data) with SCK/CS on the dedicated PB10/PB11;
# the SparkFun BUG instead wires a 4-wire SERCOM SPI flash (MOSI/MISO/SCK/CS)
# ONTO these data pads. So the conflict is only real when an SPI control/2-wire
# signal (SCK / CS / MOSI / MISO by net role) lands on a DATA pad - that proves
# SERCOM-SPI use of the QSPI data bus, not QSPI use. `data = true` marks the
# discriminator pads; `sck`/`cs` mark the dedicated QSPI clock/select pads (a
# signal on those alone is normal QSPI and must NOT fire).
[mcu.pins]
"17" = { port = "PA08", qspi = "DATA0", group = "qspi_data", data = true }
"18" = { port = "PA09", qspi = "DATA1", group = "qspi_data", data = true }
"19" = { port = "PA10", qspi = "DATA2", group = "qspi_data", data = true }
"20" = { port = "PA11", qspi = "DATA3", group = "qspi_data", data = true }
"23" = { port = "PB10", qspi = "SCK",   group = "qspi_sck" }
"24" = { port = "PB11", qspi = "CS",    group = "qspi_cs" }

# ===========================================================================
# ESP32 (original). Recorded HONESTLY as having no fixed peripheral-pin
# conflicts of this class: the ESP32 GPIO matrix routes almost every digital
# peripheral (SPI host, I2C, UART, LEDC/PWM, PCNT, ...) to almost any GPIO, so
# two functions never fight over a fixed silicon instance the way RP2040 PWM
# slices or SAMD51 QSPI pins do. The only true pin-bound constraints are the
# strapping pins (boot mode) and the ADC2 / WiFi mutual-exclusion and the
# input-only GPIO34..39 - and those are a DIFFERENT class (boot-strap /
# analog), handled elsewhere, not "two functions want one peripheral instance".
# This block exists so the check can state, for an ESP32 board, "no fixed
# resource conflicts in this class" rather than silently having no opinion.
# ---------------------------------------------------------------------------
[[mcu]]
id = "esp32_gpio_matrix"
description = "Espressif ESP32 (GPIO matrix: digital peripherals fully routable)"
fully_routable = true   # no fixed peripheral-pin conflicts; see comment above

[mcu.match]
value_re = "(?i)^ESP32(-?WROOM|-?WROVER|-?PICO)?.*"
lib_re   = "(?i)ESP32"

# No [mcu.pins]: a fully_routable MCU has no fixed {pin->instance} bindings in
# this class. The check must NOT manufacture a conflict for it.
