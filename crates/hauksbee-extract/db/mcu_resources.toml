"16" = { gpio = "GP13", pwm = "6B" }
"17" = { gpio = "GP14", pwm = "7A" }
"18" = { gpio = "GP15", pwm = "7B" }
"27" = { gpio = "GP16", pwm = "0A" }
"28" = { gpio = "GP17", pwm = "0B" }
"29" = { gpio = "GP18", pwm = "1A" }
"30" = { gpio = "GP19", pwm = "1B" }
"31" = { gpio = "GP20", pwm = "2A" }
