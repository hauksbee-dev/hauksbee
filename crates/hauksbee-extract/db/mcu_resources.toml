# MCU internal resource map: per-MCU, per-pin assignment of the *shared silicon
# resources* whose contention is invisible at the netlist level but real inside
# the die. The resource-conflict check (`resource_conflict.rs`) reads this to
# decide whether two board-level functions that the netlist routes to different
# pins can actually be served at the same time by the MCU's peripherals.
#
# The unit of conflict is a "resource instance": a PWM slice+channel, a SERCOM
# instance, a QSPI pin group, a timer channel, an ADC instance. Two demanded
# functions that need the *same* instance, in incompatible ways, cannot both be
# satisfied. That is the class this table makes checkable.
#
# Keys are PIN/PAD NUMBERS exactly as they appear in the extracted board
# (`Pin.number`), because the netlist/PCB paths carry pad numbers reliably but
# NOT pin functions (the KiCad-5 `.net` and the Eagle `.brd` both drop
# `pinfunction`). So this is the source of truth for "pad N of this part is GPIO
# X, on PWM slice S channel C", authored by hand from the reference manual with
# the section cited per block, and (for RP2040) cross-checked against an
# automated datasheet extraction (see docs/checks/RESOURCE_CONFLICTS.md).
#
# `match.value_re` / `match.lib_re` identify the part the same way the model DB
# does. The first table whose match hits a component owns that component's pins.

# ===========================================================================
# RP2040 as the Raspberry-Pi-Pico-form module ("RP2040_PLATFORM" on the Olimex
# RP2040-PICO-PC, and the genuine Pico). 40-pin module; pad numbers are the
# module's castellated-pad numbers (pad 1 = GP0 ... the Pico pinout), NOT the
# bare QFN pin numbers.
#
# PWM mapping rule (RP2040 datasheet, section 4.5.2 "Programmer's Model", and
# Table 525 "GPIO functions": each GPIO n is hardwired to PWM slice = (n>>1)&7,
# channel A when n is even, channel B when n is odd). There are 8 slices (0..7),
# each with channels A and B. The resource instance the check models is the pair
# {slice, channel}: only ONE GPIO can drive a given {slice, channel} as a PWM
# output at a time, so two PWM functions on the same {slice, channel} is a hard,
# no-valid-assignment conflict. (The two channels of a slice also share the
# slice counter/TOP - RP2040 4.5.2.1 "both channels share the same counter" - so
# two functions on different channels of one slice cannot have independent
# frequencies. That weaker, same-slice/different-channel constraint is NOT
# flagged here; the check models only the hard same-{slice,channel} collision,
# which both known bugs are.)
# ---------------------------------------------------------------------------
[[mcu]]
id = "rp2040_pico_module"
description = "RP2040 on a Raspberry-Pi-Pico-form 40-pin carrier module"
# A real Pico-form module is a 40-pin part. The guard stops a loose name match on
# a small part (e.g. a buffer carrying a `...RP2040-PICO-PC...-rescue` library id,
# or a 1-pin mounting hole) from being mistaken for the module.
min_pins = 30

[mcu.match]
# Match the carrier's symbol part name or a genuine Raspberry Pi Pico symbol.
# The Olimex carrier symbol was renamed across revisions: `RP_pico2040` (rev B)
# then `RP2040_PLATFORM` (rev C/D) - both are the same 40-pin Pico-form module
# (footprint RP_Pico2040). Deliberately NOT a bare "Pico" substring: that would
# match the `RP2040-PICO-PC...-rescue` rescue-library id on every part.
value_re = "(?i)^(RP2040_PLATFORM|RP_pico2040|RaspberryPi[-_ ]?Pico|Raspberry[-_ ]?Pi[-_ ]?Pico)$"
lib_re   = "(?i)(:RP2040_PLATFORM$|:RP_pico2040$|MCU_RaspberryPi:Pico|RaspberryPi_Pico)"

# pad -> "GPnn" and the PWM slice/channel that GPnn is hardwired to. Only the
# pads that carry a GPIO are listed (power/GND/RUN/debug pads are not resources
# in this class). Derived from the Pico pad map x the (n>>1)&7 / A|B rule.
# Format: pad = { gpio = "GPnn", pwm = "Ns" } where N is the slice 0..7 and the
# trailing letter is the channel. adc = "ADCk" added where the pad is an ADC pin.
[mcu.pins]
"1"  = { gpio = "GP0",  pwm = "0A" }
"2"  = { gpio = "GP1",  pwm = "0B" }
"4"  = { gpio = "GP2",  pwm = "1A" }
"5"  = { gpio = "GP3",  pwm = "1B" }
"6"  = { gpio = "GP4",  pwm = "2A" }
"7"  = { gpio = "GP5",  pwm = "2B" }
"9"  = { gpio = "GP6",  pwm = "3A" }
"10" = { gpio = "GP7",  pwm = "3B" }
"11" = { gpio = "GP8",  pwm = "4A" }
"12" = { gpio = "GP9",  pwm = "4B" }
"14" = { gpio = "GP10", pwm = "5A" }
"15" = { gpio = "GP11", pwm = "5B" }
"16" = { gpio = "GP12", pwm = "6A" }
"17" = { gpio = "GP13", pwm = "6B" }
"19" = { gpio = "GP14", pwm = "7A" }
"20" = { gpio = "GP15", pwm = "7B" }
"21" = { gpio = "GP16", pwm = "0A" }
"22" = { gpio = "GP17", pwm = "0B" }
"24" = { gpio = "GP18", pwm = "1A" }
"25" = { gpio = "GP19", pwm = "1B" }
"26" = { gpio = "GP20", pwm = "2A" }
"27" = { gpio = "GP21", pwm = "2B" }
"29" = { gpio = "GP22", pwm = "3A" }
"31" = { gpio = "GP26", pwm = "5A", adc = "ADC0" }
"32" = { gpio = "GP27", pwm = "5B", adc = "ADC1" }
"34" = { gpio = "GP28", pwm = "6A", adc = "ADC2" }

# ===========================================================================
# RP2040 as the bare QFN-56 chip (e.g. the official RP2040-minimal KiCad board).
# Here the GPIO function lands on the chip pad whose number is the QFN pin, so
# the pad->GPIO map is the datasheet's pin table (RP2040 datasheet Table 2,
# "Pin Locations", QFN-56). Same PWM (n>>1)&7 / A|B rule.
# ---------------------------------------------------------------------------
[[mcu]]
id = "rp2040_qfn56"
description = "RP2040 bare QFN-56 chip"
min_pins = 30

[mcu.match]
value_re = "(?i)^RP2040$"
lib_re   = "(?i):RP2040$"

[mcu.pins]
# QFN-56 GPIO pins (datasheet Table 2). IOVDD/DVDD/GND/QSPI/USB/XIN pins omitted.
"2"  = { gpio = "GP0",  pwm = "0A" }
"3"  = { gpio = "GP1",  pwm = "0B" }
"4"  = { gpio = "GP2",  pwm = "1A" }
"5"  = { gpio = "GP3",  pwm = "1B" }
"6"  = { gpio = "GP4",  pwm = "2A" }
"7"  = { gpio = "GP5",  pwm = "2B" }
"8"  = { gpio = "GP6",  pwm = "3A" }
"9"  = { gpio = "GP7",  pwm = "3B" }
"11" = { gpio = "GP8",  pwm = "4A" }
"12" = { gpio = "GP9",  pwm = "4B" }
"13" = { gpio = "GP10", pwm = "5A" }
