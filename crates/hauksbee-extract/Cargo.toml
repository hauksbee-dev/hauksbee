[package]
name = "hauksbee-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Extracts the circuit a PCB implements: components, pads, nets, connectivity"

[[bin]]
name = "resource-extract"
path = "src/bin/resource_extract.rs"

[dependencies]
cfb = "0.14"
forge-sexpr.workspace = true
# For the single canonical value parser (`value::parse_value`): the SI-check and
# net-lint resistor parsers delegate to it so all three never drift apart again
# (R23–R25 saw repeated µ/ohm-glyph/MEG/milli/annotation divergences).
hauksbee-models = { version = "0.1.0", path = "../hauksbee-models" }
gerber-types = "0.7.0"
gerber_parser = "0.5.0"
quick-xml = "0.40.1"
regex = "1"
rstar = "0.13"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
hauksbee-testkit = { path = "../hauksbee-testkit" }

[lints]
workspace = true
