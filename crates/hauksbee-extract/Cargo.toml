[package]
name = "hauksbee-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Extracts the circuit a PCB implements: components, pads, nets, connectivity"

[[bin]]
name = "resource-extract"
path = "src/bin/resource_extract.rs"

[dependencies]
cfb = "0.14"
forge-sexpr.workspace = true
gerber-types = "0.7.0"
gerber_parser = "0.5.0"
quick-xml = "0.40.1"
regex = "1"
rstar = "0.13"
serde.workspace = true
thiserror.workspace = true
toml = "0.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
