[package]
name = "hauksbee-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Extracts the circuit a PCB implements: components, pads, nets, connectivity"

[[bin]]
name = "resource-extract"
path = "src/bin/resource_extract.rs"

[dependencies]
hauksbee-ir = { version = "0.1.0-beta.1", path = "../hauksbee-ir" }
cfb = "0.14"
forge-sexpr.workspace = true
# For the single canonical value parser (`value::parse_value`): the SI-check and
# net-lint resistor parsers delegate to it so all three never drift apart again
# (R23–R25 saw repeated µ/ohm-glyph/MEG/milli/annotation divergences).
hauksbee-models = { version = "0.1.0-beta.1", path = "../hauksbee-models" }
gerber-types = "0.7.0"
gerber_parser = "0.5.0"
# Exact RS-274X painter operations. Clear polarity is a geometric difference,
# including when it splits a track, pad, or concave pour into separate pieces.
geo = { version = "0.33.1", default-features = false }
quick-xml = "0.40.1"
regex = "1"
rstar = "0.13"
encoding_rs = "0.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# ODB++ archives. The spec's distribution form is a gzipped tar and Altium and
# Cadence both write one; ODB++ also permits any individual file inside a job to
# be stored gzipped with a `.Z` suffix, which real fab archives use for the large
# `features` files. `tar` is the crate cargo itself uses and `flate2` was already
# in the tree (zip's deflate backend), so neither is a new supply-chain surface.
flate2 = "1"
tar = "0.4"

[dev-dependencies]
hauksbee-testkit = { path = "../hauksbee-testkit" }

[lints]
workspace = true
