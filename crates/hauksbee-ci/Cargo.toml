[package]
name = "hauksbee-ci"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "CI for hardware: run a board+firmware spec headless, assert on rails/UART/blink/faults, emit JUnit + GitHub annotations"

[features]
# Mirror the engine's MCU backend features so `cargo build -p hauksbee-ci
# --no-default-features --features renode,qemu` (the GPL-free release shape;
# see docs/about/release-and-licensing.md) resolves against THIS package. All on by
# default, matching the engine. `avr` pulls in GPL-3.0 libsimavr.
default = ["serve", "avr", "renode", "qemu"]
serve = ["dep:hauksbee-server", "hauksbee-engine/serve"]
avr = ["hauksbee-engine/avr", "hauksbee-server?/avr"]
renode = ["hauksbee-engine/renode", "hauksbee-server?/renode"]
qemu = ["hauksbee-engine/qemu", "hauksbee-server?/qemu"]

[[bin]]
name = "hauksbee-ci"
path = "src/main.rs"

[lib]
name = "hauksbee_ci"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
regex = "1"
# The editor-facing JSON Schema for the spec TOML is GENERATED from the `Spec`
# type (see tests/schema_drift.rs), so the derive lives on the real structs and
# a new field can never silently miss the schema.
schemars = "1.2"
hauksbee-extract = { version = "0.1.0", path = "../hauksbee-extract" }
hauksbee-models = { version = "0.1.0", path = "../hauksbee-models" }
hauksbee-ir = { version = "0.1.0", path = "../hauksbee-ir" }
hauksbee-solve = { version = "0.1.0", path = "../hauksbee-solve" }
hauksbee-engine = { version = "0.1.0", path = "../hauksbee-engine", default-features = false }
hauksbee-frontdoor-api = { version = "0.1.0", path = "../hauksbee-frontdoor-api" }
hauksbee-server = { version = "0.1.0", path = "../hauksbee-server", default-features = false, optional = true }
# Direct dep (was dev-only) for two uses: main() installs the emulator child
# signal reaper (hauksbee_mcu::children), and the boot-coverage tests reuse
# the backend's real Espressif-QEMU / Renode discovery (is_available) so heavy
# co-sim cases skip cleanly when the emulator is absent. default-features =
# false and no `avr` here on purpose: this line must never drag GPL simavr
# into the permissive shape (see docs/about/release-and-licensing.md).
hauksbee-mcu = { version = "0.1.0", path = "../hauksbee-mcu", default-features = false, features = ["qemu", "renode"] }

[dev-dependencies]
hauksbee-testkit = { path = "../hauksbee-testkit" }
# The `--json` schema test validates the bytes the binary really emits against
# the generated schema, which needs a real draft-07 validator rather than a
# hand-rolled walk. default-features = false keeps reqwest/rustls out: the
# schema is local, so remote `$ref` resolution is not wanted.
jsonschema = { version = "0.49", default-features = false }
# The firmware-input parity test zips a committed .hex to prove a spec's
# `firmware = "fw.zip"` resolves exactly like `run --firmware` does.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Parse generated GitHub workflow YAML in integration tests. Keep this pure
# Rust: the libyaml-backed serde fork can hang inside the C parser on malformed
# input, which would turn a workflow regression into a wedged test job.
yaml-rust2 = { version = "0.11", default-features = false }
tempfile = { workspace = true }

[lints]
workspace = true
