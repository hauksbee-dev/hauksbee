# boot_coverage on the REAL Watchy v1.5 board file, ESP32 QEMU backend.
#
#   HAUKSBEE_QEMU_XTENSA=~/.hauksbee-qemu-esp/qemu/bin/qemu-system-xtensa \
#     hauksbee-ci run crates/hauksbee-ci/examples/watchy_v15_display_res.toml
#
# This executes the formerly-MISSED Watchy display-RES# validation row
# (docs/evidence/KNOWN_FAULTS_VALIDATION.md). The board is the unmodified corpus Watchy
# v1.5 layout; its RES net (e-paper reset, U1 ESP32-PICO-D4 pad 28 = GPIO9, the
# display FPC J1 pad 10) has NO pull resistor in v1.5 - the exact "control input
# on a Hi-Z GPIO" topology the static netlist cannot adjudicate. The firmware is
# a deliberately reduced Watchy display-init build (testdata/firmware/
# watchy_display_init) that drives GPIO9 (DISPLAY_RES) HIGH at boot and holds it,
# the load-bearing operation Watchy issue #14 is about, while maintaining the RAM
# mailbox so the ESP32 QEMU backend can observe the GPIO9 edge (real third-party
# firmware does not mirror GPIO; see docs/cosim/MCU.md). boot_coverage watches whether
# the firmware brings RES to its required HIGH state in time.

# Chip pairing, stated because it has been misread: the CORPUS Watchy v1.5
# board carries an ESP32-PICO-D4 (classic Xtensa esp32), and testdata's
# flash.bin is merged for that chip (bootloader at 0x1000). The repo's OTHER
# watchy board (crates/hauksbee-ci/examples/boards/watchy.kicad_pcb) is an
# ESP32-S3 and needs the S3 image in demo/firmware/watchy_display_init_s3/
# (bootloader at 0x0; provenance demo/firmware/build-watchy-s3.sh). Cross the
# pairs and the backend now refuses with a named bootloader-offset error.

name = "boot_coverage: Watchy v1.5 e-paper RES# driven HIGH at boot (reduced firmware)"
board = "../../../../board-corpus/famous/watchy_history/v1.5/Watchy.kicad_pcb"
firmware = "../../../testdata/firmware/watchy_display_init/flash.bin"
mcu = "esp32_pico"
duration_ms = 800
frame_ms = 8

[[supply]]
net = "+3V3"
kind = "ideal"
volts = 3.3

# The e-paper RES# net must be actively driven to a logic high (>= 2.6 V, a
# comfortable ESP32 VOH) within the boot window, with no stress fault before it.
[[assert]]
kind = "boot_coverage"
net = "RES"
min = 2.6
deadline_ms = 700.0
