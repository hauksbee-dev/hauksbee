# boot_coverage NEGATIVE control: same Watchy v1.5 board, firmware that never
# drives the e-paper RES# net.
#
#   HAUKSBEE_QEMU_XTENSA=~/.hauksbee-qemu-esp/qemu/bin/qemu-system-xtensa \
#     hauksbee-ci run crates/hauksbee-ci/examples/watchy_v15_display_res_undriven.toml
#   echo $?   # 1: RES is never driven, so boot_coverage goes RED
#
# This is the teeth of the boot_coverage execution: identical board, identical
# assertion, a firmware that drives GPIO2/GPIO4 (the esp32_blinky demo) but NOT
# GPIO9 (the Watchy DISPLAY_RES). Since v1.5 has no pull on the RES net, the net
# stays Hi-Z / undefined the whole run and never reaches the required HIGH. The
# check FAILS, proving it is genuinely watching the firmware drive the net and
# not passing vacuously. (The PASS variant watchy_v15_display_res.toml uses the
# display-init firmware that does drive GPIO9.)

name = "boot_coverage: Watchy v1.5 RES# left undriven (negative control, FAIL)"
board = "../../../../board-corpus/famous/watchy_history/v1.5/Watchy.kicad_pcb"
firmware = "../../../testdata/firmware/esp32_blinky/flash.bin"
mcu = "esp32_pico"
duration_ms = 800
frame_ms = 8

# Power enters where the real board takes it: the micro-USB connector J2 on
# VBUS, through Schottky D4 into the ME6211 LDO (U2), which makes +3V3. U2
# drives +3V3, so a supply declared there would fight it and is refused. The
# battery (+BATT) is not used, since the run is on USB: with no cell declared the
# TP4054 charger (U5) holds +BATT at its 4.2 V float. A cell could be declared
# there: U5 is a current-limited source, so the cell is its load, not a rival.
[[supply]]
net = "VBUS"
kind = "ideal"
volts = 5.0

[[assert]]
kind = "boot_coverage"
net = "RES"
min = 2.6
deadline_ms = 700.0
