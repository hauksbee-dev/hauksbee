# hauksbee-ci example: SCHEMATIC-STAGE CI.
#
# Catch it before you even lay out the board. This spec runs against a
# `.kicad_sch` directly (no PCB exists yet) by deriving the netlist
# geometrically from the schematic (wires, pins, labels, power symbols) and
# recursing the sheet hierarchy. The board here is KiCad's own `pic_programmer`
# demo (a 2-sheet KiCad 10 hierarchy: pic_programmer.kicad_sch references
# pic_sockets.kicad_sch), whose schematic extraction is cross-validated to be
# net-for-net identical to its layout.
#
#   hauksbee-ci run crates/hauksbee-ci/examples/pic_programmer_schematic.toml
#
# EXPECTED RESULT: both assertions pass; the run as a whole is RED (exit 1)
# because the board's own static check fails it on C4, a capacitor position
# whose value is `0` (the same finding `hauksbee check` reports). That is a
# real flaw in the demo board, and the board belongs to the corpus, so the
# example neither waives nor hides it.
#
# WHAT THIS SPEC DOES NOT JUDGE, ON PURPOSE. Four parts of this board have no
# model and stay open circuits: U4 (LT1373 boost converter that makes the
# programming voltage; its VIN pin is on the VCC rail), U1 (a 24Cxx EEPROM
# socket) and U5/U6 (PIC sockets whose value names a pin count, not a chip).
# Hauksbee refuses to call anything that touches them valid, so the two
# assertions below are the ones the run can honestly stand behind: the input
# side, upstream of the 7805. Do NOT add `voltage` on VCC or `no_faults` here:
# VCC is a net U4 hangs on, and `no_faults` reads every open part, so both
# come back INVALID (exit 3) until U4 and the sockets are modelled. The test
# `crates/hauksbee-ci/tests/schematic_ci.rs` pins both outcomes. The open
# parts are listed in the `assumptions` of `--json` output and by
# `hauksbee run <board> --report`; the human report only names the open parts
# an assertion depends on, so passing assertions here do not mean they are gone.

name = "pic_programmer schematic power-up sanity"
# The path is where `scripts/fetch-corpus.sh` puts it with no arguments:
# <repo>/board-corpus/<board id>/... (corpus.toml's `default_dir`, board id
# `kicad_demos`). Fetch it with:
#   scripts/fetch-corpus.sh --only kicad_demos
board = "../../../board-corpus/kicad_demos/demos/pic_programmer/pic_programmer.kicad_sch"
duration_ms = 1

# No PCB, no firmware: power the board the way it is really powered, from a DC
# adapter on the input connector P1 (silkscreen: "8 to 15V"). Pin 2 feeds the
# 1N4004 D1 into the 7805 regulator U3, whose output is VCC. That input net has
# no name, and the schematic and PCB spell its generated name differently, so
# the leg addresses it by connector pin, which both agree on.
#
# `kind = "bench"` rather than `"ideal"` on purpose: a bench leg has finite
# output impedance and a current limit, so the input can actually sag.
[[supply]]
ref = "P1"
pin = "2"
kind = "bench"
volts = 12.0
current_limit_a = 1.0
r_out_ohms = 0.05

# 1. The rail the 7805 is fed from (C2 pin 1, after the 1N4004 D1) has headroom
# for the regulator and cannot exceed the adapter. Lower bound: VCC plus the
# card's declared dropout, 5 V + 2 V (ST L78 DS0422, Vd typ 2 V at 1 A; the real
# load here is about 10 mA, so this is conservative). Upper bound: the 12 V
# adapter itself, a series diode can only lower it. The net is addressed by the
# name the schematic derives; the PCB spells it differently (`Net-(D1-K)`).
[[assert]]
kind = "voltage"
net = "Net-(C2-Pad1)"
min = 7.0
max = 12.0

# 2. The input diode stays inside its rating (1N4004: IF(AV) 1 A, Vishay 88503).
[[assert]]
kind = "max_current"
ref = "D1"
amps = 1.0
