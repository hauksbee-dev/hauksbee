# The .kicad_pcb fixtures here place parts and join nets but carry no
# copper, so each is a pre-layout board by construction and the static
# check's "not routed yet" finding is expected. It is waived, not
# hidden: every CI run over these boards still lists it as a waived row
# (support::assert_placement_waived checks that).

[[waive]]
check = "lint"
kind = "unrouted_pad"
nets = ["GND"]
reason = "placement-only fixture: parts are placed and netted but carry no copper, so the board is pre-layout by construction"
until = "2030-01-01"
