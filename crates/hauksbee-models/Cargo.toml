[package]
name = "hauksbee-models"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Device model library and part resolution for hauksbee."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[[bin]]
name = "model-extract"
path = "src/bin/model_extract.rs"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
toml = "0.8"
regex = "1"
once_cell = "1"

serde_json = { workspace = true }

# The extraction sandbox needs a scratch directory at run time: the agent gets
# a copy of the datasheet and nothing of the user's.
tempfile = { workspace = true }

[dev-dependencies]
forge-sexpr = { workspace = true }
# The coverage ratchet needs to find the board corpus, which is not in this
# repository. hauksbee-testkit is the shared locator, and it is the only thing
# the corpus tests take from outside this crate: the ratchet reads board files
# itself rather than depending on hauksbee-extract, which would be a
# dev-dependency cycle (extract depends on this crate).
hauksbee-testkit = { path = "../hauksbee-testkit" }

[lints]
workspace = true
