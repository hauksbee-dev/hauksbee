[[models.source.pinout]]
package = "8-lead SOP / VSOP / DIP / 8-pad USON / WSON"
pins = { "1" = "CS#", "2" = "SO (IO1)", "3" = "WP# (IO2)", "4" = "VSS", "5" = "SI (IO0)", "6" = "SCLK", "7" = "HOLD# (IO3)", "8" = "VCC" }
