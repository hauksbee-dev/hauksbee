# Official built-in part library: memory_spi.
#
# Cards here are written from vendor datasheets only (every value carries a basis and a source).
# See target/launch/official-parts-20261022/ranking.md for the batch plan.


# ─────────────────────────────────────────────────────────────────────────────
# Winbond W25Q64JV 64-Mbit SPI NOR, 8-pin SOIC 208-mil (SS), WSON 6x5 / 8x6 (ZP, ZE), XSON 4x4 (XG).
#
# Source: Winbond W25Q64JV Revision J, March 27 2018. Executable standard-SPI subset only (same shape
# as the existing w25q32jv_soic8 and w25q128jv_soic8 cards in digital.toml): Dual/Quad I/O, SFDP,
# protection, busy timing, security registers and a fitted flash image are not modelled.
# A value with no grade suffix binds as the -IQ/JQ device (the only device ID printed for the
# JV valid part numbers, 11.1 PDF p.76); the -IM/JM grade answers 7017h (8.1 PDF p.22) and is not bound.
# No must-not-float or float-tolerated role is declared: Rev J states no tie requirement and prints no internal pull-up for /HOLD, /WP or /CS.
[[models]]
id = "w25q64jv_soic8"
kind = "digital"
description = "Winbond W25Q64JV 64-Mbit SPI NOR, 8-pin SOIC 208-mil / WSON / XSON (executable standard-SPI subset)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.winbond.com/resource-files/w25q64jv%20revj%2003272018%20plus.pdf"
title = "Winbond W25Q64JV 3V 64M-bit Serial Flash Memory with Dual, Quad SPI, Revision J, Publication Release Date March 27, 2018"
locator = "3.1 to 3.3 pin and pad configuration (PDF p.6); 8.1 Device ID (PDF p.22); 9.1 Absolute Maximum Ratings and 9.2 Operating Ranges (PDF p.60); 9.4 DC Electrical Characteristics (PDF p.62); 11 Ordering Information (PDF p.75) and 11.1 Valid Part Numbers (PDF p.76)"
sha256 = "452d906c3be0da077fd751a2b8aa062629caf6081f8dd1eda04880854ce7c8f9"
[[models.source.pinout]]
package = "8-pin SOIC 208-mil / 8-pad WSON / 8-pad XSON"
pins = { "1" = "/CS", "2" = "DO (IO1)", "3" = "/WP (IO2)", "4" = "GND", "5" = "DI (IO0)", "6" = "CLK", "7" = "/HOLD or /RESET (IO3)", "8" = "VCC" }
[[models.source.uncertainty]]
status = "unknown"
parameter = "array_contents"
reason = "The fitted flash image is an assembly input; an unprovided image starts erased (0xFF)."
[[models.source.uncertainty]]
status = "interval"
parameter = "standby_current"
low = 0.0
high = 0.000050
unit = "A"
kind = "specification-limits"
basis = "9.4 DC Electrical Characteristics (PDF p.62) ICC1 standby current max 50 uA; 0 A is the physical lower bound of a supply current"
[[models.source.uncertainty]]
status = "interval"
parameter = "active_read_current"
low = 0.0
high = 0.020000
unit = "A"
kind = "specification-limits"
basis = "9.4 (PDF p.62) ICC3 read current max, 104 MHz row, 20 mA; 0 A is the physical lower bound of a supply current"
[[models.source.uncertainty]]
status = "interval"
parameter = "program_or_erase_current"
low = 0.0
high = 0.025000
unit = "A"
kind = "specification-limits"
basis = "9.4 (PDF p.62) ICC4 through ICC7 write/program/erase current max 25 mA; 0 A is the physical lower bound of a supply current"

[models.match]
# Package codes SS, ZP, ZE, XG (11 Ordering Information, PDF p.75) share this pad map; the 16-pin SF has its own
# card, and the TFBGA (TB, TC) and WLCSP (BY) packages are not modelled. IQ/JQ only (the IM/JM grade has another JEDEC ID).
# Excludes W25Q64FV, W25Q64JW (1.8 V), W25Q64DV and the other JV densities.
value_re = "(?i)^W25Q64JV(?:(?:SS|ZP|ZE|XG)(?:IQ|JQ)?(?:-TR)?)?$"

[models.params]
warning = "standard-SPI read/program/erase/JEDEC behavior is executable with an erased initial array; Quad/Dual I/O, SFDP, protection, busy timing, security registers and a fitted flash image are not modeled"

[models.pins]
# 3.3 Pin Description (PDF p.6), identical for SOIC 208-mil, WSON and XSON.
"1" = "cs"
"2" = "miso"   # DO (IO1)
"3" = "wp_n"   # /WP (IO2)
"4" = "gnd"
"5" = "mosi"   # DI (IO0)
"6" = "sck"
"7" = "hold_n"   # /HOLD or /RESET (IO3)
"8" = "vcc"

[models.ratings]
# max_junction_temp_c is left absent: the sheet prints no junction limit and no thermal resistance.
max_voltage_v = 4.6   # 9.1 Absolute Maximum Ratings (PDF p.60): supply voltage -0.6 V to 4.6 V

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.7
max_v = 3.6
abs_max_v = 4.6
basis = "Winbond W25Q64JV Rev J, 9.2 Operating Ranges (PDF p.60): VCC 2.7 V to 3.0 V at FR = 104 MHz, 3.0 V to 3.6 V at FR = 133 MHz"
abs_max_basis = "Winbond W25Q64JV Rev J, 9.1 Absolute Maximum Ratings (PDF p.60): supply voltage -0.6 V to 4.6 V"

[models.peripheral]
kind = "spi_nor_flash"
size_bytes = 8388608   # 64 Mbit; density from the part name and the JEDEC density byte
page_size = 256            # 256-byte program page (all Winbond datasheet feature lists)
sector_size = 4096         # 4 KB sector erase
jedec_id = [239, 64, 23]   # 8.1 Device ID table (PDF p.22): manufacturer EFh, W25Q64JV-IQ/JQ device ID 4017h
spi_mode = 0
cs_role = "cs"
clk_role = "sck"
mosi_role = "mosi"
miso_role = "miso"

[models.peripheral_power]
supply_role = "vcc"
return_role = "gnd"
power_on_threshold_v = 2.7   # 9.2 Operating Ranges (PDF p.60): VCC 2.7 V to 3.0 V at FR = 104 MHz, 3.0 V to 3.6 V at FR = 133 MHz
idle_a = 0.000050            # 9.4 DC Electrical Characteristics (PDF p.62) ICC1 standby current max 50 uA
read_a = 0.020               # 9.4 (PDF p.62) ICC3 read current max, 104 MHz row, 20 mA
write_a = 0.025              # 9.4 (PDF p.62) ICC4 through ICC7 write/program/erase current max 25 mA
low_power_a = 0.000015       # 9.4 (PDF p.62) ICC2 power-down current max 15 uA

[models.coverage]
implements = ["spi_standard_read", "spi_fast_read", "spi_jedec_id", "spi_page_program", "spi_sector_erase", "spi_chip_erase", "spi_power_down", "standby_current_max", "deep_power_down_current_max", "read_current_max", "write_current_max", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["spi_dual_quad_io", "sfdp", "busy_timing", "protection_registers", "security_registers", "fitted_array_image"]

