[models.match]
# Ordering (9 PDF p.61): GD25Q32C<pkg><grade>G<pack>; pkg T = SOP8 150mil, S = SOP8 208mil, V = VSOP8, P = DIP8,
# H = USON8 3x3, N = USON8 3x4, W = WSON8 6x5; grade I or F; packing T/Y/R. TFBGA (Z, B) not modelled.
# Excludes GD25Q32B/E, GD25Q16*, GD25Q64*.
