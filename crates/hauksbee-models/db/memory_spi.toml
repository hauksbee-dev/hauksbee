description = "Microchip 23K256 256-Kbit SPI serial SRAM, 2.7 V to 3.6 V, 8-lead PDIP/SOIC/TSSOP (identity, pins, levels and ratings only)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://ww1.microchip.com/downloads/en/DeviceDoc/22100F.pdf"
title = "Microchip 23A256/23K256 256K SPI Bus Low-Power Serial SRAM Data Sheet, DS22100F"
locator = "Device Selection Table, Features, Pin Function Table and Package Types p.1; 1.0 Electrical Characteristics, Absolute Maximum Ratings and Table 1-1 DC Characteristics p.2; 2.0 Pin Descriptions, Table 2-1 p.13; Product Identification System p.25"
sha256 = "b35c23fd09f38f12f033d809ced3caca1a7c5e40813c52cabe7a7307e178584f"
[[models.source.pinout]]
package = "8-lead SOIC / TSSOP / PDIP"
pins = { "1" = "CS", "2" = "SO", "3" = "NC", "4" = "VSS", "5" = "SI", "6" = "SCK", "7" = "HOLD", "8" = "VCC" }

[models.match]
# Ordering (Product Identification System, p.25): 23K256[T]-<I|E>/<P|SN|ST>. Excludes 23A256 (1.5 V to 1.95 V) and 23LC256/23LC512.
value_re = "(?i)^23K256T?(-[IE]/(SN|ST|P))?$"

[models.params]
warning = "identity, pin map, supply envelope, input levels and absolute ratings only: the SRAM array and its SPI commands are not simulated and standby and read currents are not modelled"
must_not_float_roles = "hold_n"

[models.pins]
# Package Types figure (p.1) and Table 2-1 (p.13), PDIP/SOIC/TSSOP.
"1" = "cs"
"2" = "miso"
"3" = "nc"
"4" = "gnd"
"5" = "mosi"
"6" = "sck"
"7" = "hold_n"
"8" = "vcc"

[models.ratings]
# max_junction_temp_c is left absent: the sheet prints no junction limit and no thermal resistance.
max_voltage_v = 4.5   # Microchip DS22100F 1.0 Electrical Characteristics, Absolute Maximum Ratings p.2: VCC 4.5 V

[models.levels]
# Table 1-1 D002/D003 (p.2): VIH = 0.7 x VCC; VIL = 0.2 x VCC (I-temp; 0.15 x VCC for E-temp) for the 23K256; points are derived as products at VCC = 2.7 V and 3.6 V (derived)
vih = [[2.7, 1.890], [3.6, 2.520]]
vil = [[2.7, 0.540], [3.6, 0.720]]

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.7
max_v = 3.6
abs_max_v = 4.5
basis = "Microchip DS22100F Table 1-1 DC Characteristics p.2 D001 VCC 2.7 V to 3.6 V for the 23K256 (I, E-temp); Absolute Maximum Ratings p.2 VCC 4.5 V"
abs_max_basis = "Microchip DS22100F 1.0 Electrical Characteristics, Absolute Maximum Ratings p.2: VCC 4.5 V"

[models.coverage]
implements = ["supply_ranges", "absolute_ratings", "logic_levels"]
missing = ["sram_array_behavior", "spi_sram_commands", "standby_current_max", "read_current_max"]
