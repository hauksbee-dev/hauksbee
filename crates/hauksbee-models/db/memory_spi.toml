# ─────────────────────────────────────────────────────────────────────────────
# GigaDevice GD25Q32C 32-Mbit SPI NOR, 8-pin SOP150/208, VSOP208, DIP8, USON8 (3x3, 3x4), WSON8 (6x5).
#
# Source: GigaDevice GD25Q32C datasheet, DS-00088 Rev4.1 (PDF page numbers equal printed page numbers).
# Only -40 to +85 C grades (I, F) are bound: the datasheet prints DC characteristics only at 85 C, so the
# J (105 C) and E (125 C) grades would inherit currents the sheet does not give for them.
# "CS# must be driven high if chip is not selected. Please don't leave CS# floating" (p.5) is the only tie
# requirement printed, so only cs is must-not-float; WP#/HOLD# have no stated requirement and are left undeclared.
# Assumption: a bare family value (no generation or package letters) binds the C-generation 8-pin
# card, as the existing gd25q16 card does for its family; the generation shows only in currents.
[[models]]
id = "gd25q32c_8pin"
kind = "digital"
description = "GigaDevice GD25Q32C 32-Mbit SPI NOR, 8-pin SOP / VSOP / DIP / USON / WSON (executable standard-SPI subset)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.gigadevice.com.cn/Public/Uploads/uploadfile/files/20220714/DS-00088-GD25Q32C-Rev4.1.pdf"
title = "GigaDevice GD25Q32C 3.3V Uniform Sector Dual and Quad Serial Flash Datasheet, DS-00088 Rev4.1 (revision taken from the vendor file name; the PDF prints no revision on its pages)"
locator = "2 General Description connection diagram and pin description (PDF p.5); 8.3 Absolute Maximum Ratings (PDF p.49); 8.5 DC Characteristics (PDF p.51); 9 Ordering Information and 9.1 Valid Part Numbers (PDF p.61-63); Read Device ID table (PDF p.15)"
