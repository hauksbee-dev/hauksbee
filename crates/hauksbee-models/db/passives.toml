# Generic passive components.
# Resistors, capacitors, and inductors are resolved purely from their Value
# field (parsed by the engineering-notation value parser), so no explicit
# param entries are needed; these entries exist only to anchor the kind and
# provide pin maps for the match-rule engine.

# United Chemi-Con EKYB630ELL122MLN3S, KYB series aluminium electrolytic.
# Exact ordering-code match only: the 3.0 A figure belongs to this fitted part,
# not to every 1200 uF capacitor. Manufacturer source (accessed 2026-08-07):
# https://www.chemi-con.co.jp/en/products/detail-condenser.php?part_number=EKYB630ELL122MLN3S
# 63 V, 1200 uF, 3.0 A_rms at 100 kHz / 105 C, 16 x 31.5 mm, 10,000 h.
[[models]]
