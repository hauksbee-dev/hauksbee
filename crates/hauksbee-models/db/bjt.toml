# BJT models, NPN and PNP.
# Gummel-Poon basics: is, bf, nf, vaf, br, rb, rc, re, cje, cjc, tf.

# ── NPN ───────────────────────────────────────────────────────────────────────

[[models]]
id = "bc847"
kind = "bjt_npn"
description = "BC847 NPN small-signal SOT-23, 45V, 100mA"

[models.match]
value_re = "(?i)^BC84[5-9][A-C]?$"

[models.params]
# Source: Nexperia BC847 datasheet Rev. 11 2019-01-30, SPICE model appendix
is  = 1.0e-14
bf  = 150.0
nf  = 1.0
vaf = 80.0
br  = 4.0
rb  = 10.0
rc  = 1.0
re  = 0.5
cje = 9.0e-13
cjc = 5.0e-13
tf  = 3.0e-10

[models.pins]
"1" = "base"
"2" = "emitter"
"3" = "collector"

[models.ratings]
max_current_a = 0.1
max_power_w = 0.25
max_voltage_v = 45.0  # VCEO

