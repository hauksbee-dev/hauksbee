[[models]]
id = "bc307"
kind = "bjt_pnp"
description = "BC307/BC557 PNP small-signal TO-92, 45V, 100mA"

[models.match]
# PNP small-signal set only: BC307/308/309 and BC320/321/322/327/328/329.
# The old `BC3[12][0-9]` alt also caught the NPN BC317/318/319 (complements of
# BC320/321/322) and silently modelled them as PNP; they are left unresolved
# (loud) rather than wrong-polarity.
value_re = "(?i)^BC3(0[789]|2[012789])$|^BC55[7-9][A-C]?$"

[models.params]
# Source: Fairchild BC557/558/559 datasheet, SPICE parameters
is  = 2.0e-14
bf  = 180.0
nf  = 1.0
vaf = 80.0
br  = 4.0
rb  = 15.0
rc  = 1.0
re  = 0.5
cje = 1.2e-12
cjc = 5.0e-13
tf  = 3.5e-10

[models.pins]
"1" = "collector"
"2" = "base"
"3" = "emitter"

[models.ratings]
max_current_a = 0.1
max_power_w = 0.625
max_voltage_v = 45.0

