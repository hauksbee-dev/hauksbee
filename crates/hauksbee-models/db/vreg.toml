"6" = "rt_sync" # RT/SYNC
"7" = "extvcc" # EXTVCC
"8" = "fb"
"9" = "ss"
"10" = "mode"
"11" = "gnd" # SGND
"12" = "sw" # LX switching node
"EP" = "gnd" # Exposed pad; connect to SGND

