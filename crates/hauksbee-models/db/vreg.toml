# ── RT9013-33 (Richtek 500 mA low-noise LDO, fixed 3.3 V) ───────────────────
# Source: Richtek RT9013 DS9013-10, April 2011. richtek.com no longer serves
# the DS9013 PDFs at a static URL (every assets/product_file/RT9013/DS9013-NN
# path returns 404 as of 2026-10-05), so the copy cited is a third-party
# mirror of the unmodified Richtek document; the sha256 pins the exact file.
# Ordering Information: RT9013-[voltage][plating][package], plating P/G,
# package Y = SC-82, B = SOT-23-5, U5 = SC-70-5, QW = WDFN-6L 2x2. Functional
# Pin Description: SOT-23-5 and SC-70-5 share 1 VIN, 2 GND, 3 EN, 4 NC,
# 5 VOUT; SC-82 (1 EN, 2 GND, 3 VOUT, 4 VIN) and WDFN differ. Only B is
# matched: U5 shares the map but has its own thermal rows (333 C/W, no θJC).
# The voltage code is required ("33" = 3.3 V).
[[models]]
id = "rt9013_33_sot23_5"
kind = "vreg"
description = "Richtek RT9013-33 500mA low-noise LDO, 3.3V fixed, SOT-23-5 (EN)"

