# ── max17760: Analog Devices MAX17760 76 V / 300 mA synchronous buck ──
# MAX17760 datasheet (12 TDFN-EP). Drafted by the extraction pipeline (codex gpt-6-luna) and reviewed against the PDF:
# pin map (12 pins + EP), fsw 400 kHz, FB vref 0.802 V, VIN abs max 80 V, theta-JA 41 / theta-JC 8.5 checked.
# Hand edit: EN/UVLO threshold uses the typical 1.215 V rising value, not the 1.24 V maximum column.
[[models]]
id = "max17760"
kind = "vreg"
description = "Analog Devices MAX17760 adjustable synchronous buck converter, 12 TDFN-EP (3mm x 3mm); averaged converter model with board feedback. It does not model switching ripple, loop stability, soft-start, PWM/PFM light-load behavior, current-limit and hiccup protection, thermal shutdown, or RESET monitoring."

[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"


[[models.source.uncertainty]]
status = "unknown"
parameter = "model"
reason = "datasheet publishes no validated model error interval"

[[models.source.uncertainty]]
status = "interval"
parameter = "feedback_reference"
low = 0.788
high = 0.815
unit = "V"
kind = "specification-limits"
basis = "Electrical Characteristics, FB Regulation Voltage, VMODE = 0V (PWM mode), min/max columns; VIN = 24V, TA = -40°C to +125°C"

[[models.source.pinout]]
package = "12 TDFN - EP (3mm x 3mm)"
pins = { "1" = "VIN", "2" = "PGND", "3" = "VCC", "4" = "EN/UVLO", "5" = "RESET", "6" = "RT/SYNC", "7" = "EXTVCC", "8" = "FB", "9" = "SS", "10" = "MODE", "11" = "SGND", "12" = "LX", "EP" = "EP" }

[models.match]
value_re = '(?i)^(MAX17760|MAX17760ATC\+T?)$'

[models.params]
warning = "averaged buck model with board feedback; switching ripple, loop stability, soft-start, PWM/PFM light-load behavior, current-limit and hiccup protection, thermal shutdown, and RESET monitoring are not modeled"
iq_a = 2.5e-3  # derived: iq_a = quiescent current at the lightest printed load, 'Input quiescent current, PWM' typ 2.5 mA (VFB = 0.75V, normal switching mode; VIN = 24V)
dropout_v = 2.7e-1  # derived: VCC LDO dropout max 0.27 V (VIN = 4.5V, IVCC = 5mA); kept as the only printed dropout row, a buck's real headroom limit is max_duty

[models.pins]
"1" = "in" # VIN
"2" = "pgnd" # Power Ground
"3" = "vcc" # Internal 5V LDO output; not the buck output
"4" = "en" # EN/UVLO
