[models.match]
# Plain LM317 and its TO-220/A suffixes only: LM317L (100 mA) and LM317M
# (500 mA) share the reference but not the current rating, so they are left
# unmatched rather than judged against 1.5 A.
value_re = "(?i)^LM317A?T?$"

[models.params]
# Source: TI LM317 datasheet SLVS044Y.
vref      = 1.25     # VREF (VO - VADJ) typ; 1.20 min / 1.30 max, see interval above
iadj_a    = 50.0e-6  # IADJ typ, adjustment-terminal current (100 uA max)
dropout_v = 3.0      # minimum input-to-output differential, Recommended
                     # Operating Conditions (VI - VO: 3 V min, 40 V max)

[models.pins]
# Datasheet Pin Functions, TO-220 (KCS/KCT) and SOT-223 (DCY): 1 ADJ, 2 OUT,
# 3 IN. A `[models.pins]` value IS a binder role, unnormalised, so ADJ is
# spelled with the binder's name for an adjustable part's reference pin.
"1" = "fb"
"2" = "out"
"3" = "in"

[models.ratings]
max_current_a = 1.5  # IO, TO-220, Recommended Operating Conditions
# Minimum load current to maintain regulation, SLVS044Y Electrical
# Characteristics (VI - VO = 40 V): 3.5 mA typ, 10 mA MAX. The MAX is the
# guaranteed figure -- the typ is what a sample happens to need, not what any
# LM317 is promised to regulate at -- so the enforced floor is 10 mA and a
# design between the two is disclosed rather than blessed. The enforced copy
# is compared against the `Vref_<ref>` branch current, which is total OUTPUT
# current (load + divider), the quantity the datasheet specifies.
min_current_a = 0.010
# The part FLOATS: its absolute maximum is the 40 V input-to-output
# differential, not an input voltage against ground. Carried as the input
# rating, which is conservative for a positive rail since VO >= 1.25 V always.
max_voltage_v = 40.0
max_junction_temp_c = 125.0
# The value rule binds every package, so this is the least favourable RθJA
# row below (legacy-chip SOT-223, DCY); a fitted footprint is judged on its own.
theta_ja_c_per_w = 66.8

# ─────────────────────────────────────────────────────────────────────────────
# TL431: an adjustable precision SHUNT reference, not a series pass regulator.
# It has no input pin: it sinks cathode current to hold REF at VREF above the
# anode, and the BOARD's series resistor and R1/R2 divider set the cathode
# voltage. `shunt = true` selects `bind_shunt_ref`, which stamps it as four
# primitives (an internal reference Vsource, a railed error amplifier, an
# ammeter and a transconductance) so the datasheet's programming equation
#     VKA = VREF*(1 + R1/R2) + IREF*R1        (SLVS543, Figure 7-2, section 7)
# falls out of the MNA solve of the fitted R1/R2, and is never parsed out of
# the netlist. Roles reuse the vreg vocabulary: CATHODE is `out` (the node the
# part regulates), ANODE is `gnd` (its local return), REF is `fb`.
#
# Primary source: TI TL431/TL432 datasheet SLVS543 (Aug 2004, rev. May 2024).
#
# PACKAGE: THE PIN MAP IS PACKAGE-DEPENDENT AND THERE IS NO SINGLE TL431
# PINOUT. SLVS543 Table 5-1 gives seven different pad orders, and they are not
# rotations of one another: DBZ is CATHODE 1 / REF 2 / ANODE 3 while LP, the
# same three pads, is CATHODE 1 / ANODE 2 / REF 3. One card carrying one map
# would therefore answer a confident, wrong cathode voltage on every other
# package -- a compliant board flagged, with no sign that the map was the
# problem. So this part is FOUR entries, one per package, each gated by
# `footprint_re` the way db/digital.toml's 25xx EEPROM entry is: the entry
# binds only where its map is true. Everything but `[models.match]` and
# `[models.pins]` is identical across them (the schema has no inheritance, so
# it is repeated; change one and change all four).
#
# The packages NOT carried here -- DBV (SOT-23-5), DCK (SC-70-6) and the
# single-anode P / PS / PW eight-pin group -- deliberately match NOTHING, so a
# TL431 on one of them stays an open part and says the pin map for its package
# is not carried, instead of binding a guessed one. The sentence it prints
# comes from the `tl431_tl432_unmapped_package` abstention in
# db/unmodelled.toml.
#
# GRADE: `value_re` matches EVERY grade -- TL431 (2 %), TL431A (1 %) and
# TL431B (0.5 %). The VREF interval below is the PLAIN (I) grade's, 2.440 to
# 2.550 V, because the A and B intervals are strictly inside it: one card with
# the widest interval answers a board that writes "TL431B" with more
# uncertainty than that part has earned, which is the safe direction, whereas
# one card with the B interval would understate the spread of a part whose
# value field says only "TL431". `ikmin_a` is the plain grade's 1 mA max for
# the same reason (A/B are specified at 0.7 mA max). The typ VREF is 2.495 V
# on all three grades, so the NOMINAL answer is grade-independent; only the
# stated uncertainty differs. Split this into per-grade cards the day a board
# needs the tighter interval.
#
# DELIBERATELY NOT MODELLED, each also in `warning` (the route that reaches a
# report reader) and in `coverage.missing` (the machine-readable list):
#   * Temperature. SLVS543 gives a full-range VREF DEVIATION (14 mV typ,
#     34 mV max for TL431BI) and no ppm/degC coefficient at all, so there is
#     no temperature curve here to interpolate and none is invented. Every
#     number on this card is Ta = 25 C.
#   * Stability against capacitive load. SLVS543 Figures 6-16 and 6-18 define
#     instability regions in the (IKA, CL) plane. This model has NO dynamics
#     that could enter them, so it reports a steady cathode voltage for a
#     board that in fact oscillates.
#   * The minimum cathode current for regulation. `ikmin_a` is recorded and
#     NOT enforced: the stamp regulates smoothly down to IKA = 0, so between
#     0 and 1 mA it claims a regulation the real part does not hold. Below
#     that the error amplifier rails off and the cathode voltage sags to the
#     divider's own, which IS visible, but the 0-1 mA band is optimistic.
#   * Reference noise (SLVS543 gives 150 nV/sqrt(Hz) at 1 kHz), the off-state
#     cathode current (IOFF, 0.1 uA typ / 1 uA max at VKA = 36 V), and the
#     REF-pin input capacitance.
#   * Grade spread. The stamp uses the 2.495 V typ; the interval above is
#     carried as uncertainty, not solved as a corner.
[[models]]
id = "tl431_dbz"
kind = "vreg"
description = "TI TL431 adjustable precision shunt reference, 2.495 V (all grades; the board's divider sets the cathode voltage), DBZ (SOT-23-3) package"

[models.source]
tier = "curated-library"
validation = "datasheet-curves"

[[models.source.uncertainty]]
status = "interval"
parameter = "vref"
low = 2.440
high = 2.550
unit = "V"
kind = "specification-limits"
basis = "TI SLVS543 section 6.6, VREF for the plain (I) grade at Ta = 25 C, VKA = VREF, IKA = 10 mA; the A (2.470-2.520) and B (2.483-2.507) grades are strictly inside this"
[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient thermal resistance"
rating = "theta_ja_c_per_w"
max = 206.0
unit = "°C/W"
conditions = "DBZ (SOT-23-3) package"
basis = "TI TL431/TL432 SLVS543S (May 2024), 6.3 Thermal Information, RθJA, DBZ"

[models.match]
# Every TL431 grade and packing suffix. TLV431 is a DIFFERENT part (1.24 V
# reference) and this anchor does not match it; so is TL432, whose pinout is
# the mirror of this one (see db/unmodelled.toml).
value_re = "(?i)^TL431"
# The DBZ three-pad outline, spelled the several ways real libraries spell it
# (KiCad "SOT-23", Eagle "SOT23-3", and the SC-59 / TO-236 aliases). The
# trailing `$` is what keeps it off the FIVE-pad DBV ("SOT-23-5"), whose pin
# map is a different one and which this library does not carry (it reaches the
# abstention in db/unmodelled.toml instead).
footprint_re = "(?ix)(SOT-?23|SC-?59|TO-?236)([-_]?3)?(_HandSolder\\w*)?$"

[[models.envelope]]
# The only absolute-volt window the envelope schema can express for this part.
# The IKA window (1 mA to 100 mA recommended, 150 mA absolute maximum) is a
# CURRENT and the schema has no current envelope, so both ends live in
# `ratings` instead, where the stress monitor scores them against the stamped
# ammeter: `max_current_a` as a fault, `min_current_a` as a disclosure.
kind = "supply_range"
pin = "out"
min_v = 2.5
max_v = 36.0
abs_max_v = 37.0
basis = "TI SLVS543 section 6.4, Recommended Operating Conditions, cathode voltage VKA 2.5 V to 36 V; section 6.1 Absolute Maximum Ratings, cathode voltage 37 V"

[models.params]
# Source: TI SLVS543, sections 6.1/6.4/6.6, Ta = 25 C.
shunt     = true      # selects the shunt-reference stamp
vref      = 2.495     # VREF typ; 2.440 min / 2.550 max, see the interval above
iref_a    = 2.0e-6    # IREF typ (4 uA max), IKA = 10 mA, R1 = 10 k, R2 = open
zka_ohms  = 0.2       # |ZKA| typ (0.5 max), VKA = VREF, f <= 1 kHz, IKA 1->100 mA
iktest_a  = 0.010     # the IKA at which VREF and |ZKA| are specified
ikmax_a   = 0.100     # IKA max, Recommended Operating Conditions
ikmin_a   = 0.001     # IKA min for regulation, plain grade (0.7 mA A/B grade).
                      # The ENFORCED copy of this floor is `ratings.min_current_a`,
                      # which the stress monitor scores the solved IKA against.
#
# The two stamp parameters are DERIVED from the four datasheet numbers above by
# `bind_shunt_ref`, not chosen, which is why neither appears here:
#   error-amplifier gain  AOL  = 1/(zka_ohms*ikmax_a) = 50 V/V, so the closed
#                               loop reproduces |ZKA| = 0.2 ohm exactly
#   internal reference    VINT = vref - iktest_a*zka_ohms = 2.493 V, so VKA is
#                               exactly the datasheet 2.495 V at IKA = 10 mA
warning = "temperature is not modelled: every number is the 25 C typical, and SLVS543 gives only a full-range VREF deviation (34 mV max on the B grade), not a coefficient, so there is no drift curve here at all. Stability against capacitive load is not modelled either: SLVS543 Figures 6-16 and 6-18 define instability regions in the (IKA, CL) plane and this stamp has no dynamics that could enter them, so a board that oscillates is reported as a steady cathode voltage. The minimum cathode current for regulation (1 mA max spec, 0.4 mA typ) is not modelled as a BEHAVIOUR: the stamp keeps regulating smoothly down to IKA = 0 where the real part does not. It is enforced as a DISCLOSURE instead, through `ratings.min_current_a`: any run whose solved cathode current stays under 1 mA says so next to the result rather than answering a regulated voltage unqualified. Further starved than that, the amplifier rails off and the voltage sags to the divider's own, which is visible on its own. Reference noise, the off-state cathode current and the REF-pin capacitance are absent, and the reference is the 2.495 V typ, so a computed cathode voltage is the NOMINAL part, not a bound over the 2.440-2.550 V grade spread."

[models.coverage]
implements = ["board_feedback_divider", "reference_pin_current", "dynamic_impedance",
              "cathode_current_ceiling", "falls_out_of_regulation_when_starved",
              "two_terminal_reference_wiring"]
missing = ["temperature_drift", "capacitive_load_stability", "minimum_cathode_current",
           "reference_noise", "off_state_cathode_current", "ref_input_capacitance",
           "parameter_spread", "startup_transient"]

[models.pins]
# SLVS543 Table 5-1, Pin Functions, the DBZ (SOT-23-3) column: CATHODE 1, REF 2, ANODE 3.
# A `[models.pins]` value IS a binder role, so the three terminals are spelled
# with the vreg vocabulary's names for them (see the header above): CATHODE is
# `out`, REF is `fb`, ANODE is `gnd`.
"1" = "out"
"2" = "fb"
"3" = "gnd"

[models.ratings]
# IKA, Recommended Operating Conditions (continuous absolute maximum is
# 150 mA). The stamp puts a zero-volt ammeter in the cathode leg, so the
# stress monitor's vreg overcurrent check scores the real IKA against this.
max_current_a = 0.100
# IKA MINIMUM for regulation, Electrical Characteristics (1 mA max spec,
# 0.4 mA typ, plain grade). A floor, not a ceiling: the stamp regulates
# smoothly below it, so the monitor records the shortfall and the run says so
# next to the result instead of answering a regulated voltage unqualified.
min_current_a = 0.001
# Cathode voltage, Absolute Maximum Ratings.
max_voltage_v = 37.0
max_junction_temp_c = 125.0
theta_ja_c_per_w = 206.0   # RθJA, DBZ (SOT-23-3), 6.3 Thermal Information

