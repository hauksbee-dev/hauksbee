# Voltage regulator models (LDO and switching).

[[models]]
id = "ams1117_3v3"
kind = "vreg"
description = "AMS1117-3.3 / LM1117-3.3 LDO, 1A, 3.3V fixed"

[models.match]
value_re = "(?i)^(AMS|LM)1117.?3[._]?3"

[models.params]
# Source: Advanced Monolithic Systems AMS1117 datasheet Rev. H, Table 1
vout      = 3.3     # output voltage (V)
dropout_v = 1.1     # max dropout voltage (V) @ Iout=800mA
iq_a      = 5.0e-3  # quiescent current (A) typ

[models.pins]
"1" = "gnd"
"2" = "out"
"3" = "in"

[models.ratings]
max_current_a = 1.0
max_voltage_v = 15.0  # input
max_power_w = 1.0     # SOT-223 on typical pad, thermally limited

