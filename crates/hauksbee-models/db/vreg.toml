en_off_v=0.4
i_shdn_a=1.0e-9  # IOFF "Shutdown current" typ 1 nA (200 nA max over -40..125 C), VIN input current in OFF mode, VEN = GND, ST STLQ015 DS6765 Rev 7 Table 4 Electrical characteristics pp.5-6 (text extract of the ST PDF)
