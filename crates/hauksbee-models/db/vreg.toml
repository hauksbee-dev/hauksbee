# ── LP3855-ADJ in SOT-223-5 (adjustable LDO) ────────────────────────────────
# TI (ex-National) 1.5 A fast-response ultra-low-dropout LDO, adjustable,
# SOT-223-5 (NDC) as LP3855EMP-ADJ/NOPB / LP3855EMPX-ADJ/NOPB.
# Source: TI "LP3855-ADJ 1.5A Fast Response Ultra Low Dropout Linear
#   Regulators", SNVS244F, September 2003, revised April 2013,
#   https://www.ti.com/lit/ds/symlink/lp3855-adj.pdf
#   (local copy sha256 d1610e06156c9fbef98c2b87a69bbba54bcf03d1176608b2c4a410cd4e5feb60).
#   Figure 3 and Table 2 Pin Descriptions for SOT-223-5 p.2; Absolute Maximum
#   Ratings and Recommended Operating Conditions p.3; Electrical
#   Characteristics p.4; Application Hints (VOUT = VADJ x (1 + R1/R2), output
#   capacitor 10 uF minimum); Package Option Addendum (EMP/EMPX = SOT-223 NDC).
#
# ADJUSTABLE: VADJ is 1.216 V typ (1.180-1.253 V over 10 mA..1.5 A and full
# temperature). It is NOT the output voltage. The part is ground-referenced
# (Application Hints, VOUT = VADJ x (1 + R1/R2), R1 on OUT-ADJ), so the card has
# a `gnd` pin and `iq_a`. On trigger-output-fmc, R75 56k (VOUT to ADJ) and R74
# 18k (ADJ to GND) give 1.216 x (1 + 56/18) = 5.00 V on /Digital IO/VCC, fed
# from /Digital IO/Switched_5P45V (about 5.47 V from U22 TPS563200) via FB3.
#
# PACKAGE MATTERS: the SOT-223-5 pin order (SD 1, VIN 2, VOUT 3, ADJ 4, GND 5,
# Table 2) differs from the TO-220-5 / DDPAK-TO-263-5 order (GND 3, VOUT 4,
# ADJ 5, Table 1), so only the EMP/EMPX (SOT-223) codes match. Board check: U44
# symbol evr-fmc:LP3855-ADJ on rf-input-fmc:SOT-223-5, pins 1 ~SD, 2 Vin,
# 3 Vout, 4 ADJ, 5 GND, matching Table 2. SD is tied to VIN on this board.
#
# `dropout_v` is the SOT-223 row MAXIMUM at IL = 1.5 A over temperature, 435 mV
# (260 mV typ; 45 mV max at 150 mA). Footnote 5: SOT-223 has higher dropout than
# TO-220/DDPAK from bond-wire resistance. `iq_a` is IGND normal mode, 3 mA typ
# (9 mA max at 25 C, 10 mA over temperature) at both 150 mA and 1.5 A.
# No θJA is stated for SOT-223 (only TO-220 50 C/W and DDPAK 60 C/W in the
# abs-max footnote), so `theta_ja_c_per_w` is deliberately absent.
#
# SD (Electrical Characteristics p.4, Shutdown Input): VSDT rising from 0.3 V
# until output ON: 1.3 V typ, 2 V in the Min column; falling from 2.0 V until
# output OFF: 1.3 V typ, 0.3 V in the Max column. The binder gates the output on
# SD from `en_on_v` = 2.0 and `en_off_v` = 0.3 (the guaranteed-on and
# guaranteed-off levels). SD has no internal pull: the Shutdown Operation text
# (p.11) asks for an EXTERNAL 10 kOhm pull-up, so no `en_pull_*` key is set. No
# output discharge is stated.
#
# DELIBERATELY NOT MODELLED: the 3.2 A short-circuit limit and overtemperature
# protection, line/load regulation, PSRR, and the COUT ESR stability window
# (Figure 18).
[[models]]
id = "lp3855_adj_sot223"
kind = "vreg"
description = "TI LP3855-ADJ 1.5A ultra-low-dropout adjustable LDO, VADJ 1.216V, SOT-223-5"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
