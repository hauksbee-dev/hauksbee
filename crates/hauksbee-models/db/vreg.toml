iq_a = 100.0e-6      # IGND typ at IOUT = 100 uA (180 uA max over temperature)
# EN pin (active high; the binder gates the output on it from these fields).
# Diodes AP2210 DS37517 Rev. 4-2 (Mar. 2021), AP2210-3.3 Electrical
# Characteristics (Cont.) (p.12): VIH "Enable Input Logic-high Voltage,
# Regulator enabled" 2.0 V min; VIL "Enable Input Logic-low Voltage, Regulator
# shutdown" 0.4 V max at 25 C and 0.18 V max over -40..125 C, the lower used so
# the off level holds at every temperature. IIH (5 uA typ at VEN >= 2 V) is
# an input current the sheet does not attribute to a pull, so no pull is set;
# no discharge resistance is printed.
