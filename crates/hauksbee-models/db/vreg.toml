# their ranges, over the operating ambient range); the 25 C / 10 mA row is
# narrower (1.782-1.818 V for 1.8 V, 2.475-2.525 V for 2.5 V). The 3.3 V code is
# carried by ncp1117_3v3_sot223 above, whose match rule is widened to every
# NCP1117/NCP1117I/NCV1117 ST33 order code. The ST15, ST19, ST20, ST285 and
# ST12 codes and the DPAK codes are not carded.

