iq_a      = 4.0e-4    # IGND "IOUT = 10mA (IQ)" typ, 5.5 p.5 (630 uA max new silicon)
en_on_v   = 1.7       # VEN(high) EN pin high (enabled), 1.7 V min; TI SBVS034P 5.5 Electrical Characteristics p.5
en_off_v  = 0.5       # VEN(low) EN pin low (shutdown), 0.5 V max, same table (IEN is leakage; no EN pull and no active output discharge stated)
i_shdn_a  = 2.0e-8  # ISHDN "Shutdown current (IGND)" typ 0.02 uA (1 uA max, legacy and new silicon), VEN <= 0.5 V, VOUT <= VIN <= 5.5 V, TI TPS731 SBVS034P 5.5 Electrical Characteristics p.5

