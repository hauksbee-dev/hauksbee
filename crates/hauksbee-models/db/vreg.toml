locator = "Figure 3 and Table 2 p.2; Absolute Maximum Ratings and Recommended Operating Conditions p.3; Electrical Characteristics p.4; Application Hints, Output Capacitor and Equation 1"
sha256 = "d1610e06156c9fbef98c2b87a69bbba54bcf03d1176608b2c4a410cd4e5feb60"
[[models.source.uncertainty]]
status = "interval"
