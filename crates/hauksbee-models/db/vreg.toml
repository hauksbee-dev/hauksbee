[[models]]
id = "lp2985_3v3"
kind = "vreg"
description = "LP2985-3.3 150mA LDO, SOT-23-5"

[models.match]
value_re = "(?i)^LP2985.*(3[._]?3)"
mpn_re   = "(?i)LP2985"

[models.params]
# Source: Texas Instruments LP2985 datasheet (SNVS044I), Table 7.2
vout      = 3.3
dropout_v = 0.3     # typ dropout @ 150mA (V)
iq_a      = 1.0e-4  # quiescent current typ 100 µA

[models.pins]
"1" = "in"
"2" = "gnd"
"3" = "en"
"4" = "noise_bypass"
"5" = "out"

[models.ratings]
max_current_a = 0.15
max_voltage_v = 16.0

# ─────────────────────────────────────────────────────────────────────────────

# 78xx fixed linear regulators. One entry per voltage code: the value regex
# matches ONLY that part's two-digit code (05/06/08/09/12/15/18/24), optionally
# behind a manufacturer prefix (LM/L/MC/UA/KA/NJM/AN/SPX) and a current-class
# letter (78L/78M/78S). A single unanchored "78xx" rule used to bind the whole
# family: 7809/7812/7815 included, as +5V, silently simulating the wrong rail.
# Source: ST L78xx datasheet DS0422, Table (typical). Dropout ~2 V, Iq ~6 mA.

[[models]]
id = "7805"
kind = "vreg"
description = "78xx / LM7805 linear regulator +5V, TO-220 / TO-92"

[models.match]
value_re = "(?i)^(LM|L|MC|UA|KA|NJM|AN|SPX)?78[LMS]?05"

[models.params]
vout      = 5.0
dropout_v = 2.0     # typical (V)
iq_a      = 6.0e-3

[models.pins]
"1" = "in"
"2" = "gnd"
"3" = "out"

[models.ratings]
max_current_a = 1.5
max_voltage_v = 35.0
max_power_w = 2.0  # TO-220 no heatsink

