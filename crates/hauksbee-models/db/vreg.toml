# ── TPS73101 (adjustable) ────────────────────────────────────────────────────
# TI 150 mA low-dropout LDO, DBV (SOT-23-5). Source: TI SBVS034P (September
# 2003, revised April 2026): Pin Functions Table 4-1 p.3, Absolute Maximum
# Ratings 5.1 p.4, Recommended Operating Conditions 5.3 p.4, Thermal 5.4 p.4,
# Electrical Characteristics 5.5 p.5. Pin 4 is FB on the adjustable TPS73101
# (NR on the fixed TPS731xx), so only the adjustable part is matched. The
# reference is `vref`, never a `vout`: the board's divider sets the rail,
# VOUT = (R1 + R2) / R2 x 1.204 V. `iq_a` is the ground-pin current TI itself
# labels IQ: IGND at IOUT = 10 mA, 400 uA typ (550 uA max legacy silicon, 630 uA
# max new silicon), Electrical Characteristics 5.5 p.5. No zero-load row is
# printed; the 10 mA row is the closest, and IGND only rises to 550 uA typ at
# 150 mA, so the load dependence is small.
