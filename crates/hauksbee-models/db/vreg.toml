# ─────────────────────────────────────────────────────────────────────────────
# RT9080-33: Richtek 2uA-IQ, 600 mA low-dropout linear regulator, 3.3 V fixed.
# Source: Richtek "RT9080 2uA IQ, 600mA Low-Dropout Linear Voltage Regulator"
#   datasheet DS9080-09, December 2024
#   (richtek.com/assets/product_file/RT9080/DS9080-09.pdf).
#
# Watchy carries this as U2 with the value string "RT908033" (the ordering-code
# concatenation of RT9080 + the "33" output-voltage code, per the datasheet's
# Ordering Information: 33 = 3.3 V). The KiCad symbol behind it is the stock
# AP2112K-3.3, so the footprint description on the board still reads "3.8V-6V
# input"; that is the SYMBOL's text, not this part. The RT9080's own
# Recommended Operating Conditions are VIN 1.2 V to 5.5 V, and the numbers
# below are all the RT9080's.
#
# Datasheet figures used (Section 14 Electrical Characteristics, TA = 25 C,
# VVOUT + 1 V < VIN < 5.5 V unless noted):
#   VOUT_ACC   = +/-2%            @ ILOAD = 1 mA
#   VDROP      = 0.31 V typ, 0.53 V max  @ ILOAD = 600 mA, 3 V <= VOUT
#                (Note 7: dropout is VIN - VOUT at the point VOUT falls to 98%
#                 of its normal value)
#   IQ         = 2 uA typ, 4 uA max  @ ILOAD = 0 mA, VOUT <= 5.5 V,
#                                       VIN >= VOUT + VDROP
#   ISHDN      = 0.1 uA typ, 0.5 uA max  @ VEN = 0 V
#   ILIM       = 610 mA min, 1100 mA typ  @ VOUT = 90% of VOUT(normal)
#   VEN_R      = 0.9 V min (rising), VEN_F = 0.4 V max (falling)  @ VIN = 5 V
#   Line reg   = 0.13% typ  @ ILOAD = 1 mA, 1.8 V <= VIN < 5.5 V
#   Load reg   = 0.5% typ   @ 1 mA < ILOAD < 600 mA
#   PSRR       = 75 dB typ  @ VIN = 3 V, ILOAD = 50 mA, COUT = 1 uF,
#                              VOUT = 2.5 V, f = 1 kHz
#   TOTP       = 150 C typ, 20 C hysteresis
#   RDISCHG    = 80 Ohm typ  @ EN = 0 V, VOUT = 0.1 V (output active discharge)
# Absolute Maximum Ratings (Section 10): VIN/VOUT/SNS/EN to GND -0.3 V to
#   6.5 V; junction temperature 150 C.
# Thermal Information (Section 13): theta_JA = 189.4 C/W for TSOT-23-5,
#   JEDEC standard board.
#
# Sanity check before believing the numbers: 0.31 V of dropout at 600 mA is a
# 0.52 Ohm pass element, which is what a modern 600 mA PMOS LDO looks like, and
# 2 uA of quiescent current is microamps as an LDO's must be. An earlier
# machine reading of this same PDF returned "IQ 35 uA" and "current limit
# 250 mA"; both are wrong (the second is below the part's own 600 mA output
# rating, which is impossible), which is why every figure here was read off the
# datasheet pages rather than taken from a summary.
#
# DELIBERATELY NOT MODELLED, because the `vreg` kind has nowhere to put them
# and inventing a place would be worse than the gap:
#   - The EN input. `bind_vreg` stamps an unconditional ideal source on the
#     output net; it never reads an enable. The pin map below names pad 3 "en"
#     so the role is at least visible in the bind report, but the model does NOT
#     gate on it. On Watchy EN is tied to the same net as VIN (Net-(D1-K)), so
#     the part is unconditionally enabled and the model matches the board; on a
#     board that sequences EN it would NOT, and that is a real limitation.
#   - Current limit (610 mA min / 1100 mA typ). `max_current_a` below carries
#     the 600 mA continuous output rating, which is the figure the stress
#     monitor should judge against; the foldback behaviour itself is not
#     modelled because the ideal-source vreg path has no CC mode.
#   - Line/load regulation, PSRR, output noise, active discharge (RDISCHG),
#     over-temperature protection. The output is an ideal 3.3 V source, so all
#     of these are exactly zero / absent in simulation rather than wrong.
[[models]]
id = "rt9080_3v3"
kind = "vreg"
description = "RT9080-33 Richtek 600mA LDO, 3.3V fixed, 2uA IQ, TSOT-23-5"

[models.match]
# Covers the datasheet's ordering codes for the 3.3 V option (RT9080-33GJ5,
# RT9080-33GQZ, RT9080N-33GJ5) and the bare board value "RT908033" that Watchy
# writes with no separator. The "33" is required, so RT9080-08 (0.8 V) or any
# other output-voltage code cannot bind here and silently regulate to 3.3 V.
value_re = "(?i)^RT9080N?-?33([A-Z0-9-]*)?$"
mpn_re   = "(?i)^RT9080N?-?33"

[models.params]
# Source: Richtek RT9080 datasheet DS9080-09 December 2024 (see above).
vout      = 3.3      # output-voltage option "33"; accuracy +/-2% @ ILOAD = 1 mA
dropout_v = 0.31     # VDROP typ @ ILOAD = 600 mA, 3 V <= VOUT (max is 0.53 V)
iq_a      = 2.0e-6   # IQ typ @ ILOAD = 0 mA, VIN >= VOUT + VDROP (max is 4 uA)

[models.pins]
# TSOT-23-5, datasheet Section 7 Pin Configuration / Section 8 Functional Pin
# Description. Pad 4 is SNS on the RT9080N sense-pin option and NO INTERNAL
# CONNECTION on the plain RT9080; Watchy fits the plain part and leaves pad 4
# unconnected, which is what the datasheet says to do. It is named "nc" here
# rather than "sns" so no binder mistakes it for a feedback node.
"1" = "in"
"2" = "gnd"
"3" = "en"
"4" = "nc"
"5" = "out"

[models.ratings]
# Source: RT9080 datasheet DS9080-09, Section 10 Absolute Maximum Ratings and
# Section 13 Thermal Information (TSOT-23-5 column).
max_current_a = 0.6          # 600 mA output current (VIN >= 2.3 V), Section 3
max_voltage_v = 6.5          # VIN/VOUT/EN to GND abs max
max_junction_temp_c = 150.0  # TJ abs max
theta_ja_c_per_w = 189.4     # JEDEC-standard board, TSOT-23-5
# max_power_w is deliberately absent: the datasheet publishes no package power
# rating, only TJ(max) and theta_JA, and the thermal monitor derives the
# junction temperature from those two directly.

# ─────────────────────────────────────────────────────────────────────────────
# XC6206-3.3: Torex 200 mA, 1 uA-IQ CMOS LDO in SOT-23. The MCP1700-class part
# that sits next to almost every ESP8266 and ESP32 module on a hobby board,
# usually feeding 3.3 V from a USB 5 V rail.
#
# Source: Torex Semiconductor Ltd "XC6206 Series, Low ESR Cap. Compatible
#   Positive Voltage Regulators", document ETR03005-009
#   (product.torexsemi.com/system/files/series/xc6206.pdf).
#
# Datasheet figures used (ELECTRICAL CHARACTERISTICS, Ta = 25 C; unless stated
# otherwise the test condition is VIN = VOUT(T) + 1.0 V, i.e. 4.3 V here). The
# per-voltage numbers come from the Electrical Characteristics Chart on the
# following page, read on the VOUT(T) = 3.3 row:
#   VOUT(E)  = x0.98 .. x1.02 of nominal  @ IOUT = 30 mA (the +/-2% "standard"
#              accuracy grade, order code 2; the +/-1% grade is order code 1)
#   IDD      = 1.0 uA typ, 3.0 uA max     @ output open (test circuit 1)
#   Vdif1    = 75 mV typ, 350 mV max      @ IOUT = 30 mA
#   Vdif2    = 250 mV typ, 680 mV max     @ IOUT = 100 mA, VOUT(T) > 1.8 V
#              (Vdif is VIN1 - VOUT1, where VOUT1 is 98% of the output voltage
#               and VIN1 is the input voltage at which it appears as the input
#               is gradually decreased)
#   Load reg = 60 mV max                  @ 1 mA <= IOUT <= 100 mA
#   Line reg = 0.05 %/V typ, 0.25 %/V max @ VOUT(T)+1.0 V <= VIN <= 6.0 V,
#                                            IOUT = 30 mA
#   IOUTMAX  = 200 mA min                 @ VOUT >= VOUT(E) x 0.9
#   ISHORT   = 100 mA typ                 @ VOUT = VSS (foldback current limit)
#   VIN      = 1.8 V min, 6.0 V max
#   dVOUT/dT = +/-100 ppm/C               @ IOUT = 30 mA, -40 C <= Topr <= 85 C
# Absolute Maximum Ratings (Ta = 25 C): VIN -0.3 to 7.0 V; IOUT 500 mA, itself
#   capped by IOUT <= Pd / (VIN - VOUT); VOUT -0.3 V to VIN + 0.3 V; Pd 250 mW
#   for SOT-23 as a bare IC (500 mW mounted on a 40 x 40 mm standard board),
#   500/1000 mW for SOT-89, 120/1000 mW for USP-6B; Topr -40 to 85 C.
#
# The datasheet publishes no junction-temperature limit and no theta_JA, only
# the package dissipation figures and an AMBIENT temperature range, so this
# entry carries `max_power_w` and no thermal-resistance fields. That is the
# datasheet's own shape, not an omission.
#
# PACKAGE PINOUT HAZARD, and why the match rule is narrow. The three packages do
# NOT share a pin order (datasheet PIN ASSIGNMENT):
#   SOT-23 : 1 = VSS, 2 = VOUT, 3 = VIN
#   SOT-89 : 1 = VSS, 2 = VIN,  3 = VOUT     <- VIN and VOUT swapped
#   USP-6B : 2 = VSS, 4 = VIN,  6 = VOUT
# The order code carries the package (MR-G = SOT-23, PR-G = SOT-89, DR-G =
# USP-6B), so the value string can tell them apart without a `footprint_re`
# conjunction. The map below is the SOT-23 one and the regex accepts ONLY the
# SOT-23 and package-less forms; a board that names the SOT-89 or USP-6B order
# code resolves to nothing and is reported as unresolved. That is deliberate:
# binding the SOT-23 map to a SOT-89 part would put the regulated rail on the
# input pad, which is worse than an honest gap.
#
# DELIBERATELY NOT MODELLED: `bind_vreg` stamps an ideal DC source, so the
# +/-2% accuracy window, load and line regulation, the temperature coefficient
# and the foldback current limiter are absent rather than wrong. The current
# limiter matters here in a way it does not on a bigger LDO: the datasheet's
# ISHORT of 100 mA typ is BELOW the part's own 200 mA output rating, because it
# is a foldback measured into a dead short. `max_current_a` carries the 200 mA
# figure, which is the one a stress check should judge against.
[[models]]
id = "xc6206_3v3"
kind = "vreg"
description = "XC6206-3.3 Torex 200mA LDO, 3.3V fixed, 1uA IQ, SOT-23"

[models.match]
# Accepts XC6206P332MR, XC6206P332MR-G, XC6206P331MR (the +/-1% grade),
# XC6206P332, XC6206P33, XC6206-3.3 and XC6206 3.3V. Rejects the SOT-89 (PR)
# and USP-6B (DR) order codes, whose pinouts differ, and every other output
# voltage code, so an XC6206P502MR cannot bind here and regulate to 3.3 V.
value_re = "(?i)^XC6206(P33[12]?(MR-?G?)?|[-_ ]?3[._]3V?)$"

[models.params]
# Source: Torex XC6206 datasheet ETR03005-009, VOUT(T) = 3.3 row. See above.
vout      = 3.3      # nominal; effective output is x0.98 .. x1.02 @ IOUT = 30 mA
dropout_v = 0.25     # Vdif2 typ @ IOUT = 100 mA (680 mV max); Vdif1 is 75 mV
                     # typ @ IOUT = 30 mA. The 100 mA figure is the useful one
                     # for a 200 mA part.
iq_a      = 1.0e-6   # IDD typ, output open (3.0 uA max)

[models.pins]
# SOT-23, datasheet PIN ASSIGNMENT. See the package hazard note above before
# reusing this map for any other XC6206 package.
"1" = "gnd"   # VSS
"2" = "out"   # VOUT
"3" = "in"    # VIN

[models.ratings]
max_current_a = 0.2   # IOUTMAX min for the 3.0-3.9 V codes, @ VOUT >= 0.9 x VOUT(E)
max_voltage_v = 7.0   # VIN abs max
max_power_w = 0.25    # SOT-23 Pd as a bare IC; 500 mW on a 40 x 40 mm board

# ─────────────────────────────────────────────────────────────────────────────
# Negative regulators, the 79xx series.
#
# THE PINOUT IS NOT THE 78xx PINOUT. A 7805 in TO-220 is 1=IN, 2=GND, 3=OUT; a
# 7905 is 1=GND, 2=IN, 3=OUT. Dropping a 79xx into a 78xx footprint is one of
# the most common ways a dual-rail supply gets built wrong, and it is exactly
# the kind of thing this library exists to catch, so the maps below are worth
# more than the electrical parameters.
#
# The numbering deserves a note, because the datasheet figure is easy to read
# backwards. TI SNOSBQ7C Figure 1 is a TO-220 FRONT view drawn rotated, tab to
# the left and leads pointing right, labelled top to bottom OUTPUT, INPUT,
# GROUND. Un-rotating it puts pin 1 at the bottom of that drawing, so the
# numbering is 1=GROUND, 2=INPUT, 3=OUTPUT, which is what every 79xx footprint
# assumes.
#
# `vout` is stamped as a DC source against ground, so the negative sign here is
# the whole point: the rail comes out below ground, and a board that assumed
# otherwise reads as a fault rather than passing quietly.
#
# Source for all three: Texas Instruments LM7905/LM7912/LM7915 datasheet
# SNOSBQ7C, June 1999, revised May 2013. Electrical Characteristics tables and
# the DESIGN CONSIDERATIONS thermal table.

[[models]]
id = "7905"
kind = "vreg"
description = "79xx / LM7905 negative linear regulator -5V, TO-220"

[models.match]
value_re = "(?i)^(LM|L|MC|UA|KA|NJM|AN|SPX)?79[LMS]?05"

[models.params]
vout      = -5.0     # VO at TJ = 25 C: -4.8 / -5.0 / -5.2 V
dropout_v = 1.1      # Dropout voltage typ @ IOUT = 1 A, TJ = 25 C
iq_a      = 1.0e-3   # IQ typ @ TJ = 25 C (2 mA max)

[models.pins]
"1" = "gnd"
"2" = "in"
"3" = "out"

[models.ratings]
max_current_a = 1.5          # "1.5A Output Current", Features
max_voltage_v = 25.0         # Input voltage abs max for the -5 V part, as a
                             # magnitude; the -12 V and -15 V parts are 35 V
max_junction_temp_c = 125.0  # Operating junction temperature range abs max
theta_jc_c_per_w = 3.0       # TO-220 typ (5.0 max), DESIGN CONSIDERATIONS
theta_ja_c_per_w = 60.0      # TO-220 typ. The datasheet's table prints Typ 60
                             # against Max 40, which cannot both be right; the
                             # larger figure is the conservative one to judge a
                             # junction temperature with, so it is used here.

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "7912"
kind = "vreg"
description = "79xx / LM7912 negative linear regulator -12V, TO-220"

[models.match]
value_re = "(?i)^(LM|L|MC|UA|KA|NJM|AN|SPX)?79[LMS]?12"

[models.params]
vout      = -12.0    # VO at TJ = 25 C: -11.5 / -12.0 / -12.5 V
dropout_v = 1.1      # Dropout voltage typ @ IOUT = 1 A, TJ = 25 C
iq_a      = 1.5e-3   # IQ typ @ TJ = 25 C (3 mA max)

[models.pins]
"1" = "gnd"
"2" = "in"
"3" = "out"

[models.ratings]
max_current_a = 1.5
max_voltage_v = 35.0         # Input voltage abs max (magnitude) for -12/-15 V
max_junction_temp_c = 125.0
theta_jc_c_per_w = 3.0
theta_ja_c_per_w = 60.0

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "7915"
kind = "vreg"
description = "79xx / LM7915 negative linear regulator -15V, TO-220"

[models.match]
value_re = "(?i)^(LM|L|MC|UA|KA|NJM|AN|SPX)?79[LMS]?15"

[models.params]
vout      = -15.0    # VO at TJ = 25 C: -14.4 / -15.0 / -15.6 V
dropout_v = 1.1      # Dropout voltage typ @ IOUT = 1 A, TJ = 25 C
iq_a      = 1.5e-3   # IQ typ @ TJ = 25 C (3 mA max)

[models.pins]
"1" = "gnd"
"2" = "in"
"3" = "out"

[models.ratings]
max_current_a = 1.5
max_voltage_v = 35.0
max_junction_temp_c = 125.0
theta_jc_c_per_w = 3.0
theta_ja_c_per_w = 60.0

# ═════════════════════════════════════════════════════════════════════════════
# The corpus LDO batch. Five fixed-output linear regulators that between them
# were the unresolved regulator on the Adafruit, SparkFun, MNT Reform and
# Arduino-official boards. Every number below is from the vendor datasheet named
# in the entry; none is transferred from a sibling part.
#
# WHAT EVERY ENTRY HERE DELIBERATELY DOES NOT MODEL, stated once rather than
# five times: `bind_vreg` stamps an ideal DC source on the output net, so line
# regulation, load regulation, PSRR, output noise and the internal current limit
# are exactly ABSENT rather than wrong. Most of these datasheets publish all
# five, and the numbers are simply not representable in this kind. Where a part
# has a soft-start or a foldback current limit, that is likewise unmodelled.
# `max_current_a` carries the continuous output rating for the stress monitor to
# judge against; that is a rating, not a simulated limit.
#
# ── AP2112K-3.3 ──────────────────────────────────────────────────────────────
# Diodes Inc 600 mA LDO, SOT25. The single highest-leverage regulator in the
# corpus: unresolved on FOUR independent board families (Adafruit Circuit
# Playground Express, Metro M4, QT Py, Trinket M0).
# Source: Diodes Incorporated AP2112 datasheet, document DS39724 Rev. 2-2,
#   June 2017. Figures from the "AP2112-3.3 Electrical Characteristics" table.
[[models]]
id = "ap2112k_3v3"
kind = "vreg"
description = "AP2112K-3.3 LDO, 600mA, 3.3V fixed, SOT25 (Diodes Inc)"

[models.match]
# AP2112K-3.3, AP2112K-3.3TRG1, and the AP2112 (non-K) variants of the same
# 3.3 V die. The voltage code is REQUIRED: the AP2112 family also ships 1.2 V
# through 5.0 V options on the same pinout, and binding a 1.8 V part to a 3.3 V
# source would put 1.5 V of fiction on a rail.
value_re = "(?i)^AP2112[KM]?[- ]?3[._]3([A-Z0-9-]*)?$"

[models.params]
vout      = 3.3      # +-1.5% @ VIN=4.3 V, 1 mA <= IOUT <= 30 mA
dropout_v = 0.25     # VDROP typ @ IOUT = 600 mA (400 mV max; 125 mV at 300 mA)
iq_a      = 55.0e-6  # IQ typ @ VIN=4.3 V, IOUT=0 (80 uA max; ISTD 0.01 uA typ
                     # in shutdown)

[models.pins]
# Pin Descriptions table, SOT25.
"1" = "in"
"2" = "gnd"
"3" = "en"
"4" = "nc"
"5" = "out"

[models.ratings]
max_current_a = 0.6          # IOUT(MAX) min
max_voltage_v = 6.5          # VCC abs max (2.5 to 6.0 V recommended)
max_junction_temp_c = 150.0  # TJ abs max
theta_ja_c_per_w = 184.0     # SOT25, no heatsink
theta_jc_c_per_w = 96.0      # SOT25
# max_power_w absent: the datasheet publishes no package power rating, only
# theta_JA/theta_JC and TJ(max), which is what the thermal monitor uses.

# ── MIC5205-3.3 ──────────────────────────────────────────────────────────────
# Microchip (Micrel) 150 mA low-noise LDO, SOT-23-5. 17 instances on the
# SparkFun RedBoard.
# Source: Microchip MIC5205 datasheet DS20005785B Rev. B, February 2022.
#
# THE BARE PART NUMBER IS THE ADJUSTABLE VERSION, which is why the voltage code
# is required in the match rule below. Per the datasheet's Product
# Identification System, "MIC5205" with no voltage suffix is the adjustable
# part (pin 4 becomes ADJ instead of BYP) and "MIC5205-3.3" is the fixed 3.3 V
# one. A board whose value string is just "MIC5205" does not say what its output
# is and is left unresolved on purpose.
[[models]]
id = "mic5205_3v3"
kind = "vreg"
description = "MIC5205-3.3 low-noise LDO, 150mA, 3.3V fixed, SOT-23-5"

[models.match]
value_re = "(?i)^MIC5205[- ]?3[._]3([A-Z0-9-]*)?$"

[models.params]
vout      = 3.3      # +-1% at TJ=25 C, +-2% over -40 to +125 C
dropout_v = 0.165    # typ @ IL = 150 mA (275-350 mV max; 110 mV at 50 mA)
iq_a      = 80.0e-6  # Ground Pin Current typ @ IL = 100 uA (125 uA max). The
                     # datasheet's ground current rises with load (600 uA typ at
                     # 50 mA, 1300 uA at 150 mA); the no-load figure is the one
                     # `iq_a` means. Shutdown IGND is 0.01 uA typ.

[models.pins]
# Table 3-1, SOT-23-5, FIXED version. On the adjustable part pin 4 is ADJ.
"1" = "in"
"2" = "gnd"
"3" = "en"
"4" = "byp"    # noise-bypass capacitor to the internal reference
"5" = "out"

[models.ratings]
max_current_a = 0.15         # guaranteed output current
max_voltage_v = 16.0         # operating ceiling (abs max is +-20 V); a check
                             # should fire on the operating limit
max_junction_temp_c = 125.0
theta_ja_c_per_w = 220.0     # SOT-23-5, minimum footprint (170 on square clad)
theta_jc_c_per_w = 130.0

# ── MCP1700-3302E ────────────────────────────────────────────────────────────
# Microchip 250 mA, 1.6 uA-IQ CMOS LDO. The low-quiescent part a coin-cell
# design reaches for.
# Source: Microchip MCP1700 datasheet DS20001826F.
# The "3302" in the order code is the output-voltage code: 3.3 V. Per the
# datasheet's marking/ordering tables the family also ships 1.2, 1.5, 1.8, 2.5,
# 2.8, 2.9, 3.0, 4.0 and 5.0 V, so the code is required in the match rule.
#
# NOTE: this part HAS NO ENABLE PIN. It is a three-terminal always-on regulator,
# which is why the pin map below has no `en` role. A board that expects to gate
# this rail is gating it somewhere else.
[[models]]
id = "mcp1700_3v3"
kind = "vreg"
description = "MCP1700-3302 CMOS LDO, 250mA, 3.3V fixed, 1.6uA IQ, SOT-23"

[models.match]
value_re = "(?i)^MCP1700[T]?[- ]?3302[A-Z0-9/_-]*$"

[models.params]
vout      = 3.3      # VR +-0.4% typ at 25 C (+-2.0/3.0% max over temperature)
dropout_v = 0.178    # typ @ IOUT = 250 mA, VR >= 2.5 V (350 mV max)
iq_a      = 1.6e-6   # Iq typ @ IL = 0, VIN = VR + 1 V (4 uA max)

[models.pins]
# Table 3-1, SOT-23 (3-pin).
"1" = "gnd"
"2" = "out"
"3" = "in"

[models.ratings]
max_current_a = 0.25         # 250 mA for VR >= 2.5 V (200 mA below that)
max_voltage_v = 6.5          # VDD abs max (2.3 to 6.0 V operating)
max_junction_temp_c = 150.0
theta_ja_c_per_w = 212.0     # SOT-23, JEDEC JESD51-7 FR-4 4-layer board
theta_jc_c_per_w = 139.0     # RthJC(top), SOT-23
# NOT MODELLED: the 408 mA typ short-circuit peak (IOUT_SC, measured 10 ms after
# a short). `bind_vreg`'s ideal source has no current limit.

# ── NCP1117ST50T3G ───────────────────────────────────────────────────────────
# onsemi 1 A LDO, SOT-223, 5.0 V fixed. The 5 V regulator on the Arduino Uno R3
# official board and the Adafruit Metro M4.
# Source: onsemi NCP1117/NCP1117I/NCV1117 datasheet, publication NCP1117/D
#   Rev. 31, August 2021. Figures from the 5.0 V rows.
#
# Like the MCP1700 above this is a three-terminal part with NO ENABLE PIN. On
# the fixed-output devices pin 1 is the ground/reference-programming pin, and the
# SOT-223 tab is internally connected to pin 2 (OUTPUT), not to ground: a layout
# that treats the tab as a ground pour is shorting the output.
[[models]]
id = "ncp1117_5v"
kind = "vreg"
description = "NCP1117ST50T3G LDO, 1A, 5.0V fixed, SOT-223 (onsemi)"

[models.match]
# The ST suffix is the SOT-223 package and 50 is the 5.0 V code; both are
# required. The DPAK (D2T) variant has a different theta_JA (67 vs 160 C/W) and
# the family's other voltage codes are 1.5 V through 5.0 V.
value_re = "(?i)^NC[PV]1117I?ST50[A-Z0-9]*$"

[models.params]
vout      = 5.0      # 4.950 to 5.050 V @ VIN=7.0 V, IOUT=10 mA, TA=25 C
dropout_v = 1.01     # typ @ IOUT = 500 mA (1.15 V max; 1.07 V typ at 800 mA),
                     # measured at VOUT - 100 mV
iq_a      = 6.0e-3   # Quiescent Current typ @ VIN = 15 V (10 mA max)

[models.pins]
# SOT-223, ST suffix, Case 318H. Tab is internally tied to pin 2.
"1" = "gnd"    # Adjust/Ground; tied internally on the fixed devices
"2" = "out"
"3" = "in"

[models.ratings]
max_current_a = 1.0          # >1 A capable; Note 3 caps regulator current at
                             # 1.0 A when VIN > 12 V
max_voltage_v = 20.0         # VIN abs max
max_junction_temp_c = 150.0
theta_ja_c_per_w = 160.0     # SOT-223, minimum-size pad (67 C/W for DPAK)
theta_jc_c_per_w = 15.0      # SOT-223
# NOT MODELLED: the 1000 mA min / 1500 typ / 2200 max output current limit.
# `max_power_w` absent: the datasheet says dissipation is "internally limited"
# and gives only TJ(max) and theta_JA.

# ── TLV75533P ────────────────────────────────────────────────────────────────
# TI 500 mA LDO, SOT-23-5, 3.3 V. Instances on the ZSWatch boards.
# Source: Texas Instruments TLV755P datasheet SBVS320D, November 2017, revised
#   September 2024.
[[models]]
id = "tlv75533p"
kind = "vreg"
description = "TLV75533P LDO, 500mA, 3.3V fixed, SOT-23-5 (TI DBV)"

[models.match]
# The 33 in the part number is the voltage code; the family spans 0.6 V to
# 5.0 V on the same pinout, so it is required.
value_re = "(?i)^TLV755?33P?[A-Z]{0,4}[0-9]?R?$"

[models.params]
vout      = 3.3      # +-1% max accuracy, -40 to +85 C, DBV package
dropout_v = 0.150    # VDO typ @ IOUT = 500 mA (238 mV max, -40 to +85 C)
iq_a      = 25.0e-6  # IGND typ @ IOUT = 0, TJ = 25 C (33 uA max over -40 to
                     # +85 C). Shutdown ISHDN is 0.1 uA typ.

[models.pins]
# DBV (SOT-23-5) package.
"1" = "out"
"2" = "gnd"
"3" = "en"
"4" = "nc"
"5" = "in"

[models.ratings]
max_current_a = 0.5
max_voltage_v = 6.0          # VIN abs max (1.45 to 5.5 V operating)
max_junction_temp_c = 150.0
theta_ja_c_per_w = 231.1     # DBV / SOT-23-5, JEDEC standard board
theta_jc_c_per_w = 118.4     # RthJC(top), DBV
# NOT MODELLED: ICL 720 mA typ current limit and the 355 mA typ short-circuit
# current.

# ═════════════════════════════════════════════════════════════════════════════
# SWITCHING REGULATORS DELIBERATELY LEFT UNRESOLVED, and the reason is the same
# for all of them, so it is recorded once here rather than as four empty entries.
#
# The corpus carries TLV62568 (MNT Reform), SY8089AAAC and SY8009AAAC (Olimex
# ESP32-EVB) and LMR16006YQ3 (MNT Reform) as unresolved buck converters. Their
# datasheets were read in full and they are NOT modelled, because the `vreg`
# kind requires `vout` and NONE OF THESE PARTS HAS ONE. Every one of them is an
# adjustable converter whose output is set by an external feedback divider on
# the board:
#
#   TLV62568   VFB = 0.6 V typ (0.588 to 0.612), VOUT = 0.6 * (1 + R1/R2)
#   SY8089AAAC VREF = 0.6 V typ, VOUT = 0.6 * (1 + R1/R2)
#   SY8009AAAC VREF = 0.6 V typ, same relation
#   LMR16006Y  VFB = 0.765 V typ (0.747 to 0.782), VOUT = VFB * (1 + R1/R2)
#
# Writing any specific `vout` for these would be inventing a divider the board
# already has and the model cannot see. Filling in a plausible 3.3 V would be
# wrong on every board that set them to something else, and silently right on
# the ones that did not, which is the worst possible failure mode: a rail
# reported confidently at a voltage nobody chose.
#
# What these need is a vreg variant that reads its output from a feedback-node
# divider on the netlist, which is an engine change and not a database entry.
# Until then they stay unresolved and the bind report says so, which is the
# honest outcome. For the record, so the work is not lost when that variant
# exists, the rest of each part's data was gathered:
#   TLV62568   1 A, VIN 2.5-5.5 V, RDS(on) 150 mOhm HS / 100 mOhm LS, IQ 35 uA,
#              ILIM 1.5 A min, theta_JA 191.6 C/W (DBV). TI SLVSD89B.
#   SY8089AAAC 2 A cont / 3 A peak, VIN 2.7-5.5 V, RDS(on) 110 mOhm PFET /
#              80 mOhm NFET, IQ 55 uA, ILIM 3.5 A min, PD 0.6 W at TA=25 C,
#              theta_JA 170 C/W. Silergy AN_SY8089/SY8089A Rev. 0.9A.
#   SY8009AAAC 1.5 A (NOT 2 A: the 2 A rating is the SY8009B in SOT23-6),
#              VIN 3-5.5 V, RDS(on) 180 mOhm PFET / 120 mOhm NFET, IQ 80 uA,
#              ILIM 1.8 A min, theta_JA 170 C/W. Silergy SY8009A/B Rev1.0.
#   LMR16006Y  600 mA, VIN 4-60 V, high-side RDS(on) 900 mOhm (non-synchronous,
#              external Schottky for the low side), IQ 28 uA, ILIM 1.2 A typ,
#              theta_JA 102 C/W. The Y is the 2.1 MHz frequency grade and the Q
#              suffix is AEC-Q100 qualification, NOT an output-voltage code.
#              TI SNVSA24.
