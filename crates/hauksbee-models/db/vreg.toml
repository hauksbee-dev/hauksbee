# ── AP1117-33 / AP1117E33G-13 (Diodes 1 A LDO, fixed 3.3 V) ────────────────
# Source: Diodes AP1117/AP1117I DS31009 Rev. 24-3, March 2015 (marked "not
# recommended for new design"). Ordering Information: AP1117 [I] E 33 [G|L]
# [-13|-U]; this revision lists only E = SOT223, with pin 1 Adj (GND for
# fixed mode), 2 VOUT, 3 VIN and the tab VOUT (Typical Applications Circuit,
# "Tab is VOUT"). Older revisions also sold SOT-89 and TO-252/TO-263/TO-220
# parts that this sheet no longer documents, so the card takes the E letter
# or, for a spelling with no package letter ("AP1117-33"), nothing; both are
# held to a SOT-223 footprint, the one package whose map is stated here.
# The voltage code 33 is required: the bare part is the adjustable one, whose
# 1.25 V reference is not an output voltage.
[[models]]
