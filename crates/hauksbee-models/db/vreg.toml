# ── "AP2112/RT9080-3.3": either-part 3.3 V LDO, SOT-23-5 ──────────────────────
# Adafruit's BOM value for a footprint that may be stuffed with EITHER a Diodes
# AP2112K-3.3 or a Richtek RT9080-33GJ5 (Adafruit Feather ESP32-S3, U2 and U5).
#
# Sources:
#   [1] Diodes Incorporated "AP2112 600mA CMOS LDO regulator with enable",
#       DS39724 Rev. 2-2, June 2017. Pin Descriptions p.2 (SOT25 column),
#       Absolute Maximum Ratings p.3, AP2112-3.3 Electrical Characteristics p.8.
#       PDF sha256 ef8d376f2ec356e29172eb9e053819a0ebdcc576dba7fc9ab0505c568427920f
#       (the copy named AP2112_RT9080-3.3.pdf in the eval set is this same file:
#       it contains NO RT9080 data).
#   [2] Richtek "RT9080 2uA IQ, 600mA Low-Dropout Linear Voltage Regulator",
#       DS9080-09, December 2024. Section 2 Ordering Information (J5 =
#       TSOT-23-5; "RT9080: Without SNS Pin", RT9080N with), Section 7 Pin
#       Configuration, Section 8 Functional Pin Description, Section 10 Absolute
#       Maximum Ratings, Section 12 Recommended Operating Conditions, Section 13
#       Thermal Information, Section 14 Electrical Characteristics.
#       PDF sha256 52d09967ef32672003df93d1382bc249715365406f59d110d9ebad6d618017d4
#
# WHY A SEPARATE ENTRY AND NOT A WIDER AP2112 REGEX. The two pin maps agree on
# these pads: AP2112 SOT25 1 VIN, 2 GND, 3 EN, 4 NC, 5 VOUT [1]; RT9080 (no SNS,
# i.e. not the RT9080N) TSOT-23-5 1 VIN, 2 GND, 3 EN, 4 NC, 5 VOUT [2 Section
# 8]. The numbers do not: RT9080 dropout at 600 mA is 0.53 V max for VOUT >= 3 V
# against the AP2112's 0.4 V, its recommended VIN tops out at 5.5 V against
# 6.0 V, its θJA is 189.4 C/W against 184, and its accuracy is ±2% against
# ±1.5%. Widening ap2112_3v3_sot25 would put AP2112-only numbers on a board that
# may carry the Richtek part. Every limit below is the WORSE of the two; the
# quiescent current is the AP2112's 55 uA (the larger load; RT9080 is 2 uA).
#
# BOARD CHECK (Adafruit ESP32-S3 8MB No PSRAM.brd, package SOT23-5): U2 pads
# 1 VHI, 2 GND, 3 EN, 4 unconnected, 5 3.3V; U5 pads 1 VHI, 2 GND, 3 I2C_PWR,
# 4 unconnected, 5 VSENSOR. Both agree with the shared map.
[[models]]
id = "ap2112_or_rt9080_3v3_sot25"
kind = "vreg"
description = "AP2112K-3.3 or RT9080-33GJ5 alternate-stuffed 3.3V 600mA LDO, SOT-23-5 (worst case of both datasheets)"

[models.match]
# Only the alternate-part spelling. The single-vendor values keep their own
# cards (ap2112k_3v3, ap2112_3v3_sot25). The footprint gate keeps the AP2112's
# SO-8 / SOT89-5 maps and the RT9080's ZQFN-4L map (1 VOUT, 2 GND, 3 EN, 4 VIN)
# out, because the value names no package.
value_re = "(?i)^AP2112[A-Z]?\\s*/\\s*RT9080[- ]?3[._]3V?$"
footprint_re = "(?i)T?SOT-?23-?5|SOT-?25|SC-?74A"

[models.params]
vout       = 3.3      # [1] AP2112-3.3 EC (±1.5%); [2] Section 14 ±2% at 1 mA
dropout_v  = 0.53     # [2] Section 14 VDROP max, ILOAD = 600 mA, VOUT >= 3 V (AP2112: 0.4 V max)
cout_min_f = 1.0e-6   # [1] Note 4 1.0 uF ceramic; [2] Section 8 "1uF or larger ceramic (0.7uF effective)"
iq_a       = 55.0e-6  # [1] IQ typ, VIN = 4.3 V (80 uA max); [2] RT9080 IQ 2 uA typ, so the larger is carried
i_shdn_a   = 1.0e-7   # the larger of [1] ISTD 0.01 uA typ (p.8) and [2] ISHDN 0.1 uA typ, VEN = 0 V (Section 14 Electrical Characteristics p.6)
en_on_v    = 1.5      # worst case of both: [1] VIH 1.5 V min (p.8) vs [2] VEN_R 0.9 V min (Section 14 p.6); the higher guarantees both parts are on
en_off_v   = 0.4      # worst case of both: [1] VIL 0.4 V max (p.8) and [2] VEN_F 0.4 V max (Section 14 p.6); equal
en_discharge_ohms = 80.0  # both parts discharge: [1] RDCHG 60 Ohm typ (p.8), [2] RDISCHG 80 Ohm typ (Section 14 p.6); the weaker (larger) is carried
# No EN pull key: [1] states a 3.0 MOhm pull-down but [2] states none (its IEN is leakage), so the pull is not shared.

[models.pins]
"1" = "in"
"2" = "gnd"
"3" = "en"    # active high; the output is gated on it, see en_* above
"4" = "nc"
"5" = "out"

[models.ratings]
max_current_a = 0.6          # [1] IOUT(MAX) 600 mA min; [2] 600 mA for VIN >= 2.3 V
max_voltage_v = 6.5          # [1] VCC abs max 6.5 V; [2] Section 10 VIN -0.3 to 6.5 V
max_junction_temp_c = 150.0  # [1] TJ 150 C; [2] Section 10 150 C (recommended 125 C max)
theta_ja_c_per_w = 189.4     # [2] Section 13 θJA TSOT-23-5, JEDEC (AP2112 SOT25: 184)

[[models.envelope]]
kind = "supply_range"
pin = "in"
min_v = 2.5
max_v = 5.5
abs_max_v = 6.5
basis = "Intersection of AP2112 DS39724 Rev. 2-2 recommended VIN 2.5 to 6.0 V and RT9080 DS9080-09 Section 12 VIN 1.2 to 5.5 V; abs max 6.5 V in both"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.diodes.com/assets/Datasheets/AP2112.pdf"
title = "Diodes Incorporated AP2112 600mA CMOS LDO regulator with enable, DS39724 Rev. 2-2, June 2017"
locator = "Pin Descriptions p.2 (SOT25 column); Absolute Maximum Ratings p.3; AP2112-3.3 Electrical Characteristics p.8"
sha256 = "ef8d376f2ec356e29172eb9e053819a0ebdcc576dba7fc9ab0505c568427920f"
[[models.source.references]]
url = "https://www.richtek.com/assets/product_file/RT9080/DS9080-09.pdf"
title = "Richtek RT9080 2uA IQ, 600mA Low-Dropout Linear Voltage Regulator, DS9080-09, December 2024"
locator = "Section 2 Ordering Information; Section 7 Pin Configuration; Section 8 Functional Pin Description; Sections 10, 12, 13; Section 14 Electrical Characteristics"
sha256 = "52d09967ef32672003df93d1382bc249715365406f59d110d9ebad6d618017d4"

# ── AP2114HA-3.3 (Diodes/BCD 1 A low-noise CMOS LDO, SOT-223, HA pinout) ──────
# Source: BCD Semiconductor (now Diodes) "AP2114 1A Low Noise CMOS LDO Regulator
#   with Enable", data sheet Rev. 2.2, January 2013. Figure 2 Pin Configuration
#   (page 2, top view) and Pin Descriptions (page 3); Ordering Information
#   (pages 4 to 5, AP2114HA-3.3TRG1, marking GH14F); Absolute Maximum Ratings and
#   Recommended Operating Conditions (page 7); AP2114-3.3 Electrical
#   Characteristics (page 12).
#   PDF sha256 d20cd46c5f472fe220f3e1ffb82b2679bc37e3dd145891bfdedf0acb78089d51
#
# THE HA PIN MAP IS NOT THE H PIN MAP. Figure 2: H = 1 GND, 2 VOUT, 3 VIN, tab
# VOUT; HA = 1 VIN, 2 GND, 3 VOUT, tab GND. The Pin Descriptions table agrees
# (HA column: GND 2, VOUT 3, VIN 1). Like the H, the HA has no EN pin: EN
# exists only on the SOIC-8 / PSOP-8 members.
#
# BOARD CHECK (smartknob view_base.kicad_pcb, U6, footprint
# "Modified:SOT-223-3_TabPin2_InGndOut"): pad 1 +5V, pad 2 GND (both the pin and
# the tab are numbered "2"), pad 3 +3V3. That is the HA map exactly. Pad "4" is
# carried for libraries that number the tab separately.
#
# Same die and the same AP2114-3.3 Electrical Characteristics table as
# ap2114h_3v3; only the package pin assignment differs, so the numbers match it.
[[models]]
id = "ap2114ha_3v3"
kind = "vreg"
description = "Diodes AP2114HA-3.3 1A low-noise LDO, 3.3V fixed, SOT-223 HA pinout (1 VIN, 2/tab GND, 3 VOUT; no enable)"

[models.match]
# Ordering Information: AP2114HA-3.3TRG1. The voltage code is required (1.2, 1.5,
# 1.8, 2.5 V HA parts exist), and "HA" is required so the H map is never used.
value_re = "(?i)^AP2114HA-3[._]3(TRG1|G1|TR)?$"

[models.params]
vout       = 3.3      # AP2114-3.3 EC, VIN = 4.3 V, 1 mA <= IOUT <= 30 mA (3.25 to 3.35 V at IOUT(MAX) row)
dropout_v  = 0.75     # VDROP max @ IOUT = 1 A (450 mV typ)
# RECOMMENDATION, not a minimum. Diodes AP2114 datasheet (Rev. 2.2) p.1
# Features: "Stable with 4.7μF Flexible Cap: Ceramic, Tantalum and Aluminum
# Electrolytic"; EC test COUT = 4.7 uF. No minimum is stated.
cout_recommended_f = 4.7e-6
