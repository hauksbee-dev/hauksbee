# ── TLV75733P (fixed 3.3 V LDO, SOT-23-5 DBV) ───────────────────────────────
# TI TLV757P 1 A low-IQ LDO, 3.3 V fixed option, DBV (SOT-23-5) package, as
# fitted at U20/U24 on the trigger-output-fmc board (VDDA rails of the two
# Si5394 jitter cleaners).
#
# Source: TI "TLV757P 1A, Low IQ, Small-Size, Low-Dropout Regulator",
#   SBVS322C, October 2017, revised March 2024,
#   https://www.ti.com/lit/ds/symlink/tlv757p.pdf
#   (local copy sha256 84930bb4785ab3ddf29a6d1731a50c9bd37abeb9cbb91db86d476a9ff54033f0).
#   Pin Functions Table 4-1 and Figure 4-1 p.3; 5.1 Absolute Maximum Ratings,
#   5.3 Recommended Operating Conditions p.4; 5.4 Thermal Information and
#   5.5 Electrical Characteristics p.5-6; Orderable addendum (TLV75733PDBVR,
#   SOT-23 (DBV) 5).
#
# Datasheet figures used:
#   VIN       = 1.45 to 5.5 V recommended; 6.0 V abs max
#   IOUT      = 0 to 1 A recommended
#   VOUT      = +/-1% (-40..85 C), +/-1.5% (-40..125 C) for VOUT >= 1 V
#   VDO       = 300 mV typ / 425 mV max (-40..85 C), 475 mV max (-40..125 C)
#               at IOUT = 1 A, 3.3 V <= VOUT < 5.0 V row (non-DYD)
#   IGND      = 25 uA typ, 31 uA max at TJ = 25 C, IOUT = 1 mA
#   COUT      = 1 uF min (200 uF max) recommended
#   RθJA      = 231.1 C/W JEDEC 2s2p, DBV (100.8 on the DYD-layout EVM; not used)
#   TJ        = -40..125 C recommended (abs-max table lists -40..150 C)
#
# `dropout_v` is the 475 mV MAXIMUM over -40..125 C, not the 300 mV typical, so
# a rail with marginal headroom is flagged rather than passed.
# `max_junction_temp_c` is the 125 C recommended-operating limit, not the 150 C
# abs-max line: the electrical table is only guaranteed to 125 C.
#
# Package: the match requires the DBV code. The DRV (WSON-6) package puts OUT on
# pin 1 and IN on pin 6, so a looser rule would bind a wrong pin map. The DYD
# (SOT-23-5 with thermal pad) has the same pinout but different dropout rows
# and RθJA, so it is also left to its own entry.
#
# Board check: U20/U24 symbol pins 1 IN, 2 GND, 3 EN, 4 NC, 5 OUT on footprint
# Package_TO_SOT_SMD:SOT-23-5, matching Table 4-1 DBV. EN is tied to IN on this
# board, so the EN gate is always on here.
#
# EN (SBVS322C 5.5 Electrical Characteristics p.6): VHI 1 V (EN pin high voltage,
# enabled, the Min column) and VLO 0.3 V max. The binder gates the output on EN
# from `en_on_v` / `en_off_v`. IEN (10 nA) is leakage, so no EN pull is set.
# The P version actively discharges the output when disabled: RPULLDOWN 95 Ohm
# typ at VIN = 3.3 V (5.5 table, p.6); 6.3.2 text p.12 says 120 Ohm, the table
# row is used. `en_discharge_ohms` carries it.
#
# DELIBERATELY NOT MODELLED: soft start, foldback current limit
# (ICL 1.2 A min, ISC 755 mA typ), UVLO (1.3 V typ rising), thermal shutdown,
# PSRR, noise, line/load regulation.
[[models]]
id = "tlv75733p_dbv"
kind = "vreg"
description = "TI TLV75733P 3.3V fixed 1A LDO, SOT-23-5 DBV (nominal DC model; protection/transients not modeled)"

