# ST STLQ015 DS6765 Rev 7 (Feb. 2020), Table 4 Electrical characteristics (pp.5-6),
# VEN rows, VIN = 1.5..5.5 V: enable input logic high 0.7 V (min), enable input
# logic low 0.4 V (max). Read from the text extract of the ST PDF (column
# placement lost in the extract; the low row is the max, the high row the min).
# IEN (1 nA typ, 200 nA max at 5.5 V) is leakage, not a pull; no discharge
# resistance is printed.
