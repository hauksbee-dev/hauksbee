vout       = 3.3      # fixed-output code 33; accuracy +-2 % at IOUT = 10 mA
dropout_v  = 0.4      # VDROP max @ IOUT = 500 mA, 2.7 V <= VIN <= 5.5 V (250 mV typ)
cout_min_f = 1.0e-6   # Features: "Output only 1uF capacitor required for stability"
iq_a       = 25.0e-6  # IQ typ @ VEN = 5 V, IOUT = 0 (50 uA max; shutdown 0.7 uA typ)
# EN pin (active high; the binder gates the output on it from these fields).
# Richtek DS9013-10 (April 2011), Electrical Characteristics (p.4), EN Threshold
# Voltage: Logic-High VIH 1.6 V min, Logic-Low VIL 0.6 V max. Enable pin current
# IEN (0.1 uA typ) is bias, not a pull, and the Enable section says EN cannot be
