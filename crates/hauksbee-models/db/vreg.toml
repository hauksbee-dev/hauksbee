dropout_v=0.25 # guaranteed max at 150 mA, SBVS115D §6.5
cout_min_f=1e-6 # ceramic, SBVS115D §5 and §7.1
iq_a=0.5e-6
# EN pin (active high; the binder gates the output on it from these fields).
# TI TPS782 SBVS115D (Jan. 2015), 5 Pin Configuration and Functions, EN (p.3): "Drive this
# pin over 1.2 V to turn on the regulator. Drive this pin below 0.4 V to put the
# regulator into shutdown mode" (the Electrical Characteristics table prints no
# VEN(HI)/VEN(LO) row; the shutdown-time test also uses VEN = 1.2 V and 0.4 V).
