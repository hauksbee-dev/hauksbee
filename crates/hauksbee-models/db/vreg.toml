# TI TPS7A26 SBVS290B §§5-6.5. Package-specific maps prevent wrong-pad binding.
[[models]]
id="tps78233_ddc"
kind="vreg"
description="TI TPS78233 3.3 V, 150 mA, DDC TSOT23-5; loop/transients not simulated"
[models.match]
value_re="(?i)^TPS78233(?:DDC(?:R|T)(?:G4)?(?:\\.A)?)?$"
footprint_re="(?i)(TSOT|SOT)[-_]?23[-_]?5"
