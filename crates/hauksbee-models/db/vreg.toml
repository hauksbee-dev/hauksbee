# ─────────────────────────────────────────────────────────────────────────────
# XC6220B331MR-G: Torex 1 A "Green Operation" CMOS LDO, 3.30 V fixed, SOT-25.
#
# Source: Torex Semiconductor Ltd "XC6220 Series, 1A LDO Voltage Regulator with
#   'Green Operation'", document ETR03041-016b
#   (https://product.torexsemi.com/system/files/series/xc6220.pdf), PDF sha256
#   e6a8fbbb28750515582d7bdde5c641293a0286dc1094454f26a00e0b16b9736c:
#   PRODUCT CLASSIFICATION / Ordering Information (p.2), PIN CONFIGURATION and
#   PIN ASSIGNMENT (p.3), ABSOLUTE MAXIMUM RATINGS (p.4), ELECTRICAL
#   CHARACTERISTICS (p.5-6) and Voltage Chart 2, VOUT(T) = 3.30 row (p.8).
#
# Ordering code decode (p.2): B = no CE pull-down, with CL auto-discharge
# (standard); 33 = 3.3 V; 1 = second decimal 0 (3.30 V); MR-G = SOT-25.
#
# Datasheet figures used (Ta = 25 C, VIN = VOUT(T) + 1.0 V = 4.3 V unless stated):
#   VOUT(E)  = 3.2670 .. 3.3330 V  HS mode, IOUT = 30 mA (Voltage Chart 2, E-0)
#              3.2340 .. 3.3660 V  PS mode, IOUT = 0.1 mA
#   Vdif1    = 60 mV typ, 95 mV max   @ IOUT = 300 mA  (E-1, the 3.00-3.95 V cell)
#   Vdif2    = 655 mV max             @ IOUT = 1000 mA (E-2, the 2.0-5.0 V cell)
#              (Voltage Chart 2 prints these as merged cells; pdftotext places
#               60/95 on the 3.50 row and 655 on the 4.00 row, the vertical
#               centres of the 3.00-3.95 V and 3.00-5.00 V spans on p.8)
#   ISS1     = 50 uA typ, 108 uA max  HS mode, IOUT = 10 mA (A/B series)
#   ISS2     = 8 uA typ, 18 uA max    PS mode, IOUT = 0.1 mA (A/B series)
#   ISTBY    = 0.01 uA typ            VIN = 6.0 V, VCE = VSS
#   IOUTMAX  = 1000 mA min, 1200 typ  1.2 V <= VOUT(T) <= 5.0 V
#   ILIM     = 1005 mA min, 1200 typ;  ISHORT 180 mA typ (foldback into a short)
#   VIN      = 1.6 to 6.0 V; VCEH 1.2 V min, VCEL 0.4 V max
#   TSD      = 150 C detect, 135 C release (typ)
# Absolute Maximum Ratings: VIN -0.3 to 6.5 V; VOUT -0.3 to VIN + 0.3 V; VCE
#   -0.3 to 6.5 V; Pd SOT-25 250 mW IC only / 600 mW 40x40 mm standard board /
#   760 mW JESD51-7 board; Topr -40 to 85 C. No theta_JA or TJ(max) is printed,
#   so this entry carries `max_power_w` (bare-IC figure) only, like xc6206_3v3.
#
# PIN MAP (SOT-25, PIN ASSIGNMENT p.3): 1 VIN, 2 VSS, 3 CE, 4 NC, 5 VOUT. The
# SOT-89-5 (PR-G: 1 CE, 2 VSS, 3 NC, 4 VIN, 5 VOUT) and USP-6C (ER-G) maps
# differ, so the regex takes ONLY the MR (SOT-25) order code. Checked on
# open-book OSO-BOOK-B1 U1 (Package_TO_SOT_SMD:SOT-23-5, symbol borrowed from
# AP2112K-3.3): pad 1 -> VCC, pad 3 -> VCC (CE tied high), pad 2 -> GND,
# pad 5 -> +3V3, pad 4 unconnected.
#
# `dropout_v` follows the library convention (the guaranteed max at the rated
# current, as ap2112k_3v3 does): Vdif2 655 mV at 1 A. At the 300 mA row the
# guaranteed max is 95 mV, so on a light load this headroom is pessimistic.
#
# DELIBERATELY NOT MODELLED: bind_vreg stamps an ideal DC source, so Green
# Operation (HS/PS auto-switching at IGO/IGOR), the +/-1% / +/-2% accuracy
# windows, load/line regulation, the 1.2 A current limit and 180 mA foldback,
# the 700 mA inrush limiter and thermal shutdown are absent rather than wrong.
# The binder gates the output on CE from `en_on_v` / `en_off_v` and, when
# disabled, discharges it through `en_discharge_ohms` (RDCHG, B type). The B type
# has no CE pull-down resistor, so no `en_pull_*` key is set.
#
# Corrections vs the unreviewed LLM draft: pin map and VOUT/dropout values were
# right; added the merged-cell provenance for E-1/E-2, the 250 mW bare-IC
# `max_power_w`, the vendor URL and document number, the HS-mode ISS1 row, and
# tightened the match so XC6220A/C/D and the PR/ER package codes cannot bind.
[[models]]
id = "xc6220b331mr"
kind = "vreg"
description = "XC6220B331MR-G Torex 1A LDO, 3.30V fixed, SOT-25 (Green Operation not modeled)"

[models.match]
# Accepts XC6220B331MR-G and XC6220B331MR. Rejects other output codes (e.g.
# B301, B181, B33B = 3.35 V), the A/C/D CE types, and the PR-G (SOT-89-5) and
# ER-G (USP-6C) package codes whose pin maps differ.
value_re = "(?i)^XC6220B331MR(?:-?G)?$"

[models.params]
# Torex ETR03041-016b, Voltage Chart 2, VOUT(T) = 3.30 row (p.8).
vout      = 3.3      # nominal; VOUT(E) 3.267..3.333 V in HS mode @ IOUT = 30 mA
dropout_v = 0.655    # Vdif2 MAX @ IOUT = 1000 mA (E-2); Vdif1 60 typ / 95 max mV @ 300 mA
iq_a      = 8.0e-6   # ISS2 typ, PS mode @ IOUT = 0.1 mA (18 uA max; HS mode ISS1 50 uA typ)
i_shdn_a  = 1.0e-8   # ISTBY "Stand-by Current" typ (+-0.1 uA limit), VIN = 6.0 V, VCE = VSS, Torex ETR03041-016b ELECTRICAL CHARACTERISTICS p.5
en_on_v   = 1.2      # VCEH min, Torex ETR03041-016b ELECTRICAL CHARACTERISTICS p.6 (6.0 V max)
en_off_v  = 0.4      # VCEL max, same table p.6
en_discharge_ohms = 460.0  # RDCHG typ, B/D type, VIN = 6.0 V, VOUT = 5.0 V, VCE = VSS, p.6 (note *4)

[models.pins]
# SOT-25, PIN ASSIGNMENT (p.3).
"1" = "in"    # VIN
"2" = "gnd"   # VSS
"3" = "en"    # CE, ON/OFF control, gated by the binder from en_* above (B type: no internal pull-down; do not leave open)
"4" = "nc"    # NC
"5" = "out"   # VOUT

[models.ratings]
max_current_a = 1.0   # IOUTMAX min, 1.2 V <= VOUT(T) <= 5.0 V (1200 mA typ)
max_voltage_v = 6.5   # VIN abs max
max_power_w   = 0.25  # SOT-25 Pd, IC only, Ta = 25 C (600 mW on 40x40 mm board)

