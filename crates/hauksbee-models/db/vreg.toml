# ── LM1117 (TI 800 mA LDO: fixed 1.8 / 2.5 / 3.3 / 5.0 V and ADJUSTABLE) ─────
# Source: TI LM1117 SNOS412Q (February 2000, revised January 2023), sha256
# c117f5dd97fd15e62c0dee3adbf1af60480a128a10a0f9a9c28aafb8220ec3aa (byte-identical to the
# ti.com lm1117.pdf symlink). Table 6-1 Pin Functions p.3 (ADJ/GND 1, VOUT 2 and tab, VIN 3 on
# TO-252, TO-263 and TO-220; SOT-223 VOUT 2 and 4, the tab), 7.1 p.4 (VIN 20 V abs max),
# 7.3 p.4 (VIN 15 V), 7.4 p.4 thermal, 7.5 Electrical Characteristics pp.5-6, p.1 and 9.2.2.1.3
# p.15 (output capacitor).
#
# These are NOT the AMS1117 cards: the AMS sheet recommends 22 uF tantalum (a recommendation),
# while TI's LM1117 sheet states a 10 uF tantalum MINIMUM at the output, which gates.
# The value rules take only the packages whose pad numbering Table 6-1 gives as ADJ/GND 1,
# VOUT 2, VIN 3: SOT-223 (DCY), TO-252 (NDP), TO-263 (KTT), TO-220 (NDE), that is order codes
# LM1117, LM1117I with an MP/MPX, DT/DTX, S/SX or T suffix or none. The WSON order codes (LD)
# number their pins differently (ADJ/GND 1, VIN 2-4, VOUT 5-7) and match no card here, so a
# WSON part is reported as unmodelled instead of being read with the wrong pin map.
# A bare "LM1117" (or -ADJ) is the adjustable part: its ADJ pin (pin 1) is referenced to the
# OUTPUT, VREF = 1.25 V sits between OUT and ADJ, so the board's own R1/R2 divider and the
# ADJ-pin current set the rail (VOUT = VREF x (1 + R2/R1) + IADJ x R2). Like the LM317 card
# it maps no gnd pin. 1.25 V is a reference, never an output voltage.
# CAVEAT: if a board really uses a fixed-voltage LM1117 whose value string omits the voltage,
# put the full part number (LM1117-3.3) in the value; with pin 1 grounded the adjustable card
# would read the rail as 1.25 V.
[[models]]
id = "lm1117_adj"
kind = "vreg"
description = "TI LM1117 800mA adjustable LDO (bare part number or -ADJ), ADJ-referenced; rail set by the board divider against 1.25V"

