kind = "supply_range"
pin = "in"
min_v = 1.5
max_v = 5.5
abs_max_v = 7.0
basis = "ST STLQ015 DS6765 Rev 7, Table 4 Electrical characteristics, VIN operating input voltage 1.5 V to 5.5 V; Table 2 Absolute maximum ratings, VIN DC input voltage -0.3 V to 7 V"

