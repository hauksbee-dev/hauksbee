# Operating Conditions (p.4), 6.4 Thermal Information (p.4), 6.5 Electrical
# Characteristics (p.5), 7.3.2 100% Duty Cycle Low Dropout Operation (p.7).
# Only the DBV (SOT-23-5) order code binds: the DDC/DRL packages put PG/NC on
# extra pads and the DRL moves every pin (EN on 5, FB on 1).
[[models]]
