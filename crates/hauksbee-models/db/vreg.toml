min_v = 4.9
max_v = 30.0
abs_max_v = 30.0
basis = "ST LD1086 DocID6739 Rev 38, Table 5 (p.11), LD1086#33 output voltage guaranteed for VI = 4.9 to 30 V; Table 1 (p.7), DC input voltage 30 V abs max"

