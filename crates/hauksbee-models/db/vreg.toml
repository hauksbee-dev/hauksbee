max_voltage_v = 16.0

# ─────────────────────────────────────────────────────────────────────────────

# 78xx fixed linear regulators. One entry per voltage code: the value regex
# matches ONLY that part's two-digit code (05/06/08/09/12/15/18/24), optionally
# behind a manufacturer prefix (LM/L/MC/UA/KA/NJM/AN/SPX) and a current-class
# letter (78L/78M/78S). A single unanchored "78xx" rule used to bind the whole
# family: 7809/7812/7815 included, as +5V, silently simulating the wrong rail.
# Source: ST L78xx datasheet DS0422, Table (typical). Dropout ~2 V, Iq ~6 mA.

# The 7805 is read off the datasheet in full, because it is the one a hobbyist
# actually reaches for. Its siblings below still carry the older summary
# figures, including a `max_power_w = 2.0` that is NOT in the datasheet.
#
# Source: STMicroelectronics "L78 Positive voltage regulator ICs" datasheet
#   DS0422 Rev 38, February 2025, Table 3 "Electrical characteristics of
#   L7805A" (VI = 10 V, IO = 1 A, TJ = 0 to 125 C unless otherwise specified).
#
# Datasheet figures used:
#   VO      = 4.9 / 5 / 5.1 V           @ TJ = 25 C
#   VO      = 4.8 / 5 / 5.2 V           @ IO = 5 mA to 1 A, VI = 7.5 to 18 V
#   Iq      = 4.3 mA typ, 6 mA max      @ TJ = 25 C
#   dIq     = 0.5 mA max                @ IO = 5 mA to 1 A
#   Vd      = 2 V typ                   @ IO = 1 A, TJ = 25 C
#   Line reg= 7 mV typ, 50 mV max       @ VI = 7.5 to 25 V, IO = 500 mA, TJ = 25 C
#   Load reg= 25 mV typ, 100 mV max     @ IO = 5 mA to 1 A
#   SVR     = 68 dB typ                 @ VI = 8 to 18 V, f = 120 Hz, IO = 500 mA
#   RO      = 17 mOhm typ               @ f = 1 kHz
#   eN      = 10 uV/VO typ              @ TA = 25 C, B = 10 Hz to 100 kHz
#   ISC     = 0.2 A typ                 @ VI = 35 V, TA = 25 C
#   IScp    = 2.2 A typ                 @ TJ = 25 C   (peak, short-circuit)
#   dVO/dT  = -1.1 mV/C typ
#   Minimum load current for regulation is 5 mA (table note).
# Absolute maximum ratings (Table 1): VI 35 V for the 5 V to 18 V output codes
#   (40 V for the 20 V and 24 V codes); IO and PD both "internally limited";
#   operating junction temperature 0 to 125 C for the C/AC grades, -40 to 125 C
#   for the AB grade.
# Thermal data (Table 2): RthJC / RthJA = 5 / 50 C/W for TO-220, 5 / 60 for
#   TO-220FP, 8 / 100 for DPAK, 3 / 62.5 for D2PAK.
#
# `iq_a` moves from 6 mA to the 4.3 mA typical: 6 mA is the table MAXIMUM, and
# every other quiescent current in this file is a typical, so stamping the max
# here silently made the 7805 the thirstiest LDO in the library.
#
# DELIBERATELY NOT MODELLED: the output is an ideal DC source, so line and load
# regulation, SVR, output resistance, noise and the temperature drift are absent
# rather than wrong; so is the internal current limit (ISC folds back to 0.2 A
# at 35 V in, which no ideal source does) and the thermal shutdown. The 5 mA
# minimum load current for regulation is also not enforced, so this model holds
# 5 V into an open circuit where the real part's output would drift.
# `max_power_w` is gone: the datasheet states PD is internally limited and
# publishes RthJC/RthJA instead, which is what the thermal monitor wants. The
# 2.0 W it used to carry ("TO-220 no heatsink") is not a datasheet figure.
# The ratings below are the TO-220 ones; a DPAK or D2PAK build has a different
# RthJA and this entry will judge its junction temperature wrongly.
[[models]]
id = "7805"
kind = "vreg"
description = "78xx / LM7805 linear regulator +5V, TO-220"

[models.match]
value_re = "(?i)^(LM|L|MC|UA|KA|NJM|AN|SPX)?78[LMS]?05"

[models.params]
# Source: ST L78 datasheet DS0422 Rev 38, Table 3 (L7805A). See above.
vout      = 5.0     # 4.9 / 5 / 5.1 V @ TJ = 25 C, VI = 10 V, IO = 1 A
dropout_v = 2.0     # Vd typ @ IO = 1 A, TJ = 25 C
iq_a      = 4.3e-3  # Iq typ @ TJ = 25 C (6 mA max)

[models.pins]
"1" = "in"
"2" = "gnd"
"3" = "out"

[models.ratings]
max_current_a = 1.5          # "Output current up to 1.5 A", datasheet Features
max_voltage_v = 35.0         # VI abs max for the 5 V to 18 V output codes
max_junction_temp_c = 125.0  # TOP abs max
theta_ja_c_per_w = 50.0      # TO-220, Table 2 Thermal data
theta_jc_c_per_w = 5.0       # TO-220, Table 2 Thermal data

