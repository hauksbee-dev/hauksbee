[[models.source.references]]
url = "https://www.diodes.com/assets/Datasheets/AP7361C.pdf"
title = "Diodes Incorporated AP7361C 1A low dropout adjustable and fixed-mode regulator with enable, DS37274 Rev. 5-2, October 2020"
locator = "Pin Descriptions p.2 (SOT223 column); Absolute Maximum Ratings and Recommended Operating Conditions p.4; Electrical Characteristics p.5-6; Ordering Information"
sha256 = "9b64f49c5975b2baf2360248a75212599bde8bf083d315d936e4f1c93b2e1f92"
[[models.source.uncertainty]]
