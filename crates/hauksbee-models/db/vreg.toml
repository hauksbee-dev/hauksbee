basis = "Analog Devices MAX17760 datasheet 19-100795 Rev 2, Pin Description (p.12): pin 3 VCC is the '5V LDO Output. Bypass VCC with a 1uF ceramic capacitor to PGND. LDO doesn't support external loading on VCC'; Electrical Characteristics (p.5): LINEAR REGULATOR (VCC) output 4.75-5.25 V for 6 V <= VIN <= 76 V"

