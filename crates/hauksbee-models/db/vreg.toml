dropout_v = 0.5     # VDIF2 TYPICAL @ IOUT = 200 mA (no maximum is printed; VDIF1 is 280 mV typ @ 100 mA)
iq_a      = 40.0e-6   # ISS typ @ VIN = VOUT + 1 V, no load (no maximum is printed)
en_on_v   = 1.0     # VCEH "Start up" 1.0 V min, Microne ME6211 V14 Electrical Characteristics ME6211C12
en_off_v  = 0.5     # VCEL "Shut down" 0.5 V max, same table
i_shdn_a  = 1.0e-7  # ME6211 V14 Electrical Characteristics ME6211C12 "Stand-by Current" ICEL, VCE = 0 V, typ column 0.1 uA, p.6

