max_voltage_v = 6.0          # Absolute Maximum Ratings, supply input voltage (2.2 to 5.5 V recommended)
max_junction_temp_c = 150.0  # Absolute Maximum Ratings, junction temperature
theta_ja_c_per_w = 250.0     # Absolute Maximum Ratings, θJA SOT-23-5 (Note 2: JEDEC 51-3 board)
theta_jc_c_per_w = 25.0      # Absolute Maximum Ratings, θJC SOT-23-5

# ── TPS70918 (TI 150 mA, 30 V, 1 uA IQ LDO, fixed 1.8 V), DBV ───────────────
# Source: TI TPS709 SBVS186H (March 2012, revised July 2021). Device
# Nomenclature (Table 11-1): TPS709xx(x) yyy z[M3], xx = output voltage
# ("18" = 1.8 V), yyy = package, z = reel (R/T). Table 5-1 Pin Functions gives
# the plain TPS709 DBV map 1 IN, 2 GND, 3 EN, 4 NC, 5 OUT; the TPS709A and
# TPS709B DBV parts use different maps (OUT 1 / OUT 3), and DRV differs again,
# so the match takes only TPS70918 + DBV.
#
# Dropout is not specified at 1.8 V: Note 3 of 6.5 says VDO is only valid for
# VOUT >= 2.8 V because of the 2.7 V minimum input. The headroom a 1.8 V part
# actually needs is therefore that input floor, so `dropout_v` is DERIVED as
# VIN(min) - VOUT = 2.7 - 1.8 = 0.9 V, and the floor itself is the envelope.
[[models]]
id = "tps70918_dbv"
kind = "vreg"
description = "TI TPS70918 150mA 30V 1uA-IQ LDO, 1.8V fixed, DBV SOT-23-5 (EN)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/tps709.pdf"
title = "Texas Instruments TPS709 150-mA, 30-V, 1-uA IQ voltage regulators with enable, SBVS186H, March 2012, revised July 2021"
locator = "Table 5-1 Pin Functions p.3; 6.1 Absolute Maximum Ratings, 6.3 Recommended Operating Conditions, 6.4 Thermal Information p.4; 6.5 Electrical Characteristics p.5; Table 11-1 Device Nomenclature p.17"
sha256 = "8c14e3efae738a27b857b789aa87369de9037a8ef3616a9f71a423587cdc6949"
[[models.source.uncertainty]]
status = "interval"
parameter = "vout"
low = 1.764
high = 1.836
unit = "V"
kind = "specification-limits"
basis = "TI SBVS186H 6.5 Electrical Characteristics, DC output accuracy -2 % to +2 % for VOUT < 3.3 V, TA = -40 C to +85 C"

[models.match]
value_re = "(?i)^TPS70918DBV[RT]?(M3)?$"

[[models.envelope]]
kind = "supply_range"
pin = "in"
min_v = 2.7
max_v = 30.0
abs_max_v = 32.0
basis = "TI SBVS186H 6.3 Recommended Operating Conditions, VIN 2.7 V to 30 V; 6.1 Absolute Maximum Ratings, VIN -0.3 V to 32 V"

[models.params]
vout       = 1.8      # nomenclature code 18; DC output accuracy +-2 % (VOUT < 3.3 V)
dropout_v  = 0.9      # DERIVED: VIN(min) 2.7 V - 1.8 V; 6.5 Note 3, VDO undefined below VOUT = 2.8 V
# MINIMUM: TI SBVS186H 8.1.1 (p.14) "For output voltages equal or greater
# than 1.5 V, the minimum effective capacitance for stability is 1.5 µF".
# RECOMMENDATION: Table 5-1, OUT (p.3) "Connect a small 2.2-µF or greater
# ceramic capacitor from this pin to ground to assure stability".
cout_min_f = 1.5e-6
cout_recommended_f = 2.2e-6
iq_a       = 1.3e-6   # 6.5 IGND typ, IOUT = 0 mA, VOUT <= 3.3 V (2.05 uA max; shutdown 150 nA typ)
# EN pin (active high; the binder gates the output on it from these fields).
# TI SBVS186H, 6.5 Electrical Characteristics (p.5): VEN(HI) "Device enabled"
# 0.9 V min; VEN(LOW) "Device disabled" 0.4 V max. 7.4 Device Functional Modes
# (p.13): "EN is pulled high by a 300-nA current source; therefore, EN can be
# left floating to enable the device", so the pull is a 300 nA current source
# from the rail. No discharge resistance is printed (OUT is high impedance when
# disabled).
en_on_v        = 0.9
en_off_v       = 0.4
en_pull_up_a   = 3.0e-7
i_shdn_a  = 1.5e-7  # ISHUTDOWN "Shutdown current" typ 150 nA, VEN <= 0.4 V, VIN = 2.7 V, TI TPS709 SBVS186H 6.5 Electrical Characteristics p.5

[models.pins]
# Table 5-1 Pin Functions, DBV column for TPS709 (not TPS709A/B).
"1" = "in"
"2" = "gnd"
"3" = "en"
"4" = "nc"
"5" = "out"

[models.ratings]
max_current_a = 0.15         # 150 mA rated (title, load-regulation range); I(CL) 200 mA min
max_voltage_v = 32.0         # 6.1 Absolute Maximum Ratings, VIN
max_junction_temp_c = 150.0  # 6.1 Absolute Maximum Ratings, TJ (125 C operating)
theta_ja_c_per_w = 212.1     # 6.4 Thermal Information, RθJA DBV
theta_jc_c_per_w = 78.5      # 6.4 Thermal Information, RθJC(top) DBV

# ── MIC5205-3.3 ──────────────────────────────────────────────────────────────
# Microchip (Micrel) 150 mA low-noise LDO, SOT-23-5. 17 instances on the
# SparkFun RedBoard.
# Source: Microchip MIC5205 datasheet DS20005785B Rev. B, February 2022.
#
# THE BARE PART NUMBER IS THE ADJUSTABLE VERSION, which is why the voltage code
# is required in the match rule below. Per the datasheet's Product
# Identification System, "MIC5205" with no voltage suffix is the adjustable
# part (pin 4 becomes ADJ instead of BYP) and "MIC5205-3.3" is the fixed 3.3 V
# one. A board whose value string is just "MIC5205" does not say what its output
# is and is left unresolved on purpose.
[[models]]
id = "mic5205_3v3"
kind = "vreg"
description = "MIC5205-3.3 low-noise LDO, 150mA, 3.3V fixed, SOT-23-5"

[models.match]
value_re = "(?i)^MIC5205[- ]?3[._]3([A-Z0-9-]*)?$"

[models.params]
vout      = 3.3      # +-1% at TJ=25 C, +-2% over -40 to +125 C
dropout_v = 0.35     # max @ IL = 150 mA over temperature (275 mV max at 25 C)
iq_a      = 80.0e-6  # Ground Pin Current typ @ IL = 100 uA (125 uA max). The
                     # datasheet's ground current rises with load (600 uA typ at
                     # 50 mA, 1300 uA at 150 mA); the no-load figure is the one
                     # `iq_a` means. Shutdown IGND is 0.01 uA typ.
# EN pin (active high; the binder gates the output on it from these fields).
# Microchip MIC5205 DS20005785B (Feb. 2022), Table 1-1 Electrical Characteristics
# (continued), ENABLE Input (p.4), bold = -40..125 C: VIH "Regulator enabled"
# 2.0 V min; VIL "Regulator shutdown" 0.4 V max at 25 C and 0.18 V max over
# temperature, the lower used so the off level holds at every temperature. The
# pin description says "logic-low or open = shutdown" (an unvalued pull) and IIH
# (5 uA typ at 2 V) is an input current the sheet does not call a pull, so no
# pull is set; no discharge resistance is printed.
en_on_v   = 2.0
en_off_v  = 0.18
# Table 3-1 Pin Description (p.9): "EN  Enable/Shutdown (Input): CMOS compatible
# input. Logic-high = enable, logic-low or open = shutdown". The open state is
# stated, so en_open is set (still no pull value).
en_open   = "off"
en_open_basis = "Microchip MIC5205 DS20005785A Table 3-1 Pin Description p.9: \"Logic-high = enable, logic-low or open = shutdown\""
i_shdn_a  = 1.0e-8 # IGND "Quiescent Current" typ (1 uA max), VEN <= 0.4 V (shutdown), Microchip MIC5205 DS20005785B Electrical Characteristics p.3

[models.pins]
# Table 3-1, SOT-23-5, FIXED version. On the adjustable part pin 4 is ADJ.
"1" = "in"
"2" = "gnd"
"3" = "en"
"4" = "byp"    # noise-bypass capacitor to the internal reference
"5" = "out"

[models.ratings]
max_current_a = 0.15         # guaranteed output current
max_voltage_v = 20.0         # Absolute Maximum Ratings, input voltage VIN -20 V to +20 V
max_junction_temp_c = 125.0
theta_ja_c_per_w = 220.0     # SOT-23-5, minimum footprint (170 on square clad)
theta_jc_c_per_w = 130.0

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.characteristic]]
parameter = "θJA junction-to-ambient thermal resistance"
rating = "theta_ja_c_per_w"
typ = 220.0
unit = "°C/W"
conditions = "SOT-23-5 (M5), recommended minimum footprint"
mounting = "recommended minimum footprint"
basis = "Microchip MIC5205 DS20005785B (February 2022), Table 4-1 SOT-23-5 Thermal Resistance, θJA Rec. Min. Footprint (220 °C/W typ in Temperature Specifications, Note 2)"
[[models.source.characteristic]]
parameter = "θJA junction-to-ambient thermal resistance"
rating = "theta_ja_c_per_w"
typ = 170.0
unit = "°C/W"
conditions = "SOT-23-5 (M5), square copper clad"
mounting = "square copper clad"
basis = "Microchip MIC5205 DS20005785B (February 2022), Table 4-1 SOT-23-5 Thermal Resistance, θJA Square Copper Clad"

# The 2.5-16 V operating range is the check that fires below the 20 V abs max.
[[models.envelope]]
kind = "supply_range"
pin = "in"
min_v = 2.5
max_v = 16.0
abs_max_v = 20.0
basis = "Microchip MIC5205 DS20005785B, Operating Ratings, input voltage VIN 2.5 V to 16 V; Absolute Maximum Ratings, input voltage VIN -20 V to +20 V"

# ── MCP1700-3302E ────────────────────────────────────────────────────────────
# Microchip 250 mA, 1.6 uA-IQ CMOS LDO. The low-quiescent part a coin-cell
# design reaches for.
# Source: Microchip MCP1700 datasheet DS20001826F.
# The "3302" in the order code is the output-voltage code: 3.3 V. Per the
# datasheet's marking/ordering tables the family also ships 1.2, 1.5, 1.8, 2.5,
# 2.8, 2.9, 3.0, 4.0 and 5.0 V, so the code is required in the match rule.
#
# NOTE: this part HAS NO ENABLE PIN. It is a three-terminal always-on regulator,
# which is why the pin map below has no `en` role. A board that expects to gate
# this rail is gating it somewhere else.
[[models]]
id = "mcp1700_3v3"
kind = "vreg"
description = "MCP1700-3302 CMOS LDO, 250mA, 3.3V fixed, 1.6uA IQ, SOT-23"

[models.match]
value_re = "(?i)^MCP1700[T]?[- ]?3302[A-Z0-9/_-]*$"

[models.params]
vout      = 3.3      # VR +-0.4% typ at 25 C (+-2.0/3.0% max over temperature)
dropout_v = 0.35     # max @ rated 250 mA, VR >= 2.5 V, MCP1700 DS20001826F
# MINIMUM. Microchip MCP1700 DS20001826F p.13 Output Capacitor: "A minimum output
# capacitance of 1.0 µF is required for small signal stability".
cout_min_f = 1.0e-6
iq_a      = 1.6e-6   # Iq typ @ IL = 0, VIN = VR + 1 V (4 uA max)

[models.pins]
# Table 3-1, SOT-23 (3-pin).
"1" = "gnd"
"2" = "out"
"3" = "in"

[models.ratings]
max_current_a = 0.25         # 250 mA for VR >= 2.5 V (200 mA below that)
max_voltage_v = 6.5          # VDD abs max (2.3 to 6.0 V operating)
max_junction_temp_c = 150.0
