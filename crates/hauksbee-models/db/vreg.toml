# ═════════════════════════════════════════════════════════════════════════════
# SMALL BUCK CONVERTERS: averaged board-feedback models.
#
# An adjustable buck has no `vout`: the board's divider on FB sets the rail. These
# cards carry the datasheet FB reference in `[models.behavioral.converter.feedback]`
# and the binder solves the averaged switch node until FB sits at that reference,
# so the rail comes from the resistors actually fitted, exactly as for
# `ap64501sp_13` and `tps62933_drl`. The reference is NEVER written as an output
# voltage. A fixed-output part (LMR16006YQ3/YQ5, LM2677-3.3/-5.0) instead has an
# internal divider: its FB pin is wired straight to the output capacitor, so the
# regulated quantity at FB IS the output voltage and the feedback target is the
# datasheet's VOUT row, not a reference.
#
# Common to all of them, and listed under `missing`: switching ripple, loop
# compensation, soft start, light-load (PFM/ECO) modes, cycle-by-cycle peak
# limiting, UVLO and thermal shutdown. `iout_limit_a` is the rated continuous
# output current, the same convention as the cards above; the higher switch peak
# limits are recorded in comments only.
#
# Not modelled and kept as a record: SY8009AAAC (Olimex ESP32-EVB), 1.5 A (the
# 2 A rating is the SY8009B in SOT23-6), VIN 3-5.5 V, VREF 0.6 V, IQ 80 uA, ILIM
# 1.8 A min, theta_JA 170 C/W, Silergy SY8009A/B Rev1.0. No board in the corpus
# currently needs it, and its pin table was not re-read for this pass.

# ── TLV62568DBV: TI 1 A synchronous buck, SOT-23-5, adjustable ──────────────
# Source: TI SLVSD89B (November 2016, revised November 2017). Pin Functions
# (p.3, SOT23-5 column), 6.1 Absolute Maximum Ratings and 6.3 Recommended
# Operating Conditions (p.4), 6.4 Thermal Information (p.4), 6.5 Electrical
# Characteristics (p.5), 7.3.2 100% Duty Cycle Low Dropout Operation (p.7).
# Only the DBV (SOT-23-5) order code binds: the DDC/DRL packages put PG/NC on
# extra pads and the DRL moves every pin (EN on 5, FB on 1).
[[models]]
id = "tlv62568_dbv"
kind = "vreg"
description = "TI TLV62568 1A 5.5V synchronous buck, SOT-23-5 (DBV), adjustable (averaged board-feedback model)"

[models.source]
tier = "curated-library"
validation = "datasheet-curves"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/tlv62568.pdf"
title = "TI TLV62568, TLV62568P 1-A High Efficiency Synchronous Buck Converter in SOT Package, SLVSD89B, November 2016, revised November 2017"
locator = "Pin Functions p.3; 6.1 Absolute Maximum Ratings, 6.3 Recommended Operating Conditions and 6.4 Thermal Information p.4; 6.5 Electrical Characteristics p.5; 7.3.2 p.7"
sha256 = "fa2ae3f5343f767f19f93532be18987ace26afc14b1c5b8f5258413a9f8dd0d9"
[[models.source.uncertainty]]
status = "interval"
parameter = "feedback_reference"
low = 0.588
high = 0.612
unit = "V"
kind = "specification-limits"
basis = "TLV62568 SLVSD89B 6.5, VFB feedback regulation voltage 0.588 min / 0.6 typ / 0.612 max"

[models.match]
value_re = "(?i)^TLV62568DBV[RT]?$"

[models.params]
warning = "source-bound averaged DC model: board feedback and EN are executable; switching ripple, loop stability, soft-start, power-save mode and protection transients are not modeled"
iq_a = 35e-6           # 6.5 IQ, not switching, typ

[models.pins]
# Pin Functions, SOT23-5 column.
"1" = "en"
"2" = "gnd"
"3" = "sw"
"4" = "in"
"5" = "fb"

[models.ratings]
max_current_a = 1.0          # 6.3 IOUT max
