# ═════════════════════════════════════════════════════════════════════════════
# SMALL BUCK CONVERTERS: averaged board-feedback models.
#
# An adjustable buck has no `vout`: the board's divider on FB sets the rail. These
# cards carry the datasheet FB reference in `[models.behavioral.converter.feedback]`
# and the binder solves the averaged switch node until FB sits at that reference,
# so the rail comes from the resistors actually fitted, exactly as for
# `ap64501sp_13` and `tps62933_drl`. The reference is NEVER written as an output
# voltage. A fixed-output part (LMR16006YQ3/YQ5, LM2677-3.3/-5.0) instead has an
# internal divider: its FB pin is wired straight to the output capacitor, so the
# regulated quantity at FB IS the output voltage and the feedback target is the
# datasheet's VOUT row, not a reference.
#
# Common to all of them, and listed under `missing`: switching ripple, loop
# compensation, soft start, light-load (PFM/ECO) modes, cycle-by-cycle peak
# limiting, UVLO and thermal shutdown. `iout_limit_a` is the rated continuous
# output current, the same convention as the cards above; the higher switch peak
# limits are recorded in comments only.
#
# Not modelled and kept as a record: SY8009AAAC (Olimex ESP32-EVB), 1.5 A (the
# 2 A rating is the SY8009B in SOT23-6), VIN 3-5.5 V, VREF 0.6 V, IQ 80 uA, ILIM
# 1.8 A min, theta_JA 170 C/W, Silergy SY8009A/B Rev1.0. No board in the corpus
# currently needs it, and its pin table was not re-read for this pass.

