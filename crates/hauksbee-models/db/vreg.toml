# ─────────────────────────────────────────────────────────────────────────────
# LT1461A-3.3: Analog Devices (ex-Linear) micropower precision SERIES voltage
# reference, 3.3 V, SO-8.
#
# Source: Linear Technology "LT1461 Micropower Precision Low Dropout Series
#   Voltage Reference", document 1461f (copyright 1999, print code 08/00): the
#   PACKAGE/ORDER INFORMATION pinout, ELECTRICAL CHARACTERISTICS and ABSOLUTE
#   MAXIMUM RATINGS.
#
# CAVEAT ON THE SOURCE, recorded because it is the weakest link in this entry:
# 1461f is the original Linear document, read from a distributor mirror because
# analog.com refused the fetch. ADI has since reissued the sheet under its own
# numbering and this entry has NOT been diffed against that reissue. The pin map
# below is independently corroborated (see the pin note), but the numbers are
# only as current as a 2000-vintage document. The SHDN fields were later read from
# the Analog Devices Rev. C reissue (analog.com lt1461.pdf, 18 pp.); the same pass
# found the dropout, IQ and short-circuit rows above unchanged in that reissue.
#
# `kind = "vreg"` for the reason the MAX6070 entry in db/power_ics.toml sets out:
# a series reference is a regulator whose distinguishing feature is accuracy, and
# accuracy is the thing this schema has no field for. The simulation gets a
# perfect 3.300 V where the real A-grade part gives +/-0.04%.
#
# Datasheet figures used:
#   VOUT      = 3.300 V; initial accuracy +/-0.04% max on the A grade
#               (the I/C suffix selects temperature range, not accuracy)
#   VIN       = VOUT + 0.3 V minimum to 20 V maximum
#   IQ        = 35 uA typ, 50 uA max at 25 C (70 uA max over the full range)
#   Dropout   = 0.06 V typ at IOUT = 0 mA; 0.13 typ / 0.3 max at 1 mA;
#               0.20 typ / 0.4 max at 10 mA; 1.5 typ / 2.0 max at 50 mA
#   IOUT      = 50 mA guaranteed minimum
#   ISC       = 100 mA, in the TYP column with no min or max stated
#
# `dropout_v` = 0.40 V, the guaranteed maximum at 10 mA. The part is rated to
# 50 mA and the sheet's 50 mA row is 1.5 V, so this card must not be used as a
# guaranteed 50 mA headroom check. The 0 mA figure of 60 mV would flatter it.
#
# SHDN GATING: this pin is active LOW (shutdown), so it is named `shdn` and NOT
# `en`; the output is on while the pin is high, so `en_on_level` is left at its
# on-high default. The binder gates the output on it from the thresholds below,
# read from the Analog Devices LT1461 Rev. C datasheet (the ADI reissue of 1461f):
#   VIH "Logic High Input Voltage" 2.4 V min, VIL "Logic Low Input Voltage"
#   0.5 V typ / 0.8 V max, both the over-temperature rows of the Shutdown Pin
#   block of the ELECTRICAL CHARACTERISTICS table (p.4); the 0.8 V maximum is the
#   off level carried;
#   open pin: Applications Information, Shutdown (p.11) says the part "operates
#   normally with Pin 3 open", so `en_open = "on"`;
#   shutdown current: "Shutdown Current", RL = 1k, 25 uA typ / 35 uA max at 25 C
#   (55 uA max over temperature), p.4. This is a supply current drawn while shut
#   down, not a leakage: the datasheet states "a maximum supply current of 35 uA"
#   in shutdown (p.11).
# The input currents (2 uA typ / 15 uA max at 2.4 V; 4 uA max at 0.8 V, p.4) are
# input bias, not a pull, so no en_pull_* is set; no discharge resistance is printed.
#
# DELIBERATELY NOT MODELLED: the initial accuracy and drift, and the four DNC
# pads (which the datasheet says must be left unconnected, not grounded).
[[models]]
id = "lt1461a_3v3"
kind = "vreg"
description = "LT1461A-3.3 precision 3.3V series voltage reference, +/-0.04%, SO-8"

[models.match]
# Ordering codes are LT1461AIS8-3.3 / LT1461ACS8-3.3 (A grade, industrial and
# commercial temperature). The grade letter selects initial accuracy (A 0.04%,
# B 0.06%, C 0.08%, D 0.15%) and this entry carries no accuracy field, so the
# letter class below is wider than it needs to be rather than load-bearing. The MWGEN-G1
# writes "LT1461AxS8-3.3" with a LITERAL lowercase x standing in for the
# temperature-range letter, which is a convention a schematic author uses and no
# distributor does, so the regex accepts it alongside the real letters. The
# trailing voltage code is required: LT1461 also ships 2.5 V, 3.0 V, 4.096 V and
# 5 V options, and an entry that matched them all would hold a 5 V reference net
# at 3.3 V.
# The grade letter runs A through D (A 0.04%, B 0.06%, C 0.08%, D 0.15% initial
# accuracy) and the temperature letter includes H alongside I and C, because the D
# grade's only 3.3 V orderable is LT1461DHS8-3.3. An earlier version of this rule
# spelled [ABD][ICX], which excluded grade C entirely (LT1461CIS8-3.3 and
# LT1461CCS8-3.3 both exist) while admitting a D that could never appear.
value_re = "(?i)^LT1461[A-D][ICHX]?S8[-_ ]?3[._]3$"

[models.params]
vout      = 3.3       # 3.300 V; +/-0.04% max initial on the A grade
dropout_v = 0.4       # max at IOUT = 10 mA. See the note above.
