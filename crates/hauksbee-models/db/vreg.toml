# ─────────────────────────────────────────────────────────────────────────────
# LM317: the three-terminal ADJUSTABLE regulator. It has no ground pin and no
# output setpoint of its own; it holds VO - VADJ at VREF and sources IADJ out of
# ADJ, so the BOARD's divider sets the rail, which `bind_vreg` stamps as VREF
# between OUT and ADJ plus a CCCS carrying the pass current onto IN. The solver
# then produces VO = VREF*(1 + R2/R1) + IADJ*R2 from the R1/R2 actually fitted.
# That law is chosen because this card maps no `gnd` pin: an adjustable card
# that does is GROUND-referenced (the common LDO holding VFB - VGND at VREF, so
# VO = VREF*(1 + R1/R2) with R1 on OUT-FB) and needs `iq_a` instead of `iadj_a`.
# Primary source: TI LM317 datasheet SLVS044Y (3-Terminal Adjustable Regulator).
# DELIBERATELY NOT MODELLED: the reference is ideal, so the output impedance is
# exactly zero and load regulation reads 0%; line regulation, ripple rejection,
# noise, the current limit, thermal shutdown and startup are absent. The minimum
# load current to maintain regulation is not modelled as a BEHAVIOUR either: the
# stamp holds VREF down to IO = 0 where the real part does not. It is enforced as
# a DISCLOSURE instead, through `ratings.min_current_a`: any run whose solved
# OUTPUT current (load plus the divider's own 1.25 V / R1) stays under the floor
# says so next to the result rather than answering a regulated rail unqualified.
# `vout_setpoint_low`/`_high` are
# deliberately absent: the envelope check keys them by output net and would
# score a rail this card does not set.
[[models]]
id = "lm317_adj"
kind = "vreg"
description = "TI LM317 3-terminal adjustable positive regulator, 1.5A (ADJ-referenced; rail set by the board divider)"

[models.source]
tier = "curated-library"
validation = "datasheet-curves"

[[models.source.uncertainty]]
