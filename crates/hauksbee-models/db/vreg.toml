# Voltage regulator models (LDO and switching).

# Texas Instruments TLV1117-18 fixed 1.8 V LDO, as fitted at U4 on the pinned
# MNT Pocket Reform motherboard source. The ideal-source vreg path models the
# nominal DC rail only; it does not invent foldback, thermal shutdown, line/load
# regulation, or transient behavior.
# Primary source: TI TLV1117 datasheet SLVS561O Rev. O (June 2025),
# https://www.ti.com/lit/ds/symlink/tlv1117.pdf
[[models]]
id = "tlv1117_18"
kind = "vreg"
description = "TI TLV1117-18 1.8V fixed LDO, 800mA (nominal DC model; protection/transients not modeled)"

[models.source]
tier = "curated-library"
validation = "datasheet-curves"
[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient thermal resistance, legacy chip"
rating = "theta_ja_c_per_w"
max = 104.3
unit = "°C/W"
conditions = "JEDEC thermal metrics, DCY (SOT-223) 4 pins"
package = "SOT-223"
basis = "TI TLV1117 SLVS561O (June 2025), 5.4 Thermal Information (Legacy Chip), RθJA, DCY"
[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient thermal resistance, new chip fixed output"
rating = "theta_ja_c_per_w"
max = 95.4
unit = "°C/W"
conditions = "JEDEC thermal metrics, DCY (SOT-223) 4 pins"
package = "SOT-223"
basis = "TI TLV1117 SLVS561O (June 2025), 5.5 Thermal Information (New Chip), Fixed Output RθJA, DCY"
[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient thermal resistance, legacy chip"
rating = "theta_ja_c_per_w"
max = 50.9
unit = "°C/W"
conditions = "JEDEC thermal metrics, KVU (TO-252) 3 pins"
package = "TO-252"
basis = "TI TLV1117 SLVS561O (June 2025), 5.4 Thermal Information (Legacy Chip), RθJA, KVU"
[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient thermal resistance, new chip fixed output"
rating = "theta_ja_c_per_w"
max = 67.2
unit = "°C/W"
conditions = "JEDEC thermal metrics, KVU (TO-252) 4 pins"
package = "TO-252"
basis = "TI TLV1117 SLVS561O (June 2025), 5.5 Thermal Information (New Chip), Fixed Output RθJA, KVU"
[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient thermal resistance, legacy chip"
rating = "theta_ja_c_per_w"
max = 30.1
unit = "°C/W"
conditions = "JEDEC thermal metrics, KCS/KCT (TO-220) 3 pins"
package = "TO-220"
basis = "TI TLV1117 SLVS561O (June 2025), 5.4 Thermal Information (Legacy Chip), RθJA, KCS, KCT"
[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient thermal resistance, legacy chip"
rating = "theta_ja_c_per_w"
max = 27.5
unit = "°C/W"
conditions = "JEDEC thermal metrics, KTT (TO-263) 3 pins"
package = "TO-263"
basis = "TI TLV1117 SLVS561O (June 2025), 5.4 Thermal Information (Legacy Chip), RθJA, KTT"

[models.match]
value_re = "(?i)^TLV1117-18(?:[A-Z0-9+._/-]*)?$"
mpn_re = "(?i)^TLV1117-18(?:[A-Z0-9+._/-]*)?$"

[models.params]
vout = 1.8       # fixed output option, datasheet Recommended Operating Conditions
# The order code cannot identify the shipped die (datasheet §8.1.1 says either
# legacy or new silicon may ship), so use the worst guaranteed 800 mA maximum:
# 1.4 V for legacy I grade over TJ = -40..125 °C (§5.6, pp. 7-9).
dropout_v = 1.4
# The order code also cannot safely select the new-chip-only 2..500 mΩ ESR
# range. Leave COUT/ESR unstated so the binder reports reduced fidelity rather
# than claiming the unidentified legacy/new control loop has been checked.
# Typical legacy fixed-output IQ is 5 mA for the C grade (§5.6); using the
# new-chip-only 65 µA would understate the input current when legacy silicon ships.
iq_a = 5.0e-3
warning = "[partial model] TLV1117-18 nominal 1.8 V DC rail and sourced ratings are modeled; foldback current limit, thermal shutdown, dropout-vs-load, line/load regulation, and transients are not modeled"

[models.pins]
"1" = "gnd"
"2" = "out"
"3" = "in"
"4" = "out"     # exposed/tab output on the SOT-223 symbol

[models.ratings]
max_current_a = 0.8
max_voltage_v = 16.0   # SLVS561O 5.1 Absolute Maximum Ratings, continuous input voltage VIN -0.3 to 16 V
max_junction_temp_c = 125.0
# The value rule binds every package, and either die may ship (§8.1.1), so
# this is the least favourable RθJA row below: the legacy SOT-223 (DCY). The
# DRJ (WSON) and KTE/KTP (PowerFlex) columns (38.3 / 38.6 / 49.2 °C/W) are
# not rows here: no package body spells them, so a row could never be fitted.
theta_ja_c_per_w = 104.3

# The 3.2-15 V recommended VIN range is the check that fires below the 16.0 V abs max.
[[models.envelope]]
kind = "supply_range"
pin = "in"
min_v = 3.2
max_v = 15.0
abs_max_v = 16.0
basis = "TI TLV1117 SLVS561O, 5.3 Recommended Operating Conditions, VIN 3.2 V to 15 V for TLV1117-18; 5.1 Absolute Maximum Ratings, continuous input voltage VIN -0.3 V to 16 V"

# ─────────────────────────────────────────────────────────────────────────────
# AMS1117-3.3: the LDO on more hobby boards than any other part, usually as the
# 5 V-to-3.3 V step on a SOT-223 pad.
#
# Source: Advanced Monolithic Systems, Inc. "AMS1117 1A Low Dropout Voltage
#   Regulator" datasheet (advanced-monolithic.com/pdf/ds1117.pdf). The copy read
#   carries NO revision code and NO date on any of its eight pages. An earlier
#   version of this entry cited "Rev. H, Table 1"; neither the revision nor a
#   numbered table exists in the document, so that citation is gone rather than
#   repeated. Everything below is from the sheet's two-page ELECTRICAL
#   CHARACTERISTICS block, headed "at IOUT = 0 mA, and TJ = +25 C unless
#   otherwise specified".
#
# Datasheet figures used:
#   VOUT       = 3.251 / 3.300 / 3.349 V (min/typ/max)  @ VIN = 4.8 V
#                (over the full operating temperature range: 3.201 / 3.399)
#   Dropout    = 1.1 V typ, 1.3 V max  @ IOUT = 0.8 A, dVOUT/dVREF = 1%
#                (Note 4: dropout is specified only up to 0.8 A; above that it
#                 is higher, and the sheet does not say by how much)
#   IQ         = 5 mA typ, 11 mA max   @ (VIN - VOUT) = 1.5 V
#   Current lim= 900 mA min, 1100 mA typ, 1500 mA max  @ (VIN - VOUT) = 1.5 V
#   Line reg   = 0.5 mV typ, 10 mV max  @ 1.5 V <= (VIN - VOUT) <= 12 V
#   Load reg   = 3 mV typ, 15 mV max    @ VIN = 4.75 V, 0 <= IOUT <= 0.8 A
#   Ripple rej = 60 dB min, 72 dB typ   @ f = 120 Hz, COUT = 22 uF tantalum,
#                                          IOUT = 1 A, VIN = 4.75 V
#   RMS noise  = 0.003% of VOUT typ     @ TA = 25 C, 10 Hz <= f <= 10 kHz
# Absolute Maximum Ratings: input voltage 15 V; operating junction temperature
#   -40 to +125 C (both control section and power transistor); power dissipation
#   "Internally limited".
# Thermal Resistance: theta_JA = 90 C/W for SOT-223 (80 for TO-252, 160 for
#   SO-8), theta_JC = 15 C/W max for all packages. The sheet notes theta_JA for
#   SOT-223 varies from 46 C/W to over 90 C/W with the copper area the tab is
#   soldered to, so 90 is the pessimistic end and the right one for a check.
#   Note 2 additionally caps package dissipation at 1.2 W for SOT-223, 2.2 W for
#   TO-252 and 780 mW for 8-lead SOIC.
#
# The match rule cannot tell the packages apart from the value string, so the
# theta_JA rows below are tagged by package: a SOT-223, TO-252 or SO-8
# footprint is judged on its own row, and an unrecognised one on the least
# favourable (SO-8, 160 C/W), which is what the scalar carries.
#
# DELIBERATELY NOT MODELLED: `bind_vreg` stamps an ideal DC source on the output
# net, so line and load regulation, ripple rejection, output noise and the
# current limit are all exactly absent in simulation rather than wrong. The
# 1100 mA current limit in particular is NOT modelled; `max_current_a` below
# carries the 1 A continuous rating the stress monitor should judge against.
# `max_power_w` is deliberately absent: the datasheet's own Absolute Maximum
# Ratings say power dissipation is internally limited, and the thermal monitor
# derives the junction temperature from TJ(max) and theta_JA directly. An
# earlier version of this entry carried `max_power_w = 1.0` with the comment
# "SOT-223 on typical pad, thermally limited", which is not a figure this
# datasheet states anywhere.
[[models]]
id = "ams1117_3v3"
kind = "vreg"
description = "AMS1117-3.3 / LM1117-3.3 LDO, 1A, 3.3V fixed, SOT-223"

[models.source]
tier = "curated-library"
validation = "datasheet-curves"

[[models.source.uncertainty]]
status = "interval"
parameter = "vout"
low = 3.201
high = 3.399
unit = "V"
kind = "specification-limits"
basis = "AMS1117 datasheet output-voltage limits"
[[models.source.characteristic]]
parameter = "ϕJA thermal resistance, junction to ambient"
rating = "theta_ja_c_per_w"
max = 90.0
unit = "°C/W"
conditions = "SOT-223 package; footnote: with the tab soldered to backside or internal-plane copper ϕJA can vary from 46 to >90 °C/W"
package = "SOT-223"
basis = "Advanced Monolithic Systems AMS1117 datasheet (ds1117.pdf, no revision or date printed), Absolute Maximum Ratings, Thermal Resistance, SOT-223 package ϕJA = 90 °C/W*"
[[models.source.characteristic]]
parameter = "ϕJA thermal resistance, junction to ambient"
rating = "theta_ja_c_per_w"
max = 80.0
unit = "°C/W"
conditions = "TO-252 package"
package = "TO-252"
basis = "Advanced Monolithic Systems AMS1117 datasheet (ds1117.pdf, no revision or date printed), Absolute Maximum Ratings, Thermal Resistance, TO-252 package ϕJA = 80 °C/W"
[[models.source.characteristic]]
parameter = "ϕJA thermal resistance, junction to ambient"
rating = "theta_ja_c_per_w"
max = 160.0
unit = "°C/W"
conditions = "SO-8 package"
package = "SOIC-8"
basis = "Advanced Monolithic Systems AMS1117 datasheet (ds1117.pdf, no revision or date printed), Absolute Maximum Ratings, Thermal Resistance, SO-8 package ϕJA = 160 °C/W"

[models.match]
value_re = "(?i)^(AMS|LM)1117.?3[._]?3"

[models.params]
# Source: Advanced Monolithic Systems AMS1117 datasheet (see above).
vout      = 3.3     # 3.251 / 3.300 / 3.349 V @ VIN = 4.8 V, IOUT = 0 mA, TJ = 25 C
dropout_v = 1.3     # VIN - VOUT max @ IOUT = 0.8 A
# Source: AMS1117 datasheet, Applications Hints/Stability: COUT >= 22 uF tantalum;
# no guaranteed ESR interval is tabulated, so ESR bounds remain undeclared.
cout_min_f = 22.0e-6
iq_a      = 5.0e-3  # IQ typ @ (VIN - VOUT) = 1.5 V (11 mA max)

[models.pins]
# Datasheet PIN CONNECTIONS, "3 PIN FIXED/ADJUSTABLE VERSION".
"1" = "gnd"   # Ground/Adjust
"2" = "out"   # VOUT
"3" = "in"    # VIN

[models.ratings]
max_current_a = 1.0          # 1 A continuous output, datasheet FEATURES
max_voltage_v = 15.0         # input voltage, Absolute Maximum Ratings
max_junction_temp_c = 125.0  # TJ abs max, control section and power transistor
theta_ja_c_per_w = 160.0     # SO-8, the least favourable package row below: the value
                             # rule binds every package, and a SOT-223 footprint is
                             # judged on its own 90 C/W row (46 to >90 with copper)
theta_jc_c_per_w = 15.0      # all packages, max

