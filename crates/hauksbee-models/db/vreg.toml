unit = "V"
kind = "specification-limits"
basis = "ME6211C12 Electrical Characteristics, VOUT(E) = x0.98 to x1.02 of VOUT(T), IOUT = 30 mA, VIN = VOUT + 1 V, Ta = 25 C"

[models.match]
# Order code ME6211C12M5G-N (M5 = SOT23-5, G = green, -N as sold). The bare
# "ME6211C12" is accepted only on a five-lead footprint (see the pinout note).
value_re = "(?i)^ME6211C12(M5G?)?(-N)?$"
footprint_re = "(?i)(SOT[-_ ]?23[-_ ]?5|SOT[-_ ]?353|SC[-_ ]?70[-_ ]?5)([^0-9]|$)"

[models.params]
