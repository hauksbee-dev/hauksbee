# ── MIC5205-3.3 ──────────────────────────────────────────────────────────────
# Microchip (Micrel) 150 mA low-noise LDO, SOT-23-5. 17 instances on the
# SparkFun RedBoard.
# Source: Microchip MIC5205 datasheet DS20005785B Rev. B, February 2022.
#
# THE BARE PART NUMBER IS THE ADJUSTABLE VERSION, which is why the voltage code
# is required in the match rule below. Per the datasheet's Product
# Identification System, "MIC5205" with no voltage suffix is the adjustable
# part (pin 4 becomes ADJ instead of BYP) and "MIC5205-3.3" is the fixed 3.3 V
# one. A board whose value string is just "MIC5205" does not say what its output
# is and is left unresolved on purpose.
