# ── Fixed LDOs added 2026-10-01 (ME6211C, NCP1117LP, NCP1117, XC6206) ────────
# Every card below is a FIXED-output order code with its voltage code required in
# the match rule. No adjustable member of any family is carded here, and no
# adjustable reference voltage (NCP1117 Vref 1.25 V) is recorded as an output.

# ── ME6211C: Microne (Nanjing Micro One) 300-500 mA CMOS LDO, SOT-23-5 ────────
# Source: Microne "ME6211 High Speed LDO Regulators, High PSRR, Low noise",
#   document footer V14 (www.microne.com.cn), copy read from
#   stm32-base.org/assets/pdf/regulators/ME6211.pdf. Pin Assignment p.4
#   (ME6211CXXG / ME6211HXXG table), Absolute Maximum Ratings p.5, Electrical
#   Characteristics p.6-9 (one table per voltage, Ta = 25 C, VIN = VOUT + 1 V,
#   CIN = CL = 1 uF).
#
# PINOUT, SOT23-5/SOT353 column: 1 = VIN, 2 = VSS, 3 = CE, 4 = NC, 5 = VOUT.
# This is NOT the XC6206 order and it is not the DFN2x2-6L order either (there
# VIN is pad 3, VSS 2, CE 1, VOUT 4, NC 5/6), so the match rule is gated to the
# five-lead footprints. A bare "ME6211C33" with a DFN or three-lead footprint
# resolves to nothing, which is the honest outcome. The ME6211A (no CE pin,
# SOT23-3/SOT89-3) and ME6211H (CE active LOW, only an H15 table is printed)
# are different parts on different pinouts and are not matched.
#
# FIGURES THE DATASHEET PRINTS ONLY AS TYPICALS. The dropout, supply-current and
# maximum-output-current rows sit in the Typ column with no Min/Max, so this
# card's `dropout_v`, `iq_a` and `max_current_a` are typicals, not guaranteed
# limits. Dropout is tabulated at 100 mA (VDIF1) and 200 mA (VDIF2) only; the
# card carries VDIF2 and states the 200 mA condition. Output voltage is
# x0.98 .. x1.02 of nominal at IOUT = 30 mA. Absolute maximum VIN is 6.5 V
# (2.0 V to 6.0 V operating); Pd is 300 mW for SOT23 and 250 mW for SOT353.
# CE: VCEH 1.0 V min starts the part, VCEL 0.5 V max (0.7 V for the C50) shuts
# it down (Electrical Characteristics, per-voltage tables p.6-9, Microne V14).
# The binder gates the output on this pin from `en_on_v` / `en_off_v`. The
# datasheet states no internal CE pull resistor/current and no output discharge
# value, so none is modelled.
# DELIBERATELY NOT MODELLED: foldback current limit (ISHORT 110-150 mA typ),
# load and line regulation, PSRR, output noise, standby current, thermal limits.

