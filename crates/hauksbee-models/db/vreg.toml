max_voltage_v=7.0 # DS6765 Rev 7 Table 2 Absolute maximum ratings, VIN -0.3 to 7 V
max_junction_temp_c=150.0
theta_ja_c_per_w=255.0
theta_jc_c_per_w=81.0

