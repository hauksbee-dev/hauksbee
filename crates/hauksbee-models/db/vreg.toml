locator = "Pin Functions p.3; 6.1 Absolute Maximum Ratings, 6.3 Recommended Operating Conditions and 6.4 Thermal Information p.4; 6.5 Electrical Characteristics p.5; 7.3.2 p.7"
sha256 = "fa2ae3f5343f767f19f93532be18987ace26afc14b1c5b8f5258413a9f8dd0d9"
