# ── XC6206 other voltages (1.8 / 2.5 / 2.8 / 3.0 / 5.0 V), SOT-23 ────────────
# Source: Torex "XC6206 Series" datasheet ETR0305_003a, the copy Farnell hosts
#   (farnell.com/datasheets/578820.pdf); the manufacturer's own PDF returns 403
#   to scripted fetches. Pin Assignment p.2, Absolute Maximum Ratings p.3,
#   Electrical Characteristics and Electrical Characteristics Chart p.4-5. The
#   3.3 V row of that chart (Vdif1 75/350 mV, Vdif2 250/680 mV, IOUTMAX 200 mA,
#   2% window 3.234-3.366 V) agrees with the ETR03005-009 figures the xc6206_3v3
#   card above uses, so the two revisions are read as consistent.
#
# Every card here is the SOT-23 (MR) map: 1 = VSS, 2 = VOUT, 3 = VIN. SOT-89
# (1 VSS, 2 VIN, 3 VOUT) and USP-6B differ and are not matched (see the 3.3 V
# card's package hazard note). Order code XC6206P + two voltage digits + accuracy
# digit (2 = +/-2%; 1 = +/-1% is tabulated from 2.0 V up) + MR (-G).
#
# `dropout_v` is the Vdif2 MAXIMUM @ IOUT = 100 mA for VOUT(T) > 1.8 V. The 1.8 V
# row is the boundary of the datasheet's own condition split (100 mA above 1.8 V,
# 60 mA below), so the 1.8 V card carries Vdif1 max @ 30 mA (390 mV) instead.
# `max_current_a` is the chart's IOUTMAX minimum for the voltage band. The
# foldback ISHORT (130 mA typ at 1.8 V, 100 mA typ at 2.5 V and up) sits below
# the part's own rating and is not modelled. VIN is 1.8 V min to 6.0 V max.

