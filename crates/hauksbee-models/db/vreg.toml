[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.maxlinear.com/ds/spx3819.pdf"
title = "MaxLinear SPX3819 500mA low-noise LDO voltage regulator, Rev. 2.0.5, December 2019"
locator = "Absolute Maximum Ratings and Operating Ratings p.2; Electrical Specifications p.2-3; Pin Description p.3 (SOT-23 column); Ordering Information p.4"
sha256 = "43b63129331150a20339623920ea9f7be758d93e700a3459beb190d483ad35a2"
[[models.source.uncertainty]]
status = "interval"
parameter = "vout"
low = 3.234
high = 3.366
unit = "V"
kind = "specification-limits"
basis = "SPX3819 Electrical Specifications, output voltage tolerance +/-2% over the operating junction range (+/-1% at 25 C)"

[models.match]
# SPX3819M5-L-3-3 is the SOT-23-5 order code; the NSOIC-8 and DFN-8 parts
# number their pins differently, so a bare "SPX3819-3.3" is gated by footprint.
value_re = "(?i)^SPX3819(M5)?(-L)?[- ]?3[._-]3(/TR)?$"
footprint_re = "(?i)SOT[-_ ]?23[-_ ]?5([^0-9]|$)"

[models.params]
vout = 3.3
dropout_v = 0.7      # max at IL = 500 mA over the junction range (550 mV at 25 C)
iq_a = 90.0e-6       # IGND typ at IL = 100 uA (190 uA max over temperature)
# EN pin (active high; the binder gates the output on it from these fields).
# MaxLinear SPX3819 Rev. 2.0.5 (Dec 2019), Electrical Specifications p.3: "Input
# Voltage Level Logic High (VIH)" 2 V min (ON), "Logic Low (VIL)" 0.4 V max (OFF).
# The ENABLE Input Current rows are bias, and the pin table's "logic low or open
# = shutdown" (p.3) states a pull with no value, so no pull is set; no discharge
# resistance is printed.
en_on_v = 2.0
en_off_v = 0.4
# Pin Description p.3 (SOT-23 column): "Enable(input). CMOS compatible control
# input. Logic high - enable; logic low or open = shutdown". The datasheet states
# the open-pin state but no pull value, so en_open is set and no pull is.
en_open = "off"
en_open_basis = "MaxLinear SPX3819 Rev. 2.0.5 Pin Description p.3: \"Logic high – enable; logic low or open = shutdown\""
i_shdn_a  = 5.0e-8 # IGND "Quiescent Current" typ 0.05 uA (3 uA max), VENABLE <= 0.4 V, TJ = 25 C, MaxLinear SPX3819 Rev. 2.0.5 Electrical Specifications p.2

[models.pins]
"1" = "in"
"2" = "gnd"
"3" = "en"          # active high; the output is gated on it, see en_* above
"4" = "byp"          # fixed versions; ADJ on the adjustable part
"5" = "out"

[models.ratings]
max_current_a = 0.5
max_voltage_v = 20.0         # VIN, EN abs max (2.5 V to 16 V operating)
max_junction_temp_c = 150.0
theta_ja_c_per_w = 191.0     # SOT23-5

