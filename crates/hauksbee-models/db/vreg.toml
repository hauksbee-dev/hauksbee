description = "Microne ME6211C50 500 mA CMOS LDO, 5.0 V fixed, SOT-23-5 / SOT-353, active-high CE"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://stm32-base.org/assets/pdf/regulators/ME6211.pdf"
title = "Microne ME6211 High Speed LDO Regulators, High PSRR, Low noise, V14 (mirror of the www.microne.com.cn datasheet)"
locator = "Pin Assignment p.4 (ME6211CXXG/ME6211HXXG, SOT23-5/SOT353 column); Absolute Maximum Ratings p.5; Electrical Characteristics ME6211C50 p.6-9"
sha256 = "7e33d6651f019782b16169a5b26b7cad43e9d462b5e25dc54815b458f88fd59b"
[[models.source.uncertainty]]
status = "interval"
parameter = "vout"
low = 4.9
high = 5.1
unit = "V"
kind = "specification-limits"
basis = "ME6211C50 Electrical Characteristics, VOUT(E) = x0.98 to x1.02 of VOUT(T), IOUT = 30 mA, VIN = VOUT + 1 V, Ta = 25 C"

[models.match]
# Order code ME6211C50M5G-N (M5 = SOT23-5, G = green, -N as sold). The bare
# "ME6211C50" is accepted only on a five-lead footprint (see the pinout note).
value_re = "(?i)^ME6211C50(M5G?)?(-N)?$"
footprint_re = "(?i)(SOT[-_ ]?23[-_ ]?5|SOT[-_ ]?353|SC[-_ ]?70[-_ ]?5)([^0-9]|$)"

[models.params]
vout      = 5.0      # VOUT(T); effective output is x0.98 .. x1.02 @ IOUT = 30 mA
dropout_v = 0.2     # VDIF2 TYPICAL @ IOUT = 200 mA (no maximum is printed; VDIF1 is 100 mV typ @ 100 mA)
iq_a      = 40.0e-6   # ISS typ @ VIN = VOUT + 1 V, no load (no maximum is printed)
en_on_v   = 1.0     # VCEH "Start up" 1.0 V min, Microne ME6211 V14 Electrical Characteristics ME6211C50
en_off_v  = 0.7     # VCEL "Shut down" 0.7 V max, same table
i_shdn_a  = 1.0e-7  # ME6211 V14 Electrical Characteristics ME6211C50 "Stand-by Current" ICEL, VCE = 0 V, typ column prints 0 uA; Features p.1 "Standby Current 0.1 uA (TYP.)" for the series is used, as 0 would understate drain, p.9

[models.pins]
# SOT23-5 / SOT353, Pin Assignment table, ME6211CXXG column.
"1" = "in"     # VIN
"2" = "gnd"    # VSS
"3" = "en"     # CE, active high; the output is gated on it, see en_* above
"4" = "nc"
"5" = "out"    # VOUT

[models.ratings]
max_current_a = 0.5   # IOUTMAX, typ column (VIN = VOUT + 1 V); Absolute Maximum IOUT is 0.6 A
max_voltage_v = 6.5    # VIN abs max (2.0 V to 6.0 V operating)
max_power_w = 0.25     # SOT353 Pd; SOT23 is 0.3 W. The footprint rule binds both, so the lower is used.
                       # No temperature is printed for the Absolute Maximum table, so no tagged
                       # [[characteristic]] rows are carried and the scalar is the fallback.

# ── NCP1117LP: onsemi 1 A low-quiescent-current LDO, SOT-223 ──────────────────
# Source: onsemi NCP1117LP datasheet, publication NCP1117LP/D, January 2024,
#   Rev. 6 (onsemi.com/pdf/datasheet/ncp1117lp-d.pdf). Page 1 pin list and case
#   318H, Table 1 Pin Function Description p.2, Table 2 Maximum Ratings p.2,
#   Table 3 Electrical Characteristics p.3, Device Ordering Information p.12.
#
# PINOUT, SOT-223 (ST suffix, case 318H): 1 = Adj/GND (ground only on the fixed
# parts), 2 = Vout, 3 = Vin; the heatsink tab is connected to pin 2 (OUTPUT), not
# to ground. The DPAK orderable codes (DT18, DT33) are not matched: the datasheet
# prints one pin list for both cases and states the tab connection only for the
# SOT-223.
#
# The LP is NOT the standard NCP1117: it has 550 uA typ quiescent current
# (fixed, Vin = 12 V, Io = 10 mA), Vin abs max 18 V (not 20 V), 1.4 V max
# dropout at 1 A, and a +/-2% fixed-output window at 25 C (1.470-1.530 V for
# 1.5 V, 1.760-1.840 for 1.8 V, 2.450-2.550 for 2.5 V, 3.235-3.365 for 3.3 V,
# 4.900-5.100 for 5.0 V). The datasheet is inconsistent on output capacitance:
# Table 1 and Figures 1-2 say 10 uF with 20 mOhm <= ESR <= 20 Ohm, the
# Applications text says a minimum of 4.7 uF with the same ESR window; the
# larger figure is carried. The ADJ member's Vref (1.250 V) is not recorded.
# DELIBERATELY NOT MODELLED: current limit (1.1 A min), minimum load current
# (printed 1 typ / 5 max mA for the family although the features list "no minimum
# load" for fixed parts), thermal shutdown (165 C), ripple rejection (60 dB).

[[models]]
id = "ncp1117lp_15"
kind = "vreg"
description = "onsemi NCP1117LPST15T3G 1 A low-IQ LDO, 1.5 V fixed, SOT-223"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.onsemi.com/pdf/datasheet/ncp1117lp-d.pdf"
title = "onsemi NCP1117LP Voltage Regulators, 1.0 A Low-Dropout Positive, Fixed and Adjustable, NCP1117LP/D Rev. 6, January 2024"
locator = "Page 1 pin list (SOT-223 ST suffix, case 318H); Table 1 Pin Function Description p.2; Table 2 Maximum Ratings p.2; Table 3 Electrical Characteristics p.3; Device Ordering Information p.12"
sha256 = "d26363b7d72e7c1edae5adaf9325e9f8572665bb6e217c4804a7af7c1dc775a9"
[[models.source.uncertainty]]
status = "interval"
parameter = "vout"
low = 1.47
high = 1.53
unit = "V"
kind = "specification-limits"
basis = "NCP1117LP Table 3 Output Voltage, Fixed Output Devices NCP1117-1.5, TJ = 25 C, Io = 10 mA"

[models.match]
# ST = SOT-223 and 15 = 1.5 V; both required. The DPAK (DT) orderable codes are not matched.
value_re = "(?i)^NCP1117LPST15[A-Z0-9]*$"

[models.params]
vout      = 1.5      # 1.47 to 1.53 V @ TJ = 25 C, Io = 10 mA
dropout_v = 1.4      # max @ Iout = 1 A, TA = 25 C, DVout = Vout - 100 mV (1.3 V typ), Table 3
# Source: onsemi NCP1117LP/D Rev. 6, Table 1 Vout pin: a minimum of 10 uF with 20 mOhm <= ESR <= 20 Ohm.
cout_min_f = 1.0e-5
cout_esr_min_ohm = 0.02
cout_esr_max_ohm = 20.0
iq_a      = 5.5e-4   # IQFIX typ @ Vin = 12 V, Io = 10 mA (700 uA max)

[models.pins]
# SOT-223, ST suffix, case 318H. Tab is internally tied to pin 2 (Vout).
"1" = "gnd"    # Adj/GND; ground only on the fixed-mode parts
"2" = "out"
"3" = "in"

[models.ratings]
max_current_a = 1.0          # "output current in excess of 1.0 A"; current limit 1.1 A min
max_voltage_v = 18.0         # DC Input Voltage Vin abs max, Table 2
max_junction_temp_c = 150.0  # TJ(max), Table 2
theta_ja_c_per_w = 108.0     # RqJA on a 100 x 100 mm PCB, 1 oz Cu, TA = 25 C (Table 2 note 2)
theta_jc_c_per_w = 15.0

