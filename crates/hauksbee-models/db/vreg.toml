[models.match]
# The 33 in the part number is the voltage code; the family spans 0.6 V to
# 5.0 V on the same pinout, so it is required. This card's pin map is the DBV
# (SOT-23-5) column, so only a bare part number (the DBV is the package a bare
# TLV75533P is sold in on the ZSWatch boards) or a DBV order code (PDBVR,
# PDBVT) binds it. The DQN (X2SON), DYD (SOT-23-5 with thermal pad) and DRV
