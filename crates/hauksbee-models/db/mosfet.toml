# ── DMG1012T-7 ────────────────────────────────────────────────────────────────
# Diodes Incorporated, N-channel, SOT-523. 25 instances on the KiCad demos.
# Source: Diodes Inc DMG1012T datasheet DS31783 Rev. 8-2, February 2022
#   (https://www.diodes.com/assets/Datasheets/DMG1012T.pdf, fetched 2026-09-25).
# Datasheet figures used (ON Characteristics, TJ=25 C):
