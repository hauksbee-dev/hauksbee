# ── CJ3134K ───────────────────────────────────────────────────────────────────
# Jiangsu Changjing Electronics (JSCJ), N-channel, SOT-23. 20 instances on the
# Hunt boards. Same house as the cj2301 entry above.
# Source: JSCJ "CJ3134K SOT-23" Rev. - 1.1
#   (https://www.jscj-elec.com/gallery/file/CJ3134K%20SOT-23%20V1.1.pdf, fetched
#   and re-read 2026-09-25). An LCSC-hosted copy headed "B Dec,2013" was also
#   cited here earlier; it could not be re-fetched (LCSC serves a JS viewer), so
#   the earlier claim that the two are "numerically identical" is unverified.
#   No vendor SPICE card was located.
# Datasheet figures (Rev. 1.1, MOSFET Electrical Characteristics, Ta=25 C):
#   VGS(th) = 0.35 / 0.54 / 1.1 V     @ VDS=VGS, ID=250 uA
#   RDS(on) typ 270 (max 380) mOhm    @ VGS=4.5 V, ID=0.65 A
#   RDS(on) typ 320 (max 450) mOhm    @ VGS=2.5 V, ID=0.55 A
#   RDS(on) typ 390 (max 800) mOhm    @ VGS=1.8 V, ID=0.45 A
#   gFS     typ 1.6 S                 @ VDS=10 V, ID=0.8 A
#   Ciss 79 typ (120 max) / Coss 13 (20) / Crss 9 (15) pF
#                                     @ VDS=16 V, VGS=0, f=1 MHz (Note 4: by design)
#   VSD max 1.2 V @ IS=0.15 A (no typ published)
#
# AUDIT CORRECTION (2026-09-25): this entry previously stated that the RDS(on)
#   typ column is EMPTY at every VGS point. Rev. 1.1 prints typicals (270 / 320 /
#   390 mOhm, above). The kp/rd/rs fit below was made to the MAX column only and
#   has NOT been refitted in this audit (capacitance-only scope); it is therefore
#   pessimistic on on-resistance by construction and is flagged for a refit on
#   the typ rows. The derivation text below is kept as the record of how the
#   current numbers were obtained.
# kp: (a) 1.6^2/(2*0.8) = 1.600.  (b) on the max rows, 1.8 V and 4.5 V:
#   (1/1.26 - 1/3.96)/(0.800 - 0.380) = (0.79365 - 0.25253)/0.42 = 1.2884.
#   19.5% apart. Route (a) chosen here, against this file's usual preference,
#   for one specific reason: gFS is a genuine TYPICAL figure while the whole
#   conduction column is maxima, so route (a) is the only route resting on a
#   typical-part number. kp = 1.600 also sits between the two conduction fits
#   available (1.288 on the 1.8/4.5 pair, 3.681 on the 2.5/4.5 pair).
# rd+rs = 0.380 - 1/(1.600*3.96) = 0.22217 Ohm, split evenly.
# THE DATASHEET'S THREE ROWS CANNOT BE FITTED BY ANY SINGLE SQUARE LAW, and that
#   is a defect in the sheet rather than in the model. The 380 -> 450 -> 800
#   mOhm progression is disproportionate: fitting the 2.5/4.5 pair gives
#   kp = 3.681 and then misses VGS=1.8 V by -34.1%; fitting 1.8/4.5 gives
#   kp = 1.288 and misses VGS=2.5 V by +28.9%. With the chosen kp = 1.600 the
#   out-of-sample errors are +20.2% at VGS=2.5 V and -10.2% at VGS=1.8 V. Those
#   are the honest residuals and they are large.
[[models]]
id = "cj3134k"
kind = "nmos"
description = "CJ3134K N-channel MOSFET SOT-23, 20V, 750mA, Rds(on) 380 mOhm max @ Vgs=4.5V"

[models.match]
value_re = "(?i)^CJ3134K?[A-Z0-9-]*$"

[models.params]
vto    = 0.54
kp     = 1.600     # from gFS; fitted with the max RDS(on) column only, see the correction above
rd     = 0.11109
rs     = 0.11109
cgd    = 9.0e-12   # Crss typ 9 pF, Rev. 1.1 Dynamic Characteristics (Note 4), VDS = 16 V, VGS = 0, f = 1 MHz
cgs    = 7.0e-11   # Ciss typ - Crss typ = 79 - 9 = 70 pF, same bias

[models.pins]
"G" = "gate"
"S" = "source"
