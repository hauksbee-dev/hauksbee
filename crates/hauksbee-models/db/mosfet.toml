[models.params]
# CITATION PROBLEM (2026-09 audit): "Document No. 66664 Rev. E 13-Jul-22" was
# not located. The real sheet is Vishay "SiR182DP N-Channel 60 V (D-S) MOSFET",
# Document Number 77800, S18-0749-Rev. B, 30-Jul-2018
# (https://www.vishay.com/docs/77800/sir182dp.pdf), and it contradicts the
# legacy vto/kp/rd/rs and ratings on this card: VDS 60 V (not 100 V), VGS(th)
# 2 min / 3.6 max @ ID=250uA (no typ), RDS(on) typ 2.3 mOhm (max 2.8) @
# VGS=10V, ID=15A, ID 117 A @ TC=25C, PD 69.4 W @ TC=25C. Only the
# capacitances below come from that sheet. Vishay also publishes a SPICE Device
# Model sheet (Doc 77164, S17-1847-Rev. A, 18-Dec-17,
# https://www.vishay.com/docs/77164/sir182dp_ps_reva.pdf), but it is a level-3
# subcircuit with no printed netlist, so it cannot supply level-1 cgs/cgd; its
# measured column repeats Ciss 3250 / Crss 50 pF (simulated 3390 / 71 pF).
