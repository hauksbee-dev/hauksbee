# ─────────────────────────────────────────────────────────────────────────────
# CJ2301: Jiangsu Changjing (JSCJ) P-channel trench MOSFET, SOT-23.
# Source: JSCJ "CJ2301 P-Channel 20-V(D-S) MOSFET" datasheet, Rev. - 2.1
#   (www.jscj-elec.com; the copy read is evelta.com/content/datasheets/217-CJ2301.pdf).
# JSCJ publishes no SPICE card, so the level-1 params are derived from the
# datasheet's stated test points and the derivation is recorded here.
#
# Datasheet figures used (MOSFET Electrical Characteristics, Ta=25C):
#   VGS(th) = -0.4 / -0.7 / -1.0 V     @ VDS=VGS, ID=-250 uA        -> vto
#   RDS(on) typ 0.090 Ohm (max 0.112)  @ VGS=-4.5 V, ID=-2.8 A
#   RDS(on) typ 0.110 Ohm (max 0.142)  @ VGS=-2.5 V, ID=-2.0 A
#   gfs typ 6.5 S                      @ VDS=-5 V, ID=-2.8 A
#   Ciss 405 pF / Coss 75 pF / Crss 55 pF @ VDS=-10 V, VGS=0, f=1 MHz
#   VSD typ -0.8 V (max -1.2 V) @ IS=-0.7 A
#
# kp and rd+rs are solved from the two RDS(on) rows against
# R(VGS) = 1/(kp*(|VGS|-|vto|)) + (rd+rs):
#   kp    = (1/1.8 - 1/3.8) / (0.110 - 0.090) = 14.6 A/V^2
#   rd+rs = 0.090 - 1/(14.6*3.8)              = 0.072 Ohm, split evenly.
# DELIBERATE CHOICE, recorded because it is a real approximation: this fit
# implies gm = sqrt(2*kp*2.8) = 9.0 S at the gfs test point, where the
# datasheet says 6.5 S. A level-1 square law cannot satisfy both the
# on-resistance pair and the saturation transconductance, and this part is used
# as a load switch (Watchy Q1), so on-resistance is the fidelity target. The
# AO3400A entry above is the happy case where both routes agree.
# NOT MODELLED: the body diode (`body_is` left at the engine default 0, as
# elsewhere in this file) and `lambda`, which the datasheet does not state.
#
# NOTE ON THE BOARD: the KiCad symbol on Watchy carries the description
# "2A Id, 20V Vds, P-Channel MOSFET, 70mOhm Ron". The 70 mOhm is the symbol
# library's generic blurb, not this die; the datasheet's own figure is 90 mOhm
# typ / 112 mOhm max at VGS=-4.5 V, and the datasheet wins.
[[models]]
id = "cj2301"
kind = "pmos"
description = "CJ2301 P-channel MOSFET SOT-23, -20V, -2.3A, Rds(on) 90mOhm typ @ Vgs=-4.5V"

[models.match]
# Package/lot-suffix variants of the same die: CJ2301, CJ2301-S1 (the LCSC
# ordering code). "CJ2301" is a complete prefix and no other JSCJ part shares
# it, so the relaxed suffix class cannot mis-bind.
value_re = "(?i)^CJ2301[A-Z0-9-]*$"

[models.params]
