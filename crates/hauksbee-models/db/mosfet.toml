# ── PMV50ENEAR ────────────────────────────────────────────────────────────────
# Nexperia, N-channel trench, SOT-23, AEC-Q101. 14 instances on MNT Reform.
# The R suffix is the tape-and-reel ordering code; the die datasheet is PMV50ENEA.
# Source: Nexperia PMV50ENEA product data sheet v.1, released 10 March 2016
#   (https://assets.nexperia.com/documents/data-sheet/PMV50ENEA.pdf).
# Vendor SPICE file: https://assets.nexperia.com/documents/spice-model/PMV50ENEA.lib
#   (Transim-generated subcircuit, "Date Created Mon Feb 08 06:46:59 2016");
#   both fetched and re-read 2026-09-25.
# Datasheet figures used (Characteristics, Tj=25 C):
#   VGS(th) = 1 / 1.5 / 2.5 V        @ VDS=VGS, ID=250 uA
#   RDS(on) typ 30 mOhm (max 43)     @ VGS=10 V,  ID=3.9 A
#   RDS(on) typ 39 mOhm (max 60)     @ VGS=4.5 V, ID=3.3 A
#   gFS     typ 12.5 S               @ VDS=10 V, ID=3.9 A
#   Ciss 276 / Coss 55 / Crss 42 pF  @ VDS=15 V, VGS=0, f=1 MHz
#   VSD typ 0.7 V (max 1.2) @ IS=1 A
# VENDOR SPICE CARD COMPARED, NOT COPIED: PMV50ENEA.lib is a LEVEL=3 card
#   (Vto=2.0213, Kp=29.945, Nfs=5.3e11, Eta=3000, Vmax=1000, plus RD=0.0203,
#   RS=0.0001, RG=7, a nonlinear CGD table and a body-diode model). Its Vto and
#   Kp are level-3 fitting parameters and are NOT level-1 equivalents, so
#   transcribing them would be wrong. Two things it does confirm: its
#   `CGS 2.34e-10` is exactly Ciss - Crss, and its Kp is the same order as ours.
#
# kp: (a) 12.5^2/(2*3.9) = 20.032.  (b) (1/3.0 - 1/8.5)/(0.039 - 0.030)
#   = (0.33333 - 0.11765)/0.009 = 23.965. 19.6% apart, both physical (both give
#   a positive ohmic residue), so kp = 22.0 is taken between them rather than
#   picking a winner.
# rd+rs = 0.030 - 1/(22.0*8.5) = 0.024652 Ohm, split evenly.
# NOT VALIDATED OUT OF SAMPLE (two 25 C rows, both in the fit). With kp = 22.0
#   the fit rows land at 30.0 mOhm (exact) and 39.8 mOhm against a typ of 39
#   (+2.1%), and the gFS cross-check agrees: implied gm 13.1 S against 12.5 S,
#   +5%. This is the best-behaved entry of the batch alongside PMV50EPEAR.
