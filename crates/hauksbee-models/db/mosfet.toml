# ── Generic power-FET fallback models ────────────────────────────────────────
#
# These two entries are GENERIC PLACEHOLDER catch-alls. They are NOT sourced
# from any specific datasheet. They exist so that any unmodeled power FET in a
# recognised power package binds to a sane Rds_on estimate and package ratings,
# enabling dissipation / Tj computation rather than binding open.
#
# Values chosen conservatively:
#   - Rds_on ~ 20 mOhm split equally rd/rs, representative of a medium-tier
#     power FET in a DPAK/D2PAK/TO-220/TO-252/TO-263/PowerPAK/PQFN/LFPAK
#     package. Real parts range ~2-100 mOhm; 20 mOhm is a mid-conservative pick.
#   - kp generous (modeled as a hard switch): full turn-on assumed at Vgs=10V.
#   - Ratings are the lowest common denominator for the package class:
#     20 A / 30 V / 30 W. A real part almost certainly has higher ratings;
#     the defaults are chosen to avoid false-positive overrating flags on an
#     unknown part.
#   - theta_ja ~ 50 C/W typical for TO-252/DPAK in still air (datasheet range
#     40-65 C/W); use the middle as a representative estimate.
#   - max_junction_temp_c = 150 C, typical for silicon power FETs.
#
# SPECIFICITY: footprint_re only (score = 5). Any entry with a value_re or
# mpn_re will outscore this catch-all automatically.
#
# HOW TO OVERRIDE: add an [[models]] entry with a value_re = "(?i)^<PART>$"
# in mosfet.toml (or a user TOML directory). The specificity scorer will prefer
# any value-matched entry over this footprint-only catch-all.
#
# RUNTIME DISCLOSURE: binding to one of these raises a coverage warning naming
# the part and this model, because the ratings above are invented for the
# package class and a verdict resting on them otherwise looked exactly like a
# verdict resting on a vendor SPICE model. See
# BindReport::estimated_fallback_warnings; the CI report carries it in
# coverage_warnings beside the co-sim and overpower holes.

[[models]]
id = "generic_nmos_power_pkg"
kind = "nmos"
description = "Generic N-ch power FET fallback (DPAK/D2PAK/TO-220/TO-252/TO-263/PowerPAK/LFPAK), PLACEHOLDER, not datasheet-sourced"

[models.source]
tier = "estimated-fallback"
validation = "unvalidated"

[models.match]
# Matches common SMD and THT power-FET packages by footprint string.
# Covers KiCad footprint library names for: DPAK (TO-252), D2PAK (TO-263),
# TO-220, PowerPAK SO-8, PQFN, TDSON, LFPAK33/56/88, and SO-8 power variants.
footprint_re = "(?i)(DPAK|D2PAK|TO[_-]252|TO[_-]263|TO[_-]220|PowerPAK|PQFN|TDSON|LFPAK|SOT[_-]669|DFN[_-]8)"

[models.params]
# GENERIC PLACEHOLDER, representative of a medium Rds_on power FET.
# rd + rs sum to ~20 mOhm (0.020 ohm) Rds_on at Vgs=10V.
# These are NOT datasheet values for any specific part.
vto    = 3.0       # threshold voltage (V), typical for standard-threshold N-ch power FET
kp     = 10.0      # generous kp so FET acts as a low-loss switch when on (A/V²)
lambda = 0.01      # channel-length modulation, representative (1/V)
rd     = 0.010     # drain resistance portion of Rds_on, ~10 mOhm
rs     = 0.010     # source resistance portion of Rds_on, ~10 mOhm

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
# Conservative package-class ratings for DPAK/D2PAK/TO-252 family.
# GENERIC: a real part will almost certainly have higher ratings.
# Used only for dissipation/Tj estimation when the real datasheet is absent.
max_current_a       = 20.0    # Id continuous, conservative for this package class (A)
max_surge_current_a = 60.0    # Id pulsed estimate (3x continuous, generic)
max_power_w         = 30.0    # Pd TO-252/DPAK range ~2.5-40W; 30W is mid-conservative
max_voltage_v       = 30.0    # Vds, conservatively low (real parts typically 20-650V)
theta_ja_c_per_w    = 50.0    # still-air TO-252 estimate, representative (C/W)
max_junction_temp_c = 150.0   # standard silicon power-FET junction limit

