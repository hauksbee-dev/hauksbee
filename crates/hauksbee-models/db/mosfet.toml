# ── WPM2015-3 ─────────────────────────────────────────────────────────────────
# Will Semiconductor (WillSemi), P-channel, SOT-23. 28 instances across all
# twelve Olimex ESP32-EVB revisions and the RP2040-PICO-PC, where it is the
# USB / battery-path load switch (FET1..FET3).
# Source: Will Semiconductor WPM2015 datasheet Rev. 1.2, Mar 2018 (LCSC-hosted
#   copy, https://datasheet.lcsc.com/datasheet/pdf/903395ae1f2101a77730f1a7221883cd.pdf?productCode=C213159,
#   fetched 2026-09-25; the footer reads "Mar,2018 - Rev.1.2").
# Datasheet figures used (Electronics Characteristics, TJ=25 C):
#   VGS(th) = -0.40 / -0.62 / -0.81 V  @ VGS=VDS, ID=-250 uA
#   RDS(on) typ 81 mOhm (max 110)      @ VGS=-4.5 V, ID=-2.7 A
#   RDS(on) typ 103 mOhm (max 150)     @ VGS=-2.5 V, ID=-2.2 A
#   Ciss 534 / Coss 62 / Crss 54 pF    @ VDS=-10 V, VGS=0, f=1 MHz (typ only)
#   VSD typ -0.74 V (max -1.5) @ VGS=0, IS=-0.9 A
# No vendor SPICE card.
#
# THIS IS THE LEAST-VALIDATED ENTRY IN THE FILE, and it should be read that way.
#   The datasheet publishes NO gFS row at all, so route (a) does not exist: there
#   is no second, independent route to kp and no cross-check of any kind. It also
#   publishes only two 25 C RDS(on) rows, both consumed by the fit, so there is
#   no out-of-sample row either. The fit reproduces the two rows it was given and
#   nothing else has been tested.
# kp = (1/1.88 - 1/3.88)/(0.103 - 0.081) = (0.53191 - 0.25773)/0.022 = 12.463.
# rd+rs = 0.081 - 1/(12.463*3.88) = 0.060320 Ohm, split evenly.
# The only defence available is a plausibility one: vto = -0.62 with kp = 12.46
#   sits in the same family as the cj2301 entry above (vto = -0.7, kp = 14.6),
#   which is a comparable -20 V/-2 A SOT-23 P-FET. That is weaker evidence than
#   every other entry here rests on.
