# ── IRLML6402 ─────────────────────────────────────────────────────────────────
# Infineon (International Rectifier) HEXFET, P-channel, SOT-23 / Micro3.
# Instances on the Hunt boards and Olimex ESP32-EVB.
#
# THIS ENTRY IS INFINEON'S OWN LEVEL-1 SPICE CARD, NOT OUR FIT, and that is the
# whole reason it looks different from its neighbours. Infineon publishes
# irlml6402.spi (MODPEX / Symmetry extraction, dated 25 Sep 2006), and unlike
# the Nexperia cards it is genuinely `LEVEL=1`, which makes it directly
# transcribable into the same level-1 shape this file uses:
#
#     M1 9 7 8 8 MM L=100u W=100u
#     .MODEL MM PMOS LEVEL=1 IS=1e-32
#     +VTO=-1 LAMBDA=0.0111358 KP=12.788
#     +CGSO=5.36099e-06 CGDO=5.54234e-08
#     RS 8 3 0.0246704
#     RG 2 7 29.2227
#     RD 9 1 0.0001
#
# Where a vendor ships a model for the exact device at the exact level, that
# model wins over anything derived here: it was extracted from measured silicon
# and it is the number the vendor will defend. It is also the ONLY part in this
# batch with a published `lambda`, which is why this is the only entry that has
# one.
#
# CROSS-CHECKED AGAINST THE DATASHEET, and the two agree well enough to trust
# both. Source: Infineon IRLML6402 datasheet, Infineon-IRLML6402-DataSheet-
# v01_01-EN.pdf, revision 28 April 2014. Datasheet figures:
#   VGS(th) = -0.40 / -0.55 / -1.2 V   @ VDS=VGS, ID=-250 uA
#   RDS(on) typ 0.050 Ohm (max 0.065)  @ VGS=-4.5 V, ID=-3.7 A
#   RDS(on) typ 0.080 Ohm (max 0.135)  @ VGS=-2.5 V, ID=-3.1 A
#   gFS     min 6.0 S (no typ)         @ VDS=-10 V, ID=-3.7 A
#   Ciss 633 / Coss 145 / Crss 110 pF  @ VGS=0, VDS=-10 V, f=1 MHz
# Fitting the datasheet with this file's own recipe gives kp = (1/1.95 -
#   1/3.95)/(0.080 - 0.050) = 8.6552 and rd+rs = 0.02075 Ohm, against the
#   vendor's KP = 12.788 and RS = 0.0246704. The card's higher KP is paired with
#   its VTO = -1 rather than the datasheet's typ -0.55, which is a legitimate
#   different point in the same fit space; the series resistances land within
#   16% of each other. Both satisfy the datasheet's gFS >= 6.0 S floor (our fit
#   implies 8.00 S at the test point).
# DIVERGENCE FROM THE CARD, deliberately: the card's CGSO/CGDO are per-metre
#   overlap densities scaled by its L=100u W=100u geometry, not the lumped
#   capacitances this file's `cgs`/`cgd` mean, so those two come from the
#   datasheet's Ciss/Crss the same way every other entry here does. The card's
#   RG = 29.2 Ohm gate resistance has no field in this schema. IS=1e-32 in the
#   card is a placeholder below any physical value and is not carried over.
[[models]]
id = "irlml6402"
kind = "pmos"
description = "IRLML6402 P-channel HEXFET SOT-23, -20V, -3.7A, Infineon LEVEL=1 SPICE card"

[models.match]
value_re = "(?i)^IRLML6402[A-Z0-9-]*$"

[models.params]
# Source: Infineon irlml6402.spi, `.MODEL MM PMOS LEVEL=1`, verbatim.
vto    = -1.0        # VTO (the datasheet typ is -0.55; see the note above)
kp     = 12.788      # KP
lambda = 0.0111358   # LAMBDA, the only vendor-published lambda in this file
rs     = 0.0246704   # RS
rd     = 0.0001      # RD
# Source: Infineon IRLML6402 datasheet, not the card; see the note above.
cgd    = 1.1e-10     # Crss
cgs    = 5.23e-10    # Ciss - Crss = 633 - 110 pF

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
max_current_a = 3.7         # |ID| at TA=25 C, VGS=-4.5 V (2.2 A at TA=70 C)
max_surge_current_a = 22.0  # |IDM|
max_power_w = 1.3           # PD at TA=25 C, 1 in^2 single-layer 1 oz Cu FR4,
                            # steady state (0.8 W at 70 C, derate 0.01 W/C)
max_voltage_v = 20.0        # |VDS| (VGS is +-12 V)
max_junction_temp_c = 150.0
theta_ja_c_per_w = 100.0    # max (75 typ). RthJC is not on this datasheet.

# ── AO3422 ────────────────────────────────────────────────────────────────────
# Alpha & Omega Semiconductor, N-channel, SOT-23. Hunt boards.
# Source: AOS AO3422 datasheet Rev 2.1 March 2024 (the electrical table itself
# is footnoted Rev2: Sep 2010).
# Datasheet figures used (Electrical Characteristics, TJ=25 C):
#   VGS(th) = 0.6 / 1.3 / 2 V          @ VDS=VGS, ID=250 uA
#   RDS(on) typ 125 mOhm (max 160)     @ VGS=4.5 V, ID=2.1 A
#   RDS(on) typ 157 mOhm (max 200)     @ VGS=2.5 V, ID=1.5 A
#   gFS     typ 11 S                   @ VDS=5 V, ID=2.1 A
#   Ciss 214 typ / Coss 31 / Crss 12.6 pF @ VGS=0, VDS=25 V, f=1 MHz
#   VSD typ 0.78 V (max 1) @ IS=1 A
# No vendor SPICE card: the AOS resource library returns nothing for AO3422.
#
# kp: the two routes disagree by 1.77x, the same pathology cj2301 documents.
#   (a) 11^2/(2*2.1) = 28.81.  (b) (1/1.2 - 1/3.2)/(0.157 - 0.125)
#   = (0.83333 - 0.31250)/0.032 = 16.276.
#   Route (b) chosen because this part is used as a switch and on-resistance is
#   what a switch's simulation rests on.
# rd+rs = 0.125 - 1/(16.276*3.2) = 0.10580 Ohm, split evenly.
# NOT VALIDATED OUT OF SAMPLE (two 25 C rows, both in the fit), AND THE gFS
#   CROSS-CHECK IS A REAL MISS: kp = 16.276 implies gm = 8.27 S at the gFS test
#   point where the datasheet says 11 S, -25%. If this part is ever needed as a
#   linear amplifier rather than a switch, kp = 28.81 is the number to use, and
#   it costs -8.9% on the VGS=2.5 V on-resistance row.
[[models]]
id = "ao3422"
kind = "nmos"
description = "AO3422 N-channel MOSFET SOT-23, 55V, 2.1A, Rds(on) 125 mOhm typ @ Vgs=4.5V"

[models.match]
# Same N-channel die across suffixes. The P-channel AO3423 starts "AO3423" and
# is correctly rejected by the leading anchor.
value_re = "(?i)^AO3422[A-Z0-9-]*$"

[models.params]
vto    = 1.3
kp     = 16.276
rd     = 0.052900
rs     = 0.052900
cgd    = 1.26e-11
cgs    = 2.014e-10  # 214 - 12.6 pF

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
max_current_a = 2.1         # ID at TA=25 C (1.7 A at 70 C)
max_surge_current_a = 10.0  # IDM
max_power_w = 1.25          # PD at TA=25 C, 1 in^2 FR-4, 2 oz Cu, still air
max_voltage_v = 55.0        # VDS (VGS is +-12 V)
max_junction_temp_c = 150.0
theta_ja_c_per_w = 150.0    # max, steady state (115 typ; 100 max at t <= 10 s).
                            # AOS publishes RthJL 48 typ / 60 max rather than
                            # RthJC, so theta_jc is deliberately absent.

# ── PMZ550UNE ─────────────────────────────────────────────────────────────────
# Nexperia, N-channel trench, SOT-883 / DFN1006-3. MNT Reform. The board value
# is PMZ550UNEYL; YL is a packing suffix on the same datasheet.
# Source: Nexperia PMZ550UNE product data sheet v.1, released 25 March 2015.
# Datasheet figures used (Characteristics, Tj=25 C):
#   VGS(th) = 0.45 / 0.7 / 0.95 V      @ VDS=VGS, ID=250 uA
#   RDS(on) typ 550 mOhm (max 670)     @ VGS=4.5 V, ID=590 mA
#   RDS(on) typ 660 mOhm (max 900)     @ VGS=2.5 V, ID=590 mA
#   RDS(on) typ 770 mOhm (max 1120)    @ VGS=1.8 V, ID=80 mA
#   RDS(on) typ 890 mOhm (max 1500)    @ VGS=1.5 V, ID=10 mA
#   gFS     typ 600 mS                 @ VDS=10 V, ID=590 mA
#   Ciss 30.3 / Coss 5.8 / Crss 4.2 pF @ VDS=15 V, VGS=0, f=1 MHz
#   VSD typ 0.86 V (max 1.2) @ IS=380 mA
# VENDOR SPICE CARD COMPARED, NOT COPIED: PMZ550UNE.lib, LEVEL=3
#   (Vto=0.74984, Kp=4.5323, Nfs=2.125e11, Eta=2000, Vmax=600). Its Vto = 0.7498
#   corroborates the datasheet typ of 0.7, and its Kp = 4.53 supports the
#   conduction route below over the transconductance one.
#
# kp: the routes disagree 9.5x, the worst split in the batch, and route (a) is
#   REJECTED as unphysical.
#   (a) 0.6^2/(2*0.59) = 0.30508, which forces rd+rs = 0.550 - 1/(0.30508*3.8)
#       = -0.3126 Ohm and back-predicts 3.78 Ohm at VGS=1.5 V against a
#       datasheet 0.89 (+325%). A quoted gFS of 600 mS is implausibly low for a
#       die that carries 590 mA through 550 mOhm.
#   (b) widest pair, 1.5 V and 4.5 V: (1/0.8 - 1/3.8)/(0.890 - 0.550)
#       = (1.25000 - 0.26316)/0.34 = 2.9025. The vendor card's level-3
#       Kp = 4.53 is the same order; 0.305 is nowhere near it.
# rd+rs = 0.550 - 1/(2.9025*3.8) = 0.45933 Ohm, split evenly.
# VALIDATED OUT OF SAMPLE ON TWO INDEPENDENT ROWS, the best-tested entry here.
#   Fitted on 1.5 V and 4.5 V only:
#     VGS=1.8 V: predicted 1/(2.9025*1.1) + 0.45933 = 0.77255 Ohm vs typ 0.770,
#                +0.3%
#     VGS=2.5 V: predicted 1/(2.9025*1.8) + 0.45933 = 0.65074 Ohm vs typ 0.660,
#                -1.4%
#   The gFS cross-check is a deliberate, documented miss in the other direction:
#   implied gm 1.85 S against a quoted 0.6 S.
[[models]]
id = "pmz550une"
kind = "nmos"
description = "PMZ550UNE N-channel MOSFET DFN1006-3, 30V, 590mA, Rds(on) 550 mOhm typ @ Vgs=4.5V"

[models.match]
value_re = "(?i)^PMZ550UNE[A-Z0-9,]*$"

[models.params]
vto    = 0.7
kp     = 2.9025
rd     = 0.22967
rs     = 0.22967
cgd    = 4.2e-12
cgs    = 2.61e-11  # 30.3 - 4.2 pF

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
max_current_a = 0.59        # ID at VGS=4.5 V, Tamb=25 C, 1 cm^2 drain pad
max_surge_current_a = 2.3   # IDM, tp <= 10 us
max_power_w = 0.31          # Ptot, standard footprint (0.4 W on a 1 cm^2 pad)
max_voltage_v = 30.0        # VDS. NOTE VGS is only +-8 V on this part, much
                            # tighter than its SOT-23 siblings' +-20 V.
max_junction_temp_c = 150.0
theta_ja_c_per_w = 405.0    # Rth(j-a) max, standard footprint (350 typ;
                            # 310 max with a 1 cm^2 drain pad)

# ── CJ3134K ───────────────────────────────────────────────────────────────────
# Jiangsu Changjing Electronics (JSCJ), N-channel, SOT-23. 20 instances on the
# Hunt boards. Same house as the cj2301 entry above.
# Sources, two documents read and numerically identical: JSCJ "CJ3134K SOT-23"
#   Rev.-1.1 (jscj-elec.com), and the LCSC-hosted copy headed "B Dec,2013" /
#   footed "F, Aug,2015". They differ only in the company-name transliteration
#   and the revision label, which is a document-tracking artefact rather than a
#   spec conflict. No vendor SPICE card exists.
# Datasheet figures used (MOSFET Electrical Characteristics, TJ=25 C):
#   VGS(th) = 0.35 / 0.54 / 1.1 V     @ VDS=VGS, ID=250 uA
#   RDS(on) max 380 mOhm              @ VGS=4.5 V, ID=0.65 A
#   RDS(on) max 450 mOhm              @ VGS=2.5 V, ID=0.55 A
#   RDS(on) max 800 mOhm              @ VGS=1.8 V, ID=0.45 A
#   gFS     typ 1.6 S                 @ VDS=10 V, ID=0.8 A
#   Ciss 79 typ / Coss 13 / Crss 9 pF @ VDS=16 V, VGS=0 (Note 4: by design)
#   VSD max 1.2 V @ IS=0.15 A (no typ published)
#
# THE ON-RESISTANCE COLUMN IS MAX-ONLY. This sheet's RDS(on) typ column is empty
#   at every VGS point, so any conduction fit here is a fit to MAXIMUM
#   on-resistance and the resulting model is pessimistic by construction. That
#   is a material difference from every other entry in this file and it is the
#   first thing to know about this one.
# kp: (a) 1.6^2/(2*0.8) = 1.600.  (b) on the max rows, 1.8 V and 4.5 V:
#   (1/1.26 - 1/3.96)/(0.800 - 0.380) = (0.79365 - 0.25253)/0.42 = 1.2884.
#   19.5% apart. Route (a) chosen here, against this file's usual preference,
#   for one specific reason: gFS is a genuine TYPICAL figure while the whole
#   conduction column is maxima, so route (a) is the only route resting on a
#   typical-part number. kp = 1.600 also sits between the two conduction fits
#   available (1.288 on the 1.8/4.5 pair, 3.681 on the 2.5/4.5 pair).
# rd+rs = 0.380 - 1/(1.600*3.96) = 0.22217 Ohm, split evenly.
# THE DATASHEET'S THREE ROWS CANNOT BE FITTED BY ANY SINGLE SQUARE LAW, and that
#   is a defect in the sheet rather than in the model. The 380 -> 450 -> 800
#   mOhm progression is disproportionate: fitting the 2.5/4.5 pair gives
#   kp = 3.681 and then misses VGS=1.8 V by -34.1%; fitting 1.8/4.5 gives
#   kp = 1.288 and misses VGS=2.5 V by +28.9%. With the chosen kp = 1.600 the
#   out-of-sample errors are +20.2% at VGS=2.5 V and -10.2% at VGS=1.8 V. Those
#   are the honest residuals and they are large.
[[models]]
id = "cj3134k"
kind = "nmos"
description = "CJ3134K N-channel MOSFET SOT-23, 20V, 750mA, Rds(on) 380 mOhm max @ Vgs=4.5V"

[models.match]
value_re = "(?i)^CJ3134K?[A-Z0-9-]*$"

[models.params]
vto    = 0.54
kp     = 1.600     # from gFS; the conduction column is max-only, see above
rd     = 0.11109
rs     = 0.11109
cgd    = 9.0e-12
cgs    = 7.0e-11   # 79 - 9 pF

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
max_current_a = 0.75        # ID continuous, TA=25 C
max_surge_current_a = 1.8   # IDM at tp=10 us
max_power_w = 0.35          # FR4, minimum recommended pad size (Note 1)
max_voltage_v = 20.0        # VDS (VGS is +-12 V)
max_junction_temp_c = 150.0
theta_ja_c_per_w = 357.0    # same min-pad FR4 condition
