footprint_re = "(?i)(DPAK|D2PAK|TO[_-]252|TO[_-]263|TO[_-]220|PowerPAK|PQFN|TDSON|LFPAK|SOT[_-]669|DFN[_-]8)"

[models.params]
# GENERIC PLACEHOLDER, P-ch mirror of the N-ch fallback.
# vto is negative (P-channel). rd + rs sum to ~20 mOhm Rds_on at |Vgs|=10V.
vto    = -3.0      # threshold voltage (V), negative for P-channel
kp     = 10.0      # generous kp (A/V²)
lambda = 0.01
rd     = 0.010
rs     = 0.010

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
max_current_a       = 20.0
max_surge_current_a = 60.0
max_power_w         = 30.0
