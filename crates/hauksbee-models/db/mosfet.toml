#   both fetched and re-read 2026-09-25. The .lib's lumped `CGS 2 6 7.507e-10`
#   is used for cgs; it is 5.9% above the data sheet's Ciss - Crss = 709 pF.
# Datasheet figures used (Characteristics, Tj=25 C):
#   VGS(th) = -1 / -2 / -3 V         @ VDS=VGS, ID=-250 uA
#   RDS(on) typ 35 mOhm (max 45)     @ VGS=-10 V,  ID=-4.2 A
