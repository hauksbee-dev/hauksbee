# ─────────────────────────────────────────────────────────────────────────────
# DMG3404L: Diodes Incorporated N-channel logic-level trench MOSFET, SOT-23.
#
# Source: Diodes Incorporated "DMG3404L N-Channel Enhancement Mode MOSFET",
#   document DS37640 Rev. 2-2, January 2016
#   (www.diodes.com/assets/Datasheets/DMG3404L.pdf), Maximum Ratings, Thermal
#   Characteristics and Electrical Characteristics tables.
#
# Datasheet figures used (TA = +25 C):
#   VGS(th) = 1.0 / 1.5 / 2.0 V        @ VDS = VGS, ID = 250 uA        -> vto
#   RDS(on) typ 21 mOhm (max 25)       @ VGS = 10 V,  ID = 5.8 A
#   RDS(on) typ 24 mOhm (max 35)       @ VGS = 4.5 V, ID = 4.8 A
#   Ciss 641 pF / Coss 66 pF / Crss 51 pF  @ VDS = 15 V, VGS = 0, 1 MHz
#   VSD typ 0.75 V (max 1.0) @ VGS = 0, IS = 1 A
#   BVDSS 30 V, VGSS +/-20 V, IDM 30 A
#
# kp: ONE route only, and that is worth saying plainly. Diodes publishes no gFS
# and no SPICE card for this part, so the second, independent check the AO3400A
# entry above enjoys does not exist here. From the two RDS(on) rows, modelling
# on-resistance as channel + ohmic, R(VGS) = 1/(kp*(VGS-vto)) + (rd+rs):
#   subtracting the rows eliminates (rd+rs), giving
#   kp = (1/(4.5-1.5) - 1/(10-1.5)) / (0.024 - 0.021) = 0.215686 / 0.003
#      = 71.9 A/V^2
#   rd+rs = 0.021 - 1/(71.9 * 8.5) = 19.36 mOhm, split evenly as the siblings do.
# With only two rows the fit has no degrees of freedom left, so there is NO
# out-of-sample check: unlike the AO3400A, the 4.5 V row was used in the fit and
# reproducing it proves nothing. Treat kp as a fit to two points, not a measured
# parameter.
#
# NOT MODELLED: the body diode (VSD is on the datasheet; `body_is` is left at the
# engine default, matching every other entry in this file), `lambda` (no
# datasheet states one), and the gate resistance Rg = 2.2 Ohm.
#
# THE TWO ID RATINGS ARE BOTH REAL AND THEY DIFFER BY 40%. Note 5 (minimum
# recommended pad) gives 4.2 A continuous and PD = 0.78 W; Note 6 (a 1 inch
# square copper plate under a thermal via) gives 5.8 A and 1.33 W. A stress check
# should judge against the pad-layout figure, because that is what an ordinary
# board provides, so `max_current_a` carries 4.2 A and not the headline 5.8 A.
[[models]]
id = "dmg3404l"
kind = "nmos"
description = "DMG3404L N-channel MOSFET SOT-23, 30V, 4.2A, Rds(on) 21mOhm typ @ Vgs=10V"

[models.match]
# Boards commonly write the part without the logic-level "L" (the margay
# datalogger's Q1 is valued "DMG3404"); Diodes only builds the L. "-7" and "-13"
# are tape-and-reel quantity codes. No opposite-polarity part shares the "DMG3404"
# prefix (Diodes' nearest P-channel devices are the DMG3401LSN in SC59 and the
# DMG3415U, a -20 V not-for-new-design part), so the regex cannot reach one.
value_re = "(?i)^DMG3404L?[A-Z0-9-]*$"

[models.params]
vto    = 1.5       # VGS(th) typ (V) (min 1.0, max 2.0)
kp     = 71.9      # A/V^2, from the two RDS(on) rows (see the derivation above)
rd     = 0.0097    # half the 19.36 mOhm ohmic residue of RDS(on) @ VGS = 10 V
rs     = 0.0097    # other half
cgd    = 5.1e-11   # = Crss typ 51 pF, DS37640 Rev. 2-2 Dynamic Characteristics (Note 8), VGS = 0, VDS = 15 V, f = 1 MHz
cgs    = 5.9e-10   # = Ciss typ - Crss typ = 641 - 51 = 590 pF, same test condition

[models.pins]
# 1 = Gate, 2 = Source, 3 = Drain, the standard SOT-23 single-MOSFET order.
#
# DS37640 never prints pin NUMBERS: it gives a top-view "Pin Configuration" drawing
# with G, S and D on the leads, so the numbering here is the standard reading of
# that drawing rather than a table quoted from it. What corroborates it is the
# margay datalogger, where Q1 sits in the battery's ground return with pad 1 on
# VBAT+ and pad 2 on GND: a reverse-battery protection FET, which only works with
# this pad order. Stated explicitly rather than left to the SOT-23 pin rule, so an
# Eagle board with no pin functions binds with no guess warning.
"1" = "gate"
"2" = "source"
"3" = "drain"

[models.ratings]
max_current_a       = 3.5     # ID continuous, TA = 70 C, minimum recommended pad
                              # (Note 5), the least favourable tagged row below
                              # (4.2 A at TA = 25 C; 5.8 / 4.9 A on the 1-inch-square
                              # copper of Note 6). See the note above.
max_surge_current_a = 30.0    # IDM, pulse width <= 10 us, duty <= 1%
max_power_w         = 0.78    # PD, Note 5 board (1.33 W on the Note 6 board)
max_voltage_v       = 30.0    # BVDSS / VDSS
theta_ja_c_per_w    = 164.0   # RthJA, Note 5 board (96 C/W on the Note 6 board)
max_junction_temp_c = 150.0   # TJ
rds_on_vgs          = 4.5     # lowest RDS(on) row (24 mOhm typ / 35 max @ VGS=4.5V)
vgs_th_max          = 2.0     # VGS(th) max @ VDS=VGS, ID=250uA
[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.characteristic]]
parameter = "ID continuous drain current, steady state"
rating = "max_current_a"
max = 4.2
unit = "A"
conditions = "TA = 25 °C, VGS = 10 V, steady state, Note 5: FR-4 PC board, 2 oz copper, minimum recommended pad layout"
mounting = "FR-4, 2 oz Cu, minimum recommended pad"
basis = "DS37640 Rev. 2-2 (January 2016), Maximum Ratings, ID (Note 5), VGS = 10V, TA = +25°C"
