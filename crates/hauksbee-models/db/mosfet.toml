# ── IRLML6402 ─────────────────────────────────────────────────────────────────
# Infineon (International Rectifier) HEXFET, P-channel, SOT-23 / Micro3.
# Instances on the Hunt boards and Olimex ESP32-EVB.
#
# THIS ENTRY IS INFINEON'S OWN LEVEL-1 SPICE CARD, NOT OUR FIT, and that is the
# whole reason it looks different from its neighbours. Infineon publishes
# irlml6402.spi (MODPEX / Symmetry extraction, dated 25 Sep 2006), and unlike
# the Nexperia cards it is genuinely `LEVEL=1`, which makes it directly
# transcribable into the same level-1 shape this file uses:
#
#     M1 9 7 8 8 MM L=100u W=100u
#     .MODEL MM PMOS LEVEL=1 IS=1e-32
#     +VTO=-1 LAMBDA=0.0111358 KP=12.788
#     +CGSO=5.36099e-06 CGDO=5.54234e-08
#     RS 8 3 0.0246704
#     RG 2 7 29.2227
#     RD 9 1 0.0001
#
# Where a vendor ships a model for the exact device at the exact level, that
# model wins over anything derived here: it was extracted from measured silicon
# and it is the number the vendor will defend. It is also the ONLY part in this
# batch with a published `lambda`, which is why this is the only entry that has
# one.
#
# CROSS-CHECKED AGAINST THE DATASHEET, and the two agree well enough to trust
# both. Source: Infineon IRLML6402 datasheet, Infineon-IRLML6402-DataSheet-
# v01_01-EN.pdf, revision 28 April 2014. Datasheet figures:
#   VGS(th) = -0.40 / -0.55 / -1.2 V   @ VDS=VGS, ID=-250 uA
#   RDS(on) typ 0.050 Ohm (max 0.065)  @ VGS=-4.5 V, ID=-3.7 A
#   RDS(on) typ 0.080 Ohm (max 0.135)  @ VGS=-2.5 V, ID=-3.1 A
#   gFS     min 6.0 S (no typ)         @ VDS=-10 V, ID=-3.7 A
#   Ciss 633 / Coss 145 / Crss 110 pF  @ VGS=0, VDS=-10 V, f=1 MHz
# Fitting the datasheet with this file's own recipe gives kp = (1/1.95 -
#   1/3.95)/(0.080 - 0.050) = 8.6552 and rd+rs = 0.02075 Ohm, against the
#   vendor's KP = 12.788 and RS = 0.0246704. The card's higher KP is paired with
#   its VTO = -1 rather than the datasheet's typ -0.55, which is a legitimate
#   different point in the same fit space; the series resistances land within
#   16% of each other. Both satisfy the datasheet's gFS >= 6.0 S floor (our fit
#   implies 8.00 S at the test point).
# CAPACITANCES (re-audited 2026-09-25 against the .spi fetched from
#   https://www.infineon.com/dgdl/irlml6402.spi?fileId=5546d462533600a401535683a6e32bcc,
#   "Model generated on Sep 25, 06", MODPEX / Symmetry POWER MOS Model v1.0).
#   The card's CGSO/CGDO are per-metre overlap capacitances; multiplied by its
#   W = 100u they give LUMPED values: CGSO*W = 5.36099e-06 * 1e-4 = 536.1 pF, and
#   CGDO*W = 5.54 pF. cgs takes the vendor's 536.1 pF, which agrees with the
#   datasheet's Ciss - Crss = 633 - 110 = 523 pF to +2.5%. cgd does NOT come
#   from CGDO: the card models gate-drain charge with a nonlinear external
#   network (D2/MD1, CAP = 968.8 pF, FI1/FI2) on top of the 5.54 pF overlap, which
#   a constant cgd cannot transcribe, so cgd = datasheet Crss (110 pF). The
#   card's RG = 29.2 Ohm gate resistance has no field in this schema. IS=1e-32
#   in the card is a placeholder below any physical value and is not carried over.
[[models]]
id = "irlml6402"
kind = "pmos"
description = "IRLML6402 P-channel HEXFET SOT-23, -20V, -3.7A, Infineon LEVEL=1 SPICE card"

[models.match]
value_re = "(?i)^IRLML6402[A-Z0-9-]*$"

[models.params]
