#   RDS(on) typ 0.3 Ohm (max 0.4)   @ VGS=4.5 V, ID=600 mA
#   RDS(on) typ 0.4 Ohm (max 0.5)   @ VGS=2.5 V, ID=500 mA
#   RDS(on) typ 0.5 Ohm (max 0.7)   @ VGS=1.8 V, ID=350 mA
#   |Yfs|   typ 1.4 S               @ VDS=10 V, ID=400 mA
#   Ciss 60.67 / Coss 9.68 / Crss 5.37 pF @ VDS=16 V, VGS=0 (Note 8: by design)
