# MOSFET models.
# Level-1 SPICE params: vto (V), kp (A/V²), lambda (1/V), gamma (V^0.5),
# phi (V), rd (Ω), rs (Ω), cbd (F), cbs (F), cgd (F), cgs (F).

# ── N-channel ─────────────────────────────────────────────────────────────────

[[models]]
id = "2n7002"
kind = "nmos"
description = "2N7002 N-channel MOSFET SOT-23, 60V, 300mA, Vth≈2.0V typ (spec 1.0-2.5V)"

[models.match]
# Package/config-suffix variants of the same N-MOSFET die: 2N7002K, 2N7002P,
# 2N7002E, 2N7002W (SOT-323), 2N7002DW (dual SOT-363). "2N7002" is a complete
# prefix; the different-die 2N7000 starts "2N7000" and is correctly rejected.
value_re = "(?i)^2N7002[A-Z0-9-]*$"

[models.params]
# A TYPICAL fit to Nexperia 2N7002 Rev. 7, Table 6, not a guaranteed bound. Rows
# fitted: VGSth typ 2 V (min 1, max 2.5); RDSon typ 2.8 Ω (max 5) at VGS = 10 V,
# ID = 500 mA; RDSon typ 3.8 Ω (max 5.3) at VGS = 4.5 V, ID = 75 mA. Solves back
# to 3.20 Ω and 4.30 Ω, inside both typ..max bands (ngspice level 1 agrees). The
# RDSon rows stop at VGS = 4.5 V, so a lower gate drive is an extrapolation.
# Document: Nexperia "2N7002 60 V, 300 mA N-channel Trench MOSFET", Product data
# sheet Rev. 7, 8 September 2011
# (https://assets.nexperia.com/documents/data-sheet/2N7002.pdf).
vto    = 2.0      # VGSth typ (V); a part anywhere in 1.0-2.5 V is not this card
kp     = 0.26     # transconductance parameter (A/V²), k'*(W/L), fitted
lambda = 0.01     # channel-length modulation (1/V)
rd     = 2.2      # drain ohmic resistance (Ω), fitted jointly with kp
rs     = 0.5      # source ohmic resistance (Ω), bond-wire/package share
cgd    = 3.5e-12  # Nexperia 2N7002 Rev. 7, Table 6 Dynamic characteristics, Crss typ 3.5 pF @ VDS=10V, VGS=0, f=1MHz (cgd = Crss)
cgs    = 2.75e-11 # same table/bias, Ciss typ 31 pF - Crss typ 3.5 pF = 27.5 pF (cgs = Ciss - Crss)
warning = "the RDS(on) rows stop at VGS = 4.5 V, so a lower gate drive is an extrapolation, not a datasheet figure; the fit is to TYPICAL values, and a part anywhere in the 1.0-2.5 V VGS(th) band is not this card"

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
# Source: Nexperia 2N7002 Rev. 7, Table 5 Limiting values and Table 6 Thermal
# characteristics. The ID and Ptot rows are solder-point (Tsp) referenced.
max_current_a = 0.19       # ID at Tsp = 100 C, VGS = 10 V, the least favourable
                           # tagged row below (300 mA at Tsp = 25 C)
max_surge_current_a = 1.2  # IDM, pulsed, tp <= 10 us, Tsp = 25 C
max_power_w = 0.83         # Ptot at Tsp = 25 C: a solder-point figure; in still air
                           # the binding limit is Tj from theta_ja below
max_voltage_v = 60.0  # VDS
max_junction_temp_c = 150.0  # Tj max (Table 5)
theta_ja_c_per_w = 350.0     # Rth(j-a) max, PCB, minimum footprint, vertical, still air
rds_on_vgs = 4.5   # lowest VGS the RDS(on) rows reach (10 V and 4.5 V)
vgs_th_max = 2.5   # VGSth max (Nexperia Table 6)
[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.characteristic]]
parameter = "ID drain current"
rating = "max_current_a"
max = 0.3
unit = "A"
conditions = "Tsp = 25 °C, VGS = 10 V"
basis = "Nexperia 2N7002 Rev. 7 (8 September 2011), Table 5 Limiting values, ID @ VGS = 10 V, Tsp = 25 °C (300 mA)"
[[models.source.characteristic]]
parameter = "ID drain current"
rating = "max_current_a"
max = 0.19
unit = "A"
conditions = "Tsp = 100 °C, VGS = 10 V"
basis = "Nexperia 2N7002 Rev. 7 (8 September 2011), Table 5 Limiting values, ID @ VGS = 10 V, Tsp = 100 °C (190 mA)"
[[models.source.characteristic]]
parameter = "IDM peak drain current"
max = 1.2
unit = "A"
conditions = "pulsed, tp ≤ 10 µs, Tsp = 25 °C"
basis = "Nexperia 2N7002 Rev. 7 (8 September 2011), Table 5 Limiting values, IDM"
[[models.source.characteristic]]
parameter = "Ptot total power dissipation"
rating = "max_power_w"
max = 0.83
unit = "W"
conditions = "Tsp = 25 °C"
basis = "Nexperia 2N7002 Rev. 7 (8 September 2011), Table 5 Limiting values, Ptot @ Tsp = 25 °C"
[[models.source.characteristic]]
parameter = "Rth(j-a) thermal resistance from junction to ambient"
rating = "theta_ja_c_per_w"
max = 350.0
unit = "K/W"
conditions = "mounted on a printed-circuit board, minimum footprint, vertical in still air"
mounting = "PCB, minimum footprint"
basis = "Nexperia 2N7002 Rev. 7 (8 September 2011), Table 6 Thermal characteristics, Rth(j-a)"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "bss138"
kind = "nmos"
description = "BSS138 N-channel MOSFET SOT-23, 50V, 200mA, Vth≈1.5V"

[models.match]
# Package/config-suffix variants of the same logic-level N-MOSFET die:
# BSS138 (SOT-23), BSS138W (SOT-323), BSS138PS (dual SOT-363), BSS138-7-F,
# BSS138BK/K/P. Suffix space is package codes, so the suffixed parts share
# this die's model. "BSS138" is a specific, complete prefix, no unrelated
# device shares it, so the trailing-$ relax cannot mis-bind.
value_re = "(?i)^BSS138[A-Z0-9-]*$"

[models.params]
# Source for capacitances and ratings: Fairchild "BSS138 N-Channel Logic Level
# Enhancement Mode Field Effect Transistor", BSS138 Rev C(W), October 2005
# (copy read: https://cdn.sparkfun.com/datasheets/BreakoutBoards/BSS138.pdf;
# now onsemi bss138-d.pdf). The ratings below (50 V, 0.22 A, 0.36 W, 3.5/6.0
# ohm, VGS(th) max 1.5 V) are this Fairchild die; Nexperia's BSS138 parts are
# the 60 V BSS138P/BK, a different die.
# The old citation "Nexperia BSS138 datasheet Rev. 5, SPICE model" was not
# located and no Nexperia/Fairchild BSS138 datasheet prints SPICE parameters:
# vto/kp/lambda/rd/rs are legacy values with no located source (vto = 1.5 is
# the Fairchild VGS(th) MAX, typ is 1.3 V @ ID=1mA).
vto    = 1.5
kp     = 0.052
lambda = 0.02
rd     = 2.0
rs     = 0.5
cgd    = 6.0e-12  # Fairchild BSS138 Rev C(W), Dynamic Characteristics, Crss typ 6 pF @ VDS=25V, VGS=0, f=1MHz (cgd = Crss)
cgs    = 2.1e-11  # same table/bias, Ciss typ 27 pF - Crss typ 6 pF = 21 pF (cgs = Ciss - Crss)

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
# Source: Fairchild BSS138 Rev C(W), Absolute Maximum Ratings (TA = 25 C) and
# Thermal Characteristics; Note 1a: 350 C/W mounted on a minimum pad.
max_current_a = 0.22       # ID continuous at TA = 25 C (Note 1), the tagged row below
max_surge_current_a = 0.88 # ID pulsed
max_power_w = 0.36         # PD at TA = 25 C (Note 1), derate 2.8 mW/C above 25 C
max_voltage_v = 50.0
max_junction_temp_c = 150.0  # TJ, TSTG -55 to +150 C
theta_ja_c_per_w = 350.0     # RthetaJA (Note 1a, minimum pad)
rds_on_vgs = 4.5   # RDS(on) rows are VGS=10V (3.5 ohm) and VGS=4.5V (6.0 ohm)
vgs_th_max = 1.5   # VGS(th) max @ VDS=VGS, ID=1mA (Fairchild Rev C(W), On Characteristics)
[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.characteristic]]
parameter = "ID drain current, continuous"
rating = "max_current_a"
max = 0.22
unit = "A"
conditions = "TA = 25 °C"
mounting = "minimum pad"
basis = "Fairchild BSS138 Rev C(W) (October 2005), Absolute Maximum Ratings, ID continuous (Note 1)"
[[models.source.characteristic]]
parameter = "ID drain current, pulsed"
max = 0.88
unit = "A"
conditions = "pulsed, TA = 25 °C"
basis = "Fairchild BSS138 Rev C(W) (October 2005), Absolute Maximum Ratings, ID pulsed"
[[models.source.characteristic]]
parameter = "PD maximum power dissipation"
rating = "max_power_w"
max = 0.36
unit = "W"
conditions = "TA = 25 °C"
mounting = "minimum pad"
basis = "Fairchild BSS138 Rev C(W) (October 2005), Absolute Maximum Ratings, PD (Note 1); derate 2.8 mW/°C above 25 °C"
[[models.source.characteristic]]
parameter = "RθJA thermal resistance, junction-to-ambient"
rating = "theta_ja_c_per_w"
max = 350.0
unit = "°C/W"
conditions = "mounted on a minimum pad"
mounting = "minimum pad"
basis = "Fairchild BSS138 Rev C(W) (October 2005), Thermal Characteristics, RθJA (Note 1a)"

# ─────────────────────────────────────────────────────────────────────────────
# AO3400A: Alpha & Omega Semiconductor N-channel trench MOSFET, SOT-23.
# Source: AOS "AO3400A 30V N-Channel MOSFET" datasheet, Rev 3.1 July 2023
#   (www.aosmd.com/res/datasheets/AO3400A.pdf).
# AOS publishes no redistributable SPICE card for this part, so the level-1
# params below are derived from the datasheet's own stated test points, and the
# derivation is recorded here so it can be re-checked.
#
# Datasheet figures used (Electrical Characteristics, TJ=25C):
#   VGS(th) = 0.65 / 1.05 / 1.45 V     @ VDS=VGS, ID=250 mA        -> vto
#   RDS(on) typ 18 mOhm  (max 26.5)    @ VGS=10 V,  ID=5.7 A
#   RDS(on) typ 19 mOhm  (max 32)      @ VGS=4.5 V, ID=5 A
#   RDS(on) typ 24 mOhm  (max 48)      @ VGS=2.5 V, ID=3 A
#   gFS     typ 33 S                   @ VDS=5 V, ID=5.7 A
#   Ciss 630 pF / Coss 75 pF / Crss 50 pF @ VGS=0, VDS=15 V, f=1 MHz
#   VSD typ 0.7 V (max 1 V) @ IS=1 A
#
# kp: two independent routes agree, which is why we trust the number.
#   (a) from gFS: level-1 saturation gm = sqrt(2*kp*ID), so
#       kp = gFS^2 / (2*ID) = 33^2 / (2*5.7) = 95.5 A/V^2.
#   (b) from the two extreme RDS(on) points: on-resistance is modelled as
#       channel + ohmic, R(VGS) = 1/(kp*(VGS-vto)) + (rd+rs). Subtracting the
#       VGS=10 V and VGS=2.5 V rows eliminates (rd+rs) and gives
#       kp = (1/1.45 - 1/8.95) / (0.024 - 0.018) = 96.3 A/V^2.
#   The two disagree by under 1%, so kp = 96.0 is used.
# rd+rs: the residue at the VGS=10 V row, 0.018 - 1/(96*8.95) = 16.8 mOhm,
#   split evenly between drain and source as the sibling entries do.
# VALIDATED: with those numbers the model predicts RDS(on) = 19.8 mOhm at
#   VGS=4.5 V (datasheet typ 19) and 24.0 mOhm at VGS=2.5 V (datasheet typ 24).
#   The 4.5 V row was NOT used in the fit, so it is a genuine out-of-sample
#   check; tests/ao3400a_cj2301_s8050.rs pins all three.
# NOT MODELLED: the body diode (VSD is on the datasheet but `body_is` is left
#   at the engine default of 0, matching every other MOSFET entry in this file),
#   and `lambda`, which no datasheet states.
[[models]]
id = "ao3400a"
kind = "nmos"
description = "AO3400A N-channel MOSFET SOT-23, 30V, 5.7A, Rds(on) 18mOhm typ @ Vgs=10V"

[models.match]
# Same N-channel trench die across suffixes: AO3400, AO3400A, AO3400L. The
# P-channel AO3401/AO3401A starts "AO3401" and is correctly rejected, so this
# cannot mis-bind to the opposite polarity.
value_re = "(?i)^AO3400[A-Z0-9-]*$"

[models.params]
# Source: AOS AO3400A datasheet Rev 3.1 July 2023, Electrical Characteristics.
vto    = 1.05      # VGS(th) typ (V) @ VDS=VGS, ID=250mA (min 0.65, max 1.45)
kp     = 96.0      # A/V², from gFS=33S @ ID=5.7A and the RDS(on) pair (see above)
rd     = 0.0084    # half the 16.8 mOhm ohmic residue of RDS(on) @ VGS=10V
rs     = 0.0084    # other half
cgd    = 5.0e-11   # AO3400A Rev 3.1, Electrical Characteristics, DYNAMIC PARAMETERS, Crss typ 50 pF @ VGS=0, VDS=15V, 1MHz (cgd = Crss)
cgs    = 5.8e-10   # same table/bias, Ciss typ 630 pF - Crss typ 50 pF = 580 pF (cgs = Ciss - Crss)

[models.pins]
# SOT-23 (AOS datasheet package drawing, top view): 1=Gate, 2=Source, 3=Drain.
# This is also the KiCad Package_TO_SOT_SMD:SOT-23 / Q_NMOS_GSD numbering, so
# the map is explicit rather than inferred by the SOT-23 pin rule.
"1" = "gate"
"2" = "source"
"3" = "drain"

[models.ratings]
# Source: AOS AO3400A datasheet Rev 3.1, Absolute Maximum Ratings TA=25C.
max_current_a       = 4.7     # ID continuous at TA=70C (A), the least favourable
                              # tagged row below (5.7 A at TA=25C)
max_surge_current_a = 30.0    # IDM pulsed (A)
max_power_w         = 1.4     # PD at TA=25C (W). Rev 3.1 Note B (p.2): PD is
                              # derived from the t<=10s RthJA (90 max), so it is a
                              # short-duration figure (125 C / 1.4 W = 89 C/W); the
                              # steady-state RthJA below is the one for the thermal
                              # estimate, so the two are not meant to agree.
max_voltage_v       = 30.0    # VDS (V)
theta_ja_c_per_w    = 125.0   # RthJA steady-state max (typ 100; the t<=10s row is 70 typ /
                              # 90 max), Note A: 1 in2 FR-4, 2 oz copper, still air. The
                              # tagged row below; was the 100 typ, not the least favourable.
max_junction_temp_c = 150.0   # TJ max (C)
rds_on_vgs          = 2.5     # lowest RDS(on) row: 24 mOhm typ / 48 max @ VGS=2.5V, ID=3A
vgs_th_max          = 1.45    # VGS(th) max @ VDS=VGS, ID=250mA
[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.characteristic]]
parameter = "ID continuous drain current"
rating = "max_current_a"
max = 5.7
unit = "A"
conditions = "TA = 25 °C"
basis = "AO3400A Rev 3.1, Absolute Maximum Ratings, ID, TA=25°C"
[[models.source.characteristic]]
parameter = "ID continuous drain current"
rating = "max_current_a"
max = 4.7
unit = "A"
conditions = "TA = 70 °C"
basis = "AO3400A Rev 3.1, Absolute Maximum Ratings, ID, TA=70°C"
[[models.source.characteristic]]
parameter = "PD power dissipation"
max = 1.4
unit = "W"
conditions = "TA = 25 °C; Note B: based on TJ(MAX) = 150 °C using the t ≤ 10 s RθJA"
basis = "AO3400A Rev 3.1, Absolute Maximum Ratings, PD, TA=25°C; untagged: Note B makes it a t ≤ 10 s figure, not a continuous rating"
[[models.source.characteristic]]
parameter = "PD power dissipation"
max = 0.9
unit = "W"
conditions = "TA = 70 °C; Note B: based on TJ(MAX) = 150 °C using the t ≤ 10 s RθJA"
basis = "AO3400A Rev 3.1, Absolute Maximum Ratings, PD, TA=70°C; untagged: Note B makes it a t ≤ 10 s figure, not a continuous rating"
[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient, t ≤ 10 s"
typ = 70.0
max = 90.0
unit = "°C/W"
conditions = "t ≤ 10 s; Note A: 1 in² FR-4 board, 2 oz copper, still air, TA = 25 °C"
basis = "AO3400A Rev 3.1, Thermal Characteristics, RθJA t ≤ 10s, typ/max columns"
[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient, steady state"
rating = "theta_ja_c_per_w"
typ = 100.0
max = 125.0
unit = "°C/W"
conditions = "steady state; Note A: 1 in² FR-4 board, 2 oz copper, still air, TA = 25 °C"
mounting = "1 in² FR-4, 2 oz copper"
basis = "AO3400A Rev 3.1, Thermal Characteristics, RθJA Steady-State, typ/max columns (Notes A, D)"

