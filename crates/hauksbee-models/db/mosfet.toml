# ── PMZ550UNE ─────────────────────────────────────────────────────────────────
# Nexperia, N-channel trench, SOT-883 / DFN1006-3. MNT Reform. The board value
# is PMZ550UNEYL; YL is a packing suffix on the same datasheet.
# Source: Nexperia PMZ550UNE product data sheet v.1, released 25 March 2015
#   (https://assets.nexperia.com/documents/data-sheet/PMZ550UNE.pdf).
# Vendor SPICE file: https://assets.nexperia.com/documents/spice-model/PMZ550UNE.lib
#   (Transim-generated subcircuit, "Date Created Thu Feb 12 03:33:29 2015");
#   both fetched and re-read 2026-09-25.
# Datasheet figures used (Characteristics, Tj=25 C):
#   VGS(th) = 0.45 / 0.7 / 0.95 V      @ VDS=VGS, ID=250 uA
#   RDS(on) typ 550 mOhm (max 670)     @ VGS=4.5 V, ID=590 mA
#   RDS(on) typ 660 mOhm (max 900)     @ VGS=2.5 V, ID=590 mA
#   RDS(on) typ 770 mOhm (max 1120)    @ VGS=1.8 V, ID=80 mA
#   RDS(on) typ 890 mOhm (max 1500)    @ VGS=1.5 V, ID=10 mA
#   gFS     typ 600 mS                 @ VDS=10 V, ID=590 mA
#   Ciss 30.3 / Coss 5.8 / Crss 4.2 pF @ VDS=15 V, VGS=0, f=1 MHz
#   VSD typ 0.86 V (max 1.2) @ IS=380 mA
# VENDOR SPICE CARD COMPARED, NOT COPIED: PMZ550UNE.lib, LEVEL=3
#   (Vto=0.74984, Kp=4.5323, Nfs=2.125e11, Eta=2000, Vmax=600). Its Vto = 0.7498
#   corroborates the datasheet typ of 0.7, and its Kp = 4.53 supports the
#   conduction route below over the transconductance one.
#
# kp: the routes disagree 9.5x, the worst split in the batch, and route (a) is
#   REJECTED as unphysical.
#   (a) 0.6^2/(2*0.59) = 0.30508, which forces rd+rs = 0.550 - 1/(0.30508*3.8)
#       = -0.3126 Ohm and back-predicts 3.78 Ohm at VGS=1.5 V against a
#       datasheet 0.89 (+325%). A quoted gFS of 600 mS is implausibly low for a
#       die that carries 590 mA through 550 mOhm.
#   (b) widest pair, 1.5 V and 4.5 V: (1/0.8 - 1/3.8)/(0.890 - 0.550)
#       = (1.25000 - 0.26316)/0.34 = 2.9025. The vendor card's level-3
#       Kp = 4.53 is the same order; 0.305 is nowhere near it.
# rd+rs = 0.550 - 1/(2.9025*3.8) = 0.45933 Ohm, split evenly.
# VALIDATED OUT OF SAMPLE ON TWO INDEPENDENT ROWS, the best-tested entry here.
#   Fitted on 1.5 V and 4.5 V only:
#     VGS=1.8 V: predicted 1/(2.9025*1.1) + 0.45933 = 0.77255 Ohm vs typ 0.770,
#                +0.3%
#     VGS=2.5 V: predicted 1/(2.9025*1.8) + 0.45933 = 0.65074 Ohm vs typ 0.660,
#                -1.4%
#   The gFS cross-check is a deliberate, documented miss in the other direction:
#   implied gm 1.85 S against a quoted 0.6 S.
[[models]]
