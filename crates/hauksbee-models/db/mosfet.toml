# ═════════════════════════════════════════════════════════════════════════════
# The corpus batch. Nine SOT-23-class switches that between them account for the
# unresolved MOSFETs on the MNT Reform, Olimex, KiCad-demo and Hunt boards.
#
# EVERY ENTRY BELOW USES THE SAME FIT RECIPE AS ao3400a ABOVE, so read that
# derivation first; it is written out in full there and only the arithmetic is
# repeated here. In short:
#   vto  = VGS(th) typ (negative for P-channel)
#   kp   route (a), from transconductance: gm = sqrt(2*kp*ID) => kp = gFS^2/(2*ID)
#   kp   route (b), from two RDS(on) rows, modelling R = 1/(kp*(VGS-vto)) + (rd+rs):
#          kp = (1/(VGS_lo-vto) - 1/(VGS_hi-vto)) / (R_lo - R_hi)
#   rd+rs = the residue at the highest-VGS row, split evenly
#   cgd  = Crss,  cgs = Ciss - Crss
#
# WHERE THE VENDOR PUBLISHES A SPICE CARD, IT WAS FETCHED AND COMPARED, and the
# comparison is recorded per entry. Four of these nine have one:
#   IRLML6402   irlml6402.spi   genuinely LEVEL=1  -> we use the VENDOR's card
#   PMV50ENEA   PMV50ENEA.lib   LEVEL=3            -> compared, not copied
#   PMV50EPEA   PMV50EPEA.lib   LEVEL=3            -> compared, not copied
#   PMZ550UNE   PMZ550UNE.lib   LEVEL=3            -> compared, not copied
# A LEVEL=3 card's Kp is a different quantity from a level-1 Kp (level 3 carries
# Nfs, Eta, Vmax and a nonlinear CGD table that absorb part of the fit), so its
# value is NOT transcribable into a level-1 entry. What it IS good for is a
# sanity check on order of magnitude, and one exact confirmation: Nexperia's
# PMV50ENEA card contains `CGS 2.34e-10`, which is Ciss - Crss = 276 - 42 pF to
# three digits, independently confirming the cgs rule this file uses.
#
# HONESTY ABOUT VALIDATION, because it varies a lot across these nine. A fit to
# two RDS(on) rows can only be checked out-of-sample if the datasheet publishes
# a THIRD row at 25 C. Three of these do (DMG1012T-7, PMZ550UNE, CJ3134K) and
# each entry states its out-of-sample error. The other six publish exactly two
# rows, both consumed by the fit, and for those the only independent check is
# the gFS cross-check, which is stated instead. Where the two routes disagree
# badly the entry says so and says which was chosen and why. This is the same
# trade the cj2301 entry above already documents: a level-1 square law cannot
# always satisfy an on-resistance pair and a saturation transconductance at
# once, and for a part used as a switch, conduction is the right thing to keep.

# ── FDV301N ───────────────────────────────────────────────────────────────────
# onsemi digital FET, N-channel, SOT-23. 32 instances on the KiCad demo boards.
# Source: onsemi FDV301N datasheet FDV301N/D Rev. 10, May 2025
#   (capacitances re-verified 2026-09-25 against a local copy of that
#   revision).
# Datasheet figures used (ON Characteristics, TJ=25 C):
#   VGS(th) = 0.70 / 0.85 / 1.06 V   @ VDS=VGS, ID=250 uA          -> vto
#   RDS(on) typ 3.8 Ohm (max 5)      @ VGS=2.7 V, ID=0.2 A
#   RDS(on) typ 3.1 Ohm (max 4)      @ VGS=4.5 V, ID=0.4 A
#   gFS     typ 0.2 S                @ VDS=5 V, ID=0.4 A
#   Ciss 9.5 / Coss 6 / Crss 1.3 pF  @ VDS=10 V, VGS=0, f=1 MHz
#   VSD typ 0.8 V (max 1.2) @ VGS=0, IS=0.29 A
# No vendor SPICE model: onsemi's model finder returns nothing for this part.
#
# kp: the two routes disagree by 7.6x and route (a) is REJECTED as unphysical.
#   (a) kp = 0.2^2/(2*0.4) = 0.05, which forces rd+rs = 3.1 - 1/(0.05*3.65)
#       = -2.38 Ohm. A negative ohmic resistance is not a model, it is a
#       contradiction, and it back-predicts 8.43 Ohm at the 2.7 V row against a
#       datasheet 3.8 (+122%). The quoted gFS = 0.2 S cannot coexist with a
#       3.1 Ohm on-resistance under a square law on a die this small.
#   (b) kp = (1/1.85 - 1/3.65)/(3.8 - 3.1) = (0.54054 - 0.27397)/0.7 = 0.38081.
#   Route (b) it is.
# rd+rs = 3.1 - 1/(0.38081*3.65) = 2.3806 Ohm, split evenly.
# NOT VALIDATED OUT OF SAMPLE: only two 25 C RDS(on) rows exist and both are in
#   the fit. The gFS cross-check is a MISS: kp=0.38081 implies gm =
#   sqrt(2*0.38081*0.4) = 0.552 S against a datasheet 0.2 S, +176%. This entry
#   is on-resistance-accurate and transconductance-optimistic. Do not use it to
#   predict small-signal gain.
[[models]]
id = "fdv301n"
kind = "nmos"
description = "FDV301N N-channel digital FET SOT-23, 25V, 220mA, Rds(on) 3.1 Ohm typ @ Vgs=4.5V"

[models.match]
value_re = "(?i)^FDV301N[A-Z0-9-]*$"

[models.params]
vto    = 0.85     # VGS(th) typ
kp     = 0.38081  # from the two RDS(on) rows, see the derivation above
rd     = 1.1903   # half the fitted ohmic residue
rs     = 1.1903
cgd    = 1.3e-12  # Crss typ 1.3 pF, FDV301N/D Rev. 10 Dynamic Characteristics, VDS = 10 V, VGS = 0, f = 1 MHz
cgs    = 8.2e-12  # Ciss typ - Crss typ = 9.5 - 1.3 = 8.2 pF, same row group and bias
# lambda deliberately absent: the datasheet publishes no output-conductance data.

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
max_current_a = 0.22        # ID continuous, TA=25 C, the tagged row below
max_surge_current_a = 0.5   # ID pulsed
max_power_w = 0.35
max_voltage_v = 25.0        # VDS (VGS is -0.3 to +8 V)
max_junction_temp_c = 150.0
theta_ja_c_per_w = 357.0
rds_on_vgs = 2.7   # lowest RDS(on) row (3.8 ohm typ / 5 max @ VGS=2.7V)
vgs_th_max = 1.06  # VGS(th) max @ VDS=VGS, ID=250uA
[models.source]
