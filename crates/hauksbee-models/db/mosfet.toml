kp     = 12.788      # KP
lambda = 0.0111358   # LAMBDA, the only vendor-published lambda in this file
rs     = 0.0246704   # RS
rd     = 0.0001      # RD
# Capacitances: see the CAPACITANCES note above.
cgd    = 1.1e-10     # datasheet Crss typ 110 pF, Electrical Characteristics, VGS = 0, VDS = -10 V, f = 1 MHz
cgs    = 5.361e-10   # vendor .spi CGSO * W = 5.36099e-06 F/m * 100e-6 m = 536.1 pF;
                     # datasheet Ciss typ - Crss typ = 633 - 110 = 523 pF, same bias (vendor +2.5%)

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
max_current_a = 2.2         # |ID| at TA=70 C, VGS=-4.5 V, the least favourable
                            # tagged row below (3.7 A at TA=25 C)
max_surge_current_a = 22.0  # |IDM|
max_power_w = 0.8           # PD at TA=70 C, 1 in^2 single-layer 1 oz Cu FR4, the
                            # least favourable tagged row below (1.3 W at 25 C)
