rs     = 0.0065    # legacy, as rd
cgd    = 5.0e-11   # Doc 77800 Rev. B, SPECIFICATIONS, Dynamic, Crss typ 50 pF @ VDS=30V, VGS=0, f=1MHz (cgd = Crss)
cgs    = 3.2e-9    # same table/bias, Ciss typ 3250 pF - Crss typ 50 pF = 3200 pF (cgs = Ciss - Crss)

