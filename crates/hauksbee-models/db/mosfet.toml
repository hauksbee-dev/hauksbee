# FDS4435BZ / FDS4435BZ_F085: Fairchild (now onsemi) P-channel PowerTrench
# MOSFET, SO-8.  The pedalboard source uses the automotive-suffix sheet and the
# exact FDS4435BZ ordering code.  Source: Fairchild Semiconductor data sheet
# FDS4435BZ_F085, Rev. A, July 2009 (onsemi document fds4435bz_f085-d.pdf).
# The automated onsemi endpoint currently refuses non-browser downloads; the
# exact audited Fairchild/onsemi PDF copy has SHA-256
# fe08ddc4992462830d4435510c03da85af4fe785ed4d519d01b98029df220228.
# Capacitance cross-check (2026-09 audit): the non-automotive sheet Fairchild
# "FDS4435BZ P-Channel PowerTrench MOSFET", FDS4435BZ Rev.C1, April 2009
# (https://www.farnell.com/datasheets/673294.pdf) prints the same static rows
# and Ciss 1385/1845, Crss 230/345 pF (typ/max) @ VDS=-15V, VGS=0, 1MHz.
#
# The level-1 DC fit is source-bound rather than a generic package estimate:
#   VGS(th) = -1.0 / -2.1 / -3.0 V @ ID=-250uA
#   RDS(on) typ 16mOhm @ VGS=-10V; typ 26mOhm @ VGS=-4.5V
#   gFS typ 24S @ ID=-8.8A
# Solving R(VGS)=1/(kp*(|VGS|-|vto|))+(rd+rs) against the two RDS rows gives
# kp=29.0 A/V^2 and rd+rs=11.64mOhm.  The independent transconductance check is
# sqrt(2*29*8.8)=22.6S, within 6% of the stated 24S.  This is therefore a good
# averaged/conduction model, but it is not a switching-loss or SOA model.
[[models]]
id = "fds4435bz"
kind = "pmos"
description = "FDS4435BZ P-channel SO-8 MOSFET, -30V, -8.8A, source-bound level-1 DC fit"

