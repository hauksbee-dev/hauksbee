# MOSFET models.
# Level-1 SPICE params: vto (V), kp (A/V²), lambda (1/V), gamma (V^0.5),
# phi (V), rd (Ω), rs (Ω), cbd (F), cbs (F), cgd (F), cgs (F).

# ── N-channel ─────────────────────────────────────────────────────────────────

[[models]]
id = "2n7002"
kind = "nmos"
description = "2N7002 N-channel MOSFET SOT-23, 60V, 300mA, Vth≈2.5V"

[models.match]
# Package/config-suffix variants of the same N-MOSFET die: 2N7002K, 2N7002P,
# 2N7002E, 2N7002W (SOT-323), 2N7002DW (dual SOT-363). "2N7002" is a complete
# prefix; the different-die 2N7000 starts "2N7000" and is correctly rejected.
value_re = "(?i)^2N7002[A-Z0-9-]*$"

[models.params]
# Source: Nexperia 2N7002 datasheet Rev. 4 2021, SPICE model
vto    = 2.5      # threshold voltage (V)
kp     = 0.04     # transconductance parameter (A/V²), k'*(W/L)
lambda = 0.01     # channel-length modulation (1/V)
rd     = 2.0      # drain ohmic resistance (Ω)
rs     = 0.5      # source ohmic resistance (Ω)
cgd    = 3.0e-13  # gate-drain capacitance (F)
cgs    = 5.0e-13  # gate-source capacitance (F)

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
max_current_a = 0.3        # ID continuous (Nexperia)
max_surge_current_a = 0.8  # ID pulsed
max_power_w = 0.35
max_voltage_v = 60.0  # VDS

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "bss138"
kind = "nmos"
description = "BSS138 N-channel MOSFET SOT-23, 50V, 200mA, Vth≈1.5V"

[models.match]
# Package/config-suffix variants of the same logic-level N-MOSFET die:
# BSS138 (SOT-23), BSS138W (SOT-323), BSS138PS (dual SOT-363), BSS138-7-F,
# BSS138BK/K/P. Suffix space is package codes, so the suffixed parts share
# this die's model. "BSS138" is a specific, complete prefix, no unrelated
# device shares it, so the trailing-$ relax cannot mis-bind.
value_re = "(?i)^BSS138[A-Z0-9-]*$"

[models.params]
# Source: Nexperia BSS138 datasheet Rev. 5, SPICE model
vto    = 1.5
kp     = 0.052
lambda = 0.02
rd     = 2.0
rs     = 0.5
cgd    = 2.0e-13
cgs    = 4.0e-13

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
max_current_a = 0.2
max_power_w = 0.36
max_voltage_v = 50.0

# ─────────────────────────────────────────────────────────────────────────────
# AO3400A: Alpha & Omega Semiconductor N-channel trench MOSFET, SOT-23.
# Source: AOS "AO3400A 30V N-Channel MOSFET" datasheet, Rev 3.1 July 2023
#   (www.aosmd.com/res/datasheets/AO3400A.pdf).
# AOS publishes no redistributable SPICE card for this part, so the level-1
# params below are derived from the datasheet's own stated test points, and the
# derivation is recorded here so it can be re-checked.
#
# Datasheet figures used (Electrical Characteristics, TJ=25C):
#   VGS(th) = 0.65 / 1.05 / 1.45 V     @ VDS=VGS, ID=250 mA        -> vto
#   RDS(on) typ 18 mOhm  (max 26.5)    @ VGS=10 V,  ID=5.7 A
#   RDS(on) typ 19 mOhm  (max 32)      @ VGS=4.5 V, ID=5 A
#   RDS(on) typ 24 mOhm  (max 48)      @ VGS=2.5 V, ID=3 A
#   gFS     typ 33 S                   @ VDS=5 V, ID=5.7 A
#   Ciss 630 pF / Coss 75 pF / Crss 50 pF @ VGS=0, VDS=15 V, f=1 MHz
#   VSD typ 0.7 V (max 1 V) @ IS=1 A
#
# kp: two independent routes agree, which is why we trust the number.
#   (a) from gFS: level-1 saturation gm = sqrt(2*kp*ID), so
#       kp = gFS^2 / (2*ID) = 33^2 / (2*5.7) = 95.5 A/V^2.
#   (b) from the two extreme RDS(on) points: on-resistance is modelled as
#       channel + ohmic, R(VGS) = 1/(kp*(VGS-vto)) + (rd+rs). Subtracting the
#       VGS=10 V and VGS=2.5 V rows eliminates (rd+rs) and gives
#       kp = (1/1.45 - 1/8.95) / (0.024 - 0.018) = 96.3 A/V^2.
#   The two disagree by under 1%, so kp = 96.0 is used.
# rd+rs: the residue at the VGS=10 V row, 0.018 - 1/(96*8.95) = 16.8 mOhm,
#   split evenly between drain and source as the sibling entries do.
# VALIDATED: with those numbers the model predicts RDS(on) = 19.8 mOhm at
#   VGS=4.5 V (datasheet typ 19) and 24.0 mOhm at VGS=2.5 V (datasheet typ 24).
#   The 4.5 V row was NOT used in the fit, so it is a genuine out-of-sample
#   check; tests/ao3400a_cj2301_s8050.rs pins all three.
# NOT MODELLED: the body diode (VSD is on the datasheet but `body_is` is left
#   at the engine default of 0, matching every other MOSFET entry in this file),
#   and `lambda`, which no datasheet states.
[[models]]
id = "ao3400a"
kind = "nmos"
description = "AO3400A N-channel MOSFET SOT-23, 30V, 5.7A, Rds(on) 18mOhm typ @ Vgs=10V"

[models.match]
# Same N-channel trench die across suffixes: AO3400, AO3400A, AO3400L. The
# P-channel AO3401/AO3401A starts "AO3401" and is correctly rejected, so this
# cannot mis-bind to the opposite polarity.
value_re = "(?i)^AO3400[A-Z0-9-]*$"

[models.params]
# Source: AOS AO3400A datasheet Rev 3.1 July 2023, Electrical Characteristics.
vto    = 1.05      # VGS(th) typ (V) @ VDS=VGS, ID=250mA (min 0.65, max 1.45)
kp     = 96.0      # A/V², from gFS=33S @ ID=5.7A and the RDS(on) pair (see above)
rd     = 0.0084    # half the 16.8 mOhm ohmic residue of RDS(on) @ VGS=10V
rs     = 0.0084    # other half
cgd    = 5.0e-11   # = Crss, 50 pF @ VGS=0, VDS=15V, 1MHz
cgs    = 5.8e-10   # = Ciss - Crss = 630 - 50 = 580 pF, same test condition

[models.pins]
# SOT-23 (AOS datasheet package drawing, top view): 1=Gate, 2=Source, 3=Drain.
# This is also the KiCad Package_TO_SOT_SMD:SOT-23 / Q_NMOS_GSD numbering, so
# the map is explicit rather than inferred by the SOT-23 pin rule.
"1" = "gate"
"2" = "source"
"3" = "drain"

[models.ratings]
# Source: AOS AO3400A datasheet Rev 3.1, Absolute Maximum Ratings TA=25C.
max_current_a       = 5.7     # ID continuous at TA=25C (A)
max_surge_current_a = 30.0    # IDM pulsed (A)
max_power_w         = 1.4     # PD at TA=25C (W)
max_voltage_v       = 30.0    # VDS (V)
theta_ja_c_per_w    = 100.0   # RthJA steady-state typ (max 125; the t<=10s value is 70)
max_junction_temp_c = 150.0   # TJ max (C)

# ─────────────────────────────────────────────────────────────────────────────

# ── P-channel ─────────────────────────────────────────────────────────────────

[[models]]
id = "ao3401a"
kind = "pmos"
description = "AO3401A P-channel MOSFET SOT-23, 30V, 4A, Vth≈−1V"

[models.match]
# Same P-MOSFET die across suffixes: AO3401, AO3401A, AO3401AL. The N-channel
# AO3400 starts "AO3400" and is correctly rejected, so this cannot mis-bind.
value_re = "(?i)^AO3401[A-Z0-9-]*$"

[models.params]
# Source: Alpha & Omega AO3401A datasheet, SPICE parameters
vto    = -1.1     # threshold voltage (V), negative for PMOS
kp     = 4.5      # transconductance (A/V²)
lambda = 0.04
rd     = 0.08
rs     = 0.02
cgd    = 6.0e-13
cgs    = 1.0e-12

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
max_current_a = 4.0
max_power_w = 1.4
max_voltage_v = 30.0

# ─────────────────────────────────────────────────────────────────────────────
# CJ2301: Jiangsu Changjing (JSCJ) P-channel trench MOSFET, SOT-23.
# Source: JSCJ "CJ2301 P-Channel 20-V(D-S) MOSFET" datasheet, Rev. - 2.1
#   (www.jscj-elec.com; the copy read is evelta.com/content/datasheets/217-CJ2301.pdf).
# JSCJ publishes no SPICE card, so the level-1 params are derived from the
# datasheet's stated test points and the derivation is recorded here.
#
# Datasheet figures used (MOSFET Electrical Characteristics, Ta=25C):
#   VGS(th) = -0.4 / -0.7 / -1.0 V     @ VDS=VGS, ID=-250 uA        -> vto
#   RDS(on) typ 0.090 Ohm (max 0.112)  @ VGS=-4.5 V, ID=-2.8 A
#   RDS(on) typ 0.110 Ohm (max 0.142)  @ VGS=-2.5 V, ID=-2.0 A
#   gfs typ 6.5 S                      @ VDS=-5 V, ID=-2.8 A
#   Ciss 405 pF / Coss 75 pF / Crss 55 pF @ VDS=-10 V, VGS=0, f=1 MHz
#   VSD typ -0.8 V (max -1.2 V) @ IS=-0.7 A
#
# kp and rd+rs are solved from the two RDS(on) rows against
# R(VGS) = 1/(kp*(|VGS|-|vto|)) + (rd+rs):
#   kp    = (1/1.8 - 1/3.8) / (0.110 - 0.090) = 14.6 A/V^2
#   rd+rs = 0.090 - 1/(14.6*3.8)              = 0.072 Ohm, split evenly.
# DELIBERATE CHOICE, recorded because it is a real approximation: this fit
# implies gm = sqrt(2*kp*2.8) = 9.0 S at the gfs test point, where the
# datasheet says 6.5 S. A level-1 square law cannot satisfy both the
# on-resistance pair and the saturation transconductance, and this part is used
# as a load switch (Watchy Q1), so on-resistance is the fidelity target. The
# AO3400A entry above is the happy case where both routes agree.
# NOT MODELLED: the body diode (`body_is` left at the engine default 0, as
# elsewhere in this file) and `lambda`, which the datasheet does not state.
#
# NOTE ON THE BOARD: the KiCad symbol on Watchy carries the description
# "2A Id, 20V Vds, P-Channel MOSFET, 70mOhm Ron". The 70 mOhm is the symbol
# library's generic blurb, not this die; the datasheet's own figure is 90 mOhm
# typ / 112 mOhm max at VGS=-4.5 V, and the datasheet wins.
[[models]]
id = "cj2301"
kind = "pmos"
description = "CJ2301 P-channel MOSFET SOT-23, -20V, -2.3A, Rds(on) 90mOhm typ @ Vgs=-4.5V"

[models.match]
# Package/lot-suffix variants of the same die: CJ2301, CJ2301-S1 (the LCSC
# ordering code). "CJ2301" is a complete prefix and no other JSCJ part shares
# it, so the relaxed suffix class cannot mis-bind.
value_re = "(?i)^CJ2301[A-Z0-9-]*$"

[models.params]
# Source: JSCJ CJ2301 datasheet Rev. - 2.1, Electrical Characteristics.
vto    = -0.7      # VGS(th) typ (V), negative for PMOS (min -0.4, max -1.0)
kp     = 14.6      # A/V², solved from the two RDS(on) rows (see above)
rd     = 0.036     # half the 72 mOhm ohmic residue
rs     = 0.036     # other half
cgd    = 5.5e-11   # = Crss, 55 pF @ VDS=-10V, VGS=0, 1MHz
cgs    = 3.5e-10   # = Ciss - Crss = 405 - 55 = 350 pF, same test condition

[models.pins]
# SOT-23, stated explicitly on datasheet page 1: 1. GATE, 2. SOURCE, 3. DRAIN.
"1" = "gate"
"2" = "source"
"3" = "drain"

[models.ratings]
# Source: JSCJ CJ2301 datasheet Rev. - 2.1, Maximum ratings (Ta=25C).
max_current_a       = 2.3     # ID continuous (A), magnitude of -2.3 A
max_surge_current_a = 10.0    # IDM pulsed (A), magnitude of -10 A
max_power_w         = 0.4     # PD (W)
max_voltage_v       = 20.0    # |VDS| (V)
theta_ja_c_per_w    = 312.5   # RthJA (C/W), datasheet value for t <= 5 s
max_junction_temp_c = 150.0   # TJ max (C)

# ── Generic power-FET fallback models ────────────────────────────────────────
#
# These two entries are GENERIC PLACEHOLDER catch-alls. They are NOT sourced
# from any specific datasheet. They exist so that any unmodeled power FET in a
# recognised power package binds to a sane Rds_on estimate and package ratings,
# enabling dissipation / Tj computation rather than binding open.
#
# Values chosen conservatively:
#   - Rds_on ~ 20 mOhm split equally rd/rs, representative of a medium-tier
#     power FET in a DPAK/D2PAK/TO-220/TO-252/TO-263/PowerPAK/PQFN/LFPAK
#     package. Real parts range ~2-100 mOhm; 20 mOhm is a mid-conservative pick.
#   - kp generous (modeled as a hard switch): full turn-on assumed at Vgs=10V.
#   - Ratings are the lowest common denominator for the package class:
#     20 A / 30 V / 30 W. A real part almost certainly has higher ratings;
#     the defaults are chosen to avoid false-positive overrating flags on an
#     unknown part.
#   - theta_ja ~ 50 C/W typical for TO-252/DPAK in still air (datasheet range
#     40-65 C/W); use the middle as a representative estimate.
#   - max_junction_temp_c = 150 C, typical for silicon power FETs.
#
# SPECIFICITY: footprint_re only (score = 5). Any entry with a value_re or
# mpn_re will outscore this catch-all automatically.
#
# HOW TO OVERRIDE: add an [[models]] entry with a value_re = "(?i)^<PART>$"
# in mosfet.toml (or a user TOML directory). The specificity scorer will prefer
# any value-matched entry over this footprint-only catch-all.

[[models]]
id = "generic_nmos_power_pkg"
kind = "nmos"
description = "Generic N-ch power FET fallback (DPAK/D2PAK/TO-220/TO-252/TO-263/PowerPAK/LFPAK), PLACEHOLDER, not datasheet-sourced"

[models.match]
# Matches common SMD and THT power-FET packages by footprint string.
# Covers KiCad footprint library names for: DPAK (TO-252), D2PAK (TO-263),
# TO-220, PowerPAK SO-8, PQFN, TDSON, LFPAK33/56/88, and SO-8 power variants.
footprint_re = "(?i)(DPAK|D2PAK|TO[_-]252|TO[_-]263|TO[_-]220|PowerPAK|PQFN|TDSON|LFPAK|SOT[_-]669|DFN[_-]8)"

[models.params]
# GENERIC PLACEHOLDER, representative of a medium Rds_on power FET.
# rd + rs sum to ~20 mOhm (0.020 ohm) Rds_on at Vgs=10V.
# These are NOT datasheet values for any specific part.
vto    = 3.0       # threshold voltage (V), typical for standard-threshold N-ch power FET
kp     = 10.0      # generous kp so FET acts as a low-loss switch when on (A/V²)
lambda = 0.01      # channel-length modulation, representative (1/V)
rd     = 0.010     # drain resistance portion of Rds_on, ~10 mOhm
rs     = 0.010     # source resistance portion of Rds_on, ~10 mOhm

[models.pins]
"G" = "gate"
"S" = "source"
"D" = "drain"

[models.ratings]
# Conservative package-class ratings for DPAK/D2PAK/TO-252 family.
# GENERIC: a real part will almost certainly have higher ratings.
# Used only for dissipation/Tj estimation when the real datasheet is absent.
max_current_a       = 20.0    # Id continuous, conservative for this package class (A)
max_surge_current_a = 60.0    # Id pulsed estimate (3x continuous, generic)
max_power_w         = 30.0    # Pd TO-252/DPAK range ~2.5-40W; 30W is mid-conservative
max_voltage_v       = 30.0    # Vds, conservatively low (real parts typically 20-650V)
theta_ja_c_per_w    = 50.0    # still-air TO-252 estimate, representative (C/W)
max_junction_temp_c = 150.0   # standard silicon power-FET junction limit

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "generic_pmos_power_pkg"
kind = "pmos"
description = "Generic P-ch power FET fallback (DPAK/D2PAK/TO-220/TO-252/TO-263/PowerPAK/LFPAK), PLACEHOLDER, not datasheet-sourced"

[models.match]
