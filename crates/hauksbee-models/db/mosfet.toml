# ─────────────────────────────────────────────────────────────────────────────
# IRF540N: Infineon (International Rectifier) HEXFET power MOSFET, TO-220AB.
# Source: Infineon "IRF540NPbF" datasheet Rev. 2.1, 2026-07-24, pages 1-2
#   (Absolute Maximum Rating, Thermal Resistance, "Static @ TJ = 25 C" and
#   "Dynamic Electrical Characteristics" tables).
#
# THIS IS NOT A LOGIC-LEVEL PART, and that is the single most important fact on
# its card. The Static table gives VGS(th) as 2.0 V MINIMUM / 4.0 V MAXIMUM, and
# the ONLY RDS(on) row on the sheet is 44 mOhm max at VGS = 10 V, ID = 16 A.
# Driven from a 3.3 V rail a worst-case part is not guaranteed to be on at all,
# and a typical one is nowhere near its 44 mOhm. `ratings.rds_on_vgs` and
# `ratings.vgs_th_max` below carry exactly those two numbers so the run can say
# so instead of quoting 44 mOhm at a gate voltage the vendor never tested.
#
# Datasheet figures used:
#   VGS(th) = 2.0 / (no typ published) / 4.0 V  @ VDS = VGS, ID = 250 uA
#   RDS(on) max 44 mOhm (no typ published)      @ VGS = 10 V, ID = 16 A
#   gfs     min 21 S (no typ published)         @ VDS = 50 V, ID = 16 A
#   Ciss 1960 / Coss 250 / Crss 40 pF           @ VGS = 0, VDS = 25 V, 1 MHz
#
# vto = 3.0 IS AN ASSUMPTION: the Static table publishes no typical threshold,
#   so 3.0 V is the midpoint of the 2.0/4.0 V band, the same least-arbitrary
#   choice the DMG1012T entry above documents.
# kp: one route only, from transconductance, because the sheet has a single
#   RDS(on) row and route (b) needs two: kp = gfs^2/(2*ID) = 21^2/32 = 13.781.
# rd+rs = 0.044 - 1/(13.781*(10-3.0)) = 0.044 - 0.010366 = 33.634 mOhm, split
#   evenly, so the VGS=10 V row is reproduced by construction.
# NOT VALIDATED OUT OF SAMPLE, and the one cross-check available is a MISS in a
#   known direction: at VGS = 5 V the fit saturates at 0.5*kp*(5-3)^2 = 27.6 A
#   where Fig. 3 (Typical Transfer Characteristics, VDS = 50 V, TJ = 25 C) reads
#   roughly 40-50 A. Both inputs to the fit are GUARANTEED LIMITS rather than
#   typicals (gfs is a minimum, RDS(on) a maximum), so the model is a
#   worst-case-part model that under-states drive and over-states on-resistance.
#   For a gate-drive adequacy question that is the conservative direction; do
#   not use this entry to predict a typical part's linear gain.
# NOT MODELLED: the body diode, `lambda`, avalanche/SOA, and the RDS(on)
#   temperature curve of Fig. 4 (x2.3 at TJ = 150 C).
[[models]]
id = "irf540n"
kind = "nmos"
description = "IRF540N N-channel HEXFET TO-220AB, 100V, 33A, Rds(on) 44mOhm max @ Vgs=10V (NOT logic level)"

[models.match]
# IRF540N, IRF540NPBF (the lead-free ordering code), IRF540NS (D2PAK) and
# IRF540NL (TO-262) are the same die in different bodies. The OLDER IRF540
# without the N is a different, higher-RDS(on) die, and the trailing-anchored
# "IRF540N" prefix excludes it.
value_re = "(?i)^IRF540N[A-Z0-9-]*$"

[models.params]
vto    = 3.0       # ASSUMED: midpoint of the 2.0/4.0 V VGS(th) band, no typ published
kp     = 13.781    # A/V^2, from gfs min 21 S at ID = 16 A (see above)
rd     = 0.016817  # half the 33.634 mOhm ohmic residue of RDS(on) @ VGS = 10 V
rs     = 0.016817  # other half
cgd    = 4.0e-11   # = Crss typ 40 pF, IRF540NPbF Rev. 2.1 Dynamic Electrical Characteristics, VGS = 0, VDS = 25 V, f = 1 MHz
cgs    = 1.92e-9   # = Ciss typ - Crss typ = 1960 - 40 = 1920 pF, same table and test condition
warning = "a standard-level (not logic-level) part: its 44 mOhm RDS(on) is specified only at VGS = 10 V and its VGS(th) runs to 4.0 V, so a 3.3 V or 5 V gate drive is outside what the datasheet guarantees"

[models.pins]
# Stated on datasheet page 1: Gate Pin 1, Drain Pin 2 (also the tab), Source
# Pin 3. Given as numbers AND letters so a layout board with bare pads and a
# netlist with G/D/S pin functions both bind without leaning on the pin rule.
"1" = "gate"
"2" = "drain"
"3" = "source"
"G" = "gate"
"D" = "drain"
"S" = "source"

[models.ratings]
# Source: Infineon IRF540NPbF Rev. 2.1, Absolute Maximum Rating + Thermal
# Resistance tables.
max_current_a       = 23.0    # ID continuous at TC = 100 C, VGS = 10 V, the least
                              # favourable tagged row below (33 A at TC = 25 C)
max_surge_current_a = 110.0   # IDM pulsed drain current
max_power_w         = 130.0   # PD at TC = 25 C: a CASE-referenced figure that assumes a
                              # heatsink. In still air the binding limit is the junction
                              # temperature computed from theta_ja below, not this number.
max_voltage_v       = 100.0   # V(BR)DSS min
theta_ja_c_per_w    = 62.0    # RthJA max
theta_jc_c_per_w    = 1.15    # RthJC max: places the TC rows below at the case
max_junction_temp_c = 175.0   # TJ max
rds_on_vgs          = 10.0    # the only VGS the 44 mOhm RDS(on) row is specified at
vgs_th_max          = 4.0     # VGS(th) max @ VDS = VGS, ID = 250 uA
