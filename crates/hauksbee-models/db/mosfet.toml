# vto = 0.75 IS AN ASSUMPTION, NOT A DATASHEET FIGURE. This sheet's VGS(th) typ
#   column is empty; 0.75 is the midpoint of the published 0.5 / 1.0 min-max.
#   It is the only invented number in this entry and it is invented in the least
#   arbitrary way available.
# kp: (a) 1.4^2/(2*0.4) = 2.45.  (b) widest pair, 1.8 V and 4.5 V:
#   (1/1.05 - 1/3.75)/(0.5 - 0.3) = (0.95238 - 0.26667)/0.2 = 3.4286.
#   +39.9% apart, outside the agreement band. Route (b) chosen: this part is a
#   load switch and conduction is the fidelity target.
# rd+rs = 0.3 - 1/(3.4286*3.75) = 0.22222 Ohm, split evenly.
# VALIDATED OUT OF SAMPLE on the VGS=2.5 V row, which the fit did not use:
