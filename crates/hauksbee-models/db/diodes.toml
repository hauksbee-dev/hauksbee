# ─────────────────────────────────────────────────────────────────────────────
# Zener diodes, the 1N47xxA family: 1 W, DO-41 axial, Vz tolerance +/-5%.
#
# A Zener is an ordinary diode whose REVERSE breakdown is the point of the part,
# so `bv` carries the whole model and comes straight off the datasheet. The
# solver conducts below -bv with ngspice's own breakdown shape, so a shunt
# regulator or a clamp behaves rather than sitting open until something melts.
#
# The forward parameters are a FIT, not a table lookup, and are shared across
# the family: this datasheet gives one forward number, VF <= 1.2 V at
# IF = 200 mA, and no SPICE card. `is`, `n` and `rs` below put VF near 1.0 V at
# that current, inside the limit. Anyone who needs an accurate forward drop from
# a Zener is using the part backwards, and the comment says so rather than
# implying the numbers were read off a curve.
#
# Source for every Vz, Izt, Zzt and rating: Multicomp 1N4728A-1N4764A datasheet
# V1.1 (06/04/11), "Specification Table" and "Absolute Maximum Ratings".
#
# The family is listed as the datasheet prints it, which is abridged: it skips
# from 3.9 V to 4.7 V and from 10 V to 62 V. The missing codes are real parts,
# and they are left out rather than interpolated.

[[models]]
id = "1n4728a"
kind = "diode"
description = "1N4728A Zener diode 3.3 V, 1 W, DO-41"

[models.match]
# Accepts the bare code and the A/B/C tolerance suffixes; the voltage is set by
# the code, so a suffix cannot change which rail this clamps at.
value_re = "(?i)^1N4728[ABC]?$"

[models.params]
bv  = 3.3        # VZnom at IZT = 76 mA, Specification Table
ibv = 0.076      # the knee sits at IZT, so V(bv) is the datasheet VZ there
is  = 1.0e-9      # forward fit, shared across the family (see the note above)
n   = 1.6         # forward fit
rs  = 1.0         # forward fit; puts VF near 1.0 V at IF = 200 mA (1.2 V max)

[models.pins]
"A" = "anode"
"K" = "cathode"

[models.ratings]
max_power_w = 1.0            # Pv at Tamb <= 50 C, Absolute Maximum Ratings
max_voltage_v = 3.3      # reverse working voltage is the Zener voltage itself
max_junction_temp_c = 200.0  # Tj, Absolute Maximum Ratings
theta_ja_c_per_w = 100.0     # RthJA, Maximum Thermal Resistance

