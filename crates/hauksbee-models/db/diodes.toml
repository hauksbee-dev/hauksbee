[[models]]
id = "led_red"
kind = "diode"
description = "Red LED, Vf ≈ 2.0 V @ 20 mA"

[models.match]
value_re = "(?i)RED.?LED|LED.?RED"

[models.params]
# Source: typical AlGaInP red LED parameters
is  = 1.0e-20
n   = 1.8
rs  = 6.0
cjo = 2.0e-12
vj  = 1.7
m   = 0.5
tt  = 1.0e-9
bv  = 5.0

[models.pins]
"K" = "cathode"
"A" = "anode"

[models.ratings]
max_current_a = 0.025      # typical 0603/0805 indicator LED IF max
max_surge_current_a = 0.1
max_voltage_v = 5.0  # reverse

