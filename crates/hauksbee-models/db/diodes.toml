# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "1n4001"
kind = "diode"
description = "1N400x rectifier diode family fallback, DO-41 (each member has an explicit entry below that outranks this)"

[models.match]
# Family safety net. Every member 1N4002–1N4007 also has a dedicated entry
# with its real breakdown voltage; those win the tie because an exact literal
# regex is more constrained than this character class (see
# CompiledEntry::regex_specificity). In practice this entry only ever binds
# 1N4001 itself.
value_re = "(?i)^1N400[1-7]$"

[models.params]
# Source for the dynamic params: Vishay "1N4001 thru 1N4007 General Purpose
# Plastic Rectifier", document 88503, Revision 29-Apr-2020
# (https://www.vishay.com/docs/88503/1n4001.pdf), ELECTRICAL CHARACTERISTICS
# and Fig. 6 "Typical Junction Capacitance". The sheet prints no SPICE model
# and no trr row, so tt is left at the binder default (0).
# vj/m: least-squares fit of C = C0/(1 + V/vj)^m to the Fig. 6 curve (vector
# path vertices 0.10 V/28.6 pF, 0.65/21.2, 3.58/14.6, 18.5/9.14, 100/5.05),
# rms residual 2.3%; the fit gives 13.9 pF at 4 V against the 15 pF table row.
# DC params: legacy values, no located source. The old citation "Rev. 15, SPICE
# model" does not exist (the sheet has no SPICE section), and they do not match
# onsemi's published 1N4001RL model either (MODPEX, 12-Oct-2003:
# IS=1.225e-8 N=1.834 RS=0.04148).
is  = 7.62e-9
n   = 1.984
rs  = 0.042
cjo = 3.123e-11  # CJ typ 15 pF at VR = 4.0 V, 1 MHz: 15p * (1 + 4/0.4157)^0.3103
vj  = 0.4157     # fitted to Fig. 6 (see above)
m   = 0.3103     # fitted to Fig. 6 (see above)
bv  = 50.0     # 1N4001 VRRM; no V(BR) row printed; VRRM is a guaranteed lower bound on breakdown

[models.pins]
"A" = "anode"
"K" = "cathode"

[models.ratings]
max_current_a = 1.0        # IF(AV)
max_surge_current_a = 30.0 # IFSM 8.3ms half-sine
theta_ja_c_per_w = 50.0    # RθJA typ, 9.5 mm leads, PCB mounted (88503, Thermal Characteristics)
max_junction_temp_c = 150.0 # TJ operating range -50 to +150 C (88503, Maximum Ratings)

# Printed rating rows (Vishay 88503 Revision 29-Apr-2020, fetched 2026-09-28).
# RthJL 25 C/W typ is kept as data (junction to lead, no card key).
[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.characteristic]]
parameter = "IF(AV) average forward rectified current"
rating = "max_current_a"
max = 1.0
unit = "A"
conditions = "TA = 75 °C, 9.5 mm (0.375 in) lead length"
basis = "Vishay 1N4001 thru 1N4007 doc. 88503 Revision 29-Apr-2020, Maximum Ratings, IF(AV) @ 0.375 in (9.5 mm) lead length, TA = 75 °C"
[[models.source.characteristic]]
parameter = "RθJA thermal resistance junction to ambient"
rating = "theta_ja_c_per_w"
typ = 50.0
unit = "°C/W"
conditions = "9.5 mm (0.375 in) lead length, PCB mounted"
mounting = "PCB mounted, 9.5 mm leads"
basis = "Vishay 1N4001 thru 1N4007 doc. 88503 Revision 29-Apr-2020, Thermal Characteristics, RθJA typ, Note 1"
[[models.source.characteristic]]
parameter = "RθJL thermal resistance junction to lead"
typ = 25.0
unit = "°C/W"
conditions = "9.5 mm (0.375 in) lead length, PCB mounted"
mounting = "PCB mounted, 9.5 mm leads"
basis = "Vishay 1N4001 thru 1N4007 doc. 88503 Revision 29-Apr-2020, Thermal Characteristics, RθJL typ, Note 1"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "1n4002"
kind = "diode"
description = "1N4002 rectifier diode, DO-41 (explicit match over 1N400x family)"

[models.match]
value_re = "(?i)^1N4002$"

[models.params]
