[[models]]
id = "1n4007fl"
kind = "diode"
description = "1N4007FL general purpose rectifier, 1000 V, 1 A, SOD-123FL (SMC Diode Solutions)"

[models.match]
# SMC's SOD-123FL part only. The DO-41 1N4007 above is a different die and
# package (RthJA 50 vs 75 C/W, different datasheet), so it keeps its own entry.
value_re = "(?i)^1N4007FL$"

[models.params]
# Source: SMC Diode Solutions "1N4001FL THRU 1N4007FL General Purpose Plastic
# Rectifier", Data Sheet N1646 Rev. A, page 1 (ratings and characteristics) and
# page 2 (Fig. 3 "Typical Instantaneous Forward Characteristics", TJ = 25 C,
# 300 us pulse). The sheet prints no SPICE model.
# DC params: fitted, not quoted. Four points read off Fig. 3 (0.01 A at 0.647 V,
# 0.1 A at 0.79 V, 1 A at 0.985 V, 10 A at 1.30 V; read uncertainty about 20 mV)
# are reproduced by this triple to 12 mV (0.647 / 0.802 / 0.973 / 1.297 V). The
# fitted n is high because the curve flattens above 1 A, which the fit absorbs
# into n. The 1 A point sits under the printed VF max of 1.1 V at 1.0 A.
# cjo: CJ typ 15 pF at VR = 4.0 V, 1 MHz: 15p * (1 + 4/1.0)^0.5. The sheet has no
# CJ-vs-VR figure, so vj and m stay at the binder defaults. No trr row is
# printed, so tt is left at the default (0).
is  = 6.15e-7
n   = 2.58
rs  = 0.019
cjo = 3.354e-11
bv  = 1000.0  # 1N4007FL VRRM; no V(BR) row printed; VRRM is a guaranteed lower bound on breakdown

[models.pins]
# The sheet marks the cathode end with the colour band and does not number the
# pads, so only the electrode names are mapped here.
"A" = "anode"
"K" = "cathode"

[models.ratings]
max_current_a = 1.0
max_surge_current_a = 30.0
max_voltage_v = 1000.0
theta_ja_c_per_w = 75.0
max_junction_temp_c = 150.0

