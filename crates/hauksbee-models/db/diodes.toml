# Die figures: Nexperia BAV99 v.9 (1 July 2022) Table 7 prints the same per-diode rows as BAV70 v.9
# (VF 715 mV @ 1 mA, 855 mV @ 10 mA, 1 V @ 50 mA, 1.25 V @ 150 mA; Cd 1.5 pF @ 0 V; trr 4 ns) and
# Fig. 3 the same typical Cd (0.60 pF at 0 V, ~0.5 pF at 1 V), so the BAV70 fit is the BAV99 fit;
# checked against the BAV99 sheet. The sheet prints IF 215 mA with one diode loaded, 125 mA with
# both loaded (Table 5); the 125 mA per-device row is kept as data because the rating cannot name
# one diode's path. Ptot and Rth(j-a) are per device, one diode loaded.
[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://assets.nexperia.com/documents/data-sheet/BAV99.pdf"
title = "Nexperia BAV99 High-speed switching diode, product data sheet v.9 (1 July 2022)"
locator = "Table 2 Pinning information, SOT23: 1 A1, 2 K2, 3 K1/A2; Tables 5-7, Fig. 3"
sha256 = "826c982f4f2bbefcc047abea7ed2be517c09cf46bf61c10c25e4b7c378369b2f"
[[models.source.references]]
url = "https://assets.nexperia.com/documents/data-sheet/BAV99W.pdf"
title = "Nexperia BAV99W High-speed switching diode, product data sheet (SC-70 / SOT323)"
locator = "Table 2 Pinning information, SOT323: 1 A1, 2 K2, 3 K1/A2"
sha256 = "0b5a79d07fade01502c163557fbb819f10af6bed959f419c9150a8775914da81"
