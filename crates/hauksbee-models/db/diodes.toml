[[models]]
id = "bat54"
kind = "diode"
description = "BAT54 Schottky barrier diode, 30 V, 200 mA, SOT23"

[models.match]
# This regex engine has no look-around support, so the value pattern excludes
# dual-die variants by enumerating legal first continuations after BAT54:
# `-`, `/`, `,`, `W`, `J`, `H`, `L`, `T`, and `X`. A, C, and S are absent from
# that class, so BAT54A/C/S and their suffixes fail; BAT54WS still matches
# because W is the first continuation and S is consumed by the tail. The
# footprint condition selects this 3-pin body card: the value string alone
# cannot decide pad count across BAT54 package variants.
value_re = "(?i)^(?:S|SB|NSV|T)?BAT54(?:[-/,WJHLTX][A-Z0-9,/-]*)?$"
footprint_re = "(?ix) SOT-?23 | SOT-?323 | SC-?70 | SC-?59 | TO-?236"

[models.params]
# Source: Nexperia BAT54 datasheet, 1 July 2022, Table 7 "Characteristics".
#
# Fitted, not quoted: that datasheet publishes no SPICE model. `is`, `n` and
# `rs` are a least-squares fit to the whole VF column, five points spanning
# 0.1 mA to 100 mA (240, 320, 400, 500 and 800 mV), and they reproduce it to
# 11 mV rms. Those are MAX figures with no typ column, so this models a
# worst-case part: it will read a little pessimistic against a typical one,
# which is the right direction for a checker.
is  = 4.834e-9
n   = 1.0
rs  = 3.6
# Dynamic params: vj/m are left to the binder defaults (vj = 1.0, m = 0.5).
# A free fit to Fig. 3 "Diode capacitance as a function of reverse voltage;
# typical values" is degenerate (vj -> 0; the curve runs 8.0 pF near 0 V,
# 4.5 pF at 1 V, flattening to 1.4 pF at 30 V). Table 7 prints only a MAX, so
# cjo is a worst-case figure, well above the ~8 pF typical at 0 V in Fig. 3.
# tt is left at the default (0): a Schottky's trr (5 ns max) is not stored
# charge; same choice on every Schottky card in this file.
cjo = 1.414e-11 # Cd max 10 pF at VR = 1 V, f = 1 MHz, Table 7: 10p * (1 + 1/1.0)^0.5
bv  = 30.0      # VR, Table 5 "Limiting values"; no V(BR) row printed; VR is a guaranteed lower bound on breakdown

[models.pins]
# Table 2 "Pinning information": SOT23 with the middle pin unconnected.
"1" = "anode"
"2" = "nc"
"3" = "cathode"
"A" = "anode"
"K" = "cathode"

[models.ratings]
max_current_a = 0.2             # IF at Tamb = 25 C, Table 5
max_surge_current_a = 0.6       # IFSM, tp < 10 ms, Table 5
max_power_w = 0.25              # Ptot at Tamb <= 25 C, Table 5
max_voltage_v = 30.0            # VR, Table 5
max_junction_temp_c = 150.0     # Tj, Table 5
theta_ja_c_per_w = 500.0        # Rth(j-a) in free air, Table 6

# Printed rating rows (Nexperia BAT54 v.6, 1 July 2022, fetched 2026-09-28): SOT23
# only; the SOT323/SC-70 footprints this card also matches are not on this sheet.
[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.characteristic]]
parameter = "IF forward current"
rating = "max_current_a"
max = 0.2
unit = "A"
conditions = "Tamb = 25 °C"
basis = "Nexperia BAT54 product data sheet v.6 (1 July 2022), Table 5 Limiting values, IF @ Tamb = 25 °C"
[[models.source.characteristic]]
parameter = "Ptot total power dissipation"
rating = "max_power_w"
max = 0.25
unit = "W"
conditions = "Tamb = 25 °C"
mounting = "FR4 single-sided Cu, standard footprint"
basis = "Nexperia BAT54 product data sheet v.6 (1 July 2022), Table 5 Limiting values, Ptot @ Tamb ≤ 25 °C, note [1]"
[[models.source.characteristic]]
parameter = "Rth(j-a) thermal resistance junction to ambient"
rating = "theta_ja_c_per_w"
max = 500.0
unit = "K/W"
conditions = "in free air"
mounting = "FR4 single-sided Cu, standard footprint"
basis = "Nexperia BAT54 product data sheet v.6 (1 July 2022), Table 6 Thermal characteristics, Rth(j-a) max, note [2]"

# ─────────────────────────────────────────────────────────────────────────────
# The same BAT54 die in a TWO-PIN body (SOD-523/SOD-323/SOD-123/SOD-323F). This
# is a separate card rather than a wider match on the one above because the pad
# map differs and the model's pad map wins over db/pin_rules.toml: a 2-pin part
# bound to the SOT23 map would read pad 1 as the anode, leave the real anode as
# `nc`, and let the 2-pin diode rule fill `cathode` from pad 1 as well, shorting
# the diode across one net. Per-diode DC characteristics are the same worst-case
# ladder as the SOT23 part (onsemi BAT54XV2T1G / BAT54T1G ELECTRICAL
# CHARACTERISTICS agree with Nexperia's Table 7 to datasheet rounding); the
# thermal limits are onsemi's own and are lower, so they are carried here rather
# than inherited.
#
# Source: onsemi BAT54XV2T1G datasheet (bat54xv2t1-d.pdf), ORDERING INFORMATION,
# MAXIMUM RATINGS and pinning (pin 1 cathode, pin 2 anode); VF ladder from the
# same family's BAT54T1G ELECTRICAL CHARACTERISTICS table.
[[models]]
id = "bat54_2pin"
kind = "diode"
description = "BAT54 Schottky barrier diode, 30 V, 200 mA, 2-pin SOD body"

[models.match]
# This regex engine has no look-around support, so the value pattern excludes
# dual-die variants by enumerating legal first continuations after BAT54:
# `-`, `/`, `,`, `W`, `J`, `H`, `L`, `T`, and `X`. A, C, and S are absent from
# that class, so BAT54A/C/S and their suffixes fail; BAT54WS still matches
# because W is the first continuation and S is consumed by the tail. The
# footprint condition selects this 2-pin SOD body card, keeping its pad map
# separate from the 3-pin BAT54 card above.
value_re = "(?i)^(?:S|SB|NSV|T)?BAT54(?:[-/,WJHLTX][A-Z0-9,/-]*)?$"
footprint_re = "(?ix) SOD-?123 | SOD-?323 | SOD-?523 | SOD-?882 | D_SOD | ^Diode_SMD:D_SOD"

[models.params]
# Dynamic params from onsemi "BAT54XV2 Schottky Barrier Diodes", BAT54XV2T1/D
# Rev. 13, December 2022 (https://www.onsemi.com/pdf/datasheet/bat54xv2t1-d.pdf),
# ELECTRICAL CHARACTERISTICS. vj/m are left to the binder defaults: Figure 4
# "Total Capacitance" has the same flat parasitic floor (~2.3 pF above 20 V) as
# the Nexperia curve, which no single depletion law follows. tt is left at the
# default (0) as on every Schottky card here (trr 5 ns max is not stored charge).
is  = 4.834e-9
n   = 1.0
rs  = 3.6
cjo = 1.075e-11 # CT typ 7.6 pF at VR = 1.0 V, f = 1 MHz: 7.6p * (1 + 1/1.0)^0.5
bv  = 30.0      # V(BR)R min at IR = 10 uA; min is the only printed bound
ibv = 1.0e-5    # the V(BR)R test current, IR = 10 uA

[models.pins]
# 2-pin body: pad 1 is the cathode, pad 2 the anode (onsemi pinning, and the
# KiCad Device:D convention the 2-pin rule in pin_rules.toml already encodes).
"1" = "cathode"
"2" = "anode"
"A" = "anode"
"K" = "cathode"

[models.ratings]
max_current_a = 0.2
max_surge_current_a = 0.6
max_power_w = 0.2               # onsemi PD, 2-pin SOD-523
max_voltage_v = 30.0
max_junction_temp_c = 125.0     # onsemi Tj max, lower than Nexperia's 150 C
theta_ja_c_per_w = 635.0        # onsemi RthJA, FR-4 minimum pad

# Printed rating rows (onsemi BAT54XV2T1/D Rev. 13, December 2022, SOD-523, fetched
# 2026-09-28 from onsemi's own mirror https://www.onsemi.cn/download/data-sheet/pdf/bat54xv2t1-d.pdf;
# www.onsemi.com refuses automated fetches). PD derates 2.0 mW/C above 25 C (not
# tagged as a derived row). IF (DC) 200 mA is kept as data: its row prints no temperature.
[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.characteristic]]
parameter = "PD total device dissipation"
