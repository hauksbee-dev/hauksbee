# Diode models.
# SPICE params: is (A), n, rs (Ω), cjo (F), vj (V), m, tt (s), bv (V).

[[models]]
id = "1n4148"
kind = "diode"
description = "1N4148 small-signal switching diode, DO-35"

[models.match]
# Same small-signal switching die across SMD packages: 1N4148W (SOD-123),
# 1N4148WS (SOD-323), 1N4148WT, 1N4148-7-F. The distinct parts 1N4448 / 1N4150
# / 1N914 differ before the suffix and are correctly rejected.
value_re = "(?i)^1N4148[A-Z0-9-]*$"

[models.params]
# Source: Vishay 1N4148 datasheet Rev. 14, SPICE model parameters
is  = 2.52e-9   # saturation current
n   = 1.752     # emission coefficient
rs  = 0.568     # series resistance (Ω)
cjo = 4.0e-12   # zero-bias junction capacitance (F)
vj  = 0.8       # built-in potential (V)
m   = 0.4       # grading coefficient
tt  = 6.0e-9    # transit time (s)
bv  = 100.0     # reverse breakdown voltage (V)

[models.pins]
"A" = "anode"
"K" = "cathode"

[models.ratings]
max_current_a = 0.3        # IF repetitive peak (Vishay Rev 14)
max_surge_current_a = 2.0  # IFSM 1us
max_power_w = 0.5
max_voltage_v = 100.0      # VRRM

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "1n4001"
kind = "diode"
description = "1N400x rectifier diode family fallback, DO-41 (each member has an explicit entry below that outranks this)"

[models.match]
# Family safety net. Every member 1N4002–1N4007 also has a dedicated entry
# with its real breakdown voltage; those win the tie because an exact literal
# regex is more constrained than this character class (see
# CompiledEntry::regex_specificity). In practice this entry only ever binds
# 1N4001 itself.
value_re = "(?i)^1N400[1-7]$"

[models.params]
# Source: Vishay 1N4001-1N4007 datasheet, Rev. 15, SPICE model
is  = 7.62e-9
n   = 1.984
rs  = 0.042
cjo = 2.0e-11
vj  = 0.75
m   = 0.333
tt  = 5.76e-6
bv  = 50.0     # 1N4001 VRRM; higher-voltage members bind their own entries below

[models.pins]
"A" = "anode"
"K" = "cathode"

[models.ratings]
max_current_a = 1.0        # IF(AV)
max_surge_current_a = 30.0 # IFSM 8.3ms half-sine

