[[models]]
id = "mmdl914"
kind = "diode"
description = "MMDL914 high-speed switching diode, 100 V, 200 mA, SOD-323 (onsemi)"

[models.match]
# onsemi's SOD-323 part only: MMDL914T1G / T3G, with the automotive S prefix.
# Other vendors' bare "1N914"-class parts differ in package and ratings, so they
# are not matched here.
value_re = "(?i)^S?MMDL914(T[13]G?)?$"

[models.params]
# Source: onsemi "MMDL914 High-Speed Switching Diode", publication order number
# MMDL914T1/D, Rev. 11, January 2025, ELECTRICAL CHARACTERISTICS (page 2) and
# Figure 2 "Forward Voltage" (page 3). The sheet prints no SPICE model and no
# typical column.
# DC params: fitted, not quoted. Figure 2 at TA = 25 C read at three currents:
# 1 mA at 0.601 V, 10 mA at 0.726 V, 100 mA at 0.928 V. This triple reproduces
# them to 4 mV (0.600 / 0.729 / 0.929 V) and sits below the printed VF max of
# 1.0 V at 10 mA.
# cjo: CT max 4.0 pF at VR = 0 V, 1 MHz is already zero bias; as on the 1N4148
# card it is the printed bound (Figure 4 shows about 0.6 pF typical), so this is
# pessimistic for capacitance. vj and m stay at the binder defaults.
# tt: trr max 4 ns at IF = IR = 10 mA, iR(rec) = 1 mA: tt = 4 ns / ln(1 + 10/10).
is  = 9.0e-9
n   = 2.0
rs  = 0.9
cjo = 4.0e-12
tt  = 5.77e-9
bv  = 100.0   # V(BR) min 100 V at IR = 100 uA (min is the only printed bound)
ibv = 1.0e-4  # the V(BR) test current, IR = 100 uA

[models.pins]
# SOD-323 Style 1: pin 1 cathode (polarity band), pin 2 anode (onsemi Case 477).
"1" = "cathode"
"2" = "anode"
"A" = "anode"
"K" = "cathode"

[models.ratings]
max_current_a = 0.2
