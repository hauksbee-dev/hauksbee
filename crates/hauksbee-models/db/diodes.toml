# Diode models.
# SPICE params: is (A), n, rs (Ω), cjo (F), vj (V), m, tt (s), bv (V).

[[models]]
id = "1n4148"
kind = "diode"
description = "1N4148 small-signal switching diode, DO-35"

[models.match]
# The DO-35 part and its tape/grade suffixes (1N4148TR, 1N4148-T, 1N4148A, ...).
# A suffix that starts with W is an SMD package (1N4148W SOD-123, 1N4148WS
# SOD-323, 1N4148WT SOD-523) with its own, lower, current and power ratings: those
# have their own cards below, and the 1n4148w_unlisted_package fallback, so a W
# variant never inherits the DO-35 300 mA / 440 mW figures from this card. The
# distinct parts 1N4448 / 1N4150 / 1N914 differ before the suffix and are
# correctly rejected.
value_re = "(?i)^1N4148([A-VX-Z0-9-][A-Z0-9-]*)?$"

[models.params]
# Source for the dynamic params: Vishay "1N4148 Small Signal Fast Switching
# Diodes", document 81857, Rev. 1.6, 07-Nov-2024, ELECTRICAL CHARACTERISTICS
# (https://www.vishay.com/docs/81857/1n4148.pdf). That datasheet prints no SPICE
# model and has no CD-vs-VR figure, so vj and m are left to the binder defaults.
# DC params: legacy values, no located source. They match the widely copied
# library model (IS=2.52n N=1.752 RS=0.568), not anything in the Vishay sheet;
# the old citation "Vishay 1N4148 datasheet Rev. 14, SPICE model parameters"
# pointed at a revision and a SPICE section that do not exist.
is  = 2.52e-9   # saturation current (legacy, see above)
n   = 1.752     # emission coefficient (legacy)
rs  = 0.568     # series resistance (Ω) (legacy)
cjo = 4.0e-12   # CD max 4 pF at VR = 0 V, f = 1 MHz: already zero bias
tt  = 1.154e-8  # trr max 8 ns at IF = IR = 10 mA, iR = 1 mA: tt = 8 ns / ln(1 + 10/10)
bv  = 100.0     # V(BR) min 100 V at IR = 100 uA (min is the only printed bound)
ibv = 1.0e-4    # the V(BR) test current, IR = 100 uA

[models.pins]
"A" = "anode"
"K" = "cathode"

[models.ratings]
max_current_a = 0.3        # IF forward continuous current at Tamb = 25 C (81857 Rev. 1.6; IFRM is 500 mA)
max_surge_current_a = 2.0  # IFSM 1us
max_power_w = 0.44         # Ptot at l = 4 mm, TL = 45 C, the least favourable tagged row (500 mW at TL <= 25 C)
max_voltage_v = 100.0      # VRRM
theta_ja_c_per_w = 350.0   # RthJA at l = 4 mm, TL = constant (81857 Rev. 1.6, Thermal Characteristics)
max_junction_temp_c = 175.0 # Tj (81857 Rev. 1.6, Thermal Characteristics)

# Printed rating rows (Vishay 81857 Rev. 1.6, fetched 2026-09-28). IF(AV) 150 mA
# (VR = 0) is kept as data: the card rates DC current by IF.
[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.characteristic]]
parameter = "IF forward continuous current"
rating = "max_current_a"
max = 0.3
unit = "A"
conditions = "Tamb = 25 °C"
basis = "Vishay 1N4148 doc. 81857 Rev. 1.6 (07-Nov-2024), Absolute Maximum Ratings, IF @ Tamb = 25 °C"
[[models.source.characteristic]]
parameter = "Ptot power dissipation"
rating = "max_power_w"
max = 0.5
unit = "W"
conditions = "l = 4 mm, TL = 25 °C"
basis = "Vishay 1N4148 doc. 81857 Rev. 1.6 (07-Nov-2024), Absolute Maximum Ratings, Ptot @ l = 4 mm, TL ≤ 25 °C"
[[models.source.characteristic]]
parameter = "Ptot power dissipation"
rating = "max_power_w"
max = 0.44
unit = "W"
conditions = "l = 4 mm, TL = 45 °C"
basis = "Vishay 1N4148 doc. 81857 Rev. 1.6 (07-Nov-2024), Absolute Maximum Ratings, Ptot @ l = 4 mm, TL = 45 °C"
[[models.source.characteristic]]
parameter = "IF(AV) average forward current"
max = 0.15
unit = "A"
conditions = "VR = 0, Tamb = 25 °C"
basis = "Vishay 1N4148 doc. 81857 Rev. 1.6 (07-Nov-2024), Absolute Maximum Ratings, IF(AV) @ VR = 0"
[[models.source.characteristic]]
parameter = "RthJA junction to ambient air"
rating = "theta_ja_c_per_w"
max = 350.0
unit = "K/W"
conditions = "l = 4 mm, TL = constant"
basis = "Vishay 1N4148 doc. 81857 Rev. 1.6 (07-Nov-2024), Thermal Characteristics, RthJA @ l = 4 mm, TL = constant"

# ─────────────────────────────────────────────────────────────────────────────
# 1N4148 SMD package variants and LL4148 (MiniMELF). Same switching die as the
# DO-35 card above, but each package prints its own, lower, current and power
# ratings. DC params (is, n, rs) are the same legacy values as the 1n4148 card.
# max_current_a is the printed AVERAGE rectified/forward current row, the rating a
# steady DC load (duty 1) is held to; the larger continuous-IF row is kept as
# data. max_voltage_v is the DC reverse voltage VR, not the repetitive peak.

[[models]]
id = "1n4148w"
kind = "diode"
description = "1N4148W small-signal switching diode, SOD-123 (also 1N4148WQ and -7-F / -E3-08 ordering codes)"

[models.match]
value_re = "(?i)^1N4148WQ?([-_][A-Z0-9_-]+)?$"

[models.params]
# Dynamic params: Vishay 1N4148W, document 86356, Rev. 1.0, 16-Nov-2023, page 2
# ELECTRICAL CHARACTERISTICS: CD max 1.5 pF at VF = VR = 0 V; trr max 4 ns at
# IF = 10 mA, iR = 1 mA, VR = 6 V, RL = 100 Ohm (used directly as tt, no stored-charge fit).
# bv: Diodes Inc. DS30086 Rev. 31-2 (Sep 2024) p. 2, V(BR)R min 100 V at IR = 1.0 uA.
is  = 2.52e-9   # legacy, see the 1n4148 card
n   = 1.752
rs  = 0.568
cjo = 1.5e-12
tt  = 4.0e-9
bv  = 100.0
ibv = 1.0e-6

[models.pins]
"A" = "anode"
"K" = "cathode"

[models.ratings]
max_current_a = 0.25       # IF(AV), Vishay 86356 p. 1 (Diodes Inc. DS30086 prints only IFM 300 mA)
max_surge_current_a = 2.0  # IFSM tp = 1 us
max_power_w = 0.28         # Ptot on FR-4 with the recommended soldering footprint (380 mW is the infinite-heatsink row)
max_voltage_v = 75.0       # VR
theta_ja_c_per_w = 440.0   # RthJA, JEDEC 51-3 FR-4 board, recommended footprint (86356 p. 2)
max_junction_temp_c = 150.0

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.characteristic]]
parameter = "IF(AV) average rectified current"
rating = "max_current_a"
max = 0.25
unit = "A"
conditions = "half wave rectification, resistive load, f >= 50 Hz, Tamb = 25 °C, infinite heatsink"
basis = "Vishay 1N4148W doc. 86356 Rev. 1.0 (16-Nov-2023), page 1, Absolute Maximum Ratings, IF(AV)"
[[models.source.characteristic]]
parameter = "IF continuous forward current"
max = 0.3
unit = "A"
conditions = "Tamb = 25 °C, infinite heatsink"
basis = "Vishay 1N4148W doc. 86356 Rev. 1.0 (16-Nov-2023), page 1, Absolute Maximum Ratings, IF"
[[models.source.characteristic]]
parameter = "Ptot power dissipation"
rating = "max_power_w"
max = 0.28
unit = "W"
conditions = "on FR-4 board with recommended soldering footprint, Tamb = 25 °C"
basis = "Vishay 1N4148W doc. 86356 Rev. 1.0 (16-Nov-2023), page 1, Absolute Maximum Ratings, Ptot"
[[models.source.characteristic]]
parameter = "VR reverse voltage"
rating = "max_voltage_v"
max = 75.0
unit = "V"
conditions = "Tamb = 25 °C"
basis = "Vishay 1N4148W doc. 86356 Rev. 1.0 (16-Nov-2023), page 1, Absolute Maximum Ratings, VR"
[[models.source.characteristic]]
parameter = "RthJA junction to ambient air"
rating = "theta_ja_c_per_w"
max = 440.0
unit = "K/W"
conditions = "JEDEC 51-3 FR-4 board with recommended soldering footprint"
basis = "Vishay 1N4148W doc. 86356 Rev. 1.0 (16-Nov-2023), page 2, Thermal Characteristics, RthJA"

