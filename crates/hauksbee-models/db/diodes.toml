value_re = "(?i)^(?:S|SB|NSV|T)?BAT54A(?:[-/,WJHLTX][A-Z0-9,/-]*)?$"

[models.params]
# Source: Nexperia BAT54A datasheet v.6, 1 July 2022, Table 7 "Characteristics" (identical to BAT54).
