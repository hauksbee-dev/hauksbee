max = 0.2
unit = "W"
conditions = "TA = 25 °C, FR-5 board (Note 1: FR-4 minimum pad)"
mounting = "FR-4 minimum pad"
basis = "onsemi BAT54XV2 BAT54XV2T1/D Rev. 13 (December 2022), Thermal Characteristics, PD @ TA = 25 °C, Note 1"
