[[models]]
id = "1n4148w_unlisted_package"
kind = "diode"
description = "1N4148W-family part in a package suffix this library does not list: smallest listed package's ratings assumed"

[models.match]
# Any 1N4148W... value the exact cards above do not claim (an unknown package
# letter, a distributor suffix glued on). The W-family is the SMD range, whose
# ratings fall with the package, so the safe assumption is the smallest listed
# one (SOD-523, DS30396). Written as `[W]` and an unanchored tail so its pattern
# scores below the exact cards and they win wherever they match.
value_re = "(?i)^1N4148[W][A-Z0-9_-]*"

[models.params]
is  = 2.52e-9   # legacy, see the 1n4148 card
n   = 1.752
rs  = 0.568
cjo = 2.0e-12
tt  = 4.0e-9
bv  = 75.0
ibv = 1.0e-6
warning = "the value names a 1N4148W-family part in a package this library does not list: judged at ASSUMED ratings of the smallest listed package (SOD-523 1N4148WT, 125 mA, 150 mW, Diodes Inc. DS30396 Rev. 14-2), not the DO-35 300 mA; put the exact ordering code on the component to replace it"

[models.pins]
"A" = "anode"
"K" = "cathode"

[models.ratings]
