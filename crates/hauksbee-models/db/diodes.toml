[[models]]
id = "bat43"
kind = "diode"
description = "BAT43 small-signal Schottky diode, 30 V, 200 mA, DO-35"

[models.match]
# BAT42 is the same die with a different forward grade, so it gets its own
# numbers rather than sharing these. The W and LL suffixes are the SOD-123 and
# MiniMELF packages of the same part.
value_re = "(?i)^BAT43(W(-V)?)?$|^LL43$"

[models.params]
# Source: Vishay BAT42/BAT43 datasheet, document 85660, Rev. 2.2, 12-May-2025.
# ELECTRICAL CHARACTERISTICS for the forward voltages, ABSOLUTE MAXIMUM RATINGS
# and THERMAL CHARACTERISTICS for the rest.
#
# Fitted, not quoted: the datasheet publishes no SPICE model. `is`, `n` and `rs`
# are a least-squares fit to the three BAT43 VF rows (330 mV at 2 mA, 450 mV at
# 15 mA, 1000 mV at 200 mA) and reproduce all three to 0.1 mV. Those are the MAX
# column, so this is a worst-case part: pessimistic against a typical one, which
# is the right direction for a checker.
is  = 1.329e-6
n   = 1.72
rs  = 2.35
# Dynamic params (same document, ELECTRICAL CHARACTERISTICS and Fig. 4):
# vj/m are left to the binder defaults (vj = 1.0, m = 0.5). A free fit of
# C0/(1 + V/vj)^m to Fig. 4 "Typical Capacitance vs. Reverse Voltage" is
# degenerate (vj -> 0): the curve flattens to a ~2.2 pF floor above 20 V that
# no single depletion law follows. The defaults put 9.9 pF at 0 V, which is
# where Fig. 4 starts (at or just above its 10 pF top).
# tt is left at the default (0): the trr row (5 ns max) on a Schottky measures
# capacitance and circuit recovery, not stored minority charge, so trr/ln 2
# would stamp charge the part does not have. Same choice on every Schottky here.
cjo = 9.899e-12 # CD typ 7 pF at VR = 1 V, f = 1 MHz: 7p * (1 + 1/1.0)^0.5
bv  = 30.0      # V(BR) min at IR = 100 uA (pulsed); min is the only printed bound
ibv = 1.0e-4    # the V(BR) test current, IR = 100 uA

[models.pins]
"A" = "anode"
"K" = "cathode"

[models.ratings]
max_current_a = 0.2             # IF, forward continuous current
max_surge_current_a = 4.0       # IFSM, tp < 10 ms
max_power_w = 0.2               # Ptot at Tamb = 65 C
max_voltage_v = 30.0            # VRRM
max_junction_temp_c = 125.0     # Tj
theta_ja_c_per_w = 300.0        # RthJA, junction to ambient air

# Printed rating rows (Vishay 85660 Rev. 2.2, fetched 2026-09-28), all under
# Note 1: leads 4 mm from the case kept at ambient. DO-35 rows; the SOD-123
# (BAT43W-V) and MiniMELF (LL43) variants this card also matches are not on this sheet.
[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.characteristic]]
parameter = "IF forward continuous current"
rating = "max_current_a"
max = 0.2
unit = "A"
conditions = "Tamb = 25 °C, leads 4 mm from case kept at ambient temperature (Note 1)"
basis = "Vishay BAT42/BAT43 doc. 85660 Rev. 2.2 (12-May-2025), Absolute Maximum Ratings, IF @ Tamb = 25 °C"
[[models.source.characteristic]]
parameter = "Ptot power dissipation"
rating = "max_power_w"
max = 0.2
unit = "W"
conditions = "Tamb = 65 °C, leads 4 mm from case kept at ambient temperature (Note 1)"
basis = "Vishay BAT42/BAT43 doc. 85660 Rev. 2.2 (12-May-2025), Absolute Maximum Ratings, Ptot @ Tamb = 65 °C"
[[models.source.characteristic]]
parameter = "RthJA junction to ambient air"
rating = "theta_ja_c_per_w"
max = 300.0
unit = "K/W"
conditions = "leads 4 mm from case kept at ambient temperature (Note 1)"
basis = "Vishay BAT42/BAT43 doc. 85660 Rev. 2.2 (12-May-2025), Thermal Characteristics, RthJA"

