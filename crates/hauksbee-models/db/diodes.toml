# Fitted, not quoted: that datasheet publishes no SPICE model. `is`, `n` and
# `rs` are a least-squares fit to the whole VF column, five points spanning
# 0.1 mA to 100 mA (240, 320, 400, 500 and 800 mV), and they reproduce it to
# 11 mV rms. Those are MAX figures with no typ column, so this models a
# worst-case part: it will read a little pessimistic against a typical one,
# which is the right direction for a checker.
is  = 4.834e-9
n   = 1.0
rs  = 3.6
# Dynamic params: vj/m are left to the binder defaults (vj = 1.0, m = 0.5).
# A free fit to Fig. 3 "Diode capacitance as a function of reverse voltage;
# typical values" is degenerate (vj -> 0; the curve runs 8.0 pF near 0 V,
# 4.5 pF at 1 V, flattening to 1.4 pF at 30 V). Table 7 prints only a MAX, so
# cjo is a worst-case figure, well above the ~8 pF typical at 0 V in Fig. 3.
# tt is left at the default (0): a Schottky's trr (5 ns max) is not stored
# charge; same choice on every Schottky card in this file.
cjo = 1.414e-11 # Cd max 10 pF at VR = 1 V, f = 1 MHz, Table 7: 10p * (1 + 1/1.0)^0.5
bv  = 30.0      # VR, Table 5 "Limiting values"; no V(BR) row printed; VR is a guaranteed lower bound on breakdown

[models.pins]
# Table 2 "Pinning information", SOT23: numbered electrodes are one diode each;
# an unnumbered electrode is shared by both.
"1" = "cathode1"
"2" = "cathode2"
"3" = "anode"

[models.ratings]
max_current_a = 0.2             # IF at Tamb = 25 C, Table 5
max_surge_current_a = 0.6       # IFSM, tp < 10 ms, Table 5
max_power_w = 0.25              # Ptot at Tamb <= 25 C, Table 5
max_voltage_v = 30.0            # VR, Table 5
max_junction_temp_c = 150.0     # Tj, Table 5
theta_ja_c_per_w = 500.0        # Rth(j-a) in free air, Table 6

# Printed rating rows (Nexperia BAT54A v.6, 1 July 2022): SOT23
# only.
