max_v = 5.5
abs_max_v = 6.25
basis = "Microchip AT24C32D DS20006047A, Table 4-1 DC and AC Operating Range p.9 VCC 1.7 V to 5.5 V; 4.1 Absolute Maximum Ratings p.9, VCC 6.25 V"
abs_max_basis = "DS20006047A 4.1 Absolute Maximum Ratings p.9, VCC 6.25 V"

