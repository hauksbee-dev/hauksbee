locator = "5-lead SOT23 pinout p.2; 4.1 Device Addressing and Table 4-1 (SOT23 row) p.7; 8.1 Absolute Maximum Ratings, Table 8-1 and Table 8-2 p.13; 10 Ordering Information p.17 (AT24C02D-STUM-T, package 5TS1)"
sha256 = "397ff061aa7a4ae36864592813831e9386e9467f10049064d7f139f26be6475e"
[[models.source.pinout]]
package = "5-lead SOT23"
pins = { "1" = "SCL", "2" = "GND", "3" = "SDA", "4" = "VCC", "5" = "WP" }

[models.match]
# AT24C02D-STUM-T only (5TS1). A bare "AT24C02D" with no package suffix binds the 8-pin card unless
