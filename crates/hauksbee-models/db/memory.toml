[models.peripheral_power]
supply_role = "vcc"
return_role = "gnd"
power_on_threshold_v = 2.5   # Device Selection Table p.1 (PDF p.6) 24LC256 VCC range 2.5 V to 5.5 V
idle_a = 5.0e-6              # Table 1-1 D9 ICCS max, SDA = SCL = VCC = 5.5 V, A0/A1/A2/WP = VSS, E-temp (I-temp is 1.5 uA at 5.5 V)
read_a = 400e-6              # Table 1-1 D8 ICC read max, VCC = 5.5 V, SCL = 400 kHz
write_a = 3.0e-3              # Table 1-1 D8 ICC write max, VCC = 5.5 V

[models.coverage]
implements = ["i2c_primary_array", "i2c_random_read", "i2c_sequential_read", "i2c_page_write", "standby_current_max", "read_current_max", "write_current_max", "bus_coupled_active_current", "supply_voltage_gating", "supply_ranges", "absolute_ratings"]
missing = ["address_strap_pins", "write_cycle_timing", "ack_polling", "write_protect_pin", "typical_supply_currents"]
