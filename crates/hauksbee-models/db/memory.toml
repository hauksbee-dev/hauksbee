# Official built-in part library: memory (I2C serial EEPROM).
#
# Cards here are written from vendor datasheets only (every value carries a basis and a source).
# See target/launch/official-parts-20261022/ranking.md for the batch plan.
#
# Shape and executable subset follow the existing at24c64d_8pin card in digital.toml: the typed
# `i2c_eeprom` peripheral answers at the fixed 7-bit address 0x50 (A2:A0 = 000). The device-address
# strap pins (A0..A2) are not read, so a board that straps them answers elsewhere (SCHEMA GAP: the
# i2c_eeprom kind has no address-strap input). Write-cycle timing, ACK polling and WP enforcement
# are not modelled. Currents are datasheet MAXIMA at the worst listed condition, never typical.
#
# One card per distinct pin numbering (8-pin SOIC/TSSOP/UDFN/XDFN/PDIP versus 5-lead SOT23, and for
# the 24xx256 the MSOP-8 whose A0/A1 are no-connects). The Atmel VFBGA ball-map packages are NOT
# modelled: their datasheet figures number the balls in a bottom view, but a fitted ball footprint
# names them by grid reference, so a pad map keyed by the printed numbers would bind on a guess. The
# 24AA256 chip-scale package is modelled because its datasheet Table 2-1 gives a ball number for
# every function; a footprint that names balls by grid reference will not match that map.
# Exposed pads of DFN/TDFN packages are left unmapped (the datasheet allows VSS or floating).
#
# Register-level behaviour was cross-checked against the shape of Renode's GenericI2cEeprom
# (MIT, Antmicro, renode-infrastructure src/Emulator/Peripherals/Peripherals/I2C); no code was copied
# and every value below is from the vendor PDF named in the card's references.

# ─────────────────────────────────────────────────────────────────────────────
# AT24C02D 2-Kbit (256 x 8) I2C EEPROM, 8-lead SOIC / TSSOP / UDFN / PDIP.
#
# Source: Microchip (Atmel) "AT24C01D and AT24C02D I2C-Compatible (2-wire) Serial EEPROM 1-Kbit
#   (128 x 8) or 2-Kbit (256 x 8) DATASHEET", Atmel-8871F-SEEPROM-AT24C01D-02D-Datasheet_012017.
#   PDF page numbers equal printed page numbers.
# A0/A1/A2/WP are pulled to GND internally when undriven (Table 1-1 note 1, p.2), so a floating
# strap reads as logic 0 and no must-not-float role is declared.
[[models]]
id = "at24c02d_8pin"
kind = "digital"
description = "Microchip AT24C02D 2-Kbit I2C EEPROM, 8-lead SOIC/TSSOP/UDFN/PDIP (executable primary array)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://ww1.microchip.com/downloads/en/DeviceDoc/Atmel-8871F-SEEPROM-AT24C01D-02D-Datasheet.pdf"
title = "Microchip/Atmel AT24C01D and AT24C02D I2C-Compatible (2-wire) Serial EEPROM, Atmel-8871F-SEEPROM-AT24C01D-02D-Datasheet_012017 (revision F, January 2017)"
locator = "Table 1-1 Pin Descriptions and package pinouts p.2; 4 Memory Organization and 4.1 Device Addressing, Table 4-1 and Table 4-2 p.7; 8.1 Absolute Maximum Ratings, Table 8-1 and Table 8-2 p.13; 9 Ordering Code Detail p.16; 10 Ordering Information p.17"
sha256 = "397ff061aa7a4ae36864592813831e9386e9467f10049064d7f139f26be6475e"
[[models.source.pinout]]
package = "8-lead SOIC / 8-lead TSSOP / 8-pad UDFN / 8-lead PDIP"
pins = { "1" = "A0", "2" = "A1", "3" = "A2", "4" = "GND", "5" = "SDA", "6" = "SCL", "7" = "WP", "8" = "VCC" }

[models.match]
# Ordering (p.16-17): AT24C02D-<pkg><grade>[-<carrier>]; SSHM = SOIC, XHM = TSSOP, MAHM = UDFN,
# PUM = PDIP; -T/-B/-E carrier. The 5-lead SOT23 (-STUM) has its own pad map and card; the
# 8-ball VFBGA (-CUM) is not modelled. Excludes AT24C01D (different density), AT24C02C, AT24C02
# and AT24CS02 (serial-number part).
value_re = "(?i)^AT24C02D(-(SSHM|XHM|MAHM|PUM)(-[TBE])?)?$"

[models.params]
warning = "primary 256-byte array at fixed address 0x50 (A2:A0 = 000) is executable; A0..A2 straps are not read (a board strapping them answers elsewhere), and WP enforcement, tWR write-cycle timing and ACK polling are not modelled; supply currents are datasheet maxima at the worst listed condition (VCC = 3.6 V, 1 MHz)"

[models.pins]
# Table 1-1 Pin Descriptions (p.2), identical for SOIC, TSSOP, UDFN and PDIP.
"1" = "a0"
"2" = "a1"
"3" = "a2"
"4" = "gnd"
"5" = "sda"
"6" = "scl"
"7" = "wp"
"8" = "vcc"

[models.ratings]
# max_junction_temp_c is left absent: the sheet prints temperature under bias (-55 to +125 C) and
# storage temperature, not a junction limit, and no thermal resistance.
max_voltage_v = 4.1   # 8.1 Absolute Maximum Ratings p.13: supply voltage with respect to ground -0.5 V to +4.10 V

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 1.7
max_v = 3.6
abs_max_v = 4.1
basis = "Microchip/Atmel AT24C01D/02D Atmel-8871F, Table 8-2 DC Characteristics p.13 VCC 1.7 V to 3.6 V; 8.1 Absolute Maximum Ratings p.13, supply voltage with respect to ground +4.10 V"
abs_max_basis = "Atmel-8871F 8.1 Absolute Maximum Ratings p.13, supply voltage with respect to ground -0.5 V to +4.10 V"

[models.peripheral]
kind = "i2c_eeprom"
address = 80            # 1010 A2 A1 A0 with A2:A0 = 000 (4.1 Device Addressing, Table 4-1 p.7)
size_bytes = 256        # 2-Kbit, 256 x 8 (first page of the datasheet)
page_size = 8           # 32 pages of 8 bytes (4 Memory Organization p.7)
word_address_bytes = 1  # one 8-bit word-address byte (Table 4-2 p.7)

[models.peripheral_power]
supply_role = "vcc"
return_role = "gnd"
power_on_threshold_v = 1.7   # Table 8-2 p.13 VCC minimum
idle_a = 0.8e-6              # Table 8-2 p.13 ISB max, VCC = 3.6 V
read_a = 0.5e-3              # Table 8-2 p.13 ICC1 max, read at 1 MHz, VCC = 3.6 V
write_a = 1.0e-3             # Table 8-2 p.13 ICC2 max, write at 1 MHz, VCC = 3.6 V

[models.coverage]
implements = ["i2c_primary_array", "i2c_random_read", "i2c_sequential_read", "i2c_page_write", "standby_current_max", "read_current_max", "write_current_max", "bus_coupled_active_current", "supply_voltage_gating", "supply_ranges", "absolute_ratings"]
missing = ["address_strap_pins", "write_cycle_timing", "ack_polling", "write_protect_pin", "typical_supply_currents"]

# AT24C02D 5-lead SOT23 (-STUM). The A2/A1/A0 pads are not bonded out; Table 4-1 p.7 states the
# device answers only with the address bits at logic 0, so the fixed address 0x50 is the real one.
