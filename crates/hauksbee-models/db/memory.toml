value_re = "(?i)^AT24C02D(-STUM(-T)?)?$"
footprint_re = "(?i)SOT[-_ ]?23[-_ ]?5([^0-9]|$)"

[models.params]
warning = "primary 256-byte array at fixed address 0x50 is executable (the SOT23 has no address pins and answers only with A2:A0 = 000); WP enforcement, tWR write-cycle timing and ACK polling are not modelled; supply currents are datasheet maxima at the worst listed condition (VCC = 3.6 V, 1 MHz)"

[models.pins]
