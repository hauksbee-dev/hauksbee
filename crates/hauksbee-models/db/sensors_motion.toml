[[sensor.register]]
addr = 0x0C
encoding = "u8"
expr = "counter_bdr_reg2"

# INT1_CTRL (0Dh), default 00h
[[sensor.write_register]]
addr = 0x0D
encoding = "u8"
store = "int1_ctrl"
default = 0
[[sensor.register]]
addr = 0x0D
encoding = "u8"
