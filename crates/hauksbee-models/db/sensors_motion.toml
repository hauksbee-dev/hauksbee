expr = "ctrl8_xl"

# CTRL10_C (19h), default 00h
[[sensor.write_register]]
addr = 0x19
encoding = "u8"
store = "ctrl10_c"
default = 0
[[sensor.register]]
addr = 0x19
encoding = "u8"
expr = "ctrl10_c"

# TAP_CFG0 (56h), default 00h
[[sensor.write_register]]
addr = 0x56
encoding = "u8"
store = "tap_cfg0"
default = 0
[[sensor.register]]
addr = 0x56
encoding = "u8"
expr = "tap_cfg0"

# TAP_CFG1 (57h), default 00h
[[sensor.write_register]]
addr = 0x57
encoding = "u8"
store = "tap_cfg1"
default = 0
[[sensor.register]]
addr = 0x57
encoding = "u8"
expr = "tap_cfg1"

# TAP_CFG2 (58h), default 00h
[[sensor.write_register]]
addr = 0x58
encoding = "u8"
store = "tap_cfg2"
default = 0
[[sensor.register]]
addr = 0x58
encoding = "u8"
expr = "tap_cfg2"

# TAP_THS_6D (59h), default 00h
[[sensor.write_register]]
addr = 0x59
encoding = "u8"
store = "tap_ths_6d"
default = 0
[[sensor.register]]
addr = 0x59
encoding = "u8"
expr = "tap_ths_6d"

# INT_DUR2 (5Ah), default 00h
[[sensor.write_register]]
