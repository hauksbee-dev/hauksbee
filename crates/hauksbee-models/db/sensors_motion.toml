# -----------------------------------------------------------------------------
# ICM-20948: TDK InvenSense 9-axis MotionTracking device (3-axis gyroscope, 3-axis
# accelerometer, AK09916 3-axis magnetometer), 24-pin QFN 3 x 3 x 1 mm.
#
# Source: TDK InvenSense ICM-20948 datasheet DS-000189 Revision 1.6. Section 3.1 and 3.2
#   (sensitivity), Table 4 D.C. electrical characteristics, Table 5 A.C. electrical
#   characteristics (I2C address, logic levels, temperature sensor), Table 9 Absolute
#   maximum ratings, Table 10 Signal descriptions, Section 6.2 I2C interface, Section 7
#   register map, Section 8 User Bank 0 registers, Sections 10.2 and 10.15 (User Bank 2).
#
# BANK 0 ONLY, AND THE MAP IS NOT BANKED. The part has four register banks selected by
# REG_BANK_SEL (7Fh, USER_BANK bits 5:4); the same address means different registers in
# different banks. The sensor-spec has no bank concept: a card is one flat 8-bit address
# space. This card therefore models User Bank 0 (identity, power management, status
# and the 16-bit data registers) as a flat map, plus the two User Bank 2 registers that
# set the full-scale ranges (GYRO_CONFIG_1 at 01h and ACCEL_CONFIG at 14h) because bank 0
# leaves those addresses unused and every driver sets the ranges there. A write made
# while another bank is selected lands on the bank-0 register at the same address:
# bank 2 writes to 03h/05h/06h/07h and bank 3 writes to 03h/05h/06h/07h/0Fh/10h-13h
# alias USER_CTRL, LP_CONFIG, PWR_MGMT_1, PWR_MGMT_2, INT_PIN_CFG and INT_ENABLE*. Only
# PWR_MGMT_1 and PWR_MGMT_2 feed the data registers. Bank 1, bank 2 offset registers
# and the bank-3 auxiliary I2C master are not modelled. SCHEMA GAP: bank-qualified
# registers.
#
# I2C PERSONALITY ONLY. AD0 (pin 9, shared with SDO) sets the address LSB: AD0 low gives
# 1101000 (0x68), AD0 high 1101001 (0x69) (Table 5 and Section 6.2). The SPI personality
# is the same map on the same pads, but a card carries one [models.peripheral]. AD0 is a
# digital input with no stated pull, so it is must_not_float.
#
# THE MAGNETOMETER is a separate AK09916 die behind the auxiliary I2C master (pins 7 and
# 21); it is reached through the bank-3 slave registers and EXT_SLV_SENS_DATA_xx, none of
# which is modelled.
#
# LOGIC LEVELS are fractions of VDDIO (Table 5: VIH 0.7 x VDDIO, VIL 0.3 x VDDIO, VOH
# 0.9 x VDDIO and VOL 0.1 x VDDIO at RLOAD = 1 Mohm), evaluated at the table's
# VDDIO = 1.8 V. The I2C pins' own VOL is 0.4 V at 3 mA (open drain).
#
# VDDIO IS THE TIGHT RAIL: operating 1.71 V to 1.95 V and absolute maximum 2.5 V
# (Table 4 and Table 9), unlike VDD (1.71 V to 3.6 V, absolute maximum 4 V).
#
# Not modelled: the SPI personality, banks 1 to 3 (offsets, self-test, the auxiliary
# I2C master, sample-rate dividers), the FIFO and DMP, the interrupt engine, wake-on-
# motion, the digital low-pass filters, ODR timing, the magnetometer, and the register
# restore that DEVICE_RESET performs (it reads back clear).
[[models]]
id = "icm20948"
kind = "digital"
description = "TDK InvenSense ICM-20948 9-axis motion sensor, QFN-24 (strap-selected I2C user-bank-0 register map: WHO_AM_I 0xEA, power management, 16-bit accelerometer/gyroscope/temperature data; pad map, logic levels and supply draw)"

[models.match]
# The sensor module. ICM-20649, ICM-20600, ICM-20602, ICM-20689, ICM-42605 and MPU-9250 are different dies.
value_re = "(?i)^ICM-?20948$"

[models.params]
voh   = 1.62     # Table 5, VOH 0.9 x VDDIO min (RLOAD = 1 Mohm) at VDDIO = 1.8 V
vol   = 0.18     # Table 5, VOL1 0.1 x VDDIO max (RLOAD = 1 Mohm) at VDDIO = 1.8 V
vih   = 1.26     # Table 5, VIH 0.7 x VDDIO min at VDDIO = 1.8 V
vil   = 0.54     # Table 5, VIL 0.3 x VDDIO max at VDDIO = 1.8 V
supply_static_ua = 8.0     # Table 4, full-chip sleep mode (the reset state: PWR_MGMT_1 SLEEP = 1)
supply_pin = "13"          # VDD
gnd_pin    = "18"          # GND
warning = "I2C user-bank-0 register map only (WHO_AM_I, power management, data); the map is not banked, the SPI personality, banks 1 to 3, FIFO/DMP and the magnetometer are not modelled"
must_not_float_roles = "ad0"

[models.pins]
# Table 10 Signal descriptions, QFN-24.
"1"  = "nc"
"2"  = "nc2"
"3"  = "nc3"
"4"  = "nc4"
"5"  = "nc5"
"6"  = "nc6"
"7"  = "aux_cl"   # I2C master serial clock, for external sensors
"8"  = "vddio"    # digital I/O supply voltage
"9"  = "ad0"      # I2C slave address LSB (AD0) / SPI serial data output (SDO)
"10" = "regout"   # regulator filter capacitor
"11" = "fsync"    # frame synchronisation input, GND if unused
"12" = "int1"
"13" = "vdd"
"14" = "nc7"
"15" = "nc8"
"16" = "nc9"
"17" = "nc10"
"18" = "gnd"
"19" = "resv"     # reserved, do not connect
"20" = "resv2"    # reserved, connect to GND
"21" = "aux_da"   # I2C master serial data, for external sensors
"22" = "ncs"      # chip select (SPI mode only)
"23" = "scl"      # I2C SCL / SPI SCLK
"24" = "sda"      # I2C SDA / SPI SDI

[models.ratings]
# Table 9: VDD -0.5 V to +4 V; VDDIO -0.3 V to +2.5 V; inputs -0.5 V to VDDIO + 0.5 V.
max_voltage_v = 4.0

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.71
max_v = 3.6
abs_max_v = 4.0
basis = "TDK DS-000189 Rev 1.6, Table 4 D.C. Electrical Characteristics, VDD 1.71 V min, 1.8 V typ, 3.6 V max; Table 9 Absolute Maximum Ratings, VDD -0.5 V to +4 V"

[[models.envelope]]
kind = "supply_range"
pin = "vddio"
min_v = 1.71
max_v = 1.95
abs_max_v = 2.5
basis = "TDK DS-000189 Rev 1.6, Table 4, VDDIO 1.71 V min, 1.8 V typ, 1.95 V max; Table 9, VDDIO -0.3 V to +2.5 V"

# Table 5: AD0 = 0 gives 1101000 (0x68), AD0 = 1 gives 1101001 (0x69).
[models.peripheral]
kind = "register_map"
address_select_role = "ad0"
address_when_low = 0x68
address_when_high = 0x69
spec_toml = '''
[sensor]
name = "ICM-20948 user bank 0 register map"
bus = "i2c"
i2c_address = 0x68

# Stimulus: acceleration in g (flat and still, +1 g on Z is an ASSUMED orientation), angular rate in deg/s and die
# temperature in degC (the datasheet's 21 degC room-temperature offset is the default, where the output is 0 LSB).
[[sensor.input]]
name = "accel_x_g"
default = 0.0

[[sensor.input]]
name = "accel_y_g"
default = 0.0

[[sensor.input]]
name = "accel_z_g"
default = 1.0

[[sensor.input]]
name = "gyro_x_dps"
default = 0.0

[[sensor.input]]
name = "gyro_y_dps"
default = 0.0

[[sensor.input]]
name = "gyro_z_dps"
default = 0.0

[[sensor.input]]
name = "temp_c"
default = 21.0

# Section 8.1: WHO_AM_I (User Bank 0, 00h) = 0xEA.
[[sensor.register]]
addr = 0x00
const = [0xEA]

# Section 7.1 User Bank 0 and Section 8, reset values. Writable registers read back what was written.
# USER_CTRL (03h), reset 00h
[[sensor.write_register]]
addr = 0x03
encoding = "u8"
store = "user_ctrl"
default = 0
[[sensor.register]]
addr = 0x03
encoding = "u8"
expr = "user_ctrl"

# LP_CONFIG (05h), reset 40h
[[sensor.write_register]]
addr = 0x05
encoding = "u8"
store = "lp_config"
default = 64
[[sensor.register]]
addr = 0x05
encoding = "u8"
expr = "lp_config"

# PWR_MGMT_1 (06h), reset 41h: DEVICE_RESET bit 7 (auto-clears), SLEEP bit 6, LP_EN bit 5, TEMP_DIS bit 3, CLKSEL bits 2:0
[[sensor.write_register]]
addr = 0x06
encoding = "u8"
store = "pwr_mgmt_1"
default = 65
[[sensor.write_register.field]]
name = "pm_reset"
bits = [7, 7]
[[sensor.write_register.field]]
name = "pm_sleep"
bits = [6, 6]
[[sensor.write_register.field]]
name = "pm_tempdis"
bits = [3, 3]

[[sensor.register]]
addr = 0x06
encoding = "u8"
expr = "if(pm_reset == 1.0, 65.0, pwr_mgmt_1)"

# PWR_MGMT_2 (07h), reset 00h: DISABLE_ACCEL bits 5:3 and DISABLE_GYRO bits 2:0 (111 = disabled, 000 = on)
[[sensor.write_register]]
addr = 0x07
encoding = "u8"
store = "pwr_mgmt_2"
default = 0
[[sensor.write_register.field]]
name = "dis_accel"
bits = [5, 3]
[[sensor.write_register.field]]
name = "dis_gyro"
bits = [2, 0]
[[sensor.register]]
addr = 0x07
encoding = "u8"
expr = "pwr_mgmt_2"

# INT_PIN_CFG (0Fh), reset 00h
[[sensor.write_register]]
addr = 0x0F
encoding = "u8"
store = "int_pin_cfg"
default = 0
[[sensor.register]]
addr = 0x0F
encoding = "u8"
expr = "int_pin_cfg"

# INT_ENABLE (10h), reset 00h
[[sensor.write_register]]
addr = 0x10
encoding = "u8"
store = "int_enable"
default = 0
[[sensor.register]]
addr = 0x10
encoding = "u8"
expr = "int_enable"

# INT_ENABLE_1 (11h), reset 00h
[[sensor.write_register]]
addr = 0x11
encoding = "u8"
store = "int_enable_1"
default = 0
[[sensor.register]]
addr = 0x11
encoding = "u8"
expr = "int_enable_1"

# INT_ENABLE_2 (12h), reset 00h
[[sensor.write_register]]
addr = 0x12
encoding = "u8"
store = "int_enable_2"
default = 0
[[sensor.register]]
addr = 0x12
encoding = "u8"
expr = "int_enable_2"

# INT_ENABLE_3 (13h), reset 00h
[[sensor.write_register]]
addr = 0x13
encoding = "u8"
store = "int_enable_3"
default = 0
[[sensor.register]]
addr = 0x13
encoding = "u8"
expr = "int_enable_3"

# FIFO_EN_1 (66h), reset 00h
[[sensor.write_register]]
addr = 0x66
encoding = "u8"
store = "fifo_en_1"
default = 0
[[sensor.register]]
addr = 0x66
encoding = "u8"
expr = "fifo_en_1"

# FIFO_EN_2 (67h), reset 00h
[[sensor.write_register]]
addr = 0x67
encoding = "u8"
store = "fifo_en_2"
default = 0
[[sensor.register]]
addr = 0x67
encoding = "u8"
expr = "fifo_en_2"

# FIFO_RST (68h), reset 00h
[[sensor.write_register]]
addr = 0x68
encoding = "u8"
store = "fifo_rst"
default = 0
[[sensor.register]]
addr = 0x68
encoding = "u8"
expr = "fifo_rst"

# FIFO_MODE (69h), reset 00h
[[sensor.write_register]]
addr = 0x69
encoding = "u8"
store = "fifo_mode"
default = 0
[[sensor.register]]
addr = 0x69
encoding = "u8"
expr = "fifo_mode"

# FIFO_CFG (76h), reset 00h
[[sensor.write_register]]
addr = 0x76
encoding = "u8"
store = "fifo_cfg"
default = 0
[[sensor.register]]
addr = 0x76
encoding = "u8"
expr = "fifo_cfg"

# REG_BANK_SEL (7Fh, in every bank), reset 00h: USER_BANK bits 5:4. Recorded and read back; the map is NOT banked (see the card header).
[[sensor.write_register]]
addr = 0x7F
encoding = "u8"
store = "reg_bank_sel"
default = 0
[[sensor.write_register.field]]
name = "user_bank"
bits = [5, 4]
[[sensor.register]]
addr = 0x7F
encoding = "u8"
expr = "reg_bank_sel"

# User Bank 2 registers at addresses bank 0 leaves unused, so they cannot alias a bank-0 register: GYRO_CONFIG_1 (01h) reset 01h
# with GYRO_FS_SEL bits 2:1, and ACCEL_CONFIG (14h) reset 01h with ACCEL_FS_SEL bits 2:1 (Sections 10.2 and 10.15). They set the
# data scale below. Bank 3 uses 14h too (I2C_SLV4_REG), so a bank-3 write there would alias ACCEL_CONFIG.
# GYRO_CONFIG_1 (bank 2, 01h)
[[sensor.write_register]]
addr = 0x01
encoding = "u8"
store = "gyro_config_1"
default = 1
[[sensor.write_register.field]]
name = "gyro_fs"
bits = [2, 1]
[[sensor.register]]
addr = 0x01
encoding = "u8"
expr = "gyro_config_1"

# ACCEL_CONFIG (bank 2, 14h)
[[sensor.write_register]]
addr = 0x14
encoding = "u8"
store = "accel_config"
default = 1
[[sensor.write_register.field]]
name = "accel_fs"
bits = [2, 1]
[[sensor.register]]
addr = 0x14
encoding = "u8"
expr = "accel_config"

# Event/status registers read their reset value 00h (no event engine, auxiliary master or FIFO is modelled).
[[sensor.register]]
addr = 0x17
const = [0x00]

[[sensor.register]]
addr = 0x19
const = [0x00]

[[sensor.register]]
addr = 0x1A
const = [0x00]

[[sensor.register]]
addr = 0x1B
const = [0x00]

[[sensor.register]]
addr = 0x1C
const = [0x00]

[[sensor.register]]
addr = 0x28
const = [0x00]

[[sensor.register]]
addr = 0x29
const = [0x00]

# FIFO_COUNTH / FIFO_COUNTL (70h, 71h): the FIFO stays empty
[[sensor.register]]
addr = 0x70
const = [0x00, 0x00]

# DATA_RDY_STATUS (74h) RAW_DATA_RDY[3:0]: set while a sensor is running (output rates are not modelled).
[[sensor.register]]
addr = 0x74
encoding = "u8"
expr = "if(((1.0 - pm_sleep) * (1.0 - pm_reset)) * (if(dis_accel == 7.0, 0.0, 1.0)) + ((1.0 - pm_sleep) * (1.0 - pm_reset)) * (if(dis_gyro == 7.0, 0.0, 1.0)) > 0.0, 1.0, 0.0)"

# Output registers, high byte first, 16-bit two's complement (Sections 8.18 to 8.31). Sensitivity at the reset full scale and by
# GYRO_FS_SEL / ACCEL_FS_SEL: accelerometer 16384/8192/4096/2048 LSB/g, gyroscope 131/65.5/32.8/16.4 LSB/dps (Tables 1 and 2);
# temperature TEMP_degC = (TEMP_OUT - RoomTemp_Offset)/333.87 + 21 degC with a 0 LSB offset (Table 5). Each reads zero while its
# sensor is asleep, in reset or disabled.
[[sensor.register]]
addr = 0x2D
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * (if(dis_accel == 7.0, 0.0, 1.0)) * accel_x_g * if(accel_fs == 0.0, 16384.0, if(accel_fs == 1.0, 8192.0, if(accel_fs == 2.0, 4096.0, 2048.0)))"

[[sensor.register]]
addr = 0x2F
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * (if(dis_accel == 7.0, 0.0, 1.0)) * accel_y_g * if(accel_fs == 0.0, 16384.0, if(accel_fs == 1.0, 8192.0, if(accel_fs == 2.0, 4096.0, 2048.0)))"

[[sensor.register]]
addr = 0x31
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * (if(dis_accel == 7.0, 0.0, 1.0)) * accel_z_g * if(accel_fs == 0.0, 16384.0, if(accel_fs == 1.0, 8192.0, if(accel_fs == 2.0, 4096.0, 2048.0)))"

[[sensor.register]]
addr = 0x33
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * (if(dis_gyro == 7.0, 0.0, 1.0)) * gyro_x_dps * if(gyro_fs == 0.0, 131.0, if(gyro_fs == 1.0, 65.5, if(gyro_fs == 2.0, 32.8, 16.4)))"

[[sensor.register]]
addr = 0x35
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * (if(dis_gyro == 7.0, 0.0, 1.0)) * gyro_y_dps * if(gyro_fs == 0.0, 131.0, if(gyro_fs == 1.0, 65.5, if(gyro_fs == 2.0, 32.8, 16.4)))"

[[sensor.register]]
addr = 0x37
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * (if(dis_gyro == 7.0, 0.0, 1.0)) * gyro_z_dps * if(gyro_fs == 0.0, 131.0, if(gyro_fs == 1.0, 65.5, if(gyro_fs == 2.0, 32.8, 16.4)))"

[[sensor.register]]
addr = 0x39
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * (1.0 - pm_tempdis) * (temp_c - 21.0) * 333.87"

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.71   # Table 4, VDD min (no POR voltage is published)
idle_a = 0.000008             # Table 4, full-chip sleep mode
read_a = 0.00311              # Table 4, 9-axis low-noise mode with the compass in continuous mode
write_a = 0.00311
low_power_a = 0.000008        # Table 4, full-chip sleep mode

[models.coverage]
implements = ["pin_roles", "logic_levels_at_1v8_vddio", "sleep_supply_current", "absolute_ratings", "supply_ranges", "i2c_address_strap", "register_map_bank0", "who_am_i_read", "reset_values", "power_management_readback", "device_reset_self_clear", "accelerometer_gyroscope_temperature_data", "full_scale_range_scaling", "sensor_disable_gating", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["register_banks_1_to_3", "bank_qualified_registers", "spi_register_map", "magnetometer_ak09916", "auxiliary_i2c_master", "fifo", "dmp", "interrupt_engine", "wake_on_motion", "digital_low_pass_filters", "sample_rate_dividers", "self_test", "odr_timing", "per_mode_supply_current", "device_reset_register_restore"]

