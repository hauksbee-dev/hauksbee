[[sensor.register]]
addr = 0x26
encoding = "i16_le"
expr = "if(odr_g > 0.0, gyro_z_dps * 1000.0 / if(fs_125 == 1.0, 4.375, if(fs_g == 0.0, 8.75, if(fs_g == 1.0, 17.5, if(fs_g == 2.0, 35.0, 70.0)))), 0.0)"

[[sensor.register]]
addr = 0x28
encoding = "i16_le"
expr = "if(odr_xl > 0.0, accel_x_g * 1000.0 / if(fs_xl == 0.0, 0.061, if(fs_xl == 1.0, 0.488, if(fs_xl == 2.0, 0.122, 0.244))), 0.0)"

[[sensor.register]]
addr = 0x2A
encoding = "i16_le"
expr = "if(odr_xl > 0.0, accel_y_g * 1000.0 / if(fs_xl == 0.0, 0.061, if(fs_xl == 1.0, 0.488, if(fs_xl == 2.0, 0.122, 0.244))), 0.0)"

[[sensor.register]]
addr = 0x2C
encoding = "i16_le"
expr = "if(odr_xl > 0.0, accel_z_g * 1000.0 / if(fs_xl == 0.0, 0.061, if(fs_xl == 1.0, 0.488, if(fs_xl == 2.0, 0.122, 0.244))), 0.0)"

