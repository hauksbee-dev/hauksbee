[[sensor.register]]
addr = 0x5F
encoding = "u8"
expr = "md2_cfg"

# I3C_BUS_AVB (62h), default 00h
[[sensor.write_register]]
addr = 0x62
encoding = "u8"
store = "i3c_bus_avb"
default = 0
[[sensor.register]]
addr = 0x62
encoding = "u8"
expr = "i3c_bus_avb"

# X_OFS_USR (73h), default 00h
[[sensor.write_register]]
addr = 0x73
encoding = "u8"
store = "x_ofs_usr"
default = 0
[[sensor.register]]
addr = 0x73
encoding = "u8"
expr = "x_ofs_usr"

# Y_OFS_USR (74h), default 00h
[[sensor.write_register]]
addr = 0x74
encoding = "u8"
store = "y_ofs_usr"
