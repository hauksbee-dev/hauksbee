# Official built-in part library: sensors_motion.
#
# Cards here are written from vendor datasheets only (every value carries a basis and a source).
# See target/launch/official-parts-20261022/ranking.md for the batch plan.

# ─────────────────────────────────────────────────────────────────────────────
# ADXL345: Analog Devices 3-axis +-2/4/8/16 g digital accelerometer, 14-terminal
# LGA 3 x 5 x 1 mm (CC-14-1).
#
# Source: Analog Devices "3-Axis, +-2 g/+-4 g/+-8 g/+-16 g Digital Accelerometer",
#   ADXL345 data sheet Rev. G, May 2022. Table 1 Specifications, Table 2 Absolute
#   Maximum Ratings, Table 3 Package Characteristics, Table 5 Pin Function
#   Descriptions, Tables 7 and 8 current consumption, Tables 9, 11, 13 digital
#   levels, Serial Communications (I2C addressing, ALT ADDRESS), Table 19 Register
#   Map. The register addresses and DEVID were cross-checked against the Renode
#   ADXL345 model (Antmicro, MIT licence; its register enum and DevID = 0xE5 agree).
#   Renode models no reset values or configuration read-back, so those come from
#   Table 19 alone; nothing was copied from it.
#
# BUS PERSONALITY. This card models the I2C personality (CS tied high, ALT ADDRESS
# at VDD I/O = 0x1D, at GND = 0x53). The part's SPI personality (3- and 4-wire,
# CPOL = CPHA = 1, 5 MHz max) is the same register map on the same pads, but a
# card carries one [models.peripheral], so it is not modelled here (a schema gap).
# The sheet gives CS and ALT ADDRESS no internal pull ("there is no known state or
# default state for the CS or ALT ADDRESS pin if left floating"), so both are
# must_not_float roles and a floating strap leaves the address assumed and disclosed.
#
# LOGIC LEVELS are fractions of VDD I/O (Tables 9, 11, 13), evaluated here at the
# Table 1 typical VDD I/O = 1.8 V (the I2C VOL row for VDD I/O < 2 V is 0.2 x VDD I/O).
#
# BEHAVIOUR. DEVID, every read/write configuration register (read back as
# written) and the six data registers answer. Data registers read zero in standby
# (Measure = 0) and the accel_x_g/y_g/z_g inputs scaled per DATA_FORMAT once
# Measure is set. Not modelled: FIFO contents and modes, the interrupt engine
# (INT_SOURCE/INT_ENABLE are plain registers; only DATA_READY follows Measure), tap
# and activity detection, self-test, the Justify bit, the 3200/1600 Hz data format,
# sequential multi-byte register writes (only the first byte after the pointer is
# decoded), the SPI personality, and ODR timing.
[[models]]
id = "adxl345"
kind = "digital"
description = "Analog Devices ADXL345 3-axis digital accelerometer, 14-terminal LGA (strap-selected I2C register map: DEVID, configuration registers, acceleration data; pad map, logic levels and supply draw)"

[models.match]
# Ordering Guide: ADXL345BCCZ, ADXL345BCCZ-RL, ADXL345BCCZ-RL7. ADXL343, ADXL346,
# ADXL344 and ADXL375 are different parts with different DEVID values.
value_re = "(?i)^ADXL345(BCCZ(-RL7?)?)?$"

[models.params]
# Tables 9, 11 and 13 are fractions of VDD I/O; values below are those fractions at
# VDD I/O = 1.8 V (Table 1 typical). The printed fractions are the characteristic
# rows at the end of the card.
voh   = 1.44     # VOH 0.8 x VDD I/O min (Tables 9 and 13)
vol   = 0.36     # VOL 0.2 x VDD I/O max at IOL = 300 uA (Table 13); the I2C row (Table 11) is the same 0.2 x VDD I/O at 3 mA for VDD I/O < 2 V
vih   = 1.26     # VIH 0.7 x VDD I/O min
vil   = 0.54     # VIL 0.3 x VDD I/O max
supply_static_ua = 140.0   # Table 1 supply current typ, ODR >= 100 Hz
supply_pin = "6"           # VS
gnd_pin    = "2"           # GND
warning = "I2C register map is executable (DEVID, configuration registers, acceleration data); SPI personality, FIFO, interrupts, tap/activity detection and self-test are not modelled"
# Serial Communications: no internal pull on CS or ALT ADDRESS.
must_not_float_roles = "cs,sdo"

[models.i2c]
address = 0x53
basis = "Analog Devices ADXL345 Rev. G PDF p.17: ALT ADDRESS pin (SDO, pin 12) high gives 7-bit address 0x1D, grounded gives 0x53"
[[models.i2c.select]]
address = 0x53
straps = { sdo = "low" }
[[models.i2c.select]]
address = 0x1D
straps = { sdo = "high" }

[models.pins]
# Table 5 Pin Function Descriptions, all 14 terminals. SCL/SCLK, SDA/SDI/SDIO and
# SDO/ALT ADDRESS use the bus vocabulary.
"1"  = "vddio"   # VDD I/O, digital interface supply, 1.7 V to VS
"2"  = "gnd"
"3"  = "res_a"   # reserved: connect to VS or leave open
"4"  = "gnd2"
"5"  = "gnd3"
"6"  = "vdd"     # VS, supply voltage, 2.0 V to 3.6 V
"7"  = "cs"      # chip select: high selects I2C
"8"  = "int1"    # interrupt 1 output
"9"  = "int2"    # interrupt 2 output
"10" = "nc"      # not internally connected
"11" = "res_b"   # reserved: connect to GND or leave open
"12" = "sdo"     # SPI SDO; in I2C the ALT ADDRESS select (VDD I/O = 0x1D, GND = 0x53)
"13" = "sda"     # I2C SDA / SPI SDI / 3-wire SDIO
"14" = "scl"     # I2C SCL / SPI SCLK

[models.ratings]
# Table 2: VS and VDD I/O -0.3 V to +3.9 V; digital pins -0.3 V to VDD I/O + 0.3 V or
# 3.9 V, whichever is less. Table 3: thetaJA 150, thetaJC 85 C/W (14-terminal LGA).
# Table 2 powered temperature range -40 C to +105 C.
max_voltage_v = 3.9
theta_ja_c_per_w = 150.0
theta_jc_c_per_w = 85.0

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.0
max_v = 3.6
abs_max_v = 3.9
basis = "ADI ADXL345 Rev. G, Table 1 Operating Voltage Range (VS) 2.0 V to 3.6 V; Table 2 Absolute Maximum Ratings, VS -0.3 V to +3.9 V"

[[models.envelope]]
kind = "supply_range"
pin = "vddio"
min_v = 1.7
max_v = 3.6
abs_max_v = 3.9
basis = "ADI ADXL345 Rev. G, Table 1 Interface Voltage Range (VDD I/O) 1.7 V to VS (3.6 V at the VS maximum); Table 2 Absolute Maximum Ratings, VDD I/O -0.3 V to +3.9 V"

# Serial Communications: "It is required that the CS pin be connected to VDD I/O and
# that the ALT ADDRESS pin be connected to either VDD I/O or GND when using I2C."
# Figure 41: ALT ADDRESS high gives 0x1D (0011101), grounded gives 0x53 (1010011).
[models.peripheral]
kind = "register_map"
required_high_roles = ["cs"]
address_select_role = "sdo"
address_when_low = 0x53
address_when_high = 0x1D
spec_toml = '''
[sensor]
name = "ADXL345 register map"
bus = "i2c"
i2c_address = 0x53

# Rev. G stimulus: the acceleration on each axis, in g. The default is the part
# lying flat and still (+1 g on Z, an ASSUMED orientation; the sheet's own test
# condition is 0 g). Data registers read zero until POWER_CTL.Measure is set.

[[sensor.input]]
name = "accel_x_g"
default = 0.0

[[sensor.input]]
name = "accel_y_g"
default = 0.0

[[sensor.input]]
name = "accel_z_g"
default = 1.0

# Table 19: DEVID (0x00) = 0xE5, read only.
[[sensor.register]]
addr = 0x00
const = [0xE5]

# Table 19 read/write registers, each reading back what firmware wrote. Reset 0x00 unless noted.
# THRESH_TAP, 62.5 mg/LSB
[[sensor.write_register]]
addr = 0x1D
encoding = "u8"
store = "thresh_tap"
default = 0
[[sensor.register]]
addr = 0x1D
encoding = "u8"
expr = "thresh_tap"

# OFSX, 15.6 mg/LSB, two's complement (read back as written)
[[sensor.write_register]]
addr = 0x1E
encoding = "u8"
store = "ofsx"
default = 0
[[sensor.register]]
addr = 0x1E
encoding = "u8"
expr = "ofsx"

# OFSY
[[sensor.write_register]]
addr = 0x1F
encoding = "u8"
store = "ofsy"
default = 0
[[sensor.register]]
addr = 0x1F
encoding = "u8"
expr = "ofsy"

# OFSZ
[[sensor.write_register]]
addr = 0x20
encoding = "u8"
store = "ofsz"
default = 0
[[sensor.register]]
addr = 0x20
encoding = "u8"
expr = "ofsz"

# DUR, 625 us/LSB
[[sensor.write_register]]
addr = 0x21
encoding = "u8"
store = "dur"
default = 0
[[sensor.register]]
addr = 0x21
encoding = "u8"
expr = "dur"

# Latent, 1.25 ms/LSB
[[sensor.write_register]]
addr = 0x22
encoding = "u8"
store = "latent"
default = 0
[[sensor.register]]
addr = 0x22
encoding = "u8"
expr = "latent"

# Window, 1.25 ms/LSB
[[sensor.write_register]]
addr = 0x23
encoding = "u8"
store = "window"
default = 0
[[sensor.register]]
addr = 0x23
encoding = "u8"
expr = "window"

# THRESH_ACT, 62.5 mg/LSB
[[sensor.write_register]]
addr = 0x24
encoding = "u8"
store = "thresh_act"
default = 0
[[sensor.register]]
addr = 0x24
encoding = "u8"
expr = "thresh_act"

# THRESH_INACT, 62.5 mg/LSB
[[sensor.write_register]]
addr = 0x25
encoding = "u8"
store = "thresh_inact"
default = 0
[[sensor.register]]
addr = 0x25
encoding = "u8"
expr = "thresh_inact"

# TIME_INACT, 1 s/LSB
[[sensor.write_register]]
addr = 0x26
encoding = "u8"
store = "time_inact"
default = 0
[[sensor.register]]
addr = 0x26
encoding = "u8"
expr = "time_inact"

# ACT_INACT_CTL
[[sensor.write_register]]
addr = 0x27
encoding = "u8"
store = "act_inact_ctl"
default = 0
[[sensor.register]]
addr = 0x27
encoding = "u8"
expr = "act_inact_ctl"

# THRESH_FF, 62.5 mg/LSB
[[sensor.write_register]]
addr = 0x28
encoding = "u8"
store = "thresh_ff"
default = 0
[[sensor.register]]
addr = 0x28
encoding = "u8"
expr = "thresh_ff"

# TIME_FF, 5 ms/LSB
[[sensor.write_register]]
addr = 0x29
encoding = "u8"
store = "time_ff"
default = 0
[[sensor.register]]
addr = 0x29
encoding = "u8"
expr = "time_ff"

# TAP_AXES
[[sensor.write_register]]
addr = 0x2A
encoding = "u8"
store = "tap_axes"
default = 0
[[sensor.register]]
addr = 0x2A
encoding = "u8"
expr = "tap_axes"

# BW_RATE, reset 0x0A (100 Hz, normal power)
[[sensor.write_register]]
addr = 0x2C
encoding = "u8"
store = "bw_rate"
default = 10
[[sensor.register]]
addr = 0x2C
encoding = "u8"
expr = "bw_rate"

# POWER_CTL, reset 0x00 (standby); Measure is bit 3
[[sensor.write_register]]
addr = 0x2D
encoding = "u8"
store = "power_ctl"
default = 0
[[sensor.write_register.field]]
name = "pc_measure"
bits = [3, 3]
[[sensor.register]]
addr = 0x2D
encoding = "u8"
expr = "power_ctl"

# INT_ENABLE
[[sensor.write_register]]
addr = 0x2E
encoding = "u8"
store = "int_enable"
default = 0
[[sensor.register]]
addr = 0x2E
encoding = "u8"
expr = "int_enable"

# INT_MAP
[[sensor.write_register]]
addr = 0x2F
encoding = "u8"
store = "int_map"
default = 0
[[sensor.register]]
addr = 0x2F
encoding = "u8"
expr = "int_map"

# DATA_FORMAT, reset 0x00; FULL_RES bit 3, Justify bit 2, Range bits 1:0
[[sensor.write_register]]
addr = 0x31
encoding = "u8"
store = "data_format"
default = 0
[[sensor.write_register.field]]
name = "df_full_res"
bits = [3, 3]
[[sensor.write_register.field]]
name = "df_range"
bits = [1, 0]
[[sensor.register]]
addr = 0x31
encoding = "u8"
expr = "data_format"

# FIFO_CTL
[[sensor.write_register]]
addr = 0x38
encoding = "u8"
store = "fifo_ctl"
default = 0
[[sensor.register]]
addr = 0x38
encoding = "u8"
expr = "fifo_ctl"

# ACT_TAP_STATUS (0x2B), read only, reset 0x00
[[sensor.register]]
addr = 0x2B
const = [0x00]

# INT_SOURCE (0x30), read only, reset 0x02; DATA_READY (bit 7) is set once Measure is on (data is available at once; the ODR is not timed)
[[sensor.register]]
addr = 0x30
encoding = "u8"
expr = "2.0 + 128.0 * pc_measure"

# FIFO_STATUS (0x39), read only, reset 0x00 (FIFO bypassed, empty)
[[sensor.register]]
addr = 0x39
const = [0x00]

# Table 19: DATAX0..DATAZ1 (0x32..0x37), two's complement, LSB first. Counts follow
# DATA_FORMAT: 256 LSB/g in full resolution; 256/128/64/32 LSB/g at +-2/4/8/16 g
# with 10-bit resolution (Table 1). Saturates at the output resolution. The Justify bit
# is not applied.
[[sensor.register]]
addr = 0x32
encoding = "i16_le"
expr = "pc_measure * max(0.0 - if(df_full_res == 1.0, if(df_range == 0.0, 512.0, if(df_range == 1.0, 1024.0, if(df_range == 2.0, 2048.0, 4096.0))), 512.0), min(if(df_full_res == 1.0, if(df_range == 0.0, 512.0, if(df_range == 1.0, 1024.0, if(df_range == 2.0, 2048.0, 4096.0))), 512.0) - 1.0, accel_x_g * if(df_full_res == 1.0, 256.0, if(df_range == 0.0, 256.0, if(df_range == 1.0, 128.0, if(df_range == 2.0, 64.0, 32.0))))))"

[[sensor.register]]
addr = 0x34
encoding = "i16_le"
expr = "pc_measure * max(0.0 - if(df_full_res == 1.0, if(df_range == 0.0, 512.0, if(df_range == 1.0, 1024.0, if(df_range == 2.0, 2048.0, 4096.0))), 512.0), min(if(df_full_res == 1.0, if(df_range == 0.0, 512.0, if(df_range == 1.0, 1024.0, if(df_range == 2.0, 2048.0, 4096.0))), 512.0) - 1.0, accel_y_g * if(df_full_res == 1.0, 256.0, if(df_range == 0.0, 256.0, if(df_range == 1.0, 128.0, if(df_range == 2.0, 64.0, 32.0))))))"

[[sensor.register]]
addr = 0x36
encoding = "i16_le"
expr = "pc_measure * max(0.0 - if(df_full_res == 1.0, if(df_range == 0.0, 512.0, if(df_range == 1.0, 1024.0, if(df_range == 2.0, 2048.0, 4096.0))), 512.0), min(if(df_full_res == 1.0, if(df_range == 0.0, 512.0, if(df_range == 1.0, 1024.0, if(df_range == 2.0, 2048.0, 4096.0))), 512.0) - 1.0, accel_z_g * if(df_full_res == 1.0, 256.0, if(df_range == 0.0, 256.0, if(df_range == 1.0, 128.0, if(df_range == 2.0, 64.0, 32.0))))))"

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 2.0    # Table 1, VS min (no POR voltage is published)
idle_a = 0.000140             # Table 1, supply current typ, ODR >= 100 Hz
read_a = 0.000140
write_a = 0.000140
low_power_a = 0.0000001       # Table 1, standby mode leakage typ

[models.coverage]
implements = ["pin_roles", "logic_levels_at_1v8_vddio", "measurement_supply_current", "absolute_ratings", "supply_ranges", "i2c_bus_mode_strap", "i2c_address_strap", "register_map", "devid_read", "reset_values", "configuration_register_readback", "acceleration_data_registers", "data_format_range_scaling", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["spi_register_map", "fifo", "interrupt_engine", "tap_and_activity_detection", "self_test", "justify_bit", "high_odr_data_format", "odr_timing", "sequential_register_write", "per_odr_supply_current", "vddio_supply_current_split"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.analog.com/media/en/technical-documentation/data-sheets/ADXL345.pdf"
title = "Analog Devices ADXL345 3-Axis, +-2 g/+-4 g/+-8 g/+-16 g Digital Accelerometer, Rev. G, May 2022"
locator = "Table 1 Specifications; Table 2 Absolute Maximum Ratings; Table 3 Package Characteristics; Table 5 Pin Function Descriptions p.6; Tables 7 and 8; Tables 9, 11 and 13 digital levels; Serial Communications (I2C, Figure 41); Table 19 Register Map p.23"
sha256 = "87ae2212498c35a6759d8732adee0ec9b9d8d60fa95688bc5904f1f07ceb8ff6"

# Tables 9 and 13 as printed, in fractions of VDD I/O (Table 11 repeats VIH/VIL).
[[models.source.characteristic]]
parameter = "VIL input low level"
max = 0.3
unit = "VDDIO"
conditions = "SPI and I2C digital inputs"
basis = "Tables 9 and 11, 0.3 x VDD I/O max"

[[models.source.characteristic]]
parameter = "VIH input high level"
min = 0.7
unit = "VDDIO"
conditions = "SPI and I2C digital inputs"
basis = "Tables 9 and 11, 0.7 x VDD I/O min"

[[models.source.characteristic]]
parameter = "VOH output high level (interrupt pins)"
min = 0.8
unit = "VDDIO"
conditions = "IOH = -150 uA"
basis = "Table 13, 0.8 x VDD I/O min"

# Table 13 VOL 0.2 x VDD I/O max at IOL = 300 uA is the `vol` param above; it is not cited as a row because 300 uA counts as a heavy test current
# to the output-load rule, and the sheet prints no lighter VOL point.

# ─────────────────────────────────────────────────────────────────────────────
# MPU-6050: InvenSense (TDK) 6-axis motion sensor (3-axis gyroscope, 3-axis
# accelerometer, on-chip temperature sensor), 24-pin QFN 4 x 4 x 0.9 mm.
#
# Source: InvenSense "MPU-6000 and MPU-6050 Product Specification", PS-MPU-6000A-00
#   Revision 3.2, 11/16/2011 (Sections 6.2 to 6.9 specifications, Section 7.1 Pin Out
#   and Signal Description) and "MPU-6000 and MPU-6050 Register Map and Descriptions",
#   RM-MPU-6000A-00 Revision 4.0, 03/09/2012 (Section 3 Register Map, Section 4
#   register descriptions). These are the newest copies obtainable: the TDK site
#   serves an HTML bot page for the current revisions (PS Rev 3.4, RM Rev 4.2), and the
#   copies read are the mirrors at alliance.seas.upenn.edu and cdn.sparkfun.com.
#
# I2C ONLY. The MPU-6050 has no SPI port (pin 8 is VLOGIC, not /CS; the SPI port is the
# MPU-6000). AD0 (pin 9) sets the address LSB: low 0x68 (1101000), high 0x69 (1101001).
# WHO_AM_I (0x75) reads 0x68 on this part whichever address is selected.
#
# THE PART POWERS UP ASLEEP: PWR_MGMT_1 resets to 0x40 (SLEEP = 1), and the model's
# measurement registers read zero until firmware clears SLEEP. That is the datasheet's
# power-on behaviour, not a model limitation.
#
# LOGIC LEVELS are fractions of VLOGIC (Section 6.4), evaluated at the stated
# VLOGIC = 1.8 V +-5% (VIH/VIL, VOH); the I2C VOL is the absolute 0.4 V at 3 mA (Section 6.5).
#
# Not modelled: the auxiliary I2C master and its slave registers, the FIFO and FIFO
# count, the DMP, motion/zero-motion detection, interrupt generation and latching,
# self-test, the digital low-pass filter, sample-rate timing, CLKOUT, the TEMP_DIS and
# CYCLE modes, and read-to-clear behaviour. No thermal resistance is printed in
# this revision.
[[models]]
id = "mpu6050"
kind = "digital"
description = "InvenSense MPU-6050 6-axis gyro/accelerometer/temperature sensor, 24-pin QFN (strap-selected I2C register map: WHO_AM_I, configuration registers, power-up sleep, sensor data; pad map, logic levels and supply draw)"

[models.match]
# MPU-6000 is the SPI-capable sibling and MPU-6500/9150/9250 are different dies with
# different WHO_AM_I values; the anchored number excludes them all.
value_re = "(?i)^MPU-?6050$"

[models.params]
voh   = 1.62     # VOH 0.9 x VLOGIC min (RLOAD = 1 Mohm, SDO/INT) at VLOGIC = 1.8 V
vol   = 0.4      # Section 6.5, I2C VOL1 0 to 0.4 V at 3 mA sink
vih   = 1.26     # VIH 0.7 x VLOGIC min at VLOGIC = 1.8 V
vil   = 0.54     # VIL 0.3 x VLOGIC max at VLOGIC = 1.8 V
supply_static_ua = 3800.0   # Section 6.3, normal operating current, gyroscope + accelerometer (DMP disabled) 3.8 mA
supply_pin = "13"           # VDD
gnd_pin    = "18"           # GND
warning = "I2C register map is executable (WHO_AM_I, configuration registers, power-up sleep, accelerometer/gyroscope/temperature data); the auxiliary I2C master, FIFO, DMP, interrupts and self-test are not modelled"

[models.i2c]
address = 0x68
basis = "InvenSense MPU-6000/MPU-6050 PS-MPU-6000A-00 rev 3.2 PDF p.15 I2C ADDRESS row: AD0 = 0 gives 1101000, AD0 = 1 gives 1101001"
[[models.i2c.select]]
address = 0x68
straps = { ad0 = "low" }
[[models.i2c.select]]
address = 0x69
straps = { ad0 = "high" }

[models.pins]
# Section 7.1 Pin Out and Signal Description, QFN-24. NC pads are numbered apart
# because a role names one pad.
"1"  = "clkin"   # optional external reference clock input; connect to GND if unused
"2"  = "nc"
"3"  = "nc2"
"4"  = "nc3"
"5"  = "nc4"
"6"  = "aux_da"  # auxiliary I2C master data
"7"  = "aux_cl"  # auxiliary I2C master clock
"8"  = "vddio"   # VLOGIC, digital I/O supply (MPU-6050 only), 1.71 V to VDD
"9"  = "ad0"     # I2C slave address LSB
"10" = "regout"  # regulator filter capacitor connection
"11" = "fsync"   # frame synchronization input; connect to GND if unused
"12" = "int"     # interrupt output (push-pull or open drain)
"13" = "vdd"     # power supply, 2.375 V to 3.46 V
"14" = "nc5"
"15" = "nc6"
"16" = "nc7"
"17" = "nc8"
"18" = "gnd"
"19" = "resv"    # reserved: do not connect
"20" = "cpout"   # charge pump capacitor connection
"21" = "resv2"   # reserved: do not connect
"22" = "clkout"  # system clock output
"23" = "scl"
"24" = "sda"

[models.ratings]
# Section 6.9: VDD -0.5 V to +6 V; inputs -0.5 V to VDD + 0.5 V.
max_voltage_v = 6.0

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.375
max_v = 3.46
abs_max_v = 6.0
basis = "InvenSense PS-MPU-6000A-00 Rev 3.2, Section 6.3 VDD Power Supply Operating Voltages 2.375 V to 3.46 V; Section 6.9 Absolute Maximum Ratings, VDD -0.5 V to +6 V"

[[models.envelope]]
kind = "supply_range"
pin = "vddio"
min_v = 1.71
max_v = 3.46
basis = "InvenSense PS-MPU-6000A-00 Rev 3.2, Section 6.3 VLOGIC reference voltage range 1.71 V to VDD (VDD maximum 3.46 V); VLOGIC must be <= VDD at all times"

# Section 6.4: I2C address AD0 = 0 gives 1101000 (0x68), AD0 = 1 gives 1101001 (0x69).
[models.peripheral]
kind = "register_map"
address_select_role = "ad0"
address_when_low = 0x68
address_when_high = 0x69
spec_toml = '''
[sensor]
name = "MPU-6050 register map"
bus = "i2c"
i2c_address = 0x68

# Stimulus: acceleration in g (flat and still, +1 g on Z is an ASSUMED orientation), angular
# rate in deg/s and die temperature in degC (25 degC is an ASSUMED room-temperature default).
[[sensor.input]]
name = "accel_x_g"
default = 0.0

[[sensor.input]]
name = "accel_y_g"
default = 0.0

[[sensor.input]]
name = "accel_z_g"
default = 1.0

[[sensor.input]]
name = "gyro_x_dps"
default = 0.0

[[sensor.input]]
name = "gyro_y_dps"
default = 0.0

[[sensor.input]]
name = "gyro_z_dps"
default = 0.0

[[sensor.input]]
name = "temp_c"
default = 25.0

# Register Map Rev 4.0 section 4.34: WHO_AM_I (0x75) = 0x68, read only (the 6 upper bits of the I2C address;
# AD0 is not reflected).
[[sensor.register]]
addr = 0x75
const = [0x68]

# Register Map Rev 4.0 section 3: every register resets to 0x00 except 107 (0x6B) = 0x40 and 117 (0x75) = 0x68.
# SELF_TEST_X (0x0D)
[[sensor.write_register]]
addr = 0x0D
encoding = "u8"
store = "self_test_x"
default = 0
[[sensor.register]]
addr = 0x0D
encoding = "u8"
expr = "self_test_x"

# SELF_TEST_Y (0x0E)
[[sensor.write_register]]
addr = 0x0E
encoding = "u8"
store = "self_test_y"
default = 0
[[sensor.register]]
addr = 0x0E
encoding = "u8"
expr = "self_test_y"

# SELF_TEST_Z (0x0F)
[[sensor.write_register]]
addr = 0x0F
encoding = "u8"
store = "self_test_z"
default = 0
[[sensor.register]]
addr = 0x0F
encoding = "u8"
expr = "self_test_z"

# SELF_TEST_A (0x10)
[[sensor.write_register]]
addr = 0x10
encoding = "u8"
store = "self_test_a"
default = 0
[[sensor.register]]
addr = 0x10
encoding = "u8"
expr = "self_test_a"

# SMPLRT_DIV (0x19)
[[sensor.write_register]]
addr = 0x19
encoding = "u8"
store = "smplrt_div"
default = 0
[[sensor.register]]
addr = 0x19
encoding = "u8"
expr = "smplrt_div"

# CONFIG (0x1A): EXT_SYNC_SET[5:3], DLPF_CFG[2:0]
[[sensor.write_register]]
addr = 0x1A
encoding = "u8"
store = "config"
default = 0
[[sensor.register]]
addr = 0x1A
encoding = "u8"
expr = "config"

# GYRO_CONFIG (0x1B): FS_SEL is bits 4:3
[[sensor.write_register]]
addr = 0x1B
encoding = "u8"
store = "gyro_config"
default = 0
[[sensor.write_register.field]]
name = "fs_sel"
bits = [4, 3]
[[sensor.register]]
addr = 0x1B
encoding = "u8"
expr = "gyro_config"

# ACCEL_CONFIG (0x1C): AFS_SEL is bits 4:3
[[sensor.write_register]]
addr = 0x1C
encoding = "u8"
store = "accel_config"
default = 0
[[sensor.write_register.field]]
name = "afs_sel"
bits = [4, 3]
[[sensor.register]]
addr = 0x1C
encoding = "u8"
expr = "accel_config"

# MOT_THR (0x1F)
[[sensor.write_register]]
addr = 0x1F
encoding = "u8"
store = "mot_thr"
default = 0
[[sensor.register]]
addr = 0x1F
encoding = "u8"
expr = "mot_thr"

# FIFO_EN (0x23)
[[sensor.write_register]]
addr = 0x23
encoding = "u8"
store = "fifo_en"
default = 0
[[sensor.register]]
addr = 0x23
encoding = "u8"
expr = "fifo_en"

# I2C_MST_CTRL (0x24)
[[sensor.write_register]]
addr = 0x24
encoding = "u8"
store = "i2c_mst_ctrl"
default = 0
[[sensor.register]]
addr = 0x24
encoding = "u8"
expr = "i2c_mst_ctrl"

# INT_PIN_CFG (0x37)
[[sensor.write_register]]
addr = 0x37
encoding = "u8"
store = "int_pin_cfg"
default = 0
[[sensor.register]]
addr = 0x37
encoding = "u8"
expr = "int_pin_cfg"

# INT_ENABLE (0x38)
[[sensor.write_register]]
addr = 0x38
encoding = "u8"
store = "int_enable"
default = 0
[[sensor.register]]
addr = 0x38
encoding = "u8"
expr = "int_enable"

# MOT_DETECT_CTRL (0x69)
[[sensor.write_register]]
addr = 0x69
encoding = "u8"
store = "mot_detect_ctrl"
default = 0
[[sensor.register]]
addr = 0x69
encoding = "u8"
expr = "mot_detect_ctrl"

# USER_CTRL (0x6A)
[[sensor.write_register]]
addr = 0x6A
encoding = "u8"
store = "user_ctrl"
default = 0
[[sensor.register]]
addr = 0x6A
encoding = "u8"
expr = "user_ctrl"

# PWR_MGMT_1 (0x6B), reset 0x40: the part powers up asleep (DEVICE_RESET bit 7, SLEEP bit 6, CYCLE bit 5, TEMP_DIS bit 3, CLKSEL[2:0])
[[sensor.write_register]]
addr = 0x6B
encoding = "u8"
store = "pwr_mgmt_1"
default = 64
[[sensor.write_register.field]]
name = "pm_reset"
bits = [7, 7]
[[sensor.write_register.field]]
name = "pm_sleep"
bits = [6, 6]

# DEVICE_RESET (bit 7) self-clears: once set, the register reads back its reset value 0x40 (asleep).
# The other registers are not restored to their defaults.
[[sensor.register]]
addr = 0x6B
encoding = "u8"
expr = "if(pm_reset == 1.0, 64.0, pwr_mgmt_1)"

# PWR_MGMT_2 (0x6C)
[[sensor.write_register]]
addr = 0x6C
encoding = "u8"
store = "pwr_mgmt_2"
default = 0
[[sensor.register]]
addr = 0x6C
encoding = "u8"
expr = "pwr_mgmt_2"

# INT_STATUS (0x3A): DATA_RDY_INT (bit 0) is modelled as set whenever the part is awake (sample timing is not
# modelled). Read to clear is not modelled.
[[sensor.register]]
addr = 0x3A
encoding = "u8"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset))"

# FIFO_COUNT (0x72, 0x73): the FIFO is not modelled and reads empty.
[[sensor.register]]
addr = 0x72
const = [0x00, 0x00]

# Measurement registers 59 to 72, big-endian signed 16-bit. They read zero while SLEEP is set.
# Sensitivities: AFS_SEL 0..3 = 16384/8192/4096/2048 LSB/g; FS_SEL 0..3 = 131/65.5/32.8/16.4 LSB/(deg/s);
# temperature = TEMP_OUT/340 + 36.53 degC.
[[sensor.register]]
addr = 0x3B
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * accel_x_g * if(afs_sel == 0.0, 16384.0, if(afs_sel == 1.0, 8192.0, if(afs_sel == 2.0, 4096.0, 2048.0)))"

[[sensor.register]]
addr = 0x3D
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * accel_y_g * if(afs_sel == 0.0, 16384.0, if(afs_sel == 1.0, 8192.0, if(afs_sel == 2.0, 4096.0, 2048.0)))"

[[sensor.register]]
addr = 0x3F
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * accel_z_g * if(afs_sel == 0.0, 16384.0, if(afs_sel == 1.0, 8192.0, if(afs_sel == 2.0, 4096.0, 2048.0)))"

[[sensor.register]]
addr = 0x41
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * (temp_c - 36.53) * 340.0"

[[sensor.register]]
addr = 0x43
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * gyro_x_dps * if(fs_sel == 0.0, 131.0, if(fs_sel == 1.0, 65.5, if(fs_sel == 2.0, 32.8, 16.4)))"

[[sensor.register]]
addr = 0x45
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * gyro_y_dps * if(fs_sel == 0.0, 131.0, if(fs_sel == 1.0, 65.5, if(fs_sel == 2.0, 32.8, 16.4)))"

[[sensor.register]]
addr = 0x47
encoding = "i16_be"
expr = "((1.0 - pm_sleep) * (1.0 - pm_reset)) * gyro_z_dps * if(fs_sel == 0.0, 131.0, if(fs_sel == 1.0, 65.5, if(fs_sel == 2.0, 32.8, 16.4)))"

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 2.375  # Section 6.3, VDD min (no POR voltage is published)
idle_a = 0.0038               # Section 6.3, gyroscope + accelerometer, DMP disabled
read_a = 0.0038
write_a = 0.0038
low_power_a = 0.000005        # Section 6.3, full-chip idle mode supply current

[models.coverage]
implements = ["pin_roles", "logic_levels_at_1v8_vlogic", "normal_mode_supply_current", "absolute_ratings", "supply_ranges", "i2c_address_strap", "register_map", "who_am_i_read", "reset_values", "power_up_sleep", "configuration_register_readback", "accelerometer_gyroscope_temperature_data", "full_scale_range_scaling", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["auxiliary_i2c_master", "fifo", "digital_motion_processor", "motion_detection", "interrupt_engine", "self_test", "digital_low_pass_filter", "sample_rate_timing", "temp_dis_and_cycle_modes", "thermal_resistance", "supply_domain_current_split"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://alliance.seas.upenn.edu/~medesign/wiki/uploads/Guides/MPU6050_datasheet.pdf"
title = "InvenSense MPU-6000 and MPU-6050 Product Specification, PS-MPU-6000A-00 Revision 3.2, 11/16/2011"
locator = "Section 6.3 Electrical and Other Common Specifications; Section 6.4 Electrical Specifications (serial interface, I2C address, digital inputs and outputs); Section 6.5; Section 6.9 Absolute Maximum Ratings; Section 7.1 Pin Out and Signal Description"
sha256 = "75d163b19dccec6b6a038e90b95976eab5028cabf00035d84b2c012e8d46cfb5"
[[models.source.references]]
url = "https://cdn.sparkfun.com/datasheets/Sensors/Accelerometers/RM-MPU-6000A.pdf"
title = "InvenSense MPU-6000 and MPU-6050 Register Map and Descriptions, RM-MPU-6000A-00 Revision 4.0, 03/09/2012"
locator = "Section 3 Register Map (reset values); Sections 4.2 to 4.7 and 4.15 to 4.17 (configuration and interrupt status); Registers 59 to 72 (accelerometer, temperature and gyroscope measurements, sensitivities); Sections 4.29 to 4.31 and 4.34 (USER_CTRL, PWR_MGMT_1/2, WHO_AM_I)"
sha256 = "ccaa6312b9d86a9da79e26e511101e1150dc85a48255600010a854369cf7c05d"

# Section 6.4, as printed, in fractions of VLOGIC (the I2C VIL/VIH rows repeat them).
[[models.source.characteristic]]
parameter = "VIH high level input voltage"
min = 0.7
unit = "VLOGIC"
conditions = "MPU-6050"
basis = "Section 6.4, 0.7*VLOGIC min"

[[models.source.characteristic]]
parameter = "VIL low level input voltage"
max = 0.3
unit = "VLOGIC"
conditions = "MPU-6050"
basis = "Section 6.4, 0.3*VLOGIC max"

[[models.source.characteristic]]
parameter = "VOH high level output voltage"
min = 0.9
unit = "VLOGIC"
conditions = "RLOAD = 1 Mohm, MPU-6050"
basis = "Section 6.4, 0.9*VLOGIC min"

# ─────────────────────────────────────────────────────────────────────────────
# LSM6DSO: STMicroelectronics iNEMO inertial module, 3-axis accelerometer and
# 3-axis gyroscope, LGA-14L 2.5 x 3.0 x 0.83 mm.
#
# Source: STMicroelectronics LSM6DSO datasheet DS12140 - Rev 3, June 2024. Table 1 Pin
#   description, Table 2 Mechanical characteristics, Table 3 Electrical characteristics,
#   Table 4 Temperature sensor characteristics, Table 7 Absolute maximum ratings,
#   Section 5.1.1 I2C serial interface (SAD = 110101x), Table 19 Internal pin status,
#   Table 20 Registers address map, Section 9.11 WHO_AM_I (0Fh) = 6Ch.
#
# TWO CARDS, ONE WHO_AM_I. The LSM6DSO and LSM6DSOX both read 6Ch, and the same I2C
# address, so firmware cannot tell them apart by identity; each part has its own card
# because each is its own datasheet. The LSM6DSOX adds the machine learning core and
# sensor synchronisation (S4S) registers, not modelled in either card.
#
# I2C PERSONALITY ONLY. CS high selects I2C (Table 1), and SDO/SA0 sets the address LSB:
# ground gives 1101010 (0x6A), VDDIO gives 1101011 (0x6B). The SPI personality (3- and
# 4-wire, mode 3) is the same map on the same pads but a card carries one
# [models.peripheral]. SDO/SA0 has no internal pull-up by default (Table 19), so it is
# must_not_float. CS has a 30 to 50 kohm internal pull-up by default.
#
# LOGIC LEVELS are fractions of VDDIO (Table 3: VIH 0.7 x VDDIO, VIL 0.3 x VDDIO, VOH
# VDDIO - 0.2 V at 4 mA, VOL 0.2 V at 4 mA), evaluated at VDDIO = 1.8 V, the table's
# test supply.
#
# Not modelled: the SPI personality, the FIFO and timestamp, the interrupt/event
# engine and tap/free-fall/wake-up detection, the embedded functions (pedometer, tilt,
# the finite state machine), the sensor hub, the auxiliary SPI (OIS) interface, MIPI I3C, ODR timing,
# the CTRL8_XL filter-bandwidth/XL_FS_MODE variants, and the register restore that a
# software reset performs (SW_RESET and BOOT simply read back clear). No thermal
# resistance is printed in the datasheet.
[[models]]
id = "lsm6dso"
kind = "digital"
description = "STMicroelectronics LSM6DSO 6-axis IMU, LGA-14 (strap-selected I2C register map: WHO_AM_I 6Ch, control registers, acceleration/angular rate/temperature data; pad map, logic levels and supply draw)"

[models.match]
# Order codes: LSM6DSO and LSM6DSOTR. Neighbouring parts have their own cards or none: LSM6DSOX (machine-learning core, same WHO_AM_I), LSM6DSO32, LSM6DSR, LSM6DSL, LSM6DSM, LSM6DS3, LSM6DS33 and LSM6DSV.
value_re = "(?i)^LSM6DSO(TR)?$"

[models.params]
voh   = 1.6      # Table 3, VOH VDDIO - 0.2 V min at IOH = 4 mA, at VDDIO = 1.8 V
vol   = 0.2      # Table 3, VOL max at IOL = 4 mA
vih   = 1.26     # Table 3, VIH 0.7 x VDDIO min at VDDIO = 1.8 V
vil   = 0.54     # Table 3, VIL 0.3 x VDDIO max at VDDIO = 1.8 V
supply_static_ua = 550.0   # Table 3, IddHP typ, gyroscope and accelerometer in high-performance mode
supply_pin = "8"           # VDD
gnd_pin    = "6"           # GND
warning = "I2C register map is executable (WHO_AM_I, control registers, acceleration/angular rate/temperature data); the SPI personality, FIFO, interrupt engine, embedded functions and sensor hub are not modelled"
# Table 19: SDO/SA0 default is an input without pull-up.
must_not_float_roles = "sdo"

[models.pins]
# Table 1 Pin description, LGA-14. The mode 1 function is used for the roles.
"1"  = "sdo"      # SPI SDO; in I2C the address LSB SA0
"2"  = "sdx"      # mode 1: connect to VDDIO or GND (I2C master data in mode 2)
"3"  = "scx"      # mode 1: connect to VDDIO or GND (I2C master clock in mode 2)
"4"  = "int1"     # programmable interrupt 1
"5"  = "vddio"    # power supply for I/O pins (recommended 100 nF filter capacitor)
"6"  = "gnd"
"7"  = "gnd2"
"8"  = "vdd"      # power supply (recommended 100 nF filter capacitor)
"9"  = "int2"     # programmable interrupt 2 / data enable
"10" = "ocs_aux"  # leave unconnected in modes 1 and 2
"11" = "sdo_aux"  # connect to VDDIO or leave unconnected in modes 1 and 2
"12" = "cs"       # I2C/SPI mode selection: 1 = I2C enabled
"13" = "scl"      # I2C SCL / SPI SPC
"14" = "sda"      # I2C SDA / SPI SDI / 3-wire SDO

[models.ratings]
# Table 7: VDD -0.3 V to +4.8 V; control pins -0.3 V to VDDIO + 0.3 V; supply on any pin never above 4.8 V.
max_voltage_v = 4.8

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.71
max_v = 3.6
abs_max_v = 4.8
basis = "ST DS12140 Rev 3, Table 3 Electrical characteristics, VDD supply voltage 1.71 V to 3.6 V; Table 7 Absolute maximum ratings, VDD -0.3 V to +4.8 V"

[[models.envelope]]
kind = "supply_range"
pin = "vddio"
min_v = 1.62
max_v = 3.6
abs_max_v = 4.8
basis = "ST DS12140 Rev 3, Table 3 Electrical characteristics, VDDIO power supply for I/O 1.62 V to 3.6 V; Table 7 Absolute maximum ratings, supply voltage on any pin never above 4.8 V"

# Table 1: CS high selects I2C. Section 5.1.1: SAD = 110101x; SA0 to the supply gives
# 1101011 (0x6B), to ground 1101010 (0x6A).
[models.peripheral]
kind = "register_map"
required_high_roles = ["cs"]
address_select_role = "sdo"
address_when_low = 0x6A
address_when_high = 0x6B
spec_toml = '''
[sensor]
name = "LSM6DSO register map"
bus = "i2c"
i2c_address = 0x6A

# Stimulus: acceleration in g (flat and still, +1 g on Z is an ASSUMED orientation), angular rate in
# deg/s and die temperature in degC (25 degC, where Table 4 says the output is 0 LSB, is the default).
[[sensor.input]]
name = "accel_x_g"
default = 0.0

[[sensor.input]]
name = "accel_y_g"
default = 0.0

[[sensor.input]]
name = "accel_z_g"
default = 1.0

[[sensor.input]]
name = "gyro_x_dps"
default = 0.0

[[sensor.input]]
name = "gyro_y_dps"
default = 0.0

[[sensor.input]]
name = "gyro_z_dps"
default = 0.0

[[sensor.input]]
name = "temp_c"
default = 25.0

# Section 9.11: WHO_AM_I (0Fh) is fixed at 6Ch (Table 20).
[[sensor.register]]
addr = 0x0F
const = [0x6C]

# Table 20, default values. Writable registers read back what was written.
# FUNC_CFG_ACCESS (01h), default 00h
[[sensor.write_register]]
addr = 0x01
encoding = "u8"
