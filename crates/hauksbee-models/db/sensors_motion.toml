# Z_OFS_USR (75h), default 00h
[[sensor.write_register]]
addr = 0x75
encoding = "u8"
store = "z_ofs_usr"
default = 0
[[sensor.register]]
addr = 0x75
encoding = "u8"
expr = "z_ofs_usr"

# PIN_CTRL (02h), default 3Fh
[[sensor.write_register]]
addr = 0x02
encoding = "u8"
store = "pin_ctrl"
default = 63
[[sensor.register]]
addr = 0x02
encoding = "u8"
expr = "pin_ctrl"

# CTRL1_XL (10h), default 00h: ODR_XL[3:0] bits 7:4 (0 = power-down), FS[1:0]_XL bits 3:2
[[sensor.write_register]]
addr = 0x10
encoding = "u8"
store = "ctrl1_xl"
default = 0
[[sensor.write_register.field]]
name = "odr_xl"
bits = [7, 4]
[[sensor.write_register.field]]
name = "fs_xl"
bits = [3, 2]
[[sensor.register]]
addr = 0x10
encoding = "u8"
expr = "ctrl1_xl"

# CTRL2_G (11h), default 00h: ODR_G[3:0] bits 7:4 (0 = power-down), FS[1:0]_G bits 3:2, FS_125 bit 1
[[sensor.write_register]]
addr = 0x11
encoding = "u8"
store = "ctrl2_g"
default = 0
[[sensor.write_register.field]]
name = "odr_g"
bits = [7, 4]
[[sensor.write_register.field]]
name = "fs_g"
bits = [3, 2]
[[sensor.write_register.field]]
name = "fs_125"
bits = [1, 1]
[[sensor.register]]
addr = 0x11
encoding = "u8"
expr = "ctrl2_g"

# CTRL3_C (12h), default 04h (IF_INC = 1): BOOT bit 7 and SW_RESET bit 0 self-clear
[[sensor.write_register]]
addr = 0x12
encoding = "u8"
store = "ctrl3_c"
default = 4
[[sensor.write_register.field]]
name = "c3_boot"
bits = [7, 7]
[[sensor.write_register.field]]
name = "c3_sw_reset"
bits = [0, 0]

[[sensor.register]]
addr = 0x12
encoding = "u8"
expr = "ctrl3_c - 128.0 * c3_boot - c3_sw_reset"

# CTRL9_XL (18h), default E0h
[[sensor.write_register]]
addr = 0x18
encoding = "u8"
store = "ctrl9_xl"
default = 224
[[sensor.register]]
addr = 0x18
encoding = "u8"
expr = "ctrl9_xl"

# Interrupt and event sources (1Ah to 1Dh, 35h to 3Bh) read 00h: no event engine is modelled.
[[sensor.register]]
addr = 0x1A
const = [0x00]

[[sensor.register]]
addr = 0x1B
const = [0x00]

[[sensor.register]]
addr = 0x1C
const = [0x00]

[[sensor.register]]
addr = 0x1D
const = [0x00]

[[sensor.register]]
addr = 0x35
const = [0x00]

[[sensor.register]]
addr = 0x36
const = [0x00]

[[sensor.register]]
addr = 0x37
const = [0x00]

[[sensor.register]]
addr = 0x39
const = [0x00]

[[sensor.register]]
addr = 0x3A
const = [0x00]

[[sensor.register]]
addr = 0x3B
const = [0x00]

# STATUS_REG (1Eh): XLDA bit 0, GDA bit 1, TDA bit 2, set while the matching sensor is out of power-down (ODR timing is not modelled).
[[sensor.register]]
addr = 0x1E
encoding = "u8"
expr = "if(odr_xl > 0.0, 1.0, 0.0) + if(odr_g > 0.0, 2.0, 0.0) + if(odr_xl + odr_g > 0.0, 4.0, 0.0)"

# Output registers, low byte first, 16-bit two's complement. Sensitivities are Table 2: linear acceleration
# 0.061/0.122/0.244/0.488 mg/LSB at +-2/4/8/16 g (FS_XL 00/10/11/01), angular rate 4.375/8.75/17.5/35/70
# mdps/LSB at +-125/250/500/1000/2000 dps; temperature 256 LSB/degC with 0 LSB at 25 degC (Table 4).
# Each reads zero while its sensor is in power-down.
[[sensor.register]]
addr = 0x20
encoding = "i16_le"
expr = "if(odr_xl + odr_g > 0.0, (temp_c - 25.0) * 256.0, 0.0)"

[[sensor.register]]
addr = 0x22
encoding = "i16_le"
expr = "if(odr_g > 0.0, gyro_x_dps * 1000.0 / if(fs_125 == 1.0, 4.375, if(fs_g == 0.0, 8.75, if(fs_g == 1.0, 17.5, if(fs_g == 2.0, 35.0, 70.0)))), 0.0)"

[[sensor.register]]
addr = 0x24
encoding = "i16_le"
expr = "if(odr_g > 0.0, gyro_y_dps * 1000.0 / if(fs_125 == 1.0, 4.375, if(fs_g == 0.0, 8.75, if(fs_g == 1.0, 17.5, if(fs_g == 2.0, 35.0, 70.0)))), 0.0)"

[[sensor.register]]
addr = 0x26
encoding = "i16_le"
expr = "if(odr_g > 0.0, gyro_z_dps * 1000.0 / if(fs_125 == 1.0, 4.375, if(fs_g == 0.0, 8.75, if(fs_g == 1.0, 17.5, if(fs_g == 2.0, 35.0, 70.0)))), 0.0)"

[[sensor.register]]
addr = 0x28
encoding = "i16_le"
expr = "if(odr_xl > 0.0, accel_x_g * 1000.0 / if(fs_xl == 0.0, 0.061, if(fs_xl == 1.0, 0.488, if(fs_xl == 2.0, 0.122, 0.244))), 0.0)"

[[sensor.register]]
addr = 0x2A
encoding = "i16_le"
expr = "if(odr_xl > 0.0, accel_y_g * 1000.0 / if(fs_xl == 0.0, 0.061, if(fs_xl == 1.0, 0.488, if(fs_xl == 2.0, 0.122, 0.244))), 0.0)"

[[sensor.register]]
addr = 0x2C
encoding = "i16_le"
expr = "if(odr_xl > 0.0, accel_z_g * 1000.0 / if(fs_xl == 0.0, 0.061, if(fs_xl == 1.0, 0.488, if(fs_xl == 2.0, 0.122, 0.244))), 0.0)"

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.71   # Table 3, VDD min (no POR voltage is published)
idle_a = 0.00055              # Table 3, IddHP typ
read_a = 0.00055
write_a = 0.00055
low_power_a = 0.000003        # Table 3, IddPD typ, gyroscope and accelerometer power-down

[models.coverage]
implements = ["pin_roles", "logic_levels_at_1v8_vddio", "high_performance_supply_current", "absolute_ratings", "supply_ranges", "i2c_bus_mode_strap", "i2c_address_strap", "register_map", "who_am_i_read", "reset_values", "configuration_register_readback", "accelerometer_gyroscope_temperature_data", "full_scale_range_scaling", "power_down_gating", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["spi_register_map", "mipi_i3c", "fifo", "interrupt_engine", "tap_free_fall_wake_up_detection", "embedded_functions_pedometer_tilt", "finite_state_machine", "sensor_hub_i2c_master", "auxiliary_spi_ois", "timestamp", "software_reset_register_restore", "xl_fs_mode_and_filter_bandwidths", "odr_timing", "per_mode_supply_current", "machine_learning_core", "sensor_synchronization_s4s"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.st.com/resource/en/datasheet/lsm6dsox.pdf"
title = "STMicroelectronics LSM6DSOX iNEMO inertial module, DS12814 - Rev 4, June 2024"
locator = "Table 1 Pin description; Table 2 Mechanical characteristics; Table 3 Electrical characteristics; Table 4 Temperature sensor characteristics; Table 7 Absolute maximum ratings; Section 5.1.1 I2C serial interface; Table 19 Internal pin status; Table 21 Registers address map; Section 9.14 WHO_AM_I"
sha256 = "4c7b834fcc5ca298e0a7cbe796d9f7d2def3fc19682ee490d8b6f75ecdeb71f7"

# Table 3 as printed, in fractions of VDDIO.
[[models.source.characteristic]]
parameter = "VIH digital high-level input voltage"
min = 0.7
unit = "VDDIO"
conditions = "digital inputs (SCL, SDA, SDO/SA0, CS)"
basis = "Table 3, 0.7 x VDDIO min"

[[models.source.characteristic]]
parameter = "VIL digital low-level input voltage"
max = 0.3
unit = "VDDIO"
conditions = "digital inputs (SCL, SDA, SDO/SA0, CS)"
basis = "Table 3, 0.3 x VDDIO max"

# -----------------------------------------------------------------------------
# LSM303AGR: STMicroelectronics ultra-compact high-performance eCompass module,
# 3-axis accelerometer and 3-axis magnetometer, LGA-12L 2 x 2 x 1 mm.
#
# Source: STMicroelectronics LSM303AGR datasheet DocID027765 Rev 11, August 2022.
#   Table 2 Pin description, Table 3 Sensor characteristics, Table 4 Temperature sensor
#   characteristics, Table 5 Electrical characteristics, Table 9 Absolute maximum ratings,
#   Section 4.2.1 Accelerometer power modes (Table 14), Section 6.1 I2C serial interface
#   (Tables 24 and 25: the accelerometer is 0011001b, the magnetometer 0011110b),
#   Table 26 Register address map, Section 8 Register description.
#
# THE ACCELEROMETER ONLY. The package holds two I2C slaves, the accelerometer at 0x19
# and the magnetometer at 0x1E (registers 40h to 6Fh, WHO_AM_I_M = 40h). A card carries
# one [models.peripheral], one I2C address, so this card is the accelerometer
# personality (the one that WHO_AM_I_A = 33h and the 00h to 3Fh map identify). The
# magnetometer slave, and the SPI mode (CS_XL / CS_MAG low), are not modelled.
#
# The address is fixed by the part (no strap pin), so no address_select is used. CS_XL
# high selects I2C; CS_MAG is also a mode pin (1 = I2C), so neither may float.
#
# LOGIC LEVELS are fractions of Vdd_IO (Table 5: VIH 0.7 x Vdd_IO, VIL 0.3 x Vdd_IO,
# VOH Vdd_IO - 0.2 V and VOL 0.2 V at 4 mA), evaluated at Vdd_IO = 1.8 V, the table's
# typical.
#
# Not modelled, with the reason: the temperature output (OUT_TEMP_H_A is 8-bit, 1 digit
# per degC, but the datasheet prints no offset), FIFO_SRC_REG_A (the default is printed
# as the seven digits 0010000, ambiguous), INT_COUNTER_REG_A, the interrupt, click and
# activity engines, the FIFO, the high-pass filter, self-test, big-endian output (BLE),
# the 3-wire SPI enable, ODR timing, and the register restore that BOOT performs
# (BOOT reads back clear). The magnetometer 3-axis output is a second slave.
[[models]]
id = "lsm303agr"
kind = "digital"
description = "STMicroelectronics LSM303AGR accelerometer + magnetometer module, LGA-12 (accelerometer I2C register map at 0x19: WHO_AM_I_A 33h, control registers, 12/10/8-bit left-justified acceleration; the magnetometer slave at 0x1E is not modelled)"

[models.match]
# Order codes: LSM303AGR and LSM303AGRTR. The older LSM303DLHC / LSM303C / LSM303D are different dies.
value_re = "(?i)^LSM303AGR(TR)?$"

[models.params]
voh   = 1.6      # Table 5, VOH Vdd_IO - 0.2 V min at IOH = 4 mA, at Vdd_IO = 1.8 V
vol   = 0.2      # Table 5, VOL max at IOL = 4 mA
vih   = 1.26     # Table 5, VIH 0.7 x Vdd_IO min at Vdd_IO = 1.8 V
vil   = 0.54     # Table 5, VIL 0.3 x Vdd_IO max at Vdd_IO = 1.8 V
supply_static_ua = 2.0     # Table 5, Idd_PD current consumption in power-down (the reset state)
supply_pin = "9"           # Vdd
gnd_pin    = "6"           # GND
warning = "accelerometer I2C register map only (WHO_AM_I_A, control registers, acceleration data); the magnetometer slave at 0x1E, SPI, FIFO and interrupt engine are not modelled"
must_not_float_roles = "cs_xl,cs_mag"

[models.i2c]
address = 0x19
also = [0x1E]
basis = "ST LSM303AGR DocID027765 rev 11 PDF p.39 I2C section Default address: accelerometer slave address 0011001b, magnetometer 0011110b (no address pins)"

[models.pins]
# Table 2 Pin description, LGA-12.
"1"  = "scl"      # I2C SCL / SPI SPC
"2"  = "cs_xl"    # accelerometer: 1 = SPI idle / I2C enabled; 0 = SPI mode
"3"  = "cs_mag"   # magnetometer: 1 = SPI idle / I2C enabled; 0 = SPI mode
"4"  = "sda"      # I2C SDA / SPI SDI / 3-wire SDO
"5"  = "c1"       # capacitor connection (C1 = 220 nF)
"6"  = "gnd"
"7"  = "int_mag"  # magnetometer interrupt / data ready
"8"  = "gnd2"
"9"  = "vdd"      # power supply
"10" = "vddio"    # power supply for I/O pins
"11" = "int2_xl"  # accelerometer interrupt 2
"12" = "int1_xl"  # accelerometer interrupt 1

[models.ratings]
# Table 9: Vdd and Vdd_IO -0.3 V to +4.8 V; control pins -0.3 V to Vdd_IO + 0.3 V; no pin supply above 4.8 V.
max_voltage_v = 4.8

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.71
max_v = 3.6
abs_max_v = 4.8
basis = "ST DocID027765 Rev 11, Table 5 Electrical characteristics, Vdd supply voltage 1.71 V to 3.6 V; Table 9 Absolute maximum ratings, Vdd -0.3 V to 4.8 V"

[[models.envelope]]
kind = "supply_range"
pin = "vddio"
min_v = 1.71
max_v = 3.7
abs_max_v = 4.8
basis = "ST DocID027765 Rev 11, Table 5, Vdd_IO power supply for I/O 1.71 V to Vdd + 0.1 V (3.7 V at the Vdd maximum of 3.6 V); Table 9, Vdd_IO -0.3 V to 4.8 V"

# Table 2: CS_XL high enables I2C; Tables 24 and 25: the accelerometer slave address is 0011001b (0x19).
[models.peripheral]
kind = "register_map"
required_high_roles = ["cs_xl"]
spec_toml = '''
[sensor]
name = "LSM303AGR accelerometer register map"
bus = "i2c"
i2c_address = 0x19

# Stimulus: acceleration in g (flat and still, +1 g on Z is an ASSUMED orientation).
[[sensor.input]]
name = "accel_x_g"
default = 0.0

[[sensor.input]]
name = "accel_y_g"
default = 0.0

[[sensor.input]]
name = "accel_z_g"
default = 1.0

# Section 8.4: WHO_AM_I_A (0Fh) = 00110011 (33h).
[[sensor.register]]
addr = 0x0F
const = [0x33]

# Table 26 defaults. Writable registers read back what was written.
# TEMP_CFG_REG_A (1Fh), default 00h
[[sensor.write_register]]
addr = 0x1F
encoding = "u8"
store = "temp_cfg_reg_a"
default = 0
[[sensor.register]]
addr = 0x1F
encoding = "u8"
expr = "temp_cfg_reg_a"

# CTRL_REG1_A (20h), default 07h: ODR[3:0] bits 7:4 (0 = power-down), LPen bit 3, Zen/Yen/Xen bits 2:0
[[sensor.write_register]]
addr = 0x20
encoding = "u8"
store = "ctrl_reg1_a"
default = 7
[[sensor.write_register.field]]
name = "odr_a"
bits = [7, 4]
[[sensor.write_register.field]]
name = "lpen"
bits = [3, 3]
[[sensor.write_register.field]]
name = "zen"
bits = [2, 2]
[[sensor.write_register.field]]
name = "yen"
bits = [1, 1]
[[sensor.write_register.field]]
name = "xen"
bits = [0, 0]
[[sensor.register]]
addr = 0x20
encoding = "u8"
expr = "ctrl_reg1_a"

# CTRL_REG2_A (21h), default 00h
[[sensor.write_register]]
addr = 0x21
encoding = "u8"
store = "ctrl_reg2_a"
default = 0
[[sensor.register]]
addr = 0x21
encoding = "u8"
expr = "ctrl_reg2_a"

# CTRL_REG3_A (22h), default 00h
[[sensor.write_register]]
addr = 0x22
encoding = "u8"
store = "ctrl_reg3_a"
default = 0
[[sensor.register]]
addr = 0x22
encoding = "u8"
expr = "ctrl_reg3_a"

# CTRL_REG4_A (23h), default 00h: BDU bit 7, FS[1:0] bits 5:4 (00 +-2 g, 01 +-4 g, 10 +-8 g, 11 +-16 g), HR bit 3
[[sensor.write_register]]
addr = 0x23
encoding = "u8"
store = "ctrl_reg4_a"
default = 0
[[sensor.write_register.field]]
name = "bdu"
bits = [7, 7]
[[sensor.write_register.field]]
name = "fs_a"
bits = [5, 4]
[[sensor.write_register.field]]
name = "hr"
bits = [3, 3]
[[sensor.register]]
addr = 0x23
encoding = "u8"
expr = "ctrl_reg4_a"

# CTRL_REG5_A (24h), default 00h: BOOT bit 7 self-clears
[[sensor.write_register]]
addr = 0x24
encoding = "u8"
store = "ctrl_reg5_a"
default = 0
[[sensor.write_register.field]]
name = "a_boot"
bits = [7, 7]

[[sensor.register]]
addr = 0x24
encoding = "u8"
expr = "ctrl_reg5_a - 128.0 * a_boot"

# CTRL_REG6_A (25h), default 00h
[[sensor.write_register]]
addr = 0x25
encoding = "u8"
store = "ctrl_reg6_a"
default = 0
[[sensor.register]]
addr = 0x25
encoding = "u8"
expr = "ctrl_reg6_a"

# REFERENCE/DATACAPTURE_A (26h), default 00h
[[sensor.write_register]]
addr = 0x26
encoding = "u8"
store = "reference_a"
default = 0
[[sensor.register]]
addr = 0x26
encoding = "u8"
expr = "reference_a"

# FIFO_CTRL_REG_A (2Eh), default 00h
[[sensor.write_register]]
addr = 0x2E
encoding = "u8"
store = "fifo_ctrl_reg_a"
default = 0
[[sensor.register]]
addr = 0x2E
encoding = "u8"
expr = "fifo_ctrl_reg_a"

# INT1_CFG_A (30h), default 00h
[[sensor.write_register]]
addr = 0x30
encoding = "u8"
store = "int1_cfg_a"
default = 0
[[sensor.register]]
addr = 0x30
encoding = "u8"
expr = "int1_cfg_a"

# INT1_THS_A (32h), default 00h
[[sensor.write_register]]
addr = 0x32
encoding = "u8"
store = "int1_ths_a"
default = 0
[[sensor.register]]
addr = 0x32
encoding = "u8"
expr = "int1_ths_a"

# INT1_DURATION_A (33h), default 00h
[[sensor.write_register]]
addr = 0x33
encoding = "u8"
store = "int1_duration_a"
default = 0
[[sensor.register]]
addr = 0x33
encoding = "u8"
expr = "int1_duration_a"

# INT2_CFG_A (34h), default 00h
[[sensor.write_register]]
addr = 0x34
encoding = "u8"
store = "int2_cfg_a"
default = 0
[[sensor.register]]
addr = 0x34
encoding = "u8"
expr = "int2_cfg_a"

# INT2_THS_A (36h), default 00h
[[sensor.write_register]]
addr = 0x36
encoding = "u8"
store = "int2_ths_a"
default = 0
[[sensor.register]]
addr = 0x36
encoding = "u8"
expr = "int2_ths_a"

# INT2_DURATION_A (37h), default 00h
[[sensor.write_register]]
addr = 0x37
encoding = "u8"
store = "int2_duration_a"
default = 0
[[sensor.register]]
addr = 0x37
encoding = "u8"
expr = "int2_duration_a"

# CLICK_CFG_A (38h), default 00h
[[sensor.write_register]]
addr = 0x38
encoding = "u8"
store = "click_cfg_a"
default = 0
[[sensor.register]]
addr = 0x38
encoding = "u8"
expr = "click_cfg_a"

# CLICK_THS_A (3Ah), default 00h
[[sensor.write_register]]
addr = 0x3A
encoding = "u8"
store = "click_ths_a"
default = 0
[[sensor.register]]
addr = 0x3A
encoding = "u8"
expr = "click_ths_a"

# TIME_LIMIT_A (3Bh), default 00h
[[sensor.write_register]]
addr = 0x3B
encoding = "u8"
store = "time_limit_a"
default = 0
[[sensor.register]]
addr = 0x3B
encoding = "u8"
expr = "time_limit_a"

# TIME_LATENCY_A (3Ch), default 00h
[[sensor.write_register]]
addr = 0x3C
encoding = "u8"
store = "time_latency_a"
default = 0
[[sensor.register]]
addr = 0x3C
encoding = "u8"
expr = "time_latency_a"

# TIME_WINDOW_A (3Dh), default 00h
[[sensor.write_register]]
addr = 0x3D
encoding = "u8"
store = "time_window_a"
default = 0
[[sensor.register]]
addr = 0x3D
encoding = "u8"
expr = "time_window_a"

# Act_THS_A (3Eh), default 00h
[[sensor.write_register]]
addr = 0x3E
encoding = "u8"
store = "act_ths_a"
default = 0
[[sensor.register]]
addr = 0x3E
encoding = "u8"
expr = "act_ths_a"

# Act_DUR_A (3Fh), default 00h
[[sensor.write_register]]
addr = 0x3F
encoding = "u8"
store = "act_dur_a"
default = 0
[[sensor.register]]
addr = 0x3F
encoding = "u8"
expr = "act_dur_a"

# Interrupt sources INT1_SRC_A (31h), INT2_SRC_A (35h) and CLICK_SRC_A (39h) read their default 00h: no event engine is modelled.
[[sensor.register]]
addr = 0x31
const = [0x00]

[[sensor.register]]
addr = 0x35
const = [0x00]

[[sensor.register]]
addr = 0x39
const = [0x00]

# STATUS_REG_A (27h): XDA bit 0, YDA bit 1, ZDA bit 2, ZYXDA bit 3. Set while ODR != 0 for each enabled axis (ODR timing is not modelled).
[[sensor.register]]
addr = 0x27
encoding = "u8"
expr = "if(odr_a > 0.0, xen + 2.0 * yen + 4.0 * zen + 8.0 * xen * yen * zen, 0.0)"

# Output registers, low byte first (BLE = 0), 16-bit two's complement LEFT-JUSTIFIED (Section 8.14): the 12-bit (HR), 10-bit
# (normal) or 8-bit (low-power) digit sits in the top bits, so the word is digit x 16, x 64 or x 256. Digit sensitivity is
# Table 3 (typical, FS +-2/4/8/16 g): HR 0.98/1.95/3.9/11.72, normal 3.9/7.82/15.63/46.9, low-power 15.63/31.26/62.52/187.58
# mg/LSB. A disabled axis or ODR = 0 (power-down) reads zero. BLE = 1 big-endian output is not modelled.
[[sensor.register]]
addr = 0x28
encoding = "i16_le"
expr = "if(odr_a > 0.0, xen * (if(lpen == 1.0, 256.0, if(hr == 1.0, 16.0, 64.0))) * (accel_x_g * 1000.0 / (if(lpen == 1.0, if(fs_a == 0.0, 15.63, if(fs_a == 1.0, 31.26, if(fs_a == 2.0, 62.52, 187.58))), if(hr == 1.0, if(fs_a == 0.0, 0.98, if(fs_a == 1.0, 1.95, if(fs_a == 2.0, 3.9, 11.72))), if(fs_a == 0.0, 3.9, if(fs_a == 1.0, 7.82, if(fs_a == 2.0, 15.63, 46.9))))))), 0.0)"

[[sensor.register]]
addr = 0x2A
encoding = "i16_le"
expr = "if(odr_a > 0.0, yen * (if(lpen == 1.0, 256.0, if(hr == 1.0, 16.0, 64.0))) * (accel_y_g * 1000.0 / (if(lpen == 1.0, if(fs_a == 0.0, 15.63, if(fs_a == 1.0, 31.26, if(fs_a == 2.0, 62.52, 187.58))), if(hr == 1.0, if(fs_a == 0.0, 0.98, if(fs_a == 1.0, 1.95, if(fs_a == 2.0, 3.9, 11.72))), if(fs_a == 0.0, 3.9, if(fs_a == 1.0, 7.82, if(fs_a == 2.0, 15.63, 46.9))))))), 0.0)"

[[sensor.register]]
addr = 0x2C
encoding = "i16_le"
expr = "if(odr_a > 0.0, zen * (if(lpen == 1.0, 256.0, if(hr == 1.0, 16.0, 64.0))) * (accel_z_g * 1000.0 / (if(lpen == 1.0, if(fs_a == 0.0, 15.63, if(fs_a == 1.0, 31.26, if(fs_a == 2.0, 62.52, 187.58))), if(hr == 1.0, if(fs_a == 0.0, 0.98, if(fs_a == 1.0, 1.95, if(fs_a == 2.0, 3.9, 11.72))), if(fs_a == 0.0, 3.9, if(fs_a == 1.0, 7.82, if(fs_a == 2.0, 15.63, 46.9))))))), 0.0)"

[sensor.protocol]
style = "i2c_pointer"
'''

