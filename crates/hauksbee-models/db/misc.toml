basis = "Si5351A/B/C-B Data Sheet Rev. 1.3, 4.1.1 Crystal Inputs (XA, XB) (p.15): total internal XTAL load CL 'can be selected to be 0, 6, 8, or 10 pF', 'additional external load capacitance < 2 pF' only (which implies the pin capacitance is inside CL); the 0 pF option is not taken because AN619 Rev. 0.8 Register 183 (p.60) lists XTAL_CL 00 as Reserved, do not select (AN619 does not cover the 16-QFN, AN1234 not read, so that reading is assumed to carry over), leaving CL 6 to 10 pF across XA and XB and 12 to 20 pF on each pad; Table 8 note 1 (p.11): a 12 pF crystal adds 2 pF externally (4 pF on XA and XB); limits: Table 8 (p.11) supports a crystal CL of 6 to 12 pF (max_crystal_cl_f), and 4.1.1 (p.15) with 7.4 (p.25) allows external load capacitance of about 2 pF across the pair, the 4 pF on each of XA and XB of Table 8 note 1 being 2 pF in series (max_external_load_f); Table 17 (p.30) XA pin 1, XB pin 2"

