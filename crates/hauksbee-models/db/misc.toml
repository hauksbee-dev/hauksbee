# Official built-in part library: misc.
#
# Cards here are written from vendor datasheets only (every value carries a basis and a source).
# See target/launch/official-parts-20261022/ranking.md for the batch plan.

# Silicon Labs / Skyworks Si5351A/B/C-B I2C-programmable any-frequency CMOS clock generator.
#
# Identity, pad map and the crystal oscillator's on-chip load capacitance only. The clock synthesis
# (PLLs, MultiSynth dividers, spread spectrum, output drivers) and the I2C register file are not
# modelled.
#
# SEVEN CARDS, ONE PER PACKAGE AND VARIANT, because the pad maps differ and a map applied to the wrong
# package puts a role on the wrong pad. Ordering guide: Table 1 (p.4) and Figure 24 (p.34): GM = 20-pin
# QFN, GM1 = 16-pin QFN, GT = 10-pin MSOP, and the MSOP exists in the Si5351A variant only. Pad maps:
#   20-QFN  Tables 14, 15, 16 (pp.27-29)   XA 1, XB 2; VDD 20; OEB 7; pad 3 is A0 / VC / INTR; pad 6 is SSEN / SSEN / CLKIN
#   16-QFN  Tables 17, 18, 19 (pp.30-32)   XA 1, XB 2; VDD 16; GND 15; OEB 6 (on the C, 3); pad 3 is A0 / VC / OEB
#   10-MSOP Table 20 (p.33)                VDD 1; XA 2, XB 3; GND 8 (no VC, no CLKIN variant)
# so an `osci` on pad 1 is right for the QFNs and wrong for the MSOP, where pad 1 is VDD.
#
# EACH CARD IS GATED TWICE. `footprint_re` names the package's pin count (a bare "Si5351A" value says
# nothing about the package, so a board whose footprint does not say 20-, 16- or 10-pin gets NO card
# rather than a guessed pad map). `mpn_re` names the variant and refuses a contradicting ordering code:
# the engine's query falls the part number back to the Value, so one rule reads both. After the
# variant, an ordering code may carry `-B` (+ a five-character custom code) and then its own package
# suffix (-GM / -GM1 / -GT, optionally + R for tape and reel); a code naming another package than the
# footprint (an Si5351A-B-GT value on a QFN footprint) matches neither card and so no card.
# The centre ground pad is not numbered in the data sheet's tables and is left out of every pad map.
#
# THE CRYSTAL LOAD IS THE REASON THESE CARDS EXIST for the crystal check: the Si5351 carries its own
# programmable load capacitors (data sheet Rev. 1.3, section 4.1.1 Crystal Inputs (XA, XB), p.15:
# "Internal load capacitors are provided to eliminate the need for external components when connecting
# a crystal"). The figure is CL, the load the crystal sees across XA and XB, the two pads in series, so
# each pad carries twice it. Section 4.1.1 prints the selection as "0, 6, 8, or 10 pF"; AN619 Rev. 0.8,
# Register 183 (p.60) is the register that selects it, and it lists XTAL_CL[1:0] 01 = 6 pF, 10 = 8 pF,
# 11 = 10 pF (default) and 00 = "Reserved. Do not select this option". The two documents disagree
# about 0 pF; the cards follow the register description, the one that says what can be written, so the
# reachable range is 6 to 10 pF across the pair and 12 to 20 pF on each pad. Section 4.1.1 allows
# additional external load capacitance of 2 pF or less (4 pF on each of XA and XB gives 2 pF in series;
# Table 8 note 1, p.11, uses that for a 12 pF crystal on the 10 pF setting). A board therefore fits tiny
# or no caps on XA/XB and sets the crystal's CL in software, which a netlist cannot show; the crystal
# check judges the external caps against the range the chip can add.
#
# `includes_pin_capacitance = true`: the data sheet states the chip's whole load as CL (6 to 10 pF) and
# lets only 2 pF or less more come from the board, so the die's pin capacitance is inside the figure and
# the 3 to 5 pF stray the check assumes for a discrete oscillator would count it twice. Only the board's
# trace is left to assume.
#
# AN619 covers the 10-MSOP and the 20-QFN; it says the 16-QFN is programmed per AN1234, which was not
# read. The 16-QFN cards take the same range from data sheet section 4.1.1 (written for the whole
# family) and the same Register 183 reading, marked as assumed in their basis.

[[models]]
id = "si5351c_qfn20"
kind = "digital"
description = "Si5351C-B clock generator with CLKIN, 20-pin QFN (QFN20 4x4 mm, ordering code -GM); identity, pad map and crystal on-chip load capacitance only; the PLLs, MultiSynth dividers, spread spectrum, output drivers and the I2C register file are not modelled."

[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"
[[models.source.uncertainty]]
status = "unknown"
parameter = "model"
reason = "datasheet publishes no validated model error interval"
[[models.source.uncertainty]]
status = "unknown"
parameter = "bounded_digital_logic_model"
reason = "ABSTAIN: the datasheet describes a programmable PLL and MultiSynth clock generator with an I2C register map that the bounded digital logic schema cannot represent"
[[models.source.pinout]]
package = "QFN20"
pins = { "1" = "XA", "2" = "XB", "3" = "INTR", "4" = "SCL", "5" = "SDA", "6" = "CLKIN", "7" = "OEB", "8" = "CLK3", "9" = "CLK2", "10" = "VDDOB", "11" = "VDDOA", "12" = "CLK1", "13" = "CLK0", "14" = "VDDOD", "15" = "CLK7", "16" = "CLK6", "17" = "CLK5", "18" = "VDDOC", "19" = "CLK4", "20" = "VDD" }

[[models.source.references]]
title = "Si5351A/B/C-B I2C-Programmable Any-Frequency CMOS Clock Generator + VCXO, Rev. 1.3, August 27, 2021"
url = "https://www.skyworksinc.com/-/media/Skyworks/SL/documents/public/data-sheets/Si5351-B.pdf"
locator = "Table 16 Si5351C Pin Descriptions p.29; section 4.1.1 Crystal Inputs (XA, XB) p.15; Table 8 Crystal Requirements p.11; Table 1 Ordering Guide p.4; Figure 24 Device Part Numbers p.34"
sha256 = "f3bc5285fccafa3fcd06e9a7fa6abb67fb43e8c23f6147b14caecc9a4851101f"

[[models.source.references]]
title = "AN619: Manually Generating an Si5351 Register Map for 10-MSOP and 20-QFN Devices, Rev. 0.8, September 23, 2021"
url = "https://www.skyworksinc.com/-/media/Skyworks/SL/documents/public/application-notes/AN619.pdf"
locator = "Register 183. Crystal Internal Load Capacitance, p.60"

[models.match]
mpn_re = '^SI5351C(?:-B[0-9A-Z]*)?(?:-GM)?R?$'
footprint_re = '(?i)(QFN|MLF)[-_ ]?20([^0-9]|$)|(^|[^0-9])20[-_ ]?(QFN|MLF)'

[models.params]
identity_only = true
warning = "Pad map and crystal on-chip load capacitance only: the PLLs, MultiSynth dividers, spread spectrum, output drivers and I2C register file are not modelled."
unlocked_by = "A validated programmable clock-generator model with the register map and output stages."

[models.pins]
"1" = "osci"    # XA, crystal input
"2" = "osco"    # XB, crystal input
"3" = "intr"    # INTR, open-drain interrupt output
"4" = "scl"
"5" = "sda"
"6" = "clkin"   # PLL clock input
"7" = "oeb"     # output driver enable, active low
"8" = "clk3"
"9" = "clk2"
"10" = "vddob"
"11" = "vddoa"
"12" = "clk1"
"13" = "clk0"
"14" = "vddod"
"15" = "clk7"
"16" = "clk6"
"17" = "clk5"
"18" = "vddoc"
"19" = "clk4"
"20" = "vdd"

[[models.pin_capability.xtal_int_caps]]
oscillator = "XTAL"
pads = ["1", "2"]
min_f = 12.0e-12
max_f = 20.0e-12
includes_pin_capacitance = true
max_crystal_cl_f = 12.0e-12
max_external_load_f = 2.0e-12
basis = "Si5351A/B/C-B Data Sheet Rev. 1.3, 4.1.1 Crystal Inputs (XA, XB) (p.15): total internal XTAL load CL 'can be selected to be 0, 6, 8, or 10 pF', 'additional external load capacitance < 2 pF' only (which implies the pin capacitance is inside CL); NOT AGREED with AN619 Rev. 0.8 Register 183 (p.60), which lists XTAL_CL 01 = 6 pF, 10 = 8 pF, 11 = 10 pF (default) and 00 = Reserved, do not select: the 0 pF option is not taken, so CL is 6 to 10 pF across XA and XB and 12 to 20 pF on each pad; Table 8 note 1 (p.11): 6, 8 or 10 pF crystals use the internal load capacitance, a 12 pF crystal adds 2 pF externally (4 pF on XA and XB); limits: Table 8 (p.11) supports a crystal CL of 6 to 12 pF (max_crystal_cl_f), and 4.1.1 (p.15) with 7.4 (p.25) allows external load capacitance of about 2 pF across the pair, the 4 pF on each of XA and XB of Table 8 note 1 being 2 pF in series (max_external_load_f); Table 16 (p.29) XA pin 1, XB pin 2"

[models.coverage]
implements = []
missing = ["i2c_register_interface", "pll_and_multisynth", "spread_spectrum", "clock_output_stages", "vcxo_and_clkin_paths", "output_enable_and_interrupt_behaviour", "supply_sequencing", "power_on_reset"]

