# ── TB6612FNG dual DC motor driver, SSOP24 ──────────────────────────────
# Source: Toshiba TB6612FNG datasheet dated 2007-06-30 (the downloaded copy). Pin Functions p.2, Absolute Maximum
# Ratings and Operating Range p.3, H-SW Control Function p.4, Electrical Characteristics p.5, Target characteristics p.6.
# The datasheet prints one package (SSOP24, 0.65 mm pitch), so the bare name resolves. The H-bridge outputs are NOT
# modelled: only the Vcc logic supply, the rails, the logic thresholds, the pin map and the printed ratings are.
[[models]]
id = "tb6612fng_ssop24"
kind = "digital"
description = "Toshiba TB6612FNG driver IC for dual DC motors, SSOP24: Vcc logic supply, logic thresholds and ratings (H-bridge outputs not modelled)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://toshiba.semicon-storage.com/info/TB6612FNG_datasheet_en_20141001.pdf"
title = "Toshiba TB6612FNG Driver IC for Dual DC motor, datasheet dated 2007-06-30"
locator = "Pin Functions p.2; Absolute Maximum Ratings and Operating Range p.3; H-SW Control Function p.4; Electrical Characteristics p.5; Target characteristics PD-Ta p.6"
sha256 = "928865fade9c7c18bd11ae5c4d3ac68a56ead028239669d5e5e9d6b087f716de"
[[models.source.uncertainty]]
status = "unknown"
parameter = "motor_supply_current"
reason = "the datasheet prints no operating VM supply current (only IM(STB) 1 uA max in standby), so the VM supply carries no stamped draw"
[[models.source.uncertainty]]
status = "unknown"
parameter = "motor_drive"
reason = "the H-bridge outputs and the H-SW control table (CW, CCW, short brake, stop, standby), the 0.5 Ohm on-resistance, dead time and thermal shutdown are not modelled"
[[models.source.uncertainty]]
status = "assumed"
parameter = "vm_minimum"
reason = "the Pin Functions remarks print the motor supply as 2.5 V to 13.5 V while the Operating Range table prints VM 4.5 V min (output current limited to 0.4 A below 5 V); the card uses the Operating Range table"
[[models.source.uncertainty]]
status = "assumed"
parameter = "theta_ja"
reason = "the only thermal figure is the IC-only thetaj-a = 160 C/W annotated on the PD-Ta target characteristics chart (p.6), not a Thermal Information table row"

[models.match]
# TB6612FNG and its tape-and-reel orderable forms such as TB6612FNG(O,C,8,EL) or TB6612FNG(C,8,EL).
# TB6612 (without FNG), TB67H450 and other Toshiba bridges are siblings and do not match.
value_re = "(?i)^TB6612FNG(\\([A-Z0-9,]+\\))?$"

[models.params]
