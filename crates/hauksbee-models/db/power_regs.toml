pin = "in"
min_v = 2.0
max_v = 5.5
abs_max_v = 6.0
basis = "TI TLV702 SLVSAG6D (July 2019) p.4, 6.3 Recommended Operating Conditions, VIN 2 V to 5.5 V"
abs_max_basis = "TI TLV702 SLVSAG6D (July 2019) p.4, 6.1 Absolute Maximum Ratings, VIN -0.3 V to 6 V"

