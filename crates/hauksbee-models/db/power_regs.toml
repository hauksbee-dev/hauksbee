[models.params]
vout      = 2.8   # code 28 = 2.8 V nominal, Table 3 Ordering Information p.17 (XX is nominal output voltage, 28 = 2.8 V); +-2% over -40..125 C
dropout_v = 0.375   # VDO max @ IOUT = 300 mA, TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics; measured only for VOUT(nom) >= 2.35 V
# EFFECTIVE capacitance, not nominal. TI TLV702 SLVSAG6D (July 2019) p.13, 8.2.2.1: "stable with an effective capacitance of 0.1 μF or larger at the output"; a 0.1 μF RATED capacitor "does not ensure stability". The card has no effective-capacitance field (schema gap), so the number is held in cout_min_f.
cout_min_f = 0.1e-6
# TI TLV702 SLVSAG6D (July 2019) p.13, 8.2.2.1: "TI recommends using 1-μF X5R- and X7R-type ceramic capacitors"; 6.5 test condition COUT = 1 μF.
cout_recommended_f = 1.0e-6
cout_recommended_type = "X5R or X7R ceramic"
cout_esr_max_ohm = 0.2   # TI TLV702 SLVSAG6D (July 2019) p.13, 8.2.2.1: "Maximum ESR should be less than 200 mΩ"
iq_a      = 3.5e-05   # IGND typ @ IOUT = 0 mA (55 uA max), TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics
en_on_v   = 0.9    # VEN(high) min, TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics
en_off_v  = 0.4    # VEN(low) max, TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics
i_shdn_a  = 1.0e-6 # ISHDN typ, VEN <= 0.4 V, 2 V <= VIN <= 4.5 V (2 uA max), TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics

[models.pins]
# TI TLV702 SLVSAG6D (July 2019) p.3, Pin Functions: IN 1, GND 2, OUT 3, N/C 4 and 5, EN 6 (WSON column). No exposed pad is described.
"1" = "in"
"2" = "gnd"
"3" = "out"
"4" = "nc"
"5" = "nc"
"6" = "en"

[models.ratings]
max_current_a = 0.3          # IOUT max, 6.3 Recommended Operating Conditions p.4
max_voltage_v = 6.0          # VIN/VOUT abs max, 6.1 Absolute Maximum Ratings p.4 (2 to 5.5 V operating)
max_junction_temp_c = 150.0  # TJ, 6.1 Absolute Maximum Ratings p.4 (125 C operating)
theta_ja_c_per_w = 321.3     # DSE, 6.4 Thermal Information p.4; per-package values are in the characteristic rows
theta_jc_c_per_w = 207.9     # RθJC(top), 6.4 Thermal Information

