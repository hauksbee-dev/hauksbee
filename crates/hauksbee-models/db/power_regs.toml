# ═════════════════════════════════════════════════════════════════════════════
# TLV700 (TI SLVSA00E, April 2015) and TLV702 (TI SLVSAG6D, July 2019): 200 mA / 300 mA LDOs.
# One card per active orderable voltage code and body: the 5-pin leaded body (TLV700 DCK SC70 and
# DDC SOT; TLV702 DBV SOT-23, all numbered IN 1, GND 2, EN 3, N/C 4, OUT 5) and the WSON-6 (DSE:
# IN 1, GND 2, OUT 3, N/C 4 and 5, EN 6) that numbers the pins differently. A bare code (TLV70033)
# binds the 5-pin card; the DSE card needs the DSE package in the code, and a bare code on a WSON
# footprint stays unresolved (the pinout gate refuses the 5-pin map against 6 pads).
# The codes carded are the ones the Package Option Addendum lists as Active; the family spans
# 1.2 V to 4.8 V in 50 mV steps (Table 3) but other codes are "contact factory", so they get no card.
# TLV702P carries the 120 ohm output discharge; the non-P card has no discharge parameter.
# ═════════════════════════════════════════════════════════════════════════════

