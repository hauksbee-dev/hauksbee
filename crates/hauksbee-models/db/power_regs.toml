cout_esr_max_ohm = 0.2   # TI TLV700 SLVSA00E (April 2015) p.13, 8.2.2.1: "Maximum ESR should be less than 200 mΩ"
iq_a      = 3.1e-05   # IGND typ @ IOUT = 0 mA (55 uA max), TI TLV700 SLVSA00E (April 2015) p.6, 6.5 Electrical Characteristics
en_on_v   = 0.9    # VEN(high) min, TI TLV700 SLVSA00E (April 2015) p.6, 6.5 Electrical Characteristics
en_off_v  = 0.4    # VEN(low) max, TI TLV700 SLVSA00E (April 2015) p.6, 6.5 Electrical Characteristics
i_shdn_a  = 1.0e-6 # ISHDN typ, VEN <= 0.4 V, 2 V <= VIN <= 4.5 V (2 uA max), TI TLV700 SLVSA00E (April 2015) p.6, 6.5 Electrical Characteristics

[models.pins]
# TI TLV700 SLVSA00E (April 2015) p.4, Pin Functions: IN 1, GND 2, EN 3, N/C 4, OUT 5 (DCK/DDC column). The WSON-6 (DSE) numbers the pins differently and has its own card.
