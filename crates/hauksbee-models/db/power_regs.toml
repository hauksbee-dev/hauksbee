# tabulated, so neither is a param. The V1.10 sheet in the folder was not used for numbers (V1.31 is newer). IP5303, IP5305, IP5308 and the
# other family members are different parts and do not match. The Recommended operation conditions load-current MAX column prints 0 (an
# obvious typo for the 2.1 A typ), so no load-current limit is stated.

