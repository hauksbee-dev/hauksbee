# ═════════════════════════════════════════════════════════════════════════════
# LM2596 -3.3, -12 and -ADJ (TI SNVS124G, March 2023): the 3 A 150 kHz SIMPLE SWITCHER. The -5.0 card is
# lm2596_5v0 (vreg.toml). One card per voltage covers the TO-220 and the TO-263 (both number the five leads
# alike). The sheet names the bodies NDH/KTT on page 1 and NDZ/KTW in the Thermal table and the orderables;
# the same two bodies. A bare "LM2596" carries no voltage and stays unresolved.
# ON/OFF is active low, which the converter enable (high threshold only) cannot express (SCHEMA GAP).
