max_voltage_v = 6.0          # VIN/VOUT abs max, 6.1 Absolute Maximum Ratings p.5 (2 to 5.5 V operating)
max_junction_temp_c = 150.0  # TJ, 6.1 Absolute Maximum Ratings p.5 (125 C operating)
theta_ja_c_per_w = 307.6     # worst of DCK/DDC, 6.4 Thermal Information p.5; per-package values are in the characteristic rows
theta_jc_c_per_w = 79.1     # RθJC(top), 6.4 Thermal Information

