[models.params]
identity_only = true
warning = "IP5306 identity, pin map, ratings and the VIN envelope are sourced; the bidirectional charger/boost power path is not modelled, so the part stays OPEN. The sheet's part table lists the IP5306 charger as 2.4 A and boost 2.1 A, while the title, features and electrical table give a 2.1 A charger and 2.4 A boost"
iq_a = 50.0e-6   # ISTB battery standby current typ, VIN = 0 V, VBAT = 3.7 V, Injoinic IP5306 V1.31 (2016) pp.5-6, Electrical Characteristics
unlocked_by = "a bidirectional power-path model (battery charger from VIN and a boost to VOUT sharing the SW inductor)"

[models.pins]
# Injoinic IP5306 V1.31 (2016) p.2, Pin Definition (eSOP8): 1 VIN (charger 5 V input), 2 LED1, 3 LED2, 4 LED3, 5 KEY (ON/OFF key, torch driver), 6 BAT (battery voltage sense),
# 7 SW (DCDC switch node, inductor), 8 VOUT (DCDC 5 V output). PowerPAD connects to GND and is the part's ONLY ground (there is no GND pin), mapped gnd as pad 9.
# No I2C pins are described for this eSOP8 part.
"1" = "in"
"2" = "led1"
"3" = "led2"
"4" = "led3"
"5" = "key"
"6" = "bat"
"7" = "sw"
"8" = "out"
"9" = "gnd"

[models.ratings]
max_voltage_v = 6.0           # Port input voltage range VIN abs max, Injoinic IP5306 V1.31 (2016) p.4 (4.65 V to 5.5 V operating)
max_junction_temp_c = 150.0  # Junction temperature TJ, p.4
theta_ja_c_per_w = 40.0      # eSOP8, p.4

