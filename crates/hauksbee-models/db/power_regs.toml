validation = "physical-bounds-only"

[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/tlv702.pdf"
title = "TI TLV702 300-mA, low-IQ, low-dropout regulator in SOT-23 and WSON packages, SLVSAG6D, September 2010, revised July 2019"
locator = "Pin Functions p.3; Absolute Maximum Ratings 6.1, Recommended Operating Conditions 6.3 and Thermal Information 6.4 p.4; Electrical Characteristics 6.5 p.5; Input and Output Capacitor Requirements 8.2.2.1 p.13; Device Nomenclature Table 3 and Package Option Addendum"
sha256 = "21ccbf303c433f1983ffc5ace8d97d58a7657889c8066e8a6b56d3ae5369bd7b"
[[models.source.uncertainty]]
status = "interval"
parameter = "vout"
low = 4.116
high = 4.284
unit = "V"
kind = "specification-limits"
basis = "derived: the DC output accuracy of -2% to +2% (6.5 Electrical Characteristics, VOUT row, -40 to +125 °C) applied to the nominal 4.2 V from the ordering code (42, Table 3)"
[[models.source.pinout]]
package = "WSON-6 (DSE), 6 pins"
pins = { "1" = "IN", "2" = "GND", "3" = "OUT", "4" = "N/C", "5" = "N/C", "6" = "EN" }
[[models.source.characteristic]]
parameter = "VIN input voltage range"
min = 2
max = 5.5
unit = "V"
conditions = "VIN = VOUT(nom) + 0.5 V or 2 V (whichever is greater); IOUT = 10 mA, VEN = 0.9 V, COUT = 1 μF, TJ = -40 to +125 °C unless noted"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, VIN row, min/max columns"
[[models.source.characteristic]]
parameter = "VOUT DC output accuracy"
min = -2
typ = 0.5
max = 2
unit = "%"
conditions = "-40 °C <= TJ <= +125 °C"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, VOUT row, min/typ/max columns"
[[models.source.characteristic]]
parameter = "Line regulation"
typ = 1
max = 5
unit = "mV"
conditions = "VOUT(nom) + 0.5 V <= VIN <= 5.5 V, IOUT = 10 mA"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, Line regulation row, typ/max columns"
[[models.source.characteristic]]
parameter = "Load regulation"
typ = 1
max = 15
unit = "mV"
conditions = "0 mA <= IOUT <= 300 mA"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, Load regulation row, typ/max columns"
[[models.source.characteristic]]
parameter = "VDO dropout voltage"
typ = 260
max = 375
unit = "mV"
conditions = "VIN = 0.98 x VOUT(nom), IOUT = 300 mA (measured only for VOUT(nom) >= 2.35 V, footnote 1)"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, VDO row, typ/max columns"
[[models.source.characteristic]]
parameter = "ICL output current limit"
min = 320
typ = 500
max = 860
unit = "mA"
conditions = "VOUT = 0.9 x VOUT(nom)"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, ICL row, min/typ/max columns"
[[models.source.characteristic]]
parameter = "IGND ground pin current"
typ = 35
max = 55
unit = "μA"
conditions = "IOUT = 0 mA"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, IGND row, typ/max columns"
[[models.source.characteristic]]
parameter = "IGND ground pin current"
typ = 370
unit = "μA"
conditions = "IOUT = 300 mA, VIN = VOUT + 0.5 V"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, IGND row, typ column"
[[models.source.characteristic]]
parameter = "ISHDN ground pin current (shutdown)"
typ = 400
unit = "nA"
conditions = "VEN <= 0.4 V, VIN = 2 V"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, ISHDN row, typ column"
[[models.source.characteristic]]
parameter = "ISHDN ground pin current (shutdown)"
typ = 1
max = 2
unit = "μA"
conditions = "VEN <= 0.4 V, 2 V <= VIN <= 4.5 V, TJ = -40 to +85 °C"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, ISHDN row, typ/max columns"
[[models.source.characteristic]]
parameter = "PSRR power-supply rejection ratio"
typ = 68
unit = "dB"
conditions = "VIN = 2.3 V, VOUT = 1.8 V, IOUT = 10 mA, f = 1 kHz"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, PSRR row, typ column"
[[models.source.characteristic]]
parameter = "Vn output noise voltage"
typ = 48
unit = "μVRMS"
conditions = "BW = 100 Hz to 100 kHz, VIN = 2.3 V, VOUT = 1.8 V, IOUT = 10 mA"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, Vn row, typ column"
[[models.source.characteristic]]
parameter = "tSTR start-up time"
typ = 100
unit = "μs"
conditions = "COUT = 1 μF, IOUT = 300 mA; EN assertion to 0.98 x VOUT(nom)"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, tSTR row, typ column"
[[models.source.characteristic]]
parameter = "VEN(high) enable pin high (enabled)"
min = 0.9
unit = "V"
conditions = "VIN = VOUT(nom) + 0.5 V or 2 V (whichever is greater); IOUT = 10 mA, VEN = 0.9 V, COUT = 1 μF, TJ = -40 to +125 °C unless noted"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, VEN(high) row, min column"
[[models.source.characteristic]]
parameter = "VEN(low) enable pin low (disabled)"
min = 0
max = 0.4
unit = "V"
conditions = "VIN = VOUT(nom) + 0.5 V or 2 V (whichever is greater); IOUT = 10 mA, VEN = 0.9 V, COUT = 1 μF, TJ = -40 to +125 °C unless noted"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, VEN(low) row, min/max columns"
[[models.source.characteristic]]
parameter = "IEN enable pin current"
typ = 0.04
unit = "μA"
conditions = "VIN = VEN = 5.5 V"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, IEN row, typ column"
[[models.source.characteristic]]
parameter = "UVLO undervoltage lockout"
typ = 1.9
unit = "V"
conditions = "VIN rising"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, UVLO row, typ column"
[[models.source.characteristic]]
parameter = "RDISCHARGE active pulldown resistance (TLV702P only)"
typ = 120
unit = "Ω"
conditions = "VEN = 0 V"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, RDISCHARGE row, typ column"
[[models.source.characteristic]]
parameter = "Tsd thermal shutdown temperature"
typ = 165
unit = "°C"
conditions = "Shutdown, temperature increasing"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, Tsd row, typ column"
[[models.source.characteristic]]
parameter = "Tsd thermal shutdown temperature"
typ = 145
unit = "°C"
conditions = "Reset, temperature decreasing"
basis = "TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics, Tsd row, typ column"
[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient thermal resistance"
rating = "theta_ja_c_per_w"
max = 321.3
unit = "°C/W"
conditions = "DSE [WSON], 6 pins; the table does not state the test board"
package = "WSON-6"
basis = "TI TLV702 SLVSAG6D (July 2019) p.4, 6.4 Thermal Information, DSE column, RθJA"
[[models.source.characteristic]]
parameter = "RθJC(top) junction-to-case (top) thermal resistance"
max = 207.9
unit = "°C/W"
conditions = "DSE [WSON], 6 pins"
package = "WSON-6"
basis = "TI TLV702 SLVSAG6D (July 2019) p.4, 6.4 Thermal Information, DSE column, RθJC(top)"

[models.match]
value_re = '(?i)^TLV70242PDSE(?:R|T)?(?:G4)?(?:\.[AB])?$'

[models.params]
vout      = 4.2   # code 42 = 4.2 V nominal, Table 3 Ordering Information p.17 (XX is nominal output voltage, 28 = 2.8 V); +-2% over -40..125 C
dropout_v = 0.375   # VDO max @ IOUT = 300 mA, TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics; measured only for VOUT(nom) >= 2.35 V
# EFFECTIVE capacitance, not nominal. TI TLV702 SLVSAG6D (July 2019) p.13, 8.2.2.1: "stable with an effective capacitance of 0.1 μF or larger at the output"; a 0.1 μF RATED capacitor "does not ensure stability". The card has no effective-capacitance field (schema gap), so the number is held in cout_min_f.
cout_min_f = 0.1e-6
# TI TLV702 SLVSAG6D (July 2019) p.13, 8.2.2.1: "TI recommends using 1-μF X5R- and X7R-type ceramic capacitors"; 6.5 test condition COUT = 1 μF.
cout_recommended_f = 1.0e-6
cout_recommended_type = "X5R or X7R ceramic"
cout_esr_max_ohm = 0.2   # TI TLV702 SLVSAG6D (July 2019) p.13, 8.2.2.1: "Maximum ESR should be less than 200 mΩ"
iq_a      = 3.5e-05   # IGND typ @ IOUT = 0 mA (55 uA max), TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics
en_discharge_ohms = 120.0   # RDISCHARGE typ, TLV702P only, VEN = 0 V, TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics
en_on_v   = 0.9    # VEN(high) min, TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics
en_off_v  = 0.4    # VEN(low) max, TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics
i_shdn_a  = 1.0e-6 # ISHDN typ, VEN <= 0.4 V, 2 V <= VIN <= 4.5 V (2 uA max), TI TLV702 SLVSAG6D (July 2019) p.5, 6.5 Electrical Characteristics

[models.pins]
# TI TLV702 SLVSAG6D (July 2019) p.3, Pin Functions: IN 1, GND 2, OUT 3, N/C 4 and 5, EN 6 (WSON column). No exposed pad is described.
"1" = "in"
"2" = "gnd"
"3" = "out"
"4" = "nc"
"5" = "nc"
"6" = "en"

[models.ratings]
max_current_a = 0.3          # IOUT max, 6.3 Recommended Operating Conditions p.4
max_voltage_v = 6.0          # VIN/VOUT abs max, 6.1 Absolute Maximum Ratings p.4 (2 to 5.5 V operating)
max_junction_temp_c = 150.0  # TJ, 6.1 Absolute Maximum Ratings p.4 (125 C operating)
theta_ja_c_per_w = 321.3     # DSE, 6.4 Thermal Information p.4; per-package values are in the characteristic rows
theta_jc_c_per_w = 207.9     # RθJC(top), 6.4 Thermal Information

[[models.envelope]]
kind = "supply_range"
pin = "in"
min_v = 2.0
max_v = 5.5
abs_max_v = 6.0
basis = "TI TLV702 SLVSAG6D (July 2019) p.4, 6.3 Recommended Operating Conditions, VIN 2 V to 5.5 V"
abs_max_basis = "TI TLV702 SLVSAG6D (July 2019) p.4, 6.1 Absolute Maximum Ratings, VIN -0.3 V to 6 V"

