[models.match]
value_re = '(?i)^LM2596(?:S|SX|T)?-3[._]3(?:/NOPB)?$'

[models.params]
warning = "averaged buck model: ON/OFF (active low, shutdown above 1.3 V) is not gated, so a board that shuts the part down still reads as running; 150 kHz ripple, soft-start, thermal shutdown and the 4.5 A peak current limit are not modelled"
iq_a = 5.0e-3   # IQ typ, switch forced off, TI LM2596 SNVS124G (March 2023) p.7, 7.9 Electrical Characteristics - All Output Voltage Versions
i_shdn_a = 80.0e-6   # ISTBY typ, ON/OFF pin = 5 V, TI LM2596 SNVS124G (March 2023) p.7, 7.9 Electrical Characteristics - All Output Voltage Versions

[models.pins]
# TI LM2596 SNVS124G (March 2023) p.4, Table 6-1 Pin Functions: 1 VIN, 2 Output, 3 Ground, 4 Feedback, 5 ON/OFF. The TO-220 and TO-263 number the five leads alike.
# ON/OFF is ACTIVE LOW (below about 1.3 V = on, open = on) and has no role the converter enable can use, so it is named on_off and left ungated.
"1" = "in"
"2" = "sw"
"3" = "gnd"
"4" = "fb"
"5" = "on_off"

[models.ratings]
max_current_a = 3.0          # 3-A output load current, Features p.1
max_voltage_v = 45.0         # Maximum supply voltage (VIN), TI LM2596 SNVS124G (March 2023) p.5, 7.1 (4.5 V to 40 V operating)
max_junction_temp_c = 150.0  # Maximum junction temperature, 7.1 p.5 (125 C operating, 7.3)
theta_ja_c_per_w = 50.0      # worst printed RθJA (TO-220 with 1 in2 copper, TO-263 with 0.5 in2); the larger-copper TO-263 values are in the characteristic rows, 7.4 p.5
theta_jc_c_per_w = 2.0       # RθJC(top), 7.4 p.5

[[models.envelope]]
kind = "supply_range"
pin = "in"
min_v = 4.5
max_v = 40.0
abs_max_v = 45.0
basis = "TI LM2596 SNVS124G (March 2023) p.5, 7.3 Operating Conditions, supply voltage 4.5 V to 40 V"
abs_max_basis = "TI LM2596 SNVS124G (March 2023) p.5, 7.1 Absolute Maximum Ratings, maximum supply voltage (VIN) 45 V"

[[models.envelope]]
kind = "supply_range"
pin = "fb"
min_v = -0.3
max_v = 25.0
basis = "TI LM2596 SNVS124G (March 2023) p.5, 7.1 Absolute Maximum Ratings, feedback pin voltage -0.3 V to 25 V; a stress bound, not the regulation point"

[models.behavioral.converter]
topology = "buck"
out_pin = "sw"
in_pin = "in"
vout_setpoint = 3.3   # the fixed output; FB sits on the output node and the internal divider is not exposed
iout_limit_a = 3.0
efficiency = 0.73            # VIN = 12 V, ILOAD = 3 A, 7.5 p.6
switching_hz = 150e3          # fO typ, 7.9 p.7

[models.behavioral.converter.feedback]
pin = "fb"
vref_v = 3.3   # the fixed output voltage; 7.5 p.6

[models.coverage]
implements = ["averaged_buck_dc", "output_current_ceiling", "reflected_input_power"]
missing = ["on_off_gating", "switching_ripple", "soft_start", "peak_current_limit", "thermal_shutdown", "temperature_curves"]

