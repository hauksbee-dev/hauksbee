dropout_v = 0.25   # VDO max @ IOUT = 200 mA, VOUT = 2.35 V, TI TLV700 SLVSA00E (April 2015) p.6, 6.5 Electrical Characteristics; measured only for VOUT(nom) >= 2.35 V
# EFFECTIVE capacitance, not nominal. TI TLV700 SLVSA00E (April 2015) p.13, 8.2.2.1: "stable with an effective capacitance of 0.1 μF or larger at the output"; a 0.1 μF RATED capacitor "does not ensure stability". The card has no effective-capacitance field (schema gap), so the number is held in cout_min_f.
cout_min_f = 0.1e-6
