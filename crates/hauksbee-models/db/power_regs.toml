[models.match]
value_re = '(?i)^LP5907SNX[-_]?1[._]9(?:/?NOPB(?:G4)?|/G4)?(?:\.[AB])?$'

[models.params]
vout      = 1.9   # 1.9 V nominal from the ordering code; tolerance +-2% (5.5 p.5)
dropout_v = 0.25    # VDO max @ IOUT = 250 mA, SOT-23 and X2SON packages, TI LP5907 SNVS798Q (July 2025) p.5, 5.5 Electrical Characteristics (50 mV typ at 100 mA)
# EFFECTIVE minimum. TI LP5907 SNVS798Q (July 2025) p.6, 5.6 footnote 1: "The minimum capacitance must be greater than 0.7µF over the full range of operating conditions" (capacitor tolerance 30% or better); COUT max 10 µF is not held by a field.
cout_min_f = 0.7e-6
cout_recommended_f = 1.0e-6   # COUT typ, 5.6 p.6
cout_recommended_type = "X7R ceramic"   # 5.6 footnote 1: X7R recommended, X5R/Y5V/Z5U usable with consideration
cout_esr_min_ohm = 0.005   # 5.6 p.6, ESR min 5 mΩ
cout_esr_max_ohm = 0.5     # 5.6 p.6, ESR max 500 mΩ
iq_a      = 12.0e-6   # IQ typ @ VEN = 1.2 V, IOUT = 0 mA (25 uA max), TI LP5907 SNVS798Q (July 2025) p.5, 5.5 Electrical Characteristics
en_on_v   = 1.2       # VIH min, 5.5 (continued) p.6
en_off_v  = 0.4       # VIL max, 5.5 (continued) p.6
en_pull_down_ohms = 1.0e6   # internal EN pulldown, Pin Functions p.3 and 5.5 footnote 10 (1 MΩ between EN and ground)
en_discharge_ohms = 230.0   # RAD typ, output automatic discharge when disabled, 5.5 p.5
i_shdn_a  = 0.2e-6    # IQ typ @ VEN = 0.3 V (disabled), 1 uA max, TI LP5907 SNVS798Q (July 2025) p.5, 5.5 Electrical Characteristics

[models.pins]
# TI LP5907 SNVS798Q (July 2025) p.3, Table 4-2 Pin Functions: X2SON, SOT-23: OUT 1, GND 2, EN 3, IN 4; the thermal pad (5) 'connect to GND or leave floating', not mapped. DBV is a 5-pin body numbered IN 1 / OUT 5 and has its own card.
"1" = "out"
"2" = "gnd"
"3" = "en"
"4" = "in"

[models.ratings]
max_current_a = 0.25         # IOUT max, 5.3 Recommended Operating Conditions p.4
max_voltage_v = 6.0          # VIN abs max, 5.1 Absolute Maximum Ratings p.4 (2.2 to 5.5 V operating)
max_junction_temp_c = 150.0  # TJMAX, 5.1 Absolute Maximum Ratings p.4 (125 C operating)
theta_ja_c_per_w = 216.1     # DQN, 5.4 Thermal Information p.5
theta_jc_c_per_w = 161.7     # RθJC(top), 5.4 Thermal Information p.5

[[models.envelope]]
kind = "supply_range"
pin = "in"
min_v = 2.2
max_v = 5.5
abs_max_v = 6.0
basis = "TI LP5907 SNVS798Q (July 2025) p.4, 5.3 Recommended Operating Conditions, VIN 2.2 V to 5.5 V"
abs_max_basis = "TI LP5907 SNVS798Q (July 2025) p.4, 5.1 Absolute Maximum Ratings, VIN -0.3 V to 6 V"

