max_junction_temp_c = 150.0  # TJ, 6.1 Absolute Maximum Ratings p.5 (125 C operating)
theta_ja_c_per_w = 321.3     # DSE, 6.4 Thermal Information p.5; per-package values are in the characteristic rows
theta_jc_c_per_w = 207.9     # RθJC(top), 6.4 Thermal Information

