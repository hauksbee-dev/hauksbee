# KiCad's MCU_Module symbols for the Pico name the board exactly
# (RaspberryPi_Pico, RaspberryPi_Pico_W, and the _Debug / _Extensive drawings of
# the same boards; KiCad's RP2350 board is RaspberryPi_Pico2). So the symbol
# fixes the RP2040 even where the 40-pin footprint below cannot.
[[mcu_modules]]
id = "pico_symbol"
lib_re = '(?:^|:)RaspberryPi_Pico(_Debug|_Extensive)?$'
as_value = "Pico"
source = "Raspberry Pi Pico datasheet (sha256 757ff485227493b9fcc0c2c96c4dea9de020e1d8b2b11e2aa4f9ee8b25aa89eb) PDF p.5: 'Pico provides minimal (yet flexible) external circuitry to support the RP2040 chip'"

[[mcu_modules]]
id = "pico_w_symbol"
lib_re = '(?:^|:)RaspberryPi_Pico_W(_Debug|_Extensive)?$'
as_value = "Pico W"
source = "Raspberry Pi Pico W datasheet (sha256 ba8649ba98437301b9f1621504569a27f1d2ba6111795b4df76783adb08de7c5) PDF p.4-5: RP2040 with the Pico's flash and crystal"

# Seeed's KiCad library draws one symbol and footprint per XIAO (XIAO-RP2040-DIP,
# XIAO-ESP32C3-SMD, ...), so they name a XIAO whose value says nothing.
[[mcu_modules]]
id = "xiao_rp2040_footprint"
footprint_re = '(?:^|[:/])XIAO[-_]RP2040[-_](DIP|SMD|SMT)'
lib_re = '(?:^|:)XIAO[-_]RP2040[-_](DIP|SMD|SMT)'
as_value = "XIAO RP2040"
source = "Seeed XIAO RP2040 schematic v1.3 (sha256 0da8a6c0cf1464c82ac3964b6a933b634761621a884ab1f498f61f777b42aeef) p.1: U6 RP2040"

[[mcu_modules]]
id = "xiao_esp32c3_footprint"
footprint_re = '(?:^|[:/])XIAO[-_]ESP32[-_]?C3[-_](DIP|SMD|SMT)'
lib_re = '(?:^|:)XIAO[-_]ESP32[-_]?C3[-_](DIP|SMD|SMT)'
as_value = "XIAO ESP32C3"
source = "Seeed XIAO ESP32C3 schematic (sha256 10eacb7cd87f93f4823bb92d21fc3aa618b75bc9088fe112932f01bb2ce9b24a) p.1: U4 ESP32-C3FN4"

[[mcu_modules]]
id = "xiao_esp32s3_footprint"
footprint_re = '(?:^|[:/])XIAO[-_]ESP32[-_]?S3[-_](DIP|SMD|SMT)'
lib_re = '(?:^|:)XIAO[-_]ESP32[-_]?S3[-_](DIP|SMD|SMT)'
as_value = "XIAO ESP32S3"
source = "Seeed XIAO ESP32S3 schematic v1.2 (sha256 c22d0b9fbbc7e0af6a8d0f549bbd10d05da412d092602c96e7ca2ccd05550825) p.1: U1 ESP32-S3R8"

# The Feather footprint is shared by every Feather (ESP32, ESP8266, 32u4, SAMD21,
# RP2040, ...). The value has to name the Feather.
[[mcu_modules]]
id = "feather_footprint"
footprint_re = '(?:^|[:/])Adafruit[-_]?Feather'
blocker = "the footprint is the Adafruit Feather header footprint, shared by Feathers with different chips (ESP32, ESP8266, ATmega32U4, SAMD21, RP2040), so it does not say which chip runs the firmware; set the part value to the Feather's name (e.g. 'Feather HUZZAH32', 'Feather RP2040', 'Feather 32u4')"
source = "adafruit.com/product/2772 (Feather M0: ATSAMD21G18) and /product/2821 (Feather HUZZAH: ESP8266), and the HUZZAH32 / 32u4 / RP2040 Feather schematics: one footprint, different chips"

# --- Footprints shared by boards with different chips: say so, plainly -------
[[mcu_modules]]
id = "pico_40pin_footprint"
footprint_re = '(?:^|[:/])(RaspberryPi|RPi|Raspberry_Pi)[-_ ]?Pico'
blocker = "the footprint is the Raspberry Pi Pico 40-pin module footprint, which fits the RP2040 Pico / Pico W and the RP2350 Pico 2 alike, so it does not say which chip runs the firmware; set the part value to 'Pico' (RP2040) or 'Pico 2' (RP2350)"
source = "Raspberry Pi Pico datasheet (datasheets.raspberrypi.com/pico/pico-datasheet.pdf, sha256 757ff485227493b9fcc0c2c96c4dea9de020e1d8b2b11e2aa4f9ee8b25aa89eb) PDF p.4: RP2040 on a '40 pin 21x51 DIP style' board; Raspberry Pi Pico 2 datasheet (datasheets.raspberrypi.com/pico/pico-2-datasheet.pdf, sha256 cbcfaf881018c686495a2e53c7bd281e7e0a8217d79447d73eda7c8f74b7f675) PDF p.4: RP2350A on the same '40 pin 21 x 51 DIP style' board; a footprint names the form factor, not the chip"

[[mcu_modules]]
id = "arduino_nano_footprint"
footprint_re = '(?:^|[:/])Arduino[-_ ]?Nano'
blocker = "the footprint is the Arduino Nano 30-pin module footprint, shared by the ATmega328P Nano and by Nano boards with other chips (Nano Every, Nano 33), so it does not say which chip runs the firmware; set the part value to 'Arduino Nano' for the ATmega328P board"
source = "Arduino Nano datasheet A000005 (docs.arduino.cc/resources/datasheets/A000005-datasheet.pdf, sha256 6f44122fb9a9a356aa54e5043f5dc69ec50ff61099f3e92b135f66aa3f06e6d5) PDF p.1: ATmega328; the footprint is a form factor"

# --- Modules whose pad map the library does not have --------------------------
[[mcu_modules]]
id = "arduino_pro_mini"
value_re = '^(Arduino[-_ ]?)?Pro[-_ ]?Mini([-_ ]?v?[0-9.]+)?$'
footprint_re = '(?:^|[:/])(Arduino[-_ ]?)?Pro[-_ ]?Mini'
mcu = "ATmega328"
blocker = "Arduino Pro Mini carries an ATmega328 (the schematic does not say which suffix), but the model library has no header pad map for it (which header pad is which port pin), so its pins cannot be tied to the processor and the firmware is not run; use the bare ATmega328P footprint or add a --models-dir card with the header map"
source = "SparkFun Arduino Pro Mini v14 schematic (cdn.sparkfun.com/datasheets/Dev/Arduino/Boards/Arduino-Pro-Mini-v14.pdf, sha256 a9e0a3b366454e04c6a894b96883fd43e5012b1578e655b6b9895437ea33e584) PDF p.1: U1 labelled ATMEGA328, PB6/PB7 as XTAL1/XTAL2, Q1 8/16/20 MHz"
