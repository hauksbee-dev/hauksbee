# --- Module-specific footprints: the footprint fixes the module --------------
# The KiCad RF_Module footprints below are drawn for one Espressif module each,
# and each module integrates one chip family (ESP32-WROOM-32E datasheet v2.1 s1
# Module Overview PDF p.2: ESP32-D0WD-V3; ESP32-WROVER-E datasheet PDF p.2:
# ESP32-D0WD-V3 / ESP32-D0WDR2-V3; ESP32-S3-WROOM-1 datasheet PDF p.2: ESP32-S3
# series; ESP32-C3-MINI-1 datasheet PDF p.2: ESP32-C3 series).
[[mcu_modules]]
id = "esp32_wroom32_footprint"
footprint_re = '(?:^|[:/])ESP32[-_ ]?WROOM[-_ ]?32'
as_value = "ESP32-WROOM-32"
source = "Espressif ESP32-WROOM-32E datasheet v2.1, Module Overview, PDF p.2 (sha256 4c7a345d1c1bfec34c38665639e39a7f43b79a35a12f6adcc2c7c0f83850f8b8): the module integrates the classic ESP32"

[[mcu_modules]]
