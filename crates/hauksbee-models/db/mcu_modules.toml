# MCU module aliases: a module's value string -> the MCU it carries.
#
# A board often places a whole module (a carrier, a castellated SoM, a
# dev-board footprint) under a value that names the module, not the silicon:
# `nice_nano`, `T-Micro32_Plus`. The binder's family router knows silicon
# names (ESP32..., NRF52..., STM32...), so without this table such a module is
# either bound only because a per-module card happens to exist, or, when its
# family has no emulator, refused without naming the family.
#
# Each entry maps `value_re` (case-insensitive, matched against the value, MPN
# or library id) to `mcu`, the underlying part name, which then goes through the
# ordinary family router. Nothing else changes: an alias cannot pick a backend
# the router would not pick for the bare part, and a family with no emulator
# still refuses, now by name.
#
# ONLY ADD AN ENTRY WHEN THE MODULE'S MCU IS CERTAIN, and cite where it is
# stated in `source`. A guessed alias runs firmware on the wrong core.
#
# A module whose value says nothing (`~`, `MCU`, a project part number) can
# still be identified by its footprint or symbol, when that is specific to one
# module: `footprint_re` / `lib_re` (case-insensitive, against the footprint
# `Library:Name` and the symbol id) plus `as_value`, the value the part is then
# resolved as. When a footprint is shared by boards carrying different chips, or
# the library has no pad map for the module, say so with `blocker` instead: the
# binder leaves the part unresolved and the report prints that sentence.

[[mcu_modules]]
id = "esp32_wroom32_skinny"
# Eagle microbuilder / Adafruit library spelling of the Espressif
# ESP32-WROOM-32 module (narrow "skinny" footprint), placed as X2 on Adafruit
# HUZZAH32-class boards. The WROOM-32 carries the ESP32-D0WDQ6 / ESP32-D0WD die.
value_re = '^ESP32[-_ ]?WROOM[-_ ]?32[-_ ]?SKINNY$'
mcu = "ESP32-WROOM-32"
source = "Espressif ESP32-WROOM-32 datasheet, section 1 (module integrates ESP32-D0WDQ6)"

[[mcu_modules]]
id = "lilygo_t_micro32_plus"
# LilyGO T-Micro32 Plus. The vendor page and distributor listings give the SiP
# as ESP32-PICO-V3-02 (8 MB flash, 2 MB PSRAM); the older TTGO Micro-32 V2.0
# used ESP32-PICO-D4. Both are classic ESP32 (Xtensa LX6) dies, so the family
# is certain whichever revision is fitted.
value_re = '^(LilyGO[-_ ]?|TTGO[-_ ]?)?T[-_ ]?Micro[-_ ]?32([-_ ]?(Plus|V2(\.0)?))?$'
mcu = "ESP32-PICO-V3-02"
source = "lilygo.cc/products/t-micro32-plus; tinytronics.nl T-Micro32 Plus listing (ESP32-PICO-V3-02)"

[[mcu_modules]]
id = "nice_nano"
# nice!nano (Nice Keyboards), a Pro Micro footprint board built on the Nordic
# nRF52840.
value_re = '^nice[-_ !]*nano([-_ ]?v?[0-9.]+)?$'
mcu = "nRF52840"
source = "nicekeyboards.com/docs/nice-nano: 'nRF52840 based'"

[[mcu_modules]]
id = "seeed_xiao_esp32c6"
# Seeed Studio XIAO ESP32C6: ESP32-C6 (RISC-V). No emulator exists for the
# family, so this entry's job is to make the refusal name ESP32-C6.
value_re = '^(Seeed[-_ ]?)?XIAO[-_ ]?ESP32[-_ ]?C6$'
mcu = "ESP32-C6"
source = "wiki.seeedstudio.com/xiao_esp32c6_getting_started (ESP32-C6 SoC)"

# --- Raspberry Pi Pico 2 (RP2350): named so the refusal says which chip -------
[[mcu_modules]]
id = "raspberry_pi_pico_2"
# Pico 2 / Pico 2 W carry the RP2350, not the RP2040 of the Pico / Pico W, and no
# emulator platform exists for it, so this entry's job is to make the refusal name
# the RP2350 instead of binding the RP2040 card.
value_re = '^(RPi[-_ ]?|Raspberry[-_ ]?Pi[-_ ]?)?Pico[-_ ]?2([-_ ]?W)?([-_ ]?(SMD|THT|H))?$'
mcu = "RP2350"
source = "Raspberry Pi Pico 2 datasheet (datasheets.raspberrypi.com/pico/pico-2-datasheet.pdf, sha256 cbcfaf881018c686495a2e53c7bd281e7e0a8217d79447d73eda7c8f74b7f675) PDF p.4: 'RP2350A microcontroller with 4 MB flash'"

# --- Plug-in dev boards the library cannot run: named, so the report says which chip
# Each of these boards fits a header footprint that other boards also use (the
# Nano, Feather and XIAO footprints). The value names the board, and the board
# fixes the chip. The library has no header pad map for these boards, and for
# several of them no emulator for the chip. So the part is left unresolved, and
# the report names the chip instead of running firmware on the wrong core. The
# sources are the vendors' product pages, saved 2026-10-24.
[[mcu_modules]]
id = "arduino_nano_every"
value_re = '^(Arduino[-_ ]?)?Nano[-_ ]?Every$'
mcu = "ATmega4809"
blocker = "Arduino Nano Every carries an ATmega4809 (megaAVR 0-series), not the classic Nano's ATmega328P, and the model library has no co-sim or header pad map for it, so its firmware is not run"
source = "docs.arduino.cc/hardware/nano-every (sha256 73f2a0e5ed70743e188ee12c47419eddb8f08f84be0efdb7b0fb694c5736280e): 'sharing the same exact pinout but featuring the ATMega4809'"

[[mcu_modules]]
id = "arduino_nano_esp32"
value_re = '^(Arduino[-_ ]?)?Nano[-_ ]?ESP32([-_ ]?S3)?$'
mcu = "ESP32-S3"
blocker = "Arduino Nano ESP32 carries an ESP32-S3 (in a u-blox NORA-W106), not the classic Nano's ATmega328P, and the model library has no header pad map for it, so its firmware is not run"
source = "docs.arduino.cc/hardware/nano-esp32 (sha256 5888543c3021d41fdad5ce7d3cb99eb456e59d2fe7ad6a56c1d8a4f498eb6870): 'features the NORA-W106, a module with a ESP32-S3 chip inside'"

