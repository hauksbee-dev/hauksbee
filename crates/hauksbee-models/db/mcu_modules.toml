[[mcu_modules]]
id = "esp32_s3_wroom_footprint"
footprint_re = '(?:^|[:/])ESP32[-_ ]?S3[-_ ]?WROOM[-_ ]?[12]'
as_value = "ESP32-S3-WROOM-1"
source = "Espressif ESP32-S3-WROOM-1 datasheet, Module Overview, PDF p.2 (sha256 27d71971da07c280c6068d08c74720d1a25b8f20cf8494dc1765bdd28d40d435): the module integrates the ESP32-S3"

[[mcu_modules]]
id = "esp32_c3_mini_footprint"
