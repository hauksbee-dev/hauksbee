[models.pin_capability.routed]
basis = "Nordic nRF52832 Product Specification v1.9 (page numbers are PDF pages, which equal the printed 'Page N' footers; copy nRF52832_PS.pdf sha256 2ea4a573c232d2b2b52056e718d4bc173e2cc019b08394ce03c848b15d577093): section 20 GPIO feature list (p.114): 'All pins can be individually mapped to interface blocks for layout flexibility' and 'All pins can be used by the PPI task/event system'. SPIM section 31 (p.285) 'Individual selection of IO pin for each SPI signal' and 31.5 Master mode pin configuration (p.288): SCK, MOSI and MISO mapped by PSEL.SCK/PSEL.MOSI/PSEL.MISO. TWIM section 33.7 Master mode pin configuration (p.314): SCL and SDA mapped by PSEL.SCL/PSEL.SDA. UARTE section 35.9 Pin configuration (p.341): RXD, CTS, RTS and TXD mapped by PSEL.RXD/PSEL.CTS/PSEL.RTS/PSEL.TXD. PWM section 47.4 Pin configuration (p.507): OUT[n] mapped by PSEL.OUT[n]. timer_capture is routed through GPIOTE and PPI, not a dedicated pin: section GPIOTE (p.161) IN[n] events 'generated from changes occurring at the inputs of individual pins' selected by CONFIG[n].PSEL (8 channels), PPI (p.172) connects that event to the TIMER TASKS_CAPTURE[n] task (TIMER section p.238, TASKS_CAPTURE[n] p.240); at most 8 pins at a time can be captured this way. Restrictions found: the GPIO is the single 32-pin port P0.00-P0.31; section 4.3 GPIO usage restrictions (p.18) Tables 5 and 6 recommend P0.22-P0.31 (the pads near the radio) for 'Low drive, low frequency I/O only' (up to 10 kHz) to protect radio performance, a recommendation not a hardware limit, so a fast bus on those pads works but degrades radio sensitivity; P0.00/P0.01 are the XL1/XL2 32.768 kHz crystal pads, P0.09/P0.10 are NFC1/NFC2 until UICR NFCPINS is set (Table 7 p.18), and P0.21 is nRESET only when UICR PSELRESET is programmed; one peripheral may drive a pin at a time; hardware peripheral only, a software implementation can use any pad"
functions = ["spi_sck", "spi_mosi", "spi_miso", "i2c_sda", "i2c_scl", "uart_tx", "uart_rx", "pwm", "timer_capture"]


