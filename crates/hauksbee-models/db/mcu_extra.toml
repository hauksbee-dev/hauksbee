"22" = "gpio1_txd"          # TXD; TXD, GPIO1; must not be pulled low at power-up

[models.pin_capability.adc]
basis = "Ai-Thinker ESP-01/07/12 Series Modules User's Manual V1.3, Table 2.2 (PDF p.10): the ADC pad is pad 2; no other pad carries an ADC input"
[models.pin_capability.adc.pads]
"2" = "TOUT"

[[models.envelope]]
