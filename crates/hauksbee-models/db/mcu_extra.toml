conditions = "VIN = VDD, all pins except PA10 (OTG_FS_ID)"
basis = "STM32F411xC/xE DS10314 Rev 8, Table 53 p.99 weak pull-down equivalent resistor RPD, min/typ/max columns (printed in kohm)"

[[models.source.characteristic]]
parameter = "vol_output_low_voltage"
