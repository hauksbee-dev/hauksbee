# Official built-in part library: mcu_extra.
#
# Cards here are written from vendor datasheets only (every value carries a basis and a source).
# See target/launch/official-parts-20261022/ranking.md for the batch plan.

# ─────────────────────────────────────────────────────────────────────────────
# STM32F411CC/CE, UFQFPN48 (7 x 7 mm, ordering code F411C[CE]U).
#
# Source: STMicroelectronics STM32F411xC/xE datasheet DS10314 Rev 8 (January 2024).
#   Table 8 pin definitions pp.39-47 (UFQFPN48 column); Table 11 voltage and
#   Table 12 current limits pp.61-62; Table 13 TJ p.62; Table 14 operating
#   conditions pp.63-64; Table 53 I/O static characteristics pp.98-99; Table 54
#   output levels p.101; Table 56 NRST p.104; Table 65 ADC p.114; Table 86 thetaJA
#   p.140; Table 87 ordering information p.141 (package letter: H UFBGA,
#   T LQFP, U UFQFPN, Y WLCSP).
#
# ONE CARD PER PACKAGE. The five packages number their pads differently, so the
# pad map is true only on the package it was read from and the footprint rule
# gates the card (a bare ordering code names no footprint and keeps the family
# routing). The datasheet prints NO LQFP48 package for the F411.
#
# BACKEND. renode:stm32f4 is the generic STM32F4 platform (an F407 core), not an
# F411-specific model; the card claims no co-sim fidelity beyond what the
# existing stm32f401c card claims.
[[models]]
id = "stm32f411c_ufqfpn48"
kind = "mcu"
description = "STM32F411CC/CE, UFQFPN48 (7 x 7 mm, ordering code F411C[CE]U)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.st.com/resource/en/datasheet/stm32f411ce.pdf"
title = "STMicroelectronics STM32F411xC/xE datasheet DS10314 Rev 8 (January 2024); the sha256 is of the copy read from the third-party mirror mischianti.org/wp-content/uploads/2026/09/stm32f411ce_datasheet.pdf because st.com refuses automated download"
locator = "Table 8 pin definitions pp.39-47 (UFQFPN48 column); Tables 11-14 pp.61-64; Table 53 pp.98-99; Table 54 p.101; Table 56 p.104; Table 65 p.114; Table 86 p.140; Table 87 p.141"
sha256 = "ec4a7521b0074f4ad5ca2d6a59d00886c946658014a456d364089e75ae008ece"
[[models.source.pinout]]
package = "UFQFPN48"
pins = { "1" = "VBAT", "2" = "PC13-ANTI_TAMP", "3" = "PC14-OSC32_IN", "4" = "PC15-OSC32_OUT", "5" = "PH0 - OSC_IN", "6" = "PH1 - OSC_OUT", "7" = "NRST", "8" = "VSSA/VREF-", "9" = "VDDA/VREF+", "10" = "PA0-WKUP", "11" = "PA1", "12" = "PA2", "13" = "PA3", "14" = "PA4", "15" = "PA5", "16" = "PA6", "17" = "PA7", "18" = "PB0", "19" = "PB1", "20" = "PB2", "21" = "PB10", "22" = "VCAP_1", "23" = "VSS", "24" = "VDD", "25" = "PB12", "26" = "PB13", "27" = "PB14", "28" = "PB15", "29" = "PA8", "30" = "PA9", "31" = "PA10", "32" = "PA11", "33" = "PA12", "34" = "PA13", "35" = "VSS", "36" = "VDD", "37" = "PA14", "38" = "PA15", "39" = "PB3", "40" = "PB4", "41" = "PB5", "42" = "PB6", "43" = "PB7", "44" = "BOOT0", "45" = "PB8", "46" = "PB9", "47" = "VSS", "48" = "VDD" }

[models.match]
value_re = '(?i)^STM32F411C[CE](U[0-9x]?(TR)?)?$'
footprint_re = '(?i)(^|[:_])(UFQFPN|V?QFN)[-_]?48([^0-9]|$)'

[models.params]
# DS10314 Rev 8 (STM32F411xC/xE) p.85, HSE 4-26 MHz oscillator (Table 37 text): "For CL1 and CL2, it is recommended to use high-quality external ceramic
# capacitors in the 5 pF to 25 pF range (Typ.)" (the datasheet gives 10 pF as a rough estimate of the PCB and MCU pin capacitance that adds to the load).
xtal_cap_min_f = 5.0e-12
xtal_cap_max_f = 25.0e-12
backend = "renode:stm32f4"
internal_clock = "internal 16 MHz HSI RC oscillator"   # p.20: on reset the 16 MHz internal RC oscillator is selected
# Table 56 NRST weak pull-up RPU VIN = VSS: min 30, typ 40, max 50 kohm. Stored as the minimum.
reset_pull_up_ohms = 30000.0
# Table 65 ADC characteristics RAIN, external input impedance, max 50 kohm (the
# sampling-time dependent limit of its Equation 1 is lower at short sampling times).
max_adc_source_impedance_ohms = 50000.0

