# Boot-mode and enable straps (Ai-Thinker manual V1.3 Table 2.3 (PDF p.11): download = GPIO15 low, GPIO0 low, GPIO2 high, TXD0 high; running = GPIO15 low, GPIO0 high, GPIO2 high, TXD0 high). VIL max 0.25 VDD, VIH min 0.75 VDD.
[[models.straps]]
role = "en"
level = "high"
boot_select = false
