# CHIP_EN (Table 2-1 pin 7): high = chip on, low = off, small current. The datasheet states no
# internal pull, so internal_pull stays unknown and a floating pin is not asserted a fault.
[[models.straps]]
role = "en"
level = "high"
boot_select = false
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "CHIP_EN high = chip on, low = off (small current consumed)"

# Boot-mode straps. Levels: ESP-WROOM-02 Datasheet v3.7 Table 2-1 (PDF pp.8-9): IO0 UART download
# pull down, flash boot floating or pull up; IO15 pull down; IO2 floating (internal pull-up) or pull
# up. ESP8266EX Datasheet doc p.6: 'GPIO2, GPIO0, and MTDO are used to select booting mode and the
# SDIO mode'. Table 5-1: VIL max 0.25 VIO, VIH min 0.75 VIO (VIO = the VDDPST supply).
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = flash boot (normal); low = UART download"

[[models.straps]]
role = "gpio2"
level = "high"
boot_select = false
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO2 floating (internal pull-up) or pulled up at boot"

[[models.straps]]
role = "gpio15"
level = "low"
boot_select = true
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "MTDO / GPIO15 pulled down at boot"

# Doc p.6: 'U0TXD should not be pulled externally to a low logic level during the powering-up.'
[[models.straps]]
role = "gpio1_u0txd"
level = "high"
boot_select = false
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "U0TXD must not be pulled low externally while powering up"

[models.coverage]
implements = ["pad_map", "supply_envelope", "boot_strap_levels", "adc_pin_map", "per_pin_output_current_limit"]
missing = ["firmware_cosim_core", "gpio_behaviour", "uart", "absolute_maximum_ratings", "strap_table_in_chip_datasheet", "alternate_function_tables", "thermal_resistance", "silicon_timing_and_errata"]

