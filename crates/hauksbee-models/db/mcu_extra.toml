# on boot mode and U0TXD (doc p.6, PDF p.11); Table 5-1 Electrical Characteristics
# (doc p.19, PDF p.24). The strap LEVELS are not in this datasheet (it says only
# that GPIO2, GPIO0 and MTDO select the boot and SDIO mode): they are read from
# the ESP-WROOM-02 datasheet Table 2-1 (PDF pp.8-9, the same chip on a module).
#
# NO ABSOLUTE MAXIMUM TABLE: the datasheet prints none, so no max_voltage_v and
# no abs_max_v is claimed. Table 5-1 IMAX (12 mA) is the only current limit.
#
# BACKEND IS `none:`: there is no ESP8266 co-sim emulator; without it the family
# router would fall back to an AVR core, so co-sim is refused by name.
