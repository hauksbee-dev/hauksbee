[models.ratings]
max_pin_current_a = 0.025    # Table 12 IIO: output current sunk or sourced by any I/O pin, 25 mA
max_current_a = 0.16         # Table 12 sum of IVDD over all VDD_x lines, 160 mA
max_voltage_v = 4.0          # Table 11 VDD-VSS (VDDA, VDD and VBAT) -0.3 to 4.0 V
max_junction_temp_c = 130.0  # Table 13 TJ maximum 130 C
theta_ja_c_per_w = 62.0        # Table 86 junction-ambient, UFBGA100

# Table 14 p.63 VDD 1.7 to 3.6 V. Note (1): the 1.7 V minimum is with an external power supply
# supervisor. Table 11 p.61 VDD-VSS -0.3 to 4.0 V.
[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.7
max_v = 3.6
abs_max_v = 4.0
basis = "STM32F411xC/xE DS10314 Rev 8, Table 14 p.63 VDD standard operating voltage 1.7 to 3.6 V (note 1: 1.7 V minimum is with an external power supply supervisor)"
abs_max_basis = "STM32F411xC/xE DS10314 Rev 8, Table 11 p.61 external main supply voltage VDD-VSS (including VDDA, VDD and VBAT) -0.3 to 4.0 V"

# Table 14: VDDA must be the same potential as VDD; 1.7-2.4 V limits the ADC to 1.2 Msps.
[[models.envelope]]
kind = "supply_range"
pin = "vdda"
min_v = 1.7
max_v = 3.6
abs_max_v = 4.0
basis = "STM32F411xC/xE DS10314 Rev 8, Table 14 p.63 VDDA analog operating voltage 1.7 to 3.6 V (ADC limited to 1.2 Msps below 2.4 V; must be the same potential as VDD, note 4 allows 300 mV between them during power-up and power-down)"
abs_max_basis = "STM32F411xC/xE DS10314 Rev 8, Table 11 p.61 external main supply voltage (including VDDA) -0.3 to 4.0 V"

[[models.envelope]]
kind = "supply_range"
pin = "vbat"
min_v = 1.65
max_v = 3.6
abs_max_v = 4.0
basis = "STM32F411xC/xE DS10314 Rev 8, Table 14 p.63 VBAT backup operating voltage 1.65 to 3.6 V"
abs_max_basis = "STM32F411xC/xE DS10314 Rev 8, Table 11 p.61 external main supply voltage (including VBAT) -0.3 to 4.0 V"

# BOOT0 alone is rated to 9 V (Table 11 VSS to 9.0 V; Table 14 0 to 9 V), whatever VDD is.
[[models.envelope]]
kind = "input_tolerance"
pins = ["boot0"]
max_v = 9.0
abs_max_v = 9.0
basis = "STM32F411xC/xE DS10314 Rev 8, Table 14 p.64 VIN input voltage on the BOOT0 pin 0 to 9 V"
abs_max_basis = "STM32F411xC/xE DS10314 Rev 8, Table 11 p.61 VIN input voltage for BOOT0 VSS to 9.0 V"

[[models.envelope]]
kind = "rail_order"
lower = "vref"
upper = "vdda"
basis = "STM32F411xC/xE DS10314 Rev 8, Table 65 p.114 VREF+ positive reference voltage 1.7 V to VDDA (and Table 14 note 3: VDDA-VREF+ < 1.2 V)"

# BOOT0 (Table 8 pp.39-47: dedicated BOOT0 pin). The datasheet gives BOOT0's input
# thresholds (Table 53) but NO boot-mode table: it defers boot selection to the
# reference manual and AN2606, which were not obtainable for this batch, so the
# normal-boot polarity and BOOT0's internal pull are ABSENT here (level "defined",
# internal_pull left unknown) rather than recalled from the F401 card.
[[models.straps]]
role = "boot0"
level = "defined"
boot_select = true
vil = [0.1, 0.1]     # Table 53 BOOT0 VIL max 0.1 VDD + 0.1 V
vih = [0.17, 0.7]    # Table 53 BOOT0 VIH min 0.17 VDD + 0.7 V
note = "BOOT0 selects the boot memory at reset; DS10314 prints no boot-mode table, so the normal-boot level is not asserted"

# NRST: Table 8 pp.39-47; Table 53 NRST VIL max 0.3 VDD, VIH min 0.7 VDD;
# Table 56 p.104 weak pull-up RPU 30/40/50 kohm.
[[models.straps]]
role = "reset"
level = "high"
boot_select = false
internal_pull = "pull_up"
vil = [0.3, 0.0]
vih = [0.7, 0.0]
note = "NRST is active low with an embedded weak pull-up (Table 56 RPU 30-50 kohm); held low it keeps the part in reset"

[[models.source.characteristic]]
parameter = "rpu_weak_pull_up_resistor"
min = 30000.0
typ = 40000.0
max = 50000.0
unit = "ohm"
conditions = "VIN = VSS, all pins except PA10 (OTG_FS_ID)"
basis = "STM32F411xC/xE DS10314 Rev 8, Table 53 p.99 weak pull-up equivalent resistor RPU, min/typ/max columns (printed in kohm)"

[[models.source.characteristic]]
parameter = "rpd_weak_pull_down_resistor"
min = 30000.0
typ = 40000.0
max = 50000.0
unit = "ohm"
conditions = "VIN = VDD, all pins except PA10 (OTG_FS_ID)"
basis = "STM32F411xC/xE DS10314 Rev 8, Table 53 p.99 weak pull-down equivalent resistor RPD, min/typ/max columns (printed in kohm)"

[[models.source.characteristic]]
parameter = "vol_output_low_voltage"
max = 0.4
unit = "V"
conditions = "CMOS port, IIO = +8 mA"
basis = "STM32F411xC/xE DS10314 Rev 8, Table 54 p.101 VOL output low level voltage, max column"

[[models.source.characteristic]]
parameter = "ilkg_io_input_leakage_current"
max = 1.0
unit = "uA"
conditions = "VSS <= VIN <= VDD, I/O input leakage"
basis = "STM32F411xC/xE DS10314 Rev 8, Table 53 p.98 I/O input leakage current Ilkg, max column (+/-1)"

