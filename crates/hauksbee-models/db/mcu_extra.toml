[models.pin_capability.uart_rx]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.6 UART, Table 4-6 Pin Definitions of UART (PDF p.20, printed 15/26) and the swap note (PDF p.21, printed 16/26: 'changing (U0TXD, U0RXD) to (MTDO, MTCK)'): U0RXD on IO3, U1RXD on SD_D1 IO8, and U0RXD swapped onto MTCK IO13; hardware peripheral only, a software (bit-banged) implementation can use any pad. Pad numbers are the QFN32 pin numbers of Table 2-1 Pin Definitions (PDF p.10, printed 5/26)."
[models.pin_capability.uart_rx.pads]
"25" = "U0RXD (IO3)"
"23" = "U1RXD (IO8)"
"12" = "U0RXD swapped (IO13)"

[models.pin_capability.pwm]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.7 Pulse-Width Modulation, Table 4-7 (PDF p.21, printed 16/26): 'The functionality of PWM interfaces can be implemented via software programming ... the function of PWM is realized by interruption of the timer'. There is no hardware output-compare/PWM channel, so no pad can carry a hardware PWM; the Table 4-7 pins (PWM0 GPIO12, PWM1 GPIO15, PWM2 GPIO14, PWM3 GPIO4) are the software PWM defaults only. Pad numbers are the QFN32 pin numbers of Table 2-1 Pin Definitions (PDF p.10, printed 5/26).; hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.timer_capture]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Chapter 4 Peripheral Interface (PDF p.18-22, printed 13/26-17/26) lists GPIO, SDIO, SPI/HSPI, I2C (software), I2S, UART, PWM (software), IR Remote Control (software, Table 4-8, IR Rx on GPIO5) and ADC; no timer input-capture channel is described, so no pad can latch a hardware timer capture; edge timestamps need a GPIO interrupt read in software. Pad numbers are the QFN32 pin numbers of Table 2-1 Pin Definitions (PDF p.10, printed 5/26).; hardware peripheral only, a software (bit-banged) implementation can use any pad"


# ─────────────────────────────────────────────────────────────────────────────
# Ai-Thinker ESP-12F Wi-Fi module (ESP8266EX), 22 pads (structure only, no co-sim core).
#
# Source: Ai-Thinker ESP-01/07/12 Series Modules User's Manual V1.3 (2018.3.10):
#   Table 2.2 pin definitions, ESP-12F 22-pad numbering (PDF p.10); Table 2.3
#   boot modes (PDF p.11); Tables 3.1-3.3 electrical characteristics (PDF p.12).
#   Corroborated by the Ai-Thinker ESP-12F datasheet V0 (Chinese): 3.0-3.6 V
#   supply (p.6), GPIO15 and boot modes (p.8), VIL/VIH 0.25/0.75 VIO (p.9).
#
# PAD NUMBERING. The Chinese datasheet numbers only 16 pins and leaves the six
# bottom pads (CS0, MISO, GPIO9, GPIO10, MOSI, SCLK) unnumbered; the manual (and
# the KiCad RF_Module symbol) number all 22. This card follows the manual's 22-pad
# table. ESP-12E has the same 22-pad map but is a different module and is not
# matched here.
#
# NO ABSOLUTE MAXIMUM TABLE for the module is printed in the source, so no
# max_voltage_v / abs_max_v is claimed. BACKEND IS `none:` (no ESP8266 co-sim
# emulator; the family router would otherwise fall back to an AVR core).
[[models]]
id = "esp_12f"
kind = "mcu"
description = "Ai-Thinker ESP-12F Wi-Fi module (ESP8266EX), 22 pads (structure only, no co-sim core)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://home-assistant-guide.com/wp-content/uploads/2021/04/ESP-01_ESP-07_ESP-12_Series_User_Manual_V1.3.pdf"
title = "Ai-Thinker ESP-01/07/12 Series Modules User's Manual V1.3 (2018.3.10); the sha256 is of the copy read from the third-party mirror home-assistant-guide.com"
locator = "Table 2.2 pin definitions, ESP-12F 22 pads (PDF p.10); Table 2.3 boot modes (PDF p.11); Tables 3.1-3.3 electrical characteristics (PDF p.12)"
sha256 = "c1c4497c79d9c6a0ac609969c93ec5cb122eb7cf6e46f75a811f5c8e66e7ab5e"
[[models.source.references]]
url = "https://atta.szlcsc.com/upload/public/pdf/source/20200407/C503584_BAFCE9C0764F8A7E92AC8BA7C54FCF76.pdf"
title = "Ai-Thinker ESP-12F module datasheet V0 (Chinese-language, 2018); the sha256 is of the copy read from the third-party mirror atta.szlcsc.com (LCSC C503584)"
locator = "supply 3.0-3.6 V p.6; GPIO15 and boot modes p.8; electrical characteristics p.9; bottom pads p.10"
sha256 = "9300067db5bf3c559d57217f3133b1e0f8b75ace80bd0d47e1b2fc17d081dcf8"
[[models.source.pinout]]
package = "ESP-12F (22 pads)"
pins = { "1" = "RST", "2" = "ADC", "3" = "EN", "4" = "IO16", "5" = "IO14", "6" = "IO12", "7" = "IO13", "8" = "VCC", "9" = "CS0", "10" = "MISO", "11" = "IO9", "12" = "IO10", "13" = "MOSI", "14" = "SCLK", "15" = "GND", "16" = "IO15", "17" = "IO2", "18" = "IO0", "19" = "IO4", "20" = "IO5", "21" = "RXD", "22" = "TXD" }

[models.match]
value_re = '(?i)^ESP[-_ ]?12[-_ ]?F$'

[models.params]
backend = "none:esp8266"

[models.pins]
"1" = "reset"               # RST; reset, active low
"2" = "tout"                # ADC; ADC input
"3" = "en"                  # EN; chip enable, active high
"4" = "gpio16"              # IO16; deep-sleep wake-up, connected to RST
"5" = "gpio14"              # IO14
"6" = "gpio12"              # IO12
"7" = "gpio13"              # IO13
"8" = "vdd"                 # VCC; module supply
"9" = "spi_cs0"             # CS0; SPI flash pad
"10" = "spi_miso"           # MISO; SPI flash pad
"11" = "gpio9"              # IO9
"12" = "gpio10"             # IO10
"13" = "spi_mosi"           # MOSI; SPI flash pad
"14" = "spi_sclk"           # SCLK; SPI flash pad
"15" = "gnd"                # GND
