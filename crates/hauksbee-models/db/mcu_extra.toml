basis = "STM32F411xC/xE DS10314 Rev 8, Table 8 pin definitions pp.39-47 (UFQFPN48 column): the ADC1_n channel named in each pin's additional-functions column; pads not listed carry none"
[models.pin_capability.adc.pads]
"10" = "ADC1_IN0"
"11" = "ADC1_IN1"
"12" = "ADC1_IN2"
"13" = "ADC1_IN3"
"14" = "ADC1_IN4"
"15" = "ADC1_IN5"
"16" = "ADC1_IN6"
