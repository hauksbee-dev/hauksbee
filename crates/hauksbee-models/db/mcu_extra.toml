# ─────────────────────────────────────────────────────────────────────────────
# Ai-Thinker ESP-07 / ESP-07S / ESP-12S Wi-Fi modules (ESP8266EX), 16 pads (structure only, no co-sim core).
#
# Source: Ai-Thinker ESP-01/07/12 Series Modules User's Manual V1.3 (2018.3.10),
#   Table 2.2 pin definitions, the ESP-07 / ESP-07S / ESP-12S column (PDF p.10);
#   Table 2.3 boot modes (PDF p.11); Tables 3.1-3.3 electrical characteristics
#   (PDF p.12).
#
# SINGLE-SOURCE CARD. The ESP-07 vendor datasheet itself could not be obtained,
# so this card rests on the user's manual alone; the manual lists the three
# modules in one pin column, and that is the only evidence for ESP-07S and
# ESP-12S sharing the ESP-07 map.
#
# NO ABSOLUTE MAXIMUM TABLE for the module is printed in the source, so no
# max_voltage_v / abs_max_v is claimed. BACKEND IS `none:` (no ESP8266 co-sim
# emulator; the family router would otherwise fall back to an AVR core).
[[models]]
id = "esp_07_16pad"
kind = "mcu"
description = "Ai-Thinker ESP-07 / ESP-07S / ESP-12S Wi-Fi modules (ESP8266EX), 16 pads (structure only, no co-sim core)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://home-assistant-guide.com/wp-content/uploads/2021/04/ESP-01_ESP-07_ESP-12_Series_User_Manual_V1.3.pdf"
title = "Ai-Thinker ESP-01/07/12 Series Modules User's Manual V1.3 (2018.3.10); the sha256 is of the copy read from the third-party mirror home-assistant-guide.com"
locator = "Table 2.2 pin definitions, ESP-07/07S/12S column (PDF p.10); Table 2.3 boot modes (PDF p.11); Tables 3.1-3.3 electrical characteristics (PDF p.12)"
sha256 = "c1c4497c79d9c6a0ac609969c93ec5cb122eb7cf6e46f75a811f5c8e66e7ab5e"
[[models.source.pinout]]
package = "ESP-07/07S/12S (16 pads)"
pins = { "1" = "RST", "2" = "ADC", "3" = "EN", "4" = "IO16", "5" = "IO14", "6" = "IO12", "7" = "IO13", "8" = "VCC", "9" = "GND", "10" = "IO15", "11" = "IO2", "12" = "IO0", "13" = "IO4", "14" = "IO5", "15" = "RXD", "16" = "TXD" }

[models.match]
value_re = '(?i)^ESP[-_ ]?(07S?|12S)$'

[models.params]
backend = "none:esp8266"

[models.pins]
"1" = "reset"               # RST; reset, active low
"2" = "tout"                # ADC; ADC input
"3" = "en"                  # EN; chip enable, active high
"4" = "gpio16"              # IO16; deep-sleep wake-up, connected to RST
"5" = "gpio14"              # IO14
"6" = "gpio12"              # IO12
"7" = "gpio13"              # IO13
"8" = "vdd"                 # VCC; module supply
"9" = "gnd"                 # GND
"10" = "gpio15"             # IO15; boot strap (pull down)
"11" = "gpio2"              # IO2; boot strap
"12" = "gpio0"              # IO0; boot strap (download mode when low)
"13" = "gpio4"              # IO4
"14" = "gpio5"              # IO5
"15" = "gpio3_rxd"          # RXD; RXD, GPIO3
"16" = "gpio1_txd"          # TXD; TXD, GPIO1; must not be pulled low at power-up

[models.pin_capability.adc]
basis = "Ai-Thinker ESP-01/07/12 Series Modules User's Manual V1.3, Table 2.2 (PDF p.10): the ADC pad is pad 2; no other pad carries an ADC input"
[models.pin_capability.adc.pads]
"2" = "TOUT"

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 3.0
max_v = 3.6
basis = "Ai-Thinker ESP-01/07/12 Series Modules User's Manual V1.3, Table 3.1 (PDF p.12) supply voltage 3.0 V to 3.6 V"

# Boot-mode and enable straps (Ai-Thinker manual V1.3 Table 2.3 (PDF p.11): download = GPIO15 low, GPIO0 low, GPIO2 high, TXD0 high; running = GPIO15 low, GPIO0 high, GPIO2 high, TXD0 high). VIL max 0.25 VDD, VIH min 0.75 VDD.
