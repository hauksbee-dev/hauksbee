# Espressif ESP-WROOM-02 Wi-Fi module (ESP8266EX), 18 pins plus centre ground pad (structure only, no co-sim core).
#
# Source: Espressif ESP-WROOM-02 Datasheet v3.7 (2025.11, NRND), 23-page PDF
#   whose footer counts 1/18 from the fifth PDF page (doc page N = PDF page N + 5):
#   Figure 2-1 and Table 2-1 Pin Definitions (PDF pp.8-9); Table 4-1 Electrical
#   Characteristics (PDF p.13). Pad 19 is the centre GND pad drawn in Figure 2-1.
#
# NO ABSOLUTE MAXIMUM TABLE for the module is printed in the source, so no
# max_voltage_v / abs_max_v is claimed. BACKEND IS `none:` (no ESP8266 co-sim
# emulator; the family router would otherwise fall back to an AVR core).
[[models]]
id = "esp_wroom_02"
kind = "mcu"
description = "Espressif ESP-WROOM-02 Wi-Fi module (ESP8266EX), 18 pins plus centre ground pad (structure only, no co-sim core)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.espressif.com/sites/default/files/documentation/0c-esp-wroom-02_datasheet_en.pdf"
title = "Espressif ESP-WROOM-02 Datasheet v3.7 (2025.11, NRND)"
locator = "Figure 2-1 and Table 2-1 Pin Definitions (PDF pp.8-9); Table 4-1 Electrical Characteristics (PDF p.13)"
sha256 = "092893b04e97d5a8e5c224f03d02062ca5e9523ff86bdc8b689b0c6ba0668750"
[[models.source.pinout]]
package = "ESP-WROOM-02 (19 pads)"
pins = { "1" = "3V3", "2" = "EN", "3" = "IO14", "4" = "IO12", "5" = "IO13", "6" = "IO15", "7" = "IO2", "8" = "IO0", "9" = "GND", "10" = "IO4", "11" = "RXD", "12" = "TXD", "13" = "GND", "14" = "IO5", "15" = "RST", "16" = "TOUT", "17" = "IO16", "18" = "GND", "19" = "GND" }

[models.match]
value_re = '(?i)^ESP[-_ ]?WROOM[-_ ]?02$'

[models.params]
backend = "none:esp8266"

[models.pins]
"1" = "vdd"                 # 3V3; module supply
"2" = "en"                  # EN; chip enable, active high
"3" = "gpio14"              # IO14
"4" = "gpio12"              # IO12
"5" = "gpio13"              # IO13
"6" = "gpio15"              # IO15; boot strap (pull down)
"7" = "gpio2"               # IO2; boot strap
"8" = "gpio0"               # IO0; boot strap (download mode when low)
"9" = "gnd"                 # GND
"10" = "gpio4"              # IO4
"11" = "gpio3_rxd"          # RXD; RXD, GPIO3
"12" = "gpio1_txd"          # TXD; TXD, GPIO1; must not be pulled low at power-up
"13" = "gnd2"               # GND
"14" = "gpio5"              # IO5
"15" = "reset"              # RST; reset, active low
"16" = "tout"               # TOUT; ADC input
"17" = "gpio16"             # IO16; deep-sleep wake-up, connected to RST
"18" = "gnd3"               # GND
"19" = "gnd4"               # GND; pad 19, the module's centre ground pad

[models.pin_capability.adc]
basis = "Espressif ESP-WROOM-02 Datasheet v3.7, Table 2-1 (PDF p.9): pad 16 TOUT is the ADC pin; no other pad carries an ADC input"
[models.pin_capability.adc.pads]
"16" = "TOUT"

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.7
max_v = 3.6
basis = "Espressif ESP-WROOM-02 Datasheet v3.7, Table 4-1 Electrical Characteristics (PDF p.13) supply voltage VDD 2.7 V min, 3.3 V typ, 3.6 V max"

# Boot-mode and enable straps (Espressif ESP-WROOM-02 Datasheet v3.7 Table 2-1 (PDF pp.8-9): IO15 pull down; IO2 floating (internal pull-up) or pull up; IO0 UART download pull down, flash boot floating or pull up; TXD floating or pull up). VIL max 0.25 VDD, VIH min 0.75 VDD.
[[models.straps]]
role = "en"
level = "high"
boot_select = false
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "EN (chip enable) is active high"

[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high (floating or pulled up) = flash boot (normal); low = UART download"

[[models.straps]]
role = "gpio2"
level = "high"
boot_select = false
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO2 high at boot in both download and flash-boot modes"

[[models.straps]]
role = "gpio15"
level = "low"
boot_select = true
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO15 (MTDO) low at boot in both download and flash-boot modes"

[[models.straps]]
role = "gpio1_txd"
level = "high"
boot_select = false
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "TXD high (floating or pulled up) at power-up; low selects the chip-test mode"

[models.coverage]
implements = ["pad_map", "supply_envelope", "boot_strap_levels", "adc_pin_map"]
missing = ["firmware_cosim_core", "gpio_behaviour", "uart", "absolute_maximum_ratings", "pin_and_package_current_ratings", "alternate_function_tables", "thermal_resistance", "silicon_timing_and_errata"]
[models.pin_capability.spi_sck]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.3 Serial Peripheral Interface, Table 4-2 Pin Definitions of SPIs and Table 4-3 Pin Definitions of HSPI (PDF p.19; the footer printed page is 14/26): SPICLK on IO6 and HSPICLK on IO14; hardware peripheral only, a software (bit-banged) implementation can use any pad. Module pad to chip GPIO mapping: Espressif ESP-WROOM-02 Datasheet v3.7, Figure 2-1 Pin Layout (PDF p.8) and Table 2-1 Pin Definitions (PDF p.8-9, printed 3/18-4/18: pad 3 IO14 HSPI_CLK, 4 IO12 HSPI_MISO, 5 IO13 HSPI_MOSI; UART0_CTS, 6 IO15, 7 IO2, 11 RXD, 12 TXD); the flash SPI bus is not brought out."
[models.pin_capability.spi_sck.pads]
"3" = "HSPICLK (IO14)"

[models.pin_capability.spi_mosi]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.3 Serial Peripheral Interface, Table 4-2 Pin Definitions of SPIs and Table 4-3 Pin Definitions of HSPI (PDF p.19; the footer printed page is 14/26): SPID/MOSI on IO8 and HSPID/MOSI on IO13; hardware peripheral only, a software (bit-banged) implementation can use any pad. Module pad to chip GPIO mapping: Espressif ESP-WROOM-02 Datasheet v3.7, Figure 2-1 Pin Layout (PDF p.8) and Table 2-1 Pin Definitions (PDF p.8-9, printed 3/18-4/18: pad 3 IO14 HSPI_CLK, 4 IO12 HSPI_MISO, 5 IO13 HSPI_MOSI; UART0_CTS, 6 IO15, 7 IO2, 11 RXD, 12 TXD); the flash SPI bus is not brought out."
[models.pin_capability.spi_mosi.pads]
"5" = "HSPID/MOSI (IO13)"

[models.pin_capability.spi_miso]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.3 Serial Peripheral Interface, Table 4-2 Pin Definitions of SPIs and Table 4-3 Pin Definitions of HSPI (PDF p.19; the footer printed page is 14/26): SPIQ/MISO on IO7 and HSPIQ/MISO on IO12; hardware peripheral only, a software (bit-banged) implementation can use any pad. Module pad to chip GPIO mapping: Espressif ESP-WROOM-02 Datasheet v3.7, Figure 2-1 Pin Layout (PDF p.8) and Table 2-1 Pin Definitions (PDF p.8-9, printed 3/18-4/18: pad 3 IO14 HSPI_CLK, 4 IO12 HSPI_MISO, 5 IO13 HSPI_MOSI; UART0_CTS, 6 IO15, 7 IO2, 11 RXD, 12 TXD); the flash SPI bus is not brought out."
[models.pin_capability.spi_miso.pads]
"4" = "HSPIQ/MISO (IO12)"

[models.pin_capability.i2c_sda]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.4 I2C Interface, Table 4-4 (PDF p.19-20, printed 14/26-15/26): 'ESP8266EX has one I2C, which is realized via software programming ... I2C interface functionality can be realized via software programming, and the clock frequency is 100 kHz at maximum'. There is no I2C hardware controller, so no pad can carry a hardware I2C; the Table 4-4 pins (SCL on MTMS/GPIO14, SDA on GPIO2) are the software bit-bang defaults only. Module pad to chip GPIO mapping: Espressif ESP-WROOM-02 Datasheet v3.7, Figure 2-1 Pin Layout (PDF p.8) and Table 2-1 Pin Definitions (PDF p.8-9, printed 3/18-4/18: pad 3 IO14 HSPI_CLK, 4 IO12 HSPI_MISO, 5 IO13 HSPI_MOSI; UART0_CTS, 6 IO15, 7 IO2, 11 RXD, 12 TXD); the flash SPI bus is not brought out.; hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.i2c_scl]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.4 I2C Interface, Table 4-4 (PDF p.19-20, printed 14/26-15/26): 'ESP8266EX has one I2C, which is realized via software programming ... I2C interface functionality can be realized via software programming, and the clock frequency is 100 kHz at maximum'. There is no I2C hardware controller, so no pad can carry a hardware I2C; the Table 4-4 pins (SCL on MTMS/GPIO14, SDA on GPIO2) are the software bit-bang defaults only. Module pad to chip GPIO mapping: Espressif ESP-WROOM-02 Datasheet v3.7, Figure 2-1 Pin Layout (PDF p.8) and Table 2-1 Pin Definitions (PDF p.8-9, printed 3/18-4/18: pad 3 IO14 HSPI_CLK, 4 IO12 HSPI_MISO, 5 IO13 HSPI_MOSI; UART0_CTS, 6 IO15, 7 IO2, 11 RXD, 12 TXD); the flash SPI bus is not brought out.; hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.uart_tx]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.6 UART, Table 4-6 Pin Definitions of UART (PDF p.20, printed 15/26) and the swap note (PDF p.21, printed 16/26: 'changing (U0TXD, U0RXD) to (MTDO, MTCK)'): U0TXD on IO1 (U0TXD pin), U1TXD on IO2 (UART1 transmit only), and U0TXD swapped onto MTDO IO15; hardware peripheral only, a software (bit-banged) implementation can use any pad. Module pad to chip GPIO mapping: Espressif ESP-WROOM-02 Datasheet v3.7, Figure 2-1 Pin Layout (PDF p.8) and Table 2-1 Pin Definitions (PDF p.8-9, printed 3/18-4/18: pad 3 IO14 HSPI_CLK, 4 IO12 HSPI_MISO, 5 IO13 HSPI_MOSI; UART0_CTS, 6 IO15, 7 IO2, 11 RXD, 12 TXD); the flash SPI bus is not brought out."
[models.pin_capability.uart_tx.pads]
"12" = "U0TXD (IO1)"
"7" = "U1TXD (IO2)"
"6" = "U0TXD swapped (IO15)"

[models.pin_capability.uart_rx]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.6 UART, Table 4-6 Pin Definitions of UART (PDF p.20, printed 15/26) and the swap note (PDF p.21, printed 16/26: 'changing (U0TXD, U0RXD) to (MTDO, MTCK)'): U0RXD on IO3, U1RXD on SD_D1 IO8, and U0RXD swapped onto MTCK IO13; hardware peripheral only, a software (bit-banged) implementation can use any pad. Module pad to chip GPIO mapping: Espressif ESP-WROOM-02 Datasheet v3.7, Figure 2-1 Pin Layout (PDF p.8) and Table 2-1 Pin Definitions (PDF p.8-9, printed 3/18-4/18: pad 3 IO14 HSPI_CLK, 4 IO12 HSPI_MISO, 5 IO13 HSPI_MOSI; UART0_CTS, 6 IO15, 7 IO2, 11 RXD, 12 TXD); the flash SPI bus is not brought out."
[models.pin_capability.uart_rx.pads]
"11" = "U0RXD (IO3)"
"5" = "U0RXD swapped (IO13)"

[models.pin_capability.pwm]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.7 Pulse-Width Modulation, Table 4-7 (PDF p.21, printed 16/26): 'The functionality of PWM interfaces can be implemented via software programming ... the function of PWM is realized by interruption of the timer'. There is no hardware output-compare/PWM channel, so no pad can carry a hardware PWM; the Table 4-7 pins (PWM0 GPIO12, PWM1 GPIO15, PWM2 GPIO14, PWM3 GPIO4) are the software PWM defaults only. Module pad to chip GPIO mapping: Espressif ESP-WROOM-02 Datasheet v3.7, Figure 2-1 Pin Layout (PDF p.8) and Table 2-1 Pin Definitions (PDF p.8-9, printed 3/18-4/18: pad 3 IO14 HSPI_CLK, 4 IO12 HSPI_MISO, 5 IO13 HSPI_MOSI; UART0_CTS, 6 IO15, 7 IO2, 11 RXD, 12 TXD); the flash SPI bus is not brought out.; hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.timer_capture]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Chapter 4 Peripheral Interface (PDF p.18-22, printed 13/26-17/26) lists GPIO, SDIO, SPI/HSPI, I2C (software), I2S, UART, PWM (software), IR Remote Control (software, Table 4-8, IR Rx on GPIO5) and ADC; no timer input-capture channel is described, so no pad can latch a hardware timer capture; edge timestamps need a GPIO interrupt read in software. Module pad to chip GPIO mapping: Espressif ESP-WROOM-02 Datasheet v3.7, Figure 2-1 Pin Layout (PDF p.8) and Table 2-1 Pin Definitions (PDF p.8-9, printed 3/18-4/18: pad 3 IO14 HSPI_CLK, 4 IO12 HSPI_MISO, 5 IO13 HSPI_MOSI; UART0_CTS, 6 IO15, 7 IO2, 11 RXD, 12 TXD); the flash SPI bus is not brought out.; hardware peripheral only, a software (bit-banged) implementation can use any pad"

