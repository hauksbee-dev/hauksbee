basis = "Nordic nRF52832 Product Specification v1.9 (page numbers are PDF pages, which equal the printed 'Page N' footers; copy nRF52832_PS.pdf sha256 2ea4a573c232d2b2b52056e718d4bc173e2cc019b08394ce03c848b15d577093): section 20 GPIO feature list (p.114): 'All pins can be individually mapped to interface blocks for layout flexibility' and 'All pins can be used by the PPI task/event system'. SPIM section 31 (p.285) 'Individual selection of IO pin for each SPI signal' and 31.5 Master mode pin configuration (p.288): SCK, MOSI and MISO mapped by PSEL.SCK/PSEL.MOSI/PSEL.MISO. TWIM section 33.7 Master mode pin configuration (p.314): SCL and SDA mapped by PSEL.SCL/PSEL.SDA. UARTE section 35.9 Pin configuration (p.341): RXD, CTS, RTS and TXD mapped by PSEL.RXD/PSEL.CTS/PSEL.RTS/PSEL.TXD. PWM section 47.4 Pin configuration (p.507): OUT[n] mapped by PSEL.OUT[n]. timer_capture is routed through GPIOTE and PPI, not a dedicated pin: section GPIOTE (p.161) IN[n] events 'generated from changes occurring at the inputs of individual pins' selected by CONFIG[n].PSEL (8 channels), PPI (p.172) connects that event to the TIMER TASKS_CAPTURE[n] task (TIMER section p.238, TASKS_CAPTURE[n] p.240); at most 8 pins at a time can be captured this way. Restrictions found: the GPIO is the single 32-pin port P0.00-P0.31; section 4.3 GPIO usage restrictions (p.18) Tables 5 and 6 recommend P0.22-P0.31 (the pads near the radio) for 'Low drive, low frequency I/O only' (up to 10 kHz) to protect radio performance, a recommendation not a hardware limit, so a fast bus on those pads works but degrades radio sensitivity; P0.00/P0.01 are the XL1/XL2 32.768 kHz crystal pads, P0.09/P0.10 are NFC1/NFC2 until UICR NFCPINS is set (Table 7 p.18), and P0.21 is nRESET only when UICR PSELRESET is programmed; one peripheral may drive a pin at a time; hardware peripheral only, a software implementation can use any pad"
functions = ["spi_sck", "spi_mosi", "spi_miso", "i2c_sda", "i2c_scl", "uart_tx", "uart_rx", "pwm", "timer_capture"]


# ─────────────────────────────────────────────────────────────────────────────
# Espressif ESP8266EX bare chip, QFN32 5 x 5 mm.
#
# Source: Espressif ESP8266EX Datasheet v7.1 (2025.11, NRND), 31-page PDF whose
# footer counts 1/26 from the third PDF page (doc page N = PDF page N + 5):
# Figure 2-1 and Table 2-1 Pin Definitions (doc pp.4-5, PDF pp.9-10) and the note
# on boot mode and U0TXD (doc p.6, PDF p.11); Table 5-1 Electrical Characteristics
# (doc p.19, PDF p.24). The strap LEVELS are not in this datasheet (it says only
# that GPIO2, GPIO0 and MTDO select the boot and SDIO mode): they are read from
# the ESP-WROOM-02 datasheet Table 2-1 (PDF pp.8-9, the same chip on a module).
#
# NO ABSOLUTE MAXIMUM TABLE: the datasheet prints none, so no max_voltage_v and
# no abs_max_v is claimed. Table 5-1 IMAX (12 mA) is the only current limit.
#
# BACKEND IS `none:`: there is no ESP8266 co-sim emulator; without it the family
# router would fall back to an AVR core, so co-sim is refused by name.
[[models]]
id = "esp8266ex_qfn32"
kind = "mcu"
description = "Espressif ESP8266EX Wi-Fi SoC, QFN32 5 x 5 mm (structure only, no co-sim core)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.uncertainty]]
status = "unknown"
parameter = "xtal_cap_range"
reason = "ESP8266EX Datasheet v7.1 section 3.2.1 High Frequency Clock, Table 3-1 (PDF p.13) prints the crystal's own parameters (24 MHz to 52 MHz, loading capacitance CL max 32 pF, motional capacitance 2 pF to 5 pF, series resistance 65 Ohm max) but no range for the external load capacitors on XTAL_IN and XTAL_OUT, so no xtal_cap_min_f / xtal_cap_max_f is stated"
[[models.source.references]]
url = "https://www.espressif.com/sites/default/files/documentation/0a-esp8266ex_datasheet_en.pdf"
title = "Espressif ESP8266EX Datasheet v7.1 (2025.11, NRND)"
locator = "Figure 2-1 and Table 2-1 Pin Definitions doc pp.4-5 (PDF pp.9-10); note on GPIO2/GPIO0/MTDO/U0TXD doc p.6 (PDF p.11); Table 5-1 Electrical Characteristics doc p.19 (PDF p.24)"
sha256 = "3a038e2fd3040ad06d95d41b16afc8292090339e9f8e728ce46a83db439cecf1"
[[models.source.references]]
url = "https://www.espressif.com/sites/default/files/documentation/0c-esp-wroom-02_datasheet_en.pdf"
title = "Espressif ESP-WROOM-02 Datasheet v3.7 (2025.11, NRND)"
locator = "Table 2-1 Pin Definitions (PDF pp.8-9): IO15 pull down, IO2 floating (internal pull-up) or pull up, IO0 UART download pull down / flash boot floating or pull up, TXD floating or pull up"
sha256 = "092893b04e97d5a8e5c224f03d02062ca5e9523ff86bdc8b689b0c6ba0668750"
[[models.source.pinout]]
package = "QFN32"
pins = { "1" = "VDDA", "2" = "LNA", "3" = "VDD3P3", "4" = "VDD3P3", "5" = "VDD_RTC", "6" = "TOUT", "7" = "CHIP_EN", "8" = "XPD_DCDC", "9" = "MTMS", "10" = "MTDI", "11" = "VDDPST", "12" = "MTCK", "13" = "MTDO", "14" = "GPIO2", "15" = "GPIO0", "16" = "GPIO4", "17" = "VDDPST", "18" = "SDIO_DATA_2", "19" = "SDIO_DATA_3", "20" = "SDIO_CMD", "21" = "SDIO_CLK", "22" = "SDIO_DATA_0", "23" = "SDIO_DATA_1", "24" = "GPIO5", "25" = "U0RXD", "26" = "U0TXD", "27" = "XTAL_OUT", "28" = "XTAL_IN", "29" = "VDDD", "30" = "VDDA", "31" = "RES12K", "32" = "EXT_RSTB", "33" = "GND" }

[models.match]
value_re = '(?i)^ESP8266(EX)?$'
footprint_re = '(?i)(^|[:_])V?QFN[-_]?32([^0-9]|$)'

[models.params]
backend = "none:esp8266"

[models.pins]
# Table 2-1. GPIO roles are the flat gpioN names the strap table matches by exact string.
"1" = "vdda"                # VDDA; analog power 2.5-3.6 V
"2" = "lna"                 # LNA
"3" = "vdd3p3"              # VDD3P3; amplifier power 2.5-3.6 V
"4" = "vdd3p3_2"            # VDD3P3; amplifier power 2.5-3.6 V
"5" = "vdd_rtc"             # VDD_RTC; NC (1.1 V), leave open
"6" = "tout"                # TOUT; ADC pin
"7" = "en"                  # CHIP_EN; CHIP_EN: high = on, low = off
"8" = "gpio16_xpd_dcdc"     # XPD_DCDC; deep-sleep wake-up, to be connected to EXT_RSTB
"9" = "gpio14_mtms"         # MTMS
"10" = "gpio12_mtdi"        # MTDI
"11" = "vdd"                # VDDPST; VDDPST, digital/IO power 1.8-3.6 V (the strap thresholds scale from it)
"12" = "gpio13_mtck"        # MTCK
"13" = "gpio15_mtdo"        # MTDO; MTDO, boot-mode strap
"14" = "gpio2"              # GPIO2; boot-mode strap
"15" = "gpio0"              # GPIO0; boot-mode strap
"16" = "gpio4"              # GPIO4
"17" = "vdd2"               # VDDPST; VDDPST, digital/IO power 1.8-3.6 V
"18" = "gpio9_sd_data2"     # SDIO_DATA_2
"19" = "gpio10_sd_data3"    # SDIO_DATA_3
"20" = "gpio11_sd_cmd"      # SDIO_CMD
"21" = "gpio6_sd_clk"       # SDIO_CLK
"22" = "gpio7_sd_data0"     # SDIO_DATA_0
"23" = "gpio8_sd_data1"     # SDIO_DATA_1
"24" = "gpio5"              # GPIO5
"25" = "gpio3_u0rxd"        # U0RXD
"26" = "gpio1_u0txd"        # U0TXD
"27" = "xtal_out"           # XTAL_OUT
"28" = "xtal_in"            # XTAL_IN
"29" = "vddd"               # VDDD; printed 'Analog Power 2.5 V ~ 3.6 V'
"30" = "vdda2"              # VDDA; analog power 2.5-3.6 V
"31" = "res12k"             # RES12K; 12 kOhm resistor to ground
"32" = "reset"              # EXT_RSTB; EXT_RSTB, active low
"33" = "gnd"                # GND; exposed pad

[models.pin_capability.adc]
basis = "Espressif ESP8266EX Datasheet v7.1, Table 2-1 Pin Definitions (doc p.5, PDF p.10): pin 6 TOUT is the ADC pin; no other pin carries an ADC input"
[models.pin_capability.adc.pads]
"6" = "TOUT"

[models.ratings]
max_pin_current_a = 0.012    # Table 5-1 IMAX 12 mA (an electrical-characteristics row; the datasheet prints no absolute-maximum table)

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.8
max_v = 3.6
basis = "Espressif ESP8266EX Datasheet v7.1, Table 2-1 pins 11 and 17 VDDPST digital/IO power supply 1.8 V ~ 3.6 V (doc p.5, PDF p.10)"

[[models.envelope]]
kind = "supply_range"
pin = "vdda"
min_v = 2.5
max_v = 3.6
basis = "Espressif ESP8266EX Datasheet v7.1, Table 2-1 pins 1 and 30 VDDA analog power 2.5 V ~ 3.6 V (doc pp.4-5, PDF pp.9-10); Table 5-1 working voltage 2.5 / 3.3 / 3.6 V"

[[models.envelope]]
kind = "supply_range"
pin = "vddd"
min_v = 2.5
max_v = 3.6
basis = "Espressif ESP8266EX Datasheet v7.1, Table 2-1 pin 29 VDDD, printed 'Analog Power 2.5 V ~ 3.6 V' (doc p.5, PDF p.10)"

[[models.envelope]]
kind = "supply_range"
pin = "vdd3p3"
min_v = 2.5
max_v = 3.6
basis = "Espressif ESP8266EX Datasheet v7.1, Table 2-1 pins 3 and 4 VDD3P3 amplifier power 2.5 V ~ 3.6 V (doc p.4, PDF p.9)"

# CHIP_EN (Table 2-1 pin 7): high = chip on, low = off, small current. The datasheet states no
# internal pull, so internal_pull stays unknown and a floating pin is not asserted a fault.
[[models.straps]]
role = "en"
level = "high"
boot_select = false
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "CHIP_EN high = chip on, low = off (small current consumed)"

# Boot-mode straps. Levels: ESP-WROOM-02 Datasheet v3.7 Table 2-1 (PDF pp.8-9): IO0 UART download
# pull down, flash boot floating or pull up; IO15 pull down; IO2 floating (internal pull-up) or pull
# up. ESP8266EX Datasheet doc p.6: 'GPIO2, GPIO0, and MTDO are used to select booting mode and the
# SDIO mode'. Table 5-1: VIL max 0.25 VIO, VIH min 0.75 VIO (VIO = the VDDPST supply).
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = flash boot (normal); low = UART download"

[[models.straps]]
role = "gpio2"
level = "high"
boot_select = false
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO2 floating (internal pull-up) or pulled up at boot"

[[models.straps]]
role = "gpio15_mtdo"
level = "low"
boot_select = true
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "MTDO / GPIO15 pulled down at boot"

# Doc p.6: 'U0TXD should not be pulled externally to a low logic level during the powering-up.'
[[models.straps]]
role = "gpio1_u0txd"
level = "high"
boot_select = false
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "U0TXD must not be pulled low externally while powering up"

[models.coverage]
implements = ["pad_map", "supply_envelope", "boot_strap_levels", "adc_pin_map", "per_pin_output_current_limit"]
missing = ["firmware_cosim_core", "gpio_behaviour", "uart", "absolute_maximum_ratings", "strap_table_in_chip_datasheet", "alternate_function_tables", "thermal_resistance", "silicon_timing_and_errata"]
[models.pin_capability.spi_sck]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.3 Serial Peripheral Interface, Table 4-2 Pin Definitions of SPIs and Table 4-3 Pin Definitions of HSPI (PDF p.19; the footer printed page is 14/26): SPICLK on IO6 and HSPICLK on IO14; hardware peripheral only, a software (bit-banged) implementation can use any pad. Pad numbers are the QFN32 pin numbers of Table 2-1 Pin Definitions (PDF p.10, printed 5/26)."
[models.pin_capability.spi_sck.pads]
"21" = "SPICLK (IO6)"
"9" = "HSPICLK (IO14)"

[models.pin_capability.spi_mosi]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.3 Serial Peripheral Interface, Table 4-2 Pin Definitions of SPIs and Table 4-3 Pin Definitions of HSPI (PDF p.19; the footer printed page is 14/26): SPID/MOSI on IO8 and HSPID/MOSI on IO13; hardware peripheral only, a software (bit-banged) implementation can use any pad. Pad numbers are the QFN32 pin numbers of Table 2-1 Pin Definitions (PDF p.10, printed 5/26)."
[models.pin_capability.spi_mosi.pads]
"23" = "SPID/MOSI (IO8)"
"12" = "HSPID/MOSI (IO13)"

[models.pin_capability.spi_miso]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.3 Serial Peripheral Interface, Table 4-2 Pin Definitions of SPIs and Table 4-3 Pin Definitions of HSPI (PDF p.19; the footer printed page is 14/26): SPIQ/MISO on IO7 and HSPIQ/MISO on IO12; hardware peripheral only, a software (bit-banged) implementation can use any pad. Pad numbers are the QFN32 pin numbers of Table 2-1 Pin Definitions (PDF p.10, printed 5/26)."
[models.pin_capability.spi_miso.pads]
"22" = "SPIQ/MISO (IO7)"
"10" = "HSPIQ/MISO (IO12)"

[models.pin_capability.i2c_sda]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.4 I2C Interface, Table 4-4 (PDF p.19-20, printed 14/26-15/26): 'ESP8266EX has one I2C, which is realized via software programming ... I2C interface functionality can be realized via software programming, and the clock frequency is 100 kHz at maximum'. There is no I2C hardware controller, so no pad can carry a hardware I2C; the Table 4-4 pins (SCL on MTMS/GPIO14, SDA on GPIO2) are the software bit-bang defaults only. Pad numbers are the QFN32 pin numbers of Table 2-1 Pin Definitions (PDF p.10, printed 5/26).; hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.i2c_scl]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.4 I2C Interface, Table 4-4 (PDF p.19-20, printed 14/26-15/26): 'ESP8266EX has one I2C, which is realized via software programming ... I2C interface functionality can be realized via software programming, and the clock frequency is 100 kHz at maximum'. There is no I2C hardware controller, so no pad can carry a hardware I2C; the Table 4-4 pins (SCL on MTMS/GPIO14, SDA on GPIO2) are the software bit-bang defaults only. Pad numbers are the QFN32 pin numbers of Table 2-1 Pin Definitions (PDF p.10, printed 5/26).; hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.uart_tx]
basis = "Espressif ESP8266EX Datasheet Version 7.1 (2025.11), Section 4.6 UART, Table 4-6 Pin Definitions of UART (PDF p.20, printed 15/26) and the swap note (PDF p.21, printed 16/26: 'changing (U0TXD, U0RXD) to (MTDO, MTCK)'): U0TXD on IO1 (U0TXD pin), U1TXD on IO2 (UART1 transmit only), and U0TXD swapped onto MTDO IO15; hardware peripheral only, a software (bit-banged) implementation can use any pad. Pad numbers are the QFN32 pin numbers of Table 2-1 Pin Definitions (PDF p.10, printed 5/26)."
[models.pin_capability.uart_tx.pads]
"26" = "U0TXD (IO1)"
"14" = "U1TXD (IO2)"
