# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   AN2606 Rev 70 (February 2026), https://www.st.com/resource/en/application_note/an2606-stm32-microcontroller-system-memory-boot-mode-stmicroelectronics.pdf sha256 25b466e39ecc61671dcb988d8ca538462d6452d85f68140cb981ed728f57e654;
#   AN3155 Rev 22 (September 2026), https://www.st.com/resource/en/application_note/an3155-usart-protocol-used-in-the-stm32-bootloader-stmicroelectronics.pdf sha256 0e3e1c35ffa3311aba33440d9d6236dc2f59af8a7f32482cf13d1d0af8c5e1f9;
#   RM0383 Rev 4 (https://www.st.com/resource/en/reference_manual/rm0383-stm32f411xce-advanced-armbased-32bit-mcus-stmicroelectronics.pdf) sha256 f20bbbf5c796b66a10220e9af6a369249481510379a3429916c720c74fe1857e.

[[models.pin_bias]]
role = "pa10"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 83 (STM32F411xx configuration in system memory boot mode) PDF p.185, USART1_RX pin: \"PA10 pin: USART1 in reception mode. Used in input no pull mode.\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0383 Rev 4 PDF p.506 section 19.3.1 USART character description: \"The TX pin is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\" AN2606 Rev 70 Figure 1 note 1, PDF p.47: \"A pull-up resistor must be added, if they are not connected on host side\"; section 4.3, PDF p.49: \"It is recommended to keep the RX pins of unused bootloader interfaces (USART_RX, SPI_MOSI, and CAN_RX, if present) at a known (low or high) level\"."
note = "The ROM bootloader detects a USART host by the start bit of its 0x7F frame, so a pull-down or a tie to ground on this pin holds the line in the break state and the bootloader cannot detect a host on this USART (its other interfaces still work). AN2606 allows an unused bootloader RX pin at either known level, so this matters only when the board is flashed over this USART; a missing bias is not reported, only one the wrong way round."

[models.pin_capability.reset_mode]
basis = "RM0383 Rev 4 (STM32F411 reference manual), section 8.3.1 GPIO: during and just after reset the I/O ports are input floating, except PA15 JTDI pull-up, PA14 JTCK/SWCLK pull-down, PA13 JTMS/SWDAT pull-up, PB4 NJTRST pull-up (PDF p.148); GPIOA_PUPDR reset 0x6400 0000, GPIOB_PUPDR 0x0000 0100, section 8.4.4 (PDF p.159)"
[models.pin_capability.reset_mode.pads]
"46" = "pull_up"  # pa13
"49" = "pull_down"  # pa14
"50" = "pull_up"  # pa15
"56" = "pull_up"  # pb4

# ─────────────────────────────────────────────────────────────────────────────
# STM32F411VC/VE, LQFP100 (14 x 14 mm, ordering code F411V[CE]T).
#
# Source: STMicroelectronics STM32F411xC/xE datasheet DS10314 Rev 8 (January 2024).
#   Table 8 pin definitions pp.39-47 (LQFP100 column); Table 11 voltage and
#   Table 12 current limits pp.61-62; Table 13 TJ p.62; Table 14 operating
#   conditions pp.63-64; Table 53 I/O static characteristics pp.98-99; Table 54
#   output levels p.101; Table 56 NRST p.104; Table 65 ADC p.114; Table 86 thetaJA
#   p.140; Table 87 ordering information p.141 (package letter: H UFBGA,
#   T LQFP, U UFQFPN, Y WLCSP).
#
# ONE CARD PER PACKAGE. The five packages number their pads differently, so the
# pad map is true only on the package it was read from and the footprint rule
# gates the card (a bare ordering code names no footprint and keeps the family
# routing). The datasheet prints NO LQFP48 package for the F411.
#
# BACKEND. renode:stm32f4 is the generic STM32F4 platform (an F407 core), not an
# F411-specific model; the card claims no co-sim fidelity beyond what the
# existing stm32f401c card claims.
[[models]]
id = "stm32f411v_lqfp100"
kind = "mcu"
description = "STM32F411VC/VE, LQFP100 (14 x 14 mm, ordering code F411V[CE]T)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.st.com/resource/en/datasheet/stm32f411ce.pdf"
title = "STMicroelectronics STM32F411xC/xE datasheet DS10314 Rev 8 (January 2024); the sha256 is of the copy read from the third-party mirror mischianti.org/wp-content/uploads/2026/09/stm32f411ce_datasheet.pdf because st.com refuses automated download"
locator = "Table 8 pin definitions pp.39-47 (LQFP100 column); Tables 11-14 pp.61-64; Table 53 pp.98-99; Table 54 p.101; Table 56 p.104; Table 65 p.114; Table 86 p.140; Table 87 p.141"
