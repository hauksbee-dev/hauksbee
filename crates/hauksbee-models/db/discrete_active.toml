# ── S8550: JCET PNP transistor, TO-92 (E-B-C) ──
[[models]]
id = "s8550_to92"
kind = "bjt_pnp"
description = "S8550 PNP transistor TO-92 (JCET), 25V, 500mA, hFE(1) 85-400 at IC=50mA"

[models.match]
# S8550 and S8550-TA (p.1 ordering table). TO-92 land only: footprint_re gates the package because the SOT-23 S8550
# pins B-E-C where the TO-92 pins E-B-C. A value-only query with no footprint deliberately resolves to no card here.
# The 1.5 A SS8550 and the NPN S8050 are other parts.
value_re = "(?i)^S8550(?:[-_ ]?TA)?$"
footprint_re = "(?i)TO[-_ ]?92"

[models.params]
# Source: JCET TO-92 S8550, Rev. F (Aug 2017). Params are magnitudes; the kind carries the polarity.
# Capacitances appear only as a plotted curve (p.3), so cje and cjc are absent. DELIBERATELY ABSENT: vaf, br, rb, rc, re,
# tr, cje, cjc, ise, ikf.
is = 1.204e-13        # derived: graph read |VBE| = 0.65 V at IC = 10 mA, VCE = -1 V, 25 °C (p.3), nf = 1:
                      # is = 0.010 / exp(0.65 / 0.025852) = 1.20e-13 A
bf = 242.5            # ASSUMED arithmetic midpoint of the printed hFE(1) 85..400 at IC = 50 mA, VCE = -1 V (p.2); no typical is printed
nf = 1.0              # ASSUMED ideal junction slope: one graph point fixes no slope
tf = 1.061e-09        # fT MIN 150 MHz at VCE = -6 V, IC = -20 mA, f = 30 MHz: 1/(2*pi*150e6) (p.2); an upper bound on tf

[models.pins]
"1" = "emitter"
"2" = "base"
"3" = "collector"

[models.ratings]
max_current_a = 0.5       # |IC| continuous
max_power_w = 0.625       # PD at Ta = 25 °C
max_voltage_v = 25.0      # |VCEO| (|VCBO| 40 V)
max_junction_temp_c = 150.0 # Tj
theta_ja_c_per_w = 200.0  # RθJA

