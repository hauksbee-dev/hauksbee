[[models]]
id = "mmbt3906"
kind = "bjt_pnp"
description = "MMBT3906L PNP general-purpose transistor SOT-23 (onsemi), 40V, 200mA"

[models.match]
# MMBT3906LT1G / LT3G and the automotive SMMBT3906LT1G / LT3G (p.7). The NPN MMBT3904 and the TO-92 2N3906 are other cards.
value_re = "(?i)^S?MMBT3906(?:L(?:T[13])?)?G?$"

[models.params]
# Source: onsemi MMBT3906L / SMMBT3906L (MMBT3906LT1/D) Rev. 15, September 2026. The sheet prints MIN and MAX columns only, no
# SPICE model. Params are magnitudes; the kind carries the polarity.
# DELIBERATELY ABSENT, because the sheet states none of them: vaf, br, rb, rc, re, tr, ise, ikf.
is = 1.74e-14         # derived: graph read |VBE(on)| = 0.7 V at IC = 10 mA, 25 °C (p.6 Figure 17), nf = 1:
                      # is = 0.010 / exp(0.7 / 0.025852) = 1.74e-14 A
bf = 200.0            # ASSUMED arithmetic midpoint of hFE 100 min / 300 max at IC = 10 mA, VCE = -1 V (p.2); no typical is printed
nf = 1.0              # ASSUMED ideal junction slope: one graph point fixes no slope
cje = 1.184e-11       # Cibo MAX 10 pF at |VEB| = 0.5 V: 10p * (1 + 0.5/0.75)^0.33 = 11.8 pF zero-bias (p.2); a max bound, not a typical
cjc = 8.813e-12       # Cobo MAX 4.5 pF at |VCB| = 5 V: 4.5p * (1 + 5/0.75)^0.33 = 8.4 pF zero-bias (p.2); a max bound, not a typical
tf = 6.366e-10        # fT MIN 250 MHz at IC = 10 mA, |VCE| = 20 V, f = 100 MHz: 1/(2*pi*250e6) (p.2); an upper bound on tf

[models.pins]
"1" = "base"
"2" = "emitter"
"3" = "collector"

[models.ratings]
max_current_a = 0.2       # |IC| continuous (ICM 800 mA peak)
max_power_w = 0.225       # PD at TA = 25 °C on the FR-5 board, the least favourable row (0.3 W on alumina)
max_voltage_v = 40.0      # |VCEO| (|VCBO| 40 V)
