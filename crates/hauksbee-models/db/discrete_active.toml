# ── Si7461DP: Vishay Siliconix P-channel 60 V power MOSFET, PowerPAK SO-8 ──
[[models]]
id = "si7461dp"
kind = "pmos"
description = "Si7461DP Vishay Siliconix P-channel 60V TrenchFET PowerPAK SO-8, 14.5 mOhm max @ Vgs=-10V, 19 mOhm @ -4.5V"

[models.match]
# The two orderable codes the datasheet prints (Si7461DP-T1-E3, Si7461DP-T1-GE3) and the bare part name.
value_re = "(?i)^SI7461DP(?:-T1-(?:E3|GE3))?$"

[models.params]
# Source: Vishay Si7461DP, Document Number 72567, S13-2282-Rev. H, 04-Nov-13. The sheet plots its capacitances and prints no numeric table, so there is no cgs/cgd.
# kp: ASSUMED fit, derived from the two guaranteed MAXIMUM RDS(on) rows at |VGS| = 10 V (0.0145 Ohm) and 4.5 V (0.019 Ohm), |vto| = 2 V:
#   kp = (1/(4.5-2) - 1/(10-2)) / (0.019 - 0.0145) = 61.11 A/V^2; rd + rs = 0.0145 - 1/(61.11*8) = 0.012455 Ohm, split evenly.
#   Both fitted rows are reproduced.
# NOT MODELLED: the body diode (VSD -1.2 V max at IS = -4.5 A), `lambda` (no output-conductance data), avalanche, SOA, and the RDS(on) temperature curve.
vto = -2.0            # ASSUMED midpoint of the -1..-3 V VGS(th) band (Specifications, Static); no typical is printed
kp = 61.11            # A/V^2: fitted to the RDS(on) max rows at VGS = -10 V and -4.5 V with vto = -2 V (see above)
rd = 0.0062275        # half the fitted ohmic residue (see above)
rs = 0.0062275        # other half

[models.pins]
# Page 1 Bottom View: pins 1, 2, 3 are S, pin 4 is G, pins 5, 6, 7, 8 are D.
"1" = "source"
"2" = "source"
"3" = "source"
"4" = "gate"
"5" = "drain"
"6" = "drain"
"7" = "drain"
"8" = "drain"
"G" = "gate"
"D" = "drain"
"S" = "source"

[models.ratings]
max_current_a = 6.9       # |ID| steady state at TA = 70 C, TJ = 150 C, the least favourable tagged row (8.6 A at TA = 25 C; 14.4 A and 11.5 A for t <= 10 s)
max_surge_current_a = 60.0 # |IDM| pulsed drain current
max_power_w = 1.2         # PD steady state at TA = 70 C, the least favourable tagged row (1.9 W at TA = 25 C; board is 1 in x 1 in FR4)
max_voltage_v = 60.0      # |VDS| absolute maximum
max_junction_temp_c = 150.0 # TJ max
theta_ja_c_per_w = 65.0   # RthJA steady-state maximum, 1 in x 1 in FR4 board
theta_jc_c_per_w = 1.3    # RthJC (drain) steady-state maximum
rds_on_vgs = 4.5          # lowest |VGS| an RDS(on) row is specified at
vgs_th_max = 3.0          # |VGS(th)| max @ VDS = VGS, ID = -250 uA
vgs_max = 20.0            # VGS absolute maximum, both polarities

