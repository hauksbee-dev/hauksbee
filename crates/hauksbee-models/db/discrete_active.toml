value_re = "(?i)^TIP121G?$"

[models.params]
# Source: onsemi TIP120/D Rev. 10 (June 2024), the TIP121, TIP126 column. NPN Darlington; params are magnitudes, the kind carries the polarity.
# THE CARD IS ONE BJT, NOT A DARLINGTON PAIR. Figure 1 (p.3) shows two transistors with about 8.0 kΩ and about 120 Ω
# base-emitter shunt resistors built in; the schema has no field for them, so they are not modelled (the 'Features'
# list says 'Built-In Base-Emitter Shunt Resistors'). DELIBERATELY ABSENT: is (see uncertainty), nf, vaf, br, rb, rc,
# re, tf, tr, cje, ise, ikf: the sheet prints no fT, no input capacitance and no SPICE model.
