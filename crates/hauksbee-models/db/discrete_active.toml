# ── IRLZ44N: Infineon logic-level N-channel HEXFET, TO-220 ──
[[models]]
id = "irlz44n"
kind = "nmos"
description = "IRLZ44N logic-level N-channel HEXFET TO-220, 55V, 47A, Rds(on) 22mOhm max @ Vgs=10V, 25mOhm @ 5V"

[models.match]
# IRLZ44NPbF is the orderable (p.1). The D2PAK IRLZ44NS and TO-262 IRLZ44NL carry other datasheets, the older IRLZ44
# is a different die, and IRFZ44N is the standard-level sibling: none of them match.
value_re = "(?i)^IRLZ44N(?:PBF)?$"

[models.params]
# Source: Infineon IRLZ44NPbF HEXFET Rev. 2.1 (2026-08-12), TO-220. A logic-level part: RDS(on) is guaranteed at VGS = 4 V, 5 V and 10 V.
# kp: ASSUMED fit, derived from the two guaranteed MAXIMUM RDS(on) rows at VGS = 10 V (0.022 Ohm) and 5 V (0.025 Ohm):
#   kp = (1/(5-1.5) - 1/(10-1.5)) / (0.025 - 0.022) = 56.02 A/V^2; rd + rs = 0.022 - 1/(56.02*8.5) = 0.0199 Ohm, split evenly.
#   Both fitted rows are reproduced; the VGS = 4 V row (35 mOhm max) is predicted 27.0 mOhm, inside its bound.
# gfs CROSS-CHECK IS A MISS: gm = sqrt(2*kp*ID) at 25 A is 53 S against a printed gfs MIN of 21 S. The card is
#   on-resistance-accurate (as a max bound) and transconductance-optimistic; do not use it to predict small-signal gain.
# NOT MODELLED: the body diode, `lambda` (the sheet prints no output-conductance data), avalanche, SOA, and the RDS(on) temperature curve.
vto = 1.5             # ASSUMED midpoint of the 1..2 V VGS(th) band (p.2); no typical is printed
kp = 56.02            # A/V^2: fitted to the RDS(on) max rows at VGS = 10 V (22 mOhm) and 5 V (25 mOhm), vto = 1.5 V; see above
rd = 0.00995          # half the fitted ohmic residue (see above)
rs = 0.00995          # other half
cgd = 1.5e-10         # = Crss typ 150 pF, Infineon IRLZ44NPbF Rev. 2.1, PDF p.2, Dynamic Electrical Characteristics, VGS = 0, VDS = 25 V, f = 1 MHz
cgs = 1.55e-09        # = Ciss typ - Crss typ = 1700 - 150 = 1550 pF, same table and bias

[models.pins]
"1" = "gate"
"2" = "drain"
"3" = "source"
"G" = "gate"
"D" = "drain"
"S" = "source"

[models.ratings]
max_current_a = 33.0      # ID continuous at TC = 100 °C, VGS = 10 V, the least favourable tagged row (47 A at TC = 25 °C)
max_surge_current_a = 160.0 # IDM pulsed drain current
max_power_w = 110.0       # PD at TC = 25 °C: a CASE-referenced figure that assumes a heatsink; in still air the junction limit via theta_ja binds
max_voltage_v = 55.0      # V(BR)DSS min
max_junction_temp_c = 175.0 # TJ max
theta_ja_c_per_w = 62.0   # RθJA max
theta_jc_c_per_w = 1.4    # RθJC max: places the TC rows at the case
rds_on_vgs = 4.0          # lowest VGS an RDS(on) row is specified at
vgs_th_max = 2.0          # VGS(th) max @ VDS = VGS, ID = 250 µA
vgs_max = 16.0            # VGS absolute maximum, both polarities

