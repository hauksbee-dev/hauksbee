                      # (p.1 Features) is above the checker's bf ceiling of 2000, so the guaranteed minimum is used
cjc = 4.815e-10       # Cob MAX 200 pF at VCB = 10 V, f = 0.1 MHz: 200p * (1 + 10/0.75)^0.33 = 482 pF zero-bias (p.2); a max bound, not a typical

[models.pins]
"1" = "base"
"2" = "collector"
"3" = "emitter"

[models.ratings]
max_current_a = 5.0       # IC continuous (8.0 A peak)
max_power_w = 2.0         # PD at TA = 25 °C, the least favourable row (65 W at TC = 25 °C)
max_voltage_v = 80.0      # VCEO (VCB equal)
max_junction_temp_c = 150.0 # TJ, Tstg -65 to +150 °C
theta_ja_c_per_w = 62.5   # RθJA
theta_jc_c_per_w = 1.92   # RθJC, places the TC = 25 °C row

