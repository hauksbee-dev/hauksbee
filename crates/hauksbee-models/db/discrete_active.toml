[[models.source.characteristic]]
parameter = "VEBO emitter-base voltage rating"
max = 6.0
unit = "V"
conditions = "TA = 25 °C"
basis = "onsemi PN2222A Rev. 1.1.0, PDF p.2, Absolute Maximum Ratings, VEBO"
[[models.source.characteristic]]
parameter = "IC collector current"
rating = "max_current_a"
max = 1.0
