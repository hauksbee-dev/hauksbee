# ── 2N2222A: Central Semiconductor NPN switching transistor, TO-18 ──
[[models]]
id = "2n2222a"
kind = "bjt_npn"
description = "2N2222A NPN small-signal switching transistor TO-18 (Central Semiconductor), 40V, 800mA"

[models.match]
# The metal-can 2N2222A. The lead code is E-B-C, which a TO-92 2N2222A (and the PN2222A) shares, so the pin map
# holds for both. The 30 V 2N2222 (no A), 2N2221A, 2N2222AUB / JAN parts are other parts and do not match.
value_re = "(?i)^2N2222A$"

[models.params]
# Source: Central Semiconductor 2N2221A/2N2222A, R5 (5-December 2013), TO-18 metal can. MIN/MAX columns only, no
# VBE(on) value or curve and no SPICE model, so is and nf are left to the engine's defaults (declared unknown below).
# DELIBERATELY ABSENT: is, nf, vaf, br, rb, rc, re, tr, ise, ikf.
bf = 200.0            # ASSUMED arithmetic midpoint of hFE 100 min / 300 max at IC = 150 mA, VCE = 10 V (p.1, 2N2222A column); no typical is printed
cje = 2.959e-11       # Cib MAX 25 pF at VEB = 0.5 V: 25p * (1 + 0.5/0.75)^0.33 = 29.5 pF (p.2); a max bound, not a typical
cjc = 1.926e-11       # Cob MAX 8 pF at VCB = 10 V: 8p * (1 + 10/0.75)^0.33 = 18.8 pF zero-bias (p.2); a max bound, not a typical
tf = 5.305e-10        # fT MIN 300 MHz at VCE = 20 V, IC = 20 mA, f = 100 MHz: 1/(2*pi*300e6) (p.2); an upper bound on tf

[models.pins]
"1" = "emitter"
"2" = "base"
"3" = "collector"

[models.ratings]
max_current_a = 0.8       # IC continuous (800 mA)
max_power_w = 0.5         # PD at TA = 25 °C, the least favourable row (1.8 W at TC = 25 °C)
max_voltage_v = 40.0      # VCEO (VCBO 75 V)
max_junction_temp_c = 200.0 # TJ, Tstg -65 to +200 °C
theta_ja_c_per_w = 350.0  # ΘJA
theta_jc_c_per_w = 97.0   # ΘJC, places the TC = 25 °C row

