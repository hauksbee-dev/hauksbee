[models.match]
# Ordering codes BC337-025G, BC337-25RL1G, BC337-25RLRAG, BC337-25ZL1G (p.4). Bare BC337 and the -40 grade are other cards.
value_re = "(?i)^BC337[-_]?0?25(?:G|RL1G|RLRAG|ZL1G)?$"

