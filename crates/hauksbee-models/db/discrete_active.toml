# ─────────────────────────────────────────────────────────────────────────────

# ── BC337: onsemi NPN amplifier transistor, TO-92 ──
# BC337 TO-92 is C-B-E (not the E-B-C of the 2N2222A / PN2222A); no pin rule covers TO-92, so the map is explicit.
[[models]]
id = "bc337"
kind = "bjt_npn"
description = "BC337 NPN amplifier transistor TO-92 (onsemi), 45V, 800mA, hFE 100-630 at IC=100mA"

[models.match]
# Ordering codes BC337G, BC337RL1G (p.4). The graded -25 / -40 parts are their own cards; BC338 (30 V), BC327 (PNP) are other parts.
value_re = "(?i)^BC337(?:G|RL1G)?$"

[models.params]
# Source: onsemi BC337/D Rev. 8 (November 2013), the BC337 column of each grade row. Read from a distributor-hosted copy of that revision.
# DELIBERATELY ABSENT, because the sheet states none of them: vaf, br, rb, rc, re, tr, ise, ikf, cje (no input
# capacitance is printed).
is = 1.74e-14         # derived: graph read VBE(on) = 0.7 V at IC = 10 mA, VCE = 1 V, 25 °C (p.3 Figure 5), nf = 1:
                      # is = 0.010 / exp(0.7 / 0.025852) = 1.74e-14 A
bf = 365.0            # ASSUMED arithmetic midpoint of the printed BC337 hFE 100..630 at IC = 100 mA, VCE = 1 V (p.2); no typical is printed
nf = 1.0              # ASSUMED ideal junction slope: one graph point fixes no slope
cjc = 3.611e-11       # Cob typ 15 pF at VCB = 10 V: 15p * (1 + 10/0.75)^0.33 = 36.1 pF zero-bias (p.2 table; Figure 7 disagrees, see uncertainty)
tf = 7.579e-10        # fT typ 210 MHz at IC = 10 mA, VCE = 5 V, f = 100 MHz: 1/(2*pi*210e6) (p.2)

[models.pins]
"1" = "collector"
"2" = "base"
"3" = "emitter"

[models.ratings]
max_current_a = 0.8       # IC continuous
max_power_w = 0.625       # PD at TA = 25 °C, the least favourable row (1.5 W at TC = 25 °C)
max_voltage_v = 45.0      # VCEO (VCBO 50 V)
max_junction_temp_c = 150.0 # TJ, Tstg -55 to +150 °C
theta_ja_c_per_w = 200.0  # RθJA
theta_jc_c_per_w = 83.3   # RθJC, places the TC = 25 °C row

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.onsemi.com/pdf/datasheet/bc337-d.pdf"
title = "onsemi BC337, BC337-25, BC337-40 Amplifier Transistors NPN Silicon, BC337/D Rev. 8, November 2013"
locator = "PDF p.1 Maximum Ratings, Thermal Characteristics, CASE 29 Style 17; p.2 Electrical Characteristics; p.3 Figure 5; p.4 Ordering Information. The sha256 is of the distributor-hosted copy (Farnell) of this onsemi revision"
sha256 = "db3f84b5921f0116cf33eac7a32c34690af140104402dfb680a37602a39842ba"
[[models.source.uncertainty]]
status = "interval"
parameter = "bf"
low = 100.0
high = 630.0
unit = ""
kind = "specification-limits"
basis = "onsemi BC337/D Rev. 8, PDF p.2, Electrical Characteristics, hFE BC337 at IC = 100 mA, VCE = 1.0 V (min and max printed; the midpoint is an assumption)"
[[models.source.uncertainty]]
status = "interval"
parameter = "is"
low = 2.515e-15
high = 1.204e-13
unit = "A"
kind = "estimated-range"
basis = "onsemi BC337/D Rev. 8, PDF p.3, Figure 5 read to about +-0.05 V at IC = 10 mA"
[[models.source.uncertainty]]
status = "unknown"
parameter = "cjc"
reason = "the table prints Cob typ 15 pF at VCB = 10 V but Figure 7 (p.3) plots only about 4 pF at 10 V; the table value is used, so cjc may be several times too large"
[[models.source.pinout]]
package = "TO-92"
standard = "CASE 29 Style 17 (p.1): 1 Collector, 2 Base, 3 Emitter"
pins = { "1" = "C", "2" = "B", "3" = "E" }
[[models.source.characteristic]]
parameter = "VCEO collector-emitter voltage rating"
max = 45.0
