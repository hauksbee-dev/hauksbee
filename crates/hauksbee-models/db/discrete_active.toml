value_re = "(?i)^IRFZ44N(?:PBF)?$"

[models.params]
# Source: Infineon IRFZ44NPbF HEXFET Rev. 2.1 (2026-08-11), TO-220. A standard-level part (RDS(on) is specified at VGS = 10 V only).
# kp: ASSUMED, from the single guaranteed MAXIMUM RDS(on) row (17.5 mOhm at VGS = 10 V, ID = 25 A), vto = 3.0 V:
#   kp = 1/(0.0175*(10-3.0)) = 8.164 A/V^2 with rd = rs = 0 (absent). The gfs route kp = gfs^2/(2*ID) = 19^2/50 = 7.22
#   would need a NEGATIVE ohmic residue (0.0175 - 0.0198 Ohm), so it is rejected.
#   gfs CROSS-CHECK: gm = sqrt(2*8.164*25) = 20.2 S against a printed gfs MIN of 19 S, consistent.
#   NOT VALIDATED OUT OF SAMPLE: one RDS(on) row exists and it is the fit.
# NOT MODELLED: the body diode, `lambda` (the sheet prints no output-conductance data), avalanche, SOA, and the RDS(on) temperature curve.
vto = 3.0             # ASSUMED midpoint of the 2..4 V VGS(th) band (p.2); no typical is printed
kp = 8.164            # A/V^2: ASSUMED, chosen so the single RDS(on) max row at VGS = 10 V is reproduced with no ohmic residue; see above
cgd = 8.8e-11         # = Crss typ 88 pF, Infineon IRFZ44NPbF Rev. 2.1, PDF p.2, Dynamic Electrical Characteristics, VGS = 0, VDS = 25 V, f = 1 MHz
cgs = 1.382e-09       # = Ciss typ - Crss typ = 1470 - 88 = 1382 pF, same table and bias
warning = "a standard-level (not logic-level) part: its RDS(on) is specified only at VGS = 10 V and its VGS(th) runs to 4.0 V, so a 3.3 V or 5 V gate drive is outside what the datasheet guarantees"

