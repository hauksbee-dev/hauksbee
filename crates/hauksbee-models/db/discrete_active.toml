# ── TIP120: onsemi NPN Darlington power transistor, TO-220 ──
[[models]]
id = "tip120"
kind = "bjt_npn"
description = "TIP120 NPN Darlington power transistor TO-220 (onsemi), 60V, 5A, hFE 1000 min"

[models.match]
# TIP120 and TIP120G (p.7). Siblings TIP121, the PNP complement, TIP110-series and TIP3x are other parts.
value_re = "(?i)^TIP120G?$"

[models.params]
# Source: onsemi TIP120/D Rev. 10 (June 2024), the TIP120, TIP125 column. NPN Darlington; params are magnitudes, the kind carries the polarity.
# THE CARD IS ONE BJT, NOT A DARLINGTON PAIR. Figure 1 (p.3) shows two transistors with about 8.0 kΩ and about 120 Ω
# base-emitter shunt resistors built in; the schema has no field for them, so they are not modelled (the 'Features'
# list says 'Built-In Base-Emitter Shunt Resistors'). DELIBERATELY ABSENT: is (see uncertainty), nf, vaf, br, rb, rc,
# re, tf, tr, cje, ise, ikf: the sheet prints no fT, no input capacitance and no SPICE model.
bf = 1000.0           # derived: the printed hFE MIN of 1000 at IC = 0.5 A and 3.0 A, VCE = 3 V (p.2). The typical 2500 at IC = 4 A
                      # (p.1 Features) is above the checker's bf ceiling of 2000, so the guaranteed minimum is used
cjc = 4.815e-10       # Cob MAX 200 pF at VCB = 10 V, f = 0.1 MHz: 200p * (1 + 10/0.75)^0.33 = 482 pF zero-bias (p.2); a max bound, not a typical

[models.pins]
"1" = "base"
"2" = "collector"
"3" = "emitter"

[models.ratings]
max_current_a = 5.0       # IC continuous (8.0 A peak)
max_power_w = 2.0         # PD at TA = 25 °C, the least favourable row (65 W at TC = 25 °C)
max_voltage_v = 60.0      # VCEO (VCB equal)
max_junction_temp_c = 150.0 # TJ, Tstg -65 to +150 °C
theta_ja_c_per_w = 62.5   # RθJA
theta_jc_c_per_w = 1.92   # RθJC, places the TC = 25 °C row

