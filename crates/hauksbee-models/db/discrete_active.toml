# Official built-in part library: discrete_active.
#
# Cards here are written from vendor datasheets only (every value carries a basis and a source).
# See target/launch/official-parts-20261022/ranking.md for the batch plan.

# ── PN2222A: onsemi (Fairchild lineage) NPN amplifier/switch, TO-92 ──
[[models]]
id = "pn2222a"
kind = "bjt_npn"
description = "PN2222A NPN general-purpose amplifier/switch TO-92 (onsemi, Fairchild lineage), 40V, 1A"

[models.match]
# Ordering codes PN2222ABU / ATA / ATF / ATFR (p.2). The non-A PN2222 (30 V) and the metal-can 2N2222A are other parts.
value_re = "(?i)^PN2222A(?:BU|TA|TF|TFR)?$"

[models.params]
# Source: onsemi (Fairchild lineage) PN2222A, document PN2222A Rev. 1.1.0, July 2014. The sheet prints MIN and MAX columns
# only (no typical), no VBE(on) value or curve, and no SPICE model. is and nf are therefore left to the engine's
# defaults (declared unknown below); VBE(sat) is a saturation row, never an is anchor. DELIBERATELY ABSENT because
# the sheet states none of them: is, nf, vaf, br, rb, rc, re, tr, ise, ikf.
bf = 200.0            # ASSUMED arithmetic midpoint of hFE 100 min / 300 max at IC = 150 mA, VCE = 10 V (p.4); no typical is printed
cje = 2.959e-11       # Cibo MAX 25 pF at VEB = 0.5 V: 25p * (1 + 0.5/0.75)^0.33 = 29.5 pF (p.4); a max bound, not a typical
cjc = 1.926e-11       # Cobo MAX 8 pF at VCB = 10 V: 8p * (1 + 10/0.75)^0.33 = 18.8 pF zero-bias (p.4); a max bound, not a typical
tf = 5.305e-10        # fT MIN 300 MHz at IC = 20 mA, VCE = 20 V, f = 100 MHz: 1/(2*pi*300e6) (p.4); an upper bound on tf

[models.pins]
"1" = "emitter"
"2" = "base"
"3" = "collector"

[models.ratings]
max_current_a = 1.0       # IC continuous (p.2)
max_power_w = 0.625       # PD at TA = 25 °C on the Note 3 PCB (derate 5.0 mW/°C)
max_voltage_v = 40.0      # VCEO (VCBO 75 V)
max_junction_temp_c = 150.0 # TJ, Tstg -55 to 150 °C
theta_ja_c_per_w = 200.0  # RθJA max, Note 3 PCB
theta_jc_c_per_w = 83.3   # RθJC max

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.onsemi.com/pdf/datasheet/pn2222a-d.pdf"
title = "onsemi (Fairchild lineage) PN2222A NPN General-Purpose Amplifier, document PN2222A Rev. 1.1.0, July 2014"
locator = "PDF p.2 Ordering Information, Absolute Maximum Ratings; p.3 Thermal Characteristics; p.4 Electrical Characteristics"
sha256 = "f1eda8482f5f227f5c80c8ba750ae28ff2159139e268158bd656bc8f0db0a6d2"
[[models.source.uncertainty]]
status = "interval"
parameter = "bf"
low = 100.0
high = 300.0
unit = ""
kind = "specification-limits"
basis = "onsemi PN2222A Rev. 1.1.0, PDF p.4, Electrical Characteristics, hFE at IC = 150 mA, VCE = 10 V (min and max printed; the midpoint is an assumption)"
[[models.source.uncertainty]]
status = "unknown"
parameter = "is"
reason = "the datasheet prints no VBE(on) value or curve (VBE(sat) only); the engine default applies"
[[models.source.uncertainty]]
status = "unknown"
parameter = "nf"
reason = "the datasheet prints no junction-slope data; the engine default applies"
[[models.source.pinout]]
package = "TO-92 3L"
standard = "TO-92 EBC as printed on the p.2 outline: pin 1 E, pin 2 B, pin 3 C"
pins = { "1" = "E", "2" = "B", "3" = "C" }
[[models.source.characteristic]]
parameter = "VCEO collector-emitter voltage rating"
max = 40.0
unit = "V"
conditions = "TA = 25 °C"
basis = "onsemi PN2222A Rev. 1.1.0, PDF p.2, Absolute Maximum Ratings, VCEO"
[[models.source.characteristic]]
