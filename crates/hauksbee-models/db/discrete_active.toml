[models.params]
# Source: Infineon IRF3205PbF HEXFET Rev. 2.1 (2026-07-21), TO-220. A standard-level part (RDS(on) is specified at VGS = 10 V only).
# kp: ASSUMED, from the single guaranteed MAXIMUM RDS(on) row (8.0 mOhm at VGS = 10 V, ID = 62 A), vto = 3.0 V:
#   kp = 1/(0.008*(10-3.0)) = 17.86 A/V^2 with rd = rs = 0 (absent). The gfs route kp = gfs^2/(2*ID) = 44^2/124 = 15.61
#   would need a NEGATIVE ohmic residue (0.008 - 0.00915 Ohm), so it is rejected.
#   gfs CROSS-CHECK: gm = sqrt(2*17.86*62) = 47.1 S against a printed gfs MIN of 44 S, consistent.
#   NOT VALIDATED OUT OF SAMPLE: one RDS(on) row exists and it is the fit.
# NOT MODELLED: the body diode, `lambda` (the sheet prints no output-conductance data), avalanche, SOA, and the RDS(on) temperature curve.
vto = 3.0             # ASSUMED midpoint of the 2..4 V VGS(th) band (p.2); no typical is printed
kp = 17.86            # A/V^2: ASSUMED, chosen so the single RDS(on) max row at VGS = 10 V is reproduced with no ohmic residue; see above
cgd = 2.11e-10        # = Crss typ 211 pF, Infineon IRF3205PbF Rev. 2.1, PDF p.2, Dynamic Electrical Characteristics, VGS = 0, VDS = 25 V, f = 1 MHz
cgs = 3.036e-09       # = Ciss typ - Crss typ = 3247 - 211 = 3036 pF, same table and bias
warning = "the 110 A / 80 A continuous ratings are calculated from the junction-temperature limit; the datasheet states the PACKAGE limits continuous current to 75 A, and the card's max_current_a cannot say so"

[models.pins]
"1" = "gate"
"2" = "drain"
"3" = "source"
"G" = "gate"
"D" = "drain"
"S" = "source"

[models.ratings]
max_current_a = 80.0      # ID continuous at TC = 100 °C, VGS = 10 V, the least favourable tagged row (110 A at TC = 25 °C)
max_surge_current_a = 390.0 # IDM pulsed drain current
max_power_w = 200.0       # PD at TC = 25 °C: a CASE-referenced figure that assumes a heatsink; in still air the junction limit via theta_ja binds
max_voltage_v = 55.0      # V(BR)DSS min
max_junction_temp_c = 175.0 # TJ max
theta_ja_c_per_w = 62.0   # RθJA max
theta_jc_c_per_w = 0.75   # RθJC max: places the TC rows at the case
rds_on_vgs = 10.0         # lowest VGS an RDS(on) row is specified at
vgs_th_max = 4.0          # VGS(th) max @ VDS = VGS, ID = 250 µA
vgs_max = 20.0            # VGS absolute maximum, both polarities

