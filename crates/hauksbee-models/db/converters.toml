[[models]]
id = "pcm5102a"
kind = "dac"
description = "TI PCM5102A 112 dB SNR stereo I2S audio DAC with 2.1 VRMS ground-centred line outputs and PLL (hardware-strapped, no control bus), TSSOP-20 (PW)"

[models.match]
# PCM5102A only: the PCM5101A and PCM5100A (lower dynamic range) and the PCM5102 (no A) are not this card.
# Single package (TSSOP-20 PW), so no variant set. Orderable codes, from the Packaging Information addendum (also the -Q1 automotive grade, same silicon family, -40 to 125 C): PCM5102APW, PCM5102APWG4, PCM5102APWR, PCM5102AQPWRQ1.
mpn_re = "(?i)^PCM5102A([^0-9]|$)"

[models.params]
# Pad-map, supply, strap and level card: there is no control bus (hardware control only, no I2C or SPI registers),
# so there is no peripheral model. The I2S stream is not executed.
i2s_clock_role = "slave"       # 9.3.5 Clock Slave Mode pp.24-25: BCK, LRCK (and optional SCK) are all inputs; the device never drives an audio clock
mclk_required = false          # 9.3.5.3 p.25: with SCK tied to ground and BCK/LRCK running for 16 successive LRCK periods the internal PLL generates the system clock (3-wire I2S)
supply_pin = "20"              # DVDD (digital supply; AVDD pad 8 and CPVDD pad 1 are the other supply pads)
gnd_pin = "19"                 # DGND
warning = "pad map, supply ranges, strap meanings and ratings only: the I2S stream, PLL lock, filter, soft-mute and charge-pump behaviour are not executed, and no output waveform is produced"

[models.pins]
# 7 Pin Configuration and Functions p.5, PW 20-pin package.
"1" = "cpvdd"     # CPVDD charge pump power supply, 3.3 V
"2" = "capp"      # CAPP charge pump flying capacitor, positive
"3" = "cpgnd"     # CPGND charge pump ground
"4" = "capm"      # CAPM charge pump flying capacitor, negative
"5" = "vneg"      # VNEG negative charge pump rail, decoupling, -3.3 V
"6" = "outl"      # OUTL analog output, left
"7" = "outr"      # OUTR analog output, right
"8" = "avdd"      # AVDD analog power supply, 3.3 V
"9" = "agnd"      # AGND analog ground
"10" = "demp"     # DEMP de-emphasis for 44.1 kHz: off (low) / on (high)
"11" = "flt"      # FLT filter select: normal latency (low) / low latency (high)
"12" = "sysclk"   # SCK system clock input
"13" = "bck"      # BCK audio data bit clock input
"14" = "din"      # DIN audio data input
"15" = "lrck"     # LRCK audio data word clock input
"16" = "fmt"      # FMT audio format: I2S (low) / left-justified (high)
"17" = "xsmt"     # XSMT soft mute control: soft mute (low) / soft un-mute (high)
"18" = "ldoo"     # LDOO internal logic supply rail, decoupling (or external 1.8 V supply)
"19" = "dgnd"     # DGND digital ground
"20" = "dvdd"     # DVDD digital power supply, 1.8 V or 3.3 V

[models.ratings]
max_voltage_v = 3.9            # 8.1 Absolute Maximum Ratings p.6, AVDD, CPVDD, DVDD -0.3 V to 3.9 V (digital and analog input voltage also 3.9 V max)
max_junction_temp_c = 130.0    # 8.1 p.6, operating junction temperature range -40 to 130 C
