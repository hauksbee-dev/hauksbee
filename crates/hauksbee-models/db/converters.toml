[[models]]
id = "mcp4725_a0"
kind = "digital"
description = "Microchip MCP4725 12-bit I2C DAC with EEPROM, address option A0 (A2 A1 = 00 hard-wired, A0 from the pin, so 0x60 / 0x61): strapped I2C register map (fast write, write DAC register, write DAC register and EEPROM, read-back; output = code / 4096 x VDD), pad map and supply draw, SOT-23-6 (CH)"
variant_of = "mcp4725"

[models.match]
# Family match: every address option shares one die and pad map; the options differ only in the
# hard-wired A2 A1 address bits printed in the part number (MCP4725A0T-E/CH ... MCP4725A3T-E/CH).
# This member's orderable code: MCP4725A0T-E/CH.
value_re = "(?i)^MCP4725"

[models.variant]
orderable_re = "(?i)^MCP4725A0"
orderable = ["MCP4725A0T-E/CH"]
package = "SOT-23-6 (CH)"
basis = "Microchip MCP4725 DS22039D, Product Identification System p.47 (address option A0 = A2 A1 00, A0 External) and 10.1 Package Marking Information p.43 (A0, CH = SOT-23-6)"

[models.params]
vih = { min = 2.31, unit = "V", conditions = "VDD = 3.3 V (SDA, SCL)", basis = "DERIVED 0.7 x 3.3 V: p.4 Electrical Characteristics, VIH SDA and SCL 0.7 VDD min" }
vil = { max = 0.99, unit = "V", conditions = "VDD = 3.3 V (SDA, SCL)", basis = "DERIVED 0.3 x 3.3 V: p.4 Electrical Characteristics, VIL SDA and SCL 0.3 VDD max" }
supply_static_ua = 210.0   # p.3 Electrical Characteristics, IDD typ, code 000h, VOUT unloaded, digital inputs grounded (400 uA max)
supply_pin = "3"           # VDD
gnd_pin = "2"              # VSS
warning = "write commands (fast, write DAC register, write DAC register and EEPROM) and the read-back frame are executable and VOUT follows code / 4096 x VDD (0 V in power-down, where the datasheet gives a 1 k, 100 k or 500 k pull-down to ground); the model has no net-voltage binding for the supply, so the VDD used by the output law is a harness input that defaults to an assumed 3.3 V, not the board rail. EEPROM write time, the RDY/BSY wait that blocks new writes, the general-call reset and wake-up, and the POR status bit meaning are not modelled (the datasheet prints no meaning for the POR bit, so it reads 0); the DAC register powers up from the factory EEPROM default of 800h (mid-scale) and EEPROM contents are not retained across a power cycle"

[models.pins]
# Table 3-1 Pin Function Table p.13: SOT-23 pads 1..6.
"1" = "vout"
"2" = "vss"
"3" = "vdd"
"4" = "sda"
"5" = "scl"
"6" = "a0"

[models.ratings]
max_voltage_v = 6.5            # p.3 Absolute Maximum Ratings, VDD 6.5 V
max_pin_current_a = 0.025      # p.3 Absolute Maximum Ratings, current at output pins +-25 mA (input pins +-2 mA, supply pins +-50 mA are per-class and not expressible in one scalar)
max_junction_temp_c = 150.0    # p.3 Absolute Maximum Ratings, maximum junction temperature TJ +150 C
theta_ja_c_per_w = 190.5       # p.5 Thermal Package Resistances, thermal resistance 6L-SOT-23, typ

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.7
max_v = 5.5
abs_max_v = 6.5
basis = "Microchip MCP4725 DS22039D, p.3 Electrical Characteristics, operating voltage VDD 2.7 V to 5.5 V"
abs_max_basis = "Microchip MCP4725 DS22039D, p.3 Absolute Maximum Ratings, VDD 6.5 V"

# SCHEMA GAP: all inputs and outputs are limited to -0.3 V to VDD + 0.3 V (p.3 Absolute Maximum Ratings),
# a supply-relative limit; input_tolerance takes only a fixed max_v, so no input envelope row is written.

# p.27 Section 7.2 Device Addressing: device code 1100, then A2 A1 (hard-wired at the factory, option A0 = 00) and A0 from the A0 pin
# ("the logic state of the A0 pin is compared with the A0 address bit received", tied to VSS = 0, VDD = 1).
[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "MCP4725 DAC"
bus = "i2c"
i2c_address = 0x60
channels = 1

# Table 3-1 Pin Function Table p.13, the same pad map as [models.pins].
[sensor.pins]
1 = "vout"
2 = "vss"
3 = "vdd"
4 = "sda"
5 = "scl"
6 = "a0"

[[sensor.address_select]]
address = 0x60
straps = { a0 = "low" }
[[sensor.address_select]]
address = 0x61
straps = { a0 = "high" }

# VDD is the DAC reference (Section 5.3: "The MCP4725 device uses the VDD as its voltage reference").
# Not bound to the board rail: a harness-driven value, defaulting to an assumed 3.3 V.
[[sensor.input]]
name = "vdd"
default = 3.3

# DAC register (Table 5-4) and EEPROM (Table 5-3). Factory EEPROM default: PD1 PD0 = 00, D11 = 1,
# all other bits 0 (800h, mid-scale); the device loads it into the DAC register at reset (Section 5.4).
[[sensor.state]]
name = "code"
default = 2048.0
[[sensor.state]]
name = "pd"
default = 0.0
[[sensor.state]]
name = "ecode"
default = 2048.0
[[sensor.state]]
name = "epd"
default = 0.0

# Fast mode write (Figure 6-1, p.24): [0 0 PD1 PD0 D11..D8][D7..D0], C2 C1 = 00, repeating pairs.
[[sensor.write_command]]
name = "fast_write"
match_mask = 0xC0
match_value = 0x00
group_bytes = 2
[[sensor.write_command.field]]
name = "pd_bits"
bits = [13, 12]
[[sensor.write_command.field]]
name = "code_bits"
bits = [11, 0]
[sensor.write_command.update]
