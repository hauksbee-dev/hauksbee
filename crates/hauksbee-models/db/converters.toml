expr = "max(-2048.0, min(2047.0, round(if(mux == 4.0, a0, if(mux == 5.0, a1, if(mux == 6.0, a2, if(mux == 7.0, a3, if(mux == 0.0, a0 - a1, if(mux == 1.0, a0 - a3, if(mux == 2.0, a1 - a3, a2 - a3))))))) * 2048 / if(pga == 0.0, 6.144, if(pga == 1.0, 4.096, if(pga == 2.0, 2.048, if(pga == 3.0, 1.024, if(pga == 4.0, 0.512, 0.256)))))))) * 16"

