# Table 7-2 (p.16): ADDR to GND 1001000b, VDD 1001001b, SDA 1001010b, SCL 1001011b.
# "The state of address pin ADDR is sampled continuously." A strap the binder cannot read as
# one of the four (floating, or on another net) binds the spec default 0x48 marked assumed.
[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "ADS1015 registers"
bus = "i2c"
i2c_address = 0x48

# Table 5-1 Pin Functions p.3, the same pad map as [models.pins].
[sensor.pins]
1 = "addr"
2 = "alert_rdy"
3 = "gnd"
4 = "ain0"
5 = "ain1"
6 = "ain2"
7 = "ain3"
8 = "vdd"
9 = "sda"
10 = "scl"

[[sensor.address_select]]
address = 0x48
straps = { addr = "low" }
[[sensor.address_select]]
address = 0x49
straps = { addr = "high" }
[[sensor.address_select]]
address = 0x4A
straps = { addr = "sda" }
[[sensor.address_select]]
address = 0x4B
straps = { addr = "scl" }

# Volts at AIN0..AIN3, driven by the harness (not bound to net voltages).
[[sensor.input]]
name = "a0"
default = 0.0
[[sensor.input]]
name = "a1"
default = 0.0
[[sensor.input]]
name = "a2"
default = 0.0
[[sensor.input]]
name = "a3"
default = 0.0

# Config register (P[1:0] = 01b), reset 8583h = 34179: OS = 1, MUX = 000, PGA = 010
# (+-2.048 V), MODE = 1, DR = 100, COMP_QUE = 11. MUX[14:12] and PGA[11:9] steer the
# conversion register below.
[[sensor.write_register]]
addr = 0x01
encoding = "u16_be"
store = "config"
default = 34179.0
[[sensor.write_register.field]]
name = "mux"
bits = [14, 12]
[[sensor.write_register.field]]
name = "pga"
bits = [11, 9]

# Lo_thresh (P[1:0] = 10b) reset 8000h; Hi_thresh (P[1:0] = 11b) reset 7FFFh.
[[sensor.write_register]]
addr = 0x02
encoding = "i16_be"
store = "lo_thresh"
default = -32768.0
[[sensor.write_register]]
addr = 0x03
encoding = "i16_be"
store = "hi_thresh"
default = 32767.0

# Conversion register (P[1:0] = 00b): 12-bit two's-complement result left-justified (Section 7.5.4, Table 7-3 and Table 8-3: D[11:0] in bits 15:4, bits 3:0 always read 0, +FS = 7FFh, -FS = 800h).
[[sensor.register]]
addr = 0x00
encoding = "i16_be"
expr = "max(-2048.0, min(2047.0, round(if(mux == 4.0, a0, if(mux == 5.0, a1, if(mux == 6.0, a2, if(mux == 7.0, a3, if(mux == 0.0, a0 - a1, if(mux == 1.0, a0 - a3, if(mux == 2.0, a1 - a3, a2 - a3))))))) * 2048 / if(pga == 0.0, 6.144, if(pga == 1.0, 4.096, if(pga == 2.0, 2.048, if(pga == 3.0, 1.024, if(pga == 4.0, 0.512, 0.256)))))))) * 16"

[[sensor.register]]
addr = 0x01
encoding = "u16_be"
expr = "config"
[[sensor.register]]
addr = 0x02
encoding = "i16_be"
expr = "lo_thresh"
[[sensor.register]]
addr = 0x03
encoding = "i16_be"
expr = "hi_thresh"

[sensor.protocol]
style = "i2c_pointer"
'''

