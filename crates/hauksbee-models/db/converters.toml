# Official built-in part library: converters.
#
# Cards here are written from vendor datasheets only (every value carries a basis and a source).
# See target/launch/official-parts-20261022/ranking.md for the batch plan.

[[models]]
id = "ads1115_rug"
kind = "digital"
description = "TI ADS1115 16-bit 4-channel I2C delta-sigma ADC with PGA and comparator (strapped I2C register map: config, thresholds, mux/PGA-steered conversion; pad map and supply draw) in X2QFN-10 (RUG)"
variant_of = "ads1115"

[models.match]
# Family match: a bare ADS1115 (or an "ADC_" library category prefix) names the same die.
# The ADS1113 and ADS1114 (no AIN2/AIN3, NC pins) are different parts with their own pin table
# and are excluded by the anchored number. This member's orderable code: ADS1115IRUGR, ADS1115IRUGT or ADS1115IRUGTG4.
value_re = "(?i)^(ADC_)?ADS1115"

[models.variant]
orderable_re = "(?i)^(ADC_)?ADS1115I?RUG"
orderable = ["ADS1115IRUGR", "ADS1115IRUGT", "ADS1115IRUGTG4"]
package = "X2QFN-10 (RUG)"
basis = "TI ADS1115 SBAS444E, Package Information p.1 and the Package Option Addendum: RUG is X2QFN-10 (RUG)"

[models.params]
vol = { typ = 0.15, max = 0.4, unit = "V", conditions = "IOL = 3 mA, VDD = 3.3 V", basis = "5.5 Electrical Characteristics p.5, VOL 0.15 V typ, 0.4 V max at IOL = 3 mA (open-drain ALERT/RDY and SDA)" }
vih = { min = 2.31, unit = "V", conditions = "VDD = 3.3 V, the Electrical Characteristics test supply", basis = "DERIVED 0.7 x 3.3 V: 5.5 Electrical Characteristics p.5, VIH 0.7 VDD min (5.5 V max), SDA, SCL, ADDR" }
vil = { max = 0.99, unit = "V", conditions = "VDD = 3.3 V, the Electrical Characteristics test supply", basis = "DERIVED 0.3 x 3.3 V: 5.5 Electrical Characteristics p.5, VIL GND min, 0.3 VDD max, SDA, SCL, ADDR" }
supply_static_ua = 150.0   # 5.5 Electrical Characteristics p.6, IVDD operating typ, VDD = 3.3 V (200 max at 25 C, 300 max over temperature)
supply_pin = "8"           # VDD
gnd_pin = "3"              # GND
warning = "configuration, threshold and conversion registers are executable (16-bit result, code = Vin x 32768 / FSR clipped at 7FFFh / 8000h); the data registers (config, Lo_thresh, Hi_thresh, conversion) are executable, but nothing times a conversion: the conversion register always shows the currently driven AINx inputs as if the converter were infinitely fast, the data-rate bits DR[7:5], MODE, the OS handshake and the comparator are stored but not acted on, and ALERT/RDY is never driven. The analog inputs are harness values, not net voltages, and the offset, gain and noise errors are taken as zero"

[models.i2c]
address = 0x48
basis = "TI ADS1115 SBAS444E (Dec 2024) PDF p.20 section 7.5.1.1 Table 7-2: ADDR to GND 1001000b, VDD 1001001b, SDA 1001010b, SCL 1001011b"
[[models.i2c.select]]
address = 0x48
straps = { addr = "low" }
[[models.i2c.select]]
address = 0x49
straps = { addr = "high" }
[[models.i2c.select]]
address = 0x4A
straps = { addr = "sda" }
[[models.i2c.select]]
address = 0x4B
straps = { addr = "scl" }

[models.pins]
# Table 4-1 Pin Functions p.3: RUG, DYN and DGS share one numbering for the ADS1115 column.
# SDA and SCL are named in the bus vocabulary.
"1" = "addr"
"2" = "alert_rdy"
"3" = "gnd"
"4" = "ain0"
"5" = "ain1"
"6" = "ain2"
"7" = "ain3"
"8" = "vdd"
"9" = "sda"
"10" = "scl"

# Open-drain pad(s) for the open-drain pull-up check. Source: TI ADS1113/ADS1114/ADS1115 SBAS444E (May 2009, rev. Dec 2024), https://www.ti.com/lit/ds/symlink/ads1115.pdf, sha256 eefff4d412ce2dcd7e659f47238edc9b2fa02e5971f2625af730502033701834.
[models.pin_capability.open_drain]
basis = "TI ADS1115 SBAS444E Rev. E PDF p.3 Table 4-1 Pin Functions: ALERT/RDY (Digital output): \"Open-drain output. Connect to VDD using a pullup resistor.\""
[models.pin_capability.open_drain.pads]
"2" = "ALERT/RDY"

[models.ratings]
max_voltage_v = 7.0            # 5.1 Absolute Maximum Ratings p.4, VDD to GND -0.3 V to 7 V
max_pin_current_a = 0.01       # 5.1 p.4, continuous input current, any pin except the supply pins, +-10 mA
max_junction_temp_c = 150.0    # 5.1 p.4, junction temperature TJ max
theta_ja_c_per_w = 245.2       # 5.4 Thermal Information p.4, RθJA RUG

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.0
max_v = 5.5
abs_max_v = 7.0
basis = "TI ADS1115 SBAS444E, 5.3 Recommended Operating Conditions p.4, power supply VDD to GND 2 V to 5.5 V; 5.1 Absolute Maximum Ratings p.4, VDD to GND 7 V"

[[models.envelope]]
kind = "input_tolerance"
pins = ["sda", "scl", "addr", "alert_rdy"]
max_v = 5.5
abs_max_v = 5.5
basis = "TI ADS1115 SBAS444E, 5.3 Recommended Operating Conditions p.4, digital input voltage VDIG GND to 5.5 V"
abs_max_basis = "TI ADS1115 SBAS444E, 5.1 Absolute Maximum Ratings p.4, digital input voltage SDA, SCL, ADDR, ALERT/RDY GND - 0.3 V to 5.5 V"

# Table 7-2 (p.20): ADDR to GND 1001000b, VDD 1001001b, SDA 1001010b, SCL 1001011b.
# "The state of address pin ADDR is sampled continuously." A strap the binder cannot read as
# one of the four (floating, or on another net) binds the spec default 0x48 marked assumed.
[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "ADS1115 registers"
bus = "i2c"
i2c_address = 0x48

# Table 4-1 Pin Functions p.3, the same pad map as [models.pins].
[sensor.pins]
1 = "addr"
2 = "alert_rdy"
3 = "gnd"
4 = "ain0"
5 = "ain1"
6 = "ain2"
7 = "ain3"
8 = "vdd"
9 = "sda"
10 = "scl"

[[sensor.address_select]]
address = 0x48
straps = { addr = "low" }
[[sensor.address_select]]
address = 0x49
straps = { addr = "high" }
[[sensor.address_select]]
address = 0x4A
straps = { addr = "sda" }
[[sensor.address_select]]
address = 0x4B
straps = { addr = "scl" }

# Volts at AIN0..AIN3, driven by the harness (not bound to net voltages).
[[sensor.input]]
name = "a0"
default = 0.0
[[sensor.input]]
name = "a1"
default = 0.0
[[sensor.input]]
name = "a2"
default = 0.0
[[sensor.input]]
name = "a3"
default = 0.0

# Config register (P[1:0] = 01b), reset 8583h = 34179: OS = 1, MUX = 000, PGA = 010
# (+-2.048 V), MODE = 1, DR = 100, COMP_QUE = 11. MUX[14:12] and PGA[11:9] steer the
# conversion register below.
[[sensor.write_register]]
addr = 0x01
encoding = "u16_be"
store = "config"
default = 34179.0
[[sensor.write_register.field]]
name = "mux"
bits = [14, 12]
[[sensor.write_register.field]]
name = "pga"
bits = [11, 9]

# Lo_thresh (P[1:0] = 10b) reset 8000h; Hi_thresh (P[1:0] = 11b) reset 7FFFh.
[[sensor.write_register]]
addr = 0x02
encoding = "i16_be"
store = "lo_thresh"
default = -32768.0
[[sensor.write_register]]
addr = 0x03
encoding = "i16_be"
store = "hi_thresh"
default = 32767.0

# Conversion register (P[1:0] = 00b): Vin x 32768 / FSR (Section 7.5.4: LSB = FSR / 2^15, +FS = 7FFFh, -FS = 8000h; the i16_be encoding clips at those codes).
[[sensor.register]]
addr = 0x00
encoding = "i16_be"
expr = "if(mux == 4.0, a0, if(mux == 5.0, a1, if(mux == 6.0, a2, if(mux == 7.0, a3, if(mux == 0.0, a0 - a1, if(mux == 1.0, a0 - a3, if(mux == 2.0, a1 - a3, a2 - a3))))))) * 32768 / if(pga == 0.0, 6.144, if(pga == 1.0, 4.096, if(pga == 2.0, 2.048, if(pga == 3.0, 1.024, if(pga == 4.0, 0.512, 0.256)))))"

[[sensor.register]]
addr = 0x01
encoding = "u16_be"
expr = "config"
[[sensor.register]]
addr = 0x02
encoding = "i16_be"
expr = "lo_thresh"
[[sensor.register]]
addr = 0x03
encoding = "i16_be"
expr = "hi_thresh"

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 2.0     # 5.3 Recommended Operating Conditions, VDD min (no POR voltage is published)
idle_a = 0.00015               # 5.5 p.6, IVDD operating typ, continuous-conversion
read_a = 0.00015
write_a = 0.00015
low_power_a = 0.0000005        # 5.5 p.6, IVDD power-down typ at 25 C (2 uA max)

[models.coverage]
implements = ["pin_roles", "output_low_level", "ratiometric_input_levels_at_3v3", "operating_supply_current", "absolute_ratings", "supply_ranges", "digital_input_tolerance", "thermal_resistance", "i2c_address_strap", "four_level_address_pin", "register_map", "config_register_write_readback", "threshold_register_write_readback", "mux_and_pga_steered_conversion_register", "full_scale_clipping", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["conversion_timing_and_data_rate", "single_shot_os_bit_handshake", "comparator_and_alert_rdy_pin", "general_call_reset", "continuous_vs_single_shot_mode", "analog_input_net_sampling", "analog_input_vdd_plus_0v3_limit", "input_impedance_loading", "offset_gain_and_noise_errors", "power_down_state_current_gating"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/ads1115.pdf"
title = "Texas Instruments ADS1113, ADS1114, ADS1115 Ultra-Small, Low-Power, I2C-Compatible, 860SPS, 16-Bit ADCs With Internal Reference, Oscillator, and Programmable Comparator, SBAS444E, May 2009, revised December 2024"
locator = "Table 4-1 Pin Functions p.3; 5.1 Absolute Maximum Ratings p.4; 5.3 Recommended Operating Conditions p.4; 5.4 Thermal Information p.4; 5.5 Electrical Characteristics pp.5-6; 5.6 Timing Requirements p.6; Table 7-1 Full-Scale Range p.15; 7.5.1.1 Table 7-2 ADDR pin p.20; 7.5.4 Data Format p.23; 8.1.2 Conversion Register p.24; 8.1.3 Config Register p.25 and Table 8-3"
sha256 = "eefff4d412ce2dcd7e659f47238edc9b2fa02e5971f2625af730502033701834"

[[models.source.pinout]]
package = "X2QFN-10 (RUG)"
pins = { "1" = "ADDR", "2" = "ALERT/RDY", "3" = "GND", "4" = "AIN0", "5" = "AIN1", "6" = "AIN2", "7" = "AIN3", "8" = "VDD", "9" = "SDA", "10" = "SCL" }

[[models.source.characteristic]]
parameter = "VIH high-level input voltage, upper limit"
max = 5.5
unit = "V"
conditions = "SDA, SCL, ADDR; the lower limit is 0.7 VDD (a supply-relative limit); VIL is GND to 0.3 VDD"
basis = "5.5 Electrical Characteristics p.5, DIGITAL INPUT/OUTPUT, VIH 0.7 VDD min, 5.5 V max"

[[models.source.characteristic]]
parameter = "VOL low-level output voltage"
typ = 0.15
max = 0.4
unit = "V"
conditions = "IOL = 3 mA, VDD = 3.3 V"
basis = "5.5 Electrical Characteristics p.5, VOL"

[[models.source.characteristic]]
parameter = "Input leakage current"
min = -10.0
max = 10.0
unit = "uA"
conditions = "GND < VDIG < VDD"
basis = "5.5 Electrical Characteristics p.5, digital input leakage"

[[models.source.characteristic]]
parameter = "IVDD supply current, power-down"
typ = 0.5
max = 2.0
unit = "uA"
conditions = "TA = 25 C, VDD = 3.3 V (5 uA max over -40 to 125 C)"
basis = "5.5 Electrical Characteristics p.6, POWER-SUPPLY, IVDD power-down"

[[models.source.characteristic]]
parameter = "IVDD supply current, operating"
typ = 150.0
max = 200.0
unit = "uA"
conditions = "TA = 25 C, VDD = 3.3 V (300 uA max over -40 to 125 C)"
basis = "5.5 Electrical Characteristics p.6, POWER-SUPPLY, IVDD operating"

[[models.source.characteristic]]
parameter = "fSCL SCL clock frequency, fast mode"
min = 0.01
max = 0.4
unit = "MHz"
conditions = "VDD = 2.0 V to 5.5 V, I2C fast mode (high-speed mode 0.01 to 3.4 MHz)"
basis = "5.6 Timing Requirements: I2C, fSCL"

[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient thermal resistance"
rating = "theta_ja_c_per_w"
typ = 245.2
unit = "°C/W"
conditions = "RUG 10 pins"
package = "X2QFN-10 (RUG)"
basis = "5.4 Thermal Information p.4, RθJA RUG"

