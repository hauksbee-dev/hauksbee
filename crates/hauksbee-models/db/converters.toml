[[models]]
id = "ads1115_dgs"
kind = "digital"
description = "TI ADS1115 16-bit 4-channel I2C delta-sigma ADC with PGA and comparator (strapped I2C register map: config, thresholds, mux/PGA-steered conversion; pad map and supply draw) in VSSOP-10 (DGS)"
variant_of = "ads1115"

[models.match]
# Family match: a bare ADS1115 (or an "ADC_" library category prefix) names the same die.
# The ADS1113 and ADS1114 (no AIN2/AIN3, NC pins) are different parts with their own pin table
# and are excluded by the anchored number. This member's orderable code: ADS1115IDGSR or ADS1115IDGST.
value_re = "(?i)^(ADC_)?ADS1115"

[models.variant]
orderable_re = "(?i)^(ADC_)?ADS1115I?DGS"
orderable = ["ADS1115IDGSR", "ADS1115IDGST"]
package = "VSSOP-10 (DGS)"
basis = "TI ADS1115 SBAS444E, Package Information p.1 and the Package Option Addendum: DGS is VSSOP-10 (DGS)"

[models.params]
vol = { typ = 0.15, max = 0.4, unit = "V", conditions = "IOL = 3 mA, VDD = 3.3 V", basis = "5.5 Electrical Characteristics p.5, VOL 0.15 V typ, 0.4 V max at IOL = 3 mA (open-drain ALERT/RDY and SDA)" }
vih = { min = 2.31, unit = "V", conditions = "VDD = 3.3 V, the Electrical Characteristics test supply", basis = "DERIVED 0.7 x 3.3 V: 5.5 Electrical Characteristics p.5, VIH 0.7 VDD min (5.5 V max), SDA, SCL, ADDR" }
vil = { max = 0.99, unit = "V", conditions = "VDD = 3.3 V, the Electrical Characteristics test supply", basis = "DERIVED 0.3 x 3.3 V: 5.5 Electrical Characteristics p.5, VIL GND min, 0.3 VDD max, SDA, SCL, ADDR" }
supply_static_ua = 150.0   # 5.5 Electrical Characteristics p.6, IVDD operating typ, VDD = 3.3 V (200 max at 25 C, 300 max over temperature)
supply_pin = "8"           # VDD
gnd_pin = "3"              # GND
warning = "configuration, threshold and conversion registers are executable (16-bit result, code = Vin x 32768 / FSR clipped at 7FFFh / 8000h); the data registers (config, Lo_thresh, Hi_thresh, conversion) are executable, but nothing times a conversion: the conversion register always shows the currently driven AINx inputs as if the converter were infinitely fast, the data-rate bits DR[7:5], MODE, the OS handshake and the comparator are stored but not acted on, and ALERT/RDY is never driven. The analog inputs are harness values, not net voltages, and the offset, gain and noise errors are taken as zero"

[models.i2c]
address = 0x48
basis = "TI ADS1115 SBAS444E (Dec 2024) PDF p.20 section 7.5.1.1 Table 7-2: ADDR to GND 1001000b, VDD 1001001b, SDA 1001010b, SCL 1001011b"
[[models.i2c.select]]
address = 0x48
straps = { addr = "low" }
[[models.i2c.select]]
address = 0x49
straps = { addr = "high" }
[[models.i2c.select]]
address = 0x4A
straps = { addr = "sda" }
[[models.i2c.select]]
address = 0x4B
straps = { addr = "scl" }

[models.pins]
# Table 4-1 Pin Functions p.3: RUG, DYN and DGS share one numbering for the ADS1115 column.
# SDA and SCL are named in the bus vocabulary.
"1" = "addr"
"2" = "alert_rdy"
"3" = "gnd"
"4" = "ain0"
"5" = "ain1"
"6" = "ain2"
"7" = "ain3"
"8" = "vdd"
"9" = "sda"
"10" = "scl"

# Open-drain pad(s) for the open-drain pull-up check. Source: TI ADS1113/ADS1114/ADS1115 SBAS444E (May 2009, rev. Dec 2024), https://www.ti.com/lit/ds/symlink/ads1115.pdf, sha256 eefff4d412ce2dcd7e659f47238edc9b2fa02e5971f2625af730502033701834.
