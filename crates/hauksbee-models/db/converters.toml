[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.0
max_v = 5.5
abs_max_v = 7.0
basis = "TI ADS1115 SBAS444E, 5.3 Recommended Operating Conditions p.4, power supply VDD to GND 2 V to 5.5 V; 5.1 Absolute Maximum Ratings p.4, VDD to GND 7 V"

[[models.envelope]]
kind = "input_tolerance"
pins = ["sda", "scl", "addr", "alert_rdy"]
max_v = 5.5
abs_max_v = 5.5
basis = "TI ADS1115 SBAS444E, 5.3 Recommended Operating Conditions p.4, digital input voltage VDIG GND to 5.5 V"
abs_max_basis = "TI ADS1115 SBAS444E, 5.1 Absolute Maximum Ratings p.4, digital input voltage SDA, SCL, ADDR, ALERT/RDY GND - 0.3 V to 5.5 V"

# Table 7-2 (p.20): ADDR to GND 1001000b, VDD 1001001b, SDA 1001010b, SCL 1001011b.
# "The state of address pin ADDR is sampled continuously." A strap the binder cannot read as
# one of the four (floating, or on another net) binds the spec default 0x48 marked assumed.
[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "ADS1115 registers"
bus = "i2c"
i2c_address = 0x48

# Table 4-1 Pin Functions p.3, the same pad map as [models.pins].
[sensor.pins]
1 = "addr"
2 = "alert_rdy"
3 = "gnd"
4 = "ain0"
5 = "ain1"
6 = "ain2"
7 = "ain3"
8 = "vdd"
9 = "sda"
10 = "scl"

[[sensor.address_select]]
address = 0x48
straps = { addr = "low" }
[[sensor.address_select]]
address = 0x49
straps = { addr = "high" }
[[sensor.address_select]]
address = 0x4A
straps = { addr = "sda" }
[[sensor.address_select]]
address = 0x4B
straps = { addr = "scl" }

# Volts at AIN0..AIN3, driven by the harness (not bound to net voltages).
[[sensor.input]]
name = "a0"
default = 0.0
[[sensor.input]]
name = "a1"
default = 0.0
[[sensor.input]]
name = "a2"
default = 0.0
[[sensor.input]]
name = "a3"
default = 0.0

# Config register (P[1:0] = 01b), reset 8583h = 34179: OS = 1, MUX = 000, PGA = 010
# (+-2.048 V), MODE = 1, DR = 100, COMP_QUE = 11. MUX[14:12] and PGA[11:9] steer the
# conversion register below.
[[sensor.write_register]]
addr = 0x01
encoding = "u16_be"
store = "config"
default = 34179.0
[[sensor.write_register.field]]
name = "mux"
bits = [14, 12]
[[sensor.write_register.field]]
name = "pga"
bits = [11, 9]

# Lo_thresh (P[1:0] = 10b) reset 8000h; Hi_thresh (P[1:0] = 11b) reset 7FFFh.
[[sensor.write_register]]
addr = 0x02
encoding = "i16_be"
store = "lo_thresh"
default = -32768.0
[[sensor.write_register]]
addr = 0x03
encoding = "i16_be"
store = "hi_thresh"
default = 32767.0

# Conversion register (P[1:0] = 00b): Vin x 32768 / FSR (Section 7.5.4: LSB = FSR / 2^15, +FS = 7FFFh, -FS = 8000h; the i16_be encoding clips at those codes).
[[sensor.register]]
addr = 0x00
encoding = "i16_be"
expr = "if(mux == 4.0, a0, if(mux == 5.0, a1, if(mux == 6.0, a2, if(mux == 7.0, a3, if(mux == 0.0, a0 - a1, if(mux == 1.0, a0 - a3, if(mux == 2.0, a1 - a3, a2 - a3))))))) * 32768 / if(pga == 0.0, 6.144, if(pga == 1.0, 4.096, if(pga == 2.0, 2.048, if(pga == 3.0, 1.024, if(pga == 4.0, 0.512, 0.256)))))"

[[sensor.register]]
addr = 0x01
encoding = "u16_be"
expr = "config"
[[sensor.register]]
addr = 0x02
encoding = "i16_be"
expr = "lo_thresh"
[[sensor.register]]
addr = 0x03
encoding = "i16_be"
expr = "hi_thresh"

[sensor.protocol]
style = "i2c_pointer"
'''

