# Official built-in part library: interface_io.
#
# Cards here are written from vendor datasheets only (every value carries a basis and a source).
# See target/launch/official-parts-20261022/ranking.md for the batch plan.

# ═════════════════════════════════════════════════════════════════════════
# TI TXS0102: one card per package, because RthetaJA is printed per package and the
# DCT/DCU/DTT, DQE/DQM and YZP pin maps differ. Source: TI TXS0102 SCES640L (January 2026),
# Table 4-1 Pin Functions, 5.1, 5.3, 5.4, 5.5, 7.3.1, 7.3.4, 7.3.5; orderable codes from
# the Package Option Addendum. No bare TXS0102 value resolves: it names no package.
# ═════════════════════════════════════════════════════════════════════════

# ── TXS0102 SSOP-8 (DCT) ────────────────────────────────────────
[[models]]
id = "txs0102_dct"
kind = "digital"
description = "TI TXS0102 2-bit auto-direction bidirectional level translator for open-drain and push-pull signals, pass gate with 10 kOhm pull-ups and one-shot edge accelerators, SSOP-8 (DCT)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/txs0102.pdf"
title = "Texas Instruments TXS0102 2-Bit Bidirectional Voltage-Level Translator for Open-Drain and Push-Pull Applications, SCES640L, Rev. L (January 2026)"
locator = "Table 4-1 Pin Functions; 5.1 Absolute Maximum Ratings; 5.3 Recommended Operating Conditions; 5.4 Thermal Information; 5.5 Electrical Characteristics; 7.3.1 Architecture; 7.3.5 Pullup or Pulldown Resistors on I/O Lines"
sha256 = "75397ef71b07af6e47b81441a502a224c59b6ac359083d71516465f0c885eaf7"
[[models.source.uncertainty]]
status = "unknown"
parameter = "translation_timing"
reason = "the one-shot edge accelerators (about 30 ns), propagation delay, data rate, enable and disable times, Ioff, power-up transients, the 10 kOhm pull-up being disabled while OE is low, and the separate VCCB supply current are not modelled; only the DC pull-up drive, OE, the port-referenced input and output levels and the VCC isolation are"
[[models.source.uncertainty]]
status = "assumed"
parameter = "io_port_input_thresholds"
reason = "a card carries one input-threshold table per rail, so the table is the OE input band (0.65 x VCCA high, 0.35 x VCCA low); the A and B port I/O inputs print tighter bands (VIH = VCCI - 0.4 V or VCCI - 0.2 V, VIL = 0.15 V max) that the format cannot hold beside it"

[models.match]
# SSOP-8 (DCT) ordering codes only; a bare part number names no package, and the packages number their pads differently.
value_re = "(?i)^TXS0102DCT([RT](E4|G4)?)?(\\.[AB])?$"

[models.params]
voh = 2.211   # derived: 0.67 x VCC at VCC = 3.3 V; 5.5 Electrical Characteristics VOHA/VOHB min VCC x 0.67, IOH = -20 uA, TA = -40 C to 85 C
vol = 0.4          # IOL = 1 mA, VOL max over -40 C to 85 C, Section 5.5 Electrical Characteristics
vih = 2.145        # derived: 0.65 x VCCA at VCCA = 3.3 V, OE input, Recommended Operating Conditions
vil = 1.155        # derived: 0.35 x VCCA at VCCA = 3.3 V, OE input, Recommended Operating Conditions
ro = 10000.0       # internal 10 kOhm pull-up to the port's VCC, the DC source impedance (Feature Description, Pullup or Pulldown Resistors on I/O Lines); no tolerance printed
ro_strong = 10000.0  # same resistor: the datasheet prints no separate strong corner
supply_static_ua = 2.4   # ICCA max, VCCA 1.65 V to VCCB, VCCB 2.3 V to 5.5 V, VI = VO = open, IO = 0, 5.5 Electrical Characteristics ICCA; ICCB (12 uA max) is not stamped
supply_pin = "3"   # VCCA
gnd_pin = "2"

[models.levels]
# OE input band: Recommended Operating Conditions, OE VIH min = VCCA x 0.65, VIL max = VCCA x 0.35 (derived at the 1.65 V and 5.5 V ends; the OE pin is read at VCCA <= 3.6 V).
vih = [[1.65, 1.0725], [3.6, 2.34]]
vil = [[1.65, 0.5775], [3.6, 1.26]]
# VOH min = 0.67 x VCCO at IOH = -20 uA (5.5 Electrical Characteristics VOHA/VOHB min VCC x 0.67, IOH = -20 uA, TA = -40 C to 85 C), derived at 1.65 V and 5.5 V.
voh = [[1.65, 1.1055], [5.5, 3.685]]

[models.level_rails]
vcca = ["a1", "a2", "oe"]
vccb = ["b1", "b2"]

[models.pins]
# Table 4-1 Pin Functions; DCT, DCU, DTT column
"1" = "b2"
"2" = "gnd"
"3" = "vcca"
"4" = "a2"
"5" = "a1"
"6" = "oe"
"7" = "vccb"
"8" = "b1"

[models.ratings]
max_pin_current_a = 0.05       # IO continuous output current +-50 mA, Absolute Maximum Ratings
max_voltage_v = 6.5            # VCCB and B-port VI, Absolute Maximum Ratings (VCCA and the A port are 4.6 V)
max_junction_temp_c = 150.0    # Operating junction temperature TJ, Absolute Maximum Ratings
theta_ja_c_per_w = 168.5   # RthetaJA, SSOP-8 (DCT), Thermal Information
theta_jc_c_per_w = 84.6   # RthetaJC(top), SSOP-8 (DCT), Thermal Information

[[models.envelope]]
kind = "supply_range"
pin = "vcca"
min_v = 1.65
max_v = 3.6
abs_max_v = 4.6
basis = "TI TXS0102 SCES640L, Recommended Operating Conditions VCCA 1.65 V to 3.6 V; Absolute Maximum Ratings VCCA -0.5 V to 4.6 V"

[[models.envelope]]
kind = "supply_range"
pin = "vccb"
min_v = 2.3
max_v = 5.5
abs_max_v = 6.5
basis = "TI TXS0102 SCES640L, Recommended Operating Conditions VCCB 2.3 V to 5.5 V; Absolute Maximum Ratings VCCB -0.5 V to 6.5 V"

[[models.envelope]]
kind = "rail_order"
lower = "vcca"
upper = "vccb"
basis = "TI TXS0102 SCES640L, Recommended Operating Conditions note: VCCA must be less than or equal to VCCB and must not exceed 3.6 V"

[models.logic]
inputs = ["oe", "a1_in", "b1_in", "a2_in", "b2_in"]
outputs = ["a1", "a2", "b1", "b2"]
[models.logic.sense]
a1_in = "a1"
b1_in = "b1"
a2_in = "a2"
b2_in = "b2"
[models.logic.comb]
a1 = "b1_in"
a2 = "b2_in"
b1 = "a1_in"
b2 = "a2_in"
[models.logic.tristate]
"a1..a2" = { enable = "oe", active = "high" }
"b1..b2" = { enable = "oe", active = "high" }

[models.coverage]
implements = ["auto_direction", "pull_up_dc_drive", "tristate_enable", "dual_supply_levels", "vcc_isolation", "absolute_ratings", "supply_ranges", "pin_roles"]
missing = ["one_shot_edge_acceleration", "propagation_timing", "ioff_leakage", "io_port_input_thresholds", "open_drain_low_side_drive", "vccb_supply_current", "pull_up_disable_with_oe_low"]

