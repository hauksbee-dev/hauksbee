# notes: 7.3.1 says later bytes are ignored but Figure 7-3 shows data 2 written).
[[sensor.write_command]]
name = "port_write"
match_mask = 0
match_value = 0
prefix = false
group_bytes = 1
[[sensor.write_command.field]]
name = "d0"
bits = [0, 0]
[[sensor.write_command.field]]
name = "d1"
bits = [1, 1]
[[sensor.write_command.field]]
name = "d2"
bits = [2, 2]
[[sensor.write_command.field]]
name = "d3"
bits = [3, 3]
[[sensor.write_command.field]]
name = "d4"
bits = [4, 4]
[[sensor.write_command.field]]
name = "d5"
bits = [5, 5]
[[sensor.write_command.field]]
name = "d6"
bits = [6, 6]
[[sensor.write_command.field]]
name = "d7"
bits = [7, 7]
[sensor.write_command.update]
p0 = "d0"
p1 = "d1"
p2 = "d2"
p3 = "d3"
p4 = "d4"
p5 = "d5"
p6 = "d6"
p7 = "d7"

