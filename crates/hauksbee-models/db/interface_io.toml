# Bare part numbers are ambiguous across packages, so a card needs BOTH value_re and footprint_re (AND semantics): the footprint picks the pin map, the value_re keeps MCP23S08 and the 16-bit parts out. Ordering codes per Product Identification System p.41: MCP23008[T]-E/<pkg>; T = tape and reel, E = -40 C to +125 C. An underscore spelling (MCP23008_SO) is accepted for library symbol names; that spelling is not in the datasheet. Suffix code ML only. The QFN exposed pad has no pin number in Table 1-1 and is left out of the pin map.
