# ═════════════════════════════════════════════════════════════════════════
# SN74LVC245A octal bus transceiver, 3-state (TI SCAS218X, January 2015). The DB, DGV, DW, N, NS,
# PW and RGY packages share one 20-pin map; the GQN/ZQN ball map is separate. RthetaJA is printed
# per package, so each ordering code resolves to its own package card, and a bare family name
# resolves to a card with no theta_ja (the thermal monitor then derives one from the footprint).
# ═════════════════════════════════════════════════════════════════════════

[[models]]
id = "74lvc245a_family"
kind = "digital"
description = "74LVC245A octal bus transceiver, 3-state, 1.65 V to 3.6 V with 5 V tolerant inputs, 20-pin DB / DGV / DW / N / NS / PW / RGY pad map (family name without a package code)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/sn74lvc245a.pdf"
title = "Texas Instruments SN74LVC245A Octal Bus Transceiver With 3-State Outputs, SCAS218X, Rev. X (January 2015)"
locator = "6 Pin Configuration and Functions (Pin Functions table); 7.1 Absolute Maximum Ratings; 7.3 Recommended Operating Conditions; 7.4 Thermal Information; 7.5 Electrical Characteristics; 7.6 Switching Characteristics; 7.7 Operating Characteristics; 9.4 Table 1 Function Table"
sha256 = "ad3e705aef834214404d6e1e38cb00f95fdb6f0d9807a784a6f58c4d060f13a3"
[[models.source.uncertainty]]
status = "unknown"
parameter = "enable_disable_timing"
reason = "ten and tdis (OE to A or B), the output skew, the input and output leakage currents (II, Ioff, IOZ) and the delta-ICC supply increase are not modelled; only the DC function table, the supply-dependent input thresholds, the output levels, the propagation delay and the supply current are"
[[models.source.uncertainty]]
status = "assumed"
parameter = "vendor_family"
reason = "a bare 74LVC245 or 74LVC245A value (no SN prefix) names the same function from any vendor; this card carries the Texas Instruments SN74LVC245A numbers, and other vendors print their own limits"

[models.match]
# Bare family names only: 74LVC245, 74LVC245A, SN74LVC245A. The shared 20-pin map of DB, DGV, DW, N, NS, PW and RGY applies; the ball packages
# and the ordering-code cards are separate. Family value: the card carries the Texas Instruments SN74LVC245A numbers.
value_re = "(?i)^(SN)?74LVC245A?$"

[models.params]
voh = 3.1       # VCC - 0.2 V at IOH = -100 uA, VCC 3.3 V, TA = -40 C to 85 C (7.5)
vol = 0.2       # IOL = 100 uA, VCC 3.3 V, TA = -40 C to 85 C max (7.5)
vih = 2.0       # VCC = 2.7 V to 3.6 V (7.3)
vil = 0.8       # VCC = 2.7 V to 3.6 V (7.3)
# derived: VCC = 3 V, TA = -40 C to 85 C: light-load VOH 2.8 V (VCC - 0.2 V) against VOH min 2.2 V at IOH = -24 mA,
# (2.8 - 2.2) / 0.024 = 25 Ohm; the VOL side is 0.55 V / 24 mA = 22.9 Ohm.
ro = 25.0
tpd_s = 3.8e-9      # A to B or B to A, VCC 3.3 V +- 0.3 V, TA = 25 C typ (7.6)
supply_static_ua = 1.0   # ICC max at TA = 25 C, VCC 3.6 V, VI = VCC or GND, IO = 0 (7.5)
supply_cpd_pf = 45.0     # per transceiver, outputs enabled, VCC 3.3 V, f = 10 MHz (7.7)
supply_pin = "20"
gnd_pin = "10"

[models.levels]
# 7.3 Recommended Operating Conditions: VIH 0.65 x VCC (1.65 V to 1.95 V), 1.7 V (2.3 V to 2.7 V), 2 V (2.7 V to 3.6 V);
