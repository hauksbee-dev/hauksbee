voh = 2.6                 # basis: p.4 Table 1-1 D090, VOH min VDD - 0.7 V at IOH = -3.0 mA (VDD = 4.5 V) and -400 uA (VDD = 1.8 V); derived here at VDD = 3.3 V
vih = 2.64                # basis: p.4 Table 1-1 D041, 0.8 VDD min (Schmitt inputs), derived at VDD = 3.3 V; the A0-A2 TTL inputs differ (D040)
vil = 0.66                # basis: p.4 Table 1-1 D031, 0.2 VDD max (Schmitt inputs), derived at VDD = 3.3 V; the A0-A2 TTL inputs differ (D030)
supply_static_ua = 1.0    # basis: p.4 Table 1-1 D005, IDDS standby max 1 uA at -40 to +85 C (3 uA max at 4.5-5.5 V, +85 to +125 C); no typical printed
supply_pin = "9"      # basis: p.11 Table 2-1, VDD
gnd_pin = "10"         # basis: p.11 Table 2-1, VSS
iih_a = 0.000001        # basis: p.4 Table 1-1 D060, input leakage IIL +-1 uA, VSS <= VPIN <= VDD
must_not_float_roles = "reset_n,a0,a1,a2"   # basis: p.11 Table 2-1, A0/A1/A2/RESET "Must be externally biased"

