title = "NXP PCA9685 16-channel, 12-bit PWM Fm+ I2C-bus LED controller, Rev. 4, 16 April 2015"
locator = "4 Ordering information (Table 1, Table 2); 6 Pinning information (Table 3); 7.1.1 Regular I2C-bus slave address; 7.2 Control register; 7.3 Register definitions (Table 4 to Table 10); 7.4 Active LOW output enable input; 11 Limiting values (Table 13); 12 Static characteristics (Table 14)"
