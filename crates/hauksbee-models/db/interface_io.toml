[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "PCF8574 8-bit quasi-bidirectional I/O port"
bus = "i2c"
i2c_address = 0x20

[sensor.pins]
1 = "a0"
2 = "a1"
3 = "a2"
4 = "p0"
5 = "p1"
6 = "p2"
7 = "p3"
8 = "gnd"
9 = "p4"
10 = "p5"
11 = "p6"
12 = "p7"
13 = "int_n"
14 = "scl"
15 = "sda"
16 = "vcc"

# 7.3.2 Interface Definition: target address 0100 A2 A1 A0 R/W, so 0x20 to 0x27
[[sensor.address_select]]
address = 0x20
straps = { a2 = "low", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x21
straps = { a2 = "low", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x22
straps = { a2 = "low", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x23
straps = { a2 = "low", a1 = "high", a0 = "high" }
[[sensor.address_select]]
address = 0x24
straps = { a2 = "high", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x25
straps = { a2 = "high", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x26
straps = { a2 = "high", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x27
straps = { a2 = "high", a1 = "high", a0 = "high" }

# External level on each P pin (an unconnected quasi-bidirectional pin is held high by its pull-up current source)
[[sensor.input]]
name = "ext0"
default = 1.0

[[sensor.input]]
name = "ext1"
default = 1.0

[[sensor.input]]
name = "ext2"
default = 1.0

[[sensor.input]]
name = "ext3"
default = 1.0

[[sensor.input]]
name = "ext4"
default = 1.0

[[sensor.input]]
name = "ext5"
default = 1.0

[[sensor.input]]
name = "ext6"
default = 1.0

[[sensor.input]]
name = "ext7"
default = 1.0

# Output latch bit per port pin, all high at power on (7.1 Overview, 'The I/Os should be high before being used as inputs')
[[sensor.state]]
name = "p0"
default = 1.0

[[sensor.state]]
name = "p1"
default = 1.0

[[sensor.state]]
name = "p2"
default = 1.0

[[sensor.state]]
name = "p3"
default = 1.0

[[sensor.state]]
name = "p4"
default = 1.0

[[sensor.state]]
name = "p5"
default = 1.0

[[sensor.state]]
name = "p6"
default = 1.0

[[sensor.state]]
name = "p7"
default = 1.0

# No register pointer: the byte after the address is the port data (7.3.1). Every byte written updates the latch (see the
# notes: 7.3.1 says later bytes are ignored but Figure 7-3 shows data 2 written).
[[sensor.write_command]]
name = "port_write"
match_mask = 0
match_value = 0
prefix = false
group_bytes = 1
[[sensor.write_command.field]]
name = "d0"
bits = [0, 0]
[[sensor.write_command.field]]
name = "d1"
bits = [1, 1]
[[sensor.write_command.field]]
name = "d2"
bits = [2, 2]
[[sensor.write_command.field]]
name = "d3"
bits = [3, 3]
[[sensor.write_command.field]]
name = "d4"
bits = [4, 4]
[[sensor.write_command.field]]
name = "d5"
bits = [5, 5]
[[sensor.write_command.field]]
name = "d6"
bits = [6, 6]
[[sensor.write_command.field]]
name = "d7"
bits = [7, 7]
[sensor.write_command.update]
p0 = "d0"
p1 = "d1"
p2 = "d2"
p3 = "d3"
p4 = "d4"
p5 = "d5"
p6 = "d6"
p7 = "d7"

# A read returns the port: a pin whose latch bit is low reads low, otherwise the external level (7.3.1).
[sensor.read_frame]
bytes = [
  "if(p0 == 1.0, ext0, 0.0) + 2.0 * if(p1 == 1.0, ext1, 0.0) + 4.0 * if(p2 == 1.0, ext2, 0.0) + 8.0 * if(p3 == 1.0, ext3, 0.0) + 16.0 * if(p4 == 1.0, ext4, 0.0) + 32.0 * if(p5 == 1.0, ext5, 0.0) + 64.0 * if(p6 == 1.0, ext6, 0.0) + 128.0 * if(p7 == 1.0, ext7, 0.0)",
]

[sensor.protocol]
style = "i2c_pointer"
'''

