[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/sn74lvc245a.pdf"
title = "Texas Instruments SN74LVC245A Octal Bus Transceiver With 3-State Outputs, SCAS218X, Rev. X (January 2015)"
locator = "6 Pin Configuration and Functions (Pin Functions table); 7.1 Absolute Maximum Ratings; 7.3 Recommended Operating Conditions; 7.4 Thermal Information; 7.5 Electrical Characteristics; 7.6 Switching Characteristics; 7.7 Operating Characteristics; 9.4 Table 1 Function Table"
sha256 = "ad3e705aef834214404d6e1e38cb00f95fdb6f0d9807a784a6f58c4d060f13a3"
[[models.source.uncertainty]]
status = "unknown"
parameter = "enable_disable_timing"
reason = "ten and tdis (OE to A or B), the output skew, the input and output leakage currents (II, Ioff, IOZ) and the delta-ICC supply increase are not modelled; only the DC function table, the supply-dependent input thresholds, the output levels, the propagation delay and the supply current are"

[models.match]
# DW ordering codes (tube, T&R and the E4 / G4 / G3 and .B Package Option Addendum variants).
value_re = "(?i)^SN74LVC245ADW([RT]?(E4|G4|G3)?)?(\\.[AB])?$"

[models.params]
voh = 3.1       # VCC - 0.2 V at IOH = -100 uA, VCC 3.3 V, TA = -40 C to 85 C (7.5)
vol = 0.2       # IOL = 100 uA, VCC 3.3 V, TA = -40 C to 85 C max (7.5)
vih = 2.0       # VCC = 2.7 V to 3.6 V (7.3)
vil = 0.8       # VCC = 2.7 V to 3.6 V (7.3)
# derived: VCC = 3 V, TA = -40 C to 85 C: light-load VOH 2.8 V (VCC - 0.2 V) against VOH min 2.2 V at IOH = -24 mA,
