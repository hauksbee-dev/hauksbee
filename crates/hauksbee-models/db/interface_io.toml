[models.match]
# Bare part numbers are ambiguous across packages, so a card needs BOTH value_re and footprint_re (AND semantics): the footprint picks the pin map, the value_re keeps the sibling parts out. Ordering codes per Product Identification System p.38: MCP23S17[T]-E/<pkg>; T = tape and reel, E = -40 C to +125 C, the only grade. An underscore spelling (MCP23S17_SO) is accepted for library symbol names; that spelling is not in the datasheet. Suffix codes SP, SO, SS and SSVAO share this pin map.
value_re = '(?i)^MCP23S17T?((-E/|_)(SP|SO|SS|SSVAO))?$'
footprint_re = '(?i)(SOIC|SO|SOP|SSOP|SPDIP|SDIP|PDIP|DIP|DIL)[-_]?28([^0-9]|$)|[-_]28N([^0-9]|$)'

[models.params]
warning = "pin map, levels, ratings and supply current only: the SPI register file (two-byte header: control byte 0100 A2 A1 A0 R/W, then register address) is not executable, and GPIO/INT outputs are not modelled"
