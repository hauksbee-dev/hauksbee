unit = "uA"
conditions = "low inputs, VI = GND, IO = 0, VCC = 5.5 V"
basis = "6.5 Electrical Characteristics"

[models.match]
# Bare names are ambiguous across packages, so the card needs BOTH value_re and footprint_re (AND). PCA9548A orderable codes: PCA9548ARGER with the tape-and-reel R, the G4 variants and the .A/.B addendum suffixes. TCA9548A is a different part (a different supply range and thermal data) and is rejected by the value_re.
value_re = '(?i)^PCA9548A(RGER)?(\.[AB])?$'
footprint_re = '(?i)(V|W)?QFN[-_]?24[^/]*4(\.0)?x4|RGE[-_]?24([^0-9]|$)'

[models.params]
warning = "The single control register is executable: the address follows the A2:A0 straps, the register is 0 at power up, the last byte written is kept and a read returns it. Switching the downstream channels (SCn/SDn connectivity after the STOP condition) and the RESET pin are not modelled, so a device behind the switch is unreachable."
vol = 0.4                 # basis: 6.5 Electrical Characteristics, SDA IOL min 3 mA at VOL = 0.4 V (the test voltage; no VOL row is printed)
vih = 2.31                # basis: derived, 6.3 Recommended Operating Conditions VIH min 0.7 x VCC, at VCC = 3.3 V
vil = 0.99                # basis: derived, 6.3 Recommended Operating Conditions VIL max 0.3 x VCC, at VCC = 3.3 V
supply_static_ua = 0.2    # basis: 6.5 Electrical Characteristics, ICC standby mode low inputs typ 0.2 uA (max 2 uA) at VCC = 5.5 V, VI = GND, IO = 0
supply_pin = "21"          # basis: Table 5-1 / Table 5-2, VCC
gnd_pin = "9"            # basis: Table 5-1 / Table 5-2, GND
iol_a = 0.003             # basis: 6.5 Electrical Characteristics, SDA IOL min 3 mA at VOL = 0.4 V (typ 6 mA)
iih_a = 0.000001          # basis: 6.5 Electrical Characteristics, II SCL, SDA, SCn, SDn, A2-A0 and RESET +-1 uA at VI = VCC or GND
must_not_float_roles = "a0,a1,a2,reset_n"   # basis: Table 5-1 / Table 5-2, A0-A2 "Connect directly to VCC or ground"; RESET "Connect to VCC through a pull-up resistor, if not used"

[models.levels]
# 6.3 Recommended Operating Conditions: VIH min 0.7 x VCC and VIL max 0.3 x VCC at both ends of the 2.3 V to 5.5 V supply range are DERIVED from those ratios; no VOH is printed.
vih = [[2.3, 1.61], [5.5, 3.85]]
vil = [[2.3, 0.69], [5.5, 1.65]]

[models.pins]
# Texas Instruments PCA9548A, VQFN-24 4 x 4 mm (RGE); Table 5-1 / Table 5-2 RGE column (Table 5-2). The thermal pad has no printed pad number, so it is not listed.
"1" = "sd0"
"2" = "sc0"
"3" = "sd1"
"4" = "sc1"
"5" = "sd2"
"6" = "sc2"
"7" = "sd3"
"8" = "sc3"
"9" = "gnd"
"10" = "sd4"
"11" = "sc4"
"12" = "sd5"
"13" = "sc5"
"14" = "sd6"
"15" = "sc6"
"16" = "sd7"
"17" = "sc7"
"18" = "a2"
"19" = "scl"
"20" = "sda"
"21" = "vcc"
"22" = "a0"
"23" = "a1"
"24" = "reset_n"

[models.ratings]
max_voltage_v = 7.0           # basis: 6.1 Absolute Maximum Ratings, VCC -0.5 V to 7 V
max_pin_current_a = 0.025     # basis: 6.1 Absolute Maximum Ratings, IO output current 25 mA magnitude
max_current_a = 0.1           # basis: 6.1 Absolute Maximum Ratings, ICC supply current +-100 mA
theta_ja_c_per_w = 57.2   # basis: 6.4 Thermal Information, RthetaJA, RGE column
theta_jc_c_per_w = 62.5   # basis: 6.4 Thermal Information, RthetaJC(top), RGE column

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.3
max_v = 5.5
abs_max_v = 7.0
conditions = "TA = -40 C to 85 C"
basis = "TI PCA9548A SCPS143G, 6.3 Recommended Operating Conditions: supply voltage 2.3 V to 5.5 V; 6.1 Absolute Maximum Ratings: VCC -0.5 V to 7 V"

[[models.envelope]]
kind = "input_tolerance"
pins = ["scl", "sda"]
max_v = 6.0
abs_max_v = 7.0
basis = "TI PCA9548A SCPS143G, 6.3 Recommended Operating Conditions: VIH max 6 V on SCL and SDA"
abs_max_basis = "TI PCA9548A SCPS143G, 6.1 Absolute Maximum Ratings: VI input voltage -0.5 V to 7 V"

[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "PCA9548A 8-channel I2C switch control register"
bus = "i2c"
i2c_address = 0x70

[sensor.pins]
1 = "sd0"
2 = "sc0"
3 = "sd1"
4 = "sc1"
5 = "sd2"
6 = "sc2"
7 = "sd3"
8 = "sc3"
9 = "gnd"
10 = "sd4"
11 = "sc4"
12 = "sd5"
13 = "sc5"
14 = "sd6"
15 = "sc6"
16 = "sd7"
17 = "sc7"
18 = "a2"
19 = "scl"
20 = "sda"
21 = "vcc"
22 = "a0"
23 = "a1"
24 = "reset_n"

# Device address 1 1 1 0 A2 A1 A0 R/W, so 0x70 to 0x77
[[sensor.address_select]]
address = 0x70
straps = { a2 = "low", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x71
straps = { a2 = "low", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x72
straps = { a2 = "low", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x73
straps = { a2 = "low", a1 = "high", a0 = "high" }
[[sensor.address_select]]
address = 0x74
straps = { a2 = "high", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x75
straps = { a2 = "high", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x76
straps = { a2 = "high", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x77
straps = { a2 = "high", a1 = "high", a0 = "high" }

# Control register B7..B0, bit n selects channel n; no channel selected at power up and reset
[[sensor.state]]
name = "ctrl"
default = 0.0

# Pointerless: the byte after the address is the control register; with several bytes the last one is kept.
[[sensor.write_command]]
name = "control_write"
match_mask = 0
match_value = 0
prefix = false
group_bytes = 1
[[sensor.write_command.field]]
name = "ctrl_byte"
bits = [7, 0]
[sensor.write_command.update]
ctrl = "ctrl_byte"

# A read returns the control register
[sensor.read_frame]
bytes = ["ctrl"]

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vcc"
return_role = "gnd"
power_on_threshold_v = 2.3   # basis: VCC minimum (6.3 Recommended Operating Conditions); VPORR is typ 1.2 V and max 1.5 V
idle_a = 0.000002            # basis: 6.5 Electrical Characteristics, ICC standby mode max 2 uA at VCC = 5.5 V
read_a = 0.00008             # basis: 6.5 Electrical Characteristics, ICC operating mode max 80 uA at fSCL = 400 kHz, VCC = 5.5 V
write_a = 0.00008            # basis: 6.5 Electrical Characteristics, ICC operating mode max 80 uA at fSCL = 400 kHz, VCC = 5.5 V

[models.coverage]
implements = ["pin_roles", "logic_levels", "digital_supply_current", "absolute_ratings", "supply_ranges", "i2c_address_strap", "register_map_subset", "control_register_write_readback", "reset_values", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["downstream_channel_connectivity", "channel_active_after_stop", "reset_pin_behaviour", "i2c_timing_modes", "power_on_reset_sequence", "switch_on_resistance_and_pass_voltage"]

