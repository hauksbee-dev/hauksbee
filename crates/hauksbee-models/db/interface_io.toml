vih = [[1.65, 1.0725], [1.95, 1.2675], [2.3, 1.7], [2.7, 2.0], [3.6, 2.0]]
vil = [[1.65, 0.5775], [1.95, 0.6825], [2.3, 0.7], [2.7, 0.8], [3.6, 0.8]]
voh = [[1.65, 1.45], [3.6, 3.4]]

