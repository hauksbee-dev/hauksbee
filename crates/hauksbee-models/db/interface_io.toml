iih_a = 0.000001          # basis: 6.5 Electrical Characteristics, II SCL, SDA, SCn, SDn, A2-A0 and RESET +-1 uA at VI = VCC or GND
must_not_float_roles = "a0,a1,a2,reset_n"   # basis: Table 5-1 / Table 5-2, A0-A2 "Connect directly to VCC or ground"; RESET "Connect to VCC through a pull-up resistor, if not used"

