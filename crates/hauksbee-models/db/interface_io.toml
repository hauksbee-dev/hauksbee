[[models.source.uncertainty]]
status = "unknown"
parameter = "all_led_read"
reason = "Table 4 types ALL_LED_ON/OFF as write/read zero while Table 8 types them W only with ALL_LED_ON_H[4] and ALL_LED_OFF_H[4] defaulting to 1; the card reads 0 from FAh to FDh"
[[models.source.uncertainty]]
status = "unknown"
