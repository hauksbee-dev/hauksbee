[models.match]
# Bare part numbers are ambiguous across packages, so a card needs BOTH value_re and footprint_re (AND semantics): the footprint picks the pin map, the value_re keeps the sibling parts out. Ordering codes per Product Identification System p.38: MCP23017[T]-E/<pkg>; T = tape and reel, E = -40 C to +125 C, the only grade. An underscore spelling (MCP23017_SO) is accepted for library symbol names; that spelling is not in the datasheet. Suffix codes SP, SO, SS and SSVAO (automotive SSOP) share this pin map (Table 2-1).
value_re = '(?i)^MCP23017T?((-E/|_)(SP|SO|SS|SSVAO))?$'
footprint_re = '(?i)(SOIC|SO|SOP|SSOP|SPDIP|SDIP|PDIP|DIP|DIL)[-_]?28([^0-9]|$)|[-_]28N([^0-9]|$)'

[models.params]
warning = "I2C register file (IOCON.BANK = 0 map) is executable: reset values, write-readback of the configuration, OLAT and IOCON bits, and GPIO reads of the input value. The GPIO and INT pin outputs, direction, pull-ups, polarity inversion, interrupt capture, IOCON.BANK = 1 / SEQOP / MIRROR behaviour and write auto-increment are not modelled. GPA7 and GPB7 are output-only on the MCP23017."
vol = 0.6                 # basis: p.4 Table 1-1 D080, GPIO VOL max at IOL = 8.0 mA, VDD = 4.5 V (INT 0.6 V at 1.6 mA; SDA 0.8 V at 3.0 mA, VDD = 4.5 V)
voh = 2.6                 # basis: p.4 Table 1-1 D090, VOH min VDD - 0.7 V at IOH = -3.0 mA (VDD = 4.5 V) and -400 uA (VDD = 1.8 V); derived here at VDD = 3.3 V
vih = 2.64                # basis: p.4 Table 1-1 D041, 0.8 VDD min (Schmitt inputs), derived at VDD = 3.3 V; the A0-A2 TTL inputs differ (D040)
vil = 0.66                # basis: p.4 Table 1-1 D031, 0.2 VDD max (Schmitt inputs), derived at VDD = 3.3 V; the A0-A2 TTL inputs differ (D030)
supply_static_ua = 1.0    # basis: p.4 Table 1-1 D005, IDDS standby max 1 uA at -40 to +85 C (3 uA max at 4.5-5.5 V, +85 to +125 C); no typical printed
supply_pin = "9"      # basis: p.11 Table 2-1, VDD
gnd_pin = "10"         # basis: p.11 Table 2-1, VSS
iol_a = 0.003            # basis: p.4 Table 1-1 D080, SDA VOL 0.6 V max at IOL = 3.0 mA, VDD = 1.8 V (0.8 V max at VDD = 4.5 V)
iih_a = 0.000001        # basis: p.4 Table 1-1 D060, input leakage IIL +-1 uA, VSS <= VPIN <= VDD
must_not_float_roles = "reset_n,a0,a1,a2"   # basis: p.11 Table 2-1, A0/A1/A2/RESET "Must be externally biased"

[models.levels]
# Linear between the printed VDD range ends (1.8 V and 5.5 V, D001), flat beyond. DERIVED from the ratiometric rows:
# vih = 0.8 VDD (D041, Schmitt inputs), vil = 0.2 VDD (D031), voh = VDD - 0.7 V (D090).
