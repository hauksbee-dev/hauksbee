[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "MCP23008 8-bit I/O expander registers"
bus = "i2c"
i2c_address = 0x20

[sensor.pins]
1 = "scl"
2 = "sda"
3 = "a2"
4 = "a1"
5 = "a0"
6 = "reset_n"
7 = "nc"
8 = "int"
9 = "gnd"
10 = "gp0"
11 = "gp1"
12 = "gp2"
13 = "gp3"
14 = "gp4"
15 = "gp5"
16 = "gp6"
17 = "gp7"
18 = "vdd"

# Section 1.4.1 / Figure 1-2: control byte 0100 A2 A1 A0 R/W, so 0x20 to 0x27 (A2:A0 drive address bits 2:0)
[[sensor.address_select]]
address = 0x20
straps = { a2 = "low", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x21
straps = { a2 = "low", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x22
straps = { a2 = "low", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x23
straps = { a2 = "low", a1 = "high", a0 = "high" }
[[sensor.address_select]]
address = 0x24
straps = { a2 = "high", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x25
straps = { a2 = "high", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x26
straps = { a2 = "high", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x27
straps = { a2 = "high", a1 = "high", a0 = "high" }

[[sensor.input]]
name = "gpio"
default = 0.0

# IODIR resets to 1111 1111 (Table 1-3)
[[sensor.write_register]]
addr = 0x00
encoding = "u8"
store = "iodir"
default = 255.0

[[sensor.write_register]]
addr = 0x01
encoding = "u8"
store = "ipol"

[[sensor.write_register]]
addr = 0x02
encoding = "u8"
store = "gpinten"

[[sensor.write_register]]
addr = 0x03
encoding = "u8"
store = "defval"

[[sensor.write_register]]
addr = 0x04
encoding = "u8"
store = "intcon"

# IOCON bits 7:6 and 0 unimplemented, read as 0 (Register 1-6)
[[sensor.write_register]]
addr = 0x05
encoding = "u8"
store = "iocon"
[[sensor.write_register.field]]
name = "iocon_seqop"
bits = [5, 5]
[[sensor.write_register.field]]
name = "iocon_disslw"
bits = [4, 4]
[[sensor.write_register.field]]
name = "iocon_haen"
bits = [3, 3]
[[sensor.write_register.field]]
name = "iocon_odr"
bits = [2, 2]
[[sensor.write_register.field]]
name = "iocon_intpol"
bits = [1, 1]

[[sensor.write_register]]
addr = 0x06
encoding = "u8"
store = "gppu"

[[sensor.write_register]]
addr = 0x0A
encoding = "u8"
store = "olat"

[[sensor.register]]
addr = 0x00
encoding = "u8"
expr = "iodir"

[[sensor.register]]
addr = 0x01
encoding = "u8"
expr = "ipol"

[[sensor.register]]
addr = 0x02
encoding = "u8"
expr = "gpinten"

[[sensor.register]]
addr = 0x03
encoding = "u8"
expr = "defval"

[[sensor.register]]
addr = 0x04
encoding = "u8"
expr = "intcon"

[[sensor.register]]
addr = 0x05
encoding = "u8"
expr = "iocon_seqop * 32.0 + iocon_disslw * 16.0 + iocon_haen * 8.0 + iocon_odr * 4.0 + iocon_intpol * 2.0"

[[sensor.register]]
addr = 0x06
encoding = "u8"
expr = "gppu"

# INTF reads 0000 0000 at reset (Table 1-3); interrupt logic is not modelled
[[sensor.register]]
addr = 0x07
const = [0]

# INTCAP reads 0000 0000 at reset (Table 1-3); not captured
[[sensor.register]]
addr = 0x08
const = [0]

# GPIO reads the pin inputs (reset 0000 0000, Table 1-3)
[[sensor.register]]
addr = 0x09
encoding = "u8"
expr = "gpio"

[[sensor.register]]
addr = 0x0A
encoding = "u8"
expr = "olat"

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.8    # basis: VDD minimum (D001); D002 prints VPOR = VSS and no power-on-reset voltage is published
idle_a = 0.000001             # basis: p.22 Section 2.1 D005, IDDS standby max 1 uA (no typical printed)
read_a = 0.001                # basis: p.22 Section 2.1 D004, IDD max 1 mA at SCL/SCK = 1 MHz (no typical printed)
write_a = 0.001               # basis: p.22 Section 2.1 D004, IDD max 1 mA at SCL/SCK = 1 MHz (no typical printed)

[models.coverage]
implements = ["pin_roles", "output_low_level", "logic_levels", "digital_supply_current", "absolute_ratings", "supply_ranges", "i2c_address_strap", "register_map_subset", "reset_values", "configuration_register_write_readback", "iocon_bits_stored", "gpio_input_read", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["gpio_pin_outputs", "int_pin_output", "port_direction_iodir_effect", "pull_up_gppu_effect", "input_polarity_ipol", "interrupt_on_change", "intf_intcap_capture", "iocon_seqop_odr_intpol_effect", "write_auto_increment", "gpio_write_updates_olat", "hardware_reset_pin_behaviour", "a0_a1_ttl_input_levels", "i2c_timing_modes"]


