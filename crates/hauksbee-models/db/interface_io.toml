[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "MCP23017 16-bit I/O expander registers"
bus = "i2c"
i2c_address = 0x20

[sensor.pins]
1 = "gpb0"
2 = "gpb1"
3 = "gpb2"
4 = "gpb3"
5 = "gpb4"
6 = "gpb5"
7 = "gpb6"
8 = "gpb7"
9 = "vdd"
10 = "gnd"
11 = "nc"
12 = "scl"
13 = "sda"
14 = "nc"
15 = "a0"
16 = "a1"
17 = "a2"
18 = "reset_n"
19 = "intb"
20 = "inta"
21 = "gpa0"
22 = "gpa1"
23 = "gpa2"
24 = "gpa3"
25 = "gpa4"
26 = "gpa5"
27 = "gpa6"
28 = "gpa7"

# Section 3.3.1 / Figure 3-4: control byte 0100 A2 A1 A0 R/W, so 0x20 to 0x27 (A2:A0 drive address bits 2:0)
[[sensor.address_select]]
address = 0x20
straps = { a2 = "low", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x21
straps = { a2 = "low", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x22
straps = { a2 = "low", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x23
straps = { a2 = "low", a1 = "high", a0 = "high" }
[[sensor.address_select]]
address = 0x24
straps = { a2 = "high", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x25
straps = { a2 = "high", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x26
straps = { a2 = "high", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x27
straps = { a2 = "high", a1 = "high", a0 = "high" }

[[sensor.input]]
name = "gpioa"
default = 0.0

[[sensor.input]]
name = "gpiob"
default = 0.0

# IODIRA/IODIRB, IOCON.BANK = 0 paired addresses (Table 3-5)
[[sensor.write_register]]
addr = 0x00
encoding = "u8"
store = "iodira"
default = 255.0

[[sensor.write_register]]
addr = 0x01
encoding = "u8"
store = "iodirb"
default = 255.0

[[sensor.write_register]]
addr = 0x02
encoding = "u8"
store = "ipola"

[[sensor.write_register]]
addr = 0x03
encoding = "u8"
store = "ipolb"

[[sensor.write_register]]
addr = 0x04
encoding = "u8"
store = "gpintena"

[[sensor.write_register]]
addr = 0x05
encoding = "u8"
store = "gpintenb"

[[sensor.write_register]]
addr = 0x06
encoding = "u8"
store = "defvala"

[[sensor.write_register]]
addr = 0x07
encoding = "u8"
store = "defvalb"

[[sensor.write_register]]
addr = 0x08
encoding = "u8"
store = "intcona"

[[sensor.write_register]]
addr = 0x09
encoding = "u8"
store = "intconb"

# IOCON at 0A (also printed at 0B); bit 0 unimplemented. Only 0A commits a write here; the two addresses are one register on the part.
[[sensor.write_register]]
addr = 0x0A
encoding = "u8"
store = "iocon"
[[sensor.write_register.field]]
name = "iocon_bank"
bits = [7, 7]
[[sensor.write_register.field]]
name = "iocon_mirror"
bits = [6, 6]
[[sensor.write_register.field]]
name = "iocon_seqop"
bits = [5, 5]
[[sensor.write_register.field]]
name = "iocon_disslw"
bits = [4, 4]
[[sensor.write_register.field]]
name = "iocon_haen"
bits = [3, 3]
[[sensor.write_register.field]]
name = "iocon_odr"
bits = [2, 2]
[[sensor.write_register.field]]
name = "iocon_intpol"
bits = [1, 1]

[[sensor.write_register]]
addr = 0x0C
encoding = "u8"
store = "gppua"

[[sensor.write_register]]
addr = 0x0D
encoding = "u8"
store = "gppub"

[[sensor.write_register]]
addr = 0x14
encoding = "u8"
store = "olata"

[[sensor.write_register]]
addr = 0x15
encoding = "u8"
store = "olatb"

[[sensor.register]]
addr = 0x00
encoding = "u8"
expr = "iodira"

[[sensor.register]]
addr = 0x01
encoding = "u8"
expr = "iodirb"

[[sensor.register]]
addr = 0x02
encoding = "u8"
expr = "ipola"

[[sensor.register]]
addr = 0x03
encoding = "u8"
expr = "ipolb"

[[sensor.register]]
addr = 0x04
encoding = "u8"
expr = "gpintena"

[[sensor.register]]
addr = 0x05
encoding = "u8"
expr = "gpintenb"

[[sensor.register]]
addr = 0x06
encoding = "u8"
expr = "defvala"

[[sensor.register]]
addr = 0x07
encoding = "u8"
expr = "defvalb"

[[sensor.register]]
addr = 0x08
encoding = "u8"
expr = "intcona"

[[sensor.register]]
addr = 0x09
encoding = "u8"
expr = "intconb"

# IOCON at 0A and 0B (Table 3-5); bit 0 reads 0
[[sensor.register]]
addr = 0x0A
encoding = "u8"
expr = "iocon_bank * 128.0 + iocon_mirror * 64.0 + iocon_seqop * 32.0 + iocon_disslw * 16.0 + iocon_haen * 8.0 + iocon_odr * 4.0 + iocon_intpol * 2.0"

[[sensor.register]]
addr = 0x0B
encoding = "u8"
expr = "iocon_bank * 128.0 + iocon_mirror * 64.0 + iocon_seqop * 32.0 + iocon_disslw * 16.0 + iocon_haen * 8.0 + iocon_odr * 4.0 + iocon_intpol * 2.0"

[[sensor.register]]
addr = 0x0C
encoding = "u8"
expr = "gppua"

[[sensor.register]]
addr = 0x0D
encoding = "u8"
expr = "gppub"

# INTFA/INTFB read 0000 0000 at reset (Table 3-5); interrupt logic is not modelled
[[sensor.register]]
addr = 0x0E
const = [0]

[[sensor.register]]
addr = 0x0F
const = [0]

# INTCAPA/INTCAPB: 0000 0000 in Table 3-5 (register definition prints x); not captured
[[sensor.register]]
addr = 0x10
const = [0]

[[sensor.register]]
addr = 0x11
const = [0]

# GPIOA/GPIOB read the pin inputs (reset 0000 0000, Table 3-5)
[[sensor.register]]
addr = 0x12
encoding = "u8"
expr = "gpioa"

[[sensor.register]]
addr = 0x13
encoding = "u8"
expr = "gpiob"

[[sensor.register]]
addr = 0x14
encoding = "u8"
expr = "olata"

[[sensor.register]]
addr = 0x15
encoding = "u8"
expr = "olatb"

[sensor.protocol]
style = "i2c_pointer"
'''

