[models.match]
# Bare names are ambiguous across packages, so the card needs BOTH value_re and footprint_re (AND). TCA9548A orderable codes: TCA9548APWR(G4)? with the tape-and-reel R, the G4 variants and the .A/.B addendum suffixes. PCA9548A is a different part (a different supply range and thermal data) and is rejected by the value_re.
value_re = '(?i)^TCA9548A(PWR(G4)?)?(\.[AB])?$'
footprint_re = '(?i)TSSOP[-_]?24([^0-9]|$)'

[models.params]
warning = "The single control register is executable: the address follows the A2:A0 straps, the register is 0 at power up, the last byte written is kept and a read returns it. Switching the downstream channels (SCn/SDn connectivity after the STOP condition) and the RESET pin are not modelled, so a device behind the switch is unreachable."
vol = 0.4                 # basis: 5.5 Electrical Characteristics, SDA IOL min 3 mA at VOL = 0.4 V (the test voltage; no VOL row is printed)
vih = 2.31                # basis: derived, 5.3 Recommended Operating Conditions VIH min 0.7 x VCC, at VCC = 3.3 V
vil = 0.99                # basis: derived, 5.3 Recommended Operating Conditions VIL max 0.3 x VCC, at VCC = 3.3 V
supply_static_ua = 0.2    # basis: 5.5 Electrical Characteristics, ICC standby mode low inputs typ 0.2 uA (max 2 uA) at VCC = 5.5 V, VI = GND, IO = 0
supply_pin = "24"          # basis: Table 4-1, VCC
gnd_pin = "12"            # basis: Table 4-1, GND
iol_a = 0.003             # basis: 5.5 Electrical Characteristics, SDA IOL min 3 mA at VOL = 0.4 V (typ 6 mA)
iih_a = 0.000001          # basis: 5.5 Electrical Characteristics, II SCL, SDA, SCn, SDn, A2-A0 and RESET +-1 uA at VI = VCC or GND
must_not_float_roles = "a0,a1,a2,reset_n"   # basis: Table 4-1, A0-A2 "Connect directly to VCC or ground"; RESET "Connect to VCC through a pull-up resistor, if not used"

