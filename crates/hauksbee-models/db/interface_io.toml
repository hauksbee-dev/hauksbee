# Bare names are ambiguous across packages, so the card needs BOTH value_re and footprint_re (AND): the footprint picks the pin map and thermal column, the value_re keeps PCF8574A (addresses 0x38-0x3F) and the other vendors' PCF8574T/P/AT (NXP codes, different packages and thermal data) out.
# Ordering codes (Package Option Addendum): PCF8574ARGYR(G4)? with the tape-and-reel R, the G4/E4/1G4 variants and the .A/.B addendum suffixes.
value_re = '(?i)^PCF8574A(RGYR(G4)?)?(\.[AB])?$'
