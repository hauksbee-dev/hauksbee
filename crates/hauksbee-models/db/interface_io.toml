[sensor.pins]
1 = "vcc"
2 = "a0"
3 = "a1"
4 = "a2"
5 = "p0"
6 = "p1"
7 = "p2"
8 = "p3"
9 = "gnd"
10 = "p4"
11 = "p5"
12 = "p6"
13 = "p7"
14 = "int_n"
15 = "scl"
16 = "sda"

# 7.3.2 Interface Definition: target address 0100 A2 A1 A0 R/W, so 0x20 to 0x27
[[sensor.address_select]]
address = 0x20
straps = { a2 = "low", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x21
straps = { a2 = "low", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x22
straps = { a2 = "low", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x23
straps = { a2 = "low", a1 = "high", a0 = "high" }
[[sensor.address_select]]
address = 0x24
straps = { a2 = "high", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x25
straps = { a2 = "high", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x26
straps = { a2 = "high", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x27
straps = { a2 = "high", a1 = "high", a0 = "high" }

# External level on each P pin (an unconnected quasi-bidirectional pin is held high by its pull-up current source)
[[sensor.input]]
name = "ext0"
default = 1.0

[[sensor.input]]
name = "ext1"
default = 1.0

[[sensor.input]]
name = "ext2"
default = 1.0

[[sensor.input]]
name = "ext3"
default = 1.0

[[sensor.input]]
name = "ext4"
default = 1.0

[[sensor.input]]
name = "ext5"
default = 1.0

[[sensor.input]]
name = "ext6"
default = 1.0

[[sensor.input]]
name = "ext7"
default = 1.0

# Output latch bit per port pin, all high at power on (7.1 Overview, 'The I/Os should be high before being used as inputs')
[[sensor.state]]
name = "p0"
default = 1.0

[[sensor.state]]
name = "p1"
default = 1.0

[[sensor.state]]
name = "p2"
default = 1.0

[[sensor.state]]
name = "p3"
default = 1.0

[[sensor.state]]
name = "p4"
default = 1.0

[[sensor.state]]
name = "p5"
default = 1.0

[[sensor.state]]
name = "p6"
default = 1.0

[[sensor.state]]
name = "p7"
default = 1.0

