spec_toml = '''
[sensor]
name = "PCF8574A 8-bit quasi-bidirectional I/O port"
bus = "i2c"
i2c_address = 0x38

[sensor.pins]
1 = "int_n"
2 = "scl"
3 = "nc"
4 = "sda"
5 = "vcc"
6 = "a0"
7 = "a1"
8 = "nc"
9 = "a2"
10 = "p0"
11 = "p1"
12 = "p2"
13 = "nc"
14 = "p3"
15 = "gnd"
16 = "p4"
17 = "p5"
18 = "nc"
19 = "p6"
20 = "p7"

# 7.3.2 Interface Definition: target address 0111 A2 A1 A0 R/W, so 0x38 to 0x3F
[[sensor.address_select]]
address = 0x38
straps = { a2 = "low", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x39
straps = { a2 = "low", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x3A
straps = { a2 = "low", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x3B
straps = { a2 = "low", a1 = "high", a0 = "high" }
[[sensor.address_select]]
