max_voltage_v = 5.5           # basis: p.3 Absolute Maximum Ratings, VDD to VSS -0.3 V to +5.5 V
max_pin_current_a = 0.025     # basis: p.3 Absolute Maximum Ratings, maximum output current sunk or sourced by any output pin 25 mA
max_power_w = 0.7             # basis: p.3 Absolute Maximum Ratings, total power dissipation 700 mW

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.8
max_v = 5.5
abs_max_v = 5.5
conditions = "TA = -40 C to +85 C; 4.5 V to 5.5 V only above +85 C"
basis = "Microchip MCP23017/MCP23S17 DS20001952D, Table 1-1 D001 p.4: supply voltage VDD 1.8 V to 5.5 V; Absolute Maximum Ratings p.3: VDD with respect to VSS -0.3 V to +5.5 V"
note = "The 1.8 V floor holds at -40 C to +85 C; operation above +85 C is printed for 4.5 V to 5.5 V only."

[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "MCP23017 16-bit I/O expander registers"
bus = "i2c"
i2c_address = 0x20

[sensor.pins]
1 = "gpb4"
2 = "gpb5"
3 = "gpb6"
4 = "gpb7"
5 = "vdd"
6 = "gnd"
7 = "nc"
8 = "scl"
9 = "sda"
10 = "nc"
11 = "a0"
12 = "a1"
13 = "a2"
14 = "reset_n"
15 = "intb"
16 = "inta"
17 = "gpa0"
18 = "gpa1"
19 = "gpa2"
20 = "gpa3"
21 = "gpa4"
22 = "gpa5"
23 = "gpa6"
24 = "gpa7"
25 = "gpb0"
26 = "gpb1"
27 = "gpb2"
28 = "gpb3"
29 = "gnd_ep"

# Section 3.3.1 / Figure 3-4: control byte 0100 A2 A1 A0 R/W, so 0x20 to 0x27 (A2:A0 drive address bits 2:0)
[[sensor.address_select]]
address = 0x20
straps = { a2 = "low", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x21
straps = { a2 = "low", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x22
straps = { a2 = "low", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x23
straps = { a2 = "low", a1 = "high", a0 = "high" }
[[sensor.address_select]]
address = 0x24
straps = { a2 = "high", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x25
straps = { a2 = "high", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x26
straps = { a2 = "high", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x27
straps = { a2 = "high", a1 = "high", a0 = "high" }

[[sensor.input]]
name = "gpioa"
default = 0.0

[[sensor.input]]
name = "gpiob"
default = 0.0

# IODIRA/IODIRB, IOCON.BANK = 0 paired addresses (Table 3-5)
[[sensor.write_register]]
addr = 0x00
encoding = "u8"
store = "iodira"
default = 255.0

[[sensor.write_register]]
addr = 0x01
encoding = "u8"
store = "iodirb"
default = 255.0

[[sensor.write_register]]
addr = 0x02
encoding = "u8"
store = "ipola"

[[sensor.write_register]]
addr = 0x03
encoding = "u8"
store = "ipolb"

[[sensor.write_register]]
addr = 0x04
encoding = "u8"
store = "gpintena"

[[sensor.write_register]]
addr = 0x05
encoding = "u8"
store = "gpintenb"

[[sensor.write_register]]
addr = 0x06
encoding = "u8"
store = "defvala"

[[sensor.write_register]]
addr = 0x07
encoding = "u8"
store = "defvalb"

[[sensor.write_register]]
addr = 0x08
encoding = "u8"
store = "intcona"

[[sensor.write_register]]
addr = 0x09
encoding = "u8"
store = "intconb"

# IOCON at 0A (also printed at 0B); bit 0 unimplemented. Only 0A commits a write here; the two addresses are one register on the part.
[[sensor.write_register]]
addr = 0x0A
encoding = "u8"
store = "iocon"
[[sensor.write_register.field]]
name = "iocon_bank"
bits = [7, 7]
[[sensor.write_register.field]]
name = "iocon_mirror"
bits = [6, 6]
[[sensor.write_register.field]]
name = "iocon_seqop"
bits = [5, 5]
[[sensor.write_register.field]]
name = "iocon_disslw"
bits = [4, 4]
[[sensor.write_register.field]]
name = "iocon_haen"
bits = [3, 3]
[[sensor.write_register.field]]
name = "iocon_odr"
bits = [2, 2]
[[sensor.write_register.field]]
name = "iocon_intpol"
bits = [1, 1]

[[sensor.write_register]]
addr = 0x0C
encoding = "u8"
store = "gppua"

[[sensor.write_register]]
addr = 0x0D
encoding = "u8"
store = "gppub"

[[sensor.write_register]]
addr = 0x14
encoding = "u8"
store = "olata"

[[sensor.write_register]]
addr = 0x15
encoding = "u8"
store = "olatb"

[[sensor.register]]
addr = 0x00
encoding = "u8"
expr = "iodira"

[[sensor.register]]
addr = 0x01
encoding = "u8"
expr = "iodirb"

[[sensor.register]]
addr = 0x02
encoding = "u8"
expr = "ipola"

[[sensor.register]]
addr = 0x03
encoding = "u8"
expr = "ipolb"

[[sensor.register]]
addr = 0x04
encoding = "u8"
expr = "gpintena"

[[sensor.register]]
addr = 0x05
encoding = "u8"
expr = "gpintenb"

[[sensor.register]]
addr = 0x06
encoding = "u8"
expr = "defvala"

[[sensor.register]]
addr = 0x07
encoding = "u8"
expr = "defvalb"

[[sensor.register]]
addr = 0x08
encoding = "u8"
expr = "intcona"

[[sensor.register]]
addr = 0x09
encoding = "u8"
expr = "intconb"

# IOCON at 0A and 0B (Table 3-5); bit 0 reads 0
[[sensor.register]]
addr = 0x0A
encoding = "u8"
expr = "iocon_bank * 128.0 + iocon_mirror * 64.0 + iocon_seqop * 32.0 + iocon_disslw * 16.0 + iocon_haen * 8.0 + iocon_odr * 4.0 + iocon_intpol * 2.0"

[[sensor.register]]
addr = 0x0B
encoding = "u8"
expr = "iocon_bank * 128.0 + iocon_mirror * 64.0 + iocon_seqop * 32.0 + iocon_disslw * 16.0 + iocon_haen * 8.0 + iocon_odr * 4.0 + iocon_intpol * 2.0"

[[sensor.register]]
addr = 0x0C
encoding = "u8"
expr = "gppua"

[[sensor.register]]
addr = 0x0D
encoding = "u8"
expr = "gppub"

# INTFA/INTFB read 0000 0000 at reset (Table 3-5); interrupt logic is not modelled
[[sensor.register]]
addr = 0x0E
const = [0]

[[sensor.register]]
addr = 0x0F
const = [0]

# INTCAPA/INTCAPB: 0000 0000 in Table 3-5 (register definition prints x); not captured
[[sensor.register]]
addr = 0x10
const = [0]

[[sensor.register]]
addr = 0x11
const = [0]

# GPIOA/GPIOB read the pin inputs (reset 0000 0000, Table 3-5)
[[sensor.register]]
addr = 0x12
encoding = "u8"
expr = "gpioa"

[[sensor.register]]
addr = 0x13
encoding = "u8"
expr = "gpiob"

[[sensor.register]]
addr = 0x14
encoding = "u8"
expr = "olata"

[[sensor.register]]
addr = 0x15
encoding = "u8"
expr = "olatb"

[sensor.protocol]
style = "i2c_pointer"
'''

