supply_static_ua = 2.2    # basis: Table 14 Static characteristics, Istb standby current typ 2.2 uA (max 15.5 uA), no load, VI = VDD or VSS
supply_pin = "25"          # basis: Table 3 Pin description, VDD
gnd_pin = "11"            # basis: Table 3 Pin description, VSS
iol_a = 0.02              # basis: Table 14 Static characteristics, SDA IOL min 20 mA at VOL = 0.4 V, VDD = 2.3 V (30 mA at 5.0 V)
must_not_float_roles = "a0,a1,a2,a3,a4,a5,extclk"   # basis: 6.2 Pin description, address inputs; EXTCLK "must be connected to VSS when not used"; the address inputs have no internal pull-up or pull-down (Table 3 notes); OE is left out because the datasheet states no float rule

