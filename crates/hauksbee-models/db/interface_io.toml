[models.params]
warning = "The single control register is executable: the address follows the A2:A0 straps, the register is 0 at power up, the last byte written is kept and a read returns it. Switching the downstream channels (SCn/SDn connectivity after the STOP condition) and the RESET pin are not modelled, so a device behind the switch is unreachable."
