[sensor]
name = "PCF8574A 8-bit quasi-bidirectional I/O port"
bus = "i2c"
i2c_address = 0x38

[sensor.pins]
1 = "a0"
2 = "a1"
3 = "a2"
4 = "p0"
5 = "p1"
6 = "p2"
7 = "p3"
8 = "gnd"
9 = "p4"
10 = "p5"
11 = "p6"
12 = "p7"
13 = "int_n"
14 = "scl"
15 = "sda"
16 = "vcc"

