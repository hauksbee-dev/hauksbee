[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "TCA9548A 8-channel I2C switch control register"
bus = "i2c"
i2c_address = 0x70

[sensor.pins]
1 = "a0"
2 = "a1"
3 = "reset_n"
4 = "sd0"
5 = "sc0"
6 = "sd1"
7 = "sc1"
8 = "sd2"
9 = "sc2"
10 = "sd3"
11 = "sc3"
12 = "gnd"
13 = "sd4"
14 = "sc4"
15 = "sd5"
16 = "sc5"
17 = "sd6"
18 = "sc6"
19 = "sd7"
20 = "sc7"
21 = "a2"
22 = "scl"
23 = "sda"
24 = "vcc"

# Device address 1 1 1 0 A2 A1 A0 R/W, so 0x70 to 0x77
[[sensor.address_select]]
address = 0x70
straps = { a2 = "low", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x71
straps = { a2 = "low", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x72
straps = { a2 = "low", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x73
straps = { a2 = "low", a1 = "high", a0 = "high" }
[[sensor.address_select]]
address = 0x74
straps = { a2 = "high", a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x75
straps = { a2 = "high", a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x76
straps = { a2 = "high", a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x77
straps = { a2 = "high", a1 = "high", a0 = "high" }

# Control register B7..B0, bit n selects channel n; no channel selected at power up and reset
[[sensor.state]]
name = "ctrl"
default = 0.0

# Pointerless: the byte after the address is the control register; with several bytes the last one is kept.
[[sensor.write_command]]
name = "control_write"
match_mask = 0
match_value = 0
prefix = false
group_bytes = 1
[[sensor.write_command.field]]
name = "ctrl_byte"
bits = [7, 0]
[sensor.write_command.update]
ctrl = "ctrl_byte"

# A read returns the control register
[sensor.read_frame]
bytes = ["ctrl"]

[sensor.protocol]
style = "i2c_pointer"
'''

