voh = 2.3                 # basis: Table 14 Static characteristics, LEDn VOH min 2.3 V at IOH = -10 mA, VDD = 3.0 V (totem-pole mode)
vih = 2.31                # basis: derived, Table 14 VIH min 0.7 VDD, at VDD = 3.3 V
