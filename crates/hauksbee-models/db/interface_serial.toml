abs_max_basis = "TI MAX3232 SLLS410O, 6.1 Absolute Maximum Ratings p.4: receivers VI -25 V to 25 V"

[[models.envelope]]
kind = "input_tolerance"
pins = ["din1", "din2"]
max_v = 5.5
