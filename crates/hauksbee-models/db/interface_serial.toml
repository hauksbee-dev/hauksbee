basis = "TI MAX3232 SLLS410O, 6.3 Recommended Operating Conditions p.4: driver input voltage DIN 0 V to 5.5 V (accepts 5-V logic with a 3.3-V supply, p.1)"
abs_max_basis = "TI MAX3232 SLLS410O, 6.1 Absolute Maximum Ratings p.4: drivers VI -0.3 V to 6 V"

[[models.behavioral.laws]]
name = "supply_draw"
kind = "current"
a = "vcc"
b = "gnd"
expr = "supply_current_a * min(1.0, max(0.0, v_vcc / supply_on_v))"

[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"

[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/max3232.pdf"
