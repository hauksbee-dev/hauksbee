[models.match]
# FT232RQ is the QFN-32 part; packing codes printed in section 1.2 (p.3) are Reel and Tray for the QFN.
# The SSOP-28 FT232RL has a different pin order and is its own card.
value_re = "(?i)^FT232RQ([-_ ]?(REEL|TRAY))?$"

[models.params]
# Table 5.4 (p.16), VCCIO = 3.3 V, standard drive. The 5.0 V, 2.8 V and 1.8 V columns are in the
# characteristic rows; the VCCIO of the board sets which applies. VOH and VOL are printed at the
# table's test currents (a loaded level), so they are rows.
voh = { min = 2.2, unit = "V", conditions = "VCCIO = 3.3 V, standard drive, I source = 1 mA", basis = "FTDI FT232R FT_000053 v2.16 Table 5.4 (p.16) Voh row, minimum column" }
vol = { max = 0.5, unit = "V", conditions = "VCCIO = 3.3 V, standard drive, I sink = 2 mA", basis = "FTDI FT232R FT_000053 v2.16 Table 5.4 (p.16) Vol row, maximum column" }
# No VIH/VIL is printed. The Vin switching threshold is 1.0 V to 1.5 V (Tables 5.3 to 5.10, the same at
# every VCCIO), so a level above its maximum reads high and below its minimum reads low. Not a
# printed VIH/VIL; the values are the printed Vin limits.
vih = 1.5
vil = 1.0
supply_static_ua = 15000.0   # Table 5.2 Icc1 typical, normal operation (15 mA); USB-suspend Icc2 is 70 uA typical and is not the operating figure
supply_pin = "19"   # VCC
gnd_pin    = "4"
# TEST has no internal pull and must be tied to GND (Table 3.3 / 3.7: "Must be tied to GND for normal
# operation, otherwise the device will appear to fail"). RESET# may be left unconnected or pulled to
# VCC (same tables), so it is not listed.
must_not_float_roles = "test"
warning = """the USB stack is not modelled: TXD, DTR# and RTS# carry no driver and the bridge sources \
or answers no UART traffic, so a result that depends on data arriving through it is not evidence; the \
3V3OUT LDO, the input pull-ups and the VCCIO levels are modelled; the CBUS pads are named by pad and \
their function is EEPROM-configured"""

[models.pins]
"1" = "vccio"  # UART and CBUS I/O-ring supply, 1.8 V to 5.25 V; sets every level
"2" = "rxd"  # UART data in
"3" = "ri_n"  # ring indicator input
"4" = "gnd"  # device ground
"5" = "nc"  # no internal connection; do not connect
"6" = "dsr_n"  # modem-status input
"7" = "dcd_n"  # modem-status input
"8" = "cts_n"  # flow-control input
"9" = "cbus4"  # EEPROM-configured output only; factory default SLEEP#
"10" = "cbus2"  # EEPROM-configured; factory default TXDEN
"11" = "cbus3"  # EEPROM-configured; factory default PWREN# (needs a 10 kOhm pull-up)
"12" = "nc2"  # no internal connection
"13" = "nc3"  # no internal connection
"14" = "usbdp"  # USB D+ with internal series resistor and 1.5 kOhm pull-up to 3V3OUT; no USB stack
"15" = "usbdm"  # USB D-
"16" = "v3v3out"  # internal 3.3 V LDO output, 50 mA (behavioral law below)
"17" = "gnd2"
"18" = "reset_n"  # active-low reset input; may be left unconnected or pulled up to VCC
"19" = "vcc"  # core supply
"20" = "gnd3"
"21" = "cbus1"  # EEPROM-configured; factory default RXLED#
"22" = "cbus0"  # EEPROM-configured; factory default TXLED#
"23" = "nc4"  # no internal connection
"24" = "agnd"  # analogue ground for the internal clock multiplier
"25" = "nc5"  # no internal connection
"26" = "test"  # IC test mode input; must be tied to GND for normal operation
"27" = "osci"  # 12 MHz oscillator input, optional
"28" = "osco"  # 12 MHz oscillator output, optional
"29" = "nc6"  # no internal connection
"30" = "txd"  # UART data out (not driven; see the warning)
"31" = "dtr_n"  # modem-status output
"32" = "rts_n"  # flow-control output
"33" = "ep"  # centre pad, not internally connected; GND recommended (section 9.2 p.32)
"EP" = "ep"  # the same centre pad, Eagle spelling

[models.ratings]
# Table 5.1 (p.15). VCC supply -0.5 V to +6.00 V is the figure here; the other limits are in the notes.
max_voltage_v = 6.0
max_pin_current_a = 0.024   # DC output current, outputs and low-impedance bidirectional (24 mA)
max_power_w = 0.5           # power dissipation at VCC = 5.25 V (500 mW)
theta_ja_c_per_w = 62.31   # Table 5.17 (p.18), centre pad unsoldered (the less favourable row; 31.49 with the pad soldered to the PCB)

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 4.0
max_v = 5.25
abs_max_v = 6.0
basis = "FTDI FT232R FT_000053 v2.16 Table 5.2 (p.15) VCC1 operating supply 4.0 V to 5.25 V using the internal oscillator (3.3 V needs the EEPROM-enabled external oscillator, section 7.6 p.29); Table 5.1 (p.15) Absolute Maximum Ratings VCC supply voltage -0.5 V to +6.00 V"

[[models.envelope]]
kind = "supply_range"
pin = "vccio"
min_v = 1.8
max_v = 5.25
basis = "FTDI FT232R FT_000053 v2.16 Table 5.2 (p.15) VCC2 VCCIO operating supply 1.8 V to 5.25 V; Table 5.1 prints no separate VCCIO absolute maximum, so none is carried"

# Internal 3.3 V LDO on 3V3OUT (Table 3.2 / 3.6, section 4.2, Table 5.2). With VCC above 3.3 V it holds
# 3V3OUT at 3.3 V; below that `min(v_vcc, 3.3)` passes VCC through, which is an assumption (see the
# uncertainty record). The 1 Ohm source resistance is assumed as well; at or below
# `rail_owner::SERIES_OHMS` it makes the law the supply of the net it drives, so a rail fed only from
# 3V3OUT takes no name-derived ideal source beside it.
[[models.behavioral.laws]]
name = "ldo_3v3out"
kind = "voltage"
a = "v3v3out"
b = "gnd"
expr = "max(0.0, min(v_vcc, 3.3))"
r_ohms = 1.0

# Table 3.4 note 3 / Table 3.8 note 3: input pins are pulled to VCCIO through internal 200 kOhm
# resistors (the ** note under Table 5.10 repeats it: only input pins have the pull-up).
[models.behavioral.pins.rxd]
pull_to = "vccio"
pull_ohms = 200000.0

[models.behavioral.pins.cts_n]
pull_to = "vccio"
pull_ohms = 200000.0

[models.behavioral.pins.dsr_n]
pull_to = "vccio"
pull_ohms = 200000.0

[models.behavioral.pins.dcd_n]
pull_to = "vccio"
pull_ohms = 200000.0

[models.behavioral.pins.ri_n]
pull_to = "vccio"
pull_ohms = 200000.0

[models.coverage]
implements = ["pin_roles", "vccio_logic_levels", "internal_3v3_ldo", "input_pullups", "operating_supply_current", "supply_ranges", "absolute_ratings"]
missing = ["usb_stack", "uart_traffic", "txd_rts_dtr_drive", "cbus_functions", "ldo_dropout", "reset_generator", "usb_suspend_current", "high_drive_levels", "external_oscillator_option", "peripheral_register_map"]


# ─────────────────────────────────────────────────────────────────────────────
# MCP2221A, 14-pin PDIP / SOIC / TSSOP (ordering codes MCP2221A-I/P, -I/SL, -I/ST and the T tape-and-reel forms).
# Source: Microchip MCP2221A USB 2.0 to I2C/UART Protocol Converter with GPIO, DS20005565B (July 2017), 80 pages,
# https://ww1.microchip.com/downloads/en/DeviceDoc/20005565B.pdf, sha256
# 7760f2692b2469e1b0290244de95d73e75adfc27229182406be012e4cd688fcb.
# Pin map: Table 1-1 PINOUT DESCRIPTION (p.3) PDIP/SOIC/SSOP column, read against the Package Types figure (p.2).
# The 14-pin packages share one numbering; the 16-pin QFN numbers the pads differently and is the mcp2221a_qfn16
# card. The MCP2221 (without A) is a different part (115200 baud maximum UART) and is not matched.
# ABSENT, not printed: the RST pull-up resistance, any SDA/SCL level or sink current, the VUSB LDO's regulation,
# the GP-pin TTL thresholds below 4.5 V, and any I2C-side-visible register map (the bridge is a USB-HID/CDC device;
# there is nothing on the I2C bus to model as a slave).

[[models]]
id = "mcp2221a"
kind = "digital"
description = "Microchip MCP2221A USB 2.0 to I2C/UART protocol converter with GPIO, PDIP-14/SOIC-14/TSSOP-14 (pad map, supply and USB ranges, input levels; no USB stack, no I2C master)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://ww1.microchip.com/downloads/en/DeviceDoc/20005565B.pdf"
title = "Microchip MCP2221A USB 2.0 to I2C/UART Protocol Converter with GPIO datasheet, DS20005565B (July 2017)"
locator = "Table 1-1 Pinout Description p.3 (PDIP, SOIC, SSOP column); Package Types p.2; Table 1-5 GP Designation p.19; Absolute Maximum Ratings p.57; 4.1 DC Characteristics p.58; Table 4-1 p.59; Table 4-4 Thermal p.60; Table 4-6 p.62; Product Identification System p.77"
sha256 = "7760f2692b2469e1b0290244de95d73e75adfc27229182406be012e4cd688fcb"
[[models.source.uncertainty]]
status = "unknown"
parameter = "gp_pin_input_levels"
reason = "the GP pins' TTL thresholds (VIL 0.8 V max, VIH 2.0 V min, D031 and D041 p.58) are printed only for 4.5 V <= VDD <= 5.5 V; the URX Schmitt-trigger thresholds are 0.2 VDD and 0.8 VDD for 3.0 V <= VDD <= 5.5 V. The input levels in [models.levels] use the Schmitt ratios for every input pin, which is conservative for a GP pin at 5 V"
[[models.source.uncertainty]]
status = "unknown"
parameter = "voh_supply_relative"
reason = "D090 prints the output high voltage as VDD minus 0.7 V at IOH = -3.5 mA (VDD = 5.0 V) and -3.0 mA (VDD = 3.3 V), a supply-relative figure with no number of its own; the levels table carries it as a derived corner"
[[models.source.uncertainty]]
status = "unknown"
parameter = "rst_internal_pull_up"
reason = "Table 1-1 says RST has an internal pull-up but the datasheet prints no resistance, so none is stamped; section 1.11.2 (p.21) suggests tying RST to VDD through 1 to 10 kOhm for the power-on reset delay"
[[models.source.uncertainty]]
status = "unknown"
parameter = "vusb_regulator"
reason = "VUSB is the output of the 3.3 V LDO that powers the USB transceiver (section 1.6.2, p.16) unless it is tied to an external 3.3 V rail, which disables that LDO (section 1.6.2.3 p.18); the LDO's load regulation, dropout and the 0.22 to 0.47 uF bypass are not carried as a source. Note 1 of the Absolute Maximum Ratings (p.57) requires VUSB <= VDD + 0.3 V, which the schema cannot express as a rail order with an offset"
[[models.source.uncertainty]]
status = "unknown"
parameter = "rst_abs_max_voltage"
reason = "the Absolute Maximum Ratings (p.57) allow RST -0.3 V to +9.0 V against VDD -0.3 V to +6.0 V, a pin-specific limit with no recommended-operating counterpart; only the VDD figure is carried"
[[models.source.uncertainty]]
status = "unknown"
parameter = "i2c_pin_levels"
reason = "SDA and SCL print no input-threshold, output-low or load-current figure in the DC characteristics (D080 and D090 name GP and UTX only), so the I2C side's levels and sink current are absent"
[[models.source.uncertainty]]
status = "unknown"
parameter = "gp_adc_dac_electrical"
reason = "the ADC (Table 4-2 p.60, 10 bit, recommended source impedance 10 kOhm) and DAC (Table 4-3, 5 bit, step VDD/32, settling 10 us) are printed but not carried; the pads are named by their GP number and the factory-default and alternate functions are comments"
[[models.source.pinout]]
package = "PDIP-14/SOIC-14/TSSOP-14"
pins = { "1" = "VDD", "2" = "GP0", "3" = "GP1", "4" = "RST", "5" = "URX", "6" = "UTX", "7" = "GP2", "8" = "GP3", "9" = "SDA", "10" = "SCL", "11" = "VUSB", "12" = "D-", "13" = "D+", "14" = "VSS" }

