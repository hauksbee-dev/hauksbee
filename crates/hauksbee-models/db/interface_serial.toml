# ─────────────────────────────────────────────────────────────────────────────
# MCP2562FD (Microchip): CAN FD transceiver with VIO, PDIP-8 / SOIC-8 / 3x3 DFN-8 (with EP), E and H grades.
# Source: Microchip MCP2561/2FD datasheet DS20005284A (March 2014), sha256
# 79321323eb3295c5800a1aaabfea595f1486a26e2c17016b70bd26c52369fc14 (fetched 2026-10-22 from ww1.microchip.com/downloads/en/DeviceDoc/20005284A.pdf;
# stored as datasheets/MCP2562FD.pdf). The task's "DS20005167C" covers only the non-FD MCP2561/2; the FD parts have this separate sheet.
# What the sheet states that differs from the MCP2562 (DS20005167C): Loop Delay Symmetry guaranteed for CAN FD (tBIT(RXD) rows at 2, 5, 8 Mbps, p.13);
# maximum propagation delay tTXD-RXD 120 ns typ 90 ns (the MCP2562 prints 125 / 235 ns max, no typ); bit time min 0.2 us and bit frequency max 5000 kHz
# (MCP2562: 1 us and 1000 kHz); the p.3 text says the loop delay symmetry is guaranteed for data rates up to 5 Mbps, the p.1 features cite 2, 5 and 8 Mbps.
# All pin, supply, DC and thermal rows read the same as the MCP2562's. Pin map Table 1-2 p.4 (1 TXD, 2 VSS, 3 VDD, 4 RXD, 5 VIO, 6 CANL, 7 CANH, 8 STBY, 9 EP DFN only).
# The CANH short-circuit typical prints +85 mA in this sheet (p.10) against -85 mA in DS20005167C; the row is not stored.
# SIBLINGS NOT MATCHED: MCP2562 (own card), MCP2561FD (SPLIT), MCP25625, MCP2542FD, MCP2557FD.
# Same ratiometric-level derivation, pulls and NOT MODELLED list as the MCP2562 card above.
[[models]]
id = "mcp2562fd_8pin"
kind = "digital"
description = "Microchip MCP2562FD high-speed CAN FD transceiver with VIO, 8-pin PDIP/SOIC/3x3 DFN: VDD and VIO supply draw (normal vs standby), ratiometric logic levels, pin roles (bus levels and timing not modelled)"

[models.match]
# Orderable codes MCP2562FD{,T}-{E,H}/{MF,P,SN} (p.29) plus the bare MCP2562FD / MCP2562FD-E / MCP2562FD-H. Rejects MCP2562 (non-FD), MCP2561FD, MCP25625.
value_re = "(?i)^MCP2562FDT?(?:-[EH](?:/(?:MF|P|SN))?)?$"

[models.params]
supply_current_a = 0.005        # [Microchip FD] p.9, IDD recessive (VTXD = VDD) 5 mA typ, 10 mA max, RL = 60 Ohm
standby_current_a = 0.000005    # [Microchip FD] p.9, IDDS for the MCP2562FD, 5 uA typ (15 uA max), includes IIO
io_supply_current_a = 0.000004  # [Microchip FD] p.9, supply current on VIO, recessive 4 uA typ (30 uA max)
io_standby_current_a = 0.0000003  # [Microchip FD] p.9, VIO standby current 0.3 uA typ (1 uA max)
supply_on_v = 4.5               # [Microchip FD] p.9, VDD voltage range minimum
vio_on_v = 1.8                  # [Microchip FD] p.9, VIO range minimum
vol = 0.4                       # [Microchip FD] p.11, RXD VOL max at IOL = 4 mA
warning = "source-bound supply and level model: the recessive-state VDD current (5 mA typ, 10 mA max), the 5 uA standby VDD current with STBY high, the VIO current, the 4.5 V to 5.5 V VDD range, the 1.8 V to 5.5 V VIO range, VIO-ratiometric TXD/STBY/RXD levels and the internal TXD (33 kOhm) and STBY pull-ups to VIO are carried; dominant transmission (45 mA typ into 60 Ohm), CANH/CANL levels, receiver thresholds, the 2/5/8 Mbps loop-delay symmetry, timing and thermal shutdown are not represented. STBY floating reads HIGH (standby) because of its internal pull-up. The 0.5 VIO standby switching point is assumed midway between VIL and VIH"

[models.levels]
# DERIVED: [Microchip FD] p.11 VIH = 0.7 VIO min, VIL = 0.3 VIO max (TXD, STBY); RXD VOH = VIO - 0.4 V min at IOH = -1 mA; evaluated at VIO = 1.8 V and 5.5 V.
vih = [[1.8, 1.26], [5.5, 3.85]]
vil = [[1.8, 0.54], [5.5, 1.65]]
voh = [[1.8, 1.4], [5.5, 5.1]]

[models.level_rails]
vio = ["txd", "rxd", "stby"]

[models.pins]
# [Microchip FD] p.4 Table 1-2, MCP2562FD PDIP/SOIC and 3x3 DFN columns.
"1" = "txd"
"2" = "gnd"      # VSS
"3" = "vdd"
"4" = "rxd"
"5" = "vio"
"6" = "canl"
"7" = "canh"
"8" = "stby"
"9" = "ep"       # exposed thermal pad, 3x3 DFN only
"EP" = "ep"

[models.ratings]
max_voltage_v = 7.0            # [Microchip FD] p.8 Absolute Maximum Ratings, VDD 7.0 V and VIO 7.0 V
max_junction_temp_c = 190.0    # [Microchip FD] p.8, virtual junction temperature TVJ -40 C to +190 C
theta_ja_c_per_w = 149.5       # [Microchip FD] p.16 Thermal Specifications, 8L-SOIC, highest of the three packages

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 4.5
max_v = 5.5
abs_max_v = 7.0
basis = "Microchip MCP2561/2FD DS20005284A, 2.3 DC Characteristics p.9: VDD voltage range 4.5 V to 5.5 V"
abs_max_basis = "Microchip MCP2561/2FD DS20005284A, 2.2 Absolute Maximum Ratings p.8: VDD 7.0 V"

[[models.envelope]]
kind = "supply_range"
pin = "vio"
min_v = 1.8
max_v = 5.5
abs_max_v = 7.0
basis = "Microchip MCP2561/2FD DS20005284A, 2.3 DC Characteristics p.9: digital supply voltage range VIO 1.8 V to 5.5 V"
abs_max_basis = "Microchip MCP2561/2FD DS20005284A, 2.2 Absolute Maximum Ratings p.8: VIO 7.0 V"

[[models.envelope]]
kind = "input_tolerance"
pins = ["canh", "canl"]
max_v = 58.0
abs_max_v = 58.0
basis = "Microchip MCP2561/2FD DS20005284A, 2.2 Absolute Maximum Ratings p.8: DC voltage at CANH, CANL -58 V to +58 V (no separate recommended window is printed)"
abs_max_basis = "Microchip MCP2561/2FD DS20005284A, 2.2 Absolute Maximum Ratings p.8: DC voltage at CANH, CANL -58 V to +58 V"

[models.behavioral.pins.txd]
# p.5 1.7.1: internal pull-up (nominal 33 kOhm) to VIO.
pull_to = "vio"
pull_ohms = 33000.0

[models.behavioral.pins.stby]
# p.5 1.7.9: internal MOS pull-up to VIO, 660 kOhm at 5 V (also 1.1 MOhm at 3.3 V, 4.4 MOhm at 1.8 V; SCHEMA GAP: supply-dependent pull).
pull_to = "vio"
pull_ohms = 660000.0

[[models.behavioral.laws]]
name = "supply_draw"
kind = "current"
a = "vdd"
b = "gnd"
expr = "min(1.0, max(0.0, v_vdd / supply_on_v)) * if(v_stby > 0.5 * v_vio, standby_current_a, supply_current_a)"

[[models.behavioral.laws]]
name = "vio_draw"
kind = "current"
a = "vio"
b = "gnd"
expr = "min(1.0, max(0.0, v_vio / vio_on_v)) * if(v_stby > 0.5 * v_vio, io_standby_current_a, io_supply_current_a)"

