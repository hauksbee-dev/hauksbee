# Official built-in part library: interface_serial.
#
# Cards here are written from vendor datasheets only (every value carries a basis and a source).
# See target/launch/official-parts-20261022/ranking.md for the batch plan.

# ─────────────────────────────────────────────────────────────────────────────
# FT232RL: the SSOP-28 ordering code of the FTDI FT232R USB-to-UART bridge.
# Source: FTDI FT232R USB UART IC Datasheet, Version 2.16, FT_000053 (FTDI# 38), 40 pages, from
# https://ftdichip.com/wp-content/uploads/2020/08/DS_FT232R.pdf (archive.org copy of that URL), sha256
# ab81490c3ddaf5edc26e1e271490a2891683d3ef5fc199c62236aa5b0ec6b087.
# Pin map: section 3.2 SSOP Package Pin Out Description, Tables 3.1 to 3.4 (pp.7-8), read against Figure 3.1
# (p.7); the FT232RQ (QFN-32) numbers the same signals differently and is the ft232rq card.
# ABSENT, not read in the datasheet: a junction-temperature maximum, a VCCIO absolute maximum, 3V3OUT dropout
# and current limit, the USB suspend/enumeration behaviour, the RESET# pull-up and any VIH/VIL as such
# (the Vin switching threshold is carried instead). CBUS functions are EEPROM-configured: the card names
# the pads and keeps the factory defaults only as comments and in the uncertainty record.

[[models]]
id = "ft232rl"
kind = "digital"
description = "FTDI FT232RL USB-to-UART bridge, SSOP-28 (pad map, VCCIO levels, internal 3V3OUT LDO and input pull-ups; no USB stack)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://ftdichip.com/wp-content/uploads/2020/08/DS_FT232R.pdf"
title = "FTDI FT232R USB UART IC Datasheet, Version 2.16, Document No. FT_000053, Clearance No. FTDI# 38"
locator = "3.2 SSOP Package Pin Out Description, Figure 3.1 and Tables 3.1 to 3.4 pp.7-8; Table 5.16 FT232RL Thermal Characteristics p.18; Tables 5.1 and 5.2 p.15; Tables 5.3 to 5.6 pp.15-16; Tables 5.10 to 5.15 p.17-18; 3V3OUT section 4.2 p.13; Table 3.9 CBUS options p.11; Table 8.1 defaults p.30; section 7.6 external oscillator p.29"
sha256 = "ab81490c3ddaf5edc26e1e271490a2891683d3ef5fc199c62236aa5b0ec6b087"
[[models.source.uncertainty]]
status = "unknown"
parameter = "ldo_output_resistance"
reason = "Table 5.2 gives the 3V3 band (3.0 to 3.6 V) and section 4.2 the 50 mA limit, but no load regulation, dropout or current limit; the 1 Ohm source resistance is assumed (it drops 50 mV at the rated 50 mA, inside the band) and VCC below 3.3 V is passed through without a dropout"
[[models.source.uncertainty]]
status = "unknown"
parameter = "cbus_functions"
reason = "CBUS0 to CBUS4 take their function from the internal EEPROM (Table 3.9); the roles on those pads are the pad names and the factory defaults are TXLED# (CBUS0), RXLED# (CBUS1), TXDEN (CBUS2), PWREN# (CBUS3) and SLEEP# (CBUS4) from Table 8.1 (p.30), so a board that reprograms the EEPROM has different functions on those pads"
[[models.source.uncertainty]]
status = "unknown"
parameter = "vcc_minimum_by_oscillator"
reason = "the VCC minimum is 4.0 V with the internal oscillator the part ships with and 3.3 V only once the EEPROM has been programmed for an external oscillator (section 7.6 p.29, which cannot be done with FT_PROG); the schema carries one minimum per supply pin, so the envelope uses 4.0 V"
[[models.source.uncertainty]]
status = "unknown"
parameter = "max_junction_temp_c"
reason = "Table 5.1 prints storage and ambient temperature, power dissipation and DC pin limits but no junction temperature maximum"
[[models.source.uncertainty]]
status = "unknown"
parameter = "input_overvoltage_limits"
reason = "Table 5.1 limits the inputs to the VCC supply plus a margin (high-impedance bidirectional and all other inputs) and USBDP/USBDM to 3.8 V; neither is a fixed recommended-operating figure, so no input_tolerance row is carried"
[[models.source.uncertainty]]
status = "unknown"
parameter = "high_drive_levels"
reason = "Tables 5.7 to 5.10 print the levels of the EEPROM high-drive setting; the card carries the standard-drive tables 5.3 to 5.6 the part ships with"
[[models.source.pinout]]
package = "SSOP-28"
pins = { "1" = "TXD", "2" = "DTR#", "3" = "RTS#", "4" = "VCCIO", "5" = "RXD", "6" = "RI#", "7" = "GND", "8" = "NC", "9" = "DSR#", "10" = "DCD#", "11" = "CTS#", "12" = "CBUS4", "13" = "CBUS2", "14" = "CBUS3", "15" = "USBDP", "16" = "USBDM", "17" = "3V3OUT", "18" = "GND", "19" = "RESET#", "20" = "VCC", "21" = "GND", "22" = "CBUS1", "23" = "CBUS0", "24" = "NC", "25" = "AGND", "26" = "TEST", "27" = "OSCI", "28" = "OSCO" }

