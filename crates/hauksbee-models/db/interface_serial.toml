# ─────────────────────────────────────────────────────────────────────────────
# MCP2562 (Microchip): high-speed CAN transceiver with VIO pin, PDIP-8 / SOIC-8 / 3x3 DFN-8 (with EP), E and H temperature grades.
# Source: Microchip MCP2561/2 datasheet DS20005167C (2013-2014), sha256
# c36b24e45446d8a1b7d90c0618a924cac0f117994390e60169287e6ba488c53e (byte-identical to ww1.microchip.com/downloads/en/DeviceDoc/20005167C.pdf of 2026-10-22).
# Pin Table 1-2 p.4: 1 TXD, 2 VSS, 3 VDD, 4 RXD, 5 VIO (MCP2562; SPLIT on the MCP2561), 6 CANL, 7 CANH, 8 STBY, 9 EP (DFN only). One pin map for
# PDIP, SOIC and DFN (the DFN adds the exposed pad, which the sheet recommends tying to VSS, p.5 1.7.10).
# MCP2562 vs MCP2562FD (the FD part has its own sheet DS20005284A and its own card, mcp2562fd_8pin): same pins, supplies and DC rows; the FD
# adds loop-delay symmetry at 2/5/8 Mbps and a lower propagation delay (see the FD card). This card's AC rows are the 1 Mb/s part's.
# MCP2561 (SPLIT pin instead of VIO) is NOT matched: pin 5 differs. ESD on CANH/CANL: +-8 kV IEC 61000-4-2 for the MCP2562 (p.8; the p.1 +-14 kV is the MCP2561).
# Ratiometric digital levels: VIH 0.7 VIO min, VIL 0.3 VIO max (p.11), RXD VOH VIO - 0.4 V at IOH = -1 mA. The datasheet prints them only as VIO fractions;
# [models.levels] carries them evaluated at the VIO range edges 1.8 V and 5.5 V, DERIVED (0.7 x 1.8 = 1.26, 0.7 x 5.5 = 3.85, 0.3 x 1.8 = 0.54, 0.3 x 5.5 = 1.65,
# 1.8 - 0.4 = 1.4, 5.5 - 0.4 = 5.1); the printed fractions are kept as characteristic rows in unit VIO.
# Internal pulls (p.5): TXD 33 kOhm nominal to VIO; STBY MOS pull to VIO, 660 kOhm at 5 V, 1.1 MOhm at 3.3 V, 4.4 MOhm at 1.8 V. A floating STBY is therefore HIGH = standby.
# SIBLINGS NOT MATCHED: MCP2561 (SPLIT), MCP2561FD, MCP2562FD (own card), MCP25625 (CAN controller with transceiver), MCP2551, MCP2542, MCP2557.
# NOT MODELLED: dominant bus drive and CANH/CANL levels, SPLIT, receiver thresholds, timing, wake-up filter, permanent-dominant detect, thermal shutdown action.
[[models]]
id = "mcp2562_8pin"
kind = "digital"
description = "Microchip MCP2562 high-speed CAN transceiver with VIO, 8-pin PDIP/SOIC/3x3 DFN: VDD and VIO supply draw (normal vs standby), ratiometric logic levels, pin roles (bus levels and timing not modelled)"

[models.match]
# Orderable codes MCP2562{,T}-{E,H}/{MF,P,SN} (p.27, tape-and-reel T in DFN and SOIC only) plus the bare MCP2562 / MCP2562-E / MCP2562-H.
# Rejects MCP2562FD*, MCP2561*, MCP25625.
value_re = "(?i)^MCP2562T?(?:-[EH](?:/(?:MF|P|SN))?)?$"

[models.params]
supply_current_a = 0.005        # [Microchip] p.9 DC Characteristics, IDD recessive (VTXD = VDD) 5 mA typ, 10 mA max, RL = 60 Ohm
standby_current_a = 0.000005    # [Microchip] p.9, standby current IDDS for the MCP2562, 5 uA typ (15 uA max), includes IIO
io_supply_current_a = 0.000004  # [Microchip] p.9, supply current on VIO, recessive (VTXD = VIO) 4 uA typ (30 uA max)
io_standby_current_a = 0.0000003  # [Microchip] p.9, VIO standby current 0.3 uA typ (1 uA max), characterized not 100 % tested
supply_on_v = 4.5               # [Microchip] p.9, VDD voltage range minimum
vio_on_v = 1.8                  # [Microchip] p.9, digital supply voltage range VIO minimum
vol = 0.4                       # [Microchip] p.11, RXD VOL max at IOL = 4 mA
warning = "source-bound supply and level model: the recessive-state VDD current (5 mA typ, 10 mA max), the 5 uA standby VDD current with STBY high, the 4 V undervoltage region (POR 3.8 V to 4.3 V high, 3.4 V to 4.0 V low is not modelled), the VIO current, the 4.5 V to 5.5 V VDD range, the 1.8 V to 5.5 V VIO range, VIO-ratiometric TXD/STBY/RXD levels and the internal TXD (33 kOhm) and STBY pull-ups to VIO are carried; dominant transmission (45 mA typ into 60 Ohm), CANH/CANL levels, receiver thresholds, timing and thermal shutdown are not represented. STBY floating reads HIGH (standby) because of its internal pull-up. The 0.5 VIO standby switching point is assumed midway between VIL and VIH"

[models.levels]
# DERIVED: [Microchip] p.11 VIH = 0.7 VIO min, VIL = 0.3 VIO max (TXD, STBY); RXD VOH = VIO - 0.4 V min at IOH = -1 mA; evaluated at VIO = 1.8 V and 5.5 V (p.9 range).
vih = [[1.8, 1.26], [5.5, 3.85]]
vil = [[1.8, 0.54], [5.5, 1.65]]
voh = [[1.8, 1.4], [5.5, 5.1]]

[models.level_rails]
vio = ["txd", "rxd", "stby"]    # p.5 1.7.1, 1.7.4, 1.7.9: TXD pull-up, RXD output and STBY pull-up are referenced to VIO on the MCP2562

[models.pins]
# [Microchip] p.4 Table 1-2, MCP2562 PDIP/SOIC and 3x3 DFN columns.
"1" = "txd"
"2" = "gnd"      # VSS, ground supply pin
"3" = "vdd"
"4" = "rxd"
"5" = "vio"      # digital I/O supply (MCP2562 only; SPLIT on the MCP2561)
"6" = "canl"
"7" = "canh"
"8" = "stby"     # standby mode input, high = standby (internal pull-up to VIO)
"9" = "ep"       # exposed thermal pad, 3x3 DFN only; connect to VSS (p.5 1.7.10)
"EP" = "ep"

[models.ratings]
max_voltage_v = 7.0            # [Microchip] p.8 Absolute Maximum Ratings, VDD 7.0 V and VIO 7.0 V
max_junction_temp_c = 190.0    # [Microchip] p.8, virtual junction temperature TVJ -40 C to +190 C
theta_ja_c_per_w = 149.5       # [Microchip] p.16 Thermal Specifications, 8L-SOIC thetaJA, highest of the three packages; the per-package rows are below

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 4.5
max_v = 5.5
abs_max_v = 7.0
basis = "Microchip MCP2561/2 DS20005167C, 2.2 DC Characteristics p.9: VDD voltage range 4.5 V to 5.5 V"
abs_max_basis = "Microchip MCP2561/2 DS20005167C, Absolute Maximum Ratings p.8: VDD 7.0 V"

[[models.envelope]]
kind = "supply_range"
pin = "vio"
min_v = 1.8
max_v = 5.5
abs_max_v = 7.0
basis = "Microchip MCP2561/2 DS20005167C, 2.2 DC Characteristics p.9: digital supply voltage range VIO 1.8 V to 5.5 V"
abs_max_basis = "Microchip MCP2561/2 DS20005167C, Absolute Maximum Ratings p.8: VIO 7.0 V"

[[models.envelope]]
kind = "input_tolerance"
pins = ["canh", "canl"]
max_v = 58.0
abs_max_v = 58.0
basis = "Microchip MCP2561/2 DS20005167C, Absolute Maximum Ratings p.8: DC voltage at CANH, CANL -58 V to +58 V (no separate recommended window is printed; the receiver common-mode range -12 V to 12 V is a characterization condition, p.10 Note 3)"
abs_max_basis = "Microchip MCP2561/2 DS20005167C, Absolute Maximum Ratings p.8: DC voltage at CANH, CANL -58 V to +58 V"

[models.behavioral.pins.txd]
# p.5 1.7.1: TXD is connected to an internal pull-up resistor (nominal 33 kOhm) to VIO (VDD on the MCP2561).
pull_to = "vio"
pull_ohms = 33000.0

[models.behavioral.pins.stby]
# p.5 1.7.9: internal MOS pull-up to VIO whose value depends on the supply: 660 kOhm at 5 V, 1.1 MOhm at 3.3 V, 4.4 MOhm at 1.8 V.
# The 5 V figure is stored (SCHEMA GAP: no supply-dependent pull value); the direction (floating = high = standby) is what a check reads.
pull_to = "vio"
pull_ohms = 660000.0

[[models.behavioral.laws]]
name = "supply_draw"
kind = "current"
a = "vdd"
b = "gnd"
# STBY above half of VIO (ASSUMED switching point, midway between 0.3 VIO and 0.7 VIO): standby current; else the recessive normal-mode current.
expr = "min(1.0, max(0.0, v_vdd / supply_on_v)) * if(v_stby > 0.5 * v_vio, standby_current_a, supply_current_a)"

[[models.behavioral.laws]]
name = "vio_draw"
kind = "current"
a = "vio"
b = "gnd"
expr = "min(1.0, max(0.0, v_vio / vio_on_v)) * if(v_stby > 0.5 * v_vio, io_standby_current_a, io_supply_current_a)"

