# ─────────────────────────────────────────────────────────────────────────────
# MAX232 / MAX232I (TI): 5 V dual EIA-232 driver/receiver, 16-pin SOIC (D), SOIC wide (DW), PDIP (N), SOP (NS).
# Source: TI SLLS047N (February 1989, revised February 2024), sha256
# 47d45fefa0db5981246ce9e8cc336cbb19ba1b369b09e4335bc75ded732d0345 (byte-identical to ti.com/lit/ds/symlink/max232.pdf of 2026-10-22).
# Figure 4-1 p.3: "MAX232: D, DW, N or NS Package; MAX232I: D, DW, or N Package" (the I grade is not offered in SOP-NS). Table 4-1 p.3 omits
# pin 12 (R1OUT) from its rows; Figure 4-1 and Figure 8-1 p.10 both place R1OUT on pin 12, so pin 12 is read from them.
# All four packages share one pin map, so one card.
# CAPACITORS: C1 to C4 = 1 uF, nonpolarised ceramic acceptable, polarised ones as drawn in Figure 8-1 p.10 ("C3 can be connected to
# VCC or GND"), CBYPASS 1 uF at VCC (p.10, Figure 8-4 layout p.11); VCC 5 V +-0.5 V. The text notes the MAX202 (a different part) can use 0.1 uF.
# Figure 8-1 annotates VS+ at 8.5 V and VS- at -8.5 V (a figure label, not a table row).
# SIBLINGS NOT MATCHED: MAX232A, MAX232E, MAX232CPE, MAX232ACSE, MAX232EPE (Maxim/ADI parts with their own datasheets),
# MAX3232 (3 V to 5.5 V, own card), MAX202, MAX2320, MAX3232E.
# NOT MODELLED: VS+ / VS- rails and the driver +-7 V swing, receiver thresholds, timing (120 kbit/s), slew rate, short-circuit
# current, ESD (2 kV HBM), the internal pull-up on TIN (p.9 7.3.2) and the open-RIN-reads-high rule.
[[models]]
id = "max232"
kind = "digital"
description = "TI MAX232 / MAX232I 5-V dual EIA-232 driver/receiver, 16-pin SOIC (D, DW), PDIP (N), SOP (NS): VCC supply draw, logic levels and pin roles (behavioural pump, drivers and receivers not modelled)"

[models.match]
# TI orderable codes from the p.12 addendum: MAX232{,I}{D,DR,DRG4,DW,DWG4,DWR,DWRG4,N,NE4} and MAX232NSR, plus the .A/.B suffixed
# orderables and the bare MAX232 / MAX232I. Rejects MAX232A, MAX232E, MAX232CPE, MAX232ACSE, MAX3232, MAX2320.
value_re = "(?i)^MAX232(?:I?(?:D|DR|DRG4|DW|DWG4|DWR|DWRG4|N|NE4)|NSR|I)?(?:\\.[AB])?$"

[models.params]
supply_current_a = 0.008     # [TI] p.5 Table 5.5, ICC 8 mA typ, 10 mA max, VCC = 5.5 V, all outputs open, TA = 25 C
supply_on_v = 4.5            # [TI] p.4, ROC VCC minimum
vih = 2.0                    # [TI] p.4, T1IN/T2IN VIH min
vil = 0.8                    # [TI] p.4, T1IN/T2IN VIL max
voh = { min = 3.5, unit = "V", conditions = "VCC = 5 V, IOH = -1 mA", basis = "TI MAX232 SLLS047N p.5 Table 5.7 receiver VOH min at IOH = -1 mA" }
vol = { max = 0.4, unit = "V", conditions = "VCC = 5 V, IOL = 3.2 mA", basis = "TI MAX232 SLLS047N p.5 Table 5.7 receiver VOL max at IOL = 3.2 mA" }
warning = "source-bound supply and level model: the 8 mA typical (10 mA max) no-load ICC at VCC = 5.5 V, the 4.5 V to 5.5 V VCC range, TIN levels (VIH 2 V, VIL 0.8 V) and receiver output levels (VOH 3.5 V min, VOL 0.4 V max) are carried; the VS+ / VS- charge-pump rails (+-8.5 V in the application figure), the +-7 V typical driver swing, receiver thresholds, 120 kbit/s timing and short-circuit current are not represented, and a loaded driver draws more than the no-load figure"

[models.pins]
# [TI] p.3 Figure 4-1 / Table 4-1, D, DW, N and NS packages, identical numbering (pin 12 from the figure, see header).
"1"  = "c1p"      # C1+
"2"  = "vpos"     # VS+, charge-pump positive output, storage capacitor only
"3"  = "c1n"      # C1-
"4"  = "c2p"      # C2+
"5"  = "c2n"      # C2-
"6"  = "vneg"     # VS-, charge-pump negative output, storage capacitor only
"7"  = "dout2"    # T2OUT
"8"  = "rin2"     # R2IN
"9"  = "rout2"    # R2OUT
"10" = "din2"     # T2IN
"11" = "din1"     # T1IN
"12" = "rout1"    # R1OUT
"13" = "rin1"     # R1IN
"14" = "dout1"    # T1OUT
"15" = "gnd"
"16" = "vcc"

[models.ratings]
max_voltage_v = 6.0            # [TI] p.4 Table 5.1, VCC -0.3 V to 6 V (VS+ up to 15 V, VS- to -15 V are per-pin)
max_junction_temp_c = 150.0    # [TI] p.4 Table 5.1, operating virtual junction temperature 150 C
theta_ja_c_per_w = 88.5        # [TI] p.4 Table 5.4, RthetaJA, highest of the four packages (SOP NS); the per-package rows are below
# max_pin_current_a is left absent: Table 5.6 prints IOS only as a +-10 mA TYPICAL and the abs-max table prints "unlimited" short-circuit duration.

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 4.5
max_v = 5.5
abs_max_v = 6.0
basis = "TI MAX232 SLLS047N, 5.3 Recommended Operating Conditions p.4: VCC 4.5 V to 5.5 V"
abs_max_basis = "TI MAX232 SLLS047N, 5.1 Absolute Maximum Ratings p.4: VCC -0.3 V to 6 V"

[[models.envelope]]
kind = "input_tolerance"
pins = ["rin1", "rin2"]
max_v = 30.0
abs_max_v = 30.0
basis = "TI MAX232 SLLS047N, 5.3 Recommended Operating Conditions p.4: receiver input voltage R1IN, R2IN +-30 V"
abs_max_basis = "TI MAX232 SLLS047N, 5.1 Absolute Maximum Ratings p.4: R1IN, R2IN +-30 V"

[[models.behavioral.laws]]
name = "supply_draw"
kind = "current"
a = "vcc"
b = "gnd"
expr = "supply_current_a * min(1.0, max(0.0, v_vcc / supply_on_v))"

