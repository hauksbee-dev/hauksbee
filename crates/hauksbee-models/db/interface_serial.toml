# -----------------------------------------------------------------------------

# MAX485: Maxim/Analog Devices low-power RS-485/RS-422 half-duplex transceiver, 5 V, not slew-rate limited (2.5 Mbps), no shutdown mode.
# Card 1 covers the 8-pin plastic DIP (P8-1), 8-pin SO (S8-2) and 8-pin CERDIP (J8-2), which share one top view; the 8-pin uMAX has a
# different pin order and its own card (max485_umax). The MAX481 (shutdown), MAX483/MAX487 (slew-rate limited), MAX1487 and the full-duplex
# MAX488-MAX491 share the datasheet but have their own columns and are not matched; the ESD-protected MAX485E is a different datasheet.
[[models]]
id = "max485"
kind = "digital"
description = "Maxim/ADI MAX485 5 V half-duplex RS-485/RS-422 transceiver, 8-pin DIP / SO / CERDIP (pin map, DE and RE# control, receiver thresholds, supply range; bus not modelled)"

[models.source]
tier = "curated-library"
validation = "datasheet-curves"
[[models.source.references]]
url = "https://www.analog.com/media/en/technical-documentation/data-sheets/MAX1487-MAX491.pdf"
title = "Maxim Integrated MAX481/MAX483/MAX485/MAX487-MAX491/MAX1487 Low-Power, Slew-Rate-Limited RS-485/RS-422 Transceivers datasheet, 19-0122, Rev 10, 9/14 (copy from the Internet Archive capture of the analog.com file)"
locator = "Pin Description and Figure 1 pp.7-8 (DIP/SO and uMAX columns); Absolute Maximum Ratings p.2; DC Electrical Characteristics pp.2-3; Switching Characteristics MAX481/MAX485 p.3; Function Tables p.10; Ordering Information p.15; Package Information p.16"
sha256 = "b7888c0d45b0dc581a11cbc10cc53e2e2563271d5a01baed74dbae2845065d05"
[[models.source.uncertainty]]
status = "unknown"
parameter = "bus_behaviour"
reason = "A and B are one bidirectional differential pin pair (driver outputs and receiver inputs) and the card models neither; RO, the driver outputs, thresholds and fail-safe input are not simulated, so the part stays OPEN"
[[models.source.uncertainty]]
status = "unknown"
parameter = "io_voltage_limit"
reason = "the control inputs, DI and RO are rated to VCC + 0.5 V, a supply-relative figure the input_tolerance envelope cannot express; no input_tolerance record is written"
[[models.source.uncertainty]]
status = "unknown"
parameter = "bus_pin_limits"
reason = "A and B are rated -8 V to +12.5 V (abs max) and operate over -7 V to +12 V common mode; no recommended-operating upper bound is printed, so no input_tolerance record is written"
[[models.source.uncertainty]]
status = "unknown"
parameter = "supply_range_recommended"
reason = "the datasheet prints no Recommended Operating Conditions table; the supply range is the VCC = 5 V +/-5 % test condition, which the Pin Description repeats as 4.75 V <= VCC <= 5.25 V"
[[models.source.uncertainty]]
status = "unknown"
parameter = "package_coverage"
reason = "the MAX485 dice and the MJA (CERDIP, -55 to +125 C) grade share the pin map but the Electrical Characteristics are printed once for all temperature grades"
[[models.source.pinout]]
package = "8 PDIP (P8-1) / 8 SO (S8-2) / 8 CERDIP (J8-2)"
pins = { "1" = "RO", "2" = "RE#", "3" = "DE", "4" = "DI", "5" = "GND", "6" = "A", "7" = "B", "8" = "VCC" }

