# ─────────────────────────────────────────────────────────────────────────────
# SP3485 (MaxLinear, ex-Sipex/Exar): 3.3 V low-power half-duplex RS-485 / RS-422 transceiver, 10 Mbps, 8-pin NSOIC.
# Source: MaxLinear SP3485 datasheet 216DSR00 Rev. 2.0.2 (August 5, 2021), sha256
# e3f71227b89ae4ba0a925dec9138f2ea2746c5651ec593b52bce275cb67dbc70 (byte-identical to maxlinear.com/ds/sp3485.pdf of 2026-10-22).
# The PDF prints ONE package, the 8-pin NSOIC (page 4 pin functions, page 8 mechanical, page 9 ordering: SP3485CN-L, SP3485CN-L/TR 0 C to 70 C,
# SP3485EN-L, SP3485EN-L/TR -40 C to 85 C); it prints no DIP. Pin 1 RO, 2 RE (active low), 3 DE (active high), 4 DI, 5 GND, 6 A (non-inverting
# driver output / receiver input), 7 B, 8 VCC. The sheet has NO Recommended Operating Conditions table: "VCC = 3.3 V +-5 %" is the
# test condition of every electrical row (p.2), so the supply window below is that DERIVED +-5 % (3.135 V to 3.465 V) at note severity.
# SIBLINGS NOT MATCHED: SP3485E (own sheet), SP485 / SP481 / SP483 (5 V parts), SP3481, SN65HVD3485, MAX3485, MAX485, SP3485EEN.
# NOT MODELLED: A/B differential output and receiver thresholds, fail-safe-open input, timing, shutdown wake times, the driver
# current limit (250 mA), ESD (2 kV HBM). The sheet's "-L" suffix marks the lead-free order codes; the non-L code is read as the same die (ASSUMED).
[[models]]
id = "sp3485_soic8"
kind = "digital"
description = "MaxLinear SP3485 3.3 V half-duplex RS-485/RS-422 transceiver, 8-pin NSOIC: VCC supply draw gated by DE/RE, logic levels and pin roles (bus levels and timing not modelled)"

[models.match]
# Orderable codes SP3485{C,E}N-L{,/TR} (p.9) plus the bare SP3485 and the non-lead-free spelling without -L (ASSUMED same die).
value_re = "(?i)^SP3485(?:[CE]N)?(?:-L)?(?:/TR)?$"

[models.params]
supply_current_a = 0.000425     # [MaxLinear] p.3, supply current no load 425 uA typ (2000 uA max), RE, DI = 0 V or VCC, DE = VCC
icc_rx_only_a = 0.0003          # [MaxLinear] p.3, supply current no load 300 uA typ (1500 uA max), RE = 0 V, DE = 0 V
icc_shdn_a = 0.00000005         # [MaxLinear] p.7 Low Power Shutdown Mode: "typically draw only 50nA" with RE high and DE low
supply_on_v = 3.135             # DERIVED: 3.3 V - 5 % (lower edge of the VCC = 3.3 V +-5 % test window, p.2)
in_th_v = 1.4                   # ASSUMED: midway between VIL 0.8 V max and VIH 2.0 V min (DE, DI, RE), p.2
vih = 2.0                       # [MaxLinear] p.2, input high voltage min, applies to DE, DI, RE
vil = 0.8                       # [MaxLinear] p.2, input low voltage max, applies to DE, DI, RE
vol = { max = 0.4, unit = "V", conditions = "VCC = 3.3 V, VID = -200 mV, IOL = 2.5 mA", basis = "MaxLinear SP3485 Rev. 2.0.2 p.3 receiver output voltage LOW max, VID = -200 mV, 2.5 mA" }
voh = { min = 2.9, unit = "V", conditions = "VCC = 3.3 V, VID = 200 mV, IOH = -1.5 mA", basis = "DERIVED: MaxLinear SP3485 Rev. 2.0.2 p.3 receiver output voltage HIGH min is VCC - 0.4 V (rail-relative, no absolute number printed); evaluated at VCC = 3.3 V" }
warning = "source-bound supply and level model: the no-load VCC current (425 uA typical with DE high, 300 uA typical with DE and RE low, 50 nA typical in shutdown with RE high and DE low), the 3.3 V +-5 % window (the only supply range the sheet states) and the DE / DI / RE logic levels are carried; the A/B driver output, receiver thresholds (+-200 mV), fail-safe-open behaviour, timing and short-circuit current are not represented, a driver loaded with 54 Ohm draws far more than the no-load figure, and the sheet states no pull on floating DE or RE"

[models.pins]
# [MaxLinear] p.4 Pin Functions and pinout (top view), 8-pin NSOIC.
"1" = "ro"
"2" = "re_n"    # RE, receiver output enable, active LOW
"3" = "de"      # DE, driver output enable, active HIGH
"4" = "di"
"5" = "gnd"
"6" = "a"       # non-inverting driver output / receiver input
"7" = "b"       # inverting driver output / receiver input
"8" = "vcc"

[models.ratings]
max_voltage_v = 6.0            # [MaxLinear] p.2 Absolute Maximum Ratings, VCC 6.0 V
max_junction_temp_c = 125.0    # [MaxLinear] p.2, maximum junction temperature TJ 125 C
theta_ja_c_per_w = 128.4       # [MaxLinear] p.2, 8-pin NSOIC thetaJA 128.4 C/W
# max_pin_current_a is left absent: the only printed pin current limit is the receiver output current +-60 mA (RO), which is not a limit for A/B.
# Power dissipation 600 mW (derate 6.90 mW/C above 70 C) is kept as a characteristic row, not a rating, because it is temperature-conditioned.

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 3.135
max_v = 3.465
abs_max_v = 6.0
severity = "note"
basis = "DERIVED: MaxLinear SP3485 Rev. 2.0.2 p.2 Electrical Characteristics header prints TAMB = TMIN to TMAX and VCC = 3.3 V +-5 %, the only supply window the sheet states (no Recommended Operating Conditions table); 3.3 V - 5 % = 3.135 V, 3.3 V + 5 % = 3.465 V"
abs_max_basis = "MaxLinear SP3485 Rev. 2.0.2 p.2 Absolute Maximum Ratings: VCC 6.0 V"
note = "the sheet's input-current rows list VCC = 0 V or 3.6 V (p.3) so 3.6 V is exercised by the maker, but the guaranteed window is the 3.3 V +-5 %"

[[models.envelope]]
kind = "input_tolerance"
pins = ["de", "di", "re_n"]
max_v = 5.0
abs_max_v = 6.0
severity = "note"
basis = "MaxLinear SP3485 Rev. 2.0.2 p.1 Features: interoperable with 5.0 V logic"
abs_max_basis = "MaxLinear SP3485 Rev. 2.0.2 p.2 Absolute Maximum Ratings: logic input voltages -0.3 V to 6.0 V"

[[models.envelope]]
kind = "input_tolerance"
pins = ["a", "b"]
max_v = 12.0
abs_max_v = 15.0
basis = "MaxLinear SP3485 Rev. 2.0.2 p.1 Features and p.3: common-mode input voltage range -7 V to +12 V"
abs_max_basis = "MaxLinear SP3485 Rev. 2.0.2 p.2 Absolute Maximum Ratings: receiver inputs +-15 V and driver outputs +-15 V"

[[models.behavioral.laws]]
name = "supply_draw"
kind = "current"
a = "vcc"
b = "gnd"
# DE high: driver-enabled current; else RE high with DE low: shutdown; else (DE low, RE low) receiver only.
expr = "min(1.0, max(0.0, v_vcc / supply_on_v)) * if(v_de > in_th_v, supply_current_a, if(v_re_n > in_th_v, icc_shdn_a, icc_rx_only_a))"

