# -----------------------------------------------------------------------------

# Official transceiver cards (serial_logic batch): MAX3232, MAX232, SP3485, MCP2562, MCP2562FD.
# Written only from the vendor PDFs listed in each card's [[models.source.references]]; a value the PDF does not print is
# absent. Every card is a source-bound DC / supply model: pin roles, supply ranges, absolute ratings, logic levels, supply
# draw, thermal rows per package. Bus timing, driver/receiver switching, charge-pump rails and slew are NOT modelled.

# ─────────────────────────────────────────────────────────────────────────────
# MAX3232 (TI): 3 V to 5.5 V dual RS-232 driver/receiver, +-15 kV ESD, 16-pin SOIC (D), SSOP (DB), SOIC wide (DW), TSSOP (PW).
# Source: TI SLLS410O (January 2000, revised June 2021), sha256
# f8497fd138dd31accec7a08d77d79218dd982325eb2d985fd04b3f6573818849 (byte-identical to the ti.com/lit/ds/symlink/max3232.pdf fetch of 2026-10-22).
# Pin Configuration Figure 5-1 and Table 5-1 p.3 (one pin map for D, DB, DW and PW). Absolute maximum p.4, ROC p.4, thermal p.5.
#
# CHARGE-PUMP CAPACITORS (no schema field; kept as characteristic rows and here). Figure 9-1 p.11: C1 across C1+/C1-, C2 across
# C2+/C2-, C3 from V+ (to VCC or GND, "C3 can be connected to VCC or GND"), C4 from V- to GND, CBYPASS 0.1 uF at VCC. Table 9-1 p.12:
#   VCC 3.3 V +-0.3 V : C1 0.1 uF, C2/C3/C4 0.1 uF
#   VCC 5 V +-0.5 V   : C1 0.047 uF, C2/C3/C4 0.33 uF
#   VCC 3 V to 5.5 V  : C1 0.1 uF, C2/C3/C4 0.47 uF
# Polarised capacitors (tantalum, electrolytic) must be connected as drawn in Figure 9-1 (polarity marks); ceramic is fine.
# All datasheet electrical rows are measured with those capacitors (p.4 ROC footnote, p.5-6 footnotes).
#
# SIBLINGS NOT MATCHED (own datasheets): MAX3232E / MAX3232ECPE / MAX3232ESE / MAX3232EEUE / MAX3232CSE+ (Maxim/ADI E series, 19-1298),
# SN65C3232, SN75C3232 (the sheet names them as alternatives), MAX3237E, MAX3222, MAX232, MAX32320. The QFN-less sheet prints no
# other package; the -EP enhanced-product variant is a different document and is not matched.
# NOT MODELLED: V+ / V- pump rail voltages (the sheet prints no V+/V- operating value), driver and receiver switching,
# slew rate (30 V/us max), 250 kbit/s data rate, pulse skew, ESD, the driver output-current limit (IOS), the receiver input
# clamp. DIN is inverting (DIN low gives DOUT high) and an open RIN reads ROUT high (Tables 8-1, 8-2 p.10).
[[models]]
id = "max3232"
kind = "digital"
description = "TI MAX3232 3-V to 5.5-V dual RS-232 line driver/receiver, 16-pin SOIC (D, DW), SSOP (DB), TSSOP (PW): VCC supply draw, logic levels and pin roles (behavioural pump, drivers and receivers not modelled)"

[models.match]
# TI orderable codes MAX3232{C,I}{D,DB,DW,PW}{,R}{,E4,G4,1G4} (p.14 addendum) and the bare MAX3232 / MAX3232C / MAX3232I.
# Rejects MAX3232E*, SN65C3232, MAX3237E, MAX232*, MAX3222*.
value_re = "(?i)^MAX3232(?:[CI](?:D|DR|DR1G4|DRG4|DB|DBR|DBRE4|DW|DWR|DWRG4|PW|PWR|PWRE4|PWRG4)?)?(?:\\.[AB])?$"

[models.params]
supply_current_a = 0.0003    # [TI] p.5 Table 6.5, ICC 0.3 mA typ, no load, VCC = 3.3 V to 5 V (1 mA max)
supply_on_v = 3.0            # [TI] p.4, ROC VCC minimum 3 V (3.3 V supply)
vih = 2.0                    # [TI] p.4, DIN VIH min at VCC = 3.3 V (2.4 V at 5 V; see [models.levels])
vil = 0.8                    # [TI] p.4, DIN VIL max
vol = { max = 0.4, unit = "V", conditions = "VCC = 3.3 V, IOL = 1.6 mA", basis = "TI MAX3232 SLLS410O p.6 Table 6.7 receiver VOL max at IOL = 1.6 mA" }
voh = { min = 2.7, unit = "V", conditions = "VCC = 3.3 V, IOH = -1 mA", basis = "DERIVED: p.6 Table 6.7 receiver VOH min is VCC - 0.6 V (rail-relative, no absolute number printed); evaluated at VCC = 3.3 V" }
warning = "source-bound supply and level model: the 0.3 mA typical no-load ICC (1 mA max), the 3 V to 5.5 V VCC range, DIN levels (VIH 2.0 V at 3.3 V, 2.4 V at 5 V; VIL 0.8 V) and receiver output levels are carried; the charge-pump V+ / V- rails, RS-232 driver output swing (+-5.4 V typical at 3 kOhm), receiver thresholds, 250 kbit/s timing and the output current limit are not represented, and a loaded driver draws more than the no-load figure"

[models.levels]
# [TI] p.4 ROC DIN VIH: 2 V min at VCC = 3.3 V, 2.4 V min at VCC = 5 V.
vih = [[3.3, 2.0], [5.0, 2.4]]
# The receiver VOH and VOL are printed at heavy test currents (IOH = -1 mA, IOL = 1.6 mA); the loader turns them into light-load levels plus an output resistance.

[models.pins]
# [TI] p.3 Figure 5-1 / Table 5-1, D, DB, DW and PW packages, identical numbering.
"1"  = "c1p"      # C1+
"2"  = "vpos"     # V+, charge-pump positive output, storage capacitor only
"3"  = "c1n"      # C1-
"4"  = "c2p"      # C2+
"5"  = "c2n"      # C2-
"6"  = "vneg"     # V-, charge-pump negative output, storage capacitor only
"7"  = "dout2"
"8"  = "rin2"
"9"  = "rout2"
"10" = "din2"
"11" = "din1"
"12" = "rout1"
"13" = "rin1"
"14" = "dout1"
"15" = "gnd"
"16" = "vcc"

[models.ratings]
max_voltage_v = 6.0            # [TI] p.4 Table 6.1, VCC -0.3 V to 6 V (V+ 7 V, V- -7 V, V+ - V- 13 V, RIN +-25 V, DOUT +-13.2 V are per-pin)
max_pin_current_a = 0.06       # [TI] p.5 Table 6.6, IOS short-circuit output current 60 mA max (35 mA typ), one output shorted at a time
max_junction_temp_c = 150.0    # [TI] p.4 Table 6.1, operating virtual junction temperature 150 C
theta_ja_c_per_w = 108.2       # [TI] p.5 Table 6.4, RthetaJA, highest of the four packages (TSSOP PW); the per-package rows are below

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 3.0
max_v = 5.5
abs_max_v = 6.0
basis = "TI MAX3232 SLLS410O, 6.3 Recommended Operating Conditions p.4: VCC 3 V to 3.6 V (3.3 V) or 4.5 V to 5.5 V (5 V); the 3.6 V to 4.5 V gap is not modelled as forbidden"
abs_max_basis = "TI MAX3232 SLLS410O, 6.1 Absolute Maximum Ratings p.4: VCC -0.3 V to 6 V"

[[models.envelope]]
