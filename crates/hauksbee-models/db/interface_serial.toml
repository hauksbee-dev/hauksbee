[models.match]
# FT232RL is the SSOP-28 part; packing codes printed in section 1.2 (p.3) are Reel and Tube for the SSOP.
# The QFN-32 FT232RQ has a different pin order and is its own card; the bare "FT232R" names no package
# and the FT232H, FT231X, FT2232 and FT232BM/BL families are different parts, so none resolve here.
value_re = "(?i)^FT232RL([-_ ]?(REEL|TUBE))?$"

[models.params]
# Table 5.4 (p.16), VCCIO = 3.3 V, standard drive. The 5.0 V, 2.8 V and 1.8 V columns are in the
# characteristic rows; the VCCIO of the board sets which applies. VOH and VOL are printed at the
# table's test currents (a loaded level), so they are rows.
voh = { min = 2.2, unit = "V", conditions = "VCCIO = 3.3 V, standard drive, I source = 1 mA", basis = "FTDI FT232R FT_000053 v2.16 Table 5.4 (p.16) Voh row, minimum column" }
vol = { max = 0.5, unit = "V", conditions = "VCCIO = 3.3 V, standard drive, I sink = 2 mA", basis = "FTDI FT232R FT_000053 v2.16 Table 5.4 (p.16) Vol row, maximum column" }
# No VIH/VIL is printed. The Vin switching threshold is 1.0 V to 1.5 V (Tables 5.3 to 5.10, the same at
# every VCCIO), so a level above its maximum reads high and below its minimum reads low. Not a
# printed VIH/VIL; the values are the printed Vin limits.
vih = 1.5
vil = 1.0
supply_static_ua = 15000.0   # Table 5.2 Icc1 typical, normal operation (15 mA); USB-suspend Icc2 is 70 uA typical and is not the operating figure
supply_pin = "20"   # VCC
gnd_pin    = "7"
# TEST has no internal pull and must be tied to GND (Table 3.3 / 3.7: "Must be tied to GND for normal
# operation, otherwise the device will appear to fail"). RESET# may be left unconnected or pulled to
# VCC (same tables), so it is not listed.
must_not_float_roles = "test"
warning = """the USB stack is not modelled: TXD, DTR# and RTS# carry no driver and the bridge sources \
or answers no UART traffic, so a result that depends on data arriving through it is not evidence; the \
3V3OUT LDO, the input pull-ups and the VCCIO levels are modelled; the CBUS pads are named by pad and \
their function is EEPROM-configured"""

[models.pins]
"1" = "txd"  # UART data out (not driven; see the warning)
"2" = "dtr_n"  # modem-status output
"3" = "rts_n"  # flow-control output
"4" = "vccio"  # UART and CBUS I/O-ring supply, 1.8 V to 5.25 V; sets every level
"5" = "rxd"  # UART data in
"6" = "ri_n"  # ring indicator input
"7" = "gnd"  # device ground
"8" = "nc"  # no internal connection
"9" = "dsr_n"  # modem-status input
"10" = "dcd_n"  # modem-status input
"11" = "cts_n"  # flow-control input
"12" = "cbus4"  # EEPROM-configured output only; factory default SLEEP#
"13" = "cbus2"  # EEPROM-configured; factory default TXDEN
"14" = "cbus3"  # EEPROM-configured; factory default PWREN# (needs a 10 kOhm pull-up)
"15" = "usbdp"  # USB D+ with internal series resistor and 1.5 kOhm pull-up to 3V3OUT; no USB stack
"16" = "usbdm"  # USB D-
"17" = "v3v3out"  # internal 3.3 V LDO output, 50 mA (behavioral law below)
"18" = "gnd2"
"19" = "reset_n"  # active-low reset input; may be left unconnected or pulled up to VCC
"20" = "vcc"  # core supply
"21" = "gnd3"
"22" = "cbus1"  # EEPROM-configured; factory default RXLED#
"23" = "cbus0"  # EEPROM-configured; factory default TXLED#
"24" = "nc2"  # no internal connection
"25" = "agnd"  # analogue ground for the internal clock multiplier
"26" = "test"  # IC test mode input; must be tied to GND for normal operation
"27" = "osci"  # 12 MHz oscillator input, optional
"28" = "osco"  # 12 MHz oscillator output, optional

[models.ratings]
# Table 5.1 (p.15). VCC supply -0.5 V to +6.00 V is the figure here; the other limits are in the notes.
max_voltage_v = 6.0
max_pin_current_a = 0.024   # DC output current, outputs and low-impedance bidirectional (24 mA)
max_power_w = 0.5           # power dissipation at VCC = 5.25 V (500 mW)
theta_ja_c_per_w = 55.82   # Table 5.16 (p.18), still air
theta_jc_c_per_w = 24.04   # Table 5.16

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 4.0
max_v = 5.25
abs_max_v = 6.0
basis = "FTDI FT232R FT_000053 v2.16 Table 5.2 (p.15) VCC1 operating supply 4.0 V to 5.25 V using the internal oscillator (3.3 V needs the EEPROM-enabled external oscillator, section 7.6 p.29); Table 5.1 (p.15) Absolute Maximum Ratings VCC supply voltage -0.5 V to +6.00 V"

[[models.envelope]]
kind = "supply_range"
pin = "vccio"
min_v = 1.8
max_v = 5.25
basis = "FTDI FT232R FT_000053 v2.16 Table 5.2 (p.15) VCC2 VCCIO operating supply 1.8 V to 5.25 V; Table 5.1 prints no separate VCCIO absolute maximum, so none is carried"

# Internal 3.3 V LDO on 3V3OUT (Table 3.2 / 3.6, section 4.2, Table 5.2). With VCC above 3.3 V it holds
# 3V3OUT at 3.3 V; below that `min(v_vcc, 3.3)` passes VCC through, which is an assumption (see the
# uncertainty record). The 1 Ohm source resistance is assumed as well; at or below
# `rail_owner::SERIES_OHMS` it makes the law the supply of the net it drives, so a rail fed only from
# 3V3OUT takes no name-derived ideal source beside it.
[[models.behavioral.laws]]
name = "ldo_3v3out"
kind = "voltage"
a = "v3v3out"
b = "gnd"
expr = "max(0.0, min(v_vcc, 3.3))"
r_ohms = 1.0

# Table 3.4 note 3 / Table 3.8 note 3: input pins are pulled to VCCIO through internal 200 kOhm
# resistors (the ** note under Table 5.10 repeats it: only input pins have the pull-up).
[models.behavioral.pins.rxd]
pull_to = "vccio"
pull_ohms = 200000.0

[models.behavioral.pins.cts_n]
pull_to = "vccio"
pull_ohms = 200000.0

[models.behavioral.pins.dsr_n]
pull_to = "vccio"
pull_ohms = 200000.0

[models.behavioral.pins.dcd_n]
pull_to = "vccio"
pull_ohms = 200000.0

[models.behavioral.pins.ri_n]
pull_to = "vccio"
pull_ohms = 200000.0

[models.coverage]
implements = ["pin_roles", "vccio_logic_levels", "internal_3v3_ldo", "input_pullups", "operating_supply_current", "supply_ranges", "absolute_ratings"]
missing = ["usb_stack", "uart_traffic", "txd_rts_dtr_drive", "cbus_functions", "ldo_dropout", "reset_generator", "usb_suspend_current", "high_drive_levels", "external_oscillator_option", "peripheral_register_map"]


# ─────────────────────────────────────────────────────────────────────────────
# FT232RQ: the QFN-32 ordering code of the same FTDI FT232R bridge as the FT232RL card above.
# Source: the same FT_000053 Version 2.16 datasheet (sha256
# ab81490c3ddaf5edc26e1e271490a2891683d3ef5fc199c62236aa5b0ec6b087); the pin map is section 3.4
# QFN-32 Package Signal Description, Tables 3.5 to 3.8 (pp.9-10), read against Figure 3.2 (p.9). Everything
# electrical is package-independent in the datasheet and is the FT232RL card's, with the same caveats; the
# QFN-32 has a centre pad (section 9.2 p.32: "not internally connected, and can be left unconnected, or
# connected to ground (recommended)") that the SSOP does not.
# The datasheet does not number the centre pad. It is keyed "33" (the next number, as KiCad's QFN-32-1EP
# lands call it) and "EP" (the Eagle spelling), as the ft231x card keys its exposed pad.
# ABSENT: the same values as the FT232RL card; also the QFN theta-JC (Table 5.17 leaves it blank).

[[models]]
id = "ft232rq"
kind = "digital"
description = "FTDI FT232RQ USB-to-UART bridge, QFN-32 (pad map, VCCIO levels, internal 3V3OUT LDO and input pull-ups; no USB stack)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
