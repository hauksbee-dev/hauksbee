[models.match]
# Product Identification System (p.77): MCP2221A (T = tape and reel), temperature range I, package P (PDIP-14),
# SL (SOIC-14) or ST (TSSOP-14). The package is read from the suffix, so the bare value "MCP2221A" (package
# unknowable) and the ML (QFN-16) suffix do not resolve here; MCP2221 without the A is a different part.
value_re = "(?i)^MCP2221AT?[-_ ]?I[-/_ ]?(P|SL|ST)$"

[models.params]
# DERIVED levels at VDD = 3.3 V (the card's flat values; [models.levels] carries 3.0 V to 5.5 V). The
# URX Schmitt-trigger thresholds are printed as 0.2 VDD (VIL max) and 0.8 VDD (VIH min), and VOH min as
# VDD - 0.7 V, so a number only exists once a VDD is chosen.
voh = { min = 2.6, unit = "V", conditions = "VDD = 3.3 V, IOH = -3.0 mA", basis = "derived: Microchip MCP2221A DS20005565B D090 (p.58) VOH minimum is VDD - 0.7 V, taken at VDD = 3.3 V" }
vol = { max = 0.6, unit = "V", conditions = "VDD = 3.3 V, IOL = 6.0 mA", basis = "Microchip MCP2221A DS20005565B DC Characteristics D080 (p.58) second line, maximum column" }
vih = { min = 2.64, unit = "V", conditions = "VDD = 3.3 V, URX Schmitt trigger", basis = "derived: Microchip MCP2221A DS20005565B D041 (p.58) VIH minimum is 0.8 VDD, taken at VDD = 3.3 V" }
vil = { max = 0.66, unit = "V", conditions = "VDD = 3.3 V, URX Schmitt trigger", basis = "derived: Microchip MCP2221A DS20005565B D031 (p.58) VIL maximum is 0.2 VDD, taken at VDD = 3.3 V" }
supply_static_ua = 13000.0   # D004 IDD typical at VDD = 5.0 V (15 mA max); 10 mA typical at 3.0 V; standby IDDS is 46 uA typical
supply_pin = "1"   # VDD
gnd_pin    = "14"   # VSS
identity_only = true   # the USB stack and UART are not modelled, so no output level is driven; the printed VOH row (IOH = -3 mA) stays as written
unlocked_by = "a USB-to-UART/I2C bridge model that drives TXD and the GP pads from host traffic"
warning = """the USB stack is not modelled: the bridge neither enumerates nor sources or answers UART or I2C \
traffic, so a result that depends on data crossing it is not evidence; the supply and USB voltage ranges, the \
input levels and the pad map are modelled; the GP0 to GP3 pads are named by pad and their function is \
configured in the chip settings (factory defaults LED_URX, LED_UTX, USBCFG, LED_I2C)"""

[models.levels]
# DERIVED corners, ascending [VDD, volts] over the printed 3.0 V to 5.5 V supply range: VIH min is 0.8 VDD
# (D041), VIL max is 0.2 VDD (D031), VOH min is VDD - 0.7 V (D090). The ratios are the URX Schmitt-trigger
# figures applied to every input; see the gp_pin_input_levels uncertainty record.
vih = [[3.0, 2.4], [5.5, 4.4]]
vil = [[3.0, 0.6], [5.5, 1.1]]
voh = [[3.0, 2.3], [5.5, 4.8]]

[models.pins]
"1" = "vdd"  # power; 3.0 V to 5.5 V; sets the GP and UART logic levels
"2" = "gp0"  # GPIO / SSPND / LED_URX (factory default LED_URX), Table 1-1 and Table 1-5
"3" = "gp1"  # GPIO / CLKR / ADC1 / LED_UTX / IOC (factory default LED_UTX)
"4" = "rst_n"  # reset input with an internal pull-up (value not printed)
"5" = "rxd"  # UART RX input (printed URX): receives from the host system's TXD
"6" = "txd"  # UART TX output (printed UTX); not driven here
"7" = "gp2"  # GPIO / USBCFG / ADC2 / DAC1 (factory default USBCFG)
"8" = "gp3"  # GPIO / LED_I2C / ADC3 / DAC2 (factory default LED_I2C)
"9" = "sda"  # I2C data line (master)
"10" = "scl"  # I2C clock line (master)
"11" = "vusb"  # USB power pin, internally connected to the 3.3 V transceiver LDO; bypass with a ceramic capacitor
"12" = "usbdm"  # USB D-
"13" = "usbdp"  # USB D+
"14" = "gnd"  # ground (printed VSS)

[models.ratings]
# Absolute Maximum Ratings (p.57) and Table 4-4 (p.60).
max_voltage_v = 6.0          # VDD with respect to VSS, -0.3 V to +6.0 V
max_current_a = 0.095        # maximum current into VDD (and out of VSS)
max_pin_current_a = 0.025    # maximum output current sunk or sourced by any I/O pin
max_power_w = 0.8           # total power dissipation
max_junction_temp_c = 150.0  # Table 4-4 TH03 TJMAX
theta_ja_c_per_w = 100.0   # Table 4-4 (p.60) TH01, TSSOP the least favourable of PDIP 70, SOIC 95.3, TSSOP 100

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 3.0
max_v = 5.5
abs_max_v = 6.0
basis = "Microchip MCP2221A DS20005565B DC Characteristics D001 (p.58) supply voltage 3.0 V to 5.5 V; Absolute Maximum Ratings (p.57) voltage on VDD with respect to VSS -0.3 V to +6.0 V"

[[models.envelope]]
kind = "supply_range"
pin = "vusb"
min_v = 3.0
max_v = 3.6
abs_max_v = 4.0
basis = "Microchip MCP2221A DS20005565B Table 4-1 (p.59) D313 USB voltage 3.0 V to 3.6 V for proper USB operation; Absolute Maximum Ratings (p.57) voltage on VUSB pin with respect to VSS -0.3 V to +4.0 V"

[models.coverage]
implements = ["pin_roles", "gp_default_functions", "input_logic_levels", "operating_supply_current", "supply_ranges", "absolute_ratings"]
missing = ["usb_stack", "uart_traffic", "i2c_master", "i2c_pin_levels", "gp_pin_function_configuration", "adc_dac", "clock_output", "rst_pull_up_value", "vusb_ldo", "vusb_vdd_ordering", "peripheral_register_map"]


# ─────────────────────────────────────────────────────────────────────────────
# MCP2221A, 16-pin 4 x 4 mm QFN (ordering codes MCP2221A-I/ML and MCP2221AT-I/ML).
# Source: the same DS20005565B (July 2017) datasheet as the 14-pin card (sha256
# 7760f2692b2469e1b0290244de95d73e75adfc27229182406be012e4cd688fcb); the pin map is the
# QFN column of Table 1-1 (p.3), read against the Package Types figure (p.2). Everything electrical is
# package-independent in the datasheet and is the 14-pin card's, with the same caveats; the QFN adds two NC pads
# (14, 15) and an exposed thermal pad (17) that Table 1-1 says not to connect electrically.
# ABSENT: the same values as the 14-pin card.

[[models]]
id = "mcp2221a_qfn16"
kind = "digital"
description = "Microchip MCP2221A USB 2.0 to I2C/UART protocol converter with GPIO, QFN-16 4 x 4 mm with exposed pad (pad map, supply and USB ranges, input levels; no USB stack, no I2C master)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://ww1.microchip.com/downloads/en/DeviceDoc/20005565B.pdf"
title = "Microchip MCP2221A USB 2.0 to I2C/UART Protocol Converter with GPIO datasheet, DS20005565B (July 2017)"
locator = "Table 1-1 Pinout Description p.3 (QFN column); Package Types p.2; Table 1-5 GP Designation p.19; Absolute Maximum Ratings p.57; 4.1 DC Characteristics p.58; Table 4-1 p.59; Table 4-4 Thermal p.60; Table 4-6 p.62; Product Identification System p.77"
sha256 = "7760f2692b2469e1b0290244de95d73e75adfc27229182406be012e4cd688fcb"
[[models.source.uncertainty]]
status = "unknown"
parameter = "gp_pin_input_levels"
reason = "the GP pins' TTL thresholds (VIL 0.8 V max, VIH 2.0 V min, D031 and D041 p.58) are printed only for 4.5 V <= VDD <= 5.5 V; the URX Schmitt-trigger thresholds are 0.2 VDD and 0.8 VDD for 3.0 V <= VDD <= 5.5 V. The input levels in [models.levels] use the Schmitt ratios for every input pin, which is conservative for a GP pin at 5 V"
[[models.source.uncertainty]]
status = "unknown"
parameter = "voh_supply_relative"
reason = "D090 prints the output high voltage as VDD minus 0.7 V at IOH = -3.5 mA (VDD = 5.0 V) and -3.0 mA (VDD = 3.3 V), a supply-relative figure with no number of its own; the levels table carries it as a derived corner"
[[models.source.uncertainty]]
status = "unknown"
parameter = "rst_internal_pull_up"
reason = "Table 1-1 says RST has an internal pull-up but the datasheet prints no resistance, so none is stamped; section 1.11.2 (p.21) suggests tying RST to VDD through 1 to 10 kOhm for the power-on reset delay"
[[models.source.uncertainty]]
status = "unknown"
parameter = "vusb_regulator"
reason = "VUSB is the output of the 3.3 V LDO that powers the USB transceiver (section 1.6.2, p.16) unless it is tied to an external 3.3 V rail, which disables that LDO (section 1.6.2.3 p.18); the LDO's load regulation, dropout and the 0.22 to 0.47 uF bypass are not carried as a source. Note 1 of the Absolute Maximum Ratings (p.57) requires VUSB <= VDD + 0.3 V, which the schema cannot express as a rail order with an offset"
[[models.source.uncertainty]]
status = "unknown"
parameter = "rst_abs_max_voltage"
reason = "the Absolute Maximum Ratings (p.57) allow RST -0.3 V to +9.0 V against VDD -0.3 V to +6.0 V, a pin-specific limit with no recommended-operating counterpart; only the VDD figure is carried"
[[models.source.uncertainty]]
status = "unknown"
parameter = "i2c_pin_levels"
reason = "SDA and SCL print no input-threshold, output-low or load-current figure in the DC characteristics (D080 and D090 name GP and UTX only), so the I2C side's levels and sink current are absent"
[[models.source.uncertainty]]
status = "unknown"
parameter = "gp_adc_dac_electrical"
reason = "the ADC (Table 4-2 p.60, 10 bit, recommended source impedance 10 kOhm) and DAC (Table 4-3, 5 bit, step VDD/32, settling 10 us) are printed but not carried; the pads are named by their GP number and the factory-default and alternate functions are comments"
