# -----------------------------------------------------------------------------

# CH9102X: WCH USB-to-UART bridge, QFN-28 (5 x 5 mm). Same silicon as the F with no VIO pad: VIO is shorted to the 3.3 V V3 regulator output internally, so the
# UART I/O is 3.3 V only. Pad map from the Section 3 package drawing, cross-checked against the Section 4 QFN28 column (V1C); V3 appears on pads 6 and 22, pads 13-15
# are NC (must be left floating), pad 0 is the optional backplane ground (mapped ep).
[[models]]
id = "ch9102x"
kind = "digital"
description = "WCH CH9102X USB-to-UART bridge, QFN-28, 3.3 V UART I/O from the internal V3 regulator (pad map, 3.3 V logic levels, supply range; no USB stack)"

[models.source]
tier = "curated-library"
validation = "datasheet-curves"
[[models.source.references]]
url = "https://akizukidenshi.com/goodsaffix/ch9102.pdf"
title = "WCH CH9102 Datasheet (USB to High Speed Serial Port Chip CH9102), Version 1C, English edition as hosted by Akizuki Denshi"
locator = "3 Packages, CH9102X QF28_5X5 drawing p.2; 4 Pin definitions pp.3-4; 5.2 Power and power consumption pp.5-6; 6.1 Absolute maximum ratings p.8; 6.2 Electrical parameters pp.8-9; 6.3 Timing parameters p.10"
sha256 = "876966aa794ec18d850b622a76386d7565bd76e7f76fdb972b1602172062fb3a"
[[models.source.uncertainty]]
status = "unknown"
parameter = "usb_uart_behavior"
reason = "the USB device, UART traffic, the internal regulator (V3 output, ILDO 10 mA), internal clock, EEPROM configuration and power-on reset are not modelled"
[[models.source.uncertainty]]
status = "unknown"
parameter = "logic_levels_reference"
reason = "the I/O levels are the VIO = 3.3 V rows of 6.2 (VIO is internally the 3.3 V V3 output); the digital kind keys supply current to one supply pin, so supply_pin is VDD5"
[[models.source.uncertainty]]
status = "unknown"
parameter = "thermal_resistance"
reason = "the datasheet prints no thermal resistance or junction rating, only an ambient range"
[[models.source.uncertainty]]
status = "unknown"
parameter = "pin_voltage_limit"
reason = "6.1 limits UART pins to VIO + 0.5 V and USB pins to V3 + 0.5 V, supply-relative figures the input_tolerance envelope cannot express"
[[models.source.uncertainty]]
status = "unknown"
parameter = "package_coverage"
reason = "the CH9102F (QFN-24) has a different pad map and an independent VIO pin and is the separate card ch9102f"
[[models.source.pinout]]
package = "QFN-28 (CH9102X)"
pins = { "0" = "GND (backplane, optional)", "1" = "DCD", "2" = "RI", "3" = "GND", "4" = "UD+", "5" = "UD-", "6" = "V3", "7" = "VDD5", "8" = "VBUS", "9" = "RST#", "10" = "ACT#", "11" = "SUSPEND#", "12" = "SUSPEND", "13" = "NC", "14" = "NC", "15" = "NC", "16" = "WAKEUP/GPIO3", "17" = "TNOW/GPIO2", "18" = "RXS/GPIO1", "19" = "TXS/GPIO0", "20" = "GPIO6", "21" = "GPIO5", "22" = "V3", "23" = "CTS", "24" = "RTS", "25" = "RXD", "26" = "TXD", "27" = "DSR", "28" = "DTR" }

