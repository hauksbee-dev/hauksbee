# STM32F4 samples BOOT0 (with BOOT1=PB2) shortly after reset to pick the boot
# memory. BOOT0=0 -> main flash (normal). BOOT0=1 -> system bootloader / SRAM.
# The STM32F4 BOOT0 pin has NO internal pull, so a floating BOOT0 leaves the boot
# source genuinely undefined and the part can come up in the bootloader instead
# of the application, every ST reference design ties it through an external
# resistor. Ref: ST RM0368 sec 2.4 "Boot configuration"; DS9716 pin definitions.
[[models.straps]]
role = "boot0"
level = "low"
boot_select = true
internal_pull = "none"
note = "BOOT0 low boots main flash; high enters the system bootloader/SRAM"

# Boot-mode table (BOOT STRAPS package): the pins that select the boot source, the
# vendor's table, and where each value comes from.
# Both boot pads are physical pads; BOOT1 is shared with PB2.
[models.strap_latch]
event = "reset_release"
note  = "BOOT1/BOOT0 pin values are latched on the 4th rising edge of SYSCLK after a reset, and re-sampled when exiting Standby; no option bits select the boot source on F401"
cite  = "RM0368 Rev 5, section 2.4 'Boot configuration', Table 2 and text, PDF p.41"

[models.reset_input]
role = "reset"
vil  = [0.3, 0.0]
vih  = [0.7, 0.0]
cite = "DS9716 Rev 11 (STM32F401xB/xC), Table 57 NRST pin characteristics PDF p.94 refers to Table 54 for VIH/VIL; Table 54 PDF p.90 row 'FT, and NRST I/O input low level voltage' 0.3VDD and 'FT and NRST I/O input high level voltage' 0.7VDD; NRST pad 7 (UQFN48), Table 8 PDF p.38"

[[models.boot_inputs]]
role = "boot0"
internal_pull = "unknown"
vil = [0.1, 0.1]
vih = [0.17, 0.7]
cite = "DS9716 Rev 11, Table 54 'I/O static characteristics', PDF p.90: BOOT0 I/O input low level voltage max 0.1VDD+0.1 V, high level min 0.17VDD+0.7 V (1.75 V<=VDD<=3.6 V, -40 to 125 C; the 0 to 125 C row gives the same cells in the text layer, checked on the rendered page); BOOT0 pad 44 (UQFN48), Table 8 PDF p.42"

[[models.boot_inputs]]
role = "pb2_boot1"
internal_pull = "none"
vil = [0.3, 0.0]
vih = [0.7, 0.0]
cite = "DS9716 Rev 11, Table 54 PDF p.90 (FT I/O rows); PB2 is I/O FT, additional function BOOT1, Table 8 PDF p.39, pad 20 (UQFN48). Pull: GPIOB_PUPDR reset value 0x0000 0100 (only PB4 pulled), RM0368 Rev 5 PDF p.159 (reset state, not a datasheet statement about the strap)"

[[models.boot_modes]]
name = "main flash"
when = { boot0 = "low" }
outcome = "user_flash"
detail = "BOOT0 = 0 (BOOT1 don't-care): main Flash memory is selected as the boot space; user firmware runs"
cite = "RM0368 Rev 5, Table 2, PDF p.41"

[[models.boot_modes]]
name = "system memory"
when = { boot0 = "high", pb2_boot1 = "low" }
outcome = "rom_bootloader"
detail = "BOOT1 = 0, BOOT0 = 1: system memory (ST bootloader; USART1 PA9/PA10, USART2 PD5/PD6 which do not exist on a 48-pin package) is the boot space; user firmware does not run"
cite = "RM0368 Rev 5, Table 2, PDF p.41 and bootloader interfaces PDF p.42; AN2606 Rev 70 Table 77 PDF p.170-172"

[[models.boot_modes]]
name = "embedded SRAM"
when = { boot0 = "high", pb2_boot1 = "high" }
outcome = "sram"
detail = "BOOT1 = 1, BOOT0 = 1: embedded SRAM is the boot space"
cite = "RM0368 Rev 5, Table 2, PDF p.41"

