[models.ratings]
max_pin_current_a = 0.025
max_current_a = 0.32
max_voltage_v = 4.0   # DS11532: VDD-VSS -0.3 to 4.0 V

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.7
max_v = 3.6
abs_max_v = 4.0
basis = "ST STM32F777xx DS11532, general operating conditions VDD 1.7 V to 3.6 V; voltage characteristics VDD-VSS -0.3 V to 4.0 V"

# BOOT0 is a dedicated input with no internal bias: low boots the address in
# BOOT_ADD0 (main flash by default), high boots BOOT_ADD1 (system memory by
# default). RM0410 section 2.5.
[[models.straps]]
role = "boot0"
level = "low"
boot_select = true
internal_pull = "none"
note = "BOOT0 low boots BOOT_ADD0 (main flash by default); high boots BOOT_ADD1"

[models.coverage]
implements = ["cortex_m7_firmware_execution", "boot_to_main", "gpio_output_and_direction", "gpio_external_input", "gpio_internal_pulls", "uart_tx", "virtual_clock_and_systick"]
missing = ["adc_injection", "i2c_controller_bridge", "spi_controller_bridge", "clock_tree", "watchdog_reboot_continuation", "instruction_exact_timing", "silicon_power_current_profile", "silicon_timing_and_errata"]
[models.pin_capability.spi_sck]
basis = "STMicroelectronics STM32F777xx/F778Ax/F779xx datasheet DS11243 Rev 8 (file stm32f777-ds11532.pdf), Table 13 'STM32F777xx, STM32F778Ax and STM32F779xx alternate function mapping' AF0..AF15 (PDF page = printed page: port A p.89-90; port B p.90-91; port C p.92-93; port D p.93-94; port E p.94-95), the 80 port pads of this LQFP100 card's pin map (ports A-E; PH0/PH1 are the oscillator pads and carry no peripheral function here): SPI1..SPI6 SCK pads at AF5/AF6/AF7/AF8 as shown in each pad value. USART as SPI master: Table 8 'USART implementation' (p.43) lists Synchronous mode for USART1/2/3/6 only (UART4/5/7/8 have none); the datasheet states no SPI slave role for the USART so these pads are listed master_only; a USART data pad is counted only when that USART's CK pad is in the card's map (all of USART1/2/3/6 CK are on LQFP100 pads). SPI1-SPI6 I2S functions are not counted; hardware peripheral only, a software (bit-banged) implementation can use any pad"
