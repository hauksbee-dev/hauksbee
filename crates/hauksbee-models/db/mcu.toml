basis = "Microchip ATmega48A/PA/88A/PA/168A/PA/328/P Data Sheet Complete DS40002061B (2020), section 20 USART0: Table 20-1 (p.182), Tables 20-2 and 20-3 (p.194), Table 20-7 (pp.198-199)"

[[models.peripherals.uart.clock_sources]]
name = "system clock (fOSC)"
basis = "Table 20-1 note (p.182): fOSC is the System Oscillator clock frequency; the datasheet states no separate UART clock limit"

[models.peripherals.uart.baud]
formula = "BAUD = fOSC / (S * (UBRRn + 1)), S = 16 (U2Xn = 0) or 8 (U2Xn = 1); UBRRn in 0-4095"
divisor_offset = 1.0
fraction_bits = 0
register_bits = 12
oversampling = [16, 8]
basis = "Table 20-1 (p.182): asynchronous normal and double speed equations; UBRRn = contents of UBRRnH and UBRRnL, range 0-4095; section 20.3.2 (p.182) U2Xn halves the divisor from 16 to 8"

[[models.peripherals.uart.max_baud]]
oversampling = 16
baud_hz = 1000000.0
condition = "fOSC = 16 MHz, U2Xn = 0, UBRRn = 0 (fOSC / 16)"
basis = "Table 20-7 (p.199), fosc = 16.0000 MHz column, Max. row: 1 Mbps"

[[models.peripherals.uart.max_baud]]
