status = "unknown"
parameter = "xtal_cap_range"
reason = "DS11243 Rev 8 (STM32F777xx/F778Ax/F779xx) p.136 to p.137, Table 43 HSE 4-26 MHz oscillator characteristics and Figure 30, print no CL1 / CL2 range (the IDD rows quote CL = 5 pF and CL = 10 pF only as measurement conditions, and Figure 30 draws CL1 and CL2 unvalued); no \"pF range\" sentence is printed for this family, so no xtal_cap_min_f / xtal_cap_max_f is stated"

