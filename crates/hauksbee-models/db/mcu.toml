# Section 3.3 Strapping Pins: chip boot mode from GPIO0 and GPIO46, VDD_SPI
# voltage from GPIO45, ROM message printing from GPIO46.
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true   # latches SPI-vs-download boot
# Table 11: VIL max 0.25 x VDD, VIH min 0.75 x VDD.
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = SPI boot (normal); low = download boot"

[[models.straps]]
role = "gpio46"
level = "low"
note = "GPIO46 must be low or floating at reset"

[[models.straps]]
role = "gpio45"
