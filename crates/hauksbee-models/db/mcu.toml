# ATtiny85 (and the low-voltage ATtiny85V), simavr core "attiny85".
#
# Source: Atmel 2586Q-AVR-08/2013 "ATtiny25/45/85", page 2, Figure 1-1 "Pinout
#   ATtiny25/45/85" (PDIP/SOIC/TSSOP 8-pin, and QFN/MLF 20-pad),
#   https://ww1.microchip.com/downloads/en/DeviceDoc/Atmel-2586-AVR-8-bit-Microcontroller-ATtiny25-ATtiny45-ATtiny85_Datasheet.pdf
#   and section 21.1 Absolute Maximum Ratings.
#
# THE TWO PACKAGES NUMBER THE SAME PORT PINS DIFFERENTLY (PB4 is pin 3 on the
# SOIC and pad 5 on the MLF), so this follows the ESP32 pattern: a value-only
# identity entry with no pad map (roles come from the board's own pin names),
# plus one footprint-gated entry per package whose map was read off Figure 1-1.
# The footprint match adds specificity, so the package entry wins when it applies.
#
# The core clock is the card's `default_clock_hz` (the internal 8 MHz RC) unless
# a bound crystal states another. A Trinket's 16.5 MHz PLL is not modelled.
