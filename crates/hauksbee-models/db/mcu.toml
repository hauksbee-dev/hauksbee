"8"  = "gnd"
"9"  = "pb6_xtal1"
"10" = "pb7_xtal2"
"11" = "pd5_t1_oc0b"
"12" = "pd6_ain0_oc0a"
"13" = "pd7_ain1"
"14" = "pb0_icp1"
"15" = "pb1_oc1a"
"16" = "pb2_ss_oc1b"
"17" = "pb3_mosi_oc2a"
"18" = "pb4_miso"
"19" = "pb5_sck"
"20" = "avcc"
"21" = "aref"
"22" = "gnd2"
