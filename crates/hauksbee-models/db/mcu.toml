# PADS_BANK0 GPIO0..GPIO29, Table 341 section 2.19.6.3 PDF p.301-303: base 0x4001c000,
# GPIO0 at +0x04, one 32-bit register per pin at a 4-byte stride, DRIVE = bits 5:4.
[models.drive_select]
port_bases = { "0" = 0x4001c004 }
register_stride = 4
pins_per_register = 1
lsb = 4
width = 2
basis = "RP2040 Datasheet Table 341 PADS_BANK0 GPIO0 register (PDF p.302-303): base 0x4001c000 + 0x04 + 4*n, DRIVE bits 5:4, 0x0=2MA 0x1=4MA 0x2=8MA 0x3=12MA, reset 0x1"

# Reset behaviour: RUN (header pin 30) is the chip's global reset; low holds the chip in
# reset (RP2040 Datasheet section 2.12.5 PDF p.168). The datasheet prints no RUN-specific
# VIL/VIH; RUN is typed 'Digital In (FT)' so Table 625 input levels at IOVDD 3.3 V apply by pin
# type (PDF p.616-617). The module's DVDD is internal, so no supply threshold is carried.
[models.reset]
pin_vil_v = 0.8
pin_vih_v = 2.0
basis = "RP2040 Datasheet RUN pin section 2.12.5 PDF p.168, input levels Table 625 PDF p.616-617 applied by pin type"
