# ATmega48A/PA/88A/PA/168A/PA/328/P Data Sheet Complete DS40002061B (2020): sec. 1.1.5 p.13
# (PC6/RESET: low longer than the minimum pulse resets; with RSTDISBL unprogrammed, the factory
# default per Table 28-7 p.291, PC6 is the reset input); Table 30-1 p.323: RRST Reset Pull-up
# Resistor 30-60 kOhm. RSTDISBL programmed turns the pad into I/O, so a board may legitimately
# reuse it.
[[models.straps]]
role = "pc6_reset"
level = "high"
boot_select = false
internal_pull = "pull_up"
note = "RESET (PC6) is active low with an internal 30-60 kOhm pull-up while RSTDISBL is unprogrammed (factory default); held low it keeps the part in reset"

[models.ratings]
max_pin_current_a = 0.04  # 40mA abs max per I/O pin
max_current_a = 0.2       # 200mA total VCC/GND
max_voltage_v = 6.0       # Abs max row "Maximum Operating Voltage"; NOT the 5.5 V recommended ceiling

# The recommended range; max_voltage_v above is the abs max, so a supply
# between the two raises the operating-envelope finding.
[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 1.8
max_v = 5.5
abs_max_v = 6.0
basis = "Microchip ATmega328P DS40001984, Features, Operating Voltage 1.8-5.5 V; Absolute Maximum Ratings, Maximum Operating Voltage 6.0 V"

[models.coverage]
implements = ["avr_firmware_execution", "gpio_output_and_direction", "gpio_external_input", "uart_tx_and_rx", "cycle_exact_virtual_clock_and_timers", "watchdog_reboot", "adc_external_channels_0_to_5", "i2c_controller_bridge", "spi_controller_bridge"]
missing = ["board_crystal_frequency_binding", "usb_device_controller", "silicon_power_current_profile", "silicon_timing_and_errata"]

# ATmega328P in the 32-pad packages: 32-lead TQFP and 32-pad VQFN/MLF.
#
# Source: Microchip ATmega328P DS40001984, section 4 "Pin Configurations",
#   Figure "32 TQFP Top View" / "32-pad VQFN Top View" (the two share one
#   numbering; the VQFN adds the bottom pad, which must be soldered to GND).
#
# WHY A SECOND ENTRY. The DIP-28 numbering above is not this package's: on the
# TQFP pad 7 is PB6/XTAL1, where the DIP has VCC, pad 3 is GND where the DIP has
# PD1/TXD, and pads 19/22 are the ADC6/ADC7 inputs the DIP does not bond out.
# Binding a TQFP board through the DIP map put the supply role on the crystal
# net (the emonTx V3.4 read "VCC = -1.8 V") and moved every GPIO two to six
# pads, so a firmware-driven LED net never moved. The footprint gate adds
# specificity, so this entry wins on a TQFP/QFN/MLF-32 footprint and the DIP
# entry keeps every other board.
[[models]]
id = "atmega328p_32pad"
kind = "mcu"
description = "ATmega328P 8-bit AVR MCU, TQFP-32 or VQFN/MLF-32"

[models.match]
value_re     = "(?i)^ATmega328P?$"
mpn_re       = "(?i)^ATmega328P"
# Any QFP/QFN/MLF family name (TQFP, LQFP, VQFN, ...) followed by the lead count
# 32: the family is a substring, not a word, so `Package_QFP:LQFP-32_7x7mm_P0.8mm`
# and `TQFP32-08` both match while `QFN-320` and `TQFP-44` do not.
footprint_re = '(?i)(QFP|QFN|MLF)[-_]*32([^0-9]|$)'

[models.params]
# Crystal load capacitors: ATmega48A/PA/88A/PA/168A/PA/328/P datasheet, Table 9-3 "Low Power
# Crystal Oscillator Operating Modes" and Table 9-5 "Full Swing Crystal Oscillator operating modes"
# (PDF pp. 39-40): recommended range for capacitors C1 and C2 with crystals, 12-22 pF.
xtal_cap_min_f = 12.0e-12
xtal_cap_max_f = 22.0e-12
backend = "simavr:atmega328p"
internal_clock = "internal 8 MHz RC oscillator"
default_clock_hz = 8000000
max_adc_source_impedance_ohms = 10000.0
# Microchip megaAVR DS40002061B (ATmega48A/PA/88A/PA/168A/PA/328/P), Table 30-1 "Common
# DC characteristics" (Continued): RRST "Reset Pull-up Resistor", 30 kOhm min, 60 kOhm max.
# The minimum, for the held-off check's divider against an external pull-down.
reset_pull_up_ohms = 30000.0

