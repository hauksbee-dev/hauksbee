resolution_bits = [10]
basis = "Microchip ATmega48A/PA/88A/PA/168A/PA/328/P Data Sheet Complete DS40002061B (2020), section 24 ADC: features (p.246), section 24.4 (p.249), Table 24-1 (p.251), section 24.6.1 (p.253), Table 24-5 (p.259), Table 29-15 (p.319)"

