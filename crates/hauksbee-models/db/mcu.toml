implements = ["xtensa_lx6_firmware_execution", "boot_to_application", "gpio_output_register_or_mailbox_observation", "uart_tx", "wall_bounded_virtual_time", "gpio_input_mailbox_contract", "adc_input_mailbox_contract", "i2c_spi_mailbox_contract", "tmp105_temperature_injection"]
missing = ["instruction_counted_timing", "unmodified_firmware_gpio_input", "native_adc_peripheral", "unmodified_firmware_i2c_spi_observation", "watchdog_behavior", "silicon_power_current_profile", "silicon_timing_and_errata"]

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "esp32_pico"
kind = "mcu"
description = "Espressif ESP32-PICO-D4 SiP (Watchy v1.x/v2.x)"

[models.match]
# One SiP, one package: the value fixes the pad map without a footprint rule.
value_re = "(?i)^ESP32[-_ ]?PICO[-_ ]?D4$"

[models.params]
# Same ESP32 die as esp32_wroom, so the same QEMU machine (esp32) boots it. With
# no firmware given the scheduler skips the MCU entirely (lint/report-only runs
# never need QEMU); with firmware it boots the merged flash image and bridges
# GPIO (via the RAM mailbox) / UART. The boot-coverage execution of the Watchy
# RES# row (docs/evidence/KNOWN_FAULTS_VALIDATION.md) runs through this.
backend = "qemu:esp32"

[models.pins]
# ESP32-PICO-D4 (ESP32-PICO Series Datasheet v1.3, Table 2-1, and the KiCad
# MCU_Espressif:ESP32-PICO-D4 symbol): VDD3P3_RTC = 19 (RTC IO supply, GPIO0
# included), IO2 = 22, IO0 = 23 (verified on Watchy v1.5/v2.0), IO4 = 24,
# IO5 = 34. Pad 24 was mapped as GPIO2 before; it is IO4. On the SiP the flash
# straps (GPIO12/GPIO15) are bonded internally to the in-package flash, so only
# GPIO0/GPIO2/GPIO5 are board-exposed. The display + UART pads are verified
# against the Watchy v1.5 corpus board file (net_probe): RES = U1 pad 28 =
# GPIO9, TX = pad 41 = GPIO1/U0TXD, RX = pad 40 = GPIO3/U0RXD. GPIO9 is the
# e-paper DISPLAY_RES the boot-coverage check watches.
"19" = "vdd"
"23" = "gpio0"
"22" = "gpio2"
"34" = "gpio5"
"28" = "gpio9"      # DISPLAY_RES (board net RES); driven high by display init
"41" = "p01_txd"    # U0TXD (UART0 TX)
"40" = "p03_rxd"    # U0RXD (UART0 RX)

[models.pin_capability.adc]
basis = "Espressif ESP32-PICO Series Datasheet v1.4, Table 2 Pin Description of ESP32-PICO-D4 (PDF pp.13-14): IO2 pad 22 ADC2_CH2, IO0 pad 23 ADC2_CH1; IO9 and the UART pads carry none. ADC2 is not usable while Wi-Fi runs (ESP-IDF note)"
[models.pin_capability.adc.pads]
"22" = "ADC2_CH2"
"23" = "ADC2_CH1"

# Ref: ESP32-PICO-D4 datasheet v1.7, sec "Strapping Pins" (inherits ESP32 TRM
# v5.1 strap table). The package-internal flash straps are not listed (fixed by
# the SiP).
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true   # latches SPI-vs-download boot; unrecoverable in firmware
# The ESP32 die's thresholds: ESP32 Datasheet v5.3, Table 5-3, VIL max 0.25 x
# VDD, VIH min 0.75 x VDD,
# https://www.espressif.com/sites/default/files/documentation/esp32_datasheet_en.pdf
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = SPI boot (normal); low = download/UART boot"

[[models.straps]]
role = "gpio2"
level = "low"
note = "GPIO2 must be low or floating at reset"

# LilyGO T-Micro32 / T-Micro32 Plus: an ESP32-PICO-V3-02 SiP module sold under
# the vendor's own "T-" name, so its value never says "ESP32". The castellated
# pad numbering is LilyGO's, not Espressif's, so there is no pad map here: GPIO
# roles come from the board's pin names ("IO36/SVP", "IO25"), which the binder
# reads as gpio<n>. The core is the classic ESP32 die, as on esp32_pico.
[[models]]
id = "lilygo_t_micro32"
kind = "mcu"
description = "LilyGO T-Micro32 / T-Micro32 Plus module (ESP32-PICO-V3-02)"

[models.match]
value_re = "(?i)^(LilyGO[-_ ]?)?T[-_ ]?Micro[-_ ]?32([-_ ]?Plus)?$"

[models.params]
backend = "qemu:esp32"

# ─────────────────────────────────────────────────────────────────────────────

# ESP32-S3, package unknown: identity only (see the family note). The strap
# table lives on the package entries below.
[[models]]
id = "esp32s3"
kind = "mcu"
description = "Espressif ESP32-S3, package not recognised (Watchy v3 class)"

[models.match]
value_re = "(?i)^ESP32[-_ ]?S3([-_ ]?WROOM.*)?$"

[models.params]
# hauksbee-mcu backend identifier: the QEMU backend boots the Espressif-QEMU
# esp32s3 machine (Xtensa LX7) from the merged flash image and bridges GPIO
# (via the RAM mailbox) / UART through QMP + gdbstub + the serial socket, same
# as the classic ESP32 entries above. Descriptor: db/mcu/esp32s3.soc.toml in
# hauksbee-mcu. With no firmware given the scheduler skips the MCU entirely,
# so lint/report-only runs never need QEMU.
backend = "qemu:esp32s3"

[models.coverage]
implements = ["xtensa_lx7_machine_boot", "gpio_output_register_or_mailbox_observation_0_to_31", "uart_transport", "wall_bounded_virtual_time", "gpio_input_mailbox_contract_0_to_31", "adc_input_mailbox_contract", "i2c_spi_mailbox_contract"]
missing = ["application_firmware_end_to_end_proof", "gpio_32_to_48_observation", "instruction_counted_timing", "unmodified_firmware_gpio_input", "native_adc_peripheral", "unmodified_firmware_i2c_spi_observation", "watchdog_behavior", "silicon_power_current_profile", "silicon_timing_and_errata"]

[[models]]
id = "esp32s3_wroom"
kind = "mcu"
description = "Espressif ESP32-S3-WROOM-1/-1U/-2 module"

[models.match]
value_re = "(?i)^ESP32[-_ ]?S3([-_ ]?WROOM.*)?$"
# KiCad RF_Module:ESP32-S3-WROOM-1 / -1U / -2 and vendor spellings of the same.
# WROOM-2 has the WROOM-1 pinout (KiCad symbols agree on every strap pad).
footprint_re = '(?i)ESP32[-_]?S3[-_]?WROOM[-_]?[12]'

[models.params]
backend = "qemu:esp32s3"
# ESP32-S3-WROOM-1/-1U Datasheet v1.8, Table 3-1: EN (pad 3) "High: on, enables
# the chip. Low: off ... Do not leave the EN pin floating." The module has no
# pull on it; sec 9 "Peripheral Schematics" asks for an RC delay on the board
# (R = 10 kOhm, C = 1 uF).
must_not_float_roles = "en"

[models.pins]
# ESP32-S3-WROOM-1/-1U Datasheet v1.8, Table 3-1 "Pin Definitions" (and the
# KiCad RF_Module:ESP32-S3-WROOM-1 symbol): GND = 1, 3V3 = 2, EN = 3, IO3 = 15,
# IO46 = 16, IO45 = 26, IO0 = 27 (verified vs Watchy v3 BOOT net). Pads 6/7
# are IO6/IO7; they were mapped as GPIO46/GPIO45 before.
"1"  = "vss"
"2"  = "vdd"
"3"  = "en"
"27" = "gpio0"
"15" = "gpio3"
"26" = "gpio45"
"16" = "gpio46"

[models.pin_capability.adc]
basis = "Espressif ESP32-S3-WROOM-1/-1U Datasheet v1.8, Table 3-1 Pin Definitions (PDF p.11): IO3 pad 15 ADC1_CH2; IO0, IO45 and IO46 carry no ADC channel"
[models.pin_capability.adc.pads]
"15" = "ADC1_CH2"

# ESP32-S3-WROOM-1 & WROOM-1U Datasheet v1.8: Table 3-1 Pin Definitions p.11, EN pad 3 "High: on, enables the
# chip. Low: off, the chip powers off. Note: Do not leave the EN pin floating." Figure 8-1 ESP32-S3-WROOM-1
# Schematics p.39 shows CHIP_PU wired straight to module pad 3 with no pull-up on the module; sec. 9 p.41
# asks for an RC delay on the board.
[[models.straps]]
role = "en"
level = "high"
boot_select = false
internal_pull = "none"
note = "EN (CHIP_PU) high = chip enabled, low = chip off; the module has no on-board pull on EN, so an undriven net floats"

# The module's one supply pin, 3V3 (VDD33). Its abs max IS the recommended
# ceiling, so a 5 V rail on it is past both.
[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 3.0
max_v = 3.6
abs_max_v = 3.6
basis = "Espressif ESP32-S3-WROOM-1/-1U Datasheet v1.8, Table 6-1 Absolute Maximum Ratings (VDD33 -0.3 to 3.6 V) and Table 6-2 Recommended Operating Conditions (VDD33 3.0 / 3.3 / 3.6 V)"

# Ref: ESP32-S3 Technical Reference Manual v1.6, Table 2-9 "Strapping Pins";
# ESP32-S3 datasheet v2.2 sec 3 "Boot Configurations" (Table 3-1: GPIO0 weak
# pull-up; GPIO45, GPIO46 weak pull-down). GPIO0 high = SPI boot; GPIO46
# selects ROM messages / boot mode and must be low-or-floating at reset.
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true   # latches SPI-vs-download boot; unrecoverable in firmware
# ESP32-S3 Datasheet v2.2, Table 5-4 "DC Characteristics (3.3 V, 25 °C)": VIL
# max 0.25 x VDD, VIH min 0.75 x VDD,
# https://www.espressif.com/sites/default/files/documentation/esp32-s3_datasheet_en.pdf
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = SPI boot (normal); low with GPIO46=0 = download boot"

[[models.straps]]
role = "gpio46"
level = "low"
note = "GPIO46 must be low or floating at reset (joins GPIO0 to pick boot mode)"

[[models.straps]]
role = "gpio45"
level = "defined"
note = "GPIO45 selects VDD_SPI flash voltage (low = 3.3 V default); must be defined"

[models.ratings]
# ESP32-S3-WROOM-1/-1U Datasheet v1.8, Table 6-1 "Absolute Maximum Ratings"
# (p. 27): VDD33 power supply voltage -0.3 to 3.6 V (pin 2 "3V3", Table 3-1).
# Table 6-2 recommends 3.0 to 3.6 V.
max_voltage_v = 3.6

[models.coverage]
implements = ["xtensa_lx7_machine_boot", "gpio_output_register_or_mailbox_observation_0_to_31", "uart_transport", "wall_bounded_virtual_time", "gpio_input_mailbox_contract_0_to_31", "adc_input_mailbox_contract", "i2c_spi_mailbox_contract"]
missing = ["application_firmware_end_to_end_proof", "gpio_32_to_48_observation", "instruction_counted_timing", "unmodified_firmware_gpio_input", "native_adc_peripheral", "unmodified_firmware_i2c_spi_observation", "watchdog_behavior", "silicon_power_current_profile", "silicon_timing_and_errata"]

[[models]]
id = "esp32s3_qfn56"
kind = "mcu"
description = "Espressif ESP32-S3 bare chip, QFN56 7x7 mm (Watchy v3)"

[models.match]
value_re = "(?i)^ESP32[-_ ]?S3([-_ ]?WROOM.*)?$"
footprint_re = '(?i)(^|:)V?QFN[-_]?56([-_]1EP)?[-_]7x7mm[-_]P0\.4mm'

[models.params]
backend = "qemu:esp32s3"
# ESP32-S3 Series Datasheet v2.2, Table 2-10 "Analog Pins": CHIP_PU (pin 4)
# "High: on ... Low: off ... Do not leave the CHIP_PU pin floating." Table 2-1
# lists no reset-time pull on it (GPIO0 beside it shows WPU).
must_not_float_roles = "en"

[models.pins]
# ESP32-S3 Series Datasheet v2.2, Table 2-1 "Pin Overview": CHIP_PU = 4,
# GPIO0 = 5 and GPIO3 = 8 (powered by VDD3P3_RTC = 20), GPIO45 = 51 and
# GPIO46 = 52 (powered by VDD3P3_CPU = 46), GND = 57 (exposed pad). `vdd` is
# VDD3P3_RTC: it powers GPIO0, the one strap with sourced VIL/VIH.
"4"  = "en"
"20" = "vdd"
"57" = "vss"
"5"  = "gpio0"
"8"  = "gpio3"
"51" = "gpio45"
"52" = "gpio46"

[models.pin_capability.adc]
basis = "Espressif ESP32-S3 Datasheet v2.2, Table 2-8 Analog Functions (PDF p.24): pin 8 GPIO3 ADC1_CH2; GPIO0, GPIO45 and GPIO46 carry no ADC channel"
[models.pin_capability.adc.pads]
"8" = "ADC1_CH2"

# ESP32-S3 Series Datasheet v2.2: Table 2-10 Analog Pins p.28, CHIP_PU pin 4 "High: on, enables the chip
# (powered up). Low: off, disables the chip (powered down). Note: Do not leave the CHIP_PU pin floating."
# Table 2-1 Pin Overview p.16 lists CHIP_PU with no reset-time pull (GPIO0 beside it shows WPU).
[[models.straps]]
role = "en"
level = "high"
boot_select = false
internal_pull = "none"
note = "CHIP_PU high = chip enabled, low = chip off; the chip has no internal pull on CHIP_PU, so an undriven net floats"

# Same strap table and citations as esp32s3_wroom.
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = SPI boot (normal); low with GPIO46=0 = download boot"

[[models.straps]]
role = "gpio46"
level = "low"
note = "GPIO46 must be low or floating at reset (joins GPIO0 to pick boot mode)"

[[models.straps]]
role = "gpio45"
level = "defined"
note = "GPIO45 selects VDD_SPI flash voltage (low = 3.3 V default); must be defined"

[models.ratings]
# ESP32-S3 Series Datasheet v2.2, Table 5-1 "Absolute Maximum Ratings" (p. 64):
# input power pins (VDDA, VDD3P3, VDD3P3_RTC, VDD3P3_CPU) -0.3 to 3.6 V.
# Table 5-2 recommends 3.0 to 3.6 V.
max_voltage_v = 3.6

[models.coverage]
implements = ["xtensa_lx7_machine_boot", "gpio_output_register_or_mailbox_observation_0_to_31", "uart_transport", "wall_bounded_virtual_time", "gpio_input_mailbox_contract_0_to_31", "adc_input_mailbox_contract", "i2c_spi_mailbox_contract"]
missing = ["application_firmware_end_to_end_proof", "gpio_32_to_48_observation", "instruction_counted_timing", "unmodified_firmware_gpio_input", "native_adc_peripheral", "unmodified_firmware_i2c_spi_observation", "watchdog_behavior", "silicon_power_current_profile", "silicon_timing_and_errata"]

