"7" = "TIM1_CH4 (PC4)"
"8" = "TIM2_CH1 (PD4) / TIM1_CH4 (PD4, remap 3) / TIM2_CH4 (PD5, remap 3)"


# ─────────────────────────────────────────────────────────────────────────────
# ATSAMD21E (A/B/D die revisions), 32-pad QFN or 32-lead TQFP. The ExxL variant
# has a different pinout (5.7) and is excluded by the value match.
#
# Source: Microchip SAM D21/DA1 Family Complete Datasheet DS40001882L.
#   5.5.1 QFN32/TQFP32 pinout; package drawing note "The exposed die attach pad
#   is connected inside the device to GND and GNDANA"; Table 37-2 Absolute
#   Maximum Ratings (VDD 3.8 V, IVDD 92 mA, IGND 130 mA); Table 37-3 General
#   Operating Conditions (VDD 1.62-3.63 V, BOD33 disabled).
#
# BACKEND IS `none:`: no co-sim core here models the SAM D21, so co-sim is
# refused loudly; lint, envelope and rating checks read the pad map. No per-pin
# current is set: Table 37-2 gives only per-cluster limits (46 mA source, 65 mA
# sink), which the per-pin rating cannot express.
[[models]]
id = "atsamd21e_32pin"
kind = "mcu"
description = "ATSAMD21E Cortex-M0+ MCU, 32-pad QFN or 32-lead TQFP (structure only, no co-sim core)"

[models.source]
