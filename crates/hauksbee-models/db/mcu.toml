"1"  = "vdd"
"9"  = "vss"
"16" = "gpio2"
"7"  = "gpio8"
"8"  = "gpio9"

[models.pin_capability.adc]
basis = "Espressif ESP32-C3-WROOM-02 Datasheet v1.7, Table 3-1 Pin Definitions (PDF p.11): IO2 pad 16 ADC1_CH2; IO8, IO9 carry none"
