[models.ratings]
# DS9826 Rev 6, Table 21 (voltage) and Table 22 (current): 25 mA per I/O,
# 80 mA across all I/O pins.
max_pin_current_a = 0.025
max_current_a = 0.08
max_voltage_v = 4.0   # DS9826 Rev 6 Table 21 Voltage characteristics, VDD-VSS -0.3 to 4.0 V

# The 2.0-3.6 V operating range is the check that fires below the 4.0 V abs max.
[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.0
max_v = 3.6
abs_max_v = 4.0
basis = "ST STM32F072x8/xB DS9826 Rev 6, Table 24 General operating conditions, VDD standard operating voltage 2.0 V to 3.6 V; Table 21 Voltage characteristics, VDD-VSS external main supply voltage -0.3 V to 4.0 V"

# RM0091 Rev 10 sec. 2.5 and DS9826 Table 14: BOOT0 is a dedicated input with
# no stated internal bias. Low selects main flash; high selects system memory
# with nBOOT1's option-byte state. Firmware cannot repair a bad reset sample.
[[models.straps]]
role = "boot0"
level = "low"
boot_select = true
internal_pull = "none"
note = "BOOT0 low boots main flash; high selects system memory depending on nBOOT1"

# ─────────────────────────────────────────────────────────────────────────────

# Boot-mode table (BOOT STRAPS package): the pins that select the boot source, the
# vendor's table, and where each value comes from.
# Boot source = BOOT0 pin plus option bits nBOOT1 (user byte bit 20) and BOOT_SEL (bit 23). On F07x BOOT_SEL is
# "considered as 1" (not implemented), so the BOOT0 pin always controls and nBOOT0 (bit 19) is ignored.
# FACTORY DEFAULT modelled: ST production USER byte 0xFF (option word 0x00FF 55AA) => nBOOT1 = 1.
[models.strap_latch]
event = "reset_release"
note  = "BOOT0 pin and the nBOOT1 option bit are latched on the 4th rising edge of SYSCLK after reset, and re-sampled when exiting Standby; BOOT_SEL is considered 1 on F07x so the pin always selects; model state is the ST factory default nBOOT1 = 1"
cite  = "RM0091 Rev 10, section 2.5 'Boot configuration', Table 3 and text, PDF p.54; option bytes section 4.1.1, PDF p.77-78"

[models.reset_input]
role = "reset"
vil  = [0.3, 0.07]
vih  = [0.445, 0.398]
cite = "DocID025004 Rev 5 (STM32F072x8/xB), Table 56 'NRST pin characteristics', PDF p.83: VIL(NRST) max 0.3 VDD+0.07 V, VIH(NRST) min 0.445 VDD+0.398 V; NRST pad 7 on LQFP48/UFQFPN48, Table 13 PDF p.34"

[[models.boot_inputs]]
role = "boot0"
internal_pull = "unknown"
vil = [0.3, -0.3]
vih = [0.2, 0.95]
cite = "DocID025004 Rev 5, Table 53 'I/O static characteristics', PDF p.78: BOOT0 VIL max 0.3 VDDIOx-0.3 V, VIH min 0.2 VDDIOx+0.95 V (footnote 1: data based on design simulation only, not tested in production); BOOT0 pad 44, Table 13 PDF p.40"

[[models.boot_modes]]
name = "main flash"
when = { boot0 = "low" }
outcome = "user_flash"
detail = "BOOT0 pin = 0 with BOOT_SEL treated as 1 (F07x): main flash memory is selected as boot area (nBOOT1 is a don't-care); user firmware runs"
cite = "RM0091 Rev 10, Table 3 row 1, PDF p.54"

[[models.boot_modes]]
name = "system memory (factory nBOOT1 = 1)"
when = { boot0 = "high" }
outcome = "rom_bootloader"
detail = "BOOT0 pin = 1 with the factory default nBOOT1 = 1: system memory (ST bootloader, 0x1FFFC800 on F07x) is the boot area; user firmware does not run"
cite = "RM0091 Rev 10, Table 3 row 2, PDF p.54; ST production USER byte, PDF p.77-78; bootloader address 0x1FFF C800 on STM32F07x, PDF p.54"

[models.rom_bootloader]
protocol = "st_usart"
version = 0x31
product_id = 0x0448
commands = [0x00, 0x01, 0x02, 0x11, 0x21, 0x31, 0x44, 0x63, 0x73, 0x82, 0x92]
port = "USART1 PA9 (TX) / PA10 (RX), or USART2 PA14 (TX) / PA15 (RX), 8E1"
cite = "AN3155 Rev 18; AN2606 Rev 70 Table 3 (USART V3.1), Table 41 PDF p.110-111 (pins), Table 226 (PID 0x448). The Get command list and version byte are derived, not printed per device."

# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   AN2606 Rev 70 (February 2026), https://www.st.com/resource/en/application_note/an2606-stm32-microcontroller-system-memory-boot-mode-stmicroelectronics.pdf sha256 25b466e39ecc61671dcb988d8ca538462d6452d85f68140cb981ed728f57e654;
#   AN3155 Rev 22 (September 2026), https://www.st.com/resource/en/application_note/an3155-usart-protocol-used-in-the-stm32-bootloader-stmicroelectronics.pdf sha256 0e3e1c35ffa3311aba33440d9d6236dc2f59af8a7f32482cf13d1d0af8c5e1f9;
#   RM0091 Rev 10 (cached copy target/launch/wp1-datasheets/rm0091.pdf; ST document rm0091-stm32f0x1stm32f0x2stm32f0x8-advanced-armbased-32bit-mcus) sha256 62e6ccbdcbc1be14db6a08936759021261a53282955616d95a0dfe301c081ae0.

[[models.pin_bias]]
role = "pa10_usart1_rx"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 41 (STM32F071xx/072xx configuration in system memory boot mode) PDF p.110, USART1_RX pin: \"PA10 pin: USART1 in reception mode. Used in input pull-up mode.\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0091 Rev 10 PDF p.705 section 27.5.1 USART character description: \"By default, the signal (TX or RX) is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

[[models.pin_bias]]
role = "pa15"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 41 (STM32F071xx/072xx configuration in system memory boot mode) PDF p.110, USART2_RX pin: \"PA15 pin: USART2 in reception mode. Used in input pull-up mode\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0091 Rev 10 PDF p.705 section 27.5.1 USART character description: \"By default, the signal (TX or RX) is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

# UNLISTED ON PURPOSE (F0): (a) "nBOOT1 = 0, BOOT0 = 1 -> Embedded SRAM" is reachable only after the user clears the nBOOT1
# option bit; that is not the factory state, so no row. (b) The BOOT_SEL = 0 / nBOOT0 rows are marked "available on STM32F04x
# and STM32F09x devices only" and do not exist on F07x. (c) The empty-check row (footnote 2) is F04x/F09x only.
[[models]]
id = "stm32f103c8"
kind = "mcu"
description = "STM32F103C8 Cortex-M3 MCU (blue pill), LQFP-48"

[models.match]
value_re = "(?i)^STM32F103C[8B]?(T6)?$"
mpn_re   = "(?i)^STM32F103C[8B]"

[models.params]
# hauksbee-mcu backend identifier: the Renode backend brings up the matching
# Renode platform (stm32f103.repl) and bridges GPIO/UART through its monitor.
backend = "renode:stm32f103"
internal_clock = "internal 8 MHz HSI RC oscillator"

[models.pins]
# LQFP-48 pin map (KiCad MCU_ST_STM32F1:STM32F103C8Tx default symbol). Only the
# pins the hauksbee demo board wires are named with GPIO/ADC roles; power and
# the rest carry their port role so the binder can stamp drivers when wired.
# Roles use the "p<port><bit>" convention the binder's gpio_of_role parses.
"1"  = "vbat"      # LQFP-48 pin 1 = VBAT, pins 2-4 = PC13-PC15 (ST DS5319 Rev 20, LQFP48 pinout figure)
"2"  = "pc13"      # onboard LED (blue pill), active-low to 3V3 in HW
"3"  = "pc14"
"4"  = "pc15"
"5"  = "osc_in"    # HSE crystal / external-clock input
"6"  = "osc_out"   # HSE crystal oscillator output
"7"  = "reset"     # NRST, LQFP-48 pin 7 (DS5319 Rev 20 Table 5 PDF p.28)
"8"  = "vss"
"9"  = "vdd"
"10" = "pa0_adc0"  # LQFP-48 pin 10 = PA0 (PA0-WKUP / ADC1_IN0) per ST DS5319; matches the
                   # pa1_adc1/pa2_adc2 convention. Package-faithful.
"11" = "pa1_adc1"
"12" = "pa2_adc2"
"14" = "pa4_adc4"
"15" = "pa5"       # alive indicator (GPIO output); SPI1_SCK on the SPI ADC demo board. LQFP-48 pin 15 = PA5.
"16" = "pa6"       # SPI1_MISO on the SPI ADC demo board. LQFP-48 pin 16 = PA6.
"17" = "pa7"       # LQFP-48 pin 17 = PA7 (ADC1_IN7 / SPI1_MOSI) per ST DS5319; matches the
                   # plain pa5/pa6 convention. Package-faithful.
"18" = "pb0"       # LQFP-48 pin 18 = PB0 (ST DS5319). Package-faithful; not wired by the demos.
"20" = "pb2_boot1" # PB2/BOOT1 (DS5319 Rev 19 Table 5, LQFP48 pad 20): the second boot strap
"23" = "vss2"
"24" = "vdd2"
"29" = "pa8"       # PA8: firmware threshold/FLAG output. LQFP-48 pin 29 = PA8 (ST DS5319). The SPI ADC
                   # demo board routes firmware PA8 here to its "FLAG" net (package-faithful).
"30" = "pa9"       # USART1 TX
"31" = "pa10"      # USART1 RX
"35" = "vss3"      # LQFP-48 pads 35/36 = VSS_2/VDD_2 (DS5319 Rev 19 Table 5); the card's role names are numbered
"36" = "vdd3"      # one higher than the datasheet's (pads 23/24 = VSS_1/VDD_1), only the pad number matters
"37" = "pa14"      # LQFP-48 pad 37 = PA14 (JTCK/SWCLK), DS5319 Rev 19 Table 5 (p.32), Figure 8 (p.26)
"38" = "pa15"      # LQFP-48 pad 38 = PA15 (JTDI)
"42" = "pb6_i2c1_scl"  # LQFP-48 pad 42 = PB6 (I2C1_SCL), DS5319 Rev 19 Table 5
"43" = "pb7_i2c1_sda"  # LQFP-48 pad 43 = PB7 (I2C1_SDA)
"44" = "boot0"     # BOOT0 strapping pin (LQFP-48 pin 44; RM0008 boot config)
"47" = "vss4"      # LQFP-48 pad 47 = VSS_3 (DS5319 Rev 19 Table 5)
"48" = "vdd4"      # LQFP-48 pad 48 = VDD_3 (DS5319 Rev 19 Table 5)

# RM0008 Rev 20 chapter 27 (USART) and STM32F103x8/xB datasheet DS5319 Rev 19. Printed page numbers.
[models.peripherals.uart]
source = "https://www.stmcu.jp/wp/wp-content/uploads/2017/08/RM0008_Rev20.pdf"
source_sha256 = "097bc47ab8aa0c5d4a68f836dbab95c5b9acb2b0c8116a2959307743204b5097"
basis = "RM0008 Rev 20 section 27.3.4 (p.798) and Tables 192-194 (pp.799-800); STM32F103x8/xB datasheet DS5319 Rev 19 section 2.3.17 (p.19), Table 9 (p.38)"
also_from = [{ url = "https://www.stmcu.jp/wp/wp-content/uploads/2017/08/DS5319_Rev19.pdf", sha256 = "daf9ebe5299018a3cfa37f660ce9517b49010167d57d892c1e2164e65d98461f" }]

[[models.peripherals.uart.clock_sources]]
name = "PCLK2"
instances = ["USART1"]
max_hz = 72000000.0
basis = "RM0008 Rev 20 section 27.3.4 (p.798): fCK is PCLK2 for USART1; STM32F103x8/xB datasheet DS5319 Rev 19 Table 9 (p.38): fPCLK2 max 72 MHz"

[[models.peripherals.uart.clock_sources]]
name = "PCLK1"
instances = ["USART2", "USART3"]
max_hz = 36000000.0
basis = "RM0008 Rev 20 section 27.3.4 (p.798): fCK is PCLK1 for USART2-5; STM32F103x8/xB datasheet DS5319 Rev 19 Table 9 (p.38): fPCLK1 max 36 MHz"

[models.peripherals.uart.baud]
formula = "Tx/Rx baud = fCK / (16 * USARTDIV); USART_BRR = 12-bit DIV_Mantissa . 4-bit DIV_Fraction"
divisor_offset = 0.0
fraction_bits = 4
register_bits = 16
oversampling = [16]
basis = "RM0008 Rev 20 section 27.3.4 (p.798): baud = fCK / (16*USARTDIV), USARTDIV an unsigned fixed point number coded in USART_BRR (examples: mantissa 27, fraction 12/16 gives 27.75)"

[[models.peripherals.uart.max_baud]]
instances = ["USART1"]
oversampling = 16
baud_hz = 4500000.0
condition = "fPCLK2 = 72 MHz, USARTDIV = 1"
basis = "RM0008 Rev 20 Table 192 (p.799) row 10 (4500 kbps, USARTDIV 1 at 72 MHz, NA at 36 MHz) and note 'only USART1 is clocked with PCLK2 (72 MHz max)'; STM32F103x8/xB datasheet DS5319 Rev 19 section 2.3.17 (p.19): one USART up to 4.5 Mbit/s"

[[models.peripherals.uart.max_baud]]
instances = ["USART2", "USART3"]
oversampling = 16
baud_hz = 2250000.0
condition = "fPCLK1 = 36 MHz, USARTDIV = 1"
basis = "RM0008 Rev 20 Table 192 (p.799) row 9 (2250 kbps, USARTDIV 1 at 36 MHz); STM32F103x8/xB datasheet DS5319 Rev 19 section 2.3.17 (p.19): the other interfaces up to 2.25 Mbit/s"

[[models.peripherals.uart.receiver_tolerance]]
frame_bits = 10
oversampling = 16
fractional_divisor = false
noise_flag_is_error = true
total_error_min_pct = -3.75
total_error_max_pct = 3.75
basis = "RM0008 Rev 20 Table 193 (p.800), M bit = 0 (10-bit frame), NF is an error; DIV_Fraction is 0; a tolerance on the total clock system deviation, either sign"

[[models.peripherals.uart.receiver_tolerance]]
frame_bits = 10
oversampling = 16
fractional_divisor = false
noise_flag_is_error = false
total_error_min_pct = -4.375
total_error_max_pct = 4.375
basis = "RM0008 Rev 20 Table 193 (p.800), M bit = 0 (10-bit frame), NF is don't care; DIV_Fraction is 0; a tolerance on the total clock system deviation, either sign"

[[models.peripherals.uart.receiver_tolerance]]
frame_bits = 11
oversampling = 16
fractional_divisor = false
