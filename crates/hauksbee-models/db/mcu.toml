locator = "Features (Operating Voltage); 5.1 Figure 5-3 and Figure 5-4; 33.1 Table 33-1"
sha256 = "6dd5823d902bb87d170f0c26c918c49db4cd3deba906cba870b229f2607e7465"

[models.match]
value_re = "(?i)^ATmega168V?(MLF|[-_ ]?(10|20)?(AU|MU)R?)$"

[models.params]
# Crystal load capacitors: ATmega48A/PA/88A/PA/168A/PA/328/P datasheet, Table 9-3 "Low Power
# Crystal Oscillator Operating Modes" and Table 9-5 "Full Swing Crystal Oscillator operating modes"
