# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   ESP32-S2-MINI-1 Datasheet v1.6 (https://www.espressif.com/sites/default/files/documentation/esp32-s2-mini-1_esp32-s2-mini-1u_datasheet_en.pdf) sha256 06999476c9d1dede2e6828384dc79aa1e7935059e0fc8349e51f0c962fcfa882;
#   ESP32-S2 Technical Reference Manual v1.3 (https://www.espressif.com/sites/default/files/documentation/esp32-s2_technical_reference_manual_en.pdf) sha256 686f173e83212cdcdece789a72c8262c5ff164908108d31369d7326cc2159855.
[[models.pin_bias]]
role = "gpio44_rxd0"
level = "high"
needs = "idle"
opposed_only = true
basis = "ESP32-S2 TRM v1.3 PDF p.236 (section 7.2 Boot Mode): \"In download boot mode, users can download code to SRAM or flash using UART0, UART1, QPI or USB interface.\"; ESP32-S2-MINI-1 Datasheet v1.6 PDF p.11 Table 3 Pin Definitions: \"RXD0 40 I/O/T U0RXD, GPIO44, CLK_OUT2\"; ESP32-S2 TRM v1.3 PDF p.515 (UART chapter, 23.3.5 UART Data Frame): \"The START bit is logical low, whereas STOP bits are logical high.\"; PDF p.516: \"The receiver can also detect the Break conditions when the RX data line remains logical low for one NULL character transmission\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

# ─────────────────────────────────────────────────────────────────────────────

# ESP32-C6-WROOM-1 / -1U module (29 pads).
# Source: Espressif ESP32-C6-WROOM-1 & WROOM-1U Datasheet v1.4, Table 3-1 Pin
# Definitions (PDF p.11), Tables 4-1/4-3 (boot straps), 6-1/6-2/6-3 (VDD33
# maximum 3.6 V, recommended 3.0-3.6 V, VIH min 0.75 x VDD, VIL max 0.25 x VDD).
# The WROOM-1 numbers the GPIOs on other pads than the MINI-1 (esp32c6_mini1),
# so it needs its own map. No co-sim core exists for the ESP32-C6 (as on
# esp32c6_mini1). tests/suite/module_pad_tables/esp32_c6_wroom_1.tsv is the
# datasheet table this map is checked against pad by pad.
[[models]]
id = "esp32c6_wroom1"
kind = "mcu"
description = "Espressif ESP32-C6-WROOM-1/-1U module, 29 pads (structure only, no co-sim core)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.espressif.com/sites/default/files/documentation/esp32-c6-wroom-1_wroom-1u_datasheet_en.pdf"
title = "Espressif ESP32-C6-WROOM-1 & WROOM-1U Datasheet v1.4"
locator = "Table 3-1 Pin Definitions (PDF p.11); Table 4-1 Default Configuration of Strapping Pins; Table 4-3 Chip Boot Mode Control; Table 6-1 Absolute Maximum Ratings; Table 6-2 Recommended Operating Conditions; Table 6-3 DC Characteristics"
sha256 = "163020762fa6d499e0c611c5a13e78ad9d4720b421c6bc5e14e16fc748862b73"

[models.match]
value_re = "(?i)^ESP32[-_ ]?C6[-_ ]?WROOM[-_ ]?1(U|/U)?([-_ ]?(N\\d+|H\\d+))?$"

[models.params]
backend = "none:esp32c6"

[models.pins]
# Table 3-1 Pin Definitions. GND = 1, 28 and the exposed pad (29); NC = 22.
"1" = "gnd"           # GND
"2" = "vdd"           # 3V3
"3" = "en"            # EN
"4" = "gpio4"         # IO4
"5" = "gpio5"         # IO5
"6" = "gpio6"         # IO6
"7" = "gpio7"         # IO7
"8" = "gpio0"         # IO0
"9" = "gpio1"         # IO1
"10" = "gpio8"        # IO8
"11" = "gpio10"       # IO10
"12" = "gpio11"       # IO11
"13" = "gpio12"       # IO12
"14" = "gpio13"       # IO13
"15" = "gpio9"        # IO9
"16" = "gpio18"       # IO18
"17" = "gpio19"       # IO19
"18" = "gpio20"       # IO20
"19" = "gpio21"       # IO21
"20" = "gpio22"       # IO22
"21" = "gpio23"       # IO23
"22" = "nc"           # NC
"23" = "gpio15"       # IO15
"24" = "gpio17_rxd0"  # RXD0
"25" = "gpio16_txd0"  # TXD0
"26" = "gpio3"        # IO3
"27" = "gpio2"        # IO2
"28" = "gnd2"         # GND
"29" = "gnd3"         # GND

[models.pin_capability.adc]
basis = "Espressif ESP32-C6-WROOM-1 & WROOM-1U Datasheet v1.4, Table 3-1 Pin Definitions (PDF p.11): ADC1_CH0-CH6 on IO0-IO6; no other pad carries an ADC channel"
[models.pin_capability.adc.pads]
"4" = "ADC1_CH4"
"5" = "ADC1_CH5"
"6" = "ADC1_CH6"
"8" = "ADC1_CH0"
"9" = "ADC1_CH1"
"26" = "ADC1_CH3"
"27" = "ADC1_CH2"

# Table 3-1: EN (pad 3) "High: on, enables the chip. Low: off, the chip powers
# off. Note: Do not leave the EN pin floating."
[[models.straps]]
role = "en"
level = "high"
boot_select = false
internal_pull = "none"
note = "EN (CHIP_PU) high = chip enabled, low = chip off; the module has no on-board pull on EN, so an undriven net floats"

[models.ratings]
max_voltage_v = 3.6       # Table 6-1, VDD33 -0.3 to 3.6 V

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 3.0
max_v = 3.6
abs_max_v = 3.6
basis = "ESP32-C6-WROOM-1 & WROOM-1U Datasheet v1.4, Table 6-2 VDD33 3.0-3.6 V; Table 6-1 VDD33 max 3.6 V"

# Table 4-3: GPIO9 = 1 selects SPI boot whatever GPIO8 is; GPIO9 = 0 with GPIO8 = 1
# selects joint download boot. Table 4-1: GPIO9 has a weak pull-up, GPIO8 floats.
[[models.straps]]
role = "gpio9"
level = "high"
boot_select = true   # latches SPI-vs-download boot
internal_pull = "pull_up"   # Table 4-1: GPIO9 default weak pull-up
# Table 6-3: VIL max 0.25 x VDD, VIH min 0.75 x VDD.
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO9 (BOOT) high = SPI boot (normal); low with GPIO8 high = download boot"

[models.coverage]
implements = ["pad_map", "supply_envelope", "boot_strap_levels"]
missing = ["firmware_cosim_core", "gpio_behaviour", "uart", "usb_serial_jtag", "pin_and_package_current_ratings"]
[models.pin_capability.routed]
basis = "Espressif ESP32-C6 Series Datasheet v1.5 (PDF page = printed page), Section 4.1.3.1 IO MUX and GPIO Matrix (p.41): 'Routing 85 peripheral input and 93 output signals to any GPIO pin'; Section 2.3.5 Peripheral Pin Assignment, Table 2-10 QFN40 and Table 2-11 QFN32 (p.25-27; their UART0, SPI2, UART1, I2C, LED PWM, MCPWM and RMT columns list GPIOn (P2/P3) on the GPIO pads): 'Any GPIO pins mapping to peripheral signals via GPIO Matrix, can be priority 2, 3, or 4', footnote 2 'Signals of UART0, SPI0/1, and SPI2 interfaces can be mapped to any GPIO pins through the GPIO Matrix, regardless of whether they are directly routed to fixed pins via IO MUX', and a peripheral without priority 1 pins, such as UART1, 'can be assigned to any GPIO pins'. ESP32-C6 Technical Reference Manual v1.2 (PDF page = printed page), Chapter 7 IO MUX and GPIO Matrix, Section 7.11 Table 7.11-1 Peripheral Signals via GPIO Matrix (p.257-260): U0TXD_out/U0RXD_in/U1TXD_out/U1RXD_in and ledc_ls_sig_out0 (p.257), I2CEXT0_SCL/SDA in/out (p.258), FSPICLK/FSPID/FSPIQ in/out (SPI2, p.259), pwm0_cap0_in~pwm0_cap2_in (MCPWM capture inputs, p.260); the MCPWM peripheral has a capture module with three capture channels, each with a 32-bit time-stamp register (ESP32-C6 Datasheet p.55-56), which is the timer input-capture channel. hardware peripheral only, a software (bit-banged) implementation can use any pad Module datasheet: ESP32-C6-WROOM-1 & WROOM-1U Datasheet v1.4 (same chip)."
functions = ["spi_sck", "spi_mosi", "spi_miso", "i2c_sda", "i2c_scl", "uart_tx", "uart_rx", "pwm", "timer_capture"]


# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   ESP32-C6-WROOM-1 Datasheet v1.4 (https://www.espressif.com/sites/default/files/documentation/esp32-c6-wroom-1_wroom-1u_datasheet_en.pdf) sha256 163020762fa6d499e0c611c5a13e78ad9d4720b421c6bc5e14e16fc748862b73;
#   ESP32-C6 Technical Reference Manual v1.2 (https://www.espressif.com/sites/default/files/documentation/esp32-c6_technical_reference_manual_en.pdf) sha256 e08d5b61ebcfa2a78f9735e3f721817cb1dc2df9cf05096d2f0399eaba9f1734.
[[models.pin_bias]]
role = "gpio17_rxd0"
level = "high"
needs = "idle"
opposed_only = true
basis = "ESP32-C6 TRM v1.2 PDF p.375 (section 9.2.2 Boot Mode Control): \"In Download Boot mode, users can download code into flash using UART0 or USB interface.\"; ESP32-C6-WROOM-1 Datasheet v1.4 PDF p.11 Table 3 Pin Definitions: \"RXD0 24 I/O/T U0RXD, GPIO17, FSPICS1\"; ESP32-C6 TRM v1.2 PDF p.737 (UART chapter, 27.4.4 UART Data Frame): \"The start bit is logical low, whereas stop bits are logical high.\"; same page: \"The receiver can also detect the Break conditions when the RX data line remains logical low for one NULL character transmission\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "nrf52840"
kind = "mcu"
description = "Nordic nRF52840 (Cortex-M4F) SoC"

[models.match]
value_re = "(?i)^nRF52840"
mpn_re   = "(?i)^nRF52840"

[models.params]
# Renode backend: brings up nrf52840.repl. nRF GPIO is two 32-bit ports
# (gpio0/gpio1); roles "p0<bit>" map port '0', "p1<bit>" map port '1'.
backend = "renode:nrf52840"
internal_clock = "internal 64 MHz HFINT RC oscillator"

[models.pins]
# Minimal demo map; only the wired pads carry roles. P0.13 is the nRF52840-DK
# LED1; UART on P0.06 (TXD) / P0.08 (RXD).
"1"  = "vss"
"2"  = "vdd"
"3"  = "p013"       # LED / alive indicator into the analog circuit
"4"  = "p014"       # blink
"5"  = "p006_txd"   # UART TXD
"6"  = "p008_rxd"   # UART RXD

[models.pin_capability.adc]
basis = "Nordic nRF52840 Product Specification v1.7, aQFN73 pin assignments (PDF pp.578-579): the analogue inputs are AIN0 P0.02, AIN1 P0.03, AIN2 P0.04, AIN3 P0.05, AIN4 P0.28, AIN5 P0.29, AIN6 P0.30, AIN7 P0.31; P0.06, P0.08, P0.13 and P0.14, the pads of [models.pins], are not among them"
[models.pin_capability.adc.pads]
[models.pin_capability.pull_up]
basis = "Nordic nRF52840 Product Specification v1.7 (4413_417 v1.7, 2021-11-30; sha256 f43354b2be1d5558e9e409787a940b16322d2d560da87b33f6206361bbc1469a), section 6.9 GPIO (p.152) 'Internal pull-up and pull-down resistors ... Enabling of pull-up and pull-down resistors'; section 6.9.2.10 PIN_CNF[n] field C PULL value Pullup = 3 'Pull up on pin' (p.158); electrical table RPU pull-up resistance 11/13/16 kOhm min/typ/max (p.159). Not listed: the supply pads; the card's pad map has no NFC (P0.09/P0.10), USB D+/D- or SWD pads"
[models.pin_capability.pull_up.pads]
"3" = "P0.13: GPIO P0 PIN_CNF[13].PULL = 3 (Pullup)"
"4" = "P0.14: GPIO P0 PIN_CNF[14].PULL = 3 (Pullup)"
"5" = "P0.06: GPIO P0 PIN_CNF[6].PULL = 3 (Pullup)"
"6" = "P0.08: GPIO P0 PIN_CNF[8].PULL = 3 (Pullup)"

# In High Voltage mode (supply on VDDH only, VDD not connected to any supply)
# VDD is the REG0 regulator's OUTPUT, decoupled on the board and free to feed
# external circuitry; in Normal Voltage mode it is the supply input.
[[models.optional_supplies]]
role = "vdd"
basis = "Nordic nRF52840 Product Specification v1.7 (4413_417, 2021-11-30), 5.3.1 Main supply (p.64): the system enters High Voltage mode when the supply voltage is connected only to VDDH and the VDD pin is not connected to any voltage supply; 5.3.1.1 (p.65): the REG0 output voltage is connected to VDD; 5.3.1.3 External circuitry supply (p.65): in High Voltage mode the output from REG0 can supply external circuitry from the VDD pin; Figure 17 (p.67) High Voltage mode, LDO only"

[models.ratings]
max_pin_current_a = 0.015
max_current_a = 0.1
max_voltage_v = 3.9   # nRF52840 PS, Absolute maximum ratings, VDD -0.3 to +3.9 V (VDDH/VBUS are 5.8 V)

# The 1.7-3.6 V recommended VDD range is the check that fires below the 3.9 V abs max.
[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.7
max_v = 3.6
abs_max_v = 3.9
basis = "Nordic nRF52840 Product Specification (docs.nordicsemi.com ps_nrf52840), Recommended operating conditions, VDD supply voltage 1.7 V to 3.6 V; Absolute maximum ratings, VDD -0.3 V to +3.9 V"

# Output stage per PIN_CNF.DRIVE mode. nRF52840 PS v1.7 section 6.9.3.1 PDF p.159: IOL,SD /
# IOH,SD min 1 mA at 0.4 V (VDD >= 1.7 V), IOL,HDH / IOH,HDH min 6 mA at 0.4 V (VDD >= 2.7 V).
# Modes per section 6.9.2.10 PDF p.158-159: S0S1=0, H0S1=1, S0H1=2, H0H1=3, D0S1=4, D0H1=5,
# S0D1=6, H0D1=7 ('0' is the pin driven low, '1' high; D = disconnected). S0S1 is the reset
# default. Points are at VDD 3.0 V (the typical supply, section 5.3.8.1 PDF p.83).
[[models.output_drive]]
setting = "S0S1"
selector = 0
reset_default = true   # S0S1 is the default DRIVE setting at reset (PS v1.7 p.57, PIN_CNF reset 0x00000002)
vdd = 3.0
points = [
  { level = "high", current_a = 0.001, volts = 2.6 },
  { level = "low", current_a = 0.001, volts = 0.4 },
]
basis = "nRF52840 Product Specification v1.7 section 6.9.3.1 GPIO Electrical Specification PDF p.159: standard drive guarantees IOL/IOH of 1 mA at VSS+0.4 V / VDD-0.4 V (VDD >= 1.7 V); high drive guarantees 6 mA (VDD >= 2.7 V). The minimum column is used (typ 2 mA / 10 mA / 9 mA is better than the bound)"

[[models.output_drive]]
setting = "H0S1"
selector = 1
vdd = 3.0
points = [
  { level = "high", current_a = 0.001, volts = 2.6 },
  { level = "low", current_a = 0.006, volts = 0.4 },
]
basis = "nRF52840 Product Specification v1.7 section 6.9.3.1 GPIO Electrical Specification PDF p.159: standard drive guarantees IOL/IOH of 1 mA at VSS+0.4 V / VDD-0.4 V (VDD >= 1.7 V); high drive guarantees 6 mA (VDD >= 2.7 V). The minimum column is used (typ 2 mA / 10 mA / 9 mA is better than the bound)"

[[models.output_drive]]
setting = "S0H1"
selector = 2
vdd = 3.0
points = [
  { level = "high", current_a = 0.006, volts = 2.6 },
  { level = "low", current_a = 0.001, volts = 0.4 },
]
basis = "nRF52840 Product Specification v1.7 section 6.9.3.1 GPIO Electrical Specification PDF p.159: standard drive guarantees IOL/IOH of 1 mA at VSS+0.4 V / VDD-0.4 V (VDD >= 1.7 V); high drive guarantees 6 mA (VDD >= 2.7 V). The minimum column is used (typ 2 mA / 10 mA / 9 mA is better than the bound)"

[[models.output_drive]]
setting = "H0H1"
selector = 3
vdd = 3.0
points = [
  { level = "high", current_a = 0.006, volts = 2.6 },
  { level = "low", current_a = 0.006, volts = 0.4 },
]
basis = "nRF52840 Product Specification v1.7 section 6.9.3.1 GPIO Electrical Specification PDF p.159: standard drive guarantees IOL/IOH of 1 mA at VSS+0.4 V / VDD-0.4 V (VDD >= 1.7 V); high drive guarantees 6 mA (VDD >= 2.7 V). The minimum column is used (typ 2 mA / 10 mA / 9 mA is better than the bound)"

[[models.output_drive]]
setting = "D0S1"
selector = 4
vdd = 3.0
points = [
  { level = "high", current_a = 0.001, volts = 2.6 },
]
disconnected = ["low"]
basis = "nRF52840 Product Specification v1.7 section 6.9.3.1 GPIO Electrical Specification PDF p.159: standard drive guarantees IOL/IOH of 1 mA at VSS+0.4 V / VDD-0.4 V (VDD >= 1.7 V); high drive guarantees 6 mA (VDD >= 2.7 V). The minimum column is used (typ 2 mA / 10 mA / 9 mA is better than the bound)"

[[models.output_drive]]
setting = "D0H1"
selector = 5
vdd = 3.0
points = [
  { level = "high", current_a = 0.006, volts = 2.6 },
]
disconnected = ["low"]
basis = "nRF52840 Product Specification v1.7 section 6.9.3.1 GPIO Electrical Specification PDF p.159: standard drive guarantees IOL/IOH of 1 mA at VSS+0.4 V / VDD-0.4 V (VDD >= 1.7 V); high drive guarantees 6 mA (VDD >= 2.7 V). The minimum column is used (typ 2 mA / 10 mA / 9 mA is better than the bound)"

[[models.output_drive]]
setting = "S0D1"
selector = 6
vdd = 3.0
points = [
  { level = "low", current_a = 0.001, volts = 0.4 },
]
disconnected = ["high"]
basis = "nRF52840 Product Specification v1.7 section 6.9.3.1 GPIO Electrical Specification PDF p.159: standard drive guarantees IOL/IOH of 1 mA at VSS+0.4 V / VDD-0.4 V (VDD >= 1.7 V); high drive guarantees 6 mA (VDD >= 2.7 V). The minimum column is used (typ 2 mA / 10 mA / 9 mA is better than the bound)"

[[models.output_drive]]
setting = "H0D1"
selector = 7
vdd = 3.0
points = [
  { level = "low", current_a = 0.006, volts = 0.4 },
]
disconnected = ["high"]
basis = "nRF52840 Product Specification v1.7 section 6.9.3.1 GPIO Electrical Specification PDF p.159: standard drive guarantees IOL/IOH of 1 mA at VSS+0.4 V / VDD-0.4 V (VDD >= 1.7 V); high drive guarantees 6 mA (VDD >= 2.7 V). The minimum column is used (typ 2 mA / 10 mA / 9 mA is better than the bound)"

# GPIO P0/P1 PIN_CNF[n] at base + 0x700 + 4n, DRIVE bits 10:8 (PS v1.7 section 6.9.2.10 PDF
# p.158-159; P0 at 0x50000000, P1 at 0x50000300, instantiation table section 4.2.4 PDF p.23).
[models.drive_select]
port_bases = { "0" = 0x50000700, "1" = 0x50000A00 }
register_stride = 4
pins_per_register = 1
lsb = 8
width = 3
basis = "nRF52840 PS v1.7 section 6.9.2.10 PIN_CNF[n] PDF p.158-159: offset 0x700 + 4n, DRIVE bits 10:8, S0S1=0 H0S1=1 S0H1=2 H0H1=3 D0S1=4 D0H1=5 S0D1=6 H0D1=7"

# Brown-out reset: nRF52840 PS v1.7 section 5.3.8.4 PDF p.85, VBOR,ON (System ON, VDD only)
# min 1.57 V, typ 1.6 V, max 1.63 V. No hysteresis is printed, so release_above_v is absent.
# The nRESET pin exists only when UICR PSELRESET maps it (section 4.5.1.4 PDF p.45) and the
# datasheet prints no nRESET-specific VIL/VIH, so the card carries no reset pin threshold.
[models.reset]
supply_pin = "vdd"
assert_below_v = 1.6
basis = "nRF52840 PS v1.7 section 5.3.8.4 Power fail comparator, VBOR,ON typ 1.6 V (PDF p.85)"
[models.pin_capability.routed]
basis = "Nordic nRF52840 Product Specification v1.7 (4413_417 v1.7, 2021-11-30; sha256 f43354b2be1d5558e9e409787a940b16322d2d560da87b33f6206361bbc1469a; page numbers are PDF pages, which equal the printed footer numbers): section 6.9 GPIO feature list (p.152): 'Any pin can be mapped to a peripheral for layout flexibility' and 'All pins can be used by the PPI task/event system'. SPIM section 6.25.3 Pin configuration (p.412) and PSEL.SCK/PSEL.MOSI/PSEL.MISO registers (p.419, PIN [0..31], PORT [0..1]): SCK, MOSI and MISO are mapped to physical pins by the PSEL.n registers. TWIM section 6.31.6 Master mode pin configuration (p.473) and PSEL.SCL/PSEL.SDA (p.474): SCL and SDA mapped by PSEL. UARTE section 6.34.8 Pin configuration (p.519): RXD and TXD mapped by PSEL.RXD/PSEL.TXD. PWM section 6.17.4 Pin configuration (p.265): OUT[n] mapped by PSEL.OUT[n]. timer_capture is routed through GPIOTE and PPI, not a dedicated pin: section 6.10 GPIOTE (p.160) 'events on pin state change ... carry out tasks through the PPI system' (IN[n] event on the pin chosen in CONFIG[n].PSEL, 8 channels), section 6.16 PPI (p.247) connects that event to the TIMER TASKS_CAPTURE[n] task (section 6.30 TIMER p.462, TASKS_CAPTURE[n] p.466); at most 8 pins at a time can be captured this way. Restrictions found: the card's pads (P0.06, P0.08, P0.13, P0.14) are plain GPIO pads with no 'low frequency I/O only' marking; other pads of the package tables (aQFN73 pp.578-580, e.g. P0.02, P0.03, P0.09, P0.10, P1.01-P1.07, P1.10-P1.15) are marked 'Standard drive, low frequency I/O' (signal up to 10 kHz, note p.580) and would not suit a fast bus; only one peripheral may drive a pin at a time (sections cited above); hardware peripheral only, a software implementation can use any pad"
functions = ["spi_sck", "spi_mosi", "spi_miso", "i2c_sda", "i2c_scl", "uart_tx", "uart_rx", "pwm", "timer_capture"]


[models.pin_capability.reset_mode]
basis = "nRF52840 Product Specification v1.7, GPIO chapter, PIN_CNF[n] reset value 0x00000002: DIR input, input buffer disconnected, no pull (PDF p.158); every GPIO of the card is therefore high impedance"

# nice!nano (v1/v2): an nRF52840 on the Pro Micro footprint. Its pin names are
# Nordic port pins ("P0.06", "P1.15-LF"), which the binder reads as p0<bit> /
# p1<bit>; the header numbering differs between footprint libraries, so no pad
# map is asserted here. The pro_micro entry deliberately does not match it
# (different ISA).
[[models]]
id = "nice_nano"
kind = "mcu"
description = "nice!nano module (nRF52840, Pro Micro footprint)"

[models.match]
value_re = "(?i)^nice[-_ !]*nano([-_ ]?v?[0-9.]+)?$"

[models.params]
backend = "renode:nrf52840"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "fe310"
kind = "mcu"
description = "SiFive FE310-G002 (RISC-V RV32IMAC, HiFive1)"

[models.match]
value_re = "(?i)^(FE310|FE310-G00[0-9]|HiFive1)"
mpn_re   = "(?i)^FE310"

[models.params]
# Renode backend: brings up sifive-fe310.repl. One 32-bit gpio0 port; roles
# "p0<bit>".
backend = "renode:sifive_fe310"
internal_clock = "internal HFROSC oscillator"

[models.pins]
"1"  = "vss"
"2"  = "vdd"
"3"  = "p019"       # HiFive1 LED is on GPIO 19
"4"  = "p021"       # second GPIO for blink
"5"  = "p017_txd"   # uart0 TX
"6"  = "p016_rxd"   # uart0 RX
[models.pin_capability.pull_up]
basis = "SiFive FE310-G002 Manual v1p4 (2022-02-18; sha256 fa0c889d124b45c873f4e3acc8501736e3d1e34641f0c91bc02878d51c05732f; file fetched from a third-party mirror, www.scs.stanford.edu/~zyedidia/docs/sifive/sifive-fe310.pdf, the SiFive document itself), chapter 17 GPIO: Table 50 register pue 'Internal pull-up enable' at offset 0x10 (printed p.78, PDF p.81); section 17.5 Internal Pull-Ups 'When configured as inputs, each pin has an internal pull-up which can be enabled by software' (printed p.79, PDF p.82). Not listed: the supply pads"
[models.pin_capability.pull_up.pads]
"3" = "GPIO19: GPIO pue[19] = 1 (internal pull-up enable, offset 0x10)"
"4" = "GPIO21: GPIO pue[21] = 1 (internal pull-up enable, offset 0x10)"
"5" = "GPIO17: GPIO pue[17] = 1 (internal pull-up enable, offset 0x10)"
"6" = "GPIO16: GPIO pue[16] = 1 (internal pull-up enable, offset 0x10)"

[models.ratings]
max_pin_current_a = 0.02
max_current_a = 0.1
max_voltage_v = 3.6
[models.pin_capability.adc]
basis = "SiFive FE310-G002 Manual v1p4 (2022-02-18), Contents (PDF p.4-10, chapters 1-24) lists no ADC or analog input peripheral; the only occurrence of 'ADCs' is Section 1.10 I2C (PDF p.15), where it names external converters on the I2C bus. Table 51 GPIO IOF Mapping (PDF p.83-84; printed p.80-81) has no analog function on any GPIO. So the package has no ADC input pad; hardware peripheral only"

[models.pin_capability.spi_sck]
basis = "SiFive FE310-G002 Manual v1p4 (2022-02-18), Table 51 GPIO IOF Mapping (PDF p.83-84; printed p.80-81 = PDF - 3): SPI1_SCK is IOF0 on GPIO5 and SPI2_SCK is IOF0 on GPIO29; the card's pads are GPIO16, GPIO17, GPIO19 and GPIO21, none of which has an SPI IOF. QSPI0 (the flash controller, Table 62 SPI Instances, printed p.88 = PDF p.91) is not an IOF and is not on the card's pads. Hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.spi_mosi]
basis = "SiFive FE310-G002 Manual v1p4 (2022-02-18), Table 51 GPIO IOF Mapping (PDF p.83-84; printed p.80-81): the SPI data-out line DQ0 (MOSI in single-lane mode, Table 75 SPI Protocol, printed p.94 = PDF p.97) is IOF0 on GPIO3 (SPI1_DQ0) and GPIO27 (SPI2_DQ0); the card's pads GPIO16, GPIO17, GPIO19 and GPIO21 have no SPI IOF. Hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.spi_miso]
basis = "SiFive FE310-G002 Manual v1p4 (2022-02-18), Table 51 GPIO IOF Mapping (PDF p.83-84; printed p.80-81): the SPI data-in line DQ1 (MISO in single-lane mode, Table 75, printed p.94 = PDF p.97) is IOF0 on GPIO4 (SPI1_DQ1) and GPIO28 (SPI2_DQ1); the card's pads GPIO16, GPIO17, GPIO19 and GPIO21 have no SPI IOF. Hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.i2c_sda]
basis = "SiFive FE310-G002 Manual v1p4 (2022-02-18), Table 51 GPIO IOF Mapping (PDF p.83-84; printed p.80-81): I2C0_SDA is IOF0 on GPIO12 only; the card's pads are GPIO16, GPIO17, GPIO19 and GPIO21. Hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.i2c_scl]
basis = "SiFive FE310-G002 Manual v1p4 (2022-02-18), Table 51 GPIO IOF Mapping (PDF p.83-84; printed p.80-81): I2C0_SCL is IOF0 on GPIO13 only; the card's pads are GPIO16, GPIO17, GPIO19 and GPIO21. Hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.uart_tx]
basis = "SiFive FE310-G002 Manual v1p4 (2022-02-18), Table 51 GPIO IOF Mapping (PDF p.83-84; printed p.80-81): UART0_TX is IOF0 on GPIO17, UART1_TX is IOF0 on GPIO18 (GPIO18 is not a pad of this card). Hardware peripheral only, a software (bit-banged) implementation can use any pad"
[models.pin_capability.uart_tx.pads]
"5" = "UART0_TX (GPIO17, IOF0)"

[models.pin_capability.uart_rx]
basis = "SiFive FE310-G002 Manual v1p4 (2022-02-18), Table 51 GPIO IOF Mapping (PDF p.83-84; printed p.80-81): UART0_RX is IOF0 on GPIO16, UART1_RX is IOF0 on GPIO23 (GPIO23 is not a pad of this card). Hardware peripheral only, a software (bit-banged) implementation can use any pad"
[models.pin_capability.uart_rx.pads]
"6" = "UART0_RX (GPIO16, IOF0)"

[models.pin_capability.pwm]
basis = "SiFive FE310-G002 Manual v1p4 (2022-02-18), Table 51 GPIO IOF Mapping (PDF p.83-84; printed p.80-81): PWM comparator outputs are IOF1 on GPIO0-3 (PWM0), GPIO10-13 (PWM2) and GPIO19-22 (PWM1: GPIO19 PWM1_PWM1, GPIO20 PWM1_PWM0, GPIO21 PWM1_PWM2, GPIO22 PWM1_PWM3); of the card's pads (GPIO16, 17, 19, 21) GPIO19 and GPIO21 carry a PWM output. Chapter 20 PWM Overview (PDF p.103): the PWM 'can generate multiple types of waveforms on output pins (pwm gpio)'. Hardware peripheral only"
[models.pin_capability.pwm.pads]
"3" = "PWM1_PWM1 (GPIO19, IOF1)"
"4" = "PWM1_PWM2 (GPIO21, IOF1)"

[models.pin_capability.timer_capture]
basis = "SiFive FE310-G002 Manual v1p4 (2022-02-18), Chapter 20 Pulse Width Modulator (PDF p.103-112; 20.1 PWM Overview, PDF p.103): the PWM peripheral has comparators that drive output pins and interrupts and no input-capture channel; Table 51 GPIO IOF Mapping (PDF p.83-84; printed p.80-81) lists the PWM IOFs only as outputs and no other timer function. The RTC and watchdog (Chapters 16 and 14) have no pin capture. So no pad feeds a hardware timer capture channel. Hardware peripheral only"


# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "rp2040"
kind = "mcu"
description = "Raspberry Pi RP2040 (Cortex-M0+ dual). QSPI_SS is the BOOTSEL strap."

[models.match]
value_re = "(?i)^RP2040(?:[-_ ]?QFN[-_ ]?56)?$"

[models.params]
# RP2040 co-sim runs on the renode:rp2040 descriptor in hauksbee-mcu. Renode
# ships no rp2040 platform, so the descriptor carries its own: the peripheral
# models are vendored C# compiled by Renode at run time through the support-bundle
# mechanism (db/mcu/rp2040/, src/renode/support.rs). Stock pico-sdk firmware boots
# through the real boot ROM into main().
#
# Proven end-to-end on a live machine: GPIO out/direction through the SIO
# (two-sided), UART0 TX, timers/clocks/resets as far as the SDK booting and
# sleep_ms costing the right virtual time, ADC injection on inputs 0..3, and the
# I2C bus-slave bridge on i2c0/i2c1 in both directions.
#
# Not available, and refused loudly rather than faked: SPI bus-slave (the
# vendored PL022 never invokes a registered slave), PIO (upstream models it on an
# x86-64-only native library), ADC input 4 (the on-die temperature sensor is not
# an external node, so it takes the merged policy's once-per-channel drop). The
# second core is declared and un-halted with the SIO genuinely shared, but no
# two-core firmware has been run. Full tier list: db/mcu/rp2040.soc.toml.
backend = "renode:rp2040"
internal_clock = "internal ring oscillator (ROSC)"

[models.pins]
# RP2040 QFN-56 (KiCad MCU_RaspberryPi_and_Boards:RP2040). The boot strap is
# QSPI_SS (pad 56): at reset the boot ROM samples it; pulled high (the flash
# chip-select idles high) = boot from QSPI flash (normal), held low = USB
# BOOTSEL mass-storage. The BOOTSEL button shorts it low through a series R.
# Pad 56 = QSPI_SS verified vs rp2040_minimal and SparkFun Thing Plus RP2040.
"56" = "qspi_ss"
# Pad 26 = RUN (RP2040 datasheet build 3184e62-clean 2025-02-20, Table 619 Miscellaneous pins, datasheet p.613: RUN,
# number 26, Digital In (FT), IOVDD domain, reset state Pull-Up, "Chip enable / reset"), the same pad as the
# rp2040_qfn56 map below. The identity entry maps only the two pads it needs for straps.
"26" = "run"
# Pad 23 = DVDD (Table 621 Power supply pins, PDF p.615: DVDD pads 23 and 50, core supply). The [models.reset]
# brown-out threshold below watches DVDD, so its supply_pin role must be a role in this map; pad 50 (the
# second DVDD pad) is carried as dvdd2 by the rp2040_qfn56 entry.
"23" = "dvdd"
[models.pin_capability.pull_up]
basis = "Raspberry Pi RP2040 Datasheet (build-version 3184e62-clean, build-date 2025-02-20, sha256 be56fbb75ba0ae9e26558a73c93ac3e75c2ad4e6878d3b6703de2a76d886ea8c): Table 614 Pin Types (p.612) 'Digital IO ... Programmable Pull-Up, Pull-Down'; Table 615 GPIO pins (pp.612-613) all GPIO0-GPIO29 Digital IO; section 2.19 PADS_BANK0 GPIO0-GPIO29 registers (Table 341, pp.301-302) bit 3 PUE 'Pull up enable'; Table 625 Digital IO (pp.615-616) RPU Pull-Up Resistance 50-80 kOhm. QSPI pins: Table 616 (p.613), PADS_QSPI Tables 344-348 (pp.303-304) with PUE. Not listed: RUN (fixed reset pull-up, no pad register, Table 619)"
[models.pin_capability.pull_up.pads]
"56" = "PADS_QSPI GPIO_QSPI_SS PUE (bit 3, Tables 346-348)"

# RP2040 Datasheet (build 3184e62, 2025-02-20). Printed page numbers (PDF page = printed + 1). The PL011 states no receiver tolerance table, so none is recorded.
[models.peripherals.uart]
source = "https://datasheets.raspberrypi.com/rp2040/rp2040-datasheet.pdf"
source_sha256 = "be56fbb75ba0ae9e26558a73c93ac3e75c2ad4e6878d3b6703de2a76d886ea8c"
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20), section 4.2 UART: introduction (p.418), section 4.2.3.1 clock signals (p.420), section 4.2.3.2.1 (p.421); section 2.15.3.1 Table 205 (p.183)"

[[models.peripherals.uart.clock_sources]]
name = "clk_peri (UARTCLK)"
max_hz = 133000000.0
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) Table 205 (p.183): clk_peri nominal 12 - 125 MHz, and the note that clk_sys (and clk_peri) have a maximum frequency of 133 MHz across all process, voltage and temperature variations; section 4.2.3.1 (p.420): FUARTCLK must be no more than 5/3 times FPCLK"

[models.peripherals.uart.baud]
formula = "Baud Rate Divisor = UARTCLK / (16 * Baud Rate) = UARTIBRD (16-bit integer) + UARTFBRD (6-bit fraction) / 64"
divisor_offset = 0.0
fraction_bits = 6
register_bits = 22
oversampling = [16]
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) section 4.2.3.2.1 Fractional baud rate divider (p.421): a 22-bit divisor of a 16-bit integer and a 6-bit fractional part; section 4.2.3.1 (p.420): FUARTCLK(min) >= 16 x baud(max)"

[[models.peripherals.uart.max_baud]]
oversampling = 16
baud_hz = 7800000.0
condition = "UARTCLK = 125 MHz (UARTCLK / 16, UART mode)"
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) section 4.2.1 Overview (p.418): 'Supports a maximum baud rate of UARTCLK / 16 in UART mode (7.8 Mbaud at 125MHz)'"

# RP2040 Datasheet (build 3184e62, 2025-02-20). Printed page numbers. No prescaler or selectable sample time is stated, so none is recorded.
[models.peripherals.adc]
source = "https://datasheets.raspberrypi.com/rp2040/rp2040-datasheet.pdf"
source_sha256 = "be56fbb75ba0ae9e26558a73c93ac3e75c2ad4e6878d3b6703de2a76d886ea8c"
resolution_bits = [12]
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20), section 4.9 ADC and Temperature Sensor: overview (p.557), section 4.9.2 (p.559), section 4.9.3 Table 566 (p.562); Table 205 (p.183); Table 627 (p.616)"

[models.peripherals.adc.clock]
source = "clk_adc, an independent clock with no prescaler in the ADC block"
required_hz = 48000000.0
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) Table 205 (p.183): clk_adc 'ADC reference clock. Must be 48MHz.'; section 4.9 overview (p.557): 500ksps using an independent 48MHz clock"

[[models.peripherals.adc.conversions]]
mode = "normal"
resolution_bits = 12
total_cycles = 96.0
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) section 4.9.2 (p.559): 96 cycles of clk_adc per conversion (96 x 1/48MHz = 2 us per sample); CS.READY goes high after 96 cycles"

[[models.peripherals.adc.max_sample_rate]]
resolution_bits = 12
max_hz = 500000.0
condition = "clk_adc = 48 MHz, one conversion per 96 cycles"
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) section 4.9 overview (p.557) and section 4.9.2 (p.559): 500 ksps"

[models.peripherals.adc.input]
sample_cap_f = 1e-12
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) section 4.9.2 (p.559): 'when sampling, it places about 1pF across the input'; the effective impedance even at 500ksps is over 100 kOhm (Table 627 RIN_ADC min 100 kOhm, p.616); no source-impedance limit is stated"

[[models.peripherals.adc.accuracy]]
resolution_bits = 12
enob_bits = 8.7
condition = "typical ENOB at 250 ksps, 997 Hz input, room temperature, across 3 typical, 3 fast and 3 slow corner devices (min 8.6, max 8.8)"
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) section 4.9.3 Tables 565-566 (pp.561-562), typical 8.7 bits; Table 627 (p.616) prints 8.7 bits as its minimum"

# Ref: RP2040 Datasheet (build 2.21), sec 2.8.1.2 "Boot sequence" and sec 2.8.6
# "Bootrom contents"; the GPIO_QSPI_SS pin must idle high (flash CS) for normal
# boot. Held low at reset selects the USB bootloader.
[[models.straps]]
role = "qspi_ss"
level = "high"
boot_select = true   # held low at reset selects the USB bootloader (BOOTSEL)
# RP2040 Datasheet build 3184e62-clean (2025-02-20) Table 348 p.304: PADS_QSPI
# GPIO_QSPI_SS resets with PUE = 1 (pull-up enabled), PDE = 0; sec 5.5 p.615
# RPU 50-80 kOhm. So an undriven QSPI_SS boots from flash, and only a pull-down
# strong enough to beat 50-80 kOhm (the BOOTSEL button's 1k) selects USB boot.
internal_pull = "pull_up"
note = "QSPI_SS (flash CS) high = boot from flash (normal); held low = USB BOOTSEL"

# RUN (pad 26). RP2040 datasheet build 3184e62-clean (2025-02-20): sec 1.4.2 Pin Descriptions p.11, "Global
# asynchronous reset pin. Reset when driven low, run when driven high. If no external reset is required, this pin can
# be tied directly to IOVDD"; Table 619 Miscellaneous pins p.613: RUN, number 26, Digital In (FT), reset state Pull-Up,
# "Chip enable / reset". Active low, with an internal pull-up, so an undriven RUN runs (not a floating-strap fault) and
# only a pull-down held low keeps the chip in reset. Not a boot-select input.
[[models.straps]]
role = "run"
level = "high"
boot_select = false
internal_pull = "pull_up"
note = "RUN is active low with an internal pull-up; held low it keeps the chip in reset"

# Output stage per drive-strength setting. RP2040 Datasheet Table 625 section 5.5.3.4
# PDF p.616-617: IOVDD 3.3 V, VOH min 2.62 V, VOL max 0.5 V, test current = the selected
# setting (2/4/8/12 mA). The 1.8 V and 2.5 V rows (VOH 1.24/1.78 V, VOL 0.3/0.4 V) are
# not carried: only the 3.3 V row is fitted.
[[models.output_drive]]
setting = "2 mA"
selector = 0   # PADS_BANK0 GPIOn DRIVE bits 5:4, 0x0 = 2MA (Table 341 PDF p.302-303)
vdd = 3.3
points = [
  { level = "high", current_a = 0.002, volts = 2.62 },
  { level = "low", current_a = 0.002, volts = 0.5 },
]
basis = "RP2040 Datasheet (target/launch/wp5-datasheets/rp2040-datasheet.pdf, downloaded 2026-10-22), Table 625 'Digital IO characteristics' section 5.5.3.4 PDF p.616-617 (printed 615-616): at IOVDD 3.3 V VOH min 2.62 V and VOL max 0.5 V with IOH/IOL = 2, 4, 8 or 12 mA 'depending on setting'; section 5.5.3.5 PDF p.618 defines VOH/VOL as the worst-case level at the setting's current, so the fitted resistance is the datasheet bound, not the typical curve (Figure 171 is graph-only)"

[[models.output_drive]]
setting = "4 mA"
selector = 1   # PADS_BANK0 GPIOn DRIVE bits 5:4, 0x1 = 4MA (Table 341 PDF p.302-303)
reset_default = true   # DRIVE reset value 0x1 = 4MA (Table 341 PDF p.302)
vdd = 3.3
points = [
  { level = "high", current_a = 0.004, volts = 2.62 },
  { level = "low", current_a = 0.004, volts = 0.5 },
]
basis = "RP2040 Datasheet (target/launch/wp5-datasheets/rp2040-datasheet.pdf, downloaded 2026-10-22), Table 625 'Digital IO characteristics' section 5.5.3.4 PDF p.616-617 (printed 615-616): at IOVDD 3.3 V VOH min 2.62 V and VOL max 0.5 V with IOH/IOL = 2, 4, 8 or 12 mA 'depending on setting'; section 5.5.3.5 PDF p.618 defines VOH/VOL as the worst-case level at the setting's current, so the fitted resistance is the datasheet bound, not the typical curve (Figure 171 is graph-only)"

[[models.output_drive]]
setting = "8 mA"
selector = 2   # PADS_BANK0 GPIOn DRIVE bits 5:4, 0x2 = 8MA (Table 341 PDF p.302-303)
vdd = 3.3
points = [
  { level = "high", current_a = 0.008, volts = 2.62 },
  { level = "low", current_a = 0.008, volts = 0.5 },
]
basis = "RP2040 Datasheet (target/launch/wp5-datasheets/rp2040-datasheet.pdf, downloaded 2026-10-22), Table 625 'Digital IO characteristics' section 5.5.3.4 PDF p.616-617 (printed 615-616): at IOVDD 3.3 V VOH min 2.62 V and VOL max 0.5 V with IOH/IOL = 2, 4, 8 or 12 mA 'depending on setting'; section 5.5.3.5 PDF p.618 defines VOH/VOL as the worst-case level at the setting's current, so the fitted resistance is the datasheet bound, not the typical curve (Figure 171 is graph-only)"

[[models.output_drive]]
setting = "12 mA"
selector = 3   # PADS_BANK0 GPIOn DRIVE bits 5:4, 0x3 = 12MA (Table 341 PDF p.302-303)
vdd = 3.3
points = [
  { level = "high", current_a = 0.012, volts = 2.62 },
  { level = "low", current_a = 0.012, volts = 0.5 },
]
basis = "RP2040 Datasheet (target/launch/wp5-datasheets/rp2040-datasheet.pdf, downloaded 2026-10-22), Table 625 'Digital IO characteristics' section 5.5.3.4 PDF p.616-617 (printed 615-616): at IOVDD 3.3 V VOH min 2.62 V and VOL max 0.5 V with IOH/IOL = 2, 4, 8 or 12 mA 'depending on setting'; section 5.5.3.5 PDF p.618 defines VOH/VOL as the worst-case level at the setting's current, so the fitted resistance is the datasheet bound, not the typical curve (Figure 171 is graph-only)"

# PADS_BANK0 GPIO0..GPIO29, Table 341 section 2.19.6.3 PDF p.301-303: base 0x4001c000,
# GPIO0 at +0x04, one 32-bit register per pin at a 4-byte stride, DRIVE = bits 5:4.
[models.drive_select]
port_bases = { "0" = 0x4001c004 }
register_stride = 4
pins_per_register = 1
lsb = 4
width = 2
basis = "RP2040 Datasheet Table 341 PADS_BANK0 GPIO0 register (PDF p.302-303): base 0x4001c000 + 0x04 + 4*n, DRIVE bits 5:4, 0x0=2MA 0x1=4MA 0x2=8MA 0x3=12MA, reset 0x1"

# Reset behaviour. RUN is the global asynchronous reset: low holds the chip in reset
# regardless of DVDD (section 2.12.5 PDF p.168; pin list Table 619 PDF p.614). The datasheet
# prints no RUN-specific VIL/VIH; RUN is typed 'Digital In (FT)' in the IOVDD domain, so the
# generic Table 625 input levels at IOVDD 3.3 V are applied by pin type (VIL max 0.8 V, VIH
# min 2.0 V, PDF p.616-617). Brown-out watches DVDD (the 1.1 V core), not IOVDD: nominal
# threshold 0.86 V at power-on or after a reset (section 2.12.3.2 PDF p.167, Table 194), BOD
# enabled at reset (BOD register EN reset 0x1, Table 190 PDF p.159-160). No rising threshold
# is printed, so release_above_v is absent.
[models.reset]
supply_pin = "dvdd"
assert_below_v = 0.86
pin_vil_v = 0.8
pin_vih_v = 2.0
basis = "RP2040 Datasheet: BOD threshold section 2.12.3.2 PDF p.167 and Table 194 PDF p.167 (DVDD, nominal 0.86 V, 0.83-0.89 V), BOD enabled at reset Table 190 PDF p.159-160; RUN pin section 2.12.5 PDF p.168, input levels Table 625 PDF p.616-617 applied by pin type"

[models.coverage]
implements = ["cortex_m0plus_firmware_execution", "boot_rom_to_main", "gpio_output_and_direction", "gpio_external_input", "uart0_tx", "virtual_clock_and_timers", "adc_external_channels_0_to_3", "i2c0_i2c1_controller_bridge", "shared_sio_register_state"]
missing = ["spi_external_slave", "pio", "adc_temperature_channel_4", "proven_two_core_firmware", "usb_device_controller", "dma_fidelity", "silicon_power_current_profile", "silicon_timing_and_errata", "missing_external_crystal_startup_validation"]

# ─────────────────────────────────────────────────────────────────────────────

# The identity entry above retains pad56 when the package is absent or unknown.
# Only this more specific match supplies the complete numeric pad map.

# Boot-mode table (BOOT STRAPS package): the pins that select the boot source, the
# vendor's table, and where each value comes from.
[models.strap_latch]
event = "reset_release"
note  = "RP2040 has NO hardware latch on the strap. After RUN is high and the chip leaves reset, processor 0 runs the bootrom, which checks whether the SPI CS pin (QSPI_SS) is tied low ('bootrom button') and skips flash boot if so. The pin is sampled once, by software, after the watchdog-scratch check and before the QSPI pins are set up; the pin's reset state is a pull-up"
cite  = "RP2040 Datasheet, section 2.8.1 'Processor Controlled Boot Sequence', PDF p.130-131 (printed 129-130); Table 616 QSPI pins (QSPI_CSn, Pull-Up) PDF p.614 (printed 613)"

[models.reset_input]
role = "run"
vil  = [0.0, 0.8]                  # IOVDD = 3.3 V row of Table 625: VIL max 0.8 V. (1.8 V row: 0.35 x IOVDD; 2.5 V row: 0.7 V)
vih  = [0.0, 2.0]                  # IOVDD = 3.3 V row: VIH min 2 V. (1.8 V row: 0.65 x IOVDD; 2.5 V row: 1.7 V)
cite = "RP2040 Datasheet, Table 619 'Miscellaneous pins' (RUN, pin 26, 'Digital In (FT)', Pull-Up, 'Chip enable / reset') PDF p.614 (printed 613); Table 625 'Digital IO characteristics - Standard and FT unless otherwise stated', VIH/VIL at IOVDD=3.3V, PDF p.616 (printed 615). RUN has no separate threshold row, so the generic digital-IO rows are applied"

[[models.boot_inputs]]
role = "qspi_ss"
pin = "QSPI_SS (QSPI_CSn)"
internal_pull = "pull_up"
vil = [0.0, 0.8]                   # Table 625, IOVDD = 3.3 V
vih = [0.0, 2.0]
note = "Hardware design guide: QSPI_SS is connected to the flash and also has two resistors. R2 is a pull-up to 3.3 V (10 kohm, marked DNF/Do Not Fit on the reference schematic). R1 is a 1 kohm resistor in series with the header J2 labelled 'USB_BOOT' to ground: 'It is important to include resistor R1, as this allows the QSPI_SS pin to safely over-drive the applied pull-down when the RP2040 starts booting.' The guide shows a jumper header; it contains no push-button (BOOTSEL button) text"
cite = "RP2040 Datasheet Table 616 'QSPI pins' (QSPI_CSn, pin 56, Pull-Up) PDF p.614 (printed 613); Table 625 PDF p.616 (printed 615); Hardware design with RP2040, section 2.2 'Flash storage', PDF p.10 (printed 9)"

[[models.boot_modes]]
name = "BOOTSEL (USB boot)"
when = { qspi_ss = "low" }
outcome = "rom_bootloader"
detail = "QSPI_SS held low at boot: the bootrom skips flash boot and drops to USB device boot, where RP2040 appears as a USB Mass Storage Device (UF2 drag-and-drop programs the SPI flash or loads and runs code in SRAM; an extended PICOBOOT interface is also available). The user firmware in flash does not run. Needs the 12 MHz crystal or clock input the USB bootloader requires"
cite = "RP2040 Datasheet, section 2.8.1, PDF p.131 (printed 130); section 1.4.2 'Pin Descriptions' Table 1 (XIN and XOUT row) PDF p.12 (printed 11); Hardware design with RP2040 section 2.2 'Flash storage' PDF p.10 (printed 9)"

[[models.boot_modes]]
name = "Flash boot"
when = { qspi_ss = "high" }
outcome = "user_flash"
detail = "QSPI_SS not low: the bootrom sets up the QSPI pins, issues the XIP exit sequence, copies 256 bytes from SPI flash into SRAM5 and checks a CRC32; if the checksum passes it treats the bytes as a valid second stage and executes them from SRAM. If no valid image is found after 0.5 seconds of attempting to boot, the bootrom drops to USB device boot (the same USB mass-storage mode as BOOTSEL), so a blank or corrupt flash ends up in USB boot even with QSPI_SS high. Earlier, non-pin routes can pre-empt flash boot: a Rescue DP power-up halts, and watchdog scratch registers set to indicate pre-loaded SRAM code jump to that code"
cite = "RP2040 Datasheet, section 2.8.1 'Processor Controlled Boot Sequence' and 2.8.1.2 'Flash Boot Sequence', PDF pp.130-131 (printed 129-130)"

[models.rom_bootloader]
protocol = "usb_only"
cite = "RP2040 Datasheet, section 2.8 'Bootrom' (USB MSC class-compliant bootloader with UF2 support; PICOBOOT interface), PDF p.129 (printed 128); section 2.8.4 'USB Mass Storage Interface' PDF p.144 (printed 143)"
[models.pin_capability.adc]
