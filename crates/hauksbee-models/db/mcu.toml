# ─────────────────────────────────────────────────────────────────────────────
# STM32F767/F777/F779 (LQFP100). Co-simulates on the stock Renode F746 platform
# widened to 512 KB SRAM with UART7/UART8 (db/mcu/stm32f7.soc.toml). Pad map
# derived from the TR-9 mainboard (U1, STM32F777VIT, a symbol with unnamed
# pads) by its pad nets: 12 crystal oscillator, 14 NRST, 20/21 VREF/VDDA,
# 22/23/25 ADC nets on PA0/PA1/PA3, 28 DAC (PA4), 37/38 UART7 RX/TX (PE7/PE8),
# 46/47 USART3 (PB10/PB11), 48/73 VCAP, 52-54 SPI2 (PB13-15), 68/69 USART1
# (PA9/PA10), 70/71 USB (PA11/PA12), 72/76 SWDIO/SWCLK, 83 SD_CMD (PD2),
# 86/87 USART2 (PD5/PD6), 92/93 I2C1 (PB6/PB7), 94 BOOT0.

# Boot-mode table (BOOT STRAPS package): the pins that select the boot source, the
# vendor's table, and where each value comes from.
# Boot source = PB8-BOOT0 pin only when option bit nSWBOOT0 = 1 (FLASH_OPTR bit 26); with nSWBOOT0 = 0 the nBOOT0 option
# bit (bit 27) is used instead. BOOT_LOCK (FLASH_SEC1R bit 16) = 1 forces main flash. nBOOT1 = FLASH_OPTR bit 23.
# FACTORY DEFAULT modelled: FLASH_OPTR 0xFFEF F8AA (nBOOT1 = 1, nBOOT0 = 1, nSWBOOT0 = 1), FLASH_SEC1R 0xFF00 FF00
# (BOOT_LOCK = 0), so the PB8 pin selects and nBOOT1 = 1.
[models.strap_latch]
event = "reset_release"
note  = "the BOOT0 pin (PB8) is latched, together with the nBOOT1 option bit, on the 4th edge of the internal startup clock source after reset release, and re-sampled when exiting Standby; model state is the factory default nSWBOOT0 = 1, nBOOT1 = 1, BOOT_LOCK = 0; PB8 reverts to analog mode once reset is released"
cite  = "RM0440 Rev 9, section 2.6.1 'Boot configuration', Table 5 (PDF p.91) and text (latched on the 4th edge of the internal startup clock source, PDF p.92); OPTR production value 0xFFEF F8AA PDF p.111; FLASH_SEC1R production value 0xFF00 FF00 PDF p.115"

[models.reset_input]
role = "reset"
vil  = [0.3, 0.0]
vih  = [0.7, 0.0]
cite = "DS12288 Rev 6 (STM32G474xB/xC/xE), Table 58 'NRST pin characteristics', PDF p.133: VIL(NRST) max 0.3xVDD, VIH(NRST) min 0.7xVDD; PG10-NRST pad 7 (UFQFPN48 and LQFP48), Table 12 PDF p.58"

[[models.boot_inputs]]
role = "pb8_boot0"
internal_pull = "unknown"
vil = [0.3, 0.0]
vih = [0.7, 0.0]
cite = "DS12288 Rev 6, Table 54 'I/O static characteristics', PDF p.128, row 'All except FT_c' (VIL max 0.3xVDD, VIH min 0.7xVDD); PB8-BOOT0 pin type FT_f (not FT_c), Table 12 PDF p.71, pad 46 (UFQFPN48; 45 on LQFP48). Mode: input during the reset phase, RM0440 Rev 9 PDF p.92 (no pull stated)"

[[models.boot_modes]]
name = "main flash"
when = { pb8_boot0 = "low" }
outcome = "user_flash"
detail = "factory option bits (BOOT_LOCK = 0, nSWBOOT0 = 1) with the BOOT0 pin low: main Flash memory is selected as boot area (nBOOT1 is a don't-care); user firmware runs"
cite = "RM0440 Rev 9, Table 5 row 'BOOT_LOCK 0, nBOOT1 X, nBOOT0 X, BOOT0 pin 0, nSWBOOT0 1', PDF p.91"

[[models.boot_modes]]
name = "system memory (factory nBOOT1 = 1)"
when = { pb8_boot0 = "high" }
outcome = "rom_bootloader"
detail = "factory option bits (BOOT_LOCK = 0, nBOOT1 = 1, nSWBOOT0 = 1) with the BOOT0 pin high: system memory (ST bootloader, 0x1FFF0000) is the boot area; user firmware does not run"
cite = "RM0440 Rev 9, Table 5 row 'BOOT_LOCK 0, nBOOT1 1, nBOOT0 X, BOOT0 pin 1, nSWBOOT0 1', PDF p.91; AN2606 Rev 70 Table 2 Pattern 14, PDF p.34-36"

[models.rom_bootloader]
protocol = "st_usart"
version = 0x31
product_id = 0x0469
commands = [0x00, 0x01, 0x02, 0x11, 0x21, 0x31, 0x44, 0x63, 0x73, 0x82, 0x92]
port = "USART1 PA9 (TX) / PA10 (RX) or USART2 PA2 (TX) / PA3 (RX), 8E1"
cite = "AN3155 Rev 22 Table 2 (command codes); AN2606 Rev 70 Table 3 (USART V3.1), Table 117 PDF p.279 (pins; USART3 PC10/PC11 has no LQFP48 pad, DS12288 Table 12), Table 226 PDF p.520 (PID 0x469). The Get command list and version byte are derived, not printed per device."
[models.pin_capability.spi_sck]
basis = "STMicroelectronics STM32G474xB/xC/xE datasheet DS12288 Rev 6, Table 13 'Alternate function' AF0..AF15 (PDF page = printed page: port A p.73, port B p.74, port C p.75, port F p.78), LQFP48 pads of this card's pin map only (ports PA, PB, PC, PF): SPI1/SPI2/SPI3/SPI4 SCK (AF5/AF6) pads. USART as SPI: section 3.29 (p.42) says USART1, USART2 and USART3 provide 'an SPI-like communication capability' and Table 9 'USART/UART/LPUART features' (p.42) lists Synchronous mode for USART1/2/3 only (UART4/5 and LPUART1 have none); RM0440 Rev 9 section 40.5.2 'USART signals' (printed p.1693) says CK is the clock output in synchronous SPI master mode and the clock input in SPI slave mode, and the 'Slave mode' text (SLVEN, printed p.1720) confirms slave operation, so a USART can serve SPI as master or slave and its TX/RX data pads appear in both spi_mosi and spi_miso; a USART pad is counted only when that USART's CK pad is in the card's map (USART1_CK PA8, USART2_CK PA4/PB5, USART3_CK PB12 are all mapped). I2S2/I2S3 pads are not SPI and are not counted; hardware peripheral only, a software (bit-banged) implementation can use any pad; no pad of this table is master_only: a USART CK pad is the clock output in SPI master mode and the clock input in SPI slave mode (RM0440 printed p.1693), so it serves the bus whichever side the MCU is"
[models.pin_capability.spi_sck.pads]
"6" = "SPI2_SCK (AF5)"
"12" = "USART2_CK (AF7)"
"13" = "SPI1_SCK (AF5)"
"26" = "USART3_CK (AF7)"
