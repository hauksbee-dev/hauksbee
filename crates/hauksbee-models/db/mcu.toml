[models.pin_capability.pull_up]
basis = "ESP32-S3 chip, QFN 7x7 56-pin: pad-to-GPIO mapping from the ESP32-S3 Series Datasheet v2.2 Table 2-1 Pin Overview (pp.16-17). Espressif ESP32-S3 Series Datasheet v2.2 (sha256 2d5a7cb7fd559d8d972bd88db32669c0196d23f22d7afaafb0f63d099b589a3f) Table 2-1 Pin Overview (pp.16-17) and note 6 (p.18): WPU 'internal weak pull-up resistor enabled', 'pin internal weak pull-up and pull-down resistors ... configurable by IO_MUX_FUN_WPU/WPD'. ESP32-S3 Technical Reference Manual v1.8 (sha256 4484bf8a69035ec42a731c58c64ada6fbd1f1618c5559409f134d9ea083f444f) section 6.4.3 (p.476) 'Set or clear IO_MUX_FUN_WPU and IO_MUX_FUN_WPD ... to enable or disable pull-up and pull-down resistors' and Register 6.36 IO_MUX_GPIOn_REG (n: 0-21, 26-48) IO_MUX_FUN_WPU (p.514). Not listed: CHIP_PU (reset) and supply pads"
[models.pin_capability.pull_up.pads]
"5" = "GPIO0: IO_MUX_GPIO0_REG FUN_WPU = 1 (internal pull-up)"
"8" = "GPIO3: IO_MUX_GPIO3_REG FUN_WPU = 1 (internal pull-up)"
"51" = "GPIO45: IO_MUX_GPIO45_REG FUN_WPU = 1 (internal pull-up)"
"52" = "GPIO46: IO_MUX_GPIO46_REG FUN_WPU = 1 (internal pull-up)"

# ESP32-S3 Series Datasheet v2.2: Table 2-10 Analog Pins p.28, CHIP_PU pin 4 "High: on, enables the chip
