baud_hz = 2000000.0
condition = "fOSC = 16 MHz, U2Xn = 1, UBRRn = 0 (fOSC / 8)"
basis = "Table 20-7 (p.199), fosc = 16.0000 MHz column, Max. row: 2 Mbps"

