# ─────────────────────────────────────────────────────────────────────────────
# ATtiny85 (and the low-voltage ATtiny85V), simavr core "attiny85".
#
# Source: Atmel 2586Q-AVR-08/2013 "ATtiny25/45/85", page 2, Figure 1-1 "Pinout
#   ATtiny25/45/85" (PDIP/SOIC/TSSOP 8-pin, and QFN/MLF 20-pad),
#   https://ww1.microchip.com/downloads/en/DeviceDoc/Atmel-2586-AVR-8-bit-Microcontroller-ATtiny25-ATtiny45-ATtiny85_Datasheet.pdf
#   and section 21.1 Absolute Maximum Ratings.
#
# THE TWO PACKAGES NUMBER THE SAME PORT PINS DIFFERENTLY (PB4 is pin 3 on the
# SOIC and pad 5 on the MLF), so this follows the ESP32 pattern: a value-only
# identity entry with no pad map (roles come from the board's own pin names),
# plus one footprint-gated entry per package whose map was read off Figure 1-1.
# The footprint match adds specificity, so the package entry wins when it applies.
#
# The core clock is the card's `default_clock_hz` (the internal 8 MHz RC) unless
# a bound crystal states another. A Trinket's 16.5 MHz PLL is not modelled.
[[models]]
id = "attiny85"
kind = "mcu"
description = "ATtiny85 8-bit AVR MCU, package not recognised"

[models.match]
value_re = "(?i)^ATtiny85V?([-_]?(10|20))?([-_]?(PU|SU|SUR|SH|SF|SN|S|P|MU|MUR|MF|M))?$"

[models.params]
# Crystal load capacitors: ATtiny25/45/85 datasheet, Table 6-12 "Crystal Oscillator Operating Modes"
# (PDF p. 30): recommended range for capacitors C1 and C2, 12-22 pF.
xtal_cap_min_f = 12.0e-12
xtal_cap_max_f = 22.0e-12
backend = "simavr:attiny85"
internal_clock = "internal 8 MHz RC oscillator"
default_clock_hz = 8000000

[models.ratings]
max_pin_current_a = 0.04  # 21.1 Absolute Maximum Ratings, DC current per I/O pin 40.0 mA
max_current_a = 0.2       # DC current VCC and GND pins, 200.0 mA
max_voltage_v = 6.0       # Maximum Operating Voltage 6.0 V
# Atmel ATtiny25/45/85 datasheet 2586Q-AVR-08/2013, section 17 (ADC) and section 21 Table 21-8 (ADC Characteristics, Single Ended Channels). Printed page numbers. The part has no UART (USI only), so there is no uart table.
[models.peripherals.adc]
source = "https://ww1.microchip.com/downloads/en/DeviceDoc/Atmel-2586-AVR-8-bit-Microcontroller-ATtiny25-ATtiny45-ATtiny85_Datasheet.pdf"
source_sha256 = "0e3fa6a7d608de9b4403cf9fc12867a529cc891ab6a83f9be9ed0db595480837"
resolution_bits = [10]
basis = "Atmel ATtiny25/45/85 datasheet 2586Q-AVR-08/2013, ADC: features section 17.1 (p.122), section 17.5 (p.125), Table 17-1 (p.127), section 17.8 (p.129), Table 17-5 (p.136), Table 21-8 (p.167)"

[models.peripherals.adc.clock]
source = "system clock divided by the ADPS[2:0] prescaler"
prescalers = [2, 4, 8, 16, 32, 64, 128]
min_hz = 50000.0
max_hz = 1000000.0
full_resolution_min_hz = 50000.0
full_resolution_max_hz = 200000.0
basis = "Table 17-5 (p.136): ADPS 000 and 001 both divide by 2, then 4, 8, 16, 32, 64, 128; Table 21-8 (p.167) Clock Frequency: 50 kHz min, 1000 kHz max; section 17.5 (p.125): 50 kHz to 200 kHz for maximum resolution, and 'It is not recommended to use a higher input clock frequency than 1 MHz'"

[[models.peripherals.adc.conversions]]
mode = "first_after_enable"
resolution_bits = 10
sample_cycles = [13.5]
total_cycles = 25.0
basis = "Table 17-1 (p.127) ADC conversion time, 'First conversion': sample and hold at 13.5 cycles from start of conversion, conversion time 25 cycles"

[[models.peripherals.adc.conversions]]
mode = "normal"
resolution_bits = 10
sample_cycles = [1.5]
total_cycles = 13.0
basis = "Table 17-1 (p.127) ADC conversion time, 'Normal conversions': sample and hold at 1.5 cycles from start of conversion, conversion time 13 cycles"

[[models.peripherals.adc.conversions]]
mode = "auto_triggered"
resolution_bits = 10
sample_cycles = [2.0]
total_cycles = 13.5
basis = "Table 17-1 (p.127) ADC conversion time, 'Auto Triggered conversions': sample and hold at 2 cycles from start of conversion, conversion time 13.5 cycles"

[[models.peripherals.adc.max_sample_rate]]
resolution_bits = 10
max_hz = 15000.0
condition = "maximum resolution (ADC clock 50-200 kHz)"
basis = "section 17.1 Features (p.122): 'Up to 15 kSPS at Maximum Resolution'"

[models.peripherals.adc.input]
sample_cap_f = 1.4e-11
input_series_ohms_min = 1000.0
input_series_ohms_max = 100000.0
max_source_ohms = 10000.0
basis = "Figure 17-8 (p.129): series 1..100 kOhm into CS/H = 14 pF; section 17.8 (p.129): optimised for an output impedance of approximately 10 kOhm or less"

[[models.peripherals.adc.accuracy]]
resolution_bits = 10
