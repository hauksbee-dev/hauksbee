# ─────────────────────────────────────────────────────────────────────────────
# ATmega168 / ATmega168V in the 32-pin packages (32-pad MLF and 32-lead TQFP).
#
# Source: Atmel "ATmega48/V / 88/V / 168/V Datasheet Complete",
#   Atmel-2545W-11/2016. Figure 5-3 (32-pin TQFP) and Figure 5-4 (32-pin MLF)
#   draw one pinout; Features, "Operating Voltage" (2.7-5.5 V, 1.8-5.5 V for the
#   V grade); Table 33-1 Absolute Maximum Ratings.
#
# NOT THE 328P MAP. The 328P card above carries a DIP-28 numbering. The 32-pin
# packages add ADC6/ADC7 and a second VCC/GND pair, so pad 3 is GND here and
# PD1 on a DIP. The value regex therefore requires a 32-pin package code (Eagle's
# "MLF" suffix, or the -AU/-MU order codes) and a bare "ATmega168" stays open.
# The exposed pad is soldered to ground (Figure 5-4 note) and has no pad number.
[[models]]
id = "atmega168_32pin"
kind = "mcu"
description = "ATmega168/168V 8-bit AVR MCU, 32-pad MLF or 32-lead TQFP"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://ww1.microchip.com/downloads/en/DeviceDoc/Atmel-2545-8-bit-AVR-Microcontroller-ATmega48-88-168_Datasheet.pdf"
title = "Atmel ATmega48/V / 88/V / 168/V Datasheet Complete, Atmel-2545W-11/2016"
locator = "Features (Operating Voltage); 5.1 Figure 5-3 and Figure 5-4; 33.1 Table 33-1"
sha256 = "6dd5823d902bb87d170f0c26c918c49db4cd3deba906cba870b229f2607e7465"

[models.match]
value_re = "(?i)^ATmega168V?(MLF|[-_ ]?(10|20)?(AU|MU)R?)$"

[models.params]
# Crystal load capacitors: ATmega48A/PA/88A/PA/168A/PA/328/P datasheet, Table 9-3 "Low Power
# Crystal Oscillator Operating Modes" and Table 9-5 "Full Swing Crystal Oscillator operating modes"
# (PDF pp. 39-40): recommended range for capacitors C1 and C2 with crystals, 12-22 pF.
xtal_cap_min_f = 12.0e-12
xtal_cap_max_f = 22.0e-12
backend = "simavr:atmega168"
internal_clock = "internal 8 MHz RC oscillator"
