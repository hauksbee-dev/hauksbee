# MCU and module models.

[[models]]
id = "atmega328p"
kind = "mcu"
description = "ATmega328P 8-bit AVR MCU, TQFP-32 or DIP-28"

[models.match]
value_re   = "(?i)^ATmega328P?$"
mpn_re     = "(?i)^ATmega328P"

[models.params]
# hauksbee-mcu backend identifier, tells the co-sim layer which emulator core
# to instantiate.
backend = "simavr:atmega328p"

[models.pins]
