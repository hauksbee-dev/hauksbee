# Same executable scope and boot strap as the identity entry (tested for equality).
# Mapping XIN/XOUT does not make the backend enforce external-crystal presence.
[[models.straps]]
role = "qspi_ss"
level = "high"
boot_select = true
internal_pull = "pull_up"   # Table 348 p.304 PUE reset 1; see the identity entry
note = "QSPI_SS (flash CS) high = boot from flash (normal); held low = USB BOOTSEL"

# RUN (pad 26). RP2040 datasheet build 3184e62-clean (2025-02-20): sec 1.4.2 Pin Descriptions p.11, "Global
# asynchronous reset pin. Reset when driven low, run when driven high. If no external reset is required, this pin can
# be tied directly to IOVDD"; Table 619 Miscellaneous pins p.613: RUN, number 26, Digital In (FT), reset state Pull-Up,
# "Chip enable / reset". Active low, with an internal pull-up, so an undriven RUN runs (not a floating-strap fault) and
# only a pull-down held low keeps the chip in reset. Not a boot-select input.
[[models.straps]]
role = "run"
level = "high"
boot_select = false
internal_pull = "pull_up"
note = "RUN is active low with an internal pull-up; held low it keeps the chip in reset"

# The on-chip core regulator's output, wired off-chip to DVDD. It comes up at
# 1.1 V and firmware only changes it on purpose, so a board naming the net after
# another level ("+1V2") does not set the core voltage.
[[models.supply_outputs]]
role = "vreg_vout"
nominal = 1.1
min = 1.067
max = 1.133
basis = "RP2040 Datasheet build-date 2025-02-20 (build 3184e62-clean) §2.10.3 Output Voltage Select: output set to 1.1 V at initial power-on or following a reset; Table 192 ΔVREG_VOUT -3/+3 % of selected output voltage"

# Each supply domain has its own recommended range, so co-sim judges the 1.1 V
# DVDD core pads and the 3.3 V IOVDD pads each against their own row.
[[models.envelope]]
kind = "supply_range"
pin = "iovdd"
min_v = 1.62
max_v = 3.63
abs_max_v = 3.63
basis = "RP2040 Datasheet build-date 2025-02-20, Table 634 Power Supply Specifications, IOVDD Digital IO 1.62-3.63 V; Table 622 Absolute maximum IOVDD 3.63 V"

[[models.envelope]]
kind = "supply_range"
pin = "dvdd"
min_v = 1.05
max_v = 1.16
basis = "RP2040 Datasheet build-date 2025-02-20, Table 634 Power Supply Specifications, DVDD Digital core 1.05-1.16 V (1.1 V typ, from VREG_VOUT)"

[[models.envelope]]
kind = "supply_range"
pin = "vreg_vin"
min_v = 1.62
max_v = 3.63
basis = "RP2040 Datasheet build-date 2025-02-20, Table 634 Power Supply Specifications, VREG_VIN Voltage regulator 1.62-3.63 V"

[[models.envelope]]
kind = "supply_range"
pin = "usb_vdd"
min_v = 3.135
max_v = 3.63
basis = "RP2040 Datasheet build-date 2025-02-20, Table 634 Power Supply Specifications, USB_VDD USB PHY 3.135-3.63 V"

[[models.envelope]]
kind = "supply_range"
pin = "adc_avdd"
min_v = 1.62
max_v = 3.63
basis = "RP2040 Datasheet build-date 2025-02-20, Table 634 Power Supply Specifications, ADC_AVDD ADC 1.62-3.63 V (ADC performance compromised below 2.97 V)"

# Output stage per drive-strength setting. RP2040 Datasheet Table 625 section 5.5.3.4
# PDF p.616-617: IOVDD 3.3 V, VOH min 2.62 V, VOL max 0.5 V, test current = the selected
# setting (2/4/8/12 mA). The 1.8 V and 2.5 V rows (VOH 1.24/1.78 V, VOL 0.3/0.4 V) are
# not carried: only the 3.3 V row is fitted.
[[models.output_drive]]
setting = "2 mA"
selector = 0   # PADS_BANK0 GPIOn DRIVE bits 5:4, 0x0 = 2MA (Table 341 PDF p.302-303)
vdd = 3.3
points = [
  { level = "high", current_a = 0.002, volts = 2.62 },
  { level = "low", current_a = 0.002, volts = 0.5 },
]
