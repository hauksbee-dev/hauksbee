"6" = "pc2_scl"            # FT
"7" = "pc4_a2"
"8" = "pd4_pd5_pd1_swio"   # PD4 (A7), PD5 (UTX/A5), PD1 (SWIO) bonded together
[models.pin_capability.pull_up]
basis = "WCH CH32V003 Datasheet V1.8 (sha256 186210d35123325ea49305e3a0152cbfa6e377d8e6efc2e610e3497daabe17f8; PDF page numbers, printed page = PDF page - 2): section 1.4.16 General-purpose Input and Output (GPIO) 'Each pin can be configured by software as output (push-pull or open-drain), input (with or without pull-up or pull-down)' (PDF p.10); Table 3-16 General-purpose I/O static characteristics RPU weak pull-up equivalent resistance 35/45/55 kOhm (PDF p.23); Table 2-1 Pin definitions SOP8 column maps SOP8 pin 1 to PD6 and PA1, pin 3 to PA2, pin 5 to PC1, pin 6 to PC2, pin 7 to PC4, pin 8 to PD4, PD5 and PD1 (PDF pp.13-14). Not listed: pads 1 (PD6/PA1) and 8 (PD4/PD5/PD1/SWIO), each of which bonds several port bits to one pad, which the datasheet does not resolve into a single pad-level pull statement; pad 2 (VSS) and pad 4 (VDD)"
[models.pin_capability.pull_up.pads]
"3" = "PA2: GPIO input with pull-up"
"5" = "PC1: GPIO input with pull-up"
"6" = "PC2: GPIO input with pull-up"
"7" = "PC4: GPIO input with pull-up"

