# ATmega328P in the 28-pad QFN/MLF (ordering code -MMH / -MMHR, package 28M1).
#
# Source: Microchip ATmega328P DS40002061A, section 1 "Pin Configurations",
#   Figure 1-1 "28 MLF Top View" (PDF page 12), and section 38.8 ordering table
#   (PDF page 635): ATmega328P-MMH is package 28M1, "28-pad, 4 x 4 x 1.0 body,
#   Lead Pitch 0.45mm QFN/MLF".
#
# A THIRD NUMBERING. It is neither the DIP-28 one (pad 3 is VCC here, PD1 on the
# DIP) nor the 32-pad one (pad 3 is GND there): PD3 is pad 1, PD4 pad 2, VCC
# pad 3, GND pad 4, then PB6/PB7 on pads 5/6. The bottom pad is soldered to
# ground. The footprint gate adds specificity, so this entry wins on a 28-pad
# QFN/MLF footprint.
[[models]]
id = "atmega328p_28mlf"
kind = "mcu"
description = "ATmega328P 8-bit AVR MCU, 28-pad QFN/MLF (28M1)"

[models.match]
value_re     = "(?i)^ATmega328P?$"
mpn_re       = "(?i)^ATmega328P"
footprint_re = '(?i)(QFN|MLF)[-_]*28([^0-9]|$)'

[models.params]
# Crystal load capacitors: ATmega48A/PA/88A/PA/168A/PA/328/P datasheet, Table 9-3 "Low Power
# Crystal Oscillator Operating Modes" and Table 9-5 "Full Swing Crystal Oscillator operating modes"
# (PDF pp. 39-40): recommended range for capacitors C1 and C2 with crystals, 12-22 pF.
xtal_cap_min_f = 12.0e-12
xtal_cap_max_f = 22.0e-12
backend = "simavr:atmega328p"
internal_clock = "internal 8 MHz RC oscillator"
default_clock_hz = 8000000
max_adc_source_impedance_ohms = 10000.0
# Microchip megaAVR DS40002061B (ATmega48A/PA/88A/PA/168A/PA/328/P), Table 30-1 "Common
# DC characteristics" (Continued): RRST "Reset Pull-up Resistor", 30 kOhm min, 60 kOhm max.
# The minimum, for the held-off check's divider against an external pull-down.
reset_pull_up_ohms = 30000.0

