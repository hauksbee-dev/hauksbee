# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   AN2606 Rev 70 (February 2026), https://www.st.com/resource/en/application_note/an2606-stm32-microcontroller-system-memory-boot-mode-stmicroelectronics.pdf sha256 25b466e39ecc61671dcb988d8ca538462d6452d85f68140cb981ed728f57e654;
#   AN3155 Rev 22 (September 2026), https://www.st.com/resource/en/application_note/an3155-usart-protocol-used-in-the-stm32-bootloader-stmicroelectronics.pdf sha256 0e3e1c35ffa3311aba33440d9d6236dc2f59af8a7f32482cf13d1d0af8c5e1f9;
#   RM0008 Rev 20 (cached copy target/launch/wp1-datasheets/rm0008.pdf; ST URL https://www.st.com/resource/en/reference_manual/rm0008-stm32f101xx-stm32f102xx-stm32f103xx-stm32f105xx-and-stm32f107xx-advanced-armbased-32bit-mcus-stmicroelectronics.pdf) sha256 097bc47ab8aa0c5d4a68f836dbab95c5b9acb2b0c8116a2959307743204b5097.

[[models.pin_bias]]
role = "pa10"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 45 (STM32F10xxx configuration in system memory boot mode) PDF p.116, USART1_RX pin: \"PA10 pin: USART1 in reception mode. Used in input no pull mode.\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0008 Rev 20 PDF p.790 section 27.3.1 USART character description: \"The TX pin is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\" AN2606 Rev 70 Figure 1 note 1, PDF p.47: \"A pull-up resistor must be added, if they are not connected on host side\"; section 4.3, PDF p.49: \"It is recommended to keep the RX pins of unused bootloader interfaces (USART_RX, SPI_MOSI, and CAN_RX, if present) at a known (low or high) level\"."
note = "The ROM bootloader detects a USART host by the start bit of its 0x7F frame, so a pull-down or a tie to ground on this pin holds the line in the break state and the bootloader cannot detect a host on this USART (its other interfaces still work). AN2606 allows an unused bootloader RX pin at either known level, so this matters only when the board is flashed over this USART; a missing bias is not reported, only one the wrong way round."

[[models]]
id = "stm32f401c"
kind = "mcu"
description = "STM32F401C Cortex-M4 MCU (UFQFPN48: F401CB/CC/CD/CE)"

[models.match]
value_re = "(?i)^STM32F401C[BCDE]?(U6|T6|C6)?$"
mpn_re   = "(?i)^STM32F401C[BCDE]"

[models.params]
backend = "renode:stm32f4"
internal_clock = "internal 16 MHz HSI RC oscillator"

[models.pins]
"7"  = "reset"   # NRST (DS9716 Rev 11 Table 8, UQFN48 pad 7)
"10" = "pa0"
"11" = "pa1"
"12" = "pa2"
"13" = "pa3"
"14" = "pa4"
"15" = "pa5"
"16" = "pa6"
"17" = "pa7"
"18" = "pb0"
"19" = "pb1"
# Pads 10-19 are the ADC1 inputs (PA0-PA7, PB0, PB1) named here so the ADC capability table below can
# state them; STM32F401xB/xC datasheet DocID024738 Rev 10 (DS9716), Table 8, UQFN48 column. The rest of the
# package's pads are deliberately not mapped.
"20" = "pb2_boot1" # PB2, BOOT1 additional function (DS9716 Rev 11 Table 8, pad 20)
"44" = "boot0"   # BOOT0 strapping pin, UFQFPN48 pad 44 (verified vs the footprint)
"31" = "pa10"   # PA10, USART1_RX (the ROM bootloader's receive pin); DS9716 Table 8 UFQFPN48 column, pad 31 (LQFP64 pin 43, LQFP100 pin 69)

# ADC pads. STMicroelectronics STM32F401xB/xC datasheet DocID024738 Rev 10 (December 2017, DS9716), Table 8
# pin definitions (datasheet pp.37-43), UQFN48 (= UFQFPN48) column: ADC1_IN0..ADC1_IN9 on PA0-PA7 (PA0-PA2 p.38,
# PA3-PA7 p.39), PB0 and PB1 (p.39); PC0-PC5 carry ADC1_IN10-15 on the LQFP64/LQFP100 columns only (UQFN48
# column '-'). No other pad has an ADC channel.
# Cross-checked pad for pad against ST STM32_open_pin_data (BSD-3-Clause, STMicroelectronics/STM32_open_pin_data
