[models.params]
backend = "renode:stm32f072"
internal_clock = "internal HSI RC oscillator"
# NRST's permanent pull-up RPU, 25 kOhm min / 40 typ / 55 max (DocID025004 Rev 5 Table 56,
# p.84, VIN = VSS): the minimum, for the held-off check's divider against an external pull-down.
