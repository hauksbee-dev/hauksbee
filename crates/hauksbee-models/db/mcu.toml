# Output stage per drive-strength setting. RP2040 Datasheet Table 625 section 5.5.3.4
# PDF p.616-617: IOVDD 3.3 V, VOH min 2.62 V, VOL max 0.5 V, test current = the selected
# setting (2/4/8/12 mA). The 1.8 V and 2.5 V rows (VOH 1.24/1.78 V, VOL 0.3/0.4 V) are
# not carried: only the 3.3 V row is fitted.
[[models.output_drive]]
setting = "2 mA"
selector = 0   # PADS_BANK0 GPIOn DRIVE bits 5:4, 0x0 = 2MA (Table 341 PDF p.302-303)
vdd = 3.3
points = [
  { level = "high", current_a = 0.002, volts = 2.62 },
  { level = "low", current_a = 0.002, volts = 0.5 },
]
basis = "RP2040 Datasheet (target/launch/wp5-datasheets/rp2040-datasheet.pdf, downloaded 2026-10-22), Table 625 'Digital IO characteristics' section 5.5.3.4 PDF p.616-617 (printed 615-616): at IOVDD 3.3 V VOH min 2.62 V and VOL max 0.5 V with IOH/IOL = 2, 4, 8 or 12 mA 'depending on setting'; section 5.5.3.5 PDF p.618 defines VOH/VOL as the worst-case level at the setting's current, so the fitted resistance is the datasheet bound, not the typical curve (Figure 171 is graph-only)"

[[models.output_drive]]
setting = "4 mA"
selector = 1   # PADS_BANK0 GPIOn DRIVE bits 5:4, 0x1 = 4MA (Table 341 PDF p.302-303)
reset_default = true   # DRIVE reset value 0x1 = 4MA (Table 341 PDF p.302)
vdd = 3.3
points = [
  { level = "high", current_a = 0.004, volts = 2.62 },
  { level = "low", current_a = 0.004, volts = 0.5 },
]
basis = "RP2040 Datasheet (target/launch/wp5-datasheets/rp2040-datasheet.pdf, downloaded 2026-10-22), Table 625 'Digital IO characteristics' section 5.5.3.4 PDF p.616-617 (printed 615-616): at IOVDD 3.3 V VOH min 2.62 V and VOL max 0.5 V with IOH/IOL = 2, 4, 8 or 12 mA 'depending on setting'; section 5.5.3.5 PDF p.618 defines VOH/VOL as the worst-case level at the setting's current, so the fitted resistance is the datasheet bound, not the typical curve (Figure 171 is graph-only)"

[[models.output_drive]]
setting = "8 mA"
selector = 2   # PADS_BANK0 GPIOn DRIVE bits 5:4, 0x2 = 8MA (Table 341 PDF p.302-303)
vdd = 3.3
points = [
  { level = "high", current_a = 0.008, volts = 2.62 },
  { level = "low", current_a = 0.008, volts = 0.5 },
]
basis = "RP2040 Datasheet (target/launch/wp5-datasheets/rp2040-datasheet.pdf, downloaded 2026-10-22), Table 625 'Digital IO characteristics' section 5.5.3.4 PDF p.616-617 (printed 615-616): at IOVDD 3.3 V VOH min 2.62 V and VOL max 0.5 V with IOH/IOL = 2, 4, 8 or 12 mA 'depending on setting'; section 5.5.3.5 PDF p.618 defines VOH/VOL as the worst-case level at the setting's current, so the fitted resistance is the datasheet bound, not the typical curve (Figure 171 is graph-only)"

[[models.output_drive]]
setting = "12 mA"
selector = 3   # PADS_BANK0 GPIOn DRIVE bits 5:4, 0x3 = 12MA (Table 341 PDF p.302-303)
vdd = 3.3
points = [
  { level = "high", current_a = 0.012, volts = 2.62 },
  { level = "low", current_a = 0.012, volts = 0.5 },
]
basis = "RP2040 Datasheet (target/launch/wp5-datasheets/rp2040-datasheet.pdf, downloaded 2026-10-22), Table 625 'Digital IO characteristics' section 5.5.3.4 PDF p.616-617 (printed 615-616): at IOVDD 3.3 V VOH min 2.62 V and VOL max 0.5 V with IOH/IOL = 2, 4, 8 or 12 mA 'depending on setting'; section 5.5.3.5 PDF p.618 defines VOH/VOL as the worst-case level at the setting's current, so the fitted resistance is the datasheet bound, not the typical curve (Figure 171 is graph-only)"

# PADS_BANK0 GPIO0..GPIO29, Table 341 section 2.19.6.3 PDF p.301-303: base 0x4001c000,
# GPIO0 at +0x04, one 32-bit register per pin at a 4-byte stride, DRIVE = bits 5:4.
[models.drive_select]
port_bases = { "0" = 0x4001c004 }
register_stride = 4
pins_per_register = 1
lsb = 4
width = 2
basis = "RP2040 Datasheet Table 341 PADS_BANK0 GPIO0 register (PDF p.302-303): base 0x4001c000 + 0x04 + 4*n, DRIVE bits 5:4, 0x0=2MA 0x1=4MA 0x2=8MA 0x3=12MA, reset 0x1"

# Reset behaviour: RUN (header pin 30) is the chip's global reset; low holds the chip in
# reset (RP2040 Datasheet section 2.12.5 PDF p.168). The datasheet prints no RUN-specific
# VIL/VIH; RUN is typed 'Digital In (FT)' so Table 625 input levels at IOVDD 3.3 V apply by pin
# type (PDF p.616-617). The module's DVDD is internal, so no supply threshold is carried.
[models.reset]
pin_vil_v = 0.8
pin_vih_v = 2.0
basis = "RP2040 Datasheet RUN pin section 2.12.5 PDF p.168, input levels Table 625 PDF p.616-617 applied by pin type"

[[models]]
id = "daisy_seed"
kind = "mcu"
description = "Electrosmith Daisy Seed module (STM32H750IBK6 carrier, 2x20-pin header)"

[models.match]
# "Daisy_Seed", "DaisySeed", "Daisy Seed", optionally with a rev suffix and/or
# the vendor name in front. Anchored so the Seed2 DFM (a different module with
# a different pinout) does not bind here.
value_re = "(?i)^(electro[-_ ]?smith[-_ ]?)?daisy[-_ ]?seed([-_ ]?rev[-_ ]?[0-9a-z.]+)?$"

[models.params]
# The Daisy Seed wraps an STM32H750IBK6 (Cortex-M7) plus SDRAM, QSPI flash and
# an audio codec. This entry exists for identification and bind coverage: no
# hauksbee-mcu descriptor exists for any STM32H7 (the embedded descriptor list
# stops at stm32f4_discovery) and the engine's family router does not route
# STM32H7 either, so co-sim is declared unavailable with the explicit "none:"
# token the scheduler refuses loudly, rather than leaving the module UNRESOLVED
# or letting it fall to the wrong-ISA simavr default. Firmware-less analyses
# (lint, report, DRC) work. If an stm32h7 descriptor lands later, switch this
# to its renode:<part> string.
#
# Deliberately NOT `module = true`: that flag switches the binder's role parser
# to Arduino-Nano header names. The roles below use the standard STM32
# "p<port><bit>" convention, which the parser handles without the flag.
backend = "none:stm32h7"

[models.pins]
# Daisy Seed 2x20 header (Daisy Seed datasheet v1.0.5, Table 2 "Pin
# Functions"): physical pin -> STM32H750 port pin, with the datasheet's Daisy
# pin name (D<n> digital / A<n> analog) in the comment. Pins 16-21 have no MCU
# pin: they are the codec's analog audio path and its supplies. The H750's
# BOOT pin stays on-module (the BOOT button drives the DFU flow), so this
# entry carries no [models.straps]; that absence is deliberate.
