# UVCC is only the USB pad regulator's input (2.2.11). Figure 21-6 (Typical Self
# Powered Application with 3.0V to 3.6V I/O, p.259) leaves UVCC unconnected and
# feeds UCAP from the 3.3 V supply (UHWCON bit UVREGE: "Clear to disable the
