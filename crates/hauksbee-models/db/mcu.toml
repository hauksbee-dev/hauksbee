abs_error_lsb = 3.0
column = "typ"
condition = "VREF = 4 V, VCC = 4 V, ADC clock = 1000 kHz; absolute accuracy including INL, DNL, quantization, gain and offset error"
basis = "Table 21-8 (p.167) ADC characteristics, Absolute accuracy, Typ column"


