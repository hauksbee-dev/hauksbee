[models.pin_capability.routed]
basis = "Silicon Labs EFM32PG22 Gecko MCU Family Data Sheet Rev. 1.4 (PDF page = printed page), 3.2 GPIO (p.8): 'The GPIO pins can be overridden by peripheral connections, like SPI communication. Each peripheral connection can be routed to several GPIO pins on the device'; 6.5 Digital Peripheral Connectivity (p.64): 'Many digital resources are routable and can be connected to numerous GPIO's' and Table 6.5 DBUS Routing Table (p.64-66) marks USART0.CLK/TX/RX, I2C0.SCL/SDA, EUART0.TX/RX, TIMER0.CC0-CC2 and TIMER1.CC0-CC2 'Available' on all four ports PA, PB, PC and PD, i.e. on every GPIO pad of the QFN40 (Table 6.2, p.60-61). SPI is USART0 in SPI mode (3.5.1 USART, p.10: 'SPI, MicroWire and 3-wire'); PWM and capture are TIMER0/TIMER1 compare/capture channels (3.4.1 TIMER, p.9: capture, compare and PWM modes per channel). Table 6.5 states routing per port; the within-port freedom (any pin number of a port) comes from the GPIO ROUTE registers of the EFM32PG22 Reference Manual, which could not be downloaded here (silabs.com returned 403 Access Denied), so no RM page is cited. Hardware peripheral only; the Reflex (PRS) route to a capture channel is not counted"
functions = ["spi_sck", "spi_mosi", "spi_miso", "i2c_sda", "i2c_scl", "uart_tx", "uart_rx", "pwm", "timer_capture"]

