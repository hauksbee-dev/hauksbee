# ─────────────────────────────────────────────────────────────────────────────
# STM32G474 (UFQFPN48; LQFP48 is the next card). Co-simulates on the COMPOSED Renode platform
# in hauksbee-mcu db/mcu/stm32g4.soc.toml, which states what is exact and what
# is approximated (RCC, ADC, DMA without transfers, FDCAN without frames).
# Pad map: ST DS12288 UFQFPN48 column (Table 12), cross-checked pad-by-pad against
# the moteus c1 board (U3, STM32G474CEU6): pad 7 NRST, 20/21 VREF+/VDDA,
# 22 PB10 family strap, 24 PB11 unconnected, 36/37 SWDIO/SWCLK, 43/44 CAN
# RX/TX (FDCAN2 on PB5/PB6), 49 exposed pad to GND.
#
# ADC roles. `_adcN` is the descriptor's engine channel: the ADC1 input number
# for a pin ADC1 reads, 32 + the ADC2 input number for a pin only ADC2 reads.

# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   AN2606 Rev 70 (February 2026), https://www.st.com/resource/en/application_note/an2606-stm32-microcontroller-system-memory-boot-mode-stmicroelectronics.pdf sha256 25b466e39ecc61671dcb988d8ca538462d6452d85f68140cb981ed728f57e654;
#   AN3155 Rev 22 (September 2026), https://www.st.com/resource/en/application_note/an3155-usart-protocol-used-in-the-stm32-bootloader-stmicroelectronics.pdf sha256 0e3e1c35ffa3311aba33440d9d6236dc2f59af8a7f32482cf13d1d0af8c5e1f9;
#   RM0090 Rev 22 (cached copy target/launch/wp1-datasheets/rm0090.pdf) sha256 f3ff2322eec21f4e49081f68481b764506eee81dba6031bc767e2f8955b27cca: the USART peripheral's character framing, which the STM32F401 shares (RM0368 itself was not available to read);
#   DS9716 Rev 10 Table 8 (datasheet p.41), UFQFPN48 column: PA10 = pad 31.
[[models.pin_bias]]
role = "pa10"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 77 (STM32F401xB(C) configuration in system memory boot mode) PDF p.170, USART1_RX pin: \"PA10 pin: USART1 in reception mode. Used in input no pull mode.\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0090 Rev 22 PDF p.964 section 30.3.1 USART character description: \"The TX pin is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of \u201c1\u201ds\" and \"A Break character is interpreted on receiving \u201c0\u201ds for a frame period\" AN2606 Rev 70 Figure 1 note 1, PDF p.47: \"A pull-up resistor must be added, if they are not connected on host side\"; section 4.3, PDF p.49: \"It is recommended to keep the RX pins of unused bootloader interfaces (USART_RX, SPI_MOSI, and CAN_RX, if present) at a known (low or high) level\"."
note = "The ROM bootloader detects a USART host by the start bit of its 0x7F frame, so a pull-down or a tie to ground on this pin holds the line in the break state and the bootloader cannot detect a host on this USART (its other interfaces still work). AN2606 allows an unused bootloader RX pin at either known level, so this matters only when the board is flashed over this USART; a missing bias is not reported, only one the wrong way round."

