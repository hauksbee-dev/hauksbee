# The module powers itself from its own USB connector (UVCC through F1 and D2
# to the RAW rail, then the MIC5219 regulator U2), and VCC is that regulator's
# OUTPUT on the header (a pad the host board may use, or leave open or on a
# capacitor).
[[models.optional_supplies]]
role = "vcc"
basis = "SparkFun Pro Micro v13 schematic (Pro_Micro.sch, EAGLE 7.4.0, dated 7/7/15, sheet 1/1): the USB connector's UVCC feeds RAW through fuse F1 and diode D2 into regulator U2 (MIC5219), whose OUT is the VCC net on header JP6 ('VCC = 5V or 3.3V Output, Max Current Output: 500mA'; SJ1 closed bypasses U2 on the 5 V board)"

[models.ratings]
# Section 29.1 Absolute Maximum Ratings, ATmega32U4.
max_pin_current_a = 0.04  # DC current per I/O pin, 40.0 mA
max_current_a = 0.2       # DC current VCC and GND pins, 200.0 mA
max_voltage_v = 6.0       # Abs max row "Maximum Operating Voltage"; NOT the 5.5 V recommended ceiling

# The recommended range; max_voltage_v above is the abs max, so a supply
# between the two raises the operating-envelope finding.
[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.7
max_v = 5.5
abs_max_v = 6.0
basis = "Atmel-7766J ATmega16U4/32U4 datasheet, Features, Operating Voltages 2.7-5.5 V; Section 29.1 Absolute Maximum Ratings, Maximum Operating Voltage 6.0 V"
[models.pin_capability.spi_sck]
basis = "Atmel ATmega16U4/32U4 datasheet 7766J-USB-ATmega16U4/32U4-Datasheet_04/2016 (PDF page numbers, which equal the printed page numbers), Table 10-3 (p.74) PB1 SCK/PCINT1 and section 10.3.1 (p.75); the pads are the 24 Pro Micro header positions of this card [models.pins], each bonded straight to the ATmega32U4 port pin named in its role (pad 14 pb2_mosi, 15 pb3_miso, 16 pb1_sck, 5 pd1_sda, 6 pd0_scl, 1 pd3_txd1, 2 pd2_rxd1, 7 pd4, 8 pc6, 9 pd7, 12 pb5, 13 pb6), so the chip alternate function table applies to the header pad; port pins the module does not bring to the header (PB0, PB7, PC7, PD5, PD6) have no pad. The USART1 SPI-master clock XCK1 is on PD5 (Table 10-8 p.78), which is not on the header; hardware peripheral only, a software (bit-banged) implementation can use any pad"
