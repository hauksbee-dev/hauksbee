basis = "Atmel ATmega16U4/32U4 datasheet 7766J (04/2016), ADC: features (p.297), section 24.4 (p.300), Table 24-1 (p.302), section 24.7.1 (pp.305-306), Table 24-5 (p.316), Table 29-7 (p.390)"

[models.peripherals.adc.clock]
source = "system clock divided by the ADPS[2:0] prescaler"
prescalers = [2, 4, 8, 16, 32, 64, 128]
min_hz = 50000.0
full_resolution_min_hz = 50000.0
full_resolution_max_hz = 200000.0
basis = "Table 24-5 (p.316): ADPS 000 and 001 both divide by 2, then 4, 8, 16, 32, 64, 128; section 24.4 (p.300): an input clock between 50 kHz and 200 kHz gives maximum resolution, a higher clock is allowed for lower resolution, and ADHSM allows an increased clock"

