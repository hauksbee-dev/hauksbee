[models.pin_capability.i2c_sda.pads]
"3" = "GPIO0 via the GPIO matrix"
"39" = "GPIO45 via the GPIO matrix"
[models.pin_capability.i2c_scl]
basis = "Espressif ESP32-S2 Series Datasheet v1.9 (PDF page = printed page), Section 2.3.6 Peripheral Pin Assignment (p.23-24): any GPIO can be mapped to these peripheral signals through the GPIO Matrix, except GPIO46, which is input only (section 4.2.1.1 GPIO p.39 'GPIO46 (input only)'; Table 2-1 p.13-14 type I), so it cannot carry an output signal; hardware peripheral only"
[models.pin_capability.i2c_scl.pads]
"3" = "GPIO0 via the GPIO matrix"
"39" = "GPIO45 via the GPIO matrix"
[models.pin_capability.uart_tx]
basis = "Espressif ESP32-S2 Series Datasheet v1.9 (PDF page = printed page), Section 2.3.6 Peripheral Pin Assignment (p.23-24): any GPIO can be mapped to these peripheral signals through the GPIO Matrix, except GPIO46, which is input only (section 4.2.1.1 GPIO p.39 'GPIO46 (input only)'; Table 2-1 p.13-14 type I), so it cannot carry an output signal; hardware peripheral only"
[models.pin_capability.uart_tx.pads]
"3" = "GPIO0 via the GPIO matrix"
"39" = "GPIO45 via the GPIO matrix"
[models.pin_capability.pwm]
basis = "Espressif ESP32-S2 Series Datasheet v1.9 (PDF page = printed page), Section 2.3.6 Peripheral Pin Assignment (p.23-24): any GPIO can be mapped to these peripheral signals through the GPIO Matrix, except GPIO46, which is input only (section 4.2.1.1 GPIO p.39 'GPIO46 (input only)'; Table 2-1 p.13-14 type I), so it cannot carry an output signal; hardware peripheral only"
[models.pin_capability.pwm.pads]
"3" = "GPIO0 via the GPIO matrix"
"39" = "GPIO45 via the GPIO matrix"
[models.pin_capability.routed]
basis = "Espressif ESP32-S2 Series Datasheet v1.9 (PDF page = printed page), Section 2.3.6 Peripheral Pin Assignment (p.23-24): 'Any GPIO pins mapping to peripheral signals via GPIO Matrix, can be priority 2, 3, or 4'; Table 2-9 (p.24; its UART0, UART1, SPI2, SPI3, I2C, PCNT, RMT and LEDC columns list GPIOn (P2) on the GPIO pads) footnote 2: 'Signals of UART0, UART1, SPI0/1, SPI2 and USB OTG interfaces can be mapped to any GPIO pins through the GPIO Matrix, regardless of whether they are directly routed to fixed pins via IO MUX'; Section 4.2.1 (p.41-43) refers each of SPI, UART, I2C and LED PWM to Section 2.3.6 for pin assignment. ESP32-S2 Technical Reference Manual v1.3 (PDF page = printed page), Chapter 5 IO MUX and GPIO Matrix, Section 5.10 Peripheral Signal List (p.177-179): U0TXD_out/U0RXD_in/U1TXD_out/U1RXD_in and I2CEXT0_SCL/SDA in/out (p.177), ledc_ls_sig_out0 (p.178), FSPICLK/FSPID/FSPIQ in/out (SPI2, p.179). hardware peripheral only, a software (bit-banged) implementation can use any pad Module datasheet: ESP32-S2-WROOM & WROOM-I Datasheet v1.5 (same chip)."
functions = ["spi_miso", "uart_rx"]
[models.pin_capability.timer_capture]
basis = "Espressif ESP32-S2 Series Datasheet v1.9 (PDF page = printed page), Advanced Peripheral Interfaces (p.3-4) lists the peripherals: four SPIs, I2S, two I2Cs, two UARTs, RMT (TX/RX), LED PWM controller, four pulse counters, USB OTG, TWAI, timers: one 64-bit general-purpose timer, system timer, watchdogs; there is no Motor Control PWM (MCPWM) and no timer input-capture channel. Section 4.2.1.9 Pulse Count Controller (p.43) counts pulse edges, it does not latch a timer value. ESP32-S2 Technical Reference Manual v1.3, Section 5.10 Peripheral Signal List (p.177-179) has no capture-input signal (no pwm*_cap*_in); the TRM has no MCPWM or input-capture chapter. The RMT receiver records pulse widths but is a remote-control peripheral, not a timer input-capture channel. Hardware peripheral only, a software (bit-banged or GPIO-interrupt timestamp) capture can use any pad. Module datasheet: ESP32-S2-WROOM & WROOM-I Datasheet v1.5 (same chip)."


