# ─────────────────────────────────────────────────────────────────────────────
# ATmega16U2 (and the 8U2/32U2 that share its die family and pinout), 32-pad
# QFN or 32-lead TQFP: the USB-to-serial bridge on Arduino Uno-class boards.
#
# Source: Atmel ATmega8U2/16U2/32U2 datasheet 7799E-AVR-09/2012. Figure 1-1
#   (QFN32 and TQFP32 share one pinout; the centre pad "should be soldered to
#   ground"), Features "Operating Voltages 2.7 - 5.5V", 26.1 Absolute Maximum
#   Ratings.
#
# BACKEND IS `none:`, deliberately. simavr has no atmega16u2 core. Its
# at90usb162 is the nearest relative, but binding the board to it would be a
# silent substitution (`detect_substitution` returns None for simavr by design),
# so co-sim is declared unavailable and refused loudly, as for the Daisy Seed.
# Lint, DRC, envelope and rating checks still read the pad map below.
[[models]]
id = "atmega16u2_32pin"
kind = "mcu"
description = "ATmega16U2 8-bit USB AVR, 32-pad QFN or 32-lead TQFP (structure only, no co-sim core)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://ww1.microchip.com/downloads/en/DeviceDoc/doc7799.pdf"
title = "Atmel ATmega8U2/16U2/32U2 datasheet, 7799E-AVR-09/2012"
locator = "Features (Operating Voltages); 1 Figure 1-1 Pinout; 26.1 Absolute Maximum Ratings"
sha256 = "182d44b3834632028e2258ee410b3ad33ee89c692695b6dc3e68cbdd08a5d03a"

[models.match]
# MU = QFN32, AU = TQFP32; the "(R)" some CAD libraries append is the reel code.
value_re = "(?i)^ATmega16U2([-_ ]?(MU|AU)(R|\\(R\\))?)?$"

[models.params]
# Crystal load capacitors: ATmega8U2/16U2/32U2 datasheet, Table 8-3 "Low Power Crystal Oscillator
# Operating Modes" (PDF p. 30): recommended range for capacitors C1 and C2, 12-22 pF.
