outcome = "rom_bootloader"
detail = "GPIO0 = 0 and GPIO2 = 0: Joint Download Boot, which supports SDIO Download Boot and UART Download Boot; the ROM runs the download loader and the user firmware does not run. On chip revision v3.0 and later, uart_download_dis = 1 permanently disables this mode"
cite = "ESP32 Series Datasheet v5.3, Table 3-3 and its footnote 2, PDF p.23; section 3.1 uart_download_dis paragraph, PDF p.24"

# --- QEMU (Espressif fork) strap_mode: layout equals GPIO_STRAP_REG (TRM Register 6.13) ---
[models.qemu_boot]
device = "esp32.gpio"
property = "strap_mode"
flash_boot = 0x12                   # QEMU's own ESP32_STRAP_MODE_FLASH_BOOT; straps with a defined level are overlaid on it
bits = { gpio12 = 5, gpio0 = 4, gpio2 = 3, gpio4 = 2, gpio15 = 1, gpio5 = 0 }
cite = "ESP32 TRM v5.8 Register 6.13 GPIO_STRAP_REG PDF p.141; Espressif QEMU include/hw/gpio/esp32_gpio.h (ESP32_STRAP_MODE_FLASH_BOOT 0x12, ESP32_STRAP_MODE_UART_BOOT 0x0f), hw/xtensa/esp32.c:156"

# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   ESP32-PICO Series Datasheet v1.4 (https://www.espressif.com/sites/default/files/documentation/esp32-pico-d4_datasheet_en.pdf) sha256 652834c31a0ac4930aec4ac23754d2737e8bdecb76410edf3c48be519a6c40af;
#   ESP32 Series Datasheet v5.3 (https://www.espressif.com/sites/default/files/documentation/esp32_datasheet_en.pdf) sha256 a7917e6b47528c9dcab06837a49d452e582751335797db879f1cf2d17cd29adf;
#   ESP32-WROOM-32E/32UE Datasheet v2.1 (https://www.espressif.com/sites/default/files/documentation/esp32-wroom-32e_esp32-wroom-32ue_datasheet_en.pdf) sha256 4c7a345d1c1bfec34c38665639e39a7f43b79a35a12f6adcc2c7c0f83850f8b8;
#   ESP32 Technical Reference Manual v5.8 (https://www.espressif.com/sites/default/files/documentation/esp32_technical_reference_manual_en.pdf) sha256 4ba58e9fa0405ec2bf80b912a29b483f6edc8c4b2b1058201913a2fe37e582f0.
[[models.pin_bias]]
role = "p03_rxd"
level = "high"
needs = "idle"
opposed_only = true
basis = "ESP32-PICO Series Datasheet v1.4 PDF p.15 Table 2 Pin Description of ESP32-PICO-D4: \"U0RXD 40 I/O GPIO3, U0RXD, CLK_OUT2\"; ESP32 Series Datasheet v5.3 PDF p.23 Table 3-3 Chip Boot Mode Control (GPIO0 = 0, GPIO2 = 0, Joint Download Boot Mode, footnote 2): \"Joint Download Boot mode supports the following download methods: • SDIO Download Boot • UART Download Boot\" (the ESP32 chip inside the SiP); ESP32-WROOM-32E/32UE Datasheet v2.1 PDF p.39 (section 9 Peripheral Schematics, note): \"UART0 is used to download firmware and log output.\" (an ESP32 module); ESP32 TRM v5.8 PDF p.314 (UART chapter, data frame): \"The START is low level, while the STOP is high level.\"; PDF p.315: \"The receiver can also detect the Break conditions when the RX data line remains logical low for one NULL character transmission\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

[[models]]
id = "lilygo_t_micro32"
kind = "mcu"
description = "LilyGO T-Micro32 / T-Micro32 Plus module (ESP32-PICO-V3-02)"

[models.match]
value_re = "(?i)^(LilyGO[-_ ]?)?T[-_ ]?Micro[-_ ]?32([-_ ]?Plus)?$"

[models.params]
backend = "qemu:esp32"

# ─────────────────────────────────────────────────────────────────────────────

# ESP32-S3, package unknown: identity only (see the family note). The strap
# table lives on the package entries below.
[[models]]
id = "esp32s3"
kind = "mcu"
description = "Espressif ESP32-S3, package not recognised (Watchy v3 class)"

[models.match]
value_re = "(?i)^ESP32[-_ ]?S3([-_ ]?WROOM.*)?$"

[models.params]
# hauksbee-mcu backend identifier: the QEMU backend boots the Espressif-QEMU
# esp32s3 machine (Xtensa LX7) from the merged flash image and bridges GPIO
# (via the RAM mailbox) / UART through QMP + gdbstub + the serial socket, same
# as the classic ESP32 entries above. Descriptor: db/mcu/esp32s3.soc.toml in
# hauksbee-mcu. With no firmware given the scheduler skips the MCU entirely,
# so lint/report-only runs never need QEMU.
backend = "qemu:esp32s3"

[models.coverage]
implements = ["xtensa_lx7_machine_boot", "gpio_output_register_or_mailbox_observation_0_to_31", "uart_transport", "wall_bounded_virtual_time", "gpio_input_mailbox_contract_0_to_31", "adc_input_mailbox_contract", "i2c_spi_mailbox_contract"]
missing = ["application_firmware_end_to_end_proof", "gpio_32_to_48_observation", "instruction_counted_timing", "unmodified_firmware_gpio_input", "native_adc_peripheral", "unmodified_firmware_i2c_spi_observation", "watchdog_behavior", "silicon_power_current_profile", "silicon_timing_and_errata"]

[[models]]
id = "esp32s3_wroom"
kind = "mcu"
description = "Espressif ESP32-S3-WROOM-1/-1U/-2 module"

[models.match]
value_re = "(?i)^ESP32[-_ ]?S3([-_ ]?WROOM.*)?$"
# KiCad RF_Module:ESP32-S3-WROOM-1 / -1U / -2 and vendor spellings of the same.
# WROOM-2 has the WROOM-1 pinout (KiCad symbols agree on every strap pad).
footprint_re = '(?i)ESP32[-_]?S3[-_]?WROOM[-_]?[12]'

[models.params]
backend = "qemu:esp32s3"
# ESP32-S3-WROOM-1/-1U Datasheet v1.8, Table 3-1: EN (pad 3) "High: on, enables
# the chip. Low: off ... Do not leave the EN pin floating." The module has no
# pull on it; sec 9 "Peripheral Schematics" asks for an RC delay on the board
# (R = 10 kOhm, C = 1 uF).
must_not_float_roles = "en"

[models.pins]
# ESP32-S3-WROOM-1/-1U Datasheet v1.8, Table 3-1 "Pin Definitions" (and the
# KiCad RF_Module:ESP32-S3-WROOM-1 symbol): GND = 1, 3V3 = 2, EN = 3, IO3 = 15,
# IO46 = 16, IO45 = 26, IO0 = 27 (verified vs Watchy v3 BOOT net). Pads 6/7
# are IO6/IO7; they were mapped as GPIO46/GPIO45 before.
"1"  = "vss"
"2"  = "vdd"
"3"  = "en"
"27" = "gpio0"
"15" = "gpio3"
"26" = "gpio45"
"16" = "gpio46"

[models.pin_capability.adc]
basis = "Espressif ESP32-S3-WROOM-1/-1U Datasheet v1.8, Table 3-1 Pin Definitions (PDF p.11): IO3 pad 15 ADC1_CH2; IO0, IO45 and IO46 carry no ADC channel"
[models.pin_capability.adc.pads]
"15" = "ADC1_CH2"
[models.pin_capability.pull_up]
basis = "ESP32-S3-WROOM-1 module: pad-to-GPIO mapping from ESP32-S3-WROOM-1 & WROOM-1U Datasheet v1.8 (sha256 27d71971da07c280c6068d08c74720d1a25b8f20cf8494dc1765bdd28d40d435) Pin Definitions table (p.11). Espressif ESP32-S3 Series Datasheet v2.2 (sha256 2d5a7cb7fd559d8d972bd88db32669c0196d23f22d7afaafb0f63d099b589a3f) Table 2-1 Pin Overview (pp.16-17) and note 6 (p.18): WPU 'internal weak pull-up resistor enabled', 'pin internal weak pull-up and pull-down resistors ... configurable by IO_MUX_FUN_WPU/WPD'. ESP32-S3 Technical Reference Manual v1.8 (sha256 4484bf8a69035ec42a731c58c64ada6fbd1f1618c5559409f134d9ea083f444f) section 6.4.3 (p.476) 'Set or clear IO_MUX_FUN_WPU and IO_MUX_FUN_WPD ... to enable or disable pull-up and pull-down resistors' and Register 6.36 IO_MUX_GPIOn_REG (n: 0-21, 26-48) IO_MUX_FUN_WPU (p.514). Not listed: EN (reset) and supply pads; USB D+/D- (GPIO19/20) are not in the card"
[models.pin_capability.pull_up.pads]
"27" = "GPIO0: IO_MUX_GPIO0_REG FUN_WPU = 1 (internal pull-up)"
"15" = "GPIO3: IO_MUX_GPIO3_REG FUN_WPU = 1 (internal pull-up)"
"26" = "GPIO45: IO_MUX_GPIO45_REG FUN_WPU = 1 (internal pull-up)"
"16" = "GPIO46: IO_MUX_GPIO46_REG FUN_WPU = 1 (internal pull-up)"

# ESP32-S3-WROOM-1 & WROOM-1U Datasheet v1.8: Table 3-1 Pin Definitions p.11, EN pad 3 "High: on, enables the
# chip. Low: off, the chip powers off. Note: Do not leave the EN pin floating." Figure 8-1 ESP32-S3-WROOM-1
# Schematics p.39 shows CHIP_PU wired straight to module pad 3 with no pull-up on the module; sec. 9 p.41
# asks for an RC delay on the board.
[[models.straps]]
role = "en"
level = "high"
boot_select = false
internal_pull = "none"
note = "EN (CHIP_PU) high = chip enabled, low = chip off; the module has no on-board pull on EN, so an undriven net floats"

# The module's one supply pin, 3V3 (VDD33). Its abs max IS the recommended
# ceiling, so a 5 V rail on it is past both.
[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 3.0
max_v = 3.6
abs_max_v = 3.6
basis = "Espressif ESP32-S3-WROOM-1/-1U Datasheet v1.8, Table 6-1 Absolute Maximum Ratings (VDD33 -0.3 to 3.6 V) and Table 6-2 Recommended Operating Conditions (VDD33 3.0 / 3.3 / 3.6 V)"

# Ref: ESP32-S3 Technical Reference Manual v1.6, Table 2-9 "Strapping Pins";
# ESP32-S3 datasheet v2.2 sec 3 "Boot Configurations" (Table 3-1: GPIO0 weak
# pull-up; GPIO45, GPIO46 weak pull-down). GPIO0 high = SPI boot; GPIO46
# selects ROM messages / boot mode and must be low-or-floating at reset.
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true   # latches SPI-vs-download boot; unrecoverable in firmware
# ESP32-S3 Datasheet v2.2, Table 5-4 "DC Characteristics (3.3 V, 25 °C)": VIL
# max 0.25 x VDD, VIH min 0.75 x VDD,
# https://www.espressif.com/sites/default/files/documentation/esp32-s3_datasheet_en.pdf
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = SPI boot (normal); low with GPIO46=0 = download boot"

[[models.straps]]
role = "gpio46"
level = "low"
note = "GPIO46 must be low or floating at reset (joins GPIO0 to pick boot mode)"

[[models.straps]]
role = "gpio45"
level = "defined"
note = "GPIO45 selects VDD_SPI flash voltage (low = 3.3 V default); must be defined"

[models.ratings]
# ESP32-S3-WROOM-1/-1U Datasheet v1.8, Table 6-1 "Absolute Maximum Ratings"
# (p. 27): VDD33 power supply voltage -0.3 to 3.6 V (pin 2 "3V3", Table 3-1).
# Table 6-2 recommends 3.0 to 3.6 V.
max_voltage_v = 3.6

[models.coverage]
implements = ["xtensa_lx7_machine_boot", "gpio_output_register_or_mailbox_observation_0_to_31", "uart_transport", "wall_bounded_virtual_time", "gpio_input_mailbox_contract_0_to_31", "adc_input_mailbox_contract", "i2c_spi_mailbox_contract"]
missing = ["application_firmware_end_to_end_proof", "gpio_32_to_48_observation", "instruction_counted_timing", "unmodified_firmware_gpio_input", "native_adc_peripheral", "unmodified_firmware_i2c_spi_observation", "watchdog_behavior", "silicon_power_current_profile", "silicon_timing_and_errata"]

# Boot-mode table (BOOT STRAPS package): the pins that select the boot source, the
# vendor's table, and where each value comes from.
[models.strap_latch]
event = "chip_pu"
note  = "The strapping pins are latched at Chip Reset: the pin levels must be stable at least tSU = 0 ms before CHIP_PU is pulled high and held for tH = 3 ms (min) after CHIP_PU is high; the latched values are held until power-down"
cite  = "ESP32-S3 Series Datasheet v2.2, section 3 'Boot Configurations', Table 3-2 and Figure 3-1, PDF pp.32-33"

[models.reset_input]
role = "en"                       # CHIP_PU: esp32s3_wroom pad 3, esp32s3_qfn56 pad 4 (Table 2-1 pin 4 = CHIP_PU)
vil  = [0.25, 0.0]                # VIL_nRST max 0.25 x VDD
vih  = [0.75, 0.0]                # VIH_nRST min 0.75 x VDD
cite = "ESP32-S3 Series Datasheet v2.2, Table 5-4 'DC Characteristics (3.3 V, 25 C)', rows VIH_nRST and VIL_nRST, PDF p.65"

[[models.boot_inputs]]
role = "gpio0"
pin = "GPIO0"
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
cite = "ESP32-S3 Series Datasheet v2.2, Table 3-1 (GPIO0 Weak pull-up, 1) PDF p.32; Table 5-4 VIL/VIH PDF p.65"

[[models.boot_inputs]]
role = "gpio46"
pin = "GPIO46"
internal_pull = "pull_down"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO46 also controls ROM-message printing to UART0 (TRM Table 8.3-1)"
cite = "ESP32-S3 Series Datasheet v2.2, Table 3-1 (GPIO46 Weak pull-down, 0) PDF p.32; Table 5-4 PDF p.65"

[[models.boot_inputs]]
role = "gpio45"
pin = "GPIO45"
internal_pull = "pull_down"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO45 is not a boot-mode pin: it selects the VDD_SPI voltage. GPIO45 = 0 (default, EFUSE_VDD_SPI_FORCE = 0): VDD_SPI is 3.3 V from VDD3P3_RTC. GPIO45 = 1: VDD_SPI is 1.8 V from the Flash Voltage Regulator, so a 3.3 V flash or PSRAM on VDD_SPI is under-supplied if the board pulls GPIO45 high. EFUSE_VDD_SPI_FORCE = 1 overrides the pin"
cite = "ESP32-S3 Series Datasheet v2.2, Table 3-1 (GPIO45 Weak pull-down, 0) PDF p.32; Table 3-4 'VDD_SPI Voltage Control' PDF p.34; Table 5-4 PDF p.65"

[[models.boot_inputs]]
role = "gpio3"
pin = "GPIO3"
internal_pull = "none"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO3 is not a boot-mode pin: it selects the JTAG signal source; it has no internal pull resistors and its level must be set by the external circuit"
cite = "ESP32-S3 Series Datasheet v2.2, Table 3-1 (GPIO3 Floating) PDF p.32; section 3.4 'JTAG Signal Source Control' PDF p.34; Table 5-4 PDF p.65"

[[models.boot_inputs]]
role = "gpio1"
pin = "GPIO1"
internal_pull = "none"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "Not a strapping pin: read only by SPI Download Boot (GPIO1 = 1). Floating by default and high-impedance at reset, so its level must come from the board"
cite = "ESP32-S3 TRM v1.8 Table 8.2-1 and footnote 2, PDF p.535; ESP32-S3 Series Datasheet v2.2 Table 5-4 VIL/VIH PDF p.65"

[[models.boot_inputs]]
role = "gpio2"
pin = "GPIO2"
internal_pull = "none"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "Not a strapping pin: read only by SPI Download Boot (GPIO2 = 0). Floating by default and high-impedance at reset, so its level must come from the board"
cite = "ESP32-S3 TRM v1.8 Table 8.2-1 and footnote 2, PDF p.535; ESP32-S3 Series Datasheet v2.2 Table 5-4 VIL/VIH PDF p.65"

[[models.boot_modes]]
name = "SPI boot mode"
when = { gpio0 = "high" }          # GPIO46: any value
outcome = "user_flash"
detail = "GPIO0 = 1 (the default, weak pull-up): SPI boot, the ROM bootloader loads and executes the program from SPI flash (normally the second-stage bootloader, then the application). GPIO46 can be any value"
cite = "ESP32-S3 Series Datasheet v2.2, Table 3-3 'Chip Boot Mode Control', PDF p.33; ESP32-S3 TRM v1.8 Table 8.2-1, PDF p.535"

[[models.boot_modes]]
name = "Joint download boot mode"
when = { gpio0 = "low", gpio46 = "low" }
outcome = "rom_bootloader"
detail = "GPIO0 = 0 and GPIO46 = 0: Joint Download Boot, which supports USB Download Boot (USB-Serial-JTAG and USB-OTG) and UART Download Boot; the user firmware does not run unless it has been downloaded into SRAM"
cite = "ESP32-S3 Series Datasheet v2.2, Table 3-3 and footnote 2, PDF p.33; ESP32-S3 TRM v1.8 Table 8.2-1, PDF p.535"

[[models.boot_modes]]
name = "SPI download boot mode"
when = { gpio0 = "low", gpio46 = "high", gpio1 = "high", gpio2 = "low" }   # gpio1 and gpio2 are not strapping pins; esp32s3_qfn56 maps them (pads 6/7)
outcome = "rom_bootloader"
detail = "GPIO0 = 0, GPIO46 = 1, GPIO1 = 1, GPIO2 = 0: SPI Download Boot, download over the SPI interface into flash or SRAM. GPIO1 and GPIO2 are not strapping pins but must be reserved; they are floating by default and high-impedance at reset. Only in the TRM, not the datasheet"
cite = "ESP32-S3 TRM v1.8 Table 8.2-1 and footnote 2, PDF p.535"

[models.qemu_boot]
device = "esp32s3.gpio"
property = "strap_mode"
flash_boot = 0x04                   # QEMU's own ESP32S3_STRAP_MODE_FLASH_BOOT; straps with a defined level are overlaid on it
bits = { gpio3 = 5, gpio45 = 4, gpio0 = 3, gpio46 = 2, gpio1 = 1, gpio2 = 0 }   # bits 1:0 are 'Reserved' in TRM v1.8 p.506; positions from ESP-IDF esp32s3 boot_mode.h (SPI download 0b0110) and an Espressif QEMU ROM run
cite = "ESP32-S3 TRM v1.8 GPIO_STRAPPING bit list, PDF p.506; Espressif QEMU include/hw/gpio/esp32s3_gpio.h ESP32S3_STRAP_MODE_FLASH_BOOT 0x4. Bits 1:0 = GPIO1, GPIO2 confirmed by running the Espressif ROM in QEMU (0x06 -> SPI_DOWNLOAD_BOOT, 0x07 -> UART0_BOOT)"

[[models]]
