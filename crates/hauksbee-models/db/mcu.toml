# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   AN2606 Rev 70 (February 2026), https://www.st.com/resource/en/application_note/an2606-stm32-microcontroller-system-memory-boot-mode-stmicroelectronics.pdf sha256 25b466e39ecc61671dcb988d8ca538462d6452d85f68140cb981ed728f57e654;
#   AN3155 Rev 22 (September 2026), https://www.st.com/resource/en/application_note/an3155-usart-protocol-used-in-the-stm32-bootloader-stmicroelectronics.pdf sha256 0e3e1c35ffa3311aba33440d9d6236dc2f59af8a7f32482cf13d1d0af8c5e1f9;
#   RM0410 Rev 5 (https://www.st.com/resource/en/reference_manual/rm0410-stm32f76xxx-and-stm32f77xxx-advanced-armbased-32bit-mcus-stmicroelectronics.pdf) sha256 104ed7394d65bf5cfdfec31e063cf412ba58985973fe5ed72c93fd9735dfdb64.

[[models.pin_bias]]
role = "pa10"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 103 (STM32F76xxx/77xxx configuration in system memory boot mode) PDF p.244, USART1_RX pin: \"PA10 pin: USART1 in reception mode. Used in input no pull mode.\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0410 Rev 5 PDF p.1237 section 34.5.1 USART character description: \"By default, the signal (TX or RX) is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

[[models.pin_bias]]
role = "pb11"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 103 (STM32F76xxx/77xxx configuration in system memory boot mode) PDF p.244, USART3_RX pin (USART3 on PB11/PB10): \"PB11 pin: USART3 in reception mode. Used in input pull-up mode\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0410 Rev 5 PDF p.1237 section 34.5.1 USART character description: \"By default, the signal (TX or RX) is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

[[models.pin_bias]]
role = "pc11"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 103 (STM32F76xxx/77xxx configuration in system memory boot mode) PDF p.245, USART3_RX pin (USART3 on PC11/PC10): \"PC11 pin: USART3 in reception mode. Used in input pull-up mode.\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0410 Rev 5 PDF p.1237 section 34.5.1 USART character description: \"By default, the signal (TX or RX) is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

# ─────────────────────────────────────────────────────────────────────────────
# STM32L011/L021 K (LQFP32). Co-simulates on the stock Renode L071 platform
# with SysTick unlinked from its RCC model (db/mcu/stm32l0.soc.toml). Pad map:
# KiCad MCU_ST_STM32L0:STM32L011K4Tx, cross-checked against the TR-9 HMI board
# (U1): pad 4 NRST, 6 external clock input (PA0), 7-13 keypad (PA1-PA7),
# 23/24 SWDIO/SWCLK, 29 USART2 TX (PB6).
[[models]]
id = "stm32l0x1k_lqfp32"
kind = "mcu"
description = "STM32L011/L021 K Cortex-M0+ MCU, LQFP32"

[models.match]
value_re = "(?i)^STM32L0[12]1K[34]T[67X]?$"
mpn_re   = "(?i)^STM32L0[12]1K[34]"

[models.params]
backend = "renode:stm32l0"
internal_clock = "internal MSI/HSI16 RC oscillator"

[models.pins]
"1" = "vdd"
"2" = "pc14_osc32_in"
"3" = "pc15_osc32_out"
"4" = "reset"  # NRST
"5" = "vdda"
"6" = "pa0_adc0"
"7" = "pa1_adc1"
"8" = "pa2_adc2"
"9" = "pa3_adc3"
"10" = "pa4_adc4"
"11" = "pa5_adc5"
"12" = "pa6_adc6"
"13" = "pa7_adc7"
"14" = "pb0_adc8"
"15" = "pb1_adc9"
"16" = "vss"
"17" = "vdd2"
"18" = "pa8"
"19" = "pa9"
"20" = "pa10"
"21" = "pa11"
"22" = "pa12"
"23" = "pa13_swdio"
"24" = "pa14_swclk"
"25" = "pa15"
"26" = "pb3"
"27" = "pb4"
"28" = "pb5"
"29" = "pb6"
"30" = "pb7"
"31" = "pb9_boot0"  # PB9-BOOT0, a dedicated input-only pad shared with PB9 (DocID027973 Rev 5 Table 13, LQFP32 pin 31)
"32" = "vss2"

# STM32L011x3/x4 datasheet DocID027973 Rev 5 (the card's DS11152 basis): Table 12 Legend/abbreviations p.36, RST
# "Bidirectional reset pin with embedded weak pull-up resistor"; Table 13 Pin definitions p.37, NRST at LQFP32
# pin 4; sec. 6.3.14 NRST pin characteristics p.79: "connected to a permanent pull-up resistor, RPU".
[[models.straps]]
role = "reset"
level = "high"
boot_select = false
internal_pull = "pull_up"
note = "NRST is active low with an embedded weak pull-up; held low it keeps the part in reset"

# BOOT0, shared with PB9 (BOOT0 pin on category 1 devices only, RM0377 Rev 10 Table 4 footnote 1 and p.57). RM0377
# Rev 10 sec 2.4 Table 4 "Boot modes" (p.56): with nBOOT_SEL = 0 the BOOT0 pin alone picks the boot area: pin 0 =
# Flash program memory; pin 1 = system memory (nBOOT1 = 1) or embedded SRAM (nBOOT1 = 0). FLASH_OPTR bit 29 nBOOT_SEL
# (p.110): "0: BOOT0 signal is defined by BOOT0 pin value (default mode)". The pin value is latched on the NRST rising
# edge (p.57). STM32L011x3/x4 datasheet DocID027973 Rev 5: Table 13 (p.40) row PB9-BOOT0, LQFP32 pin 31, pin type I,
# I/O structure B "Dedicated BOOT0 pin"; Table 12 legend (p.36): "Unless otherwise specified by a note, all I/Os are
# set as floating inputs during and after reset", and the row carries no pull note, so nothing holds an undriven
# BOOT0 net; sec 3.7 (p.24): "This pin is an input-only pin", sampled on the NRST rising edge when nBOOT_SEL is
# reset; Table 50 (p.75) gives the BOOT0 pin VIL max 0.14 VDD. If nBOOT_SEL has been programmed to 1 the pin is
# ignored (nBOOT0 decides), a deliberate non-default.
[[models.straps]]
role = "pb9_boot0"
level = "low"
boot_select = true
internal_pull = "none"
# BOOT0 pin thresholds, DocID027973 Rev 5 Table 50 I/O static characteristics p.75: VIL max 0.14 VDD, VIH min
# 0.15 VDD + 0.56 V (both "guaranteed by characterization, not tested in production"; the other I/Os have
# 0.3 VDD / 0.7 VDD, so a divider that is fine for them can still miss BOOT0's window).
vil = [0.14, 0.0]
vih = [0.15, 0.56]
note = "BOOT0 low boots main flash; high enters the system bootloader or SRAM (nBOOT_SEL = 0, the default)"

# ADC pads. STMicroelectronics STM32L011x3/x4 datasheet DocID027973 Rev 5, Table 13 pin definitions
# (datasheet pp.37-40), LQFP32 column: PA0-PA4 (p.37) and PA5-PA7, PB0, PB1 (p.38) list ADC_IN0..ADC_IN9
# as additional functions; no other pad has an ADC channel.
# Cross-checked pad for pad against ST STM32_open_pin_data (BSD-3-Clause, STMicroelectronics/STM32_open_pin_data
# on GitHub), file(s) mcu/STM32L011K(3-4)Tx.xml and STM32L021K4Tx.xml (identical); it agrees with the datasheet on every pad.

[models.pin_capability.adc]
basis = "STMicroelectronics STM32L011x3/x4 datasheet DocID027973 Rev 5, Table 13 pin definitions (datasheet pp.37-40), LQFP32 column: PA0-PA7 pads 6-13 are ADC_IN0-IN7 (PA0-PA4 p.37, PA5-PA7 p.38) and PB0/PB1 pads 14/15 are ADC_IN8/IN9 (p.38); every other pad has no ADC channel"
