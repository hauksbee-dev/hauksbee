id = "attiny85"
kind = "mcu"
description = "ATtiny85 8-bit AVR MCU, package not recognised"

[models.match]
value_re = "(?i)^ATtiny85V?([-_]?(10|20))?([-_]?(PU|SU|SUR|SH|SF|SN|S|P|MU|MUR|MF|M))?$"

[models.params]
