# ATmega48A/PA/88A/PA/168A/PA/328/P Data Sheet Complete DS40002061B (2020): sec. 1.1.5 p.13
# (PC6/RESET: low longer than the minimum pulse resets; with RSTDISBL unprogrammed, the factory
# default per Table 28-7 p.291, PC6 is the reset input); Table 30-1 p.323: RRST Reset Pull-up
# Resistor 30-60 kOhm. RSTDISBL programmed turns the pad into I/O, so a board may legitimately
# reuse it.
[[models.straps]]
role = "pc6_reset"
level = "high"
boot_select = false
internal_pull = "pull_up"
note = "RESET (PC6) is active low with an internal 30-60 kOhm pull-up while RSTDISBL is unprogrammed (factory default); held low it keeps the part in reset"

[models.ratings]
max_pin_current_a = 0.04  # 40mA abs max per I/O pin
max_current_a = 0.2       # 200mA total VCC/GND
max_voltage_v = 6.0       # Abs max row "Maximum Operating Voltage"; NOT the 5.5 V recommended ceiling

# The recommended range; max_voltage_v above is the abs max, so a supply
# between the two raises the operating-envelope finding.
[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 1.8
max_v = 5.5
abs_max_v = 6.0
basis = "Microchip ATmega328P DS40001984, Features, Operating Voltage 1.8-5.5 V; Absolute Maximum Ratings, Maximum Operating Voltage 6.0 V"

[models.coverage]
implements = ["avr_firmware_execution", "gpio_output_and_direction", "gpio_external_input", "uart_tx_and_rx", "cycle_exact_virtual_clock_and_timers", "watchdog_reboot", "adc_external_channels_0_to_5", "i2c_controller_bridge", "spi_controller_bridge"]
missing = ["board_crystal_frequency_binding", "usb_device_controller", "silicon_power_current_profile", "silicon_timing_and_errata"]
[models.pin_capability.timer_capture]
