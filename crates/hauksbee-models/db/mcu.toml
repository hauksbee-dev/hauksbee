# ATmega48A/PA/88A/PA/168A/PA/328/P Data Sheet Complete DS40002061B (2020): sec. 1.1.5 p.13
# (PC6/RESET: low longer than the minimum pulse resets; with RSTDISBL unprogrammed, the factory
# default per Table 28-7 p.291, PC6 is the reset input); Table 30-1 p.323: RRST Reset Pull-up
# Resistor 30-60 kOhm. RSTDISBL programmed turns the pad into I/O, so a board may legitimately
# reuse it.
[[models.straps]]
role = "pc6_reset"
level = "high"
boot_select = false
internal_pull = "pull_up"
note = "RESET (PC6) is active low with an internal 30-60 kOhm pull-up while RSTDISBL is unprogrammed (factory default); held low it keeps the part in reset"

