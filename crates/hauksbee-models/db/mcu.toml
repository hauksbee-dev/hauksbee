[models.pin_capability.adc.pads]
"16" = "ADC1_CH2"
[models.pin_capability.pull_up]
basis = "ESP32-C3-WROOM-02 module: pad-to-GPIO mapping from ESP32-C3-WROOM-02 & WROOM-02U Datasheet v1.7 (sha256 2375b1be75ebbfcffa050e6a26c3ee7957bc7171b319066081a491d1b2e21161) Pin Definitions table (p.11). Espressif ESP32-C3 Series Datasheet v2.4 (sha256 833fc000b4b3c3d39c496fcbd597fed5806956503ce7390b19cc8ae82f19f968) section 4.1.3.1 IO MUX and GPIO Matrix (p.36) 'All GPIOs have selectable internal pull-up or pull-down, or can be set to high impedance'; Table 2-1 Pin Overview (pp.16-17) note 5 (p.17). ESP32-C3 Technical Reference Manual v1.4 (sha256 90ef825653e7a2657dc1bb294041aace9f9b69da87d775c2f1b5bd11eb317423) section 5.4.3 (p.163) 'Set or clear IO_MUX_GPIOx_FUN_WPU and IO_MUX_GPIOx_FUN_WPD ... to enable or disable' and Register 5.21 IO_MUX_GPIOn_REG (n: 0-21) IO_MUX_GPIOn_FUN_WPU (p.187). Not listed: EN (reset) and supply pads"
[models.pin_capability.pull_up.pads]
"16" = "GPIO2: IO_MUX_GPIO2_REG FUN_WPU = 1 (internal pull-up)"
"7" = "GPIO8: IO_MUX_GPIO8_REG FUN_WPU = 1 (internal pull-up)"
"8" = "GPIO9: IO_MUX_GPIO9_REG FUN_WPU = 1 (internal pull-up)"

[models.ratings]
