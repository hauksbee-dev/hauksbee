# MCU and module models.

[[models]]
id = "atmega328p"
kind = "mcu"
description = "ATmega328P 8-bit AVR MCU, DIP-28 (28-pin numbering)"

[models.match]
value_re   = "(?i)^ATmega328P?$"
mpn_re     = "(?i)^ATmega328P($|[-_/ ])"

[models.params]
# Crystal load capacitors: ATmega48A/PA/88A/PA/168A/PA/328/P datasheet, Table 9-3 "Low Power
# Crystal Oscillator Operating Modes" and Table 9-5 "Full Swing Crystal Oscillator operating modes"
# (PDF pp. 39-40): recommended range for capacitors C1 and C2 with crystals, 12-22 pF.
xtal_cap_min_f = 12.0e-12
xtal_cap_max_f = 22.0e-12
# hauksbee-mcu backend identifier, tells the co-sim layer which emulator core
# to instantiate.
backend = "simavr:atmega328p"
# Oscillator the part boots from with no external clock parts; hauksbee-bind
# mcu_clock reads it when the oscillator pins carry nothing.
internal_clock = "internal 8 MHz RC oscillator"
# The core clock the co-sim runs this part at when neither the firmware's fuses
# (the ELF .fuse section) nor a crystal bound to XTAL1/XTAL2 state one: the
# internal RC rate above, as a number. It is a GUESS about the real chip and is
# disclosed as one in every result that rests on it. Microchip ATmega328P
# DS40002061A section 9.2.1 "Default Clock Source" (PDF page 37): a part ships
# with the 8.0 MHz RC and CKDIV8 programmed, i.e. 1.0 MHz; this key does not
# assume CKDIV8, so a factory-fused part is 8x slower than the run.
default_clock_hz = 8000000
# Microchip ATmega328P DS40001984, "ADC Noise Canceler / Analog Input Circuitry":
# the ADC is optimized for analog signals with an output impedance of
# approximately 10 kOhm or less, because the 14 pF sample-and-hold capacitor is
# charged through the 1..100 kOhm input path within one sampling window. A card
# WITHOUT this key is not checked at all, which is the honest state for every
# other MCU here until its own datasheet figure is quoted.
max_adc_source_impedance_ohms = 10000.0
# Microchip megaAVR DS40002061B (ATmega48A/PA/88A/PA/168A/PA/328/P), Table 30-1 "Common
# DC characteristics" (Continued): RRST "Reset Pull-up Resistor", 30 kOhm min, 60 kOhm max.
# The minimum, for the held-off check's divider against an external pull-down.
reset_pull_up_ohms = 30000.0
# Microchip megaAVR DS40002061B (ATmega48A/PA/88A/PA/168A/PA/328/P), Table 30-1 "Common DC
# characteristics" (Continued, PDF page 323, printed DS40002061B-page 323): RPU "I/O Pin
# Pull-up Resistor", 20 kOhm min, 50 kOhm max (no typical; the range covers TA -40 to 105 C,
# VCC 1.8 to 5.5 V). The co-sim's sleep-current account turns this into a current RANGE: the
# minimum resistance gives the largest current.
io_pull_up_min_ohms = 20000.0
io_pull_up_max_ohms = 50000.0
# Same datasheet, Table 30-5 "ATmega328P DC characteristics" (PDF page 325, printed
# DS40002061B-page 325): ICC Power-down mode, WDT disabled, VCC = 3 V: typical 0.1 uA, maximum
# 5 uA (maximum is a production test limit; the figures include input leakage current). With
# the watchdog enabled the same table gives 4.2 uA typical and 10 uA maximum.
power_down_current_typ_a = 1.0e-7
power_down_current_max_a = 5.0e-6

[models.pins]
# DIP-28 pin map (KiCad Device:ATmega328P-P symbol). The 32-pad TQFP/QFN/MLF
# numbers the same port pins differently; that package has its own entry below,
# gated on the footprint, and wins wherever the footprint names it.
