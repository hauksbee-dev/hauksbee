# The header's 5V and 3V3 pins are SOURCES on a powered Nano, so a carrier board
# whose rail is fed from them has that rail at a known level. From the Arduino
# Nano 3.0 reference design (ArduinoNano30Eagle, "Arduino Nano2.sch"): +5V is the
# cathode of D1 MBR0520 (anode on USB VBUS) and the output of U3 UA78M05 (input
# on VIN, pin 30); 3V3 is U2 FT232RL pin 17 3V3OUT, the FT232RL itself on +5V.
# The higher of the two +5V sources wins through the Schottky.
#   - USB path: VBUS 4.75 to 5.25 V (USB 2.0 7.3.2) less the MBR0520L forward
#     drop, 0.385 V max at 0.5 A (onsemi MBR0520LT1/D, Maximum Instantaneous
#     Forward Voltage): 4.365 V at worst.
#   - VIN path: UA78M05 VO 4.75 to 5.25 V over the full TJ range (TI SLVS059V,
#     5.6 Electrical Characteristics: UA78M05, VI = 7 to 20 V, IO = 5 to 350 mA).
#   - 3V3: FT232R "3.3v regulator output" 3.0 / 3.3 / 3.6 V (FTDI FT_000053
#     Version 2.10, Table 5.2 Operating Voltage and Current), 50 mA max for
#     external circuitry (same datasheet, section 4, +3.3V LDO Regulator).
# Clones with a CH340 in place of the FT232RL may not drive 3V3 the same way.
# The 5V pin can also be an INPUT (a regulated 5 V fed to pin 27); a board that
# drives it from its own regulator keeps that regulator's level.
[[models.supply_outputs]]
role = "5v"
nominal = 5.0
min = 4.365
max = 5.25
basis = "Arduino Nano 3.0 reference design: +5V = USB VBUS (4.75-5.25 V, USB 2.0 7.3.2) through D1 MBR0520 (VF <= 0.385 V at 0.5 A, onsemi MBR0520LT1/D) or U3 UA78M05 from VIN (4.75-5.25 V, TI SLVS059V 5.6)"

[[models.supply_outputs]]
role = "3v3"
nominal = 3.3
min = 3.0
max = 3.6
basis = "Arduino Nano 3.0 reference design: 3V3 = FT232RL 3V3OUT, 3.0/3.3/3.6 V (FTDI FT_000053 v2.10 Table 5.2), 50 mA max external load"

# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Pro Micro: the ATmega32U4 carrier board (SparkFun DEV-12640 and the very many
# clones of it), a 24-pin 2 x 12 header at 0.1 in pitch. The single most common
# controller in the hand-wired / split-keyboard world, where the whole board is
# a switch matrix hanging off this one module.
#
# Sources:
#   - ATmega32U4 pin functions and ADC channel numbers: Atmel/Microchip
#     "ATmega16U4/32U4" datasheet, Atmel-7766J-USB-ATmega16U4/32U4-Datasheet_
#     04/2016, section 1.1 Pin descriptions (PD4 = ADC8, PD6 = ADC9,
#     PD7 = ADC10, PB4 = ADC11, PB5 = ADC12, PB6 = ADC13, PF4..PF7 = ADC4..7)
#     and section 29.1 Absolute Maximum Ratings.
#   - Header-position to port-pin mapping: the SparkFun Pro Micro pinout, which
#     every clone and every keyboard footprint copies. Cross-checked against the
#     Sofle v2 keyboard's own symbol, which spells the port on every pin
#     ("TX(PD3)" on 1, "D5(PC6)" on 8, "A0(PF7)" on 17), agreeing position for
#     position with the map below.
#
# THE 1..24 NUMBERING IS THE FOOTPRINT'S, not SparkFun's schematic, which numbers
# its two headers separately. Every keyboard footprint in circulation uses the
# single 1..24 run below, which is what makes this map useful; a board built from
# SparkFun's own symbol would number its pads differently and would not match.
#
# WHY THE ROLES ARE PORT NAMES AND NOT "d5" / "a0". The silkscreened Arduino
# numbers are NOT a portable mapping: D5 is PC6 on a Pro Micro and PD5 on a
# Nano, D8 is PB4 here and PB0 there. The binder's `module` d-number table is
# the Nano's ATmega328P one, so naming these pins by their Arduino numbers would
# wire every key row to the wrong port bit. Naming the port directly is both
# correct and self-checking: the role IS the thing the co-sim toggles.
#
# DELIBERATELY NOT MODELLED: the carrier board itself. RAW (pin 24) feeds an
# on-module regulator whose output is VCC (pin 21), and this entry does not
# stamp that regulator, so a board powering the module from RAW sees no path to
# VCC. That is the honest reading of a module entry whose pin map stops at the
# header: the two pins are named, and nothing pretends to know what is between
# them. The RX/TX LEDs (PB0, PD5) and the USB connector are likewise off-map,
# and the clock is the card's `default_clock_hz` (the Nano's own 16 MHz crystal).
# Microchip ATmega48A/PA/88A/PA/168A/PA/328/P Data Sheet Complete DS40002061B (2020), section 20 (USART0). Printed page numbers.
[models.peripherals.uart]
source = "https://ww1.microchip.com/downloads/aemDocuments/documents/MCU08/ProductDocuments/DataSheets/ATmega48A-PA-88A-PA-168A-PA-328-P-DS-DS40002061B.pdf"
source_sha256 = "b9b9d83cda56a95d999ea8d54fe5a540748ae9020e5e7ae19b913d384ba9320e"
basis = "Microchip ATmega48A/PA/88A/PA/168A/PA/328/P Data Sheet Complete DS40002061B (2020), section 20 USART0: Table 20-1 (p.182), Tables 20-2 and 20-3 (p.194), Table 20-7 (pp.198-199)"

[[models.peripherals.uart.clock_sources]]
name = "system clock (fOSC)"
basis = "Table 20-1 note (p.182): fOSC is the System Oscillator clock frequency; the datasheet states no separate UART clock limit"

[models.peripherals.uart.baud]
formula = "BAUD = fOSC / (S * (UBRRn + 1)), S = 16 (U2Xn = 0) or 8 (U2Xn = 1); UBRRn in 0-4095"
divisor_offset = 1.0
fraction_bits = 0
register_bits = 12
oversampling = [16, 8]
basis = "Table 20-1 (p.182): asynchronous normal and double speed equations; UBRRn = contents of UBRRnH and UBRRnL, range 0-4095; section 20.3.2 (p.182) U2Xn halves the divisor from 16 to 8"

[[models.peripherals.uart.max_baud]]
oversampling = 16
baud_hz = 1000000.0
condition = "fOSC = 16 MHz, U2Xn = 0, UBRRn = 0 (fOSC / 16)"
basis = "Table 20-7 (p.199), fosc = 16.0000 MHz column, Max. row: 1 Mbps"

