# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Pro Micro: the ATmega32U4 carrier board (SparkFun DEV-12640 and the very many
# clones of it), a 24-pin 2 x 12 header at 0.1 in pitch. The single most common
# controller in the hand-wired / split-keyboard world, where the whole board is
# a switch matrix hanging off this one module.
#
# Sources:
#   - ATmega32U4 pin functions and ADC channel numbers: Atmel/Microchip
#     "ATmega16U4/32U4" datasheet, Atmel-7766J-USB-ATmega16U4/32U4-Datasheet_
#     04/2016, section 1.1 Pin descriptions (PD4 = ADC8, PD6 = ADC9,
#     PD7 = ADC10, PB4 = ADC11, PB5 = ADC12, PB6 = ADC13, PF4..PF7 = ADC4..7)
#     and section 29.1 Absolute Maximum Ratings.
#   - Header-position to port-pin mapping: the SparkFun Pro Micro pinout, which
#     every clone and every keyboard footprint copies. Cross-checked against the
#     Sofle v2 keyboard's own symbol, which spells the port on every pin
#     ("TX(PD3)" on 1, "D5(PC6)" on 8, "A0(PF7)" on 17), agreeing position for
#     position with the map below.
#
# THE 1..24 NUMBERING IS THE FOOTPRINT'S, not SparkFun's schematic, which numbers
# its two headers separately. Every keyboard footprint in circulation uses the
# single 1..24 run below, which is what makes this map useful; a board built from
# SparkFun's own symbol would number its pads differently and would not match.
#
# WHY THE ROLES ARE PORT NAMES AND NOT "d5" / "a0". The silkscreened Arduino
# numbers are NOT a portable mapping: D5 is PC6 on a Pro Micro and PD5 on a
# Nano, D8 is PB4 here and PB0 there. The binder's `module` d-number table is
# the Nano's ATmega328P one, so naming these pins by their Arduino numbers would
# wire every key row to the wrong port bit. Naming the port directly is both
# correct and self-checking: the role IS the thing the co-sim toggles.
#
# DELIBERATELY NOT MODELLED: the carrier board itself. RAW (pin 24) feeds an
# on-module regulator whose output is VCC (pin 21), and this entry does not
# stamp that regulator, so a board powering the module from RAW sees no path to
# VCC. That is the honest reading of a module entry whose pin map stops at the
# header: the two pins are named, and nothing pretends to know what is between
# them. The RX/TX LEDs (PB0, PD5) and the USB connector are likewise off-map,
# and the clock is the AVR backend's 16 MHz, which is right for a 5 V Pro Micro
# and a factor of two fast for a 3.3 V one.
[[models]]
id = "pro_micro"
kind = "mcu"
description = "Pro Micro module (ATmega32U4 carrier, 24-pin 2x12 header)"

[models.match]
# "ProMicro" is the value the Sofle and most keyboard projects carry, optionally
# with the vendor name or the 5 V / 16 MHz speed grade spelled out.
#
# THE 3.3 V / 8 MHz SPELLINGS ARE DELIBERATELY NOT MATCHED. The AVR backend
# instantiates every core at 16 MHz and emits no warning when the board asked for
# something else (see the clock note above), so a value string that says 8 MHz out
# loud is a board telling us its firmware timing would come out wrong by a factor
# of two. Refusing it makes that an honest unresolved instead of a silent 2x error;
# the bare "ProMicro" is genuinely ambiguous and is accepted, with the 16 MHz
# assumption stated.
#
# Elite-C and nice!nano are pin-compatible successors with DIFFERENT MCUs (a 32U4
# with more flash, and an nRF52840), so neither is matched: an nRF on the AVR core
# would be the wrong instruction set.
value_re = "(?i)^(SparkFun[ _-]?)?Pro[ _-]?Micro([ _-]?(5V|16MHz))?$"

[models.params]
backend = "simavr:atmega32u4"
module  = true        # flag: pin map is at the module header level

[models.pins]
# Header position 1..24. Positions 3, 4 and 23 are all GND (the module bonds
# them together); they carry distinct role names because the binder keys roles
# by string, and a duplicate would drop a connection.
"1"  = "pd3_txd1"
"2"  = "pd2_rxd1"
"3"  = "gnd"
"4"  = "gnd2"
"5"  = "pd1_sda"
"6"  = "pd0_scl"
"7"  = "pd4_adc8"
"8"  = "pc6"
"9"  = "pd7_adc10"
"10" = "pe6"
"11" = "pb4_adc11"
"12" = "pb5_adc12"
"13" = "pb6_adc13"
"14" = "pb2_mosi"
"15" = "pb3_miso"
"16" = "pb1_sck"
"17" = "pf7_adc7"
"18" = "pf6_adc6"
"19" = "pf5_adc5"
"20" = "pf4_adc4"
"21" = "vcc"
"22" = "reset"
"23" = "gnd3"
# RAW: the module's unregulated input, ahead of the on-board regulator. NOT
# named `vcc`: tying it to the VCC role would tell the solver the two pins are
# the same node, which is exactly what the regulator makes them not.
"24" = "raw"

[models.ratings]
# Section 29.1 Absolute Maximum Ratings, ATmega32U4.
max_pin_current_a = 0.04  # DC current per I/O pin, 40.0 mA
max_current_a = 0.2       # DC current VCC and GND pins, 200.0 mA
max_voltage_v = 6.0       # Maximum operating voltage

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "stm32f103c8"
kind = "mcu"
description = "STM32F103C8 Cortex-M3 MCU (blue pill), LQFP-48"

[models.match]
value_re = "(?i)^STM32F103C[8B]?(T6)?$"
mpn_re   = "(?i)^STM32F103C[8B]"

[models.params]
# hauksbee-mcu backend identifier: the Renode backend brings up the matching
# Renode platform (stm32f103.repl) and bridges GPIO/UART through its monitor.
backend = "renode:stm32f103"

[models.pins]
# LQFP-48 pin map (KiCad MCU_ST_STM32F1:STM32F103C8Tx default symbol). Only the
# pins the hauksbee demo board wires are named with GPIO/ADC roles; power and
# the rest carry their port role so the binder can stamp drivers when wired.
# Roles use the "p<port><bit>" convention the binder's gpio_of_role parses.
"1"  = "pc13"      # onboard LED (blue pill), active-low to 3V3 in HW
"2"  = "pc14"
"3"  = "pc15"
"5"  = "osc_in"    # HSE crystal / external-clock input
"6"  = "osc_out"   # HSE crystal oscillator output
"8"  = "vss"
"9"  = "vdd"
"10" = "pa0_adc0"  # LQFP-48 pin 10 = PA0 (PA0-WKUP / ADC1_IN0) per ST DS5319; matches the
                   # pa1_adc1/pa2_adc2 convention. Package-faithful.
"11" = "pa1_adc1"
"12" = "pa2_adc2"
"14" = "pa4_adc4"
"15" = "pa5"       # alive indicator (GPIO output); SPI1_SCK on the SPI ADC demo board. LQFP-48 pin 15 = PA5.
"16" = "pa6"       # SPI1_MISO on the SPI ADC demo board. LQFP-48 pin 16 = PA6.
"17" = "pa7"       # LQFP-48 pin 17 = PA7 (ADC1_IN7 / SPI1_MOSI) per ST DS5319; matches the
                   # plain pa5/pa6 convention. Package-faithful.
"18" = "pb0"       # LQFP-48 pin 18 = PB0 (ST DS5319). Package-faithful; not wired by the demos.
"23" = "vss2"
"24" = "vdd2"
"29" = "pa8"       # PA8: firmware threshold/FLAG output. LQFP-48 pin 29 = PA8 (ST DS5319). The SPI ADC
                   # demo board routes firmware PA8 here to its "FLAG" net (package-faithful).
"30" = "pa9"       # USART1 TX
"31" = "pa10"      # USART1 RX
"35" = "vss3"
"36" = "vdd3"
"37" = "pb6_i2c1_scl"
"38" = "pb7_i2c1_sda"
"44" = "boot0"     # BOOT0 strapping pin (LQFP-48 pin 44; RM0008 boot config)
"48" = "vdd4"      # VDDA

[models.ratings]
max_pin_current_a = 0.025  # 25 mA abs max per I/O pin
max_current_a = 0.15
max_voltage_v = 3.6

# Strapping. STM32F1 samples BOOT0 (and BOOT1=PB2) on the 4th rising SYSCLK
# edge after reset to select the boot memory. BOOT0=0 -> boot from main flash
# (normal). BOOT0=1 -> system memory (bootloader) or SRAM. A floating BOOT0
# leaves the boot source undefined, so it must be biased (the bluepill ties it
# low through the BOOT0 header). Ref: ST RM0008 rev 21, sec 3.4 "Boot
# configuration", Table 9.
[[models.straps]]
role = "boot0"
level = "low"
boot_select = true   # latches the boot memory; firmware cannot undo it
internal_pull = "none"   # STM32 BOOT0 has NO on-die pull: a floating net is undefined
note = "BOOT0 low boots main flash; high enters system bootloader/SRAM"

# ─────────────────────────────────────────────────────────────────────────────
# STM32F401C (UFQFPN48): the 48-pin F401 (F401CB/CC/CD/CE). Modelled primarily so
# the boot strap-pin lint covers its BOOT0, the rest of the modern STM32 line was
# otherwise unmodelled. Co-sim, when wired, reuses the same
# renode STM32F4 platform the binder's family fallback already selects, so adding
# this DB entry does not change the co-sim path. The pin map is intentionally
# limited to the strap pin (BOOT0 = UFQFPN48 pad 44, verified against the
# STM32F401CCU6 footprint); the renode platform owns the rest for co-sim.
[[models]]
id = "stm32f401c"
kind = "mcu"
description = "STM32F401C Cortex-M4 MCU (UFQFPN48: F401CB/CC/CD/CE)"

[models.match]
value_re = "(?i)^STM32F401C[BCDE]?(U6|T6|C6)?$"
mpn_re   = "(?i)^STM32F401C[BCDE]"

[models.params]
backend = "renode:stm32f4"

[models.pins]
"44" = "boot0"   # BOOT0 strapping pin, UFQFPN48 pad 44 (verified vs the footprint)

# STM32F4 samples BOOT0 (with BOOT1=PB2) shortly after reset to pick the boot
# memory. BOOT0=0 -> main flash (normal). BOOT0=1 -> system bootloader / SRAM.
# The STM32F4 BOOT0 pin has NO internal pull, so a floating BOOT0 leaves the boot
# source genuinely undefined and the part can come up in the bootloader instead
# of the application, every ST reference design ties it through an external
# resistor. Ref: ST RM0368 sec 2.4 "Boot configuration"; DS9716 pin definitions.
[[models.straps]]
role = "boot0"
level = "low"
boot_select = true
internal_pull = "none"
note = "BOOT0 low boots main flash; high enters the system bootloader/SRAM"

# ─────────────────────────────────────────────────────────────────────────────
# ESP32 family. The classic ESP32 and ESP32-C3 co-simulate through the
# Espressif-QEMU backend (`backend = "qemu:..."`, see docs/cosim/MCU.md); with no
# firmware given the scheduler leaves the MCU out and the board solves as a
# passive circuit, so extraction/report and the strap lint work regardless.
#
# All strap data below is from the Espressif TRMs/datasheets, cited per entry.
# The strap-pin lint reads `[models.straps]` + the pad->role map to find which
# net each strap sits on, then flags a strap net driven by a free-running clock
# at reset, biased to the wrong level, or left with no defined level.

[[models]]
id = "esp32_wroom"
kind = "mcu"
description = "Espressif ESP32 classic (WROOM-32 / WROVER module, or bare ESP32-D0WD)"

[models.match]
# ESP-WROOM-32 / ESP32-WROOM-32(E/D/U/-N4/-N8/-N16) / ESP32-WROVER modules and
# the bare ESP32 chip. The trailing flash/PSRAM/revision suffixes (e.g.
# "ESP32-WROOM-32E-N4" on the Olimex EVB rev L) must all match the same strap
# table, so the suffix is left open after "32".
value_re = "(?i)^(ESP[- ]?WROOM[- ]?32|ESP32[- ]?WRO(OM|VER)[- ]?32?.*|ESP32(-D0WD.*)?)$"
# No mpn_re: match rules are ANDed, so an mpn_re would reject the common case
# of a board whose ESP32 carries no MPN property (Olimex EVB, most KiCad libs).

[models.params]
# hauksbee-mcu backend identifier: the QEMU backend boots the matching Espressif
# QEMU machine (esp32) from the merged flash image and bridges GPIO (via the RAM
# mailbox) / UART through QMP + gdbstub + the serial socket. The ESP32 is a 3.3 V
# part; the scheduler drives its GPIO outputs at 3.3 V (the qemu: prefix selects
# the rail, same as renode:). With no firmware given the scheduler skips the
# MCU entirely, so lint/report-only runs never need QEMU.
backend = "qemu:esp32"

[models.pins]
# ESP-WROOM-32 module pad map (KiCad RF_Module:ESP32-WROOM-32 / Olimex symbol).
# Strap pads carry flat "gpio<n>" roles: the binder's gpio_of_role parses them
# (port '0', bit n) for co-sim drive, and the strap lint matches them against
# [models.straps] by exact string. Pad numbers verified against the Olimex
# ESP32-EVB netlist (U3 = ESP-WROOM-32): pad25=GPIO0, 24=GPIO2, 29=GPIO5,
# 14=GPIO12/MTDI, 23=GPIO15/MTDO. The demo-board pads (GPIO4, UART0) keep the
# "p0<bit>" convention; both spellings resolve to the same port/bit.
"1"  = "vss"        # GND
"2"  = "vdd"        # 3V3
"25" = "gpio0"
"24" = "gpio2"      # alive indicator on the QEMU demo board (LED path)
"29" = "gpio5"
"14" = "gpio12"    # MTDI
"23" = "gpio15"    # MTDO
"26" = "p04"        # GPIO4: ~5 Hz blink, observable through the solved circuit
"34" = "p01_txd"    # U0TXD (UART0 TX)
"33" = "p03_rxd"    # U0RXD (UART0 RX)

[models.ratings]
max_pin_current_a = 0.04   # ~40 mA abs max source/sink per pad (datasheet)
max_current_a = 0.5
max_voltage_v = 3.6

# Strapping pins. Ref: ESP32 Technical Reference Manual v5.1, Table "Strapping
# Pins" (sec "IO_MUX and GPIO Matrix"), and ESP32 datasheet v4.3, sec 5.10
# "Strapping Pins". Latched on the rising edge of the chip-power-on reset; the
# level must be stable through the latch window.
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true   # latches SPI-vs-download boot; unrecoverable in firmware
note = "GPIO0 high = SPI boot (normal); low = download/UART boot. A 50 MHz clock here randomly enters download mode (Olimex ESP32-EVB)"

[[models.straps]]
role = "gpio2"
level = "low"     # low-or-floating; must NOT be pulled high during download
note = "GPIO2 must be low or floating at reset; tie-high blocks download mode"

[[models.straps]]
role = "gpio12"   # MTDI
level = "low"
note = "MTDI/GPIO12 selects VDD_SDIO flash voltage: low = 3.3 V (normal), high = 1.8 V"

[[models.straps]]
role = "gpio15"   # MTDO
level = "high"
note = "MTDO/GPIO15 high (normal) silences boot log on U0TXD; low enables it"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "esp32_pico"
kind = "mcu"
description = "Espressif ESP32-PICO-D4 SiP (Watchy v1.x/v2.x)"

[models.match]
value_re = "(?i)^ESP32[- ]?PICO[- ]?D4$"

[models.params]
# Same ESP32 die as esp32_wroom, so the same QEMU machine (esp32) boots it. With
# no firmware given the scheduler skips the MCU entirely (lint/report-only runs
# never need QEMU); with firmware it boots the merged flash image and bridges
# GPIO (via the RAM mailbox) / UART. The boot-coverage execution of the Watchy
# RES# row (docs/evidence/KNOWN_FAULTS_VALIDATION.md) runs through this.
backend = "qemu:esp32"

[models.pins]
# ESP32-PICO-D4 LGA-48 (KiCad RF_Module:ESP32-PICO-D4). Same ESP32 die, same
# strap GPIOs; on the SiP the flash straps (GPIO12/GPIO15) are bonded internally
# to the in-package flash, so only GPIO0/GPIO2/GPIO5 are board-exposed. Pad
# numbers from the KiCad symbol; GPIO0 = pad 23 (verified on Watchy v1.5/v2.0).
# The display + UART pads are verified against the Watchy v1.5 corpus board file
# (net_probe): RES = U1 pad 28 = GPIO9, TX = pad 41 = GPIO1/U0TXD, RX = pad 40 =
# GPIO3/U0RXD. GPIO9 is the e-paper DISPLAY_RES the boot-coverage check watches.
"23" = "gpio0"
"24" = "gpio2"
"34" = "gpio5"
"28" = "gpio9"      # DISPLAY_RES (board net RES); driven high by display init
"41" = "p01_txd"    # U0TXD (UART0 TX)
"40" = "p03_rxd"    # U0RXD (UART0 RX)

# Ref: ESP32-PICO-D4 datasheet v1.7, sec "Strapping Pins" (inherits ESP32 TRM
# v5.1 strap table). The package-internal flash straps are not listed (fixed by
# the SiP).
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true   # latches SPI-vs-download boot; unrecoverable in firmware
note = "GPIO0 high = SPI boot (normal); low = download/UART boot"

[[models.straps]]
role = "gpio2"
level = "low"
note = "GPIO2 must be low or floating at reset"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "esp32s3"
kind = "mcu"
description = "Espressif ESP32-S3 (WROOM-1 module or bare, Watchy v3)"

[models.match]
value_re = "(?i)^ESP32[- ]?S3([- ]?WROOM.*)?$"

[models.params]
# hauksbee-mcu backend identifier: the QEMU backend boots the Espressif-QEMU
# esp32s3 machine (Xtensa LX7) from the merged flash image and bridges GPIO
# (via the RAM mailbox) / UART through QMP + gdbstub + the serial socket, same
# as the classic ESP32 entries above. Descriptor: db/mcu/esp32s3.soc.toml in
# hauksbee-mcu. With no firmware given the scheduler skips the MCU entirely,
# so lint/report-only runs never need QEMU.
backend = "qemu:esp32s3"

[models.pins]
# ESP32-S3 strap GPIOs (KiCad RF_Module:ESP32-S3-WROOM-1). On the S3 the
# strapping pins are GPIO0, GPIO3, GPIO45, GPIO46. Pad map from the WROOM-1
# symbol; GPIO0 = pad 27 (verified vs Watchy v3 BOOT net).
"27" = "gpio0"
"15" = "gpio3"
"7"  = "gpio45"
"6"  = "gpio46"

# Ref: ESP32-S3 Technical Reference Manual v1.6, Table 2-9 "Strapping Pins";
# ESP32-S3 datasheet v1.7 sec 2.4. GPIO0 high = SPI boot; GPIO46 selects ROM
# messages / boot mode and must be low-or-floating at reset.
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true   # latches SPI-vs-download boot; unrecoverable in firmware
note = "GPIO0 high = SPI boot (normal); low with GPIO46=0 = download boot"

[[models.straps]]
role = "gpio46"
level = "low"
note = "GPIO46 must be low or floating at reset (joins GPIO0 to pick boot mode)"

[[models.straps]]
role = "gpio45"
level = "defined"
note = "GPIO45 selects VDD_SPI flash voltage (low = 3.3 V default); must be defined"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "esp32s2"
kind = "mcu"
description = "Espressif ESP32-S2 (WROOM module or bare)"

[models.match]
value_re = "(?i)^ESP32[- ]?S2([- ]?WROOM.*)?$"

[models.pins]
# ESP32-S2 strap GPIOs: GPIO0, GPIO45, GPIO46. Pad map from KiCad
# RF_Module:ESP32-S2-WROOM symbol.
"27" = "gpio0"
"7"  = "gpio45"
"6"  = "gpio46"

# Ref: ESP32-S2 Technical Reference Manual v1.2, Table "Strapping Pins";
# ESP32-S2 datasheet v1.4 sec 2.4.
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true   # latches SPI-vs-download boot; unrecoverable in firmware
note = "GPIO0 high = SPI boot (normal); low = download boot"

[[models.straps]]
role = "gpio46"
level = "low"
note = "GPIO46 must be low or floating at reset"

[[models.straps]]
role = "gpio45"
level = "defined"
note = "GPIO45 selects VDD_SPI flash voltage; must be defined"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "esp32c3"
kind = "mcu"
description = "Espressif ESP32-C3 (RISC-V RV32IMC; WROOM-02 / MINI-1 module or bare)"

[models.match]
value_re = "(?i)^ESP32[- ]?C3([- ]?(WROOM|MINI).*)?$"

[models.params]
backend = "qemu:esp32c3"

[models.pins]
# Demo-board pads (the QEMU C3 proof board) use the "p0<bit>" convention; the
# strap pads ("gpio<n>") are matched by the strap lint by exact role string.
# Both spellings parse to the same flat GPIO space in the binder.
#
# Strap pad numbers below are the ESP32-C3-MINI-1 module pad numbering (Espressif
# ESP32-C3-MINI-1 datasheet v2.x, Table "Pin Definitions": IO2=pad5, IO8=pad22,
# IO9=pad23). NOTE: the ESP32-C3-WROOM-02 module uses DIFFERENT pad numbers for
# the same straps (IO2=pad16, IO8=pad7, IO9=pad8), so this single map is correct
# for MINI-1 (and the synthetic demo, which reuses MINI-1) but would mis-locate
# the straps on a real WROOM-02; split the model by footprint if WROOM-02 support
# is needed. (Previously these were 16/5/6, which matched neither module and fired
# a false "GPIO9 mis-strapped" lint on MINI-1 boards whose pad 6 is GPIO3.)
"1"  = "vss"
"2"  = "vdd"
"12" = "p02"        # GPIO2 (demo board)
"13" = "p04"        # GPIO4 (demo board)
"30" = "p021_txd"   # U0TXD on GPIO21
"31" = "p020_rxd"   # U0RXD on GPIO20
"5"  = "gpio2"      # strap (ESP32-C3-MINI-1 pad numbering)
"22" = "gpio8"      # strap
"23" = "gpio9"      # strap (BOOT)

[models.ratings]
max_pin_current_a = 0.04
max_current_a = 0.4
max_voltage_v = 3.6

# Ref: ESP32-C3 Technical Reference Manual v1.1, Table 2-8 "Strapping Pins";
# ESP32-C3 datasheet v1.5 sec 2.4. GPIO9 is the C3's "BOOT" pin (the GPIO0
# equivalent): high = SPI boot (normal), low = download. GPIO8 must be high at
# reset. GPIO2 must be high.
[[models.straps]]
role = "gpio9"
level = "high"
boot_select = true   # the C3 BOOT pin; latches SPI-vs-download boot
note = "GPIO9 (BOOT) high = SPI boot (normal); low = download boot"

[[models.straps]]
role = "gpio8"
level = "high"
note = "GPIO8 must be high at reset (with GPIO9) for normal boot"

[[models.straps]]
role = "gpio2"
level = "high"
note = "GPIO2 must be high at reset"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "nrf52840"
kind = "mcu"
description = "Nordic nRF52840 (Cortex-M4F) SoC"

[models.match]
value_re = "(?i)^nRF52840"
mpn_re   = "(?i)^nRF52840"

[models.params]
# Renode backend: brings up nrf52840.repl. nRF GPIO is two 32-bit ports
# (gpio0/gpio1); roles "p0<bit>" map port '0', "p1<bit>" map port '1'.
backend = "renode:nrf52840"

[models.pins]
# Minimal demo map; only the wired pads carry roles. P0.13 is the nRF52840-DK
# LED1; UART on P0.06 (TXD) / P0.08 (RXD).
"1"  = "vss"
"2"  = "vdd"
"3"  = "p013"       # LED / alive indicator into the analog circuit
"4"  = "p014"       # blink
"5"  = "p006_txd"   # UART TXD
"6"  = "p008_rxd"   # UART RXD

[models.ratings]
max_pin_current_a = 0.015
max_current_a = 0.1
max_voltage_v = 3.6

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "fe310"
kind = "mcu"
description = "SiFive FE310-G002 (RISC-V RV32IMAC, HiFive1)"

[models.match]
value_re = "(?i)^(FE310|FE310-G00[0-9]|HiFive1)"
mpn_re   = "(?i)^FE310"

[models.params]
# Renode backend: brings up sifive-fe310.repl. One 32-bit gpio0 port; roles
# "p0<bit>".
backend = "renode:sifive_fe310"

[models.pins]
"1"  = "vss"
"2"  = "vdd"
"3"  = "p019"       # HiFive1 LED is on GPIO 19
"4"  = "p021"       # second GPIO for blink
"5"  = "p017_txd"   # uart0 TX
"6"  = "p016_rxd"   # uart0 RX

[models.ratings]
max_pin_current_a = 0.02
max_current_a = 0.1
max_voltage_v = 3.6

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "rp2040"
kind = "mcu"
description = "Raspberry Pi RP2040 (Cortex-M0+ dual). QSPI_SS is the BOOTSEL strap."

[models.match]
value_re = "(?i)^RP2040$"

[models.params]
# RP2040 co-sim runs on the renode:rp2040 descriptor in hauksbee-mcu. Renode
# ships no rp2040 platform, so the descriptor carries its own: the peripheral
# models are vendored C# compiled by Renode at run time through the support-bundle
# mechanism (db/mcu/rp2040/, src/renode/support.rs). Stock pico-sdk firmware boots
# through the real boot ROM into main().
#
# Proven end-to-end on a live machine: GPIO out/direction through the SIO
# (two-sided), UART0 TX, timers/clocks/resets as far as the SDK booting and
# sleep_ms costing the right virtual time, ADC injection on inputs 0..3, and the
# I2C bus-slave bridge on i2c0/i2c1 in both directions.
#
# Not available, and refused loudly rather than faked: SPI bus-slave (the
# vendored PL022 never invokes a registered slave), PIO (upstream models it on an
# x86-64-only native library), ADC input 4 (the on-die temperature sensor is not
# an external node, so it takes the merged policy's once-per-channel drop). The
# second core is declared and un-halted with the SIO genuinely shared, but no
# two-core firmware has been run. Full tier list: db/mcu/rp2040.soc.toml.
backend = "renode:rp2040"

[models.pins]
# RP2040 QFN-56 (KiCad MCU_RaspberryPi_and_Boards:RP2040). The boot strap is
# QSPI_SS (pad 56): at reset the boot ROM samples it; pulled high (the flash
# chip-select idles high) = boot from QSPI flash (normal), held low = USB
# BOOTSEL mass-storage. The BOOTSEL button shorts it low through a series R.
# Pad 56 = QSPI_SS verified vs rp2040_minimal and SparkFun Thing Plus RP2040.
"56" = "qspi_ss"

# Ref: RP2040 Datasheet (build 2.21), sec 2.8.1.2 "Boot sequence" and sec 2.8.6
# "Bootrom contents"; the GPIO_QSPI_SS pin must idle high (flash CS) for normal
# boot. Held low at reset selects the USB bootloader.
[[models.straps]]
role = "qspi_ss"
level = "high"
boot_select = true   # held low at reset selects the USB bootloader (BOOTSEL)
note = "QSPI_SS (flash CS) high = boot from flash (normal); held low = USB BOOTSEL"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "rpi_pico"
kind = "mcu"
description = "Raspberry Pi Pico module (RP2040 carrier, 40-pin 2.54mm header; Pico/H/W/WH)"

[models.match]
# KiCad libraries and vendor symbols spell the board "Pico", "RPi_Pico",
# "RPi_Pico_WH", "Raspberry Pi Pico"; BOMs often carry the Raspberry Pi product
# code instead (SC0915 = Pico, SC0916 = Pico made-in-Japan, SC0917 = Pico H,
# SC0918 = Pico W, SC0919 = Pico WH). All carry the same RP2040 and the same
# header pinout, so one entry covers them. Anchored full-string so a bare
# "Pico" value binds but "ESP32-PICO-D4" (its own entry above) and the RP2350
# "Pico 2" (different chip, not modelled) do not. Match rules are ANDed, so no
# footprint_re: a board carrying only the value or only the product code must
# still bind.
value_re = "(?i)^((r(aspberry)?[-_ ]?pi[-_ ]?)?pico([-_ ]?(wh?|h))?|sc091[5-9])$"

[models.params]
# The Pico wraps an RP2040 plus its QSPI flash, so it gets the same co-sim
# backend as the bare chip: the renode:rp2040 descriptor, whose per-feature
# proof and refusals are spelled out on the rp2040 entry above. Nothing about
# the module changes what the emulated die can do, and the header pinout below
# maps straight onto the chip's GPIO space, so a Pico board and an RP2040 board
# run the same machine.
#
# Deliberately NOT `module = true`: that flag switches the binder's role parser
# to Arduino-Nano header names (d0..d13 -> AVR ports), which is wrong here. The
# flat "gpio<n>" roles below parse in the standard (non-module) convention.
backend = "renode:rp2040"

[models.pins]
# Raspberry Pi Pico 40-pin header (Pico datasheet, ch. 2 "Pin information";
# same map on Pico H/W/WH). GP numbers are RP2040 GPIO numbers, so the flat
# "gpio<n>" roles line up with the chip's GPIO space directly. GP23/24/25/29
# are used on-module (SMPS mode, VBUS sense, LED / wireless on the W) and are
# not on the header, hence the gaps. The QSPI_SS/BOOTSEL strap never reaches
# the header either (the BOOTSEL button lives on the module), so this entry
# carries no [models.straps]: at the module level there is nothing for the
# strap lint to check, and that absence is deliberate.
"1"  = "gpio0"       # GP0: UART0 TX default
"2"  = "gpio1"       # GP1: UART0 RX default
"3"  = "gnd"
"4"  = "gpio2"
"5"  = "gpio3"
"6"  = "gpio4"       # I2C0 SDA default
"7"  = "gpio5"       # I2C0 SCL default
"8"  = "gnd2"
"9"  = "gpio6"
"10" = "gpio7"
"11" = "gpio8"
"12" = "gpio9"
"13" = "gnd3"
"14" = "gpio10"
"15" = "gpio11"
"16" = "gpio12"
"17" = "gpio13"
"18" = "gnd4"
"19" = "gpio14"
"20" = "gpio15"
"21" = "gpio16"      # SPI0 RX default
"22" = "gpio17"      # SPI0 CSn default
"23" = "gnd5"
"24" = "gpio18"      # SPI0 SCK default
"25" = "gpio19"      # SPI0 TX default
"26" = "gpio20"
"27" = "gpio21"
"28" = "gnd6"
"29" = "gpio22"
"30" = "run"         # RUN: reset input, active low
"31" = "gpio26_adc0"
"32" = "gpio27_adc1"
"33" = "gnd7"        # AGND
"34" = "gpio28_adc2"
"35" = "adc_vref"
"36" = "3v3"         # 3V3(OUT), from the on-module SMPS
"37" = "3v3_en"      # pull low to disable the on-module SMPS
"38" = "gnd8"
"39" = "vsys"        # 1.8-5.5 V system input
"40" = "vbus"        # micro-USB 5 V

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "daisy_seed"
kind = "mcu"
description = "Electrosmith Daisy Seed module (STM32H750IBK6 carrier, 2x20-pin header)"

[models.match]
# "Daisy_Seed", "DaisySeed", "Daisy Seed", optionally with a rev suffix and/or
# the vendor name in front. Anchored so the Seed2 DFM (a different module with
# a different pinout) does not bind here.
value_re = "(?i)^(electro[-_ ]?smith[-_ ]?)?daisy[-_ ]?seed([-_ ]?rev[-_ ]?[0-9a-z.]+)?$"

[models.params]
# The Daisy Seed wraps an STM32H750IBK6 (Cortex-M7) plus SDRAM, QSPI flash and
# an audio codec. This entry exists for identification and bind coverage: no
# hauksbee-mcu descriptor exists for any STM32H7 (the embedded descriptor list
# stops at stm32f4_discovery) and the engine's family router does not route
# STM32H7 either, so co-sim is declared unavailable with the explicit "none:"
# token the scheduler refuses loudly, rather than leaving the module UNRESOLVED
# or letting it fall to the wrong-ISA simavr default. Firmware-less analyses
# (lint, report, DRC) work. If an stm32h7 descriptor lands later, switch this
# to its renode:<part> string.
#
# Deliberately NOT `module = true`: that flag switches the binder's role parser
# to Arduino-Nano header names. The roles below use the standard STM32
# "p<port><bit>" convention, which the parser handles without the flag.
backend = "none:stm32h7"

[models.pins]
# Daisy Seed 2x20 header (Daisy Seed datasheet v1.0.5, Table 2 "Pin
# Functions"): physical pin -> STM32H750 port pin, with the datasheet's Daisy
# pin name (D<n> digital / A<n> analog) in the comment. Pins 16-21 have no MCU
# pin: they are the codec's analog audio path and its supplies. The H750's
# BOOT pin stays on-module (the BOOT button drives the DFU flow), so this
# entry carries no [models.straps]; that absence is deliberate.
"1"  = "pb12"          # D0 (also USB_HS_ID)
"2"  = "pc11"          # D1, SDMMC1_D3
"3"  = "pc10"          # D2, SDMMC1_D2
"4"  = "pc9"           # D3, SDMMC1_D1
"5"  = "pc8"           # D4, SDMMC1_D0
"6"  = "pd2"           # D5, SDMMC1_CMD
"7"  = "pc12"          # D6, SDMMC1_CK
"8"  = "pg10"          # D7, SPI1_NSS
"9"  = "pg11"          # D8, SPI1_SCK
"10" = "pb4"           # D9, SPI1_MISO
"11" = "pb5"           # D10, SPI1_MOSI
"12" = "pb8_i2c1_scl"  # D11
"13" = "pb9_i2c1_sda"  # D12
"14" = "pb6_usart1_tx" # D13
"15" = "pb7_usart1_rx" # D14
"16" = "audio_in_l"    # codec analog in, no MCU pin
"17" = "audio_in_r"
"18" = "audio_out_l"
"19" = "audio_out_r"
"20" = "agnd"
"21" = "3v3a"          # analog 3V3 out
"22" = "pc0_adc0"      # A0 / D15
"23" = "pa3_adc1"      # A1 / D16
"24" = "pb1_adc2"      # A2 / D17 (3.3 V-only pin; most GPIO are 5 V tolerant)
"25" = "pa7_adc3"      # A3 / D18 (3.3 V-only)
"26" = "pa6_adc4"      # A4 / D19
"27" = "pc1_adc5"      # A5 / D20
"28" = "pc4_adc6"      # A6 / D21 (3.3 V-only)
"29" = "pa5_adc7"      # A7 / D22, DAC1_OUT2 (3.3 V-only)
"30" = "pa4_adc8"      # A8 / D23, DAC1_OUT1 (3.3 V-only)
"31" = "pa1_adc9"      # A9 / D24, SAI2_MCLK_B
"32" = "pa0_adc10"     # A10 / D25, SAI2_SD_B
"33" = "pd11"          # D26, SAI2_SD_A
"34" = "pg9"           # D27, SAI2_FS_B
"35" = "pa2_adc11"     # A11 / D28, SAI2_SCK_B
"36" = "pb14"          # D29, USB_HS_D-
"37" = "pb15"          # D30, USB_HS_D+
"38" = "3v3d"          # digital 3V3 out
"39" = "vin"           # +4 to +17 V in (datasheet Table 1)
"40" = "gnd"           # DGND

# ─────────────────────────────────────────────────────────────────────────────
# AVR: documented NONE. The ATmega328P (and the classic 8-bit AVR line) has no
# boot strapping pin. Boot behaviour is chosen by the BOOTRST/BOOTSZ fuse bits
# (non-volatile, set at programming time), not by a pin level sampled at reset.
# RESET is a reset input, not a boot-mode strap. So the atmega328p / arduino_nano
# entries above carry no `[models.straps]`, and the strap lint correctly never
# examines them. Ref: ATmega328P datasheet (Rev. DS40002061B), sec "Boot Loader
# Support" (BOOTRST fuse) and sec "System Control and Reset". This is recorded
# so the absence is deliberate, not an oversight.

# ─────────────────────────────────────────────────────────────────────────────
# EFM32PG22: Silicon Labs Pearl Gecko 22, Cortex-M33, QFN-40.
#
# Source: Silicon Labs "EFM32PG22 Gecko MCU Family Data Sheet", Rev 1.4 (2024):
#   Table 6.2 (QFN40 pin allocation, which Table 6.3 note 2 confirms applies to the
#   EFM32PG22C200F512IM40 ordering code specifically), Table 4.17 (GPIO DC
#   characteristics) and the Absolute Maximum Ratings table.
#
# NO CO-SIM BACKEND EXISTS FOR THIS PART, and the entry is here anyway. The same
# reasoning as the Daisy Seed above: nothing in hauksbee-mcu models an EFM32, and
# the engine's family router does not route one, so the alternative to this entry is
# not "a board that runs firmware" but "a board whose only MCU is reported as an
# unresolved open circuit". Leaving it unresolved costs the whole structural
# analysis: no supply-rail stress watch on the MCU's four supply pads, no pin roles
# for the straps and bus lints to read, and a bind report that cannot say what the
# board's processor is. The explicit `none:` token is what makes the honesty work:
# the scheduler refuses loudly and by name if firmware is handed to it, instead of
# falling through to the AVR default and running ARM firmware on an 8-bit core.
#
# So: firmware-less analyses (lint, report, DRC, the static checks) work on a board
# built around this part. Co-sim does not, and says so. If an EFM32 platform lands
# in hauksbee-mcu, this becomes its `renode:<part>` string and nothing else changes.
#
# THE PIN ROLES ARE HONEST ABOUT WHAT THEY KNOW. The 26 GPIOs carry
# `p<port><bit>` names, which is the convention `gpio_of_role` parses, so the binder
# can stamp drivers on them the moment a backend exists and the strap/bus lints can
# read them now. What they do NOT carry is any claim about which peripheral is on
# which pin: on this family that is entirely software's choice (a full crossbar), so
# a role like "pa05_i2c0_sda" would be a guess about firmware, not a fact about
# silicon. The four supply domains are named separately (DVDD, AVDD, IOVDD,
# VREGVDD) because they are separately bounded and a board may feed them differently.
#
# Datasheet figures used:
#   DVDD / AVDD / IOVDD = 1.71 V min, 3.0 V typ, 3.8 V max
#   VREGVDD             = 1.8 to 2.2 V min (mode dependent) to 3.8 V max
#   GPIO VIL max = 0.3 x IOVDD, VIH min = 0.7 x IOVDD  (explicitly proportional to
#                  IOVDD; the RESETn thresholds are the same ratios of DVDD)
#   GPIO VOH min = 0.8 x IOVDD at 20 mA, 0.6 x IOVDD at 8 mA and 1.71 V
#   GPIO VOL max = 0.2 x IOVDD at 20 mA, 0.4 x IOVDD at 8 mA
#   Abs max: -0.3 to 3.8 V on any supply pin; 50 mA sink and 50 mA source per GPIO;
#            200 mA sink and 200 mA source aggregate across all pins
#
# THE 3.8 V CEILING IS THE POINT OF THE RATINGS BLOCK. This is a 3.8 V-max part, not
# a 5 V-tolerant or even a 6 V one like every AVR above it in this file, so a board
# that hangs it off a 5 V rail is destroying it.
#
# For that ceiling to be compared against anything, the scheduler's supply-rail
# watch has to recognise the ROLE NAMES this part's supply pads carry. Its
# allowlist was `vcc`/`avcc`/`vdd`/`vdda`/`5v`, none of which is `dvdd`, `avdd`,
# `iovdd` or `vregvdd`, so an earlier draft of this entry carried a rating that was
# compared with nothing at all: a ceiling that reads as enforced and is not. The
# allowlist is widened in the same commit. If a future entry names a supply pad
# something else again, check that list before believing its `max_voltage_v`.
#
# THE EXPOSED PAD IS TREATED AS GROUND, and neither its number nor that role comes
# from the datasheet. Being exact about what is and is not sourced here:
#   SOURCED. The pad EXISTS. The Package Dimensions note gives D2/E2 = 3.55 to
#   3.85 mm for the QFN40, which is the exposed thermal pad.
#   NOT SOURCED. Rev 1.4's pin-allocation table runs 1..40 and stops. It does not
#   number the pad, does not call it "Pin 0", and nowhere states that it is tied to
#   VSS internally or that a board must ground it. An earlier version of this
#   comment asserted a package-figure label reading "Pin 0 / VSS"; that label was
#   not found in the document and the claim is withdrawn.
# So `vss4` below rests on the QFN convention that an exposed pad is grounded, which
# is near-universal and is what the MWGEN-G1 does, NOT on Silicon Labs' text. It is
# also the safe direction to be wrong in: grounding a pad the board also grounds
# changes nothing, while a role that drove it would be a fabrication.
# The KEY is `"41"`, which is what CAD tools number it (the MWGEN-G1's footprint and
# its pin function agree). A board generated from the vendor's own headers might
# number it differently and would not match this row.
#
# DELIBERATELY NOT MODELLED: the DECOUPLE and VREGSW pins' internal networks (they
# are named and carry nothing), and the whole peripheral crossbar.
[[models]]
id = "efm32pg22"
kind = "mcu"
description = "Silicon Labs EFM32PG22 Cortex-M33 MCU, QFN-40 (structural bind only; no co-sim platform)"

[models.match]
# The ordering code is EFM32PG22<letter><flash-and-package digits>, e.g.
# EFM32PG22C200F512IM40: "C200" is the part variant, "F512" the flash size, "I" the
# temperature grade and "M40" the 40-pin QFN. The regex REQUIRES the M40 package
# code, because the family also ships a 32-pin QFN and a 5x5 QFN40 with a different
# allocation, and this map is Table 6.2's QFN40 one.
value_re = "(?i)^EFM32PG22[A-Z]?[0-9]{3}F[0-9]+[A-Z]?M40$"

[models.params]
# No emulator models an EFM32. See the long note above: the explicit `none:` token
# makes the scheduler refuse firmware by name rather than substituting a core.
backend = "none:efm32pg22"

[models.pins]
# Table 6.2, QFN40. Corroborated pad for pad by the MWGEN-G1's own pin functions,
# which is what raises this from "transcribed" to "cross-checked".
"1"  = "pc00"
"2"  = "pc01"
"3"  = "pc02"
"4"  = "pc03"
"5"  = "pc04"
"6"  = "pc05"
"7"  = "pc06"
"8"  = "pc07"
"9"  = "hfxtal_i"    # high-frequency crystal in
"10" = "hfxtal_o"    # high-frequency crystal out
"11" = "reset"       # RESETn, active low; thresholds are ratios of DVDD
"12" = "dvdd"        # digital supply
"13" = "vss"
"14" = "nc"          # not bonded
"15" = "dvdd2"       # second DVDD pad
"16" = "pb04"
"17" = "pb03"
"18" = "pb02"
"19" = "pb01"
"20" = "pb00"
"21" = "pa00"
"22" = "pa01"
"23" = "pa02"
"24" = "pa03"
"25" = "pa04"
"26" = "pa05"
"27" = "pa06"
"28" = "pa07"
"29" = "pa08"
"30" = "decouple"    # internal-regulator decoupling node; NOT a supply to feed
"31" = "vregsw"      # DCDC switching node
"32" = "vregvdd"     # DCDC input supply, its own limits (see the note)
"33" = "vregvss"
"34" = "dvdd3"       # third DVDD pad
"35" = "avdd"        # analog supply
"36" = "iovdd"       # I/O supply; every GPIO threshold is a ratio of THIS rail
"37" = "pd03"
"38" = "pd02"
"39" = "pd01"
"40" = "pd00"
# The exposed thermal pad, grounded by QFN convention rather than by anything the
# datasheet says. See the note above for exactly what is sourced and what is not,
# and why the key is 41.
"41" = "vss4"

[models.ratings]
# Absolute Maximum Ratings.
max_pin_current_a = 0.05   # 50 mA sink / 50 mA source per GPIO
max_current_a = 0.2        # 200 mA sink / 200 mA source aggregate
max_voltage_v = 3.8        # any supply pin, -0.3 to 3.8 V. NOT a 5 V part.
