[models.pin_capability.pull_up]
basis = "ESP32-C3-WROOM-02 module: pad-to-GPIO mapping from ESP32-C3-WROOM-02 & WROOM-02U Datasheet v1.7 (sha256 2375b1be75ebbfcffa050e6a26c3ee7957bc7171b319066081a491d1b2e21161) Pin Definitions table (p.11). Espressif ESP32-C3 Series Datasheet v2.4 (sha256 833fc000b4b3c3d39c496fcbd597fed5806956503ce7390b19cc8ae82f19f968) section 4.1.3.1 IO MUX and GPIO Matrix (p.36) 'All GPIOs have selectable internal pull-up or pull-down, or can be set to high impedance'; Table 2-1 Pin Overview (pp.16-17) note 5 (p.17). ESP32-C3 Technical Reference Manual v1.4 (sha256 90ef825653e7a2657dc1bb294041aace9f9b69da87d775c2f1b5bd11eb317423) section 5.4.3 (p.163) 'Set or clear IO_MUX_GPIOx_FUN_WPU and IO_MUX_GPIOx_FUN_WPD ... to enable or disable' and Register 5.21 IO_MUX_GPIOn_REG (n: 0-21) IO_MUX_GPIOn_FUN_WPU (p.187). Not listed: EN (reset) and supply pads"
[models.pin_capability.pull_up.pads]
"16" = "GPIO2: IO_MUX_GPIO2_REG FUN_WPU = 1 (internal pull-up)"
"7" = "GPIO8: IO_MUX_GPIO8_REG FUN_WPU = 1 (internal pull-up)"
"8" = "GPIO9: IO_MUX_GPIO9_REG FUN_WPU = 1 (internal pull-up)"

[models.ratings]
max_pin_current_a = 0.04
max_current_a = 0.4
# ESP32-C3-WROOM-02 Datasheet v1.7 Table 6-1 Absolute Maximum Ratings, VDD33 -0.3 to
# 3.6 V; Table 6-2 recommends 3.0-3.6 V, the same ceiling.
max_voltage_v = 3.6

# Same strap table and citations as esp32c3_mini1.
[[models.straps]]
role = "gpio9"
level = "high"
boot_select = true
internal_pull = "pull_up"   # Table 3-1: GPIO9 default weak pull-up
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO9 (BOOT) high = SPI boot (normal); low = download boot"

[[models.straps]]
role = "gpio8"
level = "high"
# ESP32-C3 Series Datasheet v2.4 Table 3-1: GPIO8 default "Floating" (no
# internal pull at reset). Table 3-3: SPI boot takes any GPIO8 level; Joint
# Download Boot (GPIO9 = 0) needs GPIO8 = 1. So a float matters only when the
# board can pull GPIO9 low.
internal_pull = "none"
only_with = "gpio9"
note = "ESP32-C3 datasheet Table 3-3: Joint Download Boot (GPIO9 low) needs GPIO8 = 1; SPI boot takes any GPIO8 level; Table 3-1: GPIO8 has no internal pull at reset"

[[models.straps]]
role = "gpio2"
level = "high"
note = "GPIO2 must be high at reset"

# Boot-mode table (BOOT STRAPS package): the pins that select the boot source, the
# vendor's table, and where each value comes from.
[models.strap_latch]
event = "chip_pu"
note  = "The strapping pins are latched at Chip Reset: the pin levels must be stable at least tSU = 0 ms before CHIP_EN is pulled high and held for tH = 3 ms (min) after CHIP_EN is high; the latched values are held until power-down"
cite  = "ESP32-C3 Series Datasheet v2.4, section 3 'Boot Configurations', Table 3-2 and Figure 3-1, PDF pp.30-31"

[models.reset_input]
