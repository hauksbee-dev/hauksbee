[models.strap_latch]
event = "chip_pu"
note  = "The strapping pins are latched at Chip Reset: the pin levels must be stable at least tSU = 0 ms before CHIP_PU is pulled high and held for tH = 3 ms (min) after CHIP_PU is high; the latched values are held until power-down"
cite  = "ESP32-S3 Series Datasheet v2.2, section 3 'Boot Configurations', Table 3-2 and Figure 3-1, PDF pp.32-33"

[models.reset_input]
role = "en"                       # CHIP_PU: esp32s3_wroom pad 3, esp32s3_qfn56 pad 4 (Table 2-1 pin 4 = CHIP_PU)
vil  = [0.25, 0.0]                # VIL_nRST max 0.25 x VDD
vih  = [0.75, 0.0]                # VIH_nRST min 0.75 x VDD
cite = "ESP32-S3 Series Datasheet v2.2, Table 5-4 'DC Characteristics (3.3 V, 25 C)', rows VIH_nRST and VIL_nRST, PDF p.65"

[[models.boot_inputs]]
role = "gpio0"
pin = "GPIO0"
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
cite = "ESP32-S3 Series Datasheet v2.2, Table 3-1 (GPIO0 Weak pull-up, 1) PDF p.32; Table 5-4 VIL/VIH PDF p.65"

[[models.boot_inputs]]
role = "gpio46"
pin = "GPIO46"
internal_pull = "pull_down"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO46 also controls ROM-message printing to UART0 (TRM Table 8.3-1)"
cite = "ESP32-S3 Series Datasheet v2.2, Table 3-1 (GPIO46 Weak pull-down, 0) PDF p.32; Table 5-4 PDF p.65"

[[models.boot_inputs]]
role = "gpio45"
pin = "GPIO45"
internal_pull = "pull_down"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO45 is not a boot-mode pin: it selects the VDD_SPI voltage. GPIO45 = 0 (default, EFUSE_VDD_SPI_FORCE = 0): VDD_SPI is 3.3 V from VDD3P3_RTC. GPIO45 = 1: VDD_SPI is 1.8 V from the Flash Voltage Regulator, so a 3.3 V flash or PSRAM on VDD_SPI is under-supplied if the board pulls GPIO45 high. EFUSE_VDD_SPI_FORCE = 1 overrides the pin"
cite = "ESP32-S3 Series Datasheet v2.2, Table 3-1 (GPIO45 Weak pull-down, 0) PDF p.32; Table 3-4 'VDD_SPI Voltage Control' PDF p.34; Table 5-4 PDF p.65"

[[models.boot_inputs]]
role = "gpio3"
pin = "GPIO3"
internal_pull = "none"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO3 is not a boot-mode pin: it selects the JTAG signal source; it has no internal pull resistors and its level must be set by the external circuit"
cite = "ESP32-S3 Series Datasheet v2.2, Table 3-1 (GPIO3 Floating) PDF p.32; section 3.4 'JTAG Signal Source Control' PDF p.34; Table 5-4 PDF p.65"

[[models.boot_inputs]]
role = "gpio1"
pin = "GPIO1"
internal_pull = "none"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "Not a strapping pin: read only by SPI Download Boot (GPIO1 = 1). Floating by default and high-impedance at reset, so its level must come from the board"
cite = "ESP32-S3 TRM v1.8 Table 8.2-1 and footnote 2, PDF p.535; ESP32-S3 Series Datasheet v2.2 Table 5-4 VIL/VIH PDF p.65"

[[models.boot_inputs]]
role = "gpio2"
pin = "GPIO2"
internal_pull = "none"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "Not a strapping pin: read only by SPI Download Boot (GPIO2 = 0). Floating by default and high-impedance at reset, so its level must come from the board"
cite = "ESP32-S3 TRM v1.8 Table 8.2-1 and footnote 2, PDF p.535; ESP32-S3 Series Datasheet v2.2 Table 5-4 VIL/VIH PDF p.65"

[[models.boot_modes]]
name = "SPI boot mode"
when = { gpio0 = "high" }          # GPIO46: any value
outcome = "user_flash"
detail = "GPIO0 = 1 (the default, weak pull-up): SPI boot, the ROM bootloader loads and executes the program from SPI flash (normally the second-stage bootloader, then the application). GPIO46 can be any value"
cite = "ESP32-S3 Series Datasheet v2.2, Table 3-3 'Chip Boot Mode Control', PDF p.33; ESP32-S3 TRM v1.8 Table 8.2-1, PDF p.535"

[[models.boot_modes]]
name = "Joint download boot mode"
when = { gpio0 = "low", gpio46 = "low" }
outcome = "rom_bootloader"
detail = "GPIO0 = 0 and GPIO46 = 0: Joint Download Boot, which supports USB Download Boot (USB-Serial-JTAG and USB-OTG) and UART Download Boot; the user firmware does not run unless it has been downloaded into SRAM"
cite = "ESP32-S3 Series Datasheet v2.2, Table 3-3 and footnote 2, PDF p.33; ESP32-S3 TRM v1.8 Table 8.2-1, PDF p.535"

[[models.boot_modes]]
name = "SPI download boot mode"
when = { gpio0 = "low", gpio46 = "high", gpio1 = "high", gpio2 = "low" }   # gpio1 and gpio2 are not strapping pins; esp32s3_qfn56 maps them (pads 6/7)
outcome = "rom_bootloader"
detail = "GPIO0 = 0, GPIO46 = 1, GPIO1 = 1, GPIO2 = 0: SPI Download Boot, download over the SPI interface into flash or SRAM. GPIO1 and GPIO2 are not strapping pins but must be reserved; they are floating by default and high-impedance at reset. Only in the TRM, not the datasheet"
cite = "ESP32-S3 TRM v1.8 Table 8.2-1 and footnote 2, PDF p.535"

[models.qemu_boot]
device = "esp32s3.gpio"
property = "strap_mode"
flash_boot = 0x04                   # QEMU's own ESP32S3_STRAP_MODE_FLASH_BOOT; straps with a defined level are overlaid on it
bits = { gpio3 = 5, gpio45 = 4, gpio0 = 3, gpio46 = 2, gpio1 = 1, gpio2 = 0 }   # bits 1:0 are 'Reserved' in TRM v1.8 p.506; positions from ESP-IDF esp32s3 boot_mode.h (SPI download 0b0110) and an Espressif QEMU ROM run
cite = "ESP32-S3 TRM v1.8 GPIO_STRAPPING bit list, PDF p.506; Espressif QEMU include/hw/gpio/esp32s3_gpio.h ESP32S3_STRAP_MODE_FLASH_BOOT 0x4. Bits 1:0 = GPIO1, GPIO2 confirmed by running the Espressif ROM in QEMU (0x06 -> SPI_DOWNLOAD_BOOT, 0x07 -> UART0_BOOT)"

[[models]]
id = "esp32s2"
kind = "mcu"
description = "Espressif ESP32-S2, package not recognised"

[models.match]
value_re = "(?i)^ESP32[-_ ]?S2([-_ ]?WROOM.*)?$"

[[models]]
id = "esp32s2_wroom"
kind = "mcu"
description = "Espressif ESP32-S2-WROOM/-WROOM-I/-WROVER module"

[models.match]
value_re = "(?i)^ESP32[-_ ]?S2([-_ ]?WROOM.*)?$"
footprint_re = '(?i)ESP32[-_]?S2[-_]?WRO(OM|VER)'

[models.pins]
# ESP32-S2-WROOM Datasheet v1.5, Table 2 "Pin Definitions": GND = 1, 3V3 = 2,
# IO0 = 3, IO45 = 39, IO46 = 40. The KiCad RF_Module:ESP32-S2-WROVER symbol
# carries the same numbering (WROVER shares the WROOM pinout).
"1"  = "vss"
"2"  = "vdd"
"3"  = "gpio0"
"39" = "gpio45"
"40" = "gpio46"

[models.pin_capability.adc]
basis = "Espressif ESP32-S2-WROOM Datasheet v1.5, Table 2 Pin Definitions (PDF p.10): the pads of [models.pins] (IO0 pad 3, IO45 pad 39, IO46 pad 40) carry no ADC channel"
[models.pin_capability.adc.pads]
[models.pin_capability.pull_up]
basis = "ESP32-S2-WROOM module: pad-to-GPIO mapping from ESP32-S2-WROOM & WROOM-I Datasheet v1.5 (sha256 ee6d88b23241323c7ea8f833ea00ff522696daf2a32a51ca8cfefb755c8d2ca7) Pin Definitions table (p.10). Espressif ESP32-S2 Series Datasheet v1.9 (sha256 7c0c54f11e79cc77b09ae070221f056e2c21a3746a8f3a23a0371c4efcf8e02d) section 4.2.1.1 GPIO (p.39) 'All GPIOs can be configured as internal pull-up or pull-down ... except for GPIO46, which is fixed to pull-down'; Table 2-1 Pin Overview (pp.13-14). ESP32-S2 Technical Reference Manual v1.3 (sha256 686f173e83212cdcdece789a72c8262c5ff164908108d31369d7326cc2159855) section 5.2.3 (p.169) 'Set or clear IO_MUX_FUN_WPU and IO_MUX_FUN_WPD ... to enable or disable pull-up and pull-down resistors' and Register 5.35 IO_MUX_n_REG IO_MUX_FUN_WPU (p.202). Not listed: pad 40 (GPIO46, input-only, fixed pull-down per ESP32-S2 datasheet p.39), EN and supply pads"
[models.pin_capability.pull_up.pads]
"3" = "GPIO0: IO_MUX_FUN_WPU = 1 in IO_MUX_GPIO0_REG (internal pull-up)"
"39" = "GPIO45: IO_MUX_FUN_WPU = 1 in IO_MUX_GPIO45_REG (internal pull-up)"

# Ref: ESP32-S2 Technical Reference Manual v1.2, Table "Strapping Pins";
# ESP32-S2 datasheet v1.4 sec 2.4.
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true   # latches SPI-vs-download boot; unrecoverable in firmware
# ESP32-S2 Datasheet v1.9, Table 5-4 "DC Characteristics (3.3 V, 25 °C)": VIL
# max 0.25 x VDD, VIH min 0.75 x VDD,
# https://www.espressif.com/sites/default/files/documentation/esp32-s2_datasheet_en.pdf
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = SPI boot (normal); low = download boot"

[[models.straps]]
role = "gpio46"
level = "low"
note = "GPIO46 must be low or floating at reset"

[[models.straps]]
role = "gpio45"
level = "defined"
note = "GPIO45 selects VDD_SPI flash voltage; must be defined"

[[models]]
id = "esp32s2_qfn56"
kind = "mcu"
description = "Espressif ESP32-S2 bare chip, QFN56 7x7 mm"

[models.match]
value_re = "(?i)^ESP32[-_ ]?S2([-_ ]?WROOM.*)?$"
footprint_re = '(?i)(^|:)V?QFN[-_]?56([-_]1EP)?[-_]7x7mm[-_]P0\.4mm'

[models.pins]
# ESP32-S2 Series Datasheet v1.9, Table 2-1 "Pin Overview": GPIO0 = 5 (powered
# by VDD3P3_RTC_IO = 27), GPIO45 = 50 and GPIO46 = 55 (powered by
# VDD3P3_CPU = 45), GND = 57 (exposed pad).
"27" = "vdd"
"57" = "vss"
"5"  = "gpio0"
"50" = "gpio45"
"55" = "gpio46"

[models.pin_capability.adc]
basis = "Espressif ESP32-S2 Datasheet v1.9, Table 2-8 Analog Functions (PDF p.21): the pads of [models.pins] (GPIO0 pad 5, GPIO45, GPIO46) carry no ADC channel (the first is pin 6 GPIO1 ADC1_CH0)"
[models.pin_capability.adc.pads]
[models.pin_capability.pull_up]
basis = "ESP32-S2 chip, QFN 7x7 56-pin: pad-to-GPIO mapping from the ESP32-S2 Series Datasheet v1.9 Table 2-1 Pin Overview (pp.13-14). Espressif ESP32-S2 Series Datasheet v1.9 (sha256 7c0c54f11e79cc77b09ae070221f056e2c21a3746a8f3a23a0371c4efcf8e02d) section 4.2.1.1 GPIO (p.39) 'All GPIOs can be configured as internal pull-up or pull-down ... except for GPIO46, which is fixed to pull-down'; Table 2-1 Pin Overview (pp.13-14). ESP32-S2 Technical Reference Manual v1.3 (sha256 686f173e83212cdcdece789a72c8262c5ff164908108d31369d7326cc2159855) section 5.2.3 (p.169) 'Set or clear IO_MUX_FUN_WPU and IO_MUX_FUN_WPD ... to enable or disable pull-up and pull-down resistors' and Register 5.35 IO_MUX_n_REG IO_MUX_FUN_WPU (p.202). Not listed: pad 55 (GPIO46, input-only, fixed pull-down per datasheet p.39), CHIP_PU and supply pads"
[models.pin_capability.pull_up.pads]
"5" = "GPIO0: IO_MUX_FUN_WPU = 1 in IO_MUX_GPIO0_REG (internal pull-up)"
"50" = "GPIO45: IO_MUX_FUN_WPU = 1 in IO_MUX_GPIO45_REG (internal pull-up)"

# Same strap table and citations as esp32s2_wroom.
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = SPI boot (normal); low = download boot"

[[models.straps]]
role = "gpio46"
level = "low"
note = "GPIO46 must be low or floating at reset"

[[models.straps]]
role = "gpio45"
level = "defined"
note = "GPIO45 selects VDD_SPI flash voltage; must be defined"

# ─────────────────────────────────────────────────────────────────────────────

# ESP32-C3, package unknown: identity only (see the family note).
[[models]]
id = "esp32c3"
kind = "mcu"
description = "Espressif ESP32-C3 (RISC-V RV32IMC), package not recognised"

[models.match]
# The bare chip also carries its ordering code (ESP32-C3 Series Datasheet v2.4,
# Table 1-1 Series Comparison: ESP32-C3FN4, -C3FH4, -C3FH4AZ, -C3FH4X, -C3FH8X).
value_re = "(?i)^ESP32[-_ ]?C3(F[NH][48](AZ|X)?|[-_ ]?(WROOM|MINI).*)?$"

[models.params]
backend = "qemu:esp32c3"

[models.ratings]
max_pin_current_a = 0.04
max_current_a = 0.4
# ESP32-C3 Series Datasheet v2.4 Table 5-1 Absolute Maximum Ratings, input power pins
# -0.3 to 3.6 V; Table 5-2 recommends 3.0-3.6 V, the same ceiling.
max_voltage_v = 3.6

[[models]]
id = "esp32c3_mini1"
kind = "mcu"
description = "Espressif ESP32-C3-MINI-1/-1U module"

[models.match]
value_re = "(?i)^ESP32[-_ ]?C3([-_ ]?(WROOM|MINI).*)?$"
footprint_re = '(?i)ESP32[-_]?C3[-_]?MINI[-_]?1'

[models.params]
backend = "qemu:esp32c3"

[models.pins]
# ESP32-C3-MINI-1/-1U Datasheet v2.2, Table 3-1 "Pin Definitions": GND = 1, 2
# (and 11, 14, 36-53), 3V3 = 3, IO2 = 5, IO4 = 18, IO8 = 22, IO9 = 23,
# RXD0/GPIO20 = 30, TXD0/GPIO21 = 31. The QEMU C3 demo board uses this real
# numbering; strap and demo roles share the flat GPIO space in the binder.
# (Pad 2 was mapped as vdd before; it is GND.)
"1"  = "vss"
"3"  = "vdd"
"5"  = "gpio2"      # strap; the demo board's LED output
"18" = "p04"        # GPIO4 (demo board blink)
"22" = "gpio8"      # strap
"23" = "gpio9"      # strap (BOOT)
"31" = "p021_txd"   # TXD0 on GPIO21
"30" = "p020_rxd"   # RXD0 on GPIO20

[models.pin_capability.adc]
basis = "Espressif ESP32-C3-MINI-1 Datasheet v2.2, Table 3-1 Pin Definitions (PDF p.11): IO2 pad 5 ADC1_CH2, IO4 pad 18 ADC1_CH4; IO8, IO9, IO20, IO21 carry none"
[models.pin_capability.adc.pads]
"5" = "ADC1_CH2"
"18" = "ADC1_CH4"
[models.pin_capability.pull_up]
basis = "ESP32-C3-MINI-1 module: pad-to-GPIO mapping from ESP32-C3-MINI-1 & MINI-1U Datasheet v2.2 (sha256 de7361381348d82a1abd337f10170be7a420675987568f71fe3c5b100deed270) Pin Definitions table (p.11). Espressif ESP32-C3 Series Datasheet v2.4 (sha256 833fc000b4b3c3d39c496fcbd597fed5806956503ce7390b19cc8ae82f19f968) section 4.1.3.1 IO MUX and GPIO Matrix (p.36) 'All GPIOs have selectable internal pull-up or pull-down, or can be set to high impedance'; Table 2-1 Pin Overview (pp.16-17) note 5 (p.17). ESP32-C3 Technical Reference Manual v1.4 (sha256 90ef825653e7a2657dc1bb294041aace9f9b69da87d775c2f1b5bd11eb317423) section 5.4.3 (p.163) 'Set or clear IO_MUX_GPIOx_FUN_WPU and IO_MUX_GPIOx_FUN_WPD ... to enable or disable' and Register 5.21 IO_MUX_GPIOn_REG (n: 0-21) IO_MUX_GPIOn_FUN_WPU (p.187). Not listed: EN (reset) and supply pads; USB D+/D- (GPIO18/19) are not in the card"
[models.pin_capability.pull_up.pads]
"5" = "GPIO2: IO_MUX_GPIO2_REG FUN_WPU = 1 (internal pull-up)"
"18" = "GPIO4: IO_MUX_GPIO4_REG FUN_WPU = 1 (internal pull-up)"
"22" = "GPIO8: IO_MUX_GPIO8_REG FUN_WPU = 1 (internal pull-up)"
"23" = "GPIO9: IO_MUX_GPIO9_REG FUN_WPU = 1 (internal pull-up)"
"31" = "GPIO21: IO_MUX_GPIO21_REG FUN_WPU = 1 (internal pull-up)"
"30" = "GPIO20: IO_MUX_GPIO20_REG FUN_WPU = 1 (internal pull-up)"

[models.ratings]
max_pin_current_a = 0.04
max_current_a = 0.4
# ESP32-C3-MINI-1 Datasheet v2.2 Table 6-1 Absolute Maximum Ratings, VDD33 -0.3 to
# 3.6 V; Table 6-2 recommends 3.0-3.6 V, the same ceiling.
max_voltage_v = 3.6

# Ref: ESP32-C3 Technical Reference Manual v1.1, Table 2-8 "Strapping Pins";
# ESP32-C3 datasheet v1.5 sec 2.4. GPIO9 is the C3's "BOOT" pin (the GPIO0
# equivalent): high = SPI boot (normal), low = download. GPIO8 must be high at
# reset only for Joint Download Boot (GPIO9 low); GPIO2 is recommended high.
[[models.straps]]
role = "gpio9"
level = "high"
boot_select = true   # the C3 BOOT pin; latches SPI-vs-download boot
internal_pull = "pull_up"   # Table 3-1: GPIO9 default weak pull-up
# ESP32-C3 Datasheet v2.4, Table 5-4 "DC Characteristics (3.3 V, 25 °C)": VIL
# max 0.25 x VDD, VIH min 0.75 x VDD,
# https://www.espressif.com/sites/default/files/documentation/esp32-c3_datasheet_en.pdf
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO9 (BOOT) high = SPI boot (normal); low = download boot"

[[models.straps]]
role = "gpio8"
level = "high"
# ESP32-C3 Series Datasheet v2.4 Table 3-1: GPIO8 default "Floating" (no
# internal pull at reset). Table 3-3: SPI boot takes any GPIO8 level; Joint
# Download Boot (GPIO9 = 0) needs GPIO8 = 1. So a float matters only when the
# board can pull GPIO9 low.
internal_pull = "none"
only_with = "gpio9"
note = "ESP32-C3 datasheet Table 3-3: Joint Download Boot (GPIO9 low) needs GPIO8 = 1; SPI boot takes any GPIO8 level; Table 3-1: GPIO8 has no internal pull at reset"

[[models.straps]]
role = "gpio2"
level = "high"
note = "GPIO2 must be high at reset"

# Boot-mode table (BOOT STRAPS package): the pins that select the boot source, the
# vendor's table, and where each value comes from.
[models.strap_latch]
event = "chip_pu"
note  = "The strapping pins are latched at Chip Reset: the pin levels must be stable at least tSU = 0 ms before CHIP_EN is pulled high and held for tH = 3 ms (min) after CHIP_EN is high; the latched values are held until power-down"
cite  = "ESP32-C3 Series Datasheet v2.4, section 3 'Boot Configurations', Table 3-2 and Figure 3-1, PDF pp.30-31"

[models.reset_input]
role = "en"                       # CHIP_EN: QFN32 pad 7; NO C3 card has this role yet
vil  = [0.25, 0.0]                # VIL_nRST max 0.25 x VDD
vih  = [0.75, 0.0]                # VIH_nRST min 0.75 x VDD
cite = "ESP32-C3 Series Datasheet v2.4, Table 5-4 'DC Characteristics (3.3 V, 25 C)', rows VIH_nRST and VIL_nRST, PDF p.55"

[[models.boot_inputs]]
role = "gpio9"
pin = "GPIO9"
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
cite = "ESP32-C3 Series Datasheet v2.4, Table 3-1 (GPIO9 Weak pull-up, 1) PDF p.30; Table 5-4 VIL/VIH PDF p.55"

[[models.boot_inputs]]
role = "gpio8"
pin = "GPIO8"
internal_pull = "none"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO8 also controls ROM-message printing to UART0 (Table 3-4); it is floating by default"
cite = "ESP32-C3 Series Datasheet v2.4, Table 3-1 (GPIO8 Floating) PDF p.30; Table 3-4 PDF p.32; Table 5-4 PDF p.55"

[[models.boot_inputs]]
role = "gpio2"
pin = "GPIO2"
internal_pull = "none"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "Datasheet footnote: GPIO2 does not determine SPI Boot or Joint Download Boot, but it is recommended to pull it up due to glitches. The TRM makes GPIO2 matter only for SPI Download Boot (GPIO2 = 1)"
cite = "ESP32-C3 Series Datasheet v2.4, Table 3-1 (GPIO2 Floating) PDF p.30 and Table 3-3 footnote 2 PDF p.31; Table 5-4 PDF p.55"

[[models.boot_inputs]]
role = "gpio3"                     # no C3 card has this role yet (QFN32 pad 8)
pin = "GPIO3"
internal_pull = "none"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "Only used by SPI Download Boot; GPIO3 and GPIO2 are floating by default and high-impedance at reset"
cite = "ESP32-C3 TRM v1.4, Table 7.2-1 footnote 3, PDF p.199; ESP32-C3 Series Datasheet v2.4 Table 5-4 PDF p.55"

[[models.boot_modes]]
name = "SPI boot mode"
when = { gpio9 = "high" }          # GPIO8 any value; GPIO2 and GPIO3 do not matter
outcome = "user_flash"
detail = "GPIO9 = 1 (the default, weak pull-up): SPI boot, the ROM bootloader loads and executes the program from SPI flash. GPIO8 can be any value"
cite = "ESP32-C3 Series Datasheet v2.4, Table 3-3 PDF p.31; ESP32-C3 TRM v1.4 Table 7.2-1, PDF p.199"

[[models.boot_modes]]
name = "Joint download boot mode"
when = { gpio9 = "low", gpio8 = "high" }
outcome = "rom_bootloader"
detail = "GPIO9 = 0 and GPIO8 = 1: Joint Download Boot, which supports USB-Serial-JTAG Download Boot and UART Download Boot; the user firmware does not run unless downloaded into SRAM. The datasheet row also shows GPIO2 = 1, but its footnote says GPIO2 does not determine this mode and the TRM marks it as a don't-care"
cite = "ESP32-C3 Series Datasheet v2.4, Table 3-3 and footnote 2, PDF p.31; ESP32-C3 TRM v1.4 Table 7.2-1, PDF p.199"

[[models.boot_modes]]
name = "SPI download boot mode"
when = { gpio9 = "low", gpio8 = "low", gpio3 = "low", gpio2 = "high" }    # needs a gpio3 role on the card
outcome = "rom_bootloader"
detail = "GPIO9 = 0, GPIO8 = 0, GPIO3 = 0, GPIO2 = 1: SPI Download Boot, download over the SPI interface into flash or SRAM. GPIO3 and GPIO2 must be reserved for it. Only in the TRM, not the datasheet"
cite = "ESP32-C3 TRM v1.4 Table 7.2-1 and footnote 3, PDF p.199"

[[models.boot_modes]]
name = "Invalid combination"
when = { gpio9 = "low", gpio8 = "low", gpio2 = "low" }                    # GPIO3: don't care
outcome = "undefined"
detail = "GPIO9 = 0, GPIO8 = 0, GPIO2 = 0: the TRM calls this an Invalid Combination that can trigger unexpected behaviour and should be avoided. Row order: it sits after SPI Download so GPIO3/GPIO2 = (0,1) matches the download row first"
cite = "ESP32-C3 TRM v1.4 Table 7.2-1 and footnote 4, PDF p.199"

[models.qemu_boot]
device = "esp32c3.gpio"
property = "strap_mode"
flash_boot = 0x08                   # QEMU's own ESP32C3_STRAP_MODE_FLASH_BOOT; straps with a defined level are overlaid on it
bits = { gpio9 = 3, gpio8 = 2, gpio3 = 1, gpio2 = 0 }   # TRM v1.4 p.181 lists bits 0, 2, 3 only; bit 1 = GPIO3 rests on an Espressif QEMU ROM run, unconfirmed by any Espressif document
cite = "ESP32-C3 TRM v1.4 GPIO_STRAPPING bit list, PDF p.181; Espressif QEMU include/hw/gpio/esp32c3_gpio.h (FLASH_BOOT 0x8, UART_BOOT 0x2, USB_BOOT 0x0). ROM run in QEMU: 0x01 -> SPI_DOWNLOAD_BOOT, 0x04..0x07 -> DOWNLOAD(USB/UART0/1), 0x08..0x0f -> SPI_FAST_FLASH_BOOT"

# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   ESP32-C3-MINI-1 Datasheet v2.2 (https://www.espressif.com/sites/default/files/documentation/esp32-c3-mini-1_datasheet_en.pdf) sha256 de7361381348d82a1abd337f10170be7a420675987568f71fe3c5b100deed270;
#   ESP32-C3 Technical Reference Manual v1.4 (https://www.espressif.com/sites/default/files/documentation/esp32-c3_technical_reference_manual_en.pdf) sha256 90ef825653e7a2657dc1bb294041aace9f9b69da87d775c2f1b5bd11eb317423.
[[models.pin_bias]]
role = "p020_rxd"
level = "high"
needs = "idle"
opposed_only = true
basis = "ESP32-C3-MINI-1 Datasheet v2.2 PDF p.14 (section 3.1 Chip Boot Mode Control): \"In Joint Download Boot mode, users can download binary files into flash using UART0 or USB interface.\"; PDF p.34 (section 9 Peripheral Schematics, note): \"UART0 is used to download firmware and log output.\"; PDF p.11 Table 3 Pin Definitions: \"RXD0 30 I/O/T GPIO20, U0RXD\"; ESP32-C3 TRM v1.4 PDF p.555 (UART chapter, 26.4.4 UART Data Frame): \"The START bit is logical low, whereas STOP bits are logical high.\"; same page: \"The receiver can also detect the Break conditions when the RX data line remains logical low for one NULL character transmission\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

[[models]]
id = "esp32c3_wroom02"
kind = "mcu"
description = "Espressif ESP32-C3-WROOM-02/-02U module"

[models.match]
