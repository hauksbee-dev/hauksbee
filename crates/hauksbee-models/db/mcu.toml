# Atmel ATmega16U4/32U4 datasheet 7766J (04/2016), section 24 (ADC) and section 29 Table 29-7 (ADC Characteristics). Printed page numbers. The ADHSM bit allows a higher ADC clock at the expense of power, and the datasheet gives no upper clock limit in Table 29-7, so none is recorded.
[models.peripherals.adc]
source = "https://ww1.microchip.com/downloads/en/DeviceDoc/Atmel-7766-8-bit-AVR-ATmega16U4-32U4_Datasheet.pdf"
source_sha256 = "8e8c81dd4119062397bc08d677e7033d7abb4292628414c4e6e0a234cc53203a"
