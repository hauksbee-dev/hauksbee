# at90usb162 is the nearest relative, but binding the board to it would be a
# silent substitution (`detect_substitution` returns None for simavr by design),
# so co-sim is declared unavailable and refused loudly, as for the Daisy Seed.
# Lint, DRC, envelope and rating checks still read the pad map below.
