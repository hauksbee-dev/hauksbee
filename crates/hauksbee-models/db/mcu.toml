# ─────────────────────────────────────────────────────────────────────────────
# ATmega1284P: the 128 KB / 16 KB-SRAM megaX4-line AVR, 44-lead TQFP and 44-pad
# VQFN/QFN(MLF), which share one pinout.
#
# Source: Atmel/Microchip "ATmega1284P DATASHEET COMPLETE",
#   Atmel-42719C-ATmega1284P_Datasheet_Complete-10/2016, the 44-pad figure in
#   section 5.1.2 (titled "TQFN and QFN"; the figure itself is the shared
#   TQFP/QFN/MLF pinout) and Table 29-1 "Absolute Maximum Ratings".
#
# WHY IT NEEDS ITS OWN ENTRY AND CANNOT BORROW THE 328P's. Different port count
# (A/B/C/D vs B/C/D), different pad count, and a completely different pad order:
# pad 1 is MOSI here and PC6/RESET on a 328P. Binding a 1284P board through the
# 328P map would wire the SPI bus to the reset pin.
#
# THE VALUE STRINGS THIS MATCHES are wider than the marketing part number
# because CAD libraries spell the package into the device name. Eagle's Atmel
# library calls the 44-pad MLF part "ATMEGA1284M" (the trailing letter is
# Eagle's package code: M = MLF, AU/A = TQFP, P = PDIP), and a board that fits
# the QFN44 carries exactly that string in its value field.
#
# THE NON-P ATmega1284 GETS ITS OWN ENTRY, immediately below, rather than sharing
# this one. It is a distinct simavr core, and there is no mechanism that would tell
# a user their non-P part had been run on a P core: `detect_substitution` returns
# None for every `simavr:` backend by design, because simavr models the part it is
# asked for. So a shared entry would have been a silent substitution wearing a
# comment that promised a warning. The two entries differ in exactly one line.
#
# DELIBERATELY NOT MODELLED: everything the co-sim does not read off the pad
# map. The JTAG pins (PC2-PC5) carry their port role and nothing else, the
# second USART is not distinguished from the first at this layer. The core
# clock is the firmware's fuses, else the crystal bound to the board, else this
# card's `default_clock_hz` (the 8 MHz RC), the last disclosed as a guess.
[[models]]
id = "atmega1284p"
kind = "mcu"
description = "ATmega1284P 8-bit AVR MCU, 44-lead TQFP or 44-pad VQFN/MLF"

[models.match]
# Two families of spelling bind here, and the second needs its reasoning written
# down because it is the weaker discriminator:
#
#   1. The part number with its `P`, optionally plus a HYPHENATED ordering code:
#      "ATmega1284P", "ATmega1284P-AU", "ATmega1284P-MUR".
#   2. A CAD library's device name, which is the part with an UNHYPHENATED package
#      letter appended: "ATMEGA1284M" (Eagle's MLF44 device, and the margay
#      datalogger's U1) and "ATMEGA1284A" (its TQFP one).
#
# Form 2 does not say P or non-P, so binding it here is a choice. Two things back
# it. Atmel's own ordering codes ALWAYS hyphenate the package (-AU, -MU, -PU), so
# an unhyphenated trailing letter cannot be an ordering code and is a library's
# device name; and the board that produced this spelling carries an MPN attribute
# reading "ATMEGA1284P-MUR", which the matcher prefers over the value field, so on
# that board the P is not a guess at all. On a board that gives no MPN it is one,
# and the cost of being wrong is small: the two cores share this pinout and differ
# in picoPower sleep behaviour and fuse defaults, not in anything here.
#
# The BARE "ATmega1284" and its hyphenated codes belong to the entry below.
#
# `PU` IS DELIBERATELY ABSENT FROM THE PACKAGE CODES, and it used to be present.
# Atmel-42719C Section 3 Ordering Information maps the codes to packages:
# ATmega1284P-AU and -AUR are `44A` (44-lead TQFP), -MU and -MUR are the 44-pad
# VQFN, and ATmega1284P-PU is `40P6`, which the same table's package list spells out
# as "40-pin, 0.600in Wide, Plastic Dual Inline Package (PDIP)".
#
# A PDIP part is a DIFFERENT PINOUT, not a different body for the same one. Table 6-1
# gives the 40-pin numbering beside the small-package one, and they do not line up
# anywhere: PDIP pin 10 is VCC, 11 is GND, 14 is PD0/RxD0 and 15 is PD1/TxD0, while
# the map below (the 44-pad one) has pad 10 as PD1/TXD0 and pad 11 as PD2/RXD1. So a
# board fitting the PDIP part and writing its ordering code got the MCU's UART
# TRANSMIT pin bound onto the board's VCC net, with a driven output stamped on a
# power rail and nothing warning, because every pad the binder wanted was present.
#
# There is no 40-pin map in this library, so the honest answer for a PDIP board is
# that nothing resolves and the part is disclosed as open. When someone adds the
# 40-pin allocation it wants its own entry keyed on `PU`, not a widened regex here.
value_re = "(?i)^ATmega1284(P([-_]?(AU|MU|AUR|MUR))?|M|A)$"

[models.params]
# Crystal load capacitors: ATmega1284P datasheet, Table 10-3 "Low Power Crystal Oscillator Operating
# Modes" and Table 10-5 "Full Swing Crystal Oscillator operating modes" (PDF pp. 45-46): recommended
# range for capacitors C1 and C2, 12-22 pF.
xtal_cap_min_f = 12.0e-12
xtal_cap_max_f = 22.0e-12
# hauksbee-mcu backend identifier. simavr models `atmega1284` and `atmega1284p` as
# distinct cores and this entry names the P.
backend = "simavr:atmega1284p"
internal_clock = "internal 8 MHz RC oscillator"
default_clock_hz = 8000000

[models.pins]
# Section 5.1.2, 44-pad TQFP/VQFN. Cross-checked against the margay
# datalogger's own net names, which agree pad for pad (pad 4 RST, pads 5/17/38
# on the 3V3 rail, pads 6/18/28/39 on GND, pads 7/8 on the crystal, pad 27
# AVCC, pad 29 AREF).
"1"  = "pb5_mosi"
"2"  = "pb6_miso"
"3"  = "pb7_sck"
"4"  = "reset"
"5"  = "vcc"
"6"  = "gnd"
"7"  = "xtal2"
"8"  = "xtal1"
"9"  = "pd0_rxd0"
"10" = "pd1_txd0"
"11" = "pd2_rxd1_int0"
"12" = "pd3_txd1_int1"
"13" = "pd4_xck1_oc1b"
"14" = "pd5_oc1a"
"15" = "pd6_oc2b_icp1"
"16" = "pd7_oc2a"
"17" = "vcc2"
"18" = "gnd2"
"19" = "pc0_scl"
"20" = "pc1_sda"
"21" = "pc2_tck"
"22" = "pc3_tms"
"23" = "pc4_tdo"
"24" = "pc5_tdi"
"25" = "pc6_tosc1"
"26" = "pc7_tosc2"
"27" = "avcc"
"28" = "gnd3"
"29" = "aref"
"30" = "pa7_adc7"
"31" = "pa6_adc6"
"32" = "pa5_adc5"
"33" = "pa4_adc4"
"34" = "pa3_adc3"
"35" = "pa2_adc2"
"36" = "pa1_adc1"
"37" = "pa0_adc0"
