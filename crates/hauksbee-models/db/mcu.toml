# ATmega48A/PA/88A/PA/168A/PA/328/P Data Sheet Complete DS40002061B (2020): sec. 1.1.5 p.13
# (PC6/RESET: low longer than the minimum pulse resets; with RSTDISBL unprogrammed, the factory
