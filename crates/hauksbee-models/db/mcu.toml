# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "rp2040"
kind = "mcu"
description = "Raspberry Pi RP2040 (Cortex-M0+ dual). QSPI_SS is the BOOTSEL strap."

[models.match]
value_re = "(?i)^RP2040(?:[-_ ]?QFN[-_ ]?56)?$"

[models.params]
# RP2040 co-sim runs on the renode:rp2040 descriptor in hauksbee-mcu. Renode
# ships no rp2040 platform, so the descriptor carries its own: the peripheral
# models are vendored C# compiled by Renode at run time through the support-bundle
# mechanism (db/mcu/rp2040/, src/renode/support.rs). Stock pico-sdk firmware boots
# through the real boot ROM into main().
#
# Proven end-to-end on a live machine: GPIO out/direction through the SIO
# (two-sided), UART0 TX, timers/clocks/resets as far as the SDK booting and
# sleep_ms costing the right virtual time, ADC injection on inputs 0..3, and the
# I2C bus-slave bridge on i2c0/i2c1 in both directions.
#
# Not available, and refused loudly rather than faked: SPI bus-slave (the
# vendored PL022 never invokes a registered slave), PIO (upstream models it on an
# x86-64-only native library), ADC input 4 (the on-die temperature sensor is not
# an external node, so it takes the merged policy's once-per-channel drop). The
# second core is declared and un-halted with the SIO genuinely shared, but no
# two-core firmware has been run. Full tier list: db/mcu/rp2040.soc.toml.
backend = "renode:rp2040"
internal_clock = "internal ring oscillator (ROSC)"

[models.pins]
# RP2040 QFN-56 (KiCad MCU_RaspberryPi_and_Boards:RP2040). The boot strap is
# QSPI_SS (pad 56): at reset the boot ROM samples it; pulled high (the flash
# chip-select idles high) = boot from QSPI flash (normal), held low = USB
# BOOTSEL mass-storage. The BOOTSEL button shorts it low through a series R.
# Pad 56 = QSPI_SS verified vs rp2040_minimal and SparkFun Thing Plus RP2040.
"56" = "qspi_ss"
# Pad 26 = RUN (RP2040 datasheet build 3184e62-clean 2025-02-20, Table 619 Miscellaneous pins, datasheet p.613: RUN,
# number 26, Digital In (FT), IOVDD domain, reset state Pull-Up, "Chip enable / reset"), the same pad as the
# rp2040_qfn56 map below. The identity entry maps only the two pads it needs for straps.
"26" = "run"
[models.pin_capability.pull_up]
basis = "Raspberry Pi RP2040 Datasheet (build-version 3184e62-clean, build-date 2025-02-20, sha256 be56fbb75ba0ae9e26558a73c93ac3e75c2ad4e6878d3b6703de2a76d886ea8c): Table 614 Pin Types (p.612) 'Digital IO ... Programmable Pull-Up, Pull-Down'; Table 615 GPIO pins (pp.612-613) all GPIO0-GPIO29 Digital IO; section 2.19 PADS_BANK0 GPIO0-GPIO29 registers (Table 341, pp.301-302) bit 3 PUE 'Pull up enable'; Table 625 Digital IO (pp.615-616) RPU Pull-Up Resistance 50-80 kOhm. QSPI pins: Table 616 (p.613), PADS_QSPI Tables 344-348 (pp.303-304) with PUE. Not listed: RUN (fixed reset pull-up, no pad register, Table 619)"
[models.pin_capability.pull_up.pads]
"56" = "PADS_QSPI GPIO_QSPI_SS PUE (bit 3, Tables 346-348)"

# RP2040 Datasheet (build 3184e62, 2025-02-20). Printed page numbers (PDF page = printed + 1). The PL011 states no receiver tolerance table, so none is recorded.
[models.peripherals.uart]
source = "https://datasheets.raspberrypi.com/rp2040/rp2040-datasheet.pdf"
source_sha256 = "be56fbb75ba0ae9e26558a73c93ac3e75c2ad4e6878d3b6703de2a76d886ea8c"
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20), section 4.2 UART: introduction (p.418), section 4.2.3.1 clock signals (p.420), section 4.2.3.2.1 (p.421); section 2.15.3.1 Table 205 (p.183)"

[[models.peripherals.uart.clock_sources]]
name = "clk_peri (UARTCLK)"
max_hz = 133000000.0
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) Table 205 (p.183): clk_peri nominal 12 - 125 MHz, and the note that clk_sys (and clk_peri) have a maximum frequency of 133 MHz across all process, voltage and temperature variations; section 4.2.3.1 (p.420): FUARTCLK must be no more than 5/3 times FPCLK"

[models.peripherals.uart.baud]
formula = "Baud Rate Divisor = UARTCLK / (16 * Baud Rate) = UARTIBRD (16-bit integer) + UARTFBRD (6-bit fraction) / 64"
divisor_offset = 0.0
fraction_bits = 6
register_bits = 22
oversampling = [16]
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) section 4.2.3.2.1 Fractional baud rate divider (p.421): a 22-bit divisor of a 16-bit integer and a 6-bit fractional part; section 4.2.3.1 (p.420): FUARTCLK(min) >= 16 x baud(max)"

[[models.peripherals.uart.max_baud]]
oversampling = 16
baud_hz = 7800000.0
condition = "UARTCLK = 125 MHz (UARTCLK / 16, UART mode)"
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) section 4.2.1 Overview (p.418): 'Supports a maximum baud rate of UARTCLK / 16 in UART mode (7.8 Mbaud at 125MHz)'"

# RP2040 Datasheet (build 3184e62, 2025-02-20). Printed page numbers. No prescaler or selectable sample time is stated, so none is recorded.
[models.peripherals.adc]
source = "https://datasheets.raspberrypi.com/rp2040/rp2040-datasheet.pdf"
source_sha256 = "be56fbb75ba0ae9e26558a73c93ac3e75c2ad4e6878d3b6703de2a76d886ea8c"
resolution_bits = [12]
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20), section 4.9 ADC and Temperature Sensor: overview (p.557), section 4.9.2 (p.559), section 4.9.3 Table 566 (p.562); Table 205 (p.183); Table 627 (p.616)"

[models.peripherals.adc.clock]
source = "clk_adc, an independent clock with no prescaler in the ADC block"
required_hz = 48000000.0
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) Table 205 (p.183): clk_adc 'ADC reference clock. Must be 48MHz.'; section 4.9 overview (p.557): 500ksps using an independent 48MHz clock"

[[models.peripherals.adc.conversions]]
mode = "normal"
resolution_bits = 12
total_cycles = 96.0
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) section 4.9.2 (p.559): 96 cycles of clk_adc per conversion (96 x 1/48MHz = 2 us per sample); CS.READY goes high after 96 cycles"

[[models.peripherals.adc.max_sample_rate]]
resolution_bits = 12
max_hz = 500000.0
condition = "clk_adc = 48 MHz, one conversion per 96 cycles"
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) section 4.9 overview (p.557) and section 4.9.2 (p.559): 500 ksps"

[models.peripherals.adc.input]
sample_cap_f = 1e-12
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) section 4.9.2 (p.559): 'when sampling, it places about 1pF across the input'; the effective impedance even at 500ksps is over 100 kOhm (Table 627 RIN_ADC min 100 kOhm, p.616); no source-impedance limit is stated"

[[models.peripherals.adc.accuracy]]
resolution_bits = 12
enob_bits = 8.7
condition = "typical ENOB at 250 ksps, 997 Hz input, room temperature, across 3 typical, 3 fast and 3 slow corner devices (min 8.6, max 8.8)"
basis = "RP2040 Datasheet (build 3184e62, 2025-02-20) section 4.9.3 Tables 565-566 (pp.561-562), typical 8.7 bits; Table 627 (p.616) prints 8.7 bits as its minimum"

# Ref: RP2040 Datasheet (build 2.21), sec 2.8.1.2 "Boot sequence" and sec 2.8.6
# "Bootrom contents"; the GPIO_QSPI_SS pin must idle high (flash CS) for normal
# boot. Held low at reset selects the USB bootloader.
[[models.straps]]
role = "qspi_ss"
level = "high"
boot_select = true   # held low at reset selects the USB bootloader (BOOTSEL)
# RP2040 Datasheet build 3184e62-clean (2025-02-20) Table 348 p.304: PADS_QSPI
# GPIO_QSPI_SS resets with PUE = 1 (pull-up enabled), PDE = 0; sec 5.5 p.615
# RPU 50-80 kOhm. So an undriven QSPI_SS boots from flash, and only a pull-down
# strong enough to beat 50-80 kOhm (the BOOTSEL button's 1k) selects USB boot.
internal_pull = "pull_up"
note = "QSPI_SS (flash CS) high = boot from flash (normal); held low = USB BOOTSEL"

# RUN (pad 26). RP2040 datasheet build 3184e62-clean (2025-02-20): sec 1.4.2 Pin Descriptions p.11, "Global
# asynchronous reset pin. Reset when driven low, run when driven high. If no external reset is required, this pin can
# be tied directly to IOVDD"; Table 619 Miscellaneous pins p.613: RUN, number 26, Digital In (FT), reset state Pull-Up,
# "Chip enable / reset". Active low, with an internal pull-up, so an undriven RUN runs (not a floating-strap fault) and
# only a pull-down held low keeps the chip in reset. Not a boot-select input.
[[models.straps]]
role = "run"
level = "high"
boot_select = false
internal_pull = "pull_up"
note = "RUN is active low with an internal pull-up; held low it keeps the chip in reset"

# Output stage per drive-strength setting. RP2040 Datasheet Table 625 section 5.5.3.4
# PDF p.616-617: IOVDD 3.3 V, VOH min 2.62 V, VOL max 0.5 V, test current = the selected
# setting (2/4/8/12 mA). The 1.8 V and 2.5 V rows (VOH 1.24/1.78 V, VOL 0.3/0.4 V) are
# not carried: only the 3.3 V row is fitted.
[[models.output_drive]]
setting = "2 mA"
selector = 0   # PADS_BANK0 GPIOn DRIVE bits 5:4, 0x0 = 2MA (Table 341 PDF p.302-303)
vdd = 3.3
points = [
  { level = "high", current_a = 0.002, volts = 2.62 },
  { level = "low", current_a = 0.002, volts = 0.5 },
]
basis = "RP2040 Datasheet (target/launch/wp5-datasheets/rp2040-datasheet.pdf, downloaded 2026-10-22), Table 625 'Digital IO characteristics' section 5.5.3.4 PDF p.616-617 (printed 615-616): at IOVDD 3.3 V VOH min 2.62 V and VOL max 0.5 V with IOH/IOL = 2, 4, 8 or 12 mA 'depending on setting'; section 5.5.3.5 PDF p.618 defines VOH/VOL as the worst-case level at the setting's current, so the fitted resistance is the datasheet bound, not the typical curve (Figure 171 is graph-only)"

[[models.output_drive]]
setting = "4 mA"
selector = 1   # PADS_BANK0 GPIOn DRIVE bits 5:4, 0x1 = 4MA (Table 341 PDF p.302-303)
reset_default = true   # DRIVE reset value 0x1 = 4MA (Table 341 PDF p.302)
vdd = 3.3
points = [
  { level = "high", current_a = 0.004, volts = 2.62 },
  { level = "low", current_a = 0.004, volts = 0.5 },
]
basis = "RP2040 Datasheet (target/launch/wp5-datasheets/rp2040-datasheet.pdf, downloaded 2026-10-22), Table 625 'Digital IO characteristics' section 5.5.3.4 PDF p.616-617 (printed 615-616): at IOVDD 3.3 V VOH min 2.62 V and VOL max 0.5 V with IOH/IOL = 2, 4, 8 or 12 mA 'depending on setting'; section 5.5.3.5 PDF p.618 defines VOH/VOL as the worst-case level at the setting's current, so the fitted resistance is the datasheet bound, not the typical curve (Figure 171 is graph-only)"

[[models.output_drive]]
setting = "8 mA"
selector = 2   # PADS_BANK0 GPIOn DRIVE bits 5:4, 0x2 = 8MA (Table 341 PDF p.302-303)
vdd = 3.3
points = [
  { level = "high", current_a = 0.008, volts = 2.62 },
  { level = "low", current_a = 0.008, volts = 0.5 },
]
basis = "RP2040 Datasheet (target/launch/wp5-datasheets/rp2040-datasheet.pdf, downloaded 2026-10-22), Table 625 'Digital IO characteristics' section 5.5.3.4 PDF p.616-617 (printed 615-616): at IOVDD 3.3 V VOH min 2.62 V and VOL max 0.5 V with IOH/IOL = 2, 4, 8 or 12 mA 'depending on setting'; section 5.5.3.5 PDF p.618 defines VOH/VOL as the worst-case level at the setting's current, so the fitted resistance is the datasheet bound, not the typical curve (Figure 171 is graph-only)"

[[models.output_drive]]
setting = "12 mA"
selector = 3   # PADS_BANK0 GPIOn DRIVE bits 5:4, 0x3 = 12MA (Table 341 PDF p.302-303)
vdd = 3.3
points = [
  { level = "high", current_a = 0.012, volts = 2.62 },
  { level = "low", current_a = 0.012, volts = 0.5 },
]
basis = "RP2040 Datasheet (target/launch/wp5-datasheets/rp2040-datasheet.pdf, downloaded 2026-10-22), Table 625 'Digital IO characteristics' section 5.5.3.4 PDF p.616-617 (printed 615-616): at IOVDD 3.3 V VOH min 2.62 V and VOL max 0.5 V with IOH/IOL = 2, 4, 8 or 12 mA 'depending on setting'; section 5.5.3.5 PDF p.618 defines VOH/VOL as the worst-case level at the setting's current, so the fitted resistance is the datasheet bound, not the typical curve (Figure 171 is graph-only)"

# PADS_BANK0 GPIO0..GPIO29, Table 341 section 2.19.6.3 PDF p.301-303: base 0x4001c000,
# GPIO0 at +0x04, one 32-bit register per pin at a 4-byte stride, DRIVE = bits 5:4.
[models.drive_select]
port_bases = { "0" = 0x4001c004 }
register_stride = 4
pins_per_register = 1
lsb = 4
width = 2
basis = "RP2040 Datasheet Table 341 PADS_BANK0 GPIO0 register (PDF p.302-303): base 0x4001c000 + 0x04 + 4*n, DRIVE bits 5:4, 0x0=2MA 0x1=4MA 0x2=8MA 0x3=12MA, reset 0x1"

# Reset behaviour. RUN is the global asynchronous reset: low holds the chip in reset
# regardless of DVDD (section 2.12.5 PDF p.168; pin list Table 619 PDF p.614). The datasheet
# prints no RUN-specific VIL/VIH; RUN is typed 'Digital In (FT)' in the IOVDD domain, so the
# generic Table 625 input levels at IOVDD 3.3 V are applied by pin type (VIL max 0.8 V, VIH
# min 2.0 V, PDF p.616-617). Brown-out watches DVDD (the 1.1 V core), not IOVDD: nominal
# threshold 0.86 V at power-on or after a reset (section 2.12.3.2 PDF p.167, Table 194), BOD
# enabled at reset (BOD register EN reset 0x1, Table 190 PDF p.159-160). No rising threshold
# is printed, so release_above_v is absent.
[models.reset]
supply_pin = "dvdd"
assert_below_v = 0.86
pin_vil_v = 0.8
pin_vih_v = 2.0
basis = "RP2040 Datasheet: BOD threshold section 2.12.3.2 PDF p.167 and Table 194 PDF p.167 (DVDD, nominal 0.86 V, 0.83-0.89 V), BOD enabled at reset Table 190 PDF p.159-160; RUN pin section 2.12.5 PDF p.168, input levels Table 625 PDF p.616-617 applied by pin type"

[models.coverage]
implements = ["cortex_m0plus_firmware_execution", "boot_rom_to_main", "gpio_output_and_direction", "gpio_external_input", "uart0_tx", "virtual_clock_and_timers", "adc_external_channels_0_to_3", "i2c0_i2c1_controller_bridge", "shared_sio_register_state"]
missing = ["spi_external_slave", "pio", "adc_temperature_channel_4", "proven_two_core_firmware", "usb_device_controller", "dma_fidelity", "silicon_power_current_profile", "silicon_timing_and_errata", "missing_external_crystal_startup_validation"]

# ─────────────────────────────────────────────────────────────────────────────

# The identity entry above retains pad56 when the package is absent or unknown.
# Only this more specific match supplies the complete numeric pad map.

# Boot-mode table (BOOT STRAPS package): the pins that select the boot source, the
# vendor's table, and where each value comes from.
[models.strap_latch]
event = "reset_release"
note  = "RP2040 has NO hardware latch on the strap. After RUN is high and the chip leaves reset, processor 0 runs the bootrom, which checks whether the SPI CS pin (QSPI_SS) is tied low ('bootrom button') and skips flash boot if so. The pin is sampled once, by software, after the watchdog-scratch check and before the QSPI pins are set up; the pin's reset state is a pull-up"
cite  = "RP2040 Datasheet, section 2.8.1 'Processor Controlled Boot Sequence', PDF p.130-131 (printed 129-130); Table 616 QSPI pins (QSPI_CSn, Pull-Up) PDF p.614 (printed 613)"

[models.reset_input]
role = "run"
vil  = [0.0, 0.8]                  # IOVDD = 3.3 V row of Table 625: VIL max 0.8 V. (1.8 V row: 0.35 x IOVDD; 2.5 V row: 0.7 V)
vih  = [0.0, 2.0]                  # IOVDD = 3.3 V row: VIH min 2 V. (1.8 V row: 0.65 x IOVDD; 2.5 V row: 1.7 V)
cite = "RP2040 Datasheet, Table 619 'Miscellaneous pins' (RUN, pin 26, 'Digital In (FT)', Pull-Up, 'Chip enable / reset') PDF p.614 (printed 613); Table 625 'Digital IO characteristics - Standard and FT unless otherwise stated', VIH/VIL at IOVDD=3.3V, PDF p.616 (printed 615). RUN has no separate threshold row, so the generic digital-IO rows are applied"

[[models.boot_inputs]]
role = "qspi_ss"
pin = "QSPI_SS (QSPI_CSn)"
internal_pull = "pull_up"
vil = [0.0, 0.8]                   # Table 625, IOVDD = 3.3 V
vih = [0.0, 2.0]
note = "Hardware design guide: QSPI_SS is connected to the flash and also has two resistors. R2 is a pull-up to 3.3 V (10 kohm, marked DNF/Do Not Fit on the reference schematic). R1 is a 1 kohm resistor in series with the header J2 labelled 'USB_BOOT' to ground: 'It is important to include resistor R1, as this allows the QSPI_SS pin to safely over-drive the applied pull-down when the RP2040 starts booting.' The guide shows a jumper header; it contains no push-button (BOOTSEL button) text"
cite = "RP2040 Datasheet Table 616 'QSPI pins' (QSPI_CSn, pin 56, Pull-Up) PDF p.614 (printed 613); Table 625 PDF p.616 (printed 615); Hardware design with RP2040, section 2.2 'Flash storage', PDF p.10 (printed 9)"

[[models.boot_modes]]
name = "BOOTSEL (USB boot)"
when = { qspi_ss = "low" }
outcome = "rom_bootloader"
detail = "QSPI_SS held low at boot: the bootrom skips flash boot and drops to USB device boot, where RP2040 appears as a USB Mass Storage Device (UF2 drag-and-drop programs the SPI flash or loads and runs code in SRAM; an extended PICOBOOT interface is also available). The user firmware in flash does not run. Needs the 12 MHz crystal or clock input the USB bootloader requires"
cite = "RP2040 Datasheet, section 2.8.1, PDF p.131 (printed 130); section 1.4.2 'Pin Descriptions' Table 1 (XIN and XOUT row) PDF p.12 (printed 11); Hardware design with RP2040 section 2.2 'Flash storage' PDF p.10 (printed 9)"

[[models.boot_modes]]
name = "Flash boot"
when = { qspi_ss = "high" }
outcome = "user_flash"
detail = "QSPI_SS not low: the bootrom sets up the QSPI pins, issues the XIP exit sequence, copies 256 bytes from SPI flash into SRAM5 and checks a CRC32; if the checksum passes it treats the bytes as a valid second stage and executes them from SRAM. If no valid image is found after 0.5 seconds of attempting to boot, the bootrom drops to USB device boot (the same USB mass-storage mode as BOOTSEL), so a blank or corrupt flash ends up in USB boot even with QSPI_SS high. Earlier, non-pin routes can pre-empt flash boot: a Rescue DP power-up halts, and watchdog scratch registers set to indicate pre-loaded SRAM code jump to that code"
cite = "RP2040 Datasheet, section 2.8.1 'Processor Controlled Boot Sequence' and 2.8.1.2 'Flash Boot Sequence', PDF pp.130-131 (printed 129-130)"

[models.rom_bootloader]
protocol = "usb_only"
cite = "RP2040 Datasheet, section 2.8 'Bootrom' (USB MSC class-compliant bootloader with UF2 support; PICOBOOT interface), PDF p.129 (printed 128); section 2.8.4 'USB Mass Storage Interface' PDF p.144 (printed 143)"

[[models]]
id = "rp2040_qfn56"
kind = "mcu"
description = "Raspberry Pi RP2040, QFN-56 with exposed ground pad"

[models.match]
value_re = "(?i)^RP2040(?:[-_ ]?QFN[-_ ]?56)?$"
footprint_re = '(?i)(^|:)QFN[-_]?56(?:[-_]1EP)?(?:_7x7mm(?:_P0\.4mm)?(?:_EP3\.2x3\.2mm)?)?$'

[models.params]
backend = "renode:rp2040"
internal_clock = "internal ring oscillator (ROSC)"

