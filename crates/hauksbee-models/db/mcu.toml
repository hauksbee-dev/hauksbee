mpn_re   = "(?i)^FE310"

[models.params]
# Renode backend: brings up sifive-fe310.repl. One 32-bit gpio0 port; roles
# "p0<bit>".
backend = "renode:sifive_fe310"
internal_clock = "internal HFROSC oscillator"

[models.pins]
"1"  = "vss"
"2"  = "vdd"
"3"  = "p019"       # HiFive1 LED is on GPIO 19
"4"  = "p021"       # second GPIO for blink
"5"  = "p017_txd"   # uart0 TX
"6"  = "p016_rxd"   # uart0 RX
[models.pin_capability.pull_up]
basis = "SiFive FE310-G002 Manual v1p4 (2022-02-18; sha256 fa0c889d124b45c873f4e3acc8501736e3d1e34641f0c91bc02878d51c05732f; file fetched from a third-party mirror, www.scs.stanford.edu/~zyedidia/docs/sifive/sifive-fe310.pdf, the SiFive document itself), chapter 17 GPIO: Table 50 register pue 'Internal pull-up enable' at offset 0x10 (printed p.78, PDF p.81); section 17.5 Internal Pull-Ups 'When configured as inputs, each pin has an internal pull-up which can be enabled by software' (printed p.79, PDF p.82). Not listed: the supply pads"
[models.pin_capability.pull_up.pads]
"3" = "GPIO19: GPIO pue[19] = 1 (internal pull-up enable, offset 0x10)"
"4" = "GPIO21: GPIO pue[21] = 1 (internal pull-up enable, offset 0x10)"
"5" = "GPIO17: GPIO pue[17] = 1 (internal pull-up enable, offset 0x10)"
"6" = "GPIO16: GPIO pue[16] = 1 (internal pull-up enable, offset 0x10)"

[models.ratings]
max_pin_current_a = 0.02
