# STM32L011x3/x4 datasheet DocID027973 Rev 5 (the card's DS11152 basis): Table 12 Legend/abbreviations p.36, RST
# "Bidirectional reset pin with embedded weak pull-up resistor"; Table 13 Pin definitions p.37, NRST at LQFP32
# pin 4; sec. 6.3.14 NRST pin characteristics p.79: "connected to a permanent pull-up resistor, RPU".
[[models.straps]]
role = "reset"
level = "high"
boot_select = false
internal_pull = "pull_up"
note = "NRST is active low with an embedded weak pull-up; held low it keeps the part in reset"

# BOOT0, shared with PB9 (BOOT0 pin on category 1 devices only, RM0377 Rev 10 Table 4 footnote 1 and p.57). RM0377
# Rev 10 sec 2.4 Table 4 "Boot modes" (p.56): with nBOOT_SEL = 0 the BOOT0 pin alone picks the boot area: pin 0 =
# Flash program memory; pin 1 = system memory (nBOOT1 = 1) or embedded SRAM (nBOOT1 = 0). FLASH_OPTR bit 29 nBOOT_SEL
# (p.110): "0: BOOT0 signal is defined by BOOT0 pin value (default mode)". The pin value is latched on the NRST rising
# edge (p.57). STM32L011x3/x4 datasheet DocID027973 Rev 5: Table 13 (p.40) row PB9-BOOT0, LQFP32 pin 31, pin type I,
# I/O structure B "Dedicated BOOT0 pin"; Table 12 legend (p.36): "Unless otherwise specified by a note, all I/Os are
# set as floating inputs during and after reset", and the row carries no pull note, so nothing holds an undriven
# BOOT0 net; sec 3.7 (p.24): "This pin is an input-only pin", sampled on the NRST rising edge when nBOOT_SEL is
# reset; Table 50 (p.75) gives the BOOT0 pin VIL max 0.14 VDD. If nBOOT_SEL has been programmed to 1 the pin is
# ignored (nBOOT0 decides), a deliberate non-default.
[[models.straps]]
role = "pb9_boot0"
level = "low"
boot_select = true
internal_pull = "none"
# BOOT0 pin thresholds, DocID027973 Rev 5 Table 50 I/O static characteristics p.75: VIL max 0.14 VDD, VIH min
# 0.15 VDD + 0.56 V (both "guaranteed by characterization, not tested in production"; the other I/Os have
# 0.3 VDD / 0.7 VDD, so a divider that is fine for them can still miss BOOT0's window).
vil = [0.14, 0.0]
vih = [0.15, 0.56]
note = "BOOT0 low boots main flash; high enters the system bootloader or SRAM (nBOOT_SEL = 0, the default)"

# ADC pads. STMicroelectronics STM32L011x3/x4 datasheet DocID027973 Rev 5, Table 13 pin definitions
# (datasheet pp.37-40), LQFP32 column: PA0-PA4 (p.37) and PA5-PA7, PB0, PB1 (p.38) list ADC_IN0..ADC_IN9
# as additional functions; no other pad has an ADC channel.
# Cross-checked pad for pad against ST STM32_open_pin_data (BSD-3-Clause, STMicroelectronics/STM32_open_pin_data
# on GitHub), file(s) mcu/STM32L011K(3-4)Tx.xml and STM32L021K4Tx.xml (identical); it agrees with the datasheet on every pad.

