# ─────────────────────────────────────────────────────────────────────────────
# CH32V003J4M6: WCH RISC-V (QingKe V2A) MCU in SOP8. Several die pads share one
# lead in this package: lead 1 carries PD6 and PA1, lead 8 carries PD4, PD5 and
# PD1/SWIO (Figure 2-1 and the SOP8 column of Table 2-1).
#
# Source: WCH CH32V003 Datasheet V1.8. 2.1 pinout (CH32V003J4M6), Table 2-1
#   SOP8 column, 1.4.3 Power Supply Scheme (VDD 2.7-5.5 V), Table 3-1 Absolute
#   maximum ratings (VDD -0.3..5.5 V, IVDD 100 mA, IVSS 80 mA, II/O 20 mA).
#
# BACKEND IS `none:`: no co-sim core models the QingKe V2A, so co-sim is
# refused loudly; lint, envelope and rating checks read the pad map.
[[models]]
id = "ch32v003j4m6_sop8"
kind = "mcu"
description = "CH32V003J4M6 RISC-V MCU, SOP8 (structure only, no co-sim core)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.wch-ic.com/products/CH32V003.html"
title = "WCH CH32V003 Datasheet V1.8"
locator = "1.4.3 Power Supply Scheme; 2.1 CH32V003J4M6 pinout; Table 2-1 SOP8 column; Table 3-1 Absolute maximum ratings"
sha256 = "186210d35123325ea49305e3a0152cbfa6e377d8e6efc2e610e3497daabe17f8"

[models.match]
# Some CAD libraries append the package in brackets.
value_re = "(?i)^CH32V003J4M6(\\(SOP-?8\\))?$"

[models.params]
backend = "none:ch32v003"

[models.pins]
# Table 2-1, SOP8 column.
"1" = "pd6_pa1"            # PD6 (URX/A6) and PA1 (OSCI/A1) bonded together
"2" = "gnd"
"3" = "pa2"                # PA2 (OSCO/A0)
"4" = "vcc"
"5" = "pc1_sda"            # FT
"6" = "pc2_scl"            # FT
"7" = "pc4_a2"
"8" = "pd4_pd5_pd1_swio"   # PD4 (A7), PD5 (UTX/A5), PD1 (SWIO) bonded together
[models.pin_capability.pull_up]
basis = "WCH CH32V003 Datasheet V1.8 (sha256 186210d35123325ea49305e3a0152cbfa6e377d8e6efc2e610e3497daabe17f8; PDF page numbers, printed page = PDF page - 2): section 1.4.16 General-purpose Input and Output (GPIO) 'Each pin can be configured by software as output (push-pull or open-drain), input (with or without pull-up or pull-down)' (PDF p.10); Table 3-16 General-purpose I/O static characteristics RPU weak pull-up equivalent resistance 35/45/55 kOhm (PDF p.23); Table 2-1 Pin definitions SOP8 column maps SOP8 pin 1 to PD6 and PA1, pin 3 to PA2, pin 5 to PC1, pin 6 to PC2, pin 7 to PC4, pin 8 to PD4, PD5 and PD1 (PDF pp.13-14). Not listed: pads 1 (PD6/PA1) and 8 (PD4/PD5/PD1/SWIO), each of which bonds several port bits to one pad, which the datasheet does not resolve into a single pad-level pull statement; pad 2 (VSS) and pad 4 (VDD)"
[models.pin_capability.pull_up.pads]
"3" = "PA2: GPIO input with pull-up"
"5" = "PC1: GPIO input with pull-up"
"6" = "PC2: GPIO input with pull-up"
"7" = "PC4: GPIO input with pull-up"

[models.ratings]
max_pin_current_a = 0.02   # Table 3-1, II/O sink or source 20 mA on any I/O pin
max_current_a = 0.08       # Table 3-1, IVSS 80 mA total out of the VSS lines (IVDD is 100 mA)
max_voltage_v = 5.5        # Table 3-1, VDD-VSS max 5.5 V

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.7
max_v = 5.5
abs_max_v = 5.5
basis = "WCH CH32V003 Datasheet V1.8, 1.4.3 VDD 2.7-5.5 V; Table 3-1 VDD max 5.5 V"

[models.coverage]
implements = ["pad_map", "supply_envelope", "pin_and_package_current_ratings"]
missing = ["firmware_cosim_core", "gpio_behaviour", "shared_lead_contention"]
[models.pin_capability.adc]
basis = "WCH CH32V003 Datasheet V1.8 (PDF page numbers; printed page = PDF page - 2), Table 2-1 Pin definitions (PDF p.13-14) SOP8 column joined with the 'A' entries of the Default alternate function column, cross-checked against Table 2-2 Pin alternate and remapping functions ADC column (PDF p.15): A0 on PA2, A1 on PA1, A2 on PC4, A5 on PD5, A6 on PD6, A7 on PD4. AETR/AETR2 are the ADC external trigger, not input channels, so PD1 adds nothing. Pad 1 bonds PD6 and PA1, pad 8 bonds PD4, PD5 and PD1 (Table 2-1 SOP8 column). PC1 and PC2 have no ADC channel. Hardware peripheral only"
[models.pin_capability.adc.pads]
"1" = "ADC_IN6 (PD6) / ADC_IN1 (PA1)"
"3" = "ADC_IN0 (PA2)"
"7" = "ADC_IN2 (PC4)"
"8" = "ADC_IN7 (PD4) / ADC_IN5 (PD5)"

[models.pin_capability.spi_sck]
basis = "WCH CH32V003 Datasheet V1.8 (PDF page numbers; printed = PDF - 2), Table 2-2 Pin alternate and remapping functions SPI column (PDF p.15) and Table 2-1 Pin definitions (PDF p.13-14): SPI_SCK exists only on PC5 (SCK default, SCK_1 remap), and PC5 has no SOP8 pad (SOP8 column '-'). The SOP8 package therefore has no SPI clock pad. The USART synchronous clock UCK (PD4) is a one-way synchronous USART clock (1.4.13, PDF p.10), not an SPI peripheral, so it is not counted. Hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.spi_mosi]
basis = "WCH CH32V003 Datasheet V1.8 (PDF page numbers; printed = PDF - 2), Table 2-2 SPI column (PDF p.15) and Table 2-1 (PDF p.13-14): SPI_MOSI exists only on PC6 (MOSI, MOSI_1 remap) and PC6 has no SOP8 pad. Hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.spi_miso]
basis = "WCH CH32V003 Datasheet V1.8 (PDF page numbers; printed = PDF - 2), Table 2-2 SPI column (PDF p.15) and Table 2-1 (PDF p.13-14): SPI_MISO exists only on PC7 (MISO, MISO_1 remap) and PC7 has no SOP8 pad. Hardware peripheral only, a software (bit-banged) implementation can use any pad"

[models.pin_capability.i2c_sda]
basis = "WCH CH32V003 Datasheet V1.8 (PDF page numbers; printed = PDF - 2), Table 2-2 Pin alternate and remapping functions I2C column (PDF p.15) and Table 2-1 Pin definitions (PDF p.13-14): I2C_SDA on PC1 (default), PD0 (SDA_1), PC6 (SDA_2/SDA_3 remaps); only PC1 has a SOP8 pad (pad 5). Hardware peripheral only, a software (bit-banged) implementation can use any pad"
[models.pin_capability.i2c_sda.pads]
"5" = "I2C_SDA (PC1)"

[models.pin_capability.i2c_scl]
basis = "WCH CH32V003 Datasheet V1.8 (PDF page numbers; printed = PDF - 2), Table 2-2 Pin alternate and remapping functions I2C column (PDF p.15) and Table 2-1 Pin definitions (PDF p.13-14): I2C_SCL on PC2 (default, SOP8 pad 6), PD1 (SCL_1 remap, in SOP8 bonded pad 8 with PD4/PD5), PC5 (SCL_2/SCL_3, no SOP8 pad). Hardware peripheral only, a software (bit-banged) implementation can use any pad; pad 8 (PD1) is not listed: it carries SCL only under I2C remap 1, which moves SDA to PD0, and PD0 has no SOP8 pad (Table 2-1 pp.13-14, Table 2-2 p.15), so no working I2C bus can use it"
[models.pin_capability.i2c_scl.pads]
"6" = "I2C_SCL (PC2)"

[models.pin_capability.uart_tx]
basis = "WCH CH32V003 Datasheet V1.8 (PDF page numbers; printed = PDF - 2), Table 2-2 Pin alternate and remapping functions USART column (PDF p.15) and Table 2-1 Pin definitions (PDF p.13-14): USART_TX (UTX) on PD5 (default), PD6 (UTX_2), PD0 (UTX_1) and PC0 (UTX_3); PD5 and PD6 have SOP8 pads (pad 8 bonds PD4/PD5/PD1, pad 1 bonds PD6/PA1), PD0 and PC0 do not. Hardware peripheral only, a software (bit-banged) implementation can use any pad"
[models.pin_capability.uart_tx.pads]
"8" = "USART1_TX (PD5)"
"1" = "USART1_TX (PD6, UTX_2 remap)"

[models.pin_capability.uart_rx]
basis = "WCH CH32V003 Datasheet V1.8 (PDF page numbers; printed = PDF - 2), Table 2-2 Pin alternate and remapping functions USART column (PDF p.15) and Table 2-1 Pin definitions (PDF p.13-14): USART_RX (URX) on PD6 (default), PD5 (URX_2), PD1 (URX_1), PC1 (URX_3); PD6 is on SOP8 pad 1, PD5 and PD1 share pad 8, PC1 is pad 5. Hardware peripheral only, a software (bit-banged) implementation can use any pad"
[models.pin_capability.uart_rx.pads]
"1" = "USART1_RX (PD6)"
"8" = "USART1_RX (PD5, URX_2 remap / PD1, URX_1 remap)"
"5" = "USART1_RX (PC1, URX_3 remap)"

[models.pin_capability.pwm]
basis = "WCH CH32V003 Datasheet V1.8 (PDF page numbers; printed = PDF - 2), Table 2-2 Pin alternate and remapping functions TIM1 and TIM2 columns (PDF p.15) and Table 2-1 Pin definitions (PDF p.13-14); 1.4.12 Timer and Watchdog (PDF p.9): advanced-control TIM1 with complementary PWM outputs, general-purpose TIM2 channels 'support input capture, output comparison, and PWM generation'. Any TIM1/TIM2 CHy or CHyN output on a SOP8 pad: pad 1 (PA1 T1CH2, PD6 T2CH3_3), pad 3 (PA2 T1CH2N), pad 5 (PC1 T2CH4_1), pad 6 (PC2 T2CH2_1), pad 7 (PC4 T1CH4), pad 8 (PD4 T2CH1/T1CH4_3, PD5 T2CH4_3, PD1 T1CH3N). Hardware peripheral only"
[models.pin_capability.pwm.pads]
"1" = "TIM1_CH2 (PA1) / TIM2_CH3 (PD6, remap 3)"
"3" = "TIM1_CH2N (PA2)"
"5" = "TIM2_CH4 (PC1, remap 1)"
"6" = "TIM2_CH2 (PC2, remap 1)"
"7" = "TIM1_CH4 (PC4)"
"8" = "TIM2_CH1 (PD4) / TIM1_CH4 (PD4, remap 3) / TIM2_CH4 (PD5, remap 3) / TIM1_CH3N (PD1)"

[models.pin_capability.timer_capture]
basis = "WCH CH32V003 Datasheet V1.8 (PDF page numbers; printed = PDF - 2), 1.4.12 Timer and Watchdog (PDF p.9): general-purpose timer channels 'support input capture, output comparison, and PWM generation', the advanced timer shares the general-purpose functions; Table 2-2 TIM1/TIM2 columns (PDF p.15) and Table 2-1 (PDF p.13-14). Only CHy (capture/compare input) pins count, not the complementary CHyN outputs (PA2 T1CH2N, PD1 T1CH3N) or ETR/BKIN: pad 1 (PA1 T1CH2, PD6 T2CH3_3), pad 5 (PC1 T2CH4_1), pad 6 (PC2 T2CH2_1), pad 7 (PC4 T1CH4), pad 8 (PD4 T2CH1, PD5 T2CH4_3). Hardware peripheral only"
