[models.ratings]
max_pin_current_a = 0.025  # 25 mA abs max per I/O pin
max_current_a = 0.15
max_voltage_v = 4.0   # DS5319 Rev 20 Table 6 Voltage characteristics, VDD-VSS -0.3 to 4.0 V

# The 2-3.6 V operating range is the check that fires below the 4.0 V abs max.
[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.0
max_v = 3.6
abs_max_v = 4.0
basis = "ST STM32F103x8/xB DS5319 Rev 20, Table 9 General operating conditions, VDD standard operating voltage 2 V to 3.6 V; Table 6 Voltage characteristics, VDD-VSS external main supply voltage -0.3 V to 4.0 V"

# Strapping. STM32F1 samples BOOT0 (and BOOT1=PB2) on the 4th rising SYSCLK
# edge after reset to select the boot memory. BOOT0=0 -> boot from main flash
# (normal). BOOT0=1 -> system memory (bootloader) or SRAM. A floating BOOT0
# leaves the boot source undefined, so it must be biased (the bluepill ties it
# low through the BOOT0 header). Ref: ST RM0008 rev 21, sec 3.4 "Boot
# configuration", Table 9.
[[models.straps]]
role = "boot0"
level = "low"
boot_select = true   # latches the boot memory; firmware cannot undo it
internal_pull = "none"   # STM32 BOOT0 has NO on-die pull: a floating net is undefined
note = "BOOT0 low boots main flash; high enters system bootloader/SRAM"

# Output stage. STM32F103x8/xB DS5319 Rev 20 Table 37 'Output voltage characteristics' section
# 5.3.13 PDF p.64: VOL max 0.4 V and VOH min VDD-0.4 V at IIO = 8 mA (2.7 V < VDD < 3.6 V), the
# figure tested in production. The relaxed 20 mA row (VOL 1.3 V, VOH VDD-1.3 V) is
# characterised only and not fitted. PC13-PC15 are limited to 3 mA (PDF p.64) and the
# datasheet gives them no VOL/VOH, so they take this fit only because the card has no
# per-pin exception. Pin speed (MODE bits) changes slew, not these DC limits.
[[models.output_drive]]
setting = "8 mA"
vdd = 3.3
points = [
  { level = "high", current_a = 0.008, volts = 2.9 },
  { level = "low", current_a = 0.008, volts = 0.4 },
]
basis = "STM32F103x8/xB DS5319 Rev 20 Table 37 section 5.3.13 PDF p.64: CMOS port, IIO = 8 mA, 2.7 V < VDD < 3.6 V, VOL max 0.4 V, VOH min VDD-0.4 V (VDD 3.3 V gives 2.9 V)"

# Reset. Power-on/power-down reset: DS5319 Table 11 section 5.3.3 PDF p.39, falling edge typ
# 1.88 V, rising edge typ 1.92 V. NRST pin: Table 39 section 5.3.14 PDF p.66, VIL max 0.8 V,
# VIH min 2.0 V (pin 7 on LQFP48, Table 5 PDF p.28). NRST filters pulses under 100 ns and
# passes those over 300 ns; pulses shorter than that are not modelled.
[models.reset]
supply_pin = "vdd"
assert_below_v = 1.88
release_above_v = 1.92
release_delay_s = 0.0025   # TRSTTEMPO typ 2.5 ms (min 1.0, max 4.5), Table 11 PDF p.39, specified by design
pin_vil_v = 0.8
pin_vih_v = 2.0
basis = "STM32F103x8/xB DS5319 Rev 20: VPOR/PDR and TRSTTEMPO Table 11 section 5.3.3 PDF p.39 (typ 1.88 V falling, 1.92 V rising, 2.5 ms temporization); NRST VIL/VIH Table 39 section 5.3.14 PDF p.66"

[models.coverage]
implements = ["cortex_m3_firmware_execution", "boot_to_main", "gpio_output_and_direction", "gpio_external_input", "uart_tx", "virtual_clock_and_systick", "i2c1_controller_bridge", "spi1_controller_bridge"]
missing = ["adc_injection", "instruction_exact_timing", "silicon_power_current_profile", "silicon_timing_and_errata"]

# ─────────────────────────────────────────────────────────────────────────────
# STM32F401C (UFQFPN48): the 48-pin F401 (F401CB/CC/CD/CE). Modelled primarily so
# the boot strap-pin lint covers its BOOT0, the rest of the modern STM32 line was
# otherwise unmodelled. Co-sim, when wired, reuses the same
# renode STM32F4 platform the binder's family fallback already selects, so adding
# this DB entry does not change the co-sim path. The pin map is intentionally
# limited to the strap pin (BOOT0 = UFQFPN48 pad 44, verified against the
# STM32F401CCU6 footprint); the renode platform owns the rest for co-sim.

# Boot-mode table (BOOT STRAPS package): the pins that select the boot source, the
# vendor's table, and where each value comes from.
# Both boot pads are physical pads; there are no boot option bits on F1.
[models.strap_latch]
event = "reset_release"
note  = "BOOT1/BOOT0 pin values are latched on the 4th rising edge of SYSCLK after a reset, and re-sampled when exiting Standby; no option bits select the boot source on F1"
cite  = "RM0008 Rev 20, section 3.4 'Boot configuration', Table 9 and text, PDF p.60-61"

[models.reset_input]
role = "reset"
vil  = [0.0, 0.8]
vih  = [0.0, 2.0]
cite = "DS5319 Rev 19 (STM32F103x8/xB), Table 39 'NRST pin characteristics', PDF p.66: VIL(NRST) max 0.8 V, VIH(NRST) min 2 V; pad 7 on LQFP48 per Table 5 PDF p.28"

[[models.boot_inputs]]
role = "boot0"
internal_pull = "unknown"
vil = [0.28, 0.24]
vih = [0.41, 0.48]
cite = "DS5319 Rev 19, Table 36 'I/O static characteristics', PDF p.61, Standard IO rows (VIL max 0.28*(VDD-2 V)+0.8 V, VIH min 0.41*(VDD-2 V)+1.3 V). INFERRED: the CMOS rows are labelled 'All I/Os except BOOT0', so BOOT0 is read as a Standard IO TTL pad; the table does not name BOOT0 on the TTL rows. Pad 44 per Table 5 PDF p.32"

[[models.boot_inputs]]
role = "pb2_boot1"
internal_pull = "none"
vil = [0.32, 0.11]
vih = [0.42, 0.16]
cite = "DS5319 Rev 19, Table 36, PDF p.61, 'IO FT' rows (VIL max 0.32*(VDD-2 V)+0.75 V, VIH min 0.42*(VDD-2 V)+1 V); PB2 is type 'I/O FT' with main function PB2/BOOT1 (Table 5 PDF p.30, pad 20). Pull: GPIO reset state is floating input, RM0008 Rev 20 GPIOx_CRL reset value 0x4444 4444, PDF p.171 (the reset state, not a datasheet statement about the strap)"

[[models.boot_modes]]
name = "main flash"
when = { boot0 = "low" }
outcome = "user_flash"
detail = "BOOT0 = 0 (BOOT1 is a don't-care): main Flash memory is selected as boot space; user firmware runs"
cite = "RM0008 Rev 20, Table 9, PDF p.60"

[[models.boot_modes]]
name = "system memory"
when = { boot0 = "high", pb2_boot1 = "low" }
outcome = "rom_bootloader"
detail = "BOOT1 = 0, BOOT0 = 1: system memory (ST USART1 bootloader, 0x1FFFF000) is the boot space; user firmware does not run"
cite = "RM0008 Rev 20, Table 9, PDF p.60; bootloader on USART1 PA9/PA10 only for this density, AN2606 Rev 70 Table 45 PDF p.116"

[[models.boot_modes]]
name = "embedded SRAM"
when = { boot0 = "high", pb2_boot1 = "high" }
outcome = "sram"
detail = "BOOT1 = 1, BOOT0 = 1: embedded SRAM is the boot space"
cite = "RM0008 Rev 20, Table 9, PDF p.60"

[models.rom_bootloader]
protocol = "st_usart"
version = 0x22
product_id = 0x0410
commands = [0x00, 0x01, 0x02, 0x11, 0x21, 0x31, 0x43, 0x63, 0x73, 0x82, 0x92]
port = "USART1 on PA9 (TX) / PA10 (RX), 8E1"
cite = "AN3155 Rev 18 (framing, ACK 0x79, NACK 0x1F, command set Table 2); AN2606 Rev 70 Table 3 (USART V2.2), Table 45 PDF p.116 (USART1 pins), Table 226 (PID 0x410). The Get command list and version byte are derived from AN3155 Table 3/Table 2 rules, not printed per device."

# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   AN2606 Rev 70 (February 2026), https://www.st.com/resource/en/application_note/an2606-stm32-microcontroller-system-memory-boot-mode-stmicroelectronics.pdf sha256 25b466e39ecc61671dcb988d8ca538462d6452d85f68140cb981ed728f57e654;
#   AN3155 Rev 22 (September 2026), https://www.st.com/resource/en/application_note/an3155-usart-protocol-used-in-the-stm32-bootloader-stmicroelectronics.pdf sha256 0e3e1c35ffa3311aba33440d9d6236dc2f59af8a7f32482cf13d1d0af8c5e1f9;
#   RM0008 Rev 20 (cached copy target/launch/wp1-datasheets/rm0008.pdf; ST URL https://www.st.com/resource/en/reference_manual/rm0008-stm32f101xx-stm32f102xx-stm32f103xx-stm32f105xx-and-stm32f107xx-advanced-armbased-32bit-mcus-stmicroelectronics.pdf) sha256 097bc47ab8aa0c5d4a68f836dbab95c5b9acb2b0c8116a2959307743204b5097.

[[models.pin_bias]]
role = "pa10"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 45 (STM32F10xxx configuration in system memory boot mode) PDF p.116, USART1_RX pin: \"PA10 pin: USART1 in reception mode. Used in input no pull mode.\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0008 Rev 20 PDF p.790 section 27.3.1 USART character description: \"The TX pin is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

[[models]]
id = "stm32f401c"
kind = "mcu"
description = "STM32F401C Cortex-M4 MCU (UFQFPN48: F401CB/CC/CD/CE)"

[models.match]
value_re = "(?i)^STM32F401C[BCDE]?(U6|T6|C6)?$"
mpn_re   = "(?i)^STM32F401C[BCDE]"

[models.params]
backend = "renode:stm32f4"
internal_clock = "internal 16 MHz HSI RC oscillator"

[models.pins]
"7"  = "reset"   # NRST (DS9716 Rev 11 Table 8, UQFN48 pad 7)
"10" = "pa0"
"11" = "pa1"
"12" = "pa2"
"13" = "pa3"
"14" = "pa4"
"15" = "pa5"
"16" = "pa6"
"17" = "pa7"
"18" = "pb0"
"19" = "pb1"
# Pads 10-19 are the ADC1 inputs (PA0-PA7, PB0, PB1) named here so the ADC capability table below can
# state them; STM32F401xB/xC datasheet DocID024738 Rev 10 (DS9716), Table 8, UQFN48 column. The rest of the
# package's pads are deliberately not mapped.
"20" = "pb2_boot1" # PB2, BOOT1 additional function (DS9716 Rev 11 Table 8, pad 20)
"44" = "boot0"   # BOOT0 strapping pin, UFQFPN48 pad 44 (verified vs the footprint)

# ADC pads. STMicroelectronics STM32F401xB/xC datasheet DocID024738 Rev 10 (December 2017, DS9716), Table 8
# pin definitions (datasheet pp.37-43), UQFN48 (= UFQFPN48) column: ADC1_IN0..ADC1_IN9 on PA0-PA7 (PA0-PA2 p.38,
# PA3-PA7 p.39), PB0 and PB1 (p.39); PC0-PC5 carry ADC1_IN10-15 on the LQFP64/LQFP100 columns only (UQFN48
# column '-'). No other pad has an ADC channel.
# Cross-checked pad for pad against ST STM32_open_pin_data (BSD-3-Clause, STMicroelectronics/STM32_open_pin_data
# on GitHub), file(s) mcu/STM32F401C(B-C)Ux.xml (identical to STM32F401C(D-E)Ux.xml); it agrees with the datasheet on every pad.
# Datasheet read from target/launch/cards-datasheets/stm32f401xbxc-ds9716.pdf, fetched from
# https://pdf.direnc.net/upload/stm32f401vct6-32-bit-flash-84mhz-mikrodenetleyici.pdf (st.com throttled).

[models.pin_capability.adc]
basis = "STMicroelectronics STM32F401xB/xC datasheet DocID024738 Rev 10 (DS9716), Table 8 pin definitions (datasheet pp.37-43), UQFN48 (UFQFPN48) column: PA0-PA7 pads 10-17 are ADC1_IN0-IN7 (PA0-PA2 p.38, PA3-PA7 p.39) and PB0/PB1 pads 18/19 are ADC1_IN8/IN9 (p.39); PC0-PC5 (ADC1_IN10-15) are not on this package; every other pad has no ADC channel"
