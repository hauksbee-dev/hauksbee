cite = "ESP32-C3 Series Datasheet v2.4, Table 3-1 (GPIO2 Floating) PDF p.30 and Table 3-3 footnote 2 PDF p.31; Table 5-4 PDF p.55"

[[models.boot_inputs]]
role = "gpio3"                     # no C3 card has this role yet (QFN32 pad 8)
pin = "GPIO3"
internal_pull = "none"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "Only used by SPI Download Boot; GPIO3 and GPIO2 are floating by default and high-impedance at reset"
cite = "ESP32-C3 TRM v1.4, Table 7.2-1 footnote 3, PDF p.199; ESP32-C3 Series Datasheet v2.4 Table 5-4 PDF p.55"

[[models.boot_modes]]
name = "SPI boot mode"
when = { gpio9 = "high" }          # GPIO8 any value; GPIO2 and GPIO3 do not matter
outcome = "user_flash"
detail = "GPIO9 = 1 (the default, weak pull-up): SPI boot, the ROM bootloader loads and executes the program from SPI flash. GPIO8 can be any value"
cite = "ESP32-C3 Series Datasheet v2.4, Table 3-3 PDF p.31; ESP32-C3 TRM v1.4 Table 7.2-1, PDF p.199"

[[models.boot_modes]]
name = "Joint download boot mode"
when = { gpio9 = "low", gpio8 = "high" }
outcome = "rom_bootloader"
detail = "GPIO9 = 0 and GPIO8 = 1: Joint Download Boot, which supports USB-Serial-JTAG Download Boot and UART Download Boot; the user firmware does not run unless downloaded into SRAM. The datasheet row also shows GPIO2 = 1, but its footnote says GPIO2 does not determine this mode and the TRM marks it as a don't-care"
cite = "ESP32-C3 Series Datasheet v2.4, Table 3-3 and footnote 2, PDF p.31; ESP32-C3 TRM v1.4 Table 7.2-1, PDF p.199"

[[models.boot_modes]]
name = "SPI download boot mode"
when = { gpio9 = "low", gpio8 = "low", gpio3 = "low", gpio2 = "high" }    # needs a gpio3 role on the card
outcome = "rom_bootloader"
detail = "GPIO9 = 0, GPIO8 = 0, GPIO3 = 0, GPIO2 = 1: SPI Download Boot, download over the SPI interface into flash or SRAM. GPIO3 and GPIO2 must be reserved for it. Only in the TRM, not the datasheet"
cite = "ESP32-C3 TRM v1.4 Table 7.2-1 and footnote 3, PDF p.199"

[[models.boot_modes]]
name = "Invalid combination"
when = { gpio9 = "low", gpio8 = "low", gpio2 = "low" }                    # GPIO3: don't care
outcome = "undefined"
detail = "GPIO9 = 0, GPIO8 = 0, GPIO2 = 0: the TRM calls this an Invalid Combination that can trigger unexpected behaviour and should be avoided. Row order: it sits after SPI Download so GPIO3/GPIO2 = (0,1) matches the download row first"
cite = "ESP32-C3 TRM v1.4 Table 7.2-1 and footnote 4, PDF p.199"

[models.qemu_boot]
device = "esp32c3.gpio"
property = "strap_mode"
flash_boot = 0x08                   # QEMU's own ESP32C3_STRAP_MODE_FLASH_BOOT; straps with a defined level are overlaid on it
bits = { gpio9 = 3, gpio8 = 2, gpio3 = 1, gpio2 = 0 }   # TRM v1.4 p.181 lists bits 0, 2, 3 only; bit 1 = GPIO3 rests on an Espressif QEMU ROM run, unconfirmed by any Espressif document
cite = "ESP32-C3 TRM v1.4 GPIO_STRAPPING bit list, PDF p.181; Espressif QEMU include/hw/gpio/esp32c3_gpio.h (FLASH_BOOT 0x8, UART_BOOT 0x2, USB_BOOT 0x0). ROM run in QEMU: 0x01 -> SPI_DOWNLOAD_BOOT, 0x04..0x07 -> DOWNLOAD(USB/UART0/1), 0x08..0x0f -> SPI_FAST_FLASH_BOOT"
[models.pin_capability.routed]
basis = "Espressif ESP32-C3 Series Datasheet v2.4 (PDF page = printed page), Section 4.1.3.1 IO MUX and GPIO Matrix (p.36): 'Using GPIO Matrix, peripheral input signals can be configured from any IO pins while peripheral output signals can be configured to any IO pins'; Section 2.3.4 Peripheral Pin Assignment, Table 2-7 (p.23-24; its UART0, SPI2, UART1, I2C, LED PWM and RMT columns list GPIOn (P2) on the GPIO pads) footnote 2: 'Signals of UART0, SPI0/1, and SPI2 interface can be mapped to any GPIO pins through the GPIO Matrix, regardless of whether they are directly routed to fixed pins via IO MUX', and a peripheral without priority 1 pins, such as UART1, 'can be assigned to any GPIO pins'. ESP32-C3 Technical Reference Manual v1.4 (PDF page = printed page), Chapter 5 IO MUX and GPIO Matrix, Section 5.11 Table 5.11-1 Peripheral Signals via GPIO Matrix (p.169-171): U0TXD_out/U0RXD_in/U1TXD_out/U1RXD_in (p.169), ledc_ls_sig_out0 (p.170), I2CEXT0_SCL/SDA in/out and FSPICLK/FSPID/FSPIQ in/out (SPI2, p.171). hardware peripheral only, a software (bit-banged) implementation can use any pad Module datasheet: ESP32-C3-WROOM-02 & WROOM-02U Datasheet v1.7, Section 5 (p.16): 'U0TXD and U0RXD for UART0 are multiplexed with GPIO21 ~ GPIO20 via IO MUX. Other signals can be routed to any GPIOs via the GPIO matrix'; I2C p.18, LED PWM p.19."
functions = ["spi_sck", "spi_mosi", "spi_miso", "i2c_sda", "i2c_scl", "uart_tx", "uart_rx", "pwm"]
[models.pin_capability.timer_capture]
basis = "Espressif ESP32-C3 Series Datasheet v2.4 (PDF page = printed page), Peripherals (p.4) and Section 4.2 Peripherals (p.46-49) list UART, SPI, I2C, I2S, USB Serial/JTAG, TWAI, LED PWM (up to 6 channels) and a remote control peripheral, and timers: two 54-bit general-purpose timers, watchdogs, 52-bit system timer; there is no Motor Control PWM (MCPWM), no pulse counter and no timer input-capture channel. ESP32-C3 Technical Reference Manual v1.4, Section 5.11 Table 5.11-1 Peripheral Signals via GPIO Matrix (p.169-171) has no capture-input signal (no pwm*_cap*_in), and the TRM has no MCPWM or input-capture chapter. The RMT receiver records pulse widths but is a remote-control peripheral, not a timer input-capture channel. Hardware peripheral only, a software (GPIO-interrupt timestamp) capture can use any pad."


[[models]]
id = "esp32c3_qfn32"
kind = "mcu"
description = "Espressif ESP32-C3 bare chip, QFN32 5x5 mm"

[models.match]
# Every ordering code shares one QFN32 pad map for the roles below (Figures
# 2-1 and 2-2 differ only on the unbonded pins 19-24 of -C3FH4X/-C3FH4AZ). The
# footprint names the 5x5 mm, 0.5 mm-pitch QFN32 in KiCad's spelling or in
# the EasyEDA/LCSC one ("QFN-32_L5.0-W5.0-P0.50-...").
value_re = "(?i)^ESP32[-_ ]?C3(F[NH][48](AZ|X)?|[-_ ]?(WROOM|MINI).*)?$"
footprint_re = '(?i)(^|:)V?QFN[-_]?32(([-_]1EP)?[-_]5x5mm[-_]P0\.5mm|[-_]L5\.0[-_]W5\.0[-_]P0\.50)'

[models.params]
backend = "qemu:esp32c3"

[models.pins]
# ESP32-C3 Series Datasheet v2.4, Table 2-1 "Pin Overview": GPIO2 = 6 (powered
# by VDD3P3_RTC = 11), GPIO8 = 14 and GPIO9 = 15 (powered by VDD3P3_CPU = 17),
# U0RXD = 27, U0TXD = 28, GND = 33 (exposed pad). `vdd` is VDD3P3_CPU: it
# powers GPIO9, the one strap with sourced VIL/VIH.
"17" = "vdd"
"33" = "vss"
"6"  = "gpio2"
"14" = "gpio8"
"15" = "gpio9"
"7"  = "en"          # CHIP_EN (Table 2-1 pin 7)
"8"  = "gpio3"       # Table 2-1 pin 8 (ADC1_CH3; not a strap)
"28" = "p021_txd"
"27" = "p020_rxd"

[models.pin_capability.adc]
basis = "Espressif ESP32-C3 Datasheet v2.4, Table 2-6 Analog Functions (PDF p.21): pin 6 GPIO2 ADC1_CH2 and pin 8 GPIO3 ADC1_CH3 (pins 6 and 8 are GPIO2 and GPIO3 in Table 2-1 Pin Overview, PDF p.16); GPIO8, GPIO9, GPIO20, GPIO21 carry none"
[models.pin_capability.adc.pads]
"6" = "ADC1_CH2"
"8" = "ADC1_CH3 (GPIO3)"
[models.pin_capability.pull_up]
basis = "ESP32-C3 chip, QFN 5x5 32-pin: pad-to-GPIO mapping from the ESP32-C3 Series Datasheet v2.4 Table 2-1 Pin Overview (pp.16-17). Espressif ESP32-C3 Series Datasheet v2.4 (sha256 833fc000b4b3c3d39c496fcbd597fed5806956503ce7390b19cc8ae82f19f968) section 4.1.3.1 IO MUX and GPIO Matrix (p.36) 'All GPIOs have selectable internal pull-up or pull-down, or can be set to high impedance'; Table 2-1 Pin Overview (pp.16-17) note 5 (p.17). ESP32-C3 Technical Reference Manual v1.4 (sha256 90ef825653e7a2657dc1bb294041aace9f9b69da87d775c2f1b5bd11eb317423) section 5.4.3 (p.163) 'Set or clear IO_MUX_GPIOx_FUN_WPU and IO_MUX_GPIOx_FUN_WPD ... to enable or disable' and Register 5.21 IO_MUX_GPIOn_REG (n: 0-21) IO_MUX_GPIOn_FUN_WPU (p.187). Not listed: CHIP_PU (reset) and supply pads"
[models.pin_capability.pull_up.pads]
"6" = "GPIO2: IO_MUX_GPIO2_REG FUN_WPU = 1 (internal pull-up)"
"14" = "GPIO8: IO_MUX_GPIO8_REG FUN_WPU = 1 (internal pull-up)"
"15" = "GPIO9: IO_MUX_GPIO9_REG FUN_WPU = 1 (internal pull-up)"
"28" = "GPIO21: IO_MUX_GPIO21_REG FUN_WPU = 1 (internal pull-up)"
"27" = "GPIO20: IO_MUX_GPIO20_REG FUN_WPU = 1 (internal pull-up)"

[models.ratings]
max_pin_current_a = 0.04
max_current_a = 0.4
# ESP32-C3 Series Datasheet v2.4 Table 5-1 Absolute Maximum Ratings, input power pins
# -0.3 to 3.6 V; Table 5-2 recommends 3.0-3.6 V on VDD3P3_CPU, the same ceiling.
max_voltage_v = 3.6

# Same strap table and citations as esp32c3_mini1.
[[models.straps]]
role = "gpio9"
level = "high"
boot_select = true
internal_pull = "pull_up"   # Table 3-1: GPIO9 default weak pull-up
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO9 (BOOT) high = SPI boot (normal); low = download boot"

[[models.straps]]
role = "gpio8"
level = "high"
# ESP32-C3 Series Datasheet v2.4 Table 3-1: GPIO8 default "Floating" (no
# internal pull at reset). Table 3-3: SPI boot takes any GPIO8 level; Joint
# Download Boot (GPIO9 = 0) needs GPIO8 = 1. So a float matters only when the
# board can pull GPIO9 low.
internal_pull = "none"
only_with = "gpio9"
note = "ESP32-C3 datasheet Table 3-3: Joint Download Boot (GPIO9 low) needs GPIO8 = 1; SPI boot takes any GPIO8 level; Table 3-1: GPIO8 has no internal pull at reset"

[[models.straps]]
role = "gpio2"
level = "high"
note = "GPIO2 must be high at reset"

# ─────────────────────────────────────────────────────────────────────────────
# ESP32-C6-MINI-1 / -1U module (-N4 / -H4 / -H8 flash and temperature
# variants), 53 pads: ESP32-C6FH4/FH8 (RISC-V) with in-package flash.
#
# Source: Espressif ESP32-C6-MINI-1 & MINI-1U Datasheet v1.5 (2026-06-16).
#   Tables 1-1/1-2 Series Comparison (the -N4/-H4/-H8 part numbers differ only
#   in flash size and ambient temperature); 3.1 Figure 3-1, "applicable for
#   ESP32-C6-MINI-1 and ESP32-C6-MINI-1U" (one pad map for both); Table 3-1 Pin
#   Definitions; Table 4-3 Chip Boot Mode Control; Table 6-1 Absolute Maximum
#   Ratings; Table 6-2 Recommended Operating Conditions; Table 6-3 DC
#   Characteristics.
#
# BACKEND IS `none:`: no co-sim emulator exists for the ESP32-C6, so co-sim is
# refused loudly (the binder's family router also names ESP32-C6 as a family
# with no platform); lint, strap, envelope and rating checks read the pad map.
# The 3V3 pad is `vdd`, as on the other ESP32 module cards, because the strap
# lint scales VIL/VIH from the `vdd` role. No per-pin or package current rating
# is set: Table 6-1 lists only VDD33, and Table 6-3 gives IOH/IOL as typical
# drive strengths, not limits.

