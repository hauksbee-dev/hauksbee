# ─────────────────────────────────────────────────────────────────────────────
# ATmega1284, the non-P part. Same datasheet, same 44-pad map, DIFFERENT simavr
# core, and that last difference is the only reason this is a separate entry.
#
# Source: as the ATmega1284P entry above (Atmel-42719C-ATmega1284P_Datasheet_
#   Complete-10/2016), whose title covers both devices; section 5.1.2 for the pad
#   map and Table 29-1 for the ratings.
#
# WHY NOT ONE ENTRY WITH ONE BACKEND. Nothing would tell the user. The scheduler's
# `detect_substitution` deliberately returns None for every `simavr:` backend,
# because the premise of that path is that simavr models the part it is handed; so
# a shared entry naming `simavr:atmega1284p` would run a non-P board's firmware on
# a P core with no warning anywhere in the report. The two parts differ in their
# picoPower sleep behaviour and in fuse defaults rather than in anything this pad
# map carries, but "the difference is small" is not the same as "the difference is
# disclosed", and one extra entry costs nothing.
[[models]]
id = "atmega1284"
kind = "mcu"
description = "ATmega1284 (non-P) 8-bit AVR MCU, 44-lead TQFP or 44-pad VQFN/MLF"

[models.match]
# The bare part and its HYPHENATED ordering codes. The hyphen is what separates
# these from the CAD-library device names ("ATMEGA1284M", "ATMEGA1284A"), which the
# entry above claims for the reason set out there; and this regex has no optional
# `P`, so no P spelling can reach it.
#
# `PU` is absent here for the same reason as in the entry above, and it matters
# identically: the ordering code says 40-pin PDIP and this map is the 44-pad one.
value_re = "(?i)^ATmega1284(-(AU|MU|AUR|MUR))?$"

[models.params]
# DS40002070A Table 9-3 (p.41, Low Power Crystal Oscillator, 0.9 - 16 MHz) and Table 9-5 (p.42, Full Swing Crystal Oscillator, 0.4 - 20 MHz): "Recommended Range for Capacitors C1 and C2 [pF]" 12 - 22
# (the 0.4 - 0.9 MHz low power row prints a dash).
xtal_cap_min_f = 12.0e-12
xtal_cap_max_f = 22.0e-12
# The non-P core, which simavr models separately from the P.
backend = "simavr:atmega1284"
internal_clock = "internal 8 MHz RC oscillator"
default_clock_hz = 8000000

[models.pins]
# Identical to the ATmega1284P entry above: one datasheet, one pinout figure.
"1"  = "pb5_mosi"
"2"  = "pb6_miso"
