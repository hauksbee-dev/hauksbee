basis = "ESP32-C3 Series Datasheet v2.4 PDF p.31 (section 3.1 Chip Boot Mode Control): \"In Joint Download Boot mode, users can download binary files into flash using UART0 or USB interface.\"; PDF p.17 Table 2-1 Pin Overview (QFN32): pin 27 \"U0RXD\"; PDF p.20 pin-function table: \"27 GPIO20 U0RXD\"; ESP32-C3 TRM v1.4 PDF p.555 (UART chapter, 26.4.4 UART Data Frame): \"The START bit is logical low, whereas STOP bits are logical high.\"; same page: \"The receiver can also detect the Break conditions when the RX data line remains logical low for one NULL character transmission\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

