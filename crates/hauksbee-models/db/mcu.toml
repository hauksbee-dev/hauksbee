# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   AN2606 Rev 70 (February 2026), https://www.st.com/resource/en/application_note/an2606-stm32-microcontroller-system-memory-boot-mode-stmicroelectronics.pdf sha256 25b466e39ecc61671dcb988d8ca538462d6452d85f68140cb981ed728f57e654;
#   AN3155 Rev 22 (September 2026), https://www.st.com/resource/en/application_note/an3155-usart-protocol-used-in-the-stm32-bootloader-stmicroelectronics.pdf sha256 0e3e1c35ffa3311aba33440d9d6236dc2f59af8a7f32482cf13d1d0af8c5e1f9;
#   RM0410 Rev 5 (https://www.st.com/resource/en/reference_manual/rm0410-stm32f76xxx-and-stm32f77xxx-advanced-armbased-32bit-mcus-stmicroelectronics.pdf) sha256 104ed7394d65bf5cfdfec31e063cf412ba58985973fe5ed72c93fd9735dfdb64.

[[models.pin_bias]]
role = "pa10"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 103 (STM32F76xxx/77xxx configuration in system memory boot mode) PDF p.244, USART1_RX pin: \"PA10 pin: USART1 in reception mode. Used in input no pull mode.\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0410 Rev 5 PDF p.1237 section 34.5.1 USART character description: \"By default, the signal (TX or RX) is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\" AN2606 Rev 70 Figure 1 note 1, PDF p.47: \"A pull-up resistor must be added, if they are not connected on host side\"; section 4.3, PDF p.49: \"It is recommended to keep the RX pins of unused bootloader interfaces (USART_RX, SPI_MOSI, and CAN_RX, if present) at a known (low or high) level\"."
note = "The ROM bootloader detects a USART host by the start bit of its 0x7F frame, so a pull-down or a tie to ground on this pin holds the line in the break state and the bootloader cannot detect a host on this USART (its other interfaces still work). AN2606 allows an unused bootloader RX pin at either known level, so this matters only when the board is flashed over this USART; a missing bias is not reported, only one the wrong way round."

[[models.pin_bias]]
role = "pb11"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 103 (STM32F76xxx/77xxx configuration in system memory boot mode) PDF p.244, USART3_RX pin (USART3 on PB11/PB10): \"PB11 pin: USART3 in reception mode. Used in input pull-up mode\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0410 Rev 5 PDF p.1237 section 34.5.1 USART character description: \"By default, the signal (TX or RX) is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

[[models.pin_bias]]
role = "pc11"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 103 (STM32F76xxx/77xxx configuration in system memory boot mode) PDF p.245, USART3_RX pin (USART3 on PC11/PC10): \"PC11 pin: USART3 in reception mode. Used in input pull-up mode.\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0410 Rev 5 PDF p.1237 section 34.5.1 USART character description: \"By default, the signal (TX or RX) is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

[models.pin_capability.reset_mode]
basis = "RM0410 (STM32F76xxx/F77xxx reference manual), section 6.3.1 GPIO: during and just after reset most I/O are input floating, except PA15 JTDI pull-up, PA14 JTCK/SWCLK pull-down, PA13 JTMS/SWDAT pull-up, PB4 NJTRST pull-up (PDF p.224); GPIOA_PUPDR reset 0x6400 0000, GPIOB_PUPDR 0x0000 0100, section 6.4.4 (PDF p.232)"
