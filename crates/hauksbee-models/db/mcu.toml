[[models]]
id = "nrf52840"
kind = "mcu"
description = "Nordic nRF52840 (Cortex-M4F) SoC"

[models.match]
value_re = "(?i)^nRF52840"
mpn_re   = "(?i)^nRF52840"

[models.params]
# Renode backend: brings up nrf52840.repl. nRF GPIO is two 32-bit ports
# (gpio0/gpio1); roles "p0<bit>" map port '0', "p1<bit>" map port '1'.
backend = "renode:nrf52840"
internal_clock = "internal 64 MHz HFINT RC oscillator"

[models.pins]
# Minimal demo map; only the wired pads carry roles. P0.13 is the nRF52840-DK
# LED1; UART on P0.06 (TXD) / P0.08 (RXD).
"1"  = "vss"
"2"  = "vdd"
"3"  = "p013"       # LED / alive indicator into the analog circuit
"4"  = "p014"       # blink
"5"  = "p006_txd"   # UART TXD
"6"  = "p008_rxd"   # UART RXD

[models.pin_capability.adc]
basis = "Nordic nRF52840 Product Specification v1.7, aQFN73 pin assignments (PDF pp.578-579): the analogue inputs are AIN0 P0.02, AIN1 P0.03, AIN2 P0.04, AIN3 P0.05, AIN4 P0.28, AIN5 P0.29, AIN6 P0.30, AIN7 P0.31; P0.06, P0.08, P0.13 and P0.14, the pads of [models.pins], are not among them"
[models.pin_capability.adc.pads]
[models.pin_capability.pull_up]
basis = "Nordic nRF52840 Product Specification v1.7 (4413_417 v1.7, 2021-11-30; sha256 f43354b2be1d5558e9e409787a940b16322d2d560da87b33f6206361bbc1469a), section 6.9 GPIO (p.152) 'Internal pull-up and pull-down resistors ... Enabling of pull-up and pull-down resistors'; section 6.9.2.10 PIN_CNF[n] field C PULL value Pullup = 3 'Pull up on pin' (p.158); electrical table RPU pull-up resistance 11/13/16 kOhm min/typ/max (p.159). Not listed: the supply pads; the card's pad map has no NFC (P0.09/P0.10), USB D+/D- or SWD pads"
[models.pin_capability.pull_up.pads]
"3" = "P0.13: GPIO P0 PIN_CNF[13].PULL = 3 (Pullup)"
"4" = "P0.14: GPIO P0 PIN_CNF[14].PULL = 3 (Pullup)"
"5" = "P0.06: GPIO P0 PIN_CNF[6].PULL = 3 (Pullup)"
"6" = "P0.08: GPIO P0 PIN_CNF[8].PULL = 3 (Pullup)"

# In High Voltage mode (supply on VDDH only, VDD not connected to any supply)
# VDD is the REG0 regulator's OUTPUT, decoupled on the board and free to feed
# external circuitry; in Normal Voltage mode it is the supply input.
[[models.optional_supplies]]
role = "vdd"
basis = "Nordic nRF52840 Product Specification v1.7 (4413_417, 2021-11-30), 5.3.1 Main supply (p.64): the system enters High Voltage mode when the supply voltage is connected only to VDDH and the VDD pin is not connected to any voltage supply; 5.3.1.1 (p.65): the REG0 output voltage is connected to VDD; 5.3.1.3 External circuitry supply (p.65): in High Voltage mode the output from REG0 can supply external circuitry from the VDD pin; Figure 17 (p.67) High Voltage mode, LDO only"

[models.ratings]
max_pin_current_a = 0.015
max_current_a = 0.1
max_voltage_v = 3.9   # nRF52840 PS, Absolute maximum ratings, VDD -0.3 to +3.9 V (VDDH/VBUS are 5.8 V)

# The 1.7-3.6 V recommended VDD range is the check that fires below the 3.9 V abs max.
[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.7
max_v = 3.6
abs_max_v = 3.9
basis = "Nordic nRF52840 Product Specification (docs.nordicsemi.com ps_nrf52840), Recommended operating conditions, VDD supply voltage 1.7 V to 3.6 V; Absolute maximum ratings, VDD -0.3 V to +3.9 V"

# Output stage per PIN_CNF.DRIVE mode. nRF52840 PS v1.7 section 6.9.3.1 PDF p.159: IOL,SD /
# IOH,SD min 1 mA at 0.4 V (VDD >= 1.7 V), IOL,HDH / IOH,HDH min 6 mA at 0.4 V (VDD >= 2.7 V).
# Modes per section 6.9.2.10 PDF p.158-159: S0S1=0, H0S1=1, S0H1=2, H0H1=3, D0S1=4, D0H1=5,
# S0D1=6, H0D1=7 ('0' is the pin driven low, '1' high; D = disconnected). S0S1 is the reset
# default. Points are at VDD 3.0 V (the typical supply, section 5.3.8.1 PDF p.83).
[[models.output_drive]]
setting = "S0S1"
selector = 0
reset_default = true   # S0S1 is the default DRIVE setting at reset (PS v1.7 p.57, PIN_CNF reset 0x00000002)
vdd = 3.0
points = [
  { level = "high", current_a = 0.001, volts = 2.6 },
  { level = "low", current_a = 0.001, volts = 0.4 },
]
basis = "nRF52840 Product Specification v1.7 section 6.9.3.1 GPIO Electrical Specification PDF p.159: standard drive guarantees IOL/IOH of 1 mA at VSS+0.4 V / VDD-0.4 V (VDD >= 1.7 V); high drive guarantees 6 mA (VDD >= 2.7 V). The minimum column is used (typ 2 mA / 10 mA / 9 mA is better than the bound)"

[[models.output_drive]]
setting = "H0S1"
selector = 1
vdd = 3.0
points = [
  { level = "high", current_a = 0.001, volts = 2.6 },
  { level = "low", current_a = 0.006, volts = 0.4 },
]
basis = "nRF52840 Product Specification v1.7 section 6.9.3.1 GPIO Electrical Specification PDF p.159: standard drive guarantees IOL/IOH of 1 mA at VSS+0.4 V / VDD-0.4 V (VDD >= 1.7 V); high drive guarantees 6 mA (VDD >= 2.7 V). The minimum column is used (typ 2 mA / 10 mA / 9 mA is better than the bound)"

[[models.output_drive]]
setting = "S0H1"
selector = 2
vdd = 3.0
points = [
  { level = "high", current_a = 0.006, volts = 2.6 },
  { level = "low", current_a = 0.001, volts = 0.4 },
]
basis = "nRF52840 Product Specification v1.7 section 6.9.3.1 GPIO Electrical Specification PDF p.159: standard drive guarantees IOL/IOH of 1 mA at VSS+0.4 V / VDD-0.4 V (VDD >= 1.7 V); high drive guarantees 6 mA (VDD >= 2.7 V). The minimum column is used (typ 2 mA / 10 mA / 9 mA is better than the bound)"

[[models.output_drive]]
