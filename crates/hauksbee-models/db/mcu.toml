[models.coverage]
implements = ["xtensa_lx6_firmware_execution", "boot_to_application", "gpio_output_register_or_mailbox_observation", "uart_tx", "wall_bounded_virtual_time", "gpio_input_mailbox_contract", "adc_input_mailbox_contract", "i2c_spi_mailbox_contract", "tmp105_temperature_injection"]
missing = ["instruction_counted_timing", "unmodified_firmware_gpio_input", "native_adc_peripheral", "unmodified_firmware_i2c_spi_observation", "watchdog_behavior", "silicon_power_current_profile", "silicon_timing_and_errata"]

[[models]]
id = "esp32_qfn48"
kind = "mcu"
description = "Espressif ESP32 classic bare chip, QFN48 (5x5 or 6x6 mm)"

[models.match]
value_re = "(?i)^ESP32(-D0WD.*)?$"
footprint_re = '(?i)(^|:)V?QFN[-_]?48([-_]1EP)?[-_][56]x[56]mm'

[models.params]
backend = "qemu:esp32"

[models.pins]
# ESP32 Series Datasheet v5.3, Table 2-1 "Pin Overview" and Table 2-3 "Power
# Pins": MTDI/GPIO12 = 18, VDD3P3_RTC = 19 (supplies the RTC IOs, GPIO0
# included), MTDO/GPIO15 = 21, GPIO2 = 22, GPIO0 = 23, GPIO4 = 24, GPIO5 = 34,
# U0RXD = 40, U0TXD = 41, GND = 49 (exposed pad).
"19" = "vdd"
"49" = "vss"
"23" = "gpio0"
"22" = "gpio2"
"34" = "gpio5"
"18" = "gpio12"
"9"  = "en"          # CHIP_PU (Table 2-1 pin 9): the reset the chip leaves to start
"24" = "gpio4"       # Table 2-1 pin 24
"21" = "gpio15"
"41" = "p01_txd"
"40" = "p03_rxd"

[models.pin_capability.adc]
basis = "Espressif ESP32 Datasheet v5.3, Table 2-1 Pin Overview (PDF pp.14-15: pad 18 MTDI and pad 21 MTDO on p.14; pads 22 GPIO2, 23 GPIO0 and 24 GPIO4 on p.15) and Table 4-6 Peripheral Pin Configurations (PDF p.46): MTDI/GPIO12 ADC2_CH5, MTDO/GPIO15 ADC2_CH3, GPIO2 ADC2_CH2, GPIO0 ADC2_CH1, GPIO4 (pad 24) ADC2_CH0; GPIO5 and the UART pads carry none. ADC2 is not usable while Wi-Fi runs (ESP-IDF note)"
[models.pin_capability.adc.pads]
"18" = "ADC2_CH5"
"21" = "ADC2_CH3"
"22" = "ADC2_CH2"
"23" = "ADC2_CH1"
"24" = "ADC2_CH0 (GPIO4)"
[models.pin_capability.pull_up]
basis = "ESP32 chip, QFN 5x5 48-pin: pad-to-GPIO mapping from the ESP32 Series Datasheet v5.3 section 2.2 Pin Overview (pp.14-15; sha256 a7917e6b47528c9dcab06837a49d452e582751335797db879f1cf2d17cd29adf). Espressif ESP32 Series Datasheet v5.3 (sha256 a7917e6b47528c9dcab06837a49d452e582751335797db879f1cf2d17cd29adf) section 4.8.1 GPIO (p.36) 'Most of the digital GPIOs can be configured as internal pull-up or pull-down'; Appendix A p.62 'The drive strength of the internal pull-up (wpu) and pull-down (wpd) is ~75 uA'; section 2.3.1 (p.17) that the input-only GPIO34-39 lack pull-up/pull-down resistors. ESP32 Technical Reference Manual v5.8 (sha256 4ba58e9fa0405ec2bf80b912a29b483f6edc8c4b2b1058201913a2fe37e582f0) section 6.1 Figure 6.1-2 pad WPU (p.116); section 6.2.2 step 3 (p.118) 'Set or clear the FUN_WPU and FUN_WPD bits ... to enable/disable internal pull-up/pull-down resistors'; Table 6.10-1 (p.133) lists the pad registers; Register 6.34 IO_MUX_x_REG (x: 0-19, 21-23, 25-27, 32-39) FUN_WPU (p.149) 'GPIO pins 34-39 ... do not feature ... internal pull-up/pull-down circuitry'. Not listed: CHIP_PU (reset) and the supply pads"
[models.pin_capability.pull_up.pads]
"23" = "GPIO0: IO_MUX_GPIO0_REG FUN_WPU = 1 (internal pull-up)"
"22" = "GPIO2: IO_MUX_GPIO2_REG FUN_WPU = 1 (internal pull-up)"
"34" = "GPIO5: IO_MUX_GPIO5_REG FUN_WPU = 1 (internal pull-up)"
"18" = "GPIO12: IO_MUX_GPIO12_REG FUN_WPU = 1 (internal pull-up)"
"21" = "GPIO15: IO_MUX_GPIO15_REG FUN_WPU = 1 (internal pull-up)"
"41" = "GPIO1: IO_MUX_GPIO1_REG FUN_WPU = 1 (internal pull-up)"
"40" = "GPIO3: IO_MUX_GPIO3_REG FUN_WPU = 1 (internal pull-up)"

# Same die and strap table as esp32_wroom (same citations).
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = SPI boot (normal); low = download/UART boot"

[[models.straps]]
role = "gpio2"
level = "low"
note = "GPIO2 must be low or floating at reset; tie-high blocks download mode"

[[models.straps]]
role = "gpio12"
level = "low"
note = "MTDI/GPIO12 selects VDD_SDIO flash voltage: low = 3.3 V (normal), high = 1.8 V"

[[models.straps]]
role = "gpio15"
level = "high"
note = "MTDO/GPIO15 high (normal) silences boot log on U0TXD; low enables it"

[models.ratings]
# ESP32 Series Datasheet v5.3, Table 5-1 "Absolute Maximum Ratings" (p. 51):
# VDDA, VDD3P3, VDD3P3_RTC, VDD3P3_CPU, VDD_SDIO allowed input voltage -0.3 to
# 3.6 V. Table 5-2 recommends up to the same 3.6 V.
max_voltage_v = 3.6

[models.coverage]
implements = ["xtensa_lx6_firmware_execution", "boot_to_application", "gpio_output_register_or_mailbox_observation", "uart_tx", "wall_bounded_virtual_time", "gpio_input_mailbox_contract", "adc_input_mailbox_contract", "i2c_spi_mailbox_contract", "tmp105_temperature_injection"]
missing = ["instruction_counted_timing", "unmodified_firmware_gpio_input", "native_adc_peripheral", "unmodified_firmware_i2c_spi_observation", "watchdog_behavior", "silicon_power_current_profile", "silicon_timing_and_errata"]

