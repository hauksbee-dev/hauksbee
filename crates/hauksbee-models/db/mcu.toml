# ESP32-C6-MINI-1 & MINI-1U Datasheet v1.5: Table 3-1 Pin Definitions p.11 (continued), EN pad 8 "High: on,
# enables the chip. Low: off, the chip powers off. Note: Do not leave the EN pin floating." Figure 8-1
# ESP32-C6-MINI-1 Schematics p.38 shows CHIP_EN wired straight to module pad 8 with no pull-up on the module.
[[models.straps]]
role = "en"
level = "high"
boot_select = false
internal_pull = "none"
note = "EN (CHIP_PU) high = chip enabled, low = chip off; the module has no on-board pull on EN, so an undriven net floats"

[models.ratings]
max_voltage_v = 3.6       # Table 6-1, VDD33 -0.3 to 3.6 V

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 3.0
max_v = 3.6
abs_max_v = 3.6
basis = "ESP32-C6-MINI-1 & MINI-1U Datasheet v1.5, Table 6-2 VDD33 3.0-3.6 V; Table 6-1 VDD33 max 3.6 V"

# Table 4-3: GPIO9 = 1 selects SPI boot whatever GPIO8 is; GPIO9 = 0 with
# GPIO8 = 1 selects joint download boot. Table 4-1: GPIO9 has a weak pull-up,
# GPIO8 floats (it matters only for download boot, so no level is asserted).
[[models.straps]]
role = "gpio9"
level = "high"
boot_select = true   # latches SPI-vs-download boot
internal_pull = "pull_up"   # Table 4-1: GPIO9 default weak pull-up
# Table 6-3: VIL max 0.25 x VDD, VIH min 0.75 x VDD.
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO9 (BOOT) high = SPI boot (normal); low with GPIO8 high = download boot"

[models.coverage]
implements = ["pad_map", "supply_envelope", "boot_strap_levels"]
missing = ["firmware_cosim_core", "gpio_behaviour", "uart", "usb_serial_jtag", "pin_and_package_current_ratings"]
[models.pin_capability.routed]
basis = "Espressif ESP32-C6 Series Datasheet v1.5 (PDF page = printed page), Section 4.1.3.1 IO MUX and GPIO Matrix (p.41): 'Routing 85 peripheral input and 93 output signals to any GPIO pin'; Section 2.3.5 Peripheral Pin Assignment, Table 2-10 QFN40 and Table 2-11 QFN32 (p.25-27; their UART0, SPI2, UART1, I2C, LED PWM, MCPWM and RMT columns list GPIOn (P2/P3) on the GPIO pads): 'Any GPIO pins mapping to peripheral signals via GPIO Matrix, can be priority 2, 3, or 4', footnote 2 'Signals of UART0, SPI0/1, and SPI2 interfaces can be mapped to any GPIO pins through the GPIO Matrix, regardless of whether they are directly routed to fixed pins via IO MUX', and a peripheral without priority 1 pins, such as UART1, 'can be assigned to any GPIO pins'. ESP32-C6 Technical Reference Manual v1.2 (PDF page = printed page), Chapter 7 IO MUX and GPIO Matrix, Section 7.11 Table 7.11-1 Peripheral Signals via GPIO Matrix (p.257-260): U0TXD_out/U0RXD_in/U1TXD_out/U1RXD_in and ledc_ls_sig_out0 (p.257), I2CEXT0_SCL/SDA in/out (p.258), FSPICLK/FSPID/FSPIQ in/out (SPI2, p.259), pwm0_cap0_in~pwm0_cap2_in (MCPWM capture inputs, p.260); the MCPWM peripheral has a capture module with three capture channels, each with a 32-bit time-stamp register (ESP32-C6 Datasheet p.55-56), which is the timer input-capture channel. hardware peripheral only, a software (bit-banged) implementation can use any pad Module datasheet: ESP32-C6-MINI-1 & MINI-1U Datasheet v1.5, Section 5.1 (p.17) lists MCPWM and LED PWM and points to the TRM Peripheral Signal List."
functions = ["spi_sck", "spi_mosi", "spi_miso", "i2c_sda", "i2c_scl", "uart_tx", "uart_rx", "pwm", "timer_capture"]


# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   ESP32-C6-MINI-1 Datasheet v1.5 (https://www.espressif.com/sites/default/files/documentation/esp32-c6-mini-1_mini-1u_datasheet_en.pdf) sha256 26691033f31cbebf623842c16624e61151b152533c13a850c091c8e858c510a2;
#   ESP32-C6 Technical Reference Manual v1.2 (https://www.espressif.com/sites/default/files/documentation/esp32-c6_technical_reference_manual_en.pdf) sha256 e08d5b61ebcfa2a78f9735e3f721817cb1dc2df9cf05096d2f0399eaba9f1734.
[[models.pin_bias]]
role = "gpio17_rxd0"
level = "high"
needs = "idle"
opposed_only = true
basis = "ESP32-C6 TRM v1.2 PDF p.375 (section 9.2.2 Boot Mode Control): \"In Download Boot mode, users can download code into flash using UART0 or USB interface.\"; ESP32-C6-MINI-1 Datasheet v1.5 PDF p.11 Table 3 Pin Definitions: \"RXD0 30 I/O/T U0RXD, GPIO17, FSPICS1\"; ESP32-C6 TRM v1.2 PDF p.737 (UART chapter, 27.4.4 UART Data Frame): \"The start bit is logical low, whereas stop bits are logical high.\"; same page: \"The receiver can also detect the Break conditions when the RX data line remains logical low for one NULL character transmission\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

[models.pin_capability.reset_mode]
basis = "ESP32-C6 Series Datasheet v1.5, Table 2-1 QFN40 Pin Overview, column 'At Reset' (PDF pp.16-17): IE, WPU on GPIO9; WPU on SPICS0, SPIQ, SPIWP, SPIHD, SPICLK, SPID (GPIO24-GPIO26, GPIO28-GPIO30) and SDIO_CMD, SDIO_CLK, SDIO_DATA0-3 (GPIO18-GPIO23); GPIO13 shows USB_PU only and U0TXD/U0RXD (GPIO16/GPIO17) are blank at reset (WPU only after reset), so they are left out; the other pads have IE or nothing, no pull; USB_PU on GPIO13 (USB_D+), which Note 4 (PDF p.18) explains: the USB Serial/JTAG function is on by default and its USB pull-up sets the pin's pull, so GPIO13 is pulled up during reset"
[models.pin_capability.reset_mode.pads]
"18" = "pull_up"  # gpio13_usb_dp
"23" = "pull_up"  # gpio9
"24" = "pull_up"  # gpio18
"25" = "pull_up"  # gpio19
"26" = "pull_up"  # gpio20
"27" = "pull_up"  # gpio21
"28" = "pull_up"  # gpio22
"29" = "pull_up"  # gpio23

# ─────────────────────────────────────────────────────────────────────────────

# ESP32-S3-MINI-1 / -1U module (65 pads; -N8 / -N4R2 / -H4R2 variants).
# Source: Espressif ESP32-S3-MINI-1 & MINI-1U Datasheet v1.7, Table 3-1 Pin
# Definitions (PDF pp.11-12), Table 6-1/6-2/6-3 (VDD33 maximum 3.6 V, recommended
# 3.0-3.6 V, VIH min 0.75 x VDD, VIL max 0.25 x VDD). One pad map for the -1 and
# the -1U (same table). The pad numbers are the module's, NOT the bare chip's or
# the WROOM-1's: the WROOM-1 numbers the same GPIOs on other pads, so a card for
# either does not describe this footprint (see the PAD MAPS ARE PER PACKAGE note
# above). tests/suite/module_pad_tables/esp32_s3_mini_1.tsv is the datasheet table
# this map is checked against pad by pad.
[[models]]
id = "esp32s3_mini1"
kind = "mcu"
description = "Espressif ESP32-S3-MINI-1/-1U module, 65 pads"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.espressif.com/sites/default/files/documentation/esp32-s3-mini-1_mini-1u_datasheet_en.pdf"
title = "Espressif ESP32-S3-MINI-1 & MINI-1U Datasheet v1.7"
locator = "Table 3-1 Pin Definitions (PDF pp.11-12); Table 6-1 Absolute Maximum Ratings; Table 6-2 Recommended Operating Conditions; Table 6-3 DC Characteristics; Section 4 Boot Configurations"
sha256 = "4d4b7f1c17b484c627aaa0f806566c48a6124a8e466c6d21d99210e6eacdef04"

[models.match]
value_re = "(?i)^ESP32[-_ ]?S3[-_ ]?MINI[-_ ]?1(U|/U)?([-_ ]?(N\\d+(R\\d+)?|H\\d+R\\d+))?$"

[models.params]
backend = "qemu:esp32s3"
# Table 3-1: EN (pad 45) "Low: off, the chip powers off. Note: Do not leave the
