# Atmel ATmega16U4/32U4 datasheet 7766J (04/2016), section 24 (ADC) and section 29 Table 29-7 (ADC Characteristics). Printed page numbers. The ADHSM bit allows a higher ADC clock at the expense of power, and the datasheet gives no upper clock limit in Table 29-7, so none is recorded.
[models.peripherals.adc]
source = "https://ww1.microchip.com/downloads/en/DeviceDoc/Atmel-7766-8-bit-AVR-ATmega16U4-32U4_Datasheet.pdf"
source_sha256 = "8e8c81dd4119062397bc08d677e7033d7abb4292628414c4e6e0a234cc53203a"
resolution_bits = [10]
basis = "Atmel ATmega16U4/32U4 datasheet 7766J (04/2016), ADC: features (p.297), section 24.4 (p.300), Table 24-1 (p.302), section 24.7.1 (pp.305-306), Table 24-5 (p.316), Table 29-7 (p.390)"

[models.peripherals.adc.clock]
source = "system clock divided by the ADPS[2:0] prescaler"
prescalers = [2, 4, 8, 16, 32, 64, 128]
min_hz = 50000.0
full_resolution_min_hz = 50000.0
full_resolution_max_hz = 200000.0
basis = "Table 24-5 (p.316): ADPS 000 and 001 both divide by 2, then 4, 8, 16, 32, 64, 128; section 24.4 (p.300): an input clock between 50 kHz and 200 kHz gives maximum resolution, a higher clock is allowed for lower resolution, and ADHSM allows an increased clock"

[[models.peripherals.adc.conversions]]
mode = "first_after_enable"
resolution_bits = 10
sample_cycles = [14.5]
total_cycles = 25.0
basis = "Table 24-1 (p.302) ADC conversion time, 'First Conversion': sample and hold at 14.5 cycles from start of conversion, conversion time 25 cycles"

[[models.peripherals.adc.conversions]]
mode = "normal"
resolution_bits = 10
sample_cycles = [1.5]
total_cycles = 13.0
basis = "Table 24-1 (p.302) ADC conversion time, 'Normal Conversion, Single Ended': sample and hold at 1.5 cycles from start of conversion, conversion time 13 cycles"

[[models.peripherals.adc.conversions]]
mode = "auto_triggered"
resolution_bits = 10
sample_cycles = [2.0]
total_cycles = 13.5
basis = "Table 24-1 (p.302) ADC conversion time, 'Auto Triggered Conversion': sample and hold at 2 cycles from start of conversion, conversion time 13.5 cycles"

[[models.peripherals.adc.max_sample_rate]]
resolution_bits = 10
max_hz = 15000.0
condition = "maximum resolution (ADC clock 50-200 kHz)"
basis = "section 24 features (p.297): 'Up to 15kSPS at Maximum Resolution'"

[models.peripherals.adc.input]
sample_cap_f = 1.4e-11
input_series_ohms_min = 1000.0
input_series_ohms_max = 100000.0
max_source_ohms = 10000.0
basis = "Figure 24-9 (p.306): series 1..100 kOhm into CS/H = 14 pF; section 24.7.1 (p.306): optimised for an output impedance of approximately 10 kOhm or less"

[[models.peripherals.adc.accuracy]]
resolution_bits = 10
adc_clock_hz = 200000.0
abs_error_lsb = 2.0
column = "typ"
condition = "VREF = 4 V, VCC = 4 V, ADC clock = 200 kHz; absolute accuracy including INL, DNL, quantization, gain and offset error; TUE, single ended"
basis = "Table 29-7 (p.390) ADC characteristics, Absolute accuracy, Typ column"

[[models.peripherals.adc.accuracy]]
resolution_bits = 10
adc_clock_hz = 200000.0
abs_error_lsb = 3.0
column = "max"
condition = "VREF = 4 V, VCC = 4 V, ADC clock = 200 kHz; absolute accuracy including INL, DNL, quantization, gain and offset error; TUE, single ended"
basis = "Table 29-7 (p.390) ADC characteristics, Absolute accuracy, Max column"

[models.pin_capability.adc]
basis = "Atmel-7766J-USB-ATmega16U4/32U4-Datasheet_04/2016, section 1 Pin Configurations Figure 1-1 (PDF p.3) and the port F pin list (PDF p.307): ADC0, ADC1, ADC4-ADC7 on PF0, PF1, PF4-PF7; ADC8-ADC13 on PD4, PD6, PD7, PB4, PB5, PB6; the pad to port map is this card's [models.pins] (SparkFun Pro Micro)"
[models.pin_capability.adc.pads]
"7" = "ADC8"
"9" = "ADC10"
"11" = "ADC11"
"12" = "ADC12"
"13" = "ADC13"
"17" = "ADC7"
"18" = "ADC6"
"19" = "ADC5"
"20" = "ADC4"

# The module powers itself from its own USB connector (UVCC through F1 and D2
# to the RAW rail, then the MIC5219 regulator U2), and VCC is that regulator's
# OUTPUT on the header (a pad the host board may use, or leave open or on a
# capacitor).
[[models.optional_supplies]]
role = "vcc"
basis = "SparkFun Pro Micro v13 schematic (Pro_Micro.sch, EAGLE 7.4.0, dated 7/7/15, sheet 1/1): the USB connector's UVCC feeds RAW through fuse F1 and diode D2 into regulator U2 (MIC5219), whose OUT is the VCC net on header JP6 ('VCC = 5V or 3.3V Output, Max Current Output: 500mA'; SJ1 closed bypasses U2 on the 5 V board)"

[models.ratings]
# Section 29.1 Absolute Maximum Ratings, ATmega32U4.
max_pin_current_a = 0.04  # DC current per I/O pin, 40.0 mA
max_current_a = 0.2       # DC current VCC and GND pins, 200.0 mA
max_voltage_v = 6.0       # Abs max row "Maximum Operating Voltage"; NOT the 5.5 V recommended ceiling

# The recommended range; max_voltage_v above is the abs max, so a supply
# between the two raises the operating-envelope finding.
[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.7
max_v = 5.5
abs_max_v = 6.0
basis = "Atmel-7766J ATmega16U4/32U4 datasheet, Features, Operating Voltages 2.7-5.5 V; Section 29.1 Absolute Maximum Ratings, Maximum Operating Voltage 6.0 V"

# ─────────────────────────────────────────────────────────────────────────────
# Bare ATmega32U4 (44-lead TQFP and 44-pad QFN/MLF share one pinout).
#
# Source: Atmel-7766J-USB-ATmega16U4/32U4-Datasheet_04/2016, page 3, Figure 1-1
#   "Pinout" (44-pin QFN/TQFP),
#   https://ww1.microchip.com/downloads/en/DeviceDoc/Atmel-7766-8-bit-AVR-ATmega16U4-32U4_Datasheet.pdf
#   ADC channels per section 1.1 (PF0/PF1/PF4..PF7 = ADC0/1/4..7, PD4 = ADC8,
#   PD6 = ADC9, PD7 = ADC10, PB4..PB6 = ADC11..13).
#
# The pro_micro entry above is the same silicon behind a 24-pin header; this one
# is the chip itself, clocked by its fuses, a bound crystal, or the card's
# `default_clock_hz` (8 MHz RC) when neither is stated.
# The USB device controller is not modelled.
[[models]]
id = "atmega32u4"
kind = "mcu"
description = "ATmega32U4 8-bit AVR MCU with USB, TQFP-44 or QFN-44"

[models.match]
value_re = "(?i)^ATmega32U4([-_]?(AU|MU|AUR|MUR|RC))?$"

