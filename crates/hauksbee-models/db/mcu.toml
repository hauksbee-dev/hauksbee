# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   AN2606 Rev 70 (February 2026), https://www.st.com/resource/en/application_note/an2606-stm32-microcontroller-system-memory-boot-mode-stmicroelectronics.pdf sha256 25b466e39ecc61671dcb988d8ca538462d6452d85f68140cb981ed728f57e654;
#   AN3155 Rev 22 (September 2026), https://www.st.com/resource/en/application_note/an3155-usart-protocol-used-in-the-stm32-bootloader-stmicroelectronics.pdf sha256 0e3e1c35ffa3311aba33440d9d6236dc2f59af8a7f32482cf13d1d0af8c5e1f9;
#   RM0377 Rev 10 (https://www.st.com/resource/en/reference_manual/rm0377-ultralowpower-stm32l0x1-advanced-armbased-32bit-mcus-stmicroelectronics.pdf) sha256 8e59c3e92e7e685f4a656432c0b0921dd4379f1a95dd4b7a445e69af3106efcc.

[[models.pin_bias]]
role = "pa10"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 142 (STM32L01xxx/02xxx configuration in system memory boot mode) PDF p.342, USART2_RX pin (USART2 on PA9/PA10): \"PA10 pin: USART2 in reception mode. Used in input pull-up mode.\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0377 Rev 10 PDF p.662 section 24.5.1 USART character description: \"By default, the signal (TX or RX) is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\" AN2606 Rev 70 Figure 1 note 1, PDF p.47: \"A pull-up resistor must be added, if they are not connected on host side\"; section 4.3, PDF p.49: \"It is recommended to keep the RX pins of unused bootloader interfaces (USART_RX, SPI_MOSI, and CAN_RX, if present) at a known (low or high) level\"."
note = "The ROM bootloader detects a USART host by the start bit of its 0x7F frame, so a pull-down or a tie to ground on this pin holds the line in the break state and the bootloader cannot detect a host on this USART (its other interfaces still work). AN2606 allows an unused bootloader RX pin at either known level, so this matters only when the board is flashed over this USART; a missing bias is not reported, only one the wrong way round."

[models.pin_capability.reset_mode]
basis = "RM0377 Rev 10 (STM32L0x1 reference manual), section 8.3.1 GPIO: during and just after reset most I/O are in analog mode; PA14 SWCLK in pull-down, PA13 SWDIO in pull-up (PDF p.218); GPIOA_PUPDR reset value 0x2400 0000, section 8.4.4 (PDF p.226)"
[models.pin_capability.reset_mode.pads]
"23" = "pull_up"  # pa13_swdio
"24" = "pull_down"  # pa14_swclk

# UNLISTED ON PURPOSE (L0): (a) SRAM row (nBOOT1 = 0 with BOOT0 high) needs nBOOT1 = 0, not factory. (b) nBOOT_SEL = 1 rows
# (BOOT0 from the nBOOT0 option bit): grey = category 1 only and not the factory state. (c) The empty-check override is
# an internal flag (pin low + empty flash -> system memory); it cannot be expressed in pin terms and is only in `detail`.
# (d) AN2606 notes the jump from user code to the system bootloader is not possible on this product (Pattern 6 note, PDF p.343).
[[models]]
id = "esp32_wroom"
kind = "mcu"
description = "Espressif ESP32 classic module (WROOM-32 / WROVER)"

[models.match]
# ESP-WROOM-32 / ESP32-WROOM-32(E/D/U/-N4/-N8/-N16) / ESP32-WROVER modules (not the
# ESP32-WROOM-DA, whose pinout differs: datasheet v0.7 Table 2). The
# trailing flash/PSRAM/revision suffixes (e.g. "ESP32-WROOM-32E-N4" on the
# Olimex EVB rev L) must all match the same strap table, so the suffix is left
# open after "32". The value names the module, so it fixes the pad map. A bare
# "ESP32"/"ESP32-D0WD" value is a QFN chip: see esp32 / esp32_qfn48 below.
value_re = "(?i)^(ESP[-_ ]?WROOM[-_ ]?32|ESP32[-_ ]?WROOM[-_ ]?32.*|ESP32[-_ ]?WROVER.*)$"
# No mpn_re: match rules are ANDed, so an mpn_re would reject the common case
# of a board whose ESP32 carries no MPN property (Olimex EVB, most KiCad libs).

[models.params]
# hauksbee-mcu backend identifier: the QEMU backend boots the matching Espressif
# QEMU machine (esp32) from the merged flash image and bridges GPIO (via the RAM
# mailbox) / UART through QMP + gdbstub + the serial socket. The ESP32 is a 3.3 V
# part; the scheduler drives its GPIO outputs at 3.3 V (the qemu: prefix selects
# the rail, same as renode:). With no firmware given the scheduler skips the
# MCU entirely, so lint/report-only runs never need QEMU.
backend = "qemu:esp32"
# The module's crystal and SPI flash are inside the can, never on the board.
# Espressif ESP32-WROOM-32E & ESP32-WROOM-32UE Datasheet v2.1,
# https://www.espressif.com/sites/default/files/documentation/esp32-wroom-32e_esp32-wroom-32ue_datasheet_en.pdf,
# sha256 4c7a345d1c1bfec34c38665639e39a7f43b79a35a12f6adcc2c7c0f83850f8b8,
# section 1 "Module Overview" Integrated Components on Module (PDF p.2): "40 MHz
# crystal oscillator", "4/8/16 MB SPI flash"; Table 1 Series Comparison (PDF p.3).
# The ESP32-WROVER-E & WROVER-IE Datasheet
# (esp32-wrover-e_esp32-wrover-ie_datasheet_en.pdf, sha256
# 611e8506f352225e9ab09b4c2c3286885022b2f77a44ee8f0ab88a6302616f32) states the
# same "40 MHz crystal oscillator" and "4/8/16 MB SPI flash" on PDF p.2.
module_clock_hz = 40000000
module_clock_source = "Espressif ESP32-WROOM-32E datasheet v2.1 PDF p.2: 40 MHz crystal oscillator integrated on the module (WROVER-E datasheet PDF p.2 states the same)"
module_flash = "4/8/16 MB SPI flash, ESP32-WROOM-32E datasheet v2.1 PDF p.2-3"

[models.pins]
# ESP-WROOM-32 module pad map (KiCad RF_Module:ESP32-WROOM-32 / Olimex symbol).
# Strap pads carry flat "gpio<n>" roles: the binder's gpio_of_role parses them
# (port '0', bit n) for co-sim drive, and the strap lint matches them against
# [models.straps] by exact string. Pad numbers verified against the Olimex
# ESP32-EVB netlist (U3 = ESP-WROOM-32): pad25=GPIO0, 24=GPIO2, 29=GPIO5,
# 14=GPIO12/MTDI, 23=GPIO15/MTDO, and the KiCad symbol (35 = TXD0/IO1,
# 34 = RXD0/IO3; pad 33 is IO21). The demo-board pads (GPIO4, UART0) keep the
# "p0<bit>" convention; both spellings resolve to the same port/bit.
"1"  = "vss"        # GND
"2"  = "vdd"        # 3V3
# ESP32-WROOM-32E & WROOM-32UE Datasheet v2.1, Table 3 "Pin Definitions": EN is
# pad 3, "High: On; enables the chip. Low: Off; the chip shuts down" (CHIP_PU,
# whose rising edge latches the straps: Table 5, tH >= 1 ms after it).
"3"  = "en"
"25" = "gpio0"
"24" = "gpio2"      # alive indicator on the QEMU demo board (LED path)
"29" = "gpio5"
"14" = "gpio12"    # MTDI
"23" = "gpio15"    # MTDO
"26" = "p04"        # GPIO4: ~5 Hz blink, observable through the solved circuit
"35" = "p01_txd"    # TXD0 (UART0 TX, GPIO1)
"34" = "p03_rxd"    # RXD0 (UART0 RX, GPIO3)

[models.pin_capability.adc]
basis = "Espressif ESP32-WROOM-32E Datasheet v2.1, Table 3 Pin Definitions (PDF p.11): pad to GPIO to ADC channel. Lists the pads of [models.pins] only; GPIO5 (pad 29) and the UART pads carry no ADC channel. ADC2 channels are not usable while the Wi-Fi driver runs (ESP-IDF note, not in the datasheet)"
[models.pin_capability.adc.pads]
"14" = "ADC2_CH5"
"23" = "ADC2_CH3"
"24" = "ADC2_CH2"
"25" = "ADC2_CH1"
"26" = "ADC2_CH0"
[models.pin_capability.pull_up]
basis = "ESP32-WROOM-32E module: pad-to-GPIO mapping from ESP32-WROOM-32E Datasheet v2.1 (sha256 4c7a345d1c1bfec34c38665639e39a7f43b79a35a12f6adcc2c7c0f83850f8b8) Pin Definitions table (p.11). Espressif ESP32 Series Datasheet v5.3 (sha256 a7917e6b47528c9dcab06837a49d452e582751335797db879f1cf2d17cd29adf) section 4.8.1 GPIO (p.36) 'Most of the digital GPIOs can be configured as internal pull-up or pull-down'; Appendix A p.62 'The drive strength of the internal pull-up (wpu) and pull-down (wpd) is ~75 uA'; section 2.3.1 (p.17) that the input-only GPIO34-39 lack pull-up/pull-down resistors. ESP32 Technical Reference Manual v5.8 (sha256 4ba58e9fa0405ec2bf80b912a29b483f6edc8c4b2b1058201913a2fe37e582f0) section 6.1 Figure 6.1-2 pad WPU (p.116); section 6.2.2 step 3 (p.118) 'Set or clear the FUN_WPU and FUN_WPD bits ... to enable/disable internal pull-up/pull-down resistors'; Table 6.10-1 (p.133) lists the pad registers; Register 6.34 IO_MUX_x_REG (x: 0-19, 21-23, 25-27, 32-39) FUN_WPU (p.149) 'GPIO pins 34-39 ... do not feature ... internal pull-up/pull-down circuitry'. Not listed: EN (reset, fixed pull) and the supply pads. GPIO34-39 would be excluded (input-only, no pull circuitry) but the card has none"
[models.pin_capability.pull_up.pads]
"25" = "GPIO0: IO_MUX_GPIO0_REG FUN_WPU = 1 (internal pull-up)"
"24" = "GPIO2: IO_MUX_GPIO2_REG FUN_WPU = 1 (internal pull-up)"
"29" = "GPIO5: IO_MUX_GPIO5_REG FUN_WPU = 1 (internal pull-up)"
"14" = "GPIO12: IO_MUX_GPIO12_REG FUN_WPU = 1 (internal pull-up)"
"23" = "GPIO15: IO_MUX_GPIO15_REG FUN_WPU = 1 (internal pull-up)"
"26" = "GPIO4: IO_MUX_GPIO4_REG FUN_WPU = 1 (internal pull-up)"
"35" = "GPIO1: IO_MUX_GPIO1_REG FUN_WPU = 1 (internal pull-up)"
"34" = "GPIO3: IO_MUX_GPIO3_REG FUN_WPU = 1 (internal pull-up)"

# ESP32-WROOM-32E & WROOM-32UE Datasheet v2.1: Table 3 Pin Definitions p.11, EN pad 3 "High: On; enables the
# chip. Low: Off; the chip shuts down. Note: Do not leave the pin floating." Figure 7 ESP32-WROOM-32E Schematics
# p.37 shows CHIP_PU wired straight to module pad 3 with no pull-up or RC on the module; sec. 9 p.39 asks for
# the RC delay (R = 10 kOhm, C = 1 uF) on the host board.
[[models.straps]]
role = "en"
level = "high"
boot_select = false
internal_pull = "none"
note = "EN (CHIP_PU) high = chip enabled, low = chip off; the module has no on-board pull on EN, so an undriven net floats"

[models.ratings]
max_pin_current_a = 0.04   # ~40 mA abs max source/sink per pad (datasheet)
max_current_a = 0.5
# ESP32-WROOM-32 datasheet v3.8 Table 12 / ESP32-WROOM-32E v2.1 Table 13, Absolute
# Maximum Ratings, VDD33 -0.3 to 3.6 V. The recommended ceiling (Table 13 / 14,
# 3.0-3.6 V) is the same 3.6 V, so there is no gap for an envelope to flag.
max_voltage_v = 3.6

# Strapping pins. Ref: ESP32 Technical Reference Manual v5.1, Table "Strapping
# Pins" (sec "IO_MUX and GPIO Matrix"), and ESP32 datasheet v4.3, sec 5.10
# "Strapping Pins". Latched on the rising edge of the chip-power-on reset; the
# level must be stable through the latch window.
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true   # latches SPI-vs-download boot; unrecoverable in firmware
# VIL max 0.25 x VDD, VIH min 0.75 x VDD (VDD = the pad's I/O supply): ESP32
# Datasheet v5.3, Table 5-3 "DC Characteristics (3.3 V, 25 °C)",
# https://www.espressif.com/sites/default/files/documentation/esp32_datasheet_en.pdf
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = SPI boot (normal); low = download/UART boot. A 50 MHz clock here randomly enters download mode (Olimex ESP32-EVB)"

[[models.straps]]
role = "gpio2"
level = "low"     # low-or-floating; must NOT be pulled high during download
note = "GPIO2 must be low or floating at reset; tie-high blocks download mode"

[[models.straps]]
role = "gpio12"   # MTDI
level = "low"
note = "MTDI/GPIO12 selects VDD_SDIO flash voltage: low = 3.3 V (normal), high = 1.8 V"

[[models.straps]]
role = "gpio15"   # MTDO
level = "high"
note = "MTDO/GPIO15 high (normal) silences boot log on U0TXD; low enables it"

[models.coverage]
implements = ["xtensa_lx6_firmware_execution", "boot_to_application", "gpio_output_register_or_mailbox_observation", "uart_tx", "wall_bounded_virtual_time", "gpio_input_mailbox_contract", "adc_input_mailbox_contract", "i2c_spi_mailbox_contract", "tmp105_temperature_injection"]
missing = ["instruction_counted_timing", "unmodified_firmware_gpio_input", "native_adc_peripheral", "unmodified_firmware_i2c_spi_observation", "watchdog_behavior", "silicon_power_current_profile", "silicon_timing_and_errata"]

# ─────────────────────────────────────────────────────────────────────────────

# Bare classic ESP32 chip, package unknown: identity only (see the family note).

# Boot-mode table (BOOT STRAPS package): the pins that select the boot source, the
# vendor's table, and where each value comes from.
[models.strap_latch]
event = "chip_pu"
note  = "The strapping pins are sampled when the chip leaves reset: the pin levels must be stable at least tSU = 0 ms before CHIP_PU is pulled high and held for tH = 1 ms (min) after CHIP_PU is high; the latched values are then held until power-down"
cite  = "ESP32 Series Datasheet v5.3, section 3 'Boot Configurations', Table 3-2 and Figure 3-1, PDF pp.22-23"

[models.reset_input]
role = "en"                       # CHIP_PU: esp32_wroom pad 3, esp32_qfn48 pad 9
vil  = [0.0, 0.6]                 # VIL_nRST max 0.6 V (a constant, NOT a ratio of VDD, on ESP32)
vih  = [0.75, 0.0]                # VIH_nRST min 0.75 x VDD
cite = "ESP32 Series Datasheet v5.3, Table 5-3 'DC Characteristics (3.3 V, 25 C)', rows VIH_nRST and VIL_nRST, PDF p.52"

[[models.boot_inputs]]
role = "gpio0"
pin = "GPIO0"
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (GPIO0 Pull-up, bit value 1) PDF p.22; Table 5-3 VIL/VIH PDF p.52"

[[models.boot_inputs]]
role = "gpio2"
pin = "GPIO2"
internal_pull = "pull_down"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (GPIO2 Pull-down, bit value 0) PDF p.22; Table 5-3 VIL/VIH PDF p.52"

[[models.boot_inputs]]
role = "gpio12"
pin = "MTDI (GPIO12)"
internal_pull = "pull_down"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "MTDI is NOT a boot-mode pin: it selects the VDD_SDIO supply. MTDI = 0 (default): VDD_SDIO is powered directly from VDD3P3_RTC (typically 3.3 V). MTDI = 1 at the latch: VDD_SDIO comes from the internal 1.8 V LDO, so flash or PSRAM that is powered from VDD_SDIO and is a 3.3 V part is under-supplied on a board that pulls MTDI high. EFUSE_SDIO_FORCE = 1 overrides the pin (EFUSE_SDIO_TIEH then decides)"
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (MTDI Pull-down, 0) PDF p.22; section 3.2 'Internal LDO (VDD_SDIO) Voltage Control' PDF p.24; Table 5-3 PDF p.52"

[[models.boot_inputs]]
role = "gpio15"
pin = "MTDO (GPIO15)"
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "MTDO is not a boot-mode pin: MTDO = 1 (default) enables U0TXD boot-message printing, 0 disables it; MTDO with GPIO5 selects the SDIO-slave edge timing (Table 3-5)"
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (MTDO Pull-up, 1) PDF p.22; Table 3-4 and Table 3-5 PDF p.25; Table 5-3 PDF p.52"

[[models.boot_inputs]]
role = "gpio5"
pin = "GPIO5"
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO5 is not a boot-mode pin: with MTDO it selects the SDIO-slave edge timing (Table 3-5)"
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (GPIO5 Pull-up, 1) PDF p.22; Table 3-5 PDF p.25; Table 5-3 PDF p.52"

[[models.boot_inputs]]
role = "gpio4"                     # esp32_qfn48 pad 24 (wroom calls pad 26 'p04'); used by the QEMU bit table
pin = "GPIO4"
internal_pull = "unknown"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "The datasheet lists no strapping row for GPIO4, but the TRM GPIO_STRAP_REG has a bit for it (bit 2). Its silicon pull at reset is not stated in either document"
cite = "ESP32 Technical Reference Manual v5.8, Register 6.13 GPIO_STRAP_REG, PDF p.141; ESP32 Series Datasheet v5.3 Table 3-1 (no GPIO4 row) PDF p.22"

[[models.boot_modes]]
name = "SPI Boot Mode"
when = { gpio0 = "high" }          # GPIO2: any value
outcome = "user_flash"
detail = "GPIO0 = 1 (the default, internal pull-up): SPI boot, the chip boots from SPI flash and user firmware runs. GPIO2 can be any value"
cite = "ESP32 Series Datasheet v5.3, Table 3-3 'Chip Boot Mode Control', PDF p.23"

[[models.boot_modes]]
name = "Joint Download Boot Mode"
when = { gpio0 = "low", gpio2 = "low" }
outcome = "rom_bootloader"
detail = "GPIO0 = 0 and GPIO2 = 0: Joint Download Boot, which supports SDIO Download Boot and UART Download Boot; the ROM runs the download loader and the user firmware does not run. On chip revision v3.0 and later, uart_download_dis = 1 permanently disables this mode"
cite = "ESP32 Series Datasheet v5.3, Table 3-3 and its footnote 2, PDF p.23; section 3.1 uart_download_dis paragraph, PDF p.24"

# --- QEMU (Espressif fork) strap_mode: layout equals GPIO_STRAP_REG (TRM Register 6.13) ---
[models.qemu_boot]
device = "esp32.gpio"
property = "strap_mode"
flash_boot = 0x12                   # QEMU's own ESP32_STRAP_MODE_FLASH_BOOT; straps with a defined level are overlaid on it
bits = { gpio12 = 5, gpio0 = 4, gpio2 = 3, gpio4 = 2, gpio15 = 1, gpio5 = 0 }
cite = "ESP32 TRM v5.8 Register 6.13 GPIO_STRAP_REG PDF p.141; Espressif QEMU include/hw/gpio/esp32_gpio.h (ESP32_STRAP_MODE_FLASH_BOOT 0x12, ESP32_STRAP_MODE_UART_BOOT 0x0f), hw/xtensa/esp32.c:156"
[models.pin_capability.routed]
basis = "Espressif ESP32 Series Datasheet v5.3 (PDF page = printed page), Section 4.10 Table 4-6 Peripheral Pin Configurations (p.47-48): General Purpose SPI (HSPICLK, HSPID, HSPIQ, VSPICLK, VSPID, VSPIQ), UART0-2 (U0TXD_out, U0RXD_in, ...), I2C (I2CEXT0/1_SCL/SDA in/out), LED PWM (ledc_hs/ls_sig_out0~7) and Motor PWM (PWM0/1_CAP_IN0~2) are each listed with Pin 'Any GPIO Pins'; Sections 4.8.2-4.8.9 (p.36-40) say 'The pins for UART/I2C/LED PWM Controller/Motor Control PWM can be chosen from any GPIOs via the GPIO Matrix' (HSPI/VSPI also have fixed IO MUX pads, p.36, but the matrix reaches any pad). ESP32 Technical Reference Manual v5.8 (PDF page = printed page), Chapter 6 IO MUX and GPIO Matrix, Section 6.1 (p.116: 'Each of the 162 internal peripheral inputs can select any GPIO pin as the input source', each GPIO output can be one of 176 peripheral output signals) and Section 6.9 Peripheral Signal List (p.125-128: HSPICLK_in/out, U0RXD_in/U0TXD_out, I2CEXT0_SCL_in/out, VSPICLK_in/out, ledc_hs_sig_out0, pwm0_cap0_in). timer_capture is the Motor Control PWM capture module (TRM Chapter 29, p.677: three capture channels latch a 32-bit capture-timer value on the selected edge). GPIO34-39 are input-only pads (no output functions there), which a pad-level table cannot express; hardware peripheral only, a software (bit-banged) implementation can use any pad Module datasheet: ESP32-WROOM-32E & WROOM-32UE Datasheet v2.1, Section 5.2 Digital Peripherals repeats the same statements (UART p.19, I2C p.20, LED PWM p.21, Motor Control PWM p.22, PDF page = printed page)."
functions = ["spi_sck", "spi_mosi", "spi_miso", "i2c_sda", "i2c_scl", "uart_tx", "uart_rx", "pwm", "timer_capture"]


# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   ESP32-WROOM-32E/32UE Datasheet v2.1 (https://www.espressif.com/sites/default/files/documentation/esp32-wroom-32e_esp32-wroom-32ue_datasheet_en.pdf) sha256 4c7a345d1c1bfec34c38665639e39a7f43b79a35a12f6adcc2c7c0f83850f8b8;
#   ESP32 Series Datasheet v5.3 (https://www.espressif.com/sites/default/files/documentation/esp32_datasheet_en.pdf) sha256 a7917e6b47528c9dcab06837a49d452e582751335797db879f1cf2d17cd29adf;
#   ESP32 Technical Reference Manual v5.8 (https://www.espressif.com/sites/default/files/documentation/esp32_technical_reference_manual_en.pdf) sha256 4ba58e9fa0405ec2bf80b912a29b483f6edc8c4b2b1058201913a2fe37e582f0.
[[models.pin_bias]]
role = "p03_rxd"
level = "high"
needs = "idle"
opposed_only = true
basis = "ESP32-WROOM-32E/32UE Datasheet v2.1 PDF p.39 (section 9 Peripheral Schematics, note): \"UART0 is used to download firmware and log output.\"; ESP32-WROOM-32E/32UE Datasheet v2.1 PDF p.12 Table 3 Pin Definitions: \"RXD0 34 I/O GPIO3, U0RXD, CLK_OUT2\"; ESP32 Series Datasheet v5.3 PDF p.23 Table 3-3 Chip Boot Mode Control (GPIO0 = 0, GPIO2 = 0, Joint Download Boot Mode, footnote 2): \"Joint Download Boot mode supports the following download methods: • SDIO Download Boot • UART Download Boot\"; ESP32 TRM v5.8 PDF p.314 (UART chapter, data frame): \"The START is low level, while the STOP is high level.\"; PDF p.315: \"The receiver can also detect the Break conditions when the RX data line remains logical low for one NULL character transmission\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

[models.pin_capability.reset_mode]
basis = "ESP32 Series Datasheet v5.3, Appendix A Table IO_MUX, column 'At Reset' (PDF p.69): wpu on GPIO0, GPIO1, GPIO3, GPIO5, GPIO6-GPIO11, GPIO15 and wpd on GPIO2, GPIO4, GPIO12; every other GPIO is oe=0, ie=0 (during reset all pins are output-disabled, section Pin Description p.62)"
[models.pin_capability.reset_mode.pads]
"14" = "pull_down"  # gpio12
"23" = "pull_up"  # gpio15
"24" = "pull_down"  # gpio2
"25" = "pull_up"  # gpio0
"26" = "pull_down"  # p04
"29" = "pull_up"  # gpio5
"34" = "pull_up"  # p03_rxd
"35" = "pull_up"  # p01_txd

