[[models]]
id = "esp32_qfn48"
kind = "mcu"
description = "Espressif ESP32 classic bare chip, QFN48 (5x5 or 6x6 mm)"

[models.match]
value_re = "(?i)^ESP32(-D0WD.*)?$"
footprint_re = '(?i)(^|:)V?QFN[-_]?48([-_]1EP)?[-_][56]x[56]mm'

[models.params]
backend = "qemu:esp32"

[models.pins]
# ESP32 Series Datasheet v5.3, Table 2-1 "Pin Overview" and Table 2-3 "Power
# Pins": MTDI/GPIO12 = 18, VDD3P3_RTC = 19 (supplies the RTC IOs, GPIO0
# included), MTDO/GPIO15 = 21, GPIO2 = 22, GPIO0 = 23, GPIO4 = 24, GPIO5 = 34,
# U0RXD = 40, U0TXD = 41, GND = 49 (exposed pad).
"19" = "vdd"
"49" = "vss"
"23" = "gpio0"
"22" = "gpio2"
"34" = "gpio5"
"18" = "gpio12"
"9"  = "en"          # CHIP_PU (Table 2-1 pin 9): the reset the chip leaves to start
"24" = "gpio4"       # Table 2-1 pin 24
"21" = "gpio15"
"41" = "p01_txd"
"40" = "p03_rxd"

[models.pin_capability.adc]
basis = "Espressif ESP32 Datasheet v5.3, Table 2-1 Pin Overview (PDF p.14) and Table 4-6 Peripheral Pin Configurations (PDF p.46): MTDI/GPIO12 ADC2_CH5, MTDO/GPIO15 ADC2_CH3, GPIO2 ADC2_CH2, GPIO0 ADC2_CH1; GPIO5 and the UART pads carry none. ADC2 is not usable while Wi-Fi runs (ESP-IDF note)"
[models.pin_capability.adc.pads]
"18" = "ADC2_CH5"
"21" = "ADC2_CH3"
"22" = "ADC2_CH2"
"23" = "ADC2_CH1"
[models.pin_capability.pull_up]
basis = "ESP32 chip, QFN 5x5 48-pin: pad-to-GPIO mapping from the ESP32 Series Datasheet v5.3 section 2.2 Pin Overview (pp.14-15; sha256 a7917e6b47528c9dcab06837a49d452e582751335797db879f1cf2d17cd29adf). Espressif ESP32 Series Datasheet v5.3 (sha256 a7917e6b47528c9dcab06837a49d452e582751335797db879f1cf2d17cd29adf) section 4.8.1 GPIO (p.36) 'Most of the digital GPIOs can be configured as internal pull-up or pull-down'; Appendix A p.62 'The drive strength of the internal pull-up (wpu) and pull-down (wpd) is ~75 uA'; section 2.3.1 (p.17) that the input-only GPIO34-39 lack pull-up/pull-down resistors. ESP32 Technical Reference Manual v5.8 (sha256 4ba58e9fa0405ec2bf80b912a29b483f6edc8c4b2b1058201913a2fe37e582f0) section 6.1 Figure 6.1-2 pad WPU (p.116); section 6.2.2 step 3 (p.118) 'Set or clear the FUN_WPU and FUN_WPD bits ... to enable/disable internal pull-up/pull-down resistors'; Table 6.10-1 (p.133) lists the pad registers; Register 6.34 IO_MUX_x_REG (x: 0-19, 21-23, 25-27, 32-39) FUN_WPU (p.149) 'GPIO pins 34-39 ... do not feature ... internal pull-up/pull-down circuitry'. Not listed: CHIP_PU (reset) and the supply pads"
[models.pin_capability.pull_up.pads]
"23" = "GPIO0: IO_MUX_GPIO0_REG FUN_WPU = 1 (internal pull-up)"
"22" = "GPIO2: IO_MUX_GPIO2_REG FUN_WPU = 1 (internal pull-up)"
"34" = "GPIO5: IO_MUX_GPIO5_REG FUN_WPU = 1 (internal pull-up)"
"18" = "GPIO12: IO_MUX_GPIO12_REG FUN_WPU = 1 (internal pull-up)"
"21" = "GPIO15: IO_MUX_GPIO15_REG FUN_WPU = 1 (internal pull-up)"
"41" = "GPIO1: IO_MUX_GPIO1_REG FUN_WPU = 1 (internal pull-up)"
"40" = "GPIO3: IO_MUX_GPIO3_REG FUN_WPU = 1 (internal pull-up)"

# Same die and strap table as esp32_wroom (same citations).
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = SPI boot (normal); low = download/UART boot"

[[models.straps]]
role = "gpio2"
level = "low"
note = "GPIO2 must be low or floating at reset; tie-high blocks download mode"

[[models.straps]]
role = "gpio12"
level = "low"
note = "MTDI/GPIO12 selects VDD_SDIO flash voltage: low = 3.3 V (normal), high = 1.8 V"

[[models.straps]]
role = "gpio15"
level = "high"
note = "MTDO/GPIO15 high (normal) silences boot log on U0TXD; low enables it"

[models.ratings]
# ESP32 Series Datasheet v5.3, Table 5-1 "Absolute Maximum Ratings" (p. 51):
# VDDA, VDD3P3, VDD3P3_RTC, VDD3P3_CPU, VDD_SDIO allowed input voltage -0.3 to
# 3.6 V. Table 5-2 recommends up to the same 3.6 V.
max_voltage_v = 3.6

[models.coverage]
implements = ["xtensa_lx6_firmware_execution", "boot_to_application", "gpio_output_register_or_mailbox_observation", "uart_tx", "wall_bounded_virtual_time", "gpio_input_mailbox_contract", "adc_input_mailbox_contract", "i2c_spi_mailbox_contract", "tmp105_temperature_injection"]
missing = ["instruction_counted_timing", "unmodified_firmware_gpio_input", "native_adc_peripheral", "unmodified_firmware_i2c_spi_observation", "watchdog_behavior", "silicon_power_current_profile", "silicon_timing_and_errata"]

# ─────────────────────────────────────────────────────────────────────────────

# Boot-mode table (BOOT STRAPS package): the pins that select the boot source, the
# vendor's table, and where each value comes from.
[models.strap_latch]
event = "chip_pu"
note  = "The strapping pins are sampled when the chip leaves reset: the pin levels must be stable at least tSU = 0 ms before CHIP_PU is pulled high and held for tH = 1 ms (min) after CHIP_PU is high; the latched values are then held until power-down"
cite  = "ESP32 Series Datasheet v5.3, section 3 'Boot Configurations', Table 3-2 and Figure 3-1, PDF pp.22-23"

[models.reset_input]
role = "en"                       # CHIP_PU: esp32_wroom pad 3, esp32_qfn48 pad 9
vil  = [0.0, 0.6]                 # VIL_nRST max 0.6 V (a constant, NOT a ratio of VDD, on ESP32)
vih  = [0.75, 0.0]                # VIH_nRST min 0.75 x VDD
cite = "ESP32 Series Datasheet v5.3, Table 5-3 'DC Characteristics (3.3 V, 25 C)', rows VIH_nRST and VIL_nRST, PDF p.52"

[[models.boot_inputs]]
role = "gpio0"
pin = "GPIO0"
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (GPIO0 Pull-up, bit value 1) PDF p.22; Table 5-3 VIL/VIH PDF p.52"

[[models.boot_inputs]]
role = "gpio2"
pin = "GPIO2"
internal_pull = "pull_down"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (GPIO2 Pull-down, bit value 0) PDF p.22; Table 5-3 VIL/VIH PDF p.52"

[[models.boot_inputs]]
role = "gpio12"
pin = "MTDI (GPIO12)"
internal_pull = "pull_down"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "MTDI is NOT a boot-mode pin: it selects the VDD_SDIO supply. MTDI = 0 (default): VDD_SDIO is powered directly from VDD3P3_RTC (typically 3.3 V). MTDI = 1 at the latch: VDD_SDIO comes from the internal 1.8 V LDO, so flash or PSRAM that is powered from VDD_SDIO and is a 3.3 V part is under-supplied on a board that pulls MTDI high. EFUSE_SDIO_FORCE = 1 overrides the pin (EFUSE_SDIO_TIEH then decides)"
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (MTDI Pull-down, 0) PDF p.22; section 3.2 'Internal LDO (VDD_SDIO) Voltage Control' PDF p.24; Table 5-3 PDF p.52"

[[models.boot_inputs]]
role = "gpio15"
pin = "MTDO (GPIO15)"
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "MTDO is not a boot-mode pin: MTDO = 1 (default) enables U0TXD boot-message printing, 0 disables it; MTDO with GPIO5 selects the SDIO-slave edge timing (Table 3-5)"
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (MTDO Pull-up, 1) PDF p.22; Table 3-4 and Table 3-5 PDF p.25; Table 5-3 PDF p.52"

[[models.boot_inputs]]
role = "gpio5"
pin = "GPIO5"
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO5 is not a boot-mode pin: with MTDO it selects the SDIO-slave edge timing (Table 3-5)"
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (GPIO5 Pull-up, 1) PDF p.22; Table 3-5 PDF p.25; Table 5-3 PDF p.52"

[[models.boot_inputs]]
role = "gpio4"                     # esp32_qfn48 pad 24 (wroom calls pad 26 'p04'); used by the QEMU bit table
pin = "GPIO4"
internal_pull = "unknown"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "The datasheet lists no strapping row for GPIO4, but the TRM GPIO_STRAP_REG has a bit for it (bit 2). Its silicon pull at reset is not stated in either document"
cite = "ESP32 Technical Reference Manual v5.8, Register 6.13 GPIO_STRAP_REG, PDF p.141; ESP32 Series Datasheet v5.3 Table 3-1 (no GPIO4 row) PDF p.22"

[[models.boot_modes]]
name = "SPI Boot Mode"
when = { gpio0 = "high" }          # GPIO2: any value
outcome = "user_flash"
detail = "GPIO0 = 1 (the default, internal pull-up): SPI boot, the chip boots from SPI flash and user firmware runs. GPIO2 can be any value"
cite = "ESP32 Series Datasheet v5.3, Table 3-3 'Chip Boot Mode Control', PDF p.23"

[[models.boot_modes]]
name = "Joint Download Boot Mode"
when = { gpio0 = "low", gpio2 = "low" }
outcome = "rom_bootloader"
detail = "GPIO0 = 0 and GPIO2 = 0: Joint Download Boot, which supports SDIO Download Boot and UART Download Boot; the ROM runs the download loader and the user firmware does not run. On chip revision v3.0 and later, uart_download_dis = 1 permanently disables this mode"
cite = "ESP32 Series Datasheet v5.3, Table 3-3 and its footnote 2, PDF p.23; section 3.1 uart_download_dis paragraph, PDF p.24"

# --- QEMU (Espressif fork) strap_mode: layout equals GPIO_STRAP_REG (TRM Register 6.13) ---
[models.qemu_boot]
device = "esp32.gpio"
property = "strap_mode"
flash_boot = 0x12                   # QEMU's own ESP32_STRAP_MODE_FLASH_BOOT; straps with a defined level are overlaid on it
bits = { gpio12 = 5, gpio0 = 4, gpio2 = 3, gpio4 = 2, gpio15 = 1, gpio5 = 0 }
cite = "ESP32 TRM v5.8 Register 6.13 GPIO_STRAP_REG PDF p.141; Espressif QEMU include/hw/gpio/esp32_gpio.h (ESP32_STRAP_MODE_FLASH_BOOT 0x12, ESP32_STRAP_MODE_UART_BOOT 0x0f), hw/xtensa/esp32.c:156"

# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   ESP32 Series Datasheet v5.3 (https://www.espressif.com/sites/default/files/documentation/esp32_datasheet_en.pdf) sha256 a7917e6b47528c9dcab06837a49d452e582751335797db879f1cf2d17cd29adf;
#   ESP32-WROOM-32E/32UE Datasheet v2.1 (https://www.espressif.com/sites/default/files/documentation/esp32-wroom-32e_esp32-wroom-32ue_datasheet_en.pdf) sha256 4c7a345d1c1bfec34c38665639e39a7f43b79a35a12f6adcc2c7c0f83850f8b8;
#   ESP32 Technical Reference Manual v5.8 (https://www.espressif.com/sites/default/files/documentation/esp32_technical_reference_manual_en.pdf) sha256 4ba58e9fa0405ec2bf80b912a29b483f6edc8c4b2b1058201913a2fe37e582f0.
[[models.pin_bias]]
role = "p03_rxd"
level = "high"
needs = "idle"
opposed_only = true
basis = "ESP32 Series Datasheet v5.3 PDF p.15 Table 2-1 Pin Definitions (QFN48): \"U0RXD 40 I/O GPIO3, U0RXD, CLK_OUT2\"; ESP32 Series Datasheet v5.3 PDF p.23 Table 3-3 Chip Boot Mode Control (GPIO0 = 0, GPIO2 = 0, Joint Download Boot Mode, footnote 2): \"Joint Download Boot mode supports the following download methods: • SDIO Download Boot • UART Download Boot\"; ESP32-WROOM-32E/32UE Datasheet v2.1 PDF p.39 (section 9 Peripheral Schematics, note): \"UART0 is used to download firmware and log output.\" (an ESP32 module; the card is the bare chip); ESP32 TRM v5.8 PDF p.314 (UART chapter, data frame): \"The START is low level, while the STOP is high level.\"; PDF p.315: \"The receiver can also detect the Break conditions when the RX data line remains logical low for one NULL character transmission\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

[[models]]
id = "esp32_pico"
kind = "mcu"
description = "Espressif ESP32-PICO-D4 SiP (Watchy v1.x/v2.x)"

[models.match]
# One SiP, one package: the value fixes the pad map without a footprint rule.
value_re = "(?i)^ESP32[-_ ]?PICO[-_ ]?D4$"

[models.params]
# Same ESP32 die as esp32_wroom, so the same QEMU machine (esp32) boots it. With
# no firmware given the scheduler skips the MCU entirely (lint/report-only runs
# never need QEMU); with firmware it boots the merged flash image and bridges
# GPIO (via the RAM mailbox) / UART. The boot-coverage execution of the Watchy
# RES# row (docs/evidence/KNOWN_FAULTS_VALIDATION.md) runs through this.
backend = "qemu:esp32"

[models.pins]
# ESP32-PICO-D4 (ESP32-PICO Series Datasheet v1.3, Table 2-1, and the KiCad
# MCU_Espressif:ESP32-PICO-D4 symbol): VDD3P3_RTC = 19 (RTC IO supply, GPIO0
# included), IO2 = 22, IO0 = 23 (verified on Watchy v1.5/v2.0), IO4 = 24,
# IO5 = 34. Pad 24 was mapped as GPIO2 before; it is IO4. On the SiP the flash
# straps (GPIO12/GPIO15) are bonded internally to the in-package flash, so only
# GPIO0/GPIO2/GPIO5 are board-exposed. The display + UART pads are verified
# against the Watchy v1.5 corpus board file (net_probe): RES = U1 pad 28 =
# GPIO9, TX = pad 41 = GPIO1/U0TXD, RX = pad 40 = GPIO3/U0RXD. GPIO9 is the
# e-paper DISPLAY_RES the boot-coverage check watches.
"19" = "vdd"
"23" = "gpio0"
"22" = "gpio2"
"34" = "gpio5"
"28" = "gpio9"      # DISPLAY_RES (board net RES); driven high by display init
"41" = "p01_txd"    # U0TXD (UART0 TX)
"40" = "p03_rxd"    # U0RXD (UART0 RX)

[models.pin_capability.adc]
basis = "Espressif ESP32-PICO Series Datasheet v1.4, Table 2 Pin Description of ESP32-PICO-D4 (PDF pp.13-14): IO2 pad 22 ADC2_CH2, IO0 pad 23 ADC2_CH1; IO9 and the UART pads carry none. ADC2 is not usable while Wi-Fi runs (ESP-IDF note)"
[models.pin_capability.adc.pads]
"22" = "ADC2_CH2"
"23" = "ADC2_CH1"
[models.pin_capability.pull_up]
basis = "ESP32-PICO-D4 SiP: pad-to-GPIO mapping from ESP32-PICO Series Datasheet v1.4 (sha256 652834c31a0ac4930aec4ac23754d2737e8bdecb76410edf3c48be519a6c40af) Table 2 Pin Description of ESP32-PICO-D4 (pp.13-15; IO2 = 22 and IO0 = 23 on p.14, IO5 = 34, U0RXD = 40 and U0TXD = 41 on p.15). Espressif ESP32 Series Datasheet v5.3 (sha256 a7917e6b47528c9dcab06837a49d452e582751335797db879f1cf2d17cd29adf) section 4.8.1 GPIO (p.36) 'Most of the digital GPIOs can be configured as internal pull-up or pull-down'; Appendix A p.62 'The drive strength of the internal pull-up (wpu) and pull-down (wpd) is ~75 uA'; section 2.3.1 (p.17) that the input-only GPIO34-39 lack pull-up/pull-down resistors. ESP32 Technical Reference Manual v5.8 (sha256 4ba58e9fa0405ec2bf80b912a29b483f6edc8c4b2b1058201913a2fe37e582f0) section 6.1 Figure 6.1-2 pad WPU (p.116); section 6.2.2 step 3 (p.118) 'Set or clear the FUN_WPU and FUN_WPD bits ... to enable/disable internal pull-up/pull-down resistors'; Table 6.10-1 (p.133) lists the pad registers; Register 6.34 IO_MUX_x_REG (x: 0-19, 21-23, 25-27, 32-39) FUN_WPU (p.149) 'GPIO pins 34-39 ... do not feature ... internal pull-up/pull-down circuitry'. Pad 28 (GPIO9) is listed because this card matches ESP32-PICO-D4 only, where Table 7 (p.22) says GPIO9 'can be used freely' (it is used for in-package PSRAM only on PICO-V3-02, which the card does not match) and GPIO9 has an IO_MUX_x_REG (x: 0-19) with FUN_WPU (TRM Register 6.34, p.149). Not listed: CHIP_PU and the supply pads"
[models.pin_capability.pull_up.pads]
"23" = "GPIO0: IO_MUX_GPIO0_REG FUN_WPU = 1 (internal pull-up)"
"22" = "GPIO2: IO_MUX_GPIO2_REG FUN_WPU = 1 (internal pull-up)"
"34" = "GPIO5: IO_MUX_GPIO5_REG FUN_WPU = 1 (internal pull-up)"
"28" = "GPIO9: IO_MUX_GPIO9_REG FUN_WPU = 1 (internal pull-up)"
"41" = "GPIO1: IO_MUX_GPIO1_REG FUN_WPU = 1 (internal pull-up)"
"40" = "GPIO3: IO_MUX_GPIO3_REG FUN_WPU = 1 (internal pull-up)"

# Ref: ESP32-PICO-D4 datasheet v1.7, sec "Strapping Pins" (inherits ESP32 TRM
# v5.1 strap table). The package-internal flash straps are not listed (fixed by
# the SiP).
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true   # latches SPI-vs-download boot; unrecoverable in firmware
# The ESP32 die's thresholds: ESP32 Datasheet v5.3, Table 5-3, VIL max 0.25 x
# VDD, VIH min 0.75 x VDD,
# https://www.espressif.com/sites/default/files/documentation/esp32_datasheet_en.pdf
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = SPI boot (normal); low = download/UART boot"

[[models.straps]]
role = "gpio2"
level = "low"
note = "GPIO2 must be low or floating at reset"

# LilyGO T-Micro32 / T-Micro32 Plus: an ESP32-PICO-V3-02 SiP module sold under
# the vendor's own "T-" name, so its value never says "ESP32". The castellated
# pad numbering is LilyGO's, not Espressif's, so there is no pad map here: GPIO
# roles come from the board's pin names ("IO36/SVP", "IO25"), which the binder
# reads as gpio<n>. The core is the classic ESP32 die, as on esp32_pico.

# Boot-mode table (BOOT STRAPS package): the pins that select the boot source, the
# vendor's table, and where each value comes from.
[models.strap_latch]
event = "chip_pu"
note  = "The strapping pins are sampled when the chip leaves reset: the pin levels must be stable at least tSU = 0 ms before CHIP_PU is pulled high and held for tH = 1 ms (min) after CHIP_PU is high; the latched values are then held until power-down"
cite  = "ESP32 Series Datasheet v5.3, section 3 'Boot Configurations', Table 3-2 and Figure 3-1, PDF pp.22-23"

[models.reset_input]
role = "en"                       # CHIP_PU: esp32_wroom pad 3, esp32_qfn48 pad 9
vil  = [0.0, 0.6]                 # VIL_nRST max 0.6 V (a constant, NOT a ratio of VDD, on ESP32)
vih  = [0.75, 0.0]                # VIH_nRST min 0.75 x VDD
cite = "ESP32 Series Datasheet v5.3, Table 5-3 'DC Characteristics (3.3 V, 25 C)', rows VIH_nRST and VIL_nRST, PDF p.52"

[[models.boot_inputs]]
role = "gpio0"
pin = "GPIO0"
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (GPIO0 Pull-up, bit value 1) PDF p.22; Table 5-3 VIL/VIH PDF p.52"

[[models.boot_inputs]]
role = "gpio2"
pin = "GPIO2"
internal_pull = "pull_down"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (GPIO2 Pull-down, bit value 0) PDF p.22; Table 5-3 VIL/VIH PDF p.52"

[[models.boot_inputs]]
role = "gpio12"
pin = "MTDI (GPIO12)"
internal_pull = "pull_down"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "MTDI is NOT a boot-mode pin: it selects the VDD_SDIO supply. MTDI = 0 (default): VDD_SDIO is powered directly from VDD3P3_RTC (typically 3.3 V). MTDI = 1 at the latch: VDD_SDIO comes from the internal 1.8 V LDO, so flash or PSRAM that is powered from VDD_SDIO and is a 3.3 V part is under-supplied on a board that pulls MTDI high. EFUSE_SDIO_FORCE = 1 overrides the pin (EFUSE_SDIO_TIEH then decides)"
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (MTDI Pull-down, 0) PDF p.22; section 3.2 'Internal LDO (VDD_SDIO) Voltage Control' PDF p.24; Table 5-3 PDF p.52"

[[models.boot_inputs]]
role = "gpio15"
pin = "MTDO (GPIO15)"
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "MTDO is not a boot-mode pin: MTDO = 1 (default) enables U0TXD boot-message printing, 0 disables it; MTDO with GPIO5 selects the SDIO-slave edge timing (Table 3-5)"
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (MTDO Pull-up, 1) PDF p.22; Table 3-4 and Table 3-5 PDF p.25; Table 5-3 PDF p.52"

[[models.boot_inputs]]
role = "gpio5"
pin = "GPIO5"
internal_pull = "pull_up"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO5 is not a boot-mode pin: with MTDO it selects the SDIO-slave edge timing (Table 3-5)"
cite = "ESP32 Series Datasheet v5.3, Table 3-1 (GPIO5 Pull-up, 1) PDF p.22; Table 3-5 PDF p.25; Table 5-3 PDF p.52"

[[models.boot_inputs]]
role = "gpio4"                     # esp32_qfn48 pad 24 (wroom calls pad 26 'p04'); used by the QEMU bit table
pin = "GPIO4"
internal_pull = "unknown"
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "The datasheet lists no strapping row for GPIO4, but the TRM GPIO_STRAP_REG has a bit for it (bit 2). Its silicon pull at reset is not stated in either document"
cite = "ESP32 Technical Reference Manual v5.8, Register 6.13 GPIO_STRAP_REG, PDF p.141; ESP32 Series Datasheet v5.3 Table 3-1 (no GPIO4 row) PDF p.22"

[[models.boot_modes]]
name = "SPI Boot Mode"
when = { gpio0 = "high" }          # GPIO2: any value
