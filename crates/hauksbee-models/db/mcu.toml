# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# ATmega1284P: the 128 KB / 16 KB-SRAM megaX4-line AVR, 44-lead TQFP and 44-pad
# VQFN/QFN(MLF), which share one pinout.
#
# Source: Atmel/Microchip "ATmega1284P DATASHEET COMPLETE",
#   Atmel-42719C-ATmega1284P_Datasheet_Complete-10/2016, the 44-pad figure in
#   section 5.1.2 (titled "TQFN and QFN"; the figure itself is the shared
#   TQFP/QFN/MLF pinout) and Table 29-1 "Absolute Maximum Ratings".
#
# WHY IT NEEDS ITS OWN ENTRY AND CANNOT BORROW THE 328P's. Different port count
# (A/B/C/D vs B/C/D), different pad count, and a completely different pad order:
# pad 1 is MOSI here and PC6/RESET on a 328P. Binding a 1284P board through the
# 328P map would wire the SPI bus to the reset pin.
#
# THE VALUE STRINGS THIS MATCHES are wider than the marketing part number
# because CAD libraries spell the package into the device name. Eagle's Atmel
# library calls the 44-pad MLF part "ATMEGA1284M" (the trailing letter is
# Eagle's package code: M = MLF, AU/A = TQFP, P = PDIP), and a board that fits
# the QFN44 carries exactly that string in its value field.
#
# THE NON-P ATmega1284 GETS ITS OWN ENTRY, immediately below, rather than sharing
# this one. It is a distinct simavr core, and there is no mechanism that would tell
# a user their non-P part had been run on a P core: `detect_substitution` returns
# None for every `simavr:` backend by design, because simavr models the part it is
# asked for. So a shared entry would have been a silent substitution wearing a
# comment that promised a warning. The two entries differ in exactly one line.
#
# DELIBERATELY NOT MODELLED: everything the co-sim does not read off the pad
# map. The JTAG pins (PC2-PC5) carry their port role and nothing else, the
# second USART is not distinguished from the first at this layer, and the clock
# is whatever the AVR backend instantiates (16 MHz), NOT the 8 MHz crystal a
# board may fit. That last one is the honest gap: firmware-timed results on a
# non-16 MHz board are wrong by the clock ratio, and the fix is to carry the
# crystal frequency through the MCU binding, not to guess it here.
[[models]]
id = "atmega1284p"
kind = "mcu"
description = "ATmega1284P 8-bit AVR MCU, 44-lead TQFP or 44-pad VQFN/MLF"

[models.match]
# Two families of spelling bind here, and the second needs its reasoning written
# down because it is the weaker discriminator:
#
#   1. The part number with its `P`, optionally plus a HYPHENATED ordering code:
#      "ATmega1284P", "ATmega1284P-AU", "ATmega1284P-MUR".
#   2. A CAD library's device name, which is the part with an UNHYPHENATED package
#      letter appended: "ATMEGA1284M" (Eagle's MLF44 device, and the margay
#      datalogger's U1) and "ATMEGA1284A" (its TQFP one).
#
# Form 2 does not say P or non-P, so binding it here is a choice. Two things back
# it. Atmel's own ordering codes ALWAYS hyphenate the package (-AU, -MU, -PU), so
# an unhyphenated trailing letter cannot be an ordering code and is a library's
# device name; and the board that produced this spelling carries an MPN attribute
# reading "ATMEGA1284P-MUR", which the matcher prefers over the value field, so on
# that board the P is not a guess at all. On a board that gives no MPN it is one,
# and the cost of being wrong is small: the two cores share this pinout and differ
# in picoPower sleep behaviour and fuse defaults, not in anything here.
#
# The BARE "ATmega1284" and its hyphenated codes belong to the entry below.
value_re = "(?i)^ATmega1284(P([-_]?(AU|MU|PU|AUR|MUR))?|M|A)$"

[models.params]
# hauksbee-mcu backend identifier. simavr models `atmega1284` and `atmega1284p` as
# distinct cores and this entry names the P.
backend = "simavr:atmega1284p"

[models.pins]
# Section 5.1.2, 44-pad TQFP/VQFN. Cross-checked against the margay
# datalogger's own net names, which agree pad for pad (pad 4 RST, pads 5/17/38
# on the 3V3 rail, pads 6/18/28/39 on GND, pads 7/8 on the crystal, pad 27
# AVCC, pad 29 AREF).
"1"  = "pb5_mosi"
"2"  = "pb6_miso"
"3"  = "pb7_sck"
"4"  = "reset"
"5"  = "vcc"
"6"  = "gnd"
"7"  = "xtal2"
"8"  = "xtal1"
"9"  = "pd0_rxd0"
"10" = "pd1_txd0"
"11" = "pd2_rxd1_int0"
"12" = "pd3_txd1_int1"
"13" = "pd4_xck1_oc1b"
"14" = "pd5_oc1a"
"15" = "pd6_oc2b_icp1"
"16" = "pd7_oc2a"
"17" = "vcc2"
"18" = "gnd2"
"19" = "pc0_scl"
"20" = "pc1_sda"
"21" = "pc2_tck"
"22" = "pc3_tms"
"23" = "pc4_tdo"
"24" = "pc5_tdi"
"25" = "pc6_tosc1"
"26" = "pc7_tosc2"
"27" = "avcc"
"28" = "gnd3"
"29" = "aref"
"30" = "pa7_adc7"
"31" = "pa6_adc6"
"32" = "pa5_adc5"
"33" = "pa4_adc4"
"34" = "pa3_adc3"
"35" = "pa2_adc2"
"36" = "pa1_adc1"
"37" = "pa0_adc0"
"38" = "vcc3"
"39" = "gnd4"
"40" = "pb0_xck0_t0"
"41" = "pb1_clko_t1"
"42" = "pb2_int2_ain0"
"43" = "pb3_oc0a_ain1"
"44" = "pb4_ss_oc0b"
# The QFN/MLF exposed pad. The datasheet's package drawing shows it as a
# thermal/ground land; every board that fits this part ties it to GND, and the
# margay does. Named `gnd5` so the binder counts it as a ground connection
# rather than reporting the pad as unmodelled.
"TH" = "gnd5"

[models.ratings]
# Table 29-1 Absolute Maximum Ratings.
max_pin_current_a = 0.04  # DC current per I/O pin, 40.0 mA
max_current_a = 0.2       # DC current VCC and GND pins, 200.0 mA
max_voltage_v = 6.0       # Maximum operating voltage

# ─────────────────────────────────────────────────────────────────────────────
# ATmega1284, the non-P part. Same datasheet, same 44-pad map, DIFFERENT simavr
# core, and that last difference is the only reason this is a separate entry.
#
# Source: as the ATmega1284P entry above (Atmel-42719C-ATmega1284P_Datasheet_
#   Complete-10/2016), whose title covers both devices; section 5.1.2 for the pad
#   map and Table 29-1 for the ratings.
#
# WHY NOT ONE ENTRY WITH ONE BACKEND. Nothing would tell the user. The scheduler's
# `detect_substitution` deliberately returns None for every `simavr:` backend,
# because the premise of that path is that simavr models the part it is handed; so
# a shared entry naming `simavr:atmega1284p` would run a non-P board's firmware on
# a P core with no warning anywhere in the report. The two parts differ in their
# picoPower sleep behaviour and in fuse defaults rather than in anything this pad
# map carries, but "the difference is small" is not the same as "the difference is
# disclosed", and one extra entry costs nothing.
[[models]]
id = "atmega1284"
kind = "mcu"
description = "ATmega1284 (non-P) 8-bit AVR MCU, 44-lead TQFP or 44-pad VQFN/MLF"

[models.match]
# The bare part and its HYPHENATED ordering codes. The hyphen is what separates
# these from the CAD-library device names ("ATMEGA1284M", "ATMEGA1284A"), which the
# entry above claims for the reason set out there; and this regex has no optional
# `P`, so no P spelling can reach it.
value_re = "(?i)^ATmega1284(-(AU|MU|PU|AUR|MUR))?$"

[models.params]
# The non-P core, which simavr models separately from the P.
backend = "simavr:atmega1284"

[models.pins]
# Identical to the ATmega1284P entry above: one datasheet, one pinout figure.
"1"  = "pb5_mosi"
"2"  = "pb6_miso"
"3"  = "pb7_sck"
"4"  = "reset"
"5"  = "vcc"
"6"  = "gnd"
"7"  = "xtal2"
"8"  = "xtal1"
"9"  = "pd0_rxd0"
"10" = "pd1_txd0"
"11" = "pd2_rxd1_int0"
"12" = "pd3_txd1_int1"
"13" = "pd4_xck1_oc1b"
"14" = "pd5_oc1a"
"15" = "pd6_oc2b_icp1"
"16" = "pd7_oc2a"
"17" = "vcc2"
"18" = "gnd2"
"19" = "pc0_scl"
