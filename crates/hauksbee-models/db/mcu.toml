basis = "ESP32-C6-MINI-1 module: pad-to-GPIO mapping from ESP32-C6-MINI-1 & MINI-1U Datasheet v1.5 (sha256 26691033f31cbebf623842c16624e61151b152533c13a850c091c8e858c510a2) Pin Definitions table (p.11). Espressif ESP32-C6 Series Datasheet v1.5 (sha256 372a5b42b2900c83ef4309149c8835e9ae2d1be19244995bf2fb83af4dc5edf1) Table 2-1 Pin Overview (pp.16-18) and note 4 (p.18): a pin's internal weak pull-up and pull-down resistors are configurable by IO_MUX_FUN_WPU/WPD. ESP32-C6 Technical Reference Manual v1.2 (sha256 e08d5b61ebcfa2a78f9735e3f721817cb1dc2df9cf05096d2f0399eaba9f1734) section 7.4.3 (p.249) 'Set or clear IO_MUX_GPIOx_FUN_WPU and IO_MUX_GPIOx_FUN_WPD' and Register 7.20 IO_MUX_GPIOn_REG (n: 0-30) IO_MUX_GPIOn_FUN_WPU (p.283). Not listed: pads 17/18 (GPIO12/GPIO13, USB D-/D+: pull decided by the USB pull-up while the USB function is enabled, datasheet p.18), pad 20 (GPIO15: datasheet section 3.4 p.36 says the strapping pin 'does not have any internal pull resistors', which conflicts with the register description, so left undecided), EN and supply pads"
