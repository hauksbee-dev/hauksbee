# The QFN/MLF exposed pad. The datasheet's package drawing shows it as a
# thermal/ground land; every board that fits this part ties it to GND, and the
# margay does. Named `gnd5` so the binder counts it as a ground connection
# rather than reporting the pad as unmodelled.
"TH" = "gnd5"

