[models.pin_capability.routed]
basis = "Espressif ESP32-S3 Series Datasheet v2.2 (PDF page = printed page), Section 4.1.3.1 IO MUX and GPIO Matrix (p.40): 'A full-switching matrix between the peripheral input/output signals and the GPIO pins; 175 digital peripheral input signals can be sourced from the input of any GPIO pins; the output of any GPIO pins can be from any of the 184 digital peripheral output signals'; Section 2.3.5 Peripheral Pin Assignment, Table 2-9 (p.26-27; its UART0, UART1, SPI2, UART2, I2C, LED PWM, MCPWM, RMT and PCNT columns list GPIOn (P2/P3) on the GPIO pads), footnote 2: 'Signals of UART0, UART1, SPI0/1, and SPI2 interfaces can be mapped to any GPIO pins through the GPIO Matrix, regardless of whether they are directly routed to fixed pins via IO MUX'; a peripheral without priority 1 pins, such as UART2, 'can be assigned to any GPIO pins'. ESP32-S3 Technical Reference Manual v1.8 (PDF page = printed page), Chapter 6 IO MUX and GPIO Matrix, Section 6.11 Table 6.11-1 Peripheral Signals via GPIO Matrix (p.483-489): U0TXD_out/U0RXD_in/U1TXD_out/U1RXD_in (p.483), ledc_ls_sig_out0 (p.485), I2CEXT0_SCL/SDA in/out and FSPICLK/FSPID/FSPIQ in/out (SPI2, p.486), pwm0_cap0_in~pwm0_cap2_in (MCPWM capture inputs, p.489); the MCPWM peripheral has 'a capture module' (ESP32-S3 Datasheet p.57), which is the timer input-capture channel. Pads with fixed in-package flash/PSRAM or strapping roles are not removed from the matrix by the datasheet (priority 3/4 only means use with caution); hardware peripheral only, a software (bit-banged) implementation can use any pad Module datasheet: ESP32-S3-MINI-1 & MINI-1U Datasheet v1.7, Section 5.1 (p.17) points to the TRM Peripheral Signals via GPIO Matrix."
functions = ["spi_sck", "spi_mosi", "spi_miso", "i2c_sda", "i2c_scl", "uart_tx", "uart_rx", "pwm", "timer_capture"]


# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   ESP32-S3-MINI-1 Datasheet v1.7 (https://www.espressif.com/sites/default/files/documentation/esp32-s3-mini-1_mini-1u_datasheet_en.pdf) sha256 4d4b7f1c17b484c627aaa0f806566c48a6124a8e466c6d21d99210e6eacdef04;
#   ESP32-S3 Technical Reference Manual v1.8 (https://www.espressif.com/sites/default/files/documentation/esp32-s3_technical_reference_manual_en.pdf) sha256 4484bf8a69035ec42a731c58c64ada6fbd1f1618c5559409f134d9ea083f444f.
[[models.pin_bias]]
role = "gpio44_rxd0"
level = "high"
needs = "idle"
opposed_only = true
basis = "ESP32-S3-MINI-1 Datasheet v1.7 PDF p.15 (section 3.1 Chip Boot Mode Control): \"In Joint Download Boot mode, users can download binary files into flash using UART0 or USB interface.\"; PDF p.12 Table 3 Pin Definitions: \"RXD0 40 I/O/T U0RXD, GPIO44, CLK_OUT2\"; ESP32-S3 TRM v1.8 PDF p.930 (UART chapter, 26.4.4 UART Data Frame): \"The START bit is logical low, whereas STOP bits are logical high.\"; same page: \"The receiver can also detect the Break conditions when the RX data line remains logical low for one NULL character transmission\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

# ─────────────────────────────────────────────────────────────────────────────

# ESP32-S2-MINI-1 / -1U module (65 pads; -N4 / -N4R2 and end-of-life -H4 variants, datasheet v1.6 Tables 1-2 p.10).
# Source: Espressif ESP32-S2-MINI-1 & MINI-1U Datasheet v1.6, Table 3 Pin
# Definitions (PDF pp.11-12), Tables 9-11 (VDD33 maximum 3.6 V, recommended
# 3.0-3.6 V, VIH min 0.75 x VDD, VIL max 0.25 x VDD). No co-sim core exists for
# the S2 (as on esp32s2_wroom); lint, strap, envelope and rating checks read the
# pad map. tests/suite/module_pad_tables/esp32_s2_mini_1.tsv is the datasheet
# table this map is checked against pad by pad.
[[models]]
id = "esp32s2_mini1"
kind = "mcu"
description = "Espressif ESP32-S2-MINI-1/-1U module, 65 pads (structure only, no co-sim core)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.espressif.com/sites/default/files/documentation/esp32-s2-mini-1_esp32-s2-mini-1u_datasheet_en.pdf"
title = "Espressif ESP32-S2-MINI-1 & MINI-1U Datasheet v1.6"
locator = "Table 3 Pin Definitions (PDF pp.11-12); Table 9 Absolute Maximum Ratings; Table 10 Recommended Operating Conditions; Table 11 DC Characteristics; Section 3.3 Strapping Pins"
sha256 = "06999476c9d1dede2e6828384dc79aa1e7935059e0fc8349e51f0c962fcfa882"

[models.match]
value_re = "(?i)^ESP32[-_ ]?S2[-_ ]?MINI[-_ ]?1(U|/U)?([-_ ]?(N\\d+(R\\d+)?|H\\d+))?$"

[models.params]
must_not_float_roles = "en"

