# STM32F777xx/F778Ax/F779xx datasheet DS11243 Rev 8 (July 2025): Table 10 Legend/abbreviations p.66, RST
# "Bidirectional reset pin with weak pull-up resistor"; sec. 6.3.21 NRST pin characteristics p.162: "connected
# to a permanent pull-up resistor, RPU (see Table 66)". Pad 14 = NRST on LQFP100 (Table 11 pin definitions pp.68-69).
[[models.straps]]
role = "reset"
level = "high"
boot_select = false
internal_pull = "pull_up"
note = "NRST is active low with a weak internal pull-up; held low it keeps the part in reset"

# ADC pads. STMicroelectronics STM32F777xx/F778Ax/F779xx datasheet DS11243 Rev 8 (July 2025), Table 11 pin and
# ball definitions (datasheet pp.66-85, ADC rows pp.69-71), LQFP100 column: PC0-PC3 (pads 15-18) and PA0-PA3 (22-25) carry
# ADC1/2/3_INn, PA4-PA7 (28-31), PC4/PC5 (32, 33) and PB0/PB1 (34, 35) carry ADC1/2_INn only (PA4-PA7,
# PC4, PC5, PB0, PB1 have no ADC3 channel).
