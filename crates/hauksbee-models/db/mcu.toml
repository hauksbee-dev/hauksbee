# ─────────────────────────────────────────────────────────────────────────────
# ESP32 family. The classic ESP32, ESP32-S3 and ESP32-C3 co-simulate through
# the Espressif-QEMU backend (`backend = "qemu:..."`, see docs/cosim/MCU.md);
# with no firmware given the scheduler leaves the MCU out and the board solves
# as a passive circuit, so extraction/report and the strap lint work regardless.
#
# All strap data below is from the Espressif TRMs/datasheets, cited per entry.
# The strap-pin lint reads `[models.straps]` + the pad->role map to find which
# net each strap sits on, then flags a strap net driven by a free-running clock
# at reset, biased to the wrong level, or left with no defined level.
#
# PAD MAPS ARE PER PACKAGE. A module (WROOM/WROVER/MINI) and the bare chip
# number the same GPIO on different pads, so a pad map is true only on the
# package it was read from. Where a family name ("ESP32-S3") is used for both,
# the entries follow the rp2040/rp2040_qfn56 pattern: a value-only identity
# entry (backend and coverage, NO pad map and NO strap table, so the strap lint
# cannot examine a wrong pad and mcu_coverage reports the straps as unchecked)
# plus one `footprint_re`-gated entry per package whose map was verified. The
# footprint match adds specificity, so the package entry wins when it applies.
# Pin numbers: Espressif datasheets (cited per entry) cross-checked against the
# KiCad 9 RF_Module / MCU_Espressif symbols. The strap `vdd` role is the supply
# pad of the domain that powers the strap IO (the one VIL/VIH scale with).

[[models]]
id = "esp32_wroom"
kind = "mcu"
description = "Espressif ESP32 classic module (WROOM-32 / WROVER)"

[models.match]
# ESP-WROOM-32 / ESP32-WROOM-32(E/D/U/-N4/-N8/-N16) / ESP32-WROVER modules. The
# trailing flash/PSRAM/revision suffixes (e.g. "ESP32-WROOM-32E-N4" on the
# Olimex EVB rev L) must all match the same strap table, so the suffix is left
# open after "32". The value names the module, so it fixes the pad map. A bare
# "ESP32"/"ESP32-D0WD" value is a QFN chip: see esp32 / esp32_qfn48 below.
value_re = "(?i)^(ESP[-_ ]?WROOM[-_ ]?32|ESP32[-_ ]?WRO(OM|VER)[-_ ]?32?.*)$"
# No mpn_re: match rules are ANDed, so an mpn_re would reject the common case
# of a board whose ESP32 carries no MPN property (Olimex EVB, most KiCad libs).

[models.params]
# hauksbee-mcu backend identifier: the QEMU backend boots the matching Espressif
# QEMU machine (esp32) from the merged flash image and bridges GPIO (via the RAM
# mailbox) / UART through QMP + gdbstub + the serial socket. The ESP32 is a 3.3 V
# part; the scheduler drives its GPIO outputs at 3.3 V (the qemu: prefix selects
# the rail, same as renode:). With no firmware given the scheduler skips the
# MCU entirely, so lint/report-only runs never need QEMU.
backend = "qemu:esp32"

[models.pins]
# ESP-WROOM-32 module pad map (KiCad RF_Module:ESP32-WROOM-32 / Olimex symbol).
# Strap pads carry flat "gpio<n>" roles: the binder's gpio_of_role parses them
# (port '0', bit n) for co-sim drive, and the strap lint matches them against
# [models.straps] by exact string. Pad numbers verified against the Olimex
# ESP32-EVB netlist (U3 = ESP-WROOM-32): pad25=GPIO0, 24=GPIO2, 29=GPIO5,
# 14=GPIO12/MTDI, 23=GPIO15/MTDO, and the KiCad symbol (35 = TXD0/IO1,
# 34 = RXD0/IO3; pad 33 is IO21). The demo-board pads (GPIO4, UART0) keep the
# "p0<bit>" convention; both spellings resolve to the same port/bit.
"1"  = "vss"        # GND
"2"  = "vdd"        # 3V3
# ESP32-WROOM-32E & WROOM-32UE Datasheet v2.1, Table 3 "Pin Definitions": EN is
# pad 3, "High: On; enables the chip. Low: Off; the chip shuts down" (CHIP_PU,
# whose rising edge latches the straps: Table 5, tH >= 1 ms after it).
"3"  = "en"
"25" = "gpio0"
"24" = "gpio2"      # alive indicator on the QEMU demo board (LED path)
"29" = "gpio5"
"14" = "gpio12"    # MTDI
"23" = "gpio15"    # MTDO
"26" = "p04"        # GPIO4: ~5 Hz blink, observable through the solved circuit
"35" = "p01_txd"    # TXD0 (UART0 TX, GPIO1)
"34" = "p03_rxd"    # RXD0 (UART0 RX, GPIO3)

[models.pin_capability.adc]
basis = "Espressif ESP32-WROOM-32E Datasheet v2.1, Table 3 Pin Definitions (PDF p.11): pad to GPIO to ADC channel. Lists the pads of [models.pins] only; GPIO5 (pad 29) and the UART pads carry no ADC channel. ADC2 channels are not usable while the Wi-Fi driver runs (ESP-IDF note, not in the datasheet)"
[models.pin_capability.adc.pads]
"14" = "ADC2_CH5"
"23" = "ADC2_CH3"
"24" = "ADC2_CH2"
"25" = "ADC2_CH1"
"26" = "ADC2_CH0"

# ESP32-WROOM-32E & WROOM-32UE Datasheet v2.1: Table 3 Pin Definitions p.11, EN pad 3 "High: On; enables the
# chip. Low: Off; the chip shuts down. Note: Do not leave the pin floating." Figure 7 ESP32-WROOM-32E Schematics
# p.37 shows CHIP_PU wired straight to module pad 3 with no pull-up or RC on the module; sec. 9 p.39 asks for
# the RC delay (R = 10 kOhm, C = 1 uF) on the host board.
[[models.straps]]
role = "en"
level = "high"
boot_select = false
internal_pull = "none"
note = "EN (CHIP_PU) high = chip enabled, low = chip off; the module has no on-board pull on EN, so an undriven net floats"

[models.ratings]
max_pin_current_a = 0.04   # ~40 mA abs max source/sink per pad (datasheet)
max_current_a = 0.5
# ESP32-WROOM-32 datasheet v3.8 Table 12 / ESP32-WROOM-32E v2.1 Table 13, Absolute
# Maximum Ratings, VDD33 -0.3 to 3.6 V. The recommended ceiling (Table 13 / 14,
# 3.0-3.6 V) is the same 3.6 V, so there is no gap for an envelope to flag.
max_voltage_v = 3.6

# Strapping pins. Ref: ESP32 Technical Reference Manual v5.1, Table "Strapping
# Pins" (sec "IO_MUX and GPIO Matrix"), and ESP32 datasheet v4.3, sec 5.10
# "Strapping Pins". Latched on the rising edge of the chip-power-on reset; the
# level must be stable through the latch window.
[[models.straps]]
role = "gpio0"
level = "high"
boot_select = true   # latches SPI-vs-download boot; unrecoverable in firmware
# VIL max 0.25 x VDD, VIH min 0.75 x VDD (VDD = the pad's I/O supply): ESP32
# Datasheet v5.3, Table 5-3 "DC Characteristics (3.3 V, 25 °C)",
# https://www.espressif.com/sites/default/files/documentation/esp32_datasheet_en.pdf
vil = [0.25, 0.0]
vih = [0.75, 0.0]
note = "GPIO0 high = SPI boot (normal); low = download/UART boot. A 50 MHz clock here randomly enters download mode (Olimex ESP32-EVB)"

[[models.straps]]
role = "gpio2"
level = "low"     # low-or-floating; must NOT be pulled high during download
note = "GPIO2 must be low or floating at reset; tie-high blocks download mode"

[[models.straps]]
role = "gpio12"   # MTDI
level = "low"
note = "MTDI/GPIO12 selects VDD_SDIO flash voltage: low = 3.3 V (normal), high = 1.8 V"

[[models.straps]]
role = "gpio15"   # MTDO
level = "high"
note = "MTDO/GPIO15 high (normal) silences boot log on U0TXD; low enables it"

[models.coverage]
implements = ["xtensa_lx6_firmware_execution", "boot_to_application", "gpio_output_register_or_mailbox_observation", "uart_tx", "wall_bounded_virtual_time", "gpio_input_mailbox_contract", "adc_input_mailbox_contract", "i2c_spi_mailbox_contract", "tmp105_temperature_injection"]
missing = ["instruction_counted_timing", "unmodified_firmware_gpio_input", "native_adc_peripheral", "unmodified_firmware_i2c_spi_observation", "watchdog_behavior", "silicon_power_current_profile", "silicon_timing_and_errata"]

# ─────────────────────────────────────────────────────────────────────────────

# Bare classic ESP32 chip, package unknown: identity only (see the family note).
[[models]]
id = "esp32"
kind = "mcu"
description = "Espressif ESP32 classic bare chip (ESP32-D0WD*), package not recognised"

[models.match]
value_re = "(?i)^ESP32(-D0WD.*)?$"

