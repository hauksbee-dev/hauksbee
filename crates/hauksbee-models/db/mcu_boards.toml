# Plug-in development boards placed whole on a carrier board: the processor is
# on the dev board, and the carrier's footprint is the dev board's header.
#
# A board that plugs in an ESP32-DevKitC, a Seeed XIAO or an Adafruit Feather
# never draws the processor, its crystal or its regulator: they are on the dev
# board. Each card here names the processor the dev board carries (its
# `backend`), the crystal on the dev board (`module_clock_*`), the rails its
# own regulator sources on the header (`supply_outputs`), and how each header
# pin reaches the processor.
#
# HEADER MAPS BY LABEL. A dev board's header pad NUMBERS are whatever the
# library that drew its footprint chose (J2-1..J3-19 on one, 1..38 on another),
# but its LABELS (`IO21`, `D10`, `3V3`) are the board's own silkscreen and every
# symbol for it carries them as pin names. So the map is `[models.header_labels]`
# (label -> role), matched against the pad's pin name; `[models.pins]` (pad
# number -> role) is given only for a footprint whose numbering is fixed (a
# KiCad library footprint), and a pad that names a label takes the label's role
# over it. Labels are matched ignoring case. Every role is the processor's own
# pin role (`gpio21` on an ESP32 or RP2040, `pc7` on an AVR), so the co-sim
# drives the right pin.
#
# 3.3 V boards: the header's 5 V / USB pin is NOT given the role `5v` (that role
# is an MCU logic supply, and a module's GPIO drivers would be routed to it). It
# is `vbus_5v`, an input to the dev board's regulator.
#
# ONLY ADD A BOARD WHOSE MAP COMES FROM ITS VENDOR'S SCHEMATIC OR PIN TABLE,
# cited with the file, its sha256 and the page.

# ─────────────────────────────────────────────────────────────────────────────
# Espressif ESP32-DevKitC V4 (ESP32-WROOM-32E / -32UE, and -VE / -VIE with the
# WROVER-E). Header labels and the GPIO behind each: ESP32-DevKitC V4 user guide
# (docs.espressif.com/projects/esp-dev-kits/en/latest/esp32/esp32-devkitc/user_guide.html,
# sha256 3d34bfe7826be44b0a5a082d46fe9dec1dd4d4eb9fed3f87b709064934e0ac0f),
# "Header Block" tables J2 and J3; the schematic (dl.espressif.com/dl/schematics/
# esp32_devkitc_v4_sch.pdf, sha256 ea500de5a3bfa97633f32ddb88fabd2d680637225190ea9c3f81e91b7d8bb7f6,
# p.1; and the 2017 esp32_devkitc_v4-sch.pdf, sha256
# 92961687b5fac64b8870ddc2f5e8528351e515b6cafd49e7d1bba4fb974a7349, p.1) shows the
# same J2/J3 nets, naming the flash pins SD0..SD3 where the guide's silkscreen
# says D0..D3. Both spellings are labels here.
[[models]]
id = "esp32_devkitc_v4"
kind = "mcu"
description = "Espressif ESP32-DevKitC V4 dev board (ESP32-WROOM-32E/UE or WROVER-E, 2 x 19-pin header)"

[models.match]
# "ESP32-DevKitC", "ESP32-DevKitC-V4", "ESP32-DEVKITC-32E", "ESP32-DevKitC-VE"
# (the ordering codes in the user guide's Ordering Information table). The
# ESP32-S2/S3/C3 DevKits begin "ESP32-S3-..." and do not match.
value_re = "(?i)^(Espressif[-_ ]?)?ESP32[-_ ]?DevKitC([-_ ]?(V4|32D|32E|32UE|32U|VE|VIE|N4|N8|N16|R2|R8))*$"

[models.params]
backend = "qemu:esp32"
# The 40 MHz crystal is inside the WROOM-32E / WROVER-E can (cited as on the
# esp32_wroom card in mcu.toml); the DevKitC carrier carries none (schematic p.1).
module_clock_hz = 40000000
module_clock_source = "Espressif ESP32-WROOM-32E datasheet v2.1 PDF p.2: 40 MHz crystal oscillator integrated on the module (WROVER-E datasheet PDF p.2 states the same); the ESP32-DevKitC V4 schematic p.1 draws no crystal on the carrier"
module_flash = "4/8/16 MB SPI flash inside the module, ESP32-WROOM-32E datasheet v2.1 PDF p.2-3"

