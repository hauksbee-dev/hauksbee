# ─────────────────────────────────────────────────────────────────────────────
# Adafruit Feathers. All of them share KiCad's Module:Adafruit_Feather footprint.
# Pads 1..16 are Adafruit's JP1 pins 16..1, and pads 17..28 are JP3 pins 12..1.
# That numbering was checked pin by pin against KiCad's
# MCU_Module:Adafruit_Feather_HUZZAH32_ESP32 symbol (see the HUZZAH32 section
# below), so each card gives the pad map as well as the labels.
# On every Feather, the pin labelled EN is the 3.3 V REGULATOR's enable, not the
# processor's. The processor's reset is the RST / RESET pin (pad 1).

# Adafruit HUZZAH32 ESP32 Feather (ESP32-WROOM-32).
# Map: Adafruit's Eagle schematic "Adafruit HUZZAH32 ESP32 Feather.sch"
# (github.com/adafruit/Adafruit-HUZZAH32-ESP32-Feather-PCB, sha256
# c94cbaf666b6cde286453c09c5263a185b167b1a747a9e404b9103fc0cacc414), from the
# netlist of JP1 / JP3 to X2 ESP32_WROOM32.
# GPIO numbers were cross-checked against:
# - the pinout PDF (sha256
#   7bf736651854a04ea2d7293e124e2be86c66ef70c1f0fc3ab47c08c8f07c279b) p.1;
# - the learn guide adafruit-huzzah32-esp32-feather.pdf (sha256
#   cb04c0aacd1c702cc1dbd7e795c5b7272ccc5485f655bd3273c11a90bbd5d080) pp.10-13.
# RX/TX are GPIO16/17 (guide p.10: "not connected to the USB/Serial converter").
[[models]]
id = "adafruit_feather_huzzah32"
kind = "mcu"
description = "Adafruit HUZZAH32 ESP32 Feather (ESP32-WROOM-32, 28-pin Feather header)"

[models.match]
# "Adafruit_Feather_HUZZAH32_ESP32" (KiCad MCU_Module), "HUZZAH32", "Feather HUZZAH32".
value_re = "(?i)^(Adafruit[-_ ]?)?(Feather[-_ ]?)?HUZZAH[-_ ]?32([-_ ]?ESP32)?([-_ ]?Feather)?$"

[models.params]
backend = "qemu:esp32"
module_clock_hz = 40000000
module_clock_source = "ESP32-WROOM-32E datasheet v2.1 PDF p.2: 40 MHz crystal integrated in the module (as on the esp32_wroom card); the HUZZAH32 schematic places no crystal outside X2"

