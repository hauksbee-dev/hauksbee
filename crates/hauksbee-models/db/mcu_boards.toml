[models.pin_capability.timer_capture]
basis = "Raspberry Pi RP2040 Datasheet (build-date 2025-02-20): the system timer (section 4.6.1 Overview, printed p.534) has one 64-bit counter and four match alarms and no input-capture channel; no pad latches a timer count on an edge (Table 2 GPIO Bank 0 Functions, section 1.4.3, printed pp.12-13, lists no capture function). PWM B-pin input mode (section 4.5.2.5, printed p.527) gates or counts edges but does not latch a timestamp, and PIO is not a fixed-function peripheral, so the package has no timer-capture pads."
