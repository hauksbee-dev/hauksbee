# Electrical Characteristics, AMS1117-3.3 output voltage: 3.251 / 3.300 / 3.349 V at
# VIN = 4.8 V, IOUT = 0 mA, TJ = 25 C, and 3.201 / 3.300 / 3.399 V on the row below
