# ─────────────────────────────────────────────────────────────────────────────
# Seeed Studio XIAO RP2040. Map: schematic Seeed-Studio-XIAO-RP2040-v1.3.pdf
# (files.seeedstudio.com/wiki/XIAO-RP2040/res/, sha256
# 0da8a6c0cf1464c82ac3964b6a933b634761621a884ab1f498f61f777b42aeef) p.1: header J2
# pins 1..7 carry nets A0, A1, A2, A3, SDA, SCL, TX and J4 pins 1..7 carry RX, SCK,
# MISO, MOSI, 3V3, GND, VBUS; the nets reach U6 RP2040 pins 38/39/40/41 (GPIO26..29),
# 8 (GPIO6), 9 (GPIO7), 2 (GPIO0), 3 (GPIO1), 4 (GPIO2), 6 (GPIO4), 5 (GPIO3). The
# D0..D10 names are the wiki's pin table (wiki.seeedstudio.com/XIAO-RP2040/, "XIAO
# Pin / Function"). The pad NUMBERS of a XIAO footprint are not given by Seeed, so
# this card maps by label only.
[[models]]
id = "seeed_xiao_rp2040"
kind = "mcu"
description = "Seeed Studio XIAO RP2040 dev board (RP2040, 14 castellated pins)"

[models.match]
# "XIAO RP2040", "Seeed XIAO RP2040", "XIAO-RP2040-DIP" (Seeed's KiCad library).
# The XIAO RP2040 Plus has more pins and is not matched.
value_re = "(?i)^(Seeed[-_ ]?(Studio[-_ ]?)?)?XIAO[-_ ]?RP2040([-_ ]?(DIP|SMD|SMT))?$"

[models.params]
backend = "renode:rp2040"
# The crystal X3 (schematic p.1) carries no printed frequency. The board is
# programmed through the RP2040's USB bootloader (wiki "XIAO-RP2040-with-Arduino":
# hold BOOT and click RUN to enter boot mode for upload), and the RP2040
# Datasheet (build 2025-02-20, sha256
# be56fbb75ba0ae9e26558a73c93ac3e75c2ad4e6878d3b6703de2a76d886ea8c) PDF p.12,
# XIN and XOUT: "The USB bootloader requires a 12MHz crystal or 12MHz clock
# input". So the crystal is 12 MHz.
module_clock_hz = 12000000
module_clock_source = "RP2040 Datasheet PDF p.12: the USB bootloader requires a 12MHz crystal; the XIAO RP2040 is flashed through that bootloader (Seeed wiki XIAO-RP2040-with-Arduino) and its crystal X3 (schematic v1.3 p.1) prints no other frequency"
module_flash = "2 MB, U3 GD25Q16CEIG, XIAO RP2040 schematic v1.3 p.1"

