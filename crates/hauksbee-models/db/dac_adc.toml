# DAC and ADC models.

[[models]]
id = "mcp4728"
kind = "dac"
description = "MCP4728 quad 12-bit I2C DAC with internal EEPROM, MSOP-10"

[models.match]
value_re = "(?i)^MCP4728"
mpn_re   = "(?i)MCP4728"

[models.params]
# Source: Microchip MCP4728 datasheet DS22187E, Section 1.0 Electrical Specs
bits       = 12
vref_int   = 2.048       # internal reference voltage (V), Vref_int
vref_ext   = 5.0         # assumed external VDD reference option (V)
lsb_size_v = 0.000488    # 2.048 / 4096 V per LSB
i2c_addr   = 0x60        # default unshifted 7-bit I2C address (A2A1A0=000)
gain       = 2           # board configuration: Gx=2 (full-scale 2*Vref = 4.096 V)
sda_pin    = "3"
scl_pin    = "2"
# Supply pins
supply_pin = "1"          # VDD
gnd_pin    = "10"         # VSS
# Pad->role map matching the KiCad netlist symbol numbering (Analog_DAC
# library): VDD=1, SCL=2, SDA=3, LDAC=4, RDY/BSY=5, VOUTA..D=6..9, VSS=10.
# Schematic pinfunctions (VOUTA..VOUTD/SDA/SCL/~{LDAC}) override this when
# present, so this map only matters for PCB-only extraction.
[models.pins]
"1"  = "vdd"
"2"  = "scl"
"3"  = "sda"
"4"  = "ldac_n"
"5"  = "rdy_bsy_n"
"6"  = "vout_a"
"7"  = "vout_b"
"8"  = "vout_c"
"9"  = "vout_d"
"10" = "vss"

[models.pin_capability.open_drain]
basis = "Microchip MCP4728 DS22187E: Table 3-1 Pin Function Table (p.21) types RDY/BSY as OO (Open-Drain Output) and Section 3.5 (p.22) states the RDY/BSY pin is an open-drain N-channel driver"
[models.pin_capability.open_drain.pads]
"5" = "RDY/BSY"

[models.source]
tier = "curated-library"
[[models.source.references]]
url = "https://ww1.microchip.com/downloads/en/DeviceDoc/22187E.pdf"
title = "Microchip MCP4728 12-Bit, Quad Digital-to-Analog Converter with EEPROM Memory, DS22187E"
locator = "Table 3-1 Pin Function Table p.21; Section 3.5 RDY/BSY p.22"
sha256 = "7e6515c45a02ffe4ad7506f3347cce7714cdd56659ff2fb22b858fc0472f381e"

[models.ratings]
max_pin_current_a = 0.025
max_voltage_v = 6.5

# ─────────────────────────────────────────────────────────────────────────────

# WHY THIS ENTRY EXISTS, given it stamps no analogue device.
#
# The MCP3008 is one of the two SPI slaves the co-sim models behaviourally
# (`hauksbee_engine::Mcp3008`, driven over the `spi_mcp3008` peripheral kind);
# its electrical behaviour lives there, not here. What the model DB adds is the
# PAD MAP, and specifically the `cs` role: with it, a run spec that names this
# part as its SPI peripheral's `ref` gets exact transaction framing off the real
# chip-select edges without hand-declaring `cs_net`, because the binder can read
# which pad is chip-select straight off the part. Without it the bus falls back
# to the chunk-boundary heuristic, which is documented actively wrong (it merges
# two transactions inside one chunk and truncates one that spans a boundary).
# See `SpiFramingMode` in crates/hauksbee-engine/src/peripherals/spi.rs.
#
# `kind = "adc"` binds through the generic digital path with no `[models.logic]`
# block, which stamps NO drivers and synthesises no logic (there are no `a*`/`y*`
# role pairs here). That is deliberate: the channel inputs are read by the
# behavioural slave over the bus, and a passthrough buffer on them would be a
# fabrication. The part contributes its pad map and nothing else.
#
# WHAT THIS COSTS, stated rather than hidden: a pad-map-only entry still binds
# through the generic digital path and so counts as a RESOLVED part in the bind
# report's coverage fraction, despite modelling no electrical behaviour. This
# entry DOES add one such part, and a `model_coverage` assertion will count it as
# covered. What is pre-existing is the binder's inability to tell the two apart:
# six other logic-less entries (ch340g, cp2102, ltc6803_4, bq76952, lm5107,
# lm5109) already sit in the same position. The fix is a binder-level distinction
# between "bound" and "electrically modelled", which is a change to BindOutcome
# and not to this file.
[[models]]
id = "mcp3008"
kind = "adc"
description = "MCP3008 8-channel 10-bit SPI ADC, PDIP-16 / SOIC-16 / TSSOP-16"

# `mpn_re` ONLY, deliberately. The matcher ANDs its rules, and the engine's query
# falls `mpn` back to the Value field when a component carries no MPN property.
# So an mpn-only rule matches BOTH a part whose Value is "MCP3008..." and one
# whose Value is something generic ("ADC") with the real part number in its MPN
# property. Adding `value_re` alongside would AND the two and lose the second case.
[models.match]
# The trailing non-digit-or-end stops the rule matching the prefix of a longer
# number. The FOOTPRINT GATE is the load-bearing half: without it, a value like
# "MCP3008-breakout" (a carrier module, whose header pad 10 is whatever the module
# routed there and not the IC's CS) would bind this bare-IC 16-pin map and hand
# the co-sim a confidently wrong chip-select. Same reasoning, and the same
# spellings, as the 8-pin gate on the 25xx entry in db/digital.toml.
mpn_re = "(?i)^MCP3008([^0-9]|$)"
footprint_re = '''(?ix)
    (SOIC|SO|SOP|SSOP|TSSOP|MSOP|VSSOP|DFN|WDFN|UDFN|DIP|PDIP|DIL)
    [-_]? 16 ([^0-9]|$)
  | [-_] 16N ([^0-9]|$)
'''

[models.params]
# Source: Microchip MCP3004/3008 datasheet DS21295D, Section 1.0 Electrical
# Characteristics and Section 6.1 (packaging).
bits = 10
# No supply-draw legs: DS21295D gives IDD = 425 uA typ at VDD = 5 V, 200 ksps,
# but the part is not stamped as a digital block with drivers, so a supply leg
# would meter a device that draws nothing else here. Left unstated rather than
# stamped at a number nothing consumes.

# Pad->role map, Microchip DS21295D Section 6.1, PDIP/SOIC/TSSOP-16 pinout:
# CH0..CH7 = 1..8, DGND = 9, CS/SHDN = 10, D_IN = 11, D_OUT = 12, CLK = 13,
# AGND = 14, V_REF = 15, V_DD = 16.
#
# `cs` is the load-bearing role (see the note above). The bus roles use the
# controller-side names the rest of the tree speaks: the part's D_IN is the
# master's MOSI and its D_OUT is the master's MISO, so naming them `din`/`dout`
# would be the datasheet's vocabulary rather than the binder's, which is the
# exact failure crates/hauksbee-models/tests/pin_roles.rs exists to catch.
[models.pins]
"1"  = "ch0"
"2"  = "ch1"
"3"  = "ch2"
"4"  = "ch3"
"5"  = "ch4"
"6"  = "ch5"
"7"  = "ch6"
"8"  = "ch7"
"9"  = "dgnd"
"10" = "cs"
"11" = "mosi"
"12" = "miso"
"13" = "sck"
"14" = "agnd"
"15" = "vref"
"16" = "vdd"

[models.pin_capability.tri_state]
basis = "Microchip MCP3004/3008 DS21295D (2008): Section 1.0 Electrical Characteristics, CS Rise To Output Disable tDIS 100 ns max (p.4), and Figure 5-1 (p.20) showing DOUT HI-Z outside the conversion; DOUT is pad 12 and CS/SHDN pad 10 (Table 3-1 Pin Function Table, p.15)"
[models.pin_capability.tri_state.pads]
"12" = "cs"

[models.source]
tier = "curated-library"
[[models.source.references]]
url = "https://ww1.microchip.com/downloads/en/DeviceDoc/21295d.pdf"
title = "Microchip MCP3004/3008 2.7V 4-Channel/8-Channel 10-Bit A/D Converters with SPI Serial Interface, DS21295D, 2008"
locator = "Section 1.0 Electrical Characteristics (tDIS) p.4; Table 3-1 Pin Function Table p.15; Figure 5-1 p.20"
sha256 = "e6c2231de727395ff42b094ed4ffd185db77b3958ac0b805f97330f4ad4b1122"

[models.ratings]
# DS21295D Section 1.1 Absolute Maximum Ratings: VDD 7.0 V, and +/-25 mA on any
# output pin (the same per-pin figure the MCP4728 entry above carries).
max_pin_current_a = 0.025
max_voltage_v = 7.0

# ─────────────────────────────────────────────────────────────────────────────
# MCP3421: Microchip 18-bit delta-sigma I2C ADC with on-chip reference, SOT-23-6.
#
# Source: Microchip "MCP3421 18-Bit Analog-to-Digital Converter with I2C
#   Interface and On-Board Reference", DS22003E (2009), Table 3-1 Pin Function
#   Table, Section 1.0 Electrical Characteristics and the Absolute Maximum
#   Ratings table.
#
# Datasheet figures used:
#   VDD    = 2.7 to 5.5 V
#   VREF   = 2.048 V internal, giving a +/-2.048 V differential input range
#          (carried as `vref_int`, which is this schema's name for it; a bare
#           `vref` is not in the vocabulary and would be dropped)
#   bits   = 18 max (12/14/16/18 selectable, tied to 240/60/15/3.75 SPS)
#   VIH    = 0.7 x VDD min, VIL = 0.3 x VDD max, VHYST = 0.05 x VDD min
#   VOL    = 0.4 V max at IOL = 3 mA, VDD = 5.0 V
#   IDDA   = 145 uA typ at VDD = 3.0 V; 155 typ / 190 max at 5.0 V, converting
#   Abs max: VDD 7.0 V; any I/O -0.3 V to VDD + 0.3 V
#
# NO `voh`, and that is deliberate rather than an omission. SDA is I2C
# open-drain: the datasheet publishes no VOH for it because the part has no
# high-side driver on that pin, and the board's pull-up decides its high level.
# The SR2 entry in db/power_ics.toml records the same reasoning.
#
# THE ADDRESS IS FIXED IN SILICON, WHICH IS WHAT THE "A1" IN THE BOARD'S VALUE
# MEANS. Unlike its MCP3422/3/4 siblings the MCP3421 has no address pins; the
# three address bits are factory-set and appear in the ordering code as A0..A7.
# The margay datalogger's U14 is an MCP3421A1, whose 7-bit address is therefore
# 1101001b = 0x69. The regex accepts any of the eight options because they differ
# ONLY in that address, which this entry does not carry: there is no field for it
# and the register map is not modelled, so there is nothing for the address to be
# wrong about. A declarative sensor spec is where the address would live.
#
# DELIBERATELY NOT MODELLED: the conversion. There is no delta-sigma modulator,
# no PGA (x1/x2/x4/x8), no one-shot/continuous mode bit and no output register, so
# an I2C read returns nothing. Also absent: the internal 2.048 V reference as a
# node (it is a param, not a stamped source), and the SOT-23-6 exposed nothing
# (this package has no thermal pad).
[[models]]
id = "mcp3421"
kind = "adc"
description = "Microchip MCP3421 18-bit delta-sigma I2C ADC, SOT-23-6 (pad map, levels and reference; no register map)"

[models.match]
# The trailing digit is the factory address option (A0..A7); all eight share this
# pinout and these electricals. The MCP3422/3/4 are 2- and 4-channel parts in
# larger packages with address pins, and are correctly excluded.
value_re = "(?i)^MCP3421A[0-7]([A-Z0-9-]*)?$"

# THE BUS LEVELS BELONG HERE, and an earlier draft of this entry left them out on
# the strength of a lint warning that was wrong. `bind_component` routes an `adc`
# through `bind_digital`, which reads voh/vol/vih/vil and `supply_static_ua` just as
# it does for a `digital` entry; the lint's `adc` vocabulary simply did not list
# them, so it reported them as silently ignored when the engine in fact consumes
# them. The vocabulary is fixed in the same commit as this entry.
#
# The levels are evaluated at the 5.0 V the datasheet's table is specified at, NOT
# at the 3.3 V the margay feeds this part, because VIH/VIL are given as fractions
# of VDD and the VOL row is given only at VDD = 5.0 V; mixing a 3.3 V threshold
# with a 5 V output level would be two operating points in one entry. On a 3.3 V
# board the thresholds here are high by the ratio, which is the conservative
# direction for an input threshold.
[models.params]
bits     = 18       # maximum resolution; 12/14/16 are the faster sample-rate modes
vref_int = 2.048    # internal reference (V); the differential input range is +/-VREF
vih      = 3.5      # 0.7 x VDD min, at the table's VDD = 5.0 V
vil      = 1.5      # 0.3 x VDD max, same condition
vol      = 0.4      # max at IOL = 3 mA, VDD = 5.0 V
supply_static_ua = 155.0   # IDDA typ at VDD = 5.0 V while converting (190 max);
                           # 145 uA typ at 3.0 V
supply_pin = "5"
gnd_pin    = "2"

[models.pins]
# Table 3-1 Pin Function Table, SOT-23-6. Cross-checked against the margay
# datalogger: pad 5 on the auxiliary 3.3 V rail, pads 3/4 on the board's I2C pair,
# pad 6 tied to ground as the negative input of a single-ended measurement, and
# pad 1 on the sensed net.
"1" = "vin_plus"
"2" = "vss"
"3" = "scl"
"4" = "sda"
"5" = "vdd"
"6" = "vin_minus"

[models.ratings]
# Absolute Maximum Ratings.
max_voltage_v = 7.0    # VDD

# ─────────────────────────────────────────────────────────────────────────────
# DAC081C081CIMK: TI 8-bit I2C voltage-output DAC, SOT-23-6 (DDC).
#
# Source: Texas Instruments "DAC081C08x 8-Bit Micro Power Digital-to-Analog
#   Converter With An I2C-Compatible Interface", SNAS449F (February 2008,
#   revised May 2017). Section 6 Pin Configuration and Table 2 Pin Functions,
#   SOT column (p.4); 7.1 Absolute Maximum Ratings (p.5); 7.3 Recommended
#   Operating Conditions and 7.4 Thermal Information (p.6); 7.5 Electrical
#   Characteristics, logic and power rows (p.8); 8.5.5 Table 3 Slave Addresses
#   (p.24); 13 Package Option Addendum (CIMK / CIMKX = DDC, SOT-23-THIN, 6 pins).
#
# PACKAGE HAZARD. The WSON-6 (NGF, DAC081C081CISD) carries the same signals in
# a different order (1 ADR0, 2 SCL, 3 SDA, 4 GND, 5 VA, 6 VOUT), and the
# DAC081C085 is an 8-pin VSSOP with ADR1 and VREF. This card takes the DDC map
# only, by the CIMK order code.
#
# IDENTITY ONLY. The output is the part's whole function and it is not modelled:
# there is no 8-bit register, no I2C slave and no output amplifier, so VOUT is
# not driven and the part stays OPEN. ADR0 is a THREE-level strap (GND, VA or
# floating; Table 3: 0x0D, 0x0E, 0x0C), which the binder's address-select rows do
# not express as "floating", so no register-map personality is attached either.
[[models]]
id = "dac081c081cimk"
kind = "digital"
description = "TI DAC081C081 8-bit I2C voltage-output DAC, SOT-23-6 DDC (identity, pin map, supply range and ratings; the DAC output is not modeled, the part stays OPEN)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/dac081c081.pdf"
title = "Texas Instruments DAC081C081, DAC081C085 datasheet, SNAS449F (revised May 2017)"
locator = "Section 6 and Table 2 Pin Functions, SOT column p.4; 7.1 p.5; 7.3 and 7.4 p.6; 7.5 logic and power rows p.8; 8.5.5 Table 3 p.24; Package Option Addendum (CIMK = DDC)"
sha256 = "58c92fd6e815efd381f08c75d5d7a3342b6e6b1b7d3bd5824a8453223181adaf"
[[models.source.uncertainty]]
status = "unknown"
parameter = "dac_output_behavior"
reason = "the DAC register, I2C slave and rail-to-rail output amplifier are not modelled; VOUT is not driven"
[[models.source.pinout]]
package = "DDC (SOT)"
pins = { "1" = "VOUT", "2" = "VA", "3" = "GND", "4" = "SDA", "5" = "SCL", "6" = "ADR0" }

[models.match]
# DAC081C081CIMK, DAC081C081CIMKX, with a /NOPB or /G4 finish suffix.
value_re = "(?i)^DAC081C081CIMKX?(/(NOPB|G4))?$"

[models.params]
identity_only = true
warning = "DAC081C081 identity, SOT-23-6 pin map, supply range and ratings are sourced; the 8-bit DAC, its I2C slave and the VOUT amplifier are not modeled, so VOUT is undriven and the part stays OPEN"
unlocked_by = "an I2C DAC register model driving VOUT from VA (the reference on this package)"
# 7.5 logic rows are fractions of VA; the absolute values here are at VA = 3.3 V
# (ASSUMED operating point; the card does not know the board's VA).
vih = 2.31        # 0.7 x VA min (SCL, SDA)
vil = 0.99        # 0.3 x VA max
vol = 0.4         # SDA max at ISINK = 3 mA (open drain; no VOH)
supply_static_ua = 105.0   # IST_VA-1 typ, VA = 2.7 to 3.6 V (156 max; 132 typ at 4.5 to 5.5 V)
supply_pin = "2"
gnd_pin    = "3"

[models.pins]
# Table 2, SOT column (DDC): 1 VOUT, 2 VA, 3 GND, 4 SDA, 5 SCL, 6 ADR0.
"1" = "vout"    # analog output, 0 to VA (not driven)
"2" = "va"      # supply, also the reference on this package
"3" = "gnd"
"4" = "sda"     # open drain, external pull-up to VA
"5" = "scl"
"6" = "adr0"    # three-level address strap: GND, VA or floating

[models.ratings]
max_voltage_v = 6.5            # VA and any input pin, 7.1
max_pin_current_a = 0.01       # input current at any pin, 7.1
max_junction_temp_c = 150.0    # 7.1
theta_ja_c_per_w = 250.0       # 7.4 RthetaJA, DDC (SOT) package

[[models.envelope]]
kind = "supply_range"
pin = "va"
min_v = 2.7
max_v = 5.5
abs_max_v = 6.5
basis = "TI SNAS449F 7.3 Supply Voltage VA 2.7 V to 5.5 V; 7.1 VA -0.3 V to 6.5 V"

[models.coverage]
implements = ["pin_roles", "supply_ranges", "absolute_ratings"]
missing = ["dac_register", "i2c_slave", "vout_amplifier", "three_level_address", "power_down_modes"]

# ─────────────────────────────────────────────────────────────────────────────
# DAC43204: TI 8-bit quad voltage/current-output smart DAC, WQFN-16 (RTE).
#
# Source: Texas Instruments "DACx3204 12-Bit, 10-Bit, and 8-Bit, Quad Voltage
#   and Current Output Smart DACs With Auto-Detected I2C, PMBus, or SPI
#   Interface", SLASEX3A (March 2021, revised December 2021). Figure 5-1 and
#   Table 5-1 Pin Functions (p.3); 6.1 Absolute Maximum Ratings, 6.3 Recommended
#   Operating Conditions and 6.4 Thermal Information (p.4); 6.5 IDD row (p.6);
#   Package Option Addendum (DAC43204RTER / RTET, WQFN RTE 16).
#
# ONE PACKAGE: the family ships only in the RTE WQFN-16, so a bare DAC43204
# names the pin map. The 10- and 12-bit DAC53204 / DAC63204 share it but are
# different parts and are not matched here.
#
# IDENTITY ONLY. The DAC registers, the auto-detected I2C/PMBus/SPI interface,
# the NVM, the GPIO functions, the internal reference and LDO, and the four
# force-sense outputs are not modelled, so OUT0-OUT3 are not driven and the
# part stays OPEN.
[[models]]
id = "dac43204"
kind = "digital"
description = "TI DAC43204 8-bit quad smart DAC, WQFN-16 RTE (identity, pin map, supply range and ratings; the DAC outputs are not modeled, the part stays OPEN)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/dac43204.pdf"
title = "Texas Instruments DAC63204, DAC53204, DAC43204 datasheet, SLASEX3A (revised December 2021)"
locator = "Figure 5-1 and Table 5-1 Pin Functions p.3; 6.1, 6.3 and 6.4 p.4; 6.5 IDD row p.6; Package Option Addendum (RTE)"
sha256 = "79cbaf6418c48bb38779765a8b2326303756dab20a325f3476bedb0bc829cbca"
[[models.source.uncertainty]]
status = "unknown"
parameter = "dac_output_behavior"
reason = "the DAC registers, serial interface, NVM, GPIO functions, internal reference and LDO, and the force-sense outputs are not modelled; OUT0-OUT3 are not driven"
[[models.source.pinout]]
package = "RTE (WQFN)"
pins = { "1" = "FB3", "2" = "OUT3", "3" = "OUT2", "4" = "FB2", "5" = "GPIO/SDO", "6" = "SCL/SYNC", "7" = "A0/SDI", "8" = "SDA/SCLK", "9" = "FB1", "10" = "OUT1", "11" = "OUT0", "12" = "FB0", "13" = "CAP", "14" = "AGND", "15" = "VDD", "16" = "VREF", "17" = "Thermal Pad" }

[models.match]
# DAC43204, DAC43204RTER, DAC43204RTET.
value_re = "(?i)^DAC43204(RTE[RT]?)?$"

[models.params]
identity_only = true
warning = "DAC43204 identity, WQFN-16 pin map, supply range and ratings are sourced; the DAC channels, serial interface, NVM and GPIO functions are not modeled, so OUT0-OUT3 are undriven and the part stays OPEN"
unlocked_by = "a register model of the DACx3204 driving OUT0-OUT3 through the FBx force-sense loop"
vih = 1.62        # 6.3 digital input high, 1.7 V < VDD <= 5.5 V
vil = 0.4         # 6.3 digital input low
supply_static_ua = 600.0   # 6.5 IDD 150 uA per channel typ, four channels on (ASSUMED all on)
supply_pin = "15"
gnd_pin    = "14"

[models.pins]
# Table 5-1, RTE WQFN-16.
"1"  = "fb3"
"2"  = "out3"      # (not driven)
"3"  = "out2"      # (not driven)
"4"  = "fb2"
"5"  = "gpio"      # GPIO / SDO
"6"  = "scl"       # SCL / SYNC
"7"  = "a0"        # A0 / SDI; I2C address strap to VDD, AGND, SDA or SCL
"8"  = "sda"       # SDA / SCLK
"9"  = "fb1"
"10" = "out1"      # (not driven)
"11" = "out0"      # (not driven)
"12" = "fb0"
"13" = "cap"       # internal LDO bypass, ~1.5 uF to AGND
"14" = "agnd"
"15" = "vdd"
"16" = "vref"      # external reference, or pulled up to VDD
# Thermal pad: connect to AGND (Table 5-1), numbered 17 as KiCad's WQFN-16-1EP land is.
"17" = "thermal_pad"   # Table 5-1: connect to AGND

[models.ratings]
max_voltage_v = 6.0            # 6.1 VDD to AGND
max_pin_current_a = 0.01       # 6.1 current into any pin except OUTx
max_junction_temp_c = 150.0    # 6.1
theta_ja_c_per_w = 49.0        # 6.4 RthetaJA, RTE

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.7
max_v = 5.5
abs_max_v = 6.0
basis = "TI SLASEX3A 6.3 VDD 1.7 V to 5.5 V; 6.1 VDD -0.3 V to 6 V"

[models.coverage]
implements = ["pin_roles", "supply_ranges", "absolute_ratings"]
missing = ["dac_registers", "serial_interface", "vout_iout_outputs", "nvm", "gpio_functions", "internal_reference", "four_level_address"]

# HX711 24-bit load-cell ADC (AVIA datasheet, SparkFun mirror): extraction pipeline attempt 1, kind adc, identity plus limits; hand-fixed: value_re unanchored, PD_SCK timing rows renamed because the 'PD' in the name makes the rating lint mistake them for power-dissipation ratings. Pin table 1-16 and the 2.6-5.5 V supplies checked against the PDF.
[[models]]
id = "hx711"
kind = "adc"
description = "AVIA HX711 in SOP-16L; identity and sourced operating limits only. Does not model differential conversion, serial data/control behavior, programmable channel and gain selection, oscillator, or analog supply regulation. ABSTAIN: the datasheet does not state an SPI mode or absolute-maximum ratings."
[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"
[[models.source.uncertainty]]
status = "unknown"
parameter = "model"
reason = "datasheet publishes no validated model error interval"
[[models.source.uncertainty]]
status = "unknown"
parameter = "spi_mode"
reason = "ABSTAIN: datasheet describes a pin-driven serial interface but does not state an SPI mode"
[[models.source.uncertainty]]
