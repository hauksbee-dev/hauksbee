# DAC and ADC models.

[[models]]
id = "mcp4728"
kind = "dac"
description = "MCP4728 quad 12-bit I2C DAC with internal EEPROM, MSOP-10"

[models.match]
value_re = "(?i)^MCP4728"
mpn_re   = "(?i)MCP4728"

[models.params]
# Source: Microchip MCP4728 datasheet DS22187E, Section 1.0 Electrical Specs
bits       = 12
vref_int   = 2.048       # internal reference voltage (V) — Vref_int
vref_ext   = 5.0         # assumed external VDD reference option (V)
lsb_size_v = 0.000488    # 2.048 / 4096 V per LSB
i2c_addr   = 0x60        # default unshifted 7-bit I2C address (A2A1A0=000)
gain       = 2           # board configuration: Gx=2 (full-scale 2*Vref = 4.096 V)
sda_pin    = "3"
scl_pin    = "2"
# Supply pins
supply_pin = "1"          # VDD
gnd_pin    = "10"         # VSS
# Pad->role map matching the Tarski netlist symbol numbering (KiCad Analog_DAC
# library): VDD=1, SCL=2, SDA=3, LDAC=4, RDY/BSY=5, VOUTA..D=6..9, VSS=10.
# Schematic pinfunctions (VOUTA..VOUTD/SDA/SCL/~{LDAC}) override this when
# present, so this map only matters for PCB-only extraction.
[models.pins]
"1"  = "vdd"
"2"  = "scl"
"3"  = "sda"
"4"  = "ldac_n"
"5"  = "rdy_bsy_n"
"6"  = "vout_a"
"7"  = "vout_b"
"8"  = "vout_c"
"9"  = "vout_d"
"10" = "vss"

[models.ratings]
max_pin_current_a = 0.025
max_voltage_v = 6.5
