[models.match]
value_re = "(?i)^(?:SHT21|1-100(?:707|645|694)-01)$"

[models.params]
warning = "source-bound: the sleep VDD current (0.15 uA typ), the logic levels (evaluated at the printed VDD = 3.0 V) and the I2C protocol (T and RH triggers, user register resolution bits, soft reset, status bits and CRC-8) are executable; the measurement time and the NACK while busy, hold-master clock stretching, the heater, the end-of-battery bit and the accuracy are not represented"
vih = 2.1       # derived: 70 % x VDD (Table 4 p.6) at VDD = 3.0 V, the typical supply of Table 1
vil = 0.9       # derived: 30 % x VDD at VDD = 3.0 V
vol = { max = 0.4, unit = "V", conditions = "VDD = 3.0 V, -4 mA < IOL < 0 mA", basis = "Table 4 p.6, output low voltage VOL, max column" }
supply_static_ua = 0.15   # Table 1 p.2, supply current IDD sleep mode, typ column
supply_pin = "5"
gnd_pin = "2"

