read_a = 2.3e-05             # Table 2 p.2, IDD measure typ
write_a = 2.3e-05

[models.coverage]
implements = ["pin_roles", "supply_range", "logic_levels_at_3v3_vdd", "idle_supply_current", "bus_coupled_active_current", "supply_voltage_gating", "i2c_address_0x38", "trigger_measurement_0xAC_0x33_0x00", "status_byte_first_byte_of_read", "temperature_conversion_formula", "humidity_conversion_formula", "sensor_input_temperature_c", "sensor_input_humidity_pct", "initialization_0xBE_0x08_0x00", "soft_reset_0xBA", "crc8_poly_0x31_init_0xFF_over_six_bytes"]
