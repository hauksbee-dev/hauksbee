# VL53L0X: STMicroelectronics time-of-flight ranging module (optical LGA12). Source: DS11555 Rev 6 (footer June 2024), sha256
# f0ae51414474d311bc24c60cd77bfff968ea5c2b3765b2fb2a390b3078dd49be, https://www.st.com/resource/en/datasheet/vl53l0x.pdf. Printed page numbers
# (page N/38).
# ADDRESS. The datasheet prints the default device address as 0x52 for the write byte (section 4, Figure 14: 0101001 then R/W), which is the
# 7-bit address 0x29 used by the card.
# BEHAVIOUR. Only the registers the datasheet publishes are modelled: Table 5 'Reference registers' (0xC0 = 0xEE, 0xC1 = 0xAA, 0xC2 = 0x10,
# 0x51 = 0x0099, 0x61 = 0x0000, 'after fresh reset, without the API loaded'). The distance, range status and configuration registers are only
# in the API manual UM2039, which this batch did not read, so there is no ranging output; the coverage list says so.
# PINS. 1 AVDDVCSEL, 2 AVSSVCSEL, 3 GND, 4 GND2, 5 XSHUT, 6 GND3, 7 GPIO1, 8 DNC, 9 SDA, 10 SCL, 11 AVDD, 12 GND4 (Table 3, bottom view). The
# GPIO1 high level VOH = IOVDD - 0.4 V is an expression of the I/O supply, not a number, and is not carried as a characteristic row.
# ORDER CODES. VL53L0CXV0DH/1 (with liner) and VL53L0CXV9DH/1 (without liner) per Table 18; the part is also sold under the bare name VL53L0X.
# VL53L1X, VL53L0CXV0DH without the /1 suffix and other ST ToF parts are NOT matched.
# Cross-check: Renode (MIT, Antmicro) has no VL53L0X model; nothing was borrowed.
[[models]]
id = "vl53l0x"
kind = "digital"
description = "STMicroelectronics VL53L0X time-of-flight ranging sensor, optical LGA12, I2C address 0x29: AVDD supply draw, I2C logic levels and the identity and reference registers the datasheet publishes (the ranging engine is not modelled)"

[models.match]
value_re = "(?i)^(?:VL53L0X|VL53L0CXV[09]DH/1)$"

[models.params]
warning = "source-bound: the standby supply current, the I2C logic levels and the reference registers of Table 5 (0xC0 = 0xEE, 0xC1 = 0xAA, 0xC2 = 0x10, 0x51 = 0x0099, 0x61 = 0x0000, the fresh-reset values without the API loaded) are executable; the ranging engine, the distance and status registers (only in the API manual UM2039), XSHUT hardware standby, the GPIO1 interrupt, the programmable I2C address, the 1V8 / 2V8 I/O mode and the accuracy are not represented, so a driver that ranges will not get a distance"
vih = 1.12      # Table 11 p.20, I2C interface VIH, min column
vil = 0.6       # Table 11 p.20, I2C interface VIL, max column
vol = { max = 0.4, unit = "V", conditions = "IOUT = 4 mA in standard and fast modes, SDA", basis = "Table 11 p.20, I2C interface VOL, max column" }
supply_static_ua = 6.0    # Table 10 p.20, SW STANDBY (2V8 mode), typ column; includes AVDD and AVDDVCSEL
supply_pin = "11"
gnd_pin = "3"

[models.pins]
"1" = "avddvcsel"   # AVDDVCSEL, VCSEL supply, connected to the main supply
"2" = "avssvcsel"   # AVSSVCSEL, VCSEL ground, connected to the main ground
"3" = "gnd"   # GND, main ground
"4" = "gnd"   # GND2, to the main ground
"5" = "xshut"   # XSHUT, active-low shutdown input (always drive it; high only when AVDD is on)
"6" = "gnd"   # GND3, to the main ground
"7" = "gpio1"   # GPIO1, open-drain interrupt output (leave unconnected if unused)
"8" = "dnc"   # DNC, must be left floating
"9" = "sda"   # SDA, I2C data
"10" = "scl"   # SCL, I2C clock
"11" = "vdd"   # AVDD, supply, connected to the main supply
"12" = "gnd"   # GND4, to the main ground

# Open-drain pad(s) for the open-drain pull-up check. Source: ST VL53L0X DS11555 Rev 6 (June 2024), https://www.st.com/resource/en/datasheet/vl53l0x.pdf, sha256 f0ae51414474d311bc24c60cd77bfff968ea5c2b3765b2fb2a390b3078dd49be.
[models.pin_capability.open_drain]
basis = "ST VL53L0X DS11555 Rev 6 PDF p.4 Table 3 pin description: pin 7 GPIO1 (Digital output): \"Interrupt output. Open drain output\""
[models.pin_capability.open_drain.pads]
"7" = "GPIO1"

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.6
max_v = 3.5
abs_max_v = 3.6
basis = "VL53L0X DS11555 Rev 6 Table 8 Recommended operating conditions p.19, voltage (AVDD) 2.6 V min / 2.8 V typ / 3.5 V max"
abs_max_basis = "Table 7 Absolute maximum ratings p.19, AVDD and SCL, SDA, XSHUT, GPIO1: -0.5 V to 3.6 V"

[[models.envelope]]
kind = "supply_range"
pin = "avddvcsel"
min_v = 2.6
max_v = 3.5
abs_max_v = 3.6
basis = "Derived: Table 3 p.4 says AVDDVCSEL is 'to be connected to main supply' (AVDD), so the AVDD range of Table 8 p.19 applies, 2.6 V min / 3.5 V max"
abs_max_basis = "Table 7 Absolute maximum ratings p.19, AVDD: -0.5 V to 3.6 V (derived for the VCSEL supply pin, which Table 3 says is tied to the main supply)"

[[models.envelope]]
kind = "input_tolerance"
pins = ["sda", "scl", "xshut", "gpio1"]
max_v = 3.5
abs_max_v = 3.6
basis = "VL53L0X DS11555 Rev 6 Table 8 Recommended operating conditions p.19, IO (IOVDD) 2V8 mode 2.6 V min / 2.8 V typ / 3.5 V max (the I/Os are failsafe, with no diode to AVDD)"
abs_max_basis = "Table 7 Absolute maximum ratings p.19, SCL, SDA, XSHUT and GPIO1: -0.5 V to 3.6 V"

[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "VL53L0X"
bus = "i2c"
i2c_address = 0x29

# Table 5 (p.18), "Reference registers": the values read after a fresh reset, without the API loaded. 0xC0 / 0xC1 / 0xC2
# are the identity bytes ST's driver reads; 0x51 and 0x61 are 16-bit registers (multibyte accesses are MSB first, Table 6).
[[sensor.register]]
addr = 0xC0
const = [0xEE]

[[sensor.register]]
addr = 0xC1
const = [0xAA]

[[sensor.register]]
addr = 0xC2
const = [0x10]

[[sensor.register]]
addr = 0x51
const = [0x00, 0x99]

[[sensor.register]]
addr = 0x61
const = [0x00, 0x00]

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 2.6   # Table 8 p.19, AVDD min
idle_a = 6e-06               # Table 10 p.20, SW STANDBY typ
read_a = 0.019               # Table 10 p.20, active ranging average consumption typ (assumed while the host talks to the device)
write_a = 0.019

[models.coverage]
implements = ["pin_roles", "supply_range", "avddvcsel_supply_range", "i2c_logic_levels", "standby_supply_current", "supply_voltage_gating", "i2c_address_0x29_7bit", "reference_registers_0xC0_0xC1_0xC2_0x51_0x61_after_fresh_reset", "multibyte_registers_msb_first"]
missing = ["ranging_engine_and_distance_output", "range_status_and_result_registers_not_in_datasheet_see_UM2039", "device_settings_loaded_by_the_api", "register_map_beyond_table_5", "xshut_hardware_standby_and_boot_sequence", "gpio1_interrupt_output", "programmable_i2c_address", "io_voltage_mode_1v8_2v8", "ranging_modes_timing_budget_and_inter_measurement_period", "calibration_spad_temperature_offset_crosstalk", "ranging_accuracy_and_maximum_distance", "thermal_resistance_not_published"]

[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.st.com/resource/en/datasheet/vl53l0x.pdf"
title = "STMicroelectronics VL53L0X Time-of-Flight ranging sensor datasheet, DS11555 Rev 6 (June 2024)"
locator = "Table 2 technical specification p.3; Table 3 pin description p.4; section 2.4 application schematic notes p.5; section 3.6.2 ranging phase p.11; section 3.9 power sequence p.13; section 4 control interface and Figure 14 device address p.15; Table 4 I2C timing p.17; Table 5 reference registers p.18; Table 7 absolute maximum ratings and Table 8 recommended operating conditions p.19; Table 10 consumption and Table 11 digital I/O p.20; Table 17 storage p.32; Table 18 order codes p.34"
sha256 = "f0ae51414474d311bc24c60cd77bfff968ea5c2b3765b2fb2a390b3078dd49be"
