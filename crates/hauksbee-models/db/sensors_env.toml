r(rh_hi/4.0)%2.0) + (floor(rh_lo/128.0)%2.0) + (floor(rh_lo/32.0)%2.0) + (floor(rh_lo/16.0)%2.0) + (floor(rh_lo/2.0)%2.0))%2.0)*2.0 + ((0.0 + (floor(rh_hi/32.0)%2.0) + (floor(rh_hi/16.0)%2.0) + (floor(rh_hi/8.0)%2.0) + (rh_hi%2.0) + (floor(rh_lo/64.0)%2.0) + (floor(rh_lo/32.0)%2.0) + (floor(rh_lo/4.0)%2.0))%2.0)*4.0 + ((0.0 + (floor(rh_hi/64.0)%2.0) + (floor(rh_hi/32.0)%2.0) + (floor(rh_hi/16.0)%2.0) + (floor(rh_hi/2.0)%2.0) + (floor(rh_lo/128.0)%2.0) + (floor(rh_lo/64.0)%2.0) + (floor(rh_lo/8.0)%2.0))%2.0)*8.0 + ((0.0 + (floor(rh_hi/32.0)%2.0) + (floor(rh_hi/8.0)%2.0) + (floor(rh_hi/2.0)%2.0) + (rh_hi%2.0) + (floor(rh_lo/128.0)%2.0) + (floor(rh_lo/64.0)%2.0) + (floor(rh_lo/8.0)%2.0) + (rh_lo%2.0))%2.0)*16.0 + ((0.0 + (floor(rh_hi/128.0)%2.0) + (floor(rh_hi/16.0)%2.0) + (floor(rh_hi/8.0)%2.0) + (rh_hi%2.0) + (floor(rh_lo/128.0)%2.0) + (floor(rh_lo/64.0)%2.0) + (floor(rh_lo/8.0)%2.0) + (floor(rh_lo/2.0)%2.0) + (rh_lo%2.0))%2.0)*32.0 + ((0.0 + (floor(rh_hi/32.0)%2.0) + (floor(rh_hi/16.0)%2.0) + (floor(rh_hi/2.0)%2.0) + (rh_hi%2.0) + (floor(rh_lo/128.0)%2.0) + (floor(rh_lo/16.0)%2.0) + (floor(rh_lo/4.0)%2.0) + (floor(rh_lo/2.0)%2.0))%2.0)*64.0 + ((0.0 + (floor(rh_hi/64.0)%2.0) + (floor(rh_hi/32.0)%2.0) + (floor(rh_hi/4.0)%2.0) + (floor(rh_hi/2.0)%2.0) + (rh_hi%2.0) + (floor(rh_lo/32.0)%2.0) + (floor(rh_lo/8.0)%2.0) + (floor(rh_lo/4.0)%2.0))%2.0)*128.0), 255.0))",
