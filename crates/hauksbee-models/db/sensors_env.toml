# AHT10, AHT20 and AHT21: ASAIR (Aosong) humidity and temperature sensors on I2C address 0x38. Three cards because the three datasheets differ
# in supply range (1.8-3.6 V, 2.0-5.5 V, 2.2-5.5 V), pin order, commands and the CRC. Sources: AHT10 Technical Manual V1.1 (unofficial English
# translation, 2019/05), sha256 561ebe07d1c0fb2112cf893d0a229a77ba6196d733f9078468aaeb40f4f5a4f8; AHT20 Product manuals V1.1 (2020/04), sha256
# 203939610747f0432625a535925288a4f846feeb6a1ceb4310a0880120b1e529; AHT21 Data Sheet V1.0 (May 2021), sha256
# a7650b0d22ef8ee64edcd53282ec60c4771f18ddbe42f2e7d3d82fb6ac5ec9a6. The tables of the AHT10, AHT20 and AHT21 PDFs are images, read from page
# renders; page numbers are the printed ones except the AHT10, whose PDF has no printed numbers (PDF page numbers). AHT21B and other suffixed
# or numbered siblings are NOT matched.
# BEHAVIOUR. The write 0xAC 0x33 0x00 latches a measurement from the sensor inputs temperature_c and humidity_pct; the next read returns the
# status byte, five data bytes (humidity [19:0] then temperature [19:0], the shared byte holding humidity [3:0] in its high nibble) and, for
# AHT20 and AHT21, a CRC-8 (polynomial 0x31, initial 0xFF) over the six bytes before it. RH = S / 2^20 x 100 %, T = S / 2^20 x 200 - 50 (all
# three datasheets, signal conversion). The split of the 20-bit words over the bytes follows the datasheets' read figures, whose third byte is
# labelled humidity | temperature. Before the first trigger the data bytes read zero (not specified). The measurement completes instantly: the
# busy bit is never set.
# STATUS. The datasheets give the meaning of the bits (7 busy, 3 CAL enable) but no power-on value. The AHT10 and AHT20 cards start at 0x08
# (only the CAL bit set); the AHT21 card starts at 0x18, the value its own check mask (status AND 0x18 = 0x18) tests for. Both are assumptions
# recorded as uncertainty records.
# ADR. The AHT10 pin table prints 'Power ground' against pad 1 (ADR), a copy of the GND row; the figures label the pad ADR and no text says
# what it does or which address it selects, so the card keeps role adr, claims only address 0x38 (the datasheet's one address) and lists the
# function as missing.
# Cross-check: Renode (MIT, Antmicro) has no AHT model; nothing was borrowed.
[[models]]
id = "aht10"
kind = "digital"
description = "ASAIR (Aosong) AHT10 humidity and temperature sensor, 6-pad DFN, I2C address 0x38: VDD supply draw, logic levels and the command-framed measurement (status byte plus 20-bit humidity and temperature)"

[models.match]
value_re = "(?i)^AHT10$"

[models.params]
warning = "source-bound: the sleep VDD current (0.25 uA, a maximum, no typical is printed), the logic levels (evaluated at the printed VDD = 3.3 V) and the I2C measurement protocol (trigger 0xAC, status byte, 20-bit conversions, initialization and soft reset accepted) are executable; the measurement time and the busy bit, the status bits at power-on, the function of the ADR pad (the pin table does not describe it) and the accuracy are not represented"
vih = 2.31      # derived: 70 % x VDD (Table 7, PDF p.9) at VDD = 3.3 V, the typical supply of Table 2
vil = 0.99      # derived: 30 % x VDD at VDD = 3.3 V
vol = { max = 0.4, unit = "V", conditions = "VDD = 3.3 V, -4 mA < IOL < 0 mA", basis = "Table 7 PDF p.9, output low voltage VOL, max column" }
supply_static_ua = 0.25   # Table 2 PDF p.3, supply current IDD sleep, max column (no typical is printed)
supply_pin = "4"
gnd_pin = "5"

[models.pins]
"1" = "adr"   # ADR (the pin table prints 'Power ground' for it, a copy of pin 5; the figures label the pad ADR; its function is not described)
"2" = "sda"   # SDA, serial data
"3" = "scl"   # SCL, serial clock
"4" = "vdd"   # VDD, supply voltage
"5" = "gnd"   # GND, power ground
"6" = "nc"   # NC, stay vacant

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.8
max_v = 3.6
abs_max_v = 3.6
