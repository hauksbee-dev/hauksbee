"1" = "sda"   # SDA, serial data, bidirectional
"2" = "gnd"   # VSS, ground
"3" = "nc"   # NC, remain floating
"4" = "nc"   # NC, remain floating
"5" = "vdd"   # VDD, supply voltage
"6" = "scl"   # SCL, serial clock

