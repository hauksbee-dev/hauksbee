# Si7021-A20: Silicon Labs humidity and temperature sensor, DFN-6, I2C address 0x40. Source: Si7021-A20 datasheet Rev. 1.2 (8/16), sha256
# a31e36d07e15964a198c00eac9b93559782a0d505fe756f9574eab2561cc4f88 (SparkFun copy). Page numbers are the printed Rev. 1.2 page numbers.
# The card matches Si7021, Si7021-A20 and the twelve ordering codes of Table 15 (-GM, -GMR, -GM1, -GM1R, -IM, -IMR, -IM1, -IM1R, -YM0, -YM0R,
# -YM1, -YM1R). Si7020, Si7013, Si7006 and other Si70xx parts are NOT matched: their datasheets were not read in this batch.
# BEHAVIOUR. Same command family as the HTU21D / SHT21 cards (0xE3 / 0xF3 temperature, 0xE5 / 0xF5 humidity, 0xE6 / 0xE7 user register, 0xFE
# reset, CRC-8 poly 0x31 init 0x00) with the Silicon Labs differences: user register reset 0x3A (reserved bits read 1), the VDDS bit is read
# only, 0xE0 returns the temperature taken during the last RH measurement (no CRC), the heater control register (write 0x51, read 0x11) and
# the firmware revision (0x84 0xB8, answer 0x20 for firmware 2.0). T = 175.72 x S / 2^16 - 46.85, RH = 125 x S / 2^16 - 6; humidity LSB ends
# 10, temperature LSB ends 00. Resolution bits RES1:RES0 set the code step (RH 12/8/10/11 bit, T 14/12/13/11 bit); the code is rounded to the
# step and clamped to the representable range (a derived rule).
# PINS. 1 SDA, 2 GND, 3 DNC, 4 DNC, 5 VDD, 6 SCL; the TGND paddle is connected to GND internally and 'should be soldered to a floating pad'
# (section 7), so no pad is mapped.
# Cross-check only: Renode's SI70xx model (MIT, Antmicro) agrees on command codes and the 0x3A user register reset; no Renode code is used.
[[models]]
id = "si7021"
kind = "digital"
description = "Silicon Labs Si7021-A20 humidity and temperature sensor, 3 x 3 mm DFN-6, I2C address 0x40: VDD supply draw, logic levels and the command-framed T and RH measurement, user register, heater register, firmware revision and CRC-8"

[models.match]
value_re = "(?i)^SI7021(?:-A20(?:-(?:GM1?R?|IM1?R?|YM[01]R?))?)?$"

[models.params]
warning = "source-bound: the standby VDD current (0.06 uA typ), the logic levels (evaluated at the 3.3 V of the VOL test condition) and the I2C protocol (T and RH measurement, previous-T read, user register and heater register, firmware revision, reset, status bits and CRC-8) are executable; the measurement time and the NACK while busy, hold-master clock stretching, the heater self-heating, the VDD-low status bit, the electronic serial number and the accuracy are not represented"
vih = 2.31      # derived: 0.7 x VDD (Table 2 p.4) at VDD = 3.3 V, the supply of the VOL test condition
vil = 0.99      # derived: 0.3 x VDD at VDD = 3.3 V
vol = { max = 0.6, unit = "V", conditions = "SDA pin, IOL = 2.5 mA, VDD = 3.3 V", basis = "Table 2 p.4, output voltage low VOL, max column" }
supply_static_ua = 0.06   # Table 2 p.4, standby current -40 to +85 C, typ column (typical measured at 25 C)
supply_pin = "5"
gnd_pin = "2"

[models.pins]
"1" = "sda"   # SDA, I2C data
"2" = "gnd"   # GND, connected to ground through a trace (do not connect directly to the GND plane)
"3" = "dnc"   # DNC, solder to a pad for mechanical stability; floating or tied to VDD, never GND
"4" = "dnc"   # DNC, as pin 3
"5" = "vdd"   # VDD, power
"6" = "scl"   # SCL, I2C clock

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.9
max_v = 3.6
abs_max_v = 4.2
basis = "Si7021-A20 Rev. 1.2 Table 1 Recommended Operating Conditions p.4, power supply VDD 1.9 V min / 3.6 V max"
abs_max_basis = "Table 7 Absolute Maximum Ratings p.10, voltage on VDD with respect to GND -0.3 V to 4.2 V"

[models.ratings]
theta_ja_c_per_w = 256.0   # Table 6 p.10, junction to air, JEDEC 2-layer board, no airflow

[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "Si7021"
bus = "i2c"
i2c_address = 0x40

[[sensor.input]]
name = "temperature_c"
default = 25.0

[[sensor.input]]
name = "humidity_pct"
default = 50.0

# sel: what the next read returns. 0 nothing, 1 temperature, 2 humidity, 3 user register 1, 4 temperature of the previous
# RH measurement, 5 heater control register, 6 firmware revision.
[[sensor.state]]
name = "sel"
default = 0.0

# User register 1, reset 0011_1010 (Register 1): RES1 bit 7, VDDS bit 6 (read only, 0 = VDD OK), HTRE bit 2, RES0 bit 0.
[[sensor.state]]
name = "ureg"
default = 58.0

# Heater control register, reset 0000_0000 (Register 2): HEATER[3:0] in bits 3..0.
[[sensor.state]]
name = "hreg"
default = 0.0

# Code step of the chosen resolution: 2^(16 - bits). Defaults: RH 12 bit -> 16, T 14 bit -> 4.
[[sensor.state]]
name = "rstep"
default = 16.0

[[sensor.state]]
name = "tstep"
default = 4.0

[[sensor.state]]
name = "t_hi"
default = 0.0

[[sensor.state]]
name = "t_lo"
default = 0.0

[[sensor.state]]
name = "rh_hi"
default = 0.0

[[sensor.state]]
name = "rh_lo"
default = 0.0

# Temperature word taken during the last RH measurement (command 0xE0 reads it).
[[sensor.state]]
name = "tp_hi"
default = 0.0

[[sensor.state]]
name = "tp_lo"
default = 0.0

[[sensor.write_command]]
name = "measure_t_hold_master"
match_mask = 0xFF
match_value = 0xE3
group_bytes = 1

[sensor.write_command.update]
sel = "1.0"
t_hi = "floor((max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) / 256.0)"
t_lo = "(max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) % 256.0"

[[sensor.write_command]]
name = "measure_t_no_hold_master"
match_mask = 0xFF
match_value = 0xF3
group_bytes = 1

[sensor.write_command.update]
sel = "1.0"
t_hi = "floor((max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) / 256.0)"
t_lo = "(max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) % 256.0"

[[sensor.write_command]]
name = "measure_rh_hold_master"
match_mask = 0xFF
match_value = 0xE5
group_bytes = 1

[sensor.write_command.update]
sel = "2.0"
rh_hi = "floor((max(0.0, min(65536.0 - (rstep), round(((humidity_pct + 6.0) * 65536.0 / 125.0) / (rstep)) * (rstep)))) / 256.0)"
rh_lo = "(max(0.0, min(65536.0 - (rstep), round(((humidity_pct + 6.0) * 65536.0 / 125.0) / (rstep)) * (rstep)))) % 256.0 + 2.0"
tp_hi = "floor((max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) / 256.0)"
tp_lo = "(max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) % 256.0"

[[sensor.write_command]]
name = "measure_rh_no_hold_master"
match_mask = 0xFF
match_value = 0xF5
group_bytes = 1

[sensor.write_command.update]
sel = "2.0"
rh_hi = "floor((max(0.0, min(65536.0 - (rstep), round(((humidity_pct + 6.0) * 65536.0 / 125.0) / (rstep)) * (rstep)))) / 256.0)"
rh_lo = "(max(0.0, min(65536.0 - (rstep), round(((humidity_pct + 6.0) * 65536.0 / 125.0) / (rstep)) * (rstep)))) % 256.0 + 2.0"
tp_hi = "floor((max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) / 256.0)"
tp_lo = "(max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) % 256.0"

[[sensor.write_command]]
name = "read_temperature_of_previous_rh_measurement"
match_mask = 0xFF
match_value = 0xE0
group_bytes = 1

[sensor.write_command.update]
sel = "4.0"

[[sensor.write_command]]
name = "write_user_register_1"
match_mask = 0xFF
match_value = 0xE6
prefix = true
group_bytes = 1

[[sensor.write_command.field]]
name = "uval"
bits = [7, 0]

[sensor.write_command.update]
ureg = "(58.0 + floor(uval / 128.0) * 128.0 + uval % 2.0 + (floor(uval / 4.0) % 2.0) * 4.0)"
tstep = "if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 0.0, 4.0, if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 1.0, 16.0, if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 2.0, 8.0, 32.0)))"
rstep = "if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 0.0, 16.0, if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 1.0, 256.0, if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 2.0, 64.0, 32.0)))"

[[sensor.write_command]]
name = "read_user_register_1"
match_mask = 0xFF
match_value = 0xE7
group_bytes = 1

[sensor.write_command.update]
sel = "3.0"

[[sensor.write_command]]
name = "write_heater_control_register"
match_mask = 0xFF
match_value = 0x51
prefix = true
group_bytes = 1

[[sensor.write_command.field]]
name = "hval"
bits = [3, 0]

[sensor.write_command.update]
hreg = "hval"

[[sensor.write_command]]
name = "read_heater_control_register"
match_mask = 0xFF
match_value = 0x11
group_bytes = 1

[sensor.write_command.update]
sel = "5.0"

# Firmware revision: the two-byte command 0x84 0xB8, answered with 0x20 (firmware 2.0, the "20" of Si7021-A20).
[[sensor.write_command]]
name = "read_firmware_revision"
match_mask = 0xFF
match_value = 0x84
prefix = true
group_bytes = 1

[sensor.write_command.update]
sel = "6.0"

# Reset: the register reset settings come back (user register 0x3A, heater register 0x00).
[[sensor.write_command]]
name = "reset"
match_mask = 0xFF
match_value = 0xFE
group_bytes = 1

[sensor.write_command.update]
sel = "0.0"
ureg = "58.0"
hreg = "0.0"
tstep = "4.0"
rstep = "16.0"

[sensor.read_frame]
