[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "SHT21"
bus = "i2c"
i2c_address = 0x40

[[sensor.input]]
name = "temperature_c"
default = 25.0

[[sensor.input]]
name = "humidity_pct"
default = 50.0

# sel: what the next read returns. 0 = nothing, 1 = temperature, 2 = humidity, 3 = user register.
[[sensor.state]]
name = "sel"
default = 0.0

# User register (Table 8): default 0x02 (resolution 00, heater off, OTP reload disabled).
[[sensor.state]]
name = "ureg"
default = 2.0

# Code step of the chosen resolution: 2^(16 - bits). Defaults: RH 12 bit -> 16, T 14 bit -> 4.
[[sensor.state]]
name = "rstep"
default = 16.0

[[sensor.state]]
name = "tstep"
default = 4.0

[[sensor.state]]
name = "t_hi"
default = 0.0

[[sensor.state]]
name = "t_lo"
default = 0.0

[[sensor.state]]
name = "rh_hi"
default = 0.0

[[sensor.state]]
name = "rh_lo"
default = 0.0

[[sensor.write_command]]
name = "trigger_t_hold_master"
match_mask = 0xFF
match_value = 0xE3
group_bytes = 1

[sensor.write_command.update]
sel = "1.0"
t_hi = "floor((max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) / 256.0)"
t_lo = "(max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) % 256.0"

[[sensor.write_command]]
name = "trigger_t_no_hold_master"
match_mask = 0xFF
match_value = 0xF3
group_bytes = 1

[sensor.write_command.update]
sel = "1.0"
t_hi = "floor((max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) / 256.0)"
t_lo = "(max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) % 256.0"

[[sensor.write_command]]
name = "trigger_rh_hold_master"
match_mask = 0xFF
match_value = 0xE5
group_bytes = 1

[sensor.write_command.update]
sel = "2.0"
rh_hi = "floor((max(0.0, min(65536.0 - (rstep), round(((humidity_pct + 6.0) * 65536.0 / 125.0) / (rstep)) * (rstep)))) / 256.0)"
rh_lo = "(max(0.0, min(65536.0 - (rstep), round(((humidity_pct + 6.0) * 65536.0 / 125.0) / (rstep)) * (rstep)))) % 256.0 + 2.0"

[[sensor.write_command]]
name = "trigger_rh_no_hold_master"
match_mask = 0xFF
match_value = 0xF5
group_bytes = 1

[sensor.write_command.update]
sel = "2.0"
rh_hi = "floor((max(0.0, min(65536.0 - (rstep), round(((humidity_pct + 6.0) * 65536.0 / 125.0) / (rstep)) * (rstep)))) / 256.0)"
rh_lo = "(max(0.0, min(65536.0 - (rstep), round(((humidity_pct + 6.0) * 65536.0 / 125.0) / (rstep)) * (rstep)))) % 256.0 + 2.0"

[[sensor.write_command]]
name = "write_user_register"
match_mask = 0xFF
match_value = 0xE6
prefix = true
group_bytes = 1

[[sensor.write_command.field]]
name = "uval"
bits = [7, 0]

[sensor.write_command.update]
ureg = "uval"
tstep = "if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 0.0, 4.0, if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 1.0, 16.0, if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 2.0, 8.0, 32.0)))"
rstep = "if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 0.0, 16.0, if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 1.0, 256.0, if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 2.0, 64.0, 32.0)))"

[[sensor.write_command]]
name = "read_user_register"
match_mask = 0xFF
match_value = 0xE7
group_bytes = 1

[sensor.write_command.update]
sel = "3.0"

# Soft reset: the default settings come back, except the heater bit (bit 2) of the user register.
[[sensor.write_command]]
name = "soft_reset"
match_mask = 0xFF
match_value = 0xFE
group_bytes = 1

[sensor.write_command.update]
sel = "0.0"
ureg = "2.0 + if(ureg % 8.0 >= 4.0, 4.0, 0.0)"
tstep = "4.0"
rstep = "16.0"

[sensor.read_frame]
bytes = [
  "if(sel == 1.0, t_hi, if(sel == 2.0, rh_hi, if(sel == 3.0, ureg, 255.0)))",
  "if(sel == 1.0, t_lo, if(sel == 2.0, rh_lo, 255.0))",
