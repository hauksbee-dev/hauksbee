[[models]]
id = "ds18b20_usop8"
kind = "digital"
description = "Maxim DS18B20 1-Wire digital thermometer in the uSOP-8 package: VDD supply draw, DQ logic levels and the pin map (the 1-Wire protocol and the temperature output are not modelled)"
variant_of = "ds18b20"

[models.match]
value_re = "(?i)^DS18B20(?:(?:\\+|/T&R|\\+T&R|-SL/T&R|-SL\\+T&R)|[UZ](?:\\+|/T&R|\\+T&R)?)?$"

[models.variant]
orderable_re = "(?i)^DS18B20U(?:\\+|/T&R|\\+T&R)?$"
orderable = ["DS18B20U", "DS18B20U+", "DS18B20U/T&R", "DS18B20U+T&R"]
package = "uSOP-8"
basis = "Ordering Information p.19: DS18B20U in the 8 FSOP package (the Pin Configurations call it uSOP); Pin Description table p.4"

[models.params]
warning = "source-bound: the standby VDD current (750 nA typ), the DQ logic levels (local power) and the pin map of the uSOP-8 package are carried; the 1-Wire protocol and the temperature output are NOT modelled (the sensor-spec format has no 1-Wire bus), so a board's firmware cannot read a temperature from this card; parasite power (VDD grounded, power from the DQ pull-up) is not represented and a grounded VDD pin will look unpowered"
vih = 2.2       # DC Electrical Characteristics p.2, input logic-high VIH, local power, min column
vil = 0.8       # DC Electrical Characteristics p.2, input logic-low VIL, max column
vol = { max = 0.4, unit = "V", conditions = "DQ sinks at least 4 mA at 0.4 V (open drain)", basis = "Derived from the DC Electrical Characteristics p.2 sink current IL, min 4.0 mA at VI/O = 0.4 V (note 4: logic-low voltages are specified at a sink current of 4 mA)" }
supply_static_ua = 0.75   # DC Electrical Characteristics p.2, standby current IDDS, typ column (750 nA; 1000 nA max; note 7: specified up to +70 C)
supply_pin = "8"
gnd_pin = "4"

[models.pins]
"1" = "dq"   # DQ
"2" = "nc"   # N.C.
"3" = "nc"   # N.C.
"4" = "gnd"   # GND
"5" = "nc"   # N.C.
"6" = "nc"   # N.C.
"7" = "nc"   # N.C.
"8" = "vdd"   # VDD

# Open-drain pad(s) for the open-drain pull-up check. Source: Maxim DS18B20 19-7487 Rev 6 (7/19), https://www.analog.com/media/en/technical-documentation/data-sheets/DS18B20.pdf, sha256 066c8a3c7e9222c49e84488840d5cfe9dd109cf0da6ab4a55480cebac8f97f76.
[models.pin_capability.open_drain]
basis = "Maxim DS18B20 19-7487 Rev 6 PDF p.4 Pin Description: DQ: \"Data Input/Output. Open-drain 1-Wire interface pin.\""
[models.pin_capability.open_drain.pads]
"1" = "DQ"

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 3.0
max_v = 5.5
abs_max_v = 6.0
basis = "DS18B20 19-7487 Rev 6 DC Electrical Characteristics p.2, supply voltage VDD local power 3.0 V min / 5.5 V max"
abs_max_basis = "Absolute Maximum Ratings p.2, voltage range on any pin relative to ground -0.5 V to +6.0 V"

[models.coverage]
implements = ["pin_roles", "supply_range", "logic_levels", "standby_supply_current", "package_pin_maps_to_92_so8_usop8"]
missing = ["one_wire_bus_protocol_and_rom_commands", "scratchpad_and_temperature_register", "temperature_output_follows_sensor_input", "alarm_search_and_th_tl_registers", "configuration_register_resolution", "parasite_power_mode_vdd_grounded", "conversion_timing", "unique_64_bit_serial_code", "thermometer_error_curve", "thermal_resistance_not_published"]

[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.analog.com/media/en/technical-documentation/data-sheets/DS18B20.pdf"
title = "Maxim Integrated DS18B20 Programmable Resolution 1-Wire Digital Thermometer datasheet, 19-7487 Rev 6 (7/19)"
locator = "Pin configurations p.1; Absolute Maximum Ratings and DC Electrical Characteristics with notes p.2; AC Electrical Characteristics NV memory and AC Electrical Characteristics p.3; Pin Description table p.4; Overview and Operation-Measuring Temperature p.5; Ordering Information p.19 (page numbers are the printed Maxim Integrated page numbers)"
sha256 = "066c8a3c7e9222c49e84488840d5cfe9dd109cf0da6ab4a55480cebac8f97f76"
[[models.source.uncertainty]]
status = "unknown"
parameter = "model"
reason = "datasheet publishes no validated model error interval; only the electrical interface is carried"
[[models.source.uncertainty]]
status = "unknown"
parameter = "supply_static_ua"
reason = "p.2 prints standby current typ 750 nA and max 1000 nA, specified up to +70 C (about 3 uA typ at +125 C); the typical is used"
[[models.source.uncertainty]]
status = "unknown"
parameter = "vol"
reason = "the datasheet prints no VOL voltage, only a sink current of at least 4 mA at 0.4 V; the 0.4 V figure at 4 mA is derived from that row"
[[models.source.uncertainty]]
status = "unknown"
parameter = "parasite_power"
reason = "with parasite power VDD must be grounded and the part draws from DQ; the card assumes local power (VDD at 3.0 V to 5.5 V)"
[[models.source.pinout]]
package = "8-pin uSOP (DS18B20U, listed as 8 FSOP in the ordering table), top view"
pins = { "1" = "DQ", "2" = "N.C.", "3" = "N.C.", "4" = "GND", "5" = "N.C.", "6" = "N.C.", "7" = "N.C.", "8" = "VDD" }

