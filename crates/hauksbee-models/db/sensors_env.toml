[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "AHT10"
bus = "i2c"
i2c_address = 0x38

[[sensor.input]]
name = "temperature_c"
default = 25.0

[[sensor.input]]
name = "humidity_pct"
default = 50.0

# st: the status byte, first byte of every read. Bit 7 busy (never set: a measurement completes at once),
# bit 3 CAL enable. The power-on value is not printed in the datasheet; see the card comment.
[[sensor.state]]
name = "st"
default = 8.0

# r1: data byte 1 of the read (humidity [19:12], [11:4], humidity [3:0] + temperature [19:16], temperature [15:8], [7:0]).
[[sensor.state]]
name = "r1"
default = 0.0

# r2: data byte 2 of the read (humidity [19:12], [11:4], humidity [3:0] + temperature [19:16], temperature [15:8], [7:0]).
[[sensor.state]]
name = "r2"
default = 0.0

# r3: data byte 3 of the read (humidity [19:12], [11:4], humidity [3:0] + temperature [19:16], temperature [15:8], [7:0]).
[[sensor.state]]
name = "r3"
default = 0.0

# r4: data byte 4 of the read (humidity [19:12], [11:4], humidity [3:0] + temperature [19:16], temperature [15:8], [7:0]).
[[sensor.state]]
name = "r4"
default = 0.0

# r5: data byte 5 of the read (humidity [19:12], [11:4], humidity [3:0] + temperature [19:16], temperature [15:8], [7:0]).
[[sensor.state]]
name = "r5"
default = 0.0

[[sensor.write_command]]
name = "trigger_measurement"
match_mask = 0xFF
match_value = 0xAC
prefix = true
group_bytes = 2

[sensor.write_command.update]
r1 = "floor((max(0.0, min(1048575.0, round(humidity_pct / 100.0 * 1048576.0)))) / 4096.0)"
r2 = "floor((max(0.0, min(1048575.0, round(humidity_pct / 100.0 * 1048576.0)))) / 16.0) % 256.0"
r3 = "((max(0.0, min(1048575.0, round(humidity_pct / 100.0 * 1048576.0)))) % 16.0) * 16.0 + floor((max(0.0, min(1048575.0, round((temperature_c + 50.0) / 200.0 * 1048576.0)))) / 65536.0)"
