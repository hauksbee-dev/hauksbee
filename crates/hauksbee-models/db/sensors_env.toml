[[models]]
id = "sht4x_46"
kind = "digital"
description = "Sensirion SHT40/SHT41/SHT45 humidity and temperature sensor, 4-pad DFN, I2C address 0x46 (ordering code letter C): VDD supply draw, logic levels and the command-framed measurement with CRC-8"
variant_of = "sht4x"

[models.match]
value_re = "(?i)^SHT4[015](?:-[ABC]D1[BFP](?:-R[23])?)?$"

[models.variant]
orderable_re = "(?i)^SHT4[015]-CD1"
orderable = ["SHT40-CD1B-R3"]
package = "DFN-4"
basis = "Table 11 nomenclature position 7 (C = I2C address 0x46) and Table 12 ordering options p.21-22"

[models.params]
warning = "source-bound: the idle VDD current (0.08 uA typ at 25 C), the logic levels (evaluated at the typical VDD = 3.3 V) and the I2C measurement protocol (T and RH conversions, CRC-8) are executable; the measurement duration and the NACK while busy, the serial number, general-call reset, the heater's self-heating of the die, the accuracy classes and the pull-up requirement are not represented"
vih = 2.31      # derived: 0.7 x VDD (Table 4 p.9) evaluated at the Table 4 typical VDD = 3.3 V
vil = 0.99      # derived: 0.3 x VDD (Table 4 p.9) evaluated at VDD = 3.3 V
vol = { max = 0.4, unit = "V", conditions = "VDD > 2.0 V, Rpullup > 390 ohm (SDA, open drain)", basis = "Table 4 p.9, VOL, max column; below 2.0 V the limit is 0.2 x VDD" }
supply_static_ua = 0.08   # Table 4 p.9, IDD idle state, 25 C, typ column
supply_pin = "3"
gnd_pin = "4"

[models.pins]
"1" = "sda"   # SDA, serial data, bidirectional (open drain, external pull-up required)
"2" = "scl"   # SCL, serial clock input
"3" = "vdd"   # VDD
"4" = "gnd"   # VSS

[models.ratings]
theta_ja_c_per_w = 297.0   # Table 10 p.17, heater off, die pad NOT soldered (the layout Sensirion recommends); simulation values

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.08
max_v = 3.6
basis = "Sensirion SHT4x V7.3 Table 4 p.9, supply voltage VDD 1.08 V min / 3.3 V typ / 3.6 V max"

