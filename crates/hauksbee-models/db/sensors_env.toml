# Official built-in part library: sensors_env.
#
# Cards here are written from vendor datasheets only (every value carries a basis and a source).
# See target/launch/official-parts-20261022/ranking.md for the batch plan.
#
# GENERATED-FREE: this file is hand-readable TOML; the CRC-8 expressions inside the sensor specs are long
# arithmetic parity sums because evalexpr has no bit operations (verified against a reference CRC-8 in the
# co-simulation tests, crates/hauksbee-cosim/tests/official_env1.rs).

# SHT4x: Sensirion SHT40, SHT41 and SHT45 humidity and temperature sensors, 4-pad open-cavity DFN, I2C. Source: Sensirion SHT4x Datasheet
# Version 7.3 (June 2026), sha256 8db4a43f17149b76811cfb504caaeca4ef844ddc710cb9b45905c51c7ddfe3c2. The same PDF covers the SHT43
# (ISO17025-certified), which is NOT matched here: this batch builds the SHT40/41/45 only.
# THREE CARDS, ONE PER ADDRESS. The ordering code letter after the dash sets the 7-bit I2C address (Table 11 position 7: A = 0x44, B = 0x45, C
# = 0x46) and the three cards differ in nothing else, so they are an orderable-variant family (variant_of = sht4x) whose members are told
# apart by the code. A board that names the part without a suffix (SHT40) cannot say its address: the family has one pinout, so the first
# member (0x44) is bound as a flagged stand-in, never silently as the answer.
# PINS. Section 5.4 p.17: 1 SDA, 2 SCL, 3 VDD, 4 VSS; the die pad is not connected to any pin, so no pad is mapped for it.
# LEVELS. VIH 0.7 x VDD and VIL 0.3 x VDD (Table 4) are ratiometric and the card holds volts, so they are evaluated at the typical VDD = 3.3 V
# and the printed ratios are kept as characteristic records (unit VDD). VOL 0.4 V max holds for VDD > 2.0 V.
# BEHAVIOUR. The part answers measurement commands with six bytes: T high, T low, CRC-8, RH high, RH low, CRC-8 (section 4.3), ST = (T + 45) /
# 175 x 65535 and SRH = (RH + 6) / 125 x 65535 (equations (1) and (2), section 4.6, with the printed 2^16 - 1 divisor), CRC-8 polynomial 0x31
# initialised 0xFF (Table 7, CRC(0xBEEF) = 0x92). Both outputs follow the temperature_c and humidity_pct sensor inputs, latched when the
# command is written. The nine measure and heater commands of Table 8 return a measurement; the heater's warming of the die is not modelled.
# evalexpr has no bit operations, so the CRC is a generated arithmetic parity expression, checked in the co-simulation tests against a
# reference CRC-8.
# Cross-check only: Renode's SHT45 model (MIT, Antmicro) agrees on the command set (0xFD, 0xF6, 0xE0, the six heater codes, 0x89, 0x94), the
# CRC parameters and the two conversion formulas; no Renode code is used.
[[models]]
id = "sht4x_44"
kind = "digital"
description = "Sensirion SHT40/SHT41/SHT45 humidity and temperature sensor, 4-pad DFN, I2C address 0x44 (ordering code letter A): VDD supply draw, logic levels and the command-framed measurement with CRC-8"
variant_of = "sht4x"

[models.match]
value_re = "(?i)^SHT4[015](?:-[ABC]D1[BFP](?:-R[23])?)?$"

[models.variant]
orderable_re = "(?i)^SHT4[015]-AD1"
orderable = ["SHT40-AD1B-R2", "SHT40-AD1B-R3", "SHT40-AD1F-R2", "SHT40-AD1P-R2", "SHT41-AD1B-R2", "SHT41-AD1B-R3", "SHT41-AD1F-R2", "SHT41-AD1P-R2", "SHT45-AD1B-R2", "SHT45-AD1F-R2", "SHT45-AD1B-R3"]
package = "DFN-4"
basis = "Table 11 nomenclature position 7 (A = I2C address 0x44) and Table 12 ordering options p.21-22"

[models.params]
warning = "source-bound: the idle VDD current (0.08 uA typ at 25 C), the logic levels (evaluated at the typical VDD = 3.3 V) and the I2C measurement protocol (T and RH conversions, CRC-8) are executable; the measurement duration and the NACK while busy, the serial number, general-call reset, the heater's self-heating of the die, the accuracy classes and the pull-up requirement are not represented"
vih = 2.31      # derived: 0.7 x VDD (Table 4 p.9) evaluated at the Table 4 typical VDD = 3.3 V
vil = 0.99      # derived: 0.3 x VDD (Table 4 p.9) evaluated at VDD = 3.3 V
vol = { max = 0.4, unit = "V", conditions = "VDD > 2.0 V, Rpullup > 390 ohm (SDA, open drain)", basis = "Table 4 p.9, VOL, max column; below 2.0 V the limit is 0.2 x VDD" }
supply_static_ua = 0.08   # Table 4 p.9, IDD idle state, 25 C, typ column
supply_pin = "3"
gnd_pin = "4"

[models.pins]
"1" = "sda"   # SDA, serial data, bidirectional (open drain, external pull-up required)
"2" = "scl"   # SCL, serial clock input
"3" = "vdd"   # VDD
"4" = "gnd"   # VSS

[models.ratings]
theta_ja_c_per_w = 297.0   # Table 10 p.17, heater off, die pad NOT soldered (the layout Sensirion recommends); simulation values

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.08
max_v = 3.6
basis = "Sensirion SHT4x V7.3 Table 4 p.9, supply voltage VDD 1.08 V min / 3.3 V typ / 3.6 V max"

[models.peripheral]
kind = "register_map"
spec_toml = '''
