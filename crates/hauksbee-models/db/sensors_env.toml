# HTU21D and SHT21: two vendors' 3 x 3 mm DFN-6 humidity and temperature sensors that share the I2C address 0x40, one command set, one user
# register and one CRC-8 (polynomial 0x31, initial value 0x00, no final XOR). They are two cards because the vendor, the supply range, the
# absolute maximum and the ordering codes differ. Sources: TE Connectivity HTU21D(F) datasheet HPC199_6 edition 8 (05/2017), sha256
# 9168a7d22a78b6d9b491c737ebfde45fe259ddbc550082e2528229f36de27ae3; Sensirion SHT21 datasheet Version 5 (October 2022), sha256
# e5905c92060a0e0ae0e40712fee0933ef3ce6392b0419ec88abd9ba5c3cab3ee.
# The Sensirion SHT20 and SHT25 and the TE HTU20D are NOT matched: no datasheet of theirs was read in this batch.
# PINS (both): 1 SDA/DATA, 2 GND/VSS, 3 NC, 4 NC, 5 VDD, 6 SCL/SCK; the die pad is internally connected to ground (HTU21D p.17, SHT21 Fig. 1)
# and the land pattern allows it floating or grounded, so no pad is mapped. The HTU21D interface table labels pin 6 'Selector for RH or Temp';
# the same page, the typical circuit and the timing section show it is the serial clock.
# LEVELS. VIH 0.7 x VDD, VIL 0.3 x VDD are ratiometric, the card holds volts, so they are evaluated at the printed 3.0 V test supply and the
# ratios are kept as characteristic records (unit VDD).
# BEHAVIOUR. A trigger command (0xE3 / 0xF3 temperature, 0xE5 / 0xF5 humidity) latches a measurement from the sensor inputs temperature_c and
# humidity_pct; the next read returns MSB, LSB (status bits 00 for temperature, 10 for humidity) and CRC-8. T = -46.85 + 175.72 x S / 2^16, RH
# = -6 + 125 x S / 2^16 with the status bits cleared (both datasheets, conversion section). The user register (read 0xE7, write 0xE6, default
# 0x02) resolution bits 7 and 0 set the code step: RH 12/8/10/11 bit, T 14/12/13/11 bit; the code is rounded to that step and clamped to the
# representable range (a derived rounding rule, the datasheets only publish the resolution). Soft reset 0xFE restores the defaults except the
# heater bit. CRC-8 is a generated arithmetic parity expression (evalexpr has no bit operations) and is checked in the co-simulation tests
# against the datasheet examples 0xDC -> 0x79, 0x683A -> 0x7C, 0x4E85 -> 0x6B.
# Cross-check only: Renode's SHT21 model (MIT, Antmicro) agrees on the command codes and the conversions; its user register reset value 0x3A
# is the Si7021's, while both datasheets here print the default 0x02. No Renode code is used.
[[models]]
id = "htu21d"
kind = "digital"
description = "TE Connectivity HTU21D / HTU21DF humidity and temperature sensor, 6-pad DFN, I2C address 0x40: VDD supply draw, logic levels and the command-framed T and RH measurement, user register and CRC-8"

[models.match]
value_re = "(?i)^(?:HTU21D(?:-?F)?|HPP845E[01]31R[145])$"

[models.params]
warning = "source-bound: the sleep VDD current (0.02 uA typ), the logic levels (evaluated at the printed VDD = 3.0 V) and the I2C protocol (T and RH triggers, user register resolution bits, soft reset, status bits and CRC-8) are executable; the measurement time and the NACK while busy, hold-master clock stretching, the heater, the end-of-battery bit, the diagnostic states and the accuracy are not represented"
vih = 2.1       # derived: 70 % x VDD (DC characteristics p.9) at VDD = 3.0 V, the printed test supply
vil = 0.9       # derived: 30 % x VDD at VDD = 3.0 V
vol = { max = 0.4, unit = "V", conditions = "VDD = 3 V, -4 mA < IOL < 0 mA", basis = "Input/output DC characteristics p.9, VOL max column" }
supply_static_ua = 0.02   # electrical and general items p.3, idd sleep mode, typ column (VDD = 3 V, 25 C)
supply_pin = "5"
gnd_pin = "2"

[models.pins]
"1" = "sda"   # DATA, serial data (open drain, external pull-up)
"2" = "gnd"   # GND
"3" = "nc"   # NC, must be left unconnected
"4" = "nc"   # NC, must be left unconnected
"5" = "vdd"   # VDD
"6" = "scl"   # SCK, serial clock input

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.5
max_v = 3.6
abs_max_v = 3.6
basis = "HTU21D(F) edition 8 'Electrical and general items' p.3, supply voltage VDD 1.5 V min / 3.0 V typ / 3.6 V max"
abs_max_basis = "Maximum Ratings table p.2, VDD to GND -0.3 V to 3.6 V (supply voltage peak 3.8 V for under 10 % of the operating life)"

[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "HTU21D"
bus = "i2c"
i2c_address = 0x40

[[sensor.input]]
name = "temperature_c"
default = 25.0

[[sensor.input]]
name = "humidity_pct"
default = 50.0

# sel: what the next read returns. 0 = nothing, 1 = temperature, 2 = humidity, 3 = user register.
[[sensor.state]]
name = "sel"
default = 0.0

# User register (Table 8): default 0x02 (resolution 00, heater off, OTP reload disabled).
[[sensor.state]]
name = "ureg"
default = 2.0

# Code step of the chosen resolution: 2^(16 - bits). Defaults: RH 12 bit -> 16, T 14 bit -> 4.
[[sensor.state]]
name = "rstep"
default = 16.0

[[sensor.state]]
name = "tstep"
default = 4.0

[[sensor.state]]
name = "t_hi"
default = 0.0

[[sensor.state]]
name = "t_lo"
default = 0.0

[[sensor.state]]
name = "rh_hi"
default = 0.0

[[sensor.state]]
name = "rh_lo"
default = 0.0

[[sensor.write_command]]
name = "trigger_t_hold_master"
match_mask = 0xFF
match_value = 0xE3
group_bytes = 1

[sensor.write_command.update]
sel = "1.0"
t_hi = "floor((max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) / 256.0)"
t_lo = "(max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) % 256.0"

[[sensor.write_command]]
name = "trigger_t_no_hold_master"
match_mask = 0xFF
match_value = 0xF3
group_bytes = 1

[sensor.write_command.update]
sel = "1.0"
t_hi = "floor((max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) / 256.0)"
t_lo = "(max(0.0, min(65536.0 - (tstep), round(((temperature_c + 46.85) * 65536.0 / 175.72) / (tstep)) * (tstep)))) % 256.0"

[[sensor.write_command]]
name = "trigger_rh_hold_master"
match_mask = 0xFF
match_value = 0xE5
group_bytes = 1

[sensor.write_command.update]
sel = "2.0"
rh_hi = "floor((max(0.0, min(65536.0 - (rstep), round(((humidity_pct + 6.0) * 65536.0 / 125.0) / (rstep)) * (rstep)))) / 256.0)"
rh_lo = "(max(0.0, min(65536.0 - (rstep), round(((humidity_pct + 6.0) * 65536.0 / 125.0) / (rstep)) * (rstep)))) % 256.0 + 2.0"

[[sensor.write_command]]
name = "trigger_rh_no_hold_master"
match_mask = 0xFF
match_value = 0xF5
group_bytes = 1

[sensor.write_command.update]
sel = "2.0"
rh_hi = "floor((max(0.0, min(65536.0 - (rstep), round(((humidity_pct + 6.0) * 65536.0 / 125.0) / (rstep)) * (rstep)))) / 256.0)"
rh_lo = "(max(0.0, min(65536.0 - (rstep), round(((humidity_pct + 6.0) * 65536.0 / 125.0) / (rstep)) * (rstep)))) % 256.0 + 2.0"

[[sensor.write_command]]
name = "write_user_register"
match_mask = 0xFF
match_value = 0xE6
prefix = true
group_bytes = 1

[[sensor.write_command.field]]
name = "uval"
bits = [7, 0]

[sensor.write_command.update]
ureg = "uval"
tstep = "if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 0.0, 4.0, if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 1.0, 16.0, if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 2.0, 8.0, 32.0)))"
rstep = "if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 0.0, 16.0, if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 1.0, 256.0, if((floor(uval / 128.0) * 2.0 + uval % 2.0) == 2.0, 64.0, 32.0)))"

[[sensor.write_command]]
name = "read_user_register"
match_mask = 0xFF
match_value = 0xE7
group_bytes = 1

[sensor.write_command.update]
sel = "3.0"

# Soft reset: the default settings come back, except the heater bit (bit 2) of the user register.
[[sensor.write_command]]
name = "soft_reset"
match_mask = 0xFF
match_value = 0xFE
group_bytes = 1

[sensor.write_command.update]
sel = "0.0"
ureg = "2.0 + if(ureg % 8.0 >= 4.0, 4.0, 0.0)"
tstep = "4.0"
rstep = "16.0"

[sensor.read_frame]
bytes = [
  "if(sel == 1.0, t_hi, if(sel == 2.0, rh_hi, if(sel == 3.0, ureg, 255.0)))",
