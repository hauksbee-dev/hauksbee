# DS18B20: Maxim (now Analog Devices) 1-Wire digital thermometer. Source: datasheet 19-7487 Rev 6 (7/19), sha256
# 066c8a3c7e9222c49e84488840d5cfe9dd109cf0da6ab4a55480cebac8f97f76. Page numbers are the printed 'Maxim Integrated | N' numbers.
# THREE PACKAGE CARDS, one family (variant_of = ds18b20): the pin order differs by package, so each package has its own card, told apart by
# the ordering code (DS18B20 / DS18B20+ ... = 3-pin TO-92; DS18B20U... = 8-pin uSOP, listed as 8 FSOP in the ordering table; DS18B20Z... =
# 8-pin SO 150 mils) and by the footprint. The bare code DS18B20 is the TO-92 order code. DS18B20-PAR, DS18S20, DS1822 and the other 1-Wire
# thermometers are NOT matched (different datasheets).
# PINS. TO-92 (bottom view) 1 GND, 2 DQ, 3 VDD; SO 3 VDD, 4 DQ, 5 GND, 1 2 6 7 8 N.C.; uSOP 1 DQ, 4 GND, 8 VDD, 2 3 5 6 7 N.C. (Pin
# Description table p.4).
# SCHEMA GAP. The sensor-spec format has no 1-Wire bus style (it knows I2C and SPI), so there is no behavioural model: the card carries the
# electrical interface only, and coverage.missing says the 1-Wire protocol and the temperature output are absent.
# VOL. The datasheet prints no VOL voltage; the DQ sink-current row (at least 4 mA at 0.4 V) is the nearest printed fact, and the 0.4 V at 4
# mA value is marked derived.
# Cross-check: Renode (MIT, Antmicro) has no DS18B20 model; nothing was borrowed.
[[models]]
id = "ds18b20_to92"
kind = "digital"
description = "Maxim DS18B20 1-Wire digital thermometer in the TO-92 package: VDD supply draw, DQ logic levels and the pin map (the 1-Wire protocol and the temperature output are not modelled)"
variant_of = "ds18b20"

[models.match]
value_re = "(?i)^DS18B20(?:(?:\\+|/T&R|\\+T&R|-SL/T&R|-SL\\+T&R)|[UZ](?:\\+|/T&R|\\+T&R)?)?$"

[models.variant]
orderable_re = "(?i)^DS18B20(?:\\+|/T&R|\\+T&R|-SL/T&R|-SL\\+T&R)?$"
orderable = ["DS18B20", "DS18B20+", "DS18B20/T&R", "DS18B20+T&R", "DS18B20-SL/T&R", "DS18B20-SL+T&R"]
package = "TO-92"
basis = "Ordering Information p.19: DS18B20 in the 3 TO-92 package; Pin Description table p.4"

[models.params]
warning = "source-bound: the standby VDD current (750 nA typ), the DQ logic levels (local power) and the pin map of the TO-92 package are carried; the 1-Wire protocol and the temperature output are NOT modelled (the sensor-spec format has no 1-Wire bus), so a board's firmware cannot read a temperature from this card; parasite power (VDD grounded, power from the DQ pull-up) is not represented and a grounded VDD pin will look unpowered"
vih = 2.2       # DC Electrical Characteristics p.2, input logic-high VIH, local power, min column
vil = 0.8       # DC Electrical Characteristics p.2, input logic-low VIL, max column
vol = { max = 0.4, unit = "V", conditions = "DQ sinks at least 4 mA at 0.4 V (open drain)", basis = "Derived from the DC Electrical Characteristics p.2 sink current IL, min 4.0 mA at VI/O = 0.4 V (note 4: logic-low voltages are specified at a sink current of 4 mA)" }
supply_static_ua = 0.75   # DC Electrical Characteristics p.2, standby current IDDS, typ column (750 nA; 1000 nA max; note 7: specified up to +70 C)
supply_pin = "3"
gnd_pin = "1"

[models.pins]
"1" = "gnd"   # GND
"2" = "dq"   # DQ
"3" = "vdd"   # VDD

# Open-drain pad(s) for the open-drain pull-up check. Source: Maxim DS18B20 19-7487 Rev 6 (7/19), https://www.analog.com/media/en/technical-documentation/data-sheets/DS18B20.pdf, sha256 066c8a3c7e9222c49e84488840d5cfe9dd109cf0da6ab4a55480cebac8f97f76.
[models.pin_capability.open_drain]
basis = "Maxim DS18B20 19-7487 Rev 6 PDF p.4 Pin Description: DQ: \"Data Input/Output. Open-drain 1-Wire interface pin.\""
[models.pin_capability.open_drain.pads]
"2" = "DQ"

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 3.0
max_v = 5.5
abs_max_v = 6.0
basis = "DS18B20 19-7487 Rev 6 DC Electrical Characteristics p.2, supply voltage VDD local power 3.0 V min / 5.5 V max"
abs_max_basis = "Absolute Maximum Ratings p.2, voltage range on any pin relative to ground -0.5 V to +6.0 V"

[models.coverage]
implements = ["pin_roles", "supply_range", "logic_levels", "standby_supply_current", "package_pin_maps_to_92_so8_usop8"]
missing = ["one_wire_bus_protocol_and_rom_commands", "scratchpad_and_temperature_register", "temperature_output_follows_sensor_input", "alarm_search_and_th_tl_registers", "configuration_register_resolution", "parasite_power_mode_vdd_grounded", "conversion_timing", "unique_64_bit_serial_code", "thermometer_error_curve", "thermal_resistance_not_published"]

