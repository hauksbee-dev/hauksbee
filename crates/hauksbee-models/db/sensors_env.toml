rh_lo = "(max(0.0, min(65535.0, round((humidity_pct + 6.0) * 65535.0 / 125.0)))) % 256.0"

[[sensor.write_command]]
name = "heater_200mw_100ms"
match_mask = 0xFF
match_value = 0x32
group_bytes = 1

[sensor.write_command.update]
mode = "1.0"
t_hi = "floor((max(0.0, min(65535.0, round((temperature_c + 45.0) * 65535.0 / 175.0)))) / 256.0)"
t_lo = "(max(0.0, min(65535.0, round((temperature_c + 45.0) * 65535.0 / 175.0)))) % 256.0"
rh_hi = "floor((max(0.0, min(65535.0, round((humidity_pct + 6.0) * 65535.0 / 125.0)))) / 256.0)"
rh_lo = "(max(0.0, min(65535.0, round((humidity_pct + 6.0) * 65535.0 / 125.0)))) % 256.0"

[[sensor.write_command]]
name = "heater_110mw_1s"
match_mask = 0xFF
match_value = 0x2F
group_bytes = 1

[sensor.write_command.update]
mode = "1.0"
t_hi = "floor((max(0.0, min(65535.0, round((temperature_c + 45.0) * 65535.0 / 175.0)))) / 256.0)"
t_lo = "(max(0.0, min(65535.0, round((temperature_c + 45.0) * 65535.0 / 175.0)))) % 256.0"
rh_hi = "floor((max(0.0, min(65535.0, round((humidity_pct + 6.0) * 65535.0 / 125.0)))) / 256.0)"
rh_lo = "(max(0.0, min(65535.0, round((humidity_pct + 6.0) * 65535.0 / 125.0)))) % 256.0"

[[sensor.write_command]]
