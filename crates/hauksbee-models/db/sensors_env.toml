[[models]]
id = "aht21"
kind = "digital"
description = "ASAIR (Aosong) AHT21 humidity and temperature sensor, 6-pad DFN, I2C address 0x38: VDD supply draw, logic levels and the command-framed measurement (status byte, 20-bit humidity and temperature, CRC-8)"

[models.match]
value_re = "(?i)^AHT21$"

[models.params]
warning = "source-bound: the dormant VDD current (250 nA, a maximum, no typical is printed), the logic levels (evaluated at the printed VDD = 3.3 V) and the I2C measurement protocol (trigger 0xAC, status byte, 20-bit conversions, CRC-8) are executable; the calibration register initialization (0x1B, 0x1C, 0x1E, not printed), the measurement time and the busy bit, the status bits at power-on and the accuracy are not represented"
vih = 2.31      # derived: 70 % x VDD (Table 7 p.10) at VDD = 3.3 V, the typical supply of Table 3
vil = 0.99      # derived: 30 % x VDD at VDD = 3.3 V
vol = { max = 0.4, unit = "V", conditions = "VDD = 3.3 V, -4 mA < IOL < 0 mA", basis = "Table 7 p.10, low output voltage VOL, max column" }
supply_static_ua = 0.25   # Table 3 p.3, current IDD dormant, max column (250 nA, no typical is printed)
supply_pin = "2"
gnd_pin = "5"

[models.pins]
"1" = "nc"   # NC, remain suspended
"2" = "vdd"   # VDD, power supply voltage
"3" = "scl"   # SCL, serial clock
"4" = "sda"   # SDA, serial data, bidirectional
"5" = "gnd"   # GND, power ground
"6" = "nc"   # NC, remain suspended

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.2
max_v = 5.5
abs_max_v = 5.5
basis = "AHT21 V1.0 Table 3 p.3, voltage 2.2 V min / 3.3 V typ / 5.5 V max"
abs_max_basis = "Table 6 Absolute maximum electrical ratings p.10, VDD to GND -0.3 V to 5.5 V"

[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "AHT21"
bus = "i2c"
i2c_address = 0x38

[[sensor.input]]
name = "temperature_c"
default = 25.0

[[sensor.input]]
name = "humidity_pct"
default = 50.0

# st: the status byte, first byte of every read. Bit 7 busy (never set: a measurement completes at once),
# bit 3 CAL enable. The power-on value is not printed in the datasheet; see the card comment.
[[sensor.state]]
name = "st"
default = 24.0

# r1: data byte 1 of the read (humidity [19:12], [11:4], humidity [3:0] + temperature [19:16], temperature [15:8], [7:0]).
[[sensor.state]]
name = "r1"
default = 0.0

# r2: data byte 2 of the read (humidity [19:12], [11:4], humidity [3:0] + temperature [19:16], temperature [15:8], [7:0]).
[[sensor.state]]
name = "r2"
default = 0.0

# r3: data byte 3 of the read (humidity [19:12], [11:4], humidity [3:0] + temperature [19:16], temperature [15:8], [7:0]).
[[sensor.state]]
name = "r3"
default = 0.0

# r4: data byte 4 of the read (humidity [19:12], [11:4], humidity [3:0] + temperature [19:16], temperature [15:8], [7:0]).
[[sensor.state]]
name = "r4"
default = 0.0

# r5: data byte 5 of the read (humidity [19:12], [11:4], humidity [3:0] + temperature [19:16], temperature [15:8], [7:0]).
[[sensor.state]]
name = "r5"
default = 0.0

[[sensor.write_command]]
name = "trigger_measurement"
match_mask = 0xFF
match_value = 0xAC
prefix = true
group_bytes = 2

[sensor.write_command.update]
r1 = "floor((max(0.0, min(1048575.0, round(humidity_pct / 100.0 * 1048576.0)))) / 4096.0)"
r2 = "floor((max(0.0, min(1048575.0, round(humidity_pct / 100.0 * 1048576.0)))) / 16.0) % 256.0"
r3 = "((max(0.0, min(1048575.0, round(humidity_pct / 100.0 * 1048576.0)))) % 16.0) * 16.0 + floor((max(0.0, min(1048575.0, round((temperature_c + 50.0) / 200.0 * 1048576.0)))) / 65536.0)"
r4 = "floor((max(0.0, min(1048575.0, round((temperature_c + 50.0) / 200.0 * 1048576.0)))) / 256.0) % 256.0"
r5 = "(max(0.0, min(1048575.0, round((temperature_c + 50.0) / 200.0 * 1048576.0)))) % 256.0"

[sensor.read_frame]
bytes = [
  "st",
  "r1",
  "r2",
  "r3",
