  "if(sel == 1.0, t_hi, if(sel == 2.0, rh_hi, if(sel == 3.0, ureg, if(sel == 4.0, tp_hi, if(sel == 5.0, hreg, if(sel == 6.0, 32.0, 255.0))))))",
