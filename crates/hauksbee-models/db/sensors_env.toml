locator = "Table 4 electrical specifications p.9; Table 5 timing and Table 6 absolute maximum ratings p.10; section 4.4 and Table 7 checksum p.11; Table 8 commands and section 4.6 conversion p.12; section 5.4 pin assignment and Table 10 thermal p.17; Table 11 nomenclature p.21; Table 12 ordering p.22"
