[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.makerguides.com/wp-content/uploads/2026/02/AHT20-datasheet.pdf"
title = "ASAIR AHT20 Product manuals, V1.1 (2020/04)"
locator = "Tables 1 to 3 sensor performance and Table 2 electric specification, Table 4 package p.2; Table 5 pin distribution and Table 6 absolute maximum rating p.6; Table 7 DC characteristics, Table 8 timing, section 5.1 p.7; section 5.3 Tables 9 and 10, section 5.4 reading process and CRC p.8; section 5.5 soft reset, section 6 signal transformation p.9"
sha256 = "203939610747f0432625a535925288a4f846feeb6a1ceb4310a0880120b1e529"
[[models.source.uncertainty]]
status = "unknown"
parameter = "model"
reason = "datasheet publishes no validated model error interval; the card reproduces the conversion formulas, not the accuracy graphs"
[[models.source.uncertainty]]
status = "unknown"
parameter = "supply_static_ua"
reason = "Table 2 prints only the dormant maximum (0.25 uA), so the maximum is used as the static draw"
[[models.source.uncertainty]]
status = "unknown"
parameter = "peripheral_power"
reason = "read_a and write_a use the measuring current typ (23 uA at VDD = 3.3 V, below 60 C); the datasheet gives no per-transaction bus current"
[[models.source.uncertainty]]
status = "unknown"
parameter = "status_at_power_on"
reason = "the datasheet gives the meaning of the status bits (Table 10) but no power-on value; the card starts with bit 3 (calibrated) set, not busy, which is 0x08, so firmware that checks the CAL bit proceeds"
[[models.source.uncertainty]]
status = "unknown"
parameter = "crc_coverage"
reason = "section 5.4 says the CRC byte follows the six received bytes; the card computes it over those six bytes (status and the five data bytes)"
[[models.source.pinout]]
package = "DFN-6 (3 x 3 x 1.0 mm dual flat no-lead)"
pins = { "1" = "NC", "2" = "VDD", "3" = "SCL", "4" = "SDA", "5" = "GND", "6" = "NC" }

