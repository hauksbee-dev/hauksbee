tier = "datasheet-derived"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://narodmon.ru/img/sens/AHT10.pdf"
title = "ASAIR AHT10 Technical Manual, V1.1 (2018/12), unofficial English translation dated 2019/05"
locator = "Table 2 electrical characteristics and Table 4 package p.3 (PDF page numbers); Table 5 pin distribution and Table 6 absolute maximum ratings p.8; Table 7 DC characteristics, Table 8 timing, section 5.1 p.9; section 5.3 Tables 9 and 10, measurement and read sequence, section 5.4 soft reset p.10; section 6 signal conversion p.11"
sha256 = "561ebe07d1c0fb2112cf893d0a229a77ba6196d733f9078468aaeb40f4f5a4f8"
[[models.source.uncertainty]]
status = "unknown"
parameter = "model"
reason = "datasheet publishes no validated model error interval; the card reproduces the conversion formulas, not the accuracy graphs"
[[models.source.uncertainty]]
status = "unknown"
parameter = "supply_static_ua"
reason = "Table 2 prints only the sleep maximum (0.25 uA), so the maximum is used as the static draw"
[[models.source.uncertainty]]
status = "unknown"
parameter = "peripheral_power"
reason = "read_a and write_a use the measuring current typ (23 uA at VDD = 3.3 V, below 60 C); the datasheet gives no per-transaction bus current"
[[models.source.uncertainty]]
status = "unknown"
parameter = "status_at_power_on"
reason = "the datasheet gives the meaning of the status bits (Table 10) but no power-on value; the card starts with bit 3 (calibrated) set, mode NOR (00), not busy, which is 0x08, so firmware that checks the CAL bit proceeds"
