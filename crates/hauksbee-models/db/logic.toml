# Official-parts batch serial_logic: 74-series logic cards (TI datasheets, read in full).
# One [[models]] per distinct pin map. Values are the SN74 figures of the cited TI datasheet;
# a value the datasheet does not print is absent, and a derived value is labelled DERIVED.

[[models]]
id = "74lvc1g02"
kind = "digital"
description = "74LVC1G02 single 2-input NOR gate, 5-lead SOT-23-5 / SC70-5 / SOT-5X3 / DSBGA (TI DBV, DCK, DRL, YZP)"

[models.source]
tier = "curated-library"
validation = "datasheet-curves"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/sn74lvc1g02.pdf"
title = "Texas Instruments SN74LVC1G02 Single 2-Input Positive NOR-Gate datasheet, SCES213Y, revised August 2026"
locator = "4 Pin Configuration and Functions p.3 (DBV, DCK, DRL, YZP: 1 A, 2 B, 3 GND, 4 Y, 5 VCC); 5.1 Absolute Maximum Ratings p.4; 5.3 Recommended Operating Conditions p.4-5; 5.4 Thermal Information p.5; 5.5 Electrical Characteristics p.5-6; 5.7 Switching Characteristics and 5.9 Operating Characteristics p.6"
sha256 = "38895735614b7fee3e6ccee1c02026dc1256ff83da5375cdcc4022ad84460d0f"
[[models.source.uncertainty]]
status = "unknown"
parameter = "propagation_timing"
reason = "tpd is carried as one scalar at one supply band; the supply-, load- and temperature-dependent delay tables are not modelled"
[[models.source.uncertainty]]
status = "unknown"
parameter = "package_coverage"
reason = "the 6-pin DRY and DSF packages and the 5-pin DPW package number A and B differently and are separate cards (74lvc1g02_dry_dsf, 74lvc1g02_dpw); the Nexperia 74LVC1G02 datasheet could not be fetched, so its GW, GV and GX suffixes are not matched"

[[models.source.pinout]]
package = "DBV, DCK, DRL, YZP"
pins = { "1" = "A", "2" = "B", "3" = "GND", "4" = "Y", "5" = "VCC" }

[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient thermal resistance, DBV (SOT-23)"
rating = "theta_ja_c_per_w"
max = 357.1
unit = "°C/W"
conditions = "DBV (SOT-23) package"
package = "DBV (SOT-23)"
basis = "SN74LVC1G02 SCES213Y 5.4 Thermal Information, RθJA, DBV (SOT-23) column"

[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient thermal resistance, DCK (SC70)"
rating = "theta_ja_c_per_w"
max = 371.0
unit = "°C/W"
conditions = "DCK (SC70) package"
package = "DCK (SC70)"
basis = "SN74LVC1G02 SCES213Y 5.4 Thermal Information, RθJA, DCK (SC70) column"

[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient thermal resistance, DRL (SOT-5X3)"
rating = "theta_ja_c_per_w"
max = 364.1
unit = "°C/W"
conditions = "DRL (SOT-5X3) package"
package = "DRL (SOT-5X3)"
basis = "SN74LVC1G02 SCES213Y 5.4 Thermal Information, RθJA, DRL (SOT-5X3) column"

[[models.source.characteristic]]
parameter = "RθJA junction-to-ambient thermal resistance, YZP (DSBGA)"
rating = "theta_ja_c_per_w"
max = 130.0
unit = "°C/W"
conditions = "YZP (DSBGA) package"
package = "YZP (DSBGA)"
basis = "SN74LVC1G02 SCES213Y 5.4 Thermal Information, RθJA, YZP (DSBGA) column"

[[models.source.characteristic]]
parameter = "VOH high-level output voltage"
min = 2.3
unit = "V"
conditions = "IOH = -24 mA; VCC = 3 V; -40 C to 85 C"
basis = "SN74LVC1G02 SCES213Y 5.5 Electrical Characteristics, VOH row, min"
[[models.source.characteristic]]
parameter = "VOL low-level output voltage"
max = 0.55
unit = "V"
conditions = "IOL = 24 mA; VCC = 3 V; -40 C to 85 C"
basis = "SN74LVC1G02 SCES213Y 5.5 Electrical Characteristics, VOL row, max"
[[models.source.characteristic]]
parameter = "ICC supply current"
max = 10.0
unit = "uA"
conditions = "VI = 5.5 V or GND; IO = 0; VCC = 1.65 V to 5.5 V; -40 C to 85 C"
basis = "SN74LVC1G02 SCES213Y 5.5 Electrical Characteristics, ICC row, max"
[[models.source.characteristic]]
parameter = "tpd propagation delay"
max = 4.5
unit = "ns"
conditions = "A or B to Y; VCC = 3.3 V +/- 0.3 V; CL = 30 pF or 50 pF; -40 to 85 C"
basis = "SN74LVC1G02 SCES213Y 5.7 Switching Characteristics, tpd row, VCC = 3.3 V column, max"
[[models.source.characteristic]]
parameter = "Cpd power dissipation capacitance"
typ = 23.0
unit = "pF"
conditions = "f = 10 MHz; VCC = 3.3 V; TA = 25 C"
basis = "SN74LVC1G02 SCES213Y Operating Characteristics, Cpd row, typ"

[models.match]
value_re = "(?i)^(SN)?74LVC1G02(DBV|DCK|DRL|YZP)?[RT]?(E4|G4|3)?([.,-][A-Z0-9]+)?$"

[models.params]
voh = 3.2          # VCC - 0.1 V at IOH = -100 uA, VCC 3.3 V
vol = 0.1          # IOL = 100 uA
vih = 2.0          # VCC = 3 V to 3.6 V
vil = 0.8
# DERIVED: VCC = 3 V, IOH = -24 mA: VOH 2.3 V min against 2.9 V (VCC - 0.1 V at -100 uA), 0.6 V / 24 mA = 25 Ohm.
ro = 25.0
tpd_s = 4.5e-09     # A or B to Y max, VCC 3.3 V +/- 0.3 V, CL = 30 or 50 pF, -40 to 85 C
supply_static_ua = 10.0   # ICC max, VI = 5.5 V or GND, -40 to 85 C
supply_cpd_pf = 23.0      # Cpd typ, f = 10 MHz, VCC = 3.3 V
supply_pin = "5"
gnd_pin = "3"

[models.levels]
# 5.3 Recommended Operating Conditions: VIH 0.65 x VCC at 1.65 V to 1.95 V, 1.7 V at 2.3 V to 2.7 V,
# 2 V at 3 V to 3.6 V, 0.7 x VCC at 4.5 V to 5.5 V; VIL 0.35 x VCC, 0.7 V, 0.8 V, 0.3 x VCC. The
# supply-relative corners are DERIVED (printed percentage x the band's VCC end).
vih = [[1.65, 1.0725], [1.95, 1.2675], [2.3, 1.7], [2.7, 1.7], [3.0, 2.0], [3.6, 2.0], [4.5, 3.15], [5.5, 3.85]]
vil = [[1.65, 0.5775], [1.95, 0.6825], [2.3, 0.7], [2.7, 0.7], [3.0, 0.8], [3.6, 0.8], [4.5, 1.35], [5.5, 1.65]]
voh = [[1.65, 1.55], [5.5, 5.4]]   # VCC - 0.1 V at IOH = -100 uA (5.5 Electrical Characteristics)

[models.pins]
"1" = "a"
"2" = "b"
"3" = "gnd"
"4" = "y"
"5" = "vcc"

[models.ratings]
max_pin_current_a = 0.05   # IO continuous output current abs max (5.1)
max_voltage_v = 6.5        # VCC and VI abs max (5.1)
theta_ja_c_per_w = 371.0   # least favourable package row
[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 1.65
max_v = 5.5
abs_max_v = 6.5
basis = "TI SN74LVC1G02 SCES213Y 5.3 Recommended Operating Conditions VCC 1.65 V to 5.5 V; 5.1 Absolute Maximum Ratings VCC -0.5 V to 6.5 V"

[[models.envelope]]
kind = "input_tolerance"
pins = ["a", "b"]
max_v = 5.5
abs_max_v = 6.5
basis = "TI SN74LVC1G02 SCES213Y 5.3 Recommended Operating Conditions, VI input voltage 0 V to 5.5 V"
abs_max_basis = "TI SN74LVC1G02 SCES213Y 5.1 Absolute Maximum Ratings, VI input voltage -0.5 V to 6.5 V"

[models.logic]
# Behaviour source: TI SN74LVC1G02 SCES213Y 3 Description (the Boolean function of the gate).
inputs = ["a", "b"]
outputs = ["y"]
[models.logic.comb]
y = "!(a | b)"

[models.coverage]
implements = ["nor", "logic_levels"]
missing = ["propagation_timing", "output_drive_curve", "ioff_leakage"]

