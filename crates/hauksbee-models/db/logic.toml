[models.logic]
# Behaviour source: TI SN74HC373 SCLS140G 6.4 Table 6-1 Function Table: while OE is LOW and LE is HIGH Q follows D; with LE LOW Q holds
# the last state (Q0); OE HIGH puts every Q in high impedance and does not disturb the stored state. The latch is a
# combinational self-reference (transparent while LE is high). 6.1 Overview: if LE is held low during startup the output state is unknown until LE is driven high.
inputs = ["1d", "2d", "3d", "4d", "5d", "6d", "7d", "8d", "le", "oe_n"]
outputs = ["1q", "2q", "3q", "4q", "5q", "6q", "7q", "8q"]
[models.logic.comb]
"1q" = "(le & 1d) | (!le & 1q)"
"2q" = "(le & 2d) | (!le & 2q)"
"3q" = "(le & 3d) | (!le & 3q)"
"4q" = "(le & 4d) | (!le & 4q)"
"5q" = "(le & 5d) | (!le & 5q)"
"6q" = "(le & 6d) | (!le & 6q)"
"7q" = "(le & 7d) | (!le & 7q)"
"8q" = "(le & 8d) | (!le & 8q)"
[models.logic.init]
# ASSUMED: the datasheet prints the power-on state as unknown (Q0 at startup is unknown); LOW is chosen so the latch starts in a legal state.
"1q" = 0
"2q" = 0
"3q" = 0
"4q" = 0
"5q" = 0
"6q" = 0
"7q" = 0
"8q" = 0
[models.logic.tristate]
"1q..8q" = { enable = "oe_n", active = "low" }

[models.coverage]
implements = ["transparent_latch", "tristate_enable", "logic_levels"]
missing = ["setup_hold_timing", "propagation_timing", "enable_disable_timing", "output_transition_time", "output_drive_curve", "input_leakage", "power_on_state"]

