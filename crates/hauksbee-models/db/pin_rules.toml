# Pin-role inference rules.
#
# Layout-only board sources (.kicad_pcb, or Board-as-Code decompiled from one)
# carry pads with bare NUMBERS and no electrode role (a diode footprint has pads
# "1"/"2", not "anode"/"cathode"). A netlist carries the role via
# `pinfunction "A"/"K"`, but a layout round-trip drops it. These rules let the
# binder recover the role from the footprint + part kind + pad count, so a
# polarised part still binds.
#
# Every role assigned from a rule is a GUESS: the binder emits a warning naming
# the component, pad, role, and the rule id (visible in the bind report and
# `--lint`). An explicit pinfunction role always wins over a rule, so a part with
# A/K pin functions binds with no warning.
#
# ── Rule schema ──────────────────────────────────────────────────────────────
#   [[pin_rules]]
#   id           = "unique-id"          # surfaced in the guess-warning
#   description  = "..."                 # documentation only
#   footprint_re = "regex"              # case-insensitive, matched on footprint
#   kind         = "diode"              # resolved part kind (optional)
#   pad_count    = 2                     # exact pad count (optional)
#   roles        = { "1" = "cathode", "2" = "anode" }
#
# A rule matches when EVERY populated condition holds (footprint_re AND kind AND
# pad_count). At least one condition must be present. Rules are tried in order;
# the first that matches and maps the requested pad wins.
#
# ── User extension ───────────────────────────────────────────────────────────
# Drop a `pin_rules.toml` (any file with a [[pin_rules]] array) into a model
# directory: `~/.config/hauksbee/models`, `~/.hauksbee/models`, or a
# `--models-dir` path, and its rules are layered AHEAD of these built-ins, so a
# user rule overrides or extends the defaults without recompiling. Example: to
# flip the diode convention for a house footprint, add a rule with the same
# footprint family and the opposite pad→role map.

# ── 2-pin diodes ──────────────────────────────────────────────────────────────
# KiCad's stock "Device:D" Sim.Pins is "1=K 2=A": pad 1 is the cathode, pad 2 is
# the anode. Confirmed against a large internal test netlist, where the diodes
# carry `(pin "1") (pinfunction "K")` and `(pin "2") (pinfunction "A")`. This is
# the standard KiCad small-signal / rectifier diode numbering (SOD/SMA/SMB/MELF/
# DO bodies all share it).
[[pin_rules]]
id = "diode_2pin_k1_a2"
description = "2-pin diode (SOD/SMA/SMB/MELF/DO/Diode_*): pad1=cathode, pad2=anode (KiCad Device:D 1=K 2=A)"
footprint_re = "(?:^Diode_|SOD-?|SMA|SMB|SMC|MELF|DO-|D_SMA|D_SMB|^D_|_Diode_|DIODE)"
kind = "diode"
pad_count = 2
roles = { "1" = "cathode", "2" = "anode" }

# ── 2-pin LEDs ────────────────────────────────────────────────────────────────
# KiCad LED_SMD / LED_THT footprints use the same diode numbering: pad 1 is the
# cathode, pad 2 the anode.
[[pin_rules]]
id = "led_2pin_k1_a2"
description = "2-pin LED (LED_SMD/LED_THT): pad1=cathode, pad2=anode"
footprint_re = "(?:^LED_SMD:|^LED_THT:|LED_)"
kind = "diode"
pad_count = 2
roles = { "1" = "cathode", "2" = "anode" }

# ── SOT-23 / SOT-323 / SC-70 three-terminal ───────────────────────────────────
# The KiCad SOT-23 transistor pinout (Package_TO_SOT_SMD:SOT-23) is
# 1=base, 2=emitter, 3=collector, the convention KiCad's Q_NPN_BEC / Q_PNP_BEC
# symbols and the SOT-23 footprint use. SOT-323 (SC-70-3) is the same outline
# shrunk and carries the same pad order, so the four rules below share one
# footprint pattern.
#
# SOT-416 (SC-75) and SOT-523 are the next size down and number their leads the
# same way. Nexperia's SOT416 package outline (Package information, 31 January
# 2025, Fig. 1 "Package outline SC-75 (SOT416)") numbers 1 lower-left, 2
# lower-right, 3 top, as its SOT323 (Fig. 1, 27 May 2022) and SOT23 outlines
# do; Diodes' SOT523 outline (Rev. 2018-04-09) draws the same body (D 1.60, body
# 0.80, overall 1.60, lead span 1.00, pitch 0.50 mm nominal) without numbers;
# and KiCad's SOT-523 and SOT-416 footprints place pads 1 and 2 on one side and
# 3 alone opposite, as SOT-23. A sheet printing only a lettered top view of such
# a part (Diodes DMG1013T: D top, G lower-left, S lower-right) therefore binds
# G-S-D on pads 1-2-3, reported per pad as a guess.
#
# THE PATTERN IS SPELLED LOOSELY ON PURPOSE, and `pad_count = 3` is what keeps
# it honest. It used to be `SOT-23(?:$|[^-0-9])`, which reads every KiCad
# footprint name correctly and NONE of the ones other CAD tools write: Eagle
# libraries spell the same package `SOT23-3`, `SOT23-3@1` (the `@n` is Eagle's
# duplicate-package suffix) and `SOT323`, and every three-terminal transistor on
# an Eagle board therefore reached the binder with no electrode roles at all and
# was reported as "MOSFET pins not all connected" — an open circuit in place of
# a conducting switch. Dropping the hyphen requirement makes the pattern also
# touch `SOT-23-5` and `SOT-23-6`, which is harmless: those have five and six
# pads, and a rule only fires when the pad count matches exactly.
#
# TO-92 is deliberately absent. It is also a three-terminal transistor package
# but its pad order is not this one (E-B-C, and vendors disagree about which
# way round), so a guess there would be a coin flip on the emitter.
[[pin_rules]]
id = "bjt_sot23_b1_e2_c3"
description = "SOT-23 BJT: pad1=base, pad2=emitter, pad3=collector"
footprint_re = "(?ix) SOT-?23 | SOT-?323 | SC-?70 | SC-?59 | TO-?236 | SOT-?523 | SOT-?416 | SC-?75"
kind = "bjt_npn"
pad_count = 3
roles = { "1" = "base", "2" = "emitter", "3" = "collector" }

[[pin_rules]]
id = "bjt_sot23_b1_e2_c3_pnp"
description = "SOT-23 BJT (PNP): pad1=base, pad2=emitter, pad3=collector"
footprint_re = "(?ix) SOT-?23 | SOT-?323 | SC-?70 | SC-?59 | TO-?236 | SOT-?523 | SOT-?416 | SC-?75"
kind = "bjt_pnp"
pad_count = 3
roles = { "1" = "base", "2" = "emitter", "3" = "collector" }

# ── SOT-23 / SOT-323 / SC-70 MOSFET ───────────────────────────────────────────
# KiCad SOT-23 MOSFET (Q_NMOS_GSD / Q_PMOS_GSD): 1=gate, 2=source, 3=drain.
[[pin_rules]]
id = "nmos_sot23_g1_s2_d3"
description = "SOT-23 N-MOSFET: pad1=gate, pad2=source, pad3=drain"
footprint_re = "(?ix) SOT-?23 | SOT-?323 | SC-?70 | SC-?59 | TO-?236 | SOT-?523 | SOT-?416 | SC-?75"
kind = "nmos"
pad_count = 3
roles = { "1" = "gate", "2" = "source", "3" = "drain" }

[[pin_rules]]
id = "pmos_sot23_g1_s2_d3"
description = "SOT-23 P-MOSFET: pad1=gate, pad2=source, pad3=drain"
footprint_re = "(?ix) SOT-?23 | SOT-?323 | SC-?70 | SC-?59 | TO-?236 | SOT-?523 | SOT-?416 | SC-?75"
kind = "pmos"
pad_count = 3
roles = { "1" = "gate", "2" = "source", "3" = "drain" }

# ── TO-220 / TO-247 / DPAK (TO-252) / D2PAK (TO-263) 3-pin MOSFET ─────────────
# 1 = gate, 2 = drain (the metal TAB is the drain and is tied to pad 2), 3 =
# source. This is the de-facto standard vertical-power-MOSFET order and is
# stated on the datasheets themselves: Infineon/IR IRF540NPbF Rev. 2.1 page 1
# ("Gate Pin 1 / Drain Pin 2, Tab / Source Pin 3"), and the same G-D-S order is
# carried by the IRLZ44N, IRFZ44N, IRF640/IRF740 family, the STMicro STP/STB
# parts and the onsemi/Fairchild FQP/FDD DPAK and D2PAK ranges. KiCad's
# TO-220-3 / TO-252-3_TabPin2 / TO-263-2_TabPin2 footprints number the tab pad
# 2, which is why one rule covers the through-hole and the surface-mount bodies.
#
# SCOPED TO THE MOSFET KINDS ON PURPOSE. These packages are shared with parts
# whose pad order is NOT this one and a blind rule would silently mis-wire them:
# a TO-220 78xx regulator is 1=IN, 2=GND, 3=OUT; a TO-220 BJT (TIP120, BD139) is
# 1=base, 2=collector, 3=emitter — the same tab, a different electrode. Only
# `kind = "nmos"` / `"pmos"` parts, which the resolved model card establishes,
# take these roles; everything else in the package falls through unmapped, which
# is a visible "pins not all connected" rather than a wrong answer.
#
# TO-92 remains deliberately absent for the same reason it is absent above.
[[pin_rules]]
id = "nmos_to220_g1_d2_s3"
description = "TO-220/TO-247/DPAK/D2PAK N-MOSFET: pad1=gate, pad2=drain (tab), pad3=source"
footprint_re = "(?ix) TO-?220 | TO-?247 | TO-?252 | TO-?263 | DPAK | D2PAK"
kind = "nmos"
pad_count = 3
roles = { "1" = "gate", "2" = "drain", "3" = "source" }

[[pin_rules]]
id = "pmos_to220_g1_d2_s3"
description = "TO-220/TO-247/DPAK/D2PAK P-MOSFET: pad1=gate, pad2=drain (tab), pad3=source"
footprint_re = "(?ix) TO-?220 | TO-?247 | TO-?252 | TO-?263 | DPAK | D2PAK"
kind = "pmos"
pad_count = 3
roles = { "1" = "gate", "2" = "drain", "3" = "source" }
