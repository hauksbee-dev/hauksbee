# 31.1 DC Characteristics (p.355), I/O pins other than XTAL1 and RESET: VIL max 0.2 VCC for VCC 1.8 V - 2.4 V and 0.3 VCC for 2.4 V - 5.5 V;
# VIH min 0.7 VCC and 0.6 VCC over the same two ranges. The points are ratio x VCC (derived), the 2.4 V boundary is a step written as two points 1 mV apart.
# VOL max and VOH min are the printed values at the datasheet test currents (20 mA at 5 V, 10 mA at 3 V), so they are worst-case at heavy load, not at light load.
[models.levels]
vih = [[4.5, 2.7], [5.5, 3.3]]
vil = [[4.5, 1.35], [5.5, 1.65]]
voh = [[5.0, 4.2], [5.5, 4.2]]  # datasheet gives VOH at VCC = 5 V only; held flat to the 5.5 V ceiling
vol = [[5.0, 0.9], [5.5, 0.9]]  # datasheet gives VOL at VCC = 5 V only; held flat to the 5.5 V ceiling

