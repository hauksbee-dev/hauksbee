basis = "Microchip ATmega640/V-1280/V-1281/V-2560/V-2561/V datasheet DS40002211A, Figure 1-1 TQFP-pinout (p.2): PF0-PF7 carry ADC0-ADC7 and PK0-PK7 carry ADC8-ADC15; Table 1-1 (p.3) gives the CBGA balls and states the functions are the same as the 100-pin package; 2.3.8 and 2.3.12 (pp.8-9)"
