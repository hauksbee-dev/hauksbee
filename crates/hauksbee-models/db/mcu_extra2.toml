# -----------------------------------------------------------------------------
# ATmega2560V-8AU / -8AUR, 100A 100-lead TQFP (ATmega2560V).
# Pad map: Microchip ATmega640/V-1280/V-1281/V-2560/V-2561/V datasheet DS40002211A, Figure 1-1 TQFP-pinout (p.2), pins 1-100. The CBGA and the TQFP carry the same pad names (note under Table 1-1, p.3);
# the VCC pads (4) and GND pads (5) are numbered in pad order, vcc/vcc2.. and gnd/gnd2.. .
# Roles are the port pin plus its printed alternate function. The analog comparator inputs (AIN0/AIN1) are left out of the role names.
# The backend is `none:atmega2560`: the cosim simavr part list is asserted by another suite, so this card gives structure and ratings only.
[[models]]
id = "atmega2560v_tqfp100"
kind = "mcu"
description = "ATmega2560V low-voltage 8-bit AVR MCU, 100-lead TQFP (structure only, no co-sim core)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://ww1.microchip.com/downloads/en/DeviceDoc/ATmega640-1280-1281-2560-2561-Datasheet-DS40002211A.pdf"
title = "Microchip ATmega640/V-1280/V-1281/V-2560/V-2561/V Complete Datasheet, DS40002211A"
locator = "Figure 1-1 TQFP-pinout (p.2); Table 1-1 CBGA-pinout (p.3); 2.3 Pin Descriptions (pp.7-9); 10.3 Clock Sources Table 10-1 and 10.3.1 Default Clock Source (p.40); Table 10-3 (p.42) and Table 10-5 (p.43); 26.6.1 Analog Input Circuitry (p.275); 31 Electrical Characteristics: Absolute Maximum Ratings and 31.1 DC Characteristics (pp.355-357), 31.2 Speed Grades (pp.357-358), 31.3 and 31.4 clock (p.359), 31.5 System and Reset Characteristics (pp.360-361), 31.8 ADC Characteristics (p.365); 35.4 ATmega2560 ordering information (p.410); 36.1 100A (p.412) and 36.2 100C1 (p.413)"
sha256 = "978a018098bc1a136d3232b1b58aa3c652324c9b693a99830e0770bed2c76fb4"

[models.match]
# DS40002211A 35.4 ATmega2560 (p.410): ATmega2560V-8AU and -8AUR (100A TQFP), -8CU and -8CUR (100C1 CBGA), 8 MHz at 1.8 V - 5.5 V.
# The bare family name names no package, the other grade, or the other family members (ATmega640, 1280, 1281, 2561), so none of them resolves here.
value_re = "(?i)^ATmega2560V-8AUR?$"

[models.params]
xtal_cap_min_f = 12.0e-12
xtal_cap_max_f = 22.0e-12
# Table 10-3 (p.42) and Table 10-5 (p.43): recommended range for capacitors C1 and C2, 12 - 22 pF (the 0.4 - 0.9 MHz low power mode prints a dash).
backend = "none:atmega2560"
# 10.3.1 Default Clock Source (p.40): shipped with the internal RC oscillator at 8.0 MHz and CKDIV8 programmed, a 1.0 MHz system clock; the fuses override it.
internal_clock = "internal 8 MHz RC oscillator with CKDIV8 programmed (1 MHz system clock)"
default_clock_hz = 1000000
# Section 31.1 RRST, reset pull-up resistor 30 kOhm min / 60 kOhm max (p.355); the minimum is used for the held-off divider check.
reset_pull_up_ohms = 30000.0
# 26.6.1 Analog Input Circuitry (p.275): the ADC is optimised for sources of "approximately 10k" ohm output impedance or less.
max_adc_source_impedance_ohms = 10000.0

