# 2.3.14 RESET (p.9): a low level longer than the minimum pulse length generates a reset, even with the clock stopped. 31.1 DC Characteristics (p.355):
# RRST 30 - 60 kOhm pull-up; VIL2 max 0.1 VCC and VIH2 min 0.9 VCC for the RESET pin over VCC 1.8 V - 5.5 V. AVR boot behaviour is set by fuses, not pins, so there is no boot strap.
[[models.straps]]
role = "reset"
level = "high"
boot_select = false
internal_pull = "pull_up"
vil = [0.1, 0.0]
vih = [0.9, 0.0]
note = "RESET is active low with an internal 30-60 kOhm pull-up; a low longer than 2.5 us resets the part; thresholds 0.1 VCC (VIL2 max) and 0.9 VCC (VIH2 min)"

[models.ratings]
max_pin_current_a = 0.04   # Absolute Maximum Ratings: DC current per I/O pin 40.0 mA (p.355)
max_current_a = 0.2        # Absolute Maximum Ratings: DC current VCC and GND pins 200.0 mA (p.355)
max_voltage_v = 6.0        # Absolute Maximum Ratings: maximum operating voltage 6.0 V (p.355); NOT the 5.5 V recommended ceiling

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 4.5
max_v = 5.5
abs_max_v = 6.0
basis = "Microchip ATmega640/V-1280/V-1281/V-2560/V-2561/V datasheet DS40002211A, 35.4 ATmega2560 ordering table p.410, ATmega2560-16xx power supply 4.5 V - 5.5 V; Figure 31-4 p.358 safe operating area from 4.5 V"
abs_max_basis = "Microchip ATmega640/V-1280/V-1281/V-2560/V-2561/V datasheet DS40002211A, 31 Electrical Characteristics, Absolute Maximum Ratings p.355, maximum operating voltage 6.0 V"

[[models.envelope]]
kind = "supply_range"
pin = "avcc"
min_v = 4.2
basis = "Microchip ATmega640/V-1280/V-1281/V-2560/V-2561/V datasheet DS40002211A, 2.3.17 AVCC (p.9): supply for port F and the A/D converter, to be connected to VCC even if the ADC is not used; Table 31-9 (p.365) AVCC = VCC - 0.3 V to VCC + 0.3 V, with the 4.5 V ordering minimum of VCC this gives 4.2 V (derived); Figure 30-10 note 2 (p.339) says AVCC should always be within 1.8 V - 5.5 V"
max_v = 5.5

[models.coverage]
implements = ["pad_map", "supply_envelope", "supply_current_rating"]
missing = ["firmware_cosim_core", "gpio_behaviour", "gpio_cluster_current_limits"]

