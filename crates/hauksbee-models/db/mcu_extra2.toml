# Bootloader UART RX pad bias. Sources, each read from the PDF:
#   AN2606 Rev 70 (February 2026), https://www.st.com/resource/en/application_note/an2606-stm32-microcontroller-system-memory-boot-mode-stmicroelectronics.pdf sha256 25b466e39ecc61671dcb988d8ca538462d6452d85f68140cb981ed728f57e654;
#   AN3155 Rev 22 (September 2026), https://www.st.com/resource/en/application_note/an3155-usart-protocol-used-in-the-stm32-bootloader-stmicroelectronics.pdf sha256 0e3e1c35ffa3311aba33440d9d6236dc2f59af8a7f32482cf13d1d0af8c5e1f9;
#   RM0090 Rev 22 (https://www.st.com/resource/en/reference_manual/rm0090-stm32f405415-stm32f407417-stm32f427437-and-stm32f429439-advanced-armbased-32bit-mcus-stmicroelectronics.pdf) sha256 f3ff2322eec21f4e49081f68481b764506eee81dba6031bc767e2f8955b27cca.

[[models.pin_bias]]
role = "pa10"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 75 (STM32F40xxx/41xxx configuration in system memory boot mode, bootloader V9.x; the V3.x Table 73 PDF pp.161-162 lists the same pad) PDF p.165, USART1_RX pin: \"PA10 pin: USART1 in reception mode. Used in input no pull mode.\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0090 Rev 22 PDF p.964 section 30.3.1 USART character description: \"The TX pin is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

[[models.pin_bias]]
role = "pb11"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 75 (STM32F40xxx/41xxx configuration in system memory boot mode, bootloader V9.x; the V3.x Table 73 PDF pp.161-162 lists the same pad) PDF p.165, USART3_RX pin (USART3 on PB10/PB11): \"PB11 pin: USART3 in reception mode. Used in input pull-up mode\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0090 Rev 22 PDF p.964 section 30.3.1 USART character description: \"The TX pin is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."

[[models.pin_bias]]
role = "pc11"
level = "high"
needs = "idle"
opposed_only = true
basis = "AN2606 Rev 70 Table 75 (STM32F40xxx/41xxx configuration in system memory boot mode, bootloader V9.x; the V3.x Table 73 PDF pp.161-162 lists the same pad) PDF p.165, USART3_RX pin (USART3 on PC10/PC11): \"PC11 pin: USART3 in reception mode. Used in input pull-up mode.\"; AN3155 Rev 22 PDF p.5 section 1 (bootloader code sequence): \"the bootloader code begins to scan the USARTx_RX line pin, waiting to receive the 0x7F data frame: a start bit, 0x7F data bits, even parity bit(a), and a stop bit.\"; RM0090 Rev 22 PDF p.964 section 30.3.1 USART character description: \"The TX pin is in low state during the start bit. It is in high state during the stop bit.\" and \"An Idle character is interpreted as an entire frame of “1”s\" and \"A Break character is interpreted on receiving “0”s for a frame period\""
note = "The ROM bootloader detects the host by the UART start bit, so a pull-down or a tie to ground on this pin keeps the line in the break state and the bootloader never starts; the pin is an ordinary port pin when the board does not use the bootloader, so only a bias the wrong way round is reported."


# -----------------------------------------------------------------------------
# WLCSP90: STM32F405OG, STM32F405OE (O = 90 pins, WLCSP only).
# Pad map: ST STM32F405xx/F407xx datasheet DS8626 Rev 12 (March 2026), Table 7 "STM32F40xxx pin and ball definitions" (pp.49-60), the
# WLCSP90 column; checked against Table 7 WLCSP90 ball column (pp.49-60).
# Roles: PA13/PA14 carry SWDIO/SWCLK, PH0/PH1 are the HSE oscillator pins and
# PC14/PC15 the LSE pins (Table 7 alternate-function column). An `_adcN` suffix is the
# ADC1 input number of a pin ADC1 reads (Table 7 ADC123_INx / ADC12_INx); the ADC3-only
# pins (PF3-PF10) keep their port role and are listed in pin_capability.adc only.
[[models]]
id = "stm32f40x_wlcsp90"
kind = "mcu"
description = "STM32F405OG/OE Cortex-M4F MCU, WLCSP90"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.st.com/resource/en/datasheet/stm32f405rg.pdf"
title = "STM32F405xx, STM32F407xx datasheet DS8626 Rev 12 (March 2026)"
locator = "Table 1 Device summary; Table 2 features (p.15-16); Table 3 regulator and reset availability (p.31); Table 7 pin and ball definitions (pp.49-60), WLCSP90 column; Table 11 voltage characteristics (p.80); Table 12 current characteristics and Table 13 thermal characteristics (p.81); Table 14 general operating conditions (pp.81-82); Table 16 VCAP (p.84); Table 19 reset and power control (pp.85-86); Tables 32-34 oscillators (pp.103-105); Tables 47-49 and 51 I/O and NRST (pp.116-121); Table 67 ADC (p.135); Table 98 package thermal (p.185); section 8 ordering information (p.186)"
sha256 = "1f41b4fa49a9960215ebb76cd0a75f20241db82eed60d308345a80463caeed22"
[[models.source.references]]
url = "https://www.st.com/resource/en/reference_manual/rm0090-stm32f405415-stm32f407417-stm32f427437-and-stm32f429439-advanced-armbased-32bit-mcus-stmicroelectronics.pdf"
title = "RM0090 Rev 22, STM32F405/415, STM32F407/417, STM32F427/437 and STM32F429/439 advanced Arm-based 32-bit MCUs"
locator = "section 2.4 Boot configuration, Table 2 Boot modes (p.69)"
sha256 = "f3ff2322eec21f4e49081f68481b764506eee81dba6031bc767e2f8955b27cca"

[models.match]
# Ordering code STM32F40 5|7 + pin letter + flash letter + package letter + temperature (section 8,
# p.186: R = 64, O = 90, V = 100, Z = 144, I = 176 pins; T = LQFP, H = UFBGA, Y = WLCSP; 6 = 85 C,
# 7 = 105 C; TR = tape and reel). Only the pairs Table 1 lists resolve, and the package letter
# is required where one pin count has two packages (I = 176: T is LQFP176, H is UFBGA176, so a
# bare STM32F407IG names no package and stays unresolved). `x` is the KiCad symbol spelling.
value_re = "(?i)^STM32F405O[GE](Y([67x](TR)?)?)?$"

[models.params]
backend = "renode:stm32f4"
# Table 34 HSI: fHSI 16 MHz typ; the part runs from it after reset (RM0090 section 6.2).
internal_clock = "internal 16 MHz HSI RC oscillator"
default_clock_hz = 16000000
# Table 32 text under HSE: "CL1 and CL2 ... high-quality external ceramic capacitors in the 5 pF to 25 pF range (typ.)" (p.103).
xtal_cap_min_f = 5.0e-12
xtal_cap_max_f = 25.0e-12
# Table 51 NRST RPU 30 kOhm min / 40 typ / 50 max (VIN = VSS): the minimum, for the held-off divider check.
reset_pull_up_ohms = 30000.0
# Table 67 RAIN external input impedance 50 kOhm max (the table value; Equation 1 gives the lower limit for a
# given sampling time and ADC clock, which this single figure does not replace).
max_adc_source_impedance_ohms = 50000.0

