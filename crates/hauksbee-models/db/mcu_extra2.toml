max_voltage_v = 4.0         # Table 11 VDD-VSS external main supply voltage (including VDDA, VDD), -0.3 V to 4.0 V (p.80)
max_junction_temp_c = 125.0 # Table 13 TJ maximum junction temperature (p.81)
theta_ja_c_per_w = 38.0  # Table 98 (p.185): thermal resistance junction-ambient, LQFP176 - 24 x 24 mm / 0.5 mm pitch

