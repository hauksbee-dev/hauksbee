# 16.6.2.7 Reset Controller (p.139): "The external reset is generated when pulling the RESET pin low. This pin has an
# internal pull-up, and does not need to be driven externally during normal operation." 45.4 (p.1127): the
# RESET pin itself has an internal pull-up, so an external pull-up is optional. Table 37-15 prints the input
# thresholds as ratios that differ by VDD range (0.25 / 0.7 VDD below 2.7 V, 0.3 / 0.55 VDD above), which one
# affine strap threshold cannot hold, so no strap threshold is recorded.
[[models.straps]]
role = "reset_n"
level = "high"
boot_select = false
internal_pull = "pull_up"
note = "RESET is active low with an internal pull-up (20-60 kOhm) and needs no external drive in normal operation"

# 13.6.2 CPU Reset Extension (p.71): the debugger is detected on a RESET release event when SWCLK is low; at
# startup SWCLK is internally pulled up so an unconnected SWCLK is not mistaken for a debugger. A SWCLK held
# low as RESET releases extends the CPU reset (STATUSA.CRSTEXT) and the firmware does not run until a debugger
# releases it. SAM D21 has no BOOT pin: the boot loader is firmware in flash protected by the BOOTPROT fuse (NVM user row).
[[models.straps]]
role = "pa30_swclk"
level = "high"
boot_select = false
internal_pull = "pull_up"
note = "SWCLK low at RESET release is read as a debugger and holds the CPU in reset extension; SWCLK has an internal pull-up at startup"

