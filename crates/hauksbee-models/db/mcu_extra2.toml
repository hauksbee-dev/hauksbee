# BOOT0 is the dedicated "B" pin (Table 7 pad A7). RM0090 Rev 22 Table 2 (p.69): BOOT0 = 0 boots main
# flash whatever BOOT1 (PB2) is; BOOT0 = 1 with BOOT1 = 0 boots system memory (the ST bootloader),
# BOOT0 = 1 with BOOT1 = 1 boots SRAM. The pins are latched on the 4th rising SYSCLK edge after reset
# and resampled on exit from Standby. Thresholds: Table 48 BOOT0 VIL max 0.1 VDD + 0.1 V, VIH min
# 0.17 VDD + 0.7 V (p.116). Neither DS8626 nor RM0090 section 2.4 states an internal pull on BOOT0,
# so internal_pull is left unknown. BOOT1 (PB2) is a don't-care for a main-flash boot and has no strap row.
[[models.straps]]
role = "boot0"
level = "low"
boot_select = true
vil = [0.1, 0.1]
vih = [0.17, 0.7]
note = "BOOT0 low boots main flash; high boots system memory (BOOT1 low) or SRAM (BOOT1 high); latched on the 4th SYSCLK rising edge after reset and again on Standby exit"

# NRST (pad G10): Table 51 (p.121) RPU 30/40/50 kOhm weak pull-up at VIN = VSS; VIL(NRST) max
# 0.3 VDD and VIH(NRST) min 0.7 VDD (CMOS ports, 1.8 V to 3.6 V). Generated reset pulses last at least 20 us.
[[models.straps]]
role = "reset"
level = "high"
boot_select = false
internal_pull = "pull_up"
vil = [0.3, 0.0]
vih = [0.7, 0.0]
note = "NRST is active low with a 30-50 kOhm internal weak pull-up; held low it keeps the part in reset"

