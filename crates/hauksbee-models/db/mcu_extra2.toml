# 2.3.14 RESET (p.9): a low level longer than the minimum pulse length generates a reset, even with the clock stopped. 31.1 DC Characteristics (p.355):
# RRST 30 - 60 kOhm pull-up; VIL2 max 0.1 VCC and VIH2 min 0.9 VCC for the RESET pin over VCC 1.8 V - 5.5 V. AVR boot behaviour is set by fuses, not pins, so there is no boot strap.
[[models.straps]]
role = "reset"
level = "high"
boot_select = false
internal_pull = "pull_up"
vil = [0.1, 0.0]
vih = [0.9, 0.0]
note = "RESET is active low with an internal 30-60 kOhm pull-up; a low longer than 2.5 us resets the part; thresholds 0.1 VCC (VIL2 max) and 0.9 VCC (VIH2 min)"

[models.ratings]
max_pin_current_a = 0.04   # Absolute Maximum Ratings: DC current per I/O pin 40.0 mA (p.355)
max_current_a = 0.2        # Absolute Maximum Ratings: DC current VCC and GND pins 200.0 mA (p.355)
max_voltage_v = 6.0        # Absolute Maximum Ratings: maximum operating voltage 6.0 V (p.355); NOT the 5.5 V recommended ceiling

