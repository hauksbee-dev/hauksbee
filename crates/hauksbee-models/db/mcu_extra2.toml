# Table 48 (p.116-117) and Table 49 (p.118). VIL max and VIH min are the ratiometric rows
# 0.3 VDD - 0.04 V (1.7 V to 3.6 V, by design) and 0.7 VDD (tested in production), evaluated at
# the 1.8 V and 3.6 V ends of the VDD range (derived: ratio x VDD). Table 48 also prints
# VIH min 0.45 VDD + 0.3 V and VIL max 0.3 VDD (1.75 V to 3.6 V); the stricter row of each pair is
# used. VOL max 0.4 V (IIO = +8 mA, CMOS port, 2.7 V to 3.6 V) and VOH min VDD - 0.4 V at the
# same condition (derived: 2.7 V - 0.4 V and 3.6 V - 0.4 V); levels are held flat below 2.7 V.
[models.levels]
vih = [[1.8, 1.26], [3.6, 2.52]]
vil = [[1.8, 0.5], [3.6, 1.04]]
voh = [[2.7, 2.3], [3.6, 3.2]]
vol = [[2.7, 0.4], [3.6, 0.4]]

