basis = "TI uA741 SLOS094H Section 5.4 Electrical Characteristics uA741C, VICR common-mode input voltage range MIN +/-12 V, TYP +/-13 V at VCC = +/-15 V and 25 C, i.e. 3 V of guaranteed headroom below VCC+"

[models.params]
gain    = 200000.0  # AVD large-signal differential voltage amplification TYP
                    # 200 V/mV (MIN 20 V/mV), RL >= 2 kOhm, VO = +/-10 V, 25 C
slew    = 0.5       # SR slew rate at unity gain TYP 0.5 V/us, VI = 10 V,
                    # RL = 2 kOhm, CL = 100 pF, Section 5.6
swing_lo = 3.0      # VOM maximum peak output voltage swing at RL = 10 kOhm,
swing_hi = 3.0      # 25 C: MIN +/-12 V (TYP +/-14.95 V). The guaranteed MIN is
                    # taken: 3.0 V of headroom from each rail. At RL = 2 kOhm
                    # the guaranteed swing is +/-10 V, i.e. 5 V of headroom.
rail_lo = -12.0     # fallback levels only (deck `.model opamp(...)`, no pins)
rail_hi = 12.0
warning = "THIS PART IS SPLIT-SUPPLY ONLY. SLOS094H Section 5.2 recommends VCC+ between 5 V and 15 V and VCC- between -5 V and -15 V, per rail, and the two supply_range envelopes on this card fire when either supply pin leaves its range -- which a uA741 with V- on ground does. NO BANDWIDTH IS MODELLED: the datasheet prints no gain-bandwidth product and no unity-gain bandwidth, only a 0.3 us rise time and a 0.5 V/us slew rate, so `pole_hz` is deliberately absent and this model rolls off nowhere. The output swing is bounded by the supply pins (V(VCC-)+3 V to V(VCC+)-3 V, the guaranteed MIN at RL = 10 kOhm on a +/-15 V supply); the load dependence is not modelled and at RL = 2 kOhm the guaranteed swing is only +/-10 V. The +/-80 mA short-circuit output current is not modelled. Input offset voltage (0.3 mV typ, 6 mV max), input bias current (500 nA max) and input offset current (200 nA max) are taken as zero, and the gain is the 200 V/mV typ rather than the 20 V/mV min. The offset-null pins (1 and 5) are not claimed by this map and any trim network wired to them is not modelled."

[models.coverage]
