[[models]]
id = "mcp6001"
kind = "opamp"
description = "Microchip MCP6001 single rail-to-rail CMOS op-amp, 5-pin SC70/SOT-23, 1.8 to 6.0 V"

[models.match]
# The PLAIN MCP6001 only: VOUT on 1, VSS on 2, VDD on 5. The optional "T" is
# the tape-and-reel letter and the tail is the temperature/package code, so
# "MCP6001T-E/OT" and "MCP6001-I/LT" match while "MCP6001RT-I/OT" and
# "MCP6001UT-I/OT" do not -- the letter after the digits must be a T or the
# string must end or go straight into the dash. Those two have their own
# entries below with their own maps; see the note above for why that matters.
value_re = "(?i)^MCP6001T?([-/][A-Z0-9/]*)?$"

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 1.8
max_v = 6.0
abs_max_v = 7.0
severity = "serious"
basis = "Microchip MCP6001/2/4 DS20001733L, DC ELECTRICAL SPECIFICATIONS, Power Supply, VDD MIN 1.8 V MAX 6.0 V (Absolute Maximum Ratings give VDD - VSS 7.0 V)"

[models.params]
gain    = 398107.0  # AOL TYP 112 dB (MIN 88 dB), VOUT = 0.3 V to VDD - 0.3 V
pole_hz = 2.512     # DERIVED: GBWP 1.0 MHz TYP / AOL 398107 TYP
slew    = 0.6       # SR TYP 0.6 V/us
swing_lo = 0.025    # VOL VSS + 25 mV / VOH VDD - 25 mV, at VDD = 5.5 V,
swing_hi = 0.025    # 0.5 V input overdrive, RL = 10 kOhm to VDD/2
rail_lo = 0.025     # fallback levels only (deck `.model opamp(...)`, no pins)
rail_hi = 5.475
warning = "rail-to-rail input AND output: the output reaches within 25 mV of each supply pin at RL = 10 kOhm, and the guaranteed common-mode input range runs from VSS - 0.3 V to VDD + 0.3 V, so this card carries no input_common_mode envelope. The output current limit is NOT modelled and there is no swing-versus-load row in the datasheet to model. The swing row is specified at VDD = 5.5 V with 0.5 V of input overdrive and this card applies it at every supply. The 2.512 Hz pole is DERIVED from the typical 1 MHz GBWP and the typical 112 dB gain, not printed. Input offset voltage (+/-4.5 mV max, no typical printed) is taken as zero. THE PIN MAP IS THE PLAIN MCP6001's: the MCP6001R swaps VDD and VSS between pins 2 and 5 and the MCP6001U moves the output to pin 4, and both are matched by their own entries rather than by this one."

[models.coverage]
implements = ["finite_open_loop_gain", "supply_referenced_output_swing",
              "rail_to_rail_output", "rail_to_rail_input", "dominant_pole",
              "slew_rate_limit", "single_channel", "supply_voltage_envelope"]
missing = ["output_current_limit", "load_dependent_output_swing",
           "input_offset_voltage", "input_bias_current", "input_offset_current",
           "parameter_spread",
           "quiescent_supply_current"]

[models.pins]
# DS20001733L Table 3-1, the "MCP6001 5-Lead SC70, SOT-23" column.
"1" = "out"        # VOUT
"2" = "vss"        # VSS
"3" = "in_plus"    # VIN+
"4" = "in_minus"   # VIN-
"5" = "vcc"        # VDD

[models.ratings]
max_voltage_v = 7.0
max_pin_current_a = 0.002     # analog input pins, +/-2 mA
max_junction_temp_c = 150.0
theta_ja_c_per_w = 256.0      # Thermal Resistance, 5-Lead SOT-23 (SC70 is 331)

