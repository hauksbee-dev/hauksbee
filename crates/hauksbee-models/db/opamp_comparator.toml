[models.params]
# Source: INA2181 datasheet SBOS793H, Electrical Characteristics.
# Gain is suffix-dependent (A1=20, A2=50, A3=100, A4=200 V/V), same family.
gain    = 100.0    # representative (A3 suffix); actual gain from part suffix
rail_lo = 0.0
rail_hi = 5.5      # VS maximum (6.3); the binder follows the real rail when VS is wired

warning = "the output swing on this card is a FIXED level, not a headroom from the voltage on the supply pin: unlike the LM358/LM324/TSV914 entries it carries no `swing_hi`/`swing_lo`, so a INA2181 on a rail lower than that level is answered as if it could swing past its own supply. The gain is the A3 100 V/V representative, not the order code's A1/A2/A3/A4 suffix (20/50/100/200 V/V). The output current limit, input offset voltage and input bias current are unmodelled (taken as zero or unchecked), and every figure is the datasheet TYPICAL at 25 C, not a bound over the part's spread or over temperature. The input common-mode range is not simulated as a limit on the output, but IN+ and IN- each carry the datasheet pin rating (-0.2 V to 26 V recommended, 26 V absolute maximum common mode), which the envelope and back_power checks judge."

