# Op-amp and comparator models (behavioral).

[[models]]
id = "lm358"
kind = "opamp"
description = "LM358 dual op-amp, 32V supply, rail-to-rail input"

[models.match]
value_re = "(?i)^LM358"

# VICR, one entry per channel. headroom_v is the 25 C row's 1.5 V, not the
# full-temperature 2 V, as for every card in this file whose sheet prints both.
# The op-amp's real rule is stricter than the
# comparator's -- EITHER input above V+ - 1.5 V leaves the guaranteed range --
# but the envelope kind encodes the both-inputs form, so this UNDER-reports on
# an op-amp rather than over-reporting: a flagged board is certainly out of
# range, an unflagged one is not thereby in range.
[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_a", "in_minus_a"]
headroom_v = 1.5
severity = "serious"
basis = "TI LM358 SLOS068AB, Electrical Characteristics for LM358 and LM358A, INPUT VOLTAGE RANGE, VCM (V-) to (V+) - 1.5 V at TA = 25 C, VS = 5 V to 30 V ((V+) - 2 V over TA = 0 to 70 C; Recommended Operating Conditions print the same (V+) - 2 V)"

[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_b", "in_minus_b"]
headroom_v = 1.5
severity = "serious"
basis = "TI LM358 SLOS068AB, Electrical Characteristics for LM358 and LM358A, INPUT VOLTAGE RANGE, VCM (V-) to (V+) - 1.5 V at TA = 25 C, VS = 5 V to 30 V ((V+) - 2 V over TA = 0 to 70 C; Recommended Operating Conditions print the same (V+) - 2 V)"

[models.params]
# Sources: TI "LM158/LM258/LM358/LM2904" SLOS068AB (June 1976, rev. October
# 2024), OUTPUT section of the Electrical Characteristics; corroborated on the
# swing figures by Diodes Incorporated DS35167 Rev. 2-2 (February 2011).
gain    = 100000.0  # open-loop DC gain (V/V), AOL 100 V/mV typ
# THE SWING IS A HEADROOM FROM THE SUPPLY PINS, NOT A FIXED LEVEL. These two
# are what the binder uses when the part's V+/V- pads are on nets: the output
# saturates at V(V-)+swing_lo .. V(V+)-swing_hi, so a 5 V single supply tops
# out near 3.5 V, not at the 32 V absolute-maximum supply the old rail_hi
# named. A board that does not wire V+ is refused as an open part rather than
# silently given the fixed rail.
swing_hi = 1.5      # "VO voltage output swing from rail, positive rail,
                    # VS = 5 V, RL >= 2 kOhm": MAX 1.5 V (SLOS068AB). Diodes
                    # states the same ceiling as "0V to V+ - 1.5V". No MINIMUM
                    # is printed by either vendor, so this is the guaranteed
                    # worst case, not a typical.
swing_lo = 0.020    # same row, negative rail, VS = 5 V, RL <= 10 kOhm,
                    # TA = -25 to 85 C: TYP 5 mV, MAX 20 mV. The MAX is taken.
# No rail_lo/rail_hi: with the swing published the binder never reads them
# (a deck `.model opamp(...)` carries its own), and the 0 V / 32 V they held
# were supply levels, which the lint now rejects as output limits.
warning = "the output swing is bounded by the supply pins (V(V-)+20 mV to V(V+)-1.5 V, the datasheet MAX headrooms at RL >= 2 kOhm), but nothing else about the output stage is: the output current limit (short-circuit and the 20 mA source / 10 mA sink region) is not modelled, so a load stiffer than 2 kOhm gets a swing the part cannot actually hold and a heavier one is answered as if it could. The input common-mode range is now checked by the `input_common_mode` envelope above, and that rule UNDER-REPORTS for an op-amp: it fires only when BOTH inputs of one channel sit above V+ - 1.5 V, whereas this part leaves its guaranteed range as soon as EITHER input does, so a single input above the ceiling is not flagged at all. The 0 V lower end is not checked either, the amplification itself is still computed as if the part were in range, and the phase-reversal behaviour below V- is not modelled at all. Input offset voltage (3 mV typ, 7 mV max), input bias current (45 nA typ, 250 nA max) and input offset current (5 nA typ, 50 nA max) are taken as zero, and the gain is the 100 V/mV typ rather than the 25 V/mV min, so a computed output is the NOMINAL part at 25 C, not a bound over the datasheet's spread or over temperature. The 0.7 MHz gain-bandwidth and 0.3 V/us slew rate are not on this card, so a board-bound LM358 answers DC and settles instantly."

[models.coverage]
implements = ["finite_open_loop_gain", "supply_referenced_output_swing",
              "dual_channel", "split_or_single_supply"]
missing = ["output_current_limit", "input_common_mode_range", "input_offset_voltage",
           "input_bias_current", "input_offset_current", "parameter_spread",
           "quiescent_supply_current"]

[models.pins]
# Pin numbers for DIP-8 / SOIC-8 LM358 (unit A, pin numbers vary by schematic)
"1" = "out_a"
"2" = "in_minus_a"
"3" = "in_plus_a"
"4" = "vss"
"5" = "in_plus_b"
"6" = "in_minus_b"
"7" = "out_b"
"8" = "vcc"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "ina186_dck_a1"
kind = "opamp"
description = "INA186A1 current-sense amplifier, gain 25 V/V, SC70-6"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/ina186.pdf"
title = "Texas Instruments INA186 datasheet, SBOS318B, revised July 2021"
locator = "Table 5-1 Pin Functions (DCK column) p.3; 6.1 Absolute Maximum Ratings p.4; 6.3 Recommended Operating Conditions p.4"
sha256 = "9a3502cad52a61125f7da8da07b0794795eab0c9563fb01db6df22ccfc5aebe6"
[[models.source.pinout]]
package = "SC70-6 (DCK)"
pins = { "1" = "REF", "2" = "GND", "3" = "VS", "4" = "IN+", "5" = "IN-", "6" = "OUT" }

[models.match]
value_re = "(?i)^INA186A1(I?DCK[A-Z0-9-]*)?$"

[models.params]
# Source: TI INA186 datasheet SBOS318B, DCK SC70 pinout and A1 gain/BW.
gain = 25.0
pole_hz = 45000.0
rail_lo = 0.0
rail_hi = 5.5

warning = "the output swing on this card is a FIXED level, not a headroom from the voltage on the supply pin: unlike the LM358/LM324/TSV914 entries it carries no `swing_hi`/`swing_lo`, so a INA186A1 on a rail lower than that level is answered as if it could swing past its own supply. The output current limit, input offset voltage and input bias current are unmodelled (taken as zero or unchecked), and every figure is the datasheet TYPICAL at 25 C, not a bound over the part's spread or over temperature. The input common-mode range is not simulated as a limit on the output, but IN+ and IN- each carry the datasheet pin rating (-0.2 V to 40 V recommended, 42 V absolute maximum with respect to GND), which the envelope and back_power checks judge."

[models.coverage]
implements = ["fixed_gain", "finite_output_swing", "input_pin_voltage_rating"]
missing = ["supply_referenced_output_swing", "output_current_limit",
           "input_offset_voltage", "input_bias_current",
           "parameter_spread",
           "quiescent_supply_current"]

[models.pins]
"1" = "ref"
"2" = "vss"
"3" = "vcc"
"4" = "in_plus"
"5" = "in_minus"
"6" = "out"

# IN+ / IN- are rated against GND, not clamped to VS: TI INA186 SBOS318B.
[[models.envelope]]
kind = "supply_range"
pin = "in_plus"
min_v = -0.2
max_v = 40.0
abs_max_v = 42.0
basis = "TI INA186 SBOS318B, 6.3 Recommended Operating Conditions, VIN+ input pin voltage range GND - 0.2 V to 40 V; 6.1 Absolute Maximum Ratings, VIN+ with respect to GND 42 V"

[[models.envelope]]
