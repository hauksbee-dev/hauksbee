[models.pins]
# DS20001733L Table 3-1 Pin Function Table, the MCP6002 8-lead PDIP/SOIC/MSOP
# and 2x3 DFN columns, which are identical except that the DFN adds the exposed
# pad as pin 9.
"1" = "out_a"        # VOUTA
"2" = "in_minus_a"   # VINA-
"3" = "in_plus_a"    # VINA+
"4" = "vss"          # VSS
"5" = "in_plus_b"    # VINB+
"6" = "in_minus_b"   # VINB-
"7" = "out_b"        # VOUTB
"8" = "vcc"          # VDD
"9" = "vss"          # EP, the DFN's exposed thermal pad. Table 3-1 and Section
                     # 3.4 say it is internally connected to VSS and must be tied
                     # to the same potential, so it takes pad 4's `vss` role, not
                     # `gnd` (VSS is not ground on a split supply). A PDIP or
                     # SOIC part simply has no pad 9 and this line does nothing.

[models.ratings]
max_voltage_v = 7.0           # VDD - VSS, Absolute Maximum Ratings
max_pin_current_a = 0.002     # current at the analog input pins, +/-2 mA
                              # (the output and supply pins are rated +/-30 mA)
max_junction_temp_c = 150.0   # Maximum Junction Temperature, Absolute Maximum
                              # Ratings
theta_ja_c_per_w = 163.0      # Thermal Resistance, 8-Lead SOIC (150 mil),
                              # TEMPERATURE SPECIFICATIONS (PDIP 85, MSOP 206,
                              # 2x3 DFN 68)

