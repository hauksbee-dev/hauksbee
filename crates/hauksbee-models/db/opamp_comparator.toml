           "parameter_spread",
           "quiescent_supply_current"]

[models.pins]
# Table 5-2 "Pin Functions: INA2181 (Dual Channel)", SBOS793H; identical for
# the DGS VSSOP-10 and DSQ WSON-10 (Figures 5-3, 5-4). The WSON thermal pad
# may float or go to GND and is not mapped. Channel 1 = _a, channel 2 = _b.
"1"  = "out_a"       # OUT1
"2"  = "in_minus_a"  # IN-1
"3"  = "in_plus_a"   # IN+1
"4"  = "gnd"         # GND
"5"  = "ref_a"       # REF1, channel 1 reference, 0 to VS
"6"  = "ref_b"       # REF2, channel 2 reference, 0 to VS
"7"  = "in_plus_b"   # IN+2
"8"  = "in_minus_b"  # IN-2
"9"  = "out_b"       # OUT2
"10" = "vs"          # VS, power supply 2.7 V to 5.5 V

[models.ratings]
# Source: SBOS793H, Section 6.1 Absolute Maximum Ratings
max_voltage_v       = 6.0     # supply voltage VS abs max
max_junction_temp_c = 150.0   # Tj max (C)

# IN+ / IN- of both channels are rated against GND, not clamped to VS: SBOS793H.
[[models.envelope]]
kind = "supply_range"
pin = "in_plus_a"
min_v = -0.2
