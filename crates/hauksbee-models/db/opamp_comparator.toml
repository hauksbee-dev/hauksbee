[[models]]
id = "lm393"
kind = "comparator"
description = "LM393 dual comparator, open-collector output"

[models.match]
value_re = "(?i)^LM393"

[models.params]
# Source: Texas Instruments LM393 datasheet (SNOSC16D), typical
out_lo     = 0.0    # output pulled low (V), open-collector at 0
out_hi     = 5.0    # output high (V), pulled up externally (assumed 5V)
hysteresis = 0.005  # ~5 mV, datasheet input offset

[models.pins]
"1" = "out_a"
"2" = "in_minus_a"
"3" = "in_plus_a"
"4" = "vss"
"5" = "in_plus_b"
"6" = "in_minus_b"
"7" = "out_b"
"8" = "vcc"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "lmv7219"
kind = "comparator"
description = "LMV7219 7ns single-supply comparator, push-pull output, SOT-23-5"

[models.match]
value_re = "(?i)^LMV7219"

[models.params]
# Source: Texas Instruments LMV7219 datasheet (SNOS561D), Table 6.3 / 6.5
out_lo     = 0.05   # output low typ at 5V supply (V)
out_hi     = 4.95   # output high typ at 5V supply (V)
hysteresis = 0.003  # input offset voltage ±3 mV typ
tpd_s      = 7.0e-9 # propagation delay 7 ns typ @ 5V (Table 6.3)
# Supply draw: LMV7219 supply current 0.9 mA typical / 1.1 mA max at 5 V
# (SNOS561). Stamped as a constant quiescent pull on the VCC pin net so a
# metering shunt in series with the part's rail reads it.
supply_static_ua = 900.0

[models.pins]
"1" = "out"
"2" = "vss"
"3" = "in_plus"
"4" = "in_minus"
"5" = "vcc"

# ── INA180 / INA181 / INA186, TI current-sense amplifiers ───────────────────
#
# Source: Texas Instruments INA180 datasheet, SBOS774D (Rev D, 2019).
#         Texas Instruments INA181 datasheet, SBOS744C (Rev C, 2019).
#         Texas Instruments INA186 datasheet, SBOS791A (Rev A, 2020).
#
# All three are unidirectional current-sense amplifiers (bidirectional for
# INA186) in SOT-23-5. The INA18x family shares the same 5-pin SOT-23 package.
# Gain variants are selected by part suffix: A1=20V/V, A2=50V/V, A3=100V/V,
# A4=200V/V. This entry matches the whole INA180/181/186 family (gain-agnostic).
#
# Key absolute maximum ratings (INA180 datasheet, Table 7.1):
#   VS supply abs max = 26V
#   Common-mode input range: -0.2V to +26V
#   Tj max = 150C
#
# NOTE: The gain (20/50/100/200 V/V by part suffix) is not encoded here;
# the gain param is left as 0 (unknown) to prompt explicit modeling if needed.
# The entry is sufficient to resolve the part and check supply/Tj limits.

[[models]]
id = "ina180"
kind = "opamp"
description = "TI INA180 current-sense amplifier family, SOT-23-5 (gain by suffix A1/A2/A3/A4)"

[models.match]
# Matches INA180, INA180A1, INA180A2, INA180A3, INA180A4 and variant suffixes
value_re = "(?i)^INA180"

[models.params]
# Source: INA180 datasheet SBOS774D, Table 7.5 Electrical Characteristics.
# Gain is suffix-dependent (A1=20, A2=50, A3=100, A4=200 V/V); represented as
# a representative mid-range value here. For simulation, configure the exact gain
# via a more specific user-TOML entry if precision is required.
gain    = 100.0    # representative gain (V/V), A3 suffix; A1=20, A2=50, A4=200
rail_lo = 0.0      # output low limit (V), ground-referenced
rail_hi = 26.0     # output high limit (V), VS supply

[models.pins]
# SOT-23-5 pinout. Source: INA180 datasheet SBOS774D, Section 7.1 Pin Configuration.
"1" = "out"      # Output
"2" = "gnd"      # GND
"3" = "in_plus"  # IN+ (non-inverting, high side of shunt)
"4" = "in_minus" # IN- (inverting, low side of shunt)
"5" = "vs"       # VS (supply)

[models.ratings]
# Source: INA180 datasheet SBOS774D, Table 7.1 Absolute Maximum Ratings
max_voltage_v       = 26.0    # VS abs max (V), datasheet
max_junction_temp_c = 150.0   # Tj max (C), datasheet

