              "slew_rate_limit", "single_channel", "split_supply_envelope",
              "input_common_mode_range"]
missing = ["dominant_pole", "gain_bandwidth_product", "output_current_limit",
           "load_dependent_output_swing", "offset_null_trim",
           "input_offset_voltage", "input_bias_current", "input_offset_current",
           "parameter_spread",
           "quiescent_supply_current"]

[models.pins]
# SLOS094H Section 4, the D (SOIC), P (PDIP) and PS (SO) 8-pin packages: OFFSET
# N1 on 1, OFFSET N2 on 5 and NC on 8, none of which is claimed here.
"2" = "in_minus"   # IN-
"3" = "in_plus"    # IN+
"4" = "vss"        # VCC-
"6" = "out"        # OUT
"7" = "vcc"        # VCC+

[models.ratings]
max_voltage_v = 36.0          # VCC -18 V to 18 V, Section 5.1 Absolute Maximum
                              # Ratings, uA741C, stated here as the total
max_junction_temp_c = 150.0   # TJ, Section 5.1
theta_ja_c_per_w = 138.7      # RthJA, D (SOIC) 8-pin, Section 5.3 Thermal
                              # Information (P/PDIP is 87.4, PS/SO is 119.7)

# ─────────────────────────────────────────────────────────────────────────────
# NE5532: the audio dual, 8-pin, split supply.
#
# Sources. TWO documents, and which figure came from which matters, in the way
# the tsv914 entry above spells out:
#   TI "NE5532x, SA5532x Dual Low-Noise Operational Amplifiers" SLOS075K,
#     November 1979 - revised December 2025, is the primary source and is where
#     every figure below comes from EXCEPT the output swing.
#   ON Semiconductor "NE5532, SA5532, SE5532, NE5532A, SE5532A" NE5532/D Rev 2,
#     September 2013, supplies the OUTPUT SWING alone.
# The reason for the second document is printed in the first one's revision
# history: SLOS075K's change list records "Removed Maximum peak-to-peak output
# voltage swing, Small-signal differential-voltage amplification". The current
# TI sheet therefore has NO output-swing row at all, and `swing_lo`/`swing_hi`
# would have had to be left out -- which, for the opamp kind, means falling
# back to fixed rails that do not track the board's supply. Rather than invent
# a headroom or lose the supply-relative swing, the onsemi sheet's own DC
# ELECTRICAL CHARACTERISTICS "Output Swing" rows are used and cited as such.
#
# Figures used, VS = +/-15 V, TA = 25 C:
#   AVD   25 V/mV MIN, 100 V/mV TYP @ RL >= 2 kOhm, VO = +/-10 V   (TI 5.5)
#         15 V/mV MIN, 50 V/mV TYP  @ RL >= 600 Ohm                (TI 5.5)
#   VICR  +/-12 V MIN, +/-13 V TYP                                 (TI 5.5)
#   B1    12 MHz TYP unity-gain bandwidth                          (TI 5.5)
#   SR    5 V/us TYP at unity gain                                 (TI 5.6)
#   VOUT  +/-13 V MIN, +/-13.5 V TYP @ RL >= 2 kOhm                (onsemi)
#         +/-12 V MIN, +/-13 V TYP   @ RL >= 600 Ohm               (onsemi)
#   VCC+  5 to 15 V, VCC- -5 to -15 V recommended                  (TI 5.3)
#
# THE TWO SHEETS DISAGREE ON THE DYNAMICS and this card does not paper over it.
# TI prints a 12 MHz unity-gain bandwidth and a 5 V/us slew rate; onsemi prints
# a 10 MHz gain-bandwidth product (at CL = 100 pF, RL = 600 Ohm) and a 9 V/us
# slew rate. TI is the primary source here, so 12 MHz and 5 V/us are what this
# card carries; a board whose behaviour turns on the difference between 5 and
# 9 V/us is one this card cannot settle.
[[models]]
id = "ne5532"
kind = "opamp"
description = "NE5532/SA5532 dual low-noise audio op-amp, 8-pin, +/-5 to +/-15 V split supply"

[models.match]
# NE5532, NE5532A, SA5532, SA5532A and their package letters (NE5532P,
# NE5532D, NE5532DR, NE5532AP). The SE5532 is an onsemi grade that TI's
# SLOS075K does not cover, so it is left out rather than given TI's numbers.
value_re = "(?i)^(NE|SA)5532A?[A-Z0-9]*$"

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 5.0
max_v = 15.0
abs_max_v = 18.0
severity = "serious"
basis = "TI NE5532 SLOS075K Section 5.3 Recommended Operating Conditions, VCC+ supply voltage MIN 5 V MAX 15 V (Section 5.1 Absolute Maximum Ratings gives VCC+ 0 to +18 V)"

[[models.envelope]]
kind = "supply_range"
pin = "vss"
min_v = -18.0
max_v = -5.0
severity = "serious"
basis = "TI NE5532 SLOS075K Section 5.3 Recommended Operating Conditions, VCC- supply voltage MIN -5 V MAX -15 V; the -18 V floor here is Section 5.1's absolute maximum, so a rail between -15 and -18 V is reported by the max_v side of this row and a V- pin on ground is reported outright"

[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_a", "in_minus_a"]
headroom_v = 3.0
severity = "serious"
basis = "TI NE5532 SLOS075K Section 5.5 Electrical Characteristics, VICR common-mode input-voltage range MIN +/-12 V, TYP +/-13 V at VCC = +/-15 V, i.e. 3 V of guaranteed headroom below VCC+"

[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_b", "in_minus_b"]
headroom_v = 3.0
severity = "serious"
basis = "TI NE5532 SLOS075K Section 5.5 Electrical Characteristics, VICR common-mode input-voltage range MIN +/-12 V, TYP +/-13 V at VCC = +/-15 V, i.e. 3 V of guaranteed headroom below VCC+"

[models.params]
gain    = 100000.0  # AVD TYP 100 V/mV at RL >= 2 kOhm, VO = +/-10 V, 25 C
                    # (MIN 25 V/mV on the NE/SA grade). At RL >= 600 Ohm the
                    # typical is only 50 V/mV and this card does not model
                    # the load dependence of the gain either.
pole_hz = 120.0     # DERIVED: B1 12 MHz TYP unity-gain bandwidth / AVD 100000
                    # TYP. Not a printed row.
slew    = 5.0       # SR TYP 5 V/us at unity gain, SLOS075K Section 5.6
                    # Operating Characteristics. onsemi NE5532/D Rev 2 prints
                    # 9 V/us; TI is the primary source and 5 is the slower,
                    # more conservative of the two.
# HEADROOMS FROM THE SUPPLY PINS. NOT FROM THE TI SHEET: see the note above --
# SLOS075K deleted its output-swing row, and these come from onsemi.
swing_lo = 2.0      # onsemi NE5532/D Rev 2, DC ELECTRICAL CHARACTERISTICS,
swing_hi = 2.0      # Output Swing, RL >= 2.0 kOhm at VS = +/-15 V: MIN +/-13 V
                    # (TYP +/-13.5 V), i.e. 2.0 V of guaranteed headroom from
                    # each rail. At RL >= 600 Ohm the same table gives +/-12 V
                    # MIN, 3.0 V of headroom, which this card does not model.
rail_lo = -13.0     # fallback levels only (deck `.model opamp(...)`, no pins):
rail_hi = 13.0      # the same guaranteed swing stated as levels on +/-15 V
warning = "THE OUTPUT SWING ON THIS CARD IS NOT FROM THE TI DATASHEET. TI SLOS075K deleted its 'Maximum peak-to-peak output voltage swing' row (the deletion is listed in its own revision history), so the 2 V headroom here is ON Semiconductor NE5532/D Rev 2's Output Swing row at RL >= 2.0 kOhm; every other number on the card is TI's. The load dependence is not modelled: at RL >= 600 Ohm the guaranteed swing is +/-12 V rather than +/-13 V, and the open-loop gain halves too (50 V/mV typ rather than 100 V/mV), so a 600 Ohm audio load gets an answer computed with the 2 kOhm figures. This part is SPLIT-SUPPLY ONLY -- SLOS075K recommends VCC+ 5 to 15 V and VCC- -5 to -15 V per rail -- and the two supply_range envelopes fire when either supply pin leaves that range. The 120 Hz pole is DERIVED from the 12 MHz typical unity-gain bandwidth and the typical gain, not printed, and TI and onsemi disagree on the dynamics (12 MHz / 5 V/us against 10 MHz / 9 V/us); TI's, the slower pair, is what is carried. The 38 mA output short-circuit current is not modelled. Input offset voltage (0.5 mV typ, 4 mV max), input bias current (200 nA typ, 800 nA max -- this is a bipolar input and that current is not negligible into a high-impedance source) and input offset current are taken as zero, and the gain is the typ rather than the min. Both amplifiers share one supply leg and one pair of rails."

[models.coverage]
implements = ["finite_open_loop_gain", "supply_referenced_output_swing",
              "dominant_pole", "slew_rate_limit", "dual_channel",
              "split_supply_envelope", "input_common_mode_range"]
missing = ["output_current_limit", "load_dependent_output_swing",
           "load_dependent_open_loop_gain", "input_offset_voltage",
           "input_bias_current", "input_offset_current", "parameter_spread",
           "quiescent_supply_current"]

[models.pins]
# SLOS075K Section 4 Pin Functions, the D (SOIC), P (PDIP) and PS (SO) 8-pin
# packages: the standard dual-op-amp order.
"1" = "out_a"        # 1OUT
"2" = "in_minus_a"   # 1IN-
"3" = "in_plus_a"    # 1IN+
"4" = "vss"          # VCC-
"5" = "in_plus_b"    # 2IN+
"6" = "in_minus_b"   # 2IN-
"7" = "out_b"        # 2OUT
"8" = "vcc"          # VCC+

[models.ratings]
max_voltage_v = 36.0          # VCC+ 0 to +18 V and VCC- -18 to 0 V, Section 5.1
                              # Absolute Maximum Ratings, stated as the total
max_pin_current_a = 0.010     # input current, +/-10 mA, Section 5.1
max_junction_temp_c = 150.0   # TJ operating virtual junction temperature
theta_ja_c_per_w = 97.0       # RthJA, D (SOIC) 8-pin, Section 5.4 Thermal
                              # Information (P/PDIP is 85, PS/SO is 95)

# ─────────────────────────────────────────────────────────────────────────────
# OPA134 / OPA2134 / OPA4134: the audio FET-input family, three pinouts.
#
# Source: TI "OPA134, OPA2134, OPA4134 SoundPlus High Performance Audio
#   Operational Amplifiers" SBOS058B, December 1997 - revised November 2024.
#   Section 5.7 Electrical Characteristics, at TA = 25 C, VS = +/-15 V,
#   RL = 2 kOhm to midsupply, VCM = VOUT = midsupply.
#
# THIS FAMILY'S OUTPUT ROWS ARE ALREADY SUPPLY-RELATIVE, which is unusual among
# the parts in this file and makes `swing_lo`/`swing_hi` a direct transcription
# rather than a subtraction:
#   VO @ RL = 10 kOhm:  positive (V+) - 1.2 V MIN, negative (V-) + 0.5 V MAX
#   VO @ RL = 2 kOhm:   positive (V+) - 1.5 V MIN, negative (V-) + 1.2 V MAX
# The 10 kOhm pair is used. NOTE THE ASYMMETRY: 1.2 V of headroom at the top
# and 0.5 V at the bottom, which is easy to get backwards and is worth checking
# against the values below.
#
# Unlike the TL07x and the 741, this family IS specified on a single supply:
# Section 5.3 Recommended Operating Conditions gives 5 V to 36 V single-supply
# and +/-2.5 V to +/-18 V dual. So there is no supply envelope here; the
# `supply_range` kind is per pin against ground and the datasheet's row is a
# total, exactly as on the TL07x cards.
[[models]]
id = "opa2134"
kind = "opamp"
description = "TI OPA2134 dual FET-input audio op-amp, 8-pin, 5 to 36 V single or +/-2.5 to +/-18 V"

[models.match]
# The dual, D (SOIC) and P (PDIP), 8 pins, one map. The single (OPA134) and the
# quad (OPA4134) share the die and the electricals but not the pinout and have
# their own entries below.
value_re = "(?i)^OPA2134[A-Z0-9]*$"

[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_a", "in_minus_a"]
headroom_v = 3.5
severity = "serious"
basis = "TI SBOS058B Section 5.7 Electrical Characteristics, VCM common-mode voltage MAX (V+) - 3.5 V (MIN (V-) + 2.5 V, TYP +/-13 V) at VS = +/-15 V"

[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_b", "in_minus_b"]
headroom_v = 3.5
severity = "serious"
basis = "TI SBOS058B Section 5.7 Electrical Characteristics, VCM common-mode voltage MAX (V+) - 3.5 V (MIN (V-) + 2.5 V, TYP +/-13 V) at VS = +/-15 V"

[models.params]
gain    = 1000000.0 # AOL TYP 120 dB = 1e6 V/V at RL = 10 kOhm,
                    # -14.5 V <= VO <= 13.8 V (MIN 104 dB = 158489 V/V).
                    # The typ is taken, as on the tsv914 entry.
pole_hz = 8.0       # DERIVED: GBW 8 MHz TYP / AOL 1e6 TYP. Not a printed row.
slew    = 20.0      # SR TYP +/-20 V/us (footnoted "proposed by design" in
                    # SBOS058B, i.e. not production tested)
# HEADROOMS FROM THE SUPPLY PINS, transcribed from supply-relative rows.
# ASYMMETRIC: 1.2 V at the top, 0.5 V at the bottom.
swing_hi = 1.2      # VO positive, RL = 10 kOhm: MIN (V+) - 1.2 V
swing_lo = 0.5      # VO negative, RL = 10 kOhm: MAX (V-) + 0.5 V
rail_lo = -14.5     # fallback levels only (deck `.model opamp(...)`, no pins):
rail_hi = 13.8      # the same headrooms stated as levels on a +/-15 V supply
warning = "the output swing is bounded by the supply pins (V(V-)+0.5 V to V(V+)-1.2 V, the datasheet's own supply-relative VO rows at RL = 10 kOhm) and IS ASYMMETRIC -- more headroom at the top than at the bottom. The load dependence is not modelled: at RL = 2 kOhm the guaranteed rows are (V+) - 1.5 V and (V-) + 1.2 V, so a 2 kOhm load gets a swing this card overstates by 0.3 V at the top and 0.7 V at the bottom, and a 600 Ohm audio load is further out still. The 36 mA sourcing / 30 mA sinking short-circuit current is not modelled. The 8 Hz pole is DERIVED from the typical 8 MHz gain-bandwidth product and the typical 120 dB open-loop gain, not printed, and the 20 V/us slew rate is footnoted in SBOS058B as proposed by design rather than production tested. Input offset voltage (1 mV typ, 3.5 mV max), input bias current (5 pA typ, 100 pA max at 25 C but 5 nA over temperature) and input offset current are taken as zero, and the gain is the 120 dB typ rather than the 104 dB min. The input common-mode envelope checks only the UPPER end ((V+) - 3.5 V); the (V-) + 2.5 V floor is not checked. Both amplifiers share one supply leg and one pair of rails."

[models.coverage]
implements = ["finite_open_loop_gain", "supply_referenced_output_swing",
              "dominant_pole", "slew_rate_limit", "dual_channel",
              "split_or_single_supply", "input_common_mode_range"]
missing = ["negative_input_common_mode_limit", "output_current_limit",
           "load_dependent_output_swing", "input_offset_voltage",
           "input_bias_current", "input_offset_current", "parameter_spread",
           "supply_voltage_envelope",
           "quiescent_supply_current"]

[models.pins]
# SBOS058B Table 4-1 Pin Functions: OPA2134, the D (SOIC) and P (PDIP) 8-pin
# packages.
"1" = "out_a"        # OUT A
"2" = "in_minus_a"   # -IN A
"3" = "in_plus_a"    # +IN A
"4" = "vss"          # V-
"5" = "in_plus_b"    # +IN B
"6" = "in_minus_b"   # -IN B
"7" = "out_b"        # OUT B
"8" = "vcc"          # V+

[models.ratings]
max_voltage_v = 36.0          # VS (V+) - (V-) single supply, 36 V, Section 5.1
max_pin_current_a = 0.010     # input current, +/-10 mA, Section 5.1
max_junction_temp_c = 150.0   # TJ, Section 5.1
theta_ja_c_per_w = 160.0      # RthJA, D (SOIC) 8-pin, Section 5.5 Thermal
                              # Information - OPA2134 (P/PDIP is 71)

