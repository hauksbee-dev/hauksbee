# ── INA2181, TI dual current-sense amplifier ─────────────────────────────────
#
# Source: Texas Instruments INA2181 datasheet, SBOS831A (Rev A, 2021).
# DUAL channel version of the INA181 in an MSOP-10 / VSSOP-10 package.
# Two independent current-sense channels, same 26V supply abs max.
#
# NOTE: This is a DUAL device. Each channel is electrically equivalent to one
# INA181 channel. The pin map covers both channels A and B in the MSOP-10.

[[models]]
id = "ina2181"
kind = "opamp"
description = "TI INA2181 dual current-sense amplifier, MSOP-10 (two INA181 channels)"

[models.match]
value_re = "(?i)^INA2181"

[models.params]
# Source: INA2181 datasheet SBOS831A, Table 7.5.
# Gain is suffix-dependent (A1=20, A2=50, A3=100, A4=200 V/V), same family.
gain    = 100.0    # representative (A3 suffix); actual gain from part suffix
rail_lo = 0.0
rail_hi = 26.0

[models.pins]
# MSOP-10 / VSSOP-10 pinout. Source: INA2181 datasheet SBOS831A, Section 7.1.
# Channel A: IN+A=1, IN-A=2, OUTA=3; Channel B: IN+B=8, IN-B=9, OUTB=10.
"1"  = "in_plus_a"   # IN+A (channel A, non-inverting)
"2"  = "in_minus_a"  # IN-A (channel A, inverting)
"3"  = "out_a"       # OUTA (channel A output)
"4"  = "gnd"         # GND
"5"  = "gnd2"        # GND (second pad, tied to pin 4 in most packages)
"6"  = "vs"          # VS (supply, shared by both channels)
"7"  = "vs2"         # VS (second pad, tied to pin 6)
"8"  = "in_plus_b"   # IN+B (channel B, non-inverting)
"9"  = "in_minus_b"  # IN-B (channel B, inverting)
"10" = "out_b"       # OUTB (channel B output)

[models.ratings]
# Source: INA2181 datasheet SBOS831A, Table 7.1 Absolute Maximum Ratings
max_voltage_v       = 26.0    # VS abs max (V), datasheet
max_junction_temp_c = 150.0   # Tj max (C), datasheet

