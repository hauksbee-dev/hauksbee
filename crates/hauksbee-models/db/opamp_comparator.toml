# ─────────────────────────────────────────────────────────────────────────────
# LMV321 / LMV358 / LMV324: TI's low-voltage rail-to-rail-OUTPUT singles, duals
# and quads. SINGLE SUPPLY, 2.7 V to 5.5 V, and the negative supply pin is
# literally called GND by the datasheet.
#
# Source: TI "LMV358, LMV321, LMV324, LMV324S Low-Voltage Rail-to-Rail Output
#   Operational Amplifier" SLOS263Y, August 1999 - revised August 2023.
#   Section 6.8 Electrical Characteristics: VCC+ = 5 V is where every number
#   below comes from, plus Sections 6.1, 6.3 and the per-part thermal tables.
#
# RAIL-TO-RAIL OUTPUT, NOT RAIL-TO-RAIL INPUT. That distinction is the whole
# hazard of this family and is what the input_common_mode envelope encodes: the
# output gets within tens of millivolts of each rail, but VICR at VCC = 5 V is
# guaranteed only to 4.0 V (4.2 V typ), so the top volt of the input range is
# outside specification even though the output has no trouble there.
#
# Figures used at VCC+ = 5 V, TA = 25 C:
#   VO high  VCC - 100 mV MIN, VCC - 10 mV TYP @ RL = 10 kOhm to 2.5 V
#            VCC - 300 mV MIN, VCC -  40 mV TYP @ RL =  2 kOhm to 2.5 V
#   VO low   65 mV TYP, 180 mV MAX @ RL = 10 kOhm
#           120 mV TYP, 300 mV MAX @ RL =  2 kOhm
#   AVD      15 V/mV MIN, 100 V/mV TYP @ RL = 2 kOhm
#   VICR     0 V to 4.0 V MIN (-0.2 V to 4.2 V TYP), CMRR >= 50 dB
#   B1       1 MHz TYP unity-gain bandwidth @ CL = 200 pF
#   SR       1 V/us TYP
#   VCC      2.7 V to 5.5 V recommended; 5.5 V absolute maximum
#
# THE SWING FIGURES MIX MIN AND MAX COLUMNS ON PURPOSE, and in both cases the
# GUARANTEED direction: the high-side row is a MIN output level (so the largest
# guaranteed headroom, 100 mV) and the low-side row is a MAX output level (so
# again the largest guaranteed headroom, 180 mV). They are asymmetric -- 100 mV
# at the top, 180 mV at the bottom -- which is easy to transpose.
[[models]]
id = "lmv358"
kind = "opamp"
description = "TI LMV358 dual rail-to-rail-output op-amp, 8-pin, 2.7 to 5.5 V single supply"

[models.match]
# The dual: D (SOIC), DDU/DGK (VSSOP) and PW (TSSOP), all 8-pin, one map.
# Board values seen: LMV358M, LMV358IDGKR, LMV358IDR, LMV358QDR.
value_re = "(?i)^LMV358[A-Z0-9]*$"

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.7
max_v = 5.5
abs_max_v = 5.5
severity = "serious"
basis = "TI SLOS263Y Section 6.3 Recommended Operating Conditions, VCC supply voltage (single-supply operation) MIN 2.7 V MAX 5.5 V; Section 6.1 Absolute Maximum Ratings gives the same 5.5 V, so exceeding the recommended range is already at the damage limit"

[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_a", "in_minus_a"]
headroom_v = 1.0
severity = "serious"
basis = "TI SLOS263Y Section 6.8 Electrical Characteristics VCC+ = 5 V, VICR common-mode input voltage range MIN 0 V to 4.0 V at CMRR >= 50 dB and 25 C (TYP -0.2 V to 4.2 V), i.e. 1.0 V of guaranteed headroom below VCC+"

[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_b", "in_minus_b"]
headroom_v = 1.0
severity = "serious"
basis = "TI SLOS263Y Section 6.8 Electrical Characteristics VCC+ = 5 V, VICR common-mode input voltage range MIN 0 V to 4.0 V at CMRR >= 50 dB and 25 C (TYP -0.2 V to 4.2 V), i.e. 1.0 V of guaranteed headroom below VCC+"

[models.params]
gain    = 100000.0  # AVD large-signal differential voltage gain TYP 100 V/mV
                    # at RL = 2 kOhm, 25 C (MIN 15 V/mV, 10 V/mV over -40..125)
pole_hz = 10.0      # DERIVED: B1 1 MHz TYP unity-gain bandwidth (CL = 200 pF)
                    # / AVD 100000 TYP. Not a printed row.
slew    = 1.0       # SR TYP 1 V/us at 25 C. No MIN or MAX is printed.
# HEADROOMS FROM THE SUPPLY PINS. ASYMMETRIC, and both are the guaranteed
# column: 100 mV at the top, 180 mV at the bottom.
swing_hi = 0.100    # VO high level, RL = 10 kOhm to 2.5 V, 25 C: MIN VCC - 100
                    # mV (TYP VCC - 10 mV). Over -40 to 125 C the guaranteed
                    # figure is VCC - 200 mV.
swing_lo = 0.180    # VO low level, RL = 10 kOhm, 25 C: MAX 180 mV (TYP 65 mV).
                    # Over -40 to 125 C the guaranteed figure is 280 mV.
rail_lo = 0.180     # fallback levels only (deck `.model opamp(...)`, no pins):
rail_hi = 4.900     # the same headrooms stated as levels on a 5 V rail
warning = "this part is RAIL-TO-RAIL OUTPUT but NOT rail-to-rail input, and that asymmetry is the trap: the output reaches within 100 mV of VCC and 180 mV of GND at RL = 10 kOhm, but the guaranteed common-mode input range at VCC = 5 V stops at 4.0 V, so the top volt of the input range is outside specification even though the output swings there happily. The input_common_mode envelopes above catch a channel whose BOTH inputs sit in that top volt; a single input there is not flagged, and the 0 V lower end is not checked. The output swing is bounded by the supply pins but the LOAD DEPENDENCE IS NOT MODELLED: at RL = 2 kOhm the guaranteed headrooms are 300 mV and 300 mV rather than 100 mV and 180 mV, and over -40 to 125 C they are 200 mV and 400 mV, so a heavier load or a hot board gets a swing this card overstates. The 40 mA sourcing / sinking short-circuit current is not modelled. The 10 Hz pole is DERIVED from the typical 1 MHz unity-gain bandwidth (itself specified at CL = 200 pF) and the typical open-loop gain, not printed. Input offset voltage (1.7 mV typ, 7 mV max), input bias current (15 nA typ, 250 nA max) and input offset current are taken as zero, and the gain is the 100 V/mV typ rather than the 15 V/mV min. The datasheet calls the negative supply pin GND and specifies the part for single-supply operation only; it is mapped to the `vss` role here so the swing tracks it, but nothing checks that it is actually at ground. Both amplifiers share one supply leg and one pair of rails."

[models.coverage]
implements = ["finite_open_loop_gain", "supply_referenced_output_swing",
              "rail_to_rail_output", "dominant_pole", "slew_rate_limit",
              "dual_channel", "supply_voltage_envelope",
              "input_common_mode_range"]
