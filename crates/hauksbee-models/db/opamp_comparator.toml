# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "lm324"
kind = "opamp"
description = "LM324 quad op-amp, 3 V to 30 V single supply, 14-pin"

[models.match]
# The quad. LM358 is the dual and has its own entry with its own pin map; the
# LM2902 is the automotive grade of this part on a 26 V supply, so it is left
# out rather than given these ratings.
value_re = "(?i)^LM[123]24[A-Z]*$"

[models.params]
# Source: Texas Instruments LM124/LM224/LM324/LM2902 datasheet SLOS066AE,
# August 1975, revised September 2025.
gain    = 100000.0  # AOL typ 100 V/mV, Table 6.5 (the LM324B grade's column;
                    # the plain part shares the design and the typical)
# The swing is a HEADROOM FROM THE SUPPLY PINS (see the lm358 entry, same
# output stage and the same printed rows): VOH sits 1.5 V below V+ at
# RL >= 2 kOhm and VOL 20 mV above V-. SLOS066AE prints the identical
# "voltage output swing from rail" rows as SLOS068AB does for the dual.
swing_hi = 1.5      # positive rail, VS = 5 V, RL >= 2 kOhm: MAX 1.5 V
swing_lo = 0.020    # negative rail, VS = 5 V, RL <= 10 kOhm: MAX 20 mV
# No rail_lo/rail_hi: as on the lm358 entry, the swing is what binds, and the
# 0 V / 30 V they held were supply levels, not output limits.
warning = "the output swing is bounded by the supply pins (V(V-)+20 mV to V(V+)-1.5 V, the datasheet MAX headrooms at RL >= 2 kOhm), but nothing else about the output stage is: the output current limit is not modelled, so a load stiffer than 2 kOhm gets a swing the part cannot actually hold. The input common-mode range (0 V to V+ - 1.5 V) is not checked, so an input driven above it is answered as if the part still amplified it. Input offset voltage (7 mV max), input bias current (250 nA max) and input offset current (50 nA max) are taken as zero, and the gain is the 100 V/mV typ rather than the 25 V/mV min, so a computed output is the NOMINAL part at 25 C, not a bound over the datasheet's spread or over temperature. Gain-bandwidth and slew rate are not on this card, so a board-bound LM324 answers DC and settles instantly. All four amplifiers share one supply leg and one pair of rails; nothing here distinguishes them beyond their nets."

[models.coverage]
implements = ["finite_open_loop_gain", "supply_referenced_output_swing",
              "quad_channel", "split_or_single_supply"]
missing = ["output_current_limit", "input_common_mode_range", "input_offset_voltage",
           "input_bias_current", "input_offset_current", "parameter_spread",
           "quiescent_supply_current"]

[models.pins]
# Table 5-1 "Pin Functions", the 14-pin D/DB/J/N/NS/PW/W packages. Note the
# supplies are NOT at the corners the way a 741 or an LM358 puts them: VCC+ is
# pin 4 and VCC- is pin 11, in the middle of each side.
"1"  = "out_a"
"2"  = "in_minus_a"
"3"  = "in_plus_a"
"4"  = "vcc"
"5"  = "in_plus_b"
"6"  = "in_minus_b"
"7"  = "out_b"
"8"  = "out_c"
"9"  = "in_minus_c"
"10" = "in_plus_c"
"11" = "vss"
"12" = "in_plus_d"
"13" = "in_minus_d"
"14" = "out_d"

[models.ratings]
max_voltage_v = 32.0            # VCC, Absolute Maximum Ratings, LM324xx
max_junction_temp_c = 150.0     # TJ, Absolute Maximum Ratings
theta_ja_c_per_w = 83.5         # RthJA, 14-pin N (PDIP), Thermal Information

# ─────────────────────────────────────────────────────────────────────────────
# TLV3691: TI 150 nA nanopower comparator, X2SON-6 (DPF) / SOT-563.
#
# Source: TI "TLV3691 0.9-V to 6.5-V, Nanopower Comparator", SBOS694A, December
#   2013 - revised November 2015, Section 6 Pin Configuration and Functions,
#   Section 6.5 Electrical Characteristics and Section 6.1 Absolute Maximum
#   Ratings.
#
# Push-pull output (the datasheet says so in the feature list and in the OUT pin
# description), so both `out_lo` and `out_hi` are real driven levels here, unlike
# the open-drain supervisors in db/power_ics.toml.
#
# THE RAILS BELOW ARE 3.3 V AND THE DROPS ARE THE 0.9 V ROWS. That combination
# needs justifying, because it mixes two operating points on purpose. The
# datasheet tabulates the output swing at exactly two supplies, VS = 6.5 V and
# VS = 0.9 V, and at neither 3.3 V nor anything near it:
#     IO <= 100 uA:  6 mV typ / 10 mV max from either rail at VS = 6.5 V
#                   70 mV typ (upper) and 35 mV typ (lower) at VS = 0.9 V
#     IO = 2.5 mA:  155 mV typ / 165 mV max from either rail at VS = 6.5 V
# A 3.3 V board sits between them, and interpolating a drop across a 7x supply
# range would be invention. The 0.9 V rows are the LARGER drops, so using them at
# 3.3 V understates the swing rather than overstating it: the comparator's output
# is modelled slightly weaker than the real part, which is the direction an
# honest model errs in. So `out_hi` = 3.3 - 0.070 = 3.230 and `out_lo` = 0.035:
# the two drops differ by a factor of two and go on their OWN rails, which is easy
# to get backwards and worth checking against the values below. Both are the
# IO <= 100 uA rows; at 2.5 mA of load the real drop is 155 mV and this model is
# optimistic by ~120 mV.
#
# `hysteresis` IS THE DATASHEET'S OWN VHYS ROW, 17 mV typ, and not the input
# offset voltage. Those are different quantities and the sheet lists both (VOS is
# +/-3 mV typ, +/-15 mV max); several entries elsewhere in this file conflate them
# and this one does not.
#
# `tpd_s` IS THE SLOWEST TABULATED FIGURE. Section 6.6 Switching Characteristics
# of SBOS694A (December 2013, revised November 2015) tabulates tPHL and tPLH as TWO
# SEPARATE rows over four conditions each, eight typicals in all:
#                          overdrive 50 mV      overdrive 100 mV
#   tPHL  VS = 6.5 V              32 us                 24 us
#   tPHL  VS = 0.9 V              45 us                 35 us
#   tPLH  VS = 6.5 V              32 us                 24 us
#   tPLH  VS = 0.9 V              40 us                 28 us
# The slowest is tPHL at VS = 0.9 V with 50 mV of overdrive, 45 us, and that is what
# `tpd_s` carries. Two earlier versions of this comment were wrong about this table:
# one claimed the sheet publishes only curves and carried no tpd at all, and its
# replacement listed four figures rather than eight and read the 0.9 V / 50 mV
# corner as a single 40 us, which is tPLH alone. The schema has one delay param, so
# one figure has to stand for both edges; the pessimistic edge is the one to carry,
# and it is named here so nobody has to guess which direction it describes.
#
# 0.9 V is also the corner the output levels above are taken from, so the entry is
# internally consistent: a board running this comparator at 3.3 V with more than
# 50 mV of overdrive gets a real part substantially faster than the model.
#
# DELIBERATELY NOT MODELLED: the 100 nA-class input bias current, the rail-to-rail
# input common-mode range (V- - 0.1 to V+ + 0.1), and the short-circuit currents.
[[models]]
id = "tlv3691"
kind = "comparator"
description = "TI TLV3691 nanopower comparator, push-pull, X2SON-6, 3.3V rails"

[models.match]
# The DPF (X2SON-6) package ONLY, which is the map below and the code the margay
# datalogger writes. "IDPF" is the industrial-grade spelling of it.
#
# THE DCK PACKAGE IS EXCLUDED because it is a FIVE-pin SC70 with VCC on pin 5,
# where this map calls pin 5 a no-connect and puts VCC on a pin 6 that a DCK part
# does not have. A DCK bound here would have its supply pad unmodelled.
value_re = "(?i)^TLV3691I?DPFR?$"

[models.params]
out_lo     = 0.035   # the 0.9 V-row LOWER-rail drop at IO <= 100 uA
out_hi     = 3.230   # 3.3 V rail minus the 0.9 V-row UPPER drop, which is 70 mV
                     # and not the 35 mV of the lower rail: the sheet's two drops
                     # differ by a factor of two and are not interchangeable
hysteresis = 0.017   # VHYS typ, the datasheet's own row (NOT the offset voltage)
tpd_s      = 4.5e-5  # tPHL (the SLOWER edge) at VS = 0.9 V, overdrive 50 mV: the
                     # slowest of the eight typicals. See the table in the note
                     # above; tPLH at the same corner is 40 us.
supply_static_ua = 0.075   # IQ typ 75 nA at 25 C (150 nA max at 25 C, 200 nA
                           # over -40 to 125 C)
warning = "the output HIGH level on this card is fixed at 3.230 V, the 3.3 V rail this entry was written against minus the datasheet's 70 mV upper drop, and does NOT follow the voltage on the board's rail: the binder hard-codes it rather than reading the VCC pad, so the same part on a 1.8 V or 5 V supply is still answered as swinging to 3.230 V. The low level (35 mV) is fixed the same way. Treat any result that turns on the output level of a TLV3691 on a rail other than 3.3 V as unanswered."

[models.pins]
# Section 6, DPF (X2SON-6). Cross-checked against the margay datalogger, where
# pad 4 drives the enable of the board's power mux and pad 6 sits on the 3.3 V
# rail this entry's output levels assume, with pad 5 unconnected as the datasheet
# expects.
"1" = "in_plus"
"2" = "vss"
"3" = "in_minus"
"4" = "out"
"5" = "nc"      # no internal connection
"6" = "vcc"

[models.ratings]
# Section 6.1 Absolute Maximum Ratings. NOTE WHAT READS THESE: the scheduler builds
# supply-rail watches only for `mcu` bindings, and whole-device stress meta only for
# the kinds `binder.rs`'s monitor list names, which does not include `comparator`.
# So these are recorded for the report and for whatever consumes them later, and no
# check compares them against a node today.
max_voltage_v = 7.0        # supply voltage, 7 V
max_pin_current_a = 0.01   # signal input terminal current, +/-10 mA

# ─────────────────────────────────────────────────────────────────────────────
# TSV914: STMicroelectronics quad rail-to-rail input/output op-amp, SOIC-14.
#
# Source: ST "TSV911/TSV912/TSV914 Rail-to-rail input/output 8 MHz operational
#   amplifiers". TWO documents, and which figure came from which matters:
#     DS4899 Rev 13, May 2025, the current datasheet, is what this entry was first
#     written from. IT COULD NOT BE RE-OPENED to check the figures below: st.com
#     refuses every request from this network (HTTP/2 INTERNAL_ERROR on the
#     resource path, and a plain hang over HTTP/1.1).
#     The TSV911-TSV912-TSV914 PRELIMINARY datasheet, Rev 2, June 2007, WAS opened,
#     via the RS Components mirror at docs.rs-online.com/9c88/0900766b80a345ed.pdf.
#     Its Table 4 is the VCC = +3.3 V table and Table 3 the VCC = +2.5 V one.
#   Any figure below that is marked "Rev 2 Table 4" was read there. The rest carry
#   the Rev 13 attribution they were written with and are UNVERIFIED against a
#   document this lane could open; a 2007 preliminary sheet is not authority for what
#   the 2025 revision says, so nothing is silently restated from it.
#
# Datasheet figures used (VCC+ = 3.3 V, TA = 25 C unless noted):
#   VCC       = 2.5 to 5.5 V   (2.3 to 5.5 V over 0 to 125 C)
#   Avd       = 80 dB min, 89 dB typ @ RL = 10 kOhm, Vout = 0.5 to 2.8 V, 25 C,
#               VCC = 3.3 V. DS4899 Rev 13 Table 4, p.7, read directly (75 dB min
#               over the full temperature range). The preliminary Rev 2 Table 4
#               printed 90 dB here; Rev 13 prints 89 dB at both 2.5 V (Table 3)
#               and 3.3 V, so the current sheet is the authority.
#   Vhigh/low = 15 mV typ, 40 mV max from either rail @ RL = 10 kOhm
#                            (45 mV typ, 150 mV max @ RL = 600 Ohm)
#   ICC       = 0.8 mA typ, 1.1 mA max PER AMPLIFIER @ VCC = 3.3 V
#   GBP       = 8 MHz typ
#   Vio       = 0.1 mV typ, 4.5 mV max at 25 C (standard grade)
#
# `gain` IS THE TYPICAL, NOT THE MINIMUM, and the difference is a factor of three:
# 89 dB typ is 28184 V/V, while the guaranteed 80 dB min is 10000 V/V. The typical
# is used because an op-amp's open-loop gain enters a closed-loop result only as a
# small error term and the typical is the honest central estimate; a design whose
# behaviour turns on the difference is one this ideal-gain model cannot judge either
# way.
#
# THE RAILS ARE STATED AT 3.3 V and are the RL = 10 kOhm headroom figures. The
# board that motivated this entry runs the part from a 3.3 V LDO. On a 5 V board
# the output swing modelled here is 1.7 V short at the top; on one driving 600 Ohm
# the real headroom is three times what this claims.
#
# THE SUPPLY FIGURE IS PER AMPLIFIER and this is a QUAD, so the package draws four
# times ICC. It is recorded in prose only, because the opamp kind reads no supply
# field at all: there is nothing here to be off by a factor of four.
#
# ALL FOUR AMPLIFIERS ARE STAMPED, and getting that required naming channel A's
# roles with the `_a` suffix rather than bare. `bind_opamp` looks for
# `out_a`/`in_plus_a`/`in_minus_a` through `..._d`, stamps one device per COMPLETE
# channel, and returns as soon as it has stamped any; only if it finds none does it
# fall back to the bare `out`/`in_plus`/`in_minus` single-channel names. So a quad
# whose channel A used the bare names and B/C/D the suffixed ones would stamp
# exactly the three suffixed channels and silently drop A, which is the reverse of
# what such a map looks like it says. The MWGEN-G1 uses all four (a duty-cycle
# error detector), so the difference is the whole circuit rather than a corner.
#
# DELIBERATELY NOT MODELLED: the four amplifiers share one supply leg and one set
# of rails, so nothing here distinguishes them electrically beyond their nets.
[[models]]
id = "tsv914"
kind = "opamp"
description = "ST TSV914 quad rail-to-rail op-amp, SOIC-14, 3.3V rails, all four channels"

[models.match]
# The TSV911 (single, SOT-23-5) and TSV912 (dual, SOIC-8) share the die and the
# electricals but NOT the pinout, so only the quad binds here. "TSV914IDT" and
# "TSV914IYDT" are the SOIC-14 ordering codes and "TSV914AIDT" the A grade (tighter
# offset, which this entry does not distinguish because it carries no offset field).
#
# BOTH PACKAGES SHARE THIS PIN ORDER, which is why the bare part number is safe
# here where it is not on the other new entries in this batch. DS4899 Rev 13's
# ordering table lists SOIC-14 (the "DT" codes) and TSSOP14 (the "PT" codes), and
# the pin allocation figure is one figure for both; they differ in thermal
# resistance (100 against 103 C/W), which this entry does not carry.
value_re = "(?i)^TSV914A?I?Y?[DP]T$|^TSV914$"

[models.params]
gain    = 28184.0   # Avd 89 dB typ, RL = 10 kOhm, Vout = 0.5 to 2.8 V, 25 C,
                    # VCC = 3.3 V (80 dB min = 1e4): DS4899 Rev 13 Table 4, p.7.
                    # The 90 dB (31623) was the preliminary Rev 2's figure; Rev 13
                    # prints 89 dB in both the 2.5 V and 3.3 V tables.
# HEADROOMS, not levels: the old rail_hi = 3.285 baked a 3.3 V board into the
# card, so the same part on a 5 V rail clipped 1.7 V early and on a sagging
# rail never clipped at all. These track the V+/V- pads instead.
swing_lo = 0.015    # Vlow typ, 15 mV from the negative rail @ RL = 10 kOhm
swing_hi = 0.015    # Vhigh, the same 15 mV of headroom below V+
rail_lo = 0.015     # fallback levels only (deck `.model opamp(...)`, no pins)
rail_hi = 3.285     # 3.3 V rail minus the same 15 mV of headroom
warning = "rail-to-rail output within 15 mV typ of each supply pin at RL = 10 kOhm; the output current limit is not modelled, so a heavier load gets a swing the part cannot hold. Input offset voltage (0.2 mV typ, 3 mV max on the plain grade), input bias current and input offset current are taken as zero and the input common-mode range is not checked. The 8 MHz gain-bandwidth and 4.5 V/us slew rate are not on this card, so a board-bound TSV914 answers DC and settles instantly, and the gain is the 89 dB typ rather than the 80 dB min. All four amplifiers share one supply leg and one pair of rails."

[models.coverage]
implements = ["finite_open_loop_gain", "supply_referenced_output_swing",
              "rail_to_rail_output", "quad_channel"]
missing = ["output_current_limit", "input_common_mode_range", "input_offset_voltage",
           "input_bias_current", "input_offset_current", "parameter_spread",
           "quiescent_supply_current"]
# NO supply leg: `hauksbee models lint` reports `supply_static_ua` as unread for
# the opamp kind, so the datasheet's 0.8 mA typ / 1.1 mA max per amplifier at
# VCC = 3.3 V lives in the note above rather than as a field nothing consumes.

[models.pins]
# DS4899 Rev 13, SOIC-14 pin connections. Corroborated by the MWGEN-G1's own pin
# functions, which name pad 4 V+ and pad 11 V- and mark pads 2/6/9/13 inverting and
# 3/5/10/12 non-inverting: the standard quad-op-amp order, and pad for pad this map.
#
# Every channel is suffixed, INCLUDING A: see the note above for why the bare
# names would have dropped it.
"1"  = "out_a"        # OUT1
"2"  = "in_minus_a"   # IN1-
"3"  = "in_plus_a"    # IN1+
"4"  = "vcc"          # VCC+
"5"  = "in_plus_b"    # IN2+
"6"  = "in_minus_b"   # IN2-
"7"  = "out_b"        # OUT2
"8"  = "out_c"        # OUT3
"9"  = "in_minus_c"   # IN3-
"10" = "in_plus_c"    # IN3+
"11" = "vss"          # VCC-
"12" = "in_plus_d"    # IN4+
"13" = "in_minus_d"   # IN4-
"14" = "out_d"        # OUT4

[models.ratings]
max_voltage_v = 6.0   # supply abs max (2.5 to 5.5 V operating)

# ─────────────────────────────────────────────────────────────────────────────
# TL071 / TL072 / TL074 and TL081 / TL082 / TL084: the classic (ORIGINAL-DIE)
# JFET-input op-amps, three pinouts, one set of electricals.
#
# Sources, read end to end for this batch:
#   TI "TL071, TL071A, TL071B, TL071H, TL072..., TL074..." SLOS080W, September
#     1978 - revised July 2025.
#   TI "TL081, TL081A, TL081B, TL081H, TL082..., TL084..." SLOS081O, February
#     1977 - revised September 2025.
# The two documents print the SAME DC and AC tables for the original die (the
# TL08x sheet's Section 5.8 / 5.9 differ from the TL07x sheet's only in the
# noise rows, which this card does not carry), so one set of numbers with both
# citations is not a shortcut: it is what the two sheets say.
#
# THESE CARDS ARE THE ORIGINAL DIE ONLY. SLOS080W Section 5 opens with a note
# that the H-suffix parts are a NEW die on a modern process, described by
# Sections 5.7/5.10, while Sections 5.8/5.9/5.11 describe the old one. The two
# are different amplifiers: AOL 125 dB typ against 200 V/mV (106 dB), a
# common-mode range that reaches VCC+ by specification, VOS 1 mV against 3 mV,
# and a "No Phase Reversal" characterisation figure printed ONLY for the H die.
# So `value_re` excludes the H suffix on every card below; an H part is left
# unmatched (open, and reported as such) rather than answered with old-die
# numbers. The M suffix is excluded for two reasons at once: its recommended
# supply is 10 V to 30 V rather than 4.5 V to 40 V, its GBW is 3 MHz rather
# than 5.25 MHz, and it is the only grade offered in the 10-pin CFP (U) and
# 20-pin LCCC (FK) packages, whose pin maps are NOT the maps below.
#
# Figures used, all from SLOS080W Section 5.8 (DC) and 5.9 (AC) / SLOS081O
# Sections 5.8 and 5.9, at VS = (VCC+) - (VCC-) = +/-15 V and TA = 25 C:
#   AOL   25 V/mV MIN, 200 V/mV TYP          (TL07xC/TL08xC column)
#   GBW   5.25 MHz TYP                       (all devices except NS/PS/M)
#   SR    8 V/us MIN, 20 V/us TYP            (VI = 10 V, CL = 100 pF, RL = 2 k)
#   VOM   +/-12 V MIN, +/-13.5 V TYP @ RL = 10 kOhm
#         +/-10 V MIN @ RL >= 2 kOhm over the full temperature range
#   VCM   +/-11 V MIN, -12 to +15 V TYP
#   VS    4.5 V to 40 V recommended; 0 to 42 V absolute maximum
#   VI    (VCC-) + 4 V to (VCC+) + 0.1 V recommended
#
# `gain` IS THE TYPICAL (200 V/mV = 200000), not the 25 V/mV guaranteed minimum,
# for the reason the tsv914 entry above gives: open-loop gain enters a
# closed-loop answer only as a small error term and the typical is the honest
# central estimate. `swing_*` IS THE OPPOSITE CHOICE, the GUARANTEED MINIMUM
# swing rather than the typical, because a swing limit is exactly the thing a
# board can be wrong about: VOM MIN is +/-12 V at RL = 10 kOhm on a +/-15 V
# supply, which is 3.0 V of headroom from each rail. The typical is 1.5 V of
# headroom (+/-13.5 V) and a real part will usually do better than this card
# claims, which is the direction to err in. At RL >= 2 kOhm over temperature
# the guaranteed swing is only +/-10 V, i.e. 5.0 V of headroom, and this card
# does NOT model the load dependence.
#
# `pole_hz` IS DERIVED, NOT PRINTED: 5.25 MHz / 200000 = 26.25 Hz is the
# dominant pole implied by the typical gain-bandwidth product and the typical
# open-loop gain. Both inputs to that division are typicals from the tables
# above, so the pole is a typical too, and it is a SINGLE-POLE fit to a part
# whose real open-loop response is only approximately one pole.
#
# THE PHASE-REVERSAL / SINGLE-5-V HAZARD. The original die's recommended input
# voltage range starts at (VCC-) + 4 V (SLOS080W Section 5.3, "VI Input
# voltage", all devices except NS/PS/M), and its guaranteed common-mode range
# is only +/-11 V on a +/-15 V supply. Driving an input below that floor takes
# the JFET front end out of its specified region; the classic reported symptom
# is OUTPUT PHASE REVERSAL, the output slamming to the WRONG rail rather than
# simply clipping, and the only place either datasheet characterises the
# absence of that behaviour is Figure 5-26 "No Phase Reversal" in Section 5.10,
# which covers the H die alone. Nothing in Sections 5.8/5.9/5.11 promises it
# for the part this card models. Combine that floor with an output that cannot
# get within 3 V of either rail and a TL072 on a single 5 V supply has no
# usable input window and no usable output window: it effectively does not
# work, however plausible the schematic looks. NEITHER of those two facts is
# checked by the envelope below, which can only express the UPPER common-mode
# limit; see the warning and coverage text on each card.

[[models]]
id = "tl07x_tl08x_dual"
kind = "opamp"
description = "TL072/TL082 dual JFET-input op-amp (original die), 8-pin, split or single supply"

[models.match]
# TL072/TL082 with the A and B offset grades and the C (0-70 C) and I
# (-40-85 C) temperature grades, plus any package letters after them: CP, CD,
# CDR, IDR, CDT, IDDFR, CN, IN. Figure 4-5 of SLOS080W puts the D, DDF, JG, P,
# PS and PW packages on ONE pin map, which is the map below, so the package
# letters need no gating here.
#
# H IS EXCLUDED (different die, see the note above) and so is M (different
# recommended supply, different GBW, and the U/FK packages it alone comes in
# have different pin maps). Both fall out of requiring the optional grade
# letter to be A or B and the optional temperature letter to be C or I.
# A trailing " OP AMP" is a schematic library's description glued onto the
# value (eurorack-pmod writes "TL072 OP AMP"); it names the same part.
value_re = "(?i)^TL0[78]2[AB]?([CI][A-Z0-9]*)?( OP ?AMP)?$"

# VICR, one entry per channel, in the shape the lm358 entry above documents:
# it fires only when BOTH inputs of a channel sit above V(VCC+) - 4 V.
#
# THIS UNDER-REPORTS IN TWO DIRECTIONS AT ONCE and that is deliberate. The
# datasheet's guaranteed common-mode window is +/-11 V on a +/-15 V supply, so
# 4 V of headroom below VCC+ is the top of it; but the TYPICAL column reaches
# +15 V, i.e. VCC+ itself, so an input inside the top 4 V is outside the
# GUARANTEED window rather than certainly broken. The far more dangerous end,
# the (VCC-) + 4 V floor whose violation is the phase-reversal hazard, cannot
# be expressed by this envelope kind at all: `input_common_mode` is a
# supply-relative CEILING. A single-5-V board is caught here only because
# mid-supply-biased inputs (2.5 V on a 5 V rail) sit above VCC+ - 4 V = 1 V.
[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_a", "in_minus_a"]
headroom_v = 4.0
severity = "serious"
basis = "TI SLOS080W Section 5.8 / SLOS081O Section 5.8, VCM common-mode voltage, MIN +/-11 V at VS = +/-15 V and TA = 25 C, i.e. 4 V of guaranteed headroom below VCC+ (the TYP column reaches -12 to +15 V)"

[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_b", "in_minus_b"]
headroom_v = 4.0
severity = "serious"
basis = "TI SLOS080W Section 5.8 / SLOS081O Section 5.8, VCM common-mode voltage, MIN +/-11 V at VS = +/-15 V and TA = 25 C, i.e. 4 V of guaranteed headroom below VCC+ (the TYP column reaches -12 to +15 V)"

[models.params]
gain    = 200000.0  # AOL TYP 200 V/mV (MIN 25 V/mV on the C grade, 50 V/mV on
                    # A/B/I), VO = 0 V, VS = +/-15 V, TA = 25 C
pole_hz = 26.25     # DERIVED: GBW 5.25 MHz TYP / AOL 200000 TYP. Not a printed
                    # row; see the note above.
slew    = 20.0      # SR TYP 20 V/us (MIN 8 V/us), VI = 10 V, CL = 100 pF,
                    # RL = 2 kOhm, VS = +/-15 V. V/us is the unit the binder
                    # wants and the unit the datasheet prints.
# HEADROOMS FROM THE SUPPLY PINS, not fixed levels: on a +/-12 V board the
# output saturates at -9 V / +9 V, not at the +/-12 V the fallback names.
swing_lo = 3.0      # VOM MIN +/-12 V at RL = 10 kOhm, VS = +/-15 V: 3.0 V of
swing_hi = 3.0      # guaranteed headroom from each rail (TYP +/-13.5 V = 1.5 V)
rail_lo = -12.0     # fallback levels only (deck `.model opamp(...)`, no pins):
rail_hi = 12.0      # the same guaranteed VOM stated as levels on a +/-15 V rail
warning = "this is the ORIGINAL-DIE TL072/TL082, not the TL07xH/TL08xH, which is a different amplifier on a modern process and is deliberately left unmatched. THE PART DOES NOT WORK ON A SINGLE 5 V SUPPLY and nothing in this model stops it being simulated there: the datasheet's recommended input voltage range starts at (VCC-) + 4 V (SLOS080W/SLOS081O Section 5.3) and the guaranteed output swing stops 3 V short of each rail, so a 5 V rail leaves no usable input window and no usable output window. Driving an input below the (VCC-) + 4 V floor also takes the JFET front end into the region where these parts are known for OUTPUT PHASE REVERSAL -- the output slamming to the wrong rail instead of clipping -- and the only 'No Phase Reversal' characterisation either sheet prints is for the H die. That lower limit and the phase reversal are NOT modelled and NOT checked; the input_common_mode envelope on this card checks only the UPPER end (both inputs of a channel above VCC+ - 4 V), and even there the typical common-mode range reaches VCC+ itself, so a finding means 'outside the guaranteed window', not 'certainly broken'. The output swing is bounded by the supply pins (V(VCC-)+3 V to V(VCC+)-3 V, the guaranteed VOM at RL = 10 kOhm on a +/-15 V supply) but nothing else about the output stage is: the load dependence is not modelled, and at RL >= 2 kOhm over temperature the guaranteed swing is only +/-10 V, i.e. 5 V of headroom, which this card would call clean. Output short-circuit current is not modelled. Input offset voltage (3 mV typ, 10 mV max on the C grade), input bias current (65 pA typ, 200 pA max at 25 C but 7 nA over temperature) and input offset current are taken as zero, and the gain is the 200 V/mV typ rather than the 25 V/mV min, so a computed output is the NOMINAL part at 25 C, not a bound over the datasheet's spread. The 26.25 Hz pole is DERIVED from the typical 5.25 MHz GBW and the typical open-loop gain, not printed, and is a single-pole fit."

[models.coverage]
implements = ["finite_open_loop_gain", "supply_referenced_output_swing",
              "dominant_pole", "slew_rate_limit", "dual_channel",
              "split_or_single_supply"]
missing = ["output_phase_reversal", "negative_input_common_mode_limit",
           "output_current_limit", "load_dependent_output_swing",
           "input_offset_voltage", "input_bias_current", "input_offset_current",
           "parameter_spread", "supply_voltage_envelope",
           "quiescent_supply_current"]
# NO supply envelope: SLOS080W Section 5.3 bounds only the TOTAL supply
# (4.5 V to 40 V), and the `supply_range` envelope kind is PER PIN against
# ground. Restating a total as a per-pin limit would be a number the datasheet
# does not print, so the recommended supply range is recorded in prose here and
# nothing checks it. The 1.4 mA typ / 2.5 mA max quiescent current PER
# AMPLIFIER is likewise prose only: `supply_static_ua` is unread for the opamp
# kind.

[models.pins]
# SLOS080W Table 4-3 / SLOS081O Table 4-3, the 8-pin D, DDF, JG, P, PS and PW
# packages, which share one pin allocation figure.
"1" = "out_a"        # 1OUT
"2" = "in_minus_a"   # 1IN-
"3" = "in_plus_a"    # 1IN+
"4" = "vss"          # VCC-
"5" = "in_plus_b"    # 2IN+
"6" = "in_minus_b"   # 2IN-
"7" = "out_b"        # 2OUT
"8" = "vcc"          # VCC+

[models.ratings]
max_voltage_v = 42.0          # VS absolute maximum, 0 to 42 V, Section 5.1
                              # (all devices except NS/PS/M, which are 36 V and
                              # are not matched by this card)
max_pin_current_a = 0.010     # signal input pin current, +/-10 mA, Section 5.1
max_junction_temp_c = 150.0   # TJ, Section 5.1
theta_ja_c_per_w = 147.8      # RthJA, 8-pin D (SOIC), Section 5.5 Thermal
                              # Information for Dual Channel (P/PDIP is 85)

