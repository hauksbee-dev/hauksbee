# ─────────────────────────────────────────────────────────────────────────────
# LM741: the original general-purpose bipolar op-amp, 8-pin, SPLIT SUPPLY ONLY.
#
# Source: TI "LM741 Operational Amplifier" SNOSC25D, May 1998 - revised October
#   2015. All figures below are the LM741C column of Section 6.7 "Electrical
#   Characteristics, LM741C" (the commercial grade, which is what a board
#   marked LM741CN or LM741CP is), at VS = +/-15 V and TA = 25 C, plus Sections
#   6.1, 6.3 and 6.4.
#
# THE SUPPLY ENVELOPE IS THE POINT OF THIS CARD. Section 6.3 Recommended
# Operating Conditions gives the supply voltage PER RAIL and not as a total:
# MIN +/-10 V, NOM +/-15 V, MAX +/-18 V for the LM741C. That is a genuine
# per-pin range, so it goes in as two `supply_range` envelopes, and it catches
# the single-supply mistake head on: an LM741 with V- on ground has its V- pin
# at 0 V, outside -18 .. -10 V, and is reported rather than quietly answered.
# The part has no single-supply mode at all; the datasheet never specifies one.
#
# NO `pole_hz` ON THIS CARD. SNOSC25D prints no gain-bandwidth product and no
# unity-gain bandwidth row: the only dynamic figures are the 0.3 us rise time,
# the 5% overshoot and the 0.5 V/us slew rate. The "1 MHz" everyone quotes for
# a 741 is not in this document, so nothing is put in `pole_hz` and a
# board-bound LM741 is rate-limited by its slew rate but has no modelled
# bandwidth roll-off.
[[models]]
id = "lm741"
kind = "opamp"
description = "LM741C single bipolar op-amp, 8-pin, +/-10 to +/-18 V split supply only"

[models.match]
# LM741, LM741A, LM741C, LM741E and their package letters (LM741CN, LM741CP,
# LM741CH). The uA741 is a DIFFERENT DOCUMENT with a different recommended
# supply range (+/-5 to +/-15 rather than +/-10 to +/-18) and different thermal
# figures, so it has its own entry below rather than being folded in here.
value_re = "(?i)^LM741[A-Z0-9]*$"

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 10.0
max_v = 18.0
abs_max_v = 18.0
severity = "serious"
basis = "TI LM741 SNOSC25D Section 6.3 Recommended Operating Conditions, supply voltage LM741C MIN +/-10 V, NOM +/-15 V, MAX +/-18 V (Section 6.1 Absolute Maximum Ratings gives the same +/-18 V for the C grade)"

[[models.envelope]]
kind = "supply_range"
pin = "vss"
min_v = -18.0
max_v = -10.0
severity = "serious"
basis = "TI LM741 SNOSC25D Section 6.3 Recommended Operating Conditions, supply voltage LM741C MIN +/-10 V, NOM +/-15 V, MAX +/-18 V; the negative rail is the same row read on the V- pin, and a V- pin on ground is outside it"

[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus", "in_minus"]
headroom_v = 3.0
severity = "serious"
basis = "TI LM741 SNOSC25D Section 6.7 Electrical Characteristics LM741C, input voltage range MIN +/-12 V, TYP +/-13 V at VS = +/-15 V and TA = 25 C, i.e. 3 V of guaranteed headroom below V+"

[models.params]
gain    = 200000.0  # Large signal voltage gain TYP 200 V/mV (MIN 20 V/mV),
                    # VS = +/-15 V, VO = +/-10 V, RL >= 2 kOhm, TA = 25 C
slew    = 0.5       # Slew rate TYP 0.5 V/us, TA = 25 C, unity gain. No MIN or
                    # MAX is printed.
# HEADROOMS FROM THE SUPPLY PINS, not fixed levels.
swing_lo = 3.0      # Output voltage swing at VS = +/-15 V, RL >= 10 kOhm:
swing_hi = 3.0      # MIN +/-12 V (TYP +/-14). The guaranteed MIN is taken, so
                    # 3.0 V of headroom from each rail; at RL >= 2 kOhm the
                    # guaranteed swing is only +/-10 V (5 V of headroom) and
                    # this card does not model the load dependence.
rail_lo = -12.0     # fallback levels only (deck `.model opamp(...)`, no pins):
rail_hi = 12.0      # the same guaranteed swing stated as levels on +/-15 V
warning = "THIS PART IS SPLIT-SUPPLY ONLY. SNOSC25D specifies it at VS = +/-15 V and recommends +/-10 V to +/-18 V; there is no single-supply mode in the document, and the two supply_range envelopes on this card fire when either supply pin leaves its range, which is what an LM741 with V- on ground does. NO BANDWIDTH IS MODELLED: the datasheet prints no gain-bandwidth product and no unity-gain bandwidth, only a 0.3 us rise time and a 0.5 V/us slew rate, so `pole_hz` is deliberately absent and this model rolls off nowhere -- it is rate-limited in a transient by the slew rate and otherwise answers DC. The output swing is bounded by the supply pins (V(V-)+3 V to V(V+)-3 V, the guaranteed MIN swing at RL >= 10 kOhm on a +/-15 V supply); the load dependence is not modelled and at RL >= 2 kOhm the guaranteed swing is only +/-10 V, which this card would call clean. The 25 mA output short-circuit current is not modelled. Input offset voltage (2 mV typ, 6 mV max), input bias current (80 nA typ, 500 nA max) and input offset current (20 nA typ, 200 nA max) are taken as zero -- on a 741 those are large, and a high-impedance source will show an offset this model does not -- and the gain is the 200 V/mV typ rather than the 20 V/mV min. The offset-null pins (1 and 5) are on the map as no-ops for the binder and any trim network wired to them is not modelled."

[models.coverage]
implements = ["finite_open_loop_gain", "supply_referenced_output_swing",
              "slew_rate_limit", "single_channel", "split_supply_envelope",
              "input_common_mode_range"]
missing = ["dominant_pole", "gain_bandwidth_product", "output_current_limit",
           "load_dependent_output_swing", "offset_null_trim",
           "input_offset_voltage", "input_bias_current", "input_offset_current",
           "parameter_spread",
           "quiescent_supply_current"]

[models.pins]
# SNOSC25D Section 5 Pin Functions, the NAB (8-pin CDIP/PDIP) and LMC (8-pin
# TO-99) packages, which share this numbering.
"2" = "in_minus"   # INVERTING INPUT
"3" = "in_plus"    # NONINVERTING INPUT
"4" = "vss"        # V-
"6" = "out"        # OUTPUT
"7" = "vcc"        # V+
# Pins 1 and 5 are OFFSET NULL and pin 8 is NC; none is claimed here.

[models.ratings]
max_voltage_v = 36.0          # +/-18 V supply, Section 6.1 Absolute Maximum
                              # Ratings, LM741C, stated here as the total
max_junction_temp_c = 100.0   # TJ, Section 6.1, LM741C (the LM741/LM741A
                              # grades are 150 C; the commercial part is not)
theta_ja_c_per_w = 100.0      # RthJA, P (PDIP) 8-pin, Section 6.4 Thermal
                              # Information (TO-99 is 170)

