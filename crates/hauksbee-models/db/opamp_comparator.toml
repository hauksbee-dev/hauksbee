# VICR upper end. SNOS458I Electrical Characteristics 5 V prints the input
# common-mode range at CMRR > 50 dB as VCC - 1.2 V min / VCC - 1 V typ at
# TJ = 25 C and VCC - 1.3 V min over -40 to +85 C. headroom_v is the 25 C
# guaranteed end, 1.2 V, the same 25 C choice as the LM393 above. Section 7
# says the output stays correct while ONE input is inside the range, so the
# check fires only when both are above it. The lower end (-0.2 V typ, -0.1 V
# max at 25 C) is not checked.
[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus", "in_minus"]
headroom_v = 1.2
severity = "serious"
basis = "TI LMV7219 SNOS458I, Electrical Characteristics 5 V, VCM input common-mode voltage range, CMRR > 50 dB: upper end VCC - 1.2 V min (VCC - 1 V typ) at TJ = 25 C; VCC - 1.3 V min over -40 to +85 C"

# Supply range. SNOS458I 6.3 Recommended Operating Conditions prints V+ - V-
# 2.7 V min, 5 V max; 6.1 Absolute Maximum Ratings 5.5 V. A note, not the
# default medium: a nominal 5 V rail is judged at +/-5% (5.25 V), above the
# 5 V recommended maximum yet inside the abs max, and that tolerance corner
# alone must not gate every USB-powered board this part sits on. A rail fed
# through a resistance that the parts' own 1.1 mA draw starves is raised on
# its own merit (the envelope check's starved-rail finding).
[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.7
max_v = 5.0
abs_max_v = 5.5
severity = "note"
basis = "TI LMV7219 SNOS458I, 6.3 Recommended Operating Conditions, supply voltages V+ - V- 2.7 V min, 5 V max; 6.1 Absolute Maximum Ratings, supply voltage 5.5 V"

[models.params]
# Source: Texas Instruments LMV7219 datasheet (SNOS458I), Table 6.6 (5 V).
# Output levels are the guaranteed limits at IL = 0.4 mA (typicals are
# VCC - 0.02 V and 10 mV).
out_lo     = 0.05   # VOL max at 5V supply (V)
out_hi     = 4.95   # VOH min at 5V supply (V)
# The same rows as headroom: VOH min VCC - 0.05 V and VOL max 50 mV at
# IL = 0.4 mA in both the 2.7 V and 5 V tables (SNOS458I Electrical
# Characteristics), so the output follows the supply it is bound to.
swing_hi   = 0.05
swing_lo   = 0.05
# VHYST typ 7.5 mV at V+ = 5 V (7 mV at 2.7 V), TI SNOS458I Electrical
# Characteristics 5 V; its footnote (4) defines it as Vtrip+ minus Vtrip-, the
# full band this param means. VOS (the trip points' average) is not modelled.
hysteresis = 0.0075
tpd_s      = 7.0e-9 # propagation delay 7 ns typ @ 5V, 50 mV overdrive (8 ns typ at 15 mV)
# Supply draw: IS 1.1 mA typ / 1.8 mA max at V+ = 5 V, no load (0.9 mA typ
# is the 2.7 V table), TI SNOS458I Electrical Characteristics 5 V. Stamped as
# a constant quiescent pull on the VCC pin net so a metering shunt in series
# with the part's rail reads it.
supply_static_ua = 1100.0
warning = "the output HIGH level on this card is fixed at 4.95 V, the datasheet's guaranteed minimum for a 5 V supply at 0.4 mA, and does NOT follow the voltage on the board's rail: the binder hard-codes it rather than reading the VCC pad, so this part on a 3.3 V board is still answered as swinging to 4.95 V, above its own supply. The low level (50 mV) is fixed the same way. Treat any result that turns on the output level of a LMV7219 on a rail other than 5 V as unanswered."

[models.pins]
"1" = "out"
"2" = "vss"
"3" = "in_plus"
"4" = "in_minus"
"5" = "vcc"

# ── INA180 / INA181 / INA185, TI current-sense amplifiers ───────────────────
#
# Sources (every pin map, rating and package below is read from these, not from memory):
#   Texas Instruments INA180 datasheet, SBOS741H (July 2022): Table 6-1, 7.1, 7.3.
#   Texas Instruments INA181 datasheet, SBOS793H (November 2023): Table 5-1, 6.1, 6.3.
#   Texas Instruments INA185 datasheet, SBOS378A (November 2023): Table 4-1, 5.1, 5.3.
# (The INA186 cards are above; the dual INA2181 below.)
#
# THE PIN MAP DEPENDS ON THE PACKAGE, so each card is for ONE package and the
# `[[models.source.pinout]]` column names it, which lets the binder refuse a footprint
# whose pad count or outline is another package's:
#   INA180  SOT-23-5 (DBV) only, but TWO pinouts chosen by the order code's first letter:
#           INA180A* = pinout A (OUT pin 1), INA180B* = pinout B (IN+ pin 1). A bare
#           "INA180" names neither, so no card claims it.
#   INA181  SOT-23-6 (DBV) and SC70-6 (DCK), different maps. A bare value is told apart by
#           footprint (the *_by_footprint cards); an order code naming DBV/DCK needs none.
#   INA185  SOT-563-6 (DRL, same map as the INA181 DBV) and SC70-6 (DCK, same as INA181 DCK).
#
# The three are unidirectional (INA180) or bidirectional (INA181/INA185) 26 V common-mode
# current-sense amplifiers on a 2.7 V to 5.5 V supply; the INA181 and INA185 add a REF pin.
# IN+ and IN- are rated against GND (-0.2 V to 26 V recommended, 26 V absolute maximum common
# mode), independent of VS, so each card declares that as a `supply_range` envelope on both
# input pins: the back_power check then judges those pins by their rating instead of by a
# clamp to the 2.7-5.5 V supply.

[[models]]
id = "ina180"
kind = "opamp"
description = "TI INA180A current-sense amplifier, pinout A (OUT on pin 1), SOT-23-5 (DBV)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/ina180.pdf"
title = "Texas Instruments INA180, INA2180, INA4180 datasheet, SBOS741H, revised July 2022"
locator = "Section 6 Pin Configuration and Functions, Table 6-1 (pinout A and B columns) p.4; 7.1 Absolute Maximum Ratings p.7; 7.3 Recommended Operating Conditions p.7"
sha256 = "00e2e06b26d9b821b606e1382e9ccdfa0c38b0ac935b235258490d82d5d07d93"
[[models.source.pinout]]
package = "SOT-23-5 (DBV) pinout A"
pins = { "1" = "OUT", "2" = "GND", "3" = "IN+", "4" = "IN-", "5" = "VS" }

[models.match]
value_re = "(?i)^INA180A"

[models.params]
# Gain is suffix-dependent (A1=20, A2=50, A3=100, A4=200 V/V); this card carries the
# A3 value as a representative, which the warning says. The output ceiling is the
# part's VS maximum; the binder follows the real rail when the VS pin is wired.
gain    = 100.0
rail_lo = 0.0
rail_hi = 5.5

warning = "the output swing on this card is a FIXED level, not a headroom from the voltage on the supply pin: unlike the LM358/LM324/TSV914 entries it carries no `swing_hi`/`swing_lo`, so a INA180A on a rail lower than that level is answered as if it could swing past its own supply. The gain is the A3 100 V/V representative, not the order code's A1/A2/A3/A4 suffix (20/50/100/200 V/V). The output current limit, input offset voltage and input bias current are unmodelled (taken as zero or unchecked), and every figure is the datasheet TYPICAL at 25 C, not a bound over the part's spread or over temperature. The input common-mode range is not simulated as a limit on the output, but IN+ and IN- each carry the datasheet pin rating (-0.2 V to 26 V recommended, 26 V absolute maximum common mode), which the envelope and back_power checks judge."

[models.coverage]
implements = ["fixed_gain", "finite_output_swing", "input_pin_voltage_rating"]
missing = ["supply_referenced_output_swing", "output_current_limit",
           "input_offset_voltage", "input_bias_current",
           "parameter_spread",
           "quiescent_supply_current"]

