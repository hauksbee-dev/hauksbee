# Op-amp and comparator models (behavioral).

[[models]]
id = "lm358"
kind = "opamp"
description = "LM358 dual op-amp, 32V supply, rail-to-rail input"

[models.match]
value_re = "(?i)^LM358"

[models.params]
# Source: Texas Instruments LM358 datasheet (SNOSC16D), typical parameters
gain    = 100000.0  # open-loop DC gain (V/V), typ 100 dB
rail_lo = 0.0       # output low rail (V), approx. Vss + 0 V (1-supply)
rail_hi = 32.0      # output high rail (V), single supply

[models.pins]
# Pin numbers for DIP-8 / SOIC-8 LM358 (unit A, pin numbers vary by schematic)
"1" = "out_a"
"2" = "in_minus_a"
"3" = "in_plus_a"
"4" = "vss"
"5" = "in_plus_b"
"6" = "in_minus_b"
"7" = "out_b"
"8" = "vcc"

