warning = "the output HIGH level on this card is fixed at 4.95 V, the datasheet typical for a 5 V supply, and does NOT follow the voltage on the board's rail: the binder hard-codes it rather than reading the VCC pad, so this part on a 3.3 V board is still answered as swinging to 4.95 V, above its own supply. The low level (50 mV) is fixed the same way. Treat any result that turns on the output level of a LMV7219 on a rail other than 5 V as unanswered."

