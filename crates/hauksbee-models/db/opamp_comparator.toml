# ─────────────────────────────────────────────────────────────────────────────
# MCP6001 / MCP6002 / MCP6004: Microchip's 1 MHz CMOS rail-to-rail-in-and-out
# family, single supply 1.8 V to 6.0 V.
#
# Source: Microchip "MCP6001/1R/1U/2/4 1 MHz, Low-Power Op Amp" DS20001733L
#   (2002-2020). DC ELECTRICAL SPECIFICATIONS and AC ELECTRICAL SPECIFICATIONS,
#   at TA = +25 C, VSS = GND, RL = 10 kOhm to VDD/2, unless a row says
#   otherwise.
#
# FIVE PART NUMBERS, FOUR PIN MAPS, and the suffix is the only thing that tells
# them apart. Table 3-1 "Pin Function Table" of DS20001733L puts them side by
# side:
#                        MCP6001   MCP6001R  MCP6001U   MCP6002   MCP6004
#                        5-lead    5-lead    5-lead     8-lead    14-lead
#   VOUT / VOUTA            1         1         4          1         1
#   VIN- / VINA-            4         4         3          2         2
#   VIN+ / VINA+            3         3         1          3         3
#   VDD                     5         2         5          8         4
#   VSS                     2         5         2          4        11
# The R and the U are NOT cosmetic: an MCP6001R bound to the plain MCP6001 map
# would have its supply pins swapped end for end, and a U bound to either would
# have its output on an input. Each therefore gets its own entry, and the
# regexes below are written so that "MCP6001T-E/OT" matches the plain part
# while "MCP6001RT-I/OT" and "MCP6001UT-I/OT" do not.
#
# Figures used:
#   VDD    1.8 V MIN, 6.0 V MAX (Power Supply, DC table; 7.0 V abs max)
#   AOL    88 dB MIN, 112 dB TYP @ VOUT = 0.3 V to VDD - 0.3 V, VCM = VSS
#   VOL/VOH  VSS + 25 mV to VDD - 25 mV @ VDD = 5.5 V, 0.5 V input overdrive
#   VCMR   VSS - 0.3 V MIN to VDD + 0.3 V MAX
#   GBWP   1.0 MHz TYP
#   SR     0.6 V/us TYP
#
# NO `input_common_mode` ENVELOPE ON THESE CARDS, and the absence is a fact
# rather than an omission: VCMR runs from VSS - 0.3 V to VDD + 0.3 V, i.e. the
# guaranteed common-mode range extends 300 mV BEYOND both rails. A
# supply-relative headroom would have to be negative, which the envelope kind
# does not accept and which would not describe a hazard if it did.
[[models]]
id = "mcp6002"
kind = "opamp"
description = "Microchip MCP6002 dual rail-to-rail CMOS op-amp, 8-pin, 1.8 to 6.0 V single supply"

[models.match]
# MCP6002T-I/SN, MCP6002-E/P, MCP6002T-E/MS, MCP6002T-E/MNY and the bare part
# number. The 8-lead PDIP, SOIC, MSOP and 2x3 DFN share one map (Table 3-1).
value_re = "(?i)^MCP6002[A-Z0-9]*([-/][A-Z0-9/]*)?$"

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 1.8
max_v = 6.0
abs_max_v = 7.0
severity = "serious"
basis = "Microchip MCP6001/2/4 DS20001733L, DC ELECTRICAL SPECIFICATIONS, Power Supply, VDD MIN 1.8 V MAX 6.0 V (Absolute Maximum Ratings give VDD - VSS 7.0 V); the note on that row records that only parts dated November 2007 and later are screened to 6.0 V and that all other limits are measured at 1.8 V and 5.5 V"

[models.params]
gain    = 398107.0  # AOL TYP 112 dB = 398107 V/V at VOUT = 0.3 V to VDD - 0.3 V
                    # and VCM = VSS (MIN 88 dB = 25119 V/V). The typ is taken,
                    # as on the tsv914 entry above.
pole_hz = 2.512     # DERIVED: GBWP 1.0 MHz TYP / AOL 398107 TYP. Not a printed
                    # row.
slew    = 0.6       # SR TYP 0.6 V/us. No MIN or MAX is printed.
# HEADROOMS FROM THE SUPPLY PINS. These are the MIN/MAX columns of the
# "Maximum Output Voltage Swing" row, so they are guaranteed, not typical --
# unusually for this file, Microchip prints no typical here at all.
swing_lo = 0.025    # VOL: VSS + 25 mV, at VDD = 5.5 V, 0.5 V input overdrive,
swing_hi = 0.025    # RL = 10 kOhm to VDD/2. VOH is the matching VDD - 25 mV.
rail_lo = 0.025     # fallback levels only (deck `.model opamp(...)`, no pins):
rail_hi = 5.475     # the same headrooms stated as levels on the 5.5 V rail the
                    # swing row is specified at
warning = "rail-to-rail input AND output: the output reaches within 25 mV of each supply pin at RL = 10 kOhm, and the guaranteed common-mode input range runs from VSS - 0.3 V to VDD + 0.3 V, which is why this card carries no input_common_mode envelope -- there is no supply-relative input ceiling to check. The output current limit is NOT modelled, so a load stiffer than 10 kOhm gets a swing the part cannot hold; the datasheet's only output-drive figure is the short-circuit current (6 mA typ at VDD = 1.8 V, 23 mA typ at 5.5 V) and there is no swing-versus-load row to model. The swing row is specified at VDD = 5.5 V with 0.5 V of input overdrive and this card applies it at every supply. The 2.512 Hz pole is DERIVED from the typical 1 MHz gain-bandwidth product and the typical 112 dB open-loop gain, not printed, and is a single-pole fit to a part the datasheet describes as having 90 degrees of phase margin. Input offset voltage (+/-4.5 mV max -- Microchip prints no typical) is taken as zero; the input bias current is genuinely negligible here (1 pA typ at 25 C, though 1100 pA at 125 C). The gain is the 112 dB typ rather than the 88 dB min. Both amplifiers share one supply leg and one pair of rails."

