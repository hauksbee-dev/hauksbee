# ─────────────────────────────────────────────────────────────────────────────
# TSL2561 (CS/T/FN): TAOS (now ams OSRAM) light-to-digital converter, 6-lead CS (chipscale), T (TMB-6) and FN (dual flat no-lead).
#
# Source: TAOS "TSL2560, TSL2561 Light-to-Digital Converter", TAOS059N, March 2009. Page
#   numbers are the printed footers: package pin diagrams p.1, Available Options p.2, Terminal
#   Functions, Absolute Maximum Ratings, Recommended Operating Conditions and Electrical
#   Characteristics p.3, Operating Characteristics p.4, Notes p.5, AC characteristics p.6,
#   Table 1 slave addresses p.10, protocols pp.11-13, Table 2 register map p.13, Tables 3-12
#   pp.14-18. The datasheet's own table cross-references are off by one page in places, so
#   table numbers are cited alongside.
#
# VARIANTS: the CS, T and FN bodies share one pad order (1 VDD, 2 ADDR SEL, 3 GND, 4 SCL,
# 5 INT, 6 SDA) and the CL body numbers its pads differently (1 VDD, 2 GND, 3 ADDR SEL, 4 SCL,
# 5 SDA, 6 INT), so the tsl2561 variant family has two cards. A bare "TSL2561" names neither
# and stays unresolved until the ordering code (TSL2561CS/T/FN or CL) or the fitted pads select
# one. TSL2560 (SMBus, PARTNO 0000) is a different part and is not resolved here.
#
# LEVELS: VIL (0.8 V max) and VIH (2.1 V min) are printed in volts (Recommended Operating
# Conditions p.3), not as fractions of VDD. VOL is printed in volts (0.4 V at 3 mA, 0.6 V at
# 6 mA). INT and SDA are open drain, so no output-high level is carried.
#
# ADDRESS: the ADDR SEL pin is three-state (GND 0x29, Float 0x39, VDD 0x49, Table 1 p.10). The
# strap contract here has two levels, so the card carries GND = 0x29 and VDD = 0x49, and the
# Float address 0x39 is the spec default used, flagged assumed, when the pin is not tied.
#
# THERMAL: the datasheet prints no theta_JA, theta_JC or junction temperature (searched the
# whole document); the fields are left ABSENT.
#
# BUS MODEL: byte-framed (0x80 + register) and word-framed (0xA0 + register) command bytes.
# CONTROL, TIMING, INTERRUPT and the two 16-bit thresholds read back what was written; the ID
# register answers 0x10 (PARTNO 0001, REVNO not printed); the channel data registers answer
# from two RAW count inputs because lux needs an empirical formula.
#
# Renode (MIT, Antmicro) was not consulted for this part: every value is from the datasheet.
[[models]]
id = "tsl2561_cs_t_fn"
kind = "digital"
description = "TAOS TSL2561 light-to-digital converter, 6-lead CS (chipscale), T (TMB-6) and FN (dual flat no-lead) (three-state ADDR SEL address strap, pad map, volt logic levels, command-byte register map with reset values, raw channel counts); no interrupt engine"
variant_of = "tsl2561"

[models.match]
# One shared family match: the bare number and every ordering code. TSL2560 and TSL2591 fall
# outside the anchored number.
value_re = "(?i)^TSL2561(?:CS|T|FN|CL)?$"

[models.variant]
orderable_re = '^TSL2561(CS|T|FN)$'
orderable = ["TSL2561CS", "TSL2561T", "TSL2561FN"]
basis = "TAOS TSL2560/TSL2561 datasheet (TAOS059N, Mar. 2009) Available Options p.2; Terminal Functions p.3 (pin numbering per package)"

[models.params]
vol   = { max = 0.4, unit = "V", conditions = "3 mA sink on INT and SDA", basis = "TAOS TSL2560/TSL2561 datasheet (TAOS059N, Mar. 2009) Electrical Characteristics p.3, VOL 0.4 V max at 3 mA (0.6 V at 6 mA)" }
vih   = 2.1      # Recommended Operating Conditions p.3, SCL and SDA input high voltage min
vil   = 0.8      # Recommended Operating Conditions p.3, SCL and SDA input low voltage max
supply_static_ua = 240.0   # Electrical Characteristics p.3, IDD active typ (0.6 mA max); power down is 3.2 uA typ
supply_pin = "1"
gnd_pin    = "3"

[models.pins]
# Terminal Functions p.3, CS/T/FN, all six pads.
"1" = "vdd"   # VDD
"2" = "addr_sel"# ADDR SEL
"3" = "gnd"   # GND
"4" = "scl"   # SCL
"5" = "int"   # INT
"6" = "sda"   # SDA

[models.ratings]
# Absolute Maximum Ratings p.3: VDD 3.8 V; digital outputs -0.5 to 3.8 V; storage -40 to 85 C.
max_voltage_v = 3.8

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.7
max_v = 3.6
abs_max_v = 3.8
basis = "TAOS TSL2560/TSL2561 datasheet (TAOS059N, Mar. 2009), Recommended Operating Conditions p.3 VDD 2.7 to 3.6 V (3 V nominal); Absolute Maximum Ratings p.3 supply voltage 3.8 V (the block diagram on p.2 prints 2.7 to 3.5 V; the table is used)"

[models.peripheral]
kind = "register_map"
address_select_role = "addr_sel"
address_when_low = 0x29      # Table 1 p.10, ADDR SEL at GND
address_when_high = 0x49     # Table 1 p.10, ADDR SEL at VDD
spec_toml = '''
[sensor]
name = "TSL2561 CS/T/FN"
bus = "i2c"
# Table 1 Slave Address Selection (p.10): ADDR SEL to GND selects 0101001 (0x29), left floating
# 0111001 (0x39), tied to VDD 1001001 (0x49). The card's [models.peripheral] strap carries the
# GND and VDD addresses; an ADDR SEL that is floating (or on a signal net) takes this default,
# which is the printed Float address, and is reported as assumed.
i2c_address = 0x39

# 6-lead CS (chipscale), T (TMB-6) and FN (dual flat no-lead) pad map (Terminal Functions, p.3), the same as [models.pins].
[sensor.pins]
1 = "vdd"
2 = "addr_sel"
3 = "gnd"
4 = "scl"
5 = "int"
6 = "sda"

# Raw ADC counts of the two photodiode channels (Channel 0 visible plus IR, Channel 1 IR only).
# The datasheet turns illuminance into counts only through source-dependent responsivities
# (Operating Characteristics p.4), so the registers carry counts: 0 is the dark reset value.
[[sensor.input]]
name = "ch0_counts"
default = 0.0

[[sensor.input]]
name = "ch1_counts"
default = 0.0

# ID register REVNO (bits 3:0). The datasheet prints the field but no value (Table 11, p.17),
# so the revision defaults to 0 and a test can set it.
[[sensor.input]]
name = "revno"
default = 0.0

# Every access starts with a COMMAND byte (Table 3, p.14): CMD (bit 7) = 1, WORD (bit 5) for the
# word protocols, ADDRESS (bits 3:0) = the register (Table 2, p.13). The first byte written is the
# I2C pointer, so byte-framed registers are declared at 0x80 + address and word-framed registers
# at 0xA0 + address. Block framing (0x90 + address, 0x9B) and the CLEAR bit (0x40) are not modelled.

# CONTROL (0h, Table 4 p.14) reads back, reset 00h; a written 03h reads back 03h.
[[sensor.register]]
addr = 0x80
encoding = "u8"
expr = "control"

# TIMING (1h, Table 5 p.15) reads back, reset 02h (GAIN 0 = 1x, INTEG 10 = 402 ms).
[[sensor.register]]
addr = 0x81
encoding = "u8"
expr = "timing"

# THRESHLOWLOW (2h, Table 7 p.16): low byte of the low threshold, reset 00h.
[[sensor.register]]
addr = 0x82
encoding = "u8"
expr = "thresh_low % 256"

# THRESHLOWHIGH (3h).
[[sensor.register]]
addr = 0x83
encoding = "u8"
expr = "floor(thresh_low / 256)"

# THRESHHIGHLOW (4h).
[[sensor.register]]
addr = 0x84
encoding = "u8"
expr = "thresh_high % 256"

# THRESHHIGHHIGH (5h).
[[sensor.register]]
addr = 0x85
encoding = "u8"
expr = "floor(thresh_high / 256)"

# INTERRUPT (6h, Table 8 p.16) reads back, reset 00h.
[[sensor.register]]
addr = 0x86
encoding = "u8"
expr = "intr"

# ID (Ah, Table 11 p.17): PARTNO (bits 7:4) = 0001 for the TSL2561 (0000 is the TSL2560); REVNO (bits 3:0) is not printed.
[[sensor.register]]
addr = 0x8A
encoding = "u8"
expr = "16 + revno"

# DATA0LOW..DATA1HIGH (Ch-Fh, Table 12 p.18): the channel counts, low byte first, 00h on power up and while CONTROL is not 03h, clamped to the full-scale count of the integration time (5047 at 13.7 ms, 37177 at 101 ms, 65535 at 402 ms; Note 6 p.5). The high-byte shadow latch on the low-byte read is not modelled.
[[sensor.register]]
addr = 0x8C
encoding = "u8"
expr = "(if(control % 4 > 2.5, round(min(ch0_counts, if(tim_integ < 0.5, 5047, if(tim_integ < 1.5, 37177, 65535)))), 0)) % 256"

[[sensor.register]]
addr = 0x8D
encoding = "u8"
expr = "floor((if(control % 4 > 2.5, round(min(ch0_counts, if(tim_integ < 0.5, 5047, if(tim_integ < 1.5, 37177, 65535)))), 0)) / 256)"

[[sensor.register]]
addr = 0x8E
encoding = "u8"
expr = "(if(control % 4 > 2.5, round(min(ch1_counts, if(tim_integ < 0.5, 5047, if(tim_integ < 1.5, 37177, 65535)))), 0)) % 256"

[[sensor.register]]
addr = 0x8F
encoding = "u8"
expr = "floor((if(control % 4 > 2.5, round(min(ch1_counts, if(tim_integ < 0.5, 5047, if(tim_integ < 1.5, 37177, 65535)))), 0)) / 256)"

# Low threshold read as a word (Read Word protocol, Figure 15 p.12).
[[sensor.register]]
addr = 0xA2
encoding = "u16_le"
expr = "thresh_low"

# High threshold read as a word.
[[sensor.register]]
addr = 0xA4
encoding = "u16_le"
expr = "thresh_high"

# Channel 0 ADC count as a word (DATA0LOW then DATA0HIGH, Table 12 p.18).
[[sensor.register]]
addr = 0xAC
encoding = "u16_le"
expr = "if(control % 4 > 2.5, round(min(ch0_counts, if(tim_integ < 0.5, 5047, if(tim_integ < 1.5, 37177, 65535)))), 0)"

# Channel 1 ADC count as a word (DATA1LOW then DATA1HIGH).
[[sensor.register]]
addr = 0xAE
encoding = "u16_le"
expr = "if(control % 4 > 2.5, round(min(ch1_counts, if(tim_integ < 0.5, 5047, if(tim_integ < 1.5, 37177, 65535)))), 0)"

# CONTROL reset 00h: POWER bits 1:0 (03h powers up, 00h powers down).
[[sensor.write_register]]
addr = 0x80
encoding = "u8"
store = "control"
default = 0.0

[[sensor.write_register.field]]
name = "ctl_power"
bits = [1, 0]

# TIMING reset 02h: GAIN bit 4, Manual bit 3, INTEG bits 1:0.
[[sensor.write_register]]
addr = 0x81
encoding = "u8"
store = "timing"
default = 2.0

[[sensor.write_register.field]]
name = "tim_gain"
bits = [4, 4]

[[sensor.write_register.field]]
name = "tim_manual"
bits = [3, 3]

[[sensor.write_register.field]]
name = "tim_integ"
bits = [1, 0]

# Low interrupt threshold, written as a word (Write Word protocol; the datasheet says byte-paired registers are written together, Table 7 note p.16). Reset 0000h. Single-byte writes to 2h/3h are not modelled.
[[sensor.write_register]]
addr = 0xA2
encoding = "u16_le"
store = "thresh_low"
default = 0.0

# High interrupt threshold, written as a word; reset 0000h.
[[sensor.write_register]]
addr = 0xA4
encoding = "u16_le"
store = "thresh_high"
default = 0.0

# INTERRUPT reset 00h: INTR bits 5:4, PERSIST bits 3:0.
[[sensor.write_register]]
addr = 0x86
encoding = "u8"
store = "intr"
default = 0.0

[[sensor.write_register.field]]
name = "intr_mode"
bits = [5, 4]

[[sensor.write_register.field]]
name = "intr_persist"
bits = [3, 0]

[sensor.protocol]
style = "i2c_pointer"
'''

