# ─────────────────────────────────────────────────────────────────────────────
# BME680: Bosch Sensortec gas / humidity / pressure / temperature sensor, LGA-8
# 3.0 x 3.0 x 0.93 mm metal lid.
#
# Source: Bosch Sensortec "BME680 Data sheet", document BST-BME680-DS001-09,
#   revision 1.9, February 2024 (marking "S" = 0 273 141 229, "E" = 0 273 141
#   312). Table 1 (p.7) electrical parameters, Table 2 (p.8) gas sensor, Table 9
#   (p.13) absolute maximum ratings, Table 20 (p.28) memory map, Sections 6.1-6.3
#   (p.38) interface selection and I2C address, Table 21 (p.41) interface
#   parameters, Table 24 (p.44) pin description.
#
# TWO CARDS, ONE DIE FAMILY: the BME688 datasheet (BST-BME688-DS000-03) differs
# (extra Variant_Id register 0xF0, parallel-mode data fields, Gas_wait_shared),
# so the BME688 has its own card below.
#
# LEVELS: Table 21 prints Vil, Vih, Vol, Voh as percentages of VDDIO. VIH/VIL are
# those fractions evaluated at the Table 1 typical VDDIO = 1.6 V; VOH/VOL are the
# rows at their printed VDDIO = 1.62 V (loaded levels; the loader turns them into
# the rail behind an output resistance, ASSUMED because no light-load row is
# printed). Wrong by the ratio on another interface rail.
#
# THERMAL: no theta_JA or theta_JC is printed for the LGA package; left ABSENT.
#
# BUS MODEL: I2C only. Registers are the Table 20 map: Id 0xD0 (0x61), status,
# Config, Ctrl_meas, Ctrl_hum, Ctrl_gas_0/1, heater set-points and the data
# registers. The data registers answer from RAW ADC count inputs (adc_press,
# adc_temp, adc_hum, adc_gas, gas_range) because the compensation parameters are
# device specific and unprinted. Reserved addresses are undeclared: a single
# read returns 0xFF and a BURST read hops to the next declared register, so a
# 17-byte field read from 0x1D is misaligned (SCHEMA GAP, see the report).
#
# Renode (MIT, Antmicro) was not consulted; every value is from the datasheet.
[[models]]
id = "bme680"
kind = "digital"
description = "Bosch BME680 gas, humidity, pressure and temperature sensor, LGA-8 (strap-selected I2C address, pad map, VDDIO logic levels, register map with reset values, raw sensor data); no compensation"

[models.match]
value_re = "(?i)^BME680([-_ ].*)?$"

[models.params]
voh   = { min = 1.296, unit = "V", conditions = "VDDIO = 1.62 V, IOH = 1 mA (SDO, SDI); 0.8 x VDDIO", basis = "Table 21 p.41, Voh 0.8 x VDDIO min (0.8 x 1.62 V); derived by evaluating the printed fraction at the row's VDDIO; the 1.20 V row relaxes to 0.6 x VDDIO" }
vol   = { max = 0.324, unit = "V", conditions = "VDDIO = 1.62 V, IOL = 3 mA (I2C, Vol_SDI); 0.2 x VDDIO", basis = "Table 21 p.41, Vol_SDI 0.2 x VDDIO max (0.2 x 1.62 V); derived by evaluating the printed fraction at the row's VDDIO; the 1.20 V row is 0.23 x VDDIO" }
vih   = 1.28     # Vih_si 0.8 x VDDIO min, derived at the Table 1 typical VDDIO = 1.6 V
vil   = 0.32     # Vil_si 0.2 x VDDIO max, derived at VDDIO = 1.6 V
supply_static_ua = 3.7     # p.3 key features, 3.7 uA at 1 Hz humidity, pressure and temperature (typ);
                           # excludes the gas heater (IDD 12 mA typ with the heater on, Table 2 p.8).
supply_pin = "8"           # VDD
gnd_pin    = "1"           # GND

[models.pins]
# Table 24 Pin description, LGA-8. Numbering direction follows the
# datasheet's connection diagram (see the BME280 entry in digital.toml for the
# direction caveat); SDI/SCK use the bus vocabulary.
"1" = "gnd"
"2" = "csb"      # chip select; VDDIO selects I2C
"3" = "sda"      # SDI: I2C SDA / SPI SDI
"4" = "scl"      # SCK: I2C SCL / SPI SCK
"5" = "sdo"      # SPI data out; in I2C the address LSB (GND = 0x76, VDDIO = 0x77)
"6" = "vddio"    # interface supply, 1.2 to 3.6 V
"7" = "gnd2"
"8" = "vdd"      # supply, 1.71 to 3.6 V

[models.ratings]
# Table 9 p.13: VDD and VDDIO pins -0.3 to 4.25 V; interface pins -0.3 V to VDDIO + 0.3 V;
# storage -45 to +85 C; ESD HBM 2 kV.
max_voltage_v = 4.25

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.71
max_v = 3.6
abs_max_v = 4.25
basis = "Bosch BST-BME680-DS001-09, Table 1 p.7 Supply Voltage Internal Domains VDD row (ripple max 50 mVpp); Table 9 p.13 supply pin maximum"

[[models.envelope]]
kind = "supply_range"
pin = "vddio"
min_v = 1.2
max_v = 3.6
abs_max_v = 4.25
basis = "Bosch BST-BME680-DS001-09, Table 1 p.7 Supply Voltage I/O Domain VDDIO row; Table 9 p.13 supply pin maximum"

# Section 6.2 (p.38): "If CSB is connected to VDDIO, the I2C interface is active."
# SDO to GND gives 1110110 (0x76), SDO to VDDIO gives 1110111 (0x77); "The SDO
# pin cannot be left floating".
[models.peripheral]
kind = "register_map"
required_high_roles = ["csb"]
address_select_role = "sdo"
address_when_low = 0x76
address_when_high = 0x77
spec_toml = '''
[sensor]
name = "BME680"
bus = "i2c"
i2c_address = 0x76

# RAW ADC counts (the Bosch compensation needs the per-device calibration
# parameters in registers 0x89-0xA1 / 0xE1-0xEE and 0x00-0x02, which the
# datasheet does not print values for). Defaults are the Table 20 reset values:
# 524288 = 0x80000 (press, temp), 32768 = 0x8000 (hum), gas 0.
[[sensor.input]]
name = "adc_press"
default = 524288.0

[[sensor.input]]
name = "adc_temp"
default = 524288.0

[[sensor.input]]
name = "adc_hum"
default = 32768.0

[[sensor.input]]
name = "adc_gas"
default = 0.0

[[sensor.input]]
name = "gas_range"
default = 0.0

# 0x1D eas_status_0 (reset 0x00): new_data_0 bit 7 is set while a measurement mode is selected (instant conversion; measuring and gas_measuring stay 0).
[[sensor.register]]
addr = 0x1D
encoding = "u8"
expr = "if(mode > 0, 128, 0)"

# 0x1F-0x21 press_msb/lsb/xlsb<7:4>, reset 80 00 00; oversampling 000 skips the channel (output 0x80000).
[[sensor.register]]
addr = 0x1F
encoding = "u20_be_xlsb"
expr = "if(osrs_p > 0, adc_press, 524288)"

# 0x22-0x24 temp_msb/lsb/xlsb<7:4>, reset 80 00 00.
[[sensor.register]]
addr = 0x22
encoding = "u20_be_xlsb"
expr = "if(osrs_t > 0, adc_temp, 524288)"

# 0x25-0x26 hum_msb/lsb, reset 80 00.
[[sensor.register]]
addr = 0x25
encoding = "u16_be"
expr = "if(osrs_h > 0, adc_hum, 32768)"

# 0x2A-0x2B gas_r_msb (gas_r<9:2>) / gas_r_lsb (gas_r<1:0> bits 7:6, gas_valid_r bit 5, heat_stab_r bit 4, gas_range_r bits 3:0), reset 00 00; valid and stable are set while run_gas = 1.
[[sensor.register]]
addr = 0x2A
encoding = "u16_be"
expr = "if(run_gas > 0, adc_gas * 64 + 48 + gas_range, 0)"

# 0x73 status (spi_mem_page), reset 0x00; irrelevant on I2C.
[[sensor.register]]
addr = 0x73
const = [0x00]

# 0xD0 Id (chip_id), reset 0x61.
[[sensor.register]]
addr = 0xD0
const = [0x61]

