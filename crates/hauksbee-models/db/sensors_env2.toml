# ─────────────────────────────────────────────────────────────────────────────
# BH1750FVI: ROHM digital 16-bit ambient light sensor, WSOF6I (6-pad).
#
# Source: ROHM "BH1750FVI Ambient Light Sensor IC Series, Digital 16bit Serial Output Type",
#   Technical Note No.11046EDT01, 2011.11 Rev.D. Page numbers are the printed "n/17" footers:
#   Absolute Maximum Ratings and Operating Conditions p.1, Electrical Characteristics p.2,
#   Block Diagram p.4, Instruction Set Architecture p.5, I2C Bus Access (slave address, write
#   and read formats) p.10, MTreg adjustment p.11, H-Resolution Mode2 p.12, Terminal Description
#   p.13, Package Outlines p.14, Ordering part number p.17.
#
# ORDERING: BH1750FVI-TR (tape and reel, 3000 pcs) is the only ordering code; the single
# WSOF6I body means one card and no variants. The exposed central pad is GND level and is to be
# left unconnected and unsoldered (Cautions on use 10, p.16), so it is not mapped.
#
# LEVELS: SCL and SDA thresholds are printed as 0.7 and 0.3 of DVI, the I2C reference voltage
# pin, not of VCC; the volts below evaluate them at DVI = 3.0 V, the Electrical Characteristics
# test condition (derived). VOL is printed in volts (0.4 V at 3 mA). SDA is open drain, so no
# output-high level is carried. DVI is also the asynchronous reset: low holds the part in Power
# Down (p.13), so the peripheral requires DVI high.
#
# THERMAL: no thermal resistance is printed. RthetaJA below is DERIVED from the printed
# power-dissipation derating of 3.47 mW/C (1 / 0.00347 = 288.2 C/W, 70 x 70 x 1.6 mm glass epoxy
# board, p.1); no junction-temperature limit is printed, so max_junction_temp_c is ABSENT.
#
# BUS MODEL: opcode-framed writes (Power Down, Power On, Reset, the three continuous and three
# one-time measurement modes, and the two MTreg halves) and the two-byte measurement read frame
# (high byte, then low byte). The data register follows the illuminance input (count = lux x 1.2
# x MTreg / 69, doubled in H-resolution Mode2) once a measurement mode has been started.
#
# Renode (MIT, Antmicro) was not consulted for this part: every value is from the datasheet.
[[models]]
id = "bh1750fvi"
kind = "digital"
description = "ROHM BH1750FVI ambient light sensor, WSOF6I (ADDR address strap, DVI-referenced logic levels, opcode command decode, two-byte lux data frame with MTreg sensitivity); no conversion latency"

[models.match]
# The bare number, BH1750FVI and the BH1750FVI-TR ordering code. BH1721FVC and BH1730FVC
# are different parts and fall outside the anchored number.
value_re = "(?i)^BH1750(?:FVI(?:-TR)?)?$"

[models.params]
vol   = { max = 0.4, unit = "V", conditions = "IOL = 3 mA on SDA", basis = "ROHM BH1750FVI No.11046EDT01 Rev.D Electrical Characteristics p.2, VOL 0.4 V max at IOL = 3 mA" }
vih   = 2.1      # Electrical Characteristics p.2, VIH1 0.7 x DVI min (SCL, SDA), derived at DVI = 3.0 V
vil   = 0.9      # Electrical Characteristics p.2, VIL1 0.3 x DVI max (SCL, SDA), derived at DVI = 3.0 V
supply_static_ua = 120.0   # Electrical Characteristics p.2, Icc1 typ during measurement (190 uA max); power down is 0.01 uA typ
supply_pin = "1"           # VCC
gnd_pin    = "3"           # GND

[models.pins]
# Terminal Description p.13, all six pads.
"1" = "vcc"   # VCC
"2" = "addr"  # ADDR
"3" = "gnd"   # GND
"4" = "sda"   # SDA
"5" = "dvi"   # DVI
"6" = "scl"   # SCL

[models.ratings]
# Absolute Maximum Ratings p.1: supply voltage Vmax 4.5 V.
max_voltage_v = 4.5
theta_ja_c_per_w = 288.2     # DERIVED from the 3.47 mW/C derating of Pd = 260 mW (p.1), 70 x 70 x 1.6 mm glass epoxy board

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.4
max_v = 3.6
abs_max_v = 4.5
basis = "ROHM BH1750FVI No.11046EDT01 Rev.D, Operating Conditions p.1 VCC 2.4 to 3.6 V (3.0 V typ); Absolute Maximum Ratings p.1 supply voltage Vmax 4.5 V"

[[models.envelope]]
kind = "supply_range"
pin = "dvi"
min_v = 1.65
max_v = 3.6
basis = "ROHM BH1750FVI No.11046EDT01 Rev.D, Operating Conditions p.1 I2C Reference Voltage VDVI 1.65 V to VCC (3.6 V at the VCC maximum)"

[[models.envelope]]
kind = "rail_order"
lower = "dvi"
upper = "vcc"
basis = "ROHM BH1750FVI No.11046EDT01 Rev.D, Operating Conditions p.1: the I2C reference voltage VDVI is 1.65 V to VCC, so DVI must not exceed VCC"

[models.peripheral]
kind = "register_map"
required_high_roles = ["dvi"]    # p.13: DVI low is the asynchronous reset and holds Power Down
address_select_role = "addr"
address_when_low = 0x23          # p.10, ADDR low 0100011
address_when_high = 0x5C         # p.10, ADDR high 1011100
spec_toml = '''
[sensor]
name = "BH1750FVI"
bus = "i2c"
# Slave Address (p.10): ADDR low (<= 0.3 x VCC) selects 0100011 (0x23), ADDR high (>= 0.7 x VCC)
# 1011100 (0x5C). ADDR is a tri-state buffer for internal test (Terminal Description p.13), so
# the card's strap contract takes the two levels and an ADDR that is floating (or on a signal
# net) takes this default, flagged assumed.
i2c_address = 0x23

# Six-pad WSOF6I pad map (Terminal Description p.13), the same as [models.pins].
[sensor.pins]
1 = "vcc"
2 = "addr"
3 = "gnd"
4 = "sda"
5 = "dvi"
6 = "scl"

# Ambient illuminance in lux, the quantity the part reports. The default is 0 lx (dark).
# The count is illuminance x 1.2 (Measurement Accuracy typ, p.2; H-resolution formula
# lx = count / 1.2 x 69 / MTreg, p.11) for the 1 lx and 4 lx modes, and twice that for the
# 0.5 lx H-resolution Mode2 (p.11).
[[sensor.input]]
name = "illuminance_lx"
default = 0.0

# Per-channel state. pwr: 1 after Power On or a measurement command, 0 in Power Down (the
# initial state, p.4). meas: 0 = data register empty (reset value 0000_0000_0000_0000, p.4),
# 1 = H-resolution, 2 = H-resolution Mode2, 3 = L-resolution. mthi / mtlo: the two halves of
# MTreg, default 0100_0101 = 69 (p.4): MT[7:5] = 010 = 2, MT[4:0] = 00101 = 5.
[[sensor.state]]
name = "pwr"
default = 0.0

[[sensor.state]]
name = "meas"
default = 0.0

[[sensor.state]]
name = "mthi"
default = 2.0

[[sensor.state]]
name = "mtlo"
default = 5.0

# Power Down 0000_0000 (p.5): no active state; the data register is kept.
[[sensor.write_command]]
name = "power_down"
match_mask = 0xFF
match_value = 0x00
group_bytes = 1

[sensor.write_command.update]
pwr = "0.0"

# Power On 0000_0001 (p.5): waiting for a measurement command.
[[sensor.write_command]]
name = "power_on"
match_mask = 0xFF
match_value = 0x01
group_bytes = 1

[sensor.write_command.update]
pwr = "1.0"

# Reset 0000_0111 (p.5): resets the illuminance data register only, and is not accepted in Power Down mode.
[[sensor.write_command]]
name = "reset"
match_mask = 0xFF
match_value = 0x07
group_bytes = 1

[sensor.write_command.update]
meas = "if(pwr > 0.5, 0.0, meas)"

# Continuously H-Resolution Mode 0001_0000 (p.5), 1 lx, 120 ms typ.
[[sensor.write_command]]
name = "cont_h"
match_mask = 0xFF
match_value = 0x10
group_bytes = 1

[sensor.write_command.update]
pwr = "1.0"
meas = "1.0"

# Continuously H-Resolution Mode2 0001_0001 (p.5), 0.5 lx, 120 ms typ.
[[sensor.write_command]]
name = "cont_h2"
match_mask = 0xFF
match_value = 0x11
group_bytes = 1

[sensor.write_command.update]
pwr = "1.0"
meas = "2.0"

# Continuously L-Resolution Mode 0001_0011 (p.5), 4 lx, 16 ms typ.
[[sensor.write_command]]
name = "cont_l"
match_mask = 0xFF
match_value = 0x13
group_bytes = 1

[sensor.write_command.update]
pwr = "1.0"
meas = "3.0"

# One Time H-Resolution Mode 0010_0000 (p.5): measures, then goes to Power Down by itself. With no conversion latency modelled the device is in Power Down at once and the result is readable.
[[sensor.write_command]]
name = "once_h"
match_mask = 0xFF
match_value = 0x20
group_bytes = 1

[sensor.write_command.update]
pwr = "0.0"
meas = "1.0"

# One Time H-Resolution Mode2 0010_0001 (p.5), then Power Down.
[[sensor.write_command]]
name = "once_h2"
match_mask = 0xFF
match_value = 0x21
group_bytes = 1

[sensor.write_command.update]
pwr = "0.0"
meas = "2.0"

# One Time L-Resolution Mode 0010_0011 (p.5), then Power Down.
[[sensor.write_command]]
name = "once_l"
match_mask = 0xFF
match_value = 0x23
group_bytes = 1

[sensor.write_command.update]
pwr = "0.0"
meas = "3.0"

# Change Measurement time, high bit: 01000_MT[7,6,5] (p.5, p.11).
[[sensor.write_command]]
name = "mt_high"
match_mask = 0xF8
match_value = 0x40
group_bytes = 1

[[sensor.write_command.field]]
name = "mt_hi_bits"
bits = [2, 0]

[sensor.write_command.update]
mthi = "mt_hi_bits"

# Change Measurement time, low bit: 011_MT[4,3,2,1,0] (p.5, p.11).
[[sensor.write_command]]
name = "mt_low"
match_mask = 0xE0
match_value = 0x60
group_bytes = 1

[[sensor.write_command.field]]
name = "mt_lo_bits"
bits = [4, 0]

[sensor.write_command.update]
mtlo = "mt_lo_bits"

# Read format (p.10): high byte [15:8] then low byte [7:0] of the 16-bit data register.
# Reads wrap at the frame end, as a master that keeps clocking would see.
[sensor.read_frame]
bytes = [
  "floor((if(meas < 0.5, 0, round(min(65535, max(0, illuminance_lx * if(meas > 1.5 && meas < 2.5, 2.4, 1.2) * (mthi * 32 + mtlo) / 69))))) / 256)",
  "(if(meas < 0.5, 0, round(min(65535, max(0, illuminance_lx * if(meas > 1.5 && meas < 2.5, 2.4, 1.2) * (mthi * 32 + mtlo) / 69))))) % 256",
]

[sensor.protocol]
style = "i2c_pointer"   # nominal: opcode framing above replaces pointer writes
'''

