# ─────────────────────────────────────────────────────────────────────────────
# TSL2591: ams very-high-sensitivity light-to-digital converter, ODFN-6 (FN).
#
# Source: ams "TSL2591 Datasheet - Apr. 2013 - ams163.5". Page numbers below are the printed
#   "TSL2591 - n" footers: pin diagram and description p.3, ordering p.4, absolute maximum
#   p.4, recommended operating conditions and operating characteristics p.5, ALS characteristics
#   p.6, AC timing p.7, register summary p.10, registers pp.11-17.
#
# ORDERING: TSL25911FN (I2C bus level = VDD) is the part carried. TSL25913FN (bus level 1.8 V,
# "contact factory for availability", p.4) has the same pad map but 1.8 V interface levels the
# datasheet does not print, so it is NOT resolved to this card.
#
# LEVELS: VIH and VIL are printed as 0.7 and 0.3 of VDD; the volts below evaluate them at the
# 3 V typical supply (derived). VOL is printed in volts (0.4 V at 3 mA, 0.6 V at 6 mA). INT and
# SDA are open drain, so no output-high level is carried.
#
# THERMAL: the datasheet prints no theta_JA / theta_JC (searched the whole document); the
# fields are left ABSENT.
#
# BUS MODEL: command-byte pointer framing (CMD bit 7 and TRANSACTION = 01 in the first byte;
# every register is declared at 0xA0 + address). The channel data registers answer from two RAW
# count inputs (ch0_counts, ch1_counts) because lux needs an empirical formula; they read 0 until
# PON and AEN are set and clamp at the ATIME maximum count.
#
# Renode (MIT, Antmicro) was not consulted for this part: every value is from the datasheet.
[[models]]
id = "tsl2591"
kind = "digital"
description = "ams TSL2591 very-high-sensitivity light sensor, ODFN-6 (fixed 0x29 address, pad map, VDD logic levels, command-byte register map with reset values, raw channel counts); no interrupt engine"

[models.match]
# TSL25911FN and the bare TSL2591 a breakout board prints. TSL25913FN (1.8 V bus) and the
# unrelated TSL2561/TSL2560/TSL2571 families are excluded by the anchored number.
value_re = "(?i)^TSL2591(?:1(?:FN)?)?$"

[models.params]
vol   = { max = 0.4, unit = "V", conditions = "3 mA sink on INT and SDA, VDD = 3 V, TA = 25 C", basis = "ams TSL2591 datasheet (Apr. 2013, ams163.5) Figure TSL2591-8 p.5, VOL 0.4 V max at 3 mA (0.6 V at 6 mA)" }
vih   = 2.1      # Figure TSL2591-8 p.5, VIH 0.7 x VDD min (SCL, SDA), derived at the 3 V typical VDD
vil   = 0.9      # Figure TSL2591-8 p.5, VIL 0.3 x VDD max (SCL, SDA), derived at the 3 V typical VDD
supply_static_ua = 275.0   # Figure TSL2591-8 p.5, IDD active typ (325 uA max); sleep is 2.3 uA typ
supply_pin = "5"           # VDD
gnd_pin    = "3"           # GND

[models.pins]
# Pin Description (Figure TSL2591-4 p.3), all six pads of the FN package.
"1" = "scl"   # SCL
"2" = "int"   # INT
"3" = "gnd"   # GND
"4" = "nc"    # NC
"5" = "vdd"   # VDD
"6" = "sda"   # SDA

[models.ratings]
# Figure TSL2591-6 p.4: VDD 3.8 V; input and output terminals -0.5 to 3.8 V; storage -40 to 85 C.
max_voltage_v = 3.8

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.7
max_v = 3.6
abs_max_v = 3.8
basis = "ams TSL2591 datasheet (Apr. 2013, ams163.5), Figure TSL2591-7 p.5 VDD 2.7 to 3.6 V (3 V typical); Figure TSL2591-6 p.4 supply voltage 3.8 V maximum"

[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "TSL2591"
bus = "i2c"
i2c_address = 0x29

# Every access starts with a COMMAND byte (Command Register, p.11): CMD (bit 7) = 1,
# TRANSACTION (bits 6:5) = 01 normal operation, ADDR (bits 4:0) = the register. The
# first byte written is the I2C pointer, so each register is declared at 0xA0 + its
# address (Figure TSL2591-16, p.10); a read through a pointer without the CMD bit finds
# no register and returns 0xFF. Sequential reads auto-increment through the declared
# registers. The special-function commands (TRANSACTION = 11: interrupt set/clear) are not
# modelled.

# Raw ADC counts on the two photodiode channels. The datasheet converts irradiance to counts
# only through channel responsivities printed at one white-LED and one 850 nm condition
# (ALS Characteristics, p.6), so the registers carry counts: 0 is the dark reset value.
[[sensor.input]]
name = "ch0_counts"
default = 0.0

[[sensor.input]]
name = "ch1_counts"
default = 0.0

# ENABLE (0x00, p.12) reads back, reset 0x00.
[[sensor.register]]
addr = 0xA0
encoding = "u8"
expr = "enable"

# CONFIG/CONTROL (0x01, p.13) reads back, reset 0x00; SRESET (bit 7) is self-clearing and reads 0.
[[sensor.register]]
addr = 0xA1
encoding = "u8"
expr = "config - 128 * cfg_sreset"

# AILTL (0x04, p.14), reset 0x00.
[[sensor.register]]
addr = 0xA4
encoding = "u8"
expr = "ailtl"

# AILTH (0x05, p.14), reset 0x00.
[[sensor.register]]
addr = 0xA5
encoding = "u8"
expr = "ailth"

# AIHTL (0x06, p.14), reset 0x00.
[[sensor.register]]
addr = 0xA6
encoding = "u8"
expr = "aihtl"

# AIHTH (0x07, p.14), reset 0x00.
[[sensor.register]]
addr = 0xA7
encoding = "u8"
expr = "aihth"

# NPAILTL (0x08, p.14), reset 0x00.
[[sensor.register]]
addr = 0xA8
encoding = "u8"
expr = "npailtl"

# NPAILTH (0x09, p.14), reset 0x00.
[[sensor.register]]
addr = 0xA9
encoding = "u8"
expr = "npailth"

# NPAIHTL (0x0A, p.14), reset 0x00.
[[sensor.register]]
addr = 0xAA
encoding = "u8"
expr = "npaihtl"

# NPAIHTH (0x0B, p.14), reset 0x00.
[[sensor.register]]
addr = 0xAB
encoding = "u8"
expr = "npaihth"

# PERSIST (0x0C, p.15) reads back, reset 0x00.
[[sensor.register]]
addr = 0xAC
encoding = "u8"
expr = "persist"

# ID (0x12, p.16): Device Identification = 0x50. The PID register (0x11) prints only its PID field (bits 5:4 = 00) and no value for the reserved bits, so it is left undeclared.
[[sensor.register]]
addr = 0xB2
const = [0x50]

# STATUS (0x13, p.16): AVALID (bit 0) = an integration has completed since AEN was set. With no conversion latency modelled it reads 1 whenever PON and AEN are both set. AINT and NPINTR (the interrupt flags) read 0: the interrupt engine is not modelled.
[[sensor.register]]
addr = 0xB3
encoding = "u8"
expr = "en_aen * en_pon"

# C0DATAL/C0DATAH/C1DATAL/C1DATAH (0x14-0x17, p.17): the channel counts, low byte first, zero while the ALS is disabled (reset 0x00) and clamped to the ATIME maximum count (37888 at 100 ms, 65535 from 200 ms, p.13). The shadow-register latch on the low-byte read is not modelled.
[[sensor.register]]
addr = 0xB4
encoding = "u8"
expr = "(if(en_aen * en_pon > 0, round(min(ch0_counts, if(cfg_atime < 0.5, 37888, 65535))), 0)) % 256"

[[sensor.register]]
addr = 0xB5
encoding = "u8"
expr = "floor((if(en_aen * en_pon > 0, round(min(ch0_counts, if(cfg_atime < 0.5, 37888, 65535))), 0)) / 256)"

[[sensor.register]]
addr = 0xB6
encoding = "u8"
expr = "(if(en_aen * en_pon > 0, round(min(ch1_counts, if(cfg_atime < 0.5, 37888, 65535))), 0)) % 256"

[[sensor.register]]
addr = 0xB7
encoding = "u8"
expr = "floor((if(en_aen * en_pon > 0, round(min(ch1_counts, if(cfg_atime < 0.5, 37888, 65535))), 0)) / 256)"

# ENABLE reset 0x00: NPIEN bit 7, SAI bit 6, AIEN bit 4, AEN bit 1, PON bit 0.
[[sensor.write_register]]
addr = 0xA0
encoding = "u8"
store = "enable"
default = 0.0

[[sensor.write_register.field]]
name = "en_npien"
bits = [7, 7]

[[sensor.write_register.field]]
name = "en_sai"
bits = [6, 6]

[[sensor.write_register.field]]
name = "en_aien"
bits = [4, 4]

[[sensor.write_register.field]]
name = "en_aen"
bits = [1, 1]

[[sensor.write_register.field]]
name = "en_pon"
bits = [0, 0]

# CONTROL reset 0x00: SRESET bit 7, AGAIN bits 5:4 (low, medium, high, max), ATIME bits 2:0 (100 ms to 600 ms).
[[sensor.write_register]]
addr = 0xA1
encoding = "u8"
store = "config"
default = 0.0

[[sensor.write_register.field]]
name = "cfg_sreset"
bits = [7, 7]

[[sensor.write_register.field]]
name = "cfg_again"
bits = [5, 4]

[[sensor.write_register.field]]
name = "cfg_atime"
bits = [2, 0]

[[sensor.write_register]]
addr = 0xA4
encoding = "u8"
store = "ailtl"
default = 0.0

[[sensor.write_register]]
addr = 0xA5
encoding = "u8"
store = "ailth"
default = 0.0

[[sensor.write_register]]
addr = 0xA6
encoding = "u8"
store = "aihtl"
default = 0.0

[[sensor.write_register]]
addr = 0xA7
encoding = "u8"
store = "aihth"
default = 0.0

[[sensor.write_register]]
addr = 0xA8
encoding = "u8"
store = "npailtl"
default = 0.0

[[sensor.write_register]]
addr = 0xA9
encoding = "u8"
store = "npailth"
default = 0.0

[[sensor.write_register]]
addr = 0xAA
encoding = "u8"
store = "npaihtl"
default = 0.0

[[sensor.write_register]]
addr = 0xAB
encoding = "u8"
store = "npaihth"
default = 0.0

# PERSIST reset 0x00: APERS bits 3:0.
[[sensor.write_register]]
addr = 0xAC
encoding = "u8"
store = "persist"
default = 0.0

[[sensor.write_register.field]]
name = "persist_apers"
bits = [3, 0]

[sensor.protocol]
style = "i2c_pointer"
'''

