# ─────────────────────────────────────────────────────────────────────────────
# BME688: Bosch Sensortec gas sensor with AI, LGA-8 3.0 x 3.0 x 0.9 mm metal lid.
#
# Source: Bosch Sensortec "BME688 Datasheet", document BST-BME688-DS000-03,
#   revision 1.3, February 2024 (technical reference code 0 273 017 016). Table 1
#   (p.7), Table 2 (p.8), Table 11 (p.15) absolute maximum ratings, Table 22
#   (pp.33-34) memory map, Section 5.3.2.1 (p.36) Variant_Id, Section 6 (p.45)
#   interface selection and I2C address, Table 23 (p.48) interface parameters,
#   Table 26 (p.51) pin description.
#
# SEPARATE CARD FROM THE BME680 because the memory map differs: Variant_Id
# (0xF0, reset 0x01) separates the BME688 from the BME680 at the same chip id
# 0x61, Gas_wait_shared (0x6E) is new, Status resets to 0x01 as printed, and
# parallel mode (mode 10) adds data fields 1 and 2 at 0x2E-0x3E and 0x3F-0x4F.
# Levels, thermal row and the I2C-only bus model follow the BME680 notes: Table 23
# fractions evaluated at the Table 1 typical VDDIO = 1.6 V (VOH/VOL at their
# printed 1.62 V); no theta_JA printed (left ABSENT); data registers answer from
# RAW ADC count inputs shared by all three fields.
#
# Renode (MIT, Antmicro) was not consulted; every value is from the datasheet.
[[models]]
id = "bme688"
kind = "digital"
description = "Bosch BME688 gas sensor with AI (gas, humidity, pressure, temperature), LGA-8 (strap-selected I2C address, pad map, VDDIO logic levels, register map with reset values incl. Variant_Id and three data fields, raw sensor data); no compensation"

[models.match]
value_re = "(?i)^BME688([-_ ].*)?$"

[models.params]
voh   = { min = 1.296, unit = "V", conditions = "VDDIO = 1.62 V, IOH = 1 mA (SDO, SDI); 0.8 x VDDIO", basis = "Table 23 p.48, Voh 0.8 x VDDIO min (0.8 x 1.62 V); derived by evaluating the printed fraction at the row's VDDIO; the 1.20 V row relaxes to 0.6 x VDDIO" }
vol   = { max = 0.324, unit = "V", conditions = "VDDIO = 1.62 V, IOL = 3 mA (I2C, Vol_SDI); 0.2 x VDDIO", basis = "Table 23 p.48, Vol_SDI 0.2 x VDDIO max (0.2 x 1.62 V); derived by evaluating the printed fraction at the row's VDDIO; the 1.20 V row is 0.23 x VDDIO" }
vih   = 1.28     # Vih_si 0.8 x VDDIO min, derived at the Table 1 typical VDDIO = 1.6 V
vil   = 0.32     # Vil_si 0.2 x VDDIO max, derived at VDDIO = 1.6 V
supply_static_ua = 3.7     # p.3 key features, 3.7 uA at 1 Hz humidity, pressure and temperature (typ);
                           # excludes the gas heater (IDD 12 mA typ with the heater on, Table 2 p.8).
supply_pin = "8"           # VDD
gnd_pin    = "1"           # GND

[models.pins]
# Table 26 Pin description, LGA-8. Numbering direction follows the
# datasheet's connection diagram (see the BME280 entry in digital.toml for the
# direction caveat); SDI/SCK use the bus vocabulary.
"1" = "gnd"
"2" = "csb"      # chip select; VDDIO selects I2C
"3" = "sda"      # SDI: I2C SDA / SPI SDI
"4" = "scl"      # SCK: I2C SCL / SPI SCK
"5" = "sdo"      # SPI data out; in I2C the address LSB (GND = 0x76, VDDIO = 0x77)
"6" = "vddio"    # interface supply, 1.2 to 3.6 V
"7" = "gnd2"
"8" = "vdd"      # supply, 1.71 to 3.6 V

[models.ratings]
# Table 11 p.15: VDD and VDDIO pins -0.3 to 4.25 V; interface pins -0.3 V to VDDIO + 0.3 V;
# storage -45 to +85 C; ESD HBM 2 kV.
max_voltage_v = 4.25

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.71
max_v = 3.6
abs_max_v = 4.25
basis = "Bosch BST-BME688-DS000-03, Table 1 p.7 Supply Voltage Internal Domains VDD row (ripple max 50 mVpp); Table 11 p.15 supply pin maximum"

[[models.envelope]]
kind = "supply_range"
pin = "vddio"
min_v = 1.2
max_v = 3.6
abs_max_v = 4.25
basis = "Bosch BST-BME688-DS000-03, Table 1 p.7 Supply Voltage I/O Domain VDDIO row; Table 11 p.15 supply pin maximum"

# Sections 6.1-6.2 (p.45): "If CSB is connected to VDDIO, the I2C interface is active."
# SDO to GND gives 1110110 (0x76), SDO to VDDIO gives 1110111 (0x77); "The SDO
# pin cannot be left floating".
[models.peripheral]
kind = "register_map"
required_high_roles = ["csb"]
address_select_role = "sdo"
address_when_low = 0x76
address_when_high = 0x77
spec_toml = '''
[sensor]
name = "BME688"
bus = "i2c"
i2c_address = 0x76

# RAW ADC counts (the Bosch compensation needs per-device calibration
# parameters the datasheet does not print values for). Defaults are the Table 22
# reset values: 524288 = 0x80000 (press, temp), 32768 = 0x8000 (hum), gas 0. All
# three parallel-mode data fields report the same inputs (the sequencer is not
# modelled).
[[sensor.input]]
name = "adc_press"
default = 524288.0

[[sensor.input]]
name = "adc_temp"
default = 524288.0

[[sensor.input]]
name = "adc_hum"
default = 32768.0

[[sensor.input]]
name = "adc_gas"
default = 0.0

[[sensor.input]]
name = "gas_range"
default = 0.0

# Field 0 0x1D meas_status_0 (reset 0x00): new_data bit 7 is set while a measurement mode is selected (instant conversion).
[[sensor.register]]
addr = 0x1D
encoding = "u8"
expr = "if(mode > 0, 128, 0)"

# Field 0 0x1E sub_meas_index_0, reset 0x00 (the parallel sequencer is not modelled).
[[sensor.register]]
addr = 0x1E
const = [0x00]

# Field 0 0x1F-0x21 press_msb/lsb/xlsb<7:4>, reset 80 00 00.
[[sensor.register]]
addr = 0x1F
encoding = "u20_be_xlsb"
expr = "if(osrs_p > 0, adc_press, 524288)"

# Field 0 0x22-0x24 temp_msb/lsb/xlsb<7:4>, reset 80 00 00.
[[sensor.register]]
addr = 0x22
encoding = "u20_be_xlsb"
expr = "if(osrs_t > 0, adc_temp, 524288)"

# Field 0 0x25-0x26 hum_msb/lsb, reset 80 00.
[[sensor.register]]
addr = 0x25
encoding = "u16_be"
expr = "if(osrs_h > 0, adc_hum, 32768)"

# Field 0 0x2C-0x2D gas_r_msb / gas_r_lsb (gas_r<1:0> bits 7:6, gas_valid_r bit 5, heat_stab_r bit 4, gas_range_r bits 3:0), reset 00 00.
[[sensor.register]]
addr = 0x2C
encoding = "u16_be"
expr = "if(run_gas > 0, adc_gas * 64 + 48 + gas_range, 0)"

# Field 1 0x2E meas_status_1 (reset 0x00): new_data bit 7 is set while a measurement mode is selected (instant conversion).
[[sensor.register]]
addr = 0x2E
encoding = "u8"
expr = "if(mode > 0, 128, 0)"

# Field 1 0x2F sub_meas_index_1, reset 0x00 (the parallel sequencer is not modelled).
[[sensor.register]]
addr = 0x2F
const = [0x00]

# Field 1 0x30-0x32 press_msb/lsb/xlsb<7:4>, reset 80 00 00.
[[sensor.register]]
addr = 0x30
encoding = "u20_be_xlsb"
expr = "if(osrs_p > 0, adc_press, 524288)"

# Field 1 0x33-0x35 temp_msb/lsb/xlsb<7:4>, reset 80 00 00.
[[sensor.register]]
addr = 0x33
encoding = "u20_be_xlsb"
expr = "if(osrs_t > 0, adc_temp, 524288)"

# Field 1 0x36-0x37 hum_msb/lsb, reset 80 00.
[[sensor.register]]
addr = 0x36
encoding = "u16_be"
expr = "if(osrs_h > 0, adc_hum, 32768)"

# Field 1 0x3D-0x3E gas_r_msb / gas_r_lsb (gas_r<1:0> bits 7:6, gas_valid_r bit 5, heat_stab_r bit 4, gas_range_r bits 3:0), reset 00 00.
[[sensor.register]]
addr = 0x3D
encoding = "u16_be"
expr = "if(run_gas > 0, adc_gas * 64 + 48 + gas_range, 0)"

# Field 2 0x3F meas_status_2 (reset 0x00): new_data bit 7 is set while a measurement mode is selected (instant conversion).
[[sensor.register]]
addr = 0x3F
encoding = "u8"
expr = "if(mode > 0, 128, 0)"

# Field 2 0x40 sub_meas_index_2, reset 0x00 (the parallel sequencer is not modelled).
[[sensor.register]]
addr = 0x40
const = [0x00]

# Field 2 0x41-0x43 press_msb/lsb/xlsb<7:4>, reset 80 00 00.
[[sensor.register]]
addr = 0x41
encoding = "u20_be_xlsb"
expr = "if(osrs_p > 0, adc_press, 524288)"

# Field 2 0x44-0x46 temp_msb/lsb/xlsb<7:4>, reset 80 00 00.
[[sensor.register]]
addr = 0x44
encoding = "u20_be_xlsb"
expr = "if(osrs_t > 0, adc_temp, 524288)"

# Field 2 0x47-0x48 hum_msb/lsb, reset 80 00.
[[sensor.register]]
addr = 0x47
encoding = "u16_be"
expr = "if(osrs_h > 0, adc_hum, 32768)"

# Field 2 0x4E-0x4F gas_r_msb / gas_r_lsb (gas_r<1:0> bits 7:6, gas_valid_r bit 5, heat_stab_r bit 4, gas_range_r bits 3:0), reset 00 00.
[[sensor.register]]
addr = 0x4E
encoding = "u16_be"
expr = "if(run_gas > 0, adc_gas * 64 + 48 + gas_range, 0)"

# 0x73 Status (spi_mem_page), reset 0x01 as printed in Table 22 (the BME680 prints 0x00); irrelevant on I2C.
[[sensor.register]]
addr = 0x73
const = [0x01]

# 0xD0 Chip_Id, reset 0x61 (same value as the BME680).
[[sensor.register]]
addr = 0xD0
const = [0x61]

# 0xF0 Variant_Id, reset 0x01: Section 5.3.2.1 'For BME688 - 0x01' distinguishes the BME688 from the BME680 at the same chip id.
[[sensor.register]]
addr = 0xF0
const = [0x01]

# Idac_heat_x 0x50-0x59, Res_heat_x 0x5A-0x63, Gas_wait_x 0x64-0x6D: ten set-points each,
# reset 0x00 (Table 'Memory map'); the heater itself is not modelled.
[[sensor.write_register]]
addr = 0x50
encoding = "u8"
store = "idac_heat_0"
default = 0.0

[[sensor.write_register]]
addr = 0x51
encoding = "u8"
store = "idac_heat_1"
default = 0.0

[[sensor.write_register]]
