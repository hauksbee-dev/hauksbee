# ─────────────────────────────────────────────────────────────────────────────
# MLX90614 Axx (5 V): Melexis single and dual zone IR thermometer, TO39 (SF).
#
# Source: Melexis "MLX90614 Single and dual zone IR sensor in TO39", Datasheet Rev 021
#   (Doc server Rev 012), 02-Jun-2026. Page numbers are the printed "Page N of 58" footers:
#   ordering p.2, pin description p.6, Absolute Maximum Ratings p.7, Axx electrical p.8, Bxx and
#   Dxx electrical p.9 (notes p.10), EEPROM table p.12, RAM table p.16, SMBus commands p.19,
#   read word, write word and flags p.20, temperature conversion pp.29-30, marking convention p.50.
#
# VARIANTS: the supply option (the letter after the SF package code: A = 5 V, B = 3 V, D = 3 V
# medical) sets the supply range, absolute maximum, input-high level and the sleep mode, so the
# mlx90614 variant family has a 3 V card (mlx90614_3v: Bxx and Dxx) and a 5 V card (mlx90614_5v:
# Axx). The pad map is the same, so a bare "MLX90614" binds the first by id, the 3 V card, as a
# flagged stand-in; the ordering code (MLX90614ESF-BCC-000-TU, MLX90614KSF-ACC-000-TU) selects.
# Temperature grade (E = -40..85 C, K = -40..125 C), zone count (xAx single, xBx dual, xCx gradient
# compensated) and field of view change only accuracy and optics, which are not card parameters.
#
# LEVELS: SDA is open drain in SMBus mode, so no output-high level is carried (VOUT_H applies to
# the PWM and thermal-relay output). VOL is printed in volts (0.2 V max at 2 mA).
#
# THERMAL: the datasheet prints no thermal resistance or junction temperature (searched the whole
# document); those fields are left ABSENT.
#
# BUS MODEL: SMBus Read Word and Write Word with the command byte as the pointer: TA (0x06), TOBJ1
# (0x07) from two temperature inputs in 0.02 K/LSB, the emissivity EEPROM word (0x24, factory
# 0xFFFF), and the read-flags word (0xF0). The PEC byte is not generated. SLEEP: the 5 V parts have no sleep mode (Note 6 p.10), so no low-power current is carried.
#
# Renode (MIT, Antmicro) was not consulted for this part: every value is from the datasheet.
[[models]]
id = "mlx90614_5v"
kind = "digital"
description = "Melexis MLX90614 IR thermometer, TO39, Axx (5 V) (fixed 0x5A SMBus address, pad map, supply range and levels, command-byte register map with ambient and object temperature words); no PEC, no PWM or thermal-relay mode"
variant_of = "mlx90614"

[models.match]
# One shared family match: the bare number and every product code (temperature E/K, SF package,
# supply A/B/D, zones A/B/C, field-of-view A/C/F/H/I/K, option 000, packing TU). MLX90615 and
# MLX90632 are different parts and fall outside the anchored number.
value_re = "(?i)^MLX90614(?:[EK]SF(?:-?[ABD][ABC][ACFHIK](?:-?000(?:-?TU)?)?)?)?$"

[models.variant]
orderable_re = '^MLX90614[EK]SF-?A[ABC][ACFHIK](-?000(-?TU)?)?$'
orderable = ["MLX90614ESF-ACC-000-TU", "MLX90614KSF-ACC-000-TU"]
basis = "Melexis MLX90614 datasheet Rev 021 Ordering information p.2 (Table 1) and the marking convention Table 20 p.50"

[models.params]
vol   = { max = 0.2, unit = "V", conditions = "ISINK = 2 mA on SDA, over Ta and VDD", basis = "Melexis MLX90614 datasheet Rev 021 Table 5 p.8, VOL 0.2 V max" }
vih   = 3.0      # Table 5 p.8, VIN_H 3 V min (SDA, SCL), over Ta and VDD
vil   = 0.6      # Table 5 p.8, VIN_L 0.6 V max (SDA, SCL), over Ta and VDD
supply_static_ua = 1300.0   # Table 5 p.8, IDD typ (2.5 mA max)
supply_pin = "3"            # VDD
gnd_pin    = "4"            # VSS

[models.pins]
# Table 2 p.6, all four TO39 pins. Pin 1 doubles as the 5.7 V zener Vz on the 5 V parts.
"1" = "scl"   # SCL / Vz
"2" = "sda"   # SDA / PWM
"3" = "vdd"   # VDD
"4" = "gnd"   # VSS

[models.ratings]
# Table 3 p.7: supply voltage 7.0 V for less than 24 hours (Axx (5 V)).
max_voltage_v = 7.0

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 4.5
max_v = 5.5
abs_max_v = 7.0
basis = "Melexis MLX90614 datasheet Rev 021, Table 4 p.8 VDD 4.5 to 5.5 V (5.0 V nominal, +/- 50 mV); Table 3 p.7, Supply voltage Axx type 7 V (< 24 hours)"

[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "MLX90614 5V"
bus = "i2c"
# Slave address SA = 0x5A at the factory (Table 5 p.8 and Table 7 p.9). It is the LSB-programmable
# EEPROM word 0x2E (Table 8 p.12), not a strap, so the card carries no address strap.
i2c_address = 0x5A

# TO39 pad map (Table 2 p.6), the same as [models.pins].
[sensor.pins]
1 = "scl"
2 = "sda"
3 = "vdd"
4 = "gnd"

# Ambient (die) and object temperatures in degrees C. The device reports both as RAM words in
# 0.02 K per LSB (Section 4.1.8 pp.29-30); the defaults are a nominal 25 C room.
[[sensor.input]]
name = "ta_c"
default = 25.0

[[sensor.input]]
name = "to_c"
default = 25.0

# SMBus access is Read Word / Write Word only (Section 4.1.4.2 p.17); the first byte is the
# command (Table 15 p.19): 000x xxxx RAM, 001x xxxx EEPROM, 1111 0000 read flags. The command byte is
# the I2C pointer, so each word is declared at its command byte and read low byte first. The
# trailing PEC byte (CRC-8, Figure 6 p.20) is NOT generated: the interpreter has no trailer byte,
# so a third byte read returns the next declared word instead.

# TA, RAM 0x06 (Table 14 p.16): the die temperature in 0.02 K per LSB, (Ta + 273.15) / 0.02, clamped to the linearisation limits 0x2DE4 (-38.2 C) and 0x4DC4 (+125 C), Section 4.1.8.1 p.29. The MSb error flag stays 0.
[[sensor.register]]
addr = 0x06
encoding = "u16_le"
expr = "min(19908, max(11748, round((ta_c + 273.15) / 0.02)))"

# TOBJ1, RAM 0x07 (Table 14 p.16): the object temperature in 0.02 K per LSB, clamped to 0x27AD (-70 C) .. 0x7FFF (382.19 C), Section 4.1.8.2 p.30. The MSb error flag stays 0. TOBJ2 (0x08) exists on dual-zone parts only and the raw IR words (0x04, 0x05) are sign-and-magnitude sensor counts; neither is declared, so they read 0xFF.
[[sensor.register]]
addr = 0x07
encoding = "u16_le"
expr = "min(32767, max(10157, round((to_c + 273.15) / 0.02)))"

# Emissivity, EEPROM 0x04 read at command 0x24 (Table 8 p.12): reads back the stored word, factory default 0xFFFF = 1.0 (emissivity = round(65535 x e)). The other user EEPROM words (Tomax, Tomin, PWMCTRL, Ta range, Config Register 1, SMBus address) carry factory calibration values that are not printed, so they are not declared.
[[sensor.register]]
addr = 0x24
encoding = "u16_le"
expr = "emissivity"

# Read flags, command 0xF0 (Table 15 p.19, Figure 9 p.20): the typical flags word is 0x0010, INIT = 1 (POR initialisation complete), EE_DEAD = 0, EEBUSY = 0 (Table 16 p.20).
[[sensor.register]]
addr = 0xF0
const = [0x10, 0x00]

# Write Word to EEPROM 0x04 (command 0x24, Figure 7 p.20): the datasheet's erase-then-write sequence (write 0x0000, wait 5 ms, write the value) lands as two plain stores, and the 5 ms cell time is not modelled. Emissivity does not scale the temperature words here.
[[sensor.write_register]]
addr = 0x24
encoding = "u16_le"
store = "emissivity"
default = 65535.0

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.75   # Table 5 p.8, VPOR_UP typ (1.4 V min, 1.95 V max)
idle_a = 0.0013               # Table 5 p.8, IDD typ
read_a = 0.0013
write_a = 0.0013


[models.coverage]
implements = ["pin_roles", "logic_levels", "active_supply_current", "absolute_ratings", "supply_range", "fixed_smbus_address", "register_map", "ambient_temperature_word", "object_temperature_word", "temperature_clamp_limits", "read_flags_word", "emissivity_eeprom_word", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["pec_byte", "tobj2_dual_zone", "raw_ir_channel_words", "calibration_eeprom_words_not_printed", "eeprom_erase_write_timing", "smbus_address_reprogramming", "emissivity_scaling_of_to", "sleep_command_and_wake_up", "pwm_and_thermal_relay_output", "iir_fir_filter_settling", "output_valid_after_por", "error_flag_msb", "thermal_resistance_not_printed"]

