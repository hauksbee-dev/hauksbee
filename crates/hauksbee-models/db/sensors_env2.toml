addr = 0xAC
encoding = "u16_le"
expr = "if(control % 4 > 2.5, round(min(ch0_counts, if(tim_integ < 0.5, 5047, if(tim_integ < 1.5, 37177, 65535)))), 0)"

# Channel 1 ADC count as a word (DATA1LOW then DATA1HIGH).
[[sensor.register]]
addr = 0xAE
encoding = "u16_le"
expr = "if(control % 4 > 2.5, round(min(ch1_counts, if(tim_integ < 0.5, 5047, if(tim_integ < 1.5, 37177, 65535)))), 0)"

# CONTROL reset 00h: POWER bits 1:0 (03h powers up, 00h powers down).
[[sensor.write_register]]
addr = 0x80
encoding = "u8"
store = "control"
default = 0.0

[[sensor.write_register.field]]
name = "ctl_power"
bits = [1, 0]

# TIMING reset 02h: GAIN bit 4, Manual bit 3, INTEG bits 1:0.
[[sensor.write_register]]
addr = 0x81
encoding = "u8"
store = "timing"
default = 2.0

[[sensor.write_register.field]]
name = "tim_gain"
bits = [4, 4]

[[sensor.write_register.field]]
name = "tim_manual"
bits = [3, 3]

[[sensor.write_register.field]]
name = "tim_integ"
bits = [1, 0]

# Low interrupt threshold, written as a word (Write Word protocol; the datasheet says byte-paired registers are written together, Table 7 note p.16). Reset 0000h. Single-byte writes to 2h/3h are not modelled.
[[sensor.write_register]]
addr = 0xA2
encoding = "u16_le"
store = "thresh_low"
default = 0.0

# High interrupt threshold, written as a word; reset 0000h.
[[sensor.write_register]]
addr = 0xA4
encoding = "u16_le"
store = "thresh_high"
default = 0.0

# INTERRUPT reset 00h: INTR bits 5:4, PERSIST bits 3:0.
[[sensor.write_register]]
addr = 0x86
encoding = "u8"
store = "intr"
default = 0.0

[[sensor.write_register.field]]
name = "intr_mode"
bits = [5, 4]

[[sensor.write_register.field]]
name = "intr_persist"
bits = [3, 0]

[sensor.protocol]
style = "i2c_pointer"
'''

