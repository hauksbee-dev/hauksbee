# Official built-in part library: sensors_env2.
#
# Cards here are written from vendor datasheets only (every value carries a basis and a source).
# See target/launch/official-parts-20261022/ranking.md for the batch plan.


# ─────────────────────────────────────────────────────────────────────────────
# BMP388: Bosch Sensortec digital barometric pressure sensor, 10-pin metal-lid
# LGA 2.0 x 2.0 x 0.75 mm.
#
# Source: Bosch Sensortec "BMP388 Datasheet", document BST-BMP388-DS001-07,
#   revision 1.7, November 2020 (technical reference code 0 273 300 511). Page
#   numbers below are the printed page numbers. Table 2 (pp.7-8) operating
#   conditions, Table 3 (p.9) absolute maximum ratings, Table 21 (p.26) current
#   consumption, Table 24 (pp.30-31) memory map, Section 5.1 (p.40) interface
#   selection, Section 5.2 (p.40-41) I2C address, Table 47 (p.43) interface
#   parameters, Table 50 (p.46) pin description.
#
# LEVELS: Table 47 prints Vil, Vih, Vol and Voh as fractions of VDDIO and never
# in volts. The volts below are those fractions evaluated at the Table 2 typical
# VDDIO = 1.8 V (the printed fractions are kept as characteristic records). They
# are wrong by the ratio on a board with another interface rail; Vol and Voh are
# printed at a test current (3 mA, 1 mA) without a VDDIO, so they are also
# evaluated at 1.8 V and are rows of a loaded level (the loader turns them into the
# rail behind an output resistance, the rail ASSUMED because no light-load row
# is printed).
#
# THERMAL: the datasheet prints no theta_JA / theta_JC for the LGA package
# (searched Tables 2, 3 and Section 7); the field is left ABSENT.
#
# BUS MODEL: I2C only (CSB high selects I2C, SDO selects 0x76 or 0x77). The
# registers are the full Table 24 map except the NVM trimming block 0x31-0x45
# (device specific, not printed) and the reserved gaps, which read 0xFF. The
# data registers answer from two RAW 24-bit ADC count inputs (press_raw,
# temp_raw), because the printed conversion needs the unprinted per-device
# trimming coefficients; with the enables clear they read the Table 24 reset
# value 0x800000 (output skipped).
#
# Renode (MIT, Antmicro) was not consulted for this part: the register map and
# every value are from the datasheet only.
[[models]]
id = "bmp388"
kind = "digital"
description = "Bosch BMP388 barometric pressure sensor, 10-pin LGA (strap-selected I2C address, pad map, VDDIO logic levels, register map with reset values, raw pressure/temperature data); no compensation"

[models.match]
# Bare part number; the Bosch reference code 0 273 300 511 is not a value
# spelling. BMP390 (chip id 0x60, different die), BMP280, BMP581 and BMP180 are
# different parts and are excluded by the anchored number.
value_re = "(?i)^BMP388$"

[models.params]
voh   = { min = 1.44, unit = "V", conditions = "VDDIO = 1.8 V (Table 2 typ), IOH = 1 mA (SDI, SDO, INT); 0.8 x VDDIO", basis = "Table 47 p.43, Voh 0.8 x VDDIO min; derived by evaluating the printed fraction at VDDIO = 1.8 V" }
vol   = { max = 0.36, unit = "V", conditions = "VDDIO = 1.8 V (Table 2 typ), IOL = 3 mA (SDI, SDO, INT); 0.2 x VDDIO", basis = "Table 47 p.43, Vol 0.2 x VDDIO max; derived by evaluating the printed fraction at VDDIO = 1.8 V" }
vih   = 1.26     # Table 47 p.43, Vih 0.7 x VDDIO min (SCK, SDI, CSB), derived at VDDIO = 1.8 V
vil   = 0.45     # Table 47 p.43, Vil 0.25 x VDDIO max (SCK, SDI, CSB), derived at VDDIO = 1.8 V
supply_static_ua = 46.4    # Table 21 p.26, highest resolution (x32 / x2) at 1 Hz forced mode, typ; the
                           # largest duty-cycled figure tabulated (ultra low power is 3.4 uA). The
                           # conversion peak is 700 uA typ / 800 uA max (Table 2) and is not carried.
supply_pin = "10"          # VDD
gnd_pin    = "3"           # VSS

[models.pins]
# Table 50 Pin description, all 10 pads. SCK/SDI use the bus vocabulary.
"1"  = "vddio"   # digital interface supply, 1.2 to 3.6 V
"2"  = "scl"     # SCK: I2C SCL / SPI SCK
"3"  = "gnd"
"4"  = "sda"     # SDI: I2C SDA / SPI SDI (3-wire SDI/SDO)
"5"  = "sdo"     # SPI data out; in I2C the address LSB (GND = 0x76, VDDIO = 0x77)
"6"  = "csb"     # chip select; VDDIO selects I2C (Section 5.1)
"7"  = "int"     # interrupt output
"8"  = "gnd2"
"9"  = "gnd3"
"10" = "vdd"     # analog supply, 1.65 to 3.6 V

[models.ratings]
# Table 3 p.9: VDD and VDDIO pins -0.3 to 3.8 V; interface pins Vss -0.3 V to
# VDDIO + 0.3 V; storage -45 to +85 C; ESD HBM class 2 (2 kV).
max_voltage_v = 3.8

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.65
max_v = 3.6
abs_max_v = 3.8
basis = "Bosch BST-BMP388-DS001-07, Table 2 p.7 Sensor supply voltage VDD row (ripple max 50 mVpp); Table 3 p.9 supply pin maximum"

[[models.envelope]]
kind = "supply_range"
pin = "vddio"
min_v = 1.2
max_v = 3.6
abs_max_v = 3.8
basis = "Bosch BST-BMP388-DS001-07, Table 2 p.7 Interface supply voltage VDDIO row; Table 3 p.9 supply pin maximum"

# Section 5.1 (p.40): "If CSB is connected to VDDIO, the I2C interface is
# active." Section 5.2 (p.40): SDO to GND gives 1110110 (0x76), SDO to VDDIO
# gives 1110111 (0x77); "The SDO pin cannot be left floating".
[models.peripheral]
kind = "register_map"
required_high_roles = ["csb"]
address_select_role = "sdo"
address_when_low = 0x76
address_when_high = 0x77
spec_toml = '''
[sensor]
name = "BMP388"
bus = "i2c"
i2c_address = 0x76

# RAW 24-bit ADC counts. The datasheet's compensation needs the per-device NVM
# trimming coefficients (Table 23, registers 0x31-0x45) which are not printed, so
# the registers report the uncompensated counts. 8388608 = 0x800000 is the Table
# 24 reset value of DATA_2 / DATA_5 (output skipped).
[[sensor.input]]
name = "press_raw"
default = 8388608.0

[[sensor.input]]
name = "temp_raw"
default = 8388608.0

# Table 24 memory map (pp.30-31), reset values as printed.
# 0x00 CHIP_ID, reset 0x50.
[[sensor.register]]
addr = 0x00
const = [0x50]

# 0x02 ERR_REG, reset 0x00 (fatal_err, cmd_err, conf_err clear).
[[sensor.register]]
addr = 0x02
const = [0x00]

# 0x03 STATUS (Table 27 p.32): cmd_rdy bit 4 (1 = command decoder ready), drdy_press
# bit 5, drdy_temp bit 6. Table 24 prints the reset value 0x00 for the instant before
# the decoder is ready; an idle device reads cmd_rdy = 1, so 0x10 is carried (ASSUMED
# from the Table 27 bit meaning). The data-ready bits are set while a measurement mode
# is selected and the channel is enabled; conversion time and clear-on-read are not
# modelled.
[[sensor.register]]
addr = 0x03
encoding = "u8"
expr = "16 + if(mode > 0, 32 * press_en + 64 * temp_en, 0)"

# 0x04-0x06 DATA_0..DATA_2 pressure (XLSB, LSB, MSB), 0x07-0x09 DATA_3..DATA_5
# temperature. Reset 00 00 80 / 00 00 80.
[[sensor.register]]
addr = 0x04
encoding = "u8"
expr = "if(press_en > 0, press_raw % 256, 0)"

[[sensor.register]]
addr = 0x05
encoding = "u8"
expr = "if(press_en > 0, floor(press_raw / 256) % 256, 0)"

[[sensor.register]]
addr = 0x06
encoding = "u8"
expr = "if(press_en > 0, floor(press_raw / 65536), 128)"

[[sensor.register]]
addr = 0x07
encoding = "u8"
expr = "if(temp_en > 0, temp_raw % 256, 0)"

[[sensor.register]]
addr = 0x08
encoding = "u8"
expr = "if(temp_en > 0, floor(temp_raw / 256) % 256, 0)"

[[sensor.register]]
addr = 0x09
encoding = "u8"
expr = "if(temp_en > 0, floor(temp_raw / 65536), 128)"

# 0x0C-0x0E SENSORTIME_0..2, reset 0x00 (the free-running counter is not modelled).
[[sensor.register]]
addr = 0x0C
const = [0x00]

[[sensor.register]]
addr = 0x0D
const = [0x00]

[[sensor.register]]
addr = 0x0E
const = [0x00]

# 0x10 EVENT, reset 0x01 (por_detected after power-up).
[[sensor.register]]
addr = 0x10
const = [0x01]

# 0x11 INT_STATUS, 0x12 FIFO_LENGTH_0, 0x13 FIFO_LENGTH_1, 0x14 FIFO_DATA: reset 0x00
# (FIFO empty; the FIFO is not modelled).
[[sensor.register]]
addr = 0x11
const = [0x00]

[[sensor.register]]
addr = 0x12
const = [0x00]

[[sensor.register]]
addr = 0x13
const = [0x00]

[[sensor.register]]
addr = 0x14
const = [0x00]

# 0x15 FIFO_WTM_0, reset 0x01.
[[sensor.write_register]]
addr = 0x15
encoding = "u8"
store = "fifo_wtm_0"
default = 1.0

# 0x16 FIFO_WTM_1, reset 0x00.
[[sensor.write_register]]
addr = 0x16
encoding = "u8"
store = "fifo_wtm_1"
default = 0.0

# 0x17 FIFO_CONFIG_1, reset 0x02.
[[sensor.write_register]]
addr = 0x17
encoding = "u8"
store = "fifo_config_1"
default = 2.0

# 0x18 FIFO_CONFIG_2, reset 0x02.
[[sensor.write_register]]
addr = 0x18
encoding = "u8"
store = "fifo_config_2"
default = 2.0

# 0x19 INT_CTRL, reset 0x02 (int_level high-active bit 1 per the reset value).
[[sensor.write_register]]
addr = 0x19
encoding = "u8"
store = "int_ctrl"
default = 2.0

# 0x1A IF_CONF, reset 0x00 (spi3 bit 0, i2c_wdt_en bit 1, i2c_wdt_sel bit 2).
[[sensor.write_register]]
addr = 0x1A
encoding = "u8"
store = "if_conf"
default = 0.0

# 0x1B PWR_CTRL, reset 0x00: press_en bit 0, temp_en bit 1, mode bits 5:4
# (00 sleep, 01 and 10 forced, 11 normal).
[[sensor.write_register]]
addr = 0x1B
encoding = "u8"
store = "pwr_ctrl"
default = 0.0

[[sensor.write_register.field]]
name = "press_en"
bits = [0, 0]

[[sensor.write_register.field]]
name = "temp_en"
bits = [1, 1]

[[sensor.write_register.field]]
name = "mode"
bits = [5, 4]

# 0x1C OSR, reset 0x02: osr_p bits 2:0, osr_t bits 5:3.
[[sensor.write_register]]
addr = 0x1C
encoding = "u8"
store = "osr"
default = 2.0

[[sensor.write_register.field]]
name = "osr_p"
bits = [2, 0]

[[sensor.write_register.field]]
name = "osr_t"
bits = [5, 3]

# 0x1D ODR, reset 0x00: odr_sel bits 4:0.
[[sensor.write_register]]
addr = 0x1D
encoding = "u8"
store = "odr"
default = 0.0

[[sensor.write_register.field]]
name = "odr_sel"
bits = [4, 0]

# 0x1F CONFIG, reset 0x00: iir_filter bits 3:1.
[[sensor.write_register]]
addr = 0x1F
encoding = "u8"
store = "config"
default = 0.0

[[sensor.write_register.field]]
name = "iir_filter"
bits = [3, 1]

# 0x7E CMD, reset 0x00 (write-only; the soft-reset and fifo_flush commands are not modelled).
[[sensor.write_register]]
addr = 0x7E
encoding = "u8"
store = "cmd"
default = 0.0

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.65   # Table 2 p.7, VDD min
idle_a = 0.0000464            # Table 21 p.26, highest resolution at 1 Hz forced, typ
read_a = 0.0000464
write_a = 0.0000464
low_power_a = 0.000002        # Table 2 p.7, IDD,sleep typ

[models.coverage]
implements = ["pin_roles", "logic_levels_at_1v8_vddio", "duty_cycled_supply_current", "absolute_ratings", "supply_ranges", "i2c_bus_mode_strap", "i2c_address_strap", "register_map", "chip_id_read", "reset_values", "config_register_readback", "raw_pressure_temperature_data", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["spi_register_map", "nvm_trimming_coefficients", "compensated_pressure_temperature", "forced_mode_return_to_sleep", "data_ready_clear_on_read", "measurement_timing", "fifo", "interrupt_engine", "soft_reset_command", "sensor_time_counter", "iir_filter", "conversion_peak_current", "thermal_resistance_not_printed"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bmp388-ds001.pdf"
title = "Bosch Sensortec BMP388 Datasheet, BST-BMP388-DS001-07, revision 1.7, November 2020"
locator = "Table 2 pp.7-8; Table 3 p.9; Table 21 p.26; Table 24 memory map pp.30-31; Table 27 p.32; Sections 5.1-5.2 pp.40-41; Table 47 p.43; Table 50 Pin description p.46"
sha256 = "1ab21c90aaf15542751be6b970d53dc57893a4ea948f45f9fe96e844789fdec2"

[[models.source.pinout]]
package = "LGA-10 2.0 x 2.0 mm metal lid"
pins = { "1" = "VDDIO", "2" = "SCK", "3" = "VSS", "4" = "SDI", "5" = "SDO", "6" = "CSB", "7" = "INT", "8" = "VSS", "9" = "VSS", "10" = "VDD" }

[[models.source.characteristic]]
parameter = "Vil input low level (SCK, SDI, CSB)"
max = 0.25
unit = "VDDIO"
conditions = "fraction of VDDIO"
basis = "Table 47 p.43, 0.25 VDDIO max"

[[models.source.characteristic]]
parameter = "Vih input high level (SCK, SDI, CSB)"
min = 0.7
unit = "VDDIO"
conditions = "fraction of VDDIO"
basis = "Table 47 p.43, 0.7 VDDIO min"

[[models.source.characteristic]]
parameter = "Vol output low level (SDI, SDO, INT)"
max = 0.2
unit = "VDDIO"
conditions = "IOL = 3 mA"
basis = "Table 47 p.43, 0.2 VDDIO max"

[[models.source.characteristic]]
parameter = "Voh output high level (SDI, SDO, INT)"
min = 0.8
unit = "VDDIO"
conditions = "IOH = 1 mA"
basis = "Table 47 p.43, 0.8 VDDIO min"

[[models.source.characteristic]]
parameter = "Rcsb CSB internal pull-up to VDDIO"
min = 75
typ = 100
max = 125
unit = "kOhm"
conditions = "internal pull-up resistance to VDDIO"
basis = "Table 47 p.43"

[[models.source.characteristic]]
parameter = "Storage temperature"
min = -45
max = 85
unit = "C"
conditions = "<= 65 % rel. H."
basis = "Table 3 p.9"

[[models.source.characteristic]]
parameter = "Ipeak supply current during pressure measurement"
typ = 700
max = 800
unit = "uA"
conditions = "VDD = VDDIO"
basis = "Table 2 p.7"

[[models.source.characteristic]]
parameter = "IDDT supply current during temperature measurement"
typ = 300
max = 400
unit = "uA"
conditions = "VDD = VDDIO"
basis = "Table 2 p.7"

[[models.source.characteristic]]
parameter = "tstartup time to first communication"
max = 2
unit = "ms"
conditions = "after both VDD > 1.58 V and VDDIO > 0.65 V"
basis = "Table 2 p.8"

# ─────────────────────────────────────────────────────────────────────────────
# BMP390: Bosch Sensortec digital barometric pressure sensor, 10-pin metal-lid
# LGA 2.0 x 2.0 x 0.75 mm. Same pad order and I2C addressing as the BMP388 but a
# different die (CHIP_ID 0x60, REV_ID register 0x01, short_in bit in CONFIG),
# tighter supply absolute maximum (3.6 V) and different electrical figures.
#
# Source: Bosch Sensortec "BMP390 Datasheet", document BST-BMP390-DS002-07,
#   revision 1.7, March 2021 (technical reference code 0 273 017 014). Page
#   numbers are the printed page numbers. Table 2 (pp.7-8), Table 3 (p.9),
#   Table 22 (p.26) current consumption, memory map (pp.30-31), Table 49 (p.43)
#   interface parameters, Table 52 (p.46) pin description.
#
# Levels, thermal and the bus model follow the BMP388 notes above: fractions of
# VDDIO evaluated at the Table 2 typical 1.8 V; no theta_JA printed (left absent);
# I2C only; raw 24-bit count inputs because the NVM trimming block is unprinted.
# Renode was not consulted; every value is from the datasheet.
[[models]]
id = "bmp390"
kind = "digital"
description = "Bosch BMP390 barometric pressure sensor, 10-pin LGA (strap-selected I2C address, pad map, VDDIO logic levels, register map with reset values, raw pressure/temperature data); no compensation"

[models.match]
value_re = "(?i)^BMP390$"

[models.params]
voh   = { min = 1.44, unit = "V", conditions = "VDDIO = 1.8 V (Table 2 typ), IOH = 1 mA (SDI, SDO, INT); 0.8 x VDDIO", basis = "Table 49 p.43, Voh 0.8 x VDDIO min; derived by evaluating the printed fraction at VDDIO = 1.8 V" }
vol   = { max = 0.36, unit = "V", conditions = "VDDIO = 1.8 V (Table 2 typ), IOL = 3 mA (SDI, SDO, INT); 0.2 x VDDIO", basis = "Table 49 p.43, Vol 0.2 x VDDIO max; derived by evaluating the printed fraction at VDDIO = 1.8 V" }
vih   = 1.26     # Table 49 p.43, Vih 0.7 x VDDIO min (SCK, SDI, CSB), derived at VDDIO = 1.8 V
vil   = 0.45     # Table 49 p.43, Vil 0.25 x VDDIO max (SCK, SDI, CSB), derived at VDDIO = 1.8 V
supply_static_ua = 46.4    # Table 22 p.26, highest resolution (x32 / x2) at 1 Hz forced mode, typ; the
                           # largest duty-cycled figure tabulated (ultra low power is 3.2 uA). The
                           # conversion peak is 660 uA typ / 730 uA max (Table 2) and is not carried.
supply_pin = "10"          # VDD
gnd_pin    = "3"           # VSS

[models.pins]
# Table 52 Pin description, all 10 pads (same as the BMP388).
"1"  = "vddio"   # digital interface supply, 1.2 to 3.6 V
"2"  = "scl"     # SCK: I2C SCL / SPI SCK
"3"  = "gnd"
"4"  = "sda"     # SDI: I2C SDA / SPI SDI (3-wire SDI/SDO)
"5"  = "sdo"     # SPI data out; in I2C the address LSB (GND = 0x76, VDDIO = 0x77)
"6"  = "csb"     # chip select; VDDIO selects I2C
"7"  = "int"     # interrupt output
"8"  = "gnd2"
"9"  = "gnd3"
"10" = "vdd"     # analog supply, 1.65 to 3.6 V

[models.ratings]
# Table 3 p.9: VDD and VDDIO pins -0.3 to 3.6 V; interface pins Vss -0.3 V to
# VDDIO + 0.3 V; storage -45 to +85 C; ESD HBM class 2 (2 kV).
max_voltage_v = 3.6

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.65
max_v = 3.6
abs_max_v = 3.6
basis = "Bosch BST-BMP390-DS002-07, Table 2 p.7 Sensor supply voltage VDD row (ripple max 50 mVpp); Table 3 p.9 supply pin maximum"

[[models.envelope]]
kind = "supply_range"
pin = "vddio"
min_v = 1.2
max_v = 3.6
abs_max_v = 3.6
basis = "Bosch BST-BMP390-DS002-07, Table 2 p.7 Interface supply voltage VDDIO row; Table 3 p.9 supply pin maximum"

# Sections 5.1 and 5.2 (pp.40-41): CSB to VDDIO selects I2C; SDO to GND gives
# 0x76, SDO to VDDIO gives 0x77; SDO cannot be left floating.
[models.peripheral]
kind = "register_map"
required_high_roles = ["csb"]
address_select_role = "sdo"
address_when_low = 0x76
address_when_high = 0x77
spec_toml = '''
[sensor]
name = "BMP390"
bus = "i2c"
i2c_address = 0x76

# RAW 24-bit ADC counts (see the BMP388 note: the trimming block is unprinted).
# 8388608 = 0x800000, the Table 25 reset value of DATA_2 / DATA_5.
[[sensor.input]]
name = "press_raw"
default = 8388608.0

[[sensor.input]]
name = "temp_raw"
default = 8388608.0

# Memory map (pp.30-31), reset values as printed.
# 0x00 CHIP_ID, reset 0x60.
[[sensor.register]]
addr = 0x00
const = [0x60]

# 0x01 REV_ID, reset 0x01 (rev_id_major / rev_id_minor).
[[sensor.register]]
addr = 0x01
const = [0x01]

# 0x02 ERR_REG, reset 0x00.
[[sensor.register]]
addr = 0x02
const = [0x00]

# 0x03 STATUS: cmd_rdy bit 4, drdy_press bit 5, drdy_temp bit 6. The memory map prints the
# reset value 0x00 for the instant before the decoder is ready; an idle device reads
# cmd_rdy = 1, so 0x10 is carried (ASSUMED from the bit meaning). Data-ready bits follow the
# channel enables while a measurement mode is selected.
[[sensor.register]]
addr = 0x03
encoding = "u8"
expr = "16 + if(mode > 0, 32 * press_en + 64 * temp_en, 0)"

[[sensor.register]]
addr = 0x04
encoding = "u8"
expr = "if(press_en > 0, press_raw % 256, 0)"

[[sensor.register]]
addr = 0x05
encoding = "u8"
expr = "if(press_en > 0, floor(press_raw / 256) % 256, 0)"

[[sensor.register]]
addr = 0x06
encoding = "u8"
expr = "if(press_en > 0, floor(press_raw / 65536), 128)"

[[sensor.register]]
addr = 0x07
encoding = "u8"
expr = "if(temp_en > 0, temp_raw % 256, 0)"

[[sensor.register]]
addr = 0x08
encoding = "u8"
expr = "if(temp_en > 0, floor(temp_raw / 256) % 256, 0)"

[[sensor.register]]
addr = 0x09
encoding = "u8"
expr = "if(temp_en > 0, floor(temp_raw / 65536), 128)"

# 0x0C-0x0E SENSORTIME_0..2, reset 0x00 (counter not modelled).
[[sensor.register]]
addr = 0x0C
const = [0x00]

[[sensor.register]]
addr = 0x0D
const = [0x00]

[[sensor.register]]
addr = 0x0E
const = [0x00]

# 0x10 EVENT, reset 0x01 (por_detected).
[[sensor.register]]
addr = 0x10
const = [0x01]

# 0x11 INT_STATUS, 0x12-0x13 FIFO_LENGTH, 0x14 FIFO_DATA: reset 0x00 (FIFO not modelled).
[[sensor.register]]
addr = 0x11
const = [0x00]

[[sensor.register]]
addr = 0x12
const = [0x00]

[[sensor.register]]
addr = 0x13
const = [0x00]

[[sensor.register]]
addr = 0x14
const = [0x00]

# 0x15 FIFO_WTM_0 reset 0x01; 0x16 FIFO_WTM_1 reset 0x00; 0x17 FIFO_CONFIG_1 reset 0x02;
# 0x18 FIFO_CONFIG_2 reset 0x02; 0x19 INT_CTRL reset 0x02; 0x1A IF_CONF reset 0x00.
[[sensor.write_register]]
addr = 0x15
encoding = "u8"
store = "fifo_wtm_0"
default = 1.0

[[sensor.write_register]]
addr = 0x16
encoding = "u8"
store = "fifo_wtm_1"
default = 0.0

[[sensor.write_register]]
addr = 0x17
encoding = "u8"
store = "fifo_config_1"
default = 2.0

[[sensor.write_register]]
addr = 0x18
encoding = "u8"
store = "fifo_config_2"
default = 2.0

[[sensor.write_register]]
addr = 0x19
encoding = "u8"
store = "int_ctrl"
default = 2.0

