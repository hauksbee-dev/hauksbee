# 0x72 Ctrl_hum, reset 0x00: spi_3w_int_en bit 6, osrs_h bits 2:0.
[[sensor.write_register]]
addr = 0x72
encoding = "u8"
store = "ctrl_hum"
default = 0.0

[[sensor.write_register.field]]
name = "spi_3w_int_en"
bits = [6, 6]

[[sensor.write_register.field]]
name = "osrs_h"
bits = [2, 0]

# 0x74 Ctrl_meas, reset 0x00: osrs_t bits 7:5, osrs_p bits 4:2, mode bits 1:0 (00 sleep, 01 forced).
[[sensor.write_register]]
addr = 0x74
encoding = "u8"
store = "ctrl_meas"
default = 0.0

[[sensor.write_register.field]]
name = "osrs_t"
bits = [7, 5]

[[sensor.write_register.field]]
name = "osrs_p"
bits = [4, 2]

[[sensor.write_register.field]]
name = "mode"
bits = [1, 0]

# 0x75 Config, reset 0x00: filter bits 4:2, spi_3w_en bit 0.
[[sensor.write_register]]
addr = 0x75
encoding = "u8"
store = "config"
default = 0.0

[[sensor.write_register.field]]
name = "filter"
bits = [4, 2]

[[sensor.write_register.field]]
name = "spi_3w_en"
bits = [0, 0]

# 0xE0 Reset, reset 0x00 (writing 0xB6 requests a soft reset; the reset itself is not modelled).
[[sensor.write_register]]
addr = 0xE0
encoding = "u8"
store = "reset_cmd"
default = 0.0

[sensor.protocol]
style = "i2c_pointer"
'''

