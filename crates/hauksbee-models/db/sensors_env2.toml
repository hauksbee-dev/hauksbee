# 0x1B PWR_CTRL, reset 0x00: press_en bit 0, temp_en bit 1, mode bits 5:4.
[[sensor.write_register]]
addr = 0x1B
encoding = "u8"
store = "pwr_ctrl"
default = 0.0

[[sensor.write_register.field]]
name = "press_en"
bits = [0, 0]

[[sensor.write_register.field]]
name = "temp_en"
bits = [1, 1]

[[sensor.write_register.field]]
name = "mode"
bits = [5, 4]

# 0x1C OSR, reset 0x02: osr_p bits 2:0, osr_t bits 5:3.
[[sensor.write_register]]
addr = 0x1C
encoding = "u8"
store = "osr"
default = 2.0

[[sensor.write_register.field]]
name = "osr_p"
bits = [2, 0]

[[sensor.write_register.field]]
name = "osr_t"
bits = [5, 3]

# 0x1D ODR, reset 0x00: odr_sel bits 4:0.
[[sensor.write_register]]
addr = 0x1D
encoding = "u8"
store = "odr"
default = 0.0

[[sensor.write_register.field]]
name = "odr_sel"
bits = [4, 0]

# 0x1F CONFIG, reset 0x00: iir_filter bits 3:1, short_in bit 0.
[[sensor.write_register]]
addr = 0x1F
encoding = "u8"
store = "config"
