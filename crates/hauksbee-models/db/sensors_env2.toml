[[sensor.write_register.field]]
name = "osrs_h"
bits = [2, 0]

# 0x74 Ctrl_meas, reset 0x00: osrs_t bits 7:5, osrs_p bits 4:2, mode bits 1:0 (00 sleep, 01 forced, 10 parallel).
[[sensor.write_register]]
addr = 0x74
encoding = "u8"
store = "ctrl_meas"
default = 0.0

[[sensor.write_register.field]]
name = "osrs_t"
bits = [7, 5]

[[sensor.write_register.field]]
name = "osrs_p"
bits = [4, 2]

[[sensor.write_register.field]]
name = "mode"
bits = [1, 0]

# 0x75 Config, reset 0x00: filter bits 4:2, spi_3w_en bit 0.
[[sensor.write_register]]
addr = 0x75
encoding = "u8"
store = "config"
default = 0.0

[[sensor.write_register.field]]
name = "filter"
bits = [4, 2]

[[sensor.write_register.field]]
name = "spi_3w_en"
bits = [0, 0]

# 0xE0 Reset, reset 0x00 (writing 0xB6 requests a soft reset; the reset itself is not modelled).
[[sensor.write_register]]
addr = 0xE0
encoding = "u8"
store = "reset_cmd"
default = 0.0

# Readback of the stored write registers: a read returns the last value written (or
# the reset value before any write), as the register map's R/W registers do.
[[sensor.register]]
addr = 0x50
