# ─────────────────────────────────────────────────────────────────────────────
# TSL2561 (CL): TAOS (now ams OSRAM) light-to-digital converter, 6-lead ChipLED (CL).
#
# Source: TAOS "TSL2560, TSL2561 Light-to-Digital Converter", TAOS059N, March 2009. Page
#   numbers are the printed footers: package pin diagrams p.1, Available Options p.2, Terminal
#   Functions, Absolute Maximum Ratings, Recommended Operating Conditions and Electrical
#   Characteristics p.3, Operating Characteristics p.4, Notes p.5, AC characteristics p.6,
#   Table 1 slave addresses p.10, protocols pp.11-13, Table 2 register map p.13, Tables 3-12
#   pp.14-18. The datasheet's own table cross-references are off by one page in places, so
#   table numbers are cited alongside.
#
# VARIANTS: the CS, T and FN bodies share one pad order (1 VDD, 2 ADDR SEL, 3 GND, 4 SCL,
# 5 INT, 6 SDA) and the CL body numbers its pads differently (1 VDD, 2 GND, 3 ADDR SEL, 4 SCL,
# 5 SDA, 6 INT), so the tsl2561 variant family has two cards. A bare "TSL2561" names neither
# and stays unresolved until the ordering code (TSL2561CS/T/FN or CL) or the fitted pads select
# one. TSL2560 (SMBus, PARTNO 0000) is a different part and is not resolved here.
#
# LEVELS: VIL (0.8 V max) and VIH (2.1 V min) are printed in volts (Recommended Operating
# Conditions p.3), not as fractions of VDD. VOL is printed in volts (0.4 V at 3 mA, 0.6 V at
# 6 mA). INT and SDA are open drain, so no output-high level is carried.
#
# ADDRESS: the ADDR SEL pin is three-state (GND 0x29, Float 0x39, VDD 0x49, Table 1 p.10). The
# strap contract here has two levels, so the card carries GND = 0x29 and VDD = 0x49, and the
# Float address 0x39 is the spec default used, flagged assumed, when the pin is not tied.
#
# THERMAL: the datasheet prints no theta_JA, theta_JC or junction temperature (searched the
# whole document); the fields are left ABSENT.
#
# BUS MODEL: byte-framed (0x80 + register) and word-framed (0xA0 + register) command bytes.
# CONTROL, TIMING, INTERRUPT and the two 16-bit thresholds read back what was written; the ID
# register answers 0x10 (PARTNO 0001, REVNO not printed); the channel data registers answer
# from two RAW count inputs because lux needs an empirical formula.
#
# Renode (MIT, Antmicro) was not consulted for this part: every value is from the datasheet.
[[models]]
id = "tsl2561_cl"
kind = "digital"
description = "TAOS TSL2561 light-to-digital converter, 6-lead ChipLED (CL) (three-state ADDR SEL address strap, pad map, volt logic levels, command-byte register map with reset values, raw channel counts); no interrupt engine"
variant_of = "tsl2561"

[models.match]
# One shared family match: the bare number and every ordering code. TSL2560 and TSL2591 fall
# outside the anchored number.
value_re = "(?i)^TSL2561(?:CS|T|FN|CL)?$"

[models.variant]
orderable_re = '^TSL2561CL$'
orderable = ["TSL2561CL"]
basis = "TAOS TSL2560/TSL2561 datasheet (TAOS059N, Mar. 2009) Available Options p.2; Terminal Functions p.3 (pin numbering per package)"

[models.params]
vol   = { max = 0.4, unit = "V", conditions = "3 mA sink on INT and SDA", basis = "TAOS TSL2560/TSL2561 datasheet (TAOS059N, Mar. 2009) Electrical Characteristics p.3, VOL 0.4 V max at 3 mA (0.6 V at 6 mA)" }
vih   = 2.1      # Recommended Operating Conditions p.3, SCL and SDA input high voltage min
vil   = 0.8      # Recommended Operating Conditions p.3, SCL and SDA input low voltage max
supply_static_ua = 240.0   # Electrical Characteristics p.3, IDD active typ (0.6 mA max); power down is 3.2 uA typ
supply_pin = "1"
gnd_pin    = "2"

[models.pins]
# Terminal Functions p.3, ChipLED-6, all six pads.
"1" = "vdd"   # VDD
"2" = "gnd"   # GND
"3" = "addr_sel"# ADDR SEL
"4" = "scl"   # SCL
"5" = "sda"   # SDA
"6" = "int"   # INT

[models.ratings]
# Absolute Maximum Ratings p.3: VDD 3.8 V; digital outputs -0.5 to 3.8 V; storage -40 to 85 C.
max_voltage_v = 3.8

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.7
max_v = 3.6
abs_max_v = 3.8
basis = "TAOS TSL2560/TSL2561 datasheet (TAOS059N, Mar. 2009), Recommended Operating Conditions p.3 VDD 2.7 to 3.6 V (3 V nominal); Absolute Maximum Ratings p.3 supply voltage 3.8 V (the block diagram on p.2 prints 2.7 to 3.5 V; the table is used)"

[models.peripheral]
kind = "register_map"
address_select_role = "addr_sel"
address_when_low = 0x29      # Table 1 p.10, ADDR SEL at GND
address_when_high = 0x49     # Table 1 p.10, ADDR SEL at VDD
spec_toml = '''
