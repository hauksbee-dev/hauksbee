encoding = "u8"
store = "odr"
default = 0.0

[[sensor.write_register.field]]
name = "odr_sel"
bits = [4, 0]

# 0x1F CONFIG, reset 0x00: iir_filter bits 3:1, short_in bit 0.
[[sensor.write_register]]
addr = 0x1F
encoding = "u8"
store = "config"
