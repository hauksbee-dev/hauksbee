# ─────────────────────────────────────────────────────────────────────────────
# TMP117 (YBG): Texas Instruments high-accuracy digital temperature sensor,
# DSBGA-6 (YBG) 2 x 3 ball grid.
#
# Source: TI "TMP117 High-Accuracy, Low-Power, Digital Temperature Sensor With SMBus- and
#   I2C-Compatible Interface", SNOSD82D, June 2018, revised September 2022. Page numbers
#   below are the printed footers. Table 5-1 (p.4) pins, Sections 6.1 to 6.4 (p.5) ratings,
#   operating conditions and thermal metrics, Section 6.5 (pp.6-7) electrical characteristics,
#   Table 7-2 (p.21) addresses, Table 7-3 (p.25) register map, Section 7.6 (pp.26-32) register
#   fields, Packaging Information (ordering codes).
#
# VARIANTS: the DRV (WSON-6) and YBG (DSBGA-6) bodies number their pads differently, so
# each is its own card in the tmp117 variant family. A bare "TMP117" names neither and the
# set stays unresolved until the ordering code (AIDRV.. / AIYBG..), the footprint, or the
# fitted pad names select one. Grades: TMP117 and TMP117N operate -55 to 150 C, TMP117M
# 0 to 85 C with the same electrical rows; the grade is not an electrical card parameter.
#
# LEVELS: VIH and VIL are printed as 0.7 and 0.3 of V+; the volts below evaluate them at the
# 3.3 V nominal supply (derived). VOL is printed in volts (0.4 V at 3 mA). SDA and ALERT
# are open drain, so no output-high level is carried.
#
# THERMAL: RthetaJA 133.2 C/W for DSBGA-6 (Section 6.4 p.5). The DRV thermal pad is
# not a numbered pad, is to be left unsoldered for accuracy, and if soldered must float or be
# grounded (Section 10.1 p.35); it is therefore not mapped.
#
# BUS MODEL: Temp_Result, Configuration, THigh/TLow limits, EEPROM_UL, Temp_Offset and
# Device_ID are carried. EEPROM1, EEPROM2 and EEPROM3 (reset values printed as xxxx, the NIST
# traceability scratch words) are NOT read from the datasheet and are left absent.
#
# Renode (MIT, Antmicro) was not consulted for this part: every value is from the datasheet.
[[models]]
id = "tmp117_ybg"
kind = "digital"
description = "TI TMP117 digital temperature sensor, DSBGA-6 (YBG) 2 x 3 ball grid (four-level ADD0 address strap, pad map, V+ logic levels, register map with reset values and a settable die temperature); no alert engine"
variant_of = "tmp117"

[models.match]
# One shared family match: the bare number and every real ordering code. TMP116, TMP117 look-alikes
# (TMP1075, TMP1175) are different parts and fall outside the anchored number.
value_re = "(?i)^TMP117(?:[MN]?AI(?:DRV|YBG)(?:RG4|R|T)?(?:\\.A)?)?$"

[models.variant]
orderable_re = '^TMP117[MN]?AIYBG(R|T)?(\.A)?$'
orderable = ["TMP117AIYBGR", "TMP117AIYBGT", "TMP117MAIYBGR", "TMP117MAIYBGT", "TMP117NAIYBGR", "TMP117NAIYBGT"]
package = "DSBGA-6"
basis = "TI SNOSD82D Packaging Information table; Table 5-1 p.4 (pin numbering per package)"

[models.params]
vol   = { max = 0.4, unit = "V", conditions = "IOL = 3 mA on SDA and ALERT", basis = "TI SNOSD82D Section 6.5 p.6, VOL 0.4 V max" }
vih   = 2.31     # Section 6.5 p.6, VIH 0.7 x V+ min (SCL, SDA), derived at the 3.3 V nominal V+
vil   = 0.99     # Section 6.5 p.6, VIL 0.3 x V+ max (SCL, SDA), derived at the 3.3 V nominal V+
supply_static_ua = 16.0   # Section 6.5 p.6, IQ typ at 1 Hz with 8 averages (the factory 0220h configuration),
                          # bus inactive; 22 uA max. Conversion peak 135 uA typ is not carried.
supply_pin = "B1"
gnd_pin    = "B2"

[models.pins]
# Table 5-1 Pin Functions, DSBGA-6, all six pads.
"A1" = "sda"  # SDA
"A2" = "scl"  # SCL
"B1" = "vdd"  # V+
"B2" = "gnd"  # GND
"C1" = "add0" # ADD0
"C2" = "alert"# ALERT

[models.ratings]
# Section 6.1 p.5: V+ -0.3 to 6 V; SCL, SDA, ALERT, ADD0 -0.3 to 6 V; TJ -55 to 155 C.
max_voltage_v = 6.0
max_junction_temp_c = 155.0
theta_ja_c_per_w = 133.2      # Section 6.4 p.5, YBG (DSBGA-6)

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.8
max_v = 5.5
abs_max_v = 6.0
basis = "TI SNOSD82D, Section 6.3 p.5 V+ 1.8 to 5.5 V over -55 to 150 C (1.7 V is allowed only over -55 to 70 C); Section 6.1 p.5 supply absolute maximum"

[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "TMP117 YBG"
bus = "i2c"
i2c_address = 0x48

# DSBGA-6 (YBG) 2 x 3 ball grid pad map (Table 5-1 p.4), the same as [models.pins].
[sensor.pins]
A1 = "sda"
A2 = "scl"
B1 = "vdd"
B2 = "gnd"
C1 = "add0"
C2 = "alert"

# Table 7-2 Address Pin and Slave Addresses (p.21): ADD0 to GND 1001000, V+ 1001001,
# SDA 1001010, SCL 1001011. An ADD0 that is floating or on another net takes 0x48 as
# an ASSUMED address.
[[sensor.address_select]]
address = 0x48
straps = { add0 = "low" }
[[sensor.address_select]]
address = 0x49
straps = { add0 = "high" }
[[sensor.address_select]]
address = 0x4A
straps = { add0 = "sda" }
[[sensor.address_select]]
address = 0x4B
straps = { add0 = "scl" }

# The die temperature in degrees C. The default 25 C is a nominal ambient; the device
# itself reads 8000h (-256 C) until its first conversion completes (Section 7.6.2
# p.26), which is not modelled because no conversion latency is.
[[sensor.input]]
name = "temp_c"
default = 25.0

# Temp_Result (00h, Section 7.6.2 p.26): 16-bit two's complement, 7.8125 m C per LSB (1/128 C). The Temp_Offset register is added after linearisation (Section 7.6.9 p.31).
[[sensor.register]]
addr = 0x00
encoding = "i16_be"
expr = "temp_c * 128 + temp_offset"

# Configuration (01h, Section 7.6.3 pp.27-28), reset 0220h. Reads back the stored value with the read-only flags HIGH_Alert/LOW_Alert/Data_Ready/EEPROM_Busy (bits 15:12) replaced by 0 0 1 0 and Soft_Reset (bit 1) reading 0. Data_Ready reads 1 permanently because no conversion latency is modelled: the Temp_Result register always holds the current temperature, so a firmware that polls Data_Ready proceeds at once. Clear-on-read of the flag and the alert flags are not modelled.
[[sensor.register]]
addr = 0x01
encoding = "u16_be"
expr = "config - 4096 * cfg_ro - 2 * cfg_soft_reset + 8192"

# THigh_Limit (02h, Section 7.6.4 p.29) reads back, reset 6000h (192 C).
[[sensor.register]]
addr = 0x02
encoding = "i16_be"
expr = "thigh_limit"

# TLow_Limit (03h, Section 7.6.5 p.29) reads back, reset 8000h (-256 C).
[[sensor.register]]
addr = 0x03
encoding = "i16_be"
expr = "tlow_limit"

# EEPROM_UL (04h, Section 7.6.6) reads back, reset 0000h.
[[sensor.register]]
addr = 0x04
encoding = "u16_be"
expr = "eeprom_ul"

# Temp_Offset (07h, Section 7.6.9 p.31) reads back, reset 0000h.
[[sensor.register]]
addr = 0x07
encoding = "i16_be"
expr = "temp_offset"

# Device_ID (0Fh, Table 7-15 p.32): DID[11:0] = 117h; Rev[3:0] reads 0h in the field table (0117h in the Table 7-3 register map).
[[sensor.register]]
addr = 0x0F
const = [0x01, 0x17]

# Configuration reset 0220h = MOD 00 (continuous), CONV 100 (1 s), AVG 01 (8 averages). cfg_ro = bits 15:12 (read-only flags), cfg_soft_reset = bit 1 (reads 0).
[[sensor.write_register]]
addr = 0x01
encoding = "u16_be"
store = "config"
default = 544.0

[[sensor.write_register.field]]
name = "cfg_ro"
bits = [15, 12]

[[sensor.write_register.field]]
name = "cfg_mod"
bits = [11, 10]

[[sensor.write_register.field]]
name = "cfg_conv"
bits = [9, 7]

[[sensor.write_register.field]]
name = "cfg_avg"
bits = [6, 5]

[[sensor.write_register.field]]
name = "cfg_tna"
bits = [4, 4]

[[sensor.write_register.field]]
name = "cfg_pol"
bits = [3, 3]

[[sensor.write_register.field]]
name = "cfg_dr_alert"
bits = [2, 2]

[[sensor.write_register.field]]
name = "cfg_soft_reset"
bits = [1, 1]

# THigh_Limit reset 6000h (Table 7-3 p.25).
[[sensor.write_register]]
addr = 0x02
encoding = "i16_be"
store = "thigh_limit"
default = 24576.0

# TLow_Limit reset 8000h (Table 7-3 p.25).
[[sensor.write_register]]
addr = 0x03
encoding = "i16_be"
store = "tlow_limit"
default = -32768.0

# EEPROM_UL reset 0000h (Table 7-3 p.25); the EEPROM programming sequence is not modelled.
[[sensor.write_register]]
addr = 0x04
encoding = "u16_be"
store = "eeprom_ul"
default = 0.0

# Temp_Offset reset 0000h (Table 7-3 p.25); the offset enters Temp_Result.
[[sensor.write_register]]
addr = 0x07
encoding = "i16_be"
store = "temp_offset"
default = 0.0

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.6    # Section 6.5 p.7, VPOR rising, typ
idle_a = 0.000016             # Section 6.5 p.6, IQ typ, 1 Hz with 8 averages
read_a = 0.000016
write_a = 0.000016
low_power_a = 0.00000015      # Section 6.5 p.6, shutdown current typ, TA = 25 C

[models.coverage]
implements = ["pin_roles", "logic_levels_at_3v3", "duty_cycled_supply_current", "absolute_ratings", "supply_range", "thermal_resistance", "i2c_address_strap", "four_level_address_pin", "register_map", "device_id_read", "reset_values", "config_register_readback", "temperature_result_from_die_temperature", "temperature_offset", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["alert_pin_engine", "high_low_alert_flags", "therm_mode", "data_ready_clear_on_read", "conversion_timing_and_modes", "averaging", "one_shot_and_shutdown_modes", "eeprom_program_sequence", "eeprom1_eeprom2_eeprom3_values_not_printed", "soft_reset_and_general_call_reset", "first_conversion_reset_temperature", "conversion_peak_current", "grade_temperature_range"]

