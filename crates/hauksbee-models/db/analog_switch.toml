typ = 1.5
max = 2.4
unit = "ohm"
conditions = "TJ = 125 °C, VI(IN1) = VI(IN2) = 5 V, IO = rated current"
basis = "SLVS235A electrical characteristics, power switch, typ and max columns"

[[models.source.characteristic]]
