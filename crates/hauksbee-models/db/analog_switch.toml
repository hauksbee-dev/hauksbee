# Analog switch / transmission gate models.

# FSUSB42, ON Semiconductor Rev. 4 (August 2021), FSUSB42-D:
# https://www.onsemi.com/download/data-sheet/pdf/fsusb42-d.pdf
# The MSOP-10 map below is the board-observed package. The datasheet truth table
# is SEL low -> HSD1, SEL high -> HSD2, while active-low OE must be low. The
# engine's shared-select DPDT primitive stamps both differential lanes and
# refuses a dynamic OE rather than silently modelling the mux as always on.
[[models]]
id = "fsusb42_msop10"
kind = "analog_switch"
description = "FSUSB42 USB 2.0 high-speed DPDT mux, MSOP-10"

[models.match]
value_re = "(?i)^FSUSB42(MUX)?([A-Z0-9._-]*)?$"
mpn_re = "(?i)^FSUSB42"

[models.params]
ron = 3.9       # typical at VCC=3.0 V, VSW=0.4 V, ION=8 mA
roff = 2.15e6   # 4.3 V / 2 uA worst-case off leakage
vth = 1.3       # VIH minimum at VCC=2.4..3.6 V
warning = "source-bound DC routing model: both USB lanes, select polarity, on-resistance and worst-case off leakage are executable only while OE_N is strapped low; dynamic OE, 3.7 pF channel capacitance, 720 MHz bandwidth, edge distortion and ESD behavior are not represented"

[models.pins]
"1" = "vcc"
"2" = "ctrl"   # SEL
"3" = "com_1"  # D+
"4" = "com_2"  # D-
"5" = "vss"
"6" = "s0_2"   # HSD1-
"7" = "s0_1"   # HSD1+
"8" = "s1_2"   # HSD2-
"9" = "s1_1"   # HSD2+
"10" = "oe_n"

[models.ratings]
max_voltage_v = 5.6   # Absolute Maximum Ratings, VCC supply voltage -0.5 to 5.6 V
max_junction_temp_c = 150.0

# The 2.4-4.4 V operating range is the check that fires below the 5.6 V abs max.
[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.4
max_v = 4.4
abs_max_v = 5.6
basis = "onsemi FSUSB42/D, Recommended Operating Conditions, VCC supply voltage 2.4 V to 4.4 V; Absolute Maximum Ratings, VCC -0.5 V to 5.6 V"

[models.coverage]
implements = ["differential_mux_select", "off_state_leakage", "on_resistance"]
missing = ["bandwidth", "channel_capacitance", "dynamic_output_enable", "esd_clamp"]

[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"
[[models.source.uncertainty]]
status = "unknown"
parameter = "model"
reason = "datasheet publishes no validated model error interval"

# AP2553, Diodes Incorporated DS35404 Rev. 12 (September 2021):
# https://www.diodes.com/datasheet/download/AP2553.pdf
# AP2553 (without the A suffix) is the active-high auto-retry option. Its
# published typical current-limit curve is not exactly k/R:
# ILIMIT(A) = 19.94 / (RLIM(kOhm) ^ 0.925). The generic power-law current
# program below evaluates the fitted board resistor without inventing a load;
# `protection_limit` is an OCP threshold, not operating current.
[[models]]
id = "ap2553_sot26"
kind = "analog_switch"
description = "AP2553 active-high adjustable current-limited load switch, SOT-26"

[models.match]
value_re = "(?i)^AP2553W6(-7)?$"
mpn_re = "(?i)^AP2553W6(-7)?$"

[models.params]
ron = 0.070     # typical at VIN=5.0 V, TJ=25 C
roff = 5.5e6    # 5.5 V / 1 uA worst-case shutdown leakage
vth = 2.0       # EN VIH minimum
# Enable polarity: DS35404 Rev. 12-3 PDF p.2 pin descriptions, AP2553/AP2553A column: "Enable input, logic
# high turns on power switch." (https://www.diodes.com/datasheet/download/AP2553.pdf, sha256
# c667dbfc5d65b69cbdb32333850b2c6830bebce54f045dbe4d4ffb5287a33ff9). The datasheet states no internal
# pull and does not say what an open EN pin does, so there is no en_open here.
en_on_level = "high"
warning = "source-bound load-switch and programmed-limit model: active-high enable, DC on/off path, worst-case off leakage and fitted ILIM threshold are executable; 1.1 ms rise, output discharge, open-drain FAULT, reverse-current trip, 2 us short response and 140/160 C cycling are not yet dynamic"

[models.pins]
"1" = "in_out_b" # IN
"2" = "vss"
"3" = "ctrl"     # active-high EN
"4" = "fault_n"  # open-drain FAULT
"5" = "ilim"
"6" = "in_out_a" # OUT

[models.pin_capability.open_drain]
basis = "DS35404 Rev. 12-3 PDF p.2 pin descriptions: FAULT \"Active-low open-drain output, asserted during over-current, over-temperature, or reverse-voltage conditions.\""
[models.pin_capability.open_drain.pads]
"4" = "FAULT"

[models.current_program]
pin = "ilim"
semantics = "protection_limit"
equation = "power_law_resistance"
coefficient_a = 19.94
resistance_scale_ohms = 1000.0
exponent = 0.925

[models.ratings]
max_current_a = 2.1
max_voltage_v = 6.5   # Absolute Maximum Ratings, voltage on IN/OUT/FAULT/ILIM/EN -0.3 to +6.5 V
max_junction_temp_c = 125.0
theta_ja_c_per_w = 160.0  # SOT26 on JEDEC high-K board; 120 is the U-DFN2020-6 row.
                          # DS35404 Rev. 12-3, Dissipation Rating Table, p.4

# The 2.7-5.5 V recommended VIN range is the check that fires below the 6.5 V abs max.
[[models.envelope]]
kind = "supply_range"
pin = "in_out_b"
min_v = 2.7
max_v = 5.5
abs_max_v = 6.5
basis = "Diodes AP2553 DS35404 Rev. 12, Recommended Operating Conditions, VIN input voltage 2.7 V to 5.5 V; Absolute Maximum Ratings, voltage on IN -0.3 V to +6.5 V"

[models.coverage]
implements = ["enable_gating", "off_state_leakage", "on_resistance", "programmed_current_limit"]
missing = ["fault_output", "output_discharge", "reverse_current_blocking", "short_circuit_transient", "thermal_shutdown", "turn_on_transient"]

[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"
[[models.source.uncertainty]]
status = "unknown"
parameter = "model"
reason = "datasheet publishes no validated model error interval"
[[models.source.uncertainty]]
status = "unknown"
parameter = "en_open"
reason = "DS35404 Rev. 12-3 PDF p.2 Pin Descriptions say only \"Enable input, logic high turns on power switch.\"; the datasheet prints no internal pull-up or pull-down on EN and does not say what an unconnected EN does, so no open-pin behaviour is stated here"

# Capacitance and flag bias, Diodes AP2552/AP2553 DS35404 Rev. 12-3 (https://www.diodes.com/datasheet/download/AP2553.pdf, sha256 c667dbfc5d65b69cbdb32333850b2c6830bebce54f045dbe4d4ffb5287a33ff9).
[[models.supply_cap]]
role = "in_out_b"
side = "input"
grade = "required"
min_f = 1.0e-7
basis = "DS35404 Rev. 12-3 p.2 pin descriptions, IN: \"connect a 0.1uF or greater ceramic capacitor from IN to GND as close to IC as possible\"; p.4 Recommended Operating Conditions: Input De-Coupling Capacitance, IN to GND, min 0.1 uF"
note = "It limits the input voltage drop during line transients. The datasheet recommends a 10 uF minimum electrolytic on the input when the output load is heavy (p.11)."

[[models.supply_cap]]
role = "in_out_a"
side = "output"
grade = "recommended"
min_f = 1.0e-7
basis = "DS35404 Rev. 12-3 p.11 Power Supply Considerations: \"bypassing the device output with a 0.1uF to 4.7uF ceramic capacitor improves the immunity of the device to short-circuit transients\""
note = "It also stops the output going negative at turn-off through parasitic inductance. USB loads also need 120 uF on the output (p.2 note 4)."

[[models.pin_bias]]
role = "fault_n"
level = "high"
needs = "pull"
open_ok = true
basis = "DS35404 Rev. 12-3 p.2 pin descriptions: FAULT \"Active-low open-drain output, asserted during over-current, over-temperature, or reverse-voltage conditions\"; p.4 Recommended Operating Conditions: continuous FAULT sink current 0 to 10 mA"
note = "An open-drain output can only pull the pin low, so a pin that something reads needs a pull-up to read high when there is no fault; an unused flag may be left open."

[[models]]
id = "sn74lvc1g3157"
kind = "analog_switch"
description = "SN74LVC1G3157 single-pole double-throw analog switch, SOT-23-6"

[models.match]
value_re = "(?i)^SN74LVC1G3157"
mpn_re   = "(?i)SN74LVC1G3157"

[models.params]
# Source: Texas Instruments SN74LVC1G3157 datasheet (SCES668H), Table 6.5
# ron at 5V supply: typ 6 Ω, max 11 Ω
ron  = 6.0       # on-resistance (Ω) @ Vcc=5V typical
roff = 1.0e9     # off-resistance (Ω), effectively open
vth  = 1.5       # FALLBACK ONLY, for a select whose VCC net has no resolved
                 # rail voltage (roughly the band middle at 3.3 V). Wherever the
                 # rail is known the select switches at the middle of the
                 # [models.levels] band below read at that rail: 2.5 V on 5 V.
# Charge injection: negligible for behavioral simulation; marked ignore here.
# bandwidth: −3 dB at ~180 MHz (Table 6.5), not modelled.

# The select input's VIL/VIH band as a function of VCC: TI SCES424O Section 5.4
# Recommended Operating Conditions, "High-level input voltage, control input"
# VIH min = VCC x 0.75 (VCC 1.65-1.95 V), VCC x 0.7 (2.3-5.5 V); "Low-level input
# voltage, control input" VIL max = VCC x 0.25 (1.65-1.95 V), VCC x 0.3 (2.3-5.5 V).
# On a 5 V rail the band is 1.5-3.5 V: 1.5 V on S is a guaranteed LOW, and a
# select between 1.5 and 3.5 V is undefined, not "high".
[models.levels]
vih = [[1.65, 1.2375], [1.95, 1.4625], [2.3, 1.61], [5.5, 3.85]]
vil = [[1.65, 0.4125], [1.95, 0.4875], [2.3, 0.69], [5.5, 1.65]]

[models.pins]
# SN74LVC1G3157 SOT-23-6 per TI SCDS230: 1=B2, 2=GND, 3=B1, 4=A, 5=VCC, 6=S.
# Function: S low -> A<->B1 (s0); S high -> A<->B2 (s1).
"1" = "s1"
"2" = "vss"
"3" = "s0"
"4" = "com"
"5" = "vcc"
"6" = "ctrl"

[models.ratings]
max_pin_current_a = 0.05  # continuous channel current (TI)
max_voltage_v = 6.0   # Absolute Maximum Ratings, DBV/DCK supply voltage -0.5 to 6 V (6.5 V is the YZP/DSF/DRY/DRL row)

# The 1.65-5.5 V recommended VCC range is the check that fires below the 6.0 V abs max.
[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 1.65
max_v = 5.5
abs_max_v = 6.0
basis = "TI SN74LVC1G3157 SCES424O, Recommended Operating Conditions, VCC 1.65 V to 5.5 V; Absolute Maximum Ratings, DBV/DCK supply voltage -0.5 V to 6 V"

# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# 74LVC1G66: single bilateral analog switch. ONE PINOUT, EVERY VENDOR.
#
# Sources, read side by side because this entry's whole point is that they agree:
#   - TI "SN74LVC1G66 Single-Pole Single-Throw Analog Switch", SCES323R,
#     June 2001 - revised September 2025: Figures 4-1/4-2/4-3 and the Pin
#     Functions table.
#   - Nexperia "74LVC1G66 Single bilateral switch", Rev. 14.1, 3 September 2024:
#     Section 6.1 Pinning and Table 3 Pin description.
# Both give the five-lead packages as 1 = A/Y, 2 = B/Z, 3 = GND, 4 = C/E,
# 5 = VCC, and both give the six-lead ones as the same order with n.c. inserted
# at 5 and VCC moved to 6. The two vendors' names for the pins differ and nothing
# else does.
#
# THIS ENTRY'S PAD MAP WAS WRONG UNTIL NOW: it read pad 2 as GROUND and pad 3 as
# the second switch terminal, which is the two of them transposed.
#
# WHAT THAT COSTS DEPENDS ON THE BOARD, and it is worth being exact rather than
# dramatic about it. Where a board grounds BOTH pads, the two roles land on the same
# node and the transposition is invisible; the only board in this tree that fits the
# part (a large internal test board, using it as a comparator-driven reset switch) does
# exactly that, so its behaviour is unchanged by this correction. Where a board uses
# pad 2 as a signal, which is the ordinary use of a BILATERAL switch and the reason
# the pin exists, the old map stamped a ~7 Ohm switch from pad 1 onto the GROUND
# PLANE and read a live I/O as ground. Nothing warned in either case, because from
# the binder's point of view every role it wanted was present.
#
# The match rule is correspondingly vendor-neutral: the bare JEDEC number binds,
# because there is no ambiguity for it to resolve. An `mpn_re` is deliberately
# ABSENT: it ANDs with `value_re`, and the engine falls `mpn` back to the value
# field, so `mpn_re = "SN74LVC1G66"` made a board writing the bare "74LVC1G66"
# match nothing at all.
#
# DELIBERATELY NOT MODELLED: RON's dependence on the switched voltage (the
# datasheets tabulate a peak-of-curve and a near-rail value, and this is one
# constant), the charge injection, and the crosstalk.
[[models]]
id = "lvc1g66"
kind = "analog_switch"
description = "74LVC1G66 single bilateral analog switch, 5-lead SC-70/SOT-23/SOT-353 (TI and Nexperia, one pinout)"

[models.match]
# The bare JEDEC number, any vendor prefix, and the FIVE-LEAD package codes.
# TI SCES323R: DBV (SOT-23-5), DCK (SC70-5), DRL. Nexperia Rev 14.1 Table 1:
# GW (TSSOP5, SOT353-1), GV (SC-74A, SOT753), GZ (XSON5, SOT8065-1). The six-lead
# codes are excluded here and handled by the entry below, because they insert n.c.
# at pad 5 and move VCC to 6.
value_re = """(?ix) ^
    (SN|NL|ST|MC|TC)?          # vendor prefix, optional
    74LVC1G66
    (DBV|DCK|DRL|GW|GV|GZ)?    # five-lead package codes only
    R?                         # reel suffix
    ([-.,][A-Z0-9.,]*)?        # packing code; the matcher rewrites ',' to '.'
$"""

[models.params]
# TI SCES323R Section 5.8 Analog Switch Characteristics, and Nexperia Rev. 14.1
# Table 8, which agree within their tolerances.
ron  = 6.5       # Nexperia Rev 14.1 Table 8, RON(rail) at VI = GND, ISW = 24 mA,
                 # VCC = 3.0 to 3.6 V: 6.5 Ohm typ (12 max to +85 C). Nexperia
                 # tabulates THREE on-resistances and they are not interchangeable;
                 # RON(rail) is the one to use here because a single constant models
                 # a switch carrying a signal near a rail, while RON(peak) (7.8 typ
                 # on the same row) is the worst point of the curve.
                 # TI SCES323R's comparable figure is its plain `ron`, 7.5 Ohm typ
                 # (15 max) at VCC = 3 V, IS = 24 mA. TI's `ron` rows are
                 # 1.65 / 2.3 / 3 / 4.5 V giving 12 / 9 / 7.5 / 5.5 Ohm typ, and it
                 # has NO 5 V row. TI's much larger 125 and 35 Ohm figures at 1.65 V
                 # and 2.3 V are `ron(p)`, the DCK/DBV PEAK on-resistance, and an
                 # earlier version of this comment wrongly listed them as `ron`.
                 # So the two vendors agree to about 1 Ohm at a 3.3 V rail rather
                 # than exactly, and this is Nexperia's number.
roff = 5.5e6     # 5.5 V / 1 uA, from TI SCES323R IS(off) = +/-1 uA MAX at
                 # VCC = 5.5 V over the full temperature range. Nexperia Rev 14.1
                 # Table 7 gives the same parameter as +/-0.5 uA, which would be
                 # 1.1e7, and this entry takes the LEAKIER of the two for the same
                 # reason `vth` below takes the higher threshold: a part bound by
                 # this entry may be either vendor's, so the modelled switch must
                 # not be quieter in the off state than the real part could be.
                 # Derived from a measured leakage figure either way, so this is a
                 # real resistance and not a floor picked for solver comfort.
vth  = 2.31      # FALLBACK ONLY, for a control whose VCC net has no resolved
                 # rail voltage: TI's VIH at a 3.3 V rail. Wherever the rail is
                 # known the switch closes at the middle of the [models.levels]
                 # band below READ AT THAT RAIL (2.5 V on a 5 V rail, not 2.31),
                 # and the undefined-level check reports a control that sits or
                 # peaks inside the band instead of letting it silently switch.

# The control input's VIL/VIH band, as a function of VCC. THE THRESHOLDS SCALE WITH
# THE SUPPLY: a 2.3 V control on a 5 V rail is not a valid high (VIH = 3.5 V).
#   TI SCES323R Section 5.3 Recommended Operating Conditions, control input:
#     VIH min = 0.65 x VCC (1.65-1.95 V), 0.7 x VCC (2.3-2.7, 3-3.6, 4.5-5.5 V);
#     VIL max = 0.35 x VCC (1.65-1.95 V), 0.3 x VCC (2.3-2.7, 3-3.6, 4.5-5.5 V).
#   Nexperia 74LVC1G66 Rev. 14.1 Table 7 Static characteristics, pin E:
#     VIH min = 0.65 VCC / 1.7 V / 2.0 V / 0.7 VCC and VIL max = 0.35 VCC / 0.7 V /
#     0.8 V / 0.3 VCC over VCC = 1.65-1.95 / 2.3-2.7 / 2.7-3.6 / 4.5-5.5 V.
# A part this entry binds may be either vendor's, so the band is the WIDER of the
# two at every rail: the higher VIH and the lower VIL. Points in a gap between
# printed rows (1.95-2.3 V, 3.6-4.5 V) are linear between the rows either side.
[models.levels]
vih = [[1.65, 1.0725], [1.95, 1.2675], [2.3, 1.7], [2.43, 1.7], [2.7, 2.0], [2.86, 2.0], [5.5, 3.85]]
vil = [[1.65, 0.5775], [1.95, 0.6825], [2.3, 0.69], [2.7, 0.7], [3.6, 0.8], [4.5, 1.35], [5.5, 1.65]]

[models.pins]
# The five-lead map both datasheets give. `in_out_a`/`in_out_b` and NOT `com`/`s0`:
# see the control-polarity note further down this file. `s0` would make the switch
# conduct when the enable is LOW, and this part's enable is active HIGH.
"1" = "in_out_a"   # A (TI) / Y (Nexperia)
"2" = "in_out_b"   # B (TI) / Z (Nexperia)
"3" = "vss"        # GND. This is the pad that used to be read as a signal.
"4" = "ctrl"       # C (TI) / E (Nexperia), active high
"5" = "vcc"

[models.ratings]
max_pin_current_a = 0.05   # ISW / IIK / ISK, +/-50 mA (both vendors)
# 6.0 V, NOT 6.5. TI SCES323R splits its abs-max supply BY PACKAGE: 6 V for DCK
# and DBV, 6.5 V only for DRL/DRY/YZP/DSF. Nexperia's Table 5 gives a flat 6.5 V.
# This entry accepts DCK and DBV, so the tightest limit among the packages it can
# bind is 6 V, and recording 6.5 here would be half a volt UNSAFE for the two most
# common ones. The six-lead entry below can carry 6.5 because none of its packages
# are the 6 V ones.
max_voltage_v = 6.0

# ─────────────────────────────────────────────────────────────────────────────
# The SIX-LEAD packages of the same die. Identical in every respect except that
# n.c. sits at pad 5 and VCC moves to pad 6, so the five-lead map above would put
# the supply on a no-connect and leave the real supply pad unmodelled.
[[models]]
id = "lvc1g66_6pin"
kind = "analog_switch"
description = "74LVC1G66 single bilateral analog switch, 6-lead USON/X2SON/XSON6 (TI DRY/DSF, Nexperia GS/GX)"

[models.match]
# The six-lead package code is REQUIRED: a value string with no code at all is
# assumed five-lead by the entry above, which is the commoner part by a wide
# margin. A board fitting a six-lead part and writing only the bare number gets
# the five-lead map, and the symptom is a `vcc` role on a no-connect pad.
# TI SCES323R: DRY (USON-6), DSF (X2SON-6). Nexperia Rev 14.1 Table 1: GM
# (SOT886), GN (SOT1115), GS (SOT1202), all three XSON6.
value_re = "(?i)^(SN|NL|ST|MC|TC)?74LVC1G66(DRY|DSF|GM|GN|GS)R?([-.,][A-Z0-9.,]*)?$"

[models.params]
ron  = 6.5       # same die and the same rows as the five-lead entry above
roff = 5.5e6     # same TI IS(off) +/-1 uA at 5.5 V; see the five-lead entry
vth  = 2.31      # fallback only, as in the five-lead entry above

# Same die, same control band: see the five-lead entry for the TI SCES323R
# Section 5.3 and Nexperia Rev. 14.1 Table 7 rows this envelope is taken from.
[models.levels]
vih = [[1.65, 1.0725], [1.95, 1.2675], [2.3, 1.7], [2.43, 1.7], [2.7, 2.0], [2.86, 2.0], [5.5, 3.85]]
vil = [[1.65, 0.5775], [1.95, 0.6825], [2.3, 0.69], [2.7, 0.7], [3.6, 0.8], [4.5, 1.35], [5.5, 1.65]]

[models.pins]
"1" = "in_out_a"
"2" = "in_out_b"
"3" = "vss"
"4" = "ctrl"
"5" = "nc"
"6" = "vcc"

[models.ratings]
max_pin_current_a = 0.05
# 6.5 V is correct HERE: TI's 6.5 V abs-max group is exactly DRL/DRY/YZP/DSF, and
# Nexperia's flat limit is 6.5 V, so every package this entry accepts carries it.
max_voltage_v = 6.5

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "cd74hc4066"
kind = "analog_switch"
description = "CD74HC4066 quad bilateral analog switch, TSSOP-14 / DIP-14"

[models.match]
value_re = "(?i)^(CD)?74HC4066|^ul_CD74HC4066"

[models.params]
# Source: Texas Instruments CD74HC4066 datasheet (SCHS135C), Table 6.5
ron  = 30.0    # on-resistance @ 5V supply typ (Ω)
roff = 1.0e9
vth  = 1.3     # FALLBACK ONLY, for a control whose VCC net has no resolved rail
               # voltage; with a known rail the control switches at the middle
               # of the [models.levels] band below read at that rail.

# HC control-input band as a function of VCC: TI SCHS208E Section 9 Electrical
# Characteristics: HC Devices, VIH min 1.5 / 3.15 / 6.3 V and VIL max 0.5 / 1.35 /
# 2.7 V at VCC = 2 / 4.5 / 9 V (the same at every TA row). Linear between rows.
[models.levels]
vih = [[2.0, 1.5], [4.5, 3.15], [9.0, 6.3]]
vil = [[2.0, 0.5], [4.5, 1.35], [9.0, 2.7]]

[models.pins]
# TI CD74HC4066 SCHS208E Table 4-1 (p.3): 1Y 1Z 2Z 2Y 2E 3E GND | 3Y 3Z 4Z 4Y 4E 1E VCC.
# Pad 13 is control 1 (1E), not a signal pad.
"1" = "in_out_1a"
"2" = "in_out_1b"
"3" = "in_out_2a"
"4" = "in_out_2b"
"5" = "ctrl_2"
"6" = "ctrl_3"
"7" = "vss"
"8" = "in_out_3a"
"9" = "in_out_3b"
"10" = "in_out_4a"
"11" = "in_out_4b"
"12" = "ctrl_4"
"13" = "ctrl_1"
"14" = "vcc"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/cd74hc4066.pdf"
title = "TI CD54HC4066, CD74HC4066, CD74HCT4066 High-Speed CMOS Logic Quad Bilateral Switch (SCHS208E)"
locator = "pin configuration, Table 4-1 Pin Functions (p.3)"
sha256 = "337c5381f31a9b36e7cdfdc3c4199aa9534bcf80c9ff89a41dbd2744de72ace1"

[models.ratings]
max_pin_current_a = 0.025
max_voltage_v = 10.5  # TI SCHS208E Absolute Maximum Ratings, DC supply voltage VCC (HC) -0.5 to 10.5 V; 7 V is the HCT row

# The 2-10 V HC operating range is the check that fires below the 10.5 V abs max.
[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.0
max_v = 10.0
abs_max_v = 10.5
basis = "TI CD74HC4066 SCHS208E, Recommended Operating Conditions, VCC 2 V to 10 V for HC types; Absolute Maximum Ratings, DC supply voltage VCC (HC) -0.5 V to 10.5 V"

# ═════════════════════════════════════════════════════════════════════════════
# Load switches and bidirectional pass-gate level translators.
#
# These four parts arrive here rather than in digital.toml for one reason worth
# stating: their datasheets say, in their own words, that they are pass gates
# and NOT logic. TI's TXS0108E sheet (section 7.3.1) reads "This design does not
# need a direction-control signal... uses pass gate architecture with edge rate
# accelerators (one shots)", and NXP/Nexperia's NTS0104 sheet (section 14.2)
# reads "a pass-gate transistor (N-channel) that ties the ports together" plus
# "an output edge-rate accelerator (one-shot)". A part like that has no boolean
# function of its input pins, so modelling it as a `digital` entry with a logic
# block would be a fabrication of exactly the kind this database refuses.
# `analog_switch` is the honest shape: a resistance between two nodes, gated by
# a control threshold.
#
# WHAT THE PASS-GATE ENTRIES BELOW ALL LEAVE OUT, said once: the edge-rate
# accelerators (one-shots) and the dynamically switched internal pull-ups. Those
# are what make these parts work on a real bus, and they are transient
# mechanisms with no steady-state resistance to stamp. What is modelled is the
# DC conduction path and the enable threshold, which is what tells a board check
# whether a translated net is connected at all and how much series resistance it
# has. Signal integrity through these parts is NOT modelled.
#
# ON `roff` IN THIS FILE: none of these datasheets publishes an off-state
# resistance or an off-state leakage current, so no `roff` below is a datasheet
# figure. Each is a deliberately conservative floor, chosen so that the off path
# is orders of magnitude above any impedance on the boards these sit on and the
# result is therefore insensitive to the exact value. They are labelled as such
# at each use. This is the same convention the two TI entries above already use.

# ── AP22815 / AP22615A: current-limited load switches ────────────────────────
#
# Source: Diodes Incorporated AP22815/AP22615 datasheet, document DS41022
#   Rev. 6-2, April 2023. One datasheet covers both parts; they share the switch
#   die and differ in package and in whether the current limit is fixed
#   (AP22815) or set by an external RLIM resistor (AP22615).
# Primary source: https://www.diodes.com/datasheet/download/AP22815_615.pdf
#
# Datasheet figures used:
#   RDS(on)  40 mOhm typ            @ VIN = 5.0 V, IOUT = 1 A
#   ILIMIT   3.1 / 3.6 / 4.2 A      AP22815 fixed, @ VIN=5 V, VOUT=4 V; the
#                                   AP22615 hits the same band at RLIM=1.94k and
#                                   scales as ILIM(A) = 6800 / RLIM(Ohm) down to
#                                   1 A typ at RLIM = 6.8k
#   short-circuit current 1 A typ   output shorted to ground
#   IQ       300 uA typ             enabled, OUT open
#   ISHDN    0.1 uA typ (10 uA max) disabled, OUT open
#   VIN      3.0 to 5.5 V operating; abs max -0.3 to 6.0 V
#   VIH      1.2 V min (to VIN);  VIL 0.4 V max
#   tD(ON) 2.2 ms typ, tR 1.9 ms typ, tD(OFF) 0.02 ms typ, tF 0.2 ms typ
#            @ CL = 10 uF, RLOAD = 10 Ohm, VIN = 5 V
#   UVLO 2.1 / 2.5 / 2.9 V rising, 180 mV hysteresis
#   OVP  5.5 / 5.7 / 5.9 V on VOUT rising
#   TSD  140 C typ, 35 C hysteresis; TJ abs max 150 C
#   theta_JA 85 C/W (TSOT25) / 80 C/W (TSOT26); theta_JC 32 / 30 C/W
#            (JEDEC 51-7, 4-layer board)
#
# ENABLE POLARITY IS AN ORDERING OPTION, and the value string on a board usually
# does not carry it. Per the Ordering Information section, the "A" suffix is
# active-HIGH enable and "B" is active-LOW: AP22815AWT-7 vs AP22815BWT-7,
# AP22615AWU-7 vs AP22615BWU-7. The corpus value strings are "AP22815" (bare)
# and "AP22615A", so the AP22615A is unambiguous and the bare AP22815 is not.
# `vth` below is the active-high VIH either way. An earlier version of this note
# claimed a B part would merely "show as the switch being off when the board intends
# it on", i.e. that the failure was in the safe direction. That is half of it. An
# inverted enable is wrong in BOTH directions and the other one is a phantom rail:
# when the board drives the enable HIGH to turn a B part OFF, this model closes
# 40 mOhm and presents the switched rail as live. So the `B` codes are REFUSED by the
# regex now rather than bound with the wrong polarity, and a board fitting one is
# disclosed as an open part.
#
# The bare "AP22815" the corpus carries names no polarity at all, so binding it is
# still an assumption. It is bound active-high, the commoner option and the one that
# board fits, and the `warning` below says so on the report.
#
# The AP22615's fitted-RLIM threshold is consumed by the ampacity check; the
# ideal-switch solver still does not clamp current. The AP22815's fixed
# threshold, soft-start ramp, UVLO, output over-voltage protection, thermal
# shutdown, and FLG fault output are not dynamically modelled.
[[models]]
id = "ap22815"
kind = "analog_switch"
description = "AP22815 current-limited load switch, 40 mOhm, TSOT25 (Diodes Inc)"

[models.match]
# The bare part, or an A-suffixed ordering code. The group REQUIRES the A, so a `B`
# code cannot slip in through the trailing character class the way it did when this
# read `^AP22815[AB]?[A-Z0-9-]*$`: there `[AB]?` matched empty and `[A-Z0-9-]*`
# swallowed "BWT-7".
value_re = "(?i)^AP22815(A[A-Z0-9-]*)?$"

[models.params]
ron  = 0.04      # RDS(on) typ @ VIN = 5.0 V, IOUT = 1 A
roff = 5.0e7     # NOT A DATASHEET FIGURE. Conservative floor from ISHDN
                 # 0.1 uA typ at 5 V, which is 5e7 Ohm of equivalent leakage.
vth  = 1.2       # EN VIH min, active-high ordering option; see the note above
# THE POLARITY ASSUMPTION, on a surface a reader meets. `bind_analog_switch` reads
# this param and both the bind report and the evidence map carry it; the note above
# reaches nobody who has not opened this file.
warning = """the bare part number names no enable-polarity ordering option, so this \
is modelled as the active-high variant; if the board fits an active-low part the \
switch conducts on exactly the wrong half of the control range, presenting this \
rail as live when the board has switched it off"""
# Enable pin: Diodes AP22815 / AP22615 DS41022 Rev. 7-2 (https://www.diodes.com/datasheet/download/AP22815_615.pdf,
# sha256 275b781c64ec6275cfb7ea48790bf73b5c0d91ce43959d83bd7043e029661ba9). The datasheet gives no internal pull.
en_on_level = "high"
en_open = "undefined"
en_open_basis = "DS41022 Rev. 7-2 PDF p.13 Application Information, ON/OFF Input Operator: \"This pin should not be left floating.\""
must_not_float_roles = "ctrl"
[models.pins]
# Pinout, TSOT25 (5-pin). Pin 5 is IN; the ISET pin does not exist on this part.
"1" = "in_out_a" # OUT. NOT `com`: see the control-polarity note below.
"2" = "vss"      # GND
"3" = "flg"      # open-drain fault flag
"4" = "ctrl"     # EN, active high on this ordering option
"5" = "in_out_b" # IN. NOT `s0`, for the same reason.

[models.pin_capability.open_drain]
basis = "DS41022 Rev. 7-2 PDF p.3 Pin Descriptions: FLG \"Overcurrent and Overtemperature Fault Report; Open-drain flag is active-low when triggered.\""
[models.pin_capability.open_drain.pads]
"3" = "FLG"
[models.ratings]
# The absolute-maximum table states only "load current: internal limited" and
# gives no numeric pin-current destruction threshold, so do not invent one.
max_voltage_v = 6.0       # VIN abs max (3.0 to 5.5 V operating)
max_junction_temp_c = 150.0
theta_ja_c_per_w = 85.0   # TSOT25, JEDEC 51-7 4-layer board
theta_jc_c_per_w = 32.0

# ─────────────────────────────────────────────────────────────────────────────

# Capacitance and flag bias, Diodes AP22815 / AP22615 DS41022 Rev. 7-2 (https://www.diodes.com/datasheet/download/AP22815_615.pdf, sha256 275b781c64ec6275cfb7ea48790bf73b5c0d91ce43959d83bd7043e029661ba9).
[[models.supply_cap]]
role = "in_out_b"
side = "input"
grade = "required"
min_f = 1.0e-6
min_single_f = 1.0e-6
basis = "DS41022 Rev. 7-2 p.12 Application Information, Input and Output Capacitors: \"It is required to place a 1uF X7R or X5R ceramic bypass capacitor between IN and GND - close to the device\""
note = "Without it an output short can ring the input past the maximum rating and destroy the control circuitry. The datasheet recommends 10 uF or 47 uF here when the output transient load is heavy (p.12), and 10 uF rather than 1 uF in its typical-application note 4 (p.2)."

[[models.supply_cap]]
role = "in_out_a"
side = "output"
grade = "required"
min_f = 1.0e-7
basis = "DS41022 Rev. 7-2 p.12 Input and Output Capacitors: bypass the output with a 0.1uF ceramic capacitor, which improves immunity to short-circuit transients; p.13 Board Layout Instruction: input and output capacitors 1uF and 0.1uF+100uF \"must be implemented\""
note = "It keeps an output short from driving the output negative and ringing the input. For hot-plug loads the datasheet also wants a minimum of 100 uF low-ESR electrolytic or tantalum (or 22 uF MLCC) on the output (p.12), which this check does not require."

[[models.pin_bias]]
role = "flg"
level = "high"
needs = "pull"
open_ok = true
basis = "DS41022 Rev. 7-2 p.3 pin table: FLG \"Open-drain flag is active-low when triggered\"; p.12 FLG Response: \"the FLG open-drain output goes active-low\""
note = "An open-drain output can only pull the pin low, so a pin that something reads needs a pull-up to read high when there is no fault; an unused flag may be left open."

[[models]]
id = "ap22615a"
kind = "analog_switch"
description = "AP22615A adjustable current-limited load switch, 40 mOhm, TSOT26"

[models.match]
# The A suffix is the active-high enable variant and is what the corpus carries.
value_re = "(?i)^AP22615A[A-Z0-9_-]*$"

[models.params]
ron  = 0.04      # same switch die as the AP22815 above
roff = 5.0e7     # NOT A DATASHEET FIGURE; same conservative floor, see above
vth  = 1.2       # EN VIH min, active high (the A suffix)
# Enable pin: Diodes AP22815 / AP22615 DS41022 Rev. 7-2 (https://www.diodes.com/datasheet/download/AP22815_615.pdf,
# sha256 275b781c64ec6275cfb7ea48790bf73b5c0d91ce43959d83bd7043e029661ba9). The datasheet gives no internal pull.
en_on_level = "high"
en_open = "undefined"
en_open_basis = "DS41022 Rev. 7-2 PDF p.13 Application Information, ON/OFF Input Operator: \"This pin should not be left floating.\""
must_not_float_roles = "ctrl"
[models.pins]
# Pinout, TSOT26 (6-pin): the ISET pin is what the extra pin buys.
"1" = "in_out_a" # OUT. NOT `com`: see the control-polarity note below.
"2" = "vss"      # GND
"3" = "flg"
"4" = "ctrl"     # EN, active high (the A suffix)
"5" = "iset"     # RLIM to GND sets the limit: ILIM(A) = 6800 / RLIM(Ohm)
"6" = "in_out_b" # IN. NOT `s0`, for the same reason.

[models.pin_capability.open_drain]
basis = "DS41022 Rev. 7-2 PDF p.3 Pin Descriptions: FLG \"Overcurrent and Overtemperature Fault Report; Open-drain flag is active-low when triggered.\""
[models.pin_capability.open_drain.pads]
"3" = "FLG"
[models.ratings]
# As for AP22815, the absolute-maximum table gives no numeric load-current max.
max_voltage_v = 6.0
max_junction_temp_c = 150.0
theta_ja_c_per_w = 80.0   # TSOT26
theta_jc_c_per_w = 30.0

# The nominal current-limit transfer is the board's choice: ILIM(A) = 6800 /
# RLIM(Ohm) with RLIM to GND on ISET. Attributing the part's own ceiling to the
# switched rail would invent a load, so the fitted resistor decides the point
# estimate. The 6.8 kOhm table row has no published maximum; see the note below.
[models.current_program]
pin = "iset"
semantics = "protection_limit"
# This is an overload/OCP threshold, not a commanded output current. The
# ampacity engine therefore never promotes it into a steady-state load. Do not
# cap it at the 3 A recommended continuous current: that recommendation is VIN
# dependent (1.5 A below 4 V) and is a different physical quantity.
equation = "inverse_resistance"
k_volts = 6800.0

# ── PCA9306: dual bidirectional I2C voltage-level translator ─────────────────
#
# Source: Texas Instruments PCA9306 datasheet SCPS113O, October 2004, revised
#   September 2023.
#
# A pure analog bidirectional switch with no direction pin: "allows
# bidirectional voltage translations... without the use of a direction pin"
# (Overview). Of the three pass-gate parts in this file it is the cleanest fit
# for the `analog_switch` kind, because it has no one-shots at all, just the
# switch and its EN gate.
#
# ON-RESISTANCE, AND A DISCREPANCY IN THE DATASHEET ITSELF. The feature bullets
# claim "<3.5 Ohm", and that figure is not reproduced anywhere in the actual RON
# table. The table's rows are:
#   RON typ 25.5 / max 32 Ohm    @ VI = 0, IO = 15 mA,  EN = 1.5 V
#   RON typ 3.5  / max 5.5 Ohm   @ VI = 0, IO = 64 mA,  EN = 4.5 V
# i.e. the headline number is the high-EN, high-current row. `ron` below carries
# the 1.5 V EN row (25.5 Ohm), because that is the row an EN driven from a 1.8 V
# or 3.3 V logic rail actually operates on, and it is the pessimistic one. A
# board that ties EN to 4.5 V or above gets a switch modelled ~7x more resistive
# than it is, which errs toward reporting a marginal I2C rise time rather than
# hiding one.
#
# Other datasheet figures used:
#   VREF1 / VREF2  0 to 5.5 V operating; abs max -0.5 to 7 V
#   EN active HIGH: "When EN is high, the translator switch is ON"
#   VIK (EN input clamp) -1.2 V max; IIH(EN) 5 uA max at VI = 5 V
#   IREF 5 uA max
#   tPLH 0.8 ns max, tPHL 1.2 ns max @ EN = 3.3 V, translating down, CL = 50 pF
#   Cio(off) 6 pF max, Cio(on) 12.5 pF max
#   continuous channel current 128 mA abs max; IPASS 64 mA recommended max
#   TJ max 125 C; theta_JA 275.5 C/W (DCU / VSSOP-8)
#
# PACKAGE NOTE: the corpus value string is "PCA9306JK", and TI's PCA9306 has NO
# "JK" package option. The orderable packages are DCT (SSOP-8), DCU (VSSOP-8),
# DQE (X2SON-8) and YZT (DSBGA-8). All four share an identical pinout, which is
# why the mismatch is harmless here and the pin map below is correct regardless;
# but the value string is a part-number error on the board, and the thermal
# figure carried below is the DCU one.
#
# NOT MODELLED: this part supplies no pull-ups of its own (SDA/SCL are open-drain
# I2C lines pulled up by the board), and it publishes no VOH/VOL, VIH/VIL or
# quiescent supply current at all because it drives nothing. `vth` below is the
# EN pin's threshold, not a data-path threshold.

# Capacitance and flag bias, Diodes AP22815 / AP22615 DS41022 Rev. 7-2 (https://www.diodes.com/datasheet/download/AP22815_615.pdf, sha256 275b781c64ec6275cfb7ea48790bf73b5c0d91ce43959d83bd7043e029661ba9).
[[models.supply_cap]]
role = "in_out_b"
side = "input"
grade = "required"
min_f = 1.0e-6
min_single_f = 1.0e-6
basis = "DS41022 Rev. 7-2 p.12 Application Information, Input and Output Capacitors: \"It is required to place a 1uF X7R or X5R ceramic bypass capacitor between IN and GND - close to the device\""
note = "Without it an output short can ring the input past the maximum rating and destroy the control circuitry. The datasheet recommends 10 uF or 47 uF here when the output transient load is heavy (p.12), and 10 uF rather than 1 uF in its typical-application note 4 (p.2)."

[[models.supply_cap]]
role = "in_out_a"
side = "output"
grade = "required"
min_f = 1.0e-7
basis = "DS41022 Rev. 7-2 p.12 Input and Output Capacitors: bypass the output with a 0.1uF ceramic capacitor, which improves immunity to short-circuit transients; p.13 Board Layout Instruction: input and output capacitors 1uF and 0.1uF+100uF \"must be implemented\""
note = "It keeps an output short from driving the output negative and ringing the input. For hot-plug loads the datasheet also wants a minimum of 100 uF low-ESR electrolytic or tantalum (or 22 uF MLCC) on the output (p.12), which this check does not require."

[[models.pin_bias]]
role = "flg"
level = "high"
needs = "pull"
open_ok = true
basis = "DS41022 Rev. 7-2 p.3 pin table: FLG \"Open-drain flag is active-low when triggered\"; p.12 FLG Response: \"the FLG open-drain output goes active-low\""
note = "An open-drain output can only pull the pin low, so a pin that something reads needs a pull-up to read high when there is no fault; an unused flag may be left open."

[[models]]
id = "pca9306"
kind = "analog_switch"
description = "PCA9306 dual bidirectional I2C level translator (pass gate), VSSOP-8"

[models.match]
value_re = "(?i)^PCA9306[A-Z0-9]*$"

[models.params]
ron  = 25.5      # RON typ @ EN = 1.5 V, IO = 15 mA (32 Ohm max). See above for
                 # why this row rather than the 3.5 Ohm feature bullet.
roff = 1.0e9     # NOT A DATASHEET FIGURE: this sheet publishes no off-state
                 # leakage or resistance. Conservative floor, matching the
                 # convention of the two TI entries at the top of this file.
vth  = 1.5       # EN threshold. TI publishes no VIH/VIL for EN; 1.5 V is the
                 # EN level its own RON table is characterised at, so it is the
                 # one voltage the datasheet actually commits to for this pin.
# `warning` IS THE DISCLOSURE, and it exists because the pin-map note below is not
# one: `bind_analog_switch` reads this key and the bind report prints it, whereas a
# TOML comment reaches nobody. The part binds and counts as resolved, so the gap has
# to travel with it.
warning = """one pass gate of two is modelled (SCL1<->SCL2, 25.5 Ohm gated by EN); \
the SDA channel is present on the board but not stamped, so nothing here decides \
whether SDA is continuous through the translator or what series resistance it sees"""
[models.pins]
# DCT / DCU / DQE pinout (identical numbering across all three).
# ONLY THE SCL CHANNEL IS STAMPED, and the role names say which. This part has two
# independent pass gates (SCL1<->SCL2 and SDA1<->SDA2) sharing one EN, and the
# binder's multi-gate path needs a `ctrl_<n>` per gate, which a pad-to-role map
# cannot supply from a single EN pad. So one channel gets the switch-terminal names
# and the other gets plain names that no binder path can pick.
#
# The previous map named pad 3 (SCL1) `s0` and pad 5 (SDA2) `com`, which is not
# merely one channel of two: those two pads are on DIFFERENT channels, so the
# single-throw path bridged SCL1 to SDA2 and fabricated a cross-channel short that
# does not exist on any board. It was also inverted, for the `s0` reason below.
"1" = "vss"      # GND
"2" = "vref1"    # low-side reference
"3" = "in_out_b" # SCL1, the modelled channel's low side
"4" = "sda1"     # SDA1. Deliberately not a switch-terminal role: the second gate
                 # is not stamped, and a name the binder recognises as a throw
                 # would be a claim this entry does not make.
"5" = "sda2"     # SDA2, likewise
"6" = "in_out_a" # SCL2, the modelled channel's high side
"7" = "vref2"    # high-side reference
"8" = "ctrl"     # EN, active high
[models.ratings]
max_pin_current_a = 0.064  # IPASS recommended max (128 mA abs max)
max_voltage_v = 7.0        # abs max on VREF1/VREF2 (0 to 5.5 V operating)
max_junction_temp_c = 125.0
theta_ja_c_per_w = 275.5   # DCU / VSSOP-8

# ── TXS0108E: 8-bit bidirectional pass-gate level translator ─────────────────
#
# MNT Reform. Source: Texas Instruments TXS0108E datasheet SCES642L, December
#   2007, revised November 2024.
#
# Section 7.3.1, verbatim: "This design does not need a direction-control
# signal... uses pass gate architecture with edge rate accelerators (one
# shots)." So this is a switch, not a buffer, and the entry is here rather than
# in digital.toml for that reason.
#
# Datasheet figures used:
#   pass-gate on-resistance   300 to 500 Ohm ("on the order of"), section 7.3.1
#   internal pull-ups         RPUA / RPUB, 40 kOhm while the output drives low
#                             and 4 kOhm while it drives high, switched by the
#                             one-shot circuitry; disabled when OE is low
#   OE                        active HIGH; VIH 0.65 x VCCA min, VIL 0.35 x VCCA
#                             max. Enable time 200 ns max, disable 400 ns max.
#   VCCA 1.4 to 3.6 V, VCCB 1.65 to 5.5 V, VCCA <= VCCB always
#   abs max VCCA -0.5 to 4.6 V, VCCB -0.5 to 6.5 V
#   ICCA + ICCB 8 uA max over the 1.5-3.6 / 2.3-5.5 V range
#   tPHL/tPLH 3.8 to 4.2 ns max, VCCA = VCCB = 3.3 V, push-pull driving
#   IO +-50 mA abs max; continuous through VCCA/VCCB/GND +-100 mA
#   TJ max 150 C; theta_JA 88.9 C/W (PW / TSSOP-20)
#
# `ron` = 400 Ohm, the midpoint of the datasheet's own 300-to-500 range. That
# range is the whole of what TI publishes for the conduction path: there is no
# RON table, no test condition, and no min/typ/max, so 400 is a midpoint of a
# stated interval rather than a measured typical, and any result that turns on
# the difference between 300 and 500 Ohm should not be trusted from this model.
#
# NOT MODELLED, and on this part the omission is large: the one-shots are what
# let the pass gate drive a bus at all, and the 4k/40k dynamic pull-ups are what
# hold a line high. Without them this entry represents a 400 Ohm resistor per
# channel gated by OE. That is enough to answer "is this net connected through
# the translator, and what series resistance does it see", and it is NOT enough
# to answer anything about rise time, drive strength or bus contention. All eight
# channels are independent here; nothing couples them.
[[models]]
id = "txs0108e"
kind = "analog_switch"
description = "TXS0108E 8-bit bidirectional level translator (pass gate only), TSSOP-20"

[models.match]
value_re = "(?i)^TXS0108E[A-Z]{0,4}R?$"

[models.params]
ron  = 400.0     # midpoint of the datasheet's stated 300-500 Ohm pass-gate
                 # range; see the note above, this is an interval midpoint
roff = 1.0e9     # NOT A DATASHEET FIGURE; conservative floor
vth  = 2.145     # FALLBACK ONLY (OE VIH min at VCCA = 3.3 V) for an unresolved
                 # VCCA; with a known VCCA, OE switches mid-band of the table below
# See the PCA9306 note above for why this is a param and not a comment.
warning = """one channel of eight is modelled (A1<->B1, 400 Ohm gated by OE); the \
other seven are not stamped, and the edge-rate one-shots and the 4k/40k dynamic \
pull-ups are not modelled at all, so this part answers connectivity and series \
resistance only, never rise time, drive strength or bus contention"""

# OE's band is referenced to VCCA, not VCCB: TI SCES642L Section 5.3 Recommended
# Operating Conditions, OE: VIH min = VCCA x 0.65, VIL max = VCCA x 0.35, over
# VCCA = 1.4 to 3.6 V.
[models.levels]
vih = [[1.4, 0.91], [3.6, 2.34]]
vil = [[1.4, 0.49], [3.6, 1.26]]

[models.level_rails]
vcca = ["ctrl"]

[models.pins]
# PW (TSSOP-20).
# ONE CHANNEL OF EIGHT IS STAMPED, A1<->B1, and only that pair carries
# switch-terminal names. The other seven are named plainly so no binder path can
# pick them: the multi-gate path needs a `ctrl_<n>` per gate and this part has one
# OE for all eight, which a pad-to-role map cannot express.
#
# The previous map named every A pin `s0`..`s7` and every B pin `com`..`com7`. The
# single-throw path picked `com`/`s0`, which IS the A1/B1 pair, so the channel was
# right; what was wrong was the polarity, for the `s0` reason below.
"1"  = "in_out_b" # A1, the modelled channel's A side
"2"  = "vcca"
"3"  = "a2"       # A2..A8 and B2..B8: named, not stamped. See above.
"4"  = "a3"
"5"  = "a4"
"6"  = "a5"
"7"  = "a6"
"8"  = "a7"
"9"  = "a8"
"10" = "ctrl"     # OE, active high
"11" = "vss"      # GND
"12" = "b8"
"13" = "b7"
"14" = "b6"
"15" = "b5"
"16" = "b4"
"17" = "b3"
"18" = "b2"
"19" = "vccb"
"20" = "in_out_a" # B1, the modelled channel's B side
[models.ratings]
max_pin_current_a = 0.05   # IO abs max
max_voltage_v = 6.5        # VCCB abs max (VCCA is 4.6 V)
max_junction_temp_c = 150.0
theta_ja_c_per_w = 88.9    # PW / TSSOP-20

# ═════════════════════════════════════════════════════════════════════════════
# NTS0104GU12 DELIBERATELY LEFT UNRESOLVED.
#
# Nexperia's (originally NXP's) 4-bit dual-supply translator, XQFN-12, on the
# ZSWatch boards. Architecturally it is the same animal as the TXS0108E above
# and would belong here: section 14.2 of the datasheet describes "a pass-gate
# transistor (N-channel) that ties the ports together" plus "an output edge-rate
# accelerator (one-shot)", and each port carries an internal 10 kOhm pull-up to
# its own VCC, disabled when OE is low.
#
# IT IS NOT MODELLED BECAUSE THE DATASHEET PUBLISHES NO ON-RESISTANCE. Not a
# table row, not a range, not a test condition. The `analog_switch` kind's
# defining parameter is `ron`, and the one number this entry would need is the
# one number the sheet does not contain. Everything else about the part is
# documented and none of it substitutes: VOH min 0.67 x VCCO at IO = 20 uA and
# VOL max 0.4 V at IO = 1 mA describe the port levels, not the pass path.
#
# Recorded, from NXP "NTS0104" Rev. 3, 3 January 2012 (the current revision;
# Nexperia inherited the design unchanged), for whenever a figure turns up:
#   OE active HIGH, VIH 0.65 x VCC(A) min, VIL 0.35 x VCC(A) max; ten 200 ns max,
#     tdis 35 ns max (-40 to 85 C)
#   internal pull-ups 10 kOhm to VCC(A) on the A ports and to VCC(B) on the B
#     ports, disabled when OE is low
#   VCC(A) 1.65 to 3.6 V, VCC(B) 2.3 to 5.5 V, VCC(A) <= VCC(B) required;
#     abs max both -0.5 to +6.5 V
#   ICC(A) 2.4 uA max, ICC(B) 12 uA max, sum 14.4 uA max
#   tPHL/tPLH 2.6 to 4.4 ns max at VCC(A) = VCC(B) = 3.3 V
#   IO 50 mA max, ICC / IGND 100 mA max, Ptot 250 mW
#   pin map, GU12 (XQFN-12): 1=VCC(A) 2=A1 3=A2 4=A3 5=A4 6=GND 7=B4 8=B3 9=B2
#     10=B1 11=VCC(B) 12=OE
#   no TJ max and no theta_JA published in this revision

# ─────────────────────────────────────────────────────────────────────────────
# THE `s0` ROLE CARRIES A CONTROL-LOW CONTRACT, AND AN ACTIVE-HIGH LOAD SWITCH
# MUST NOT USE IT. Read this before adding another switch to this file.
#
# `bind_analog_switch`'s single-throw path decides its polarity from the ROLE
# NAMES: if the second terminal it picks is the one named `s0`, it senses the
# INVERTED control (`b_is_control_low`) and closes the switch when the control is
# LOW. That is correct and deliberate for an SPDT part, where `s0` is the
# normally-closed throw (`role_from_pinfunction` maps a pin named NC onto it for
# the same reason). It is exactly wrong for a single active-high load switch: the
# modelled rail is then off when the silicon is on and on when it is off, which is
# worse than the unresolved-open it replaced, because it is not disclosed.
#
# So the three load switches below name their two terminals `in_out_a` (the
# switched output) and `in_out_b` (the input), the bilateral-switch vocabulary,
# which leaves the default control-HIGH polarity in place. `com`/`s0` would read
# more naturally for a load switch and would be silently inverted.
#
# EVERY SINGLE-THROW ENTRY IN THIS FILE NOW OBEYS THIS, and four of them did not
# when the rule was first written down: AP22815, AP22615A, PCA9306 and TXS0108E all
# named `com`/`s0` while documenting an active-high enable, so all four modelled
# their switched path off exactly when the silicon has it on. Two of them had a
# second problem: PCA9306's `com` and `s0` sat on DIFFERENT channels, so the
# stamped switch was a cross-channel short between SCL1 and SDA2 that exists on no
# board. They are corrected above, and
# `no_single_throw_switch_names_the_control_low_throw` in the models suite is the
# mechanical guard, so the next entry cannot reintroduce it.
#
# A TRUE SPDT part is different and keeps `s0`/`s1`: there the control-low sense is
# correct, because `s0` is the normally-closed throw. The guard therefore keys on
# `s0` WITHOUT `s1`, which is exactly the single-throw shape.

# ─────────────────────────────────────────────────────────────────────────────
# TPS22916: TI 2 A ultra-low-leakage load switch, DSBGA-4 (YFP).
#
# Source: TI "TPS22916 5.5-V, 2-A, 70-mOhm On-Resistance Load Switch With
#   Ultra-Low Leakage Current", SLVSDO5F, July 2017 - revised December 2021,
#   Section 5 Pin Configuration and Functions, Section 6.3 Recommended Operating
#   Conditions, Section 6.5 Electrical Characteristics and Section 6.1 Absolute
#   Maximum Ratings.
#
# `ron` IS THE 3.6 V ROW, NOT A 3.3 V ONE, because the datasheet has no 3.3 V row:
# it tabulates VIN = 5, 3.6, 1.8, 1.2 and 1 V at IOUT = 200 mA, and the two rows
# either side of a 3.3 V board are 70 mOhm (at 3.6 V) and 100 mOhm (at 1.8 V).
# Interpolating between them would be invention, so the nearer row is used verbatim
# and the reader is told which. A board running this part at 1.8 V is modelled
# ~30 mOhm optimistically.
#
# `roff` IS NOT A DATASHEET FIGURE. The sheet gives no output-side leakage at all,
# only ISD,VIN (the current the disabled part draws on VIN with VOUT at ground):
# 10 nA typ, 100 nA max on the C ordering option. Treating that as leakage THROUGH
# the switch is the conservative reading and gives 5.5 V / 100 nA = 55 MOhm, so
# 5.0e7 is used, the same floor and the same reasoning as the AP22815 entry above.
#
# DELIBERATELY NOT MODELLED: the soft-start ramp (the whole reason to fit this
# part rather than a bare PMOS), the quick-output-discharge option, and the
# reverse-current blocking. The ideal-switch path has no current limit either, so
# the 2 A rating is a stress-check number and not a behaviour.
[[models]]
id = "tps22916"
kind = "analog_switch"
description = "TPS22916 load switch, 70 mOhm, DSBGA-4 (TI)"

[models.match]
# The three ACTIVE-HIGH ordering options, which differ only in soft-start slew and
# quick-output-discharge and share this pinout and on-resistance: TPS22916B (fast,
# with discharge), TPS22916C (slow, with discharge) and TPS22916CN (slow, no
# discharge), each optionally carrying the YFP package code and an R reel suffix.
#
# THE `L` OPTIONS ARE EXCLUDED BY NAME. TPS22916BL, CL and CNL are the ACTIVE-LOW
# enable variants (the datasheet's orderable table gives their sense in a column of
# its own), and no single `vth` can serve both senses: an active-low part bound
# here would conduct on exactly the half of the control range where it is off.
#
# The bare "TPS22916YFP" the board carries names no polarity letter at all, so
# binding it is an assumption that it is one of the active-high options. SLVSDO5F's
# Device Comparison Table lists six versions, three and three: TPS22916B, C and CN
# are Active High, and TPS22916BL, CL and CNL are Active Low. This regex will not
# accept a code that says active-low out loud, and the `warning` below states the
# assumption for the polarity-less spelling.
#
# An earlier version of this note called the mismatch merely "diagnosable", on the
# grounds that it would show as the switch being off when the board intended it on.
# That is one half. The other half is a phantom rail: with an L part, a control line
# driven high to turn the switch OFF closes this model and presents the switched rail
# as live. The same correction is on the AP22815 entry above.
value_re = "(?i)^TPS22916(B|C|CN)?(YFP)?R?$"

[models.params]
ron  = 0.07      # RON typ at VIN = 3.6 V, IOUT = 200 mA, 25 C (90 mOhm max at
                 # 25 C, 120 mOhm over -40 to +85 C); see the note above
roff = 5.0e7     # NOT A DATASHEET FIGURE. Conservative floor from ISD,VIN
                 # 100 nA max at 5.5 V. See the note above.
vth  = 1.0       # ON pin VIH min, 1 V over the whole 1 to 5.5 V VIN range
                 # (VIL max is 0.35 V)
# Same disclosure as the AP22815 above, for the same reason: the assumption lives in
# the match rule, so it has to travel with the bind rather than sit in a comment.
warning = """the part number carries no polarity letter, so this is modelled as one \
of the active-high options (B, C, CN); if the board fits an active-low L part the \
switch conducts on exactly the wrong half of the control range, presenting this \
rail as live when the board has switched it off"""
# Enable pin, TI TPS22916 SLVSDO5F (https://www.ti.com/lit/ds/symlink/tps22916.pdf, sha256
# a4d81b70556d5564aaee9baf455b7651375a94c629448f3f7e7ced2f5c41b33f). The datasheet prints the smart
# pulldown resistance but no statement that an open ON pin is off, so en_open is not set. The
# pulldown is connected while VON <= VIL (Table 8-3, PDF p.17) and disconnected at VON >= VIH.
en_on_level = "high"
en_pull_down_ohms = 7.5e5
en_open_basis = "SLVSDO5F PDF p.1 Features, Smart ON pin pulldown: \"ON ≤ VIL (RPD): 750 kΩ (typ.)\"; PDF p.1 Description: \"a smart pulldown is used to keep the ON pin from floating until system sequencing is complete\"; PDF p.17 Table 8-3 Smart-ON Pulldown: VON ≤ VIL Connected, VON ≥ VIH Disconnected"

[models.pins]
# Section 5, YFP (DSBGA-4). Bump names, not numbers: the Eagle package on the
# margay datalogger spells them A1/B1/B2/A2 and this map matches. Cross-checked
# against that board: A2 on the battery rail, A1 on the switched rail, B2 on an
# MCU control net, B1 on ground.
"A1" = "in_out_a"   # VOUT. NOT `com`: see the control-polarity note above.
"A2" = "in_out_b"   # VIN. NOT `s0`, for the same reason.
"B1" = "vss"        # GND
"B2" = "ctrl"       # ON. Active high on every LETTERED option this entry matches;
                    # see `warning` above for the polarity-less spelling.

[models.ratings]
# Section 6.1 Absolute Maximum Ratings.
max_current_a       = 2.0    # IMAX continuous switch current
max_surge_current_a = 2.5    # IPLS, pulse < 300 us at 2% duty
max_voltage_v       = 6.0    # VIN / VOUT / VON, -0.3 to 6 V

# ─────────────────────────────────────────────────────────────────────────────
# MIC94090: Microchip (ex-Micrel) 1.2 A high-side load switch, SC-70-6.
#
# Source: Microchip "MIC94090/1/2/3/4/5 High-Side Load Switches for Consumer
#   Applications", DS20006706B, Section "Pin Description", Electrical
#   Characteristics and Absolute Maximum Ratings.
#
# `ron` IS THE 3.6 V ROW for the same reason as the TPS22916 above: the tabulated
# points are VIN = 3.6 V (140 mOhm typ, 255 max) and VIN = 2.5 V (170 typ,
# 315 max), both at ID = -100 mA and VEN = 1.5 V, and there is no 3.3 V row.
#
# `vth` IS THE GUARANTEED-ON END OF A BAND, NOT A THRESHOLD. This part does not
# publish a VIH/VIL pair; it publishes VEN_TH as a range, 0.4 V min to 1.25 V max,
# meaning the switch is guaranteed OFF below 0.4 V and guaranteed ON above 1.25 V
# and the sheet declines to say where in between it turns. 1.25 V is used, so the
# model turns on only where the real part certainly does; a board driving EN to
# 1 V would show as off here and might be on in silicon.
#
# `roff` from ISHUT-SWITCH, the off-state leakage measured on VOUT: 1 uA max at
# VIN = 5.5 V, so 5.5 MOhm. That IS an output-side leakage figure, unlike the
# TPS22916's, so this one is derived from the right quantity.
#
# WHAT THE SUFFIX DIGIT ACTUALLY SELECTS, since it is easy to assume it is the
# enable polarity and it is not. Across the MIC9409x family the odd parts
# (MIC94091/3/5) add a 250 Ohm auto-discharge load on VOUT when the switch is
# disabled, and the digit also selects the soft-start speed (-0/-1 ultra-fast,
# -2/-3 a 790 us ramp, -4/-5 a 120 us one). THE ENABLE IS ACTIVE HIGH ON THE WHOLE
# FAMILY: the datasheet says an active pull-down holds the part off "until the
# enable pin is pulled above 1.25V". So the regex demands the trailing 0 not
# because a sibling would invert the enable but because the discharge resistor and
# the ramp are real differences this entry does not carry.
#
# DELIBERATELY NOT MODELLED: the output discharge resistor on the -1/-3/-5 parts
# (absent on this one), the soft-start ramp, the reverse-leakage blocking, and the
# body-diode path.

# Input capacitance, TI TPS22916 SLVSDO5F (https://www.ti.com/lit/ds/symlink/tps22916.pdf,
# sha256 a4d81b70556d5564aaee9baf455b7651375a94c629448f3f7e7ced2f5c41b33f).
[[models.supply_cap]]
role = "in_out_b"
side = "input"
grade = "recommended"
min_f = 1.0e-6
basis = "TPS22916 SLVSDO5F section 10 Power Supply Recommendations (PDF p.19): \"In most situations, using an input capacitance (CIN) of 1 uF is sufficient to prevent the supply voltage from dipping when the switch is turned on\""
note = "A slow supply or a large load step can need more bulk capacitance on the input. The datasheet states no output capacitor minimum."

[[models]]
id = "mic94090"
kind = "analog_switch"
description = "MIC94090 high-side load switch, 140 mOhm, active-high enable, SC-70-6 (Microchip)"

[models.match]
# "MIC94090C6" is the SC-70-6 ordering code the margay writes ("C6" is the
# package); "MIC94090YC6" is the vendor's own spelling of it. The regex pins the
# trailing 0 so no sibling with a discharge FET or a different soft-start ramp can
# borrow this entry, and it pins the C6 package code so the 4-lead UDFN (the "MT"
# code), which has a different pad count and pinout, cannot.
value_re = "(?i)^MIC94090Y?C6(TR)?$"

[models.params]
ron  = 0.14      # RON typ at VIN = 3.6 V, ID = -100 mA, VEN = 1.5 V (255 mOhm max)
roff = 5.5e6     # from ISHUT-SWITCH 1 uA max at VIN = 5.5 V: an output-side
                 # leakage figure, so this one is genuinely derived
vth  = 1.25      # VEN_TH max: the guaranteed-ON end of the band. See the note.
en_on_level = "high"
en_open = "off"
en_pull_down_ohms = 2.0e6
en_open_basis = "DS20006706B Table 4-1 Pin Function Table (printed page 15, PDF p.18 of the PCN copy), EN: \"Active-high CMOS-compatible control input for switch. Internal 2 MΩ pull down resistor to GND, output will be off if this pin is left floating.\"; the Typical Application Circuits (printed page 2) draw the 2 MΩ from EN to GND"

[models.pins]
# The "Package Types" SC-70-6 top view. That figure is a DRAWING, not a table, so
# unlike most maps in this file it cannot be quoted as text, and the corroboration
# does the work: on the margay datalogger both pads 2 and 5 are on GND, pad 4 is
# the unswitched input, pad 1 the switched output, pad 6 an MCU control net and
# pad 3 unconnected. Six pads, six agreements.
#
# Pads 2 and 5 are BOTH ground; they carry different role names because the binder
# keys roles by string and a duplicate would drop one of the two connections.
"1" = "in_out_a"  # VOUT, drain of the internal P-channel FET. NOT `com`: see the
                  # control-polarity note at the head of this block.
"2" = "vss"       # GND
"3" = "nc"        # no connection
"4" = "in_out_b"  # VIN, source of the internal P-channel FET. NOT `s0`.
"5" = "gnd"       # GND (second pad)
"6" = "ctrl"      # EN, active high across the whole family

[models.ratings]
# Absolute Maximum Ratings.
max_current_a       = 1.2    # ID continuous, SC-70-6, TA = 25 C
max_surge_current_a = 6.0    # IDP pulsed, < 300 us at < 2% duty
max_voltage_v       = 6.0    # VIN and VEN

# ─────────────────────────────────────────────────────────────────────────────
# TPS2104: TI dual-input single-output power multiplexer, SOT-23-5.
#
# Source: TI "TPS2104/TPS2105 Single Output, Dual Input Power Multiplexers",
#   SLVS235A, September 1999 - revised April 2000, Pin Assignment, Electrical
#   Characteristics and Absolute Maximum Ratings.
#
# Both paths are stamped: EN LOW joins IN1 to OUT through 0.25 ohm, EN HIGH
# joins IN2 to OUT through 1.3 ohm (25 C typical, 5 V inputs). The Function
# Tables on page 2 define selection; there is no third, disabled control state.
# The vcc-less SPDT binder references both controls to GND.
#
# VIL max = 0.8 V and VIH min = 2.0 V are guaranteed logic levels, NOT two
# measured switching thresholds. vth = 1.4 V is their derived midpoint for the
# ideal switch's +/-0.25 V band. It selects the correct throw throughout either
# guaranteed logic region; the intermediate region and transition timing are
# not validated. No physical hysteresis is claimed.
#
# The sheet specifies no off-state output leakage: roff = 1e9 is the engine's
# ideal-open approximation, not a measured resistance. Body-diode blocking,
# discharge, charge-pump startup, supply current and break-before-make timing
# are omitted. Current limits below use the recommended operating ceilings,
# not the higher absolute stress ratings, which do not guarantee operation.

[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.farnell.com/datasheets/4314383.pdf"
title = "Microchip MIC94090/1/2/3/4/5 High Side Load Switches for Consumer Applications, DS20006706B (2022-2024), as attached to Microchip PCN SYST-09PKEC043 (15 April 2024)"
locator = "Table 4-1 Pin Function Table (printed page 15); Typical Application Circuits (printed page 2); Section 5.0 Application Information (printed page 16 onward)"
sha256 = "b25fdaafb9afd361ba964d5926a6b99766c029730d73461558d7530f0d9df8d6"
[[models.source.uncertainty]]
status = "unknown"
parameter = "supply_cap"
reason = "DS20006706B prints no input or output capacitor value or recommendation: the Typical Application Circuits (printed page 2) draw an unvalued battery-and-capacitor symbol on VIN and nothing on VOUT, and Section 5.0 Application Information covers power dissipation only, so no [[models.supply_cap]] row is written"


[[models]]
id = "tps2104"
kind = "analog_switch"
description = "TPS2104 dual-input power mux, SOT-23-5 (both throws, typical DC resistance)"

[models.match]
# The TPS2105 is the same silicon with the OPPOSITE enable polarity, so it must
# NOT bind here: with the selection convention above it would conduct on exactly the
# wrong half of the control range. The regex pins the trailing 4.
#
# THE PACKAGE CODE IS REQUIRED, and it used to be optional. SLVS235A's AVAILABLE
# OPTIONS table gives this part in TWO packages, SOT-23-5 (DBV) and SOIC-8 (D), with
# an R suffix for tape and reel, so "TPS2104D" and "TPS2104DR" are real orderable
# strings that the old `^TPS2104[A-Z0-9-]*$` accepted. The Terminal Functions table
# numbers them differently in every position that matters:
#           DBV (this map)      D (SOIC-8)
#   EN            1                  3
#   GND           2                  2
#   IN2           3                  1
#   OUT           4                7, 8
#   IN1           5                  5
#   NC            -                4, 6
# So a SOIC-8 board bound to this map would get `ctrl` on IN2 (a supply rail), `s0`
# on EN and `com` on a no-connect, with OUT unmapped entirely: a switch stamped
# between the enable signal and a dead pad, gated by a rail, and carrying this
# entry's confident `warning` describing a throw that is not there. The
# single-throw binder's open-terminal guard cannot save it, because both pads it
# wants do resolve to nets.
#
# The regex therefore accepts the bare part and the DBV codes, and REFUSES the D
# codes: the group requires DBV, so "TPS2104D" and "TPS2104DR" no longer match while
# "TPS2104" and "TPS2104DBVR" still do. A SOIC-8 board resolves to nothing and is
# disclosed as an open part; the D pinout wants its own entry when someone needs it.
#
# The BARE spelling is what the margay datalogger writes and it names no package, so
# binding it to the DBV map is an assumption. It is the right default (SOT-23-5 is
# the commoner part and is what that board fits) and the `warning` below says so, but
# it is an assumption and not a reading.
value_re = "(?i)^TPS2104(DBV[A-Z0-9-]*)?$"

[models.params]
ron = 0.25       # IN1-OUT typ, TJ=25 C, both inputs 5 V, rated current (page 5)
ron_s0 = 0.25    # IN1, selected on EN LOW; hot typ/max retained below
ron_s1 = 1.3     # IN2, selected on EN HIGH; same test conditions
roff = 1.0e9     # No output leakage specification; numerical ideal-open approximation
vth = 1.4        # DERIVED midpoint of VIL max 0.8 V and VIH min 2.0 V, not measured
warning = """IN1 and IN2 use typical 25 C on-resistance at 5 V inputs, not guaranteed \
worst-case or temperature-dependent resistance. EN below 0.8 V selects IN1; above \
2.0 V selects IN2. Intermediate levels and switching timing are not validated; the \
1.4 V midpoint and hysteresis band are numerical approximations. Off-state leakage, \
reverse/body-diode blocking, discharge, charge-pump startup, quiescent current and \
break-before-make timing are not modelled. Current limits are recommended operating \
ceilings, not absolute stress ratings. A bare part name assumes SOT-23-5 (DBV); the \
SOIC-8 has a different pinout and does not bind here"""

[models.pins]
# Pin Assignment, DBV (SOT-23-5). Cross-checked against the margay datalogger:
# pad 1 driven by the board's USB-present comparator, pad 3 on the USB rail, pad 4
# on the main rail, pad 5 on the switched battery rail.
"1" = "ctrl"      # EN. Active LOW for IN1 / active HIGH for IN2 on this part.
"2" = "vss"       # GND
"3" = "s1"        # IN2, the auxiliary throw selected on EN HIGH
"4" = "com"       # OUT, the common terminal of the two throws
"5" = "s0"        # IN1, the main input: the throw selected on a LOW control,
                  # which is what the `s0` role means to the SPDT binder.

[models.ratings]
max_current_a = 0.1       # Least favourable path; the tagged rows select 0.5 A on IN1
max_pin_current_a = 0.1   # Fallback when a path cannot be measured
max_voltage_v = 6.0       # IN1 / IN2 / EN / OUT, -0.3 to 6 V absolute maximum
max_power_w = 0.123       # DBV at TA=85 C; tagged TA rows restore 0.309 W at 25 C
theta_ja_c_per_w = 322.5806451612903 # DERIVED 1/(3.1 mW/C), DBV dissipation table
max_junction_temp_c = 125.0

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/tps2104.pdf"
title = "TI TPS2104, TPS2105 VAUX Power-Distribution Switches, SLVS235A, September 1999, revised April 2000"
locator = "Absolute maximum ratings; dissipation rating table; recommended operating conditions; electrical characteristics, power switch and enable input"

# On-resistance test points are retained, but only the 25 C typicals drive the model.
[[models.source.characteristic]]
parameter = "rDS(on) IN2-OUT"
typ = 1.3
unit = "ohm"
conditions = "TJ = 25 °C, VI(IN1) = VI(IN2) = 5 V, IO = rated current"
basis = "SLVS235A electrical characteristics, power switch, typ column"

[[models.source.characteristic]]
