# Behaviour source: TI SN74HC165 datasheet (SCLS052I), function table: PL_n
# (SH/LD) LOW loads A..H asynchronously (dominant over the clock); with PL_n
# HIGH and CLK_INH LOW, a CLK rising edge shifts the data one stage TOWARD QH
# (QH shows H after a load, then G, F, ..., shift_left with QH = bit 7) while
