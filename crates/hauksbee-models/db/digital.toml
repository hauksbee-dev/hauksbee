[models.params]
# Source: TI 74HC02 datasheet (SCLS050). Quad 2-input NOR. Where the four gates
# are wired in cross-coupled PAIRS they form NOR set/reset latches; the binder
# detects the cross-couple and emits a NorLatch behavioral component per latch.
