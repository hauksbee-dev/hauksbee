warning = "source-bound supply-draw model: VDD operating current is 2.5 mA typ at 2.3 V, 3.3 V, and 5.5 V with no load and fSCL=1 MHz; only supply draw and the 2.3 V to 5.5 V operating range are executable; I2C communication, LED output drive and logic states, individual and group PWM, oscillator behavior, and OE control are not modeled"

