# ── NTS0104GU12: 4-bit auto-direction translator, IDENTITY ONLY ─────────────
# Pass-gate plus one-shot edge accelerators (datasheet section 14.2), the same
# architecture as the TXS0108E, and the sheet publishes no pass-gate
# on-resistance, so no existing primitive can model it honestly (see the
# NTS0104 note in analog_switch.toml). This card names the part, maps its pins
# and checks its supply envelopes; it binds as identity-only and every verdict
# that depends on translation stays unresolved.
[[models]]
