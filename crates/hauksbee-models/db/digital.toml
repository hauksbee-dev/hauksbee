# ─────────────────────────────────────────────────────────────────────────────
# CY7C68013A-56LTX: Cypress (Infineon) EZ-USB FX2LP USB 2.0 microcontroller,
# 56-pin QFN.
#
# Source: Cypress "CY7C68013A/CY7C68014A/CY7C68015A/CY7C68016A EZ-USB FX2LP USB
#   Microcontroller High-Speed USB Peripheral Controller", Document Number
#   38-08032 Rev. AD (revised April 30, 2021). Figure 10 56-Pin QFN Pin
#   Assignment (p.23); Table 11 FX2LP Pin Descriptions, 56 QFN column
#   (pp.24-29); Absolute Maximum Ratings, Operating Conditions and Table 13
#   Thermal Characteristics (p.41); Table 14 DC Characteristics (p.42); Ordering
#   Information (p.60: -56LTXC, -56LTXCT, -56LTXI are the 56 QFN Pb-free codes);
#   QFN package notes (die paddle soldered to a thermal pad).
#
# PACKAGE HAZARD. The same die ships as 56 SSOP, 56 VFBGA, 100 TQFP and 128
# TQFP, every one with a different pin map (the 56 SSOP has PD5/FD13 on pin 1
# where the QFN has RDY0). This card takes the 56 QFN map only, by the -56LT
# order code. The CY7C68015A/16A QFN parts swap two pins (54 PE1, 13 PE0) and
# are not matched.
#
# IDENTITY AND SUPPLY/PIN LEVEL ONLY. The 8051 core, the firmware, the USB
# serial interface engine, the GPIF and slave FIFOs and the I2C boot loader are
# not modelled, so no port pin is driven and the part stays OPEN. What is
# sourced: the pin map, the 3.3 V supply envelope with its 4.0 V absolute
# maximum, the 5.25 V-tolerant input levels and the 4 mA output levels.
[[models]]
id = "cy7c68013a_56ltx"
kind = "digital"
description = "Cypress/Infineon CY7C68013A EZ-USB FX2LP USB microcontroller, 56-pin QFN (identity, pin map, supply range, levels and ratings; the 8051, USB engine and GPIF are not modeled, the part stays OPEN)"

[models.source]
