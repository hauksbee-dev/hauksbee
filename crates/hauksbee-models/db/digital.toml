  "a0", "a1", "a2", "a3", "a4", "a5", "a6", "a7", "a8", "a9",
  "a10", "a11", "a12", "a13", "a14", "ce_n", "oe_n", "we_n",
]
outputs = ["io0", "io1", "io2", "io3", "io4", "io5", "io6", "io7"]

[[models.logic.memory]]
name = "cell"
words = 32768
bits = 8
page_words = 64
byte_load_timeout_s = 0.00015
program_time_s = 0.010
init = 0xff
address = [
  "a0", "a1", "a2", "a3", "a4", "a5", "a6", "a7", "a8", "a9",
  "a10", "a11", "a12", "a13", "a14",
]
