# ── SN74LVC8T245: 8-bit dual-supply transceiver, 1.65 V to 5.5 V per port ───
# Source: TI SN74LVC8T245 datasheet SCES584D (June 2005, revised May 2026),
#   https://www.ti.com/lit/ds/symlink/sn74lvc8t245.pdf (sha256
#   a2493b65471e5c873e3f71afbe152ac4d0f9233045c5ec289bda602a4b453cf0).
#   Pin map: Figure 4-1 (DW, NS, DB, DBQ, DGV, PW, p.4) and Table 4-1 Pin
#   Functions (p.5): 1 VCCA, 2 DIR, 3-10 A1-A8, 11-13 GND, 21-14 B1-B8, 22 OE,
#   23-24 VCCB. Absolute maximum supply and I/O -0.5 to 6.5 V, continuous
#   output current +/-50 mA: 5.1 (p.6). VCCA/VCCB 1.65 to 5.5 V and the VIH/VIL
#   bands of data inputs (against VCCI) and control inputs (against VCCA): 5.3
#   (p.7). VOH/VOL, ICCA + ICCB: 5.6 Electrical Characteristics (p.9). tpd:
#   5.9 Switching Characteristics, VCCA = 3.3 V (p.11). Function: 7.4 and
#   Table 7-1 (p.15): OE low, DIR low, B data to A; OE low, DIR high, A data
#   to B; OE high, isolation. DIR and OE are supplied by VCCA (p.1, Table 4-1).
# Both ports are bidirectional, so each carries an output and a sensed `*_in`
# input, as the 74HCT245 card does.
[[models]]
id = "sn74lvc8t245"
kind = "digital"
description = "TI SN74LVC8T245 8-bit dual-supply translating bus transceiver, 3-state, 1.65 V to 5.5 V, SOIC/SO/SSOP/TVSOP/TSSOP-24"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/sn74lvc8t245.pdf"
title = "TI SN74LVC8T245 8-bit dual-supply bus transceiver with configurable voltage translation and 3-state outputs (SCES584D), May 2026"
locator = "Figure 4-1 p.4; Table 4-1 Pin Functions p.5; 5.1 Absolute Maximum Ratings p.6; 5.3 Recommended Operating Conditions p.7; 5.6 Electrical Characteristics p.9; 5.9 Switching Characteristics p.11; 7.4 and Table 7-1 Function Table p.15"
sha256 = "a2493b65471e5c873e3f71afbe152ac4d0f9233045c5ec289bda602a4b453cf0"
[[models.source.uncertainty]]
status = "unknown"
parameter = "translation_timing"
reason = "enable/disable times, Ioff and IOZ leakage, delta ICC and the VCC-isolation behaviour (outputs Hi-Z when either supply is below 100 mV) are not modelled; only the DC function table, the supply-referenced levels, the output resistance and the 3.3 V-to-3.3 V delay are"
[[models.source.uncertainty]]
status = "unknown"
parameter = "voh_above_4v5"
reason = "5.6 gives VOH = VCCO - 0.1 V at -100 uA only for VCCO 1.65 V to 4.5 V; the VOH table stops at 4.5 V and is not extended, so a 5 V port reads the 4.4 V level"

