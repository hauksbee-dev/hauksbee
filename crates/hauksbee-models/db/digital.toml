# Behaviour source: TI SN74HC74 datasheet, function table: PRE_n LOW sets
# Q HIGH asynchronously; CLR_n LOW clears Q LOW asynchronously; with both
# HIGH, a CLK rising edge captures D; CLK LOW/HIGH levels hold. The
# both-asserted row (PRE_n and CLR_n LOW: Q = Q_n = HIGH, unstable) is not
# representable in a 1-bit register and is deliberately not faked: the FIRST
# declared reset (CLR_n) wins while both are held (a documented refusal, and
# the datasheet itself marks the state unstable/invalid on release).
