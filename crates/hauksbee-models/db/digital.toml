# ─────────────────────────────────────────────────────────────────────────────
# APDS-9306-065: Broadcom (Avago) digital ambient light sensor, 6-pin
# 2.0 x 2.0 x 0.65 mm package.
#
# Source: Avago Technologies "APDS-9306/APDS-9306-065 Miniature Surface-Mount
#   Digital Ambient Light Sensor" data sheet, AV02-4755EN, October 21, 2016.
#   Ordering Information; "APDS-9306-065 I/O Pins Configuration" table; Absolute
#   Maximum Ratings; Recommended Operating Conditions; Operating Characteristics
#   (VDD = 2.8 V, 25 C); I2C Protocol; register map and the PART_ID register
#   description.
#
# ONE SUPPLY, ABSOLUTE LEVELS. Unlike the Bosch parts there is no VDDIO pin: the
# input thresholds are printed in volts (VIH 1.5 V min, VIL 0.4 V max), so no
# rail has to be assumed. INT is open drain and the sheet gives VOL only
# and no VOH; `voh` is deliberately absent (nothing on this part drives high).
#
# THE TWO PACKAGES HAVE DIFFERENT PINOUTS. The plain APDS-9306 is an 8-pad part
# (GND on pad 1, VDD on pad 4, SCL/SDA on 5/6) and reports PART_ID 0xB1; only the
# -065 ordering code may use this map and its 0xB3 ID.
[[models]]
id = "apds9306_065"
kind = "digital"
description = "Broadcom APDS-9306-065 ambient light sensor, 6-pin (I2C PART_ID subset, pad map, logic levels and supply draw)"

[models.match]
# The -065 ordering code only (Ordering Information lists APDS-9306 and
# APDS-9306-065, both tape and reel).
value_re = "(?i)^APDS-9306-065$"

[models.params]
# Operating Characteristics, VDD = 2.8 V, TA = 25 C.
vol   = 0.4      # VOL, INT output low voltage, max (the row names INT only)
vih   = 1.5      # SCL, SDA input high voltage, min
vil   = 0.4      # SCL, SDA input low voltage, max
supply_static_ua = 85.0    # IDD typ, G = 18x, 50 ms (ALS active); the only
                           # active-current row. ISTBY is 2 uA max in standby.
supply_pin = "3"           # VDD
gnd_pin    = "6"           # GND

[models.pins]
# "APDS-9306-065 I/O Pins Configuration" table, all 6 pads.
"1" = "scl"      # I2C serial clock input
"2" = "sda"      # I2C serial data I/O
"3" = "vdd"      # supply, 1.7 to 3.6 V
"4" = "int"      # interrupt, open drain
"5" = "nc"       # no connect
"6" = "gnd"

[models.ratings]
# Absolute Maximum Ratings: VDD 3.8 V max; SCL, SDA, INT -0.5 to 3.8 V.
max_voltage_v = 3.8

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.7
max_v = 3.6
basis = "Avago AV02-4755EN, Recommended Operating Conditions, Supply Voltage VDD row"

# I2C Protocol: "The device supports a single slave address of 0X52 hex using
# 7-bit addressing protocol." No strap: there is no address pin.
[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "APDS-9306-065 part-id subset"
bus = "i2c"
i2c_address = 0x52

# Register map and PART_ID description: register 06h, read-only, default value
# B3h for the APDS-9306-065 (B1h for the APDS-9306).
[[sensor.register]]
addr = 0x06
const = [0xB3]

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.7    # Recommended Operating Conditions, VDD min
idle_a = 0.000085             # Operating Characteristics, IDD typ (ALS active)
read_a = 0.000085
write_a = 0.000085
low_power_a = 0.000002        # Operating Characteristics, ISTBY max, standby,
                              # no active I2C communication

[models.coverage]
implements = ["pin_roles", "logic_levels", "active_supply_current", "absolute_ratings", "supply_ranges", "i2c_fixed_address", "register_map_subset", "part_id_read", "bus_coupled_active_current", "supply_voltage_gating"]
