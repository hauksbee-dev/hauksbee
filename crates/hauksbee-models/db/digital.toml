# ─────────────────────────────────────────────────────────────────────────────
# LIS3MDL: STMicroelectronics 3-axis magnetometer, LGA-12 2 x 2 x 1 mm.
#
# Source: STMicroelectronics "LIS3MDL Digital output magnetic sensor:
#   ultra-low-power, high-performance 3-axis magnetometer", DocID024204 Rev 4,
#   May 2015. Table 1 Device summary, Table 2 Pin description, Table 5
#   Electrical characteristics, Table 8 Absolute maximum ratings, Section 5.1.1
#   I2C operation / Table 11, Section 7.1 WHO_AM_I (0Fh) / Table 17. ST's host
#   refused every request from here; the copy read is Rev 4 as mirrored at
#   pololu.com/file/0J1089/LIS3MDL.pdf.
#
# NO LOGIC LEVELS. This revision of the sheet prints no VIH/VIL/VOH/VOL anywhere,
# so `[models.params]` carries none; the logic-level check abstains on this part
# rather than reading a borrowed threshold.
#
# SUPPLY DRAW is Table 5's ultra-high-resolution figure, 270 uA typ at 20 Hz,
# the highest current the sheet prints (low-power 40 uA, power-down 1 uA).
[[models]]
id = "lis3mdl"
kind = "digital"
description = "ST LIS3MDL 3-axis magnetometer, LGA-12 (strap-selected I2C WHO_AM_I subset, pad map and supply draw; no logic levels on the sheet)"

[models.match]
# Table 1 Device summary order codes: LIS3MDL (tray), LIS3MDLTR (tape and reel).
value_re = "(?i)^LIS3MDL(TR)?$"

[models.params]
supply_static_ua = 270.0   # Table 5 Idd_HR typ, ultra-high-resolution, ODR 20 Hz
supply_pin = "5"           # Vdd
gnd_pin    = "3"           # GND

[models.pins]
# Table 2 Pin description, all 12 pads.
"1"  = "scl"     # I2C SCL / SPI SPC
"2"  = "rsvd"    # reserved: connect to GND
"3"  = "gnd"
"4"  = "c1"      # capacitor connection, C1 = 100 nF
"5"  = "vdd"     # supply, 1.9 to 3.6 V
"6"  = "vddio"   # I/O supply, 1.71 V to Vdd + 0.1 V
"7"  = "int"     # interrupt
"8"  = "drdy"    # data ready
"9"  = "sdo"     # SPI SDO; in I2C the address bit SA1 (Section 5.1.1)
"10" = "cs"      # 1: SPI idle / I2C enabled; 0: SPI mode, I2C disabled
"11" = "sda"     # I2C SDA / SPI SDI / 3-wire SDO
"12" = "rsvd2"   # reserved: connect to GND

[models.ratings]
# Table 8: Vdd and Vdd_IO -0.3 to 4.8 V; control pins -0.3 V to Vdd_IO + 0.3 V;
# "Supply voltage on any pin should never exceed 4.8 V."
max_voltage_v = 4.8

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.9
max_v = 3.6
basis = "ST LIS3MDL DocID024204 Rev 4, Table 5, Vdd supply voltage row"

# Table 2: CS high enables I2C. Section 5.1.1: SAD is 00111x0b; SDO/SA1 to
# supply gives 0011110b (0x1E), to ground 0011100b (0x1C).
[models.peripheral]
kind = "register_map"
required_high_roles = ["cs"]
address_select_role = "sdo"
address_when_low = 0x1C
address_when_high = 0x1E
spec_toml = '''
[sensor]
name = "LIS3MDL who_am_i subset"
bus = "i2c"
i2c_address = 0x1C

# Section 7.1 / Table 17: WHO_AM_I (0Fh) = 0011 1101b.
[[sensor.register]]
addr = 0x0F
const = [0x3D]

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.9    # Table 5, Vdd min
idle_a = 0.00027              # Table 5, Idd_HR typ
read_a = 0.00027
write_a = 0.00027
low_power_a = 0.000001        # Table 5, Idd_PD power-down typ

[models.coverage]
implements = ["pin_roles", "high_resolution_supply_current", "absolute_ratings", "supply_ranges", "i2c_bus_mode_strap", "i2c_address_strap", "register_map_subset", "who_am_i_read", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["logic_levels", "full_register_map", "spi_register_map", "magnetic_field_data", "temperature_sensor", "power_mode_state", "interrupt_engine", "supply_domain_current_split"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.pololu.com/file/0J1089/LIS3MDL.pdf"
title = "STMicroelectronics LIS3MDL Digital output magnetic sensor, DocID024204 Rev 4, May 2015"
locator = "Table 1; Table 2 Pin description; Table 5; Table 8; Section 5.1.1 I2C operation; Section 7.1 WHO_AM_I"
sha256 = "25a64d1f772da769a0959d9d2abb259a8c3e7a175af845ce9c92a2d51dc08176"

# ─────────────────────────────────────────────────────────────────────────────
# LSM6DS3: STMicroelectronics 6-axis IMU (accelerometer + gyroscope), LGA-14L
# 2.5 x 3 x 0.83 mm.
#
# Source: STMicroelectronics "LSM6DS3 iNEMO inertial module: always-on 3D
#   accelerometer and 3D gyroscope", DocID026899 Rev 4, April 2015. Table 1 Device summary,
#   Table 2 Pin description, Table 4 Electrical characteristics, Table 8
#   Absolute maximum ratings, Section 6.1.1 I2C operation, Section 9.11
#   WHO_AM_I (0Fh) / Table 44. ST's host refused every request from here; the
#   copy read is Rev 4 as mirrored by SparkFun (DM00133076.pdf).
#
# NOT THE LSM6DS3TR-C. That later part shares the LGA-14L footprint and pinout
# but is a different die (its WHO_AM_I is 0x6A, not 0x69) and is excluded by the
# anchor. The value string is all the binder has: a board whose schematic says
# "LSM6DS3" but fitted the TR-C would read the wrong ID through this entry.
#
# NO LOGIC LEVELS: this sheet prints no VIH/VIL/VOH/VOL, so none are carried and
# the logic-level check abstains on this part. SUPPLY DRAW is the Table 4
# high-performance figure for gyroscope + accelerometer, 1.25 mA typ (up to
# ODR = 1.6 kHz), the highest the sheet prints; power-down is 6 uA typ.
[[models]]
id = "lsm6ds3"
kind = "digital"
description = "ST LSM6DS3 6-axis IMU, LGA-14L (strap-selected I2C WHO_AM_I subset, pad map and supply draw; no logic levels on the sheet)"

[models.match]
# Table 1 Device summary: LSM6DS3 (tray) and LSM6DS3TR (tape and reel). The
# anchor rejects LSM6DS3TR-C and LSM6DS33 (separate entries / different dies).
value_re = "(?i)^LSM6DS3(TR)?$"

[models.params]
supply_static_ua = 1250.0  # Table 4 IddHP typ, gyro + accel high-performance
supply_pin = "8"           # VDD
gnd_pin    = "6"           # GND

[models.pins]
# Table 2 Pin description (LGA-14L), all 14 pads; mode 1 (primary I2C/SPI with
# the auxiliary master unused) named, other modes in the comments.
"1"  = "sdo"     # SPI SDO; in I2C the address LSB SA0 (Section 6.1.1)
"2"  = "sdx"     # mode 1: connect to VDDIO or GND; mode 2: master I2C MSDA
"3"  = "scx"     # mode 1: connect to VDDIO or GND; mode 2: master I2C MSCL
"4"  = "int1"    # programmable interrupt 1
"5"  = "vddio"   # I/O supply, 1.62 V to Vdd + 0.1 V
"6"  = "gnd"
"7"  = "gnd2"
"8"  = "vdd"     # supply, 1.71 to 3.6 V
"9"  = "int2"    # programmable interrupt 2 / DEN
"10" = "ocs"     # mode 1/2: leave unconnected; mode 3: aux SPI enable
"11" = "nc"      # leave unconnected
"12" = "cs"      # 1: SPI idle / I2C enabled; 0: SPI mode, I2C disabled
"13" = "scl"     # I2C SCL / SPI SPC
"14" = "sda"     # I2C SDA / SPI SDI

[models.ratings]
# Table 8: Vdd -0.3 to 4.8 V; control pins to Vdd_IO + 0.3 V; "Supply voltage on
# any pin should never exceed 4.8 V."
max_voltage_v = 4.8

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.71
max_v = 3.6
basis = "ST LSM6DS3 DocID026899 Rev 4, Table 4, Vdd supply voltage row"

# Table 2: CS high enables I2C. Section 6.1.1: SAD 110101xb; SDO/SA0 to supply
# gives 1101011b (0x6B), to ground 1101010b (0x6A).
[models.peripheral]
kind = "register_map"
required_high_roles = ["cs"]
address_select_role = "sdo"
address_when_low = 0x6A
address_when_high = 0x6B
spec_toml = '''
[sensor]
name = "LSM6DS3 who_am_i subset"
bus = "i2c"
i2c_address = 0x6A

# Section 9.11: WHO_AM_I (0Fh), read-only, "Its value is fixed at 69h."
[[sensor.register]]
addr = 0x0F
const = [0x69]

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.71   # Table 4, Vdd min
idle_a = 0.00125              # Table 4, IddHP typ
read_a = 0.00125
write_a = 0.00125
low_power_a = 0.000006        # Table 4, IddPD power-down typ

[models.coverage]
implements = ["pin_roles", "high_performance_supply_current", "absolute_ratings", "supply_ranges", "i2c_bus_mode_strap", "i2c_address_strap", "register_map_subset", "who_am_i_read", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["logic_levels", "full_register_map", "spi_register_map", "acceleration_data", "angular_rate_data", "power_mode_state", "fifo", "interrupt_engine", "embedded_functions", "sensor_hub_i2c_master", "supply_domain_current_split"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://cdn.sparkfun.com/assets/learn_tutorials/4/1/6/DM00133076.pdf"
title = "STMicroelectronics LSM6DS3 iNEMO inertial module, DocID026899 Rev 4, April 2015"
