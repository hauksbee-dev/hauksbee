# ─────────────────────────────────────────────────────────────────────────────
# INA233: Texas Instruments PMBus current/voltage/power monitor, DGS (VSSOP-10).
#
# Source: TI "INA233 36V, 16-Bit, Ultra-Precise I2C and PMBus Output Current,
#   Voltage, Power, and Energy Monitor With Alert",
#   SBOS790A, April 2017, revised March 2025. Section 4 Table 4-1 Pin Functions
#   (Figure 4-1 DGS top view), Section 5.1 Absolute Maximum Ratings, Section 5.5
#   Electrical Characteristics, Section 6.5.6.1 Table 6-2 Address Pins and Target
#   Addresses, Section 6.5.6.2 Serial Interface, Table 6-4 Supported PMBus
#   Commands, Section 6.6.3.7 TI_MFR_ID (E0h), Package Option Addendum.
#
# THE SHUNT IS EXTERNAL. IN+ and IN- only sense across a board resistor, so
# leaving them high-impedance here does not open the measured power path (unlike
# the INA260, whose 2 mOhm shunt is on-die and which therefore has no entry).
#
# THE 6 V CEILING IS THE SUPPLY AND BUS PINS'. Section 5.1: VS 6 V; SDA, SCL and
# A0/A1 GND - 0.3 to 6 V; but IN+, IN- (common mode) and VBUS -0.3 to 40 V. A
# `digital` entry's max_voltage_v is not watched per pin, and the sensing pins
# legitimately sit on rails far above 6 V.
#
# LOGIC LEVELS ARE ABSOLUTE (Section 5.5, SDA pin): VIH 1.4 V min, VIL 0.4 V max,
# VOL 0.4 V max at 3 mA on SDA and ALERT. Both outputs are open drain, so there
# is no VOH.
#
# IDENTITY: TI_MFR_ID (E0h) is a read-word of 5449h ("TI", Table 6-4; Section
# 6.6.3.7 gives value = 01010100 01001001). Section 6.5.6.2: "All data bytes are
# transmitted least significant byte first", so the wire order is 49h, 54h. The
# block-read MFR_ID/MFR_MODEL commands (99h/9Ah) carry a byte count this
# pointer-style subset does not model, so only the word register is carried.
[[models]]
id = "ina233"
kind = "digital"
description = "TI INA233 PMBus current/power monitor, VSSOP-10 (strapped I2C TI_MFR_ID subset, pad map, logic levels and supply draw)"

[models.match]
# Package Option Addendum: INA233AIDGSR (VSSOP DGS, 10 pins) is the orderable
# part; the bare INA233 is the name boards carry. INA230/INA231/INA226 are
# different parts with different maps and are excluded.
value_re = "(?i)^INA233(AIDGSR?)?$"

[models.params]
# Section 5.5 Electrical Characteristics, absolute volts.
vol   = 0.4      # VOL max, IOL = 3 mA, SDA and ALERT
vih   = 1.4      # VIH min, SDA pin
vil   = 0.4      # VIL max, SDA pin
supply_static_ua = 310.0   # Section 5.5 IQ typ (400 uA max)
supply_pin = "6"           # VS
gnd_pin    = "7"           # GND

[models.pins]
# Table 4-1 Pin Functions, DGS (VSSOP-10), all 10 pins.
"1"  = "a1"      # address pin: GND, SCL, SDA or VS (Table 6-2)
"2"  = "a0"      # address pin: GND, SCL, SDA or VS (Table 6-2)
"3"  = "alert"   # PMBus alert, open-drain output
"4"  = "sda"     # serial data, open-drain I/O
"5"  = "scl"     # serial clock, open-drain input
"6"  = "vdd"     # VS, power supply, 2.7 to 5.5 V
"7"  = "gnd"
"8"  = "vbus"    # bus voltage input, -0.3 to 40 V
"9"  = "in_n"    # IN-, load side of the external shunt
"10" = "in_p"    # IN+, supply side of the external shunt

[models.ratings]
# Section 5.1: VS 6 V; SDA, SCL, A0, A1 6 V. See the note above on IN+/IN-/VBUS.
max_voltage_v = 6.0

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.7
max_v = 5.5
basis = "TI SBOS790A, Section 5.5, Operating supply range row"

# Table 6-2 has 16 addresses from four levels (GND, VS, SDA, SCL) on each of A0
# and A1, all listed below as printed (binary 1000000 = 0x40 ... 1001111 =
# 0x4F). A strap the binder cannot read as one of the four (floating, or on some
# other net) binds the spec default 0x40 marked assumed.
[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "INA233 TI_MFR_ID subset"
bus = "i2c"
i2c_address = 0x40

# Table 4-1, DGS (VSSOP-10); the same pad map as [models.pins].
[sensor.pins]
1 = "a1"
2 = "a0"
3 = "alert"
4 = "sda"
5 = "scl"
6 = "vdd"
7 = "gnd"
8 = "vbus"
9 = "in_n"
10 = "in_p"

# Table 6-2 Address Pins and Target Addresses, rows in printed order.
[[sensor.address_select]]
address = 0x40
straps = { a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x41
straps = { a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x42
straps = { a1 = "low", a0 = "sda" }
[[sensor.address_select]]
address = 0x43
straps = { a1 = "low", a0 = "scl" }
[[sensor.address_select]]
address = 0x44
straps = { a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x45
straps = { a1 = "high", a0 = "high" }
[[sensor.address_select]]
address = 0x46
straps = { a1 = "high", a0 = "sda" }
[[sensor.address_select]]
address = 0x47
straps = { a1 = "high", a0 = "scl" }
[[sensor.address_select]]
address = 0x48
straps = { a1 = "sda", a0 = "low" }
[[sensor.address_select]]
address = 0x49
straps = { a1 = "sda", a0 = "high" }
[[sensor.address_select]]
address = 0x4A
straps = { a1 = "sda", a0 = "sda" }
[[sensor.address_select]]
address = 0x4B
straps = { a1 = "sda", a0 = "scl" }
[[sensor.address_select]]
address = 0x4C
straps = { a1 = "scl", a0 = "low" }
[[sensor.address_select]]
address = 0x4D
straps = { a1 = "scl", a0 = "high" }
[[sensor.address_select]]
address = 0x4E
straps = { a1 = "scl", a0 = "sda" }
[[sensor.address_select]]
address = 0x4F
straps = { a1 = "scl", a0 = "scl" }

# Table 6-4 / Section 6.6.3.7: TI_MFR_ID (E0h) = 5449h, sent LSB first (6.5.6.2).
[[sensor.register]]
addr = 0xE0
const = [0x49, 0x54]

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 2.0    # Section 5.5, VPOR typ
idle_a = 0.000310             # Section 5.5, IQ typ
read_a = 0.000310
write_a = 0.000310
low_power_a = 0.000002        # Section 5.5, IQ power-down (shutdown) typ

[models.coverage]
implements = ["pin_roles", "logic_levels", "active_supply_current", "absolute_ratings", "supply_ranges", "i2c_address_strap", "four_level_address_pins", "register_map_subset", "manufacturer_id_read", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["full_pmbus_command_set", "block_read_commands", "shunt_and_bus_measurement", "power_accumulator", "alert_engine", "sense_pin_ratings"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/ina233.pdf"
title = "Texas Instruments INA233 36V, 16-Bit, Ultra-Precise I2C and PMBus Output Current, Voltage, Power, and Energy Monitor With Alert, SBOS790A, April 2017, revised March 2025"
locator = "Table 4-1 Pin Functions; Section 5.1; Section 5.5; Section 6.5.6.1 Table 6-2; Section 6.5.6.2; Table 6-4; Section 6.6.3.7 TI_MFR_ID"
sha256 = "33ccbb5b59f20c2907a64c0a23881cd6baeac434c9482b2e16572b89a5ca0845"

# ─────────────────────────────────────────────────────────────────────────────
# INA228: Texas Instruments 85 V, 20-bit power/energy/charge monitor, I2C,
# DGS (VSSOP-10).
#
# Source: TI "INA228 85-V, 20-Bit, Ultra-Precise Power/Energy/Charge Monitor
#   With I2C Interface", SLYS021A, January 2021, revised May 2022. Section 5
#   Table 5-1 Pin Functions (Figure 5-1 DGS top view), Section 6.1 Absolute
#   Maximum Ratings, Section 6.3 Recommended Operating Conditions, Section 6.4
#   Thermal Information, Section 6.5 Electrical Characteristics, Section 7.5.1
#   Serial Interface and Table 7-2 Address Pins, Table 7-3 register map,
#   Section 7.6.1.19 MANUFACTURER_ID (3Eh), Section 7.6.1.20 DEVICE_ID (3Fh),
#   Package Option Addendum.
#
# THE SHUNT IS EXTERNAL. IN+ and IN- sense across a board resistor; leaving them
# high-impedance here does not open the measured power path.
#
# THE 6 V CEILING IS THE SUPPLY AND BUS PINS'. Section 6.1: VS 6 V; SDA, SCL 6 V;
# ALERT VS + 0.3 V; but IN+, IN- (common mode) and VBUS -0.3 to 85 V. A `digital`
# entry's max_voltage_v is not watched per pin, and the sensing pins legitimately
# sit on rails far above 6 V.
#
# LOGIC LEVELS ARE ABSOLUTE (Section 6.5): VIH 1.2 V min, VIL 0.4 V max on SDA
# and SCL; VOL 0.4 V max at 3 mA. SDA and ALERT are open drain, so no VOH.
#
# IDENTITY: Section 7.5.1 "All data bytes are transmitted most significant byte
# first", so MANUFACTURER_ID 3Eh = 5449h ("TI") is 54h, 49h on the wire and
# DEVICE_ID 3Fh = 2281h (DIEID 228h, REV_ID 1h) is 22h, 81h. The revision
# history notes the DEVICE_ID reset value changed in revision A; 2281h is the
# SLYS021A value.
#
# POWER-ON THRESHOLD: the sheet gives a start-up time (TPOR 300 us) but no POR
# voltage, so the peripheral is gated at the 2.7 V bottom of the operating
# supply range (Section 6.3) rather than at an invented POR level.
[[models]]
id = "ina228"
kind = "digital"
description = "TI INA228 85V 20-bit I2C power/energy monitor, VSSOP-10 (strapped I2C ID-register subset, pad map, logic levels and supply draw)"

[models.match]
# Package Option Addendum: INA228AIDGSR (VSSOP DGS, 10 pins) is the orderable
# part. INA229 (SPI) and INA238/INA237 are different parts and are excluded.
value_re = "(?i)^INA228(AIDGSR?)?$"

[models.params]
# Section 6.5 Electrical Characteristics, absolute volts.
vol   = 0.4      # VOL max, IOL = 3 mA
vih   = 1.2      # VIH min, SDA and SCL
vil   = 0.4      # VIL max, SDA and SCL
supply_static_ua = 640.0   # Section 6.5 IQ typ, VSENSE = 0 V (750 uA max at 25 C)
supply_pin = "6"           # VS
gnd_pin    = "7"           # GND
# Bus-clock limits, read by the co-simulation bus-speed check (hauksbee_ir::peripheral_limits).
i2c_max_hz = { max = 2940000.0, unit = "Hz", conditions = "I2C high-speed mode; fast mode is 400 kHz max; the minimum is 1 kHz in fast mode and 10 kHz in high-speed mode", basis = "TI INA228 SLYS021A (Jan 2021, rev May 2022), section 6.6 Timing Requirements (I2C), I2C BUS (HIGH-SPEED MODE) F(SCL) max 2940 kHz (p.7)" }

[models.pins]
# Table 5-1 Pin Functions, DGS (VSSOP-10), all 10 pins.
"1"  = "a1"      # address pin: GND, SCL, SDA or VS (Table 7-2)
"2"  = "a0"      # address pin: GND, SCL, SDA or VS (Table 7-2)
"3"  = "alert"   # open-drain alert output, active low by default
"4"  = "sda"     # open-drain bidirectional I2C data
"5"  = "scl"     # I2C clock input
"6"  = "vdd"     # VS, power supply, 2.7 to 5.5 V
"7"  = "gnd"
"8"  = "vbus"    # bus voltage input, 0 to 85 V
"9"  = "in_n"    # IN-, load side of the external shunt (high-side use)
"10" = "in_p"    # IN+, supply side of the external shunt (high-side use)

[models.ratings]
# Section 6.1: VS 6 V; SDA, SCL 6 V. See the note above on IN+/IN-/VBUS.
max_voltage_v = 6.0
max_pin_current_a = 0.005   # Section 6.1, IIN input current into any pin 5 mA
theta_ja_c_per_w = 177.6    # Section 6.4, RθJA DGS (VSSOP)

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 2.7
max_v = 5.5
abs_max_v = 6.0
basis = "TI SLYS021A, Section 6.3 Recommended Operating Conditions, VS 2.7 V to 5.5 V; Section 6.1 Absolute Maximum Ratings, VS 6 V"

# Table 7-2 has 16 addresses from four levels (GND, VS, SDA, SCL) on
# each of A0 and A1, all listed below as printed (binary 1000000 = 0x40 ...
# 1001111 = 0x4F). A strap the binder cannot read as one of the four
# (floating, or on some other net) binds the spec default 0x40 marked assumed.
[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "INA228 ID register subset"
bus = "i2c"
i2c_address = 0x40

# Table 5-1, DGS (VSSOP-10); the same pad map as [models.pins].
[sensor.pins]
1 = "a1"
2 = "a0"
3 = "alert"
4 = "sda"
5 = "scl"
6 = "vdd"
7 = "gnd"
8 = "vbus"
9 = "in_n"
10 = "in_p"

# Table 7-2, rows in printed order (GND = "low", VS = "high").
[[sensor.address_select]]
address = 0x40
straps = { a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x41
straps = { a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x42
straps = { a1 = "low", a0 = "sda" }
[[sensor.address_select]]
address = 0x43
straps = { a1 = "low", a0 = "scl" }
