[models.behavioral.fsm]
states = ["reset", "starting", "port1_powered", "port1_overcurrent"]
initial = "reset"

[[models.behavioral.fsm.transitions]]
from = "reset"
to = "starting"
guard = "v_reset_n > 2.0 && v_vbus_det > 2.0"

[[models.behavioral.fsm.transitions]]
from = "starting"
to = "reset"
guard = "v_reset_n < 0.8 || v_vbus_det < 0.8"

[[models.behavioral.fsm.transitions]]
from = "starting"
to = "port1_powered"
guard = "host_requests_power && v_reset_n > 2.0 && v_vbus_det > 2.0 && v_ocs1_n > 2.0"
min_dwell_s = 0.0005

[[models.behavioral.fsm.transitions]]
from = "port1_powered"
to = "reset"
guard = "v_reset_n < 0.8 || v_vbus_det < 0.8"

[[models.behavioral.fsm.transitions]]
from = "port1_powered"
to = "port1_overcurrent"
guard = "v_ocs1_n < 0.8"

[[models.behavioral.fsm.transitions]]
from = "port1_overcurrent"
to = "reset"
guard = "v_reset_n < 0.8 || v_vbus_det < 0.8"

