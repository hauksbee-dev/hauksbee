[models.behavioral.fsm]
states = ["off_rx", "off_norx", "on_rx", "on_norx"]
initial = "off_rx"

[[models.behavioral.fsm.transitions]]
from = "off_rx"
to = "on_rx"
guard = "v_shdn_n >= in_th_v && v_en_n < in_th_v"
[[models.behavioral.fsm.transitions]]
from = "off_rx"
to = "on_norx"
guard = "v_shdn_n >= in_th_v && v_en_n >= in_th_v"
[[models.behavioral.fsm.transitions]]
from = "off_rx"
to = "off_norx"
guard = "v_shdn_n < in_th_v && v_en_n >= in_th_v"
[[models.behavioral.fsm.transitions]]
from = "off_norx"
to = "on_rx"
guard = "v_shdn_n >= in_th_v && v_en_n < in_th_v"
[[models.behavioral.fsm.transitions]]
from = "off_norx"
to = "on_norx"
guard = "v_shdn_n >= in_th_v && v_en_n >= in_th_v"
[[models.behavioral.fsm.transitions]]
from = "off_norx"
to = "off_rx"
guard = "v_shdn_n < in_th_v && v_en_n < in_th_v"
[[models.behavioral.fsm.transitions]]
from = "on_rx"
to = "on_norx"
guard = "v_shdn_n >= in_th_v && v_en_n >= in_th_v"
[[models.behavioral.fsm.transitions]]
from = "on_rx"
to = "off_rx"
guard = "v_shdn_n < in_th_v && v_en_n < in_th_v"
[[models.behavioral.fsm.transitions]]
from = "on_rx"
to = "off_norx"
guard = "v_shdn_n < in_th_v && v_en_n >= in_th_v"
[[models.behavioral.fsm.transitions]]
from = "on_norx"
to = "on_rx"
guard = "v_shdn_n >= in_th_v && v_en_n < in_th_v"
[[models.behavioral.fsm.transitions]]
from = "on_norx"
to = "off_rx"
guard = "v_shdn_n < in_th_v && v_en_n < in_th_v"
[[models.behavioral.fsm.transitions]]
from = "on_norx"
to = "off_norx"
guard = "v_shdn_n < in_th_v && v_en_n >= in_th_v"

# Charge pump: [ADI] p.9 regulation to +-5.5 V, the doubler's 2 VCC ceiling
# while it ramps; in shutdown V+ falls to VCC and V- to GND ([TI] p.2).
[[models.behavioral.laws]]
name = "pump_vpos"
kind = "voltage"
a = "vpos"
b = "gnd"
expr = "if((state_on_rx + state_on_norx) > 0.5, min(vpump_v, 2.0 * v_vcc), v_vcc)"
r_ohms = 2.0   # pump_r_ohms

[[models.behavioral.laws]]
name = "pump_vneg"
kind = "voltage"
a = "vneg"
b = "gnd"
expr = "if((state_on_rx + state_on_norx) > 0.5, max(-vpump_v, -2.0 * v_vcc), 0.0)"
r_ohms = 2.0   # pump_r_ohms

# VCC: ICC while running plus 2x each pump's delivered current (an ideal
# doubler, and an inverter working from V+), ICC(shutdown) otherwise.
[[models.behavioral.laws]]
name = "supply_draw"
kind = "current"
a = "vcc"
b = "gnd"
expr = "if((state_on_rx + state_on_norx) > 0.5, icc_on_a + 2.0 * (max(0.0, (min(vpump_v, 2.0 * v_vcc) - v_vpos) / pump_r_ohms) + max(0.0, (v_vneg - max(-vpump_v, -2.0 * v_vcc)) / pump_r_ohms)), icc_shdn_a)"

# Driver load currents come out of the pump reservoirs: a high DOUT sources
# from V+, a low one sinks into V-. Zero while the drivers are tri-stated.
[[models.behavioral.laws]]
name = "drivers_from_vpos"
kind = "current"
a = "vpos"
b = "gnd"
expr = "(state_on_rx + state_on_norx) * (if(v_din1 < in_th_v, max(0.0, (v_vpos - v_dout1) / drv_r_ohms), 0.0) + if(v_din2 < in_th_v, max(0.0, (v_vpos - v_dout2) / drv_r_ohms), 0.0) + if(v_din3 < in_th_v, max(0.0, (v_vpos - v_dout3) / drv_r_ohms), 0.0) + if(v_din4 < in_th_v, max(0.0, (v_vpos - v_dout4) / drv_r_ohms), 0.0) + if(v_din5 < in_th_v, max(0.0, (v_vpos - v_dout5) / drv_r_ohms), 0.0))"

[[models.behavioral.laws]]
name = "drivers_into_vneg"
kind = "current"
a = "gnd"
b = "vneg"
expr = "(state_on_rx + state_on_norx) * (if(v_din1 >= in_th_v, max(0.0, (v_dout1 - v_vneg) / drv_r_ohms), 0.0) + if(v_din2 >= in_th_v, max(0.0, (v_dout2 - v_vneg) / drv_r_ohms), 0.0) + if(v_din3 >= in_th_v, max(0.0, (v_dout3 - v_vneg) / drv_r_ohms), 0.0) + if(v_din4 >= in_th_v, max(0.0, (v_dout4 - v_vneg) / drv_r_ohms), 0.0) + if(v_din5 >= in_th_v, max(0.0, (v_dout5 - v_vneg) / drv_r_ohms), 0.0))"

# Drivers: inverting, DIN high -> V-, DIN low -> V+ ([TI] p.3 logic diagram),
# active only while SHDN is high ([TI] p.2 Table 1); drv_r_ohms behind each.
[[models.behavioral.laws]]
name = "dout1_on_rx"
kind = "voltage"
a = "dout1"
b = "gnd"
expr = "if(v_din1 >= in_th_v, v_vneg, v_vpos)"
r_ohms = 45.0   # drv_r_ohms
only_in_state = "on_rx"

[[models.behavioral.laws]]
name = "dout1_on_norx"
kind = "voltage"
a = "dout1"
b = "gnd"
expr = "if(v_din1 >= in_th_v, v_vneg, v_vpos)"
r_ohms = 45.0   # drv_r_ohms
only_in_state = "on_norx"

[[models.behavioral.laws]]
name = "dout2_on_rx"
kind = "voltage"
a = "dout2"
b = "gnd"
expr = "if(v_din2 >= in_th_v, v_vneg, v_vpos)"
r_ohms = 45.0   # drv_r_ohms
only_in_state = "on_rx"

[[models.behavioral.laws]]
name = "dout2_on_norx"
kind = "voltage"
a = "dout2"
b = "gnd"
expr = "if(v_din2 >= in_th_v, v_vneg, v_vpos)"
r_ohms = 45.0   # drv_r_ohms
only_in_state = "on_norx"

[[models.behavioral.laws]]
name = "dout3_on_rx"
kind = "voltage"
a = "dout3"
b = "gnd"
expr = "if(v_din3 >= in_th_v, v_vneg, v_vpos)"
r_ohms = 45.0   # drv_r_ohms
only_in_state = "on_rx"

[[models.behavioral.laws]]
name = "dout3_on_norx"
kind = "voltage"
a = "dout3"
b = "gnd"
expr = "if(v_din3 >= in_th_v, v_vneg, v_vpos)"
r_ohms = 45.0   # drv_r_ohms
only_in_state = "on_norx"

[[models.behavioral.laws]]
name = "dout4_on_rx"
kind = "voltage"
a = "dout4"
b = "gnd"
expr = "if(v_din4 >= in_th_v, v_vneg, v_vpos)"
r_ohms = 45.0   # drv_r_ohms
only_in_state = "on_rx"

[[models.behavioral.laws]]
name = "dout4_on_norx"
kind = "voltage"
a = "dout4"
b = "gnd"
expr = "if(v_din4 >= in_th_v, v_vneg, v_vpos)"
r_ohms = 45.0   # drv_r_ohms
only_in_state = "on_norx"

[[models.behavioral.laws]]
name = "dout5_on_rx"
kind = "voltage"
a = "dout5"
b = "gnd"
expr = "if(v_din5 >= in_th_v, v_vneg, v_vpos)"
r_ohms = 45.0   # drv_r_ohms
only_in_state = "on_rx"

[[models.behavioral.laws]]
name = "dout5_on_norx"
kind = "voltage"
a = "dout5"
b = "gnd"
expr = "if(v_din5 >= in_th_v, v_vneg, v_vpos)"
r_ohms = 45.0   # drv_r_ohms
only_in_state = "on_norx"

# Receivers: inverting, hysteresis from the output's own level (VIT+ while
# ROUT is high, VIT- while low), thresholds linear in VCC between the 3.3 V
# and 5 V typical columns ([TI] p.6). Active while EN is low ([TI] p.2).
[[models.behavioral.laws]]
name = "rout1_on_rx"
kind = "voltage"
a = "rout1"
b = "gnd"
expr = "if(v_rin1 > if(v_rout1 > 0.5 * v_vcc, vit_pos_v + 0.294 * (v_vcc - 3.3), vit_neg_v + 0.235 * (v_vcc - 3.3)), 0.0, v_vcc)"
r_ohms = 100.0   # ASSUMED from [TI] p.6 VOH typ VCC - 0.1 V at 1 mA
only_in_state = "on_rx"

[[models.behavioral.laws]]
name = "rout1_off_rx"
kind = "voltage"
a = "rout1"
b = "gnd"
expr = "if(v_rin1 > if(v_rout1 > 0.5 * v_vcc, vit_pos_v + 0.294 * (v_vcc - 3.3), vit_neg_v + 0.235 * (v_vcc - 3.3)), 0.0, v_vcc)"
r_ohms = 100.0   # ASSUMED from [TI] p.6 VOH typ VCC - 0.1 V at 1 mA
only_in_state = "off_rx"

[[models.behavioral.laws]]
name = "rout2_on_rx"
kind = "voltage"
a = "rout2"
b = "gnd"
expr = "if(v_rin2 > if(v_rout2 > 0.5 * v_vcc, vit_pos_v + 0.294 * (v_vcc - 3.3), vit_neg_v + 0.235 * (v_vcc - 3.3)), 0.0, v_vcc)"
r_ohms = 100.0   # ASSUMED from [TI] p.6 VOH typ VCC - 0.1 V at 1 mA
only_in_state = "on_rx"

[[models.behavioral.laws]]
name = "rout2_off_rx"
kind = "voltage"
a = "rout2"
b = "gnd"
expr = "if(v_rin2 > if(v_rout2 > 0.5 * v_vcc, vit_pos_v + 0.294 * (v_vcc - 3.3), vit_neg_v + 0.235 * (v_vcc - 3.3)), 0.0, v_vcc)"
r_ohms = 100.0   # ASSUMED from [TI] p.6 VOH typ VCC - 0.1 V at 1 mA
only_in_state = "off_rx"

[[models.behavioral.laws]]
name = "rout3_on_rx"
kind = "voltage"
a = "rout3"
b = "gnd"
expr = "if(v_rin3 > if(v_rout3 > 0.5 * v_vcc, vit_pos_v + 0.294 * (v_vcc - 3.3), vit_neg_v + 0.235 * (v_vcc - 3.3)), 0.0, v_vcc)"
r_ohms = 100.0   # ASSUMED from [TI] p.6 VOH typ VCC - 0.1 V at 1 mA
only_in_state = "on_rx"

[[models.behavioral.laws]]
name = "rout3_off_rx"
kind = "voltage"
a = "rout3"
b = "gnd"
expr = "if(v_rin3 > if(v_rout3 > 0.5 * v_vcc, vit_pos_v + 0.294 * (v_vcc - 3.3), vit_neg_v + 0.235 * (v_vcc - 3.3)), 0.0, v_vcc)"
r_ohms = 100.0   # ASSUMED from [TI] p.6 VOH typ VCC - 0.1 V at 1 mA
only_in_state = "off_rx"

# ROUT1B: the non-inverting complement of receiver 1, always active ([TI] p.2).
[[models.behavioral.laws]]
name = "rout1b"
kind = "voltage"
a = "rout1b"
b = "gnd"
expr = "if(v_rin1 > if(v_rout1b > 0.5 * v_vcc, vit_neg_v + 0.235 * (v_vcc - 3.3), vit_pos_v + 0.294 * (v_vcc - 3.3)), v_vcc, 0.0)"
r_ohms = 100.0   # ASSUMED from [TI] p.6 VOH typ VCC - 0.1 V at 1 mA

# Receiver input resistance, 5 kOhm to GND ([TI] p.6), in every state.
[[models.behavioral.laws]]
name = "rin1_load"
kind = "current"
a = "rin1"
b = "gnd"
expr = "v_rin1 / rin_ohms"

[[models.behavioral.laws]]
name = "rin2_load"
kind = "current"
a = "rin2"
b = "gnd"
expr = "v_rin2 / rin_ohms"

[[models.behavioral.laws]]
name = "rin3_load"
kind = "current"
a = "rin3"
b = "gnd"
expr = "v_rin3 / rin_ohms"

# Input keepers: 400 kOhm positive feedback to the rail the pin is nearer
# ([ADI] p.9, [TI] p.4 note: zero current at the rails).
[[models.behavioral.laws]]
name = "din1_keeper"
kind = "current"
a = "din1"
b = "gnd"
expr = "(v_din1 - if(v_din1 >= in_th_v, v_vcc, 0.0)) / keeper_r_ohms"

[[models.behavioral.laws]]
name = "din2_keeper"
kind = "current"
a = "din2"
b = "gnd"
expr = "(v_din2 - if(v_din2 >= in_th_v, v_vcc, 0.0)) / keeper_r_ohms"

[[models.behavioral.laws]]
name = "din3_keeper"
kind = "current"
a = "din3"
b = "gnd"
expr = "(v_din3 - if(v_din3 >= in_th_v, v_vcc, 0.0)) / keeper_r_ohms"

[[models.behavioral.laws]]
name = "din4_keeper"
kind = "current"
a = "din4"
b = "gnd"
expr = "(v_din4 - if(v_din4 >= in_th_v, v_vcc, 0.0)) / keeper_r_ohms"

[[models.behavioral.laws]]
