# ── PCF8563: NXP I2C real-time clock/calendar (HVSON10 / SO8 / TSSOP8) ──
# NXP PCF8563 Rev. 11.1 (19 January 2026), sha256 2ed5d1b0a1051d0e81399417c4ff0ced0658fa36e13c0487670f9cb6dfb4f1d4. Drafted by the extraction pipeline
# (codex gpt-6-luna, --kind digital on the second run) and reviewed against the PDF: the three pin maps (Table 3), the limiting values (Table 28) and
# the 250 nA typical standby current. Identity only: the clock, alarm and timer registers are not modelled. Hand edits: value_re and orderable_re
# accept a board's BS / T / TS suffix; vih/vil are 0.7/0.3 x VDD at 3.3 V (the draft wrote a bare 0.7 V); supply_static_ua is the 250 nA standby draw (the draft used the 800 uA active bound).

# VM capacitance and open-drain bias, TI DRV835x SLVSDY6A (https://www.ti.com/lit/ds/symlink/drv8353.pdf,
# sha256 8bb3a1d29ec9ea079d0ef452a2a0c614511f37575756b11a03646d8a82ed758c).
[[models.supply_cap]]
role = "vm"
side = "input"
grade = "required"
min_f = 1.0e-5
basis = "SLVSDY6A Pin Functions, 40-Pin DRV8353 Devices (PDF p.7), VM: \"Connect a X5R or X7R, 0.1-uF, VM-rated ceramic and greater then or equal to 10-uF local capacitance between the VM and GND pins\""
note = "This is the gate-driver supply; the 0.1 uF ceramic goes at the pin and at least 10 uF of local capacitance beside it. Section 10.1 Bulk Capacitance Sizing (PDF p.77) sizes the motor-supply bulk capacitor separately."

[[models.pin_bias]]
role = "nfault"
level = "high"
needs = "pull"
open_ok = true
basis = "SLVSDY6A Pin Functions, 40-Pin DRV8353 Devices (PDF p.7), nFAULT (OD): \"This pin is pulled logic low during a fault condition and requires an external pullup resistor\"; 7.3 Recommended Operating Conditions (PDF p.11): open-drain pullup voltage VOD 0 to 5.5 V, open-drain output current IOD 0 to 5 mA"
note = "Without the pull-up nFAULT never reads high, so the controller sees a permanent fault or none."

[[models.pin_bias]]
role = "sdo"
level = "high"
needs = "pull"
open_ok = true
basis = "SLVSDY6A Pin Functions, 40-Pin DRV8353 Devices (PDF p.7), SDO (OD): \"Serial data output ... This pin requires an external pullup resistor\""
note = "Without the pull-up SPI reads from the driver return zeros; a design that never reads the registers may leave SDO open."

