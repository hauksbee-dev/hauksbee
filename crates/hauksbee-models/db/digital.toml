# Pins in order OUT, GND, VCC. Vcc 2.7-5.5 V, Icc 0.4 mA typ / 1.5 mA max,
# abs max Vcc 6.0 V. The block diagram shows an internal pull-up on OUT whose
# value is not published, so the output is deliberately not driven here.
[[models]]
