url = "https://cdn-shop.adafruit.com/datasheets/LIS3DH.pdf"
title = "STMicroelectronics LIS3DH MEMS digital output motion sensor, Doc ID 17530 Rev 1, May 2010"
locator = "Table 1; Table 2 Pin description; Table 5; Table 8; Section 6.1.1 I2C operation; Section 8.6 WHO_AM_I"
sha256 = "eeb1316fcb8b5a6e3fdc4ed191263dd41da503eaf27813ff061df5bb1d186b4b"

# ─────────────────────────────────────────────────────────────────────────────
# LIS2MDL: STMicroelectronics 3-axis magnetometer, LGA-12 2 x 2 x 0.7 mm.
#
# Source: STMicroelectronics "LIS2MDL Digital output magnetic sensor:
#   ultra-low-power, high-performance 3-axis magnetometer", DocID030621 Rev 5,
#   November 2018. Table 1 Device summary, Table 2 Pin description, Table 5
#   Electrical characteristics, Table 9 Absolute maximum ratings, Table 11
#   Current consumption of operating modes, Section 6.1.1 I2C operation / Table
#   21 SAD + Read/Write patterns, Section 8.4 WHO_AM_I (4Fh). ST's own host
#   refused every request from here; the copy read is Rev 5 as mirrored at
#   cdn.sparkfun.com/assets/d/b/f/b/3/lis2mdl.pdf.
#
# FIXED ADDRESS. Unlike the LIS3MDL there is no address pin: Section 6.1.1 gives
# one slave address, 0011110b (0x1E). CS high selects I2C (Table 2: "1: SPI idle
# mode / I2C communication enabled").
#
# SUPPLY DRAW is the Table 11 ceiling, 1130 uA (high-resolution, offset
# cancellation on, ODR = 100 Hz); Table 5's headline figure is 200 uA typ at
# 20 Hz high-resolution, and power-down is 1.5 uA typ. Which mode applies is
# firmware this entry does not know. Levels: VIH/VIL are fractions of Vdd_IO and
# VOH is Vdd_IO - 0.2 V (Table 5), evaluated here at Vdd_IO = 3.3 V; VOL is an
# absolute 0.2 V.
[[models]]
id = "lis2mdl"
kind = "digital"
description = "ST LIS2MDL 3-axis magnetometer, LGA-12 (CS-selected I2C WHO_AM_I subset, pad map, logic levels and supply draw)"

[models.match]
# Table 1 Device summary order codes: LIS2MDL (tray), LIS2MDLTR (tape and reel).
value_re = "(?i)^LIS2MDL(TR)?$"

[models.params]
# Table 5 (p.10), evaluated at Vdd_IO = 3.3 V where the row is Vdd_IO-relative.
# VOH/VOL are printed at the 4 mA maximum drive current, a loaded level, so they are
# rows: the loader turns them into the unloaded level (the rail, ASSUMED: the sheet
# prints no light-load row) behind an output resistance.
voh   = { min = 3.1, unit = "V", conditions = "VDDIO = 3.3 V, IOH = 4 mA", basis = "Table 5 p.10, VOH, Vdd_IO - 0.2 V min at IOH = 4 mA, evaluated at Vdd_IO = 3.3 V" }
vol   = { max = 0.2, unit = "V", conditions = "VDDIO = 3.3 V, IOL = 4 mA", basis = "Table 5 p.10, VOL, 0.2 V max at IOL = 4 mA (absolute)" }
vih   = 2.31     # VIH 0.7 x Vdd_IO min
vil   = 0.99     # VIL 0.3 x Vdd_IO max
supply_static_ua = 1130.0  # Table 11 ceiling (see above)
supply_pin = "9"           # Vdd
gnd_pin    = "8"           # GND (0 V)

[models.pins]
# Table 2 Pin description, all 12 pads.
"1"  = "scl"     # I2C SCL / SPI SPC
"2"  = "nc"      # internally not connected; may be tied to Vdd, Vdd_IO or GND
"3"  = "cs"      # 1: SPI idle / I2C enabled; 0: SPI mode, I2C disabled
"4"  = "sda"     # I2C SDA / SPI SDI / 3-wire SDO
"5"  = "c1"      # capacitor connection, C1 = 220 nF
"6"  = "gnd2"    # connected to GND
"7"  = "int"     # INT/DRDY, or SDO for 4-wire SPI
"8"  = "gnd"     # 0 V
"9"  = "vdd"     # supply, 1.71 to 3.6 V
"10" = "vddio"   # I/O supply, 1.71 to 3.6 V
"11" = "nc2"     # internally not connected
"12" = "nc3"     # internally not connected

[models.ratings]
# Table 9: Vdd and Vdd_IO -0.3 to 4.8 V; control pins -0.3 V to Vdd_IO + 0.3 V;
# "Supply voltage on any pin should never exceed 4.8 V."
max_voltage_v = 4.8

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.71
max_v = 3.6
basis = "ST LIS2MDL DocID030621 Rev 5, Table 5, Vdd supply voltage row"

[[models.envelope]]
kind = "supply_range"
pin = "vddio"
min_v = 1.71
max_v = 3.6
basis = "ST LIS2MDL DocID030621 Rev 5, Table 5, Vdd_IO module power supply for I/O row"

[models.peripheral]
kind = "register_map"
required_high_roles = ["cs"]
spec_toml = '''
[sensor]
name = "LIS2MDL who_am_i subset"
bus = "i2c"
i2c_address = 0x1E

# Section 8.4 WHO_AM_I (4Fh) = 0100 0000b.
[[sensor.register]]
addr = 0x4F
const = [0x40]

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.71   # Table 5, Vdd min
idle_a = 0.00113              # Table 11 ceiling (see above)
read_a = 0.00113
write_a = 0.00113
low_power_a = 0.0000015       # Table 5, Idd_PD power-down typ

[models.coverage]
implements = ["pin_roles", "logic_levels_at_3v3_vddio", "max_mode_supply_current", "absolute_ratings", "supply_ranges", "i2c_bus_mode_strap", "i2c_fixed_address", "register_map_subset", "who_am_i_read", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["full_register_map", "spi_register_map", "magnetic_field_data", "temperature_sensor", "power_mode_state", "interrupt_engine", "offset_cancellation", "supply_domain_current_split"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://cdn.sparkfun.com/assets/d/b/f/b/3/lis2mdl.pdf"
title = "STMicroelectronics LIS2MDL Digital output magnetic sensor, DocID030621 Rev 5, November 2018"
locator = "Table 1; Table 2 Pin description; Table 5; Table 9; Table 11; Section 6.1.1 I2C operation; Section 8.4 WHO_AM_I"
