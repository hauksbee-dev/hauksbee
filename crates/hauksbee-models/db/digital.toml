# Table 14 has 16 addresses from four levels (DGND, DVDD, SDA, SCL) on
# each of A0 and A1, all listed below as printed (binary 1000000 = 0x40 ...
# 1001111 = 0x4F). A strap the binder cannot read as one of the four
# (floating, or on some other net) binds the spec default 0x40 marked assumed.
[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "ADS122C04 configuration registers"
bus = "i2c"
i2c_address = 0x40

# Pin Functions table, TSSOP-16 (PW) column; the same pad map as [models.pins].
[sensor.pins]
1 = "a0"
2 = "a1"
3 = "reset_n"
4 = "dgnd"
5 = "avss"
6 = "ain3"
7 = "ain2"
8 = "refn"
9 = "refp"
10 = "ain1"
11 = "ain0"
12 = "avdd"
13 = "dvdd"
14 = "drdy_n"
15 = "sda"
16 = "scl"

# Table 14, rows in printed order (DGND = "low", DVDD = "high").
[[sensor.address_select]]
address = 0x40
straps = { a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x41
straps = { a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x42
straps = { a1 = "low", a0 = "sda" }
[[sensor.address_select]]
