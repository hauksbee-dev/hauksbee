# ─────────────────────────────────────────────────────────────────────────────
# DRV8353S: TI 100 V three-phase smart gate driver, SPI variant, 40-pin WQFN with exposed pad (RTA), no buck regulator. Source: TI SLVSDY6A
# (August 2018, revised June 2019), sha256 8bb3a1d29ec9ea079d0ef452a2a0c614511f37575756b11a03646d8a82ed758c (byte-identical to the ti.com
# symlink). The package is the 40-pin RTA, NOT a 32-pin part (the 32-pin RTV is the DRV8350S). Pin table p.6-7 (the 40 pads in order: CPL,
# CPH, VM, VDRAIN, VCP, GHA, SHA, GLA, SPA, SNA, SNB, SPB, GLB, SHB, GHB, GHC, SHC, GLC, SPC, SNC, SOC, SOB, SOA, VREF, AGND, nFAULT,
# SDO, SDI, SCLK, nSCS, ENABLE, INHA, INLA, INHB, INLB, INHC, INLC, DVDD, GND, VGLS); 7.1 Absolute Maximum Ratings p.10; 7.3 Recommended
# Operating Conditions p.11 (VM 9 to 75 V, VDRAIN 7 to 100 V); 7.4 Thermal p.11 (26.1 C/W for RTA); 7.5 supply current p.12 (IVM 8.5 mA typ
# and IVDRAIN 1.9 mA typ at 48 V, ENABLE high, inputs low; sleep 20 uA typ). The exposed pad has no row in the pin table: key "41" is the
# CAD numbering the board used and "EP" the Eagle spelling.
# DVDD (5 V, up to 10 mA externally), VGLS (the 11 V low-side regulator), the charge pump VCP and the gate pins are NOT driven.
[[models]]
id = "drv8353s_wqfn40"
kind = "digital"
description = "TI DRV8353S 100 V three-phase smart gate driver (SPI), 40-pin WQFN (RTA): VM and VDRAIN supply draws (gate drive, shunt amplifiers, regulators, SPI not modelled)"

[models.match]
