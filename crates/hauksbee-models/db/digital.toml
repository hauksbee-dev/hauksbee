locator = "6 Pin Configuration and Functions p.3 (DBV, DCK, DRL: 1 NC, 2 A, 3 GND, 4 Y, 5 VCC); 7.1 Absolute Maximum Ratings p.4; 7.3 Recommended Operating Conditions and 7.4 Thermal Information p.5; 7.5 Electrical Characteristics p.6; 7.8 Switching Characteristics, CL = 15 pF p.7"
