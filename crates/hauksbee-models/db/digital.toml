# ── MOC3043M: onsemi 6-pin DIP zero-cross triac driver optocoupler (400 V) ──
# onsemi MOC3031M/MOC3043M family datasheet (Rev. 4, September 2022), sha256 609997436d5eaff127fca5079f4cb1fe724c42feada3c13d4b7ba4d2590abd7e. The extraction pipeline
# (codex gpt-6-luna) drafted it but its validator rejected the draft three times; hand-fixed from that draft and checked against the PDF: pins 1 anode, 2 cathode, 3 NC, 4/6 main terminals,
# 5 NC (substrate, do not connect); VDRM 400 V, total PD 250 mW, IF 60 mA, ITM 100 mA, TJ 100 C. Identity only: the LED-triggered zero-cross triac output is not modelled.
# [[models]] entry 'moc3043m': characteristic 'VISO, isolation voltage' writes a supply-relative limit as a number: record each printed number with its sign in its column (±5 is min = -5 and max = 5), never delete the record; a supply-relative limit (0.7 VDD, VDD + 0.5 V) is no number: quote it in `conditions` and omit that column (a row left with none becomes an `unknown` uncertainty record quoting it), never a rail as `unit`

