# ── Sun Hold RAS-0515 5 V SPDT power relay ───────────────────────────────────
# Source: Sun Hold RAS series catalogue, pp.24-25 (image-only PDF from
# store.comet.bg download-file.php?id=246), sha256
# 604dbca4e1775ef6144c620d84d30fc01a6cf6a961d426dff939610ebca9f6bd.
# 5 V coil: 69 Ohm +-10 %, 72 mA, 0.36 W; pull-in 75 % of rated voltage maximum,
# drop-out 10 % minimum, operate 10 ms / release 5 ms maximum, contact
# resistance 50 mOhm maximum, form C, 15 A type (AC 125 V 15 A, AC 250 V 10 A,
# DC 24 V 15 A, 20 A maximum). The coil inductance is not published, so only the
# resistive coil is modelled. Pins: 1 and 2 coil, COM0 / NC0 / NO0 contacts.
[[models]]
id = "ras_0515_relay"
kind = "digital"
description = "Sun Hold RAS-0515 5 V coil SPDT relay (resistive coil, contact switch)"

[models.match]
value_re = "(?i)^RAS-0515( \\(SUNHOLD\\))?$"

[models.params]
coil_ohms = 69.0
pull_in_v = 3.75
drop_out_v = 0.5
contact_ohms = 0.05
warning = "source-bound relay model: the 69 Ohm coil, the 75 percent pull-in and 10 percent drop-out thresholds (3.75 V and 0.5 V on a 5 V coil, taken as the switching points), and 50 mOhm closed contacts are executable; coil inductance (not published), operate and release times (10 ms and 5 ms), contact bounce, contact current and voltage ratings, and coil polarity are not represented"

[models.pins]
"1" = "coil_p"
"2" = "coil_n"
"COM0" = "com"
"NC0" = "nc"
"NO0" = "no"

[models.behavioral.fsm]
states = ["released", "energised"]
initial = "released"

[[models.behavioral.fsm.transitions]]
from = "released"
to = "energised"
guard = "abs(v_coil_p - v_coil_n) >= pull_in_v"

[[models.behavioral.fsm.transitions]]
from = "energised"
to = "released"
guard = "abs(v_coil_p - v_coil_n) <= drop_out_v"

[[models.behavioral.laws]]
name = "coil"
kind = "current"
a = "coil_p"
b = "coil_n"
expr = "(v_coil_p - v_coil_n) / coil_ohms"

[[models.behavioral.laws]]
name = "contact_com_no"
kind = "current"
a = "com"
b = "no"
expr = "(v_com - v_no) / contact_ohms"
only_in_state = "energised"

[[models.behavioral.laws]]
name = "contact_com_nc"
kind = "current"
a = "com"
b = "nc"
expr = "(v_com - v_nc) / contact_ohms"
only_in_state = "released"

[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://store.comet.bg/download-file.php?id=246"
title = "Sun Hold RAS series relay catalogue, pp.24-25"
locator = "pp.24-25 RAS-05xx 5 V coil row (69 Ohm, 72 mA), pull-in / drop-out percentages, contact resistance, contact ratings"
sha256 = "604dbca4e1775ef6144c620d84d30fc01a6cf6a961d426dff939610ebca9f6bd"
[[models.source.uncertainty]]
status = "interval"
parameter = "coil_ohms"
low = 62.1
high = 75.9
unit = "Ohm"
kind = "specification-limits"
basis = "Sun Hold RAS series catalogue p.24, 5 V coil 69 Ohm +-10 %"
[[models.source.uncertainty]]
status = "unknown"
parameter = "model"
reason = "catalogue publishes no validated model error interval; the pull-in and drop-out voltages are taken as the percentage limits (75 percent maximum, 10 percent minimum) rather than measured switching points, and coil inductance, timing and bounce are not modelled"

[models.coverage]
implements = ["coil_resistance", "pull_in_drop_out", "spdt_contacts"]
missing = ["coil_inductance", "operate_release_time", "contact_bounce", "contact_ratings", "coil_polarity"]

# ── TI ESDS314 four-channel unidirectional TVS (SOT-23-5) ────────────────────
# Source: TI ESDS311/ESDS312/ESDS314 datasheet SLVSEG9C (Rev. C, Feb 2024),
# sha256 dab78fc389d0d3cce51eeba2491c89f538f2042dd708f8189902ab06680ecbae.
# Table 4-3 p.3 pins (I/O1 1, GND 2, I/O2 3, I/O3 4, I/O4 5); Section 5.1 p.4
# absolute maximum IEC 61000-4-5 peak pulse 25 A; Section 5.5 p.4 RthetaJA
# 127.6 C/W (DBV, 5 pins); Section 5.6 p.5: VRWM 3.6 V, VCLAMP IO to GND 5 V at
# 1 A, 5.6 V at 12 A, 6.5 V at 25 A; GND to IO 1 V at 1 A, 2.1 V at 12 A, 3.6 V
# at 25 A. Piecewise-linear fit: reverse knee 4.94 V + 0.0625 Ohm (5.0 / 5.69 /
# 6.5 V), forward knee 0.89 V + 0.108 Ohm (1.0 / 2.19 / 3.59 V). The datasheet
# calls VBRF 4.5-7.5 V at 1 mA before snapback; the fit follows the clamp rows.
[[models]]
id = "esds314_tvs"
kind = "digital"
description = "ESDS314 four-channel unidirectional TVS, DBV SOT-23-5"

[models.match]
value_re = "(?i)^ESDS314[A-Z0-9_-]*$"

[models.params]
vbreak_v = 4.94
rdyn_rev_ohms = 0.0625
vf_v = 0.89
rdyn_fwd_ohms = 0.108
warning = "source-bound piecewise-linear clamp: the surge clamping rows (5.0 V to 6.5 V reverse and 1.0 V to 3.6 V forward at 1 A to 25 A) are fitted and executable on all four channels; 4.5 pF line capacitance, 5 nA leakage, the 4.5-7.5 V snapback breakdown window, IEC pulse waveform and temperature are not represented"

[models.pins]
"1" = "io1"
"2" = "gnd"
"3" = "io2"
"4" = "io3"
"5" = "io4"

[models.ratings]
max_surge_current_a = 25.0   # Section 5.1 p.4, IEC 61000-4-5 8/20 us peak pulse current 25 A

[[models.behavioral.laws]]
name = "io1_clamp"
kind = "current"
a = "io1"
b = "gnd"
expr = "max(0.0, v_io1 - vbreak_v) / rdyn_rev_ohms + min(0.0, v_io1 + vf_v) / rdyn_fwd_ohms"

[[models.behavioral.laws]]
name = "io2_clamp"
kind = "current"
a = "io2"
b = "gnd"
expr = "max(0.0, v_io2 - vbreak_v) / rdyn_rev_ohms + min(0.0, v_io2 + vf_v) / rdyn_fwd_ohms"

[[models.behavioral.laws]]
name = "io3_clamp"
kind = "current"
a = "io3"
b = "gnd"
expr = "max(0.0, v_io3 - vbreak_v) / rdyn_rev_ohms + min(0.0, v_io3 + vf_v) / rdyn_fwd_ohms"

[[models.behavioral.laws]]
name = "io4_clamp"
kind = "current"
a = "io4"
b = "gnd"
expr = "max(0.0, v_io4 - vbreak_v) / rdyn_rev_ohms + min(0.0, v_io4 + vf_v) / rdyn_fwd_ohms"

[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/esds314.pdf"
title = "Texas Instruments ESDS311, ESDS312, ESDS314 datasheet SLVSEG9C (Feb 2024)"
locator = "Table 4-3 p.3 pins; Section 5.1 p.4; Section 5.6 p.5 electrical characteristics"
sha256 = "dab78fc389d0d3cce51eeba2491c89f538f2042dd708f8189902ab06680ecbae"
[[models.source.uncertainty]]
status = "unknown"
parameter = "model"
reason = "datasheet publishes no validated model error interval; the clamp rows are typical values"
[[models.source.pinout]]
package = "DBV (SOT-23, 5)"
pins = { "1" = "I/O1", "2" = "GND", "3" = "I/O2", "4" = "I/O3", "5" = "I/O4" }

[models.coverage]
implements = ["esd_clamp", "negative_clamp", "positive_breakdown"]
missing = ["channel_capacitance", "subthreshold_leakage", "snapback_window", "iec_pulse_waveform", "temperature_dependence"]

# ── ST ESDCAN01-2BLY automotive dual-line bidirectional TVS (SOT23-3L) ────────
# Source: ST ESDCAN01-2BLY DocID026507 Rev 1 (June 2014), sha256
# 12e23fd157ab2017fa27828e0170c20e608505ac9d3adca07fae5c17781a2d75. Drafted by
# `hauksbee models extract` (gpt-6-luna) as an identity-only diode card, then
# rewritten by hand into the executable clamp form used by the other TVS cards
# and reviewed against the PDF. Figure 1 (functional diagram) numbers the two
# protected lines 1 and 2 and the shared terminal 3; Table 2 prints VRM 24 V max,
# VBR 25 V min / 30 V max at IR = 1 mA, VCL 40 V max at IPP = 5 A (8/20 us),
# IRM 100 nA max at 24 V, C 30 pF max at 0 V. No typical breakdown or dynamic
# resistance is printed, so the clamp is fitted to the printed rows: it
# conducts from the VBR midpoint (25 V + 30 V) / 2 = 27.5 V and
# rdyn_ohms = (40 V - 27.5 V) / 5 A = 2.5 Ohm lands on the printed 40 V maximum
# clamp at 5 A. The real breakdown lies anywhere in 25 V to 30 V (recorded as an
# interval below), so this is a nominal fit, not a guarantee.
[[models]]
id = "esdcan01_2bly_tvs"
kind = "digital"
description = "ESDCAN01-2BLY automotive dual-line bidirectional TVS for CAN, 24 V stand-off, SOT23-3L"

[models.match]
value_re = "(?i)^ESDCAN01[-_ ]?2BLY[A-Z0-9_-]*$"

[models.params]
vbreak_v = 27.5
rdyn_ohms = 2.5
warning = "source-bound symmetric piecewise-linear clamp from each line to the common terminal: conduction in both polarities above the 27.5 V nominal breakdown (VBR midpoint), 2.5 Ohm slope fitted to the 40 V maximum clamp at 5 A; the 30 pF capacitance, 100 nA leakage, the 24 V to 30 V knee, ISO 7637-3 pulse waveforms, temperature coefficient and package parasitics are not represented"

[models.pins]
# Figure 1 functional diagram: lines 1 and 2, shared terminal 3.
"1" = "line1"
"2" = "line2"
"3" = "common"

[[models.source.pinout]]
package = "SOT23-3L"
pins = { "1" = "line 1", "2" = "line 2", "3" = "common" }

[[models.behavioral.laws]]
name = "line1_clamp"
kind = "current"
a = "line1"
b = "common"
expr = "max(0.0, (v_line1 - v_common) - vbreak_v) / rdyn_ohms + min(0.0, (v_line1 - v_common) + vbreak_v) / rdyn_ohms"

[[models.behavioral.laws]]
name = "line2_clamp"
kind = "current"
a = "line2"
b = "common"
expr = "max(0.0, (v_line2 - v_common) - vbreak_v) / rdyn_ohms + min(0.0, (v_line2 - v_common) + vbreak_v) / rdyn_ohms"

[models.ratings]
max_voltage_v = 24.0           # VRM stand-off voltage max, Table 2, Tamb = 25 C, either polarity
max_junction_temp_c = 150.0    # Top operating junction temperature, Table 1
max_surge_current_a = 5.5      # IPP peak pulse current, Table 1, 8/20 us, Tj initial = 25 C

[models.coverage]
implements = ["esd_clamp", "bidirectional_positive_and_negative_breakdown", "absolute_ratings"]
missing = ["line_capacitance", "subthreshold_leakage", "iso7637_pulse_waveform", "package_parasitics", "temperature_dependence"]

[models.source]
