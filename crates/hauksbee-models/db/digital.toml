# Raspberry Pi Compute Module 4 carrier boundary. `CM4` is a module family,
# not an executable configuration: RAM, eMMC, wireless option, firmware image,
# enabled interfaces and workload all change its rail current and I/O behavior.
# The official CM4 data sheet defines the 2x100 connector and absolute/operating
# interface requirements, but the PCB Value alone does not identify the fitted
