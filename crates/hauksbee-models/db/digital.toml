# Belling BL24C256A 256-Kbit (32768 x 8) I2C EEPROM: executable primary array.
#
# Source: Shanghai Belling "BL24C256A 256K bits (32768x8)" datasheet, Version
#   2.00 (03/23/2023, per its revision history), retrieved from the LCSC copy
#   https://datasheet.lcsc.com/datasheet/pdf/75e653c09ea92b4a6774cae586f2af0b.pdf
#   sha256 322402a79a9e6642e7c419d470ed0139157ff22d8a4f9b2c9d2bdf5062d4ffa7.
#   Pin Configuration and Table 1 Pin Descriptions; Functional Description
#   1 (512 pages x 64 bytes, 15-bit word address) and 3 Device Addressing
#   (1010 A2 A1 A0 R/W, floating address pins biased low); Byte Write (two
#   word-address bytes); Table 2 WP; Electrical Characteristics (Absolute
#   Maximum Stress Ratings, Table 3 DC); Table 7 AC; Ordering Information.
#
# ADDRESS. The peripheral carries the fixed 7-bit address 0x50, i.e. A2:A0 = 000.
# Section 3 says floating A pins are biased low, and the 5-pin SOT23-5/TSOT23-5
# packages bond no A pins at all, so 0x50 is the datasheet's own address there.
# On the 8-pin packages the `i2c_eeprom` peripheral has no strap input: a board
# that ties any of A0..A2 high is simulated at 0x50 anyway (see the warning).
#
# SUPPLY CURRENTS ARE THE Table 3 TYPICALS AT VCC = 5.0 V: IR 0.14 mA (0.3 max,
# read at 400 kHz), IW 0.28 mA (0.5 max), ISB 0.03 uA (0.5 max). The 1.7 V
# power-on threshold is the bottom of the BL24C256A (-40 to +85 C) supply range.
#
# DELIBERATELY NOT MODELLED: the 64-byte Identification Page (device type 1011b)
# and its lock; WP enforcement (Table 2); the 3 ms max tWR write cycle and the
# acknowledge polling it implies; the E1/E0 temperature grades' 2.5 V minimum.
[[models]]
id = "bl24c256a_8pin"
kind = "digital"
description = "Belling BL24C256A 256-Kbit I2C EEPROM, 8-pin SOP/TSSOP/PDIP/UDFN (executable primary array)"

