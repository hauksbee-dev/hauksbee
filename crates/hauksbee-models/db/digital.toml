[[models]]
id = "74hc00"
kind = "digital"
description = "74HC00 quad 2-input NAND gate"

[models.match]
value_re = "(?i)^(SN)?74HC00"

[models.params]
# Electrical envelope: Texas Instruments SN74HC00 datasheet (SCLS181),
# electrical characteristics at Vcc = 4.5 V (74HC-family standard levels).
voh       = 4.4
vol       = 0.1
vih       = 3.15
vil       = 1.35
tpd_s     = 9.0e-9
# Supply draw: TI SCLS181, ICC = 20 uA max per package at 25 C, Vcc 6 V
# (~2 uA typical); 10 uA stamped = 2.5 uA/gate. Cpd = 20 pF typical per
# gate (SCLS181 power-dissipation capacitance, Cpd).
supply_static_ua = 10.0
supply_cpd_pf    = 20.0
supply_pin = "14"
gnd_pin    = "7"

[models.pins]
"1"  = "a1"
"2"  = "b1"
"3"  = "y1"
"4"  = "a2"
"5"  = "b2"
"6"  = "y2"
"7"  = "gnd"
"8"  = "y3"
"9"  = "a3"
"10" = "b3"
# Right-side gates are OUTPUT-first on the '00/'08/'32/'86 pattern: 8 = 3Y and
# 11 = 4Y (inputs 12/13), mirroring the left side's input-input-output order.
"11" = "y4"
"12" = "a4"
"13" = "b4"
"14" = "vcc"

[models.ratings]
max_pin_current_a = 0.025
max_voltage_v = 7.0

[models.logic]
# Behaviour source: TI SN74HC00 datasheet (SCLS181), function table:
# Y = LOW iff A AND B are both HIGH (Y = !(A & B)).
inputs  = ["a1", "b1", "a2", "b2", "a3", "b3", "a4", "b4"]
outputs = ["y1", "y2", "y3", "y4"]

[models.logic.comb]
"y1" = "!(a1 & b1)"
"y2" = "!(a2 & b2)"
"y3" = "!(a3 & b3)"
"y4" = "!(a4 & b4)"

