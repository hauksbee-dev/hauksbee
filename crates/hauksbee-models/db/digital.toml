# VIL max 0.35 x VCC, 0.7 V, 0.9 V. At VCC = 0.8 V the datasheet gives only
# VIH = VCC and VIL = 0 (a degenerate point), so the tables start at 1.1 V and
# hold flat below it. VOH is VCC - 0.1 V at -20 uA across 0.8 V to 3.6 V.
