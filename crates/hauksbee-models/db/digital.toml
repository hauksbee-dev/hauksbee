# ══ Olimex ESP32-EVB REV-L peripherals ════════════════════════════════════════
# Each card cites its datasheet by title, URL and sha256 in its source record.
# Each card models only what the datasheet states as a number: the
# supply draw, the supply-limit envelope, and, where the part is a switch or a
# threshold device, that behaviour. Everything else is listed under `missing`.
#
# A supply draw is the datasheet current only once the supply reaches its minimum
# operating voltage (`supply_on_v`) and ramps linearly from zero at 0 V below it.
# A constant current drawn from an unpowered rail has no physical meaning and
# stalled the DC homotopy (source stepping) on the ESP32-EVB, where it asked a
# 2 percent-scaled supply for the full datasheet current.

# ── VS1838B infrared receiver module ─────────────────────────────────────────
# Source: VS1838B datasheet (3 pages, manufacturer not printed), datasheetcafe
