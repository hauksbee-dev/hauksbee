[[sensor.address_select]]
address = 0x4F
straps = { a1 = "scl", a0 = "scl" }

# WREG rr (Section 8.5.3.7): command 0100 rr00, then one data byte.
[[sensor.write_register]]
addr = 0x40
encoding = "u8"
store = "cfg0"

[[sensor.write_register]]
addr = 0x44
encoding = "u8"
store = "cfg1"

[[sensor.write_register]]
addr = 0x48
encoding = "u8"
store = "cfg2"
[[sensor.write_register.field]]
name = "cfg2_rw"
bits = [6, 0]

[[sensor.write_register]]
addr = 0x4C
encoding = "u8"
store = "cfg3"
[[sensor.write_register.field]]
name = "cfg3_imux"
bits = [7, 2]

# RREG rr (Section 8.5.3.6): command 0010 rr00, then a one-byte read. Reset
# values are 00h (Table 17).
[[sensor.register]]
addr = 0x20
encoding = "u8"
expr = "cfg0"

[[sensor.register]]
addr = 0x24
encoding = "u8"
expr = "cfg1"

# Register 2: DRDY (bit 7) is read-only and reads 0 here.
[[sensor.register]]
addr = 0x28
encoding = "u8"
expr = "cfg2_rw"

# Register 3: bits 1:0 are fixed 0.
[[sensor.register]]
addr = 0x2C
encoding = "u8"
expr = "cfg3_imux * 4.0"

[sensor.protocol]
style = "i2c_pointer"
'''

