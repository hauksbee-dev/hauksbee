# ═════════════════════════════════════════════════════════════════════════════
# I2C SENSORS WITH A CHIP-ID REGISTER SUBSET
#
# Every entry below follows the BMA423 entry's shape: a pad map, logic levels,
# a sourced supply draw, the absolute-maximum ceiling, and a `register_map`
# peripheral that carries ONLY the identity registers whose value the datasheet
# states outright (CHIP_ID / WHO_AM_I / part ID). Nothing else on the bus is
# modelled: a read of any other register sees no device behind it, and no
# measurement appears anywhere. Where the logic levels are fractions of an I/O
# rail they are evaluated at 3.3 V, the rail these parts sit on in the boards
# they were written for, exactly as the BMA423 note explains; on a 1.8 V I/O
# rail recompute them by the stated fractions.
#
# The I2C personality is attached only when the board's straps resolve directly
# to a supply or ground (CS/CSB high for the parts whose bus is strap-selected,
# SDO/SA0 for the address bit); an unresolved strap leaves the part unattached
# with a named reason rather than a guessed address.
# ═════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# BMI270: Bosch Sensortec 6-axis IMU (accelerometer + gyroscope), LGA-14
# 2.5 x 3.0 mm.
#
# Source: Bosch Sensortec "BMI270 Datasheet", document BST-BMI270-DS000-08,
#   revision 1.6, March 2026. Table 1 Basic electrical parameter specifications,
#   Table 5 Absolute maximum ratings, Section 5.2.1 Register (0x00) CHIP_ID,
#   Section 6.2 Table 17 Mapping for primary interface, Section 6.5 Primary
#   interface I2C, Table 22 Pin-out and pin connections.
#
# SUPPLY DRAW IS THE A+G PERFORMANCE-MODE FIGURE, 970 uA typ (Table 1, VDD =
# 1.8 V, 25 C, ODRmax). Which power mode applies is a firmware state this entry
# does not know (Table 1 also lists 685 uA normal, 420 uA A+G low-power, 3.5 uA
# suspend), so the ceiling is carried, as the BMA423 entry does. The sheet gives
# no split between the VDD and VDDIO domains.
#
# THE CONFIG-FILE UPLOAD IS NOT MODELLED. A real BMI270 needs its 8 kB
# configuration file written to INIT_DATA before it leaves suspend (Section 4.4
# Power-On-Reset and Device Initialization); this
# entry answers only the CHIP_ID read firmware does first, before any upload.
[[models]]
id = "bmi270"
kind = "digital"
description = "Bosch BMI270 6-axis IMU, LGA-14 (strap-selected I2C CHIP_ID subset, pad map, logic levels and supply draw)"

[models.match]
# The bare part number is the only ordering string (Bosch sales part number
# 0 273 017 008, cover page). BMI160/BMI260/BMI323 are different dies with
# different maps and are excluded by the anchor.
value_re = "(?i)^BMI270$"

[models.params]
# Table 1, every level a fraction of VDDIO, evaluated at VDDIO = 3.3 V.
# VOH/VOL are printed at a test current (IOH, IOL <= 2 mA), a loaded level, so
# they are rows: the loader turns them into the unloaded level (the rail, ASSUMED:
# the sheet prints no light-load row) behind an output resistance.
voh   = { min = 2.64, unit = "V", conditions = "VDDIO = 3.3 V (VDDIO >= 1.62 V), IOH = 2 mA, SPI", basis = "Table 1 p.11, VOH, 0.8 x VDDIO min, evaluated at VDDIO = 3.3 V; VDDIO <= 1.62 V row is IOH <= 1.5 mA" }
vol   = { max = 0.66, unit = "V", conditions = "VDDIO = 3.3 V (VDDIO >= 1.62 V), IOL = 2 mA, SPI", basis = "Table 1 p.11, VOL, 0.2 x VDDIO max, evaluated at VDDIO = 3.3 V; VDDIO < 1.62 V row is IOL <= 1.5 mA" }
vih   = 2.31     # 0.7 x VDDIO min, SPI and I2C
vil   = 0.99     # 0.3 x VDDIO max, SPI and I2C
supply_static_ua = 970.0   # Table 1 IDD typ, A+G performance mode, VDD = 1.8 V,
                           # 25 C, ODRmax
supply_pin = "8"           # VDD
gnd_pin    = "7"           # GND (digital and analog)

[models.pins]
# Table 22 Pin-out and pin connections (LGA-14), all 14 pads, cross-checked
# against Table 17. SDx/SCx use the bus vocabulary (`sda`/`scl`), as the BMA423
# entry explains.
"1"  = "sdo"     # SPI 4W data out; in I2C the address bit 0 (GND = 0x68,
                 # VDDIO = 0x69, Section 6.5)
"2"  = "asda"    # secondary interface (aux I2C SDA / OIS SDI); VDDIO or DNC
                 # when unused, never GND (Table 22 note **)
"3"  = "ascl"    # secondary interface (aux I2C SCL / OIS SCK)
"4"  = "int1"    # interrupt 1 (or FIFO sync input)
"5"  = "vddio"   # I/O supply, 1.2 to 3.6 V
"6"  = "gndio"   # I/O ground
"7"  = "gnd"     # digital and analog ground
"8"  = "vdd"     # analog and digital supply, 1.71 to 3.6 V
"9"  = "int2"    # interrupt 2 (or FIFO sync input)
"10" = "ocsb"    # OIS chip select; DNC, or GND only if IF_CONF.ois_en = 0
"11" = "osdo"    # OIS data out; DNC when unused
"12" = "csb"     # SPI chip select; VDDIO for I2C (Table 22)
"13" = "scl"     # SCx: I2C SCL, SPI SCK
"14" = "sda"     # SDx: I2C SDA, SPI SDI (4W) or SDIO (3W)

[models.ratings]
# Table 5: VDD and VDDIO pins -0.3 to 4 V; any logic pin -0.3 V to VDDIO + 0.3 V
# and below 4 V. 4 V is the ceiling for every pin.
max_voltage_v = 4.0

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.71
max_v = 3.6
basis = "Bosch BST-BMI270-DS000-08, Table 1, Supply Voltage Core Domain VDD row"

[[models.envelope]]
kind = "supply_range"
pin = "vddio"
min_v = 1.2
max_v = 3.6
basis = "Bosch BST-BMI270-DS000-08, Table 1, Supply Voltage I/O Domain VDDIO row"

# Sections 6.2/6.3: the interface comes up in I2C; CSB tied to VDDIO keeps it there
# (Table 22 note ****: DNC is possible via the internal pull-up, but that is not
# a strap the binder can resolve, so it is not accepted). Section 6.5: SDO = GND
# selects 0x68, SDO = VDDIO selects 0x69.
[models.peripheral]
kind = "register_map"
required_high_roles = ["csb"]
address_select_role = "sdo"
address_when_low = 0x68
address_when_high = 0x69
spec_toml = '''
[sensor]
name = "BMI270 chip-id subset"
bus = "i2c"
i2c_address = 0x68

# Section 5.2.1: CHIP_ID, RESET 0x24, read-only.
[[sensor.register]]
addr = 0x00
const = [0x24]

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.71   # Table 1, VDD min
idle_a = 0.000970             # Table 1, A+G performance mode typ (see above)
read_a = 0.000970
write_a = 0.000970
low_power_a = 0.0000035       # Table 1, A+G suspend mode typ

[models.coverage]
implements = ["pin_roles", "logic_levels_at_3v3_vddio", "performance_mode_supply_current", "absolute_ratings", "supply_ranges", "i2c_bus_mode_strap", "i2c_address_strap", "register_map_subset", "chip_id_read", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["full_register_map", "spi_register_map", "config_file_upload", "accelerometer_data", "gyroscope_data", "power_mode_state", "fifo", "interrupt_engine", "feature_engine", "auxiliary_i2c_master", "ois_interface", "supply_domain_current_split"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bmi270-ds000.pdf"
title = "Bosch Sensortec BMI270 Datasheet, BST-BMI270-DS000-08, revision 1.6, March 2026"
locator = "Table 1; Table 5; Section 5.2.1 CHIP_ID; Section 6.3; Section 6.5; Table 22 Pin-out and pin connections"
sha256 = "f68ce3c74f011a80bbe4b0279c4abe9609a71a5dcda75a951381d77112e005fb"

# ─────────────────────────────────────────────────────────────────────────────
# BMP581: Bosch Sensortec barometric pressure sensor, 10-pin LGA.
#
# Source: Bosch Sensortec "BMP581 Barometric Pressure Sensor", document
#   BST-BMP581-DS004-13, revision 1.13, April 2025. Table 4 Electrical
#   characteristics, Table 5 Interface pin electrical characteristics, Table 6
#   Absolute maximum ratings, Section 5.6 I2C protocol (slave address), Table 28
#   Pin description, Section 6.2.3 I2C connection, Section 7.1 Register (0x01)
#   ASIC identification ID.
#
# SUPPLY DRAW is the "high resolution" figure, 75 uA typ (Table 4, OSR set to
# high resolution, ODR = 30 Hz, 25 C), the highest typical operating current the
# sheet tabulates; low-power mode at 1 Hz is 1.3 uA and deep standby 0.55 uA. The
