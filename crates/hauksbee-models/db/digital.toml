# ─────────────────────────────────────────────────────────────────────────────
# ADS122C04: Texas Instruments 24-bit, 4-channel, 2-kSPS delta-sigma ADC with
# I2C interface, TSSOP-16 (PW) and WQFN-16 (RTE).
#
# Source: TI "ADS122C04 24-Bit, 4-Channel, 2000-SPS, Delta-Sigma ADC With I2C
#   Interface", SBAS751B, October 2017, revised October 2018. Pin Configuration
#   and Functions (PW and RTE columns), Section 6.1 Absolute Maximum Ratings,
#   Section 6.3 Recommended Operating Conditions, Section 6.4 Thermal
#   Information, Section 6.5 Electrical Characteristics (DIGITAL INPUTS/OUTPUTS,
#   DIGITAL SUPPLY CURRENT), Section 8.4.1.1 Power-On Reset, Section 8.5.1.1
#   Table 14 I2C Address Truth Table, Sections 8.5.3.6 RREG (0010 rrxx) and
#   8.5.3.7 WREG (0100 rrxx dddd dddd), Section 8.6 Table 17 Configuration
#   Register Map (all four registers reset to 00h), Section 9.1.7 Pseudo Code
#   Example.
#
# WHAT IS EXECUTABLE. The device has no ID register; its firmware-visible
# identity is the four configuration registers, read with RREG and written with
# WREG. Both are a command byte followed by data, which the `i2c_pointer` style
# expresses: WREG rr is a pointer write of 40h | rr << 2 followed by one data
# byte, and RREG rr is a pointer write of 20h | rr << 2 followed by a
# (repeated-START) one-byte read. Each WREG is stored and the matching RREG
# returns it, so a driver's write-then-read-back sanity check (Section 9.1.7:
# "read back all configuration registers with the RREG command") behaves as on
# the part. Read-only and fixed bits are not echoed: register 2 bit 7 (DRDY,
# R-0h) reads 0, and register 3 bits 1:0 (fixed 0) read 0.
#
# THE xx BITS ARE DON'T-CARE ON THE PART BUT NOT HERE. The model answers only
# the canonical xx = 00 command bytes (20h/24h/28h/2Ch, 40h/44h/48h/4Ch). The
# Section 9.1.7 example writes "40h, 08h, 42h, 08h": 42h decodes to rr = 00
# (register 0 again) on the real part too, and here it is not decoded at all.
# Several WREGs chained in one frame without a STOP (Section 8.5.3.7) are also
# not decoded: the pointer model takes only the first command of a frame.
#
# ADDRESS. Table 14 has 16 addresses from four levels on each of A0 and A1; the
# binder resolves only a two-level strap. A0 is required at DGND and A1 selects
# between its DGND and DVDD rows: 100 0000 (0x40) and 100 0100 (0x44).
#
# LOGIC LEVELS are DVDD fractions (VIL 0.3 DVDD max, VIH 0.7 DVDD min), which the
# absolute vih/vil params cannot carry, so only VOL (0.4 V max at 3 mA) is set.
# POWER: the peripheral gate is the 2.3 V DVDD minimum (Section 6.3); Section
# 8.4.1.1 gives a ~500 us POR release but no POR voltage. Currents are IDVDD only
# (65 uA typ normal mode, 0.3 uA power-down); AVDD's 250 to 955 uA depends on
# gain and mode, is drawn on a separate pin, and is not modelled.
#
# DELIBERATELY NOT MODELLED: conversions (RDATA: the 24-bit two's-complement
# result has no encoding in the register-map interpreter), START/SYNC,
# POWERDOWN and RESET commands, the RESET pin, the DRDY pin and bit, the
# CRC/inverted-data modes, the IDACs, the AVDD supply current and the
# four-level address pins.

[[models]]
id = "ads122c04_pw"
kind = "digital"
description = "TI ADS122C04 24-bit 4-channel I2C delta-sigma ADC, TSSOP-16 (PW) (strapped I2C configuration-register subset, pad map and supply draw)"

[models.match]
# Package Option Addendum orderables: ADS122C04IPW (tube), ADS122C04IPWR and IPWRG4 (reel).
value_re = "(?i)^ADS122C04(IPW(R(G4)?)?)?$"

[models.params]
vol = 0.4                  # Section 6.5, VOL max at IOL = 3 mA
supply_static_ua = 65.0    # Section 6.5, IDVDD typ, normal mode, DVDD = 3.3 V (100 max)
supply_pin = "13"      # DVDD
gnd_pin = "4"         # DGND
warning = "configuration registers (WREG/RREG, canonical command bytes only) are executable; conversions, RDATA, START/SYNC, POWERDOWN, RESET, DRDY and the AVDD supply current are not modelled"
# SBAS751B Pin Functions: RESET is a "Digital input, Reset, active low" with no
# pull stated; Section 9.1.3 (p.47): "Do not float unused digital inputs ...
# Tie the RESET pin to DVDD if the RESET pin is not used."
must_not_float_roles = "reset_n"
# Bus-clock limits, read by the co-simulation bus-speed check (hauksbee_ir::peripheral_limits).
i2c_max_hz = { max = 1000000.0, unit = "Hz", conditions = "I2C fast-mode plus; fast mode is 400 kHz max, standard mode 100 kHz max", basis = "TI ADS122C04 SBAS751B (Oct 2017, rev Oct 2018), section 6.6 I2C Timing Requirements, FAST-MODE PLUS fSCL max 1000 kHz (p.8)" }

[models.pins]
# Pin Functions table, TSSOP-16 (PW) column.
"1" = "a0"
"2" = "a1"
"3" = "reset_n"
"4" = "dgnd"
"5" = "avss"
"6" = "ain3"
"7" = "ain2"
"8" = "refn"
"9" = "refp"
"10" = "ain1"
"11" = "ain0"
"12" = "avdd"
"13" = "dvdd"
"14" = "drdy_n"
"15" = "sda"
"16" = "scl"

[models.ratings]
max_voltage_v = 7.0           # Section 6.1, AVDD to AVSS and DVDD to DGND 7 V
max_pin_current_a = 0.01      # Section 6.1, continuous input current, any non-supply pin
theta_ja_c_per_w = 90.3    # Section 6.4, RθJA TSSOP-16 (PW)

[[models.envelope]]
kind = "supply_range"
pin = "dvdd"
min_v = 2.3
max_v = 5.5
abs_max_v = 7.0
basis = "TI SBAS751B, Section 6.3 Recommended Operating Conditions, digital power supply DVDD to DGND 2.3 V to 5.5 V; Section 6.1, 7 V"

[[models.envelope]]
