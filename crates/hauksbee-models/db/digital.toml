# Bus-clock limits, read by the co-simulation bus-speed check (hauksbee_ir::peripheral_limits).
i2c_max_hz = { max = 1000000.0, unit = "Hz", conditions = "Fast Mode Plus, VCC = 2.5 V to 5.5 V; Fast Mode (VCC = 1.7 V to 5.5 V) is 400 kHz max", basis = "Microchip AT24C64D data sheet DS20005937D, section 4.4 AC Characteristics, Table 4-3, Clock Frequency SCL fSCL: 400 kHz Fast Mode, 1000 kHz Fast Mode Plus (p.10)" }

