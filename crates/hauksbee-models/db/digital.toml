# ─────────────────────────────────────────────────────────────────────────────
# PCM5122: Texas Instruments 2.1-VRMS, 112-dB stereo audio DAC with 32-bit,
# 384-kHz PCM interface, TSSOP-28 (PW).
#
# Source: TI "PCM512x 2-VRMS DirectPath, 112/106-dB Audio Stereo DAC with
#   32-bit, 384-kHz PCM Interface" (PCM5121, PCM5122), SLAS763C, August 2012,
#   revised October 2018. Section 6 Pin Configuration and Functions and 6.1 Pin
#   Functions (I2C / SPI / HW columns), Section 7.1 Absolute Maximum Ratings,
#   7.3 Recommended Operating Conditions, 7.4 Thermal Information, 7.5
#   Electrical Characteristics (DIGITAL INPUT/OUTPUT 3.3-V LVCMOS rows, POWER
#   SUPPLY REQUIREMENTS), Section 8.4.1.1.2.1 / Table 39 I2C Slave Address,
#   Section 10.5.2 Power Save Modes, Package Option Addendum (PCM5122PW /
#   PCM5122PWR, TSSOP (PW) 28).
#   PDF sha256 2e7b7d81b5b5895c497b296ab6608c544353951da3c37cb3294efb57b4b26822
#
# WHAT IS EXECUTABLE HERE: THE SUPPLY DRAW, NOT THE CONTROL PORT.
# The part has three control personalities picked by MODE1/MODE2 (Section 6.1):
# MODE1 low + MODE2 low = hardwired, MODE1 low + MODE2 high = I2C, MODE1 high =
# SPI. On the Adafruit PCM5122 breakout both MODE1 (pin 17) and MODE2 (pin 18)
# go to the user header and are pulled to AGND by the R15 10k array, so the
# board AS BUILT is in hardwired mode: pins 11/12 are ATT2/ATT1 gain inputs,
# not SDA/SCL. A `[models.peripheral]` register map gated on mode1 low and
# mode2 high would be the honest I2C card, but (a) the binder refuses a strap
# that sits behind a resistor rather than directly on a rail, and refusal leaves
# the part OPEN, and (b) on this board the refusal would be correct anyway.
# The datasheet's control-port identity is also weak: there is no chip-ID
# register; Table 39 gives only the address 1001 1 ADR2 ADR1 (0x4C to 0x4F).
# So no register map is declared. What does hold in every mode is the DVDD and
# AVDD + CPVDD supply current, which is declared as model-owned profiled loads.
#
# SUPPLY LEVELS CHOSEN. Section 7.5 POWER SUPPLY REQUIREMENTS at AVDD = CPVDD =
# DVDD = 3.3 V, fS = 48 kHz, bipolar-zero data: IDD (DVDD at 3.3 V) 12 mA typ /
# 15 mA max; ICC (AVDD + CPVDD) 11 mA typ / 16 mA max. That is the running-DAC
# draw and is held for the whole window. It over-states an idle breakout:
# Section 10.5.2 says a clock halt drops the part to standby, and BCK/LRCK low
# for over 1 s to power-down (DVDD 0.5 mA, AVDD + CPVDD 0.2 mA typ). It
# under-states a loud stream: 1 kHz -1 dBFS raises ICC to 24 mA typ / 32 mA max.
# Both are workload, which belongs in a scenario, not the card.
#
# ICC IS PUBLISHED ONLY AS AVDD + CPVDD COMBINED. There is no split, so the whole
# 11 mA is drawn from AVDD (pin 8). On boards that feed AVDD through a ferrite
# from the same rail as CPVDD (as here: FB1 from 3.3V) the regulator sees the
# same total; only the ferrite's DC drop is over-stated.
#
# LOGIC LEVELS are printed as fractions of DVDD (Section 7.5, 3.3-V LVCMOS
# rows); the schema takes absolute volts, so they are evaluated at the 3.3 V
# DVDD this card's supply envelope assumes. A 1.8 V-DVDD board would need
# 0.7/0.3/0.8/0.22 x 1.8 V instead.
#
# NOT MODELLED: LDOO (1.8 V internal LDO output) and VNEG (-3.3 V charge-pump
# rail) are left as the part's terminals with no driven voltage; the sheet gives
# a nominal value but no output resistance or tolerance. No audio path, clocking
# or control behaviour.
[[models]]
id = "pcm5122"
kind = "digital"
description = "TI PCM5122 stereo audio DAC, TSSOP-28 (pad map, 3.3 V DVDD logic levels, sourced DVDD and AVDD+CPVDD running supply draw; no control port or audio path)"

[models.match]
# Package Option Addendum: PCM5122PW (tube) and PCM5122PWR (reel) are the
# orderable PCM5122 parts. PCM5121 (106 dB) and PCM5141/5142 (miniDSP) are
# excluded by the anchored number.
value_re = "(?i)^PCM5122(PWR?)?$"

[models.params]
# Section 7.5 DIGITAL INPUT/OUTPUT, 3.3-V LVCMOS family, at DVDD = 3.3 V.
vih = 2.31     # 0.7 x DVDD min
vil = 0.99     # 0.3 x DVDD max
# VOH/VOL are printed at a test current (4 mA), a loaded level, so they are rows:
# the loader turns them into the unloaded level (the rail, ASSUMED: the sheet prints
# no light-load row) behind an output resistance.
voh = { min = 2.64, unit = "V", conditions = "AVDD = CPVDD = DVDD = 3.3 V, IOH = -4 mA, 3.3-V LVCMOS family", basis = "7.5 Electrical Characteristics p.8, VOH, 0.8 x DVDD min, evaluated at DVDD = 3.3 V" }
vol = { max = 0.726, unit = "V", conditions = "AVDD = CPVDD = DVDD = 3.3 V, IOL = 4 mA, 3.3-V LVCMOS family", basis = "7.5 Electrical Characteristics p.8, VOL, 0.22 x DVDD max, evaluated at DVDD = 3.3 V" }

[models.pins]
