max_voltage_v = 4.2   # ASSUMED, GD25Q16C 8.3 class

[models.peripheral]
kind = "spi_nor_flash"
size_bytes = 2097152   # ASSUMED
page_size = 256
sector_size = 4096
jedec_id = [200, 64, 21]   # ASSUMED, GD25Q16 C8h 40h 15h
spi_mode = 0
cs_role = "cs"
clk_role = "sck"
mosi_role = "mosi"
miso_role = "miso"

[models.peripheral_power]
supply_role = "vcc"
return_role = "gnd"
power_on_threshold_v = 2.7   # ASSUMED, 2.7 V to 3.6 V class
idle_a = 0.000005
read_a = 0.020
write_a = 0.020
low_power_a = 0.000005

[models.coverage]
implements = ["spi_standard_read", "spi_fast_read", "spi_jedec_id", "spi_page_program", "spi_sector_erase", "spi_chip_erase", "spi_power_down", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["spi_dual_quad_io", "sfdp", "busy_timing", "protection_registers", "security_registers", "fitted_array_image", "part_identity"]

# ─────────────────────────────────────────────────────────────────────────────
# BMA423: Bosch Sensortec 12-bit triaxial accelerometer, LGA-12 2 x 2 mm.
#
# Source: Bosch Sensortec "BMA423 - Digital, triaxial acceleration sensor" data
#   sheet, document BST-BMA423-DS000-01, revision 1.1, May 2019. Section 1
#   Specification, Section 2 Absolute maximum ratings, Section 5.2 Register map,
#   Section 7.1 Pin description, Section 7.2 Connection diagrams.
#
# Datasheet figures used (Section 1, OPERATING CONDITIONS):
#   VDD    = 1.62 / 1.8 / 3.6 V    (analog + digital domain)
#   VDDIO  = 1.2 / 1.8 / 3.6 V     (I/O domain, a SEPARATE supply with its own
#                                   ground; either may be off while the other is
#                                   within range)
#   VIL    <= 0.3 x VDDIO          (SPI and I2C)
#   VIH    >= 0.7 x VDDIO
#   VOL    <= 0.2 x VDDIO          (VDDIO >= 1.62 V, IOL <= 2 mA)
#   VOH    >= 0.8 x VDDIO          (VDDIO >= 1.62 V, IOH <= 2 mA)
#   IDD     = 150 uA typ           (performance mode, nominal VDD/VDDIO, 25 C, +/-4 g)
#   IDDlp1  = 14 uA typ            (low-power mode, 50 Hz ODR)
#   IDDsum  = 3.5 uA typ           (suspend mode)
#   ts_up   = 1 ms max             (power-up time)
#   TA      = -40 to +85 C
# Section 2 Absolute maximum ratings: VDD pin and VDDIO pin -0.3 to 4 V; any
#   non-supply pin -0.3 V to VDDIO + 0.3 V and below 4 V; passive storage -50 to
#   +150 C; shock 10000 g for <= 200 us, 2000 g for <= 1.0 ms; 2 kV HBM.
#   The 4 V figure is worth stating twice because 4.25 V is the number people
#   expect here: it is not what this part's sheet says, in revision 1.1 or in
#   revision 2.0 (August 2019), both of which carry the same 4 V table.
#
# THE LOGIC LEVELS BELOW ARE COMPUTED AT VDDIO = 3.3 V. Every level on this sheet
# is a FRACTION of VDDIO and the `digital` kind carries one fixed volt figure per
# level, so a rail has to be picked. 3.3 V is the rail the part is fed on the
# boards this entry was written for (a Watchy ties both VDD and VDDIO to +3V3),
# and it is the pessimistic choice for a threshold check against a 3.3 V driver.
# The datasheet's own nominal is 1.8 V, and a board running VDDIO there has
# thresholds a little over half these: recompute as vih = 0.7 x VDDIO,
# vil = 0.3 x VDDIO, voh = 0.8 x VDDIO, vol = 0.2 x VDDIO and override per board
# with --models-dir. The value string cannot tell the two rails apart, so an
# explicit note is better than a footprint or supply guess.
#
# SUPPLY DRAW IS THE PERFORMANCE-MODE FIGURE, 150 uA. A wearable spends most of
# its life in the 14 uA low-power mode or the 3.5 uA suspend mode, and which of
# the three applies is a firmware state this model does not know. 150 uA is the
# ceiling of the three, so a rail-budget or shunt-metering check reads the
# worst case rather than an optimistic one.
#
# DELIBERATELY NOT MODELLED: everything the part does over the bus. There is no
# I2C slave here, so a firmware read of CHIP_ID (register 0x00, value 0x13) sees
# nothing, and no acceleration appears at DATA_8..DATA_13 (0x12..0x17). The
# pathway for that is the declarative register-map sensor spec
# (crates/hauksbee-models/src/sensor_spec.rs, `[sensor]` with bus = "i2c" and
# i2c_address = 0x18), which the engine's generic interpreter realizes as an
# I2C slave; it needs the register map from Section 5.2, not new engine code.
# Also not modelled: the on-chip step counter / activity / tap features, the 1 kb
# FIFO, the interrupt engine behind INT1/INT2, and the auxiliary I2C master on
# ASDA/ASCL. No `tpd_s`: the sheet publishes bus timing (SPI tSCKL/tSCKH 45 ns,
# fSCK 10 MHz) but no interrupt or output propagation delay, and inventing one
# would put a number on the exact thing this entry does not simulate.
[[models]]
id = "bma423"
kind = "digital"
description = "Bosch BMA423 triaxial accelerometer, LGA-12 (strap-selected I2C CHIP_ID subset, pad map, logic levels and supply draw)"

[models.match]
# Anchored on the bare part number, with an optional package/variant suffix after
# a separator. The BMA400/BMA456 siblings are different parts with different
# register maps and pinouts, so they resolve to nothing until they get their own
# entries rather than borrowing this map.
value_re = "(?i)^BMA423([-_ ].*)?$"

[models.params]
# Section 1, at VDDIO = 3.3 V. See the note above before trusting these on a
# board with a different I/O rail.
voh   = 2.64     # 0.8 x VDDIO min, IOH <= 2 mA
vol   = 0.66     # 0.2 x VDDIO max, IOL <= 2 mA
vih   = 2.31     # 0.7 x VDDIO min
vil   = 0.99     # 0.3 x VDDIO max
supply_static_ua = 150.0   # IDD typ, performance mode, +/-4 g, 25 C
supply_pin = "7"           # VDD. The engine's supply leg is one pair of pins, so
gnd_pin    = "9"           # VDDIO (pin 3) / GNDIO (pin 8) carry no metered draw
                           # here: of the 150 uA figure the sheet gives no split
                           # between the two domains, and it is a TOTAL for both.

[models.pins]
# Section 7.1 Pin description, LGA-12, cross-checked against the Section 7.2
# connection diagrams.
#
# SDX and SCX are named in the BUS vocabulary (`sda`/`scl`) rather than the
# datasheet's, for the reason crates/hauksbee-models/tests/pin_roles.rs records
# and the 25xx EEPROM entry above follows: a model that names its pins the way
# the sheet does matches, loads, and then resolves to nothing. On this part they
# are I2C SDA/SCL and SPI SDI/SCK on the same pads; the board picks which by
# where it ties CSB (VDDIO = I2C, driven = SPI).
"1"  = "sdo"     # SPI serial data out; in I2C, the address select (GND = 0x18,
                 # VDDIO = 0x19)
"2"  = "sda"     # SDX: I2C SDA, SPI SDI (4-wire) or SDA (3-wire)
"3"  = "vddio"   # I/O-domain supply, 1.2 to 3.6 V
"4"  = "asda"    # auxiliary I2C master data (magnetometer); DNC when unused
"5"  = "int1"    # interrupt output 1, or a FIFO-sync input when configured so
"6"  = "int2"    # interrupt output 2, or a FIFO-sync input when configured so
"7"  = "vdd"     # analog + digital supply, 1.62 to 3.6 V
"8"  = "gndio"   # I/O-domain ground
"9"  = "gnd"     # analog + digital ground
"10" = "csb"     # SPI chip select, active low; tie to VDDIO to select I2C
"11" = "ascl"    # auxiliary I2C master clock (magnetometer); DNC when unused
"12" = "scl"     # SCX: I2C SCL, SPI SCK

[models.ratings]
# Section 2 Absolute maximum ratings. 4 V is the limit on BOTH supply pins, and
# a non-supply pin is bounded by VDDIO + 0.3 V and by 4 V, so 4 V is the ceiling
# for every pin on the part. No max_junction_temp_c: the sheet gives an ambient
# operating range (-40 to +85 C) and a passive storage range, not a junction
# limit, and no thermal resistance to reach one with.
max_voltage_v = 4.0

# Portable firmware-visible identity behavior. The binder attaches it ONLY
# when CSB resolves directly high (I2C personality) and derives 0x18/0x19 from
# the exact SDO strap. A floating/pulled/otherwise unresolved strap leaves the
# device open with a named reason rather than silently choosing this spec's
# default address.
[models.peripheral]
kind = "register_map"
required_high_roles = ["csb"]
address_select_role = "sdo"
address_when_low = 0x18
address_when_high = 0x19
spec_toml = '''
[sensor]
name = "BMA423 chip-id subset"
bus = "i2c"
i2c_address = 0x18

[[sensor.register]]
addr = 0x00
const = [0x13]

[sensor.protocol]
style = "i2c_pointer"
'''

# Same conservative performance-mode current the pre-peripheral digital card
# stamped. Register traffic does not claim a separately sourced current step;
# idle/read/write therefore share the one sourced ceiling.
[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.62
idle_a = 0.000150
read_a = 0.000150
write_a = 0.000150
low_power_a = 0.0000035

[models.coverage]
implements = ["pin_roles", "logic_levels_at_3v3_vddio", "performance_mode_supply_current", "absolute_ratings", "i2c_bus_mode_strap", "i2c_address_strap", "register_map_subset", "chip_id_read", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["full_register_map", "spi_register_map", "accelerometer_data", "power_mode_state", "fifo", "interrupt_engine", "step_and_activity_engine", "auxiliary_i2c_master", "supply_domain_current_split"]

# ─────────────────────────────────────────────────────────────────────────────
# FT231XQ: FTDI USB-to-full-speed-serial UART bridge, QFN-20.
#
# Source: FTDI "FT231X USB to Full Handshake UART IC" datasheet, FT_000565
#   Version 1.2 (Clearance No. FTDI# 261, 2013),
#   https://ftdichip.com/wp-content/uploads/2020/08/DS_FT231X.pdf (sha256
#   8999a05c9ad906a0183c02a27f48b1d056623c876dd28d565c027f7510f0b3f9; FTDI's
#   host refuses scripted requests, so the file read is the byte-identical
#   web.archive.org capture of that URL). Pin map: 3.1 QFN Schematic Symbol and
#   Tables 3.1 to 3.3 (pp.7-8). 3V3OUT: Table 3.1 ("3V3 output at 50mA. May be
#   used to power VCCIO") and the +3.3V LDO Regulator paragraph of 4 (p.13,
#   "maximum current of 50mA"). Ratings: Table 5.1 (p.16). Supply ranges, ICC
#   and the 3V3OUT band: Table 5.3 (p.17). I/O levels and the input pull-ups:
#   Table 5.4, VCCIO = 3.3 V (p.18), and Table 3.3 note 1 (p.8).
#
# TWO SUPPLY DOMAINS, AND THE ONE THAT SETS LOGIC LEVELS IS VCCIO. VCC (pad 12)
# runs the core at 2.97 to 5.5 V; VCCIO (pad 20) runs the UART I/O ring at 1.62
# to 3.63 V, and every VOH/VIH figure below is VCCIO's, not VCC's. The datasheet
# tabulates three separate columns (VCCIO = 3.3, 2.5, 1.8 V) and the 3.3 V one is
# used here because that is the rail the part's own 3V3OUT regulator produces and
# what a bus-powered design ties VCCIO to. On a board that feeds VCCIO 1.8 V,
# VIH becomes 1.6 V and VOH 1.62 V, and this entry would read the bus optimistically.
#
# WHAT IS MODELLED is the part's DC face before and between transfers, which is
# what a board check sees: the internal 3.3 V LDO on 3V3OUT, which bus-powered
# boards use to feed VCCIO and their own logic; the ~75 kOhm pull-ups to VCCIO
# on the UART and modem-status inputs; the supply draw; and the levels.
#
# DELIBERATELY NOT MODELLED: the USB device itself. There is no host, no
# enumeration, no baud-rate divisor and no FIFO, so pads 8/9 (USBDP/USBDM) carry
# roles and nothing else, and TXD never emits a byte. The datasheet does not
# state the level TXD, RTS# or DTR# rest at, so no driver is stamped on them
# rather than assuming a UART idle level. The CBUS pins are MTP-configurable
# (the roles below are the factory defaults, Table 3.3) so a board that
# reprograms them has different functions on those pads than the names suggest.
[[models]]
id = "ft231x"
kind = "digital"
description = "FTDI FT231X USB-to-UART bridge, QFN-20 (pad map, VCCIO levels, internal 3V3OUT LDO and input pull-ups; no USB stack)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://ftdichip.com/wp-content/uploads/2020/08/DS_FT231X.pdf"
title = "FTDI FT231X USB to Full Handshake UART IC datasheet, FT_000565 Version 1.2"
locator = "3.1 QFN Schematic Symbol and Tables 3.1-3.3 pp.7-8; 4 +3.3V LDO Regulator p.13; Table 5.1 p.16; Table 5.3 p.17; Table 5.4 p.18"
sha256 = "8999a05c9ad906a0183c02a27f48b1d056623c876dd28d565c027f7510f0b3f9"
[[models.source.uncertainty]]
status = "unknown"
parameter = "ldo_output_resistance"
reason = "Table 5.3 gives the 3V3OUT band (2.97 to 3.63 V) and 4 the 50 mA limit, but no load regulation, dropout or current limit; the 1 Ohm source resistance is assumed (it drops 50 mV at the rated 50 mA, inside the band), and VCC below 3.3 V is passed through without a dropout"

[models.match]
# "FT231XQ" is the QFN-20 ordering code and "FT231XS" the SSOP-20 one; the two
# have DIFFERENT pin orders, so only the Q (and the bare "FT231X-Q" spelling the
# margay datalogger uses) may borrow this map. The SSOP part has its own card,
# ft231xs.
value_re = "(?i)^FT231X[-_ ]?Q([A-Z0-9-]*)?$"

[models.params]
# Table 5.4, VCCIO = 3.3 V column. See the note above before trusting these on a
# board with a lower I/O rail.
# VOH/VOL are printed at the table's 2 mA test current (a loaded level), so they
# are rows: the loader turns them into the light-load level behind an output
# resistance. The four VOH rows in that table are DRIVE-STRENGTH settings
# (4/8/12/16 mA, which the MTP selects), not load currents, so this is not a
# claim that the pin holds 2.97 V into 16 mA.
voh   = { min = 2.97, unit = "V", conditions = "VCCIO = 3.3 V, IOH = -2 mA (I/O drive strength 4 mA)", basis = "Table 5.4 (p.18), Voh, min column" }
vol   = { max = 0.4, unit = "V", conditions = "VCCIO = 3.3 V, IOL = 2 mA (I/O drive strength 4 mA)", basis = "Table 5.4 (p.18), Vol, max column" }
vih   = 2.0      # min (LVTTL)
vil   = 0.8      # max
supply_static_ua = 8000.0  # Table 5.3 ICC1 typ, normal operation (8.4 mA max);
                           # USB-suspend ICC2 is 125 uA and is not the operating figure
# `supply_pin`/`gnd_pin` record WHICH pads the draw belongs to, for a reader; they
# are not what the engine meters against. `bind_digital` takes the supply leg's
# nets from the ROLES (`vcc`/`vdd` and `gnd`/`vss`), which is why pad 12 is named
# `vcc` and pad 3 `gnd` above. The datasheet gives no VCC/VCCIO split of the 8 mA,
# so the whole figure sits on the core supply either way.
supply_pin = "12"          # VCC
gnd_pin    = "3"
# Said as a `warning` and not only in these comments because comments reach no
# report surface: `entry_warning` puts this on the bind report and on the
# evidence map, where a reader deciding whether a UART result means anything
# will actually meet it.
warning = """the USB stack is not modelled: TXD, RTS# and DTR# carry no driver \
and the bridge sources or answers no UART traffic, so a result that depends on \
data arriving through it is not evidence; the 3V3OUT LDO, the input pull-ups \
and the VCCIO levels are modelled"""

[models.pins]
# Tables 3.1 to 3.3, QFN-20. Cross-checked against the margay datalogger: pad 18
# sits on a net named DTR, pads 8/9 on the USB pair, pad 11 tied to the 3.3 V
# rail (RESET# released), pad 20 on the I/O rail, and the exposed pad on GND.
"1"  = "rxd"        # UART data in (to the IC)
"2"  = "ri_n"       # ring indicator input
"3"  = "gnd"
"4"  = "dsr_n"      # modem-status input
"5"  = "dcd_n"      # modem-status input
"6"  = "cts_n"      # flow-control input
"7"  = "cbus2"      # configurable; factory default TXLED#
"8"  = "usbdp"      # USB D+; no USB stack, see above
"9"  = "usbdm"      # USB D-
"10" = "v3v3out"    # internal 3.3 V LDO output, 50 mA (behavioral law below)
"11" = "reset_n"    # active-low reset input; may be tied to 3V3OUT (4, p.15)
"12" = "vcc"        # core supply, 2.97 to 5.5 V
"13" = "gnd2"
"14" = "cbus1"      # configurable; factory default RXLED#
"15" = "cbus0"      # configurable; factory default TXDEN
"16" = "cbus3"      # configurable; factory default SLEEP#
# THE OUTPUTS ARE NOT `y`-PREFIXED. `digital::output_roles` stamps a Thevenin
# driver on every `y`-prefixed role, and for a part with NO `[models.logic]`
# block nothing ever computes a value for that driver: it stays at its initial
# 0 V and ENABLED, so a `y`-named output becomes a strong constant LOW on the
# board's net. On this part that would hold the MCU's UART RX line at ground.
"17" = "txd"        # UART data out (not driven; see above)
"18" = "dtr_n"      # modem-status output
"19" = "rts_n"      # flow-control output
"20" = "vccio"      # I/O-ring supply, 1.62 to 3.63 V; sets every level above
# The exposed pad is keyed twice because the CAD tools number it differently and
# the binder matches the BOARD's pad string. The datasheet calls it pin 21
# (Table 3.1 note: "Pin 21 on the symbol is the pad under the centre of the chip
# package and should be connected to GND"), as KiCad's QFN-20-1EP land does;
# Eagle's QFN20 land (the margay datalogger's) calls it "EP".
"EP" = "gnd3"       # exposed pad (Eagle spelling)
"21" = "gnd4"       # the same exposed pad, datasheet and KiCad numbering

[models.ratings]
# Table 5.1. VCCIO's -0.3 to 4.0 V is the TIGHTER of the two supply limits, and
# there is no per-domain field on this schema, so the tighter one is recorded
# here; the per-domain limits are in the envelopes below.
max_voltage_v = 4.0
max_pin_current_a = 0.022   # DC output current, outputs

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.97
max_v = 5.5
abs_max_v = 5.5
basis = "FTDI FT231X FT_000565 v1.2, Table 5.3 VCC operating supply 2.97 V to 5.5 V; Table 5.1 VCC supply voltage -0.3 V to +5.5 V"

[[models.envelope]]
kind = "supply_range"
pin = "vccio"
min_v = 1.62
max_v = 3.63
abs_max_v = 4.0
basis = "FTDI FT231X FT_000565 v1.2, Table 5.3 VCCIO operating supply 1.62 V to 3.63 V; Table 5.1 VCCIO IO voltage -0.3 V to +4.0 V"

# Internal 3.3 V LDO (Table 3.1, 4, Table 5.3). With VCC above 3.3 V it holds
# 3V3OUT at 3.3 V; with VCC at 3.3 V the datasheet makes 3V3OUT an input tied to
# VCC, which `min(v_vcc, 3.3)` reproduces with no current between them. The
# 1 Ohm source resistance is assumed (see the uncertainty above); at or below
# `rail_owner::SERIES_OHMS` it makes the law the supply of the net it drives, so
# a rail fed only from 3V3OUT takes no name-derived ideal source beside it.
[[models.behavioral.laws]]
name = "ldo_3v3out"
kind = "voltage"
a = "v3v3out"
b = "gnd"
expr = "max(0.0, min(v_vcc, 3.3))"
r_ohms = 1.0

# Table 3.3 note 1: input pins are pulled to VCCIO through internal ~75 kOhm
# resistors (Table 5.4 Rpu 40 / 75 / 190 kOhm min / typ / max).
[models.behavioral.pins.rxd]
pull_to = "vccio"
pull_ohms = 75000.0

[models.behavioral.pins.cts_n]
pull_to = "vccio"
pull_ohms = 75000.0

[models.behavioral.pins.dsr_n]
pull_to = "vccio"
pull_ohms = 75000.0

[models.behavioral.pins.dcd_n]
pull_to = "vccio"
pull_ohms = 75000.0

[models.behavioral.pins.ri_n]
pull_to = "vccio"
pull_ohms = 75000.0

[models.coverage]
implements = ["pin_roles", "vccio_logic_levels", "internal_3v3_ldo", "input_pullups", "operating_supply_current", "supply_ranges", "absolute_ratings"]
missing = ["usb_stack", "uart_traffic", "txd_rts_dtr_drive", "cbus_functions", "ldo_dropout", "reset_generator", "usb_suspend_current", "vccio_1v8_2v5_levels"]

# ─────────────────────────────────────────────────────────────────────────────
# FT231XS: the SSOP-20 ordering code of the same FTDI FT231X bridge as the FT231XQ
# card above. Source: the same FT_000565 Version 1.2 datasheet (sha256
# 8999a05c9ad906a0183c02a27f48b1d056623c876dd28d565c027f7510f0b3f9, re-fetched
# byte-identical from web.archive.org); the pin map is 3.2 "20-LD SSOP Package"
# (Figure 3.2) and Tables 3.4 to 3.6 (pp.9-10). Everything electrical (VCC and VCCIO
# domains, the 3V3OUT LDO, the ~75 kOhm input pull-ups, ICC, levels) is
# package-independent in the datasheet and is the FT231XQ card's, with the same
# caveats. The SSOP has no exposed pad and its pad order differs from the QFN.
[[models]]
id = "ft231xs"
kind = "digital"
description = "FTDI FT231X USB-to-UART bridge, SSOP-20 (pad map, VCCIO levels, internal 3V3OUT LDO and input pull-ups; no USB stack)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://ftdichip.com/wp-content/uploads/2020/08/DS_FT231X.pdf"
title = "FTDI FT231X USB to Full Handshake UART IC datasheet, FT_000565 Version 1.2"
locator = "3.2 SSOP Schematic Symbol and Tables 3.4-3.6 pp.9-10; 4 +3.3V LDO Regulator p.13; Table 5.1 p.16; Table 5.3 p.17; Table 5.4 p.18"
sha256 = "8999a05c9ad906a0183c02a27f48b1d056623c876dd28d565c027f7510f0b3f9"
[[models.source.uncertainty]]
status = "unknown"
parameter = "ldo_output_resistance"
reason = "Table 5.3 gives the 3V3OUT band (2.97 to 3.63 V) and 4 the 50 mA limit, but no load regulation, dropout or current limit; the 1 Ohm source resistance is assumed (it drops 50 mV at the rated 50 mA, inside the band), and VCC below 3.3 V is passed through without a dropout"

[models.match]
# FT231XS is the SSOP-20 ordering code (1.2 Part Numbers and 9.2 SSOP-20 Package Markings); the QFN-20 FT231XQ has its own card because the pin orders differ.
value_re = "(?i)^FT231X[-_ ]?S([A-Z0-9-]*)?$"

[models.params]
# Table 5.4, VCCIO = 3.3 V column. See the note above before trusting these on a
# board with a lower I/O rail.
# VOH/VOL are printed at the table's 2 mA test current (a loaded level), so they
# are rows: the loader turns them into the light-load level behind an output
# resistance. The four VOH rows in that table are DRIVE-STRENGTH settings
# (4/8/12/16 mA, which the MTP selects), not load currents, so this is not a
# claim that the pin holds 2.97 V into 16 mA.
voh   = { min = 2.97, unit = "V", conditions = "VCCIO = 3.3 V, IOH = -2 mA (I/O drive strength 4 mA)", basis = "Table 5.4 (p.18), Voh, min column" }
vol   = { max = 0.4, unit = "V", conditions = "VCCIO = 3.3 V, IOL = 2 mA (I/O drive strength 4 mA)", basis = "Table 5.4 (p.18), Vol, max column" }
vih   = 2.0      # min (LVTTL)
vil   = 0.8      # max
supply_static_ua = 8000.0  # Table 5.3 ICC1 typ, normal operation (8.4 mA max);
                           # USB-suspend ICC2 is 125 uA and is not the operating figure
# `supply_pin`/`gnd_pin` record WHICH pads the draw belongs to, for a reader; they
# are not what the engine meters against. `bind_digital` takes the supply leg's
# nets from the ROLES (`vcc`/`vdd` and `gnd`/`vss`), which is why pad 15 is named
# `vcc` and pad 6 `gnd` above. The datasheet gives no VCC/VCCIO split of the 8 mA,
# so the whole figure sits on the core supply either way.
supply_pin = "15"          # VCC
gnd_pin    = "6"
# Said as a `warning` and not only in these comments because comments reach no
# report surface: `entry_warning` puts this on the bind report and on the
# evidence map, where a reader deciding whether a UART result means anything
# will actually meet it.
warning = """the USB stack is not modelled: TXD, RTS# and DTR# carry no driver \
and the bridge sources or answers no UART traffic, so a result that depends on \
data arriving through it is not evidence; the 3V3OUT LDO, the input pull-ups \
and the VCCIO levels are modelled"""

[models.pins]
# 3.2 / Tables 3.4 to 3.6, SSOP-20 (the pad numbers are the package's pin numbers).
"1"  = "dtr_n"      # modem-status output
"2"  = "rts_n"      # flow-control output
"3"  = "vccio"      # I/O-ring supply, 1.62 to 3.63 V; sets every level
"4"  = "rxd"        # UART data in (to the IC)
"5"  = "ri_n"       # ring indicator input
"6"  = "gnd"
"7"  = "dsr_n"      # modem-status input
"8"  = "dcd_n"      # modem-status input
"9"  = "cts_n"      # flow-control input
"10" = "cbus2"      # configurable; factory default TXLED#
"11" = "usbdp"      # USB D+; no USB stack
"12" = "usbdm"      # USB D-
"13" = "v3v3out"    # internal 3.3 V LDO output, 50 mA (behavioral law below)
"14" = "reset_n"    # active-low reset input
"15" = "vcc"        # core supply, 2.97 to 5.5 V
"16" = "gnd2"
"17" = "cbus1"      # configurable; factory default RXLED#
"18" = "cbus0"      # configurable; factory default TXDEN
"19" = "cbus3"      # configurable; factory default SLEEP#
# Outputs are NOT y-prefixed for the reason given on the FT231XQ card.
"20" = "txd"        # UART data out (not driven)

[models.ratings]
# Table 5.1. VCCIO's -0.3 to 4.0 V is the TIGHTER of the two supply limits, and
# there is no per-domain field on this schema, so the tighter one is recorded
# here; the per-domain limits are in the envelopes below.
max_voltage_v = 4.0
max_pin_current_a = 0.022   # DC output current, outputs

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.97
max_v = 5.5
abs_max_v = 5.5
basis = "FTDI FT231X FT_000565 v1.2, Table 5.3 VCC operating supply 2.97 V to 5.5 V; Table 5.1 VCC supply voltage -0.3 V to +5.5 V"

[[models.envelope]]
kind = "supply_range"
pin = "vccio"
min_v = 1.62
max_v = 3.63
abs_max_v = 4.0
basis = "FTDI FT231X FT_000565 v1.2, Table 5.3 VCCIO operating supply 1.62 V to 3.63 V; Table 5.1 VCCIO IO voltage -0.3 V to +4.0 V"

# Internal 3.3 V LDO (Table 3.1, 4, Table 5.3). With VCC above 3.3 V it holds
# 3V3OUT at 3.3 V; with VCC at 3.3 V the datasheet makes 3V3OUT an input tied to
# VCC, which `min(v_vcc, 3.3)` reproduces with no current between them. The
# 1 Ohm source resistance is assumed (see the uncertainty above); at or below
# `rail_owner::SERIES_OHMS` it makes the law the supply of the net it drives, so
# a rail fed only from 3V3OUT takes no name-derived ideal source beside it.
[[models.behavioral.laws]]
name = "ldo_3v3out"
kind = "voltage"
a = "v3v3out"
b = "gnd"
expr = "max(0.0, min(v_vcc, 3.3))"
r_ohms = 1.0

# Table 3.3 note 1: input pins are pulled to VCCIO through internal ~75 kOhm
# resistors (Table 5.4 Rpu 40 / 75 / 190 kOhm min / typ / max).
[models.behavioral.pins.rxd]
pull_to = "vccio"
pull_ohms = 75000.0

[models.behavioral.pins.cts_n]
pull_to = "vccio"
pull_ohms = 75000.0

[models.behavioral.pins.dsr_n]
pull_to = "vccio"
pull_ohms = 75000.0

[models.behavioral.pins.dcd_n]
pull_to = "vccio"
pull_ohms = 75000.0

[models.behavioral.pins.ri_n]
pull_to = "vccio"
pull_ohms = 75000.0

[models.coverage]
implements = ["pin_roles", "vccio_logic_levels", "internal_3v3_ldo", "input_pullups", "operating_supply_current", "supply_ranges", "absolute_ratings"]
missing = ["usb_stack", "uart_traffic", "txd_rts_dtr_drive", "cbus_functions", "ldo_dropout", "reset_generator", "usb_suspend_current", "vccio_1v8_2v5_levels"]

# ─────────────────────────────────────────────────────────────────────────────
# CP2102N (QFN28): Silicon Labs USB-to-UART bridge, 5 x 5 mm QFN-28.
#
# Source: Silicon Labs "CP2102N Data Sheet" Rev. 1.5,
#   https://www.silabs.com/documents/public/data-sheets/cp2102n-datasheet.pdf
#   (sha256 32fbab0ba17f394ab76fbbd8129bddad228c1c486a1693d96ea5905936e437fe,
#   the web.archive.org capture of that URL). Ordering codes and the QFN28
#   member (7 GPIO, no separate VIO pin): Figure 1.1 and Table 1.1 (p.2). Power
#   pin connections: 2.1 Figures 2.1-2.3 (pp.5-6). Supply ranges: Table 3.1
#   (p.10; note 3, "On devices without a VIO pin, VIO = VDD"). Supply current:
#   Table 3.2 (p.10). Internal 5 V-to-3.3 V regulator: Table 3.6 (p.12). GPIO
#   levels and weak pull-up: Table 3.7 (p.13). Absolute maximum ratings: Table
#   3.10 (p.15). GPIO default state: 4.3.1 (p.19). Pin map: Figure 5.1 and
#   Table 5.1 (pp.27-28).
#
# ONE SUPPLY DOMAIN. The QFN28 part has no VIO pin, so every I/O level is
# referenced to VDD (pad 6), 3.0 to 3.6 V. VREGIN (pad 7) feeds the internal
# regulator whose output is VDD; when the regulator is not used VREGIN is tied
# to VDD (Figure 2.3, Table 3.6 note 1).
#
# THE INTERNAL REGULATOR IS NOT MODELLED. A voltage law on VDD (as the FT231X
# card has on 3V3OUT) would claim the VDD rail as its supply; on the common
# self-powered board, where a board regulator feeds VDD and VREGIN together,
# that is two drivers on one rail and a false conflict. So a bus-powered board
# whose VDD rail is fed only by this part takes the rail's name-derived source.
#
# DELIBERATELY NOT MODELLED: the USB device itself. TXD, RTS, DTR, SUSPEND,
# SUSPENDb and the CHRx outputs carry no driver (no `y`-prefixed roles, see the
# FT231X note), and the GPIO alternate functions and output modes are
# configured in the part's one-time memory (4.3, 4.5).
[[models]]
id = "cp2102n_qfn28"
kind = "digital"
description = "Silicon Labs CP2102N USB-to-UART bridge, QFN-28 (pad map, VDD-referenced GPIO levels, default GPIO pull-ups, supply ranges; no USB stack or internal regulator)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.silabs.com/documents/public/data-sheets/cp2102n-datasheet.pdf"
title = "Silicon Labs CP2102N Data Sheet, Rev. 1.5"
locator = "Figure 1.1 and Table 1.1 p.2; 2.1 Figures 2.1-2.3 pp.5-6; Tables 3.1 and 3.2 p.10; Table 3.6 p.12; Table 3.7 p.13; Table 3.10 p.15; 4.3.1 p.19; Figure 5.1 and Table 5.1 pp.27-28"
sha256 = "32fbab0ba17f394ab76fbbd8129bddad228c1c486a1693d96ea5905936e437fe"
[[models.source.uncertainty]]
status = "unknown"
parameter = "gpio_pullup_resistance"
reason = "Table 3.7 gives the weak pull-up as a current (-10 / -20 / -30 uA at VIN = 0 V, VDD = 3.6 V), not a resistance; 180 kOhm is 3.6 V / 20 uA, an assumed linear equivalent of the typical figure"
[[models.source.uncertainty]]
status = "unknown"
parameter = "internal_regulator"
reason = "Table 3.6's 5 V-to-3.3 V regulator (VDD 3.1 to 3.6 V for VREGIN >= 4.1 V, 100 mA, 0.8 V dropout) is not modelled; see the comment above the entry"

[models.match]
# The QFN28 member only: the QFN24 and QFN20 parts have a different pin map
# (and the QFN24 a separate VIO pin), Table 1.1 and 5.2-5.3. Figure 1.1 code
# CP2102N-A<hw/fw rev>-G QFN28 [R]; "CP2102N-Axx-xQFN28" is the generic
# library spelling of the same part.
value_re = "(?i)^CP2102N[-_ ]?A(0[0-9]|XX)[-_ ]?[GX]QFN28R?$"

[models.params]
# Table 3.7 at VIO = VDD = 3.3 V.
voh   = 2.6      # VIO - 0.7 V min at IOH = -7 mA (high drive), VIO >= 3.0 V
vol   = 0.6      # max at IOL = 13.5 mA (high drive), VIO >= 3.0 V
vih   = 2.7      # VIO - 0.6 V min (all GPIO pins including VBUS)
vil   = 0.6      # max
supply_static_ua = 9500.0  # Table 3.2 IDD typ, 115200 baud continuous data;
                           # it flows into VREGIN, and is drawn on the VDD role
                           # because that is the leg the binder meters
supply_pin = "6"           # VDD
gnd_pin    = "3"
warning = """the USB stack and the internal 5 V-to-3.3 V regulator are not \
modelled: TXD, RTS, DTR, SUSPEND and the CHRx outputs carry no driver and the \
bridge sources or answers no UART traffic, so a result that depends on data \
arriving through it is not evidence; the VDD-referenced levels, the default \
GPIO pull-ups and the supply ranges are modelled"""

[models.levels]
# Table 3.7: VIH = VIO - 0.6 V, VIL = 0.6 V, VOH = VIO - 0.7 V (IOH = -7 mA),
# VIO = VDD on this package, over VDD 3.0 to 3.6 V (Table 3.1).
vih = [[3.0, 2.4], [3.6, 3.0]]
vil = [[3.0, 0.6], [3.6, 0.6]]
voh = [[3.0, 2.3], [3.6, 2.9]]

[models.pins]
# Figure 5.1 and Table 5.1, QFN28.
"1"  = "dcd_n"      # data carrier detect input
"2"  = "ri_n"       # ring indicator input / CLK output
"3"  = "gnd"
"4"  = "usbdp"      # USB D+; no USB stack, see above
"5"  = "usbdm"      # USB D-
"6"  = "vdd"        # supply input / internal regulator output, 3.0 to 3.6 V
"7"  = "vregin"     # internal regulator input, 3.0 to 5.25 V
"8"  = "vbus"       # VBUS sense input
"9"  = "rst_n"      # active-low reset
"10" = "nc"
"11" = "suspend_n"  # low in USB suspend (not driven)
"12" = "suspend"    # high in USB suspend (not driven)
"13" = "chren"      # battery-charge enable output (not driven)
"14" = "chr1"
"15" = "chr0"
"16" = "gpio3"      # GPIO.3 / WAKEUP
"17" = "gpio2"      # GPIO.2 / RS485
"18" = "gpio1"      # GPIO.1 / RXT
"19" = "gpio0"      # GPIO.0 / TXT
"20" = "gpio6"
"21" = "gpio5"
"22" = "gpio4"
"23" = "cts_n"      # clear-to-send input
"24" = "rts_n"      # ready-to-send output (not driven)
"25" = "rxd"        # UART data in (to the IC)
"26" = "txd"        # UART data out (not driven)
"27" = "dsr_n"      # data-set-ready input
"28" = "dtr_n"      # data-terminal-ready output (not driven)
# The centre pad is GND (Table 5.1 "Center"); KiCad's QFN-28-1EP land numbers
# it 29, other libraries "EP".
"29" = "gnd2"
"EP" = "gnd3"


# VDD (pad 6) is the internal regulator's 3.3 V OUTPUT whenever VREGIN is fed
# (Figures 2.1 and 2.2: "3.3 V (out)" with bypass capacitors only), so a board
# that leaves it on a capacitor-only net is wired as the datasheet draws it.
# It is an input only when the regulator is bypassed (Figure 2.3), and VREGIN,
# the other supply pad, is still held to being wired.
[[models.optional_supplies]]
role = "vdd"
basis = "Silicon Labs CP2102N Rev. 1.5, 2.1 Typical Connection Diagrams, Figure 2.1 (bus-powered) and Figure 2.2 (self-powered): VDD is '3.3 V (out)' of the internal regulator with 4.7 uF and 0.1 uF bypass capacitors only; Figure 2.3 ties it to the external supply when the regulator is not used"

[models.ratings]
# Table 3.10. VDD's 4.2 V is the tightest supply limit; per-pin limits are in
# the envelopes below.
max_voltage_v = 4.2
max_pin_current_a = 0.1     # IIO, any UART, GPIO, VBUS or RSTb pin

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 3.0
max_v = 3.6
abs_max_v = 4.2
basis = "Silicon Labs CP2102N Rev. 1.5, Table 3.1 VDD 3.0 V to 3.6 V; Table 3.10 VDD GND-0.3 V to 4.2 V"

[[models.envelope]]
kind = "supply_range"
pin = "vregin"
min_v = 3.0
max_v = 5.25
abs_max_v = 5.8
basis = "Silicon Labs CP2102N Rev. 1.5, Table 3.1 VREGIN 3.0 V to 5.25 V; Table 3.10 VREGIN GND-0.3 V to 5.8 V"

[[models.envelope]]
kind = "supply_range"
pin = "vbus"
min_v = -0.3
max_v = 5.8
basis = "Silicon Labs CP2102N Rev. 1.5, Table 3.10 VBUS GND-0.3 V to 5.8 V with VIO > 3.3 V (VIO + 2.5 V below that); a stress bound, not a logic range. 2.3 recommends a 22.1k / 47.5k divider on VBUS"

# 4.3.1: by default and during reset the GPIO pins are open-drain with the weak
# pull-up enabled and the latch at 1; Table 3.7 IPU -20 uA typ at VDD 3.6 V
# (180 kOhm equivalent, see the uncertainty above).
[models.behavioral.pins.gpio0]
pull_to = "vdd"
pull_ohms = 180000.0

[models.behavioral.pins.gpio1]
pull_to = "vdd"
pull_ohms = 180000.0

[models.behavioral.pins.gpio2]
pull_to = "vdd"
pull_ohms = 180000.0

[models.behavioral.pins.gpio3]
pull_to = "vdd"
pull_ohms = 180000.0

[models.behavioral.pins.gpio4]
pull_to = "vdd"
pull_ohms = 180000.0

[models.behavioral.pins.gpio5]
pull_to = "vdd"
pull_ohms = 180000.0

[models.behavioral.pins.gpio6]
pull_to = "vdd"
pull_ohms = 180000.0

[models.coverage]
implements = ["pin_roles", "vdd_logic_levels", "gpio_default_pullups", "operating_supply_current", "supply_ranges", "absolute_ratings"]
missing = ["usb_stack", "uart_traffic", "txd_rts_dtr_drive", "gpio_alternate_functions", "internal_regulator", "reset_generator", "usb_suspend_current", "battery_charger_detect"]

# ─────────────────────────────────────────────────────────────────────────────
# BME280: Bosch combined humidity, pressure and temperature sensor, LGA-8.
#
# Source: Bosch Sensortec "BME280 Combined humidity and pressure sensor"
#   datasheet, document number BST-BME280-DS001-24 on the title page of the copy
#   read; the page footers of that same file carry the earlier
#   BST-BME280-DS001-23 / Revision_1.23_012022 stamp, so the two disagree and both
#   are recorded. Table 35 "Pin description", Table 32 "interface parameters",
#   Table 5 "Absolute maximum ratings", and the key-parameters list on page 1.
#
# SAME SHAPE AS THE BMA423 ABOVE, and the same caveats apply. Two supply
# domains: VDD (pad 8) is the analog/digital supply, 1.71 to 3.6 V; VDDIO
# (pad 6) is the I/O supply, 1.2 to 3.6 V, and the logic levels are RATIOMETRIC
# to VDDIO. The datasheet gives them only as percentages. The product has no
# supply-relative form for a digital card's levels: LogicLevels::from_params
# reads voh/vol/vih/vil as absolute volts, and a param row in a rail-relative
# unit is refused. So the volts below are those percentages evaluated at a stated
# supply (VIH/VIL at the datasheet's own typical VDDIO, 1.8 V, Table 1 "Supply
# Voltage I/O Domain", 1.2 min / 1.8 typ / 3.6 max; VOH/VOL at the 1.62 V their
# rows print), and the printed percentages are kept as characteristic records in
# unit "VDDIO". VIH/VIL are wrong by the ratio on a board with a different I/O
# rail; the output levels follow the rail (see the params note).
#
# MODELLED AS THE BMP280 BELOW IS: the chip-id register only (Section 5.4.1,
# 0xD0 reads 0x60), attached when CSB resolves high (Section 6.1, I2C selected)
# at the SDO-selected address (Section 6.2, 0x76 / 0x77). NOT MODELLED: the rest
# of the register map, therefore the calibration coefficients, the oversampling
# modes and the measurement itself. Nothing here makes an I2C read return a
# pressure; the full declarative sensor spec is the pathway for that.
[[models]]
id = "bme280"
kind = "digital"
description = "Bosch BME280 humidity/pressure/temperature sensor, LGA-8 (pad map, VDDIO logic levels and chip-id register; no measurement)"

[models.match]
# The BMP280 (no humidity channel) and BME680 (gas) are different dies with
# different register maps; both are correctly excluded by the anchored number.
value_re = "(?i)^BME280([-_ ].*)?$"

[models.params]
# Table 32 (p.35). The datasheet states all four as PERCENTAGES of VDDIO and never
# in volts. VOH and VOL are printed at a test current (Ioh = 1 mA, Iol = 3 mA), a
# loaded level, so they are rows evaluated at the supply their row prints (VDDIO =
# 1.62 V): the loader turns them into the unloaded level (the rail, ASSUMED: the
# sheet prints no light-load row) behind an output resistance. The printed
# percentages stay as the characteristic records below. VIH/VIL below are the
# percentages times the Table 1 typical VDDIO = 1.8 V.
voh   = { min = 1.296, unit = "V", conditions = "VDDIO = 1.62 V, IOH = 1 mA (SDO, SDI); 80 %VDDIO", basis = "Table 32 p.35, Voh, 80 %VDDIO min (0.8 x 1.62 V); the 1.20 V row relaxes to 60 %" }
vol   = { max = 0.324, unit = "V", conditions = "VDDIO = 1.62 V, IOL = 3 mA (I2C, Vol_SDI); 20 %VDDIO", basis = "Table 32 p.35, Vol_SDI, 20 %VDDIO max (0.2 x 1.62 V); the SPI SDO row is the same 20 % at 1 mA, the 1.20 V rows 23 %" }
vih   = 1.44     # Vih_si 80% VDDIO min, stated over VDDIO = 1.2 to 3.6 V
vil   = 0.36     # Vil_si 20% VDDIO max, same range
supply_static_ua = 3.6     # "3.6 uA @ 1 Hz humidity, pressure and temperature",
                           # from the key-parameters list on page 1 rather than a
                           # table row: Table 1 gives the sleep and standby
                           # currents (0.1 and 0.2 uA typ) and Table 1 the
                           # per-measurement peaks (340 to 714 uA), and this is the
                           # duty-cycled figure between them, which is what a
                           # supply leg should carry. The sheet gives no split
                           # between the VDD and VDDIO domains.
supply_pin = "8"           # VDD
gnd_pin    = "1"           # GND
# Bus-clock limits, read by the co-simulation bus-speed check (hauksbee_ir::peripheral_limits).
max_sclk_hz = { max = 10000000.0, unit = "Hz", conditions = "SPI clock input frequency F_spi, 0 to 10 MHz; 3- and 4-wire SPI", basis = "Bosch BME280 data sheet BST-BME280-DS001-24 (revision 1.24, Feb 2024), Table 34 SPI timings, F_spi max 10 MHz (p.37); key features (p.2): SPI up to 10 MHz" }
i2c_max_hz = { max = 3400000.0, unit = "Hz", conditions = "I2C High Speed mode; Standard and Fast modes are supported as well", basis = "Bosch BME280 data sheet BST-BME280-DS001-24 (revision 1.24), key features (p.2): I2C up to 3.4 MHz; Table 33 I2C timings (p.36) lists S&F and HS mode" }

[models.pins]
# Table 35 Pin description, LGA-8. NOTE THE NUMBERING DIRECTION: the datasheet's
# connection diagram runs clockwise in top view, which is the opposite of the
# usual convention, so this map cannot be re-derived by inspection of a footprint.
# Cross-checked against the margay datalogger, where pad 2 is tied to the I/O
# rail (selecting I2C), pad 5 is tied high (address 0x77), pads 3 and 4 are on
# the SDA/SCL nets and pads 1/7 are grounded: all four agree with this map.
#
# SDI and SCK are named in the BUS vocabulary (`sda`/`scl`) rather than the
# sheet's, for the reason the BMA423 entry above records.
"1" = "gnd"
"2" = "csb"     # SPI chip select, active low; tie to VDDIO to select I2C
"3" = "sda"     # SDI: I2C SDA, or SPI SDI
"4" = "scl"     # SCK: I2C SCL, or SPI SCK
"5" = "sdo"     # SPI data out; in I2C, the address select (GND = 0x76,
                # VDDIO = 0x77)
"6" = "vddio"   # I/O-domain supply, 1.2 to 3.6 V; sets every level above
"7" = "gnd2"
"8" = "vdd"     # analog + digital supply, 1.71 to 3.6 V

[models.ratings]
# Table 5: -0.3 to +4.25 V on either supply pin, and -0.3 V to VDDIO + 0.3 V on
# any interface pin. 4.25 V is the ceiling.
max_voltage_v = 4.25

# Section 6.1 (p.32): "If CSB is connected to VDDIO, the I2C interface is
# active." Section 6.2 (p.32): SDO to GND gives 1110110 (0x76), SDO to VDDIO
# gives 1110111 (0x77). A floating or pulled strap leaves the part open with a
# named reason rather than a guessed address.
[models.peripheral]
kind = "register_map"
required_high_roles = ["csb"]
address_select_role = "sdo"
address_when_low = 0x76
address_when_high = 0x77
spec_toml = '''
[sensor]
name = "BME280 chip-id subset"
bus = "i2c"
i2c_address = 0x76

# Section 5.4.1 (p.27) and Table 18 Memory map: register 0xD0 "id",
# chip_id = 0x60.
[[sensor.register]]
addr = 0xD0
const = [0x60]

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.71   # Table 1, VDD min
idle_a = 0.0000036            # p.1 key features, 3.6 uA @ 1 Hz humidity, pressure and temperature
read_a = 0.0000036
write_a = 0.0000036
low_power_a = 0.0000001       # Table 1, sleep current IDDSL typ

[models.coverage]
implements = ["pin_roles", "logic_levels_at_1v8_vddio", "duty_cycled_supply_current", "absolute_ratings", "i2c_bus_mode_strap", "i2c_address_strap", "register_map_subset", "chip_id_read", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["full_register_map", "spi_register_map", "calibration_coefficients", "humidity_data", "pressure_data", "temperature_data", "power_mode_state", "conversion_peak_current", "supply_domain_current_split"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bme280-ds002.pdf"
title = "Bosch Sensortec BME280 Combined humidity and pressure sensor, BST-BME280-DS001-24, revision 1.24, February 2024"
locator = "p.1 Key features; Table 1 Electrical parameter specification; Section 5.4.1 Register 0xD0 id and Table 18 Memory map p.27; Sections 6.1 Interface selection and 6.2 I2C Interface p.32; Table 32 interface parameters; Table 35 Pin description"
