max_v = 5.5
abs_max_v = 5.5
basis = "ATA6560/1 DS20005991A, Electrical Characteristics VVIO 2.8 V to 5.5 V (ATA6561 only); Absolute Maximum Ratings, DC voltage on all other pins -0.3 V to +5.5 V"

