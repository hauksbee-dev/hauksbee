# ─────────────────────────────────────────────────────────────────────────────
# APDS-9960: Broadcom (Avago) proximity, ambient light, RGB and gesture sensor
# with integrated IR LED, 8-pin module.
#
# Source: Avago Technologies "APDS-9960 Digital Proximity, Ambient Light, RGB
#   and Gesture Sensor" data sheet, AV02-4191EN, November 13, 2015. Ordering
#   Information; I/O Pins Configuration; Absolute Maximum Ratings; Recommended
#   Operating Conditions; Operating Characteristics (VDD = 3 V, 25 C); I2C
#   Protocol; Register Set; ID Register (0x92).
#
# SUPPLY DRAW is the proximity/gesture figure, 790 uA typ (LDR pulse ON,
# PPulse/GPulse = 8, ILDR NOT included), the highest of the operating states the
# sheet tabulates (active ALS 200 uA typ / 250 uA max, wait 38 uA, sleep 1.0 uA
# typ). Which state applies is firmware, so the ceiling is carried, as the BMA423
# entry does. The IR LED current (LEDA, 100 mA pulsed at LDRIVE = 0, scaled up to 300 % by LED_BOOST) is a
# separate supply and is not on this leg at all.
#
# THE 3.8 V CEILING IS NOT LEDA'S. Absolute Maximum Ratings covers VDD, input and
# output voltages (3.8 V each), while Recommended Operating Conditions puts the LED
# supply VLEDA at 3.0 to 4.5 V; no absolute maximum is printed for LEDA itself.
[[models]]
id = "apds9960"
kind = "digital"
