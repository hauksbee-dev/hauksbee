gnd_pin = "4" # Source: Table 5-2, GND1 pin number
tpd_s = 3.3e-8  # derived: tpd_s = propagation delay, the slower edge at the largest printed overdrive: 'tpLH1-2 low-to-high propagation delay' typ 33 ns (3 V ≤ VCC1,VCC2 ≤ 3.6 V; side 1 to side 2; 0.55 V to 0.7×VCC2)

[models.ratings]
max_voltage_v = 6.0 # Source: Table 6.1, VCC1/VCC2 absolute maximum
max_junction_temp_c = 150.0 # Source: Table 6.1, TJ(MAX)

[models.pins]
# Cross-checked Table 5-2 against the D-package top view in Figure 5-2 and Figure 8-4.
"1" = "vcc" # VCC1, side 1; Table 5-2 and Figure 5-2, SOIC top view
"2" = "sda1" # SDA1, serial data input/output, side 1; Table 5-2
"3" = "scl1" # SCL1, serial clock input, side 1; Table 5-2
"4" = "gnd" # GND1, ground, side 1; Table 5-2
"5" = "gnd2" # GND2, ground, side 2; Table 5-2
"6" = "scl2" # SCL2, serial clock output, side 2; Table 5-2
"7" = "sda2" # SDA2, serial data input/output, side 2; Table 5-2
"8" = "vcc2" # VCC2, side 2; Table 5-2

# NO supply_range ENVELOPES, ON PURPOSE (VCC1 and VCC2 are 3.0 to 5.5 V, abs max
# 6 V, Table 6.3): an envelope on an unresolved rail only adds an "operating
# envelope abstained" note, which on the c64 saver's fixed revision would break
# the defect-regression fixture's empty-findings claim until the MCP1703 feeding
# VDD2 is modelled. Re-add them then, with that fixture's expectation.

[models.coverage]
implements = ["isolated_i2c_identity", "dual_supply_isolation"]
missing = ["bidirectional_open_drain_logic", "side_specific_thresholds", "scl_propagation", "propagation_delay", "timing_races", "common_mode_transient_behavior", "thermal_shutdown"]

