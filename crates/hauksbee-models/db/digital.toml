validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.st.com/resource/en/datasheet/esdcan01-2bly.pdf"
title = "STMicroelectronics ESDCAN01-2BLY automotive dual-line Transil TVS for CAN bus, DocID026507 Rev 1 (June 2014)"
locator = "Figure 1 functional diagram; Table 1 absolute maximum ratings; Table 2 electrical characteristics"
sha256 = "12e23fd157ab2017fa27828e0170c20e608505ac9d3adca07fae5c17781a2d75"
[[models.source.uncertainty]]
