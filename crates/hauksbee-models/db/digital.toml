# ─────────────────────────────────────────────────────────────────────────────
# INA219: Texas Instruments zero-drift current/power monitor, I2C, 8-pin SOIC (D).
#
# Source: TI "INA219 Zero-Drift, Bidirectional Current/Power Monitor With I2C
#   Interface", SBOS448G, August 2008, revised December 2015 (sha256 below).
#   Section 6 Pin Configuration and Functions (D package, 8-pin SOIC top view),
#   Section 7.1 Absolute Maximum Ratings, Section 7.5 Electrical Characteristics,
#   Table 1 Address Pins and Slave Addresses, Table 2 Summary of Register Set,
#   Section 8.6.2.1 Configuration Register (reset 399Fh), Package Option Addendum.
#
# THE SOIC MAP, NOT THE SOT-23 ONE. The same sheet prints two pad maps: DCN
# (SOT-23) is 1 IN+, 2 IN-, 3 GND, 4 VS, 5 SCL, 6 SDA, 7 A0, 8 A1; D (SOIC) is
# 1 A1, 2 A0, 3 SDA, 4 SCL, 5 VS, 6 GND, 7 IN-, 8 IN+. The Luna draft
# (gpt-6-luna) used the SOT-23 map and no strap table for a SOIC board, so it was
# rejected and this card is hand-written; the match is the SOIC (D) orderable
# names only (INA219AID/AIDR/BID/BIDR, and the KiCad-style "INA219xIDR-SOIC"),
# so a DCN part cannot bind to this map.
#
# THE SHUNT IS EXTERNAL. IN+ and IN- only sense across a board resistor. Their
# common-mode limit is 26 V (Section 7.1), above the 6 V supply/SDA ceiling the
# `digital` max_voltage_v carries, which is not watched per pin.
#
# LOGIC LEVELS ARE EVALUATED AT VS = 3.3 V (the sheet's own nominal in Section
# 7.3). VIH is 0.7 x VS min and VIL is 0.3 x VS max (Section 7.5), supply-relative,
# and the schema has one number per field, so on a 5 V board both are low by 1.5x.
# VOL is absolute: 0.4 V max at 3 mA (SDA open drain, no VOH).
#
# ADDRESS: Table 1, the 16 combinations of A1/A0 on GND, VS, SDA or SCL (0x40 to
# 0x4F). Only the power-on reset value of the Configuration register (399Fh, sent
# MSB first, Section 8.5.5.2) is carried; the measurement registers are not.
[[models]]
id = "ina219_soic"
kind = "digital"
description = "TI INA219 current/power monitor, 8-pin SOIC (strapped I2C address, Configuration reset read, pad map, logic levels and supply draw)"

[models.match]
value_re = "(?i)^INA219[AB]?x?ID(R)?(-SOIC)?$"

[models.params]
# Section 7.5 Electrical Characteristics, evaluated at VS = 3.3 V.
vol   = 0.4      # logic 0 output level max, ISINK = 3 mA, SDA
vih   = 2.31     # 0.7 x VS min at VS = 3.3 V
vil   = 0.99     # 0.3 x VS max at VS = 3.3 V
supply_static_ua = 700.0   # quiescent current typ (1 mA max); power-down 6 uA typ
supply_pin = "5"           # VS
gnd_pin    = "6"           # GND
warning = "logic thresholds are evaluated at VS = 3.3 V (0.7 x VS / 0.3 x VS); on another supply rail they scale"
# Bus-clock limits, read by the co-simulation bus-speed check (hauksbee_ir::peripheral_limits).
i2c_max_hz = { max = 2560000.0, unit = "Hz", conditions = "I2C high-speed mode; fast mode is 0.4 MHz max, the minimum in both is 0.001 MHz", basis = "TI INA219 SBOS448G (Aug 2008, rev Dec 2015), section 7.6 Bus Timing Diagram Definitions, f(SCL) SCL operating frequency, high-speed mode max 2.56 MHz (p.6)" }

[models.pins]
# Section 6, D (SOIC) column of the Pin Functions table and the D top view.
"1" = "a1"      # address pin: GND, VS, SDA or SCL (Table 1)
"2" = "a0"      # address pin: GND, VS, SDA or SCL (Table 1)
"3" = "sda"     # serial data, open-drain I/O
"4" = "scl"     # serial clock input
"5" = "vdd"     # VS, power supply, 3 to 5.5 V
"6" = "gnd"
"7" = "in_n"    # IN-, load side of the external shunt
"8" = "in_p"    # IN+, supply side of the external shunt

[models.ratings]
# Section 7.1: VS 6 V; SDA GND - 0.3 to 6 V. See the note above on IN+/IN-.
max_voltage_v = 6.0

# NO supply_range ENVELOPE, ON PURPOSE. The sheet gives VS 3 to 5.5 V (Section
# 7.5), but an envelope on an unresolved rail only adds an "operating envelope
# abstained" note; on the c64 saver's fixed revision that note would break the
# defect-regression fixture's empty-findings claim until the MCP1703 feeding the
# rail is modelled. Add `[[models.envelope]] kind = "supply_range" pin = "vdd"
# min_v = 3.0 max_v = 5.5` then, and update that fixture's expectation with it.
[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "INA219 Configuration reset subset"
bus = "i2c"
i2c_address = 0x40

# Section 6, D (SOIC); the same pad map as [models.pins].
[sensor.pins]
1 = "a1"
2 = "a0"
3 = "sda"
4 = "scl"
5 = "vdd"
6 = "gnd"
7 = "in_n"
8 = "in_p"

# Table 1 Address Pins and Slave Addresses, rows in printed order.
[[sensor.address_select]]
address = 0x40
straps = { a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x41
straps = { a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x42
straps = { a1 = "low", a0 = "sda" }
[[sensor.address_select]]
address = 0x43
straps = { a1 = "low", a0 = "scl" }
[[sensor.address_select]]
address = 0x44
straps = { a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x45
straps = { a1 = "high", a0 = "high" }
[[sensor.address_select]]
address = 0x46
straps = { a1 = "high", a0 = "sda" }
[[sensor.address_select]]
address = 0x47
straps = { a1 = "high", a0 = "scl" }
[[sensor.address_select]]
address = 0x48
straps = { a1 = "sda", a0 = "low" }
[[sensor.address_select]]
address = 0x49
straps = { a1 = "sda", a0 = "high" }
[[sensor.address_select]]
address = 0x4A
straps = { a1 = "sda", a0 = "sda" }
[[sensor.address_select]]
address = 0x4B
straps = { a1 = "sda", a0 = "scl" }
[[sensor.address_select]]
address = 0x4C
straps = { a1 = "scl", a0 = "low" }
[[sensor.address_select]]
address = 0x4D
straps = { a1 = "scl", a0 = "high" }
[[sensor.address_select]]
address = 0x4E
straps = { a1 = "scl", a0 = "sda" }
[[sensor.address_select]]
address = 0x4F
straps = { a1 = "scl", a0 = "scl" }

# Table 2: Configuration register 00h power-on reset 399Fh, sent MSB first.
[[sensor.register]]
addr = 0x00
const = [0x39, 0x9F]

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 2.0    # Section 7.5, power-on reset threshold typ
idle_a = 0.0007               # Section 7.5, quiescent current typ
read_a = 0.0007
write_a = 0.0007
low_power_a = 0.000006        # Section 7.5, quiescent current, power-down mode typ

[models.coverage]
implements = ["pin_roles", "logic_levels", "active_supply_current", "absolute_ratings", "i2c_address_strap", "four_level_address_pins", "register_map_subset", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["supply_range_envelope", "shunt_and_bus_measurement","calibration_register", "power_current_registers", "conversion_ready_alert", "smbus_timeout", "sense_pin_ratings"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/ina219.pdf"
title = "Texas Instruments INA219 Zero-Drift, Bidirectional Current/Power Monitor With I2C Interface, SBOS448G, August 2008, revised December 2015"
locator = "Section 6 Pin Configuration and Functions (D package); Section 7.1; Section 7.5; Table 1 Address Pins and Slave Addresses; Table 2 Summary of Register Set"
sha256 = "58004eda854d07478e6fc6f4398c114f60a3bcf18d4877471c7c1a306d1fa1cb"
[[models.source.uncertainty]]
status = "unknown"
parameter = "model"
reason = "datasheet publishes no validated model error interval"
# ── ATA6561-GAQW-N high-speed CAN transceiver (SOIC8) ─────────────────────────
# Source: Microchip ATA6560/1 datasheet DS20005991A (2018), sha256
# c4039dda3b2a9a829f59bb004b994c5950f3cbde4c37406e6e4fa6a49361a026.
# Table 1-2 pin function table (ATA6561 SOIC8: 1 TXD, 2 GND, 3 VCC, 4 RXD, 5 VIO,
# 6 CANL, 7 CANH, 8 STBY); the Product Identification section lists ATA6561-GAQW-N
# as the 8-lead SOIC, tape and reel, non-AEC variant. Absolute Maximum Ratings:
# CANH/CANL -27 to +42 V, every other pin -0.3 to +5.5 V. Electrical
# Characteristics: VCC 4.5 to 5.5 V, VIO 2.8 to 5.5 V, IVCC recessive Normal mode
# 2 to 5 mA, dominant 50 mA typ (20 to 70), Standby 12 uA max, IIO recessive 80 uA
# typ, RXD output IOH -1 to -8 mA at VIO - 0.4 V.
# The Luna draft (gpt-6-luna, identity-only) was reviewed against the PDF: the pin
# map and the supply/VIO/abs-max rows were right, but it carried no executable
# behaviour, so this card follows sit1050t_can_transceiver: bus-idle (recessive)
# supply draw and an RXD that reads high. The 3.5 mA draw is the midpoint of the
# Normal-mode recessive 2 to 5 mA row (the sheet prints no typ); Standby (12 uA) and
# Silent (2.5 mA typ) modes are not modelled, so the draw is the Normal-mode figure.
[[models]]
id = "ata6561_gaqw_n_can_transceiver"
kind = "digital"
description = "ATA6561-GAQW-N CAN transceiver, SOIC8, bus idle (recessive): supply draw and RXD high"

[models.match]
value_re = "(?i)^ATA6561[-_ ]?GAQW([-_ ]?N)?$"

[models.params]
supply_current_a = 0.0035
supply_on_v = 4.5
vio_current_a = 0.00008
vio_on_v = 2.8
warning = "source-bound bus-idle, Normal-mode model: the recessive VCC supply current (2 to 5 mA, midpoint used), the 80 uA VIO current, the 4.5-5.5 V / 2.8-5.5 V supply limits and an RXD that reads high are executable; dominant transmission (50 mA typ), CANH/CANL bus levels, Standby and Silent modes, wake-up, undervoltage detection and the TXD dominant time-out are not modelled"

[models.pins]
"1" = "txd"
"2" = "gnd"
"3" = "vcc"
"4" = "rxd"
"5" = "vio"
"6" = "canl"
"7" = "canh"
"8" = "stby"

[models.ratings]
max_voltage_v = 5.5   # Absolute Maximum Ratings, DC voltage on all other pins (not CANH/CANL, which tolerate -27 to +42 V)
max_junction_temp_c = 150.0   # Absolute Maximum Ratings, virtual junction temperature
theta_ja_c_per_w = 145.0      # Thermal Resistance Virtual Junction to Ambient, SOIC8

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 4.5
max_v = 5.5
abs_max_v = 5.5
basis = "ATA6560/1 DS20005991A, Electrical Characteristics VVCC 4.5 V to 5.5 V; Absolute Maximum Ratings, DC voltage on all other pins -0.3 V to +5.5 V"

[[models.envelope]]
kind = "supply_range"
pin = "vio"
