# ── Toshiba TLP2761 executable DC transfer slice ─────────────────────────────
# The datasheet supplies enough information to model the isolator's relevant
# board-level DC transfer without pretending to reproduce sub-100 ns timing or
# isolation transients.  The current law models the LED, and the FSM drives the
# inverting totem-pole output at the conservative guaranteed threshold.
[[models]]
id = "tlp2761_dc_transfer"
kind = "digital"
description = "Toshiba TLP2761 inverting photo-IC coupler, SO6L (executable DC transfer)"

[models.source]
tier = "curated-library"
validation = "datasheet-curves"
[[models.source.references]]
url = "https://toshiba.semicon-storage.com/info/TLP2761_datasheet_en_20260511.pdf"
title = "Toshiba TLP2761 photocoupler data sheet Rev. 10.0"
locator = "Pin assignment, truth table, electrical characteristics and switching characteristics"
[[models.source.uncertainty]]
status = "interval"
parameter = "input_forward_voltage_at_2ma"
low = 1.35
high = 1.65
unit = "V"
kind = "specification-limits"
basis = "TLP2761 electrical characteristics, IF=2mA at 25C"
[[models.source.uncertainty]]
status = "interval"
parameter = "threshold_input_current"
low = 0.0
high = 0.0016
unit = "A"
kind = "specification-limits"
basis = "IFHL maximum over -40C to 125C; the model uses the conservative upper endpoint"

[models.match]
value_re = "(?i)^TLP2761$"

[models.params]
led_knee_v = 1.35
led_r_ohms = 75.0
if_threshold_a = 0.0016
supply_current_a = 0.00065
warning = "source-bound DC approximation: input LED and conservative threshold transfer are executable; propagation timing, temperature curve, CMTI pulse behavior and isolation capacitance are not modeled"

[models.pins]
"1" = "anode"
"2" = "nc"
"3" = "cathode"
"4" = "gnd"
"5" = "y1"
"6" = "vcc"

[models.ratings]
max_voltage_v = 6.0   # Section 8 Absolute Maximum Ratings, supply voltage VCC -0.5 to 6 V
max_pin_current_a = 0.02

# The 2.7-5.5 V operating range is the check that fires below the 6.0 V abs max.
[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.7
max_v = 5.5
abs_max_v = 6.0
basis = "Toshiba TLP2761 datasheet 2026-05-11, Section 9 Recommended Operating Conditions, supply voltage VCC 2.7 V to 5.5 V; Section 8 Absolute Maximum Ratings, VCC -0.5 V to 6 V"

[models.behavioral.fsm]
states = ["input_off", "input_on"]
initial = "input_off"

[[models.behavioral.fsm.transitions]]
from = "input_off"
to = "input_on"
guard = "max(0.0, (v_anode - v_cathode - led_knee_v) / led_r_ohms) >= if_threshold_a"

[[models.behavioral.fsm.transitions]]
from = "input_on"
to = "input_off"
guard = "max(0.0, (v_anode - v_cathode - led_knee_v) / led_r_ohms) < if_threshold_a"

[[models.behavioral.laws]]
name = "input_led"
kind = "current"
a = "anode"
b = "cathode"
expr = "max(0.0, (v_anode - v_cathode - led_knee_v) / led_r_ohms)"

[[models.behavioral.laws]]
name = "supply_draw"
kind = "current"
a = "vcc"
b = "gnd"
expr = "supply_current_a"

[[models.behavioral.laws]]
name = "output_high"
kind = "voltage"
a = "y1"
b = "gnd"
expr = "v_vcc"
r_ohms = 312.5
only_in_state = "input_off"

[[models.behavioral.laws]]
name = "output_low"
kind = "voltage"
a = "y1"
b = "gnd"
expr = "0.0"
r_ohms = 125.0
only_in_state = "input_on"

[models.coverage]
implements = ["input_led_dc", "threshold_transfer", "inverting_output", "totem_pole_output", "supply_current"]
missing = ["propagation_timing", "temperature_curve", "cmti_waveform", "isolation_capacitance", "led_reverse_breakdown"]

# ─────────────────────────────────────────────────────────────────────────────

# SN74AHCT14: drafted by `hauksbee models extract` from the TI datasheet, then
# reviewed by hand against it (the first draft had no logic block and did nothing).
# Source: Texas Instruments SN74AHCT14 datasheet SCLS246,
#   https://www.ti.com/lit/ds/symlink/sn74ahct14.pdf (Tables 6.5 and 6.6).
[[models]]
id = "sn74ahct14"
kind = "digital"
description = "SN74AHCT14 hex Schmitt-trigger inverter with the common 14-pin commercial-package pinout; models conservative 4.5-V static thresholds, loaded output levels, and six independent inverters with state-retaining hysteresis; does not model supply- and load-dependent thresholds or delay, channel-to-channel variation, transition waveforms, input clamp behavior, dynamic noise, or power consumption"

[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"
[[models.source.uncertainty]]
status = "unknown"
parameter = "model"
reason = "datasheet publishes no validated model error interval"
[[models.source.pinout]]
package = "14-pin SOIC, SSOP, TVSOP, PDIP, SOP, TSSOP (D, DB, DGV, N, NS, PW)"
pins = { "1" = "1A", "2" = "1Y", "3" = "2A", "4" = "2Y", "5" = "3A", "6" = "3Y", "7" = "GND", "8" = "4Y", "9" = "4A", "10" = "5Y", "11" = "5A", "12" = "6Y", "13" = "6A", "14" = "VCC" }

[[models.source.uncertainty]]
status = "interval"
parameter = "vih"
low = 0.9
high = 1.9
unit = "V"
kind = "specification-limits"
basis = "Table 6.5 Electrical Characteristics, SN74AHCT14 VT+ limits at VCC = 4.5 V over the operating free-air temperature range"

[[models.source.uncertainty]]
status = "interval"
parameter = "vil"
low = 0.5
high = 1.5
unit = "V"
kind = "specification-limits"
basis = "Table 6.5 Electrical Characteristics, SN74AHCT14 VT- limits at VCC = 4.5 V over the operating free-air temperature range"

[[models.source.uncertainty]]
status = "interval"
parameter = "tpd_s"
low = 1.0e-9
high = 8.0e-9
unit = "s"
kind = "specification-limits"
basis = "Table 6.6 Switching Characteristics, SN74AHCT14 tPLH and tPHL limits from A to Y with CL = 15 pF over the operating free-air temperature range"

[[models.source.uncertainty]]
status = "unknown"
parameter = "voh"
reason = "datasheet publishes a finite minimum but no finite maximum VOH specification at the modeled load"

[[models.source.uncertainty]]
status = "unknown"
parameter = "vol"
reason = "datasheet publishes a finite maximum but no finite minimum VOL specification at the modeled load"

[models.match]
value_re = "(?i)^SN74AHCT14"

[models.params]
voh = 4.4 # Source: Table 6.5 Electrical Characteristics, SN74AHCT14 min, VCC = 4.5 V, IOH = -50 uA (the light-load level)
vol = 0.1 # Source: Table 6.5 Electrical Characteristics, SN74AHCT14 max, VCC = 4.5 V, IOL = 50 uA (the light-load level)
# Table 6.5 at VCC = 4.5 V, -40 to 125 C column: VOH 3.8 V min at IOH = -8 mA,
# VOL 0.44 V max at IOL = 8 mA. (4.4 - 3.8) / 8 mA = 75 ohm high side,
# (0.44 - 0.1) / 8 mA = 42.5 ohm low side; the weaker side drives both.
ro = 75.0
