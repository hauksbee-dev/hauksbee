# ─────────────────────────────────────────────────────────────────────────────
# BMP280: Bosch Sensortec digital pressure sensor, LGA-8 2.0 x 2.5 mm.
#
# Source: Bosch Sensortec "BMP280 Data sheet", document BST-BMP280-DS001-26,
#   revision 1.26, October 2021. Table 2 Parameter specification, Table 3
#   Absolute maximum ratings, Table 12 Current consumption, Section 4.3.1
#   Register 0xD0 "id", Section 5.1 Interface selection, Section 5.2 I2C
#   Interface, Table 26 interface parameters, Table 29 Pin description.
#
# SAME DIE FAMILY AND PAD ORDER AS THE BME280 ABOVE (no humidity channel, and a
# different chip_id), with the same caveat on direction: Figure 14 numbers the
# pads clockwise in top view. Levels are fractions of VDDIO, evaluated here at
# 3.3 V (the BME280 entry evaluates at the 1.8 V typical; this one at the rail
# the boards it was written for use).
#
# SUPPLY DRAW: Table 12 gives currents normalised to one measurement per second;
# the ultra-high-resolution row, 24.8 uA typ at 1 Hz forced mode, is the highest
# of them and is carried here. The current during a conversion is far higher
# (Table 2 Ipeak 720 uA typ, 1120 uA max), and a fast normal-mode ODR approaches
# that; which applies is firmware this entry does not know.
[[models]]
id = "bmp280"
kind = "digital"
description = "Bosch BMP280 pressure sensor, LGA-8 (strap-selected I2C chip_id subset, pad map, logic levels and supply draw)"

[models.match]
# The bare part number (cover page; the ordering code is 0.273.300.436-1NV, a
# Bosch number, not a value spelling). BME280/BMP180/BMP388 are excluded.
value_re = "(?i)^BMP280$"

[models.params]
# Table 26 (p.31), every level a fraction of VDDIO. VIH/VIL are evaluated at
# VDDIO = 3.3 V. VOH/VOL are printed at a test current (ioh = 1 mA, iol = 3 mA), a
# loaded level, so they are rows at the supply their row prints (VDDIO = 1.62 V):
# the loader turns them into the unloaded level (the rail, ASSUMED: the sheet
# prints no light-load row) behind an output resistance.
voh   = { min = 1.296, unit = "V", conditions = "VDDIO = 1.62 V, IOH = 1 mA (SDO, SDI); 0.8 x VDDIO", basis = "Table 26 p.31, Voh, 0.8 x VDDIO min (0.8 x 1.62 V); the 1.2 V row relaxes to 0.6 x VDDIO" }
vol   = { max = 0.324, unit = "V", conditions = "VDDIO = 1.62 V, IOL = 3 mA (I2C, Vol_SDI); 0.2 x VDDIO", basis = "Table 26 p.31, Vol_SDI, 0.2 x VDDIO max (0.2 x 1.62 V); the 1.2 V row relaxes to 0.23 x VDDIO" }
vih   = 2.64     # Vih_si 0.8 x VDDIO min, VDDIO = 1.2 to 3.6 V
vil   = 0.66     # Vil_si 0.2 x VDDIO max, VDDIO = 1.2 to 3.6 V
supply_static_ua = 24.8    # Table 12, ultra high resolution, 1 Hz forced mode, typ
supply_pin = "8"           # VDD
gnd_pin    = "1"           # GND

[models.pins]
# Table 29 Pin description, all 8 pads. SDI/SCK use the bus vocabulary.
"1" = "gnd"
"2" = "csb"      # chip select; VDDIO selects I2C (Section 5.1)
"3" = "sda"      # SDI: I2C SDA / SPI SDI
"4" = "scl"      # SCK: I2C SCL / SPI SCK
"5" = "sdo"      # SPI data out; in I2C the address LSB (Section 5.2)
"6" = "vddio"    # digital interface supply, 1.2 to 3.6 V
"7" = "gnd2"
"8" = "vdd"      # analog supply, 1.71 to 3.6 V

[models.ratings]
# Table 3: VDD and VDDIO -0.3 to 4.25 V; interface pins -0.3 V to VDDIO + 0.3 V.
max_voltage_v = 4.25

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.71
max_v = 3.6
basis = "Bosch BST-BMP280-DS001-26, Table 2, Sensor supply voltage VDD row"

[[models.envelope]]
kind = "supply_range"
pin = "vddio"
min_v = 1.2
max_v = 3.6
basis = "Bosch BST-BMP280-DS001-26, Table 2, Interface supply voltage VDDIO row"

# Section 5.1: "If CSB is connected to VDDIO, the I2C interface is active."
# Section 5.2: SDO to GND gives 0x76, SDO to VDDIO gives 0x77; "The SDO pin
# cannot be left floating".
[models.peripheral]
kind = "register_map"
required_high_roles = ["csb"]
address_select_role = "sdo"
address_when_low = 0x76
address_when_high = 0x77
spec_toml = '''
[sensor]
name = "BMP280 chip-id subset"
bus = "i2c"
i2c_address = 0x76

# Section 4.3.1 / Table 18: register 0xD0 "id", chip_id = 0x58, readable as soon
# as the power-on reset has finished.
[[sensor.register]]
addr = 0xD0
const = [0x58]

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.71   # Table 2, VDD min
idle_a = 0.0000248            # Table 12, ultra high resolution at 1 Hz, typ
read_a = 0.0000248
write_a = 0.0000248
low_power_a = 0.0000001       # Table 2, sleep current IDDSL typ, 25 C

[models.coverage]
implements = ["pin_roles", "logic_levels_at_3v3_vddio", "duty_cycled_supply_current", "absolute_ratings", "supply_ranges", "i2c_bus_mode_strap", "i2c_address_strap", "register_map_subset", "chip_id_read", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["full_register_map", "spi_register_map", "calibration_coefficients", "pressure_data", "temperature_data", "power_mode_state", "conversion_peak_current", "supply_domain_current_split"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.bosch-sensortec.com/media/boschsensortec/downloads/datasheets/bst-bmp280-ds001.pdf"
title = "Bosch Sensortec BMP280 Data sheet, BST-BMP280-DS001-26, revision 1.26, October 2021"
locator = "Table 2; Table 3; Table 12; Section 4.3.1 Register 0xD0 id; Sections 5.1 and 5.2; Table 26; Table 29 Pin description"
sha256 = "473ff27d9df698b4757e36b36209f83b9f637b592c999d5fabe2a9453a488da6"

# ─────────────────────────────────────────────────────────────────────────────
# LIS3DH: STMicroelectronics 3-axis accelerometer, LGA-16 3 x 3 x 1 mm.
#
# Source: STMicroelectronics "LIS3DH MEMS digital output motion sensor ultra
#   low-power high performance 3-axes nano accelerometer", Doc ID 17530 Rev 1,
#   May 2010. Table 1 Device summary, Table 2 Pin description, Table 5
#   Electrical characteristics, Table 8 Absolute maximum ratings, Section 6.1.1
#   I2C operation, Section 8.6 WHO_AM_I (0Fh) / Table 21. ST's own host refused
#   every request from here, so the copy read is Rev 1 as mirrored at
#   cdn-shop.adafruit.com/datasheets/LIS3DH.pdf; later revisions were not seen.
#
# Levels are fractions of Vdd_IO (Table 5), evaluated here at 3.3 V. Supply draw
# is the normal-mode 50 Hz figure, 11 uA typ, the highest current Table 5
# tabulates (the part runs up to 5 kHz ODR, for which no current is printed).
[[models]]
id = "lis3dh"
kind = "digital"
description = "ST LIS3DH 3-axis accelerometer, LGA-16 (strap-selected I2C WHO_AM_I subset, pad map, logic levels and supply draw)"

[models.match]
# Table 1 Device summary order codes: LIS3DH (tray) and LIS3DHTR (tape and
# reel). LIS3DSH / LIS2DH12 / LIS331 are different parts and are excluded.
value_re = "(?i)^LIS3DH(TR)?$"

[models.params]
# Table 5, fractions of Vdd_IO evaluated at Vdd_IO = 3.3 V.
voh   = 2.97     # VOH 0.9 x Vdd_IO min
vol   = 0.33     # VOL 0.1 x Vdd_IO max
vih   = 2.64     # VIH 0.8 x Vdd_IO min
vil   = 0.66     # VIL 0.2 x Vdd_IO max
supply_static_ua = 11.0    # Table 5 Idd typ, normal mode, 50 Hz ODR
supply_pin = "14"          # Vdd
gnd_pin    = "5"           # GND

[models.pins]
# Table 2 Pin description, all 16 pads. SCL/SPC and SDA/SDI/SDO use the bus
# vocabulary.
"1"  = "vddio"   # Vdd_IO, I/O supply, 1.71 V to Vdd + 0.1 V
"2"  = "nc"      # not connected
"3"  = "nc2"     # not connected
"4"  = "scl"     # I2C SCL / SPI SPC
"5"  = "gnd"
"6"  = "sda"     # I2C SDA / SPI SDI / 3-wire SDO
"7"  = "sdo"     # SPI SDO; in I2C the address LSB SA0 (Section 6.1.1)
"8"  = "cs"      # I2C/SPI mode selection (1: I2C, 0: SPI enabled)
"9"  = "int2"    # inertial interrupt 2
"10" = "res"     # reserved: connect to GND
"11" = "int1"    # inertial interrupt 1
"12" = "gnd2"
"13" = "adc3"    # auxiliary ADC input 3
"14" = "vdd"     # supply, 1.71 to 3.6 V
"15" = "adc2"    # auxiliary ADC input 2
"16" = "adc1"    # auxiliary ADC input 1

[models.ratings]
# Table 8: Vdd and Vdd_IO -0.3 to 4.8 V; control pins -0.3 V to Vdd_IO + 0.3 V.
max_voltage_v = 4.8

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 1.71
max_v = 3.6
basis = "ST LIS3DH Doc ID 17530 Rev 1, Table 5, Vdd supply voltage row"

# Table 2: CS "1: I2C mode". Section 6.1.1: SAD is 001100xb; SA0 to supply gives
# 0011001b (0x19), SA0 to ground 0011000b (0x18).
[models.peripheral]
kind = "register_map"
required_high_roles = ["cs"]
address_select_role = "sdo"
address_when_low = 0x18
address_when_high = 0x19
spec_toml = '''
[sensor]
name = "LIS3DH who_am_i subset"
bus = "i2c"
i2c_address = 0x18

# Section 8.6 / Table 21: WHO_AM_I (0Fh) = 0011 0011b.
[[sensor.register]]
addr = 0x0F
const = [0x33]

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vdd"
return_role = "gnd"
power_on_threshold_v = 1.71   # Table 5, Vdd min
idle_a = 0.000011             # Table 5, normal mode 50 Hz typ
read_a = 0.000011
write_a = 0.000011
low_power_a = 0.0000005       # Table 5, IddPdn power-down typ

[models.coverage]
implements = ["pin_roles", "logic_levels_at_3v3_vddio", "normal_mode_supply_current", "absolute_ratings", "supply_ranges", "i2c_bus_mode_strap", "i2c_address_strap", "register_map_subset", "who_am_i_read", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["full_register_map", "spi_register_map", "acceleration_data", "auxiliary_adc", "temperature_sensor", "power_mode_state", "fifo", "interrupt_engine", "high_odr_supply_current", "supply_domain_current_split"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
