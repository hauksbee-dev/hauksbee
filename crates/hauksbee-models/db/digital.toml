# ═════════════════════════════════════════════════════════════════════════════

# ═════════════════════════════════════════════════════════════════════════════
# ADDRESSABLE RGB LEDs: BOUND AS SUPPLY LOADS, DATA PATH NOT MODELLED.
#
# The corpus carries about 250 integrated-controller RGB LEDs: YS-SK6812MINI-E
# (92 on the Corne keyboards), SK6805-EC15 (85 on MNT Reform), YS-SK6812MINI on
# an SK6812MINI-E footprint (58 on Lily58 Pro V2), WS2812B (8 on the LumenPnP
# ring light), WS2812-2020 (13 on the SparkFun Thing Plus RP2040). Left open
# they drew nothing, so a board with dozens of pixels could brown out its rail
# while every rail and power check read no load: a false-safe. The three cards
# below close that for the parts whose sheets were read for this; the others
# stay unresolved (see the end of this block).
#
# WHAT IS MODELLED: the supply. Each pixel is a `profiled_loads` sink from VDD to
# GND at the published static current, so DC solves, runs and rail assertions
# carry it. What the pixel draws once lit depends on the 24-bit word it latched,
# which the board cannot show and no sheet relates to an average current, so
# the card ALSO states `unknown_state_max_a`, all three channels full on plus
# the static current. The DC stress pass judges every such load there as its own
# state, and a rating exceeded only there is reported CONDITIONAL (medium), the
# same footing a class-only part's assumed corner gets: quiescent alone would be
# a false-safe, full white as the nominal would fail every keyboard whose
# firmware caps brightness. A hauksbee-ci run keeps the quiescent draw; a
# scenario that knows the firmware's colours attaches a load profile instead.
#
# WHAT IS NOT: the data path, for two documentary reasons.
#   - DOUT IS NOT DIN DELAYED. It is DIN with this pixel's own 24 bits stripped
#     off the front (each sheet's "data transmission method" figure: D1 sees
#     first/second/third 24 bit, D2 only second/third, D3 only third). No
#     [models.logic] relation can express that, and `dout = din` would be a
#     falsehood that lints clean. DOUT is therefore left undriven, and a
#     downstream pixel's DIN reads whatever else is on its net.
#   - NO SHEET PUBLISHES VOH/VOL for DOUT. The plain SK6812MINI prints DOUT drive
#     currents (IDOH 49 mA typ, IDOL -50 mA typ), which are currents, not levels.
# DIN is a high-impedance input: input current ±1 µA max (WS2812B p.3, WS2812B
# V5 p.2), so stamping nothing on it IS its DC load. Its thresholds are
# published but deliberately not carried yet (they disagree within the family:
# 0.7 x VDD on the SK6812MINI-E and the undated WS2812B, 2.7 V min on the
# WS2812B V5, absolute 3.4 V min on the plain SK6812MINI at VDD = 5 V), so no
# level check runs on DIN. Each card's `warning` says all of this on every
# surface, and its coverage lists what is missing.
#
# THE PINOUTS ARE NOT INTERCHANGEABLE ACROSS THIS FAMILY, which is a real trap:
#   WS2812B (5050):            1=VDD 2=DOUT 3=VSS 4=DIN
#   SK6812MINI-E (3528-shaped): 1=VDD 2=DOUT 3=GND 4=DIN
#   plain SK6812MINI (5050-shaped, Rev. 01, an older, physically different part
#   despite the name): 1=DOUT 2=VSS 3=DIN 4=VDD, rotated relative to the -E.
#   SK6805-EC15 (not carded here): 1=DIN 2=VDD 3=DOUT 4=GND.
# So the two SK6812MINI cards match on the FOOTPRINT as well as the value: Lily58
# Pro V2 values its parts "YS-SK6812MINI" on a `yuchi_kbd:SK6812MINI-E` land,
# and binding the plain map there would swap supply and data.
#
# THE INPUT THRESHOLDS ALSO DISAGREE WITHIN THE FAMILY (not carried yet, so DIN
# is unchecked): SK6812MINI-E and SK6805-EC15 give VIH 0.7 x VDD / VIL 0.3 x VDD;
# WS2812B-V5/W gives VIH 0.63 x VDD min and VIL 0.7 V max; the plain SK6812MINI
# gives absolute volts, VIH 3.4 V min / VIL 1.6 V max at VDD = 5 V.
#
# STILL UNRESOLVED: SK6805-EC15 and WS2812-2020 (every 2020-package datasheet
# mirror 403'd, sat behind a form or served HTML; its pin map was never sourced),
# and the 3535/1515 packages on the Adafruit Eagle boards.

[[models]]
id = "ws2812b"
kind = "digital"
description = "Worldsemi WS2812B addressable RGB LED, 5050: VDD supply load (static + full-on corner); data path not modelled"

[models.match]
# The 5050 part only: WS2812B-2020, -3535 and -1515 are other packages and maps.
value_re = "(?i)^WS2812B(-?V5)?$"
