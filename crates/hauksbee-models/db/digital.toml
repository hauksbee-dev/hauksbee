"2" = "int"      # interrupt, open drain, active low
"3" = "ldr"      # LED driver input (constant-current sink for the IR LED)
"4" = "ledk"     # LED cathode; tie to LDR when using the internal driver
"5" = "leda"     # LED anode; to VLEDA, 3.0 to 4.5 V
"6" = "gnd"
"7" = "scl"      # I2C serial clock
"8" = "vdd"      # supply, 2.4 to 3.6 V

[models.ratings]
