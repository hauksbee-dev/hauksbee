# Levels: Recommended Operating Conditions (page 4) VIH min 2 V, VIL max 0.8 V at
# VCC = 4.5 to 5.5 V; Electrical Characteristics (page 5) VOH min 4.4 V at
# IOH = -20 uA and VOL max 0.1 V at IOL = 20 uA, VCC = 4.5 V; ICC typ 2 uA at
# 5.5 V; Switching Characteristics tpd typ 11 ns at 4.5 V, CL = 50 pF; Cpd 20 pF; Absolute Maximum
