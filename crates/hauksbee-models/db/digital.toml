# ── Single-gate 5-lead logic added 2026-10-01 ─────────────────────────────────
# 74LVC1G04/08/14/17, 74AHC1G04/08 and 74AUP1G04. Every card is the FIVE-LEAD
# map only: TSSOP5 / SC-74A / SOT-23-5 / SC70-5 / SOT-5X3 / X2SON5 (Nexperia GW,
# GV, GX; TI DBV, DCK, DRL). The six-pad XSON/SON parts (Nexperia GM/GN/GS, TI
# DRY/DSF) move VCC to pad 6 and add a second NC, and the DSBGA balls are
# numbered differently; none of them is matched, so such an order code resolves
# to nothing rather than to a wrong map. The bare "74LVC1G04D"-style library
# names seen on boards are accepted, as the 74LVC1G125 card does.
#
# Inverters, buffers and the 74LVC1G14/17 Schmitt parts have no B input: pad 1
# is NC (a pad the datasheet marks "no internal connection"). The two-input AND
# gates use pad 1 = A, pad 2 = B as TI prints them. Nexperia's 74LVC1G08 and
# 74AHC1G08 tables print pad 1 = B and pad 2 = A; the two names are swapped but
# the function is a symmetric two-input AND, so the swap changes nothing.

