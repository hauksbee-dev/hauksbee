# ── ISO1541D (TI isolated I2C, 8-pin SOIC; identity-only) ─────────────────────
# Source: TI ISO1540/ISO1541 datasheet (see the sha256 reference below). Drafted by
# `hauksbee models extract` (gpt-6-luna) and reviewed against the PDF: the pin map
# (1 VCC1, 2 SDA1, 3 SCL1, 4 GND1, 5 GND2, 6 SCL2, 7 SDA2, 8 VCC2) matches
# Table 5-2 and the SOIC top view. Identity-only because the digital schema cannot
# express a bidirectional open-drain SDA with side-specific, supply-relative
# thresholds without inventing logic, so the part stays UNRESOLVED by design.
[[models]]
id = "iso1541d"
kind = "digital"
description = "ISO1541D 8-pin SOIC isolated I2C interface; identity-only because its bidirectional open-drain SDA behavior, unidirectional SCL channel, and unequal side thresholds cannot be represented by this digital logic contract; propagation delay, timing races, analog isolation behavior, and thermal shutdown are not modeled. ABSTAIN: no single set of digital thresholds and output equations captures the two sides."

[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"

[[models.source.uncertainty]]
status = "unknown"
parameter = "model"
reason = "datasheet publishes no validated model error interval"

[[models.source.uncertainty]]
status = "unknown"
parameter = "digital_behavior"
reason = "ABSTAIN: the digital schema does not represent bidirectional isolated SDA behavior with side-specific thresholds and unidirectional SCL1-to-SCL2 behavior."

[[models.source.uncertainty]]
status = "unknown"
parameter = "VIH1"
reason = "Table 6.3 gives only supply-relative limits: min 0.7 × VCC1 and max VCC1; no standalone voltage is stated."

[[models.source.uncertainty]]
