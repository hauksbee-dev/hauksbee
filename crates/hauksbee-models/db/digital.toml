supply_pin = "16"
gnd_pin    = "1"
identity_only = true
warning = "CH340C identity, SOP-16 pin map, 3.3/5 V logic levels, supply range and ratings are sourced; the USB device and UART are not modeled (TXD, RTS#, DTR# and OUT# are undriven), so the part stays OPEN"
unlocked_by = "a USB-to-UART bridge model that drives TXD and the MODEM outputs from host traffic"

