[[models]]
id = "74hc27"
kind = "digital"
description = "74HC27 triple 3-input NOR gate"

[models.match]
value_re = "(?i)^(SN)?74HC27"

[models.params]
voh       = 4.4
vol       = 0.1
vih       = 3.15
vil       = 1.35
tpd_s     = 8.0e-9
# Supply draw: ICC = 20 uA max per package at 25 C (74HC SSI standard);
# 10 uA stamped (~3.3 uA/gate). Cpd 20 pF per gate, 74HC-family typical
# (the '00's cited 20 pF extended to the triple NOR; ASSUMED for the '27).
supply_static_ua = 10.0
supply_cpd_pf    = 20.0
supply_pin = "14"
gnd_pin    = "7"

[models.pins]
"1"  = "a1"
"2"  = "b1"
"3"  = "a2"
"4"  = "b2"
"5"  = "c2"
"6"  = "y2"
"7"  = "gnd"
"8"  = "y3"
"9"  = "a3"
"10" = "b3"
"11" = "c3"
"12" = "c1"
"13" = "y1"
"14" = "vcc"

[models.ratings]
max_pin_current_a = 0.025
max_voltage_v = 7.0

[models.logic]
# Behaviour source: TI SN74HC27 datasheet (SCLS089), function table: each
# Y = NOR(A, B, C), any input HIGH pulls the output LOW. (Before the
# declarative migration this part fell back to the generic a*->y* buffer,
# which mirrored only the A input, a real misbehaviour this block fixes.)
inputs  = ["a1", "b1", "c1", "a2", "b2", "c2", "a3", "b3", "c3"]
outputs = ["y1", "y2", "y3"]

[models.logic.comb]
"y1" = "!(a1 | b1 | c1)"
"y2" = "!(a2 | b2 | c2)"
"y3" = "!(a3 | b3 | c3)"

