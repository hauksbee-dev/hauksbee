# Microchip AT24C64D 64-Kbit (8192 x 8) I2C EEPROM: executable primary array.
#
# Source: Microchip "AT24C64D 64-Kbit Serial EEPROM I2C-Compatible (Two-Wire)"
#   data sheet DS20005937D, Revision D (November 2023),
#   product page https://www.microchip.com/en-us/product/AT24C64D (the PDF
#   URL was not fetched here); local copy read is sha256 fc63b777b4e429a1bc77d685ad74d6b16bbba5217d18c83e654f7eef2ec6f7df.
#   1 Package Types p.4 and Table 2-1 Pin Function Table p.5; 4.1 Absolute
#   Maximum Ratings, Table 4-1 DC and AC Operating Range and Table 4-2 DC
#   Characteristics p.9; Table 4-3 AC (tWR 5 ms max) p.10; 5.1 power-up (VPOR
#   1.5 V max) p.11; 6 Device Operation (256 pages x 32 bytes, device type
#   1010 A2 A1 A0 R/W, two word-address bytes carrying a 13-bit address)
#   p.15-16; Product Identification System / ordering examples p.37.
#
# PINS. Table 2-1: SOIC, TSSOP, UDFN and VFBGA all use one map (A0 1, A1 2,
# A2 3, GND 4, SDA 5, SCL 6, WP 7, VCC 8), so the bare part number is safe for
# every orderable package. Checked on the trigger-output-fmc board: U9
# (Package_SO:SOIC-8_3.9x4.9mm, MPN AT24C64D-SSHM-T) pins 1-8 land on A0, A1,
# A2, GND, /FMC/EEPROM_SDA, /FMC/EEPROM_SCL, WP jumper net and 3P3VAUX.
#
# ADDRESS. The peripheral carries a fixed 7-bit address 0x50 (A2:A0 = 000, the
# internal pull-down state of floating pins, Table 2-1 note 2). The
# `i2c_eeprom` peripheral has no strap input, so a board that straps A0..A2 is
# simulated at 0x50 anyway. The trigger-output-fmc board does exactly that:
# A2 is pulled to 3P3VAUX and A0/A1 come from the FMC GA1/GA0 pins through
# 4.75 k, so the real part sits at 0x54..0x57, not 0x50 (see the warning).
#
# SUPPLY CURRENTS ARE Table 4-2 MAXIMA AT VCC = 5.0 V (the sheet gives no
# typicals): ICC1 1.0 mA read at 400 kHz, ICC2 3.0 mA write at 400 kHz, ISB1
# 6.0 uA standby (1.0 uA at 1.7 V). They overstate a 3.3 V board's draw.
# The power-on threshold is the 1.7 V VCC minimum (VPOR is 1.5 V max).
#
# DELIBERATELY NOT MODELLED: A0..A2 strap decoding, WP enforcement, the 5 ms
# max tWR write cycle and ACK polling, 1 MHz FM+ needing VCC >= 2.5 V.
[[models]]
id = "at24c64d_8pin"
kind = "digital"
description = "Microchip AT24C64D 64-Kbit I2C EEPROM, 8-pin SOIC/TSSOP/UDFN/VFBGA (executable primary array)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.microchip.com/en-us/product/AT24C64D"
title = "Microchip AT24C64D 64-Kbit Serial EEPROM I2C-Compatible (Two-Wire), DS20005937D, Revision D, November 2023"
locator = "Package Types p.4; Table 2-1 p.5; 4.1 Absolute Maximum Ratings, Table 4-1 and Table 4-2 p.9; Table 4-3 p.10; 6 Device Operation p.15-16; Product Identification System"
sha256 = "fc63b777b4e429a1bc77d685ad74d6b16bbba5217d18c83e654f7eef2ec6f7df"

[models.match]
# Ordering: AT24C64D-<pkg><grade>-<carrier>; SSHM = SOIC, XHM = TSSOP,
# MAHM = UDFN, CUM = VFBGA; -T/-B/-E carrier. All share Table 2-1's pin map.
# Excludes AT24C64 (no D), AT24C64C, AT24CS64 and other densities.
value_re = "(?i)^AT24C64D(-(SSHM|XHM|MAHM|CUM)(-[TBE])?)?$"
mpn_re = "(?i)^AT24C64D(-(SSHM|XHM|MAHM|CUM)(-[TBE])?)?$"

