# ─────────────────────────────────────────────────────────────────────────────
# TPS629203: TI 300 mA, 3 to 17 V buck converter with DCS-Control, DRL (SOT-5X3, 8 pins). Source: TI SLVSGE2 (March 2022), sha256
# 6259170f807fe9c84a89eed09ac613757b27a574d1daf708fa2e36d070dae7f7 (byte-identical to the ti.com symlink). Table 6-1 pins p.3 (1 FB/VSET,
# 2 PG, 3 VOS, 4 SW, 5 GND, 6 VIN, 7 EN, 8 MODE/S-CONF), 6.1 Absolute Maximum Ratings p.4, 6.3 Recommended Operating Conditions p.4 (VIN 3 to
# 17 V, VOUT 0.4 to 5.5 V, 0.3 A), 6.4 thermal p.4 (120 C/W JEDEC), 6.5 IQ p.5 (4 uA typ, not switching).
# ONE ORDERABLE, TWO WAYS TO SET THE OUTPUT. The MODE/S-CONF pin resistor selects either an external FB divider (reference 0.6 V,
# Table 8-1 rows 1 to 8) or an internal divider programmed by a resistor on VSET (Table 8-2, rows 9 to 16 of Table 8-1), read once at EN. The
