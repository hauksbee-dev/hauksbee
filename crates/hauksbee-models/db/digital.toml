#   column D, DGV, PW, RGY (1 VCCA, 2 1DIR, 3 2DIR, 4-7 1A1 1A2 2A1 2A2,
#   8-9 GND, 10-13 2B2 2B1 1B2 1B1, 14 2OE, 15 1OE, 16 VCCB). Absolute maximum
#   supply -0.5 to 4.6 V and continuous output current +/-50 mA: 5.1 (p.6).
#   VCCA/VCCB 1.2 to 3.6 V and the VIH/VIL bands of data and DIR inputs: 5.3
#   Recommended Operating Conditions (p.7). VOH/VOL: 5.5 Electrical
#   Characteristics (p.9). Function: Table 7-1 (p.16, each 2-bit section): OE
#   low, DIR low, A port enabled, B data to A; OE low, DIR high, B port
#   enabled, A data to B; OE high, both ports Hi-Z. The control pins (1DIR,
#   2DIR, 1OE, 2OE) are referenced to VCCA: 7.1 Overview (p.15) and Table 4-1.
