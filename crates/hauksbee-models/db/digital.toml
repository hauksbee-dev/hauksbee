[[models]]
id = "74hc125"
kind = "digital"
description = "74HC125 quad 3-state buffer"

[models.match]
value_re = "(?i)^74HC125|^SN74HC125"

[models.params]
# Source: Texas Instruments 74HC125 datasheet (SCLS049), Table 6.5
voh       = 4.4
vol       = 0.1
vih       = 3.15
vil       = 1.35
tpd_s     = 8.0e-9  # 8 ns max at 4.5V
# Supply draw: ICC = 20 uA max per package at 25 C, Vcc 6 V (74HC SSI
# standard, TI SCLS049); 10 uA stamped. Cpd 25 pF per buffer ASSUMED
# (family-typical, not a datasheet citation).
supply_static_ua = 10.0
supply_cpd_pf    = 25.0
supply_pin = "14"
gnd_pin    = "7"

[models.pins]
"1"  = "oe_n_1"
"2"  = "a1"
"3"  = "y1"
"4"  = "oe_n_2"
"5"  = "a2"
"6"  = "y2"
"7"  = "gnd"
"8"  = "y3"
"9"  = "a3"
"10" = "oe_n_3"
"11" = "y4"
"12" = "a4"
"13" = "oe_n_4"
"14" = "vcc"

[models.ratings]
max_pin_current_a = 0.025
max_voltage_v = 7.0

[models.logic]
# Behaviour source: TI SN74HC125 datasheet (SCLS049), function table: each
# buffer passes A to Y while its own OE_n is LOW; OE_n HIGH puts that Y in
# high impedance (per-gate tristate, independent enables).
inputs  = ["a1", "a2", "a3", "a4", "oe_n_1", "oe_n_2", "oe_n_3", "oe_n_4"]
outputs = ["y1", "y2", "y3", "y4"]

[models.logic.comb]
"y1" = "a1"
"y2" = "a2"
"y3" = "a3"
"y4" = "a4"

[models.logic.tristate]
"y1" = { enable = "oe_n_1", active = "low" }
"y2" = { enable = "oe_n_2", active = "low" }
"y3" = { enable = "oe_n_3", active = "low" }
"y4" = { enable = "oe_n_4", active = "low" }

