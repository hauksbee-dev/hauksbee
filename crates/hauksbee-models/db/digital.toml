# Digital behavioral models.
# params: voh, vol, vih, vil, tpd_s (propagation delay in seconds),
#         supply_pin, gnd_pin, plus any function-specific params.

# ═════════════════════════════════════════════════════════════════════════════
# Auto-direction push-pull translators (the TI TXB010x family).
#
# Each data line is a pad on each port, and each port has a DC driver that
# copies the other port's level through a 4 kOhm series resistor (TXB0101
# SCES639F Figure 6-1; TXB0104 SCES650K and TXB0108 SCES643L draw the same
# cell). The drivers are "designed to be weak, so that they can be overdriven
# by an external driver" (SCES639F 6.3.1), which is how direction is sensed:
# there is no DIR pin. The generic `[models.logic]` evaluator models that as
# data:
#   - every port pad is a declared OUTPUT (`a`, `b1`, ...), tri-stated by OE
#     (high enables; Pin Functions "Pull OE low to place all outputs in
#     3-state mode"), and `[models.logic] sense` names the input that samples
#     the same pad, so both ports drive at once, each the level the other
#     port reads;
#   - `ro` is the 4.5 kOhm the datasheets' own loading equations use,
#     "counting the variation of the serial resistor 4 kOhm" (SCES639F 7.2.2
#     Eq. 1 and 2, SCES650K and SCES643L 8.2.2), so a pull-up R on a port
#     driven low sits at VOL = VCC x 4.5k / (4.5k + R) and a pull-down at
#     VOH = VCC x R / (R + 4.5k); `ro_strong` is the nominal 4 kOhm. An
#     external driver stronger than the cell wins the pad, the sensed level
#     follows it and the other port copies it; a pull or load stronger than
#     the datasheets' "> 50 kOhm" rule (SCES639F 6.3.4) leaves the pad
#     between VIL and VIH, which the logic-level check reports;
#   - `voh` tracks VCCO with no drop (Eq. 1 with no pull-down) and `vol` is
#     0 V (Eq. 2 with no pull-up); the light-load rows (VOH >= VCCO - 0.4 V at
#     -20 uA, VOL <= 0.4 V at 20 uA) follow from the 4.5 kOhm;
#   - `[models.level_rails]` reads the A port and OE at VCCA and the B port at
#     VCCB (Pin Functions "Referenced to VCCA / VCCB"), with VIH = 0.65 x VCCI
#     and VIL = 0.35 x VCCI for data and OE alike (5.3);
#   - while either rail is below 1 V every output is high impedance, the
#     family's VCC-isolation feature ("If either VCC input is at GND, all
#     outputs are in the high-impedance state").
# NOT MODELLED: the one-shot edge accelerators (about 10 ns at 70/50/40 Ohm,
# SCES639F 6.3.1 and 7.4), so a capacitive load sees only the 4.5 kOhm DC
# cell and edges are slower than real; propagation delay and data rate; Ioff
# and the power-up transient; note (1)'s rule that an unused A/B pair be held
# in the same state. The same note applies to every TXB card below.

# ── TXB0101: 1-bit auto-direction level translator ─────────────────────────
# Source: Texas Instruments TXB0101 datasheet SCES639F (revised September
# 2025): Features p.1; Pin Configuration notes B to E p.3; Pin Functions p.4;
# 5.1 Absolute Maximum Ratings; 5.3 Recommended Operating Conditions; 6.3.1
# Architecture and Figure 6-1; 6.3.4 Pullup or Pulldown Resistors; 7.2.2
# Detailed Design Procedure Eq. (1) and (2); 7.3 Power Supply Recommendations
# (OE to GND through a pull-down during power-up and power-down).
[[models]]
id = "txb0101"
kind = "digital"
description = "TI TXB0101 1-bit auto-direction bidirectional level translator, push-pull with weak DC drivers, SOT-23-6 / SC70-6 / SOT-5X3 / X2SON-6"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/txb0101.pdf"
title = "Texas Instruments TXB0101 datasheet, SCES639F, Rev. F"
locator = "Pin Configuration notes p.3; Pin Functions p.4; 5.1; 5.3; 6.3.1 Architecture and Figure 6-1; 6.3.4; 7.2.2 Eq. (1) and (2); 7.3"
sha256 = "a8f7bb9673ecd22e7bb8adb7600d15414718248632d97430c5a61ec970695fc1"
[[models.source.uncertainty]]
status = "unknown"
parameter = "translation_timing"
reason = "the one-shot edge accelerators, propagation delay, data rate, Ioff and power-up transients are not modelled; only the weak DC drivers, OE, the supply-referenced levels and VCC isolation are"

[models.match]
# DBV, DCK, DRL and DRY share the six-pin numbering below; the YZP DSBGA balls
# are lettered and deliberately not matched. A trailing R or T is tape and reel.
value_re = "(?i)^TXB0101(DBV|DCK|DRL|DRY)?[RT]?$"

[models.params]
voh = 3.3          # VCCO at 3.3 V: Eq. (1) with no pull-down
vol = 0.0          # Eq. (2) with no pull-up
vih = 2.145        # 0.65 x 3.3 V (5.3)
vil = 1.155        # 0.35 x 3.3 V (5.3)
ro = 4500.0        # 7.2.2: 4.5 kOhm counts the variation of the 4 kOhm series resistor
ro_strong = 4000.0 # Figure 6-1: the nominal 4 kOhm series resistor
supply_pin = "1"
gnd_pin = "2"

[models.levels]
# 5.3: data VIH = VCCI x 0.65, VIL = VCCI x 0.35; OE the same against VCCA.
vih = [[1.2, 0.78], [5.5, 3.575]]
vil = [[1.2, 0.42], [5.5, 1.925]]
voh = [[1.2, 1.2], [5.5, 5.5]]

[models.level_rails]
vcca = ["a", "oe"]   # Pin Functions: A and OE referenced to VCCA
vccb = ["b"]         # Pin Functions: B referenced to VCCB

[models.pins]
# Pin Functions, DBV / DCK / DRL / DRY.
"1" = "vcca"  # A-port supply voltage
"2" = "gnd"
"3" = "a"
"4" = "b"
"5" = "oe"
"6" = "vccb"  # B-port supply voltage

[models.ratings]
max_pin_current_a = 0.05      # IO continuous output current, 5.1
max_voltage_v = 6.5           # VCCB abs max, 5.1 (VCCA 4.6 V, enveloped below)

[[models.envelope]]
kind = "supply_range"
pin = "vcca"
min_v = 1.2
max_v = 3.6
abs_max_v = 4.6
basis = "TI TXB0101 SCES639F, Section 5.3 Recommended Operating Conditions, VCCA supply-voltage row"
abs_max_basis = "TI TXB0101 SCES639F, Section 5.1 Absolute Maximum Ratings p.5, VCCA supply voltage -0.5 V to 4.6 V"

[[models.envelope]]
kind = "supply_range"
pin = "vccb"
min_v = 1.65
max_v = 5.5
abs_max_v = 6.5
basis = "TI TXB0101 SCES639F, Section 5.3 Recommended Operating Conditions, VCCB supply-voltage row"
abs_max_basis = "TI TXB0101 SCES639F, Section 5.1 Absolute Maximum Ratings p.5, VCCB supply voltage -0.5 V to 6.5 V"

[[models.envelope]]
kind = "rail_order"
lower = "vcca"
upper = "vccb"
basis = "TI TXB0101 SCES639F, Section 5.3 Recommended Operating Conditions, note (2): VCCA must be less than or equal to VCCB"

[models.logic]
# Each port drives the level the other port reads, both at once (6.3.1).
inputs = ["oe", "a_in", "b_in"]
outputs = ["a", "b"]
[models.logic.sense]
a_in = "a"
b_in = "b"
[models.logic.comb]
a = "b_in"
b = "a_in"
[models.logic.tristate]
a = { enable = "oe", active = "high" }
b = { enable = "oe", active = "high" }

[models.coverage]
implements = ["auto_direction", "weak_dc_drive", "tristate_enable", "dual_supply_levels", "vcc_isolation"]
missing = ["one_shot_edge_acceleration", "propagation_timing", "ioff_leakage", "unused_pair_rule"]

