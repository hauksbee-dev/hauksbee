# Digital behavioral models.
# params: voh, vol, vih, vil, tpd_s (propagation delay in seconds),
#         supply_pin, gnd_pin, plus any function-specific params.

# ── TXB0101: 1-bit auto-direction level translator ─────────────────────────
# Source: Texas Instruments TXB0101 datasheet SCES639F, Rev. F, 41-page PDF.
# Section 4 Pin Configuration and Functions assigns VCCA to pin 1 (A-port
# supply) and VCCB to pin 6 (B-port supply). Section 5.3 Recommended Operating
# Conditions supplies both voltage ranges and note (2)'s VCCA <= VCCB order.
[[models]]
id = "txb0101_identity"
kind = "digital"
description = "TI TXB0101 1-bit bidirectional level translator (identity, pin map, and operating envelopes only)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/txb0101.pdf"
title = "Texas Instruments TXB0101 datasheet, SCES639F, Rev. F"
locator = "Section 4 Pin Configuration and Functions; Section 5.3 Recommended Operating Conditions"
sha256 = "a8f7bb9673ecd22e7bb8adb7600d15414718248632d97430c5a61ec970695fc1"
[[models.source.uncertainty]]
status = "unknown"
parameter = "level_translation_behavior"
reason = "direction sensing, edge acceleration, drive strength, timing, loading, and partial-power-down behavior are not modeled"

[models.match]
# Exact family value plus the exact KiCad DCK symbol spelling used by mito.
value_re = "(?i)^TXB0101(?:DCK)?$"

[models.params]
identity_only = true
warning = "TXB0101 is a level translator; only identity, the six-pin map, and sourced operating envelopes are modeled, not translation behavior or timing"
unlocked_by = "a validated bidirectional TXB0101 translation model covering direction sensing, loading, timing, OE, and partial-power-down behavior"

[models.pins]
"1" = "vcca"  # Section 4: A-port supply voltage
"2" = "gnd"
"3" = "a"
"4" = "b"
"5" = "oe"
"6" = "vccb"  # Section 4: B-port supply voltage

[[models.envelope]]
kind = "supply_range"
pin = "vcca"
min_v = 1.2
max_v = 3.6
basis = "TI TXB0101 SCES639F, Section 5.3 Recommended Operating Conditions, VCCA supply-voltage row"

[[models.envelope]]
kind = "supply_range"
pin = "vccb"
min_v = 1.65
max_v = 5.5
basis = "TI TXB0101 SCES639F, Section 5.3 Recommended Operating Conditions, VCCB supply-voltage row"

[[models.envelope]]
kind = "rail_order"
lower = "vcca"
upper = "vccb"
basis = "TI TXB0101 SCES639F, Section 5.3 Recommended Operating Conditions, note (2): VCCA must be less than or equal to VCCB"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "74hc595"
kind = "shift_register"
description = "74HC595 8-bit serial-in parallel-out shift register with output latch"

[models.match]
value_re = "(?i)^74HC595|^SN74HC595"

[models.params]
# Source: Texas Instruments 74HC595 datasheet (SCLS041I), Table 6.5
voh       = 4.4      # output high (V) at Vcc=4.5V, IoH=−20µA
vol       = 0.1      # output low (V) at Vcc=4.5V, IoL=20µA
vih       = 3.15     # input high threshold (V) at Vcc=4.5V
vil       = 1.35     # input low threshold (V) at Vcc=4.5V
tpd_s     = 1.4e-8   # max propagation delay clock→Qn = 14 ns at 4.5V (Table 6.5)
bits      = 8
# Supply draw: ICC = 80 uA max per package at 25 C, Vcc 6 V (TI SCLS041I);
# 20 uA stamped as a representative operating value. Cpd is NOT in the TI
# table: 40 pF per output transition is an ASSUMED representative MSI-part
# value, not a citation, override per board if the term matters.
supply_static_ua = 20.0
supply_cpd_pf    = 40.0
supply_pin = "16"
gnd_pin    = "8"

[models.levels]
# Source: TI SN74HC595 datasheet SCLS041J, https://www.ti.com/lit/ds/symlink/sn74hc595.pdf,
# Section 6.3 Recommended Operating Conditions, p.4 (VIH min, VIL max), and
# Section 6.5 Electrical Characteristics, p.5 (VOH min, IOH = -20 uA): the
# 2 V, 4.5 V and 6 V columns, read linearly between them.
vih = [[2.0, 1.5], [4.5, 3.15], [6.0, 4.2]]
vil = [[2.0, 0.5], [4.5, 1.35], [6.0, 1.8]]
voh = [[2.0, 1.9], [4.5, 4.4], [6.0, 5.9]]

[models.pins]
"1"  = "qb"
"2"  = "qc"
"3"  = "qd"
"4"  = "qe"
"5"  = "qf"
"6"  = "qg"
"7"  = "qh"
"8"  = "gnd"
"9"  = "qh_serial"
"10" = "srclr_n"
"11" = "srclk"
"12" = "rclk"
"13" = "oe_n"
"14" = "ser"
"15" = "qa"
"16" = "vcc"

[models.ratings]
max_pin_current_a = 0.025  # ±25mA per output (TI abs max 35)
max_voltage_v = 7.0

[models.logic]
# Behaviour source: TI SN74HC595 datasheet (SCLS041I), function table (§8.3):
# SRCLR L clears the shift register asynchronously and DOMINATES SRCLK (the
# "SRCLR L, SRCLK X" row); SRCLK rising shifts SER toward QH (QA is the first
# stage, so bit 0 = QA); RCLK rising copies shift -> storage (with tied
# clocks the storage register is one clock behind, simultaneous-commit
# semantics); OE L enables QA..QH (QH' , the serial cascade tap, is not
# OE-gated).
inputs  = ["ser", "srclk", "rclk", "srclr_n", "oe_n"]
outputs = ["qa", "qb", "qc", "qd", "qe", "qf", "qg", "qh", "qh_serial"]

[[models.logic.register]]
name = "shift"
bits = 8
clock = { pin = "srclk", edge = "rising" }
reset = { pin = "srclr_n", active = "low", value = 0 }
op = "shift_left"
data_in = "ser"

[[models.logic.register]]
name = "store"
bits = 8
clock = { pin = "rclk", edge = "rising" }
op = "load"
data_in = "shift"

[models.logic.comb]
"qa" = "store[0]"
"qb" = "store[1]"
"qc" = "store[2]"
"qd" = "store[3]"
"qe" = "store[4]"
"qf" = "store[5]"
"qg" = "store[6]"
"qh" = "store[7]"
"qh_serial" = "shift[7]"

[models.logic.tristate]
"qa..qh" = { enable = "oe_n", active = "low" }

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "74hc165"
kind = "shift_register"
description = "74HC165 8-bit parallel-in serial-out shift register"

[models.match]
value_re = "(?i)^74HC165|^SN74HC165"

[models.params]
# Source: Texas Instruments 74HC165 datasheet (SCLS052I), Table 6.5
voh       = 4.4
vol       = 0.1
vih       = 3.15
vil       = 1.35
tpd_s     = 1.4e-8
bits      = 8
# Supply draw: ICC = 80 uA max per package at 25 C, Vcc 6 V (TI SCLS052I);
# 20 uA stamped. Cpd 40 pF per output transition is ASSUMED (representative
# MSI value, not a datasheet citation).
supply_static_ua = 20.0
supply_cpd_pf    = 40.0
supply_pin = "16"
gnd_pin    = "8"

[models.levels]
# Source: TI SN74HC165 datasheet SCLS116H, https://www.ti.com/lit/ds/symlink/sn74hc165.pdf,
# Section 6.3 Recommended Operating Conditions, p.4 (VIH min, VIL max), and
# Section 6.5 Electrical Characteristics, p.5 (VOH min, IOH = -20 uA): the
# 2 V, 4.5 V and 6 V columns, read linearly between them.
vih = [[2.0, 1.5], [4.5, 3.15], [6.0, 4.2]]
vil = [[2.0, 0.5], [4.5, 1.35], [6.0, 1.8]]
voh = [[2.0, 1.9], [4.5, 4.4], [6.0, 5.9]]

[models.pins]
"1"  = "pl_n"
"2"  = "clk"
"3"  = "e"
"4"  = "f"
"5"  = "g"
"6"  = "h"
"7"  = "qh_n"
"8"  = "gnd"
"9"  = "qh"
"10" = "ser"
"11" = "a"
"12" = "b"
"13" = "c"
"14" = "d"
"15" = "clk_inh"
"16" = "vcc"

[models.ratings]
max_pin_current_a = 0.025
max_voltage_v = 7.0

[models.logic]
# Behaviour source: TI SN74HC165 datasheet (SCLS052I), function table: PL_n
# (SH/LD) LOW loads A..H asynchronously (dominant over the clock); with PL_n
# HIGH and CLK_INH LOW, a CLK rising edge shifts the data one stage TOWARD QH
# (QH shows H after a load, then G, F, ..., shift_left with QH = bit 7) while
# SER enters at the first stage. QH_n is the complement output.
# NOTE: the pre-migration hardcoded tick shifted the OPPOSITE direction (a
# modeling artifact nothing exercised, the real readback path is the
# edge-driven Hc165Chain, which always had the datasheet direction). This spec
# is the silicon behaviour; tests/logic_migration.rs documents the difference.
inputs  = ["pl_n", "clk", "clk_inh", "ser", "a", "b", "c", "d", "e", "f", "g", "h"]
outputs = ["qh", "qh_n"]

[[models.logic.register]]
name = "reg"
bits = 8
clock = { pin = "clk", edge = "rising" }
clock_enable = { pin = "clk_inh", active = "low" }
op = "shift_left"
data_in = "ser"
load = { pin = "pl_n", active = "low", data = ["a", "b", "c", "d", "e", "f", "g", "h"] }

[models.logic.comb]
"qh" = "reg[7]"
"qh_n" = "!reg[7]"

