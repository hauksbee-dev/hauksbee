[[models.source.references]]
url = "https://www.nxp.com/docs/en/data-sheet/NTS0104.pdf"
title = "NXP NTS0104 dual supply translating transceiver; open drain; auto direction sensing, Rev. 3, 3 January 2012"
locator = "Pinning (GU12 / XQFN12); Limiting values; Recommended operating conditions (VCC(A) <= VCC(B)); section 14.2 architecture"
[[models.source.uncertainty]]
status = "unknown"
parameter = "level_translation_behavior"
reason = "auto-direction sensing, one-shot edge acceleration, pass-gate resistance (not published), 10 kOhm port pull-ups and OE timing are not modelled; the sha256 is not recorded because every vendor and distributor URL returned a bot-check page on 2026-10-01, and the pin map and limits are the transcription of Rev. 3 kept in analog_switch.toml"

