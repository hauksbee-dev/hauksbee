kind = "digital"
description = "onsemi MOC3043M zero-cross triac driver optocoupler, 6-pin DIP; identity-only because its optically triggered bilateral triac output cannot be represented by the digital logic-level model, and the datasheet supplies no digital VIH/VIL/VOH/VOL or propagation-delay specs."

