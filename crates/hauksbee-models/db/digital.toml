vdrain_current_a = 0.0019
vm_on_v = 9.0
vdrain_on_v = 7.0
warning = "source-bound supply-draw model: the awake VM current (8.5 mA typ, 13 mA max at VM = VDRAIN = 48 V, ENABLE high, inputs low) and VDRAIN current (1.9 mA typ) with the 9 V to 75 V VM and 7 V to 100 V VDRAIN ranges are executable; the gate drivers, charge pump, DVDD and VGLS regulators, shunt amplifiers, SPI registers, ENABLE sleep mode (20 uA) and fault logic are not represented, so the half-bridge gates carry no drive"

