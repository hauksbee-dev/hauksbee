supply_on_v = 2.7
warning = "source-bound supply model only: the 0.4 mA typical supply current and the 2.7-5.5 V supply limits are executable; the output stage (an internal pull-up of unpublished value), IR demodulation, burst timing and the 1.5 mA maximum draw are not represented"

[models.pins]
