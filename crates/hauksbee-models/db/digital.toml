locator = "pin configuration (p.3); recommended operating conditions (p.4); electrical and switching characteristics (p.5)"
sha256 = "560059e5008535daac9365fd0142fd05ea6f273cb1aba9b514c7c6d0b3bbc1b2"

[models.match]
value_re = "(?i)^(SN)?74HCT02"

[models.params]
voh       = 4.4
vol       = 0.1
vih       = 2.0
vil       = 0.8
tpd_s     = 11.0e-9
supply_static_ua = 2.0
supply_cpd_pf    = 20.0
supply_pin = "14"
gnd_pin    = "7"

[models.pins]
"1"  = "g1y"
"2"  = "g1a"
"3"  = "g1b"
"4"  = "g2y"
"5"  = "g2a"
"6"  = "g2b"
"7"  = "gnd"
"8"  = "g3a"
"9"  = "g3b"
"10" = "g3y"
"11" = "g4a"
"12" = "g4b"
"13" = "g4y"
"14" = "vcc"

[models.ratings]
max_pin_current_a = 0.025
max_voltage_v = 7.0

[models.logic]
inputs  = ["g1a", "g1b", "g2a", "g2b", "g3a", "g3b", "g4a", "g4b"]
outputs = ["g1y", "g2y", "g3y", "g4y"]

[models.logic.comb]
"g1y" = "!(g1a | g1b)"
"g2y" = "!(g2a | g2b)"
"g3y" = "!(g3a | g3b)"
"g4y" = "!(g4a | g4b)"

