supply_cpd_pf    = 20.0
supply_pin = "14"
gnd_pin    = "7"

[models.levels]
# Source: TI SN74HC02 datasheet SCLS076G, https://www.ti.com/lit/ds/symlink/sn74hc02.pdf,
# Section 6.3 Recommended Operating Conditions, p.4 (VIH min, VIL max), and
# Section 6.5 Electrical Characteristics, p.5 (VOH min, IOH = -20 uA): the
# 2 V, 4.5 V and 6 V columns, read linearly between them.
vih = [[2.0, 1.5], [4.5, 3.15], [6.0, 4.2]]
vil = [[2.0, 0.5], [4.5, 1.35], [6.0, 1.8]]
voh = [[2.0, 1.9], [4.5, 4.4], [6.0, 5.9]]

[models.pins]
# Gate pinout (verified against a real netlist):
# gate1 out=1 in=2,3 ; gate2 out=4 in=5,6 ; gate3 out=10 in=8,9 ; gate4 out=13 in=11,12.
"1"  = "g1y"
"2"  = "g1a"
"3"  = "g1b"
"4"  = "g2y"
"5"  = "g2a"
"6"  = "g2b"
"7"  = "gnd"
"8"  = "g3a"
"9"  = "g3b"
"10" = "g3y"
"11" = "g4a"
"12" = "g4b"
"13" = "g4y"
"14" = "vcc"

[models.ratings]
max_pin_current_a = 0.025
max_voltage_v = 7.0

[models.logic]
# Behaviour source: TI SN74HC02 datasheet (SCLS050), function table: each
# Y = NOR(A, B). Standalone (non-cross-coupled) gates evaluate here; gates
# wired as cross-coupled SR latch PAIRS are intercepted by the binder's latch
# detection (bind_nor_latches) and fused into one NOR-latch spec instance per
# pair, because a cross-couple THROUGH BOARD NETS cannot settle at analog
