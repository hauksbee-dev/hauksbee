supply_static_ua = 10.0
supply_cpd_pf    = 24.0
supply_pin = "14"
gnd_pin    = "7"

[models.pins]
"1"  = "clr_n1"
"2"  = "d1"
"3"  = "clk1"
"4"  = "pre_n1"
"5"  = "q1"
"6"  = "q_n1"
"7"  = "gnd"
"8"  = "q_n2"
"9"  = "q2"
"10" = "pre_n2"
"11" = "clk2"
"12" = "d2"
"13" = "clr_n2"
"14" = "vcc"

[models.ratings]
max_pin_current_a = 0.025
max_voltage_v = 7.0

[models.logic]
# Behaviour source: TI SN74HC74 datasheet, function table: PRE_n LOW sets
# Q HIGH asynchronously; CLR_n LOW clears Q LOW asynchronously; with both
# HIGH, a CLK rising edge captures D; CLK LOW/HIGH levels hold. The
# both-asserted row (PRE_n and CLR_n LOW: Q = Q_n = HIGH, unstable) is not
# representable in a 1-bit register and is deliberately not faked: the FIRST
# declared reset (CLR_n) wins while both are held (a documented refusal, and
# the datasheet itself marks the state unstable/invalid on release).
inputs  = ["d1", "clk1", "pre_n1", "clr_n1", "d2", "clk2", "pre_n2", "clr_n2"]
outputs = ["q1", "q_n1", "q2", "q_n2"]

[[models.logic.register]]
name = "ff1"
bits = 1
clock = { pin = "clk1", edge = "rising" }
reset = [
  { pin = "clr_n1", active = "low", value = 0 },
  { pin = "pre_n1", active = "low", value = 1 },
]
op = "load"
data_in = "d1"

[[models.logic.register]]
name = "ff2"
bits = 1
clock = { pin = "clk2", edge = "rising" }
reset = [
  { pin = "clr_n2", active = "low", value = 0 },
  { pin = "pre_n2", active = "low", value = 1 },
]
op = "load"
data_in = "d2"

[models.logic.comb]
"q1" = "ff1[0]"
"q_n1" = "!ff1[0]"
"q2" = "ff2[0]"
"q_n2" = "!ff2[0]"
