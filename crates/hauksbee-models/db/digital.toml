title = "Cypress CY7C68013A/14A/15A/16A EZ-USB FX2LP datasheet, 38-08032 Rev. AD (revised April 30, 2021)"
locator = "Figure 10 p.23; Table 11 56 QFN column pp.24-29; Absolute Maximum Ratings, Operating Conditions and Table 13 p.41; Table 14 p.42; Ordering Information p.60"
sha256 = "67d39521d4c859392bdf5cccf27ef6c4eb172430a7c52cb17e0d26b66904905b"
[[models.source.uncertainty]]
