# ── DRV8871: TI 3.6 A brushed-DC motor driver (H-bridge) with internal current sense, 8-pin HSOP PowerPAD (DDA) ──
# Source: TI SLVSCY9B (August 2015, revised July 2016). Pin Functions p.3 (DDA,
# top view: 1 GND, 2 IN2, 3 IN1, 4 ILIM, 5 VM, 6 OUT1, 7 PGND, 8 OUT2, thermal pad),
# 6.1 Absolute Maximum Ratings p.3, 6.3 Recommended Operating Conditions and 6.4
# Thermal Information p.4, 6.5 Electrical Characteristics p.5, 7.3.3 Current
# Regulation p.8-9 (Equation 1, ITRIP(A) = VILIM(kV) / RILIM(kOhm), VILIM 59/64/69 kV;
