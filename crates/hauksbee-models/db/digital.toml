# ─────────────────────────────────────────────────────────────────────────────
# MAX3237E: 5-driver / 3-receiver RS-232 transceiver with a regulated dual
# charge pump, TSSOP-28 (TI PW, order code MAX3237EIPWR; also the SSOP-28 DB and
# SOIC-28 DW, which share the pinout).
#
# Sources (both read; the order code is TI's, so TI's sheet is primary):
#   [TI]  TI "MAX3237E 3-V to 5.5-V Multichannel RS-232 1-Mbit/s Line
#         Driver/Receiver", SLLS709B (May 2006, revised January 2010),
#         https://www.ti.com/lit/ds/symlink/max3237e.pdf,
#         sha256 3c7a0153f3fbbd48164911544710a790f961cd9fcd852167d5ae54bd319bf0b9.
#   [ADI] Maxim/ADI "MAX3222E/MAX3232E/MAX3237E/MAX3241E/MAX3246E", 19-1298 Rev 13
#         (12/18), https://www.analog.com/media/en/technical-documentation/data-sheets/MAX3222E-MAX3246E.pdf,
#         sha256 773dd6aa67273c10362119bc115eb772171d57f16f6980adf69942f1712ffeac.
#         TI states the part is "designed to be interchangeable with Maxim
#         MAX3237E" (p.1); ADI is cited only for what TI does not print: the
#         charge-pump regulation point, the 400 kOhm input keeper and the
#         V+/V- shutdown behaviour.
# Drafted by `hauksbee models extract` (codex gpt-6-luna) from the ADI sheet and
# rewritten by hand against both PDFs; see the corrections in the commit.
#
# Datasheet figures used:
#   Pinout        [TI] p.1 DB/DW/PW top view = [ADI] p.16 MAX3237E SSOP/TSSOP
#   VCC           [TI] p.4 ROC: 3.0-3.6 V (3.3 V) or 4.5-5.5 V (5 V); abs max
#                 -0.3..6 V. Operation down to 2.7 V at EIA-562 levels: [ADI] p.13
#   V+ / V-       [ADI] p.9: a regulated dual charge pump giving +5.5 V (doubler)
#                 and -5.5 V (inverter) over VCC 3.0-5.5 V, discontinuous mode.
#                 [TI] p.4 abs max: V+ -0.3..7 V, V- +0.3..-7 V, V+ - V- 13 V
#   Capacitors    [TI] p.9 Figure 5: 3.3 V +-0.15 V -> C1..C4 0.1 uF; 3.3 V +-0.3 V
#                 -> 0.22 uF; 5 V +-0.5 V -> C1 0.047 uF, C2..C4 0.33 uF;
#                 3.0-5.5 V -> C1 0.22 uF, C2..C4 1 uF
#   ICC           [TI] p.4: 0.5 mA typ / 2 mA max, no load, SHDN = VCC;
#                 1 uA typ / 10 uA max with SHDN = GND (TA = 25 C)
#   DIN/EN/SHDN/MBAUD  [TI] p.4: VIL 0.8 V max; VIH 2.0 V min at VCC = 3.3 V,
#                 2.4 V min at VCC = 5 V; input current 9 uA typ / 18 uA max (the
#                 active positive-feedback keeper, [ADI] p.9: 400 kOhm, zero
#                 current at the rails, so unused inputs may float)
#   Drivers       [TI] p.5: VOH +5 V min / +5.4 V typ, VOL -5 V min / -5.4 V typ,
#                 every DOUT at RL = 3 kOhm to GND; IOS +-60 mA max at VO = 0;
#                 ro 300 Ohm min with VCC = V+ = V- = 0
#   Receivers     [TI] p.6: VOH VCC - 0.6 V min / VCC - 0.1 V typ at IOH = -1 mA;
#                 VOL 0.4 V max at IOL = 1 mA; VIT+ 1.5 typ / 2.4 max (3.3 V),
#                 2.0 / 2.4 (5 V); VIT- 0.6 min / 1.1 typ (3.3 V), 0.8 / 1.5 (5 V);
#                 hysteresis 0.5 V typ; ri 3 / 5 / 7 kOhm
#   Function      [TI] p.2 Table 1: SHDN low -> DOUT high-Z; EN high -> ROUT high-Z;
#                 ROUT1B always active. [TI] p.2 / [ADI] p.10: in shutdown the
#                 pump stops, V+ falls to VCC and V- rises to GND
#
# HOW IT IS STAMPED (behavioural laws on the generic runtime):
#   - V+ and V- are voltage laws on the reservoir pins: min(5.5, 2 VCC) and
#     max(-5.5, -2 VCC) while running, VCC and 0 V in shutdown, each behind
#     `pump_r_ohms`. The 2 VCC ceiling is the doubler's ideal limit; it only
#     shapes the ramp (VCC >= 2.75 V reaches 5.5 V).
#   - VCC draws ICC plus twice the current each pump delivers: an ideal doubler
#     takes 2 x Iout from its input, and the -5.5 V the inverter reaches at
#     VCC = 3 V is only possible inverting V+, so it costs 2 x |I-| too. That
#     2x is derived from the topology [ADI] p.9 describes, not printed.
#   - Each driver is a voltage law following the live V+ (DIN low) or V- (DIN
#     high), behind `drv_r_ohms`; its load current is drawn back out of the
#     V+ / V- reservoir by a matching current law, so a loaded driver sags the
#     pump rail and raises ICC the way the silicon does.
#   - Each receiver is a voltage law to VCC or GND behind `rx_r_ohms`, with
#     hysteresis taken from its own output (the threshold is VIT+ while ROUT is
#     high, VIT- while it is low), and a `rin_ohms` load on RIN.
#   - EN and SHDN select one of four FSM states; DOUT tri-states outside
#     `on_*`, ROUT1..3 outside `*_rx`; ROUT1B always drives.
#   - The keeper is a 400 kOhm law to whichever rail the pin is nearer.
#
# ASSUMED (no datasheet number; each is named in `warning` too):
#   - `pump_r_ohms` 2 Ohm and `drv_r_ohms` 45 Ohm: fitted so five drivers into
#     3 kOhm give the 5.4 V typical swing (5.5 / (1 + (45 + 5 x 2) / 3000) =
#     5.40 V). No pump output impedance is printed. The resulting short-circuit
#     current (~117 mA) is above the 60 mA IOS maximum: the driver current
#     limit is not modelled.
#   - `in_th_v` 1.4 V: one switching point midway between VIL 0.8 V and VIH
#     2.0 V for DIN, EN and SHDN; the 0.5 V transmitter-input hysteresis
#     ([ADI] p.2) is not modelled beyond what the keeper adds.
#   - the receivers' 100 Ohm (r_ohms) from the typical VOH drop (0.1 V at 1 mA); the low
#     side prints only a 0.4 V maximum, so the same value is used.
#   - Receiver thresholds are the typical rows, linear in VCC between the
#     3.3 V and 5 V columns.
#   - A FLOATING EN or SHDN starts at 0 V in the solver and the keeper holds it
#     there: SHDN floating reads as shutdown, EN floating as receivers enabled.
#     Neither sheet says which way the keeper powers up.
#
# NOT MODELLED: slew rate and MBAUD (250 kbit/s vs 1 Mbit/s), propagation and
# enable delays, pump ripple and switching frequency, the 100 us shutdown
# recovery, the driver current limit, ESD, the receiver input range clamp
# (+-25 V) and the 10 nA invalid-input shutdown current.
[[models]]
id = "max3237e"
kind = "digital"
description = "MAX3237E 5-driver / 3-receiver RS-232 transceiver with regulated +-5.5 V charge pump, SSOP/SOIC/TSSOP-28 (behavioural DC: pump rails, driver and receiver levels, EN/SHDN states, supply current; no slew or timing)"

[models.match]
# TI order codes MAX3237E{C,I}{DB,DW,PW}[R] and Maxim's MAX3237E{C,E}{AI,WI,UI}[+][T];
# all three 28-pin packages share one pinout ([TI] p.1, [ADI] p.16). The QFN
# (RHB / TQFN) numbers its pads differently and is not matched.
value_re = "(?i)^MAX3237E(?:[CI](?:DB|DW|PW)R?|[CE](?:AI|WI|UI)\\+?T?)?$"

[models.params]
