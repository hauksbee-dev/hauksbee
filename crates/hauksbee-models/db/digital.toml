# ═════════════════════════════════════════════════════════════════════════════
# Direction-controlled dual-supply translators (the xT45 family).
#
# These are CMOS buffers, not pass gates: DIR picks which port drives, and the
# function table is boolean, so the generic `[models.logic]` evaluator models
# them as data. Three pieces of the schema carry the translator:
#   - each port is one pad whose role is a declared OUTPUT (`a1`, `b1`), tri-stated
#     by DIR (and OE where fitted), and `[models.logic] sense` names the input
#     (`a1_in`, `b1_in`) that samples the same pad while its driver is off;
#   - `[models.level_rails]` reads the A port and the control pins at VCCA and the
#     B port at VCCB, using the card's `[models.levels]` tables, which these
#     datasheets give against VCCI (input port's rail) and VCCO (output port's
#     rail), so one table serves both ports;
#   - while either rail is unpowered every output is high impedance, which is
#     the family's documented VCC-isolation feature.
# NOT MODELLED: propagation delay and data-rate limits, output drive beyond the
# light-load VOH/VOL plus `ro`, Ioff leakage and the weak input pull-downs, and
# bus contention when both sides drive. The same note applies to every xT45
# card added below this banner.

# ── SN74AVC1T45: single-bit dual-supply transceiver (MNT Reform) ─────────────
# Source: Texas Instruments SN74AVC1T45 datasheet SCES530L, December 2003,
#   revised January 2026: Table 4-1 Pin Functions (p.4), Section 5.1 Absolute
#   Maximum Ratings (p.6), Section 5.3 Recommended Operating Conditions (p.7),
#   Section 5.4 Thermal Information and 5.5 Electrical Characteristics (p.8),
#   Table 7-1 Function Table (p.15).
[[models]]
id = "sn74avc1t45"
kind = "digital"
description = "SN74AVC1T45 single-bit dual-supply bus transceiver, DIR-controlled, SOT-23-6 / SC70-6 / SOT-5X3"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/sn74avc1t45.pdf"
title = "Texas Instruments SN74AVC1T45 datasheet, SCES530L, revised January 2026"
locator = "Table 4-1 Pin Functions p.4; 5.1 Absolute Maximum Ratings p.6; 5.3 Recommended Operating Conditions p.7; 5.4 Thermal Information and 5.5 Electrical Characteristics p.8; Table 7-1 Function Table p.15"
sha256 = "de9ae63b763d0829fef536a3ddcdbfa15e853a98e5ec371cdb976047d7d7a8e8"
[[models.source.uncertainty]]
status = "unknown"
parameter = "translation_timing"
reason = "propagation delay, data rate, output edge rate and Ioff leakage are not modelled; only the DC function table, the supply-referenced levels and VCC isolation are"

[models.match]
# DBV, DCK and DRL share the 6-pin numbering below. The YZP DSBGA balls are
# lettered (A1..C2) and are deliberately not matched.
value_re = "(?i)^(SN)?74AVC1T45(DBV|DCK|DRL)?[RT]?$"

[models.params]
# Light-load output levels (IOH = -100 uA: VOH = VCCO - 0.2 V; IOL = 100 uA:
# VOL = 0.2 V), 5.5 Electrical Characteristics. VOH tracks VCCO via the table.
voh = 3.1
vol = 0.2
vih = 2.0
vil = 0.8
# Output resistance from the same table at 3 V: VOH 2.3 V min at -12 mA against
# the 2.8 V light-load level, and VOL 0.7 V max at 12 mA against 0.2 V, both
# (0.5 V / 12 mA) = 42 Ohm worst case.
ro = 42.0
supply_pin = "1"
gnd_pin = "2"

[models.levels]
# Section 5.3, data inputs against VCCI and control inputs against VCCA (the
# same numbers): 0.65 x VCC / 0.35 x VCC for 1.2 to 1.95 V, then 1.6 / 0.7 V for
# 1.95 to 2.7 V, then 2.0 / 0.8 V for 2.7 to 3.6 V. Where two bands share an
# edge the stricter band is taken (higher VIH, lower VIL), so each step sits
# 10 mV inside the looser band.
vih = [[1.2, 0.78], [1.94, 1.261], [1.95, 1.6], [2.69, 1.6], [2.7, 2.0], [3.6, 2.0]]
vil = [[1.2, 0.42], [1.95, 0.6825], [1.96, 0.7], [2.7, 0.7], [2.71, 0.8], [3.6, 0.8]]
# VOH = VCCO - 0.2 V at IOH = -100 uA, 1.2 V to 3.6 V.
voh = [[1.2, 1.0], [3.6, 3.4]]

[models.level_rails]
vcca = ["a1", "dir"]   # Table 4-1: A referenced to VCCA; DIR "referenced to VCCA"
vccb = ["b1"]          # Table 4-1: B referenced to VCCB

[models.pins]
# Table 4-1, DBV / DCK / DRL.
"1" = "vcca"
"2" = "gnd"
"3" = "a1"
"4" = "b1"
"5" = "dir"
"6" = "vccb"

[models.ratings]
max_pin_current_a = 0.05      # IO continuous output current, abs max
max_voltage_v = 4.6           # VCCA / VCCB abs max
max_junction_temp_c = 150.0
theta_ja_c_per_w = 183.4      # DBV (SOT-23-6); DCK 211.4, DRL 236.2

[[models.envelope]]
kind = "supply_range"
pin = "vcca"
min_v = 1.2
max_v = 3.6
abs_max_v = 4.6
basis = "TI SN74AVC1T45 SCES530L, 5.3 Recommended Operating Conditions, VCCA 1.2 V to 3.6 V; 5.1 Absolute Maximum Ratings, VCCA -0.5 V to 4.6 V"

[[models.envelope]]
kind = "supply_range"
pin = "vccb"
min_v = 1.2
max_v = 3.6
abs_max_v = 4.6
basis = "TI SN74AVC1T45 SCES530L, 5.3 Recommended Operating Conditions, VCCB 1.2 V to 3.6 V; 5.1 Absolute Maximum Ratings, VCCB -0.5 V to 4.6 V"

[[models.envelope]]
kind = "input_tolerance"
pins = ["dir"]
max_v = 3.6
abs_max_v = 4.6
basis = "TI SN74AVC1T45 SCES530L, 5.3 Recommended Operating Conditions, VI input voltage 0 V to 3.6 V"
abs_max_basis = "TI SN74AVC1T45 SCES530L, 5.1 Absolute Maximum Ratings, VI input voltage, control inputs -0.5 V to 4.6 V"
note = "the A and B I/O ports are not listed: their -0.5 V to 4.6 V row holds only in the high-impedance or power-off state, and a driven port is rated VCCO + 0.5 V"

[models.logic]
# Table 7-1: DIR low, B data to the A bus; DIR high, A data to the B bus.
inputs = ["dir", "a1_in", "b1_in"]
outputs = ["a1", "b1"]
[models.logic.sense]
a1_in = "a1"
b1_in = "b1"
[models.logic.comb]
a1 = "b1_in"
b1 = "a1_in"
[models.logic.tristate]
a1 = { enable = "dir", active = "low" }
b1 = { enable = "dir", active = "high" }

[models.coverage]
implements = ["direction_control", "dual_supply_levels", "vcc_isolation"]
missing = ["propagation_timing", "output_drive_curve", "ioff_leakage", "input_pulldowns"]

