# ── PCA9635: NXP 16-channel Fm+ I2C LED driver, TSSOP28 ──
# NXP PCA9635 Rev. 7.1 (27 July 2021), sha256 15110f5e5ce3e955a589bec76c9b1fa1f4c54c8c7525c0994861a5c99b6e5696. Drafted by the extraction pipeline
# (codex gpt-6-luna) and reviewed against the PDF: all 28 pins (Table 3), VDD 2.3-5.5 V / 6.0 V abs max, ISS 400 mA, 25 mA per LED pin, Ptot 400 mW and the 2.5 mA operating IDD (Tables 17, 18).
