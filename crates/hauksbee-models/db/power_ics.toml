# ─────────────────────────────────────────────────────────────────────────────
# SR2: STMicroelectronics 6-pin Smart Reset, UDFN6 1.6 x 1.3 mm.
#
# Source: STMicroelectronics "SR2 - 6 pin Smart Reset" datasheet, DocID026047
#   Rev 2, 13-May-2014 (www.st.com/resource/en/datasheet/sr2.pdf).
#
# WHAT THE PART IS. Not a voltage detector: it has NO power-on reset and does
# not watch the rail. It watches two push-button inputs (SR0, SR1) and asserts
# its reset output only after BOTH have been held low together for the
# factory-programmed delay tSRC, which is seconds, not milliseconds. That is the
# whole point of the family: a short press reaches the MCU as an interrupt, a
# long press on both buttons is a hard reset, and no dedicated reset button is
# needed. On a Watchy (U1, value "SR2HARU") the two inputs are the BTN2 and BTN3
# menu buttons and the output drives the ESP32's EN.
#
# Datasheet figures used (Table 4 DC and AC characteristic, TA = -40 to +85 C,
# VCC = 1.65 to 5.5 V; typical values at 25 C and VCC = 3.3 V):
#   VCC   = 1.65 to 5.5 V
#   ICC   = 1.1 typ, 2.5 max uA   at VCC = 3.0 V  (inputs inactive, no tSRC count)
#   ICC   = 1.5 typ, 3.0 max uA   at VCC = 5.0 V
#   VOL   = 0.3 V max             at VCC >= 3.3 V sinking 2.5 mA
#                                 (0.3 V max at >= 4.5 V/3.2 mA and >= 1.65 V/1 mA)
#   VIL   = VSS - 0.3 to 0.3 V    (SR0, SR1; FIXED volts, not a VCC fraction)
#   VIH   = 0.85 to 5.5 V         (SR0, SR1)
#   ILI   = -0.1 to 0.1 uA        (SR0, SR1 input leakage)
#   ILO   = -0.1 to 0.1 uA        (RST leakage, open-drain option without pull-up)
#   tSRC  = 0.8x / 1.0x / 1.2x the programmed delay over temperature
#   tREC  = 240 / 360 / 480 ms    (only on the -B- reset-timeout options)
#   RPUO  = 65 kOhm               (internal RST pull-up, only on options that have one)
# Table 2 Absolute maximum ratings: VCC -0.3 to 7 V; input or output voltage
#   -0.3 to 5.5 V (for a push-pull RST, -0.3 V to VCC + 0.3 V); storage -55 to
#   +150 C; 2 kV HBM.
# Section 1: below 1.575 V typ the inputs are ignored and the outputs are
#   deasserted, with the deasserted level valid down to VCC = 1.0 V.
#
# WHY THIS ONE IS MODELLED WHERE THE VOLTAGE DETECTORS BELOW ARE NOT. Their
# problem is the kind, not the sheet: a detector's job is a threshold with
# hysteresis, `comparator` needs two DRIVEN output levels, and an open-drain
# output has no high-side drive to give. This part's inputs are fixed logic
# levels, which `digital` says exactly, and the open-drain output costs nothing
# here because the binder stamps a driver only on a role beginning with `y`. No
# role below does, so RST is left to whatever the board's pull-up makes it, which
# is the truth about an open-drain pin. Hence NO `voh`: the datasheet's VOH row
# is explicitly "push-pull output only", and the ordering options in this entry
# are all open-drain.
#
# DELIBERATELY NOT MODELLED: the tSRC counter itself, so a press of both buttons
# does not assert RST in simulation; the tREC one-shot on the -B- options; the
# 1.575 V input-ignore threshold; and the SR0 overvoltage test mode (VTEST =
# VCC + 0.9/1.1/1.4 V, tSRC-INI 42 ms typ, tSRC-SHORT 21 ms typ). A `[models.logic]`
# spec with a seconds-scale timer is the pathway for the counter; nothing here
# fakes it in the meantime. No `ro` either: the sheet gives VOL at three sink
# currents (~120 Ohm implied at the 3.3 V point) but no output impedance, and an
# unstamped output has nothing to apply it to.
[[models]]
id = "sr2"
kind = "digital"
description = "ST SR2 dual-push-button Smart Reset supervisor, UDFN6, open-drain active-low RST"

[models.match]
# The six ordering options Table 7 actually lists, spelled out rather than
# pattern-matched, because a class like SR2[HLPU]A[RB]U would also claim
# SR2HABU and SR2PABU, which ST does not build.
#
# One entry covers all six because they differ ONLY in things this model does
# not carry: the Smart Reset delay tSRC (H = 4.0 s, L = 6.0 s, P = 7.5 s,
# U = 10.0 s, per Table 6) and whether the output pulse is push-button
# controlled (-R-) or a fixed 360 ms tREC one-shot (-B-). Every one of them is
# open-drain, active low, with no internal pull-up (the `A` output code), and
# all share the UDFN6 pinout and the DC table below. The moment a tSRC-aware
# logic spec exists, this splits into one entry per delay.
value_re = "(?i)^SR2(HARU|LABU|LARU|PARU|UABU|UARU)$"

[models.params]
identity_only = true
warning = "sr2 has no generic executable device behavior; only identity and sourced metadata are available"
unlocked_by = "a validated executable model for sr2"
# Table 4. vol/vih/vil are the datasheet numbers verbatim; the SR inputs have
# FIXED thresholds, so unlike a CMOS part these do not move with the rail.
vol   = 0.3      # VOL max at VCC >= 3.3 V, sinking 2.5 mA
vih   = 0.85     # VIH min, SR0/SR1
vil   = 0.3      # VIL max, SR0/SR1
supply_static_ua = 1.1   # ICC typ at VCC = 3.0 V (2.5 max); 1.5 typ at 5.0 V
supply_pin = "6"
gnd_pin    = "1"

[models.pins]
# Table 1 Signal names, cross-checked against Figure 2 Pin connections.
"1" = "vss"
"2" = "sr1_n"   # secondary push-button input, active low
"3" = "rst_n"   # reset output, open drain, active low on these options
"4" = "nc"      # not bonded; the datasheet says to connect it to VSS
"5" = "sr0_n"   # primary push-button input, active low; also the test-mode pin
"6" = "vcc"

[models.ratings]
# Table 2 Absolute maximum ratings. max_voltage_v is the SUPPLY limit; the
# separate -0.3 to 5.5 V limit on RST/SR0/SR1 has no field on this schema, so a
# board pulling RST above 5.5 V from a higher rail is not caught here. No
# max_pin_current_a: the sheet's 1 to 3.2 mA sink figures are VOL test
# conditions, not an output rating. No junction-temperature or thermal fields;
# Table 3 gives only the -40 to +85 C ambient range.
max_voltage_v = 7.0

[models.coverage]
implements = ["pin_roles", "fixed_input_thresholds", "supply_current", "open_drain_output_without_fabricated_high_drive", "absolute_ratings"]
missing = ["smart_reset_timer", "recovery_timer", "low_voltage_input_ignore", "overvoltage_test_mode", "push_pull_variants"]

# ═════════════════════════════════════════════════════════════════════════════
# THE VOLTAGE DETECTORS AND THE LED DRIVERS DELIBERATELY LEFT UNRESOLVED.
#
# NCP303LSN27T1G (onsemi, SOT-23-5) and BD5230G (Rohm, SSOP5) are voltage
# detectors, and FAN5622SX (onsemi, SuperSOT23-6) is a constant-current LED
# driver. All three datasheets were read; none of them is modelled, and the
# reasons are specific rather than a shortage of numbers.
#
#   NCP303LSN27T1G: an N-channel OPEN-DRAIN, active-low reset output. The
#     `comparator` kind requires `out_lo` and `out_hi`, i.e. two DRIVEN levels,
#     and an open-drain output has no high-side drive at all: its high level is
#     whatever the board's external pull-up makes it. Stamping an `out_hi` would
#     invent a driver the part does not contain, and on a board whose pull-up is
#     missing or wrongly sized that fiction would hide the very fault worth
#     finding. Its detect DELAY is also externally programmed by a capacitor on
#     the CD pin (RD = 1.0 MOhm typ internal pull-up), so there is no fixed
#     figure to carry. Recorded numbers, for whenever an open-drain output kind
#     exists: VDET- 2.646/2.700/2.754 V, VHYS 0.081/0.135/0.189 V, Iin 0.26 uA
#     typ below threshold and 0.46 uA above, min operating VIN 0.55-0.80 V, abs
#     max 12 V, output current 70 mA, theta_JA 250 C/W, TJ max 125 C. Source:
#     onsemi NCP302/D Rev. 14.5, January 2005. NOTE: on the Olimex boards this
#     part is a documented no-fit position anyway, value "NA(NCP303LSN27T1G
#     (SOT-23-5))", so it is correctly ignored there by db/ignore.toml.
#
#   BD5230G: same open-drain problem, same external-capacitor delay (CT pin,
#     RCT 9 MOhm typ). Recorded: VDET 2.970/3.0/3.030 V at 25 C (the "52" prefix
#     is the open-drain output type and "30" is the 3.0 V threshold, per the
#     Ordering Information decoder), hysteresis VDET x 0.03/0.05/0.08, IDD1
#     0.80 uA typ / 2.40 max, IDD2 0.75/2.25 uA, abs max VDD 10 V, PD 540 mW
#     (SSOP5 on the ROHM standard 70x70x1.6 mm board), -40 to +105 C. Source:
#     ROHM TSZ02201-0GJG0G300040-1-2 Rev.009, 11 October 2021, read at the
#     VDET = 3.0 V row of the shared BD52xx/BD53xx family table.
#
#   FAN5622SX: its output current is set by an external RSET resistor (5 to
#     30 mA full scale, e.g. 19.10 kOhm for 15 mA) and then scaled by 32 dimming
#     steps clocked in over a SINGLE-WIRE DIGITAL PULSE TRAIN on the CTRL pin.
#     The analog output stage is a current mirror with a ratio of 240 typ from
#     ISET, which is modellable; the brightness level is a pulse-counted DAC
#     state, which is not, and without it the output current is undefined rather
#     than merely approximate. Recorded: VIN 2.7-5.5 V (abs max 6.0 V),
#     VDROPOUT 50 mV typ at 15 mA / 60 mV at 30 mA, ISD 0.3 uA typ (1.0 max),
#     IIN 0.4 mA typ (0.8 max) at VIN=3.6 V with ILED=0, UVLO 2.70 V rising /
#     2.30 falling, TSD 150 C typ with 20 C hysteresis, theta_JA 235 C/W.
#     Source: Fairchild/onsemi FAN5622/24/26 Rev. 1.0.3, cover dated July 2013.
#
#   TPS61169: see the sourced identity card `tps61169_identity` below; it
#     stays OPEN on purpose for the reason recorded there.

# ─────────────────────────────────────────────────────────────────────────────
# MAX6070AAUT18: Maxim/ADI low-noise precision SERIES voltage reference, 1.8 V,
# SOT-23-6.
#
# Source: Maxim Integrated "MAX6070/MAX6071 Low-Noise, High-Precision Series
#   Voltage References", 19-6355 Rev 18, 12/20: the Pin Description table, the
#   "Electrical Characteristics - MAX607__AUT18 (VOUT = 1.800V)" table, the
#   Absolute Maximum Ratings and the SOT23 Package Information.
#
# A SERIES REFERENCE IS A REGULATOR, WHICH IS WHY IT IS `kind = "vreg"`. It takes
# an input rail, sinks a quiescent current, and holds an output pin at a fixed
# voltage against +/-10 mA of load, which is exactly what `bind_vreg`'s ideal
# source models. What separates it from the LDOs in db/vreg.toml is accuracy
# rather than mechanism: +/-0.04% initial on the A grade, 1.5 ppm/C typical drift.
# Neither of those has a field on this schema, so what the simulation gets is a
# perfect 1.800 V, which is the reference's job done better than the real part
# does it. That is the right direction for a reference and the wrong one for a
# tolerance study.
#
# Datasheet figures used (VIN = +5.0 V, IOUT = 0 mA, TA = -40 to +125 C; typicals
# at +25 C):
#   VOUT   = 1.800 V, accuracy +/-0.04% at 25 C on the A grade (B is +/-0.08%)
#   VIN    = 2.7 to 5.5 V (guaranteed by line regulation, 1.8 V option)
#   IIN    = 130 uA typ, 200 uA max at 25 C (260 uA max over temperature)
#   ISD    = 6 uA max, disabled
#   IOUT   = -10 to +10 mA (sink and source)
#   ISC    = 25 mA typ either direction
#   VIH    = 0.7 x VIN, VIL = 0.3 x VIN on EN
#   TCVOUT = 1.5 ppm/C typ, 6 ppm/C max (A grade)
#
# `dropout_v` IS A FAMILY FIGURE, NOT THIS OPTION'S ROW, and that has to be said
# because every other vreg entry's dropout is its own part's. The 1.8 V table omits
# the dropout row, as do the 1.25 V and 2.048 V ones; the options that carry it
# give, at IOUT = 10 mA over temperature, 110 mV typ at 2.5 V, 80 mV at 3.0 V,
# 65 mV at 3.3 V, 75 mV at 4.096 V and 60 mV at 5.0 V. 0.11 V is the LARGEST of
# those, so it is the conservative pick from the same die and the same test
# condition rather than an interpolation into a gap. The datasheet's own headline
# claim is "low 200 mV dropout" and the worst tabulated maximum is 230 mV.
#
# DELIBERATELY NOT MODELLED: the force/sense pair. OUTF and OUTS are separate
# pads meant to be shorted at the load so the reference regulates out the trace
# drop; `bind_vreg` stamps ONE ideal source, on `out`, and OUTS carries a role and
# no device. On a board that ties them together (the margay datalogger does, at
# the pad) the two are one node and nothing is lost; on a board that runs a real
# Kelvin connection, the sense leg is not part of the loop here. Also absent: the
# FILTER pin's noise-bandwidth network, and every accuracy and drift figure above.
#
# EN: the binder gates the output on this pin, but the card states NO `en_*`
# fields, so the gate uses the binder's generic default levels, disclosed as
# assumed. The part's logic levels are ratiometric to VIN: VIH = 0.7 x VIN and
# VIL = 0.3 x VIN (MAX6070/MAX6071 19-6355 Rev 20, 1.8 V option table p.4), which
# `en_on_v`/`en_off_v` (absolute volts) cannot express. Shutdown (p.21) leaves
# the output on a typically 200 kOhm load to ground; EN has no pull (IEN is
# +/-1 uA bias) and the pin description (p.19) states no open-pin state.
[[models]]
id = "max6070_1v8"
kind = "vreg"
description = "MAX6070AAUT18 1.8V precision series voltage reference, +/-0.04%, SOT-23-6"

[models.match]
# The last two digits of the ordering code ARE the output voltage: AUT12 = 1.25 V,
# AUT18 = 1.8 V, AUT21 = 2.048 V, AUT25 = 2.5 V, AUT30 = 3.0 V, AUT33 = 3.3 V,
# AUT41 = 4.096 V, AUT50 = 5.0 V. Only the 18 binds here, for the reason at the head of the
# voltage-option entries in db/vreg.toml: an entry that matched the family would
# hold a 5 V reference net at 1.8 V.
#
# The grade letter before "AUT" is accuracy (A = +/-0.04%, B = +/-0.08%,
# D = +/-0.2%) and is accepted freely, because this entry carries no accuracy
# field for it to contradict. The MAX6071 is deliberately EXCLUDED: it is the same
# reference with a Kelvin GROUND pair (GNDF/GNDS) instead of the MAX6070's single
# GND and FILTER pins, so pads 1 and 2 mean different things on it.
value_re = "(?i)^MAX6070[ABD]AUT18([/A-Z0-9+-]*)?$"

[models.params]
vout      = 1.8       # VOUT, 1.800 V; +/-0.04% initial on the A grade at 25 C
dropout_v = 0.11      # FAMILY figure at IOUT = 10 mA, not the 1.8 V row (which
                      # the datasheet omits). See the note above.
iq_a      = 1.3e-4    # IIN typ 130 uA at 25 C (200 uA max at 25 C, 260 uA max
                      # over temperature)
i_shdn_a  = 6.0e-6    # ISD, 6 uA max: the only shutdown figure in the 1.8 V
                      # option table (p.4); the 2.5/3.0/3.3 V tables (p.6-9)
                      # give 0.6 uA typ and p.21 says "less than 1uA"
en_discharge_ohms = 2.0e5  # output's resistive load to ground in shutdown,
                           # typically 200 kOhm (p.21)

[models.pins]
# Pin Description, MAX6070 column, 6-pin SOT23. Cross-checked against the margay
# datalogger, where pad 1 carries the 0.1 uF filter capacitor, pads 3 and 4 are
# both tied to the auxiliary rail (enabled, and supplied from it), and pads 5 and 6
# are shorted together on the VREF net exactly as the datasheet instructs.
"1" = "filter"   # 0.1 uF to ground for high-frequency bypass; leave open if unused
"2" = "gnd"
"3" = "en"       # drive high to enable; gated by the binder from its default levels, see above
"4" = "in"
"5" = "outs"     # reference sense output; carries a role and no device
"6" = "out"      # OUTF, the force output: the pin the ideal source is stamped on

[models.ratings]
# Absolute Maximum Ratings and the SOT23 Package Information table.
max_current_a = 0.01         # IOUT, +/-10 mA (ISC is 25 mA, a limit not a rating)
max_voltage_v = 6.0          # IN / OUTS / EN to ground, -0.3 to +6 V
max_power_w = 0.3478         # continuous dissipation at TA = +70 C, SOT23,
                             # derate 4.3 mW/C above +70 C
max_junction_temp_c = 150.0
theta_ja_c_per_w = 230.0     # multi-layer board
theta_jc_c_per_w = 76.0

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"

[[models.source.characteristic]]
parameter = "Continuous power dissipation, SOT23"
rating = "max_power_w"
max = 0.3478
unit = "W"
conditions = "TA = 70 °C"
basis = "Analog Devices MAX6070/MAX6071 19-6355 Rev 20 (4/25), Absolute Maximum Ratings, Continuous Power Dissipation (TA = +70°C) SOT23 (derate 4.3mW/°C above +70°C) 347.8 mW"
[[models.source.characteristic]]
parameter = "Junction to ambient (θJA), 6 SOT23"
rating = "theta_ja_c_per_w"
max = 230.0
unit = "°C/W"
conditions = "multi-layer board, JESD51-7"
basis = "Analog Devices MAX6070/MAX6071 19-6355 Rev 20 (4/25), Package Information, 6 SOT23, Thermal Resistance, Multi-Layer Board, θJA 230 °C/W"
[[models.source.characteristic]]
parameter = "Junction to case (θJC), 6 SOT23"
rating = "theta_jc_c_per_w"
max = 76.0
unit = "°C/W"
conditions = "multi-layer board, JESD51-7"
basis = "Analog Devices MAX6070/MAX6071 19-6355 Rev 20 (4/25), Package Information, 6 SOT23, Thermal Resistance, Multi-Layer Board, θJC 76 °C/W"

