# Behavioural models for power ICs (chargers, balancers, PMICs).
#
# These parts carry internal logic (regulation loops, ship-mode pulls,
# balancing FETs) that the SPICE-level kinds cannot express, so each entry has
# a [models.behavioral] block (pins/pulls, averaged converter, expression laws)
# that the engine's behavioural runtime stamps and iterates between solver
# chunks. Pin maps are the manufacturer pinout; cited inline.
#
# Calibrated against the MNT Reform and ZSWatch DevKit revision faults in
# docs/record/KNOWN_FAULTS_VALIDATION.md. Where a value is programmed by an on-board
# resistor (the LTC4020 ILIMIT / RSENSE), the model reads the board reference
# designator at bind time, so changing the board resistor changes the behaviour
# with no model edit, exactly the way the real revision fixes landed.

# ── LTC4020: 55V buck-boost battery charger controller ────────────────────────
#
# MNT Reform motherboard U2. The averaged buck-boost block charges the 8S
# LiFePO4 pack (BAT) from the laptop brick (PVIN) with an input-current limit
# programmed by the ILIMIT resistor R8 against the input sense shunt R49. The
# documented mb2.5->3.0 fault: R8 = 100k programs the input limit too high, so
# the charger over-draws (~88 W from a 60 W brick); the fix is R8 = 7.15k, which
# drops the limit to ~60 W. The model reads R8 and R49 off the board, so the two
# revisions diverge with no model change.
[[models]]
id = "ltc4020"
kind = "vreg"
description = "LTC4020 buck-boost battery charger (behavioural: input-current-limited buck-boost)"

[models.match]
value_re = "(?i)LTC4020"

[models.params]
# vreg liveness params (the binder's vreg path also stamps an output rail); the
# real behaviour is in [models.behavioral.converter] below.
vout = 14.4        # nominal charge-rail seed (overridden by the converter setpoint)
dropout_v = 0.5
iq_a = 0.001

[models.pins]
# Manufacturer pinout (QFN-38), the subset the behaviour needs.
# Source: LTC4020 datasheet pin functions; cross-checked against the Reform
# reform2-power schematic symbol pin list.
"5"  = "sensbot"   # SENSBOT, input current sense (bottom)
"6"  = "senstop"   # SENSTOP, input current sense (top)
"7"  = "sensvin"   # SENSVIN, input supply sense
"15" = "rng_ss"    # RNG/SS, frequency range + soft-start (the mb2.0->2.5 pin)
"20" = "bat"       # BAT, battery / charge output
"22" = "csn"       # CSN, battery current sense (-)
"23" = "csp"       # CSP, battery current sense (+)
"25" = "ilimit"    # ILIMIT, input-current-limit program pin (R8)
"36" = "pvin"      # PVIN, power input

[models.ratings]
max_voltage_v = 55.0      # VIN abs max (datasheet)
max_junction_temp_c = 125.0

[models.behavioral.converter]
topology = "buck_boost"
out_pin = "bat"
in_pin = "pvin"
# 8S LiFePO4 charge voltage: 8 * 3.6 V = 28.8 V CV target.
vout_setpoint = 28.8
efficiency = 0.92          # datasheet high-efficiency buck-boost
out_r_ohms = 0.01

# Input-current limit programmed by the ILIMIT resistor (R8) against the input
# sense shunt (R49). Linear-in-R8 up to a full-scale ceiling, then i = vsense /
# rsense. Calibrated so the two real board values straddle a 60 W brick at a
# ~19 V laptop adapter:
#   R8 = 7.15k (mb3.0 fix): vsense = 0.0316 V -> 3.16 A -> ~60 W  (in budget)
#   R8 = 100k  (mb2.5 fault): saturates at 0.0463 V -> 4.63 A -> ~88 W (overdraw)
# rsense reads R49 (0.01 ohm) off the board; prog reads R8.
[models.behavioral.converter.iin_program]
rsense_ref = "R49"
rsense_ohms = 0.01         # fallback if R49 is not found on the board
prog_ref = "R8"
prog_ohms = 100000.0       # fallback (the faulty value) if R8 is not found
vprog_ref = 0.0316         # sense threshold at prog = prog_ref_ohms
prog_ref_ohms = 7150.0     # the resistor that programs the 60 W (~3.16 A) point
v_sense_full = 0.0463      # full-scale sense voltage (~4.63 A / ~88 W ceiling)

# RNG/SS dual role (the mb2.0->2.5 fault): when the RNG/SS pin is driven by an
# external GPIO (mb2.0 wired CHG_RNG to the LPC), toggling it mid-operation
# disturbs the converter's soft-start/frequency and destabilises the system
# DC/DC. Modelled as an FSM: the converter is "stable" while RNG/SS sits at its
# fixed bias, but a GPIO that pulls RNG/SS low (below 0.4 V) trips it to
# "destabilised" until RNG/SS returns. On mb2.5+ the pin is left unconnected, so
# v_rng_ss floats at the internal bias and the guard never fires.
[models.behavioral.fsm]
states = ["stable", "destabilised"]

[[models.behavioral.fsm.transitions]]
from = "stable"
to = "destabilised"
guard = "v_rng_ss < 0.4"

[[models.behavioral.fsm.transitions]]
from = "destabilised"
to = "stable"
guard = "v_rng_ss > 0.8"
min_dwell_s = 0.001

# ── LTC6803-4: multicell battery stack monitor / balancer ─────────────────────
#
# MNT Reform motherboard U4. Monitors the 8S LiFePO4 stack and balances cells by
# switching internal FETs that bleed a cell through its external series resistor.
# The documented mb2.0->2.5 fault: the four UNUSED upper cell inputs (C9..C12)
# were tied to the top-of-pack rail (BAT1FUSED) through a single 100 ohm resistor
# (R52). When the balancing logic fires on an absent cell position, current
# leaks through that 100 ohm path. The mb2.5 fix replaces R52 with a Schottky
# diode (D30) that blocks the reverse leak. We model the leak as an expression
# law: a current from the tied upper-cell node to ground proportional to the node
# voltage over the tie resistance, active while balancing. The board's tie
# resistance (R52) is read in; when it is absent (replaced by the diode) the
# leak path is gone and the law contributes nothing.
[[models]]
id = "ltc6803_4"
kind = "digital"
description = "LTC6803-4 cell-stack monitor/balancer (behavioural: absent-cell balancer leak)"

[models.match]
value_re = "(?i)LTC6803"

[models.pins]
# 44-pin SSOP; the subset the leak needs. The unused upper cell inputs C9..C12
# are commoned on the Reform; we bind the C9 pad as the representative node of
# that commoned net.
# Source: LTC6803-4 datasheet pin functions; Reform reform2-motherboard cache lib.
"1"  = "vplus"     # V+, top of stack
"8"  = "c9"        # C9 (representative of the commoned unused C9..C12 inputs)
"27" = "vminus"    # V-, stack bottom = GND

[models.params]
# The external tie resistance from the commoned upper-cell inputs to the
# top-of-pack rail. The `_from_ref` convention tells the binder to read the named
# board resistor (R52) into `tie_ohms` at bind time. When the board has no such
# resistor (the mb2.5 fix replaced R52 with a blocking Schottky diode), the
# binder substitutes a large open resistance, so the leak law contributes ~0.
# `tie_ohms` itself is the fallback (the faulty mb2.0 value) if neither the ref
# nor the override is found.
tie_ohms = 100.0
tie_ohms_from_ref = "R52"

# Balancer leak through the absent-cell tie network: a continuous current bled
# from the top-of-pack rail (V+) to the stack bottom (V-) equal to
# v_vplus / tie_ohms. This is the wasted current the unused-cell tie network
# draws. With the 100 ohm mb2.0 tie (R52) and the ~28 V pack top this is a large
# continuous leak; the mb2.5 fix replaces R52 with a blocking Schottky (D30), so
# the binder sets tie_ohms to a huge open resistance and the leak is ~0.
[[models.behavioral.laws]]
name = "absent_cell_leak"
kind = "current"
a = "vplus"
b = "vminus"
expr = "v_vplus / tie_ohms"

# ── nPM1300: Nordic PMIC ──────────────────────────────────────────────────────
#
# ZSWatch DevKit IC401. Two bucks, two LDO/loadswitches, USB-C charger. The
# documented 1.2.0->1.2.1 fault (#155): the SHPHLD (ship-hold) pin has an
# INTERNAL pull-up to VSYS, and 1.2.0 also wired SHPHLD to an MCU GPIO. In sleep
# the GPIO goes high-Z and VSYS back-drives it through the internal pull. The fix
# (1.2.1) disconnects the GPIO from SHPHLD. The model carries the internal pull
# to VSYS so the engine sees the GPIO being pulled to a rail; on 1.2.0 (GPIO on
# the SHPHLD net) the pull reaches the GPIO, on 1.2.1 (GPIO removed) it does not.
[[models]]
id = "npm1300"
kind = "vreg"
description = "Nordic nPM1300 PMIC (behavioural: SHPHLD internal pull-up to VSYS + bucks)"

[models.match]
value_re = "(?i)nPM1300"

[models.params]
# KNOWN GAP: this seeds the vreg path for BUCK1, but no BUCK1 pin is mapped
# below, so the binder finds no output net and the part reports "vreg output
# not connected" on any board carrying it. The seven mapped pins are the ones
# the ship-hold behaviour needs. Filling it means the real BUCK1 output pin
# number from the Nordic nPM1300 datasheet; guessing one would regulate
# whatever net happened to sit on that pin. Exempted by name in
# tests/pin_roles.rs so that test still guards every other model.
vout = 1.8          # liveness seed for the vreg path (BUCK1)
dropout_v = 0.2
iq_a = 0.001

[models.pins]
# QFN-32 (+EP). Source: nPM1300 datasheet pin functions; ZSWatch DevKit Power
# schematic symbol pin list.
"4"  = "vdd_core"  # V_DD, PMIC core supply (from VSYS)
"13" = "sda"       # I2C SDA
"14" = "scl"       # I2C SCL
"15" = "shphld"    # SHPHLD, ship-hold (internal pull-up to VSYS) -- the fault pin
"19" = "vbat"      # V_BAT, battery
"20" = "vsys"      # V_SYS, system rail
"21" = "vbus"      # V_BUS, USB input

[models.ratings]
max_voltage_v = 5.5       # VBUS abs max (datasheet)

[models.behavioral.pins.shphld]
# The internal pull-up from SHPHLD to VSYS. Nordic specs a strong ship-hold pull
# (on the order of a few hundred kohm). When SHPHLD is on a net that also carries
# an MCU GPIO (the 1.2.0 fault), this pull feeds VSYS into the GPIO in sleep.
pull_to = "vsys"
pull_ohms = 100000.0

# ── bq76952: TI battery AFE / stack monitor ───────────────────────────────────
#
# Source: Texas Instruments bq76952 datasheet, SLUSDX9C (Rev C, 2021).
# 16-series battery monitor and protector with integrated AFE, coulomb counter,
# and I2C/SPI interface.
#
# NOTE: The internal AFE behaviour (voltage measurement, protection FET control,
# coulomb counter, I2C register map) is NOT fully modeled here. This is a
# MINIMAL RESOLVING ENTRY: the part binds with correct ratings and a pin subset
# so dissipation / Tj / supply-voltage checking become possible. An extracted
# or hand-written behavioral block would be needed for pack-level simulation.
# This entry is honest about what it does and does not model.
#
# Key absolute maximum ratings (bq76952 datasheet Table 7.1):
#   VPACK (battery stack input) abs max = 85V
#   VREGx digital supply abs max = 3.8V
#   Tj max = 125C
[[models]]
id = "bq76952"
kind = "digital"
description = "TI bq76952 battery AFE / monitor (minimal-resolve; internal AFE not modeled)"

[models.match]
value_re = "(?i)^bq76952"

[models.pins]
# TQFP-64 / VQFN-64. Subset required for supply / voltage checking.
# Source: bq76952 datasheet SLUSDX9C, Table 8.1 Pin Functions.
"1"  = "pack_p"   # PACK+ (battery pack positive input)
"2"  = "pack_n"   # PACK- / REGSRC (battery pack negative / regulator source)
"27" = "vreg1"    # VREG1 (3.3V regulated supply output)
"28" = "vreg2"    # VREG2 (3.3V regulated supply for AFE)
"33" = "sda"      # I2C SDA
"34" = "scl"      # I2C SCL
"57" = "dsg"      # DSG (discharge FET drive)
"58" = "chg"      # CHG (charge FET drive)
"64" = "ts1"      # TS1 (temperature sense 1)

[models.ratings]
# Source: bq76952 datasheet SLUSDX9C, Table 7.1 Absolute Maximum Ratings
max_voltage_v       = 85.0    # VPACK abs max (V), datasheet, stack voltage limit
max_junction_temp_c = 125.0   # Tj max (C), datasheet

# ── LM5107 / LM5109: TI half-bridge gate drivers ─────────────────────────────
#
# Source: Texas Instruments LM5107 datasheet, SNVSA29B (Rev B, 2015).
#         Texas Instruments LM5109 datasheet, SNVSA31C (Rev C, 2017).
#
# LM5107: 3A/3A half-bridge gate driver, non-inverting (HIN/LIN both active high).
#   VDD abs max = 15V; bootstrap / HB high-side supply abs max = 120V.
# LM5109: 3A/3A half-bridge gate driver, LIN active-low (inverted low-side input).
#   Same pin map and ratings as LM5107 with inverted LIN polarity.
#
# Application: mppt-1210 board U1=LM5109BMA (WSON-8 package).
# NOTE: The internal dead-time / level-shift behaviour is NOT modeled.
# These are MINIMAL RESOLVING ENTRIES providing supply/bootstrap ratings so
# the gate-drive rails are checked for over-voltage.
[[models]]
id = "lm5107"
kind = "digital"
description = "TI LM5107 half-bridge gate driver 3A, non-inverting (minimal-resolve)"

[models.match]
# Matches LM5107 variants (LM5107SD, LM5107SDX, etc.)
value_re = "(?i)^LM5107"

[models.params]
# Source: LM5107 datasheet SNVSA29B, Table 7.5 Electrical Characteristics.
voh       = 11.5   # HO/LO output high (V) approx at VDD=12V (representative)
vol       = 0.3    # HO/LO output low (V) typ
vih       = 2.5    # HIN/LIN high threshold (V) typ
vil       = 0.8    # HIN/LIN low threshold (V) typ

[models.pins]
# WSON-8 / SOIC-8. Source: LM5107 datasheet SNVSA29B, Section 7.1 Pin Functions.
"1" = "hin"   # High-side input (active high)
"2" = "lin"   # Low-side input (active high for LM5107)
"3" = "vdd"   # Supply (VDD, 8-15V range)
"4" = "gnd"   # Ground
"5" = "lo"    # Low-side gate drive output
"6" = "hs"    # High-side source / bootstrap ground
"7" = "ho"    # High-side gate drive output
"8" = "hb"    # Bootstrap supply (VDD + boost diode; high abs max)

[models.ratings]
# Source: LM5107 datasheet SNVSA29B, Table 7.1 Absolute Maximum Ratings.
# VDD abs max = 15V; HB (bootstrap) abs max = 120V (HB-to-GND).
max_voltage_v       = 15.0    # VDD abs max (V), datasheet
max_junction_temp_c = 150.0   # Tj max (C), datasheet

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "lm5109"
kind = "digital"
description = "TI LM5109 half-bridge gate driver 3A, LIN active-low (minimal-resolve)"

[models.match]
# Matches LM5109 variants (LM5109BMA, LM5109BSDx, LM5109SDx, etc.)
value_re = "(?i)^LM5109"

[models.params]
# Source: LM5109 datasheet SNVSA31C, Table 7.5 Electrical Characteristics.
# Identical to LM5107 except LIN polarity is inverted (active-low).
voh       = 11.5
vol       = 0.3
vih       = 2.5
vil       = 0.8

[models.pins]
# WSON-8 / SOIC-8. Source: LM5109 datasheet SNVSA31C, Section 7.1 Pin Functions.
# Same physical pin map as LM5107; LIN is active-low in this variant.
"1" = "hin"   # High-side input (active high)
"2" = "lin"   # Low-side input (active LOW for LM5109, inverted vs LM5107)
"3" = "vdd"   # Supply
"4" = "gnd"   # Ground
"5" = "lo"    # Low-side gate drive output
"6" = "hs"    # High-side source / bootstrap ground
"7" = "ho"    # High-side gate drive output
"8" = "hb"    # Bootstrap supply

[models.ratings]
# Source: LM5109 datasheet SNVSA31C, Table 7.1 Absolute Maximum Ratings.
max_voltage_v       = 15.0    # VDD abs max (V), datasheet
max_junction_temp_c = 150.0   # Tj max (C), datasheet

# ── TP4054: 800 mA single-cell Li-ion linear charger, SOT-23-5 ────────────────
#
# Watchy U3. A constant-current / constant-voltage linear charger: it drives
# BAT from VCC at a current the PROG resistor programs, until the cell reaches
# the fixed 4.2 V float, then holds that voltage while the current tapers.
#
# Source: NanJing Top Power ASIC Corp "TP4054, 800mA Standalone Linear Li-Ion
#   Battery Charger with Thermal Regulation in SOT-23-5", datasheet rev 1.4.
#
# Datasheet figures used (Electrical Characteristics, VCC = 5 V, TA = 25 C
# unless noted):
#   VFLOAT   = 4.2 V +/-1%              the regulated cell voltage
#   IBAT     = 1000 / RPROG (A)         @ RPROG in ohms, current-mode
#                                        (RPROG = 10k gives 100 mA; watchy fits
#                                         a 5k1, which programs ~196 mA)
#   VCC      = 4.25 V to 6.5 V          recommended operating input
#   ICC(sd)  = 50 uA typ                @ standby, charge terminated
#   VUVLO    = 3.8 V typ (rising)       under-voltage lockout
#   RON      = 0.4 ohm typ              internal pass element, VCC = 5 V
#   ITERM    = 0.1 * IBAT               charge terminates at C/10
#
# MODELLED AS a voltage source behind the pass element, which is what the board
# can observe: the rail the cell sits on, how hard it is driven, and what the
# charger draws while doing it. The CC-to-CV handover is a current limit on that
# source, so a discharged cell sees the programmed current and a full one sees
# the float voltage, which is the behaviour every other part on this board
# reacts to.
#
# DELIBERATELY NOT MODELLED, because the datasheet's numbers do not support it
# and a plausible guess would be worse than the gap: the thermal-regulation loop
# that folds IBAT back above 120 C die temperature (stated as a behaviour, with
# no transfer function given), the recharge-threshold hysteresis, and the
# CHRG pin's open-drain status timing. None of them change a rail voltage on
# this board, which is what hauksbee is asked about here.
[[models]]
id = "tp4054"
kind = "vreg"
description = "TP4054 single-cell Li-ion linear charger (behavioural: CC/CV to a 4.2 V float)"

[models.match]
value_re = "(?i)TP4054"

[models.params]
# The float voltage IS the output rail once the cell is charged, which is the
# steady state a board check cares about.
vout = 4.2
# VCC - VBAT headroom the pass element needs. At the 800 mA ceiling and
# RON = 0.4 ohm that is 0.32 V; 0.4 V is the honest round number and stays
# above the measured drop rather than under it.
dropout_v = 0.4
iq_a = 0.00005     # 50 uA standby, datasheet typ

[models.pins]
# SOT-23-5 pinout, datasheet Pin Configuration. The role names are the BINDER's
# vocabulary, not the datasheet's: the vreg path looks for `out` and `in`, so
# naming pin 3 "bat" after the datasheet left the model matching the part and
# then reporting "vreg output not connected", which reads as a board fault
# rather than a model that named its own pins wrongly.
"1" = "temp"       # TEMP, battery thermistor sense
"2" = "gnd"
"3" = "out"        # BAT on the datasheet: charge current out to the cell
"4" = "in"         # VCC on the datasheet: input supply
"5" = "prog"       # PROG, charge-current program resistor to ground

[models.ratings]
# Abs max VCC is 8 V; the recommended ceiling is 6.5 V, and a check should fire
# on the recommended limit rather than waiting for the destruct limit.
max_voltage_v = 6.5
max_junction_temp_c = 125.0
