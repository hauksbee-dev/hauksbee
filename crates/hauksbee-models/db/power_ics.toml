# ── R1218N: Ricoh/Nisshinbo step-up DC/DC for white-LED backlight, SOT-23-6 ──
#
# Source: Nisshinbo Micro Devices (formerly Ricoh) "R1218x Series Step-up
#   DC/DC converter for White LED Backlight", No. EA-166-230419: SELECTION GUIDE
#   (p.2), PIN DESCRIPTIONS (p.4), ABSOLUTE MAXIMUM RATINGS and RECOMMENDED
#   OPERATING CONDITIONS (p.5), ELECTRICAL CHARACTERISTICS (p.6). PDF sha256
#   ad74f60bda9195c11634a1fefaa04ae0015592ac145ae36bac9ba7d7a0e2ec34. No
#   canonical vendor URL could be confirmed offline, so none is given.
#
# WHY IDENTITY-ONLY. Like the TPS61169 this is an LED-CURRENT regulator: VFB is
# held at 0.20 V (0.19/0.20/0.21 V) across the board's sense resistor, so
# ILED = 0.2 V / RSET; 0.2 V is a current-sense reference, never an output
# voltage, and is deliberately NOT a `vref` param (on a vreg card `vref` means
# an adjustable LDO whose divider sets the rail). Unlike the TPS61169 it does
# have a VOUT pin (the built-in diode's cathode on xxx1A, the OVP sense on
# xxx2A), so an averaged boost with `out_pin = "out"` and FB feedback is
# topologically expressible. It is still not modelled because (a) the LED
# string that closes the FB loop is normally off-board (on open-book it sits in
# the e-paper display behind FPC J4), so the averaged loop would never reach
# 0.2 V on FB and would wind the output up without the OVP clamp; (b) the OVP
# threshold, and with it the VOUT/LX abs max, depends on the order code
# (9.5/14/18.5 V with built-in diode, 23/27.5/31.5 V without), which a bare
# "R1218" value does not carry; (c) CE is a PWM-dimming input with a 10 ms
# shutdown delay. The card resolves identity, pins, supply envelope and
# ratings and leaves the part OPEN.
#
# PACKAGE HAZARD. The two packages do NOT share a pin order:
#   SOT-23-6      : 1 CE, 2 VOUT, 3 VIN, 4 Lx, 5 GND, 6 VFB   (R1218N...)
#   DFN(PL)1820-6 : 1 CE, 2 VFB, 3 Lx, 4 GND, 5 VIN, 6 VOUT   (R1218K..., discontinued April 2023)
# This card takes the SOT-23-6 map only: an R1218N order code, or a bare
# "R1218" gated on a SOT-23-6 footprint. R1218K is rejected.
#
# PIN MAP CHECK (open-book OSO-BOOK-B1 U5, Package_TO_SOT_SMD:SOT-23-6, symbol
# R1218:R1218): 1 CE -> /BACKLIGHT (U2 GPIO46); 2 VOUT -> /+17V (J4 pins 5-6,
# display backlight anode); 3 VIN -> +3.3VP (also L2.1); 4 LX -> L2.2 only;
# 5 GND; 6 VFB -> /FEEDBACK (R8 to GND, J4 pins 1-2 LED return). LX has no
# external Schottky, so the fitted part must be a built-in-diode xxx1A code
# (021A/031A/041A, OVP 9.5/14/18.5 V, VOUT/LX abs max 22 V); the "+17V" net
# name points at 041A (OVP 17.0/18.5/20.0 V) but the board value does not say.
#
# Corrections vs the unreviewed LLM draft: the draft had two variant cards
# (K and N) that BOTH matched a bare "R1218", so the board's SOT-23-6 part
# could take the DFN pin map; dropped the K card and gated the bare value on
# footprint. Dropped `vref` (current-sense reference mis-typed as a vreg
# reference). `max_power_w` 0.66 W is the JEDEC 51-7 land-pattern figure (kept,
# labelled). Recorded the CE pull-down, UVLO, OVP-by-code and Lx limit rows.
[[models]]
id = "r1218n_identity"
kind = "vreg"
description = "Ricoh/Nisshinbo R1218N step-up white-LED driver, SOT-23-6 (identity, pins, supply envelope and ratings only; boost conversion and LED-current regulation are not modeled, the part stays OPEN)"

[models.match]
# R1218N<code>A[-TR-FE] or a bare R1218; both only on a SOT-23-6 footprint.
value_re = "(?i)^R1218(?:N(?:0[234]1A|0[567]2A)(?:-TR(?:-FE)?)?)?$"
footprint_re = "(?i)SOT-?23-?6"

[models.params]
identity_only = true
warning = "R1218N identity, SOT-23-6 pin map, VIN envelope and ratings are sourced; boost conversion, LED-current regulation (VFB = 0.2 V across the board's sense resistor), OVP and CE PWM dimming are not modeled, so the part stays OPEN"
unlocked_by = "an averaged boost converter with a current-sense FB loop, a code-specific OVP clamp, and an LED-string load model for off-board displays"
iq_a = 5.0e-4   # IDD typ 0.5 mA (1.0 max) @ VIN = 5.5 V, VFB = 0 V, Lx no load

[models.pins]
# SOT-23-6, EA-166-230419 PIN DESCRIPTIONS (p.4).
"1" = "en"     # CE, chip enable ("H" active), 600/1200/2200 kOhm pull-down; PWM dimming input
"2" = "out"    # VOUT, output (built-in diode cathode on xxx1A; OVP sense)
"3" = "in"     # VIN
"4" = "sw"     # Lx, switching pin (open-drain NMOS)
"5" = "gnd"    # GND
"6" = "fb"     # VFB, feedback (LED current sense, 0.2 V)

[models.ratings]
max_voltage_v = 6.5          # VIN pin abs max
max_power_w = 0.66           # PD, SOT-23-6, JEDEC STD 51-7 test land pattern
max_junction_temp_c = 125.0  # Tj range upper end
max_pin_current_a = 1.0      # ILX, Lx pin current abs max

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"

[[models.source.references]]
title = "Nisshinbo Micro Devices (Ricoh) R1218x Series Step-up DC/DC converter for White LED Backlight, No. EA-166-230419"
locator = "SELECTION GUIDE p.2; PIN DESCRIPTIONS p.4 (SOT-23-6 Pin Description); ABSOLUTE MAXIMUM RATINGS and RECOMMENDED OPERATING CONDITIONS p.5; ELECTRICAL CHARACTERISTICS p.6"
