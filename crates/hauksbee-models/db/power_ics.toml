# ── TPS61169: TI 40 V asynchronous boost WLED driver, DCK (SC70-5) ──────────
#
# Source: Texas Instruments "TPS61169 38V High Current-Boost WLED Driver With
#   PWM Control", SNVSA40B, October 2014, revised June 2024:
#   Figure 4-1 / Table 4-1 Pin Functions (p.3), 5.1 Absolute Maximum Ratings,
#   5.3 Recommended Operating Conditions, 5.4 Thermal Information (p.4),
#   5.5 Electrical Characteristics (p.5), 6.3.4 Current Program and 6.3.5 LED
#   Brightness Dimming (p.8-9), 10 Package Option Addendum.
#   PDF sha256 7d0b8ace2459a9fd22fe7145086cbad4ccb3bb43219247459313fcba75230151
#   (https://www.ti.com/lit/ds/symlink/tps61169.pdf).
#
# WHY IDENTITY-ONLY. The regulated quantity is the LED CURRENT: FB is held at
# VREF = 204 mV (188/204/220 mV, 100 % duty) across the board's sense resistor
# RSET, ILED = VFB / RSET (Eq. 1), and VFB = Duty x 204 mV under PWM on CTRL
# (Eq. 2). 204 mV is a current-sense reference, never an output voltage, so it
# is deliberately NOT a `vout`/`vref` param here (a reader of a vreg card must
# not mistake it for a rail). The part has NO output pin: the output node is
# the cathode of the board's external Schottky; the IC pins are SW, GND, FB,
# CTRL, VIN. `[models.behavioral.converter]` needs `out_pin` to be an IC pin,
# and the only candidate, SW, is tied to VIN through the boost inductor, which
# the averaged loop treats as a DC short (`regulated_node` follows that inductor
# back to VIN). Injecting the averaged current into SW would push it into the
# input rail and FB would never reach 204 mV: a saturated converter heating the
# input rail. So the card resolves identity, pins, ratings and envelopes and
# leaves the part OPEN; `bind` keeps reporting U3 as active-path-unresolved,
# which is the truthful state. Unlocked by a converter output that can name an
# external node (the rectifier cathode) and a current-sense feedback.
#
# PIN MAP CHECK (Adafruit TPS61169 LED driver board, package SC70-5 pads
# 1-2-3 bottom row, 4-5 top row): U3.1 -> N$5 (L1 + D2 anode) = SW; U3.2 -> GND;
# U3.3 -> LEDK (R7 8.2 ohm to GND, LED cathode terminal X1.1) = FB;
# U3.4 -> PWM (R1 10k to VIN) = CTRL; U3.5 -> VIN (C7, L1) = VIN. Matches
# Table 4-1. On that board ILED = 204 mV / 8.2 ohm = 24.9 mA typ with all DIP
# positions off; the LED string is off-board (X1), so there is no on-board
# load whose current could be checked even with a behavioural model.
#
# Corrections vs the unreviewed LLM draft: dropped the `vref` param (204 mV
# mis-typed as a vreg reference with unit "mV"); dropped the "VIN falling typ
# 2.0 V" pairing (the 2 V typ in Table 5.5 sits between the rising and falling
# rows and is not attributable to either, so it is recorded as an unattributed
# typ); added the SW 40 V and CTRL/FB 7 V abs-max envelopes, theta_JA and the
# orderable-code match.
[[models]]
id = "tps61169_identity"
kind = "vreg"
description = "TI TPS61169 boost WLED driver, DCK SC70-5 (identity, pins, ratings and pin envelopes only; boost conversion and LED-current regulation are not modeled, the part stays OPEN)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"

[[models.source.references]]
