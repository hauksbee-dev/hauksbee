locator = "Figure 4-1 and Table 4-1 Pin Functions (p.3); Sections 5.1, 5.3, 5.4 (p.4); 5.5 Electrical Characteristics (p.5); 6.3.4 Current Program and 6.3.5 LED Brightness Dimming; Section 10 Package Option Addendum"
