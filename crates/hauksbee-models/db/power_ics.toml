# TPD4EUSB30, Texas Instruments SLVSAC2G (revised June 2021):
# https://www.ti.com/lit/ds/symlink/tpd4eusb30.pdf
# Four rail-to-ground TVS channels. The laws use the sourced 7 V minimum
# positive breakdown, 0.8 V typical negative forward clamp and 0.6 Ohm dynamic
# resistance. They are intentionally solver-implicit so the clamp conductance
# is in Newton's Jacobian instead of lagging one scheduler chunk behind.
[[models]]
id = "tpd4eusb30_dqa"
kind = "digital"
description = "TPD4EUSB30 four-channel USB ESD clamp, DQA-10"

[models.match]
value_re = "(?i)^TPD4EUSB30[A-Z0-9_-]*$"
mpn_re = "(?i)^TPD4EUSB30"

[models.pins]
"1" = "d1p"
"2" = "d1n"
"3" = "gnd"
"4" = "d2p"
"5" = "d2n"
"6" = "nc_1"
"7" = "nc_2"
"8" = "gnd"
"9" = "nc_3"
"10" = "nc_4"

[models.params]
vbreak_v = 7.0
vf_v = 0.8
rdyn_ohms = 0.6
warning = "source-bound piecewise-linear clamp model: four positive-breakdown and negative-forward paths are executable; 0.8 pF channel capacitance, sub-threshold leakage, IEC pulse waveform, temperature dependence and package parasitics are not represented"

[[models.behavioral.laws]]
name = "d1p_clamp"
kind = "current"
a = "d1p"
b = "gnd"
expr = "max(0.0, v_d1p - vbreak_v) / rdyn_ohms + min(0.0, v_d1p + vf_v) / rdyn_ohms"

[[models.behavioral.laws]]
name = "d1n_clamp"
kind = "current"
a = "d1n"
b = "gnd"
expr = "max(0.0, v_d1n - vbreak_v) / rdyn_ohms + min(0.0, v_d1n + vf_v) / rdyn_ohms"

[[models.behavioral.laws]]
name = "d2p_clamp"
kind = "current"
a = "d2p"
b = "gnd"
expr = "max(0.0, v_d2p - vbreak_v) / rdyn_ohms + min(0.0, v_d2p + vf_v) / rdyn_ohms"

[[models.behavioral.laws]]
name = "d2n_clamp"
kind = "current"
a = "d2n"
b = "gnd"
expr = "max(0.0, v_d2n - vbreak_v) / rdyn_ohms + min(0.0, v_d2n + vf_v) / rdyn_ohms"

[models.ratings]
max_voltage_v = 5.5

[models.coverage]
implements = ["esd_clamp", "negative_clamp", "positive_breakdown"]
missing = ["channel_capacitance", "iec_pulse_waveform", "package_parasitics", "subthreshold_leakage", "temperature_dependence"]

[models.source]
tier = "datasheet-derived"
validation = "physical-bounds-only"
