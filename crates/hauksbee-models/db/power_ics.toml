# ── TP4054: 400 mA single-cell Li-ion linear charger, SOT-23-5 ────────────────
#
# Watchy U3. A constant-current / constant-voltage linear charger: it drives
# BAT from VCC at a current the PROG resistor programs, until the cell reaches
# the fixed 4.2 V float, then holds that voltage while the current tapers.
#
# Source: NanJing Top Power ASIC Corp "TP4054 (400mA Linear Li-Ion Battery
#   Charger)", official datasheet Rev 2.1. The board value does not identify an
#   older die revision, so the current manufacturer document is authoritative.
# Primary source, pp. 3-6:
# https://www.toppwr.com/uploadfile/file/20240913/66e3d01d4c944.pdf
#
# Datasheet figures used (Electrical Characteristics, VCC = 5 V, TA = 25 C
# unless noted):
#   VFLOAT   = 4.2 V +/-1%              the regulated cell voltage
#   IBAT     = 1000 / RPROG (A)         at or below 150 mA
#   RPROG    = 1000/IBAT*(1.2-4/3*IBAT) above 150 mA
#                                        (Watchy's R3 is 10k -> 100 mA)
#   IBAT     = 400 mA nominal           @ RPROG = 1.66k (340..460 mA)
#   VCC      = 4.0 V to 8.0 V           electrical-characteristics range
#   ICC      = 45 uA typ                standby/shutdown
#   VUVLO    = 3.6 V typ (rising)       under-voltage lockout
#   ITERM    = 0.1 * IBAT               charge terminates at C/10
#
# MODEL COVERAGE IS SPLIT AND EXPLICIT. Dynamic circuit binding stamps the 4.2 V
# CV source and its declared headroom only; it does not implement the CC-to-CV
# state machine or a solver current limit. Static ampacity may use the PROG law
# as the worst-case regulated charge current because it is tagged
# `regulated_current`. Do not read that static attribution as dynamic CC/CV
# behaviour.
#
# DELIBERATELY NOT MODELLED, because the datasheet's numbers do not support it
# and a plausible guess would be worse than the gap: the thermal-regulation loop
# that folds IBAT back above 120 C die temperature (stated as a behaviour, with
# no transfer function given), the recharge-threshold hysteresis, and the
# CHRG pin's open-drain status timing. None of them change a rail voltage on
# this board, which is what hauksbee is asked about here.
[[models]]
id = "tp4054"
kind = "vreg"
description = "TP4054 charger (dynamic model: 4.2 V CV source; static model: PROG-regulated current)"

[models.match]
value_re = "(?i)TP4054"

[models.params]
# The float voltage IS the output rail once the cell is charged, which is the
# steady state a board check cares about.
vout = 4.2
# Rev 2.1 does not publish a rated-current dropout curve. Keep the conservative
# 0.4 V solver headroom rather than infer one from the 30 mV sleep-mode threshold;
# this can under-predict delivery, but cannot invent headroom the sheet promises.
dropout_v = 0.4
iq_a = 0.000045    # 45 uA standby/shutdown, datasheet typ

[models.pins]
# SOT-23-5 pinout, datasheet Pin Configuration. The role names are the BINDER's
# vocabulary, not the datasheet's: the vreg path looks for `out` and `in`, so
# naming pin 3 "bat" after the datasheet left the model matching the part and
# then reporting "vreg output not connected", which reads as a board fault
# rather than a model that named its own pins wrongly.
"1" = "chrg_n"     # CHRG, open-drain charging-status output
"2" = "gnd"
"3" = "out"        # BAT on the datasheet: charge current out to the cell
"4" = "in"         # VCC on the datasheet: input supply
"5" = "prog"       # PROG, charge-current program resistor to ground

[models.ratings]
max_current_a = 0.8          # BAT-pin absolute maximum, not operating capability
max_voltage_v = 8.0          # VCC absolute maximum
max_junction_temp_c = 150.0  # absolute maximum

# Rev 2.1 section "Charging current setting". The normal operating endpoint is
# 400 mA nominal; 800 mA above is only the BAT-pin absolute maximum. The two
# branches meet at 150 mA (RPROG = 6.667 kOhm). The 0.401 A domain boundary
# below is the published equation evaluated at the published 1.66 kOhm nominal
# endpoint (0.40089 A), rounded upward only enough not to reject that cited
# application value. It is not a saturation claim: smaller resistors abstain.
[models.current_program]
pin = "prog"
semantics = "regulated_current"
current_in_roles = ["in"]
current_out_roles = ["out"]
max_operating_current_a = 0.401
equation = "piecewise_inverse_resistance"
low_k_volts = 1000.0
transition_current_a = 0.15
high_numerator_a = 1.2
resistance_scale_ohms = 1000.0
high_offset = 1.3333333333333333

[models.coverage]
implements = ["nominal_cv_output", "program_resistor_static_charge_current", "quiescent_current", "absolute_ratings"]
missing = ["cc_cv_state_machine", "dynamic_current_limit", "input_uvlo", "charge_termination", "recharge_hysteresis", "thermal_regulation", "charge_status_timing"]

# ── TP4056: 1 A single-cell Li-ion linear charger, SOP-8 ─────────────────────
#
# The charger on every red "TP4056 module" a hobbyist has in a drawer. Same
# family as the TP4054 above. The physical part is a constant-current /
# constant-voltage charger; the model deliberately splits that into a 4.2 V
# dynamic CV source and a static PROG-current attribution. It does not claim a
# dynamic CC/CV state machine.
#
# Source: NanJing Top Power ASIC Corp "TP4056, 1A Standalone Linear Li-Ion
#   Battery Charger with Thermal Regulation in SOP-8". The copy read carries no
#   revision code on any of its three pages.
#
# Datasheet figures used (ELECTRICAL CHARACTERISTICS, TA = 25 C, VCC = 5 V
# unless noted):
#   VCC      = 4.0 min, 5 typ, 8.0 max V   input supply voltage
#   VFLOAT   = 4.137 / 4.2 / 4.263 V       @ 0 C <= TA <= 85 C, IBAT = 40 mA
#   IBAT     = 1200 * VPROG / RPROG (A)    with VPROG = 1 V; measured as
#              450/500/550 mA at RPROG = 2.4k and 950/1000/1050 mA at
#              RPROG = 1.2k, both at VBAT = 4.0 V in current mode
#   IBAT     = 0 / -2.5 / -6 uA            standby mode, VBAT = 4.2 V
#   ICC      = 150 typ, 500 max uA         charge mode, RPROG = 1.2k
#   ICC      = 55 typ, 100 max uA          standby (charge terminated)
#   ICC      = 55 typ, 100 max uA          shutdown
#   ITRIKL   = 120 / 130 / 140 mA          @ VBAT < VTRIKL, RPROG = 1.2k
#   VTRIKL   = 2.8 / 2.9 / 3.0 V           trickle threshold, VBAT rising
#   VTRHYS   = 60 / 80 / 100 mV            trickle hysteresis
#   TLIM     = 145 C typ                   junction temperature at which the
#                                          constant-temperature mode folds IBAT
#   theta-JA = 130 C/W                     stated with the datasheet's complete
#                                          charge-cycle figure
#   Sleep: when VCC falls to within 30 mV of VBAT the part enters low-power
#   sleep and BAT current drops below 2 uA (pin description, Vcc pin 4).
#   Termination: charge stops when the current falls to 1/10 of the programmed
#   value after the float voltage is reached (description, "C/10").
# Absolute Maximum Ratings: input supply voltage -0.3 to 8 V; TEMP -0.3 to 10 V;
#   CE -0.3 to 10 V; BAT short-circuit duration continuous; BAT pin current
#   1200 mA; PROG pin current 1200 uA; maximum junction temperature 145 C;
#   operating ambient -40 to 85 C.
#
# `dropout_v` IS THE WEAK NUMBER HERE AND IT IS LABELLED AS SUCH. This datasheet
# publishes no on-resistance for its internal PMOS pass element and no dropout
# at any current, so unlike the TP4054 above there is nothing to compute a
# headroom from. 30 mV is the ONLY VCC-minus-VBAT figure the sheet states
# anywhere, and it is the sleep-mode entry threshold, not a dropout at the 1 A
# rating. It is used because it is real and because the field is required; it is
# an underestimate of the true headroom at any useful current, and a board check
# that leans on it is leaning on the wrong thing.
#
# DELIBERATELY NOT MODELLED, because the vreg path is an ideal source and the
# datasheet does not support inventing more:
#   - The programmed charge current. The engine's vreg binder holds the output
#     at `vout` with no current limit at all, so the RPROG relationship above
#     (and with it the whole constant-current phase) is absent. On a module with
#     the stock 1.2k this is a 1 A phase that simply does not happen.
#   - The trickle-charge region below VTRIKL = 2.9 V, its 80 mV hysteresis, and
#     the C/10 termination. All three are state, and `vreg` has no states.
#   - The thermal-regulation loop that folds IBAT back at TLIM = 145 C. The
#     datasheet states it as a behaviour with no transfer function.
#   - The open-drain CHRG and STDBY status outputs, and the CE chip-enable
#     input. `bind_vreg` stamps its source unconditionally and never reads an
#     enable, so a board that sequences CE is not modelled. The pins are mapped
#     so the roles are at least visible in the bind report.
#   - The TEMP thermistor input and its 45%/80%-of-VCC suspend window.
[[models]]
id = "tp4056"
kind = "vreg"
description = "TP4056 charger (dynamic model: 4.2 V CV source; static model: PROG-regulated current)"

[models.match]
# TP4056, TP4056-42-SOP8-PP, TP4056-42-ESOP8. The "42" in the order code is the
# 4.2 V float, which is the only float this part has, so it needs no filtering.
value_re = "(?i)TP4056"

[models.params]
# The float voltage IS the output rail once the cell is charged, which is the
# steady state a board check cares about.
vout = 4.2         # VFLOAT typ (4.137 min, 4.263 max) @ 0-85 C, IBAT = 40 mA
dropout_v = 0.03   # the sheet's ONLY stated VCC - VBAT figure: sleep-mode entry
                   # at 30 mV. NOT a dropout at rated current. See the note above.
iq_a = 0.000055    # ICC standby and shutdown, 55 uA typ (100 uA max); charge
                   # mode is 150 uA typ (500 uA max) at RPROG = 1.2k

[models.pins]
# SOP-8 PACKAGE/ORDER INFORMATION and the pin descriptions on datasheet page 2.
# The role names are the BINDER's vocabulary, not the datasheet's: the vreg path
# looks for `out` and `in`, so naming pin 5 "bat" after the datasheet would leave
# the model matching the part and then reporting "vreg output not connected",
# which reads as a board fault rather than a model naming its own pins wrongly.
"1" = "temp"       # TEMP, battery thermistor sense; ground it to disable
"2" = "prog"       # PROG, charge-current program resistor to ground
"3" = "gnd"
"4" = "in"         # Vcc on the datasheet: positive input supply
"5" = "out"        # BAT on the datasheet: charge current out to the cell
"6" = "stdby"      # open-drain charge-terminated status output
"7" = "chrg"       # open-drain charging status output
"8" = "ce"         # chip enable, active high

[models.ratings]
max_current_a = 1.2          # BAT pin current, Absolute Maximum Ratings
max_voltage_v = 8.0          # VCC abs max (the recommended ceiling is also 8 V,
                             # unlike the TP4054 whose recommended max is lower)
max_junction_temp_c = 145.0  # maximum junction temperature; also TLIM, the
                             # constant-temperature-mode setpoint
theta_ja_c_per_w = 130.0     # stated with the complete-charge-cycle figure

# I_BAT = 1200 V / R_PROG (datasheet "Programming Charge Current"), which is why
# the ubiquitous 1.2 kOhm module charges at 1 A. The 1.2 A above is the BAT pin's
# absolute maximum, not a load any board actually draws.
[models.current_program]
pin = "prog"
semantics = "regulated_current"
current_in_roles = ["in"]
current_out_roles = ["out"]
max_operating_current_a = 1.0
equation = "inverse_resistance"
k_volts = 1200.0

# ── MCP73831: single-cell Li-Ion linear charger, SOT-23-5 ─────────────────────
#
# 14 instances across the SparkFun Thing Plus RP2040 and Thing Plus SAMD51. Same
# shape as the TP4054/TP4056 above: a CC/CV linear charger with an integrated
# P-channel pass transistor, driving VBAT from VDD at a PROG-programmed current
# until the cell reaches the fixed float voltage.
#
# Source: Microchip MCP73831/2 datasheet DS21984A Rev. A, November 2005.
#
# Datasheet figures used (DC CHARACTERISTICS, VDD = VREG(typ)+1 V, IOUT = 10 mA,
# TA = -5 to 55 C unless noted):
#   VREG     4.168 / 4.20 / 4.232 V   the -2 voltage code (+-0.75%)
#   IREG     = 1000 V / RPROG(kOhm) in mA; measured 90/100/110 mA at RPROG=10k
#            and 450/505/550 mA at RPROG=2.0k
#   VSTART   3.3 / 3.45 / 3.6 V       UVLO, VDD low-to-high
#   VSTOP    3.2 / 3.38 / 3.5 V       UVLO, high-to-low; VHYS 70 mV typ
#   RDSON    350 mOhm typ             internal pass transistor @ VDD=3.75 V,
#                                     TJ = 105 C
#   ISS      510 uA typ (1500 max)    charging
#   ISS      53 uA typ (200 max)      charge complete
#   ISS      25 uA typ (50 max)       PROG floating, charge disabled
#   TSD      150 C typ, 10 C hysteresis
#   VDD      3.75 to 6 V operating; abs max 7.0 V
#   TJ       -40 to +125 C; theta_JA 230 C/W for the 5-lead SOT-23 (4-layer
#            JC51-7 board, natural convection)
#
# THE VOLTAGE CODE IS ABSENT FROM THE BOARD VALUE, AND THAT IS AN ASSUMPTION
# THIS ENTRY MAKES KNOWINGLY. Both SparkFun boards carry the value string
# "MCP73831" with no suffix, and the suffix is what sets the float voltage:
# -2 = 4.20 V, -3 = 4.35 V, -4 = 4.40 V, -5 = 4.50 V. This entry uses 4.20 V,
# the standard single-cell Li-Ion/Li-Po float and the overwhelmingly common
# variant. A board that actually fits a -3/-4/-5 gets a rail modelled 150 to
# 300 mV LOW. That is a bounded error in a known direction, which is why it is
# preferred to leaving four boards unresolved, but it IS an assumption and a
# suffixed value string will always be read literally by the match rule below.
#
# DELIBERATELY NOT MODELLED, because the datasheet describes these as behaviours
# without giving a transfer function a circuit model could carry: the charge
# state machine (precondition -> fast-charge CC -> CV -> termination -> automatic
# recharge, Figure 4-1); the thermal-regulation foldback of IREG above the die
# temperature limit (Figure 4-2 is a curve, not an equation); the C/10-class
# termination ratio and the selectable 10/20/40/100% precondition ratio, which
# are factory options rather than pin-settable; and the STAT pin's tri-state
# timing. None of them changes the steady-state rail a board check asks about.
[[models]]
id = "mcp73831"
kind = "vreg"
description = "MCP73831 charger (dynamic model: 4.2 V CV source; static model: PROG-regulated current)"

[models.match]
# A bare MCP73831 (assumed -2, see above), an explicit -2, or the full
# -2ACI/OT order code. The -3/-4/-5 codes are NOT matched: they float higher and
# would need their own entries rather than this one's 4.2 V.
value_re = "(?i)^MCP73831T?([- ]?2([A-Z]{3}/OT)?)?$"

[models.params]
vout      = 4.2       # VREG, the -2 code; the regulated cell voltage
dropout_v = 0.35      # the pass element's own drop. At the 500 mA ceiling and
                      # RDSON = 350 mOhm typ that is 0.175 V; 0.35 V is carried
                      # instead because RDSON is specified at TJ = 105 C and a
                      # hot part drops more, and because erring high here keeps
                      # the model from claiming headroom the part does not have.
iq_a      = 0.00051   # ISS typ while charging (53 uA typ once complete)

[models.pins]
# Table 3-1, SOT-23-5. As with the TP4054 above the role names are the BINDER's
# vocabulary: the vreg path looks for `out` and `in`, so pin 3 is `out` rather
# than the datasheet's "VBAT".
"1" = "stat"     # charge status output
"2" = "gnd"      # VSS
"3" = "out"      # VBAT on the datasheet: charge current out to the cell
"4" = "in"       # VDD on the datasheet: input supply
"5" = "prog"     # current-program resistor to VSS; floating disables charging

[models.ratings]
max_current_a = 0.5          # the practical ceiling at RPROG = 2.0 kOhm
max_voltage_v = 6.0          # recommended operating ceiling (abs max VDD 7.0 V);
                             # a check should fire on the recommended limit
max_junction_temp_c = 125.0  # TJ operating max (TSD trips at 150 C typ)
theta_ja_c_per_w = 230.0     # 5-lead SOT-23, 4-layer JC51-7 board

# Same programming law as the MCP73833 below: datasheet section 4.2 states
# I_REG = 1000 V / R_PROG, and a floating PROG disables charging entirely, so an
# unreadable resistor means no attributable rail current rather than 500 mA.
[models.current_program]
pin = "prog"
semantics = "regulated_current"
current_in_roles = ["in"]
current_out_roles = ["out"]
max_operating_current_a = 0.5
equation = "inverse_resistance"
k_volts = 1000.0

# ── MCP73833: 1 A single-cell Li-Ion charger, MSOP-10 ─────────────────────────
#
# Olimex ESP32-EVB U1 (5 instances). The bigger sibling of the MCP73831 above:
# same CC/CV architecture, 1 A programmable, plus a thermistor-qualification
# input and a Power-Good output.
#
# Source: Microchip MCP73833/4 datasheet DS20002005C.
# Datasheet figures used (DC CHARACTERISTICS, VDD = VREG(typ)+1 V, IOUT = 10 mA,
# TA = -5 to 55 C unless noted):
#   VREG     4.168 / 4.20 / 4.232 V   the 4.2 V option (+-0.75%); the family also
#                                     offers 4.35, 4.40, 4.45 and 4.50 V
#   IREG     = 1000 V / RPROG(kOhm) in mA; 900/1000/1100 mA at RPROG = 1.0k
#   IMAX     1200 mA typ              output current limit at RPROG < 833 Ohm
#   VSTART   3.4 / 3.55 / 3.7 V       UVLO rising; VSTOP 3.3/3.45/3.6; VHYS 100 mV
#   RDSON    300 mOhm typ             pass transistor @ VDD = 3.75 V, TJ = 105 C
#   ISS      2000 uA typ (3000 max)   charging
#   ISS      150 uA typ (300 max)     charge complete
#   ISS      100 uA typ (300 max)     standby, no battery / PROG floating
#   VT1      1.20 / 1.23 / 1.26 V     thermistor upper trip
#   VT2      0.235 / 0.25 / 0.265 V   thermistor lower trip
#   TSD      150 C typ, 10 C hysteresis
#   VDD      3.75 to 6 V; abs max 7.0 V
#   TJ       -40 to +125 C; theta_JA 113 C/W for MSOP-10 (41 C/W for the 3x3 DFN)
#
# Same voltage-code caveat as the MCP73831: the Olimex value string is
# "MCP73833(MSOP10)" with no voltage option, and 4.20 V is assumed on the same
# grounds. Same list of deliberately-unmodelled behaviours, plus two more this
# part adds: the NTC temperature-qualification window (VT1/VT2 gate charging on
# a thermistor voltage, which is a comparator on a sensor the model has no shape
# for) and the selectable 0/4/6/8-hour elapsed safety timer, which is pure
# digital timing.
[[models]]
id = "mcp73833"
kind = "vreg"
description = "MCP73833 charger (dynamic model: 4.2 V CV source; static model: PROG-regulated current)"

[models.match]
# The Olimex value carries the package in parentheses. The MCP73834 shares this
# pinout except that pin 7 is TE (timer enable) instead of PG, so it is excluded.
value_re = "(?i)^MCP73833[A-Z0-9/-]*(\\(MSOP-?10\\))?$"

[models.params]
vout      = 4.2       # VREG, 4.2 V option assumed; see the note above
dropout_v = 0.3       # RDSON 300 mOhm typ at TJ = 105 C; at the 1 A ceiling
                      # that is 0.3 V
iq_a      = 0.002     # ISS typ while charging (150 uA typ once complete)

[models.pins]
# Table 3-1, MSOP-10. VDD and VBAT are each doubled up on two pins.
"1"  = "in"       # VDD
"2"  = "in2"      # VDD (second bond)
"3"  = "stat1"
"4"  = "stat2"
"5"  = "gnd"      # VSS
"6"  = "prog"
"7"  = "pg"       # Power-Good output (TE on the MCP73834)
"8"  = "therm"    # thermistor input
"9"  = "out"      # VBAT
"10" = "out2"     # VBAT (second bond)

[models.ratings]
max_current_a = 1.0
max_voltage_v = 6.0          # recommended ceiling (abs max VDD 7.0 V)
max_junction_temp_c = 125.0
theta_ja_c_per_w = 113.0     # MSOP-10, 4-layer JC51-7 board

# The 1 A rating above is the CEILING. The board picks the charge current with
# one resistor on PROG, so a rail-current check must read that resistor rather
# than charge the ceiling to the rail. Datasheet section 5.2: I_REG = 1000 V /
# R_PROG (R_PROG = 1 kOhm gives 1 A, 5 kOhm gives 200 mA).
[models.current_program]
pin = "prog"
semantics = "regulated_current"
current_in_roles = ["in"]
current_out_roles = ["out"]
max_operating_current_a = 1.0
equation = "inverse_resistance"
k_volts = 1000.0

# ── BL4054B: 800 mA single-cell Li-Ion charger, SOT-23-5 ─────────────────────
#
# Olimex ESP32-EVB / RP2040-PICO-PC U1 (6 instances), value "BL4054B-42TPRN".
# Source: Shanghai Belling BL4054/BL4054B datasheet Rev 1.5.
#
# THE ORDER CODE DECODES CLEANLY, which is why this entry does not need the
# assumption the two Microchip chargers above do. Per the datasheet's Ordering
# Information diagram, "BL4054B-42TPRN" is: 42 = float voltage code 4.2 V (43 and
# 44 give 4.3 and 4.4 V), T = trickle charge enabled (N would mean disabled),
# P = standard Pb-free, RN = SOT23-5 package (TRN would be TSOT23-5). The B
# suffix on the part itself means it skips the power-on battery-voltage recheck
# that the plain BL4054 performs.
#
# Datasheet figures used (Electrical Characteristics, VCC = 5 V, TA = 25 C):
#   VFLOAT   4.158 / 4.2 / 4.242 V
#   ICHG     = 1000 V / RPROG; measured 465/500/535 mA at RPROG = 2 kOhm and
#            93/100/107 mA at 10 kOhm. Datasheet advises keeping IREG > 40 mA.
#   VTRIKL   2.8 / 2.9 / 3.0 V        trickle threshold; hysteresis 60/100/150 mV
#   UVLO     3.7 / 3.9 / 4.1 V        hysteresis 150/200/300 mV
#   VOVP     6.8 / 7.0 / 7.2 V        input over-voltage protect, 200 mV hyst
#   VRECHRG  4.0 / 4.05 / 4.1 V       automatic recharge threshold
#   RON      600 mOhm typ             internal pass FET
#   TLIM     120 C typ                constant-temperature (foldback) mode
#   ICC      100 uA typ (500 max)     standby; 2000 uA typ charging; 25 uA typ
#                                     in UVLO or automatic shutdown
#   VCC      4.25 to 6.5 V recommended; abs max -0.3 to +10 V
#   TJ max 125 C; theta_JA 250 C/W (SOT23-5) / 220 (TSOT23-5), theta_JC 130 / 110
#            C/W, "approximately 1 square of 1 oz copper" (Note 4)
#
# DELIBERATELY NOT MODELLED: the trickle -> CC -> CV -> standby state machine and
# the BL4054-vs-BL4054B power-on recheck difference; the thermal foldback, which
# the datasheet gives as the relation TA = 120 C - PD * theta_JA rather than as a
# circuit; the ~50 us soft-start ramp; the 0.4 to 4.5 ms comparator filter times;
# and the CHRGb pin's three-state (strong pull-down / weak pull-down / Hi-Z)
# output, whose level depends on UVLO and charge state rather than on any fixed
# I-V curve.
[[models]]
id = "bl4054b_42"
kind = "vreg"
description = "BL4054B-42 charger (dynamic model: 4.2 V CV source; static model: PROG-regulated current)"

[models.match]
# The 42 voltage code is required: -43 and -44 float 100 and 200 mV higher.
value_re = "(?i)^BL4054B?-42[A-Z]*(\\(SOT-?23-?5\\))?$"

[models.params]
vout      = 4.2       # VFLOAT
dropout_v = 0.48      # RON 600 mOhm typ at the 800 mA rating
iq_a      = 0.002     # ICC typ while charging (100 uA typ standby)

[models.pins]
# Pin Description table, SOT23-5 / TSOT23-5. Role names are the binder's, as
# with the other chargers here.
"1" = "chrg_n"   # open-drain charge status, pulled down while charging
"2" = "gnd"
"3" = "out"      # BAT on the datasheet
"4" = "in"       # VCC
"5" = "prog"     # current program / monitor / shutdown

[models.ratings]
max_current_a = 0.8          # programmable ceiling
max_voltage_v = 6.5          # recommended operating ceiling. The part's own OVP
                             # trips at 7.0 V typ and abs max is 10 V, but a
                             # check should fire at the recommended limit.
max_junction_temp_c = 125.0
theta_ja_c_per_w = 250.0     # SOT23-5, ~1 square of 1 oz copper (Note 4)
theta_jc_c_per_w = 130.0     # SOT23-5

# Datasheet electrical characteristics: ICHG(A) = 1000 V / RPROG(ohms).
[models.current_program]
pin = "prog"
semantics = "regulated_current"
current_in_roles = ["in"]
current_out_roles = ["out"]
max_operating_current_a = 0.8
equation = "inverse_resistance"
k_volts = 1000.0

# ─────────────────────────────────────────────────────────────────────────────
# SR2: STMicroelectronics 6-pin Smart Reset, UDFN6 1.6 x 1.3 mm.
#
# Source: STMicroelectronics "SR2 - 6 pin Smart Reset" datasheet, DocID026047
#   Rev 2, 13-May-2014 (www.st.com/resource/en/datasheet/sr2.pdf).
#
# WHAT THE PART IS. Not a voltage detector: it has NO power-on reset and does
# not watch the rail. It watches two push-button inputs (SR0, SR1) and asserts
# its reset output only after BOTH have been held low together for the
# factory-programmed delay tSRC, which is seconds, not milliseconds. That is the
# whole point of the family: a short press reaches the MCU as an interrupt, a
# long press on both buttons is a hard reset, and no dedicated reset button is
# needed. On a Watchy (U1, value "SR2HARU") the two inputs are the BTN2 and BTN3
# menu buttons and the output drives the ESP32's EN.
#
# Datasheet figures used (Table 4 DC and AC characteristic, TA = -40 to +85 C,
# VCC = 1.65 to 5.5 V; typical values at 25 C and VCC = 3.3 V):
#   VCC   = 1.65 to 5.5 V
#   ICC   = 1.1 typ, 2.5 max uA   at VCC = 3.0 V  (inputs inactive, no tSRC count)
#   ICC   = 1.5 typ, 3.0 max uA   at VCC = 5.0 V
#   VOL   = 0.3 V max             at VCC >= 3.3 V sinking 2.5 mA
#                                 (0.3 V max at >= 4.5 V/3.2 mA and >= 1.65 V/1 mA)
#   VIL   = VSS - 0.3 to 0.3 V    (SR0, SR1; FIXED volts, not a VCC fraction)
#   VIH   = 0.85 to 5.5 V         (SR0, SR1)
#   ILI   = -0.1 to 0.1 uA        (SR0, SR1 input leakage)
#   ILO   = -0.1 to 0.1 uA        (RST leakage, open-drain option without pull-up)
#   tSRC  = 0.8x / 1.0x / 1.2x the programmed delay over temperature
#   tREC  = 240 / 360 / 480 ms    (only on the -B- reset-timeout options)
#   RPUO  = 65 kOhm               (internal RST pull-up, only on options that have one)
# Table 2 Absolute maximum ratings: VCC -0.3 to 7 V; input or output voltage
#   -0.3 to 5.5 V (for a push-pull RST, -0.3 V to VCC + 0.3 V); storage -55 to
#   +150 C; 2 kV HBM.
# Section 1: below 1.575 V typ the inputs are ignored and the outputs are
#   deasserted, with the deasserted level valid down to VCC = 1.0 V.
#
# WHY THIS ONE IS MODELLED WHERE THE VOLTAGE DETECTORS BELOW ARE NOT. Their
# problem is the kind, not the sheet: a detector's job is a threshold with
# hysteresis, `comparator` needs two DRIVEN output levels, and an open-drain
# output has no high-side drive to give. This part's inputs are fixed logic
# levels, which `digital` says exactly, and the open-drain output costs nothing
# here because the binder stamps a driver only on a role beginning with `y`. No
# role below does, so RST is left to whatever the board's pull-up makes it, which
# is the truth about an open-drain pin. Hence NO `voh`: the datasheet's VOH row
# is explicitly "push-pull output only", and the ordering options in this entry
# are all open-drain.
#
# DELIBERATELY NOT MODELLED: the tSRC counter itself, so a press of both buttons
# does not assert RST in simulation; the tREC one-shot on the -B- options; the
# 1.575 V input-ignore threshold; and the SR0 overvoltage test mode (VTEST =
# VCC + 0.9/1.1/1.4 V, tSRC-INI 42 ms typ, tSRC-SHORT 21 ms typ). A `[models.logic]`
# spec with a seconds-scale timer is the pathway for the counter; nothing here
# fakes it in the meantime. No `ro` either: the sheet gives VOL at three sink
# currents (~120 Ohm implied at the 3.3 V point) but no output impedance, and an
# unstamped output has nothing to apply it to.
[[models]]
id = "sr2"
kind = "digital"
description = "ST SR2 dual-push-button Smart Reset supervisor, UDFN6, open-drain active-low RST"

[models.match]
# The six ordering options Table 7 actually lists, spelled out rather than
# pattern-matched, because a class like SR2[HLPU]A[RB]U would also claim
# SR2HABU and SR2PABU, which ST does not build.
#
# One entry covers all six because they differ ONLY in things this model does
# not carry: the Smart Reset delay tSRC (H = 4.0 s, L = 6.0 s, P = 7.5 s,
# U = 10.0 s, per Table 6) and whether the output pulse is push-button
# controlled (-R-) or a fixed 360 ms tREC one-shot (-B-). Every one of them is
# open-drain, active low, with no internal pull-up (the `A` output code), and
# all share the UDFN6 pinout and the DC table below. The moment a tSRC-aware
# logic spec exists, this splits into one entry per delay.
value_re = "(?i)^SR2(HARU|LABU|LARU|PARU|UABU|UARU)$"

[models.params]
# Table 4. vol/vih/vil are the datasheet numbers verbatim; the SR inputs have
# FIXED thresholds, so unlike a CMOS part these do not move with the rail.
vol   = 0.3      # VOL max at VCC >= 3.3 V, sinking 2.5 mA
vih   = 0.85     # VIH min, SR0/SR1
vil   = 0.3      # VIL max, SR0/SR1
supply_static_ua = 1.1   # ICC typ at VCC = 3.0 V (2.5 max); 1.5 typ at 5.0 V
supply_pin = "6"
gnd_pin    = "1"

[models.pins]
# Table 1 Signal names, cross-checked against Figure 2 Pin connections.
"1" = "vss"
"2" = "sr1_n"   # secondary push-button input, active low
"3" = "rst_n"   # reset output, open drain, active low on these options
"4" = "nc"      # not bonded; the datasheet says to connect it to VSS
"5" = "sr0_n"   # primary push-button input, active low; also the test-mode pin
"6" = "vcc"

[models.ratings]
# Table 2 Absolute maximum ratings. max_voltage_v is the SUPPLY limit; the
# separate -0.3 to 5.5 V limit on RST/SR0/SR1 has no field on this schema, so a
# board pulling RST above 5.5 V from a higher rail is not caught here. No
# max_pin_current_a: the sheet's 1 to 3.2 mA sink figures are VOL test
# conditions, not an output rating. No junction-temperature or thermal fields;
# Table 3 gives only the -40 to +85 C ambient range.
max_voltage_v = 7.0

[models.coverage]
implements = ["pin_roles", "fixed_input_thresholds", "supply_current", "open_drain_output_without_fabricated_high_drive", "absolute_ratings"]
missing = ["smart_reset_timer", "recovery_timer", "low_voltage_input_ignore", "overvoltage_test_mode", "push_pull_variants"]

# ═════════════════════════════════════════════════════════════════════════════
# THE VOLTAGE DETECTORS AND THE LED DRIVER DELIBERATELY LEFT UNRESOLVED.
#
# NCP303LSN27T1G (onsemi, SOT-23-5) and BD5230G (Rohm, SSOP5) are voltage
# detectors, and FAN5622SX (onsemi, SuperSOT23-6) is a constant-current LED
# driver. All three datasheets were read; none of them is modelled, and the
# reasons are specific rather than a shortage of numbers.
#
#   NCP303LSN27T1G: an N-channel OPEN-DRAIN, active-low reset output. The
#     `comparator` kind requires `out_lo` and `out_hi`, i.e. two DRIVEN levels,
#     and an open-drain output has no high-side drive at all: its high level is
#     whatever the board's external pull-up makes it. Stamping an `out_hi` would
#     invent a driver the part does not contain, and on a board whose pull-up is
#     missing or wrongly sized that fiction would hide the very fault worth
#     finding. Its detect DELAY is also externally programmed by a capacitor on
#     the CD pin (RD = 1.0 MOhm typ internal pull-up), so there is no fixed
#     figure to carry. Recorded numbers, for whenever an open-drain output kind
#     exists: VDET- 2.646/2.700/2.754 V, VHYS 0.081/0.135/0.189 V, Iin 0.26 uA
#     typ below threshold and 0.46 uA above, min operating VIN 0.55-0.80 V, abs
#     max 12 V, output current 70 mA, theta_JA 250 C/W, TJ max 125 C. Source:
#     onsemi NCP302/D Rev. 14.5, January 2005. NOTE: on the Olimex boards this
#     part is a documented no-fit position anyway, value "NA(NCP303LSN27T1G
#     (SOT-23-5))", so it is correctly ignored there by db/ignore.toml.
#
#   BD5230G: same open-drain problem, same external-capacitor delay (CT pin,
#     RCT 9 MOhm typ). Recorded: VDET 2.970/3.0/3.030 V at 25 C (the "52" prefix
#     is the open-drain output type and "30" is the 3.0 V threshold, per the
#     Ordering Information decoder), hysteresis VDET x 0.03/0.05/0.08, IDD1
#     0.80 uA typ / 2.40 max, IDD2 0.75/2.25 uA, abs max VDD 10 V, PD 540 mW
#     (SSOP5 on the ROHM standard 70x70x1.6 mm board), -40 to +105 C. Source:
#     ROHM TSZ02201-0GJG0G300040-1-2 Rev.009, 11 October 2021, read at the
#     VDET = 3.0 V row of the shared BD52xx/BD53xx family table.
#
#   FAN5622SX: its output current is set by an external RSET resistor (5 to
#     30 mA full scale, e.g. 19.10 kOhm for 15 mA) and then scaled by 32 dimming
#     steps clocked in over a SINGLE-WIRE DIGITAL PULSE TRAIN on the CTRL pin.
#     The analog output stage is a current mirror with a ratio of 240 typ from
#     ISET, which is modellable; the brightness level is a pulse-counted DAC
#     state, which is not, and without it the output current is undefined rather
#     than merely approximate. Recorded: VIN 2.7-5.5 V (abs max 6.0 V),
#     VDROPOUT 50 mV typ at 15 mA / 60 mV at 30 mA, ISD 0.3 uA typ (1.0 max),
#     IIN 0.4 mA typ (0.8 max) at VIN=3.6 V with ILED=0, UVLO 2.70 V rising /
#     2.30 falling, TSD 150 C typ with 20 C hysteresis, theta_JA 235 C/W.
#     Source: Fairchild/onsemi FAN5622/24/26 Rev. 1.0.3, cover dated July 2013.

# ─────────────────────────────────────────────────────────────────────────────
# MAX6070AAUT18: Maxim/ADI low-noise precision SERIES voltage reference, 1.8 V,
# SOT-23-6.
#
# Source: Maxim Integrated "MAX6070/MAX6071 Low-Noise, High-Precision Series
#   Voltage References", 19-6355 Rev 18, 12/20: the Pin Description table, the
#   "Electrical Characteristics - MAX607__AUT18 (VOUT = 1.800V)" table, the
#   Absolute Maximum Ratings and the SOT23 Package Information.
#
# A SERIES REFERENCE IS A REGULATOR, WHICH IS WHY IT IS `kind = "vreg"`. It takes
# an input rail, sinks a quiescent current, and holds an output pin at a fixed
# voltage against +/-10 mA of load, which is exactly what `bind_vreg`'s ideal
# source models. What separates it from the LDOs in db/vreg.toml is accuracy
# rather than mechanism: +/-0.04% initial on the A grade, 1.5 ppm/C typical drift.
# Neither of those has a field on this schema, so what the simulation gets is a
# perfect 1.800 V, which is the reference's job done better than the real part
# does it. That is the right direction for a reference and the wrong one for a
# tolerance study.
#
# Datasheet figures used (VIN = +5.0 V, IOUT = 0 mA, TA = -40 to +125 C; typicals
# at +25 C):
#   VOUT   = 1.800 V, accuracy +/-0.04% at 25 C on the A grade (B is +/-0.08%)
#   VIN    = 2.7 to 5.5 V (guaranteed by line regulation, 1.8 V option)
#   IIN    = 130 uA typ, 200 uA max at 25 C (260 uA max over temperature)
#   ISD    = 6 uA max, disabled
#   IOUT   = -10 to +10 mA (sink and source)
#   ISC    = 25 mA typ either direction
#   VIH    = 0.7 x VIN, VIL = 0.3 x VIN on EN
#   TCVOUT = 1.5 ppm/C typ, 6 ppm/C max (A grade)
#
# `dropout_v` IS A FAMILY FIGURE, NOT THIS OPTION'S ROW, and that has to be said
# because every other vreg entry's dropout is its own part's. The 1.8 V table omits
# the dropout row, as do the 1.25 V and 2.048 V ones; the options that carry it
# give, at IOUT = 10 mA over temperature, 110 mV typ at 2.5 V, 80 mV at 3.0 V,
# 65 mV at 3.3 V, 75 mV at 4.096 V and 60 mV at 5.0 V. 0.11 V is the LARGEST of
# those, so it is the conservative pick from the same die and the same test
# condition rather than an interpolation into a gap. The datasheet's own headline
# claim is "low 200 mV dropout" and the worst tabulated maximum is 230 mV.
#
# DELIBERATELY NOT MODELLED: the force/sense pair. OUTF and OUTS are separate
# pads meant to be shorted at the load so the reference regulates out the trace
# drop; `bind_vreg` stamps ONE ideal source, on `out`, and OUTS carries a role and
# no device. On a board that ties them together (the margay datalogger does, at
# the pad) the two are one node and nothing is lost; on a board that runs a real
# Kelvin connection, the sense leg is not part of the loop here. Also absent: the
# EN pin (bind_vreg has no enable, so the reference is always on), the FILTER pin's
# noise-bandwidth network, and every accuracy and drift figure above.
[[models]]
id = "max6070_1v8"
kind = "vreg"
description = "MAX6070AAUT18 1.8V precision series voltage reference, +/-0.04%, SOT-23-6"

[models.match]
# The last two digits of the ordering code ARE the output voltage: AUT12 = 1.25 V,
# AUT18 = 1.8 V, AUT21 = 2.048 V, AUT25 = 2.5 V, AUT30 = 3.0 V, AUT33 = 3.3 V,
# AUT41 = 4.096 V, AUT50 = 5.0 V. Only the 18 binds here, for the reason at the head of the
# voltage-option entries in db/vreg.toml: an entry that matched the family would
# hold a 5 V reference net at 1.8 V.
#
# The grade letter before "AUT" is accuracy (A = +/-0.04%, B = +/-0.08%,
# D = +/-0.2%) and is accepted freely, because this entry carries no accuracy
# field for it to contradict. The MAX6071 is deliberately EXCLUDED: it is the same
# reference with a Kelvin GROUND pair (GNDF/GNDS) instead of the MAX6070's single
# GND and FILTER pins, so pads 1 and 2 mean different things on it.
value_re = "(?i)^MAX6070[ABD]AUT18([/A-Z0-9+-]*)?$"

[models.params]
vout      = 1.8       # VOUT, 1.800 V; +/-0.04% initial on the A grade at 25 C
dropout_v = 0.11      # FAMILY figure at IOUT = 10 mA, not the 1.8 V row (which
                      # the datasheet omits). See the note above.
iq_a      = 1.3e-4    # IIN typ 130 uA at 25 C (200 uA max at 25 C, 260 uA max
                      # over temperature)

[models.pins]
# Pin Description, MAX6070 column, 6-pin SOT23. Cross-checked against the margay
# datalogger, where pad 1 carries the 0.1 uF filter capacitor, pads 3 and 4 are
# both tied to the auxiliary rail (enabled, and supplied from it), and pads 5 and 6
# are shorted together on the VREF net exactly as the datasheet instructs.
"1" = "filter"   # 0.1 uF to ground for high-frequency bypass; leave open if unused
"2" = "gnd"
"3" = "en"       # drive high to enable; NOT gated by bind_vreg, see above
"4" = "in"
"5" = "outs"     # reference sense output; carries a role and no device
"6" = "out"      # OUTF, the force output: the pin the ideal source is stamped on

[models.ratings]
# Absolute Maximum Ratings and the SOT23 Package Information table.
max_current_a = 0.01         # IOUT, +/-10 mA (ISC is 25 mA, a limit not a rating)
max_voltage_v = 6.0          # IN / OUTS / EN to ground, -0.3 to +6 V
max_power_w = 0.3478         # continuous dissipation at TA = +70 C, SOT23,
                             # derate 4.3 mW/C above +70 C
max_junction_temp_c = 150.0
theta_ja_c_per_w = 230.0     # multi-layer board
theta_jc_c_per_w = 76.0

# ─────────────────────────────────────────────────────────────────────────────
# MNT Pocket Reform charger: exact identity/binding entries
#
# These two parts are deliberately *not* promoted to charger/gauge behaviour.
# They close the source-bound component identity and pin-map gap so a board
# report can say which silicon is fitted, while the dynamic battery, ADC,
# protection-FET and I2C register behaviour remains an explicit coverage hole.
# A warning parameter is carried into the evidence report by the digital binder;
# it prevents an identity bind from being mistaken for a causal battery replay.

# Analog Devices MAX17320 2S-4S ModelGauge m5 EZ fuel gauge/protector.
# Primary source: MAX17320 Rev. 12 datasheet, pin configurations and pin
# descriptions (https://www.analog.com/media/en/technical-documentation/data-sheets/max17320.pdf).
# The fitted MAX17320G20+ is the 24-pin QFN symbol used by the pinned MNT
# Pocket Reform charger source. Pin numbers and role names below are copied from
# that symbol and checked against the datasheet; no register-map or gauge law is
# asserted here.
[[models]]
id = "max17320"
kind = "digital"
description = "Analog Devices MAX17320G20+ fuel gauge/protector (identity-only; gauge/protection behavior not modeled)"

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"

[models.match]
value_re = "(?i)^MAX17320G20\\+$"
mpn_re = "(?i)^MAX17320G20\\+$"

[models.params]
identity_only = true
warning = "MAX17320 gauge/protector identity and pin map are sourced; cell-voltage/current/temperature conversion, protection FET control, I2C/1-Wire registers, and charger state are not modeled"
unlocked_by = "a validated MAX17320 battery/SOC/protection model with I2C register semantics and a coupled battery plant"

