# ─────────────────────────────────────────────────────────────────────────────
# APX811: Diodes Incorporated 4-pin microprocessor supervisor with manual reset,
# SOT143, push-pull ACTIVE-LOW RESET output.
#
# Source: Diodes Incorporated "APX811/812 4-Pin Microprocessor Supervisor With
#   Manual Reset", DS31960 Rev. 2, October 2009
#   (https://www.diodes.com/assets/Datasheets/APX811_812.pdf): Ordering
#   Information, Pin Assignments / Pin Descriptions, Absolute Maximum Ratings,
#   Recommended Operating Conditions, Electrical Characteristics, Switching
#   Characteristics and the RESET vs. Vcc / RESET vs. /MR timing diagrams.
#
# PACKAGE. The datasheet lists exactly one package, SOT143 ("U" in the ordering
# code), a 4-lead SOT-23-outline body. Pin Assignments (top view): 1 GND,
# 2 RESET, 3 MR, 4 Vcc. A board that draws this part on a 3-pin SOT-23 footprint
# is not drawing this datasheet's part.
#
# WHY THIS ONE IS EXECUTABLE WHERE NCP303/BD5230 ARE NOT. The APX811 output is
# PUSH-PULL ("The APX811/812 have push-pull outputs", General Description), so
# both levels are real driven levels and an FSM with two voltage laws says the
# truth about it. The supervisor function is a two-state machine:
#   reset -> run   once VCC > Vth AND MR is high have held CONTINUOUSLY for td
#                  (guard_dwell_s, so a glitch restarts the timeout, as the
#                  timing diagrams show td measured from the last release);
#   run   -> reset as soon as VCC < Vth OR MR is low (tPHL 25 us / 0.1 us max,
#                  far below a simulation chunk, so taken as immediate).
#
# FIGURES USED (Electrical Characteristics, TA = 25 C unless noted):
#   Vth   per ordering code, TA = 25 C, min/typ/max in the card; the TYP is used.
#         The sheet gives NO hysteresis figure, so none is modelled.
#   td    140 / 200 / 280 ms (Switching Characteristics); 200 ms typ is used.
#   ICC   30 typ / 40 max uA at Vth + 0.2 V.
#   VOL   0.3 V max at 1.2 mA, 0.4 V max at 3.2 mA (VCC = Vth - 0.2 V).
#   VOH   0.8 VCC min at 500 uA; VCC - 1.5 V min at 800 uA (VCC > Vth + 0.2 V).
#   MR    VIL = 0.3 x VCC, VIH = 0.7 x VCC (Timing requirements / Switching
#         Characteristics test conditions); minimum pulse 100 ns.
#   VCC   1.0 to 5.5 V functional range; abs max -0.3 to 7 V; IO 20 mA;
#         PD 320 mW; theta_JA 240 C/W (SOT143, Note 3 board).
#
# DERIVED, NOT PRINTED: the output resistances. r_ohms low = 0.4 V / 3.2 mA =
# 125 Ohm (the VOL max row); r_ohms high = 1.5 V / 0.8 mA = 1875 Ohm (the
# VCC - 1.5 V at 800 uA VOH row, the weaker of the two VOH rows). Both are
# worst-case slopes through a guaranteed limit, so a model output is no
# stronger than the guaranteed part.
#
# DELIBERATELY NOT MODELLED: any MR internal pull-up (the sheet does not state
# one, unlike some x811 second sources, so an unconnected MR is left to float
# and the FSM will hold reset if the board leaves it low); the undefined output
# below VCC = 1.0 V; threshold tolerance and temperature drift; the APX812
# (active-high) option, which is a different output polarity and is NOT matched.

[[models]]
id = "apx811_23"
kind = "digital"
description = "Diodes APX811-23 supervisor, 2.25 V threshold, push-pull active-low RESET, manual reset, SOT143"

[models.match]
# Ordering Information: APX811-23UG-7 (11 = active low, 23 = 2.25 V,
# U = SOT143, G = green, -7 = tape and reel).
value_re = "(?i)^APX811-?23(U(G(-7)?)?)?$"

