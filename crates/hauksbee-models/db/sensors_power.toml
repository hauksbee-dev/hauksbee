# -----------------------------------------------------------------------------
# INA226: Texas Instruments 36 V, 16-bit, I2C output current, voltage and power monitor
# with alert, DGS (VSSOP-10, 3.00 mm x 4.90 mm).
#
# Source: TI "INA226 36V, 16-Bit, Ultra-Precise I2C Output Current, Voltage, and Power
#   Monitor With Alert", SBOS547C, June 2011, revised August 2026 (the revision printed
#   on the PDF). Pin Configuration and Functions (Table 4-1, Figure 4-1), 5.1 Absolute
#   Maximum Ratings, 5.3 Recommended Operating Conditions, 5.4 Thermal Information, 5.5
#   Electrical Characteristics, 6.5.5.1 Serial Bus Address (Table 6-2), 7.1 Register
#   Maps (Tables 7-1 to 7-15), Equations 3 and 4.
#
# THE SHUNT IS EXTERNAL. IN+ and IN- sense across a board resistor; leaving them
# high-impedance here does not open the measured power path. The 6 V ceiling is the
# supply (VS) and SDA pin: IN+, IN- (common mode) and VBUS are rated -0.3 V to 40 V, and
# a `digital` card's max_voltage_v is not watched per pin, so the sensing pins may sit
# on rails far above 6 V.
#
# ADDRESS: Table 6-2 has 16 addresses from four levels (GND, VS, SDA, SCL) on each of
# A0 and A1, all listed as printed (1000000b = 0x40 to 1001111b = 0x4F). A strap the
# binder cannot read as one of the four binds the spec default 0x40 marked assumed.
# The device samples A0/A1 on every bus communication and the pins must be connected
# to one of the four nets, so a floating strap is flagged.
#
# REGISTERS (Table 7-1): CONFIG 00h resets to 4127h and its RST bit self-clears;
# SHUNT 01h, BUS 02h, POWER 03h, CURRENT 04h answer from the sensor inputs shunt_mv
# and bus_v through the printed LSB sizes (2.5 uV and 1.25 mV) and Equations 3 and 4;
# CALIBRATION 05h, MASK/ENABLE 06h and ALERT LIMIT 07h reset to 0; MANUFACTURER ID FEh
# = 5449h and DIE ID FFh = 2260h, MSB first. The Current and Power registers read 0
# until the Calibration register is written.
#
# ASSUMED: the model does not run the conversion state machine. The triggered modes read
# the same as the continuous ones, the Conversion Ready Flag (bit 3 of 06h) is set
# whenever a measurement mode is selected and never clears on read, the alert engine
# does not run (AFF and OVF read 0), averaging is ignored and a reset clears the
# registers only while RST is the stored configuration value.
#
# LOGIC LEVELS are VS fractions (VIH 0.7 x VS min, VIL 0.3 x VS max), evaluated at the
# 3.3 V recommended supply. SDA and Alert are open drain, so no VOH; VOL is 0.4 V max at
# IOL = 3 mA. Currents are IQ typical 330 uA (420 uA max) and shutdown 0.5 uA typical
# (2 uA max).
[[models]]
id = "ina226"
kind = "digital"
description = "TI INA226 36V 16-bit I2C current/power monitor, VSSOP-10 (I2C register map at the 16 strapped addresses: configuration with reset, shunt/bus/power/current from sensor inputs, calibration, mask/enable, manufacturer and die ID; pad map, logic levels and supply draw)"

[models.match]
# Orderable codes INA226AIDGSR (reel) and INA226AIDGST (small reel), plus the bare INA226. INA226A/B suffix families are not in this revision. INA219/INA220/INA228/INA229/INA230/INA231 and INA233 are different parts.
value_re = "(?i)^INA226(AIDGS[RT]?)?$"

[models.params]
vol   = 0.4      # 5.5 Electrical Characteristics, VOL max, SDA and Alert at IOL = 3 mA
vih   = 2.31     # 5.5 VIH 0.7 x VS min at the 3.3 V recommended supply
vil   = 0.99     # 5.5 VIL 0.3 x VS max at the 3.3 V recommended supply
supply_static_ua = 330.0   # 5.5 IQ typical quiescent current (420 uA max)
supply_pin = "6"           # VS
gnd_pin    = "7"           # GND
warning = "I2C register map with the measurement registers fed from sensor inputs; the conversion state machine, averaging, triggered-mode timing and the alert engine are not modelled"
must_not_float_roles = "a0,a1"

[models.pins]
"1" = "a1"
"2" = "a0"
"3" = "alert"
"4" = "sda"
"5" = "scl"
"6" = "vs"
"7" = "gnd"
"8" = "vbus"
"9" = "in_n"
"10" = "in_p"

[models.ratings]
# 5.1 Absolute Maximum Ratings: VS 6 V; SDA GND-0.3 V to 6 V; input current into any pin 5 mA; TJ 150 degC. 5.4 Thermal Information, DGS: RthetaJA 144.6, RthetaJC(top) 53.3 degC/W.
max_voltage_v = 6.0
max_pin_current_a = 0.005
max_junction_temp_c = 150.0
theta_ja_c_per_w = 144.6
theta_jc_c_per_w = 53.3

[[models.envelope]]
kind = "supply_range"
pin = "vs"
min_v = 2.7
max_v = 5.5
abs_max_v = 6.0
basis = "TI SBOS547C, 5.5 Electrical Characteristics, operating supply range 2.7 V to 5.5 V; 5.1 Absolute Maximum Ratings, VVS 6 V"

[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "INA226 register map"
bus = "i2c"
i2c_address = 0x40

# Pin Configuration and Functions, DGS (VSSOP-10); the same pad map as [models.pins].
[sensor.pins]
1 = "a1"
2 = "a0"
3 = "alert"
4 = "sda"
5 = "scl"
6 = "vs"
7 = "gnd"
8 = "vbus"
9 = "in_n"
10 = "in_p"

# Table 6-2, rows in printed order (GND = "low", VS = "high"): 1000000b = 0x40 to 1001111b = 0x4F.
[[sensor.address_select]]
address = 0x40
straps = { a1 = "low", a0 = "low" }
[[sensor.address_select]]
address = 0x41
straps = { a1 = "low", a0 = "high" }
[[sensor.address_select]]
address = 0x42
straps = { a1 = "low", a0 = "sda" }
[[sensor.address_select]]
address = 0x43
straps = { a1 = "low", a0 = "scl" }
[[sensor.address_select]]
address = 0x44
straps = { a1 = "high", a0 = "low" }
[[sensor.address_select]]
address = 0x45
straps = { a1 = "high", a0 = "high" }
[[sensor.address_select]]
address = 0x46
straps = { a1 = "high", a0 = "sda" }
[[sensor.address_select]]
address = 0x47
straps = { a1 = "high", a0 = "scl" }
[[sensor.address_select]]
address = 0x48
straps = { a1 = "sda", a0 = "low" }
[[sensor.address_select]]
address = 0x49
straps = { a1 = "sda", a0 = "high" }
[[sensor.address_select]]
address = 0x4A
straps = { a1 = "sda", a0 = "sda" }
[[sensor.address_select]]
address = 0x4B
straps = { a1 = "sda", a0 = "scl" }
[[sensor.address_select]]
address = 0x4C
straps = { a1 = "scl", a0 = "low" }
[[sensor.address_select]]
address = 0x4D
straps = { a1 = "scl", a0 = "high" }
[[sensor.address_select]]
address = 0x4E
straps = { a1 = "scl", a0 = "sda" }
[[sensor.address_select]]
address = 0x4F
straps = { a1 = "scl", a0 = "scl" }

# Stimuli: the shunt drop VSENSE = VIN+ - VIN- in mV and the bus voltage at VBUS in V (the part itself measures these).
[[sensor.input]]
name = "shunt_mv"
default = 0.0

[[sensor.input]]
name = "bus_v"
default = 0.0

# Configuration Register (00h), POR 0100 0001 0010 0111b = 4127h: RST bit 15 (self-clearing: a stored RST reads the POR value), AVG bits 11:9,
# VBUSCT bits 8:6, VSHCT bits 5:3, MODE bits 2:0 (111 = shunt and bus, continuous).
[[sensor.write_register]]
addr = 0x00
encoding = "u16_be"
store = "config"
default = 16679
[[sensor.write_register.field]]
name = "rst"
bits = [15, 15]
[[sensor.write_register.field]]
name = "mode"
bits = [2, 0]

# RST reads back as the POR value (reset is not an observable state)
[[sensor.register]]
addr = 0x00
encoding = "u16_be"
expr = "if(rst == 1.0, 16679.0, config)"

# Shunt Voltage Register (01h): LSB 2.5 uV, two's complement, full scale 81.92 mV. The triggered modes are treated as continuous.
[[sensor.register]]
addr = 0x01
encoding = "i16_be"
expr = "if(rst == 1.0, 0.0, if((mode == 1.0 || mode == 3.0 || mode == 5.0 || mode == 7.0), max(-32768.0, min(32767.0, shunt_mv * 400.0)), 0.0))"

# Bus Voltage Register (02h): LSB 1.25 mV, bit 15 always 0, full scale 40.96 V.
[[sensor.register]]
addr = 0x02
encoding = "u16_be"
expr = "if(rst == 1.0, 0.0, if((mode == 2.0 || mode == 3.0 || mode == 6.0 || mode == 7.0), max(0.0, min(32767.0, bus_v * 800.0)), 0.0))"

# Power Register (03h) = Current x Bus / 20000 (Equation 4); Current Register (04h) = Shunt x Calibration / 2048 (Equation 3).
# Both read 0 until the Calibration Register is written (footnote 2 of Table 7-1).
[[sensor.register]]
addr = 0x03
encoding = "u16_be"
expr = "if(rst == 1.0, 0.0, if((mode == 1.0 || mode == 3.0 || mode == 5.0 || mode == 7.0) && (mode == 2.0 || mode == 3.0 || mode == 6.0 || mode == 7.0), max(0.0, min(65535.0, max(-32768.0, min(32767.0, max(-32768.0, min(32767.0, shunt_mv * 400.0)) * cal / 2048.0)) * max(0.0, min(32767.0, bus_v * 800.0)) / 20000.0)), 0.0))"

[[sensor.register]]
addr = 0x04
encoding = "i16_be"
expr = "if(rst == 1.0, 0.0, if((mode == 1.0 || mode == 3.0 || mode == 5.0 || mode == 7.0), max(-32768.0, min(32767.0, max(-32768.0, min(32767.0, shunt_mv * 400.0)) * cal / 2048.0)), 0.0))"

# Calibration Register (05h), POR 0000h; bit 15 is not used.
[[sensor.write_register]]
addr = 0x05
encoding = "u16_be"
store = "cal"
default = 0

[[sensor.register]]
addr = 0x05
encoding = "u16_be"
expr = "if(rst == 1.0, 0.0, if(cal > 32767.0, cal - 32768.0, cal))"

# Mask/Enable Register (06h), POR 0000h: function bits SOL..CNVR 15:10, APOL bit 1, LEN bit 0 read back as written. CVRF (bit 3) is read-only
# and is ASSUMED set whenever a measurement mode is selected, so a driver polling for 'conversion ready' completes; AFF (bit 4) and
# OVF (bit 2) read 0 (the alert engine is not modelled).
[[sensor.write_register]]
addr = 0x06
encoding = "u16_be"
store = "mask"
default = 0
[[sensor.write_register.field]]
name = "m_fn"
bits = [15, 10]
[[sensor.write_register.field]]
name = "m_apol"
bits = [1, 1]
[[sensor.write_register.field]]
name = "m_len"
bits = [0, 0]

[[sensor.register]]
addr = 0x06
encoding = "u16_be"
expr = "if(rst == 1.0, 0.0, m_fn * 1024.0 + m_apol * 2.0 + m_len + if(mode == 0.0 || mode == 4.0, 0.0, 8.0))"

# Alert Limit Register (07h), POR 0000h.
[[sensor.write_register]]
addr = 0x07
encoding = "u16_be"
store = "alert_limit"
default = 0
[[sensor.register]]
addr = 0x07
encoding = "u16_be"
expr = "alert_limit"

# Manufacturer ID Register (FEh) = 5449h ('TI'), MSB first (Table 7-1). Die ID Register (FFh) = 2260h (DID 226h, RID 0h; 2261h is the other
# die COO printed in footnote 3).
[[sensor.register]]
addr = 0xFE
const = [0x54, 0x49]

[[sensor.register]]
addr = 0xFF
const = [0x22, 0x60]

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vs"
return_role = "gnd"
power_on_threshold_v = 2.7    # 5.5 operating supply range minimum (VPOR is 2 V typical; the interface is specified from 2.7 V)
idle_a = 0.00033              # 5.5 IQ typical
read_a = 0.00033
write_a = 0.00033
low_power_a = 0.0000005       # 5.5 quiescent current, power-down (shutdown) mode, typical

[models.coverage]
implements = ["pin_roles", "open_drain_sda_alert_vol", "logic_levels_at_3v3", "active_supply_current", "absolute_ratings", "thermal_resistance", "supply_ranges", "i2c_address_strap", "four_level_address_pins", "register_map", "reset_values", "configuration_readback", "shunt_bus_current_power_from_inputs", "calibration_readback", "manufacturer_id_read", "die_id_read", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["conversion_timing", "averaging", "triggered_mode_one_shot", "alert_engine", "conversion_ready_flag_clear_on_read", "reset_clears_other_registers_after_rst_stored", "die_id_2261_variant", "sense_pin_ratings", "smbus_timeout", "high_speed_mode"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/ina226.pdf"
title = "Texas Instruments INA226 36V, 16-Bit, Ultra-Precise I2C Output Current, Voltage, and Power Monitor With Alert, SBOS547C, June 2011, revised August 2026"
