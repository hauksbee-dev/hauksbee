# Official built-in part library: sensors_power.
#
# Cards here are written from vendor datasheets only (every value carries a basis and a source).
# See target/launch/official-parts-20261022/ranking.md for the batch plan.

# -----------------------------------------------------------------------------
# DS3231: Maxim Integrated (Analog Devices) extremely accurate I2C-integrated RTC with
# TCXO and crystal, 16-pin SO 300 mil.
#
# Source: Maxim Integrated DS3231 datasheet 19-5170 Rev 10, 3/15. Absolute Maximum
#   Ratings, Recommended Operating Conditions, Electrical Characteristics, Pin
#   Description, Figure 1 Timekeeping Registers, the control, status, aging and
#   temperature register descriptions, and the I2C Serial Data Bus section (slave
#   address 1101000).
#
# FIXED ADDRESS 0x68 and no strap pin, so no address_select is used.
#
# THE CLOCK DOES NOT COUNT. The register map answers: time and date registers reset to
# 01/01/00 01 00:00:00 and read back what firmware wrote; the oscillator, the alarm
# match, the square-wave and 32 kHz outputs, the INT/SQW and RST pins, the 64-second
# temperature conversion and the VBAT switchover are not modelled. The temperature
# registers answer from the sensor input temp_c.
#
# OPEN-DRAIN OUTPUTS: SDA, INT/SQW and 32kHz sink only (a pull-up is required), so the
# card has no VOH. VOL is 0.4 V at 3 mA. Logic levels are fractions of VCC (VIH 0.7 x
# VCC, VIL 0.3 x VCC), evaluated at the typical VCC = 3.3 V. The part is also reachable
# from VBAT alone (the I2C interface is accessible whenever either supply is valid), and
# the supply coupling here keys on VCC only; the card does not model battery-only
# operation. The RST pin is an open-drain I/O with an internal 50 kohm pull-up to VCC;
# the five-pin groups marked N.C. (pins 5 to 12) "must be connected to ground".
#
# Currents are the printed MAXIMA at VCC = 3.63 V (ICCS standby 110 uA, ICCA active
# 200 uA); the datasheet prints no typical VCC current.
#
# Not modelled: timekeeping, alarms, the square-wave, 32 kHz and RST pins, the aging
# effect on frequency, the temperature conversion schedule (the temperature registers
# read 0 degC until the first conversion on the real part) and BBSQW/EOSC battery
# behaviour. The DS3231M (MEMS oscillator, 8-pin) is a different datasheet and is not
# covered by this card.
[[models]]
id = "ds3231"
kind = "digital"
description = "Maxim/Analog Devices DS3231 I2C RTC with TCXO, SO-16 (I2C register map at 0x68: BCD time registers with their reset values, control/status resets, aging, temperature from the sensor input; open-drain SDA; pad map and supply draw)"

[models.match]
# Order codes: DS3231S, DS3231SN, with the # / + RoHS suffix and the tape-and-reel suffix. DS3231M and DS3231MZ are a different part.
value_re = "(?i)^DS3231(SN?)?[#+]?(T&R|TR)?$"

[models.params]
vol   = 0.4      # Electrical Characteristics, VOL max for SDA, INT/SQW and 32kHz at IOL = 3 mA
vih   = 2.31     # Recommended Operating Conditions, VIH 0.7 x VCC min for SDA, SCL at the typical VCC = 3.3 V
vil   = 0.99     # Recommended Operating Conditions, VIL 0.3 x VCC max for SDA, SCL at the typical VCC = 3.3 V
supply_static_ua = 110.0   # Electrical Characteristics, ICCS standby supply current MAX at VCC = 3.63 V (no typical is printed)
supply_pin = "2"           # VCC
gnd_pin    = "13"          # GND
warning = "I2C register map only: time registers read back what was written and the clock does not count; alarms, outputs and VBAT operation are not modelled"

[models.pins]
# Pin Description / Pin Configuration, 16-pin SO.
"1"  = "out_32khz"  # 32 kHz output, open drain
"2"  = "vcc"
"3"  = "int_sqw"    # active-low interrupt / square-wave output, open drain
"4"  = "rst"        # active-low reset, open-drain I/O with an internal 50 kohm pull-up
"5"  = "nc"         # N.C., must be connected to ground
"6"  = "nc2"
"7"  = "nc3"
"8"  = "nc4"
"9"  = "nc5"
"10" = "nc6"
"11" = "nc7"
"12" = "nc8"
"13" = "gnd"
"14" = "vbat"       # backup supply input; connect to ground if unused
"15" = "sda"
"16" = "scl"

[models.ratings]
# Absolute Maximum Ratings: voltage on any pin relative to ground -0.3 V to +6.0 V; theta-JA 73 degC/W and theta-JC 23 degC/W (JESD51-7, four-layer board).
max_voltage_v = 6.0
theta_ja_c_per_w = 73.0
theta_jc_c_per_w = 23.0

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.3
max_v = 5.5
abs_max_v = 6.0
basis = "Maxim DS3231 19-5170 Rev 10, Recommended Operating Conditions, supply voltage VCC 2.3 V min, 3.3 V typ, 5.5 V max; Absolute Maximum Ratings, voltage range on any pin relative to ground -0.3 V to +6.0 V"

[[models.envelope]]
kind = "supply_range"
pin = "vbat"
min_v = 2.3
max_v = 5.5
abs_max_v = 6.0
basis = "Maxim DS3231 19-5170 Rev 10, Recommended Operating Conditions, supply voltage VBAT 2.3 V min, 3.0 V typ, 5.5 V max; Absolute Maximum Ratings, voltage range on any pin relative to ground -0.3 V to +6.0 V"

# I2C Serial Data Bus: the 7-bit slave address is 1101000 (0x68).
[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "DS3231 register map"
bus = "i2c"
i2c_address = 0x68

# Stimulus: die temperature in degC (25 degC, room temperature, is an ASSUMED default; the part itself reads 0 degC until its first
# conversion).
[[sensor.input]]
name = "temp_c"
default = 25.0

# Figure 1 Timekeeping Registers, BCD. On first power-up the time and date reset to 01/01/00 01 00:00:00 (DD/MM/YY DOW HH:MM:SS), so
# seconds, minutes and hours are 00h, day-of-week 01h, date 01h, month 01h and year 00h. The clock itself does not count: a
# register reads back what firmware last wrote.
# 00h Seconds, reset 00h
[[sensor.write_register]]
addr = 0x00
encoding = "u8"
store = "seconds"
default = 0
[[sensor.register]]
addr = 0x00
encoding = "u8"
expr = "seconds"

# 01h Minutes, reset 00h
[[sensor.write_register]]
addr = 0x01
encoding = "u8"
store = "minutes"
default = 0
[[sensor.register]]
addr = 0x01
encoding = "u8"
expr = "minutes"

# 02h Hours (12/24 bit 6, AM/PM or 20 Hour bit 5), reset 00h
[[sensor.write_register]]
addr = 0x02
encoding = "u8"
store = "hours"
default = 0
[[sensor.register]]
addr = 0x02
encoding = "u8"
expr = "hours"

# 03h Day of week, reset 01h
[[sensor.write_register]]
addr = 0x03
encoding = "u8"
store = "day"
default = 1
[[sensor.register]]
addr = 0x03
encoding = "u8"
expr = "day"

# 04h Date, reset 01h
[[sensor.write_register]]
addr = 0x04
encoding = "u8"
store = "date"
default = 1
[[sensor.register]]
addr = 0x04
encoding = "u8"
expr = "date"

# 05h Month/Century (century bit 7), reset 01h
[[sensor.write_register]]
addr = 0x05
encoding = "u8"
store = "month"
default = 1
[[sensor.register]]
addr = 0x05
encoding = "u8"
expr = "month"

# 06h Year, reset 00h
[[sensor.write_register]]
addr = 0x06
encoding = "u8"
store = "year"
default = 0
[[sensor.register]]
addr = 0x06
encoding = "u8"
expr = "year"

# Alarm registers 07h to 0Dh: Figure 1 notes that unless specified the register state is not defined at power-up. 00h is ASSUMED.
# 07h Alarm 1 Seconds, ASSUMED 00h (not defined at power-up)
[[sensor.write_register]]
addr = 0x07
encoding = "u8"
store = "alarm_07"
default = 0
[[sensor.register]]
addr = 0x07
encoding = "u8"
expr = "alarm_07"

# 08h Alarm 1 Minutes, ASSUMED 00h (not defined at power-up)
[[sensor.write_register]]
addr = 0x08
encoding = "u8"
store = "alarm_08"
default = 0
[[sensor.register]]
addr = 0x08
encoding = "u8"
expr = "alarm_08"

# 09h Alarm 1 Hours, ASSUMED 00h (not defined at power-up)
[[sensor.write_register]]
addr = 0x09
encoding = "u8"
store = "alarm_09"
default = 0
[[sensor.register]]
addr = 0x09
encoding = "u8"
expr = "alarm_09"

# 0Ah Alarm 1 Day/Date, ASSUMED 00h (not defined at power-up)
[[sensor.write_register]]
addr = 0x0A
encoding = "u8"
store = "alarm_0a"
default = 0
[[sensor.register]]
addr = 0x0A
encoding = "u8"
expr = "alarm_0a"

# 0Bh Alarm 2 Minutes, ASSUMED 00h (not defined at power-up)
[[sensor.write_register]]
addr = 0x0B
encoding = "u8"
store = "alarm_0b"
default = 0
[[sensor.register]]
addr = 0x0B
encoding = "u8"
expr = "alarm_0b"

# 0Ch Alarm 2 Hours, ASSUMED 00h (not defined at power-up)
[[sensor.write_register]]
addr = 0x0C
encoding = "u8"
store = "alarm_0c"
default = 0
[[sensor.register]]
addr = 0x0C
encoding = "u8"
expr = "alarm_0c"

# 0Dh Alarm 2 Day/Date, ASSUMED 00h (not defined at power-up)
[[sensor.write_register]]
addr = 0x0D
encoding = "u8"
store = "alarm_0d"
default = 0
[[sensor.register]]
addr = 0x0D
encoding = "u8"
expr = "alarm_0d"

# Control (0Eh), POR 00011100b = 1Ch: EOSC bit 7, BBSQW bit 6, CONV bit 5 (reads back clear once the conversion is done), RS2/RS1 bits 4:3, INTCN bit 2, A2IE bit 1, A1IE bit 0
[[sensor.write_register]]
addr = 0x0E
encoding = "u8"
store = "control"
default = 28
[[sensor.write_register.field]]
name = "eosc"
bits = [7, 7]
[[sensor.write_register.field]]
name = "conv"
bits = [5, 5]

[[sensor.register]]
addr = 0x0E
encoding = "u8"
expr = "control - 32.0 * conv"

# Control/Status (0Fh), POR 1000 1xxxb: OSF bit 7 = 1, EN32kHz bit 3 = 1; BSY, A2F and A1F are X at power-up and are ASSUMED 0 (88h)
[[sensor.write_register]]
addr = 0x0F
encoding = "u8"
store = "status"
default = 136
[[sensor.write_register.field]]
name = "osf"
bits = [7, 7]
[[sensor.write_register.field]]
name = "en32khz"
bits = [3, 3]
[[sensor.register]]
addr = 0x0F
encoding = "u8"
expr = "status"

# Aging Offset (10h), POR 00h (two's complement)
[[sensor.write_register]]
addr = 0x10
encoding = "u8"
store = "aging"
default = 0
[[sensor.register]]
addr = 0x10
encoding = "u8"
expr = "aging"

# Temperature (11h, 12h): a 10-bit two's-complement code, 0.25 degC per LSB; the integer part is 11h and the fraction is the upper two
# bits of 12h (00011001 01b = +25.25 degC). Read-only.
[[sensor.register]]
addr = 0x11
encoding = "u8"
expr = "if(temp_c < 0.0, 256.0 + floor(temp_c), floor(temp_c))"

[[sensor.register]]
addr = 0x12
encoding = "u8"
expr = "(floor(temp_c * 4.0) - 4.0 * floor(temp_c)) * 64.0"

[sensor.protocol]
style = "i2c_pointer"
'''

[models.peripheral_power]
supply_role = "vcc"
return_role = "gnd"
power_on_threshold_v = 2.3    # Recommended Operating Conditions, VCC min (the power-fail voltage VPF is 2.45 V to 2.70 V)
idle_a = 0.00011              # Electrical Characteristics, ICCS max, VCC = 3.63 V
read_a = 0.0002               # Electrical Characteristics, ICCA max, VCC = 3.63 V, SCL at 400 kHz
write_a = 0.0002
low_power_a = 0.00011

[models.coverage]
implements = ["pin_roles", "open_drain_sda_vol", "logic_levels_at_3v3", "standby_supply_current", "absolute_ratings", "thermal_resistance", "supply_ranges", "i2c_fixed_address", "register_map", "reset_values", "time_register_readback", "control_register_readback", "conv_bit_self_clear", "temperature_registers_from_input", "bus_coupled_active_current", "supply_voltage_gating"]
missing = ["timekeeping_counting", "alarms", "square_wave_and_32khz_outputs", "rst_pin_and_pushbutton", "vbat_battery_operation", "temperature_conversion_schedule", "aging_offset_effect", "oscillator_stop_flag_logic", "alarm_register_power_up_state_not_defined", "ds3231m_variant"]

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.analog.com/media/en/technical-documentation/data-sheets/DS3231.pdf"
title = "Maxim Integrated DS3231 Extremely Accurate I2C-Integrated RTC/TCXO/Crystal, 19-5170; Rev 10; 3/15"
locator = "Absolute Maximum Ratings; Recommended Operating Conditions; Electrical Characteristics; Pin Description; Figure 1 Timekeeping Registers; Control, Status, Aging Offset and Temperature registers; I2C Serial Data Bus"
sha256 = "dc81cd89bee82d0c57b654d6315e03dec913fb8fe753cc80b2a3f1cca71cbb34"

# Recommended Operating Conditions as printed, in fractions of VCC.
[[models.source.characteristic]]
parameter = "VIH logic 1 input SDA, SCL"
min = 0.7
unit = "VCC"
conditions = "SDA, SCL"
basis = "Recommended Operating Conditions, 0.7 x VCC min"

[[models.source.characteristic]]
parameter = "VIL logic 0 input SDA, SCL"
max = 0.3
unit = "VCC"
conditions = "SDA, SCL"
basis = "Recommended Operating Conditions, 0.3 x VCC max"

# -----------------------------------------------------------------------------
# DS1307: Maxim Integrated (Analog Devices) 64 x 8, serial I2C real-time clock with 56
# bytes of battery-backed SRAM. 8-pin PDIP (300 mils) and 8-pin SO (150 mils), same pin
# order.
#
# Source: Maxim Integrated DS1307 datasheet, "REV: 3/15". Ordering Information, Absolute
#   Maximum Ratings, Recommended DC Operating Conditions, DC Electrical
#   Characteristics, Pin Description, Table 2 Timekeeper Registers, the Control Register
#   section and the I2C slave address (1101000).
#
# FIXED ADDRESS 0x68, no strap pin. The DS1307 and DS3231 and the MPU-6050 default
# address all share 0x68; the card's address is what a bus-address check reads.
#
# THE CLOCK DOES NOT COUNT. The register map answers: seconds reset to 80h (CH set), the
# date registers reset to 01/01/00 01, the control register to 03h, and the 56 RAM bytes
# (08h to 3Fh) hold what firmware writes. The oscillator, the square-wave output, the
# power-fail switchover and the 3Fh to 00h address wrap are not modelled.
#
# OPEN-DRAIN OUTPUTS: SDA and SQW/OUT sink only (a pull-up is required), so the card has
# no VOH. VOL is 0.4 V at IOL = 5 mA, which is a heavy-load figure and is therefore not
# cited as a characteristic row. The 5 V part has TTL-level inputs (VIH 2.2 V, VIL 0.8
# V), so it reads a 3.3 V bus as logic high; VCC itself must be 4.5 V to 5.5 V and a 3.3 V
# supply is out of the recommended range (the supply envelope reports it).
#
# Currents are the printed MAXIMA (ICCS standby 200 uA, ICCA active 1.5 mA at fSCL = 100
# kHz); no typical is printed. The datasheet prints no thermal resistance.
#
# Not modelled: timekeeping, the CH oscillator control, SQW/OUT, X1/X2 crystal pins,
# VBAT operation and the VPF power-fail threshold (1.25 x VBAT).
[[models]]
id = "ds1307"
kind = "digital"
description = "Maxim/Analog Devices DS1307 I2C RTC with 56-byte RAM, PDIP-8 / SO-8 (I2C register map at 0x68: seconds reset 80h, date reset 01/01/00, control 03h, battery RAM; open-drain SDA; pad map and supply draw)"

[models.match]
# Order codes: DS1307+, DS1307N+, DS1307Z+, DS1307ZN+ and the Z+T&R / ZN+T&R tape-and-reel codes. Sibling RTCs (DS1302, DS1305, DS1337, DS1338, DS1340) are different parts.
value_re = "(?i)^DS1307(Z|N|ZN)?[#+]?(T&R|TR)?$"

[models.params]
vol   = 0.4      # DC Electrical Characteristics, VOL max for SDA and SQW/OUT at IOL = 5 mA
vih   = 2.2      # Recommended DC Operating Conditions, VIH min
vil   = 0.8      # Recommended DC Operating Conditions, VIL max
supply_static_ua = 200.0   # DC Electrical Characteristics, ICCS standby supply current MAX (VCC = 5.0 V, SDA and SCL = 5.0 V; no typical is printed)
supply_pin = "8"           # VCC
gnd_pin    = "4"           # GND
warning = "I2C register map only: time registers read back what was written and the clock does not count; SQW/OUT and VBAT operation are not modelled"

[models.pins]
# Pin Description / Pin Configurations, PDIP and SO.
"1" = "x1"       # 32.768 kHz crystal input
"2" = "x2"       # crystal output
"3" = "vbat"     # backup supply, ground it if unused
"4" = "gnd"
"5" = "sda"
"6" = "scl"
"7" = "sqw_out"  # square wave / output driver, open drain
"8" = "vcc"

[models.ratings]
# Absolute Maximum Ratings: voltage on any pin relative to ground -0.5 V to +7.0 V. No thermal resistance is printed.
max_voltage_v = 7.0

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 4.5
max_v = 5.5
abs_max_v = 7.0
basis = "Maxim DS1307 REV 3/15, Recommended DC Operating Conditions, supply voltage VCC 4.5 V min, 5.0 V typ, 5.5 V max; Absolute Maximum Ratings, voltage range on any pin relative to ground -0.5 V to +7.0 V"

[[models.envelope]]
kind = "supply_range"
pin = "vbat"
min_v = 2.0
max_v = 3.5
abs_max_v = 7.0
basis = "Maxim DS1307 REV 3/15, Recommended DC Operating Conditions, VBAT battery voltage 2.0 V min, 3 V typ, 3.5 V max; Absolute Maximum Ratings, voltage range on any pin relative to ground -0.5 V to +7.0 V"

# Slave address byte: the 7-bit DS1307 address is 1101000 (0x68).
[models.peripheral]
kind = "register_map"
spec_toml = '''
[sensor]
name = "DS1307 register map"
bus = "i2c"
i2c_address = 0x68

# Table 2 Timekeeper Registers, BCD. On first application of power the time and date registers are typically reset to
# 01/01/00 01 00:00:00 (MM/DD/YY DOW HH:MM:SS) and the CH bit in the seconds register is set to 1, so the seconds register
# reads 80h. The clock does not count: a register reads back what firmware last wrote.
# 00h Seconds (CH bit 7 = 1: oscillator halted), reset 80h
[[sensor.write_register]]
addr = 0x00
encoding = "u8"
store = "seconds"
default = 128
