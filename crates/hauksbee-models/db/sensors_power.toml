# -----------------------------------------------------------------------------
# ACS712 x05B: Allegro MicroSystems fully integrated Hall-effect linear current sensor
# IC with 2.4 kVrms isolation and a 1.2 mohm primary conductor, SOIC-8 (suffix LC),
# +-5 A, 185 mV/A.
#
# Source: Allegro ACS712-DS, Rev. 22, February 13, 2024 (MCO-0000197). Selection Guide,
#   Absolute Maximum Ratings, Isolation Characteristics, Terminal List, Common
#   Operating Characteristics, Common Thermal Characteristics, x05B Performance
#   Characteristics.
#
# THE PART IS ANALOG, NOT A BUS DEVICE: there is no register map. VIOUT (pin 7) sits at
# VCC x 0.5 with no primary current (ratiometric: the zero-current output is half the
# supply, and the sensitivity scales with VCC / 5 V) and moves 185 mV/A, positive
# slope, with the current flowing IP+ (pins 1, 2) to IP- (pins 3, 4). The model does not
# drive VIOUT from a current (there is no analog-output transducer card kind): it is a
# supply, ratings and pad-map card, so a board that powers it from 3.3 V, loads VIOUT
# with under 4.7 kohm or hangs a supply on the primary pins is checked, and the
# sensitivity and offset live in the cited characteristic rows.
#
# THE PRIMARY PINS ARE ISOLATED FROM THE SIGNAL PINS. Pins 1 to 4 carry the measured
# current through a 1.2 mohm conductor and are galvanically separate from pins 5 to 8
# (2.4 kVrms withstand for 60 s, 420 V peak working voltage for basic isolation). They
# are named ip_p1, ip_p2, ip_n1 and ip_n2 and are not given the 8 V supply rating, which
# belongs to VCC and VIOUT only. The primary conductor survives a 100 A, 100 ms pulse.
#
# SUPPLY: VCC 4.5 V to 5.5 V (5.0 V typical), ICC 10 mA typ, 13 mA max, output open.
# The output needs RLOAD >= 4.7 kohm to GND and CLOAD <= 10 nF; it sources at most 3 mA
# and sinks 10 mA (absolute maximum). The reverse supply and output limit is -0.1 V.
#
# SIBLINGS: this card covers the x05B orderables only (ACS712ELCTR-05B-T (the only 05B orderable in the selection guide)). The x20A and 30A
# variants have their own cards and sensitivities; the bare ACS712 is ambiguous (no range
# or sensitivity) and does not resolve. ACS711, ACS714, ACS723, ACS724, ACS758 and
# ACS37xxx are different parts.
[[models]]
id = "acs712_05b"
kind = "digital"
description = "Allegro ACS712 x05B Hall-effect current sensor, +-5 A, 185 mV/A, SOIC-8 (analog VIOUT = VCC/2 + sensitivity x IP; supply, ratings and pad map only, no bus model)"

[models.match]
# ACS712ELCTR-05B-T (the only 05B orderable in the selection guide).
value_re = "(?i)^ACS712(ELC(TR)?)?[- ]?05B(-T)?$"

[models.params]
supply_static_ua = 10000.0   # Common Operating Characteristics, ICC typ, VCC = 5.0 V, output open (13 mA max)
supply_pin = "8"             # VCC
gnd_pin    = "5"             # GND
warning = "analog output only: VIOUT (VCC/2 at zero current, 185 mV/A) is not driven from the primary current; the primary pins 1 to 4 are an isolated 1.2 mohm conductor and are not checked"

[models.pins]
# Terminal List / Pinout Diagram, 8-lead SOIC.
"1" = "ip_p1"    # IP+, fused internally with pin 2
"2" = "ip_p2"    # IP+
"3" = "ip_n1"    # IP-, fused internally with pin 4
"4" = "ip_n2"    # IP-
"5" = "gnd"
"6" = "filter"   # external capacitor to GND sets the bandwidth
"7" = "viout"    # analog output
"8" = "vcc"

[models.ratings]
# Absolute Maximum Ratings: supply voltage 8 V, output voltage 8 V; TJ(max) 165 degC. Common Thermal Characteristics: RthetaJA 23 degC/W on the Allegro 85-0322 evaluation board (includes the power consumed by the board), RthetaJL 5 degC/W.
max_voltage_v = 8.0
max_junction_temp_c = 165.0
theta_ja_c_per_w = 23.0

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 4.5
max_v = 5.5
abs_max_v = 8.0
basis = "Allegro ACS712-DS Rev. 22, Common Operating Characteristics, supply voltage VCC 4.5 V min, 5.0 V typ, 5.5 V max; Absolute Maximum Ratings, supply voltage 8 V"

[models.coverage]
implements = ["pin_roles", "supply_current", "absolute_ratings", "thermal_resistance", "supply_ranges", "supply_voltage_gating"]
missing = ["analog_output_vout_vs_current", "ratiometric_output_with_vcc", "zero_current_offset_vcc_half", "filter_pin_bandwidth", "output_load_limits_4k7_10nf", "output_source_sink_current_limits", "primary_conductor_resistance", "overcurrent_transient_tolerance", "isolation_withstand_rating", "temperature_drift_of_offset_and_sensitivity", "supply_voltage_reverse_limit", "-S_and_-T_variants_identical"]

