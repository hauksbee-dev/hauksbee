[[models]]
id = "lm2904v_d"
kind = "opamp"
description = "Texas Instruments LM2904V / LM2904AV industry-standard dual op-amp, 8-pin, SOIC-8 (D), 3 to 30 V (32 V absolute maximum)"
variant_of = "lm2904v"

[models.match]
# Family match: LM2904V and LM2904AV (the V class, 3 to 30 V recommended, 32 V absolute maximum and test maximum, Electrical Characteristics 5.8, V suffix). The anchored V keeps the plain LM2904 and the LM2904B/BA family out of this one.
# This member's orderable codes: LM2904VQDR, LM2904VQDRG4, LM2904AVQDR, LM2904AVQDRG4.
value_re = "(?i)^LM2904A?V"

[models.variant]
orderable_re = "(?i)^LM2904A?VQDR(G4)?(\\.[AB])?$"
orderable = ["LM2904VQDR", "LM2904VQDRG4", "LM2904AVQDR", "LM2904AVQDRG4"]
package = "SOIC-8"
basis = "TI SLOS068AB Addendum-Page 3 and 5 PACKAGING INFORMATION: LM2904VQDR, LM2904VQDRG4 (marking L2904V) and LM2904AVQDR, LM2904AVQDRG4 (marking L2904AV), SOIC (D) | 8, Active, -40 to 125 C; the .A/.B suffixed entries of the same codes are the same parts"

# VICR, one entry per channel. headroom_v is the 25 C row's 1.5 V, not the full-temperature 2 V, as on the lm358 card.
# The op-amp's real rule is stricter than this both-inputs form (EITHER input above V+ - 1.5 V leaves the guaranteed
# range), so the envelope UNDER-reports: a flagged board is certainly out of range, an unflagged one is not
# thereby in range.
[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_a", "in_minus_a"]
headroom_v = 1.5
severity = "serious"
conditions = "TA = 25 C"
basis = "TI SLOS068AB 5.8 Electrical Characteristics: LM2904, LM2904V p.11, INPUT VOLTAGE RANGE, VCM: (V-) to (V+) - 1.5 V at TA = 25 C, VS = 5 V to the test maximum supply; (V+) - 2 V over TA = -40 C to 125 C; 5.3 Recommended Operating Conditions p.5 prints VCM from V- to (V+) - 2 V"

[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_b", "in_minus_b"]
headroom_v = 1.5
severity = "serious"
conditions = "TA = 25 C"
basis = "TI SLOS068AB 5.8 Electrical Characteristics: LM2904, LM2904V p.11, INPUT VOLTAGE RANGE, VCM: (V-) to (V+) - 1.5 V at TA = 25 C, VS = 5 V to the test maximum supply; (V+) - 2 V over TA = -40 C to 125 C; 5.3 Recommended Operating Conditions p.5 prints VCM from V- to (V+) - 2 V"

[[models.envelope]]
kind = "input_tolerance"
pins = ["in_plus_a", "in_minus_a", "in_plus_b", "in_minus_b"]
max_v = 32.0
abs_max_v = 32.0
severity = "serious"
basis = "TI SLOS068AB 5.1 Absolute Maximum Ratings p.4, input voltage VI either input, -0.3 V to 32 V; the datasheet prints no separate recommended VI maximum, so max_v repeats the absolute maximum (the recommended common-mode range is the input_common_mode rows above)"
abs_max_basis = "TI SLOS068AB 5.1 Absolute Maximum Ratings p.4, input voltage VI, either input, LM2904V class, MAX 32 V"
note = "the datasheet does not print the reference point of VI; read as ground-referenced (single-supply operation), ASSUMED"

# SCHEMA GAP: the recommended supply voltage VS = (V+) - (V-) = 3 V to 30 V (5.3 Recommended Operating Conditions p.5) is a
# differential supply that also covers split-rail operation; a supply_range row on the vcc pin alone would read it as
# ground-referenced and falsely flag a +-1.5 V split supply, so no supply_range row is written. The absolute maximum VS
# below is carried by ratings.max_voltage_v.
# SCHEMA GAP: the differential input voltage limit VID (5.1 Absolute Maximum Ratings p.4) and the ESD ratings (5.2 p.4)
# have no ratings or envelope field; they are characteristic rows below.

[models.params]
gain = 100000.0   # AOL 100 V/mV typical, VS = 15 V, VO = 1 V to 11 V, RL >= 2 kOhm, TA = 25 C; p.11 5.8 OPEN-LOOP GAIN (25 V/mV at the low limit)
pole_hz = 7.0   # DERIVED: GBW 0.7 MHz typical (p.11 5.8 FREQUENCY RESPONSE) / AOL 100000 V/V typical. Not a printed row
slew = 0.3   # SR 0.3 V/us typical, G = +1, p.11 5.8 FREQUENCY RESPONSE. No limit column is printed
swing_hi = 1.5   # headroom below V+: the minimum output level printed is VS - 1.5 V at RL >= 10 kOhm, VS = 5 V, TA = 25 C, p.11 5.8 OUTPUT
swing_lo = 0.02   # headroom above V-: maximum 20 mV at VS = 5 V, RL <= 10 kOhm, TA = -40 C to 125 C, p.11 5.8 OUTPUT
warning = "LM2904V and LM2904AV: the output swing is bounded by the supply pins (V(V-)+20 mV to V(V+)-1.5 V, the datasheet maximum headrooms at RL >= 10 kOhm on the positive rail and RL <= 10 kOhm on the negative rail, VS = 5 V), but the load and supply dependence is NOT modelled. For the V-suffix parts the datasheet prints a larger positive-rail headroom at the maximum supply (up to 5 V at RL >= 10 kOhm and 6 V at RL = 2 kOhm over temperature), which this card's 1.5 V does not cover. The output current limit (source 20 mA minimum / 30 mA typical, sink 10 mA minimum / 20 mA typical, short-circuit 40 mA typical, all magnitudes) is not modelled. The input common-mode range is checked by the input_common_mode envelope, and that rule UNDER-REPORTS for an op-amp: it fires only when BOTH inputs of one channel sit above V+ - 1.5 V, whereas the part leaves its guaranteed range as soon as EITHER input does, and the V- lower end is not checked. Input offset voltage (3 mV typical, 7 mV maximum, 1 mV and 2 mV for the A-suffix LM2904AV), input bias current (-20 nA typical, -250 nA maximum) and input offset current (2 nA typical, 50 nA maximum) are taken as zero, and the gain is the 100 V/mV typical rather than the 25 V/mV minimum, so a computed output is the NOMINAL part at 25 C, not a bound over the datasheet spread or over temperature. The 7 Hz pole is DERIVED from the typical 0.7 MHz gain-bandwidth product and the typical 100 V/mV gain, not printed, and is a single-pole fit. Both amplifiers share one supply leg and one pair of rails."

[models.coverage]
implements = ["finite_open_loop_gain", "supply_referenced_output_swing", "dominant_pole", "slew_rate_limit",
              "dual_channel", "split_or_single_supply", "input_common_mode_range", "absolute_ratings",
              "thermal_resistance"]
missing = ["output_current_limit", "load_dependent_output_swing", "temperature_dependent_output_swing",
