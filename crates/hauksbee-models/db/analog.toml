# SCHEMA GAP: the recommended supply voltage VS = (V+) - (V-) = 3 V to 30 V (5.3 Recommended Operating Conditions p.5) is a
# differential supply that also covers split-rail operation; a supply_range row on the vcc pin alone would read it as
# ground-referenced and falsely flag a +-1.5 V split supply, so no supply_range row is written. The absolute maximum VS
# below is carried by ratings.max_voltage_v.
# SCHEMA GAP: the differential input voltage limit VID (5.1 Absolute Maximum Ratings p.4) and the ESD ratings (5.2 p.4)
# have no ratings or envelope field; they are characteristic rows below.

[models.params]
gain = 100000.0   # AOL 100 V/mV typical, VS = 15 V, VO = 1 V to 11 V, RL >= 2 kOhm, TA = 25 C; p.11 5.8 OPEN-LOOP GAIN (25 V/mV at the low limit)
pole_hz = 7.0   # DERIVED: GBW 0.7 MHz typical (p.11 5.8 FREQUENCY RESPONSE) / AOL 100000 V/V typical. Not a printed row
slew = 0.3   # SR 0.3 V/us typical, G = +1, p.11 5.8 FREQUENCY RESPONSE. No limit column is printed
swing_hi = 1.5   # headroom below V+: the minimum output level printed is VS - 1.5 V at RL >= 10 kOhm, VS = 5 V, TA = 25 C, p.11 5.8 OUTPUT
swing_lo = 0.02   # headroom above V-: maximum 20 mV at VS = 5 V, RL <= 10 kOhm, TA = -40 C to 125 C, p.11 5.8 OUTPUT
warning = "LM2904V and LM2904AV: the output swing is bounded by the supply pins (V(V-)+20 mV to V(V+)-1.5 V, the datasheet maximum headrooms at RL >= 10 kOhm on the positive rail and RL <= 10 kOhm on the negative rail, VS = 5 V), but the load and supply dependence is NOT modelled. For the V-suffix parts the datasheet prints a larger positive-rail headroom at the maximum supply (up to 5 V at RL >= 10 kOhm and 6 V at RL = 2 kOhm over temperature), which this card's 1.5 V does not cover. The output current limit (source 20 mA minimum / 30 mA typical, sink 10 mA minimum / 20 mA typical, short-circuit 40 mA typical, all magnitudes) is not modelled. The input common-mode range is checked by the input_common_mode envelope, and that rule UNDER-REPORTS for an op-amp: it fires only when BOTH inputs of one channel sit above V+ - 1.5 V, whereas the part leaves its guaranteed range as soon as EITHER input does, and the V- lower end is not checked. Input offset voltage (3 mV typical, 7 mV maximum, 1 mV and 2 mV for the A-suffix LM2904AV), input bias current (-20 nA typical, -250 nA maximum) and input offset current (2 nA typical, 50 nA maximum) are taken as zero, and the gain is the 100 V/mV typical rather than the 25 V/mV minimum, so a computed output is the NOMINAL part at 25 C, not a bound over the datasheet spread or over temperature. The 7 Hz pole is DERIVED from the typical 0.7 MHz gain-bandwidth product and the typical 100 V/mV gain, not printed, and is a single-pole fit. Both amplifiers share one supply leg and one pair of rails."

