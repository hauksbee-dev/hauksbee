# SCHEMA GAP: input voltage VI (either input) is -0.3 V to 32 V and the differential input voltage is +-32 V (p.5 Absolute Maximum Ratings); input_tolerance needs a recommended max_v and the sheet
# prints the recommended input limit only as the supply-relative VCM <= VCC - 2 V, so no input_tolerance row
# is written. ESD ratings (p.5 6.2) and the output short-circuit duration are not envelope fields.

[models.params]
gain     = 100000.0   # AVD typ 100 V/mV, VCC = 15 V, RL >= 2 kOhm, 25 C (min 25 V/mV), p.12 6.8 Electrical Characteristics
pole_hz  = 12.0       # DERIVED: B1 1.2 MHz typ (p.13 6.10, ASSUMED to apply to this class) / AVD 100000 typ; not a printed row
slew     = 0.5        # SR typ 0.5 V/us at unity gain, p.13 6.10 Operating Conditions (ASSUMED to apply to this class: no device column is named)
swing_hi = 1.5        # VOH at 25 C: MIN VCC - 1.5 V, p.12 6.8 Electrical Characteristics
swing_lo = 0.020      # VOL, RL <= 10 kOhm, full range: MAX 20 mV, p.12 6.8 Electrical Characteristics
warning  = "the output swing is bounded by the supply pins (V(V-)+20 mV to V(V+)-1.5 V, the 25 C and light-load datasheet headrooms), but over the -40 to +125 C range at the maximum supply the datasheet guarantees only 26 V at VCC = 32 V and RL = 2 kOhm (a 6 V headroom, DERIVED) and 27 V at RL >= 10 kOhm (5 V, DERIVED), so a computed swing near the top rail is optimistic hot and cold. The source/sink current limits and short-circuit current are not modelled. The input common-mode range (0 to VCC - 1.5 V at 25 C, VCC - 2 V over temperature) is checked only by the input_common_mode envelope, which fires when BOTH inputs of a channel are above the limit. Input offset voltage (7 mV max at 25 C), input bias current (250 nA max) and input offset current (50 nA max) are taken as zero and the gain is the 100 V/mV typ rather than the 25 V/mV min, so a computed output is the NOMINAL part at 25 C. The slew rate and unity-gain bandwidth come from the sheet's section 6.10 Operating Conditions, which names no device column, and are ASSUMED to apply to this class; the 12 Hz pole is derived from them. The sheet prints the supply current for the four amplifiers together. All four amplifiers share one supply leg and one pair of rails."

