# other vendors' parts are different datasheets and do not match.
# This member's orderable codes: CD4052BNSR.
mpn_re = "(?i)^CD4052(B[A-Z0-9]*)?$"

[models.variant]
orderable_re = "(?i)^CD4052BNSR$"
orderable = ["CD4052BNSR"]
package = "SOP-16"
basis = "TI CD4051B SCHS047O, Package Information p.1 and Package Option Addendum (orderable codes): package NS (SOP), 16 pins"

[models.params]
# Kind decision: kind digital with identity_only, NOT kind analog_switch. The analog_switch binder has no
# 1-of-N com + channel shape (it binds SPDT, shared-select DPDT, quad gates and SPST) and a bind would
# stamp a fabricated two-pad path or fail open; identity_only keeps the part OPEN and carries only the
# pad map, supply range, control levels and ratings.
identity_only = true
vih = 3.5    # p.8 Electrical Characteristics (continued), VIH min at VDD = 5 V
vil = 0.8    # p.7 Electrical Characteristics (continued), VIL max at VDD = 5 V, printed as 0.8 V at every VDD
warning = "pad map, supply ranges, control levels and ratings only; kind is digital with identity_only because the part is a 1-of-N analog multiplexer, which the analog_switch binder has no shape for: no channel is ever closed, no on-resistance, leakage or break-before-make is modelled"
unlocked_by = "a validated behavioural model of an N-channel analog multiplexer (binary address decode, enable, on-resistance and leakage per channel)"

[models.levels]
vih = [[5.0, 3.5], [10.0, 7.0], [15.0, 11.0]]  # p.8 Electrical Characteristics, VIH min at VDD = 5 / 10 / 15 V
vil = [[5.0, 0.8], [10.0, 0.8], [15.0, 0.8]]   # p.7 Electrical Characteristics, VIL max printed as 0.8 V at every VDD

[models.pins]
# CD4052B pin function table p.4; figure p.3.
"1" = "ch_y0"
"2" = "ch_y2"
"3" = "com_y"
"4" = "ch_y3"
"5" = "ch_y1"
"6" = "inh"
"7" = "vee"
"8" = "vss"
"9" = "sel1"
"10" = "sel0"
"11" = "ch_x3"
"12" = "ch_x0"
"13" = "com_x"
"14" = "ch_x1"
"15" = "ch_x2"
"16" = "vdd"

[models.ratings]
max_voltage_v = 20.0           # p.5 Absolute Maximum Ratings, supply voltage V+ to V- referenced to VSS -0.5 to 20 V
max_pin_current_a = 0.01       # p.5 Absolute Maximum Ratings, DC input current any one input +-10 mA
max_junction_temp_c = 150.0    # p.5 Absolute Maximum Ratings, TJMAX plastic package
theta_ja_c_per_w = 64.0      # p.5 5.4 Thermal Information, RthetaJA, NS (SOP), CD405x

[[models.envelope]]
kind = "supply_range"
pin = "vdd"
min_v = 3.0
max_v = 20.0
abs_max_v = 20.0
basis = "TI CD4051B SCHS047O, p.1 1 Features, single supply range 3 V to 20 V (performance degrades for VDD < 3 V); the Recommended Operating Conditions table (p.5) prints temperature only"
abs_max_basis = "TI CD4051B SCHS047O, p.5 5.1 Absolute Maximum Ratings, supply voltage V+ to V- referenced to VSS -0.5 V to 20 V"

# SCHEMA GAP: the dual-supply range (+-3 V to +-10 V, p.1 Features) and the VEE pin are not single-pin supply ranges; no envelope row is written for VEE.
# SCHEMA GAP: DC input voltage -0.5 V to VDD + 0.5 V (p.5 Absolute Maximum Ratings) is supply-relative; input_tolerance takes only a fixed max_v.

[models.coverage]
implements = ["pin_roles", "absolute_ratings", "supply_ranges", "logic_input_levels", "thermal_resistance", "quiescent_supply_current"]
missing = ["channel_switch_matrix_binding", "break_before_make", "on_resistance_vs_supply_and_signal", "channel_leakage_loading", "switching_times", "vee_negative_supply_span", "analog_signal_range_vdd_vee", "input_vdd_plus_0v5_limit", "ac_bandwidth_and_crosstalk"]

