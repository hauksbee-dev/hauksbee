swing_hi = 1.48   # headroom below V+, VOH row maximum 1.48 V at IOUT = 1 mA, VS = 5 V to 36 V, TA = 25 C, p.8 5.6 OUTPUT (1.42 V at 50 uA, 1.61 V at 5 mA characterization only)
swing_lo = 0.02   # headroom above V-, maximum 20 mV at VS = 5 V, RL <= 10 kOhm connected to V-, TA = -40 C to +125 C, p.8 5.6 OUTPUT (150 mV at a 50 uA sink, 1 V at 1 mA)
warning = "the output swing is bounded by the supply pins (V(V-)+20 mV to V(V+)-1.48 V, the datasheet maximum headrooms at IOUT = 1 mA on the positive rail and RL <= 10 kOhm to V- on the negative rail), but the load dependence is NOT modelled: the positive-rail headroom is 1.42 V at 50 uA and 1.61 V at 5 mA (characterization only), the negative-rail headroom is 150 mV at a 50 uA sink and 1 V at 1 mA, so a heavier load gets a swing this card overstates. The output current limit (source 20 mA minimum / 30 mA typical, sink 10 mA minimum / 20 mA typical, short-circuit 40 mA typical, all magnitudes) is not modelled. The input common-mode range is checked by the input_common_mode envelope, and that rule UNDER-REPORTS for an op-amp: it fires only when BOTH inputs of one channel sit above V+ - 1.5 V, whereas the part leaves its guaranteed range as soon as EITHER input does, and the V- lower end is not checked. Input offset voltage (0.3 mV typical, 3 mV maximum for LM2904B and 2 mV for LM2904BA), input bias current (-10 nA typical, -35 nA maximum) and input offset current (0.5 nA typical, 4 nA maximum) are taken as zero, and the gain is the 140 V/mV typical rather than the 70 V/mV minimum, so a computed output is the NOMINAL part at 25 C, not a bound over the datasheet spread or over temperature. The 8.57 Hz pole is DERIVED from the typical 1.2 MHz gain-bandwidth product and the typical 140 V/mV gain, not printed, and is a single-pole fit. Both amplifiers share one supply leg and one pair of rails."

