[[models]]
id = "max4466_sc70"
kind = "opamp"
description = "Maxim/ADI MAX4466 micropower microphone preamplifier op amp (decompensated, minimum stable gain +5, 600 kHz GBWP, rail-to-rail output, 2.4 V to 5.5 V), 5-pin SC70; kind opamp because the part IS an op amp whose gain is set by external feedback resistors (the sheet prints no internal gain), so the op-amp binder semantics fit"
variant_of = "max4466"

[models.match]
# Family match: the anchored number keeps the MAX4466 apart from the MAX4465/4467/4468/4469 of the same
# datasheet (different gain stability, shutdown or dual die). Members differ only in package (EXK = SC70-5,
# EUK = SOT23-5 in the part number); this member's orderable code: MAX4466EXK-T.
mpn_re = "(?i)^MAX4466([^0-9]|$)"

[models.variant]
orderable_re = "(?i)^MAX4466EXK(-T)?$"
orderable = ["MAX4466EXK-T"]
package = "SC70-5"
basis = "Maxim MAX4465-MAX4469 19-1950 Rev 1 4/01, Ordering Information p.1: MAX4466EXK-T, -40 C to +85 C, pin-package 5 SC70-5"

[models.params]
gain = 1778279.41      # DERIVED 10^(125/20): Electrical Characteristics p.2, AVOL typ 125 dB, RL = 100 kOhm to VCC/2, 0.05 V <= VOUT <= VCC - 0.05 V
pole_hz = 0.3374        # DERIVED: GBWP 600 kHz typ (Electrical Characteristics p.2, MAX4466/MAX4468) / gain 1778279.41
slew = 0.3              # Electrical Characteristics p.3, SR typ 300 mV/us (MAX4466/MAX4468, AV = +5, output step 4 V)
swing_lo = 0.05         # Electrical Characteristics p.2, VOL MAX 50 mV, RL = 10 kOhm (typ 14 mV; 10 mV typ at RL = 100 kOhm)
swing_hi = 0.05         # Electrical Characteristics p.2, VOH |VCC - VOH| MAX 50 mV, RL = 10 kOhm (typ 16 mV)
rail_lo = 0.05          # fallback levels only (deck `.model opamp(...)`, no pins): DERIVED 0 V + 50 mV at the VCC = 5 V test supply
rail_hi = 4.95          # DERIVED 5 V - 50 mV at the VCC = 5 V test supply
warning = "rail-to-rail output within 50 mV (the guaranteed MAX at RL = 10 kOhm) of each supply pin; input common-mode range is -0.1 V to VCC - 0.1 V, of which only the upper end is checked by the envelope row (the -0.1 V floor has no field) and only when BOTH inputs exceed it. The MAX4466 is a DECOMPENSATED op amp: it is only stable at a closed-loop gain of +5 V/V or more (a Selector Guide / Features fact with no schema field, so NOT enforced), and the datasheet prints no closed-loop gain equation or internal gain: the board's own feedback network sets the gain around the op-amp model. Gain 1.778e6 is the typical 125 dB at RL = 100 kOhm (95 dB typ, 80 dB min at RL = 10 kOhm), DERIVED as 10^(125/20); the 0.337 Hz pole is DERIVED from the typical 600 kHz GBWP / that gain; slew 0.3 V/us is the typical 300 mV/us at AV = +5 with a 4 V output step. Output short-circuit current (15 mA typ), capacitive-load limit (100 pF), input offset (1 mV typ, 5 mV max), input bias and offset currents, noise (80 nV/rtHz) and THD are not modelled; the supply current (24 uA typ) is a characteristic row only. The MAX4465/67/68/69 siblings are separate parts and are not this card."

[models.pins]
# Pin Description p.6 (MAX4465/MAX4466 column) and Pin Configurations p.1 (SC70/SOT23, top view); the SC70-5 and
# SOT23-5 packages share one pad map.
"1" = "in_plus"  # IN+
"2" = "vss"  # GND
"3" = "in_minus"  # IN-
"4" = "out"  # OUT
"5" = "vcc"  # VCC

[models.ratings]
max_voltage_v = 6.0           # Absolute Maximum Ratings p.2, Supply Voltage (VCC to GND) +6 V
max_junction_temp_c = 150.0   # Absolute Maximum Ratings p.2, Junction Temperature +150 C
max_power_w = 0.2        # Absolute Maximum Ratings p.2, continuous power dissipation at TA = +70 C, 5-Pin SC70 (derate 2.5mW/°C above +70°C) 200mW
theta_ja_c_per_w = 400   # DERIVED 1 / 2.5 mW/C derating, Absolute Maximum Ratings p.2 (the sheet prints no RthJA)
# No maximum pin current is printed, so none is given.

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.4
max_v = 5.5
abs_max_v = 6.0
basis = "Maxim MAX4465-MAX4469 19-1950 Rev 1 4/01, Electrical Characteristics p.2, Supply Voltage Range VCC 2.4 V to 5.5 V (inferred from the PSRR test); Features p.1 +2.4 V to +5.5 V"
abs_max_basis = "Maxim MAX4465-MAX4469 19-1950 Rev 1 4/01, Absolute Maximum Ratings p.2, Supply Voltage (VCC to GND) +6 V"

[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus", "in_minus"]
headroom_v = 0.1
basis = "Maxim MAX4465-MAX4469 19-1950 Rev 1 4/01, Electrical Characteristics p.2, Input Common-Mode Range VCM -0.1 V min, VCC - 0.1 V max (inferred from the CMRR test), TA = TMIN to TMAX"

# SCHEMA GAP: all pins other than the supply are limited to -0.3 V to VCC + 0.3 V (Absolute Maximum Ratings p.2), a
# supply-relative limit; input_tolerance takes only a fixed max_v, so no input_tolerance row is written.
# SCHEMA GAP: the input common-mode floor is -0.1 V (below ground); input_common_mode carries only the headroom
# below the positive rail.
# SCHEMA GAP: the MAX4466 is decompensated and stable only at a closed-loop gain of +5 V/V or more (Features p.1,
# Selector Guide p.10); no field carries a minimum stable gain, so it is a characteristic row.
# SCHEMA GAP: output short-circuit to GND or VCC is continuous (Absolute Maximum Ratings p.2); no field carries it.

[models.coverage]
implements = ["finite_open_loop_gain", "supply_referenced_output_swing", "rail_to_rail_output", "dominant_pole", "slew_rate_limit", "single_channel", "supply_voltage_envelope", "input_common_mode_upper_headroom", "quiescent_supply_current", "thermal_resistance"]
missing = ["minimum_stable_gain_check", "output_current_limit", "load_dependent_output_swing", "input_offset_voltage", "input_bias_current", "input_offset_current", "input_common_mode_negative_floor", "capacitive_load_stability", "noise", "distortion", "parameter_spread", "closed_loop_gain_equation_not_printed"]

