[[models]]
id = "lm2902k_d"
kind = "opamp"
description = "TI LM2902K quad op-amp, SOIC-14 (D), 3 V to 26 V supply, -40 C to +125 C"
variant_of = "lm2902k"

[models.match]
# Family match for LM2902K: anchored so the other LM2902 classes (B, BA, plain, K, KV, KAV print
# different electricals or ratings), the LM324/LM2904 parts and the LM124/LM224 parts do not bind here.
# This member's orderable codes: LM2902KD, LM2902KDR, LM2902KDR.A.
mpn_re = "(?i)^LM2902K((D|DB|N|NS|PW)[A-Z0-9]*(\\.A)?)?$"

[models.variant]
orderable_re = "(?i)^LM2902KD(R)?(\\.A)?$"
orderable = ["LM2902KD", "LM2902KDR", "LM2902KDR.A"]
package = "SOIC-14 (D)"
basis = "TI LM2902 family SLOS066AE 12 Mechanical, Packaging, and Orderable Information, Packaging Information addendum (pages 3-5 of the addendum): LM2902KD, LM2902KDR, LM2902KDR.A are printed with package D 14 pins"

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 3.0
max_v = 26.0
abs_max_v = 26.0
severity = "serious"
basis = "TI LM2902 family SLOS066AE p.2 Related Products, supply voltage 3 to 26 (K) for the LM2902K"
abs_max_basis = "TI LM2902 family SLOS066AE p.5 6.1 Absolute Maximum Ratings, supply voltage VCC MAX 26 V (LM2902 column); ASSUMED for the K class, whose Recommended Operating Conditions maximum is also 26 V (p.2 Related Products, 3 to 26 (K)); the table's third column heading LM2902xxx does not say whether it covers the K part"

[[models.envelope]]
kind = "input_common_mode"
