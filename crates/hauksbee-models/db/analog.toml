kind = "digital"
description = "Texas Instruments CD74HC4052 dual 4-channel analog multiplexer/demultiplexer (HC) (TI package PW (TSSOP)), TSSOP-16; kind digital with identity_only, the part is left open in the circuit solve"
variant_of = "cd74hc4052"

[models.match]
# Family match: TI-only (HCT, CD54 and other vendors' 74HC parts are different datasheets and do not match).
