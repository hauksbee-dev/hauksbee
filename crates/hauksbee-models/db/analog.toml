# SCHEMA GAP: input voltage VI (either input) is -0.3 V to 40 V and the differential input voltage is +-40 V (p.5 Absolute Maximum Ratings); input_tolerance needs a recommended max_v and the sheet
# prints the recommended input limit only as the supply-relative VCM <= VCC - 2 V, so no input_tolerance row
# is written. ESD ratings (p.5 6.2) and the output short-circuit duration are not envelope fields.

[models.params]
gain     = 100000.0   # AOL typ 100 V/mV, VS = 15 V, RL >= 10 kOhm (min 50 V/mV), p.9 6.6 Electrical Characteristics
pole_hz  = 12.0       # DERIVED: GBW 1.2 MHz typ (p.9 6.6) / AOL 100000 typ; not a printed row
slew     = 0.5        # SR typ 0.5 V/us, RL = 1 MOhm, CL = 30 pF, p.9 6.6 Electrical Characteristics
swing_hi = 1.5        # positive-rail headroom, IOUT = -50 uA: MAX 1.5 V, p.10 6.6 OUTPUT (1.6 V at 1 mA, 1.75 V at 5 mA)
swing_lo = 0.020      # negative-rail headroom, VS = 5 V, RL <= 10 kOhm to V-: MAX 20 mV, p.10 6.6 OUTPUT
warning  = "the output swing is bounded by the supply pins (V(V-)+20 mV to V(V+)-1.5 V, the datasheet light-load MAX headrooms), but the output stage is not otherwise modelled: the headroom grows with load (up to 1.6 V at 1 mA and 1.75 V at 5 mA on the positive rail, up to 150 mV at 50 uA sink and 1 V at 1 mA on the negative rail), the source/sink current limits (about 20 mA / 10 mA min) and the short-circuit current are not modelled, so a heavier load than the headrooms assume is answered as if the part could drive it. The input common-mode range (V- to V+ - 1.5 V at 25 C, V+ - 2 V over temperature) is checked only by the input_common_mode envelope, which fires when BOTH inputs of a channel are above the limit. Input offset voltage (3.0 mV max for LM2902B), input bias current (35 nA max) and input offset current (4 nA max) are taken as zero, and the gain is the 100 V/mV typ rather than the 50 V/mV min, so a computed output is the NOMINAL part at 25 C, not a bound over the datasheet's spread. The 12 Hz pole is derived from the typical 1.2 MHz gain-bandwidth and the typical gain. All four amplifiers share one supply leg and one pair of rails."

[models.coverage]
implements = ["finite_open_loop_gain", "supply_referenced_output_swing", "dominant_pole",
              "slew_rate_limit", "quad_channel", "split_or_single_supply",
              "supply_voltage_envelope", "input_common_mode_range", "pin_roles",
              "absolute_ratings", "thermal_resistance"]
missing = ["output_current_limit", "load_dependent_output_swing", "temperature_dependent_output_swing",
           "input_offset_voltage", "input_bias_current", "input_offset_current", "parameter_spread",
           "quiescent_supply_current", "input_overvoltage_limit", "differential_input_limit"]

