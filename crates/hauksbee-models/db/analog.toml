[[models]]
id = "lm386_pdip8_n1"
kind = "digital"
description = "TI LM386 low-voltage audio power amplifier, PDIP (P) 8, grade LM386N-1: pad map, supply 4 V to 12 V, input ceiling and ratings only (kind digital with identity_only; not kind opamp because the part is a fixed-gain self-biased power amplifier, so no amplification or output is modelled)"
variant_of = "lm386"

[models.match]
# Family match: the anchored number keeps the LM386 apart from other LM38x parts. Members differ by package
# and by electrical grade (N-1/N-3/N-4 and M-1/MM-1 print different supply ranges and output powers); this
# member's orderable codes: LM386N-1, LM386N-1/NOPB, LM386N-1/NOPB.B.
mpn_re = "(?i)^LM386([^0-9]|$)"

[models.variant]
orderable_re = "(?i)^LM386N-1(/NOPB(\\.B)?)?$"
orderable = ["LM386N-1", "LM386N-1/NOPB", "LM386N-1/NOPB.B"]
package = "PDIP-8"
basis = "TI LM386 SNAS545D, Device Information p.1 lists LM386N-1 in PDIP (P) 8; Package Option Addendum (Addendum-Page 1) orderable table gives the /NOPB, /NOPB.B codes for this package"

[models.params]
# Kind decision: kind digital with identity_only, NOT kind opamp. The LM386 is a fixed-gain power amplifier (gain 20, internal 1.35 kohm and 15 kohm feedback, gain pins 1 and 8) whose output self-biases to VS/2 through the BYPASS pin; the kind opamp binder would stamp an ideal open-loop op-amp between the inputs with a swing taken from the rails, which would produce a wrong output for it. identity_only keeps the part OPEN in the circuit solve and carries only the pad map, supply range, input ceiling and ratings.
identity_only = true
supply_static_ua = 4000.0   # 6.5 Electrical Characteristics p.5, IQ quiescent current typ 4 mA, VS = 6 V, VIN = 0 (8 mA max)
warning = "pad map, supply range, input ceiling and ratings only; kind is digital with identity_only because the LM386 is a fixed-gain (20, up to 200 with a capacitor from pin 1 to pin 8) power amplifier whose output self-biases to one-half the supply through BYPASS, not an ideal op-amp: no amplification, no VS/2 output bias, no gain network on pins 1 and 8, no bandwidth, distortion or output power is modelled and no output waveform is produced"
unlocked_by = "a validated behavioural model of a fixed-gain self-biased audio power amplifier (gain 20 to 200, output at VS/2)"

[models.pins]
# Table 5-1 Pin Functions p.3 (the sheet prints one 8-pin table for the PDIP, SOIC and VSSOP packages).
"1" = "gain1"  # GAIN: gain-setting pin (pins 1 and 8 open gives gain 20; a capacitor from 1 to 8 gives up to 200)
"2" = "in_minus"  # -INPUT inverting input, ground referenced (internal 50 kohm to ground)
"3" = "in_plus"  # +INPUT noninverting input, ground referenced (internal 50 kohm to ground)
"4" = "gnd"  # GND ground reference
"5" = "out"  # VOUT output, self-biases to one-half the supply
"6" = "vcc"  # VS power supply voltage (role vcc: the sheet calls the pin VS)
"7" = "bypass"  # BYPASS bypass decoupling path
"8" = "gain8"  # GAIN: gain-setting pin

[models.ratings]
max_voltage_v = 15.0          # 6.1 Absolute Maximum Ratings p.4, Supply Voltage VCC (LM386N-1/-3, LM386M-1) 15 V
# max_power_w is ABSENT: 6.1 p.4 prints Package Dissipation 1.25 W (LM386N) with no ambient or case temperature, so it stays a characteristic row only.
theta_ja_c_per_w = 53.4     # 6.4 Thermal Information p.4, RθJA P (PDIP) 8 pins
# No maximum junction temperature and no maximum pin current is printed, so none is given (storage -65 to 150 C is in a
# characteristic row).

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 4.0
max_v = 12.0
abs_max_v = 15.0
basis = "TI LM386 SNAS545D, 6.5 Electrical Characteristics p.5, VS operating supply voltage 4 V to 12 V (LM386N-1, -3, LM386M-1, LM386MM-1); 6.3 Recommended Operating Conditions p.4 prints the same range"
abs_max_basis = "TI LM386 SNAS545D, 6.1 Absolute Maximum Ratings p.4, Supply Voltage VCC 15 V (LM386N-1/-3, LM386M-1)"

[[models.envelope]]
kind = "input_tolerance"
pins = ["in_minus", "in_plus"]
max_v = 0.4
abs_max_v = 0.4
basis = "TI LM386 SNAS545D, 6.3 Recommended Operating Conditions p.4, VI analog input voltage -0.4 V to 0.4 V"
abs_max_basis = "TI LM386 SNAS545D, 6.1 Absolute Maximum Ratings p.4, Input Voltage VI -0.4 V to 0.4 V"

# SCHEMA GAP: the input range is -0.4 V to +0.4 V (6.1 p.4, 6.3 p.4); input_tolerance takes only the positive
# ceiling max_v, so the -0.4 V floor is not carried by any envelope row.
# SCHEMA GAP: the part is a fixed-gain amplifier (gain 20, up to 200) with a self-centring output at VS/2; the
# schema has no amplifier kind between opamp and digital, and no field for the gain-setting network on pins 1 and 8.
# SCHEMA GAP: minimum speaker (load) impedance 4 ohm (6.3 p.4) has no field; it is a characteristic row.

[models.coverage]
implements = ["pin_roles", "supply_ranges", "absolute_ratings", "input_voltage_ceiling", "quiescent_current_row", "gain_rows", "output_power_row", "thermal_resistance", "package_dissipation"]
missing = ["audio_amplification", "self_centering_output_bias_at_half_supply", "bypass_pin_bias", "gain_network_on_pins_1_and_8", "bandwidth_and_frequency_response", "distortion", "output_power_versus_load", "output_voltage_swing", "power_supply_rejection", "minimum_load_impedance_check", "input_negative_limit", "supply_current_versus_supply_voltage_curve"]

