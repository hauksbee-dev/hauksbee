# ─────────────────────────────────────────────────────────────────────────────

# TI 4051 / 4052 analog multiplexers. kind digital with identity_only: the analog_switch binder has no 1-of-N
# com + channel shape (it binds SPDT, shared-select DPDT, quad gates and SPST), and the analog_switch card sweep
# (external_five_coverage) rejects a switch card with no pickable terminal pair, so these are pad map,
# supply, control-level and rating cards and the part stays open in the circuit solve.
# HC: CD74HC4051 / CD74HC4052 (SCHS122O, N PDIP / D SOIC / NS SO / PW TSSOP). HCT and CD54 types, the CD74HC4053, and
# other vendors' 74HC405x are not covered. B series: CD4051B / CD4052B (SCHS047O, E PDIP / J CDIP / D SOIC / NS SOP / PW TSSOP).

[[models]]
id = "cd74hc4051_pdip16"
kind = "digital"
description = "Texas Instruments CD74HC4051 8-channel analog multiplexer/demultiplexer (HC) (TI package N (PDIP)), PDIP-16; kind digital with identity_only, the part is left open in the circuit solve"
variant_of = "cd74hc4051"

[models.match]
# Family match: TI-only (HCT, CD54 and other vendors' 74HC parts are different datasheets and do not match).
# This member's orderable codes: CD74HC4051E, CD74HC4051EE4.
mpn_re = "(?i)^CD74HC4051([A-Z][A-Z0-9]*)?$"

[models.variant]
orderable_re = "(?i)^CD74HC4051E(E4)?$"
orderable = ["CD74HC4051E", "CD74HC4051EE4"]
package = "PDIP-16"
basis = "TI CD74HC4051 SCHS122O, Package Option Addendum (orderable codes) and Table 4-1 pin table: package N (PDIP), 16 pins"

[models.params]
# Kind decision: kind digital with identity_only, NOT kind analog_switch. The analog_switch binder has no
# 1-of-N com + channel shape (it binds SPDT, shared-select DPDT, quad gates and SPST) and a bind would
# stamp a fabricated two-pad path or fail open; identity_only keeps the part OPEN and carries only the
# pad map, supply range, control levels and ratings.
identity_only = true
vih = 3.15   # p.8 Electrical Characteristics: HC Devices, VIH min at VCC = 4.5 V
vil = 1.35   # p.8 Electrical Characteristics: HC Devices, VIL max at VCC = 4.5 V
warning = "pad map, supply ranges, control levels and ratings only; kind is digital with identity_only because the part is a 1-of-N analog multiplexer, which the analog_switch binder has no shape for: no channel is ever closed, no on-resistance, leakage or break-before-make is modelled"
unlocked_by = "a validated behavioural model of an N-channel analog multiplexer (binary address decode, enable, on-resistance and leakage per channel)"

[models.levels]
vih = [[2.0, 1.5], [4.5, 3.15], [6.0, 4.2]]  # p.8 Electrical Characteristics: HC Devices, VIH min at VCC = 2 / 4.5 / 6 V
vil = [[2.0, 0.5], [4.5, 1.35], [6.0, 1.8]]  # p.8 Electrical Characteristics: HC Devices, VIL max at VCC = 2 / 4.5 / 6 V

[models.pins]
# Table 4-1
"1" = "ch4"
"2" = "ch6"
"3" = "com"
"4" = "ch7"
"5" = "ch5"
"6" = "en_n"
"7" = "vee"
"8" = "gnd"
"9" = "sel2"
"10" = "sel1"
"11" = "sel0"
"12" = "ch3"
"13" = "ch0"
"14" = "ch1"
"15" = "ch2"
"16" = "vcc"

[models.ratings]
max_voltage_v = 7.0            # p.6 Absolute Maximum Ratings, VCC DC supply voltage -0.5 to 7 V
max_pin_current_a = 0.025      # p.6 Absolute Maximum Ratings, IOK DC switch current +-25 mA
max_junction_temp_c = 150.0    # p.6 Absolute Maximum Ratings, TJMAX 150 C
theta_ja_c_per_w = 77.3      # p.7 5.3 Thermal Information, RthetaJA, N (PDIP), CD74HC4051 column

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 2.0
max_v = 6.0
abs_max_v = 7.0
basis = "TI CD74HC4051 SCHS122O, p.7 5.4 Recommended Operating Conditions, VCC supply voltage range, CD54 and 74HC types 2 V to 6 V"
abs_max_basis = "TI CD74HC4051 SCHS122O, p.6 5.1 Absolute Maximum Ratings, VCC -0.5 V to 7 V"

[[models.envelope]]
kind = "input_tolerance"
pins = ["sel0", "sel1", "sel2", "en_n"]
max_v = 6.0
abs_max_v = 30.0
basis = "TI CD74HC4051 SCHS122O, p.7 5.4 Recommended Operating Conditions, VI DC input control voltage 0 to VCC with VCC max 6 V (DERIVED: the limit is supply-relative; 6 V is the ceiling at the highest rated VCC)"
abs_max_basis = "TI CD74HC4051 SCHS122O, p.6 5.1 Absolute Maximum Ratings, VSEL or VEN logic control input pin voltage (EN, Ax, SELx) -0.5 V to 30 V"

