"6" = "in_minus_b"   # IN2-
"7" = "out_b"   # OUT2
"8" = "vcc"   # V+

[models.ratings]
max_voltage_v = 26.0   # absolute maximum VS = (V+) - (V-), 5.1 Absolute Maximum Ratings p.4 (+-13 or 26 V)
max_junction_temp_c = 150.0   # operating virtual-junction temperature TJ maximum, 5.1 Absolute Maximum Ratings p.4
