id = "cd4051b_so16"
kind = "digital"
description = "Texas Instruments CD4051B 8-channel analog multiplexer/demultiplexer (TI package NS (SOP)), SOP-16; kind digital with identity_only, the part is left open in the circuit solve"
variant_of = "cd4051b"

[models.match]
# Family match: the B-series part only (CD4051 / CD4051B and its ordering codes); the legacy unbuffered A series and
# other vendors' parts are different datasheets and do not match.
# This member's orderable codes: CD4051BNSR.
mpn_re = "(?i)^CD4051(B[A-Z0-9]*)?$"

[models.variant]
orderable_re = "(?i)^CD4051BNSR$"
orderable = ["CD4051BNSR"]
package = "SOP-16"
