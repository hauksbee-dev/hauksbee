swing_lo = 0.02   # headroom above V-, VO MAX 20 mV at VS = 5.5 V, RL = 10 kOhm, p.13 6.10 OUTPUT (60 mV at RL = 2 kOhm)
rail_lo = 0.02   # fallback levels only (deck `.model opamp(...)`, no pins): the same headrooms stated as levels on the 5.5 V rail the swing row is specified at, p.13 6.10 OUTPUT
rail_hi = 5.48   # DERIVED: 5.5 V - 20 mV, p.13 6.10 OUTPUT, VS = 5.5 V, RL = 10 kOhm
warning = "rail-to-rail input AND output: the output reaches within 20 mV of each supply pin at VS = 5.5 V and RL = 10 kOhm (60 mV at RL = 2 kOhm), and the input common-mode range runs from (V-) - 0.1 V to (V+) + 0.1 V for the whole 1.8 V to 5.5 V supply range, which is why this card carries no input_common_mode envelope: there is no supply-relative input ceiling inside the rails to check. The input stage is a complementary pair with a transition region about (V+) - 1.4 V to (V+) - 0.8 V where CMRR, PSRR, offset voltage and offset drift degrade (p.22 7.3.1 Rail-to-Rail Input), which is NOT modelled. The load dependence of the swing is NOT modelled: the swing row is specified at VS = 5.5 V, this card applies it at every supply, and a load stiffer than 2 kOhm gets a swing the card overstates. The output current limit (+-50 mA typical short-circuit current at VS = 5 V) is not modelled. Input offset voltage (0.3 mV typical, 1.6 mV maximum at 25 C, 2 mV maximum over temperature), input bias current (0.5 pA typical) and input offset current (0.05 pA typical) are taken as zero, and the gain is the 130 dB typical (3162278 V/V) rather than the 104 dB minimum, so a computed output is the NOMINAL part at 25 C and VS = 5.5 V, not a bound over the datasheet spread, the supply or temperature (the typical gain is 100 dB at VS = 1.8 V). The 3.16 Hz pole is DERIVED from the typical 10 MHz gain-bandwidth product and the typical 130 dB gain, not printed, and is a single-pole fit to a part the datasheet gives 55 degrees of phase margin at G = +1. The capacitive load drive is 100 pF. Both amplifiers share one supply leg and one pair of rails. The two amplifiers are modelled as identical; channel separation is not modelled. This is the SOT-23-8 (DDF) card of TLV9062 (the TLV906xS shutdown parts are different parts and are not covered)."

