[[models]]
id = "lm2902b_pw"
kind = "opamp"
description = "TI LM2902B quad op-amp, TSSOP-14 (PW), 3 V to 36 V supply"
variant_of = "lm2902b"

[models.match]
# Family match for LM2902B: anchored so the other LM2902 classes (B, BA, plain, K, KV, KAV print
# different electricals or ratings), the LM324/LM2904 parts and the LM124/LM224 parts do not bind here.
# This member's orderable codes: LM2902BIPWR, LM2902BIPWR.A.
mpn_re = "(?i)^LM2902B(I[A-Z0-9]*(\\.A)?)?$"

[models.variant]
orderable_re = "(?i)^LM2902BIPWR(\\.A)?$"
orderable = ["LM2902BIPWR", "LM2902BIPWR.A"]
