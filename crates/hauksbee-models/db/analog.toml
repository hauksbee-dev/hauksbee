description = "Texas Instruments CD4052B dual 4-channel analog multiplexer/demultiplexer (TI package D (SOIC) / M), SOIC-16; kind digital with identity_only, the part is left open in the circuit solve"
variant_of = "cd4052b"

[models.match]
# Family match: the B-series part only (CD4051 / CD4051B and its ordering codes); the legacy unbuffered A series and
# other vendors' parts are different datasheets and do not match.
# This member's orderable codes: CD4052BM, CD4052BM96, CD4052BM961G4, CD4052BM96G3, CD4052BM96G4, CD4052BMT.
mpn_re = "(?i)^CD4052(B[A-Z0-9]*)?$"

[models.variant]
orderable_re = "(?i)^CD4052BM(96(1G4|G3|G4)?|T)?$"
orderable = ["CD4052BM", "CD4052BM96", "CD4052BM961G4", "CD4052BM96G3", "CD4052BM96G4", "CD4052BMT"]
package = "SOIC-16"
basis = "TI CD4051B SCHS047O, Package Information p.1 and Package Option Addendum (orderable codes): package D (SOIC) / M, 16 pins"

[models.params]
# Kind decision: kind digital with identity_only, NOT kind analog_switch. The analog_switch binder has no
# 1-of-N com + channel shape (it binds SPDT, shared-select DPDT, quad gates and SPST) and a bind would
