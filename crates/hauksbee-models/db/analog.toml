basis = "TI LM2902 family SLOS066AE p.9 6.6 Electrical Characteristics for LM2902B and LM2902BA, INPUT VOLTAGE RANGE VCM, VS = 3 V to 36 V: V- to (V+) - 1.5 V at TA = 25 C; the full-temperature row and p.6 6.3 Recommended Operating Conditions (VCM max VCC - 2) are tighter, and the card keeps the 25 C row as the other op-amp cards in this library do"

