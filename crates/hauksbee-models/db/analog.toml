basis = "TI CD4051B SCHS047O, p.1 1 Features, single supply range 3 V to 20 V (performance degrades for VDD < 3 V); the Recommended Operating Conditions table (p.5) prints temperature only"
abs_max_basis = "TI CD4051B SCHS047O, p.5 5.1 Absolute Maximum Ratings, supply voltage V+ to V- referenced to VSS -0.5 V to 20 V"

# SCHEMA GAP: the dual-supply range (+-3 V to +-10 V, p.1 Features) and the VEE pin are not single-pin supply ranges; no envelope row is written for VEE.
