basis = "TI LM2902 family SLOS066AE p.6 6.3 Recommended Operating Conditions, VCC supply voltage MIN 3 V MAX 36 V (LM324B, LM324BA, LM2902B, LM2902BA column)"
abs_max_basis = "TI LM2902 family SLOS066AE p.5 6.1 Absolute Maximum Ratings, supply voltage VCC MAX 40 V (LM324B, LM324BA, LM2902B, LM2902BA column)"

[[models.envelope]]
