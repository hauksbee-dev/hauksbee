variant_of = "tlv9061"

[models.match]
# Family match: TLV9061, the single op-amp. The match is anchored on the part number followed by the I temperature grade or the end of the name, so TLV9062 and TLV9064, the TLV9061S shutdown part (a different part with a SHDN pin, not covered by these cards), the TLV9061-Q1 automotive part, TLV9041, TLV9102 and every other TLV part stay out of this family.
# This member's orderable codes: TLV9061IDBVR, TLV9061IDBVRG4.
value_re = "(?i)^TLV9061(I|$|[^0-9A-Z-])"

[models.variant]
orderable_re = "(?i)^TLV9061IDBVR(G4)?(\\.A)?$"
orderable = ["TLV9061IDBVR", "TLV9061IDBVRG4"]
package = "SOT-23-5"
basis = "TI SBOS839N Addendum-Page 1-2 PACKAGING INFORMATION: TLV9061IDBVR and TLV9061IDBVRG4 (marking 1OAF), SOT-23 (DBV) | 5, Active, -40 to 125 C; the .A suffixed entries of the same codes are the same parts"

[[models.envelope]]
kind = "supply_range"
pin = "vcc"
min_v = 1.8
max_v = 5.5
abs_max_v = 6.0
severity = "serious"
basis = "TI SBOS839N 6.3 Recommended Operating Conditions p.10, VS supply voltage (VS = (V+) - (V-)) MIN 1.8 V MAX 5.5 V; 8.3 Power Supply Recommendations p.25 prints 1.8 V to 5.5 V (+-0.9 V to +-2.75 V)"
abs_max_basis = "TI SBOS839N 6.1 Absolute Maximum Ratings p.10, supply voltage (V+) - (V-), MAX 6 V; 8.3 p.26 caution: supply voltages larger than 6 V can permanently damage the device"
note = "the datasheet limit is the differential supply VS = (V+) - (V-); the row is checked on the vcc pin against ground, which is the single-supply reading, ASSUMED"

# SCHEMA GAP: the recommended input voltage range VI = (V-) - 0.1 V to (V+) + 0.1 V (6.3 Recommended Operating Conditions
# p.10) and the absolute-maximum signal-input common-mode range (V-) - 0.5 V to (V+) + 0.5 V (6.1 p.10) are supply-relative
# limits that sit BEYOND the rails. The input_common_mode envelope only expresses a ceiling a headroom BELOW a supply pin
# and input_tolerance takes only a fixed max_v, so neither is written; as on the mcp6002 card the part is rail-to-rail in
# its input, with no supply-relative input ceiling to check inside the supply range. The input-pin current limit of
# 10 mA (diode clamps to the rails, 6.1 note 2) is carried by ratings.max_pin_current_a.
# SCHEMA GAP: the differential input voltage limit (V+) - (V-) + 0.2 V (6.1 Absolute Maximum Ratings p.10) is supply-relative,
# the continuous output short-circuit rating (to ground, one amplifier per package, 6.1 note 3) and the storage
# temperature have no ratings field; the numeric ones are characteristic rows below.

[models.params]
gain = 3162278.0   # AOL 130 dB typical = 3162278 V/V (DERIVED from the dB figure), VS = 5.5 V, (V-) + 0.05 V < VO < (V+) - 0.05 V, RL = 10 kOhm; p.13 6.10 OPEN-LOOP GAIN (MIN 104 dB = 158489 V/V; typical 100 dB at VS = 1.8 V)
pole_hz = 3.1623   # DERIVED: GBP 10 MHz typical (p.13 6.10 FREQUENCY RESPONSE, VS = 5 V, G = +1) / AOL 3162278 V/V typical. Not a printed row
slew = 6.5   # SR 6.5 V/us typical, VS = 5 V, G = +1, p.13 6.10 FREQUENCY RESPONSE. No limit column is printed
swing_hi = 0.02   # headroom below V+, VO MAX 20 mV at VS = 5.5 V, RL = 10 kOhm, p.13 6.10 OUTPUT (60 mV at RL = 2 kOhm)
swing_lo = 0.02   # headroom above V-, VO MAX 20 mV at VS = 5.5 V, RL = 10 kOhm, p.13 6.10 OUTPUT (60 mV at RL = 2 kOhm)
rail_lo = 0.02   # fallback levels only (deck `.model opamp(...)`, no pins): the same headrooms stated as levels on the 5.5 V rail the swing row is specified at, p.13 6.10 OUTPUT
rail_hi = 5.48   # DERIVED: 5.5 V - 20 mV, p.13 6.10 OUTPUT, VS = 5.5 V, RL = 10 kOhm
warning = "rail-to-rail input AND output: the output reaches within 20 mV of each supply pin at VS = 5.5 V and RL = 10 kOhm (60 mV at RL = 2 kOhm), and the input common-mode range runs from (V-) - 0.1 V to (V+) + 0.1 V for the whole 1.8 V to 5.5 V supply range, which is why this card carries no input_common_mode envelope: there is no supply-relative input ceiling inside the rails to check. The input stage is a complementary pair with a transition region about (V+) - 1.4 V to (V+) - 0.8 V where CMRR, PSRR, offset voltage and offset drift degrade (p.22 7.3.1 Rail-to-Rail Input), which is NOT modelled. The load dependence of the swing is NOT modelled: the swing row is specified at VS = 5.5 V, this card applies it at every supply, and a load stiffer than 2 kOhm gets a swing the card overstates. The output current limit (+-50 mA typical short-circuit current at VS = 5 V) is not modelled. Input offset voltage (0.3 mV typical, 1.6 mV maximum at 25 C, 2 mV maximum over temperature), input bias current (0.5 pA typical) and input offset current (0.05 pA typical) are taken as zero, and the gain is the 130 dB typical (3162278 V/V) rather than the 104 dB minimum, so a computed output is the NOMINAL part at 25 C and VS = 5.5 V, not a bound over the datasheet spread, the supply or temperature (the typical gain is 100 dB at VS = 1.8 V). The 3.16 Hz pole is DERIVED from the typical 10 MHz gain-bandwidth product and the typical 130 dB gain, not printed, and is a single-pole fit to a part the datasheet gives 55 degrees of phase margin at G = +1. The capacitive load drive is 100 pF. This is the SOT-23-5 (DBV) card of TLV9061 (the TLV906xS shutdown parts are different parts and are not covered)."

