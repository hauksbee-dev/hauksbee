basis = "TI LM2902 family SLOS066AE 12 Mechanical, Packaging, and Orderable Information, Packaging Information addendum (pages 3-5 of the addendum): LM2902BIPWR, LM2902BIPWR.A are printed with package PW 14 pins"

[[models.envelope]]
