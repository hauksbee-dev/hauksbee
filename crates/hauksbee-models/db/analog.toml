# Official built-in part library: analog.
#
# Cards here are written from vendor datasheets only (every value carries a basis and a source).
# See target/launch/official-parts-20261022/ranking.md for the batch plan.

[[models]]
id = "lm2904b_d"
kind = "opamp"
description = "Texas Instruments LM2904B / LM2904BA industry-standard dual op-amp, 8-pin, SOIC-8 (D), 3 to 36 V"
variant_of = "lm2904b"

[models.match]
# Family match: LM2904B and LM2904BA (the B class, 3 to 36 V, Electrical Characteristics 5.6). The anchored B keeps the plain LM2904 and the LM2904V/AV parts, which have their own families, out of this one.
# This member's orderable codes: LM2904BIDR, LM2904BAIDR, LM2904BIDRG4.
value_re = "(?i)^LM2904B"

[models.variant]
orderable_re = "(?i)^LM2904B(A?IDR|IDRG4)(\\.[AB])?$"
orderable = ["LM2904BIDR", "LM2904BAIDR", "LM2904BIDRG4"]
package = "SOIC-8"
basis = "TI SLOS068AB Addendum-Page 3-4 PACKAGING INFORMATION: LM2904BIDR, LM2904BIDRG4 (marking L2904B) and LM2904BAIDR (marking 2904BA), SOIC (D) | 8, Active, -40 to 125 C; the .A/.B suffixed entries of the same codes are the same parts"

# VICR, one entry per channel. headroom_v is the 25 C row's 1.5 V, not the full-temperature 2 V, as on the lm358 card.
# The op-amp's real rule is stricter than this both-inputs form (EITHER input above V+ - 1.5 V leaves the guaranteed
# range), so the envelope UNDER-reports: a flagged board is certainly out of range, an unflagged one is not
# thereby in range.
[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_a", "in_minus_a"]
headroom_v = 1.5
severity = "serious"
conditions = "TA = 25 C"
basis = "TI SLOS068AB 5.6 Electrical Characteristics: LM2904B and LM2904BA p.8, INPUT VOLTAGE RANGE, VCM: (V-) to (V+) - 1.5 V at TA = 25 C, VS = 3 V to 36 V; (V+) - 2 V over TA = -40 C to +125 C, VS = 5 V to 36 V; 5.3 Recommended Operating Conditions p.5 prints VCM from V- to (V+) - 2 V"

[[models.envelope]]
kind = "input_common_mode"
supply = "vcc"
inputs = ["in_plus_b", "in_minus_b"]
headroom_v = 1.5
severity = "serious"
conditions = "TA = 25 C"
basis = "TI SLOS068AB 5.6 Electrical Characteristics: LM2904B and LM2904BA p.8, INPUT VOLTAGE RANGE, VCM: (V-) to (V+) - 1.5 V at TA = 25 C, VS = 3 V to 36 V; (V+) - 2 V over TA = -40 C to +125 C, VS = 5 V to 36 V; 5.3 Recommended Operating Conditions p.5 prints VCM from V- to (V+) - 2 V"

[[models.envelope]]
kind = "input_tolerance"
pins = ["in_plus_a", "in_minus_a", "in_plus_b", "in_minus_b"]
max_v = 40.0
abs_max_v = 40.0
severity = "serious"
basis = "TI SLOS068AB 5.1 Absolute Maximum Ratings p.4, input voltage VI either input, -0.3 V to 40 V; the datasheet prints no separate recommended VI maximum, so max_v repeats the absolute maximum (the recommended common-mode range is the input_common_mode rows above)"
abs_max_basis = "TI SLOS068AB 5.1 Absolute Maximum Ratings p.4, input voltage VI, either input, LM2904B class, MAX 40 V"
note = "the datasheet does not print the reference point of VI; read as ground-referenced (single-supply operation), ASSUMED"

# SCHEMA GAP: the recommended supply voltage VS = (V+) - (V-) = 3 V to 36 V (5.3 Recommended Operating Conditions p.5) is a
# differential supply that also covers split-rail operation; a supply_range row on the vcc pin alone would read it as
# ground-referenced and falsely flag a +-1.5 V split supply, so no supply_range row is written. The absolute maximum VS
# below is carried by ratings.max_voltage_v.
# SCHEMA GAP: the differential input voltage limit VID (5.1 Absolute Maximum Ratings p.4) and the ESD ratings (5.2 p.4)
# have no ratings or envelope field; they are characteristic rows below.

[models.params]
gain = 140000.0   # AOL 140 V/mV typical, VS = 15 V, VO = 1 V to 11 V, RL >= 10 kOhm to V-, TA = 25 C; p.8 5.6 OPEN-LOOP GAIN (70 V/mV at the low limit)
pole_hz = 8.5714   # DERIVED: GBW 1.2 MHz typical (p.8 5.6 FREQUENCY RESPONSE) / AOL 140000 V/V typical. Not a printed row
slew = 0.5   # SR 0.5 V/us typical, G = +1, p.8 5.6 FREQUENCY RESPONSE. No limit column is printed
swing_hi = 1.48   # headroom below V+, VOH row maximum 1.48 V at IOUT = 1 mA, VS = 5 V to 36 V, TA = 25 C, p.8 5.6 OUTPUT (1.42 V at 50 uA, 1.61 V at 5 mA characterization only)
swing_lo = 0.02   # headroom above V-, maximum 20 mV at VS = 5 V, RL <= 10 kOhm connected to V-, TA = -40 C to +125 C, p.8 5.6 OUTPUT (150 mV at a 50 uA sink, 1 V at 1 mA)
warning = "the output swing is bounded by the supply pins (V(V-)+20 mV to V(V+)-1.48 V, the datasheet maximum headrooms at IOUT = 1 mA on the positive rail and RL <= 10 kOhm to V- on the negative rail), but the load dependence is NOT modelled: the positive-rail headroom is 1.42 V at 50 uA and 1.61 V at 5 mA (characterization only), the negative-rail headroom is 150 mV at a 50 uA sink and 1 V at 1 mA, so a heavier load gets a swing this card overstates. The output current limit (source 20 mA minimum / 30 mA typical, sink 10 mA minimum / 20 mA typical, short-circuit 40 mA typical, all magnitudes) is not modelled. The input common-mode range is checked by the input_common_mode envelope, and that rule UNDER-REPORTS for an op-amp: it fires only when BOTH inputs of one channel sit above V+ - 1.5 V, whereas the part leaves its guaranteed range as soon as EITHER input does, and the V- lower end is not checked. Input offset voltage (0.3 mV typical, 3 mV maximum for LM2904B and 2 mV for LM2904BA), input bias current (-10 nA typical, -35 nA maximum) and input offset current (0.5 nA typical, 4 nA maximum) are taken as zero, and the gain is the 140 V/mV typical rather than the 70 V/mV minimum, so a computed output is the NOMINAL part at 25 C, not a bound over the datasheet spread or over temperature. The 8.57 Hz pole is DERIVED from the typical 1.2 MHz gain-bandwidth product and the typical 140 V/mV gain, not printed, and is a single-pole fit. Both amplifiers share one supply leg and one pair of rails."

[models.coverage]
implements = ["finite_open_loop_gain", "supply_referenced_output_swing", "dominant_pole", "slew_rate_limit",
              "dual_channel", "split_or_single_supply", "input_common_mode_range", "absolute_ratings",
              "thermal_resistance"]
missing = ["output_current_limit", "load_dependent_output_swing", "temperature_dependent_output_swing",
           "input_offset_voltage", "input_bias_current", "input_offset_current", "parameter_spread",
           "quiescent_supply_current", "differential_input_voltage_limit", "supply_minimum_envelope"]

[models.pins]
# TI SLOS068AB Table 4-1 Pin Functions p.3 (SOIC, SOT23-8, VSSOP, CDIP, PDIP, SO, TSSOP column), Figure 4-1 p.3: one 8-pin map for D, DDF, DGK, P, PS and PW.
"1" = "out_a"   # OUT1
"2" = "in_minus_a"   # IN1-
"3" = "in_plus_a"   # IN1+
"4" = "vss"   # V-
"5" = "in_plus_b"   # IN2+
"6" = "in_minus_b"   # IN2-
"7" = "out_b"   # OUT2
"8" = "vcc"   # V+

[models.ratings]
max_voltage_v = 40.0   # absolute maximum VS = (V+) - (V-), 5.1 Absolute Maximum Ratings p.4 (+-20 or 40 V)
max_junction_temp_c = 150.0   # operating virtual-junction temperature TJ maximum, 5.1 Absolute Maximum Ratings p.4
theta_ja_c_per_w = 124.7   # RthetaJA, SOIC-8 (D), 5.4 Thermal Information p.5

[models.source]
tier = "curated-library"
validation = "physical-bounds-only"
[[models.source.references]]
url = "https://www.ti.com/lit/ds/symlink/lm2904.pdf"
title = "Texas Instruments LM158, LM158A, LM258, LM258A, LM2904, LM2904B, LM2904BA, LM2904V, LM358, LM358A, LM358B, LM358BA Industry-Standard Dual Operational Amplifiers, SLOS068AB, June 1976, revised October 2024"
revision = "SLOS068AB, October 2024"
locator = "Package Information p.1; 4 Pin Configuration and Functions, Figure 4-1 and Table 4-1 p.3; 5.1 Absolute Maximum Ratings and 5.2 ESD Ratings p.4; 5.3 Recommended Operating Conditions and 5.4 Thermal Information p.5; 5.6 Electrical Characteristics LM2904B and LM2904BA pp.8-9; Package Option Addendum (orderable part numbers) pp.1-8 of the addendum"
