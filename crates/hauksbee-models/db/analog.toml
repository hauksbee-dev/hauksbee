gain = 140000.0   # AOL 140 V/mV typical, VS = 15 V, VO = 1 V to 11 V, RL >= 10 kOhm to V-, TA = 25 C; p.8 5.6 OPEN-LOOP GAIN (70 V/mV at the low limit)
pole_hz = 8.5714   # DERIVED: GBW 1.2 MHz typical (p.8 5.6 FREQUENCY RESPONSE) / AOL 140000 V/V typical. Not a printed row
