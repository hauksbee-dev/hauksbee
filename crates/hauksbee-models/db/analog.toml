mpn_re = "(?i)^CD74HC4052([A-Z][A-Z0-9]*)?$"

[models.variant]
orderable_re = "(?i)^CD74HC4052PW(R(G4)?)?$"
orderable = ["CD74HC4052PW", "CD74HC4052PWR", "CD74HC4052PWRG4"]
