[package]
name = "hauksbee-solve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sparse MNA circuit solver: DC, transient, and AC small-signal analysis for hauksbee."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
hauksbee-ir = { version = "0.1.0-beta.1", path = "../hauksbee-ir" }
serde = { workspace = true }
thiserror = { workspace = true }
num-complex = { workspace = true }
# S4 parallel island execution (docs/dev-plans/03-solver-performance.md §3.4):
# one ThreadPool per PartitionedTransient, gated behind an explicit
# `ParallelPolicy` in SolverOptions. Criterion below deliberately excludes its
# own rayon feature so the bench harness never fights this pool for cores.
rayon = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
num-complex = { workspace = true }
serde_json = { workspace = true }
# The ngspice differential harness reads a per-deck `expect.toml` (per-quantity
# tolerances). `toml` is already in the lock (transitive); pin it here for the
# test binary only.
toml = "0.8"
# S2 benchmark harness (docs/dev-plans/03-solver-performance.md §9). Criterion's
# default features pull in `plotters` (heavy transitive tree, HTML report render
# we do not use: bench.sh reads the JSON estimates instead) and `rayon` (its own
# thread pool, which would fight the solver's parallel island pool once S4 lands
# and could skew wall-time). We keep only `cargo_bench_support` so the benches
# run under `cargo bench` and criterion's built-in `--save-baseline` / compare
# still work; that is all the harness needs.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

# Graded-board benchmarks. `harness = false` hands the binary to criterion's own
# runner instead of libtest, which is what gives us medians, baselines, and the
# `-- --test` smoke mode.
[[bench]]
name = "graded_boards"
harness = false

[lints]
workspace = true
