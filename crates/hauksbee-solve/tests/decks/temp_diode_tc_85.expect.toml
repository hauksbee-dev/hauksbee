# `.temp 85` operating point: the temperature must reach the models.
#
# Each probe carries an exact closed form because the junctions are
# current-driven: V = N*Vt(T)*ln(Id/Is(T) + 1) with
# Vt(T) = 8.617333262e-5 * (T + 273.15) and
# Is(T) = IS * (T/Tnom)^(XTI/N) * exp(-EG/(N*Vt(T)) * (1 - T/Tnom)),
# Tnom = 300.15 K. The divider is pure algebra:
# V(mid) = 5 * R2 / (R1*(1 + tc1*(85 - 27)) + R2).
#
# What the tolerances bound: the 27 C answer sits 93 mV (d1), 70 mV (d2) and
# 254 mV (mid) away, so a broken temperature path fails these bars by two to
# three orders of magnitude. The oracle bars are set from measured agreement
# (both engines run the same laws) under the 50x headroom gate.
analysis = "op"
description = "Diode drops and a TC1 divider at .temp 85: IS(T), Vt(T) and R(T) against exact closed forms."

[[probe]]
expr = "V(d1)"
reltol = 2.0e-5
abstol = 1.0e-3

[[probe.analytic]]
value = 0.621925227771
reltol = 1.0e-4
note = "V = Vt*ln(Id/Is+1), Vt = 8.617333262e-5*358.15 = 30.8630 mV, Is(85) = 1e-14*(358.15/300.15)^3*exp(-1.11/Vt*(1-358.15/300.15)) = 1.7720e-11 A, Id = 10 mA"

[[probe]]
expr = "V(d2)"
reltol = 3.0e-5
abstol = 1.0e-3

[[probe.analytic]]
value = 1.177710183909
reltol = 1.0e-4
note = "V = 2*Vt*ln(Id/Is+1) with N=2, XTI=2, EG=0.69: Is(85) = 1e-12*(358.15/300.15)^(2/2)*exp(-0.69/(2*Vt)*(1-358.15/300.15)) = 1.0348e-11 A, Id = 2 mA"

[[probe]]
expr = "V(mid)"
reltol = 5.0e-6
abstol = 1.0e-3

[[probe.analytic]]
value = 2.245979696344
reltol = 1.0e-6
note = "R1(85) = 1000*(1 + 3.9e-3*58) = 1226.2 ohm, V(mid) = 5*1000/2226.2; exact algebra, no integration"
