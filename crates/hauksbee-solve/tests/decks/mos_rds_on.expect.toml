# MOS on-state drop: the same 0.05% bound across oracle versions.
# The independent triode equation below catches lost RD/RS without relying on
# agreement between solvers or tightening to one oracle build's residual.
analysis = "dc"
description = "power NMOS on-state drop set by RD+RS (datasheet Rds(on) split)"
full_scale = 5.0

[[probe]]
expr = "V(d)"
reltol = 5.0e-04
loose_reason = "oracle builds have measured 1.75e-5 to 3.10e-7 relative error; keep the cross-version 0.05% bound, while the independent triode point below and the RD/RS-removal mutation test guard the physical result"
analytic = [{ at = 5.0, value = 0.48431632046097217, reltol = 1e-6, note = "I=50*((3-0.05I)*(5-1.1I)-(5-1.1I)^2/2), so 27.5I^2-96.5I-125=0; positive triode root I=4.515683679539028 A, external drain V=5-I" }]
