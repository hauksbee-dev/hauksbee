# MOS on-state Rds(on): the datasheet-Rds(on) path, RD/RS.
# A hard-on power NMOS (VG = 5 V) with the drain supply swept through a 1 ohm
# load: V(d) is a linear divider set by Rds(on) = RD + RS + channel. The FET
# stays in triode across the whole sweep, so there is no threshold knee and no
# subthreshold-tail deviation. The observable is purely the on-resistance,
# which ngspice level 1 computes from the identical RD + RS + channel, so the
# two curves coincide to a few parts in 10^5. The bar (0.5%) is orders of
# magnitude above that and still well below the failure a dropped RD/RS would
# produce (Rds(on) collapsing to the ~7 mohm channel, a ~15x error). The
# measured worst-case figure for whichever ngspice last ran this is the
# `mos_rds_on` row of docs/spice-compat/results.md; it is not pinned here,
# because the oracle version is whatever the regenerating machine had.
analysis = "dc"
description = "power NMOS on-state drop set by RD+RS (datasheet Rds(on) split)"
full_scale = 5.0

[[probe]]
expr = "V(d)"
reltol = 0.005
