# CE amplifier gain vs ngspice (dev-plan 04 §3.2 cross-check target 1).
# Measured worst vs ngspice-46: 2.071e-4 (at t=62.1 us, mid-sine) — the gain,
# rb division and (fixed-direction) Early factor all track ngspice to a few
# mV on a ~12 V scale. The bar is ~10x the measured worst, not a blind bound.
analysis = "tran"
description = "bypassed-emitter CE amplifier, 20 kHz sine gain"
full_scale = 12.0
skip_initial = 50e-6

[[probe]]
expr = "V(c)"
reltol = 0.002
