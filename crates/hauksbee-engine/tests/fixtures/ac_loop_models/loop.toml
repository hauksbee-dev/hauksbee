[[models]]
id = "ac_error_amp_one_pole"
kind = "opamp"
description = "One-pole error amplifier; +1V_VLOOP uses the real rail source and dedicated _VLOOP AC-drive rule"

[models.match]
value_re = "^AC_ERRAMP$"

[models.params]
gain = 100000.0
pole_hz = 100.0
rail_lo = -1000000000.0
rail_hi = 1000000000.0

[models.pins]
"1" = "out"
"2" = "in_minus"
"3" = "in_plus"
