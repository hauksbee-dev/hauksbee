# Deliberately-broken [models.logic] spec: exercised by cli_models_lint.rs to
# prove `hauksbee models lint` refuses this category with its NAMED error.
[[models]]
id = "broken_bad_tristate"
kind = "digital"
description = "tristate enable is not a declared input"

[models.match]
value_re = "(?i)^NEVER_MATCHES_BROKEN_BAD_TRISTATE"

[models.params]
voh = 4.4
vol = 0.1
vih = 3.15
vil = 1.35

[models.logic]
inputs  = ["a"]
outputs = ["y"]

[models.logic.comb]
"y" = "a"

[models.logic.tristate]
"y" = { enable = "oe_missing", active = "low" }
