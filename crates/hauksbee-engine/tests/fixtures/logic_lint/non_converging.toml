# Deliberately-broken [models.logic] spec: exercised by cli_models_lint.rs to
# prove `hauksbee models lint` refuses this category with its NAMED error.
[[models]]
id = "broken_non_converging"
kind = "digital"
description = "comb cycle that never settles (y = !y)"

[models.match]
value_re = "(?i)^NEVER_MATCHES_BROKEN_NON_CONVERGING"

[models.params]
voh = 4.4
vol = 0.1
vih = 3.15
vil = 1.35

[models.logic]
inputs  = ["x"]
outputs = ["y"]

[models.logic.comb]
"y" = "!y & !x | x & !y"
