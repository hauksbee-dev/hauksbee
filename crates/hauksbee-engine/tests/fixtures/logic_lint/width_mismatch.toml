# Deliberately-broken [models.logic] spec: exercised by cli_models_lint.rs to
# prove `hauksbee models lint` refuses this category with its NAMED error.
[[models]]
id = "broken_width_mismatch"
kind = "digital"
description = "bit index beyond the register width"

[models.match]
value_re = "(?i)^NEVER_MATCHES_BROKEN_WIDTH_MISMATCH"

[models.params]
voh = 4.4
vol = 0.1
vih = 3.15
vil = 1.35

[models.logic]
inputs  = ["clk", "d"]
outputs = ["y"]

[[models.logic.register]]
name = "reg"
bits = 4
clock = { pin = "clk", edge = "rising" }
op = "shift_left"
data_in = "d"

[models.logic.comb]
"y" = "reg[7]"
