# Deliberately-broken [models.logic] spec: exercised by cli_models_lint.rs to
# prove `hauksbee models lint` refuses this category with its NAMED error.
[[models]]
id = "broken_unreachable_output"
kind = "digital"
description = "output declared but never assigned"

[models.match]
value_re = "(?i)^NEVER_MATCHES_BROKEN_UNREACHABLE_OUTPUT"

[models.params]
voh = 4.4
vol = 0.1
vih = 3.15
vil = 1.35

[models.logic]
inputs  = ["a"]
outputs = ["y", "y_ghost"]

[models.logic.comb]
"y" = "a"
