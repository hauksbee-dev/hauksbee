[package]
name = "hauksbee-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Integration heart: binds an extracted board to models and co-simulates analog + MCU + digital"

[features]
# Propagate the MCU backend choices. All on by default so the engine runs AVR,
# Renode (STM32 / nRF52 / RISC-V), and Espressif-QEMU (ESP32 family) firmware
# out of the box. A `--no-default-features --features renode,qemu` build is
# GPL-free (no libsimavr link); this only holds because every hauksbee-* path
# dependency here sets `default-features = false` and each feature forwards
# explicitly (cargo cannot un-default a dependency from the command line).
# See docs/about/release-and-licensing.md.
default = ["avr", "renode", "qemu"]
avr = ["hauksbee-mcu/avr", "hauksbee-server/avr"]
renode = ["hauksbee-mcu/renode", "hauksbee-server/renode"]
qemu = ["hauksbee-mcu/qemu", "hauksbee-server/qemu"]
# Embed the built web app (frontend/dist, minus the large 3D demo models) into
# the binary, extracted to ~/.cache/hauksbee on first `serve`. OFF by default:
# a source checkout serves the live frontend/dist directly (fresher, and the
# embed requires dist to exist at compile time). Release bundles turn it on so
# `hauksbee serve` works from a bare installed binary (see scripts/bundle.sh).
# `rust-embed/include-exclude` is required for the `#[exclude]` attribute that
# keeps the ~14 MB boards3d/ demo GLBs OUT of the binary (see web_dist.rs).
embed-web = ["dep:rust-embed", "rust-embed/include-exclude"]

[[bin]]
name = "hauksbee"
path = "src/main.rs"

[lib]
name = "hauksbee_engine"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hauksbee-extract = { version = "0.1.0", path = "../hauksbee-extract" }
hauksbee-models = { version = "0.1.0", path = "../hauksbee-models" }
hauksbee-ir = { version = "0.1.0", path = "../hauksbee-ir" }
hauksbee-solve = { version = "0.1.0", path = "../hauksbee-solve" }
hauksbee-mcu = { version = "0.1.0", path = "../hauksbee-mcu", default-features = false }
hauksbee-server = { version = "0.1.0", path = "../hauksbee-server", default-features = false }
forge-model = { workspace = true }
forge-codegen = { workspace = true }
forge-sexpr.workspace = true
tempfile = { workspace = true }
tokio = { version = "1.52.3", features = ["full"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
rust-embed = { version = "8", optional = true }
toml = "0.8"
# Watch mode (`hauksbee watch`): cross-platform filesystem notifications. Default
# features only (macOS FSEvents; inotify/ReadDirectoryChanges are always compiled
# on Linux/Windows); the recommended-watcher + watch-a-dir-and-filter pattern
# needs nothing more.
notify = "8"
# Interactive TUI: the default human-facing surface when `hauksbee run <board>`
# is invoked with no output flag on a TTY. Adapts ratatui + crossterm rather
# than hand-rolling a terminal renderer.
ratatui = { workspace = true }
crossterm = { workspace = true }
# Sandboxed arithmetic/boolean expression evaluator for behavioural-model laws
# and FSM guards. Chosen over rhai: the laws here are pure arithmetic over a
# bound context (pin voltages, active state, params) with no need for a scripting
# language's functions/loops/closures, and evalexpr has no I/O, filesystem, or
# network surface. default-features off drops rand/regex/serde we don't use.
evalexpr = { version = "13", default-features = false }

[dev-dependencies]
hauksbee-testkit = { path = "../hauksbee-testkit" }

[lints]
workspace = true
