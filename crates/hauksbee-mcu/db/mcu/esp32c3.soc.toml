# ESP32-C3 (RISC-V RV32IMC), 160 MHz. Same register-first output plus mailbox
# fallback/input contract as the Xtensa parts; the difference is the ISA — this is a RISC-V core,
# so expected_e_machine = EM_RISCV and arch = riscv32. Loading an Xtensa image
# here is the mistake the arch gate refuses (crate::elf).
[soc]
backend = "qemu"
arch = "riscv32"
machine = "esp32c3"
icount_shift = 2
frequency_hz = 160_000_000
expected_e_machine = "EM_RISCV"
mcu_label = "ESP32-C3 (RISC-V RV32IMC)"
gpio_qom_path = "/machine/gpio"

[[soc.banks]]
letter = "0"
out_reg = 0x5000_0000
peripheral_out_reg = 0x6000_4004
peripheral_enable_reg = 0x6000_4020
in_reg = 0x5000_0004
width = 32

[soc.i2c]
buses = ["/machine/soc/i2c0/i2c", "/machine/soc/i2c1/i2c"]
