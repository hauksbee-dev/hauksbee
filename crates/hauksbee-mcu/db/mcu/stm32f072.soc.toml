# STM32F072 (ARM Cortex-M0): a shipped tier-B descriptor and the worked example
# in docs/extending/add-a-microcontroller.md.
#
# Tier B is "a part added on an emulator platform that already exists". Renode
# 1.16.1 carries platforms/cpus/stm32f072.repl (which includes stm32f0.repl), so
# no peripheral model has to be written or vendored: the whole backend is this
# one file. It is embedded in the binary and routed from the exact STM32F072C8/CB
# 48-pin model in crates/hauksbee-models/db/mcu.toml. The fixture
# tests/renode_stm32f072.rs proves both the data and the live machine.
#
# WHY THE F0 IS A DIFFERENT PART, NOT AN F103 WITH A NEW NAME
# ---------------------------------------------------------------------------
# The F0 family is a different GPIO and USART generation from the F1:
#
#   Register           STM32F103 (F1)              STM32F072 (F0)
#   GPIO block base    0x40010800 (APB2)           0x48000000 (AHB2)
#   output data reg    ODR at 0x0C                 ODR at 0x14
#   direction reg      CRL 0x00 / CRH 0x04         MODER at 0x00, 2 bits per pin
#   USART status       SR at 0x00                  ISR at 0x1C
#   USART data         DR at 0x04                  RDR 0x24 / TDR 0x28
#
# Copying the F103 descriptor and renaming it therefore produces a machine that
# boots, prints nothing, and reports every pin as never driven, with no error
# anywhere. The F0's ODR offset is the same 0x14 as the F4's, which is the
# coincidence that makes the F1 file the wrong one to copy from.
#
# EVERY VALUE BELOW WAS READ OFF A LIVE MACHINE
# ---------------------------------------------------------------------------
# Renode 1.16.1 (d66b0c2a-202602160921), stock stm32f072.repl, running
# testdata/firmware/stm32f072_blinky/blinky.elf. Peripheral names came from
# `peripherals` on the booted machine; the offsets came from reading the
# registers back after main() had run:
#
#   sysbus.gpioPortC ReadDoubleWord 0x00  ->  0x00001000   MODER: PC6 = 0b01, output
#   sysbus.gpioPortC ReadDoubleWord 0x14  ->  0x00000040   ODR:   PC6 driven HIGH
#   sysbus.gpioPortA ReadDoubleWord 0x00  ->  0x28280400   MODER: PA5 output,
#                                                          PA9/PA10 alternate function
#   sysbus.gpioPortA ReadDoubleWord 0x14  ->  0x00000020   ODR:   PA5 held HIGH
#
# Six consecutive 50 ms windows read ODR as 0x40, 0x00, 0x40, 0x00, 0x40, 0x00:
# the blink is observable at this offset, not a single lucky sample. Running
# quiet.elf (same source, built with -DQUIET, drives nothing) on the same
# platform gave MODER 0x00000000 and ODR 0x00000000 on port C and 0x28000000
# (the SWD pins' reset value) with ODR 0x00000000 on port A, so the readings
# above are the firmware's, not the platform's defaults.
#
# CAPABILITY TIERS (the docs/cosim/MCU.md convention)
# ---------------------------------------------------------------------------
#   GPIO out (MODER/ODR)   PROVEN END-TO-END. Bare-metal firmware drives PC6 and
#       PA5; both read back at the mapped offsets, and the quiet build shows
#       neither. Ports A and C are the live-verified pair; B, D, E and F are the
#       same STM32_GPIOPort model registered at 0x400-spaced windows.
#   USART1 TX              PROVEN END-TO-END. "hello from stm32f072" arrives on
#       the host side of sysbus.usart1 (22 bytes), and the quiet build sends none.
#   USART1 RX              PROVEN END-TO-END. Bytes written into the UART reach
#       the firmware's poll loop; it answers them.
#   ADC inputs 0..7        PROVEN END-TO-END on channel 0 and channel 3. See the
#       [[soc.adc]] block below for the transcript.
#   Timers / clocks        FOLLOWS THE FIRMWARE'S CLOCK TREE. The stock rcc is a
#       Python stub that returns alternating values on every read, which hangs any
#       firmware that waits on a ready flag (CubeMX HAL clock bring-up does). The
#       platform below replaces it with register storage (HSIRDY following HSION,
#       SWS following SW, ...) and the generic [[soc.clock_ready]] model supplies
#       HSERDY and PLLRDY from the board's crystal and elapsed virtual time. The
#       [[soc.decode]] clock block reads RCC back after every slice and retunes
#       the core, SysTick and every TIMx block (measured by clock_truth.rs).
#   I2C bus-slave bridge   ABSENT, see [soc.i2c].
#   SPI bus-slave bridge   ABSENT, see [soc.spi].
[soc]
backend = "renode"
machine = "f072"
platform_repl = """
// STM32F072 platform: the stock Renode file plus this part's real core clock.
//
// The two clock declarations are not optional decoration. A Renode platform
// that declares neither runs the core and SysTick at Renode's own defaults,
// which have no relation to the part: four shipped platforms did exactly that
// and ran simulated time 4.5x to 9x fast. The descriptor loader cross-checks
// both against `frequency_hz` below and refuses a mismatch
// (soc::check_clock_declarations), so this is the shape every new Renode part
// has to use.
//
// 8 MHz is the F072's RESET DEFAULT: the HSI is the system clock after reset
// (RM0091 §6.2). Firmware that brings up the PLL or the HSE is followed by the
// clock decode below.

using "platforms/cpus/stm32f072.repl"

// RCC register storage, replacing the stock stub's script (RM0091 Rev 10 s6.4, pp.110-134). HSIRDY follows HSION,
// SWS follows SW, the HSI14 and HSI48 ready bits follow their enable bits and
// LSIRDY follows LSION. HSERDY (CR bit 17) and PLLRDY (CR bit 25) are read-only
// and NOT stored: the generic [[soc.clock_ready]] model supplies them on every
// read. Reset values: CR 0x83 (HSION, HSIRDY, HSITRIM 0x10), CSR 0x0C000000
// (PINRSTF and PORRSTF), CR2 0x80 (HSI14TRIM 0x10).
rcc:
    script: '''
if request.IsInit:
    rccregs = [0] * (size / 4)
    rccregs[0] = 0x83
    rccregs[9] = 0x0C000000
    rccregs[13] = 0x80
elif request.IsRead:
    request.Value = rccregs[request.Offset >> 2]
elif request.IsWrite:
    rccoff = request.Offset >> 2
    rccval = request.Value
    if rccoff == 0:
        rccval = rccval & ~0x2000002
        if rccval & 0x1:
            rccval = rccval | 0x2
        rccregs[rccoff] = rccval
    elif rccoff == 1:
        rccval = (rccval & 0xFFFFFFF3) | ((rccval & 0x3) << 2)
        rccregs[rccoff] = rccval
    elif rccoff == 9:
        rccval = rccval & ~0x2
        if rccval & 0x1: rccval = rccval | 0x2
        rccregs[rccoff] = rccval
    elif rccoff == 13:
        rccval = rccval & ~0x20002
        if rccval & 0x1: rccval = rccval | 0x2
        if rccval & 0x10000: rccval = rccval | 0x20000
        rccregs[rccoff] = rccval
    else:
        rccregs[rccoff] = rccval
'''

nvic:
    systickFrequency: 8000000

cpu:
    PerformanceInMips: 8
"""
cpu_path = "sysbus.cpu"
uart = "sysbus.usart1"
# The HSI, which is what the walkthrough firmware runs from and never leaves.
# NOT advisory: the loader refuses a descriptor whose platform declares a core
# clock that disagrees with this number, so this field and the two declarations
# in `platform_repl` above are one fact with one failure mode.
frequency_hz = 8_000_000
expected_e_machine = "EM_ARM"
mcu_label = "STM32F072 (ARM Cortex-M0)"
# The stock platform's RCC is a stub and this part has no clock-truth or
# starved-watchdog gate. GPIO/UART/ADC are live-proven below; timing and reboot
# fidelity are not allowed to borrow that proof.
watchdog_limitation = "STM32F072 watchdog expiry and reboot behavior have not been starved and measured; do not infer silicon-equivalent watchdog recovery"
timing_limitation = "The core, SysTick and every TIMx block follow the clock tree the firmware sets (HSI, HSE, PLL, HSI48, prescalers; clock_truth.rs measures it), but SYSCLK switches the instant SW is written where silicon waits for the source, SysTick CLKSOURCE=0 (HCLK/8) is not followed, and the HSE crystal is taken as 8 MHz"

# One entry per GPIO port the platform registers. ODR at 0x14 and MODER at 0x00
# are the STM32_GPIOPort layout, shared with the F4 family and NOT with the F1.
# `moder` counts only 0b01 (general-purpose output) as a drive: an alternate
# function pin may be an input function, so PA9/PA10 (USART1) are excluded from
# the configured-output set even though the firmware configured them.
[[soc.ports]]
letter = "A"
peripheral = "gpioPortA"
odr_offset = 0x14
width = 16
dir = { offset = 0x00, encoding = "moder" }
[[soc.ports]]
letter = "B"
peripheral = "gpioPortB"
odr_offset = 0x14
width = 16
dir = { offset = 0x00, encoding = "moder" }
[[soc.ports]]
letter = "C"
peripheral = "gpioPortC"
odr_offset = 0x14
width = 16
dir = { offset = 0x00, encoding = "moder" }
[[soc.ports]]
letter = "D"
peripheral = "gpioPortD"
odr_offset = 0x14
width = 16
dir = { offset = 0x00, encoding = "moder" }
[[soc.ports]]
letter = "E"
peripheral = "gpioPortE"
odr_offset = 0x14
width = 16
dir = { offset = 0x00, encoding = "moder" }
[[soc.ports]]
letter = "F"
peripheral = "gpioPortF"
odr_offset = 0x14
width = 16
dir = { offset = 0x00, encoding = "moder" }

# ADC INJECTION, PROVEN
# ---------------------------------------------------------------------------
# The stock stm32f0.repl instantiates `adc: Analog.STM32F0_ADC @ sysbus
# 0x40012400` with `referenceVoltage: 3.3`, and that model exposes exactly two
# Monitor-callable feeds (read off the live machine by typing `sysbus.adc`):
#
#   SetDefaultValue (Decimal valueInmV, Int32? channel = null)
#   FeedVoltageSampleToChannel (Int32 channel, Decimal valueInmV, UInt32 repeat)
#
# `SetDefaultValue` is the one that suits the engine's cadence: the Monitor is
# idle between RunFor windows, so a per-chunk write lands before the next
# instruction runs and every later conversion returns it. It takes MILLIVOLTS,
# hence {millivolts} rather than {count}: feeding it a raw 12-bit code would be
# silently wrong by the full-scale factor.
#
# Transcript, one machine, firmware doing a real ADEN / ADSTART / read-ADC_DR
# sequence on ADC_IN0 and ADC_IN3:
#
#   sysbus.adc SetDefaultValue 1650 0   ->  firmware printed adc0=00000800  (2048)
#   sysbus.adc SetDefaultValue  825 0   ->  firmware printed adc0=00000400  (1024)
#   sysbus.adc SetDefaultValue 3300 3   ->  firmware printed adc3=00000fff  (4095)
#   channel 0 re-read afterwards        ->  firmware printed adc0=00000400  (1024)
#
# 1650/3300 * 4095 = 2047.5 and 825/3300 * 4095 = 1023.75, so the counts are the
# converter's own arithmetic on the fed voltage, and the last line shows the
# channels hold independent state rather than sharing one sample.
#
# Channels 0..7 are ADC_IN0..ADC_IN7 on PA0..PA7 (RM0091 table 13). Channel 0
# and channel 3 are the pair proven above; the rest are the same Monitor call
# with the channel index substituted. The 48-pin package also exposes ADC_IN8/9
# on PB0/PB1, but those two feeds have not been live-proven and are deliberately
# left unmapped: using either produces the normal loud dropped-channel coverage
# warning. Channels 16, 17 and 18 (on-die
# temperature, VREFINT, VBAT) are NOT external nodes, so they are left unmapped
# and take the loud once-per-channel drop rather than a fabricated count, the
# same policy the RP2040 applies to its input 4.
[[soc.adc]]
channel = 0
monitor_command = "sysbus.adc SetDefaultValue {millivolts} 0"
full_scale_volts = 3.3
max_count = 4095
[[soc.adc]]
channel = 1
monitor_command = "sysbus.adc SetDefaultValue {millivolts} 1"
full_scale_volts = 3.3
max_count = 4095
[[soc.adc]]
channel = 2
monitor_command = "sysbus.adc SetDefaultValue {millivolts} 2"
full_scale_volts = 3.3
max_count = 4095
[[soc.adc]]
channel = 3
monitor_command = "sysbus.adc SetDefaultValue {millivolts} 3"
full_scale_volts = 3.3
max_count = 4095
[[soc.adc]]
channel = 4
monitor_command = "sysbus.adc SetDefaultValue {millivolts} 4"
full_scale_volts = 3.3
max_count = 4095
[[soc.adc]]
channel = 5
monitor_command = "sysbus.adc SetDefaultValue {millivolts} 5"
full_scale_volts = 3.3
max_count = 4095
[[soc.adc]]
channel = 6
monitor_command = "sysbus.adc SetDefaultValue {millivolts} 6"
full_scale_volts = 3.3
max_count = 4095
[[soc.adc]]
channel = 7
monitor_command = "sysbus.adc SetDefaultValue {millivolts} 7"
full_scale_volts = 3.3
max_count = 4095

[soc.i2c]
# EMPTY BECAUSE IT IS UNVERIFIED, not because the platform lacks the peripheral.
# stm32f0.repl registers `i2c1`/`i2c2` as `I2C.STM32F7_I2C`, which is a
# DIFFERENT model class from the `I2C.STM32F4_I2C` behind the proven F103 and F4
# bridges, so the F103 proof does not carry across. Naming a controller here
# installs a bridge peripheral; if that model never dispatches to a registered
# slave, a bound I2C sensor answers zeroes and reads as working, which is the
# exact failure the RP2040's SPI entry documents. Left empty, a bound sensor
# instead gets the loud UNEXERCISED-bus coverage warning and fails a CI
# peripheral assertion. Filling this in needs one live test that the bridge
# registers on STM32F7_I2C and a byte round-trips.
controllers = []

[soc.spi]
# EMPTY for the same reason, though the odds are better: stm32f0.repl registers
# `spi1`/`spi2` as `SPI.STM32SPI`, which IS the class behind the F4's proven
# spi2/spi3 bridges. That makes this the cheapest capability to add next, and it
# still needs the live test before it is claimed.
controllers = []

# ── CLOCK TREE (decoded from the live registers) ──────────────────────────────
# RM0091 Rev 10 s6.4: RCC_CR @ +0x00 (pp.110-111), RCC_CFGR @ +0x04
# (pp.111-114), RCC_CFGR2 @ +0x2C (p.132).
#   SWS/SW (CFGR 3:2 / 1:0): 00 HSI, 01 HSE, 10 PLL, 11 HSI48 (p.114).
#   PLLSRC (CFGR 16:15): 00 HSI/2, 01 HSI/PREDIV, 10 HSE/PREDIV, 11 HSI48/PREDIV
#     (p.113; the 00 case is HSI/2 on F04x, F07x and F09x).
#   PREDIV (CFGR2 3:0): divide by value + 1 (p.132).
#   PLLMUL (CFGR 21:18): input x (value + 2), values 14 and 15 both x16 (p.113).
#   HPRE (7:4): 0xxx /1, 1000 /2 ... 1011 /16, 1100 /64 ... 1111 /512 (p.114).
#   PPRE (10:8): 0xx /1, 100 /2 ... 111 /16 (p.113).
# Timer clock = PCLK if the APB prescaler is 1, else twice it (p.98). HSI is
# 8 MHz and HSI48 48 MHz. The HSE value is the 8 MHz crystal; a board with
# another crystal needs that value passed in.
[[soc.decode]]
kind = "clock"
name = "rcc"
registers = { cr = 0x40021000, cfgr = 0x40021004, cfgr2 = 0x4002102C }
vars = [
    ["hsi", "8000000"],
    ["hse", "8000000"],
    ["hsi48", "48000000"],
    ["prediv", "bits(cfgr2, 3, 0) + 1"],
    ["pll_in", "pick(bits(cfgr, 16, 15), hsi / 2, hsi / prediv, hse / prediv, hsi48 / prediv)"],
    ["pll_out", "pll_in * (min(bits(cfgr, 21, 18), 14) + 2)"],
    ["sysclk", "pick(bits(cfgr, 3, 2), hsi, hse, pll_out, hsi48)"],
    ["hclk", "sysclk / pick(bits(cfgr, 7, 4), 1, 1, 1, 1, 1, 1, 1, 1, 2, 4, 8, 16, 64, 128, 256, 512)"],
    ["pclk_div", "pick(bits(cfgr, 10, 8), 1, 1, 1, 1, 2, 4, 8, 16)"],
    ["pclk", "hclk / pclk_div"],
    ["tim_apb", "if(pclk_div == 1, pclk, pclk * 2)"],
    ["core_hz", "hclk"],
]

[[soc.clock_targets]]
var = "core_hz"
command = "sysbus.cpu PerformanceInMips {mhz}"
[[soc.clock_targets]]
var = "core_hz"
command = "sysbus.nvic Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb"
command = "sysbus.timer1 Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb"
command = "sysbus.timer2 Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb"
command = "sysbus.timer3 Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb"
command = "sysbus.timer6 Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb"
command = "sysbus.timer7 Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb"
command = "sysbus.timer14 Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb"
command = "sysbus.timer15 Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb"
command = "sysbus.timer16 Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb"
command = "sysbus.timer17 Frequency {hz}"

# ── OSCILLATOR READINESS ──────────────────────────────────────────────────────
# RCC_CR (RM0091 pp.110-111): HSEON bit 16, HSERDY bit 17, PLLON bit 24, PLLRDY
# bit 25. HSE startup 2 ms (DS9826 p.68, tSU(HSE)); PLL lock 200 us maximum
# (DS9826 p.74, tLOCK). The PLL waits for HSE only while CFGR.PLLSRC[1:0] = 10.
[[soc.clock_ready]]
peripheral = "rcc"
name = "hse"
enable_register = 0x00
enable_mask = 0x10000
ready_register = 0x00
ready_mask = 0x20000
requires_external = true
startup_us = 2000.0

[[soc.clock_ready]]
peripheral = "rcc"
name = "pll"
enable_register = 0x00
enable_mask = 0x1000000
ready_register = 0x00
ready_mask = 0x2000000
startup_us = 200.0
needs = [{ entry = "hse", when = { register = 0x04, mask = 0x18000, value = 0x10000 } }]

# Timer fixes (see `periph_snapshot::TimerFix`).
[[soc.timer_fixes]]
peripheral = "timer1"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer2"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer3"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer6"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer7"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer14"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer15"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer16"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer17"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C


# ── PERIPHERAL SNAPSHOT DECODE (RM0091 Rev 10; pdf page = printed page) ───────
# Base addresses: Table 1 (pp.49-50): USART1 0x40013800, USART2 0x40004400,
# USART3 0x40004800, USART4 0x40004C00, SPI1 0x40013000, SPI2 0x40003800, TIM1
# 0x40012C00, TIM2 0x40000000, TIM3 0x40000400, TIM6 0x40001000, TIM7
# 0x40001400, TIM14 0x40002000, TIM15 0x40014000, TIM16 0x40014400, TIM17
# 0x40014800. The F0 has a single APB, so every kernel clock below is PCLK
# (`pclk`) and every timer clock is `tim_apb`.
#
# USART (s27.5.4, p.716): OVER8 = 0 gives baud = fCK / BRR; OVER8 = 1 gives
# 2 x fCK / USARTDIV with USARTDIV = BRR[15:4] x 16 + BRR[2:0] x 2 (BRR[3]
# must be 0), which is fCK / (8 x BRR[15:4] + BRR[2:0]). Registers (Table 112,
# p.765): CR1 +0x00 (M0 bit 12, OVER8 bit 15, M1 bit 28; p.744-745), CR2 +0x04
# (STOP 13:12, p.749: 00 1, 01 0.5, 10 2, 11 1.5), BRR +0x0C. Word length
# M[1:0]: 00 = 8 bits, 01 = 9, 10 = 7 (p.744). USART1 and USART2 have a
# selectable kernel clock in RCC_CFGR3 @ +0x30 (register p.132, fields p.133):
# USART1SW[1:0] and USART2SW[17:16] (USART2SW is "available only on STM32F07x
# and STM32F09x", which includes this F072): 00 PCLK (default), 01 SYSCLK,
# 10 LSE (32.768 kHz), 11 HSI. USART3SW[19:18] exists only on the F09x, so
# USART3 and USART4 stay on PCLK.
#
# SPI (s28.9.1, p.815): CR1 +0x00, BR[2:0] bits 5:3 gives fPCLK / 2^(BR+1),
# CPOL bit 1, CPHA bit 0.
#
# Timers: PSC +0x28 (16 bits), ARR +0x2C (16 bits, TIM2 32 bits: pp.395, 462-463,
# 489, 536, 553, 571). The counter clock is the timer clock / (PSC + 1); the
# update event comes every (ARR + 1) x (REP + 1) counter clocks, REP in RCR +0x30
# (7:0) on TIM1, TIM15, TIM16 and TIM17 (pp.396, 537, 554).
[[soc.decode]]
kind = "uart"
name = "usart1"
registers = { cr1 = 0x40013800, cr2 = 0x40013804, brr = 0x4001380C, cfgr3 = 0x40021030 }
vars = [
    ["baud", "(pick(bits(cfgr3, 1, 0), clk_pclk, clk_sysclk, 32768, clk_hsi)) / if(bit(cr1, 15), bits(brr, 15, 4) * 8 + bits(brr, 2, 0), bits(brr, 15, 0))"],
    ["data_bits", "pick(bit(cr1, 12) + 2 * bit(cr1, 28), 8, 9, 7)"],
    ["stop_bits", "pick(bits(cr2, 13, 12), 1, 0.5, 2, 1.5)"],
]
[[soc.decode]]
kind = "uart"
name = "usart2"
registers = { cr1 = 0x40004400, cr2 = 0x40004404, brr = 0x4000440C, cfgr3 = 0x40021030 }
vars = [
    ["baud", "(pick(bits(cfgr3, 17, 16), clk_pclk, clk_sysclk, 32768, clk_hsi)) / if(bit(cr1, 15), bits(brr, 15, 4) * 8 + bits(brr, 2, 0), bits(brr, 15, 0))"],
    ["data_bits", "pick(bit(cr1, 12) + 2 * bit(cr1, 28), 8, 9, 7)"],
    ["stop_bits", "pick(bits(cr2, 13, 12), 1, 0.5, 2, 1.5)"],
]
[[soc.decode]]
kind = "uart"
name = "usart3"
registers = { cr1 = 0x40004800, cr2 = 0x40004804, brr = 0x4000480C }
vars = [
    ["baud", "(clk_pclk) / if(bit(cr1, 15), bits(brr, 15, 4) * 8 + bits(brr, 2, 0), bits(brr, 15, 0))"],
    ["data_bits", "pick(bit(cr1, 12) + 2 * bit(cr1, 28), 8, 9, 7)"],
    ["stop_bits", "pick(bits(cr2, 13, 12), 1, 0.5, 2, 1.5)"],
]
[[soc.decode]]
kind = "uart"
name = "usart4"
registers = { cr1 = 0x40004C00, cr2 = 0x40004C04, brr = 0x40004C0C }
vars = [
    ["baud", "(clk_pclk) / if(bit(cr1, 15), bits(brr, 15, 4) * 8 + bits(brr, 2, 0), bits(brr, 15, 0))"],
    ["data_bits", "pick(bit(cr1, 12) + 2 * bit(cr1, 28), 8, 9, 7)"],
    ["stop_bits", "pick(bits(cr2, 13, 12), 1, 0.5, 2, 1.5)"],
]
[[soc.decode]]
kind = "spi"
name = "spi1"
registers = { cr1 = 0x40013000 }
vars = [
