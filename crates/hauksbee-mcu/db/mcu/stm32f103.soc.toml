# STM32F103C8 "blue pill": PA-PG, USART1, 8 MHz HSI.
# The configuration the hauksbee STM32 demo board binds to.
#
# ODR FOOTGUN (the reason this data belongs in a reviewed file, 06 §2): the
# STM32F1 GPIO output-data register is at offset 0x0C. The F4 family puts it at
# 0x14 — read the wrong offset and you observe the wrong register. Compare
# stm32f4_discovery.soc.toml, which sets odr_offset = 0x14.
#
# DIRECTION: the F1 has no MODER; direction lives in CRL (pins 0-7, offset
# 0x00) and CRH (pins 8-15, offset 0x04), 4 bits per pin, where the low 2 MODE
# bits != 0b00 mean output (GP or AF — the F1 encodes AF outputs here too).
# Verified against the installed Renode 1.16.1: STM32F1GPIOPort reads CRL/CRH
# back as written. The stm32f1_crl_crh encoding reads CRL at `offset` and CRH
# at `offset + 4`.
#
# PLATFORM (why platform_repl is inline source, not the stock path): the stock
# Renode 1.16.1 `platforms/cpus/stm32f103.repl` models no RCC at all — a single
# read-only tag for RCC_CR, every other RCC register unimplemented (reads
# return the SVD reset value, writes are dropped). Stock CubeMX HAL firmware
# polls RCC_CSR for LSIRDY and RCC_CFGR for SWS, so on the stock platform it
# spins forever in HAL_RCC_OscConfig and never reaches main(). The inline
# platform below extends the stock file with the peripherals the HAL clock
# tree needs; it was proven live against the AnyShake Explorer's real
# PlatformIO/CubeMX firmware (boot stalled at HAL_RCC_OscConfig before, PC13
# heartbeat observed after).
[soc]
backend = "renode"
machine = "f103"
platform_repl = """
// STM32F103 platform for stock CubeMX HAL firmware.
//
// Extends the stock Renode stm32f103.repl with what the HAL clock tree needs:
//
//   rcc       STM32F1 RCC with self-completing ready bits (CSR/BDCR/CR) and
//             SWS mirroring SW in CFGR.
//   flashCtrl FLASH_ACR as read/write storage so the HAL's latency read-back
//             check passes.
//   dma1      the F1 DMA1. Register-compatible with the STM32G0 DMA IP that
//             Renode models (ISR/IFCR + 7 channel blocks). HAL UART/SPI/ADC
//             traffic is commonly DMA-driven, so without this no DMA byte ever
//             moves.
//   spi1      not in the stock platform at any offset.
//   iwdg      the independent watchdog HAL projects feed.

using "platforms/cpus/stm32f103.repl"

rcc: Python.PythonPeripheral @ sysbus <0x40021000, +0x400>
    size: 0x400
    initable: true
    script: '''
if request.IsInit:
    rccregs = [0] * (size / 4)
    rccregs[0] = 0x83
    rccregs[9] = 0x0C000000
elif request.IsRead:
    request.Value = rccregs[request.Offset >> 2]
elif request.IsWrite:
    rccoff = request.Offset >> 2
    rccval = request.Value
    if rccoff == 0:
        if rccval & 0x1: rccval = rccval | 0x2
        if rccval & 0x10000: rccval = rccval | 0x20000
        if rccval & 0x1000000: rccval = rccval | 0x2000000
    elif rccoff == 1:
        rccval = (rccval & 0xFFFFFFF3) | ((rccval & 0x3) << 2)
    elif rccoff == 8:
        if rccval & 0x1: rccval = rccval | 0x2
    elif rccoff == 9:
        if rccval & 0x1: rccval = rccval | 0x2
    rccregs[rccoff] = rccval
'''

flashCtrl: Python.PythonPeripheral @ sysbus <0x40022000, +0x400>
    size: 0x400
    initable: true
    script: '''
if request.IsInit:
    facregs = [0] * (size / 4)
    facregs[0] = 0x30
elif request.IsRead:
    request.Value = facregs[request.Offset >> 2]
elif request.IsWrite:
    facregs[request.Offset >> 2] = request.Value
'''

dma1: DMA.STM32G0DMA @ sysbus 0x40020000
    numberOfChannels: 7
    [0-6] -> nvic@[11-17]

spi1: SPI.STM32SPI @ sysbus 0x40013000

// The stock platform clocks every STM32_Timer at 10 MHz. HAL projects run the
// timers from a 72 MHz PLL (8 MHz HSE x9; APB1/2 timer clocks are both 72 MHz
// on the F1), and the HAL time base is a timer programmed for a 1 ms tick
// assuming exactly that. At 10 MHz the tick lands at ~139 Hz, so every
// HAL_Delay(n) takes 7.2n ms of simulated time and boot never finishes inside
// a sane co-sim window. TIM1/TIM2 also serve as a 64-bit systime pair in some
// firmware.
//
// This is the one clock here that is NOT the part's reset default, and it is a
// deliberate, bounded divergence rather than an oversight. Renode models no F1
// clock tree (the RCC above is a stub reporting every PLL as locked), so one
// fixed timer rate has to serve both firmware classes, and only the post-PLL
// rate lets a stock HAL project boot at all. The cost is stated instead of
// hidden: bare-metal firmware that runs TIMx from the reset-default HSI sees
// its timers 9x fast. SysTick, the core clock and `frequency_hz` all agree on
// 8 MHz, so the paths a delay loop and a SysTick tick take are covered by the
// clock-truth gate; a TIMx time base is not.
timer1:
    frequency: 72000000
timer2:
    frequency: 72000000
timer3:
    frequency: 72000000
timer4:
    frequency: 72000000

iwdg: Timers.STM32_IndependentWatchdog @ sysbus 0x40003000
    frequency: 40000

// CLOCK TRUTH (tests/clock_truth.rs). The stock stm32f103.repl declares
// `nvic systickFrequency: 72000000` and leaves `cpu PerformanceInMips` at
// Renode's default 100, so a SysTick-timed firmware ran 9.09x fast (measured:
// exactly 72/8) and an instruction busy-wait ran ~7x fast (measured 7.14x:
// 100 MIPS against ~8 MIPS of real silicon). Both numbers made virtual time
// cheaper than the board's, which is what let a time-based assertion pass at a
// rate no blue pill can hit.
//
// 8 MHz is the F103's RESET DEFAULT: after reset the HSI is the system clock
// (RM0008 §7.2) and this firmware enables no PLL, so it is the honest choice
// and the one `frequency_hz` below declares. `frequency_hz` and these two
// declarations are cross-checked at machine bring-up (renode::mod
// `clock_declaration_mismatch`), so they cannot drift apart again.
//
// PerformanceInMips is Renode's instructions-per-second knob; a Cortex-M3
// retires roughly one instruction per cycle, so the part's core clock in MHz
// is the right setting. This is the same identity db/mcu/rp2040/rp2040.repl
// uses (125 MIPS at 125 MHz), and RP2040 is the one backend that already
// measured 1.00x.
nvic:
    systickFrequency: 8000000

cpu:
    PerformanceInMips: 8

// Cortex-M bit-band aliases. The STM32F1 HAL drives RCC through them
// (__HAL_RCC_LSI_ENABLE() is a write to RCC_CSR_LSION_BB = 0x42420480, not a
// read-modify-write of RCC_CSR). The stock stm32f103.repl maps no bit-band
// region, so those writes land on "non existing peripheral at 0x42420480" and
// the enable never reaches the RCC at all.
// (Only the peripheral alias. The SRAM alias at 0x22000000 cannot be mapped on
// this platform: the stock repl declares `sram` as 0x10000000 bytes wide, so it
// already owns 0x20000000-0x2FFFFFFF. The HAL does not bit-band SRAM.)
bitbandPeripherals: Miscellaneous.BitBanding @ sysbus <0x42000000, +0x2000000>
    peripheralBase: 0x40000000
"""
cpu_path = "sysbus.cpu"
uart = "sysbus.usart1"
frequency_hz = 8_000_000
expected_e_machine = "EM_ARM"
mcu_label = "STM32F103 (ARM Cortex-M3)"

# WATCHDOG (measured). The inline platform's IWDG at 40 kHz does time out and
# does reset: with a 50 ms reload never fed, the firmware's heartbeat stops at
# the timeout and its boot marker flips a second time. But it resets ONCE, and
# the core then stays quiet for the remaining 450 ms where the part would reboot
# every 50 ms forever. So the first bite is real and anything the firmware would
# have done on the reboots after it is not.
watchdog_limitation = """\
The STM32F103 independent watchdog fires and resets the core once in this \
co-simulator, but the core does not resume afterwards: a part that would reboot \
repeatedly under a starved watchdog goes quiet here instead, so only the FIRST \
watchdog reset is represented on this run.\
"""

[[soc.ports]]
letter = "A"
peripheral = "gpioPortA"
odr_offset = 0x0C
width = 16
dir = { offset = 0x00, encoding = "stm32f1_crl_crh" }
[[soc.ports]]
letter = "B"
peripheral = "gpioPortB"
odr_offset = 0x0C
width = 16
dir = { offset = 0x00, encoding = "stm32f1_crl_crh" }
[[soc.ports]]
letter = "C"
peripheral = "gpioPortC"
odr_offset = 0x0C
width = 16
dir = { offset = 0x00, encoding = "stm32f1_crl_crh" }
[[soc.ports]]
letter = "D"
peripheral = "gpioPortD"
odr_offset = 0x0C
width = 16
dir = { offset = 0x00, encoding = "stm32f1_crl_crh" }
[[soc.ports]]
letter = "E"
peripheral = "gpioPortE"
odr_offset = 0x0C
width = 16
dir = { offset = 0x00, encoding = "stm32f1_crl_crh" }
[[soc.ports]]
letter = "F"
peripheral = "gpioPortF"
odr_offset = 0x0C
width = 16
dir = { offset = 0x00, encoding = "stm32f1_crl_crh" }
[[soc.ports]]
letter = "G"
peripheral = "gpioPortG"
odr_offset = 0x0C
width = 16
dir = { offset = 0x00, encoding = "stm32f1_crl_crh" }

[soc.i2c]
# The STM32F103 thermostat firmware uses i2c1.
controllers = ["i2c1"]

[soc.spi]
# SPI1 is defined by the inline platform above (it is not in the stock
# stm32f103.repl at any offset), so no `extra_repl` injection is needed; a
# second definition would collide with the platform's.
controllers = ["spi1"]
