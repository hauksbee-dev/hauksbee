# nRF52840: two 32-bit GPIO ports (gpio0/gpio1), uart0, 64 MHz.
#
# OFFSET FOOTGUN (corrected 2026-07): the nRF datasheet puts OUT at 0x504 and
# DIR at 0x514 from the GPIO *block base* (0x50000000 for P0), but Renode's
# nrf52840.repl registers gpio0/gpio1 at 0x50000500/0x50000800 — the register
# window, not the block base — and `sysbus.gpio0 ReadDoubleWord` takes offsets
# relative to that registration point. Verified against the installed Renode
# 1.16.1: reads at 0x504/0x514 log "Unhandled read from offset 0x504/0x514"
# and return 0 (so the previous odr_offset = 0x504 always read 0 and no GPIO
# edge could ever fire), while OUT at 0x004 and DIR at 0x014 read back as
# written. Peripheral-relative offsets are therefore datasheet-offset minus
# 0x500.
#
# DIRECTION: DIR at peripheral offset 0x014, 1 bit per pin, 1 = output
# (dir_bits encoding). Renode's NRF52840_GPIO keeps DIR coherent with the
# PIN_CNF[n].DIR writes Zephyr-style firmware uses, so reading DIR reflects
# either configuration path.
[soc]
backend = "renode"
machine = "nrf52"
platform_repl = """
// nRF52840 platform: the stock Renode file plus this part's real core clock.
//
// CLOCK TRUTH (tests/clock_truth.rs). The stock nrf52840.repl declares NEITHER
// `nvic systickFrequency` NOR `cpu PerformanceInMips`, so both fell to Renode's
// defaults, which have no relation to this part: a SysTick-timed firmware ran
// 6.58x fast (measured; the implied SysTick clock was ~420 MHz against the
// part's 64 MHz). That made virtual time cheaper than the board's, which is
// what let a time-based assertion pass at a rate no nRF52840 can hit.
//
// 64 MHz is not a configuration choice on this part, it is the only rate: the
// HFCLK feeding the M4 runs at 64 MHz whether the source is the internal
// oscillator or the crystal (nRF52840 PS v1.7 §5.3), so there is no
// reset-default-versus-configured distinction to make. `frequency_hz` below
// declares the same 64 MHz and is cross-checked against these two declarations
// at machine bring-up (renode::mod `clock_declaration_mismatch`).
//
// PerformanceInMips is Renode's instructions-per-second knob; a Cortex-M4
// retires roughly one instruction per cycle, so the part's core clock in MHz is
// the right setting, the same identity db/mcu/rp2040/rp2040.repl uses (125 MIPS
// at 125 MHz) on the one backend that already measured 1.00x.

using "platforms/cpus/nrf52840.repl"

nvic:
    systickFrequency: 64000000

cpu:
    PerformanceInMips: 64
"""
cpu_path = "sysbus.cpu"
uart = "sysbus.uart0"
frequency_hz = 64_000_000
expected_e_machine = "EM_ARM"
mcu_label = "nRF52840 (ARM Cortex-M4)"

# WATCHDOG (measured, and the reason this field exists). Renode's NRF52840 WDT
# arms convincingly and then does nothing: with a 50 ms reload never fed,
# RUNSTATUS reads 1, CRV reads back 1638 (50 ms at the model's correct 32768 Hz),
# the PC sits inside the firmware's busy loop, and 1.000 s of simulated time
# produces ZERO resets where the part gives twenty. A firmware whose recovery
# path depends on the watchdog biting is therefore untested here, and a passing
# run must say so rather than let the user infer otherwise.
watchdog_limitation = """\
The nRF52840 watchdog arms in this co-simulator (it reads back as running, with \
a correct 32768 Hz reload) but never fires: an unserviced watchdog will NOT \
reset the core, so watchdog recovery is untested on this run.\
"""

[[soc.ports]]
letter = "0"
peripheral = "gpio0"
odr_offset = 0x4
width = 32
dir = { offset = 0x14, encoding = "dir_bits" }
[[soc.ports]]
letter = "1"
peripheral = "gpio1"
odr_offset = 0x4
width = 32
dir = { offset = 0x14, encoding = "dir_bits" }

# BUS CONTROLLERS (verified against the installed Renode 1.16.1): the stock
# nrf52840.repl models `twi0`/`twi1` (I2C.NRF52840_I2C, 0x40003000/0x40004000)
# and `spi2` (SPI.NRF52840_SPI, 0x40023000). These names were confirmed live
# via `peripherals` on a booted nrf52840 machine, and the Hauksbee I2C/SPI
# bridge peripherals register on them (tests/renode_nrf52840_bus.rs). Renode
# models the pre-EasyDMA TWI/SPI register interfaces here — firmware driving
# the TWIM/SPIM (EasyDMA) registers hits parts of the block the model does
# not implement, so an end-to-end sensor round-trip is proven only for
# TWI/SPI-style drivers. Everything the repl does NOT model stays unlisted,
# so a bound sensor on a missing controller gets the loud unexercised-bus
# coverage warning instead of a silent no-op.
[soc.i2c]
controllers = ["twi0", "twi1"]
[soc.spi]
controllers = ["spi2"]

# No [[soc.adc]] injection map: the stock Renode 1.16.1 nrf52840.repl models
# no ADC/SAADC peripheral at all (verified live — `peripherals` lists none),
# and inventing a RAM result word would be a firmware contract, not the real
# converter. ADC injections on this platform are therefore DROPPED and
# surfaced as a co-sim coverage warning on every report surface.
