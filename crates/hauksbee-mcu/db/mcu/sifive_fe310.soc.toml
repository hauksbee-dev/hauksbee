# SiFive FE310 (HiFive1) RISC-V: one 32-bit GPIO port, uart0, 16 MHz.
# The FE310 GPIO output value register (`port`) is at offset 0x0C.
#
# No `dir` map: the FE310 GPIO output-enable (`output_en`) sits at offset 0x08
# in the datasheet, but a Monitor register probe against the installed Renode
# 1.16.1 SiFive_GPIO model hung on the 0x08 access rather than reading back, so
# the read-back path is unverified. A dir map whose read fails would mask every
# edge to zero — strictly worse than the status quo — so direction stays
# unobservable on this part until `dir = { offset = 0x08, encoding =
# "dir_bits" }` is verified against a live machine.
#
# BRING-UP FOOTGUN (why post_load_setup exists): the FE310 Zephyr shell demo's
# ELF entry does not point at the bring-up code. The upstream Renode resc sets PC
# to `vinit` and tags the PRCI clock registers so the HFROSC/PLL config reads as
# ready. Those three Monitor commands run AFTER the ELF is loaded. The literal
# `{cpu}` token is substituted with `cpu_path` so the command stays SoC-generic.
[soc]
backend = "renode"
machine = "fe310"
platform_repl = """
// SiFive FE310 platform: the stock Renode file plus this part's real core clock.
//
// CLOCK TRUTH (tests/clock_truth.rs). The stock sifive-fe310.repl leaves
// `cpu PerformanceInMips` at Renode's default 100, against a part whose core
// runs at 16 MHz, so an instruction-timed delay costs about a sixth of the
// virtual time it costs on the board. This is the same defect the STM32 and
// nRF52 platforms carried, and the sibling parts measured 9.09x, 4.51x and
// 6.58x fast before it was fixed.
//
// 16 MHz is the FE310-G002's RESET DEFAULT: the core comes up on the internal
// HFROSC, which the factory trim targets at 16 MHz (FE310-G002 manual §6.2),
// and this platform's PRCI is a pair of always-ready tags rather than a clock
// tree that firmware could retune. `frequency_hz` below declares the same
// 16 MHz and is cross-checked against this declaration at descriptor load
// (soc::check_clock_declarations).
//
// MTIME (measured, tests/clock_truth.rs fe310 gates): the stock file declares
// `clint frequency: 62000000` for the machine timer, while the real FE310
// drives `mtime` from the 32.768 kHz always-on RTC tick (the same FE310-G002
// manual cited above: rtcclk is the LFROSC/LFXOSC low-frequency clock, and
// mtime counts it). The override below declares the part's real rate, and it
// is a MEASURED edit, not a guess: an mtime-timed oracle firmware
// (testdata/firmware/clock_truth/fe310_tick) toggles a pin every 3277 mtime
// ticks, and the gate asserts the sim rate is within 5% of the 32768 Hz the
// silicon counts at, on this platform AND fails on a platform that keeps the
// stock 62 MHz (a 1892x error). The mtime domain is separate from the core
// clock, so the `frequency_hz` cross-check above deliberately does not police
// it; the two-sided measurement is what holds it instead.
//
// A RISC-V part has no NVIC, so there is no `systickFrequency` to declare; the
// cross-check requires `PerformanceInMips`, which every Renode CPU has.

using "platforms/cpus/sifive-fe310.repl"

cpu:
    PerformanceInMips: 16

clint:
    frequency: 32768
"""
cpu_path = "sysbus.cpu"
uart = "sysbus.uart0"
frequency_hz = 16_000_000
expected_e_machine = "EM_RISCV"
mcu_label = "SiFive FE310 (RISC-V)"

# WATCHDOG: not measured on this part. The two watchdogs that were measured (the
# F103's, which bites once, and the nRF52840's, which never bites) disagree, so
# nothing here can be inferred from them. Omitting this field would claim the
# watchdog behaves.
watchdog_limitation = """\
Watchdog behaviour is UNVERIFIED on this part in this co-simulator: nobody has \
measured whether an unserviced watchdog resets the core here, so a firmware \
recovery path that depends on it is untested on this run.\
"""
post_load_setup = [
    'sysbus Tag <0x10008000 4> "PRCI_HFROSCCFG" 0xFFFFFFFF',
    'sysbus Tag <0x10008008 4> "PRCI_PLLCFG" 0xFFFFFFFF',
    '{cpu} PC `sysbus GetSymbolAddress "vinit"`',
]

# The stock sifive-fe310.repl registers the GPIO port as `gpioInputs` (verified
# against the installed Renode 1.16.1's `peripherals` listing); the previous
# `gpio0` here named a peripheral that does not exist on this platform, so
# every ODR poll failed and no FE310 edge was ever observable.
[[soc.ports]]
letter = "0"
peripheral = "gpioInputs"
odr_offset = 0x0C
width = 32

[soc.i2c]
controllers = []
[soc.spi]
controllers = []
