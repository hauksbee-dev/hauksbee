# ESP32-S3 (Xtensa LX7), 240 MHz. Same register-first output plus mailbox
# fallback/input contract as classic ESP32.
[soc]
backend = "qemu"
arch = "xtensa"
machine = "esp32s3"
icount_shift = 2
frequency_hz = 240_000_000
expected_e_machine = "EM_XTENSA"
mcu_label = "ESP32-S3 (Xtensa LX7)"
gpio_qom_path = "/machine/soc/gpio"

[[soc.banks]]
letter = "0"
out_reg = 0x5000_0000
peripheral_out_reg = 0x6000_4004
peripheral_enable_reg = 0x6000_4020
in_reg = 0x5000_0004
width = 32

[soc.i2c]
buses = ["/machine/soc/i2c0/i2c", "/machine/soc/i2c1/i2c"]
