# STM32L0 (STM32L0x1 class, Cortex-M0+): PA-PE, PH, USART2 bridge, 2 MHz.
#
# PLATFORM. Renode's stock `platforms/cpus/stm32l071.repl` with the clock
# declarations below. Proven live against the TR-9 keypad firmware
# (STM32L011K4, CubeMX HAL): it reaches main(), parks in its `while (1)` and
# scans the keypad columns on PA1-PA3 from its TIM2 interrupt.
#
# SYSTICK. The stock STM32L0_RCC retunes the NVIC's SysTick from the RCC
# configuration the firmware writes (it reported 128 MHz after a HAL PLL
# setup), which breaks the clock-truth cross-check and runs SysTick delays
# 16x fast. Unlinking it (`rcc: systick: empty`) holds SysTick at the declared
# rate.
#
# NOT MODELLED: the stock `adc1` is Renode's STM32_ADC, whose feed method has
# not been verified on this layout, so [[soc.adc]] is empty and ADC injection
# is a loud drop. L011/L021 parts have fewer ports than this map; pins that
# do not exist on the package are simply never bound.
#
# PULLS. The stock GPIO model ignores PUPDR, so every port carries a `pull`
# map and the backend applies the pull on each firmware IDR read.
[soc]
backend = "renode"
machine = "l0"
platform_repl = """
// STM32L0 platform: the stock L071 file with SysTick unlinked from the RCC
// model and the core held at a whole-MHz rate.
//
// CLOCK TRUTH (tests/clock_truth.rs). The reset default is the 2.097 MHz MSI
// (RM0377 section 7.2). Renode's clock declarations are whole MHz here, so
// core and SysTick are declared at 2 MHz, 4.6% below the part; stated in
// timing_limitation.

using "platforms/cpus/stm32l071.repl"

rcc:
    systick: empty

nvic:
    systickFrequency: 2000000

cpu:
    PerformanceInMips: 2
"""
cpu_path = "sysbus.cpu"
uart = "sysbus.usart2"
frequency_hz = 2_000_000
expected_e_machine = "EM_ARM"
mcu_label = "STM32L0 (ARM Cortex-M0+)"

watchdog_limitation = """\
Watchdog behaviour is UNVERIFIED on the STM32L0 in this co-simulator: nobody \
has measured whether an unserviced watchdog resets the core here, so a \
firmware recovery path that depends on it is untested on this run.\
"""

timing_limitation = """\
The STM32L0 core and SysTick are declared at 2 MHz (the 2.097 MHz MSI reset \
default rounded to whole MHz) until the first slice, after which the backend \
decodes RCC_CR/ICSCR/CFGR and retunes the SysTick and every TIMx block to the \
clock tree the firmware set (MSI range, HSI16, HSE, PLL) exactly. The CPU's \
instructions-per-second knob only takes whole MHz, so instruction-timed delay \
loops (not SysTick or timer waits) run up to 4.6% slow at the 2.097 and \
4.194 MHz MSI ranges. The HSE crystal value is taken as 8 MHz.\
"""

[[soc.ports]]
letter = "A"
peripheral = "gpioPortA"
odr_offset = 0x14
width = 16
dir = { offset = 0x00, encoding = "moder" }
pull = { pupdr_offset = 0x0C, idr_offset = 0x10 }
[[soc.ports]]
letter = "B"
peripheral = "gpioPortB"
odr_offset = 0x14
width = 16
dir = { offset = 0x00, encoding = "moder" }
pull = { pupdr_offset = 0x0C, idr_offset = 0x10 }
[[soc.ports]]
letter = "C"
peripheral = "gpioPortC"
odr_offset = 0x14
width = 16
dir = { offset = 0x00, encoding = "moder" }
pull = { pupdr_offset = 0x0C, idr_offset = 0x10 }
[[soc.ports]]
letter = "D"
peripheral = "gpioPortD"
odr_offset = 0x14
width = 16
dir = { offset = 0x00, encoding = "moder" }
pull = { pupdr_offset = 0x0C, idr_offset = 0x10 }
[[soc.ports]]
letter = "E"
peripheral = "gpioPortE"
odr_offset = 0x14
width = 16
dir = { offset = 0x00, encoding = "moder" }
pull = { pupdr_offset = 0x0C, idr_offset = 0x10 }
[[soc.ports]]
letter = "H"
peripheral = "gpioPortH"
odr_offset = 0x14
width = 16
dir = { offset = 0x00, encoding = "moder" }
pull = { pupdr_offset = 0x0C, idr_offset = 0x10 }

[soc.i2c]
controllers = []

[soc.spi]
controllers = []

# ── CLOCK TREE (decoded from the live registers) ──────────────────────────────
# RM0377 Rev 10 s7.3: RCC_CR @ +0x00 (pp.181-183), RCC_ICSCR @ +0x04 (p.184),
# RCC_CFGR @ +0x0C (pp.185-187; SWS and HPRE are on p.187).
#   MSIRANGE (ICSCR 15:13): 0 65.536 kHz, 1 131.072 kHz, 2 262.144 kHz,
#     3 524.288 kHz, 4 1.048 MHz, 5 2.097 MHz (reset), 6 4.194 MHz; 7 reserved.
#   SWS/SW (CFGR 3:2 / 1:0): 00 MSI, 01 HSI16, 10 HSE, 11 PLL.
#   HSI16DIVEN (CR bit 3): HSI16 divided by 4 (p.182). Figure 17 (p.171) puts
#     the divider ("/1,4") before the HSI16 node, so the divided clock is what
#     feeds the PLLSRC mux, the SYSCLK mux and the USART/LPUART/I2C kernel muxes.
#     The hardware status bit is HSI16DIVF (bit 4), which lags a write; the
#     enable bit is used here because it is what firmware sets.
#   PLLSRC (CFGR bit 16): 0 HSI16, 1 HSE. PLLMUL (21:18): x3 x4 x6 x8 x12 x16
#     x24 x32 x48 (p.186); PLLDIV (23:22): 01 /2, 10 /3, 11 /4, 00 not allowed
#     (p.185).
#   HPRE (7:4): 0xxx /1, 1000 /2 ... 1011 /16, 1100 /64 ... 1111 /512.
#   PPRE1 (10:8), PPRE2 (13:11): 0xx /1, 100 /2 ... 111 /16.
# Timer clock = the APB clock if its prescaler is 1, else twice it (p.172).
# `hsi` is therefore the HSI16 node after the divider, and every consumer below
# (PLL input, SYSCLK, `clk_hsi` in the USART kernel-clock muxes) uses it. The
# HSE value is the Nucleo 8 MHz; a board with another crystal needs that value
# passed in.
[[soc.decode]]
kind = "clock"
name = "rcc"
registers = { cr = 0x40021000, icscr = 0x40021004, cfgr = 0x4002100C }
vars = [
    ["msi", "pick(bits(icscr, 15, 13), 65536, 131072, 262144, 524288, 1048576, 2097152, 4194304)"],
    ["hsi", "16000000 / if(bit(cr, 3), 4, 1)"],
    ["hse", "8000000"],
    ["pll_in", "if(bit(cfgr, 16), hse, hsi)"],
    ["pll_out", "pll_in * pick(bits(cfgr, 21, 18), 3, 4, 6, 8, 12, 16, 24, 32, 48) / pick(bits(cfgr, 23, 22) - 1, 2, 3, 4)"],
    ["sysclk", "pick(bits(cfgr, 3, 2), msi, hsi, hse, pll_out)"],
    ["hclk", "sysclk / pick(bits(cfgr, 7, 4), 1, 1, 1, 1, 1, 1, 1, 1, 2, 4, 8, 16, 64, 128, 256, 512)"],
    ["pclk1_div", "pick(bits(cfgr, 10, 8), 1, 1, 1, 1, 2, 4, 8, 16)"],
    ["pclk1", "hclk / pclk1_div"],
    ["pclk2_div", "pick(bits(cfgr, 13, 11), 1, 1, 1, 1, 2, 4, 8, 16)"],
    ["pclk2", "hclk / pclk2_div"],
    ["tim_apb1", "if(pclk1_div == 1, pclk1, pclk1 * 2)"],
    ["tim_apb2", "if(pclk2_div == 1, pclk2, pclk2 * 2)"],
    ["core_hz", "hclk"],
]

# Retune targets. Cortex-M0+: about one instruction per cycle; SysTick counts
# HCLK here (the descriptor leaves CLKSOURCE to the firmware). TIM2, 3, 6, 7 are
# on APB1, TIM21 and TIM22 on APB2 (RM0377 memory map).
[[soc.clock_targets]]
var = "core_hz"
command = "sysbus.cpu PerformanceInMips {mhz}"
[[soc.clock_targets]]
var = "core_hz"
command = "sysbus.nvic Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb1"
command = "sysbus.timer2 Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb1"
command = "sysbus.timer3 Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb1"
command = "sysbus.timer6 Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb1"
command = "sysbus.timer7 Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb2"
command = "sysbus.timer21 Frequency {hz}"
[[soc.clock_targets]]
var = "tim_apb2"
command = "sysbus.timer22 Frequency {hz}"

# ── OSCILLATOR READINESS ──────────────────────────────────────────────────────
# RCC_CR (RM0377 s7.3.1, pp.181-183): HSEON bit 16, HSERDY bit 17, PLLON bit 24,
# PLLRDY bit 25. HSE startup 2 ms (DS10690 Rev 7 p.81, tSU(HSE)); PLL lock 160 us
# maximum (DS10690 Rev 7 p.86, tLOCK). The PLL waits for HSE only while CFGR.PLLSRC
# selects it.
[[soc.clock_ready]]
peripheral = "rcc"
name = "hse"
enable_register = 0x00
enable_mask = 0x10000
ready_register = 0x00
ready_mask = 0x20000
requires_external = true
startup_us = 2000.0

[[soc.clock_ready]]
peripheral = "rcc"
name = "pll"
enable_register = 0x00
enable_mask = 0x1000000
ready_register = 0x00
ready_mask = 0x2000000
startup_us = 160.0
needs = [{ entry = "hse", when = { register = 0x0C, mask = 0x10000, value = 0x10000 } }]

# Timer fixes (see `periph_snapshot::TimerFix`): UIF latches regardless of
# TIMx_DIER.UIE and the counter wraps after ARR + 1 ticks, on silicon.
[[soc.timer_fixes]]
peripheral = "timer2"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer3"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer6"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer7"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer21"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer22"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C


# ── PERIPHERAL SNAPSHOT DECODE (RM0377 Rev 10; pdf page = printed page) ───────
# Base addresses: Table 3 (pp.54-55): USART1 0x40013800 (APB2), USART2
# 0x40004400 (APB1), SPI1 0x40013000 (APB2), SPI2 0x40003800 (APB1), TIM2
# 0x40000000, TIM3 0x40000400, TIM6 0x40001000, TIM7 0x40001400 (APB1), TIM21
# 0x40010800, TIM22 0x40011400 (APB2). LPUART1 and the I2C controllers are not
# decoded (their kernel clocks and timing registers are not modelled), so the
# snapshot reports no block for them rather than a guess.
#
# USART (s24.5.4, pp.672-673): OVER8 = 0 gives baud = fCK / BRR; OVER8 = 1
# gives fCK / (8 x BRR[15:4] + BRR[2:0]) (USARTDIV = BRR[15:4] x 16 + BRR[2:0]
# x 2, BRR[3] = 0). CR1 +0x00 (M0 bit 12, OVER8 bit 15, M1 bit 28; pp.701-702),
# CR2 +0x04 (STOP 13:12, p.706: 00 1, 01 0.5, 10 2, 11 1.5), BRR +0x0C
# (s24.8.4, p.712). Kernel clock: RCC_CCIPR @ +0x4C (p.208-209) USART1SEL 1:0
# and USART2SEL 3:2: 00 APB, 01 SYSCLK, 10 HSI16, 11 LSE (32.768 kHz).
#
# SPI: CR1 +0x00, BR[2:0] bits 5:3 gives fPCLK / 2^(BR+1) (p.809), CPOL bit 1,
# CPHA bit 0 (p.810).
#
# Timers: PSC +0x28, ARR +0x2C, both 16 bits (TIM2/3 p.430, TIM21/22 p.488,
# TIM6/7 p.505); update period (ARR + 1) / (timer clock / (PSC + 1)).
[[soc.decode]]
kind = "uart"
name = "usart1"
registers = { cr1 = 0x40013800, cr2 = 0x40013804, brr = 0x4001380C, ccipr = 0x4002104C }
vars = [
    ["baud", "(pick(bits(ccipr, 1, 0), clk_pclk2, clk_sysclk, clk_hsi, 32768)) / if(bit(cr1, 15), bits(brr, 15, 4) * 8 + bits(brr, 2, 0), bits(brr, 15, 0))"],
    ["data_bits", "pick(bit(cr1, 12) + 2 * bit(cr1, 28), 8, 9, 7)"],
    ["stop_bits", "pick(bits(cr2, 13, 12), 1, 0.5, 2, 1.5)"],
]
[[soc.decode]]
kind = "uart"
name = "usart2"
registers = { cr1 = 0x40004400, cr2 = 0x40004404, brr = 0x4000440C, ccipr = 0x4002104C }
vars = [
    ["baud", "(pick(bits(ccipr, 3, 2), clk_pclk1, clk_sysclk, clk_hsi, 32768)) / if(bit(cr1, 15), bits(brr, 15, 4) * 8 + bits(brr, 2, 0), bits(brr, 15, 0))"],
    ["data_bits", "pick(bit(cr1, 12) + 2 * bit(cr1, 28), 8, 9, 7)"],
    ["stop_bits", "pick(bits(cr2, 13, 12), 1, 0.5, 2, 1.5)"],
]
[[soc.decode]]
kind = "spi"
name = "spi1"
registers = { cr1 = 0x40013000 }
vars = [
    ["sck_hz", "clk_pclk2 / pick(bits(cr1, 5, 3), 2, 4, 8, 16, 32, 64, 128, 256)"],
    ["cpol", "bit(cr1, 1)"],
    ["cpha", "bit(cr1, 0)"],
]
[[soc.decode]]
kind = "spi"
name = "spi2"
registers = { cr1 = 0x40003800 }
vars = [
    ["sck_hz", "clk_pclk1 / pick(bits(cr1, 5, 3), 2, 4, 8, 16, 32, 64, 128, 256)"],
    ["cpol", "bit(cr1, 1)"],
    ["cpha", "bit(cr1, 0)"],
]
[[soc.decode]]
kind = "timer"
name = "tim2"
registers = { psc = 0x40000028, arr = 0x4000002C }
vars = [
    ["tick_hz", "clk_tim_apb1 / (bits(psc, 15, 0) + 1)"],
    ["period_s", "(bits(arr, 15, 0) + 1) / tick_hz"],
]
[[soc.decode]]
kind = "timer"
name = "tim3"
registers = { psc = 0x40000428, arr = 0x4000042C }
vars = [
    ["tick_hz", "clk_tim_apb1 / (bits(psc, 15, 0) + 1)"],
    ["period_s", "(bits(arr, 15, 0) + 1) / tick_hz"],
]
[[soc.decode]]
kind = "timer"
name = "tim6"
registers = { psc = 0x40001028, arr = 0x4000102C }
vars = [
    ["tick_hz", "clk_tim_apb1 / (bits(psc, 15, 0) + 1)"],
    ["period_s", "(bits(arr, 15, 0) + 1) / tick_hz"],
]
[[soc.decode]]
kind = "timer"
name = "tim7"
registers = { psc = 0x40001428, arr = 0x4000142C }
vars = [
    ["tick_hz", "clk_tim_apb1 / (bits(psc, 15, 0) + 1)"],
    ["period_s", "(bits(arr, 15, 0) + 1) / tick_hz"],
]
[[soc.decode]]
kind = "timer"
name = "tim21"
registers = { psc = 0x40010828, arr = 0x4001082C }
vars = [
    ["tick_hz", "clk_tim_apb2 / (bits(psc, 15, 0) + 1)"],
    ["period_s", "(bits(arr, 15, 0) + 1) / tick_hz"],
]
[[soc.decode]]
kind = "timer"
name = "tim22"
registers = { psc = 0x40011428, arr = 0x4001142C }
vars = [
    ["tick_hz", "clk_tim_apb2 / (bits(psc, 15, 0) + 1)"],
    ["period_s", "(bits(arr, 15, 0) + 1) / tick_hz"],
]
