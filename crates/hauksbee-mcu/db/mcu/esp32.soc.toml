# Classic ESP32 (Xtensa LX6 dual-core), 240 MHz, single 32-bit GPIO bank for
# pins 0..31 (the demo and most products use only low pins).
#
# GPIO output prefers the real peripheral register when the live QOM object
# proves Hauksbee's stateful QEMU patch; out_reg is the firmware-mailbox fallback
# for an unpatched fork. Input remains a named mailbox contract.
[soc]
backend = "qemu"
arch = "xtensa"
machine = "esp32"
icount_shift = 2
frequency_hz = 240_000_000
expected_e_machine = "EM_XTENSA"
mcu_label = "ESP32 (Xtensa LX6)"
gpio_qom_path = "/machine/soc/gpio"

[[soc.banks]]
letter = "0"
out_reg = 0x5000_0000
peripheral_out_reg = 0x3ff4_4004
peripheral_enable_reg = 0x3ff4_4020
# GPIO_FUNC0_OUT_SEL_CFG_REG (ESP32 TRM v5.8 table 6.12-1; ESP-IDF
# soc/esp32/register/soc/gpio_reg.h, DR_REG_GPIO_BASE + 0x530): the GPIO-matrix
# output-select words, pad n at +4n. Read only when the live object also
# exposes gpio-func-out-sel, so a PWM/timer/RMT output routed to a pad is seen
# as firmware-driven. (The S3/C3 blocks start at 0x554 and are not described.)
peripheral_func_out_sel_reg = 0x3ff4_4530
in_reg = 0x5000_0004
width = 32

# IO_MUX (DR_REG_IO_MUX_BASE) and RTC IO (DR_REG_RTCIO_BASE), ESP32 TRM v5.8
# tables 6.12-2/6.12-3: a pad's MCU_SEL direct function, RTC mux, DAC or touch
# channel takes it off the GPIO matrix. Read only when both live objects expose
# word0 (Hauksbee's patch; the upstream machine maps them as unimplemented).
[soc.banks.pad_mux]
io_mux_reg = 0x3ff4_9000
rtc_io_reg = 0x3ff4_8400
io_mux_qom_path = "/machine/soc/iomux"
rtc_io_qom_path = "/machine/soc/rtcio"

# GPIO34..39 (port '1' bits 2..7 in the flat 0..31 / 32+ numbering) have no
# output driver. ESP-IDF soc/esp32/include/soc/soc_caps.h: "GPIO >= 34 are
# input only", SOC_GPIO_VALID_OUTPUT_GPIO_MASK clears BIT34..BIT39. (The S3
# and C3 headers say no GPIO is input-only.)
[[soc.input_only]]
letter = "1"
bits = [2, 3, 4, 5, 6, 7]

[soc.i2c]
# The Espressif ESP32-family machines expose these QOM bus paths; the machine
# auto-instantiates a tmp105 at 0x48 on i2c0. i2c1 is searched too.
buses = ["/machine/soc/i2c0/i2c", "/machine/soc/i2c1/i2c"]
