[soc.i2c]
# Not bridged: the STM32F7_I2C bridge registration is unverified on this
# composed platform, so a bound I2C device is reported as never exercised.
controllers = []

[soc.spi]
controllers = []

# ── CLOCK TREE (decoded from the live registers) ──────────────────────────────
# RM0440 Rev 9 s7.4: RCC_CR @ +0x00 (p.287), RCC_CFGR @ +0x08 (pp.289-291),
# RCC_PLLCFGR @ +0x0C (pp.291-293).
#   SWS (3:2): 01 HSI16, 10 HSE, 11 PLL (00 reserved).
#   PLLSRC (1:0): 10 HSI16, 11 HSE (00 no clock). PLLM (7:4): value + 1.
#   PLLN (14:8): VCO multiplier. PLLR (26:25): 00 /2, 01 /4, 10 /6, 11 /8.
#   f(VCO) = f(in) x PLLN / PLLM, f(PLL_R) = f(VCO) / PLLR (p.291).
#   HPRE (7:4): 0xxx /1, 1000 /2 ... 1011 /16, 1100 /64 ... 1111 /512.
#   PPRE1 (10:8), PPRE2 (13:11): 0xx /1, 100 /2 ... 111 /16.
# Timer clock = APB clock if its prescaler is 1, otherwise x2 (s7.2.13, p.281).
# HSI16 is 16 MHz (s7.2.2). The HSE value is an 8 MHz crystal; a board with
# another crystal needs that value passed in.
[[soc.decode]]
kind = "clock"
name = "rcc"
registers = { cr = 0x40021000, cfgr = 0x40021008, pllcfgr = 0x4002100C }
vars = [
    ["hsi", "16000000"],
    ["hse", "8000000"],
    ["pll_in", "pick(bits(pllcfgr, 1, 0), 0, 0, hsi, hse)"],
    ["pll_out", "pll_in / (bits(pllcfgr, 7, 4) + 1) * bits(pllcfgr, 14, 8) / pick(bits(pllcfgr, 26, 25), 2, 4, 6, 8)"],
    ["sysclk", "pick(bits(cfgr, 3, 2) - 1, hsi, hse, pll_out)"],
    ["hclk", "sysclk / pick(bits(cfgr, 7, 4), 1, 1, 1, 1, 1, 1, 1, 1, 2, 4, 8, 16, 64, 128, 256, 512)"],
    ["pclk1_div", "pick(bits(cfgr, 10, 8), 1, 1, 1, 1, 2, 4, 8, 16)"],
    ["pclk1", "hclk / pclk1_div"],
    ["pclk2_div", "pick(bits(cfgr, 13, 11), 1, 1, 1, 1, 2, 4, 8, 16)"],
    ["pclk2", "hclk / pclk2_div"],
    ["tim_apb1", "if(pclk1_div == 1, pclk1, pclk1 * 2)"],
    ["tim_apb2", "if(pclk2_div == 1, pclk2, pclk2 * 2)"],
    ["core_hz", "hclk"],
]

# Retune targets. Cortex-M4F: about one instruction per cycle (MIPS = MHz);
# SysTick counts HCLK (CLKSOURCE = 1). APB1: TIM2-7; APB2: TIM1, TIM8,
# TIM15-17. LPTIM1 and the USART/I2C kernel clocks have their own mux in
# RCC_CCIPR and are not followed.
[[soc.clock_targets]]
var = "core_hz"
command = "sysbus.cpu PerformanceInMips {mhz}"
[[soc.clock_targets]]
var = "core_hz"
command = "sysbus.nvic Frequency {hz}"
