# ── OSCILLATOR READINESS ──────────────────────────────────────────────────────
# RCC_CR (RM0440 s7.4.1, p.287): HSEON bit 16, HSERDY bit 17, PLLON bit 24,
# PLLRDY bit 25. HSE startup is 2 ms typical (DS12288, p.117, tSU(HSE)); PLL
# lock is 15 us typical and 40 us maximum (DS12288, p.123, tLOCK), the maximum
# modelled. The PLL waits for HSE only while
# RCC_PLLCFGR.PLLSRC selects it (0b11); HSI16 is the always-available default.
[[soc.clock_ready]]
peripheral = "rcc"
name = "hse"
enable_register = 0x00
enable_mask = 0x10000
ready_register = 0x00
ready_mask = 0x20000
requires_external = true
startup_us = 2000.0

[[soc.clock_ready]]
peripheral = "rcc"
name = "pll"
enable_register = 0x00
enable_mask = 0x1000000
ready_register = 0x00
ready_mask = 0x2000000
startup_us = 40.0
needs = [{ entry = "hse", when = { register = 0x0C, mask = 0x3, value = 0x3 } }]

# Renode's timer departs from silicon in two ways a polled time base hits (see
# `periph_snapshot::TimerFix`): UIF latches only while TIMx_DIER.UIE is set
# (silicon: always, RM0090 Rev 22 p.631), and the counter wraps after ARR ticks
# instead of ARR + 1 (RM0090 s18.3.2 p.589).
[[soc.timer_fixes]]
peripheral = "timer1"
enable_register = 0x0C
enable_mask = 0x1
auto_reload_register = 0x2C
[[soc.timer_fixes]]
peripheral = "timer2"
enable_register = 0x0C
