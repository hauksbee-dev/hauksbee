# ── PERIPHERAL SNAPSHOT DECODE (RM0440 Rev 9; pdf page = printed page) ────────
# Base addresses: Table 3 (pp.85-87): USART1 0x40013800, USART2 0x40004400,
# USART3 0x40004800, SPI1 0x40013000, SPI2 0x40003800, SPI3 0x40003C00, TIM1
# 0x40012C00, TIM8 0x40013400, TIM15 0x40014000, TIM16 0x40014400, TIM17
# 0x40014800 (APB2), TIM2-TIM7 0x40000000 + n x 0x400 (APB1). LPUART1, UART4/5
# and the I2C controllers are not decoded (their kernel clock mux or timing
# registers are not modelled), so the snapshot reports no block for them.
#
# USART (s40.5.4 and s40.8.5 BRR @ +0x0C, pp.1741-1755): OVER8 = 0 gives
# baud = fCK / (PRESCALER x BRR); OVER8 = 1 gives fCK / (PRESCALER x
# (8 x BRR[15:4] + BRR[2:0])) (BRR[2:0] = USARTDIV[3:0] >> 1, p.1755).
# USART_PRESC @ +0x2C (p.1772): 0 /1, 1 /2, 2 /4, 3 /6, 4 /8, 5 /10, 6 /12,
# 7 /16, 8 /32, 9 /64, 10 /128, 11 /256, any other value is treated as /256.
# CR1 +0x00 (M0 bit 12, OVER8 bit 15, M1 bit 28; pp.1741-1742), CR2 +0x04
# (STOP 13:12, p.1749: 00 1, 01 0.5, 10 2, 11 1.5). Kernel clock: RCC_CCIPR
# @ +0x88 (p.322-324) USART1SEL 1:0, USART2SEL 3:2, USART3SEL 5:4: 00 PCLK,
# 01 SYSCLK, 10 HSI16, 11 LSE (32.768 kHz).
#
# SPI: CR1 +0x00, BR[2:0] bits 5:3 gives fPCLK / 2^(BR+1) (p.1875), CPOL bit 1,
# CPHA bit 0.
#
# Timers: PSC +0x28 (16 bits), ARR +0x2C (16 bits; 32 bits on TIM2 and TIM5),
# RCR +0x30 (REP 15:0 on TIM1 and TIM8 p.1263, 7:0 on TIM15-17 pp.1470, 1496);
# update period (ARR + 1) x (REP + 1) / (timer clock / (PSC + 1)).
[[soc.decode]]
kind = "uart"
name = "usart1"
registers = { cr1 = 0x40013800, cr2 = 0x40013804, brr = 0x4001380C, ccipr = 0x40021088, presc = 0x4001382C }
vars = [
    ["baud", "(pick(bits(ccipr, 1, 0), clk_pclk2, clk_sysclk, clk_hsi, 32768)) / pick(min(bits(presc, 3, 0), 11), 1, 2, 4, 6, 8, 10, 12, 16, 32, 64, 128, 256) / if(bit(cr1, 15), bits(brr, 15, 4) * 8 + bits(brr, 2, 0), bits(brr, 15, 0))"],
    ["data_bits", "pick(bit(cr1, 12) + 2 * bit(cr1, 28), 8, 9, 7)"],
    ["stop_bits", "pick(bits(cr2, 13, 12), 1, 0.5, 2, 1.5)"],
]
[[soc.decode]]
kind = "uart"
name = "usart2"
registers = { cr1 = 0x40004400, cr2 = 0x40004404, brr = 0x4000440C, ccipr = 0x40021088, presc = 0x4000442C }
vars = [
    ["baud", "(pick(bits(ccipr, 3, 2), clk_pclk1, clk_sysclk, clk_hsi, 32768)) / pick(min(bits(presc, 3, 0), 11), 1, 2, 4, 6, 8, 10, 12, 16, 32, 64, 128, 256) / if(bit(cr1, 15), bits(brr, 15, 4) * 8 + bits(brr, 2, 0), bits(brr, 15, 0))"],
    ["data_bits", "pick(bit(cr1, 12) + 2 * bit(cr1, 28), 8, 9, 7)"],
    ["stop_bits", "pick(bits(cr2, 13, 12), 1, 0.5, 2, 1.5)"],
]
