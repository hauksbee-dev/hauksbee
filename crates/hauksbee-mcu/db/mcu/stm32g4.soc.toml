# ADC INJECTION. The engine channel number is the ADC1 input number for a pin
# ADC1 can read, and 32 + the ADC2 input number for a pin only ADC2 can read
# (PA4 = ADC2_IN17 is engine channel 49). A pin both ADC1 and ADC2 read
# (ADC12_INx) feeds both converters. The routing card's `_adcN` pin suffix
# carries this number. Counts land in the ADC register model's per-converter
# table, which DR returns for the matching sequence entry.
[[soc.adc]]
channel = 1
monitor_command = "python \"import __builtin__; d = __builtin__.__dict__.setdefault('hkb_g4_adc', dict()); d['1:1'] = {count}; d['2:1'] = {count}\""
full_scale_volts = 3.3
max_count = 4095

[[soc.adc]]
channel = 2
monitor_command = "python \"import __builtin__; d = __builtin__.__dict__.setdefault('hkb_g4_adc', dict()); d['1:2'] = {count}; d['2:2'] = {count}\""
full_scale_volts = 3.3
max_count = 4095

[[soc.adc]]
channel = 3
monitor_command = "python \"import __builtin__; d = __builtin__.__dict__.setdefault('hkb_g4_adc', dict()); d['1:3'] = {count}\""
full_scale_volts = 3.3
max_count = 4095

[[soc.adc]]
channel = 4
monitor_command = "python \"import __builtin__; d = __builtin__.__dict__.setdefault('hkb_g4_adc', dict()); d['1:4'] = {count}\""
full_scale_volts = 3.3
max_count = 4095

