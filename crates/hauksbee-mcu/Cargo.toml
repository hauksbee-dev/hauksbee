[package]
name = "hauksbee-mcu"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "Generalized MCU emulation bridge (simavr-backed AVR)"

[features]
# `avr` links libsimavr (GPL-3.0) and builds the AvrMcu backend.
# `renode` builds the process-driven RenodeBackend (pure std, no native link).
# `qemu` builds the process-driven QemuBackend for the ESP32 family (pure std,
#   talks to an external Espressif QEMU over QMP + gdbstub + a UART socket).
# All on by default; any can be disabled for a lighter build.
default = ["avr", "renode", "qemu"]
avr = []
renode = []
qemu = []

[dependencies]
anyhow = { workspace = true }
libc = "0.2"
# Backend config structs (RenodeConfig/QemuConfig and their register-offset /
# port-map sub-structs) derive Serialize/Deserialize so they are a plain-data
# file-load target for W5's data-driven MCU descriptor (05-cosim-fidelity §5.5),
# the same "make it a struct now, load it from a file later" move sensor_spec.rs
# already uses. No file loading lives here yet; that is the W5 deliverable.
serde = { workspace = true }
# The W5 data-driven MCU descriptor loader (06 §2): `db/mcu/*.soc.toml` files
# parsed into RenodeConfig/QemuConfig through one validated path. `toml` is the
# file format; `thiserror` gives the loader the same named-error style
# sensor_spec.rs uses (unknown backend, zero-width port, duplicate controller…).
toml = "0.8"
thiserror = { workspace = true }

[build-dependencies]
bindgen = "0.71"
pkg-config = "0.3"

[dev-dependencies]
# Round-trip (serialize -> deserialize -> equal) proof that the config structs
# are a lossless data carrier, i.e. W5's future file load reconstructs the exact
# config a constructor produces.
serde_json = { workspace = true }
