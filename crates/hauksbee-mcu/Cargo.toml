[package]
name = "hauksbee-mcu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
build = "build.rs"
description = "Generalized MCU emulation bridge (simavr-backed AVR)"

[features]
# `avr` links libsimavr (GPL-3.0) and builds the AvrMcu backend.
# `renode` builds the process-driven RenodeBackend (pure std, no native link).
# `qemu` builds the process-driven QemuBackend for the ESP32 family (no native
#   link; talks to an external Espressif QEMU over QMP + gdbstub + a UART
#   socket). Pulls `espflash` (pure Rust, MIT/Apache-2.0) so a bare app `.elf`
#   can be turned into the merged bootloader+partition-table+app flash image
#   QEMU actually boots; without that, an uploaded ELF is unbootable on a
#   machine that has no esptool.
# All on by default; any can be disabled for a lighter build.
default = ["avr", "renode", "qemu"]
avr = []
renode = []
qemu = ["dep:espflash", "dep:tempfile"]

[dependencies]
hauksbee-ir = { version = "0.1.0", path = "../hauksbee-ir" }
anyhow = { workspace = true }
libc = "0.2"
# Backend config structs (RenodeConfig/QemuConfig and their register-offset /
# port-map sub-structs) derive Serialize/Deserialize so they are a plain-data
# file-load target for W5's data-driven MCU descriptor (05-cosim-fidelity §5.5),
# the same "make it a struct now, load it from a file later" move sensor_spec.rs
# already uses. No file loading lives here yet; that is the W5 deliverable.
serde = { workspace = true }
# The W5 data-driven MCU descriptor loader (06 §2): `db/mcu/*.soc.toml` files
# parsed into RenodeConfig/QemuConfig through one validated path. `toml` is the
# file format; `thiserror` gives the loader the same named-error style
# sensor_spec.rs uses (unknown backend, zero-width port, duplicate controller…).
toml = "0.8"
thiserror = { workspace = true }
# ELF -> merged-flash-image conversion for the QEMU backend (see the `qemu`
# feature note above). default-features = false drops the CLI and serialport
# halves; only the image_format/target code is compiled in.
espflash = { version = "4.5.0", default-features = false, optional = true }
# The merged image QEMU boots from is staged as a temp file that must outlive
# the QEMU process; NamedTempFile ties its lifetime to the backend struct.
tempfile = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# Native Job Objects make emulator ownership structural on Windows: closing
# the last job handle kills the whole Renode/QEMU tree, including when the
# hauksbee parent is terminated and Rust never gets to run Drop.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[build-dependencies]
bindgen = "0.71"
pkg-config = "0.3"

[dev-dependencies]
hauksbee-testkit = { path = "../hauksbee-testkit" }
# Round-trip (serialize -> deserialize -> equal) proof that the config structs
# are a lossless data carrier, i.e. W5's future file load reconstructs the exact
# config a constructor produces.
serde_json = { workspace = true }
# The esp-qemu installer's acceptance-boundary tests build fake release
# archives in scratch dirs.
tempfile = { workspace = true }

[lints]
workspace = true
