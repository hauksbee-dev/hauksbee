[package]
name = "galvani-ci"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CI for hardware: run a board+firmware spec headless, assert on rails/UART/blink/faults, emit JUnit + GitHub annotations"

[[bin]]
name = "galvani-ci"
path = "src/main.rs"

[lib]
name = "galvani_ci"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
toml = "0.8"
regex = "1"
galvani-extract = { version = "0.1.0", path = "../galvani-extract" }
galvani-models = { version = "0.1.0", path = "../galvani-models" }
galvani-ir = { version = "0.1.0", path = "../galvani-ir" }
galvani-solve = { version = "0.1.0", path = "../galvani-solve" }
galvani-engine = { version = "0.1.0", path = "../galvani-engine" }
galvani-server = { version = "0.1.0", path = "../galvani-server" }
