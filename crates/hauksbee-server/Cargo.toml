[package]
name = "hauksbee-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web front door for hauksbee: upload a board, get a plain-language report."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# Forward the MCU backend choices to hauksbee-mcu. All on by default so the
# demo server binary keeps its AVR demo engine out of the box. The `avr`
# feature statically links GPL-3.0 libsimavr; a `--no-default-features
# --features renode,qemu` build of the workspace is the GPL-free release
# shape (see docs/about/release-and-licensing.md). Only `McuDemoEngine` (and the
# demo `hauksbee-server` binary) need `avr`; the Engine trait, Server,
# frontdoor, and protocol are backend-agnostic.
default = ["avr", "renode", "qemu"]
avr = ["hauksbee-mcu/avr"]
renode = ["hauksbee-mcu/renode"]
qemu = ["hauksbee-mcu/qemu"]

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", features = ["ws", "multipart"] }
hauksbee-frontdoor-api = { version = "0.1.0-beta.3", path = "../hauksbee-frontdoor-api" }
hauksbee-mcu = { version = "0.1.0-beta.3", path = "../hauksbee-mcu", default-features = false }
serde_json.workspace = true
tokio = { version = "1.52.3", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
# Streams the dependency-install progress (`/api/deps/install/{id}`) as an SSE
# body: ReceiverStream adapts the worker's mpsc channel into the axum Body.
tokio-stream = "0.1"
tower-http = { version = "0.6.11", features = ["fs", "compression-gzip"] }

[lints]
workspace = true
