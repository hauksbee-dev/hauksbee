[package]
name = "hauksbee-cosim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Co-simulation layer: the lockstep scheduler coupling analog, MCU and digital domains, plus peripherals, responders and the HauksbeeEngine facade"

[features]
# Propagate the MCU backend choices exactly as hauksbee-engine does; every
# hauksbee-* path dependency sets `default-features = false` so a
# `--no-default-features --features renode,qemu` build stays GPL-free.
default = ["avr", "renode", "qemu"]
avr = ["hauksbee-mcu/avr"]
renode = ["hauksbee-mcu/renode"]
qemu = ["hauksbee-mcu/qemu"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1.2"
sha2 = "0.11"
toml = "0.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = { workspace = true }
hauksbee-bind = { version = "0.1.0-beta.4", path = "../hauksbee-bind" }
hauksbee-extract = { version = "0.1.0-beta.4", path = "../hauksbee-extract" }
hauksbee-models = { version = "0.1.0-beta.4", path = "../hauksbee-models" }
hauksbee-ir = { version = "0.1.0-beta.4", path = "../hauksbee-ir" }
hauksbee-solve = { version = "0.1.0-beta.4", path = "../hauksbee-solve" }
hauksbee-mcu = { version = "0.1.0-beta.4", path = "../hauksbee-mcu", default-features = false }
hauksbee-frontdoor-api = { version = "0.1.0-beta.4", path = "../hauksbee-frontdoor-api" }
evalexpr = { version = "=11.3.1", default-features = false }

[dev-dependencies]
hauksbee-testkit = { path = "../hauksbee-testkit" }

[lints]
workspace = true
