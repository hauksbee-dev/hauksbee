# MCP4728 quad 12-bit I2C DAC — declarative WRITE-SIDE device spec
# -----------------------------------------------------------------------------
# Part: Microchip MCP4728, quad 12-bit voltage-output DAC with internal
#       reference and EEPROM.
# Bus:  I2C. Factory 7-bit address 0x60 (A2=A1=A0 programmed 0); a board with
#       several parts re-programs the low address bits (the Tarski board runs
#       three at 0x60/0x61/0x62). The engine overrides `i2c_address` per
#       instance, so this spec always declares the factory 0x60.
# Ref:  Microchip datasheet DS22187E. Section/table numbers below.
#
# ── What this models ─────────────────────────────────────────────────────────
# The four channels each hold a 12-bit code plus per-channel gain-select,
# reference-select, and power-down state; a channel's output voltage is
#
#     VOUT = (code / 4096) * VREF * gain        (0 V while powered down)
#
# (§5.1, with the power-down switch of §5.4 simplified to 0 V — the real part
# grounds VOUT through a selectable Rpd; none of the bound boards load VOUT
# hard enough for that resistance to matter, and pretending to model 1/100/500k
# pulldowns nothing exercises would be fake fidelity.)
#
# Write commands modeled (Table 5-1), matched FIRST-IN-SPEC-ORDER on the byte
# after the address — the sequential-write mask (0xF8) is a subset of the
# multi/single mask (0xC0), so it must be declared first:
#
#   * Fast Write   (C1C0 = 00): repeating 2-byte groups
#     [0 0 PD1 PD0 D11..D8][D7..D0], channel auto-incrementing from A; carries
#     no gain/vref bits, so those states keep their prior values (the spec's
#     update block simply does not touch them).
#   * Sequential Write (C2..W0 = 01010): ONE command byte whose DAC1 DAC0
#     bits seed the start channel, then repeating 2-byte data groups
#     [Vref PD1 PD0 Gx D11..D8][D7..D0] that auto-increment the channel.
#   * Multi/Single Write (C2C1C0 = 010 or 011, other W1W0): repeating 3-byte
#     groups [cmd][Vref PD1 PD0 Gx D11..D8][D7..D0], the channel taken from
#     each group's own command byte (bits 18:17 of the 24-bit group).
#
# ── What this does NOT model (accepted-and-ignored, counted) ─────────────────
#   * Write-Address-Bits / General-Call commands (first byte 10x/11x): the
#     model assumes the device already answers at its configured address; the
#     LDAC-gated address-reprogramming ACK dance is out of scope. Such bytes
#     are ACKed like the real part but land in `ignored_write_bytes`.
#   * EEPROM persistence: the /WR variants latch exactly like their non-EEPROM
#     counterparts; the read frame mirrors the input register into the EEPROM
#     triple. Power-cycling back to the EEPROM image is not a co-sim concept.
#   * The UDAC bit and the LDAC pin: the bound boards hold LDAC low from init,
#     so a completed group updates VOUT immediately (groups decode greedily,
#     mid-transaction). A board that clocks LDAC would need the pin modeled.
#   * READ-BACK is simplified: the 24-byte frame (§5.5) carries a fixed
#     RDY/POR status byte per triple and the live register values; a reader
#     recovers each channel's 12-bit code exactly as from silicon.
#
# ── evalexpr reminders ────────────────────────────────────────────────────────
# Comparisons must use FLOAT literals (`pd == 0.0`, `gain_bit == 1.0`):
# evalexpr equality is type-strict and every spec variable is bound as a float.
# Bit extraction is the framing layer's job (`field` bit ranges), never
# expression math — evalexpr has no bit operations.

[sensor]
name        = "MCP4728"
bus         = "i2c"
i2c_address = 0x60   # factory default; overridden per instance by the engine
channels    = 4      # DAC channels A..D

# ── Per-channel state ─────────────────────────────────────────────────────────
# Defaults are the factory-unprogrammed power-on state the hand-coded model
# used: code 0 (VOUT ≈ 0 V), normal power mode, internal VREF 2.048 V with
# gain 2 (the Tarski board configuration; the engine overrides vref/gain per
# instance from the binder's resolved model params).

[[sensor.state]]
name    = "code"
default = 0.0        # 12-bit DAC input/output register (LDAC held low: equal)

[[sensor.state]]
name    = "pd"
default = 0.0        # power-down code: 0 = normal, 1..3 = powered down

[[sensor.state]]
name    = "gain"
default = 2.0        # gain select: 1 or 2 (Gx bit)

[[sensor.state]]
name    = "vref"
default = 2.048      # reference voltage, volts (internal 2.048 V selected)

# ── Fast Write (Table 5-1, C1C0 = 00) ────────────────────────────────────────
# 2-byte groups [0 0 PD1 PD0 D11..D8][D7..D0]; the matched first byte IS byte 0
# of the first group (prefix = false). Channel auto-increments from A, cursor
# reset at every write START. No Vref/Gx bits: gain and vref keep prior state.

[[sensor.write_command]]
name        = "fast_write"
match_mask  = 0xC0
match_value = 0x00
group_bytes = 2

[[sensor.write_command.field]]
name = "pd_bits"
bits = [13, 12]

[[sensor.write_command.field]]
name = "code_bits"
bits = [11, 0]

[sensor.write_command.update]
code = "code_bits"
pd   = "pd_bits"

# ── Sequential Write (Table 5-1, C2C1C0 W1W0 = 010 10) ───────────────────────
# Declared BEFORE multi/single: 0x50 & 0xC0 == 0x40 would match that broader
# mask too. The command byte is a PREFIX (not part of any group) whose
# DAC1 DAC0 bits seed the channel cursor; data groups then auto-increment.

[[sensor.write_command]]
name        = "seq_write"
match_mask  = 0xF8
match_value = 0x50
prefix      = true
group_bytes = 2

[sensor.write_command.channel]
source = "prefix_bits"
bits   = [2, 1]

[[sensor.write_command.field]]
name = "seq_vref_bit"
bits = [15, 15]

[[sensor.write_command.field]]
name = "seq_pd_bits"
bits = [14, 13]

[[sensor.write_command.field]]
name = "seq_gain_bit"
bits = [12, 12]

[[sensor.write_command.field]]
name = "seq_code_bits"
bits = [11, 0]

[sensor.write_command.update]
code = "seq_code_bits"
pd   = "seq_pd_bits"
gain = "if(seq_gain_bit == 1.0, 2.0, 1.0)"
# Vref bit 1 selects the internal 2.048 V reference; bit 0 selects external
# VDD, whose magnitude the wire does not carry — keep the channel's configured
# reference (the update reads the PRE-update vref, per the schema contract).
vref = "if(seq_vref_bit == 1.0, 2.048, vref)"

# ── Multi / Single Write (Table 5-1, C2C1C0 = 010/011) ───────────────────────
# 3-byte groups [cmd][Vref PD1 PD0 Gx D11..D8][D7..D0]; each group's channel
# comes from its own command byte (DAC1 DAC0 = bits 18:17 of the 24-bit group).
# The UDAC bit (group bit 16) is ignored: LDAC is board-held low, updates are
# immediate regardless.

[[sensor.write_command]]
name        = "multi_single_write"
match_mask  = 0xC0
match_value = 0x40
group_bytes = 3

[sensor.write_command.channel]
source = "group_bits"
bits   = [18, 17]

[[sensor.write_command.field]]
name = "mw_vref_bit"
bits = [15, 15]

[[sensor.write_command.field]]
name = "mw_pd_bits"
bits = [14, 13]

[[sensor.write_command.field]]
name = "mw_gain_bit"
bits = [12, 12]

[[sensor.write_command.field]]
name = "mw_code_bits"
bits = [11, 0]

[sensor.write_command.update]
code = "mw_code_bits"
pd   = "mw_pd_bits"
gain = "if(mw_gain_bit == 1.0, 2.0, 1.0)"
vref = "if(mw_vref_bit == 1.0, 2.048, vref)"

# ── Output voltage laws (§5.1) ────────────────────────────────────────────────
# One driven net per channel. The engine binds each connected VOUT net's
# PinDriver by channel; the law lands on the net at every transaction end.

[[sensor.output]]
name    = "vout_a"
channel = 0
expr    = "if(pd == 0.0, (code / 4096) * vref * gain, 0.0)"

[[sensor.output]]
name    = "vout_b"
channel = 1
expr    = "if(pd == 0.0, (code / 4096) * vref * gain, 0.0)"

[[sensor.output]]
name    = "vout_c"
channel = 2
expr    = "if(pd == 0.0, (code / 4096) * vref * gain, 0.0)"

[[sensor.output]]
name    = "vout_d"
channel = 3
expr    = "if(pd == 0.0, (code / 4096) * vref * gain, 0.0)"

# ── Read frame (§5.5) ─────────────────────────────────────────────────────────
# A master read streams, per channel A..D: the DAC input-register triple then
# the EEPROM triple (mirroring the input register — see the header), 24 bytes
# total, wrapping. Byte layouts:
#   status: [RDY POR 0 0 0 A2 A1 A0]-ish; modeled as 0xC0 | (addr_low3 << 1),
#           arithmetically 192 + (i2c_address % 8) * 2 (no bit ops in exprs).
#   hi:     [Vref PD1 PD0 Gx D11..D8]; the Vref bit uses the hand-coded
#           model's ±0.5 V band around 2.048 V so an external-VDD channel
#           reports 0 without needing exact float equality.
#   lo:     [D7..D0] = code % 256.

[sensor.read_frame]
per_channel = true
bytes = [
  "192 + (i2c_address % 8) * 2",
  "if(math::abs(vref - 2.048) < 0.5, 128.0, 0.0) + pd * 32 + (gain - 1) * 16 + floor(code / 256)",
  "code % 256",
  "192 + (i2c_address % 8) * 2",
  "if(math::abs(vref - 2.048) < 0.5, 128.0, 0.0) + pd * 32 + (gain - 1) * 16 + floor(code / 256)",
  "code % 256",
]

[sensor.protocol]
style = "i2c_pointer"   # nominal: command framing above replaces pointer writes
