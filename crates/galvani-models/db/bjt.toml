nf  = 1.0
vaf = 74.03
br  = 0.7372
rb  = 9.0
rc  = 0.09
re  = 0.09
cje = 2.2e-12
cjc = 7.306e-13
tf  = 3.011e-10

[models.pins]
"1" = "emitter"
"2" = "base"
"3" = "collector"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "bc237"
kind = "bjt_npn"
description = "BC237/BC547 NPN general-purpose TO-92, 45V, 100mA"

[models.match]
