"2" = "base"
"3" = "emitter"

# ─────────────────────────────────────────────────────────────────────────────

# BCM847BS — matched NPN pair, SOT-363 (6-pin)
# Each transistor in the pair shares the same SPICE model as BC847.
# Pin mapping: SOT-363 pin 1=B1, 2=E1, 3=E2, 4=B2, 5=C2, 6=C1

[[models]]
id = "bcm847bs"
kind = "bjt_npn"
description = "BCM847BS matched NPN pair SOT-363 (2x BC847-grade NPN)"

[models.match]
value_re = "(?i)^BCM847BS"
mpn_re   = "(?i)BCM847BS"

[models.params]
# Source: Nexperia BCM847BS datasheet Rev. 4 2022, SPICE model (same as BC847)
is  = 1.0e-14
bf  = 150.0
nf  = 1.0
vaf = 80.0
br  = 4.0
rb  = 10.0
rc  = 1.0
re  = 0.5
cje = 9.0e-13
cjc = 5.0e-13
tf  = 3.0e-10
# Note: this entry models a single transistor in the pair.
# galvani-extract must instantiate two Device::Bjt entries per footprint,
# using the pin map below for Q1 and Q2 respectively.
pair_count = 2

[models.pins]
# SOT-363 pinout per Nexperia BCM847BS datasheet Fig. 3
"1" = "base_q1"
"2" = "emitter_q1"
"3" = "emitter_q2"
"4" = "base_q2"
"5" = "collector_q2"
"6" = "collector_q1"

