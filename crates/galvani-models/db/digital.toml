# Digital behavioral models.
# params: voh, vol, vih, vil, tpd_s (propagation delay in seconds),
#         supply_pin, gnd_pin, plus any function-specific params.

[[models]]
id = "74hc595"
kind = "shift_register"
description = "74HC595 8-bit serial-in parallel-out shift register with output latch"

[models.match]
value_re = "(?i)^74HC595|^SN74HC595"

[models.params]
# Source: Texas Instruments 74HC595 datasheet (SCLS041I), Table 6.5
voh       = 4.4      # output high (V) at Vcc=4.5V, IoH=−20µA
vol       = 0.1      # output low (V) at Vcc=4.5V, IoL=20µA
vih       = 3.15     # input high threshold (V) at Vcc=4.5V
vil       = 1.35     # input low threshold (V) at Vcc=4.5V
tpd_s     = 1.4e-8   # max propagation delay clock→Qn = 14 ns at 4.5V (Table 6.5)
bits      = 8
supply_pin = "16"
gnd_pin    = "8"

[models.pins]
"1"  = "qb"
"2"  = "qc"
"3"  = "qd"
"4"  = "qe"
"5"  = "qf"
"6"  = "qg"
"7"  = "qh"
"8"  = "gnd"
"9"  = "qh_serial"
"10" = "srclr_n"
"11" = "srclk"
"12" = "rclk"
"13" = "oe_n"
"14" = "ser"
"15" = "qa"
"16" = "vcc"

[models.ratings]
max_pin_current_a = 0.025  # ±25mA per output (TI abs max 35)
max_voltage_v = 7.0

