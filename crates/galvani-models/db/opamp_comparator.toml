# Op-amp and comparator models (behavioral).

[[models]]
id = "lm358"
kind = "opamp"
description = "LM358 dual op-amp, 32V supply, rail-to-rail input"

[models.match]
value_re = "(?i)^LM358"

[models.params]
# Source: Texas Instruments LM358 datasheet (SNOSC16D), typical parameters
gain    = 100000.0  # open-loop DC gain (V/V), typ 100 dB
rail_lo = 0.0       # output low rail (V) — approx. Vss + 0 V (1-supply)
rail_hi = 32.0      # output high rail (V) — single supply

[models.pins]
# Pin numbers for DIP-8 / SOIC-8 LM358 (unit A, pin numbers vary by schematic)
"1" = "out_a"
"2" = "in_minus_a"
"3" = "in_plus_a"
"4" = "vss"
"5" = "in_plus_b"
"6" = "in_minus_b"
"7" = "out_b"
"8" = "vcc"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "lm393"
kind = "comparator"
description = "LM393 dual comparator, open-collector output"

[models.match]
value_re = "(?i)^LM393"

[models.params]
# Source: Texas Instruments LM393 datasheet (SNOSC16D), typical
out_lo     = 0.0    # output pulled low (V) — open-collector at 0
out_hi     = 5.0    # output high (V) — pulled up externally (assumed 5V)
hysteresis = 0.005  # ~5 mV, datasheet input offset

[models.pins]
"1" = "out_a"
"2" = "in_minus_a"
"3" = "in_plus_a"
"4" = "vss"
"5" = "in_plus_b"
"6" = "in_minus_b"
"7" = "out_b"
"8" = "vcc"

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "lmv7219"
kind = "comparator"
description = "LMV7219 7ns single-supply comparator, push-pull output, SOT-23-5"

[models.match]
value_re = "(?i)^LMV7219"

[models.params]
# Source: Texas Instruments LMV7219 datasheet (SNOS561D), Table 6.3 / 6.5
out_lo     = 0.05   # output low typ at 5V supply (V)
out_hi     = 4.95   # output high typ at 5V supply (V)
hysteresis = 0.003  # input offset voltage ±3 mV typ
tpd_s      = 7.0e-9 # propagation delay 7 ns typ @ 5V (Table 6.3)

[models.pins]
"1" = "out"
"2" = "vss"
"3" = "in_plus"
"4" = "in_minus"
"5" = "vcc"
