# MCU and module models.

[[models]]
id = "atmega328p"
kind = "mcu"
description = "ATmega328P 8-bit AVR MCU, TQFP-32 or DIP-28"

[models.match]
value_re   = "(?i)^ATmega328P?$"
mpn_re     = "(?i)^ATmega328P"

[models.params]
# galvani-mcu backend identifier — tells the co-sim layer which emulator core
# to instantiate.
backend = "simavr:atmega328p"

[models.pins]
# TQFP-32 / DIP-28 pin map (KiCad Device:ATmega328P default symbol)
"1"  = "pc6_reset"
"2"  = "pd0_rxd"
"3"  = "pd1_txd"
"4"  = "pd2_int0"
"5"  = "pd3_int1_oc2b"
"6"  = "pd4_t0_xck"
"7"  = "vcc"
"8"  = "gnd"
"9"  = "pb6_xtal1"
"10" = "pb7_xtal2"
"11" = "pd5_t1_oc0b"
"12" = "pd6_ain0_oc0a"
"13" = "pd7_ain1"
"14" = "pb0_icp1"
"15" = "pb1_oc1a"
"16" = "pb2_ss_oc1b"
"17" = "pb3_mosi_oc2a"
"18" = "pb4_miso"
"19" = "pb5_sck"
"20" = "avcc"
"21" = "aref"
"22" = "gnd2"
"23" = "pc0_adc0"
"24" = "pc1_adc1"
"25" = "pc2_adc2"
"26" = "pc3_adc3"
"27" = "pc4_adc4_sda"
"28" = "pc5_adc5_scl"

[models.ratings]
max_pin_current_a = 0.04  # 40mA abs max per I/O pin
max_current_a = 0.2       # 200mA total VCC/GND
max_voltage_v = 6.0

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "arduino_nano"
kind = "mcu"
description = "Arduino Nano module (ATmega328P carrier, 30-pin 2.54mm header)"

[models.match]
value_re   = "(?i)^Arduino.?Nano"
footprint_re = "(?i)Arduino.*Nano"

[models.params]
# The Nano is a module that wraps an ATmega328P; the solver should recursively
# resolve the embedded MCU using the atmega328p entry above.
backend = "simavr:atmega328p"
module  = true        # flag: pin map is at the module header level

[models.pins]
# Arduino Nano pin header (A-side = left, B-side = right when USB at top)
"1"  = "d1_tx"
"2"  = "d0_rx"
"3"  = "reset"
"4"  = "gnd"
"5"  = "d2"
"6"  = "d3_pwm"
"7"  = "d4"
"8"  = "d5_pwm"
"9"  = "d6_pwm"
"10" = "d7"
"11" = "d8"
"12" = "d9_pwm"
"13" = "d10_pwm_ss"
"14" = "d11_pwm_mosi"
"15" = "d12_miso"
"16" = "d13_sck"
"17" = "3v3"
"18" = "aref"
"19" = "a0"
"20" = "a1"
"21" = "a2"
"22" = "a3"
"23" = "a4_sda"
"24" = "a5_scl"
"25" = "a6"
"26" = "a7"
"27" = "5v"
"28" = "reset2"
"29" = "gnd2"
"30" = "vin"

[models.ratings]
max_pin_current_a = 0.04
max_current_a = 0.2

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "stm32f103c8"
kind = "mcu"
description = "STM32F103C8 Cortex-M3 MCU (blue pill), LQFP-48"

[models.match]
value_re = "(?i)^STM32F103C[8B]?(T6)?$"
mpn_re   = "(?i)^STM32F103C[8B]"

[models.params]
# galvani-mcu backend identifier: the Renode backend brings up the matching
# Renode platform (stm32f103.repl) and bridges GPIO/UART through its monitor.
backend = "renode:stm32f103"

[models.pins]
# LQFP-48 pin map (KiCad MCU_ST_STM32F1:STM32F103C8Tx default symbol). Only the
# pins the galvani demo board wires are named with GPIO/ADC roles; power and
# the rest carry their port role so the binder can stamp drivers when wired.
# Roles use the "p<port><bit>" convention the binder's gpio_of_role parses.
"1"  = "pc13"      # onboard LED (blue pill), active-low to 3V3 in HW
"2"  = "pc14"
"3"  = "pc15"
"8"  = "vss"
"9"  = "vdd"
"10" = "pa0_adc0"
"11" = "pa1_adc1"
"12" = "pa2_adc2"
"14" = "pa4_adc4"
"15" = "pa5"       # alive indicator into the analog circuit (GPIO output)
"23" = "vss2"
"24" = "vdd2"
"30" = "pa9"       # USART1 TX
"31" = "pa10"      # USART1 RX
"35" = "vss3"
"36" = "vdd3"
"44" = "vss4"      # VSSA
"48" = "vdd4"      # VDDA

[models.ratings]
max_pin_current_a = 0.025  # 25 mA abs max per I/O pin
max_current_a = 0.15
max_voltage_v = 3.6

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "esp32_wroom"
kind = "mcu"
description = "Espressif ESP32-WROOM-32 module (Xtensa LX6 dual-core), 38-pin"

[models.match]
value_re = "(?i)^(ESP32|ESP32-?WROOM(-32)?|ESP-?WROOM-32)$"
mpn_re   = "(?i)^ESP32-?WROOM"

[models.params]
# galvani-mcu backend identifier: the QEMU backend boots the matching Espressif
# QEMU machine (esp32) from the merged flash image and bridges GPIO (via the RAM
# mailbox) / UART through QMP + gdbstub + the serial socket. The ESP32 is a 3.3 V
# part; the scheduler drives its GPIO outputs at 3.3 V (the qemu: prefix selects
# the rail, same as renode:).
backend = "qemu:esp32"

[models.pins]
# ESP32-WROOM-32 module header (38-pin). Only the pads the galvani demo board
# wires carry GPIO roles; the rest carry power/role so the binder can stamp
# drivers when wired. ESP32 GPIO is a flat 0..39 space mapped to port '0'
# (bits 0..31); roles use the "p0<bit>" convention the binder's gpio_of_role
# parses (e.g. "p02" = GPIO2, "p04" = GPIO4).
"1"  = "vss"        # GND
"2"  = "vdd"        # 3V3
"24" = "p02"        # GPIO2: alive indicator into the analog circuit (LED path)
"26" = "p04"        # GPIO4: ~5 Hz blink, observable through the solved circuit
"34" = "p01_txd"    # U0TXD (UART0 TX)
"33" = "p03_rxd"    # U0RXD (UART0 RX)

[models.ratings]
max_pin_current_a = 0.04   # ~40 mA abs max source/sink per pad (datasheet)
max_current_a = 0.5
max_voltage_v = 3.6

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "esp32c3"
kind = "mcu"
description = "Espressif ESP32-C3 (RISC-V RV32IMC) module"

[models.match]
value_re = "(?i)^(ESP32-?C3|ESP32-?C3-?(MINI|WROOM).*)$"
mpn_re   = "(?i)^ESP32-?C3"

[models.params]
backend = "qemu:esp32c3"

[models.pins]
"1"  = "vss"
"2"  = "vdd"
"12" = "p02"        # GPIO2
"13" = "p04"        # GPIO4
"30" = "p021_txd"   # U0TXD on GPIO21
"31" = "p020_rxd"   # U0RXD on GPIO20

[models.ratings]
max_pin_current_a = 0.04
max_current_a = 0.4
max_voltage_v = 3.6

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "nrf52840"
kind = "mcu"
description = "Nordic nRF52840 (Cortex-M4F) SoC"

[models.match]
value_re = "(?i)^nRF52840"
mpn_re   = "(?i)^nRF52840"

[models.params]
# Renode backend: brings up nrf52840.repl. nRF GPIO is two 32-bit ports
# (gpio0/gpio1); roles "p0<bit>" map port '0', "p1<bit>" map port '1'.
backend = "renode:nrf52840"

[models.pins]
# Minimal demo map; only the wired pads carry roles. P0.13 is the nRF52840-DK
# LED1; UART on P0.06 (TXD) / P0.08 (RXD).
"1"  = "vss"
"2"  = "vdd"
"3"  = "p013"       # LED / alive indicator into the analog circuit
"4"  = "p014"       # blink
"5"  = "p006_txd"   # UART TXD
"6"  = "p008_rxd"   # UART RXD

[models.ratings]
max_pin_current_a = 0.015
max_current_a = 0.1
max_voltage_v = 3.6

# ─────────────────────────────────────────────────────────────────────────────

[[models]]
id = "fe310"
kind = "mcu"
description = "SiFive FE310-G002 (RISC-V RV32IMAC, HiFive1)"

[models.match]
value_re = "(?i)^(FE310|FE310-G00[0-9]|HiFive1)"
mpn_re   = "(?i)^FE310"

[models.params]
# Renode backend: brings up sifive-fe310.repl. One 32-bit gpio0 port; roles
# "p0<bit>".
backend = "renode:sifive_fe310"

[models.pins]
"1"  = "vss"
"2"  = "vdd"
"3"  = "p019"       # HiFive1 LED is on GPIO 19
"4"  = "p021"       # second GPIO for blink
"5"  = "p017_txd"   # uart0 TX
"6"  = "p016_rxd"   # uart0 RX

[models.ratings]
max_pin_current_a = 0.02
max_current_a = 0.1
max_voltage_v = 3.6
