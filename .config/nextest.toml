# Each Renode test boots its own emulator process. Several starting at once on a
# loaded machine can miss the 60 s monitor prompt, which fails the test for a
# reason that has nothing to do with the code under test. One at a time.
[test-groups.renode]
max-threads = 1

[[profile.default.overrides]]
filter = "test(renode)"
test-group = "renode"

# speed_gate times the solver against ngspice; sharing the CPU with the rest of
# the suite measures the machine, not the solver. It takes every thread.
[[profile.default.overrides]]
filter = "binary(speed_gate)"
threads-required = "num-test-threads"

# qemu_clock_truth measures how faithfully the wall-paced QEMU backend credits
# guest time. Virtual time there is wall-paced (no icount), so the ratio it
# asserts on is a property of host pacing: when other tests share the CPUs the
# vCPU is starved inside the cont->stop span, the host span over-credits, and
# the ratio drifts (0.47 and 0.56 measured in full parallel runs, against the
# 0.75..1.25 band it holds when it has the machine). That is the machine, not
# the credit logic, so the test takes every thread, as speed_gate does.
[[profile.default.overrides]]
filter = "binary(it) & test(qemu_clock_truth)"
threads-required = "num-test-threads"
