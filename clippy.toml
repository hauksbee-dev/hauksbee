# Circuit and geometry code carries genuinely long argument lists (a stamp
# needs its nodes, its model parameters, and its solver context), so the
# default arity threshold fires constantly on correct code. Everything else
# stays at clippy's defaults.
too-many-arguments-threshold = 12
# Board, vendor and tool names the docs cite as prose, not code ("..": keep
# clippy's default list too).
doc-valid-idents = [
  "KiCad", "SparkFun", "ZSWatch", "PicoDVI", "LumenPnP", "EasyEDA", "PCBWay", "ClockworkPi",
  "PolyKybd", "ODrive", "PowerPCB", "DevKit", "LibreSolar", "CubeSat", "BeagleBone", "..",
]
