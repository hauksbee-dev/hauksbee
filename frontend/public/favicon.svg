<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#020617"/>
  <!-- PCB board edge -->
  <rect x="4" y="6" width="24" height="20" rx="2" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- Copper traces -->
  <line x1="4" y1="14" x2="28" y2="14" stroke="#3b82f6" stroke-width="1.2" opacity="0.8"/>
  <line x1="4" y1="18" x2="28" y2="18" stroke="#3b82f6" stroke-width="1.2" opacity="0.5"/>
  <!-- Via dots -->
  <circle cx="10" cy="14" r="2" fill="#3b82f6"/>
  <circle cx="22" cy="18" r="2" fill="#3b82f6"/>
  <!-- IC chip -->
  <rect x="13" y="11" width="6" height="10" rx="1" fill="#1e40af"/>
  <!-- Glow -->
  <circle cx="10" cy="14" r="3" fill="#3b82f6" opacity="0.2"/>
  <circle cx="22" cy="18" r="3" fill="#3b82f6" opacity="0.2"/>
</svg>
