# The one board in the corpus that ships its own FABRICATION OUTPUT beside the
# design file, which is why it is here. `subdir` keeps only V3.4.5, whose
# `GERBERS .../CAMOutputs/GerberFiles/` directory holds the copper Eagle
# actually computed from the pours the `.brd` only describes. That turned an
# Eagle pour question into a measurement rather than an argument: see the
# emonTx row in `docs/evidence/KNOWN_FAULTS_VALIDATION.md`, and the two-sided
# test it drives in `crates/hauksbee-extract/tests/known_faults.rs`.
[[board]]
id = "emontx3"
name = "OpenEnergyMonitor emonTx V3.4.5 energy monitor"
url = "https://github.com/openenergymonitor/EmonTx3"
rev = "411de96187900f694f9e8fefd7ba9a6e30ad99aa"
license = "GPL-3.0"
license_note = "LICENSE at this revision is the GPL-3.0 text"
axes = ["eagle", "power-electronics", "rf", "avr", "small"]
subdir = "hardware/V3.4.5"
known_good = false
known_good_note = """
Adjudicated, not pending: one real copper join, GND <-> AGND on B.Cu. The two \
nets are separate in the schematic, with no discrete part bridging them (the \
only element with pads on both is U1 itself, the ATmega328P, whose GND and AGND \
pins are internally common), and their pours are same-rank with outlines that \
overlap in the same 0.349 mm band on both layers. The shipped fabrication data \
splits the layers regardless: in copper_top.gbr the two fills are separate \
bodies 8.236 mm apart at their closest, and in copper_bottom.gbr they are one \
6378-vertex region with no channel along the seam, so on the back layer the \
copper is joined. The file proves the join is deliberate: the AGND pour that \
abuts carries `isolate="0.00030625"`, a hand-set \
override on one of nine ground pours, where six ask for 0.3048 mm and two set \
nothing. WHY it is there is inference (an analogue return has to reach digital \
ground somewhere, and this is where the layout does it), and the finding does \
not rest on it: two named nets are in contact, which is what the check reports. \
Hence known_good = false, which says the gate cannot grade its silence on this \
directory, not that the board is defective.
"""
expect = [
  "hardware/V3.4.5/emonTx V3.4.5.brd",
  "hardware/V3.4.5/emonTx V3.4.5.sch",
  "hardware/V3.4.5/GERBERS emonTx V3.4.5_2021-04-07/CAMOutputs/GerberFiles/copper_top.gbr",
  "hardware/V3.4.5/GERBERS emonTx V3.4.5_2021-04-07/CAMOutputs/GerberFiles/copper_bottom.gbr",
]

