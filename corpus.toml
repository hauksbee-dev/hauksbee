# Nine revisions of one industrial board, B1 through G1, spanning KiCad's legacy
# `.sch` and its current `.kicad_sch`. The revision spread is what earns its
# place: the same design read through two schematic formats has to produce the
# same circuit.
[[board]]
id = "olimex_esp32_poe"
name = "Olimex ESP32-PoE (revisions B1 through G1)"
url = "https://github.com/OLIMEX/ESP32-POE"
rev = "a9ccb127e4eff6bf58b2e366adc8dca24b42d9e7"
license = "Apache-2.0"
axes = ["kicad5", "kicad6", "dev-board", "industrial-sensor", "esp32", "medium"]
known_good = false
known_good_note = """
Shipped and sold for years, and the shorts check fires on two of its revisions. \
Rev L1: three `+3V3` <-> `+3.3V` contacts on B.Cu clustered at x=95.7-96.3, \
y=123.4-123.9, tightest -0.011 mm, where a 1.016 mm `+3.3V` track crosses the \
filled `+3V3` pour. No part joins the two nets anywhere on the board, and the \
board carries three distinct 3.3 V nets (`+3V3`, `+3.3V`, `+3.3VLAN`). Rev M2: \
one `/+5V_USB` <-> `Net-(D7-A)` contact on B.Cu at -0.508 mm, half of a 1.016 mm \
track width. Both readings are of KiCad's own stored fill polygons rather than of \
zone outlines, so the geometry in the file is real; whether the FABRICATED board \
has it depends on whether that stored fill is current with the tracks, which the \
repository's own gerbers for these revisions would settle. Until somebody settles \
it, this board is not evidence that the check stays quiet on good hardware, and \
saying otherwise either way would be a guess.
"""
expect = [
  "HARDWARE/ESP32-PoE-hardware-revision-G1/ESP32-PoE_Rev_G1.kicad_pcb",
  "HARDWARE/ESP32-PoE-hardware-revision-B1/ESP32-PoE_Rev_B1.kicad_pcb",
]

[[board]]
id = "olimex_rp2040_pico_pc"
name = "Olimex RP2040-PICO-PC (revisions B, C, D)"
url = "https://github.com/OLIMEX/RP2040-PICO-PC"
rev = "ed0402adcdf9395f33c8d50def897c33ce96b5c3"
license = "GPL-3.0"
axes = ["kicad6", "dev-board", "rp2040", "small"]
expect = [
  "HARDWARE/RP2040-PICO-PC hardware revision D/RP2040-PICO-PC_rev_D.kicad_pcb",
  "HARDWARE/RP2040-PICO-PC hardware revision D/RP2040-PICO-PC_rev_D.net",
  "HARDWARE/RP2040-PICO-PC hardware revision C/RP2040-PICO-PC_rev_C.kicad_pcb",
]

