# A pair is two public releases of one design with a documented electrical fault
# fixed between them. The revision history is ground truth for whether hauksbee
# flags the right thing, so both halves are needed.
#
# These carry `dest`, which most boards do not need. A pair is two checkouts of
# ONE upstream, so it cannot land at `<id>/` without the two halves reading as
# two unrelated boards, and the tests were written against a corpus that groups
# them: `zswatch_devkit/v1.2.0/`, not `zswatch_devkit_1_2_0/`. `dest` is what the
# fetch writes; `id` stays the handle for `--only`.
# ---------------------------------------------------------------------------

