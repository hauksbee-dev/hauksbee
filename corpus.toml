# The board corpus: real hardware hauksbee's checks are measured against.
#
# hauksbee claims its checks stay quiet on boards that are fine. That claim is
# only worth something if you can check it, so every board here is public open
# hardware, pinned to the exact revision the gate was measured against.
#
# The boards are NOT vendored into this repository. They carry CC BY-SA,
# GPL-3.0, CERN-OHL-S, CERN-OHL-W, CERN-OHL-P, TAPR-OHL and MIT terms, and
# bundling share-alike hardware into an MIT project would drag those obligations
# along with it. Fetching means you obtain each board directly from its author,
# under that author's licence. `scripts/fetch-corpus.sh` reads this file and does
# that; `scripts/check-corpus.py` checks that this file still describes what
# lands.
#
# The pin is the point. An upstream board that changes must not silently change
# our results, so `rev` is a full 40-character commit sha, never a branch and
# never a tag: a branch moves, a tag can be moved, and an abbreviated sha that
# happens to be the current branch head is indistinguishable from a pin that has
# drifted. A zip-hosted board has no revision to pin, so `sha256` is its pin and
# the fetch refuses to download one without it.
#
# Adding a board: record the upstream, the exact revision, the licence as you
# read it in the upstream's own bytes at that revision, the axes it covers, and
# at least one `expect` path. If you cannot establish the licence, mark it
# `license_confirmed = false` and it stays out of the default fetch.
#
# Fields, all required except where noted:
#
#   id                 the handle `--only` takes.
#   url                the upstream.
#   rev                a full 40-character commit sha. Required for `kind = "git"`
#                      (the default).
#   license            the licence, as the upstream states it AT `rev`.
#   axes               what this board is here to stress: EDA format and version,
#                      board class, MCU family, scale. The vocabulary is fixed in
#                      scripts/check-corpus.py; a typo is an error rather than a
#                      new axis.
#   expect             paths, relative to the board's directory, that MUST exist
#                      after the fetch. These are the paths the gates resolve, so
#                      a fetch that lands a different tree fails here instead of
#                      turning into a gate that matches nothing.
#   kind               optional: "git" (default) or "zip".
#   sha256             the archive's hash. Required for `kind = "zip"`.
#   dest               optional: where the board lands under the corpus root, if
#                      not `id`. Used to group revision pairs and one upstream's
#                      several boards.
#   subdir             optional: the only part of a large upstream the corpus
#                      wants; everything else is dropped, and this path is kept.
#   drop               optional: paths inside the fetched tree to delete. For an
#                      upstream that ships production panels or stale revisions
#                      beside the design, which a corpus sweep would otherwise
#                      count as boards.
#   hoist              optional: a directory inside the fetched tree whose
#                      CONTENTS are lifted into the board directory, for an
#                      upstream that keeps its design one level down.
#   unpack             optional: an archive inside the fetched tree that IS the
#                      board. Its contents replace everything else.
#   license_confirmed  optional: false keeps the board out of the default fetch.
#   license_note       optional: how the licence was established, when the SPDX
#                      id alone does not say.
#   known_good         optional: false excludes the board from the silence gates,
#                      which grade themselves on hardware known to be fine. It is
#                      still fetched, still parsed, still counted for format
#                      coverage. Requires `known_good_note`.
#   known_good_note    optional: why. Required when `known_good = false`.
#   name               optional: the human name for logs and --list.
#
# `dest`, `subdir`, `drop`, `hoist` and `unpack` exist for one reason: the paths
# the corpus tests ask for. A fetched corpus that puts a board somewhere no test
# looks is worse than no corpus, because the tests skip and the skip reads as a
# pass. Every one of these fields was added to close such a gap.
#
# Every field in this file is read by something. `subdir` was declared on the
# KiCad entry and honoured by nothing for as long as the entry existed, so the
# fetch pulled KiCad's `qa/` tree and the zero-shorts gate graded itself on
# boards whose whole purpose is to reproduce KiCad bugs.
# `scripts/check-corpus.py` now fails on a field nothing honours, which is why
# there is no longer anywhere for that failure to hide.

[meta]
# Where fetch-corpus.sh puts things when HAUKSBEE_CORPUS_DIR is unset.
default_dir = "board-corpus"

