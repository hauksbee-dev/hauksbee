# ---------------------------------------------------------------------------
# Gerber-only, for the reverse-extraction tier
#
# These ship no native CAD, only manufacturing files, which is the point: they
# exercise reconstructing a circuit from copper geometry alone.
#
# ClockworkPi publishes these without a clear licence statement, so they are
# marked unconfirmed and skipped unless you pass --include-unconfirmed. Nothing
# in the default test suite depends on them.
#
# ClockworkPi also publishes only archives, one of them a `.7z` the fetch cannot
# open, so `expect` names the archive rather than the films inside it. Extracting
# them is a manual step, which is a second reason nothing in the default suite
# depends on these two.
# ---------------------------------------------------------------------------

[[board]]
id = "inkplate6_gerber"
name = "Soldered Inkplate 6 main board (gerbers only)"
url = "https://github.com/SolderedElectronics/Inkplate-6-hardware"
rev = "e14476d3bbddfb0e76815f4b1ffa6f7e26e54bad"
# The films exist upstream only inside this archive. Unpacked flat into the board
# directory, which is where gerber_inkplate.rs reads them from and where the
# hand-built corpus has always had them. Without this the fetch left a zip and
# the reverse-extraction gate had no films to reconstruct from.
unpack = "Schematics, Gerber, BOM/v1.0/Inkplate 6 gerber files v1.0.zip"
license = "TAPR-OHL-1.0"
license_note = "LICENSE.txt at this revision is the TAPR Open Hardware License v1.0"
axes = ["gerber-only", "wearable", "esp32", "small"]
expect = ["EPD_board.GTL", "EPD_board.GBL", "EPD_board-RoundHoles.TXT"]

[[board]]
id = "uconsole_gerber"
name = "ClockworkPi uConsole CPI 3.14 mainboard (gerbers only)"
url = "https://github.com/clockworkpi/uConsole"
rev = "53a05efca806ca024aab4fbfd28a680688c2541c"
license = "unconfirmed"
license_confirmed = false
axes = ["gerber-only", "handheld", "no-mcu", "medium"]
expect = ["PCB/CPI_3.14_Mainboard_V5_Gerber.7z"]

[[board]]
id = "uconsole_cm4_adapter_gerber"
name = "ClockworkPi RPI CM4 to CPI v3.14 adapter (gerbers only)"
url = "https://github.com/clockworkpi/uConsole"
rev = "53a05efca806ca024aab4fbfd28a680688c2541c"
license = "unconfirmed"
license_confirmed = false
axes = ["gerber-only", "handheld", "no-mcu", "small"]
expect = ["PCB/RPI CM4 to CPI v3.14 Adapter.zip"]

# ---------------------------------------------------------------------------
# Local-only boards
#
# Present in the maintainers' corpus and deliberately absent here, because they
# are not ours to redistribute or point at. Listed so the split between "you can
# reproduce this" and "you cannot" is explicit rather than implied. Nothing in
# the public test suite depends on any of them.
#
#   stormduino/                  a private board
#   altium_xval/                 Altium cross-validation set, licence unclear
#   eagle/                       assorted one-off Eagle files
#   arduino_uno_r3_from_scratch/ a hand reconstruction
#   famous/rpi4_usbc_reconstruction/  a reconstruction, not an upstream release
#   famous/hunt/sbc-a13/         a hunt subject, licence unclear
#   odbpp/, ipc2581/             ODB++ and IPC-2581 vendor test cases from the
#                                IPC-2581 Consortium, Valor NPI, Allegro and
#                                Zuken. Their redistribution terms are not stated
#                                in the files and no upstream publishes them at a
#                                fetchable, pinnable URL, so they cannot become
#                                manifest entries. docs/ingest/ records what they
#                                cover.
# ---------------------------------------------------------------------------
