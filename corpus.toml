# The board corpus: real hardware hauksbee's checks are measured against.
#
# hauksbee claims its checks stay quiet on boards that are fine. That claim is
# only worth something if you can check it, so every board here is public open
# hardware, pinned to the exact revision the gate was measured against.
#
# The boards are NOT vendored into this repository. They carry CC BY-SA,
# GPL-3.0, CERN-OHL-S and CERN-OHL-W terms, and bundling share-alike hardware
# into an MIT project would drag those obligations along with it. Fetching means
# you obtain each board directly from its author, under that author's licence.
# `scripts/fetch-corpus.sh` reads this file and does that.
#
# The pin is the point. An upstream board that changes must not silently change
# our results, so `rev` is a commit or tag, never a branch. A zip-hosted board
# has no revision to pin, so `sha256` is its pin and the fetch refuses to
# download one without it.
#
# Adding a board: record the upstream, the exact revision, and the licence. If
# you cannot establish the licence, mark it `license_confirmed = false` and it
# stays out of the default fetch.
#
# Fields, all optional except `id`, `url` and `license`:
#
#   rev                a commit or tag. Required for `kind = "git"` (the default).
#   kind               "git" or "zip".
#   sha256             the archive's hash. Required for `kind = "zip"`.
#   dest               where the board lands under the corpus root, if not `id`.
#                      Used to group the two halves of a revision pair.
#   subdir             the only part of a large upstream the corpus wants;
#                      everything else is dropped, and this level is kept.
#   hoist              a directory inside the fetched tree whose CONTENTS are
#                      lifted into the board directory, for an upstream that
#                      keeps its design one level down.
#   unpack             an archive inside the fetched tree that IS the board. Its
#                      contents replace everything else the upstream shipped.
#   license_confirmed  false keeps the board out of the default fetch.
#   name               the human name for logs and --list.
#
# `dest`, `subdir`, `hoist` and `unpack` exist for one reason: the paths the
# corpus tests ask for. A fetched corpus that puts a board somewhere no test
# looks is worse than no corpus, because the tests skip and the skip reads as a
# pass. Every one of these fields was added to close such a gap, and the note on
# each entry says which.

[meta]
# Where fetch-corpus.sh puts things when HAUKSBEE_CORPUS_DIR is unset.
default_dir = "board-corpus"

