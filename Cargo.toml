[workspace]
resolver = "2"
members = [
    "crates/hauksbee-ir",
    "crates/hauksbee-solve",
    "crates/hauksbee-extract",
    "crates/hauksbee-models",
    "crates/hauksbee-mcu",
    "crates/hauksbee-server",
    "crates/hauksbee-engine",
    "crates/hauksbee-ci",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
forge-sexpr = { path = "../kicad-forge/crates/forge-sexpr" }
forge-model = { path = "../kicad-forge/crates/forge-model" }
forge-codegen = { path = "../kicad-forge/crates/forge-codegen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
num-complex = "0.4"

[profile.release]
lto = "thin"
debug = true

[profile.dev]
opt-level = 1
