[workspace]
resolver = "2"
members = [
    "crates/hauksbee-ir",
    "crates/hauksbee-solve",
    "crates/hauksbee-extract",
    "crates/hauksbee-models",
    "crates/hauksbee-mcu",
    "crates/hauksbee-server",
    "crates/hauksbee-engine",
    "crates/hauksbee-ci",
]
# The vendored forge-* crates (vendor/kicad-forge) form their own workspace and
# must NOT be members here: excluding them keeps `cargo metadata`/build/test from
# pulling them into hauksbee's graph as members while still allowing them as path
# dependencies below. See vendor/kicad-forge/VENDORED.md.
exclude = ["vendor/kicad-forge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# Every crate inherits these, so the shared metadata is stated once and cannot
# drift between the eight published crates. `description` is deliberately NOT
# here: each crate describes what it actually does.
repository = "https://github.com/ETM-Code/hauksbee"
homepage = "https://github.com/ETM-Code/hauksbee"
readme = "README.md"
keywords = ["pcb", "eda", "simulation", "kicad", "hardware"]
categories = ["simulation", "science", "development-tools::testing"]
# Minimum supported Rust version. This is the toolchain the project is actually
# built and tested on, which is the only floor we can honestly claim today. It
# is probably conservative: the code may well build on something older. Lower it
# only once a CI job proves a specific older version green, never by guessing,
# since a wrong MSRV breaks downstream builds for reasons the author cannot see.
rust-version = "1.92"

[workspace.dependencies]
# The forge-* crates are VENDORED into this repo (vendor/kicad-forge/crates/*)
# so a fresh clone builds with no sibling checkout and no network. They come from
# https://github.com/ETM-Code/kicad-forge.git; source commit and update procedure
# are in vendor/kicad-forge/VENDORED.md.
#
# To develop against a live kicad-forge checkout instead, comment out the three
# vendored lines below and uncomment these sibling-path overrides:
# forge-sexpr = { path = "../kicad-forge/crates/forge-sexpr" }
# forge-model = { path = "../kicad-forge/crates/forge-model" }
# forge-codegen = { path = "../kicad-forge/crates/forge-codegen" }
forge-sexpr = { path = "vendor/kicad-forge/crates/forge-sexpr" }
forge-model = { path = "vendor/kicad-forge/crates/forge-model" }
forge-codegen = { path = "vendor/kicad-forge/crates/forge-codegen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
num-complex = "0.4"
# Parallel island execution (dev-plan 03 §3): the standard, battle-tested
# work-stealing pool. Used only by hauksbee-solve's partitioned sweep, behind
# an explicit `ParallelPolicy` option; the reference paths never touch it.
rayon = "1"
# Temp-file handling for the web firmware drop zone: uploaded ELF/HEX bytes are
# written to a NamedTempFile so the path-based MCU loader can read them.
tempfile = "3"
# Interactive terminal UI (the default human-facing surface for `hauksbee run`).
# ratatui + crossterm are the battle-tested standard; we adapt them rather than
# hand-rolling a terminal renderer.
ratatui = "0.29"
crossterm = "0.28"

# Tuned for a small shipped binary (the release tarball is what users download).
# Fat LTO + a single codegen unit + strip takes the two MIT-clean binaries from
# ~19 MB combined down to ~14.8 MB (measured ~-23%), with no runtime cost — we
# keep opt-level 3 because the hot numeric solve path is the product's speed
# story. `strip` keeps the tarball small even if a build bypasses bundle.sh;
# panic location info survives (we do not strip panic messages). `opt-level="s"`
# shrinks a further ~17% but can slow the solver a few percent — adopt it only
# after a release-build timing check on a real spec confirms the hot path holds.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

[profile.dev]
opt-level = 1
