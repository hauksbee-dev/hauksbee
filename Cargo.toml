[workspace]
resolver = "2"
members = [
    "crates/hauksbee-ir",
    "crates/hauksbee-solve",
    "crates/hauksbee-extract",
    "crates/hauksbee-models",
    "crates/hauksbee-mcu",
    "crates/hauksbee-frontdoor-api",
    "crates/hauksbee-server",
    "crates/hauksbee-bind",
    "crates/hauksbee-cosim",
    "crates/hauksbee-checks",
    "crates/hauksbee-engine",
    "crates/hauksbee-ci",
    "crates/hauksbee-testkit",
    "crates/hauksbee-mcp",
]
# The vendored forge-* crates (vendor/kicad-forge) form their own workspace and
# must NOT be members here: excluding them keeps `cargo metadata`/build/test from
# pulling them into hauksbee's graph as members while still allowing them as path
# dependencies below. See vendor/kicad-forge/VENDORED.md.
exclude = ["vendor/kicad-forge"]

[workspace.metadata.ci]
# Increment only when the retained target-cache shape changes. This value is
# part of rust-cache's manifest hash but not its restore prefix, so a new cache
# generation can reuse the previous dependency build before saving the richer
# workspace-crate cache.
workspace-cache-epoch = 1

[workspace.package]
version = "0.1.0-beta.6"
edition = "2021"
license = "Apache-2.0"
# Every crate inherits these, so the shared metadata is stated once and cannot
# drift between the published crates. `description` is deliberately NOT
# here: each crate describes what it actually does.
repository = "https://github.com/hauksbee-dev/hauksbee"
homepage = "https://github.com/hauksbee-dev/hauksbee"
readme = "README.md"
keywords = ["pcb", "eda", "simulation", "kicad", "hardware"]
categories = ["simulation", "science", "development-tools::testing"]
# Minimum supported Rust version. This is the toolchain the project is actually
# built and tested on, which is the only floor we can honestly claim today. It
# is probably conservative: the code may well build on something older. Lower it
# only once a CI job proves a specific older version green, never by guessing,
# since a wrong MSRV breaks downstream builds for reasons the author cannot see.
rust-version = "1.92"

# Every clippy::all finding is an error, locally as in CI; no lint is allowed workspace-wide.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Duplicate versions come from transitive dependencies and need upstream bumps.
multiple_crate_versions = "allow"

[workspace.dependencies]
# The forge-* crates are VENDORED into this repo (vendor/kicad-forge/crates/*)
# so a fresh clone builds with no sibling checkout and no network. kicad-forge
# has no public repository of its own, so the vendored copy is the source of
# record. Provenance and update procedure: vendor/kicad-forge/VENDORED.md.
#
# To develop against a live kicad-forge checkout instead, comment out the
# vendored line below and uncomment this sibling-path override:
# forge-sexpr = { path = "../kicad-forge/crates/forge-sexpr" }
forge-sexpr = { version = "0.1.0", path = "vendor/kicad-forge/crates/forge-sexpr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
num-complex = "0.4"
# Parallel island execution (dev-plan 03 §3): the standard, battle-tested
# work-stealing pool. Used only by hauksbee-solve's partitioned sweep, behind
# an explicit `ParallelPolicy` option; the reference paths never touch it.
rayon = "1"
# Temp-file handling for the web firmware drop zone: uploaded ELF/HEX bytes are
# written to a NamedTempFile so the path-based MCU loader can read them.
tempfile = "3"

# Thin LTO with parallel codegen: a release build finishes in a fraction of the
# time fat LTO + one codegen unit took, for a few percent of binary size.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
debug = false

[profile.dev]
# Unoptimised crates build in half the time of opt-level 1. Solve and IR (8x slower
# at 0; `speed_gate` enforces it) and extract (R-tree DRC, 10x slower per upload)
# keep opt-level 1 below. Dependencies stay at 2.
opt-level = 0
debug = "line-tables-only"

[profile.dev.package.hauksbee-solve]
opt-level = 1

[profile.dev.package.hauksbee-ir]
opt-level = 1

[profile.dev.package.hauksbee-extract]
opt-level = 1

# The co-simulation hot path (scheduler and responders, the AVR port hook, the
# bound-device stress monitor) runs inside every firmware port write and
# solver step. At opt-level 0 an AVR host-serial session spent 1.6x the wall
# time per simulated second, enough to miss the host program's wall-clock
# serial timeouts on a loaded or efficiency-core machine. Costs ~7 s on a
# clean rebuild of these three crates.
[profile.dev.package.hauksbee-cosim]
opt-level = 1

[profile.dev.package.hauksbee-mcu]
opt-level = 1

[profile.dev.package.hauksbee-bind]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = false
