[workspace]
resolver = "2"
members = [
    "crates/hauksbee-ir",
    "crates/hauksbee-solve",
    "crates/hauksbee-extract",
    "crates/hauksbee-models",
    "crates/hauksbee-mcu",
    "crates/hauksbee-server",
    "crates/hauksbee-engine",
    "crates/hauksbee-ci",
]
# The vendored forge-* crates (vendor/kicad-forge) form their own workspace and
# must NOT be members here: excluding them keeps `cargo metadata`/build/test from
# pulling them into hauksbee's graph as members while still allowing them as path
# dependencies below. See vendor/kicad-forge/VENDORED.md.
exclude = ["vendor/kicad-forge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# The forge-* crates are VENDORED into this repo (vendor/kicad-forge/crates/*)
# so a fresh clone builds with no sibling checkout and no network. They come from
# https://github.com/ETM-Code/kicad-forge.git; source commit and update procedure
# are in vendor/kicad-forge/VENDORED.md.
#
# To develop against a live kicad-forge checkout instead, comment out the three
# vendored lines below and uncomment these sibling-path overrides:
# forge-sexpr = { path = "../kicad-forge/crates/forge-sexpr" }
# forge-model = { path = "../kicad-forge/crates/forge-model" }
# forge-codegen = { path = "../kicad-forge/crates/forge-codegen" }
forge-sexpr = { path = "vendor/kicad-forge/crates/forge-sexpr" }
forge-model = { path = "vendor/kicad-forge/crates/forge-model" }
forge-codegen = { path = "vendor/kicad-forge/crates/forge-codegen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
num-complex = "0.4"
# Parallel island execution (dev-plan 03 §3): the standard, battle-tested
# work-stealing pool. Used only by hauksbee-solve's partitioned sweep, behind
# an explicit `ParallelPolicy` option; the reference paths never touch it.
rayon = "1"
# Temp-file handling for the web firmware drop zone: uploaded ELF/HEX bytes are
# written to a NamedTempFile so the path-based MCU loader can read them.
tempfile = "3"
# Interactive terminal UI (the default human-facing surface for `hauksbee run`).
# ratatui + crossterm are the battle-tested standard; we adapt them rather than
# hand-rolling a terminal renderer.
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
lto = "thin"
debug = true

[profile.dev]
opt-level = 1
