vih = 2.0
vil = 0.8
tpd_s = 1.5e-8
supply_pin = "5"
gnd_pin = "3"
supply_static_ua = 1.0

[models.pins]
"1" = "a"
"2" = "b"
"3" = "gnd"
"4" = "y1"
