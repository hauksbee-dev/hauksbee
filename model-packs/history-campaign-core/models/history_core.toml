[[models]]
id = "tlp2761_history_identity"
kind = "digital"
description = "Toshiba TLP2761 inverting photo-IC coupler, SO6L (executable DC transfer)"

[models.source]
tier = "curated-pack"
validation = "datasheet-curves"
[[models.source.uncertainty]]
status = "interval"
parameter = "input_forward_voltage_at_2ma"
low = 1.35
high = 1.65
unit = "V"
kind = "specification-limits"
basis = "Toshiba TLP2761 Rev.10 electrical characteristics, IF=2mA at 25C"
[[models.source.uncertainty]]
status = "interval"
parameter = "threshold_input_current"
low = 0.0
high = 0.0016
unit = "A"
kind = "specification-limits"
basis = "IFHL maximum over -40C to 125C; the model uses the conservative upper endpoint"

[models.match]
value_re = "(?i)^TLP2761$"

[models.params]
led_knee_v = 1.35
led_r_ohms = 75.0
if_threshold_a = 0.0016
supply_current_a = 0.00065
warning = "source-bound DC approximation: the input LED is fit to the 1.35-1.65V at 2mA limits and the output switches at the conservative 1.6mA IFHL maximum; sub-100ns propagation, temperature curve, CMTI pulse behavior and isolation capacitance are not modeled"

[models.pins]
"1" = "anode"
"2" = "nc"
"3" = "cathode"
"4" = "gnd"
"5" = "y1"
"6" = "vcc"

[models.ratings]
max_voltage_v = 7.0
max_pin_current_a = 0.02

[models.behavioral.fsm]
states = ["input_off", "input_on"]
initial = "input_off"

[[models.behavioral.fsm.transitions]]
from = "input_off"
to = "input_on"
guard = "max(0.0, (v_anode - v_cathode - led_knee_v) / led_r_ohms) >= if_threshold_a"

[[models.behavioral.fsm.transitions]]
from = "input_on"
to = "input_off"
guard = "max(0.0, (v_anode - v_cathode - led_knee_v) / led_r_ohms) < if_threshold_a"

[[models.behavioral.laws]]
name = "input_led"
kind = "current"
a = "anode"
b = "cathode"
expr = "max(0.0, (v_anode - v_cathode - led_knee_v) / led_r_ohms)"

[[models.behavioral.laws]]
name = "supply_draw"
kind = "current"
a = "vcc"
b = "gnd"
expr = "supply_current_a"

[[models.behavioral.laws]]
name = "output_high"
kind = "voltage"
a = "y1"
b = "gnd"
expr = "v_vcc"
r_ohms = 312.5
only_in_state = "input_off"

[[models.behavioral.laws]]
name = "output_low"
kind = "voltage"
a = "y1"
b = "gnd"
expr = "0.0"
r_ohms = 125.0
only_in_state = "input_on"

[models.coverage]
implements = ["input_led_dc", "threshold_transfer", "inverting_output", "totem_pole_output", "supply_current"]
missing = ["propagation_timing", "temperature_curve", "cmti_waveform", "isolation_capacitance", "led_reverse_breakdown"]
