# Source-bound first pack for the frozen history campaign. Every card is
# intentionally narrow: exact value matching, datasheet pin map, and an
# explicit limitation. No MCU, charger, hub, memory, or RF behavior is invented.

[[models]]
id = "ncp1117_3v3_history"
kind = "vreg"
description = "NCP1117-3.3 fixed LDO, SOT-223 (pin map and nominal DC rail only)"

[models.source]
tier = "curated-pack"
validation = "datasheet-curves"
[[models.source.uncertainty]]
status = "interval"
parameter = "vout"
low = 3.267
high = 3.333
unit = "V"
kind = "specification-limits"
basis = "onsemi NCP1117/D Rev.31 fixed-output accuracy +/-1.0%"

[models.match]
value_re = "(?i)^NCP1117-3[._]?3[_-]?SOT223$"

[models.params]
vout = 3.3
dropout_v = 1.2
iq_a = 0.006

[models.pins]
"1" = "gnd"
"2" = "out"
"3" = "in"

[models.ratings]
max_current_a = 1.0
max_voltage_v = 20.0
max_junction_temp_c = 150.0

[models.coverage]
implements = ["nominal_dc_regulation"]
missing = ["startup_transient", "dropout_curve", "current_limit", "thermal_shutdown"]

[[models]]
id = "ap64501_history_identity"
kind = "vreg"
description = "Diodes AP64501SP-13 synchronous buck, SO-8EP (board-divider-derived averaged DC regulation)"

[models.source]
tier = "curated-pack"
validation = "datasheet-curves"
[[models.source.uncertainty]]
status = "interval"
parameter = "feedback_reference"
low = 0.792
high = 0.808
unit = "V"
kind = "specification-limits"
basis = "Diodes AP64501 DS41980 Rev.4 electrical characteristics, CCM over the recommended range"

[models.match]
value_re = "(?i)^AP64501SP-13$"

[models.params]
warning = "source-bound averaged DC model: it regulates the board's real external feedback divider through the SW node and honors EN, but does not claim 570kHz ripple, COMP-loop stability, 4ms/CSS soft-start, PFM/LDO transitions, OVP, thermal shutdown, or cycle-by-cycle peak behavior"

[models.pins]
"1" = "bst"
"2" = "in"
"3" = "en"
"4" = "ss"
"5" = "fb"
"6" = "comp"
"7" = "gnd"
"8" = "sw"
"9" = "gnd_ep"

[models.ratings]
max_current_a = 5.0
max_voltage_v = 40.0

[models.behavioral.converter]
topology = "buck"
out_pin = "sw"
in_pin = "in"
# A safety ceiling only.  In feedback mode the command is derived from the
# board's FB divider and, for buck topology, is also clamped to the solved VIN.
vout_setpoint = 40.0
iout_limit_a = 5.0
efficiency = 0.90
out_r_ohms = 0.02

[models.behavioral.converter.feedback]
pin = "fb"
vref_v = 0.800
relaxation_gain = 4.0

[models.behavioral.converter.enable]
pin = "en"
# Conservative guaranteed-high endpoint (VEN_H max); voltages in the
# datasheet's 1.03..1.25 V uncertainty band are intentionally treated as off.
high_threshold_v = 1.25

[models.coverage]
implements = ["averaged_buck_dc", "board_feedback_divider", "enable_gating", "output_current_ceiling", "reflected_input_power"]
missing = ["switching_ripple", "compensation_stability", "soft_start", "pfm_ldo_modes", "cycle_by_cycle_peak_limit", "ovp", "uvlo_hysteresis", "thermal_shutdown", "temperature_curves"]

[[models]]
