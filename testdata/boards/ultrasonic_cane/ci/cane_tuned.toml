# Tuned from the `hauksbee-ci init` scaffold: USB powered, firmware attached, boot gate watched.
name = "cane power-up (tuned)"
board = "../ultrasonic_cane.kicad_pcb"
mcu = "atmega328p"
firmware = "../../../firmware/boot_gate_a/boot_gate.hex"
duration_ms = 200

[[supply]]
net = "+5V_USB"
kind = "usb"
usb = "5v1.5a"

# No supply on VBAT: with no cell declared, the TP4056 charger (U3) holds it at
# its 4.2 V float from +5V_USB. A cell could be declared there (kind = "battery"):
# U3 is a current-limited source, so the cell is its load, charged at the
# current its PROG resistor sets, and not a rival source.

[[assert]]
kind = "no_faults"

[[assert]]
kind = "boot_coverage"
net = "MOTOR_GATE"
min = 3.5
deadline_ms = 100.0

[[assert]]
kind = "voltage"
net = "+3V3"
min = 3.13
max = 3.46
after_ms = 50
