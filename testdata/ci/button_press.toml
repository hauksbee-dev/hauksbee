name = "pushbutton pulls a pulled-up net low"
board = "../boards/button_pullup.kicad_pcb"
duration_ms = 200
frame_ms = 1

# +5V pulls BTN high through R1 (10k). A momentary button to ground pulls it
# low while pressed.
[[supply]]
net = "+5V"
kind = "ideal"
volts = 5.0

[[peripheral]]
id = "BTN1"
type = "pushbutton"
net = "BTN"
to = "GND"
# Press at t=100ms, release at t=150ms.
[[peripheral.event]]
t_ms = 100
value = 1
[[peripheral.event]]
t_ms = 150
value = 0

# Released, BTN settles back at the pulled-up rail: the last-sampled value
# (end of run, after the 150ms release) must be near 5 V.
[[assert]]
kind = "voltage"
net = "BTN"
min = 4.9
after_ms = 160
name = "BTN released back to 5V"

# The timed press + release is a real edge pair on BTN: exactly two toggles.
# (A toggle can only happen if the press pulled BTN through the logic midpoint,
# so this proves the press shorted the net low and the release let it recover.)
[[assert]]
kind = "toggle"
net = "BTN"
min_toggles = 2
