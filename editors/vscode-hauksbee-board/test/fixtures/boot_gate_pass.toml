# hauksbee-ci boot-coverage demo, PASS variant.
#
#   hauksbee-ci run crates/hauksbee-ci/examples/boot_gate_pass.toml
#
# A bare ATmega328P drives a 2N7002 N-MOSFET gate on PB0 (pad 14). The board has
# NO pull resistor on the gate net (GATE_CTRL), so at reset the GPIO is Hi-Z and
# the gate floats: its power-up default is genuinely undefined - the exact "Hi-Z
# control input" class the netlist cannot adjudicate (see
# docs/evidence/CORPUS.md). The boot-coverage assertion makes it
# decidable by running the firmware: variant A configures PB0 as an output and
# drives it HIGH promptly, so the gate is actively driven to a defined level well
# within the deadline. This spec PASSES.

name = "boot-coverage: MOSFET gate driven promptly (PASS)"
board = "boards/boot_gate.kicad_pcb"
firmware = "../../../testdata/firmware/boot_gate_a/boot_gate.hex"
mcu = "atmega328p"
duration_ms = 50

[[supply]]
net = "+5V"
kind = "ideal"
volts = 5.0

# The gate control net must be actively driven to a logic high (>= 3.0 V) within
# 20 ms of reset, and no stress fault may fire during the boot window before it.
[[assert]]
kind = "boot-coverage"
net = "GATE_CTRL"
min = 3.0
deadline_ms = 20.0

# Sanity: no part is over-stressed at any point.
[[assert]]
kind = "no_faults"
