[package]
name = "forge-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Typed model of KiCad schematic and board files over the forge-sexpr CST"

[dependencies]
forge-sexpr = { version = "0.1.0", path = "../forge-sexpr" }
thiserror = "1"

# The upstream crate declares integration tests under tests/. Only the library
# sources are vendored here (hauksbee links the libs, not the test targets), so
# the [[test]] targets are intentionally omitted. Run the forge test suite from
# the upstream kicad-forge repo. See ../../VENDORED.md.
